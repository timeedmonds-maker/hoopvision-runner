# Targeted late-game source recovery; no source records or signed tokens in public artifacts.
name: Freeview Amen 732 missing Game Pulse final seconds recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen-732-final-seconds-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freeview-gamepulse-amen-732-last7
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard public runner and private destination
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"tools")
          from public_content_guard import scan
          bad=scan([".github/workflows/freeview-amen-732-final-seconds-recovery.yml"])
          if bad:
              print("PRIVACY_CONTENT_GUARD_FAILED")
              raise SystemExit(3)
          print("PRIVATE_CAPTURE_CONTENT_GUARD_PASSED")
          PY
          test -n "$GH_TOKEN" || { echo PRIVATE_RELEASE_TOKEN_MISSING; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Recover only final NBA SDK source windows
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          mkdir -p "$ROOT/sdk"
          for file in collector.mjs browser.js index.html package.json; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/sdk-season/$file?ref=main" \
              --jq .content | base64 -d > "$ROOT/sdk/$file"
          done
          cd "$ROOT/sdk"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
          test -f "$ROOT/sdk/node_modules/puppeteer-core/package.json"
          OUT="$ROOT/sdk/out/0022600009/1792815240000"
          mkdir -p "$OUT"
          TAG="freeview-gamepulse-0022600009-e732-recovery"
          if gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release download "$TAG" --repo timeedmonds-maker/104 --dir "$OUT" \
              --pattern 'raw-slots.jsonl.gz' --pattern 'frames.jsonl.gz' --pattern 'manifest.json'
            echo EVENT732_REUSE_SHA_VERIFIED_PRIVATE_ORIGINAL_SOURCE
          else
            node collector.mjs --game=0022600009 \
              --tipoff=2026-10-24T01:30:00Z --start=1792815240000 --count=84
          fi
          test -s "$OUT/raw-slots.jsonl.gz"
          test -s "$OUT/frames.jsonl.gz"
          test -s "$OUT/manifest.json"
          python3 - "$OUT" <<'PY'
          import gzip,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);m=json.loads((root/"manifest.json").read_text())
          start=1792815240000; end=start+84*5000-1; event=1792815556484
          assert m["game_id"]=="0022600009" and m["start_ms"]==start
          assert m["end_ms"]==end and m["successful_windows"]==84
          assert m["observed"] is True and m["imputed"] is False
          stamps=[];player=[];ball=[];amen=[];wemby=[]
          outside=[];malformed=0
          with gzip.open(root/"frames.jsonl.gz","rt") as f:
              for line in f:
                  if not line.strip():continue
                  row=json.loads(line);ms=row.get("timestamp")
                  p=row.get("positions") or {}
                  if not isinstance(ms,int) or not isinstance(p,dict):
                      malformed+=1
                      continue
                  if not(start<=ms<=end):
                      # Source slot events can include keyframes outside requested
                      # boundaries; keep original bytes, never count as target data.
                      outside.append(ms)
                      continue
                  stamps.append(ms)
                  if any(k!="ball" for k in p):player.append(ms)
                  if "ball" in p:ball.append(ms)
                  if "1641708" in p:amen.append(ms)
                  if "1641705" in p:wemby.append(ms)
          if malformed:
              raise RuntimeError("INVALID_SOURCE_KEYFRAME_SCHEMA")
          if len(stamps)+len(outside)!=m["unique_keyframes"]:
              raise RuntimeError("NATIVE_KEYFRAME_COUNT_MISMATCH")
          def nearest(xs):
              if not xs:return None
              ts=min(xs,key=lambda t:abs(t-event))
              return abs(ts-event)
          def nearest_signed(xs):
              if not xs:return None
              ts=min(xs,key=lambda t:abs(t-event))
              return ts-event
          series={"any_player":player,"ball":ball,"amen":amen,"wembanyama":wemby}
          gaps={k:nearest(v) for k,v in series.items()}
          signed_gaps={k:nearest_signed(v) for k,v in series.items()}
          event_bounds={k:{"before":sum(t<event for t in v),
                          "after":sum(t>event for t in v),
                          "last_before_utc_ms":max((t for t in v if t<event),default=None),
                          "first_after_utc_ms":min((t for t in v if t>event),default=None)}
                        for k,v in series.items()}
          present=(gaps["ball"] is not None and gaps["ball"]<=3000 and
                   gaps["amen"] is not None and gaps["amen"]<=3000 and
                   gaps["wembanyama"] is not None and gaps["wembanyama"]<=3000)
          qa={"schema":"hoopvision.freeview.gamepulse-event732-late-recovery.v1",
              "game_id":"0022600009","event_num":732,
              "official_nba_pbp_utc_ms":event,
              "source_window_start_utc_ms":start,
              "source_window_end_utc_ms":end,
              "source_windows_requested":84,
              "source_windows_successful":84,
              "source_native_frame_count":len(stamps),
              "out_of_window_source_keyframes":len(outside),
              "out_of_window_first_ms":min(outside) if outside else None,
              "out_of_window_last_ms":max(outside) if outside else None,
              "in_window_first_ms":min(stamps) if stamps else None,
              "in_window_last_ms":max(stamps) if stamps else None,
              "source_player_frame_count":len(player),
              "source_ball_frame_count":len(ball),
              "source_amen_frame_count":len(amen),
              "source_wembanyama_frame_count":len(wemby),
              "nearest_observed_frame_gap_ms":gaps,
              "nearest_signed_frame_delta_ms":signed_gaps,
              "event_before_after_source_observation_counts":event_bounds,
              "raw_source_frames_at_event":"PRESENT_NEAR_NBA_PBP" if present else "NOT_VERIFIED_AT_EVENT",
              "video_pts_aligned":False,
              "hand_ball_first_touch_certified":False,
              "same_physical_frame_certified":False,
              "full_game_certified":False,
              "provenance":"fresh SDK capture; no imputation; official event UTC is approximate action time, not native video PTS"}
          (root/"event732-targeted-qa.json").write_text(json.dumps(qa,indent=2)+"\n")
          print("TARGETED_EVENT732_RECAPTURE",qa["raw_source_frames_at_event"],
                "in_window_frames",len(stamps),"out_of_window_frames",len(outside),
                "nearest_gap_ms",gaps,"signed_nearest_ms",signed_gaps)
          PY
          TAG="freeview-gamepulse-0022600009-e732-recovery"
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title 'Original source Game Pulse targeted final-second recovery' \
              --notes 'Source-only recapture near NBA action 732. No assumption of successful tracking, camera alignment or first hand-ball contact.' \
              --latest=false >/dev/null
          fi
          gh release upload "$TAG" "$OUT/raw-slots.jsonl.gz" \
            "$OUT/frames.jsonl.gz" "$OUT/manifest.json" \
            "$OUT/event732-targeted-qa.json" --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/remote_release.json"
          python3 - "$OUT" "$ROOT/remote_release.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);assets={x["name"]:x for x in json.load(open(sys.argv[2]))["assets"]}
          for name in ["raw-slots.jsonl.gz","frames.jsonl.gz","manifest.json","event732-targeted-qa.json"]:
              digest=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert assets[name]["digest"]=="sha256:"+digest,name
          print("EVENT732_PRIVATE_SOURCE_SHA256_READBACK_PASS")
          PY

          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen_732_raw_rim_state_search.py?ref=f7dc123a403ba0cf742a16794581bdc702ca0a47' \
            --jq .content | base64 -d > "$ROOT/rim_search.py"
          python3 "$ROOT/rim_search.py" --selftest
          python3 "$ROOT/rim_search.py" --input "$OUT/frames.jsonl.gz" --out "$OUT/event732-rim-state.json"
          gh release upload "$TAG" "$OUT/event732-rim-state.json" --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" --jq '.assets[] | select(.name=="event732-rim-state.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$OUT/event732-rim-state.json" | cut -d' ' -f1)"
          echo EVENT732_RIM_STATE_SOURCE_SHA256_VERIFIED

          python3 - "$OUT/event732-rim-state.json" "$ROOT/private_rim_put.json" <<'PY'
          import base64,json,sys
          from pathlib import Path
          payload=Path(sys.argv[1]).read_bytes()
          assert 100<len(payload)<1000000
          Path(sys.argv[2]).write_text(json.dumps({
              "branch":"research/amen-wemby-freeze-spin-20261024",
              "message":"data(freeview): private source-authentic Amen Wemby rim-state candidates",
              "content":base64.b64encode(payload).decode("ascii")}))
          PY
          PRIVATE_RIM_PATH='repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_raw_rim_state_candidates.json'
          if gh api "$PRIVATE_RIM_PATH?ref=research/amen-wemby-freeze-spin-20261024" \
               --jq .content | base64 -d | cmp -s - "$OUT/event732-rim-state.json"; then
            echo EVENT732_PRIVATE_RIM_STATE_ALREADY_SOURCE_IDENTICAL
          else
            python3 - "$ROOT/private_rim_put.json" "$(gh api "$PRIVATE_RIM_PATH?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha)" <<'PY'
          import json,sys
          path=sys.argv[1];payload=json.load(open(path));payload["sha"]=sys.argv[2]
          open(path,"w").write(json.dumps(payload))
          PY
            gh api -X PUT "$PRIVATE_RIM_PATH" --input "$ROOT/private_rim_put.json" --jq '.content.path' >/dev/null
            echo EVENT732_PRIVATE_RIM_STATE_UPDATED_WITH_EXISTING_BLOB_SHA
          fi

          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_spatial_video_event_link.py?ref=b39ee631fe82ea7f5ae6fd731ac72e85338c7c6c' \
            --jq .content | base64 -d > "$ROOT/spatial_video_join.py"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_contact_bracket_qa.json?ref=research/amen-wemby-freeze-spin-20261024' \
            --jq .content | base64 -d > "$ROOT/amen732_video_bracket.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/0022600009.json?ref=main' \
            --jq .content | base64 -d > "$ROOT/official_pbp_0009.json"
          python3 "$ROOT/spatial_video_join.py" \
            --pbp "$ROOT/official_pbp_0009.json" \
            --bracket "$ROOT/amen732_video_bracket.json" \
            --out "$OUT/event732-activity-native-video-join.json"
          gh release upload "$TAG" "$OUT/event732-activity-native-video-join.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" \
              --jq '.assets[] | select(.name=="event732-activity-native-video-join.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$OUT/event732-activity-native-video-join.json" | cut -d' ' -f1)"
          echo EVENT732_ACTIVITY_VIDEO_JOIN_SHA256_PASS
