name: Integrated Pulse PR776 scorer and episode materialization acceptance
# Public CPU only. Source and all game-level data remain inside temporary private runner storage.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-acceptance-20261025.yml'
permissions:
  contents: read
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve pinned private PR source and 28 original games
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          PIN: 4bc33c9e629b13e18dadd200ccf7b92d315af837
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_TOKEN_UNAVAILABLE'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          WORK="$RUNNER_TEMP/gamepulse-pr776"
          mkdir -p "$WORK/gamepulse/fusion/tests"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          fetch_private() {
            local path="$1"
            mkdir -p "$(dirname "$WORK/$path")"
            gh api "repos/timeedmonds-maker/104/contents/$path?ref=$PIN" --jq .content |
              base64 --decode > "$WORK/$path"
            test -s "$WORK/$path" || { echo "SOURCE_FETCH_FAILED path=$path"; exit 5; }
          }
          for py in \
            official_nba_advanced_ratings_2026.py \
            audit_nba_full_p1_advanced_2026.py \
            official_possession_field_onset_2026.py \
            universal_possession_alignment_2026.py \
            nba_source_possession_ledger_2026.py \
            nba_possession_tracking_crosswalk_2026.py \
            estimate_source_offense_handoffs_2026.py \
            nba_provider_onoff_source_2026.py \
            materialize_nba_episode_views_2026.py \
            query_nba_episode_tracking_2026.py; do
            fetch_private "gamepulse/fusion/$py"
          done
          for py in \
            test_official_nba_advanced_rockets_spurs_full_p1_2026.py \
            test_official_nba_ast_full_p1_2026.py \
            test_query_nba_episode_pbp_scoring_2026.py \
            test_query_nba_episode_tracking_2026.py \
            test_query_nba_episode_tracking_index_2026.py \
            test_nba_possession_tracking_crosswalk_2026.py \
            test_nba_provider_onoff_source_2026.py \
            test_materialize_nba_episode_views_2026.py \
            test_nba_source_possession_ledger_2026.py \
            test_universal_possession_alignment_2026.py; do
            fetch_private "gamepulse/fusion/tests/$py"
          done
          for j in \
            gamepulse/fusion/nba_advanced/references/0022600009_hou_full_p1_20261025.json \
            gamepulse/fusion/nba_advanced/references/0022600009_hou_full_p1_all_players_20261025.json \
            gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json \
            gamepulse/fusion/index/interactions/index-2026-27.json \
            gamepulse/fusion/index/unassigned_native_labels/index-2026-27.json \
            gamepulse/fusion/index/index.json; do
            fetch_private "$j"
          done
          python3 - "$WORK" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          paths=set()
          pbp=json.loads((root/'gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json').read_text())
          interactions=json.loads((root/'gamepulse/fusion/index/interactions/index-2026-27.json').read_text())
          unassigned=json.loads((root/'gamepulse/fusion/index/unassigned_native_labels/index-2026-27.json').read_text())
          track=json.loads((root/'gamepulse/fusion/index/index.json').read_text())
          gids=set(pbp['games'])
          assert len(gids)==28 and gids==set(interactions['games'])==set(unassigned['games'])==set(track['games'])
          for gid in sorted(gids):
              paths.update([
                  pbp['games'][gid]['source_file'],
                  'gamepulse/fusion/index/interactions/'+gid+'.json',
                  unassigned['games'][gid]['path'],
                  track['games'][gid]['path']
              ])
          (root/'required-paths.txt').write_text('\n'.join(sorted(paths))+'\n')
          print('NBA_PRIVATE_SOURCE_PATHS',len(paths),'games',len(gids))
          PY
          while IFS= read -r path; do
            fetch_private "$path"
          done < "$WORK/required-paths.txt"
          # Never upload game files, sample rows, licensed source or source fixture archives.
          echo 'PRIVATE_PINNED_SOURCE_RETRIEVAL_COMPLETE'
      - name: Verify original NBA screenshot scorer and 28-game search materialization
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          export PYTHONPATH="$WORK/gamepulse/fusion:$WORK/gamepulse/fusion/tests"
          python3 -m compileall -q "$WORK/gamepulse/fusion"
          for pattern in \
            test_official_nba_advanced_rockets_spurs_full_p1_2026.py \
            test_official_nba_ast_full_p1_2026.py \
            test_query_nba_episode_pbp_scoring_2026.py \
            test_query_nba_episode_tracking_2026.py \
            test_query_nba_episode_tracking_index_2026.py \
            test_nba_possession_tracking_crosswalk_2026.py \
            test_nba_provider_onoff_source_2026.py \
            test_materialize_nba_episode_views_2026.py \
            test_nba_source_possession_ledger_2026.py; do
            python3 -m unittest discover -s "$WORK/gamepulse/fusion/tests" -p "$pattern" -q
          done
          python3 "$WORK/gamepulse/fusion/materialize_nba_episode_views_2026.py" \
            --root "$WORK" --out "$RUNNER_TEMP/accepted-private-nba-episodes"
          python3 - "$RUNNER_TEMP/accepted-private-nba-episodes/index.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          t=a['totals']
          assert t['games']==28
          assert t['nba_field_episodes']==5819
          assert t['source_action_run_touch_labels_reused']==12557
          assert t['source_action_run_touch_labels_ambiguous']==0
          assert t['unassigned_source_touch_labels']==11553
          assert t['original_native_labels']==24110
          assert a['physical_possessions_certified']==0
          assert len(a['games'])==28
          print('PRIVATE_NBA_EPISODE_MATERIALIZATION_PASSED',
                'games',t['games'],'episodes',t['nba_field_episodes'],
                'native_touches',t['original_native_labels'])
          PY
          echo 'PR776_SOURCE_TESTS_COMPLETE'

      - name: Publish the accepted 28-game views atomically to the private PR branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          PIN: 4bc33c9e629b13e18dadd200ccf7b92d315af837
          PRIVATE_REPO: timeedmonds-maker/104
          TARGET_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 3
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          python3 - "$RUNNER_TEMP/accepted-private-nba-episodes" <<'PY'
          import base64,hashlib,json,os,subprocess,sys
          from pathlib import Path
          data_root=Path(sys.argv[1])
          repo=os.environ['PRIVATE_REPO']
          branch=os.environ['TARGET_BRANCH']
          pin=os.environ['PIN']
          prefix='gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025'
          def gh(endpoint,method='GET',payload=None):
              cmd=['gh','api','repos/'+repo+'/'+endpoint]
              if method!='GET':
                  cmd+=['-X',method,'--input','-']
              run=subprocess.run(cmd,input=(json.dumps(payload) if payload is not None else None),
                  text=True,capture_output=True,timeout=120)
              if run.returncode:
                  raise RuntimeError('PRIVATE_GIT_OPERATION_FAILED: '+endpoint+' '+str(run.returncode))
              return json.loads(run.stdout)
          assert gh('git/ref/heads/'+branch)['object']['sha']==pin
          original=gh('git/ref/heads/'+branch)['object']['sha']
          assert original==pin,'PRIVATE_PR_HEAD_MOVED_FROM_TESTED_COMMIT'
          # Immutable publication: refuse overwriting an existing snapshot.
          existing=subprocess.run(['gh','api','repos/'+repo+'/contents/'+prefix+'?ref='+pin],
              capture_output=True,text=True,timeout=60)
          assert existing.returncode!=0 and ('404' in existing.stderr or 'Not Found' in existing.stderr), 'PRIVATE_SNAPSHOT_ALREADY_EXISTS_OR_READ_FAILED'
          index=json.loads((data_root/'index.json').read_bytes())
          assert index['schema']=='gamepulse.nba-source-episode-tracking-season-index.v1'
          assert len(index['games'])==28 and index['physical_possessions_certified']==0
          t=index['totals']
          assert (t['games'],t['nba_field_episodes'],t['original_native_labels'],
                  t['source_action_run_touch_labels_reused'],
                  t['source_action_run_touch_labels_ambiguous'],
                  t['unassigned_source_touch_labels'])==(28,5819,24110,12557,0,11553)
          files=[data_root/'index.json']
          for gid,row in sorted(index['games'].items()):
              assert len(gid)==10 and gid.isdigit() and row['path']==gid+'.json'
              f=data_root/row['path']
              raw=f.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              body=json.loads(raw)
              assert body['game_id']==gid and body['physical_possessions_certified']==0
              assert body['original_source_touch_labels_preserved']==row['original_touch_labels']
              files.append(f)
          assert len(files)==29
          base_tree=gh('git/commits/'+pin)['tree']['sha']
          tree=[]
          for path in files:
              raw=path.read_bytes()
              blob=gh('git/blobs','POST',{
                  'encoding':'base64','content':base64.b64encode(raw).decode('ascii')})
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert blob['sha']==expected,'PRIVATE_BLOB_SERVER_SHA_CONFLICT'
              tree.append({'path':prefix+'/'+path.name,'mode':'100644',
                           'type':'blob','sha':blob['sha']})
          newtree=gh('git/trees','POST',{'base_tree':base_tree,'tree':tree})
          commit=gh('git/commits','POST',{
              'message':'data(gamepulse): pin accepted 28-game NBA episode + original tracking views',
              'tree':newtree['sha'],'parents':[pin]})
          assert gh('git/ref/heads/'+branch)['object']['sha']==pin, 'PRIVATE_BRANCH_MOVED_DURING_UPLOAD'
          updated=gh('git/refs/heads/'+branch,'PATCH',{'sha':commit['sha'],'force':False})
          assert updated['object']['sha']==commit['sha']
          # Read back the private tree; no raw source or game rows printed.
          published=gh('git/trees/'+newtree['sha']+'?recursive=1')
          bypath={row['path']:row['sha'] for row in published['tree'] if row['type']=='blob'}
          assert all(bypath.get(row['path'])==row['sha'] for row in tree)
          print('PRIVATE_NBA_EPISODE_SNAPSHOT_PUBLISHED',
                'files',len(files),'games',len(index['games']),
                'native_labels',t['original_native_labels'],
                'head',commit['sha'])
          PY
