name: Integrated Pulse PR776 scorer and episode materialization acceptance
# Public CPU only. Source and all game-level data remain inside temporary private runner storage.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-acceptance-20261025.yml'
permissions:
  contents: read
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve pinned private PR source and 28 original games
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          PIN: ec4752c2e5c2c8786f263eac7ec0f334c011e728
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_TOKEN_UNAVAILABLE'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          WORK="$RUNNER_TEMP/gamepulse-pr776"
          mkdir -p "$WORK/gamepulse/fusion/tests"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          fetch_private() {
            local path="$1"
            mkdir -p "$(dirname "$WORK/$path")"
            gh api "repos/timeedmonds-maker/104/contents/$path?ref=$PIN" --jq .content |
              base64 --decode > "$WORK/$path"
            test -s "$WORK/$path" || { echo "SOURCE_FETCH_FAILED path=$path"; exit 5; }
          }
          for py in \
            official_nba_advanced_ratings_2026.py \
            audit_nba_full_p1_advanced_2026.py \
            official_possession_field_onset_2026.py \
            universal_possession_alignment_2026.py \
            nba_source_possession_ledger_2026.py \
            nba_possession_tracking_crosswalk_2026.py \
            estimate_source_offense_handoffs_2026.py \
            nba_provider_onoff_source_2026.py \
            materialize_nba_episode_views_2026.py \
            query_nba_episode_tracking_2026.py; do
            fetch_private "gamepulse/fusion/$py"
          done
          for py in \
            test_official_nba_advanced_rockets_spurs_full_p1_2026.py \
            test_official_nba_ast_full_p1_2026.py \
            test_query_nba_episode_pbp_scoring_2026.py \
            test_query_nba_episode_tracking_2026.py \
            test_nba_possession_tracking_crosswalk_2026.py \
            test_nba_provider_onoff_source_2026.py \
            test_materialize_nba_episode_views_2026.py \
            test_nba_source_possession_ledger_2026.py \
            test_universal_possession_alignment_2026.py; do
            fetch_private "gamepulse/fusion/tests/$py"
          done
          for j in \
            gamepulse/fusion/nba_advanced/references/0022600009_hou_full_p1_20261025.json \
            gamepulse/fusion/nba_advanced/references/0022600009_hou_full_p1_all_players_20261025.json \
            gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json \
            gamepulse/fusion/index/interactions/index-2026-27.json \
            gamepulse/fusion/index/unassigned_native_labels/index-2026-27.json \
            gamepulse/fusion/index/index.json; do
            fetch_private "$j"
          done
          python3 - "$WORK" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          paths=set()
          pbp=json.loads((root/'gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json').read_text())
          interactions=json.loads((root/'gamepulse/fusion/index/interactions/index-2026-27.json').read_text())
          unassigned=json.loads((root/'gamepulse/fusion/index/unassigned_native_labels/index-2026-27.json').read_text())
          track=json.loads((root/'gamepulse/fusion/index/index.json').read_text())
          gids=set(pbp['games'])
          assert len(gids)==28 and gids==set(interactions['games'])==set(unassigned['games'])==set(track['games'])
          for gid in sorted(gids):
              paths.update([
                  pbp['games'][gid]['source_file'],
                  'gamepulse/fusion/index/interactions/'+gid+'.json',
                  unassigned['games'][gid]['path'],
                  track['games'][gid]['path']
              ])
          (root/'required-paths.txt').write_text('\n'.join(sorted(paths))+'\n')
          print('NBA_PRIVATE_SOURCE_PATHS',len(paths),'games',len(gids))
          PY
          while IFS= read -r path; do
            fetch_private "$path"
          done < "$WORK/required-paths.txt"
          # Never upload game files, sample rows, licensed source or source fixture archives.
          echo 'PRIVATE_PINNED_SOURCE_RETRIEVAL_COMPLETE'
      - name: Verify original NBA screenshot scorer and 28-game search materialization
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          export PYTHONPATH="$WORK/gamepulse/fusion:$WORK/gamepulse/fusion/tests"
          python3 -m compileall -q "$WORK/gamepulse/fusion"
          for pattern in \
            test_official_nba_advanced_rockets_spurs_full_p1_2026.py \
            test_official_nba_ast_full_p1_2026.py \
            test_query_nba_episode_pbp_scoring_2026.py \
            test_query_nba_episode_tracking_2026.py \
            test_nba_possession_tracking_crosswalk_2026.py \
            test_nba_provider_onoff_source_2026.py \
            test_materialize_nba_episode_views_2026.py \
            test_nba_source_possession_ledger_2026.py; do
            python3 -m unittest discover -s "$WORK/gamepulse/fusion/tests" -p "$pattern" -q
          done
          python3 "$WORK/gamepulse/fusion/materialize_nba_episode_views_2026.py" \
            --root "$WORK" --out "$RUNNER_TEMP/accepted-private-nba-episodes"
          python3 - "$RUNNER_TEMP/accepted-private-nba-episodes/index.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          t=a['totals']
          assert t['games']==28
          assert t['nba_field_episodes']==5819
          assert t['source_action_run_touch_labels_reused']==12557
          assert t['source_action_run_touch_labels_ambiguous']==0
          assert t['unassigned_source_touch_labels']==11553
          assert t['original_native_labels']==24110
          assert a['physical_possessions_certified']==0
          assert len(a['games'])==28
          print('PRIVATE_NBA_EPISODE_MATERIALIZATION_PASSED',
                'games',t['games'],'episodes',t['nba_field_episodes'],
                'native_touches',t['original_native_labels'])
          PY
          echo 'PR776_SOURCE_TESTS_COMPLETE'

# source-integrity acceptance rerun after reviewed public allowlist authorization
