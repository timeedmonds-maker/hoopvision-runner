name: Game Pulse Rockets part07 private orphan repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-part07-orphan-repair.yml'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-part07-orphan-repair.yml'
      - 'tools/licensed_feed/season_private_release.mjs'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: gamepulse-rockets-part07-orphan-repair
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  repair-and-capture:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licensed SDK, no scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Quarantine orphan sidecar and capture exact missing chunk privately
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600091'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T00:30:00Z'
          GAMEPULSE_PRIORITY_PART: '7'
        run: node season_private_release.mjs
