name: Amen732 true six-camera Gaussian input source-integrity and tensor preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-sixview-gaussian-model-input-preflight.yml']
permissions:
  contents: read
concurrency:
  group: freeview-amen732-six-source-gaussian-tensor-private
  cancel-in-progress: false
jobs:
  source_gaussian:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate no NBA licensed pixels are published in public repository
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m pip install -q --disable-pip-version-check 'numpy<2' 'opencv-python-headless==4.10.0.84'
          python3 -m py_compile tools/amen732_genuine_sixview_gaussian_preflight.py
          python3 tools/amen732_genuine_sixview_gaussian_preflight.py --selftest
      - name: Materialize six verified action-state native PNGs from private GitHub release
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo PRIVATE_SOURCE_TOKEN_MISSING; exit 4; }
          ROOT="$RUNNER_TEMP/amen732-gaussian-preflight"
          mkdir -p "$ROOT/source" "$ROOT/output"
          gh release download freeview-amen732-sixview-contact-sha-crosswalk-20261029 \
            --repo timeedmonds-maker/104 --dir "$ROOT/source" \
            --pattern 'amen732-audio_aligned-*.png'
          test "$(find "$ROOT/source" -name 'amen732-audio_aligned-*.png' | wc -l)" = 6
          gh release download freeview-amen732-archive-vs-fresh-sixvideo-pixel-crosswalk-20261029 \
            --repo timeedmonds-maker/104 --dir "$ROOT/source" \
            --pattern 'amen732_archive_to_fresh_pixel_frame_crosswalk.json'
          API='repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_sixview_gaussian_model_ready_inputs_20261029.json?ref=a35a7da7b06b759c5511b1cc99b0e57506817aa4'
          gh api "$API" --jq .content | base64 -d > "$ROOT/source/immutable_model_input_manifest.json"
          test -s "$ROOT/source/immutable_model_input_manifest.json"
          echo SIX_ACTUAL_BLOCK_SOURCE_PNGS_PRIVATE_READY
      - name: Test crosswalk integrity and produce official normalized six-view Gaussian input
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-gaussian-preflight"
          python3 tools/amen732_genuine_sixview_gaussian_preflight.py \
            --manifest "$ROOT/source/immutable_model_input_manifest.json" \
            --source-pngs "$ROOT/source" \
            --crosswalk "$ROOT/source/amen732_archive_to_fresh_pixel_frame_crosswalk.json" \
            --out "$ROOT/output"
          python3 - "$ROOT/output/amen732_real_sixview_gaussian_preflight_qa.json" <<'PY'
          import json,sys
          from pathlib import Path
          q=json.load(open(sys.argv[1]))
          assert q['input_camera_count']==6 and len(q['inputs'])==6
          assert q['all_12_archived_vs_fresh_pixel_correspondences_pass']
          assert q['model_input_shape']==[6,3,252,448]
          assert not q['anysplat_true_cuda_gaussian_rasterizer_executed']
          p=Path(sys.argv[1]).parent/q['model_tensor_private_asset']
          assert p.is_file() and p.stat().st_size>50000
          print('SIX_UNPOSED_REAL_GAUSSIAN_MODEL_INPUT_SHA_ACCEPTED',p.stat().st_size)
          PY
      - name: Save source-only tensor and exact QA to private repo release; verify SHA
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-gaussian-preflight"
          TAG=freeview-amen732-six-real-camera-gaussian-model-input-20261029
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title "Amen732 actual block six-source AnySplat normalized model input" \
              --notes "12 independently matched archived frame witnesses, all six source PNG SHA verified, [0,1] model tensor. Actual CUDA 3D Gaussian inference has NOT run." \
              --latest=false >/dev/null
          fi
          gh release upload "$TAG" \
            "$ROOT/output/amen732_real_sixview_anysplat_0to1_448x252.npz" \
            "$ROOT/output/amen732_real_sixview_gaussian_preflight_qa.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/private_receipt.json"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1]);assets={x['name']:x for x in json.load(open(root/'private_receipt.json'))['assets']}
          for file in (root/'output').iterdir():
            assert assets[file.name]['digest']=='sha256:'+hashlib.sha256(file.read_bytes()).hexdigest()
          print('SIX_CAMERA_REAL_BLOCK_TENSOR_PRIVATELY_SHA_VERIFIED',len(list((root/'output').iterdir())))
          PY
