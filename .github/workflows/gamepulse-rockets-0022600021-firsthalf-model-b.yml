name: Rockets Dallas IGP v32 original source native Model B reconstruction QA
# Original NBA SDK positions and reconstructed XYZ remain in PRIVATE 104 release.
# Public Actions logs print aggregate slot coverage and masked original-source error only.
# Retry: skip blank source-native JSONL rows; original capture and SHA remain unchanged.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-0022600021-firsthalf-model-b.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rockets-dallas-v32-native-model-b-private-source
  cancel-in-progress: false
jobs:
  shadow-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      TAG: gamepulse-firsthalf-sdk-0022600021
      PRIVATE: timeedmonds-maker/104
      MAIN_BRANCH: main
      ACCEPTED_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and verify private authorized source access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE" --jq .private)" = true
          echo PRIVATE_AUTHORIZED_SOURCE_ACCESS_CONFIRMED
      - name: Read immutable original SDK frames and accepted Model B privately
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rockets-dallas-native-v32"
          mkdir -p "$ROOT"
          echo "RECON_ROOT=$ROOT" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$PRIVATE" \
            --pattern 'firsthalf-block-*' --dir "$ROOT" --clobber
          for name in igp_tracking_model_a_holdout_2026.py igp_tracking_model_b_holdout_2026.py; do
            gh api -X GET "repos/$PRIVATE/contents/gamepulse/fusion/$name" \
              -f ref="$ACCEPTED_BRANCH" --jq '.content' | base64 -d > "$ROOT/$name"
          done
          gh api -X GET "repos/$PRIVATE/contents/gamepulse/live/igp_v32_live_half_reconstruct_2026.py" \
            -f ref="$MAIN_BRANCH" --jq '.content' | base64 -d > "$ROOT/reconstruct.py"
          python3 -m py_compile "$ROOT"/igp_tracking_model_a_holdout_2026.py \
            "$ROOT"/igp_tracking_model_b_holdout_2026.py "$ROOT/reconstruct.py"
          test "$(find "$ROOT" -maxdepth 1 -name 'firsthalf-block-*.tar.gz' | wc -l)" -eq 8
          test "$(find "$ROOT" -maxdepth 1 -name 'firsthalf-block-*.json' | wc -l)" -eq 8
          echo ORIGINAL_EIGHT_PRIVATE_SHA_PARTS_READY
      - name: Execute selftest, reconstruct and independently source-mask player XY
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RECON_ROOT"
          python3 "$RECON_ROOT/reconstruct.py" --selftest
          python3 "$RECON_ROOT/reconstruct.py" --root "$RECON_ROOT" \
            --out "$RECON_ROOT/igp_v32_0022600021_firsthalf_reconstruction_qa.json" \
            --sidecar "$RECON_ROOT/igp-v32-0022600021-firsthalf-model-b-added-positions.jsonl.gz"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ["RECON_ROOT"])
          q=json.loads((r/"igp_v32_0022600021_firsthalf_reconstruction_qa.json").read_text())
          c=q["coverage_counts"]
          assert q["original_XYZ_mutated"] is False
          assert c["original_native_timestamps"]>0
          assert c["candidate_output_records"]==c["model_B_source_actor_gapfill_positions"]
          assert c["model_B_complete_source_ten_plus_direct_ball_stable_provisional"]>=c["original_source_ten_and_ball"]
          assert q["masked_source_XY_qa"]["eligible_masked_player_samples"]>0
          assert hashlib.sha256((r/q["sidecar_asset"]).read_bytes()).hexdigest()==q["sidecar_sha256"]
          print("SHA_PROVENANCE_MASK_QA_MODEL_B_TESTS_PASS",
                "source_ten_ball_before",c["original_source_ten_and_ball"],
                "source_ten_ball_after",c["model_B_complete_source_ten_plus_direct_ball_stable_provisional"],
                "new_model_B_slots",c["model_B_source_actor_gapfill_positions"])
          PY
      - name: Preserve reconstruct positions only in private original source release
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RECON_ROOT/igp-v32-0022600021-firsthalf-model-b-added-positions.jsonl.gz"
          gh release upload "$TAG" "$FILE" --repo "$PRIVATE" --clobber
          QA="$RECON_ROOT/igp_v32_0022600021_firsthalf_reconstruction_qa.json"
          python3 - "$QA" <<'PY'
          import base64,json,os,subprocess,sys
          from pathlib import Path
          src=Path(sys.argv[1])
          qa=json.loads(src.read_bytes())
          endpoint="repos/"+os.environ["PRIVATE"]+"/contents/gamepulse/live/qa/igp_v32_0022600021_firsthalf_reconstruction_qa.json"
          request={"branch":"main","message":"qa(igp): Rockets Dallas original player XYZ Model B reconstructed source-only masked results",
                   "content":base64.b64encode(src.read_bytes()).decode()}
          previous=subprocess.run(["gh","api",endpoint],capture_output=True,text=True)
          if previous.returncode==0:request["sha"]=json.loads(previous.stdout)["sha"]
          subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],input=json.dumps(request),
                         text=True,check=True,stdout=subprocess.DEVNULL)
          release=json.loads(subprocess.check_output(["gh","api",
              "repos/"+os.environ["PRIVATE"]+"/releases/tags/"+os.environ["TAG"]]))
          items={a["name"]:a for a in release["assets"]}
          assert items[qa["sidecar_asset"]]["digest"]=="sha256:"+qa["sidecar_sha256"]
          print("PRIVATE_MODEL_B_QA_COMMITTED_AND_SIDECAR_SHA_MATCHED")
          PY
