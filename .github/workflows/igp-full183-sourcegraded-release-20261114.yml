name: Integrated Pulse FULL183 sourcegraded QA and release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full183-sourcegraded-release-20261114.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: igp-full183-sourcegrade-release, cancel-in-progress: false}
jobs:
  qa-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard private NBA original source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Verify and publish FULL183 versioned sourcegraded release
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_full183_sourcegraded_release_v1.py' \
            '/gamepulse/fusion/materialized/igp_full174_unified_source_default_v1/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/nba_logical_chains/**' \
            '/gamepulse/fusion/materialized/igp_nov14_nine_live_original_xyz_v1/**' \
            '/gamepulse/fusion/qa/igp_20261114/**' \
            '/gamepulse/fusion/official_pbp_timing/games/00226000*.json' \
            '/gamepulse/fusion/evidence/companion_sdk_original_00226000*/**' \
            '/data/extensions/nba_blueprint_2026_27/games/002260003*/**' \
            '/data/extensions/nba_blueprint_2026_27/games/002260004*/**'
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_full183_sourcegraded_release_v1.py
          python3 gamepulse/fusion/igp_full183_sourcegraded_release_v1.py --root .
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          x=Path('gamepulse/fusion/materialized/igp_full183_unified_source_default_v1')
          a=json.loads((x/'index.json').read_bytes())
          q=json.loads((x/'qa.json').read_bytes())
          l=json.loads((x/'LATEST.json').read_bytes())
          assert a['game_count']==183 and a['counts']['official_FGA']==32197
          assert a['counts']['official_actions']==109871
          assert a['new9_summary']['native_original_timestamps']==270266
          assert a['new9_summary']['companion_exact_FGA']==1246
          assert q['release_status']=='PASS_SOURCE_GRADED_WITH_UNAVAILABLE_PROVIDER_NULLS'
          assert not q['full_original_13part_certified'] and q['parent_full174_immutable']
          assert hashlib.sha256((x/'index.json').read_bytes()).hexdigest()==l['canonical_manifest_sha256']
          print('FULL183_VERSIONED_SOURCE_SHA_READBACK_ACCEPTED',a['game_count'],a['counts']['official_FGA'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/materialized/igp_full183_unified_source_default_v1
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL183_SOURCEGRADED_RELEASE_ALREADY_CURRENT; exit 0; fi
          git commit -q -m "data(igp): release FULL183 additive sourcegrade with nine original SHA-locked games"
          for n in 1 2 3 4 5 6 7; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || { git rebase --abort; echo FULL183_CONCURRENT_SOURCE_RECHECK_REQUIRED; exit 41; }
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo FULL183_SOURCEGRADED_PRIVATE_RELEASE_ACCEPTED; exit 0; fi
            sleep "$n"
          done
          exit 23
