name: IGP G1 original NBA 13part selected player ball upstream interpolation provenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g1-original-actor-upstream-provenance-0001.yml']
permissions: {contents: read}
concurrency:
  group: igp-g1-original-actor-provenance-0022600001
  cancel-in-progress: false
jobs:
  original-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: d47f1c52ee29f5bf7682772d08d6db89534ff543
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public confidentiality guard and fixed original NBA private SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Original 13part SDK keyframe SHA files and exact original original actor flags
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g1_original_actor_upstream_interp_0001_v1.py'
          mkdir -p "$RUNNER_TEMP/original13" "$RUNNER_TEMP/sourceQA"
          gh api repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-0022600001 > "$RUNNER_TEMP/release-private.json"
          gh release download gamepulse-sdk-0022600001 --repo timeedmonds-maker/104 --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/original13"
          test "$(find "$RUNNER_TEMP/original13" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          if ! python3 gamepulse/fusion/igp_fusion_g1_original_actor_upstream_interp_0001_v1.py --root . \
             --archive-dir "$RUNNER_TEMP/original13" --release-json "$RUNNER_TEMP/release-private.json" \
             --sidecar "$RUNNER_TEMP/sourceQA/actor_flags_private.jsonl.gz" \
             --out "$RUNNER_TEMP/sourceQA/provenance_private.json" > "$RUNNER_TEMP/sourceQA/original-provenance-private.log" 2>&1; then
            echo IGP_G1_PER_ACTOR_FLAG_SOURCE_AUDIT_FAILED
            python3 - <<'PY'
          import re,os
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'sourceQA/original-provenance-private.log').read_text(errors='replace').splitlines()
          last=next((z for z in reversed(lines) if z.strip()),'NO_LOG')
          print('IGP_G1_SOURCE_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:90])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os,hashlib,gzip
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'sourceQA'
          j=json.loads((base/'provenance_private.json').read_text())
          zipped=(base/'actor_flags_private.jsonl.gz').read_bytes()
          assert hashlib.sha256(zipped).hexdigest()==j['sidecar_sha256']
          assert j['counts']['original_archive_parts_sha_verified']==13
          assert j['counts']['raw_original_coordinate_keyframes']==66512
          assert j['counts']['native_original_timestamp_rows']==33254
          assert j['counts']['native_selected_original_XYZ_actor_slots']>250000
          assert j['counts']['P4_DET_video_case_NBA_logged_original_native_frames']==28
          assert not j['source_original_upstream_interpolated_False_is_physical_video_truth']
          assert j['newly_accepted_physical_positions']==0
          content=gzip.decompress(zipped)
          assert len(content.splitlines())==33254
          print('IGP_G1_SOURCE_SELECTED_ORIGINAL_ACTOR_FLAGS',json.dumps({
             'native_selected_original_XYZ_actor_slots':j['counts']['native_selected_original_XYZ_actor_slots'],
             'selected_actor_flags':{k:v for k,v in j['counts'].items() if k.startswith('native_selected_actor_flag_')},
             'selected_ball_flags':{k:v for k,v in j['counts'].items() if k.startswith('selected_ball_flag_')},
             'original_13parts_verified':True,
             'no_newly_certified_video_physical_positions':True},sort_keys=True))
          PY
      - name: Commit selected-actor source flag sidecar and reconciliation ONLY privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030
          git fetch -q origin "$BRANCH"
          git checkout -q -B source-actor-original-G1 "origin/$BRANCH"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/sourceQA/provenance_private.json" "$dest/igp_fusion_g1_original_actor_upstream_interp_0001_v1.json"
          cp "$RUNNER_TEMP/sourceQA/actor_flags_private.jsonl.gz" "$dest/igp_fusion_g1_original_actor_upstream_interp_0001_v1.jsonl.gz"
          git add -f "$dest/igp_fusion_g1_original_actor_upstream_interp_0001_v1.json" "$dest/igp_fusion_g1_original_actor_upstream_interp_0001_v1.jsonl.gz"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original NBA 13part per selected actor/ball keyframe interpolated flag provenance, raw SHA'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G1_ORIGINAL_NBA_ACTOR_SOURCE_FLAG_PRIVATE_SAVED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
