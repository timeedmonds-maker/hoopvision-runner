# Licensed source stays inside private GitHub runner sandbox. Public aggregate logs only.
name: IGP 3.2 ball 65fps disjoint 65-game source mask research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-ballonly-unseen65-source-mask.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-unseen65-ball-source-masked
  cancel-in-progress: false
jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      SHARD: ${{ matrix.shard }}
      SHARDS: "8"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and private original NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_ball_only_speed_gate_shadow_v1.py gamepulse/fusion/igp_v32_ballonly_65_unseen65_release_gate_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_ball_only_speed_gate_shadow_v1.py'
      - name: Evaluate fixed ball speed on eight unseen games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_ballonly_65_unseen65_release_gate_v1.py \
            --root . --shard-index "$SHARD" --shard-count "$SHARDS" \
            --output "$RUNNER_TEMP/igp-v32-unseen-shard.json" >"$RUNNER_TEMP/v32-unseen-private.log" 2>&1 || {
              echo IGP_V32_UNSEEN65_ORIGINAL_SOURCE_TEST_FAILED
              exit 61
            }
          grep '^IGP_V32_UNSEEN65_BALL_SHARD' "$RUNNER_TEMP/v32-unseen-private.log" || true
      - name: Commit private source masked shard QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_ballonly_65_unseen_shard_$SHARD"
          receipt="$receipt""_of_$SHARDS.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B ball65 "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-v32-unseen-shard.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo V32_UNSEEN_SHARD_ALREADY_SAVED;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): unseen65 masked ball speed shadow shard'
          for n in 1 2 3 4 5 6 7 8 9;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo V32_BALL65_UNSEEN_SHARD_PRIVATE_QA_SAVED;exit 0;fi
            sleep "$n"
          done
          exit 62
  release_gate:
    needs: [shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and clone original private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Evaluate disjoint 65 and six pilot full 71 game source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_ballonly_65_unseen65_release_gate_v1.py \
            --root . --finalize --shard-count 8 \
            --output "$RUNNER_TEMP/igp-v32-ball65-final.json" >"$RUNNER_TEMP/private-final.log" 2>&1 || {
              echo IGP_V32_BALL65_FULL71_FROZEN_SOURCE_GATE_FAILED
              exit 63
            }
          grep '^IGP_V32_BALLONLY_65_FULL71_DISJOINT_SHADOW' "$RUNNER_TEMP/private-final.log" || true
      - name: Commit no-promotion all71 QA into private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_ballonly_65_unseen65_full71_shadow_decision_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B ball65end "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-v32-ball65-final.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo V32_BALL65_FULL71_ALREADY_SAVED;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): unseen65 ball speed source mask and full71 shadow source report'
          for n in 1 2 3 4 5 6;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo V32_BALL65_FULL71_PRIVATE_QA_SAVED;exit 0;fi
            sleep "$n"
          done
          exit 64
