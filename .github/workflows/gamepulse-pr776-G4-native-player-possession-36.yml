name: PR776 G4 original NBA player-ball-possession native source indexing 36 games
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G4-native-player-possession-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-g4-native-actor-possession-36
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public confidentiality guard and private SHA original NBA data
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Run source-free query, indexing and immutable-original-chunk regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
             gamepulse/fusion/igp_g4_native_actor_possession_postings_2026.py \
             gamepulse/fusion/query_igp_g4_native_actor_possession_2026.py \
             gamepulse/fusion/igp_g4_native_actor_possession_qa_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
             -p 'test_igp_g4_native_actor_possession_2026.py' -v
          echo G4_ORIGINAL_SOURCE_NATIVE_POSTINGS_TESTS_PASSED
          # Explicitly retain provenance-join regression independently of index-only tests.
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_original_per_actor_lineage_query_G1_2026.py' -v
      - name: Pilot two game source SHA/index/official PBP/G3 conservation first
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from pathlib import Path
          from igp_tracking_pilot_run_2026 import BASE,load
          from igp_g4_native_actor_possession_postings_2026 import build_game
          root=Path(".")
          cohort,_=load(root,BASE/"materialized/igp_provisional_chain_tracking_interiors_36_v1/index.json")
          old,_=load(root,BASE/"materialized/igp_wallclock_native_frame_possession_36_v1/index.json")
          roster,_=load(root,BASE/"official_lineup_clock/index.json")
          for gid in ("0022600009","0022600092"):
              q=build_game(root,gid,old,cohort,roster)
              assert q["counts"]["nba_original_source_frames"]>10000
              assert q["counts"]["official_logical_NBA_chains"]>100
              assert q["original_source_XYZ_not_duplicated"]
          print("G4_TWO_GAME_PRIVATE_SHA_SOURCE_PILOT_PASSED")
          PY
      - name: Build 36 native full-source actor, ball, G3 and NBA logical chain indexes
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/materialized/igp_g4_original_native_player_ball_possession_v1
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g4_native_actor_possession_postings_2026.py \
             --root . --out-dir "$OUT" > "$RUNNER_TEMP/private-G4-original-source-build.log"
          python3 - "$OUT/index.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]));c=x["counts"]
          assert x["source_games"]==36 and len(x["games"])==36
          assert c["nba_original_source_frames"]==1203986
          assert c["original_player_actor_entries"]==8673975
          assert c["original_ball_frames"]==912704
          assert c["g3_derived_player_entries"]==571072
          assert c["g3_derived_ball_frames"]==17008
          assert c["official_logical_NBA_chains"]==7474
          assert x["all_source_native_XYZ_unchanged"]
          assert not x["original_NBA_SDK_or_derived_G3_XYZ_copied_to_index"]
          print("G4_NBA_SOURCE_NATIVE_INDEX_36_CONSERVATION_PASS",{
              "games":36,"native_frames":c["nba_original_source_frames"],
              "original_player_entries":c["original_player_actor_entries"],
              "original_ball_frames":c["original_ball_frames"],
              "derived_player_entries":c["g3_derived_player_entries"],
              "derived_ball_frames":c["g3_derived_ball_frames"],
              "NBA_logical_chains":c["official_logical_NBA_chains"]})
          PY
      - name: Acceptance—real player, ball, G1 SHA, G2 grades, G3 and possession index queries
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G4_original_native_player_ball_possession_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g4_native_actor_possession_qa_2026.py \
             --root . --out "$OUT" > "$RUNNER_TEMP/private-G4-original-query-acceptance.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]));c=q["counts"];tot=q["accepted_postings_counts"]
          assert q["source_games"]==36
          assert c["original_games_checked"]==36
          assert c["original_player_ball_G1_SHA_source_readbacks"]==36
          assert c["G3_missing_player_source_readbacks"]==36
          assert c["NBA_logical_chain_query_readbacks"]==36
          assert tot["official_logical_NBA_chains"]==7474
          assert q["original_NBA_SDK_XYZ_accepted_and_unchanged"]
          assert q["G3_derived_positions_never_falsely_labeled_original"]
          assert q["original_NBA_7474_logical_PBP_chains_unchanged"]
          assert q["NBA_UTC_logical_chains_NOT_physical_ball_control_boundaries"]
          assert q["private_source_positions_and_player_IDs_not_in_QA"]
          print("PR776_G4_36_NATIVE_PLAYER_BALL_G1_G2_G3_NBA_POSSESSION_QUERY_PASS",json.dumps({
             "games":36,"readbacks":c,"query_latency_ms":q["query_milliseconds"],
             "native_frames":tot["nba_original_source_frames"],
             "nba_logical_chains":tot["official_logical_NBA_chains"]
          },sort_keys=True))
          PY
      - name: Commit private-only SHA indexed player/possession data and QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          DIR=gamepulse/fusion/materialized/igp_g4_original_native_player_ball_possession_v1
          QA=gamepulse/fusion/qa/igp_progress_20261028/igp_G4_original_native_player_ball_possession_36_v1.json
          git config user.name "Game Pulse Private NBA Indexed Source QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$DIR" "$QA"
          test "$(git diff --cached --name-only | wc -l)" -eq 38
          git diff --cached --check
          git commit -qm "qa(gamepulse): accept indexed all36 source player/ball/G1/G2/G3 and NBA 7474 logical chain lookups"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PR776_G4_ALL36_PRIVATE_ORIGINAL_NATIVE_POSSESSION_INDEX_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          echo G4_PRIVATE_INDEX_SHA_RELEASE_COMMIT_FAILURE >&2
          exit 13
