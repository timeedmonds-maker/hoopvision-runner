name: Amen 732 private original native contact frames
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen-732-private-visual-panels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verified private original NBA frame handoff
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          assert not scan([".github/workflows/freeview-amen-732-private-visual-panels.yml"])
          print('PRIVATE_NATIVE_FRAME_CONTENT_GUARD_PASS')
          PY
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh release download 'freeview-native-0022600009-732' \
            --repo timeedmonds-maker/104 --dir "$ROOT" \
            --pattern '*.mp4' --pattern 'source_manifest.json' \
            --pattern 'native_presentation_timestamps.json'
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' opencv-python-headless==4.10.0.84
          python3 - "$ROOT" <<'PY'
          import base64,hashlib,json,subprocess,sys
          from pathlib import Path
          import cv2
          root=Path(sys.argv[1])
          m=json.loads((root/"source_manifest.json").read_text())
          ts=json.loads((root/"native_presentation_timestamps.json").read_text())
          picks={"High Tight":[225,228],"Left Above Rim":[239,242],
                 "Left Slash":[213,216],"Right Slash":[203,206],
                 "Broadcast":[272,275],"Right Above Rim":[231,234]}
          files={r["label"]:r for r in m["feeds"]}
          assert m["event"]["event_num"]==732 and len(files)>=6
          branch="research/amen-wemby-freeze-spin-20261024"
          repo="repos/timeedmonds-maker/104/contents/"
          frames=[]
          for label,indices in picks.items():
              f=root/files[label]["file"]
              sha=hashlib.sha256(f.read_bytes()).hexdigest()
              assert sha==files[label]["native_media_sha256"],label
              assert ts[label]["clip_sha256"]==sha
              cap=cv2.VideoCapture(str(f))
              try:
                  for index in indices:
                      cap.set(cv2.CAP_PROP_POS_FRAMES,index)
                      ok,img=cap.read()
                      assert ok and img.shape[:2]==(540,960),(label,index)
                      success,data=cv2.imencode('.jpg',img,[cv2.IMWRITE_JPEG_QUALITY,90])
                      assert success
                      body=data.tobytes()
                      filename='amen732-native-'+label.lower().replace(' ','-')+'-f'+str(index)+'.jpg'
                      dest='hoopvision/freeview/fixtures/'+filename
                      payload={'branch':branch,'message':'qa: native NBA event 732 frame '+filename,
                               'content':base64.b64encode(body).decode()}
                      put=root/'put.json';put.write_text(json.dumps(payload))
                      cp=subprocess.run(['gh','api','-X','PUT',repo+dest,'--input',str(put)],
                                         capture_output=True,text=True)
                      assert cp.returncode==0, 'PRIVATE_NATIVE_STILL_COMMIT_FAILED'
                      pts=float(ts[label]["frames"][index]["pts_time_s"])
                      frames.append({"label":label,"file":dest,"frame_index":index,
                          "original_native_pts_s":pts,"full_native_resolution":[960,540],
                          "source_media_sha256":sha,"original_frame_pixels_available":True,
                          "source_rgb_for_geometry":"ORIGINAL_CAMERA_RGB",
                          "ball_hand_first_contact_certified":False})
                      print('PRIVATE_NATIVE_CONTACT_FRAME',label,index,round(pts,4))
              finally:
                  cap.release()
          report={"schema":"freeview.amen732.native_12_contact_stills.v1",
                  "game_id":"0022600009","event_num":732,
                  "camera_views":frames,"frame_accuracy":"REAL_NATIVE_RGB_DECODED",
                  "same_physical_state_across_cameras":"PENDING_VISUAL_VERIFICATION",
                  "single_correct_contact_frame":"PENDING","3d_camera_calibration":"PENDING"}
          data=(json.dumps(report,indent=2)+'\n').encode()
          name='hoopvision/freeview/fixtures/amen732_native_contact_stills.json'
          payload={'branch':branch,'message':'qa: source native event 732 frame index evidence',
                   'content':base64.b64encode(data).decode()}
          put=root/'put.json';put.write_text(json.dumps(payload))
          cp=subprocess.run(['gh','api','-X','PUT',repo+name,'--input',str(put)],capture_output=True,text=True)
          assert cp.returncode==0,'PRIVATE_NATIVE_FRAME_RECEIPT_COMMIT_FAILED'
          print('EVENT732_NATIVE_12_STILLS_PRIVATE_COMMITTED',len(frames))
          PY
