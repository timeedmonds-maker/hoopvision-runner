name: Integrated Pulse PR776 official NBA episode XYZ season search
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-episode-season-search.yml']
permissions:
  contents: read
jobs:
  season:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PIN: 548128feb466250ea7ac2c58c88c4b64f1c8cd51
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test source-independent contracts and assemble private aggregate QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          WORK="$RUNNER_TEMP/private-episode-season"
          mkdir -p "$WORK/qa"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          fetch_file () {
            gh api "repos/$PRIVATE_REPO/contents/$1?ref=$PIN" --jq .content | base64 -d > "$2"
            test -s "$2"
          }
          for path in \
            gamepulse/fusion/build_official_episode_xyz_season_index_2026.py \
            gamepulse/fusion/query_official_episode_xyz_2026.py \
            gamepulse/fusion/tests/test_build_official_episode_xyz_season_index_2026.py \
            gamepulse/fusion/tests/test_query_official_episode_xyz_2026.py; do
            fetch_file "$path" "$WORK/$(basename "$path")"
          done
          (cd "$WORK" && python3 -m py_compile *.py &&
           python3 -m unittest -v test_build_official_episode_xyz_season_index_2026 \
             test_query_official_episode_xyz_2026)
          fetch_file gamepulse/fusion/official_lineup_clock/index.json "$WORK/official_index.json"
          fetch_file gamepulse/fusion/official_lineup_clock/games/0022600009.json "$WORK/rockets_lineup.json"
          python3 - "$WORK/official_index.json" > "$WORK/ids.txt" <<'PY'
          import json,sys
          games=json.load(open(sys.argv[1]))['games']
          assert len(games)==28
          for gid in sorted(games):print(gid)
          PY
          while IFS= read -r GAME; do
            fetch_file "gamepulse/fusion/qa/official_native_episode_xyz_bridge_$GAME"__20261026.json \
              "$WORK/qa/official_native_episode_xyz_bridge_$GAME"__20261026.json
          done < "$WORK/ids.txt"
      - name: Verify real 28-game clock, lineup and NBA episode search
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 build_official_episode_xyz_season_index_2026.py \
            --qa-dir qa --official-index official_index.json --out season-index.json
          python3 query_official_episode_xyz_2026.py \
            --index season-index.json --qa-dir qa --game-id 0022600009 \
            --team HOU --player-id 1627832 --official-lineup rockets_lineup.json \
            --out rockets_fred_episode_search.json
          python3 - <<'PY'
          import json
          a=json.load(open("season-index.json"));t=a["totals"]
          q=json.load(open("rockets_fred_episode_search.json"))
          assert a["game_count"]==28 and t["nba_source_field_episodes"]==5819
          assert t["original_unique_frames"]==936815
          assert t["qualified_native_hoop_clock_brackets"]==407
          assert t["PROVISIONAL_CLOCK_OFFICIAL_LINEUP"]==34911
          assert t["conflicting_native_timestamps_quarantined"]==1
          assert q["candidate_original_xyz_frames"]>0
          assert q["independently_verified_physical_possessions"]==0
          print("SEASON_EPISODE_PRIVATE_AGGREGATES",json.dumps({
            "source_field_episodes":t["nba_source_field_episodes"],
            "episodes_with_candidate_tracking":t["nba_field_episodes_with_candidate_tracking"],
            "frames_in_source_episodes":t["nba_field_PROVISIONAL_UNIQUE_NBA_SOURCE_FIELD_EPISODE"],
            "source_ten_player_plus_ball_episode_frames":sum(
               v["ten_player_plus_ball_episode_candidate_frames"] for v in a["games"].values()),
            "Rockets_VanVleet_search_episode_count":q["nba_source_field_episodes_matched"]},sort_keys=True))
          PY
      - name: Commit SHA-pinned season index to canonical private PR
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          uri="repos/"+os.environ["PRIVATE_REPO"]+"/contents/gamepulse/fusion/materialized/official_native_episode_xyz_pr776_20261026/index.json"
          raw=Path("season-index.json").read_bytes()
          item={"branch":os.environ["BRANCH"],"message":"data(gamepulse): index 28-game original NBA episode ten-player XYZ candidates",
                "content":base64.b64encode(raw).decode()}
          pre=subprocess.run(["gh","api",uri+"?ref="+os.environ["BRANCH"]],
                             capture_output=True,text=True)
          if pre.returncode==0:
            old=json.loads(pre.stdout)
            if base64.b64decode(old["content"])==raw:
              print("PRIVATE_INDEX_UNCHANGED");raise SystemExit(0)
            item["sha"]=old["sha"]
          elif "404" not in pre.stderr and "Not Found" not in pre.stderr:
            raise ValueError("PRIVATE_INDEX_READ_FAILED")
          put=subprocess.run(["gh","api","--method","PUT",uri,"--input","-"],
                              input=json.dumps(item),capture_output=True,text=True)
          if put.returncode:raise ValueError("PRIVATE_INDEX_WRITE_FAILED")
          print("PRIVATE_NBA_EPISODE_XYZ_SEASON_INDEX_COMMITTED")
          PY
