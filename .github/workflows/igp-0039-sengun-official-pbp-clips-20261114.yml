# Free CPU-only official NBA PBP / clip availability audit for the Nov 13 2026 HOU–UTA Cup game.
name: IGP 0039 Sengun official PBP and clips audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-0039-sengun-official-pbp-clips-20261114.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  official-pbp-clips:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Retrieve real official event IDs; probe clip availability without video redistribution
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, hashlib, time, re
          gid='0022600039'
          urls=[
            f'https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_{gid}.json',
            f'https://cdn.nba.com/static/json/liveData/boxscore/boxscore_{gid}.json',
            f'https://stats.gleague.nba.com/stats/playbyplayv3?GameID={gid}&StartPeriod=0&EndPeriod=0',
            f'https://stats.gleague.nba.com/stats/boxscoretraditionalv3?GameID={gid}&StartPeriod=0&EndPeriod=0'
          ]
          results=[]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36','Accept':'application/json, text/plain, */*','Referer':'https://www.nba.com/','Origin':'https://www.nba.com','x-nba-stats-origin':'stats','x-nba-stats-token':'true'})
              with urllib.request.urlopen(req,timeout=35) as resp: raw=resp.read(); status=resp.status
              doc=json.loads(raw)
              results.append({'url':url,'status':status,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'doc':doc})
              print('IGP0039_FETCH',json.dumps({'url':url,'status':status,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}),flush=True)
            except Exception as e:
              print('IGP0039_FETCH_ERROR',json.dumps({'url':url,'error':str(e)[:400]}),flush=True)
          pbp=next((x['doc'] for x in results if 'playbyplay_' in x['url'] or 'playbyplayv3' in x['url']),None)
          if pbp:
            acts=pbp.get('game',{}).get('actions',[])
            print('IGP0039_PBP_SUMMARY',json.dumps({'gameId':pbp.get('game',{}).get('gameId'),'total_actions':len(acts),'first_action':acts[0] if acts else None},default=str),flush=True)
            sgid=1630578
            focal=[]
            for a in acts:
              desc=str(a.get('description',''))
              if a.get('personId')==sgid or a.get('assistPersonId')==sgid or 'Sengun' in desc or 'Şengün' in desc or 'Şengün' in json.dumps(a,ensure_ascii=False):
                focal.append({k:a.get(k) for k in ('actionNumber','period','clock','actionType','subType','description','personId','assistPersonId','teamTricode','shotResult','isFieldGoal','scoreHome','scoreAway','pointsTotal','videoAvailable')})
            print('IGP0039_SENGUN_EVENT_COUNT',len(focal),flush=True)
            for a in focal:
              print('IGP0039_EVENT',json.dumps(a,ensure_ascii=False),flush=True)
            probe=[]
            for a in focal:
              typ=(a.get('actionType') or '').lower()
              if typ in ('made shot','missed shot','free throw') or ('Sengun' in str(a.get('description')) and ' AST)' in str(a.get('description'))):
                probe.append(a['actionNumber'])
            probe=list(dict.fromkeys(v for v in probe if isinstance(v,int)))
            test=[11,13,19,52,62,101,209,220,246,254,412,431,455,459,472,493,507,517,610,643,674,708]
            for num in dict.fromkeys(test):
              url=f'https://clips.nba.com/?gameNo={gid}&eventNum={num}&source=grs'
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(req,timeout=22) as resp: body=resp.read(100000).decode('utf8','replace'); status=resp.status
                unav='No video clip available' in body
                video=bool(re.search(r'<video|\\.m3u8|\\.mp4',body,re.I))
                print('IGP0039_CLIP_CHECK',json.dumps({'actionNumber':num,'url':url,'http':status,'not_available_message':unav,'video_tag_or_url':video,'size_read':len(body),'sample':body[:180].replace('\\n',' ')}),flush=True)
              except Exception as e:print('IGP0039_CLIP_CHECK_ERROR',json.dumps({'actionNumber':num,'error':str(e)[:180]}),flush=True)
          else:
            print('IGP0039_NO_OFFICIAL_PBP_RESPONSE',flush=True)
          PY

      - name: Headless browser verify whether real NBA clip video can be viewed
        shell: bash
        run: |
          python3 -m pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps chromium >/dev/null 2>&1
          python3 - <<'PY'
          import json,re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
            context=browser.new_context(viewport={'width':1280,'height':800})
            page=context.new_page()
            for num in [13,254,643]:
              arr=[]
              page.on('response',lambda r: arr.append({'status':r.status,'type':r.request.resource_type,'path':r.url.split('?')[0]}) if any(k in r.url.lower() for k in ('m3u8','.mp4','playlist','mediastream','akamai','brightcove','playback')) else None)
              try:
                page.goto('https://clips.nba.com/?gameNo=0022600039&eventNum='+str(num)+'&source=grs',wait_until='domcontentloaded',timeout=25000)
                page.wait_for_timeout(3500)
                state=page.evaluate("""() => ({title:document.title,text:document.body?.innerText?.slice(0,350),video:Array.from(document.querySelectorAll('video')).map(v=>({duration:v.duration,readyState:v.readyState,paused:v.paused,currentSrc:v.currentSrc.split('?')[0].slice(0,250)})),iframes:Array.from(document.querySelectorAll('iframe')).map(v=>v.src.split('?')[0].slice(0,150)),scriptCount:document.querySelectorAll('script').length})""")
                print('IGP0039_BROWSER_VIDEO',json.dumps({'actionNumber':num,'state':state,'network':arr[:12]},default=str),flush=True)
              except Exception as e:print('IGP0039_BROWSER_ERROR',json.dumps({'actionNumber':num,'error':str(e)[:300]}),flush=True)
            browser.close()
          PY
