name: IPPT original native pose fields provenance materialization audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-native-pose-provenance-schema.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and original private NBA materialized source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
              "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Pose and provenance schema fail-closed source-free unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_native_pose_field_and_provenance_audit_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_native_pose_field_and_provenance_audit_2026.py
      - name: SHA audited exact native pose value shapes for all 36 captured games
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_native_pose_field_and_provenance_audit_2026.py --root .
          echo "IPPT_ORIGINAL_MATERIALIZED_POSE_NATIVE_SCHEMA_36_PASS"

# Source materialization schema only; excludes private NBA coordinates.
