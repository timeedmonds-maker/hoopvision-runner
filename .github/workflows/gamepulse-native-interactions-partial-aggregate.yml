name: Integrated Pulse partial native-touch season manifest
# Materialize only already saved SHA-verified private per-game indexes.
# Reconcile the newly materialized 0095 PBP/native touches; preserve two clock-quarantined games.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-native-interactions-partial-aggregate.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nba-integrated-pulse-private-season-native-touch-manifest
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public code/data separation
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Build source-backed season native-touch game manifest privately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,subprocess,time
          repo="timeedmonds-maker/104"
          canonical="repos/"+repo+"/contents/gamepulse/catalog/2026-27-integrated-current.json"
          target="repos/"+repo+"/contents/gamepulse/fusion/index/interactions/index-2026-27.json"
          frozen="repos/"+repo+"/contents/gamepulse/fusion/index/interactions/index.json"
          def call(*args,input=None,check=True):
              r=subprocess.run(["gh","api",*args],input=input,text=True,
                               capture_output=True,timeout=100)
              if check and r.returncode:
                  raise RuntimeError("PRIVATE_GITHUB_REQUEST_FAILED")
              return r
          def get(path):
              d=json.loads(call(path).stdout)
              raw=base64.b64decode(d["content"])
              return json.loads(raw),raw,d["sha"]
          catalog,_,_=get(canonical)
          frozen_doc,_,_=get(frozen)
          current,_,_=get(target)
          ids=sorted(catalog["games"])
          assert len(ids)==catalog["game_count"] and len(ids)>=28
          assert frozen_doc["game_count"]==14
          assert set(frozen_doc["games"]) <= set(ids)
          assert set(current["games"]) <= set(ids)
          indexed={}
          missing=[]
          for gid in ids:
              p="repos/"+repo+"/contents/gamepulse/fusion/index/interactions/"+gid+".json"
              r=call(p,check=False)
              if r.returncode:
                  if "404" not in r.stderr and "Not Found" not in r.stderr:
                      raise RuntimeError("PRIVATE_SOURCE_READ_FAILURE")
                  missing.append(gid)
                  continue
              v=json.loads(r.stdout)
              raw=base64.b64decode(v["content"])
              doc=json.loads(raw)
              assert doc["game_id"]==gid
              assert doc["schema"]=="gamepulse.interaction-event-possession-fusion.v1"
              assert doc["reconciliation"]["nba_team_score_reconciled"] is True
              assert doc["certified_touch_possessions"]==0 and len(doc["possessions"])>0
              assert doc["source_event_counts"]["native_unique_touch_labels"]>0
              entry={"sha256":hashlib.sha256(raw).hexdigest(),
                     "source_native_touch_labels":doc["source_event_counts"]["native_unique_touch_labels"],
                     "team_action_runs":len(doc["possessions"]),
                     "nba_scores_reconciled":True}
              if gid in frozen_doc["games"]:
                  assert entry==frozen_doc["games"][gid],"IMMUTABLE_ORIGINAL14_CHANGED"
              if gid in current["games"]:
                  assert entry==current["games"][gid],"PRIOR_SEASON_JOIN_CHANGED"
              indexed[gid]=entry
          assert set(frozen_doc["games"]) <= set(indexed)
          assert len(indexed)>=15
          updated=dict(current)
          updated["games"]=indexed
          updated["game_count"]=len(indexed)
          updated["missing_from_current_captured_season"]=missing
          updated["season_catalog_game_count"]=len(ids)
          updated["status"]=("SOURCE_NATIVE_TOUCH_PBP_28_GAME_EVENT_RUN_INDEX"
                             if not missing else "PARTIAL_NATIVE_TOUCH_PBP_ACTION_RUN_INDEX")
          updated["original_14_preserved"]=True
          updated["certified_full_touch_possessions"]=0
          updated["notice"]="Source-native NBA touches mapped to official team action runs; exact physical possession timing unverified. Unmaterialized games are NOT no-touch games."
          raw=(json.dumps(updated,indent=2,sort_keys=True)+"\n").encode()
          for attempt in range(10):
              _,prior,sha=get(target)
              if raw==prior:
                  print("PRIVATE_NATIVE_TOUCH_SEASON_INDEX_UNCHANGED")
                  break
              pay={"branch":"main","message":"data(gamepulse): private source SHA-verified season native-touch/PBP join coverage",
                   "content":base64.b64encode(raw).decode(),"sha":sha}
              r=call("-X","PUT",target,"--input","-",input=json.dumps(pay),check=False)
              if r.returncode:
                  time.sleep(attempt+1)
                  continue
              sha=json.loads(r.stdout)["content"]["sha"]
              b=json.loads(call("repos/"+repo+"/git/blobs/"+sha).stdout)
              readback=base64.b64decode(b["content"])
              assert readback==raw and hashlib.sha256(readback).digest()==hashlib.sha256(raw).digest()
              print("PRIVATE_NATIVE_TOUCH_SEASON_INDEX_SHA_VERIFIED")
              break
          else:raise RuntimeError("PRIVATE_MANIFEST_WRITE_CONFLICT")
          print("SEASON_NATIVE_TOUCH_PBP_JOIN_COVERAGE",
                "catalog",len(ids),"materialized",len(indexed),"unresolved",len(missing),
                "physical_possessions_certified",0)
          PY
