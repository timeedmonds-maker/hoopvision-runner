name: Rockets native Game Pulse triple-touch possession audit
# Correct quarter-start action timestamp boundaries across NBA PBP.
# Verify absolute source-UTC window coverage before certified interaction claims.
# Probe only newly observed native lastTouch transitions of bounded age.
# Falsify native touch matches at deliberate shifted official boundaries.
# Evaluate observed frame timestamp vs source lastTouch start timestamp.
# Verify native lastTouch start-to-keyframe age without relabeling actions.
# Verify same-actor native touch lag scan before classifying possessions.
# Cross-check every native touch with same-actor official NBA shot clock.
# Revalidate native contact player coverage across complete Rockets game.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rockets-native-touch-ppp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rockets-native-triple-touch-ppp
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public and private security boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_AUTH_MISSING'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch existing private native ball movement tool, exact official PBP and game roster
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/triple-touch"
          mkdir -p "$ROOT/sdk"
          for name in gamepulse_ball_control.py gamepulse_ball_dynamics.py native_touch_ppp_2026.py interaction_fusion_2026.py validate_native_lasttouch_events_2026.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$name?ref=main" --jq .content |
              base64 -d > "$ROOT/$name"
          done
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/0022600091.json?ref=main' --jq .content |
            base64 -d > "$ROOT/formal-pbp.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/0022600091.json?ref=main' --jq .content |
            base64 -d > "$ROOT/game-view.json"
          python3 -m py_compile "$ROOT/gamepulse_ball_control.py" "$ROOT/gamepulse_ball_dynamics.py" "$ROOT/native_touch_ppp_2026.py"
          mkdir -p "$ROOT/tests"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_interaction_fusion_2026.py?ref=main' --jq .content |
            base64 -d > "$ROOT/tests/test_interaction_fusion_2026.py"
          python3 -m py_compile "$ROOT/interaction_fusion_2026.py"
          PYTHONPATH="$ROOT" python3 -m unittest discover -v -s "$ROOT/tests" -p test_interaction_fusion_2026.py
      - name: Fetch all immutable original Rockets SDK parts and verify every SHA
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/triple-touch"
          gh api 'repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-0022600091' > "$ROOT/release.json"
          gh release download gamepulse-sdk-0022600091 --repo timeedmonds-maker/104 \
            --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk" --clobber >/dev/null
          python3 - <<'PY'
          import json,hashlib,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'triple-touch'
          assets=json.loads((root/'release.json').read_text())['assets']
          matched={a['name']:a.get('digest') for a in assets if re.fullmatch(r'sdk-part-\d{2}\.tar\.gz',a['name'])}
          assert len(matched)==13,'source_sdk_13_parts_missing'
          files=list((root/'sdk').glob('sdk-part-??.tar.gz'))
          assert len(files)==13,'sdk_archive_download_incomplete'
          for file in files:
              assert matched[file.name]=='sha256:'+hashlib.sha256(file.read_bytes()).hexdigest(), 'sdk_source_sha_mismatch'
          print('ORIGINAL_ROCKETS_SDK_PARTS_SHA_VERIFIED',len(files))
          PY
      - name: Evaluate native source contacts against official NBA possession and scoring chronology
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/triple-touch"
          cd "$ROOT"
          python3 -u native_touch_ppp_2026.py --sdk-dir sdk --pbp formal-pbp.json \
            --game-view game-view.json --out candidate-report.json
          test -s candidate-report.json
          python3 -u interaction_fusion_2026.py --sdk-dir sdk --pbp formal-pbp.json \
            --view game-view.json --query-players 201142,1627832,1630578 \
            --out interaction-fusion.json
          test -s interaction-fusion.json
          python3 -u validate_native_lasttouch_events_2026.py --sdk-dir sdk --pbp formal-pbp.json \
            --view game-view.json --out native-lasttouch-shot-controls.json
          test -s native-lasttouch-shot-controls.json
      - name: Publish report and source hashes only in private canonical repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'triple-touch'
          data=(root/'candidate-report.json').read_bytes()
          result=json.loads(data)
          assert result['schema']=='gamepulse.native-lasttouch-official-pbp-triple-candidates.v1'
          assert result['official_hou_points']==128 and result['official_dal_points']==110
          assert result['sdk_archive_count']==13
          assert result['qa']['unique_native_touch_records']>0
          target='repos/timeedmonds-maker/104/contents/gamepulse/fusion/rockets_three_player_touch_candidates_2026.json'
          old=subprocess.run(['gh','api',target],text=True,capture_output=True)
          payload={'branch':'main','message':'data(gamepulse): native source Durant VanVleet Sengun touch candidate audit, no invented certified PPP',
                   'content':base64.b64encode(data).decode()}
          if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
          elif '404' not in old.stderr and 'Not Found' not in old.stderr:
              raise RuntimeError('private_report_lookup_failure')
          put=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],
                             input=json.dumps(payload),capture_output=True,text=True)
          if put.returncode:raise RuntimeError('private_report_publish_failure')
          found=base64.b64decode(subprocess.check_output(['gh','api',target,'--jq','.content']))
          assert hashlib.sha256(found).digest()==hashlib.sha256(data).digest()
          print('NATIVE_TOUCH_PRIVATE_REPORT_PUBLISHED_AND_SHA_VERIFIED')
          fusion=(root/'interaction-fusion.json').read_bytes()
          stats=json.loads(fusion)
          assert stats['schema']=='gamepulse.interaction-event-possession-fusion.v1'
          assert stats['reconciliation']['nba_team_score_reconciled']
          assert len(stats['possessions'])>0 and stats['certified_touch_possessions']==0
          target='repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/0022600091.interactions.json'
          old=subprocess.run(['gh','api',target],text=True,capture_output=True)
          payload={'branch':'main','message':'data(gamepulse): Rockets reusable official-event and native-touch interaction index',
                   'content':base64.b64encode(fusion).decode()}
          if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
          elif '404' not in old.stderr and 'Not Found' not in old.stderr:
              raise RuntimeError('interaction_index_lookup_failed')
          result=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],
                                input=json.dumps(payload),text=True,capture_output=True)
          if result.returncode:raise RuntimeError('interaction_index_write_failed')
          received=base64.b64decode(subprocess.check_output(['gh','api',target,'--jq','.content']))
          assert hashlib.sha256(received).digest()==hashlib.sha256(fusion).digest()
          print('NATIVE_TOUCH_EVENT_PBP_BLUEPRINT_FUSION_PRIVATE_INDEX_PUBLISHED_AND_SHA_VERIFIED',
                'runs',len(stats['possessions']))
          controls=(root/'native-lasttouch-shot-controls.json').read_bytes()
          qa=json.loads(controls)
          assert qa['schema']=='gamepulse.native-lasttouch-official-shot-positive-control.v1'
          assert qa['official_shot_actor_events']>=100
          target='repos/timeedmonds-maker/104/contents/gamepulse/fusion/rockets_native_lasttouch_shot_qa.json'
          old=subprocess.run(['gh','api',target],text=True,capture_output=True)
          payload={'branch':'main','message':'qa(gamepulse): official NBA shot actor versus original Game Pulse lastTouch shifted controls',
                   'content':base64.b64encode(controls).decode()}
          if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
          elif 'Not Found' not in old.stderr and '404' not in old.stderr:
              raise RuntimeError('private_native_control_read_failed')
          status=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],input=json.dumps(payload),
                                 text=True,capture_output=True)
          if status.returncode:raise RuntimeError('private_native_control_write_failed')
          check=base64.b64decode(subprocess.check_output(['gh','api',target,'--jq','.content']))
          assert hashlib.sha256(check).digest()==hashlib.sha256(controls).digest()
          print('PRIVATE_LASTTOUCH_SOURCE_POSITIVE_CONTROL_STORED')
          PY
      - name: Private-only publication
        if: always()
        run: echo 'Raw tracking and source touches remain private; no private assets or coordinates are uploaded to public workflow artifacts.' >> "$GITHUB_STEP_SUMMARY"
