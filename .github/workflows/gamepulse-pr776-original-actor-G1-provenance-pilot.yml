name: PR776 G1 actor-level SDK keyframe provenance, Rockets and Phoenix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-original-actor-G1-provenance-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-pr776-G1-provenance-pilot
  cancel-in-progress: false
jobs:
  g1:
    name: Original source actor keyframe provenance ${{ matrix.game }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600009','0022600092']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public privacy guard and hydrate accepted original source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Per-actor SDK lineage source-free tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_original_per_actor_lineage_G1_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_original_per_actor_lineage_G1_2026.py' -v
          echo PRIVATE_G1_ACTOR_LINEAGE_SYNTHETIC_TESTS_PASSED
      - name: Retrieve and SHA validate exact thirteen original archives for current game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-$GID"
          gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release-$GID.json"
          gh release download "gamepulse-sdk-$GID" -R "$PRIVATE_REPO" \
            --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk-$GID"
          test "$(find "$RUNNER_TEMP/sdk-$GID" -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          echo ORIGINAL_SOURCE_THIRTEEN_ARCHIVES_DOWNLOADED_PRIVATE
      - name: Trace each saved actor XYZ to source part, raw keyframe and upstream flag
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT="gamepulse/fusion/materialized/igp_per_actor_G1_20261028/$GID.jsonl.gz"
          QA="gamepulse/fusion/qa/igp_progress_20261028/igp_original_per_actor_G1_${GID}_v1.json"
          test ! -e "$OUT"
          test ! -e "$QA"
          python3 gamepulse/fusion/igp_original_per_actor_lineage_G1_2026.py \
            --root . --game-id "$GID" \
            --archive-dir "$RUNNER_TEMP/sdk-$GID" \
            --release-json "$RUNNER_TEMP/release-$GID.json" \
            --out "$OUT" --receipt "$QA" > "$RUNNER_TEMP/private-G1-$GID.log"
          python3 - "$QA" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          x=a["aggregate_counts"]
          assert a["source_SDK_XYZ_not_modified"]
          assert a["raw_original_player_XYZ_not_in_lineage_sidecar"]
          assert len(a["original_13_archive_SHA256"])==13
          assert x["native_frames"]>0 and x["actor_entries"]>0
          assert x["ball_entries"]>0
          assert x["native_any_flag_FALSE"]+x["native_only_flag_TRUE"]==x["native_frames"]
          print("PR776_G1_PRIVATE_SELECTED_RAW_PER_ACTOR_LINEAGE",json.dumps({
           "game_id":a["game_id"],
           "frames":x["native_frames"],"actors":x["actor_entries"],
           "ball_frames":x["ball_entries"],
           "selected_true":x.get("selected_flag_TRUE",0),
           "selected_false":x.get("selected_flag_FALSE",0),
           "selected_mixed":x.get("selected_flag_CONFLICTING_SELECTED_KEYFRAME_FLAGS",0),
           "original_archive_parts":len(a["original_13_archive_SHA256"])
          },sort_keys=True))
          PY
      - name: Publish only private actor lineage sidecar and derived receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          OUT="gamepulse/fusion/materialized/igp_per_actor_G1_20261028/$GID.jsonl.gz"
          QA="gamepulse/fusion/qa/igp_progress_20261028/igp_original_per_actor_G1_${GID}_v1.json"
          git config user.name "Game Pulse private source QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT" "$QA"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -qm "qa(gamepulse): original actor-level upstream interpolation keyframe lineage $GID"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_G1_SELECTED_ACTOR_LINEAGE_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
