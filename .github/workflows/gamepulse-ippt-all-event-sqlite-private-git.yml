name: IPPT PRIVATE Git only persisted original NBA all-event native XY SQLite with fresh clone SHA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-all-event-sqlite-private-git.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  private-sqlite-git-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: bfa7efcc496a96af9998b48f1f79c7a9bbc3e3a1
      NEW_PRIVATE_DATA_BRANCH: data/ippt-all-pbp-native-xy-36-20261028-v1
      DB_PATH: gamepulse/fusion/materialized/ippt_all_pbp_native_xy_36_v1/nba_pbp_original_native_xy.sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy guard / no-overwrite private Git branch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          if git ls-remote --exit-code --heads "https://github.com/$PRIVATE_REPO.git" "$NEW_PRIVATE_DATA_BRANCH" >/dev/null 2>&1; then
            echo "IPPT_PRIVATE_DATA_BRANCH_EXISTS_REFUSE_TO_OVERWRITE"
            exit 1
          fi
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Build independently accepted 36-game exact source SQLite in PRIVATE checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -q gamepulse/fusion/test_igp_ippt_all_pbp_event_native_sqlite_2026.py
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_event_native_sqlite_2026.py \
             --root . --out "$IPPT_ROOT/$DB_PATH" > "$RUNNER_TEMP/ippt_db_qa_metadata_only.log"
          python3 - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          root=Path(os.environ["IPPT_ROOT"])
          p=root/os.environ["DB_PATH"]
          with sqlite3.connect(p) as db:
            counts={t:db.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                    for t in ("pbp_event","native_frame","original_actor")}
            assert counts=={"pbp_event":22314,"native_frame":10623,"original_actor":110839}
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE native_utc_ms IS NOT NULL").fetchone()[0]==21653
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={"schema":"IPPT_36GAME_ALL_PBP_ORIGINAL_NATIVE_SQLITE_PRIVATE_V1",
            "source_code_commit_SHA":os.environ["EXPECTED_PRIVATE_SHA"],
            "original_canonical_PBP_chains_preserved":7474,
            "original_native_full_source_timestamps_preserved":1203986,
            "PBP_actions":counts["pbp_event"],
            "deduplicated_PBP_selected_native_frames":counts["native_frame"],
            "same_native_original_ball_player_observations":counts["original_actor"],
            "original_nearby_source_event_rows_500ms":21653,
            "sha256_private_SQLite":digest,
            "physical_action_time_independently_certified":False,
            "scorer_UTC_is_not_event_physical_instant":True,
            "original_source_and_frozen_PR776_unchanged":True}
          out=p.with_name("source_and_sqlite_sha_manifest.json")
          out.write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print("IPPT_PRIVATE_GIT_BRANCH_LOCAL_DB_COUNTS_VERIFIED",counts)
          PY
      - name: New PRIVATE data branch only; no force, no public artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          git config user.name 'Integrated Pulse QA'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$NEW_PRIVATE_DATA_BRANCH"
          git add "$DB_PATH" "$(dirname "$DB_PATH")/source_and_sqlite_sha_manifest.json"
          git commit -qm "data(ippt): source-pinned all22k NBA PBP event native XY SQLite private only"
          git push -q origin "HEAD:refs/heads/$NEW_PRIVATE_DATA_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/ippt_private_data_commit_sha.txt"
          echo "IPPT_PRIVATE_GIT_SOURCE_XY_DATA_BRANCH_WRITTEN_NO_PUBLIC_COORDINATES"
      - name: Independent PRIVATE git clone original licensed SQLite SHA readback
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$NEW_PRIVATE_DATA_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/ippt-dbreview"
          git -C "$RUNNER_TEMP/ippt-dbreview" sparse-checkout set "$(dirname "$DB_PATH")"
          python3 - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ippt-dbreview"
          p=root/os.environ["DB_PATH"]
          m=json.loads(p.with_name("source_and_sqlite_sha_manifest.json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["sha256_private_SQLite"]
          assert m["source_code_commit_SHA"]==os.environ["EXPECTED_PRIVATE_SHA"]
          with sqlite3.connect(p) as db:
            got=[db.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                 for t in ("pbp_event","native_frame","original_actor")]
            assert got==[22314,10623,110839],got
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
          print("IPPT_PRIVATE_GIT_DATA_BRANCH_FRESH_CLONE_SHA_AND_INDEX_COUNTS_PASS")
          PY
      - name: Publish private branch metadata ONLY, delete ephemeral licensed SQLite
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          p=root/"ippt_private_data_commit_sha.txt"
          report={"github_run_id":os.environ["GITHUB_RUN_ID"],
             "prior_job_status":os.environ["QA_JOB_RESULT"],
             "private_repository":os.environ["PRIVATE_REPO"],
             "private_data_branch":os.environ["NEW_PRIVATE_DATA_BRANCH"],
             "source_code_SHA":os.environ["EXPECTED_PRIVATE_SHA"],
             "private_data_commit_SHA":p.read_text().strip() if p.exists() else None,
             "original_NBA_XYZ_never_published_publicly":True,
             "physical_event_time_remains_uncertified":True}
          (root/"ippt_private_git_qa_note.md").write_text(
             "Only PRIVATE Git commit can contain original NBA actor/ball XY. No public original coordinates.\n\n~~~json\n"+
             json.dumps(report,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/igp-private" "$RUNNER_TEMP/ippt-dbreview"
          gh issue comment 131 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_private_git_qa_note.md"

# Licensed NBA original SQLite solely private source repo branch. No public file or artifact.
