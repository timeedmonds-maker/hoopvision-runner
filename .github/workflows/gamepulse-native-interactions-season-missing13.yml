name: Integrated Pulse native SDK to official PBP missing-13 source fusion
# Respect NBA one-of-one technical FT scoring outside current possession owner.
# Public/free GitHub-hosted CPU; all SDK archives, individual player and
# possession records, coordinates, receipts and query outputs stay private 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-native-interactions-season-missing13.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-pulse-new13-source-native-touch-fusion
  cancel-in-progress: false
jobs:
  game-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        game:
          - '0022600007'
          - '0022600008'
          - '0022600009'
          - '0022600094'
          - '0022600095'
          - '0022600096'
          - '0022600097'
          - '0022600098'
          - '0022600099'
          - '0022600100'
          - '0022600101'
          - '0022600102'
          - '0022600103'
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce no licensed material in the public GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_AUTH_MISSING'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch current private fusion code, official source and tests
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-fusion"
          mkdir -p "$ROOT"/{sdk,tests}
          for mod in gamepulse_ball_control.py gamepulse_ball_dynamics.py interaction_fusion_2026.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$mod?ref=main" --jq .content |
              base64 -d > "$ROOT/$mod"
          done
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_interaction_fusion_2026.py?ref=main' --jq .content |
            base64 -d > "$ROOT/tests/test_interaction_fusion_2026.py"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/$GAME_ID.json?ref=main" --jq .content |
            base64 -d > "$ROOT/pbp.json"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/$GAME_ID.json?ref=main" --jq .content |
            base64 -d > "$ROOT/view.json"
          python3 -m py_compile "$ROOT/gamepulse_ball_control.py" "$ROOT/gamepulse_ball_dynamics.py" "$ROOT/interaction_fusion_2026.py"
          PYTHONPATH="$ROOT" python3 -m unittest discover -s "$ROOT/tests" -p test_interaction_fusion_2026.py
      - name: Download only the original SHA-verified private game SDK parts
        id: archives
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-fusion"
          TAG="gamepulse-sdk-$GAME_ID"
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/release.json"
          gh release download "$TAG" --repo timeedmonds-maker/104 \
            --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk" --clobber >/dev/null
          python3 - <<'PY'
          import os,hashlib,json,re
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"private-fusion"
          expected={a["name"]:a.get("digest") for a in json.loads((r/"release.json").read_text())["assets"]
                    if re.fullmatch(r"sdk-part-\d{2}\.tar\.gz",a["name"])}
          found=list((r/"sdk").glob("sdk-part-??.tar.gz"))
          assert len(expected)==len(found)==13,"SOURCE_13_PART_COVERAGE_FAILURE"
          for f in found:
              assert expected[f.name]=="sha256:"+hashlib.sha256(f.read_bytes()).hexdigest(),"SOURCE_SHA_FAILURE"
          print("PRIVATE_ORIGINAL_GAME_SOURCE_SHA_CONFIRMED")
          PY
      - name: Fuse full original native touches with NBA official action and Blueprint exact IDs
        id: fusion
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-fusion"
          cd "$ROOT"
          if [ "$GAME_ID" = '0022600091' ]; then
            QUERY_ARGS=(--query-players 201142,1627832,1630578)
          else
            QUERY_ARGS=()
          fi
          python3 interaction_fusion_2026.py --sdk-dir sdk --pbp pbp.json --view view.json \
            --out interactions.json "${QUERY_ARGS[@]}"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"private-fusion"
          x=json.loads((r/"interactions.json").read_text())
          assert x["schema"]=="gamepulse.interaction-event-possession-fusion.v1"
          assert x["reconciliation"]["nba_team_score_reconciled"] is True
          assert x["source_event_counts"]["native_unique_touch_labels"]>0
          assert all(not p["certified_complete_possession"] for p in x["possessions"])
          assert sum(x["teams"].values())==len(x["possessions"])
          assert set(x["teams"])=={v["team"] for v in x["official_final"].values()}
          print("PRIVATE_SOURCE_FUSION_ACCEPTED_NO_UNVERIFIED_CERTIFICATION")
          PY
      - name: Persist only to private canonical 104 with post-write SHA check
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"private-fusion"
          game=os.environ["GAME_ID"]
          data=(r/"interactions.json").read_bytes()
          target="repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/"+game+".json"
          import time
          # GitHub Contents PUT updates the same git branch even when game
          # paths differ. Parallel fanout requires re-reading SHA and retrying
          # 409/422 ref-update races rather than losing finished CPU results.
          for trial in range(15):
              old=subprocess.run(["gh","api",target],capture_output=True,text=True)
              payload={"branch":"main",
                       "message":"data(gamepulse): retain native-tracking/PBP/Blueprint fusion for game "+game,
                       "content":base64.b64encode(data).decode()}
              if old.returncode==0:
                  payload["sha"]=json.loads(old.stdout)["sha"]
              elif "Not Found" not in old.stderr and "404" not in old.stderr:
                  if any(x in old.stderr for x in ("429","500","502","503")):
                      time.sleep(min(2+trial*2,25));continue
                  raise RuntimeError("PRIVATE_DESTINATION_READ_FAILED")
              put=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                                 input=json.dumps(payload),capture_output=True,text=True)
              if put.returncode==0:break
              if not any(x in put.stderr for x in ("409","422","429","500","502","503")):
                  raise RuntimeError("PRIVATE_DESTINATION_NONRETRYABLE_WRITE_FAILURE")
              time.sleep(min(2+trial*3,30)+(int(game[-3:])%7)/7)
          else:
              raise RuntimeError("PRIVATE_DESTINATION_WRITE_RETRIES_EXHAUSTED")
          actual=base64.b64decode(subprocess.check_output(["gh","api",target,"--jq",".content"]))
          assert hashlib.sha256(data).digest()==hashlib.sha256(actual).digest()
          print("PRIVATE_FUSION_INDEX_SHA_VERIFIED")
          PY
      - name: Preserve private per-game execution receipt
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          JOB_RESULT: ${{ job.status }}
          SOURCE_STEP: ${{ steps.source.outcome }}
          ARCHIVE_STEP: ${{ steps.archives.outcome }}
          FUSION_STEP: ${{ steps.fusion.outcome }}
          PUBLISH_STEP: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then exit 0; fi
          python3 - <<'PY'
          import base64,json,os,subprocess
          gid=os.environ["GAME_ID"]
          status={"schema":"gamepulse.private-14game-fusion-stage-receipt.v1",
             "game_id":gid,"run_id":os.environ["RUN_ID"],
             "job_status":os.environ["JOB_RESULT"],
             "stages":{name:os.environ[name] for name in
               ("SOURCE_STEP","ARCHIVE_STEP","FUSION_STEP","PUBLISH_STEP")}}
          target="repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/status/"+gid+".json"
          old=subprocess.run(["gh","api",target],capture_output=True,text=True)
          payload={"branch":"main","message":"qa(gamepulse): record private source-fusion acceptance stages "+gid,
                   "content":base64.b64encode(json.dumps(status,sort_keys=True).encode()).decode()}
          if old.returncode==0:payload["sha"]=json.loads(old.stdout)["sha"]
          elif "Not Found" not in old.stderr and "404" not in old.stderr:
              raise RuntimeError("PRIVATE_ACCEPTANCE_RECEIPT_READ_FAILED")
          result=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                               input=json.dumps(payload),capture_output=True,text=True)
          if result.returncode:raise RuntimeError("PRIVATE_ACCEPTANCE_RECEIPT_WRITE_FAILED")
          print("PRIVATE_EXECUTION_STAGE_RECEIPT_RECORDED")
          PY
      - name: No data in public Actions outputs
        if: always()
        run: echo 'Only generic acceptance status is public; all source records remain private 104.' >> "$GITHUB_STEP_SUMMARY"
  aggregate:
    needs: [game-fusion]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public repository and aggregate private season manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          python3 - <<'PY'
          import base64,hashlib,json,subprocess,time
          repo="timeedmonds-maker/104"
          target="repos/"+repo+"/contents/gamepulse/fusion/index/interactions/index-2026-27.json"
          frozen="repos/"+repo+"/contents/gamepulse/fusion/index/interactions/index.json"
          expected=("0022600001","0022600002","0022600003","0022600004","0022600005",
                    "0022600006","0022600007","0022600008","0022600009",
                    "0022600085","0022600086","0022600087","0022600088","0022600089",
                    "0022600090","0022600091","0022600092","0022600093",
                    "0022600094","0022600095","0022600096","0022600097",
                    "0022600098","0022600099","0022600100","0022600101",
                    "0022600102","0022600103")
          def req(*args,input=None):
              r=subprocess.run(["gh","api",*args],input=input,stdout=subprocess.PIPE,
                               stderr=subprocess.PIPE,text=True,timeout=100)
              if r.returncode:
                  raise RuntimeError("PRIVATE_GITHUB_READ_WRITE_FAILED")
              return json.loads(r.stdout)
          def read(path):
              v=req(path)
              b=base64.b64decode(v["content"])
              return json.loads(b),b,v["sha"]
          source,_,_=read(frozen)
          assert source["game_count"]==14
          assert set(source["games"])<=set(expected)
          base,_,_=read(target)
          assert set(base["games"])<=set(expected)
          assert all(base["games"].get(g)==v for g,v in source["games"].items()),"FROZEN_ORIGINAL14_MUTATED"
          records={}
          for gid in expected:
              row,raw,_=read("repos/"+repo+"/contents/gamepulse/fusion/index/interactions/"+gid+".json")
              assert row["game_id"]==gid and row["reconciliation"]["nba_team_score_reconciled"]
              assert row["certified_touch_possessions"]==0
              assert len(row["possessions"])>0
              count=row["source_event_counts"]["native_unique_touch_labels"]
              assert count>0
              records[gid]={"sha256":hashlib.sha256(raw).hexdigest(),
                  "source_native_touch_labels":count,
                  "team_action_runs":len(row["possessions"]),
                  "nba_scores_reconciled":True}
              if gid in source["games"]:
                  assert records[gid]==source["games"][gid],"ORIGINAL14_SOURCE_CHANGED"
              if gid in base["games"]:
                  assert records[gid]==base["games"][gid],"PREVIOUS_SEASON_NATIVE_TOUCH_SOURCE_CHANGED"
          updated=dict(base)
          updated["game_count"]=len(expected)
          updated["games"]={g:records[g] for g in sorted(records)}
          updated["status"]="SOURCE_NATIVE_TOUCH_PBP_BLUEPRINT_28_GAME_SEARCH_ACTION_RUN_GRAIN"
          updated["certified_full_touch_possessions"]=0
          updated["original_14_preserved"]=True
          updated["notice"]="28 source-native lastTouch indexes joined to official NBA action runs, NOT individually certified physical possessions."
          blob=(json.dumps(updated,indent=2,sort_keys=True)+"\n").encode()
          for attempt in range(12):
              _,old,old_sha=read(target)
              if old==blob:
                  print("PRIVATE_28_GAME_NATIVE_TOUCH_INDEX_ALREADY_COMPLETE")
                  raise SystemExit(0)
              payload={"branch":"main","message":"data(gamepulse): index all 28 original SDK touch and official PBP runs",
                       "content":base64.b64encode(blob).decode(),"sha":old_sha}
              p=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                               input=json.dumps(payload),capture_output=True,text=True,timeout=100)
              if p.returncode==0:
                  new_sha=json.loads(p.stdout)["content"]["sha"]
                  saved=req("repos/"+repo+"/git/blobs/"+new_sha)
                  restored=base64.b64decode(saved["content"])
                  assert restored==blob and hashlib.sha256(restored).digest()==hashlib.sha256(blob).digest()
                  print("PRIVATE_28_GAME_NATIVE_TOUCH_INDEX_SHA_VERIFIED",
                        "games",len(expected),"runs",sum(v["team_action_runs"] for v in records.values()))
                  break
              time.sleep(attempt+1)
          else:raise RuntimeError("PRIVATE_SEASON_MANIFEST_PUBLISH_CONFLICT")
          PY
      - name: Final source confidentiality notice
        if: always()
        run: echo 'All individual tracking and PBP source records are private in 104; free CPU public runner only.' >> "$GITHUB_STEP_SUMMARY"
