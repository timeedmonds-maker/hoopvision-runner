name: IGP direct private SDK release asset verified one-part probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-private-sdk-asset-direct-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and authenticated direct asset transfer integrity probe
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_SDK_ACCESS_NOT_AUTHORIZED; exit 3; }
          # Pinned private NBA game 0022600104, original sdk-part-00.tar.gz:
          # id, byte size and SHA are sourced from its original GitHub private release.
          URL='https://api.github.com/repos/timeedmonds-maker/104/releases/assets/673921267'
          EXPECTED_SHA='12b4368ce13273171cfcfa2d37f4b0946cc4e3145623e9120f2180124feaaa74'
          ASSET="$RUNNER_TEMP/igp-private-sdk-part-00.tar.gz"
          if ! curl -fLsS --connect-timeout 15 --max-time 120 --retry 1 \
                  --proto '=https' --proto-redir '=https' \
                  -H 'Accept: application/octet-stream' \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "$URL" -o "$ASSET"; then
            echo IGP_RELEASE_ASSET_DOWNLOAD_UNAVAILABLE_READ_ONLY
            exit 9
          fi
          test "$(stat -c%s "$ASSET")" -eq 627889
          echo "$EXPECTED_SHA  $ASSET" | sha256sum -c - >/dev/null
          gzip -t "$ASSET"
          echo IGP_ORIGINAL_PRIVATE_SDK_RELEASE_PART_VERIFIED game=0022600104 part=00 bytes=627889
          rm -f "$ASSET"
