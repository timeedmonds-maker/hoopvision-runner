name: Resolve 2025-26 HOU ATL Season Rosters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-hou-atl-season-rosters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roster:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official NBA team rosters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          teams={"HOU":1610612745,"ATL":1610612737}
          headers={
            "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
            "Referer":"https://www.nba.com/",
            "Origin":"https://www.nba.com",
            "Accept":"application/json, text/plain, */*",
            "Accept-Language":"en-US,en;q=0.9",
          }
          allout={}
          for abbr,tid in teams.items():
            q=urllib.parse.urlencode({"LeagueID":"00","Season":"2025-26","TeamID":tid})
            url="https://stats.nba.com/stats/commonteamroster?"+q
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read()
              data=json.loads(raw)
              open(f"out/{abbr.lower()}_raw.json","wb").write(raw)
              rs=data["resultSets"][0]
              rows=[dict(zip(rs["headers"],row)) for row in rs["rowSet"]]
              allout[abbr]=rows
              print(abbr,json.dumps([
                {"player_id":x.get("PLAYER_ID"),"name":x.get("PLAYER"),
                 "number":x.get("NUM"),"position":x.get("POSITION")}
                for x in rows
              ],indent=2))
            except Exception as e:
              allout[abbr]={"error":repr(e),"url":url}
              print(abbr,"ERROR",repr(e))
            time.sleep(1)
          open("out/rosters.json","w").write(json.dumps(allout,indent=2)+"\n")
          if any(isinstance(v,dict) and "error" in v for v in allout.values()):
            raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hou-atl-2025-26-rosters
          path: out/
          retention-days: 7
