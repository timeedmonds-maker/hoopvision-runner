name: Prepare Illinois 340-460 via Piped mirrors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-illinois-piped-340-460.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve same YouTube media through Piped mirrors
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          mkdir -p prepared
          video_id='R-CJIR4seAY'
          instances=(
            'https://pipedapi.kavin.rocks'
            'https://pipedapi.leptons.xyz'
            'https://pipedapi.nosebs.ru'
            'https://piped-api.privacy.com.de'
            'https://pipedapi.adminforge.de'
            'https://api.piped.yt'
            'https://pipedapi.drgns.space'
            'https://pipedapi.owo.si'
            'https://pipedapi.ducks.party'
            'https://piped-api.codespace.cz'
            'https://pipedapi.reallyaweso.me'
            'https://api.piped.private.coffee'
            'https://pipedapi.darkness.services'
            'https://pipedapi.orangenet.cc'
          )
          ok=''
          for api in "${instances[@]}"; do
            echo "TRY_INSTANCE=$api"
            if ! curl -fsSL --connect-timeout 8 --max-time 25 "$api/streams/$video_id" -o /tmp/streams.json; then
              continue
            fi
            if ! jq -e '.videoStreams and .audioStreams' /tmp/streams.json >/dev/null; then
              continue
            fi
            title="$(jq -r '.title // empty' /tmp/streams.json)"
            echo "TITLE=$title"
            vurl="$(jq -r '
              [.videoStreams[]
                | select((.videoOnly // false) == true)
                | select((.height // 0) <= 1080)
                | select(((.codec // "") | test("avc1|h264";"i")) or ((.format // "") | test("MPEG_4|mp4";"i")))
              ]
              | sort_by(.height // 0, .bitrate // 0)
              | last
              | .url // empty
            ' /tmp/streams.json)"
            if test -z "$vurl"; then
              vurl="$(jq -r '[.videoStreams[] | select((.height // 0) <= 1080)] | sort_by(.height // 0,.bitrate // 0) | last | .url // empty' /tmp/streams.json)"
            fi
            aurl="$(jq -r '[.audioStreams[]] | sort_by(.bitrate // 0) | last | .url // empty' /tmp/streams.json)"
            test -n "$vurl" || continue
            test -n "$aurl" || continue
            echo "SELECTED_INSTANCE=$api"
            echo "$api" > prepared/piped_instance.txt
            cp /tmp/streams.json prepared/piped_stream_metadata.json
            printf '%s' "$vurl" > /tmp/vurl
            printf '%s' "$aurl" > /tmp/aurl
            ok=1
            break
          done
          test -n "$ok" || { echo "No Piped instance resolved the video" >&2; exit 3; }

      - name: Cut exact reviewed 5m40s-7m40s interval
        shell: bash
        run: |
          set -euo pipefail
          vurl="$(cat /tmp/vurl)"
          aurl="$(cat /tmp/aurl)"
          ffmpeg -hide_banner -loglevel warning -y \
            -ss 340 -i "$vurl" \
            -ss 340 -i "$aurl" \
            -t 120 \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset fast -crf 15 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            prepared/illinois_houston_youtube_340_460.mp4

      - name: Verify exact output and write manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p=Path('prepared/illinois_houston_youtube_340_460.mp4')
          probe=json.loads(subprocess.check_output([
            'ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)
          ],text=True))
          v=next(x for x in probe['streams'] if x.get('codec_type')=='video')
          a=[x for x in probe['streams'] if x.get('codec_type')=='audio']
          duration=float(probe['format']['duration'])
          if not (119.5 <= duration <= 120.5):
              raise SystemExit(f'unexpected duration: {duration}')
          h=hashlib.sha256()
          with p.open('rb') as fh:
              for b in iter(lambda:fh.read(4*1024*1024),b''): h.update(b)
          meta={
            'schema':'courtcoder.public-source-prep.v1',
            'fixture_id':'illinois-houston-youtube-340-460',
            'source_video_id':'R-CJIR4seAY',
            'source_video_start_s':340,
            'source_video_end_s':460,
            'transport':'piped_mirror_of_youtube_media',
            'piped_instance':Path('prepared/piped_instance.txt').read_text().strip(),
            'duration_s':duration,
            'width':int(v['width']),
            'height':int(v['height']),
            'avg_frame_rate':v.get('avg_frame_rate'),
            'video_codec':v.get('codec_name'),
            'audio_stream_count':len(a),
            'size_bytes':p.stat().st_size,
            'sha256':h.hexdigest(),
            'review_note':'Product-owner selected uninterrupted possessions; short replay at end intentionally retained.'
          }
          Path('prepared/source_manifest.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: illinois-houston-youtube-340-460-piped
          path: |
            prepared/illinois_houston_youtube_340_460.mp4
            prepared/source_manifest.json
            prepared/piped_instance.txt
            prepared/piped_stream_metadata.json
          if-no-files-found: error
          retention-days: 7
