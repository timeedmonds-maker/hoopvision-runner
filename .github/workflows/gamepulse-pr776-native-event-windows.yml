name: Integrated Pulse PR776 preserved-source native NBA windows v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-native-event-windows.yml','tools/public_content_guard.py']
permissions:
  contents: read
concurrency:
  group: pr776-native-event-window-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and private SHA-source Git checkout
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-window" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-window"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-window" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
              "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/window-private"
          git -C "$RUNNER_TEMP/window-private" sparse-checkout set gamepulse/fusion
          echo "ROOT=$RUNNER_TEMP/window-private" >> "$GITHUB_ENV"
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Unit-test strict and screened NBA native extraction intervals
        run: |
          set -euo pipefail
          cd "$ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v \
            -s gamepulse/fusion/tests -p 'test_build_episode_native_extraction_windows_2026.py'
      - name: Build 28 observed-source clock interval indexes from SHA-linked originals
        run: |
          set -euo pipefail
          cd "$ROOT"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from build_episode_native_extraction_windows_2026 import build
          def read(path):
            raw=Path(path).read_bytes()
            return json.loads(raw),hashlib.sha256(raw).hexdigest()
          root=Path('gamepulse/fusion')
          lu_idx,_=read(root/'official_lineup_clock/index.json')
          episode_idx,_=read(root/'materialized/nba_episode_tracking_pr776_20261025/index.json')
          shadow_idx,_=read(root/'qa/shadow_screened_clock_28game_20261026.json')
          ids=sorted(shadow_idx['games'])
          assert len(lu_idx['games'])==36 and len(episode_idx['games'])==36
          assert len(ids)==28
          dst=root/'materialized/native_episode_windows_v2_pr776_20261026'
          game_dir=dst/'games'
          game_dir.mkdir(parents=True,exist_ok=True)
          result={'schema':'gamepulse.nba-event-native-source-clock-window-season.v1',
                  'source_games':28,'official_nba_games':36,
                  'missing_native_source_qa_game_count':8,
                  'all_source_tracking_coordinates_materialized':False,
                  'independent_clock_validation_complete':False,
                  'physical_possessions_certified':0,
                  'games':{},'totals':{}}
          totals={'strict_hoop_brackets':0,'research_shadow_brackets':0,
                  'strict_candidate_clock_ms':0,
                  'shadow_additional_candidate_clock_ms':0,
                  'qualifying_native_event_windows':0,
                  'original_native_qa_episodes_retained':0}
          for gid in ids:
            pa=root/'qa/auto_physics'/gid[:8]/(gid+'.json')
            pl=root/lu_idx['games'][gid]['path'].removeprefix('gamepulse/fusion/')
            pe=root/'materialized/nba_episode_tracking_pr776_20261025'/episode_idx['games'][gid]['path']
            pp=root/'official_pbp_timing/games'/(gid+'.json')
            a,sha_a=read(pa);l,sha_l=read(pl);e,sha_e=read(pe);p,sha_p=read(pp)
            assert sha_l==lu_idx['games'][gid]['sha256']
            assert sha_e==episode_idx['games'][gid]['sha256']
            shadow=shadow_idx['games'][gid]
            assert shadow['source_sha256']['auto_qa']==sha_a
            assert shadow['source_sha256']['official_pbp']==sha_p
            doc=build(gid,a,l,e,shadow=shadow)
            doc['source_sha256']={'native_hoop_anchors':sha_a,
                'official_nba_lineup':sha_l,'nba_source_field_episodes':sha_e,
                'official_nba_pbp':sha_p}
            report=game_dir/(gid+'.json')
            raw=(json.dumps(doc,indent=2,sort_keys=True)+'\n').encode()
            if report.exists():
                if report.read_bytes()!=raw:
                    raise ValueError('EXISTING_NATIVE_WINDOW_SOURCE_CONFLICT:'+gid)
            else:
                report.write_bytes(raw)
            result['games'][gid]={
               'path':'games/'+gid+'.json','sha256':hashlib.sha256(raw).hexdigest(),
               'candidate_episodes':doc['nba_source_field_episodes_with_native_window_candidates'],
               'strict_hoop_brackets':doc['strict_hoop_brackets'],
               'shadow_brackets':doc['research_shadow_brackets'],
               'native_extraction_windows':doc['qualifying_native_event_windows']}
            srcqa_path=root/'qa'/('official_native_episode_xyz_bridge_'+gid+'_20261026.json')
            srcqa,_=read(srcqa_path)
            assert srcqa['input_sha256']['official_lineup']==sha_l
            frozen_eps=set(srcqa['source_episode_tracking_qa'])
            present_eps={r['episode_id'] for r in doc['windows']}
            missing=frozen_eps-present_eps
            if missing:
                raise ValueError('PREVIOUSLY_ACCEPTED_NATIVE_EVENT_EPISODES_LOST:'+gid+':'+','.join(sorted(missing)))
            totals['original_native_qa_episodes_retained']+=len(frozen_eps)
            for k in totals:
                if k!='original_native_qa_episodes_retained':
                    totals[k]+=doc[k]
          assert totals['original_native_qa_episodes_retained']==532
          assert totals['strict_hoop_brackets']==407
          assert totals['research_shadow_brackets']==51
          assert totals['strict_candidate_clock_ms']==7103400
          assert totals['shadow_additional_candidate_clock_ms']==2319100
          assert len(result['games'])==28
          result['totals']=totals
          (dst/'index.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('PRIVATE_NBA_NATIVE_EVENT_EXTRACTION_WINDOWS_ACCEPTED',json.dumps({
            'games':28,'source_episodes_with_windows':sum(x['candidate_episodes'] for x in result['games'].values()),
            'source_clock_windows':totals['qualifying_native_event_windows'],
            'strict_source_brackets':totals['strict_hoop_brackets'],
            'shadow_research_brackets':totals['research_shadow_brackets'],
            'real_xyz_frame_counts_inferred':False},sort_keys=True))
          PY
      - name: Commit private native time window index with source SHA checks
        run: |
          set -euo pipefail
          cd "$ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add gamepulse/fusion/materialized/native_episode_windows_v2_pr776_20261026/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo PRIVATE_ORIGINAL_CLOCK_WINDOW_INDEX_ALREADY_CURRENT
          else
            git commit -qm "data(gamepulse): 28-game SHA-linked strict and shadow NBA native extraction windows"
            git push -q origin "HEAD:$BRANCH"
            echo PRIVATE_ORIGINAL_CLOCK_WINDOW_INDEX_COMMITTED
          fi
