name: IGP compare original licensed positions programme against absent companion events
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-0006-companion-original-retry.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-control:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - gid: '0022600006'
            tipoff: '2026-10-22T23:00:00Z'
          - gid: '0022600086'
            tipoff: '2026-10-21T23:00:00Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NBA_GAME_ID: ${{ matrix.gid }}
      NBA_TIPOFF_UTC: ${{ matrix.tipoff }}
      IGP_SDK_SOURCE_VARIANT: positions
      IGP_SDK_INIT_TIMEOUT_MS: '22000'
      IGP_PRIVATE_CAPTURE_DIR: /tmp/igp-app-controls
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify original NBA programme source controls through SDK without private event publication
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$IGP_PRIVATE_CAPTURE_DIR"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          (cd tools/licensed_feed && npm install --ignore-scripts --no-audit --no-fund --silent)
          node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/controls.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["IGP_PRIVATE_CAPTURE_DIR"])/"companion_probe_receipt.json").read_bytes())
          assert r["game_id"]==os.environ["NBA_GAME_ID"]
          assert r["app_program_variant"]=="positions"
          assert not r["authentication_bypass_attempted"]
          assert not r["raw_29joint_pose_60hz_observed"]
          print("IGP_ORIGINAL_SDK_POSITIONS_CONTROL",json.dumps({
             "game_id":r["game_id"],"app_initialized":r["initialization_result"],
             "original_source_status":r["status"],
             "native_slot_200":r["observed_200_slot_responses"],
             "first_party_program_response_categories":r.get("first_party_program_response_categories",{}),
             "browser_page_errors":r.get("sdk_browser_page_errors",0)},sort_keys=True))
          PY
