# Reviewed public CPU orchestrator only. All licensed NBA data/UTC details stay private.
name: IGP v3.2 frozen71 clock disagreement source triage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-71-clock-disagreement-triage.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-71-source-clock-disagreements
  cancel-in-progress: false
jobs:
  exact-original-all71:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-0146-app-clock-stoppage-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SHA source and unit-tested clock-stop triage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
             https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_71_clock_conflict_triage_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_71_clock_conflict_triage_v1.py'
          echo IGP_CLOCK_SOURCEFREE_TESTS_PASS
      - name: Game0146 then full original 71game strict 10Hz denominator preservation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          for mode in sample season; do
            args=()
            if test "$mode" = sample; then args=(--game-id 0022600146); fi
            python3 gamepulse/fusion/igp_v32_71_clock_conflict_triage_v1.py \
              --root . "${args[@]}" \
              --out "$RUNNER_TEMP/igp-clock-triage-$mode.json" \
              >"$RUNNER_TEMP/igp-clock-triage-$mode.log" 2>&1 || {
                 echo IGP_ORIGINAL_CLOCK_TRIAGE_FAILED_SCOPE_"$mode"
                 python3 - "$mode" <<'PY'
          import sys,os,re
          from pathlib import Path
          a=(Path(os.environ["RUNNER_TEMP"])/("igp-clock-triage-"+sys.argv[1]+".log")).read_text(errors="replace").splitlines()
          s=next((x for x in reversed(a) if re.match(r"^(?:AssertionError|ValueError|KeyError|TypeError|FileNotFoundError):",x)),None)
          if s:
              name,_,detail=s.partition(":")
              code=detail.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_CLOCK_PRIVATE_FAILURE",name,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_CLOCK_PRIVATE_FAILURE UNCLASSIFIED")
          PY
                 exit 41
              }
          done
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((root/"igp-clock-triage-sample.json").read_text())
          b=json.loads((root/"igp-clock-triage-season.json").read_text())
          assert a["scope_games"]==1 and b["scope_games"]==71
          assert a["counts"]["original_native_conflicts"]==19
          assert b["counts"]["original_native_conflicts"]==1410
          assert b["counts"]["fixed_S1_10hz_denominator"]==1159651
          assert b["counts"]["original_source_native_timestamps"]==2376002
          assert b["counts"]["companion_games"]==64
          assert b["accepted_default_or_P2B_10hz_scenes_changed"] is False
          print("IGP_CLOCK_ORIGINAL_SOURCE_ALL71_PASSED",json.dumps(b["counts"],sort_keys=True))
          PY
      - name: Commit immutable full71 source clock triage privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_71_p2b_companion_PBP_clock_disagreements_triage_v1.json
          mkdir -p "$(dirname "$dest")"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/igp-clock-triage-season.json" "$dest"
            echo IGP_CLOCK_QA_ALREADY_VERIFIED
            exit 0
          fi
          cp "$RUNNER_TEMP/igp-clock-triage-season.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): original 71game PBP-companion 1410 native clock disputes and immutable strict S1 10Hz denominator'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_CLOCK_SOURCE_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
