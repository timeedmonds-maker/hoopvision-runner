name: IGP P3 handler eight-game source research acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-handler-original-source-acceptance-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-handler-source-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: b403b0b9ac1e00b194a73c0054ad5aa10a46caa8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard source and pin same private original NBA QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Verify exact source accuracy, heldouts and no 68-game promotion
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_handler_source_acceptance_gate_v1.py'
          python3 gamepulse/fusion/igp_68_p3_handler_source_acceptance_gate_v1.py \
            --root . --output "$RUNNER_TEMP/p3-handler-accepted.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'p3-handler-accepted.json').read_bytes())
          assert q["status"]=="P3_HANDLER_PROXY_RESEARCH_FEATURE_ACCEPTED_WITHOUT_PRODUCT_PROMOTION"
          assert q["new_eight_external_source_targets"]==501
          assert q["new_eight_handler_eligible_source_targets"]==230
          assert q["new_accepted_complete_native_frames"]==0
          assert q["new_accepted_complete_10hz_samples"]==0
          assert q["model_promoted_to_query_or_default"] is False
          print("P3_HANDLER_SOURCE_RESEARCH_GATE_PASSED",json.dumps({
             "handler_p95_delta":q["handler_subgroup_p95_comparison"]["delta_p95_ft"],
             "all_p95_delta":q["full_population_p95_comparison"]["delta_p95_ft"],
             "accepted_complete_scene_gain":0},sort_keys=True))
          PY
      - name: Commit auditable research-only conclusion privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_handler_source_research_acceptance_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-handler-gate "origin/$BRANCH"
          cp "$RUNNER_TEMP/p3-handler-accepted.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): accept P3 handler research only, preserve all 68 original model numerators'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo P3_HANDLER_SOURCE_RESEARCH_ACCEPTANCE_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
