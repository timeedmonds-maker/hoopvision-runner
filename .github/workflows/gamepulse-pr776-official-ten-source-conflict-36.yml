name: PR776 36-game source-ten vs official NBA lineup conflict attribution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-official-ten-source-conflict-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-official-source-ten-conflict-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Approved private original XYZ source and public content guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH"             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free official strict NBA source conflict tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_source_ten_official_conflict_atlas_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests             -p 'test_igp_source_ten_official_conflict_atlas_2026.py' -v
      - name: Identify exact 447 source vs official NBA ten conflicts across 36 originals
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_source_ten_strict_official_conflict_attribution_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_source_ten_official_conflict_atlas_2026.py             --root . --out "$OUT" > "$RUNNER_TEMP/private-lineup-conflicts.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          c=x["strict_totals"]
          assert x["source_games"]==36
          assert sum(c.values())==412619 and c["CONFLICT"]==447
          assert x["NBA_official_lineup_retains_priority"]
          print("ORIGINAL_NBA_STRICT_SOURCE_TEN_DISAGREEMENT",
            json.dumps({"strict":c,"guards":x["source_guarded_high_strict"]},sort_keys=True))
          PY
      - name: Commit derived conflict QA privately, no coordinates or identities leaked
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_source_ten_strict_official_conflict_attribution_36_v1.json
          git config user.name "Game Pulse Free CPU Source QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): attribute NBA strict ten vs source-ten conflicts by substitution guard"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PR776_SOURCE_TEN_CONFLICTS_SHA_VERIFIED_PRIVATE
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
