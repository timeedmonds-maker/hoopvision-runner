name: PR776 first physical possession rebound contact source probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-oreb-control-stress.yml']
permissions: {contents: read}
concurrency:
  group: gamepulse-pr776-oreb-control-stress
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public boundary and hydrate private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-oreb" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *Password*) printf '%s\n' "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-oreb"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-oreb" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private-oreb"
          git -C "$RUNNER_TEMP/private-oreb" sparse-checkout set gamepulse/fusion
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$RUNNER_TEMP/private-oreb" >> "$GITHUB_ENV"
      - name: Check original rebounder and ball positions at candidate start
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_first_possession_rebound_contact_probe_2026.py
          python3 gamepulse/fusion/igp_first_possession_rebound_contact_probe_2026.py \
            --root . --out gamepulse/fusion/qa/igp_progress_20261027/first_possession_rebound_contact_0022600099_P3_C0129.json
      - name: Commit aggregate-only diagnostic to private PR
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add gamepulse/fusion/qa/igp_progress_20261027/first_possession_rebound_contact_0022600099_P3_C0129.json
          git diff --cached --check
          git commit -qm "qa(gamepulse): original rebounder-ball start evidence"
          for attempt in 1 2 3 4 5; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo REBOUNDER_ORIGINAL_SOURCE_CONTACT_QA_ACCEPTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
          done
          exit 1
