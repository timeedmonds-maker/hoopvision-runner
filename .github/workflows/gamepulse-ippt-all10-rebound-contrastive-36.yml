name: IPPT original ball/player all-official-ten rebounder rank against 9 competing players
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-all10-rebound-contrastive-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  all10-rebound-source-association:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: 3204cc54065e152b2d4dd3fff52ea2fbde3ce0ea
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard + SHA pinned private original NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Source-free no-label-leakage and competing original source actor regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_rebound_contrastive_actor_rank_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_rebound_contrastive_actor_rank_2026.py
      - name: Real two original NBA games all-ten ranked rebounder support
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_rebound_contrastive_actor_rank_2026.py \
            --root . --games 0022600009 0022600092
      - name: Full original NBA SHA 36-game all-rebounder contrastive rank cohort
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_rebound_contrastive_actor_rank_2026.py \
             --root . | tee "$RUNNER_TEMP/ippt_rebound_all10_qa.log"
          echo "IPPT_NBA_REBOUND_CONTRASTIVE_ALL36_SOURCE_RANK_PASS"
      - name: Publish only source-safe aggregate 36-game NBA actor ranking diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ippt_rebound_all10_qa.log"
          report={"github_run_id":os.environ["GITHUB_RUN_ID"],
                  "job_status":os.environ["QA_JOB_RESULT"],
                  "private_code_SHA":"3204cc54065e152b2d4dd3fff52ea2fbde3ce0ea"}
          if p.exists():
            lines=[s.partition(" ")[2] for s in p.read_text().splitlines()
               if s.startswith("IPPT_36GAME_REBOUND_CONTRASTIVE_ACTOR_SOURCE_BENCHMARK_QA ")]
            if len(lines)==1:
              z=json.loads(lines[0]);report.update({"games":z["games"],
                 "counts":z["counts"],"source_only_no_video_rebound_time_truth":True})
          (Path(os.environ["RUNNER_TEMP"])/"ippt_rebound_all10_qa_comment.md").write_text(
             "NBA PBP identity association to original simultaneous native ball/player positions. Source-only, not video verified time. No per-event player identities/timestamps/XYZ.\n\n~~~json\n"+
             json.dumps(report,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          gh issue comment 132 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_rebound_all10_qa_comment.md"

# Never publish licensed original NBA XYZ, per-event actor time or identifiers in public runner.
