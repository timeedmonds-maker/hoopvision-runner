name: Rockets Dallas first party NBA PBP and verified lineup recovery
# Fail closed: licensed original companion response and official NBA PBP stay private 104 only.
# A 403 HTTP response or nonofficial source is NOT accepted as official lineup truth.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-0022600021-official-source-recovery.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rockets-dallas-nba-official-recover
  cancel-in-progress: false
jobs:
  nba-official-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      TAG: gamepulse-firsthalf-sdk-0022600021
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard first party original source privacy
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          echo NBA_PRIMARY_SOURCE_RECOVERY_PRIVATE_ONLY
      - name: Fetch NBA licensed original events and primary official probe code
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/igp32-rockets-dallas-primary"
          mkdir -p "$ROOT"
          echo "ORIGINAL_ROOT=$ROOT" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$PRIVATE_REPO" \
            --pattern 'companion_original_sdk_response.json' --dir "$ROOT" --clobber
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/live/igp32_0021_official_source_recovery_probe.py?ref=main" \
            --jq '.content' | base64 -d > "$ROOT/official_recovery.py"
          python3 -m py_compile "$ROOT/official_recovery.py"
      - name: Probe first party NBA PBP box and original companion event family
        run: |
          set -euo pipefail
          python3 "$ORIGINAL_ROOT/official_recovery.py" --root "$ORIGINAL_ROOT" --probe
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["ORIGINAL_ROOT"])
          q=json.loads((root/"igp32_0021_official_source_recovery_probe.json").read_text())
          assert q["companion_original_sdk"]["available"]
          assert q["game_id"]=="0022600021"
          print("NBA_FIRSTPARTY_SOURCE_DIAGNOSTIC_COUNTS_VERIFIED")
          PY
      - name: Extract full official NBA event feed from first party game HTML
        run: |
          set -euo pipefail
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/live/igp32_0021_official_html_extract.py?ref=main" \
            --jq '.content' | base64 -d > "$ORIGINAL_ROOT/official_html_extract.py"
          python3 "$ORIGINAL_ROOT/official_html_extract.py" --root "$ORIGINAL_ROOT"
      - name: Recover official NBA starter roster from first party boxscore page
        run: |
          set -euo pipefail
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/live/igp32_0021_official_html_boxscore.py?ref=main" \
            --jq '.content' | base64 -d > "$ORIGINAL_ROOT/official_html_box.py"
          python3 "$ORIGINAL_ROOT/official_html_box.py" --root "$ORIGINAL_ROOT"
      - name: Preserve official NBA HTML provenance and extracted actions privately
        run: |
          set -euo pipefail
          for filename in official_nba_game_first_party_html.html official_nba_page_extracted_pbp.json igp32_0021_official_html_extract_qa.json official_nba_box_first_party_html.html official_nba_html_extracted_boxscore.json igp32_0021_official_box_html_qa.json; do
            if test -s "$ORIGINAL_ROOT/$filename"; then
              gh release upload "$TAG" "$ORIGINAL_ROOT/$filename" \
                --repo "$PRIVATE_REPO" --clobber
            fi
          done
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          f=Path(os.environ["ORIGINAL_ROOT"])/"igp32_0021_official_html_extract_qa.json"
          endpoint=("repos/"+os.environ["PRIVATE_REPO"]+
            "/contents/gamepulse/live/qa/igp32_0021_official_html_extract_qa.json")
          body={"branch":"main","message":"qa(igp): retain actual NBA first-party HTML event extraction",
                "content":base64.b64encode(f.read_bytes()).decode()}
          previous=subprocess.run(["gh","api",endpoint],text=True,capture_output=True)
          if previous.returncode==0:body["sha"]=json.loads(previous.stdout)["sha"]
          subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
             input=json.dumps(body),text=True,check=True,stdout=subprocess.DEVNULL)
          f=Path(os.environ["ORIGINAL_ROOT"])/"igp32_0021_official_box_html_qa.json"
          if f.exists():
              endpoint=("repos/"+os.environ["PRIVATE_REPO"]+
                "/contents/gamepulse/live/qa/igp32_0021_official_box_html_qa.json")
              body={"branch":"main","message":"qa(igp): original NBA game boxscore and five starters source evidence",
                    "content":base64.b64encode(f.read_bytes()).decode()}
              prev=subprocess.run(["gh","api",endpoint],text=True,capture_output=True)
              if prev.returncode==0:body["sha"]=json.loads(prev.stdout)["sha"]
              subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                 input=json.dumps(body),text=True,check=True,stdout=subprocess.DEVNULL)
          print("NBA_FIRST_PARTY_HTML_EVENT_QA_PRESERVED_PRIVATE")
          PY
      - name: Preserve first party source bodies and SHA receipts privately
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["ORIGINAL_ROOT"])
          qa=root/"igp32_0021_official_source_recovery_probe.json"
          report=json.loads(qa.read_bytes())
          for name,detail in report["official_source_probes"].items():
              f=detail.get("private_preserved_name")
              if f:
                  subprocess.run(["gh","release","upload",os.environ["TAG"],str(root/f),
                       "--repo",os.environ["PRIVATE_REPO"],"--clobber"],check=True)
          endpoint=("repos/"+os.environ["PRIVATE_REPO"]+
             "/contents/gamepulse/live/qa/igp32_0021_official_source_recovery_probe.json")
          request={"branch":"main","message":"qa(igp): Rockets Dallas NBA PBP CDN and licensed first party lineage diagnostics",
                   "content":base64.b64encode(qa.read_bytes()).decode()}
          previous=subprocess.run(["gh","api",endpoint],capture_output=True,text=True)
          if previous.returncode==0:request["sha"]=json.loads(previous.stdout)["sha"]
          subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],input=json.dumps(request),
                         text=True,check=True,stdout=subprocess.DEVNULL)
          print("NBA_ORIGINAL_OFFICIAL_PROBE_PRIVATE_QA_COMMITTED")
          PY
