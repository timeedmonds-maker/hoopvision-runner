name: Rockets Dallas first party NBA PBP and verified lineup recovery
# Fail closed: licensed original companion response and official NBA PBP stay private 104 only.
# A 403 HTTP response or nonofficial source is NOT accepted as official lineup truth.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-0022600021-official-source-recovery.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rockets-dallas-nba-official-recover
  cancel-in-progress: false
jobs:
  nba-official-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      TAG: gamepulse-firsthalf-sdk-0022600021
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard first party original source privacy
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          echo NBA_PRIMARY_SOURCE_RECOVERY_PRIVATE_ONLY
      - name: Fetch NBA licensed original events and primary official probe code
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/igp32-rockets-dallas-primary"
          mkdir -p "$ROOT"
          echo "ORIGINAL_ROOT=$ROOT" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$PRIVATE_REPO" \
            --pattern 'companion_original_sdk_response.json' --dir "$ROOT" --clobber
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/live/igp32_0021_official_source_recovery_probe.py?ref=main" \
            --jq '.content' | base64 -d > "$ROOT/official_recovery.py"
          python3 -m py_compile "$ROOT/official_recovery.py"
      - name: Probe first party NBA PBP box and original companion event family
        run: |
          set -euo pipefail
          python3 "$ORIGINAL_ROOT/official_recovery.py" --root "$ORIGINAL_ROOT" --probe
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["ORIGINAL_ROOT"])
          q=json.loads((root/"igp32_0021_official_source_recovery_probe.json").read_text())
          assert q["companion_original_sdk"]["available"]
          assert q["game_id"]=="0022600021"
          print("NBA_FIRSTPARTY_SOURCE_DIAGNOSTIC_COUNTS_VERIFIED")
          PY
      - name: Preserve first party source bodies and SHA receipts privately
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["ORIGINAL_ROOT"])
          qa=root/"igp32_0021_official_source_recovery_probe.json"
          report=json.loads(qa.read_bytes())
          for name,detail in report["official_source_probes"].items():
              f=detail.get("private_preserved_name")
              if f:
                  subprocess.run(["gh","release","upload",os.environ["TAG"],str(root/f),
                       "--repo",os.environ["PRIVATE_REPO"],"--clobber"],check=True)
          endpoint=("repos/"+os.environ["PRIVATE_REPO"]+
             "/contents/gamepulse/live/qa/igp32_0021_official_source_recovery_probe.json")
          request={"branch":"main","message":"qa(igp): Rockets Dallas NBA PBP CDN and licensed first party lineage diagnostics",
                   "content":base64.b64encode(qa.read_bytes()).decode()}
          previous=subprocess.run(["gh","api",endpoint],capture_output=True,text=True)
          if previous.returncode==0:request["sha"]=json.loads(previous.stdout)["sha"]
          subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],input=json.dumps(request),
                         text=True,check=True,stdout=subprocess.DEVNULL)
          print("NBA_ORIGINAL_OFFICIAL_PROBE_PRIVATE_QA_COMMITTED")
          PY
