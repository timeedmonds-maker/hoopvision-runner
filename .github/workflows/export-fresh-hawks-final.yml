name: Export Fresh Hawks Final
# export-trigger: math-fixed-pass-35550603599
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-fresh-hawks-final.yml'
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  RUN_ID: public-35550603599-1-d138b159123f
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Download final benchmark outputs
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="gs://$BUCKET/runs/all-player-replay/$RUN_ID"
          gcloud storage cp "$PREFIX/final/Hawks_Amen_to_Adams_All_Player_Labels_UHD.mp4" ./Hawks_Amen_to_Adams_All_Player_Labels_UHD.mp4
          gcloud storage cp "$PREFIX/all_player_identity/all_player_identity_qa.json" ./all_player_identity_qa.json
          gcloud storage cp "$PREFIX/all_player_identity/all_player_identity_assignments.csv" ./all_player_identity_assignments.csv
          gcloud storage cp "$PREFIX/sam31_replay/sam31_qa.json" ./sam31_replay_qa.json
          gcloud storage cp "$PREFIX/sam31_replay/continuity_links.csv" ./continuity_links.csv
          gcloud storage cp "$PREFIX/sam31_replay/continuity_paths.csv" ./continuity_paths.csv
          gcloud storage cp "$PREFIX/render_paths/named_render_paths.csv" ./named_render_paths.csv
          gcloud storage cp "$PREFIX/render_paths/named_render_paths_qa.json" ./named_render_paths_qa.json
          ls -lh Hawks_Amen_to_Adams_All_Player_Labels_UHD.mp4 all_player_identity_qa.json all_player_identity_assignments.csv sam31_replay_qa.json continuity_links.csv continuity_paths.csv named_render_paths.csv named_render_paths_qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-hawks-final-uhd-continuity
          path: |
            Hawks_Amen_to_Adams_All_Player_Labels_UHD.mp4
            all_player_identity_qa.json
            all_player_identity_assignments.csv
            sam31_replay_qa.json
            continuity_links.csv
            continuity_paths.csv
            named_render_paths.csv
            named_render_paths_qa.json
          compression-level: 0
          retention-days: 7
