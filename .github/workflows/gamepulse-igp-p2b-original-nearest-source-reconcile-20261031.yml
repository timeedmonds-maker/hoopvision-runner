# All original SHA-NBA action details stay inside private repo.
name: IGP P2B original source-time equidistant action reconciliation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-original-nearest-source-reconcile-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-native-all71-exhaustive-tie-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read private original action source QA, grade all ties
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_71_original_native_event_match_reconciliation_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_original_native_event_candidates_v2.py'
          python3 gamepulse/fusion/igp_v32_p2b_71_original_native_event_match_reconciliation_v1.py \
            --root . \
            --out gamepulse/fusion/qa/igp_v32/igp_v32_p2b_71_native_action_match_reconciliation_v1.json \
            >"$RUNNER_TEMP/igp-p2b-nearest-native.log" 2>&1 || {
              echo IGP_P2B_ORIGINAL_NATIVE_TIE_QA_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"igp-p2b-nearest-native.log").read_text(errors="replace").splitlines()
          t=next((z for z in reversed(lines) if re.match(r"^(?:ValueError|KeyError|TypeError|FileNotFoundError|ImportError|AssertionError):",z)),None)
          if t:
              typ,_,msg=t.partition(":");code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_PRIVATE_NATIVE_TIE_FAILURE",typ,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_PRIVATE_NATIVE_TIE_FAILURE UNCLASSIFIED")
          PY
              exit 41
            }
          grep 'IGP_71_ORIGINAL_NATIVE_ACTION_TIE_QA' "$RUNNER_TEMP/igp-p2b-nearest-native.log"
      - name: Commit source-grade provenance split privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_71_native_action_match_reconciliation_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'qa(igp): all71 source-near event UTC vs equidistant timestamp confidence'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P2B_71_ORIGINAL_NATIVE_TIE_RECEIPT_ACCEPTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
