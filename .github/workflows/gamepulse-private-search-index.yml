name: Game Pulse private team game player search refresh
# Licensed source and generated catalog remain PRIVATE. This public workflow
# does CPU-only execution and never uploads tracking data or search output here.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-private-search-index.yml'
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-private-search-index-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public-private content boundary
        run: python3 tools/public_content_guard.py
      - name: Download trusted private catalog source and unit tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_INDEX_CREDENTIAL_UNAVAILABLE'; exit 3; }
          mkdir -p "$RUNNER_TEMP/gamepulse/catalog/tests"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/catalog/catalog.py?ref=main" --jq '.content' |
            base64 -d > "$RUNNER_TEMP/gamepulse/catalog/catalog.py"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/catalog/tests/test_catalog.py?ref=main" --jq '.content' |
            base64 -d > "$RUNNER_TEMP/gamepulse/catalog/tests/test_catalog.py"
          python3 -m py_compile "$RUNNER_TEMP/gamepulse/catalog/catalog.py"
          python3 -m unittest discover -v -s "$RUNNER_TEMP/gamepulse/catalog/tests"
      - name: Reuse unchanged captures, privately index missing games
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/gamepulse/catalog/catalog.py" build \
            --output "$RUNNER_TEMP/gamepulse/search-catalog.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'gamepulse/search-catalog.json'
          d=json.loads(p.read_text())
          assert d['schema']=='gamepulse.search-catalog.v1'
          assert d['game_count']>=14, 'The original 14 games are not all indexed'
          original=['0022600001','0022600002','0022600003','0022600004','0022600005',
                    '0022600085','0022600086','0022600087','0022600088','0022600089',
                    '0022600090','0022600091','0022600092','0022600093']
          assert set(original).issubset(d['games'])
          assert all(d['games'][gid]['release_tag']=='gamepulse-sdk-'+gid for gid in original)
          assert all(d['games'][gid]['home_team'] and d['games'][gid]['away_team'] for gid in original)
          assert all(gid in d['by_team'][d['games'][gid]['home_team']] for gid in original)
          assert all(gid in d['by_team'][d['games'][gid]['away_team']] for gid in original)
          print('PRIVATE_CATALOG_VALIDATED',json.dumps({
              'games':d['game_count'],'coverage':d['coverage'],
              'original_games_reconciled':len(original)}))
          PY
      - name: Publish metadata index only to private 104
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          repo='timeedmonds-maker/104'
          # Never overwrite the immutable original 14-game baseline or the
          # independently coverage-gated current catalog. Auto-refresh is provisional.
          path='gamepulse/catalog/2026-27-auto-refresh-provisional.json'
          frozen='repos/'+repo+'/contents/gamepulse/catalog/2026-27.json'
          frozen_read=subprocess.run(['gh','api',frozen],capture_output=True,text=True)
          if frozen_read.returncode or json.loads(frozen_read.stdout).get('sha')!='4ec7dff505e3a05dc011950e2df5060300b1054e':
              raise RuntimeError('FROZEN_14_CATALOG_SHA_CHANGED')
          target='repos/'+repo+'/contents/'+path
          data=(Path(os.environ['RUNNER_TEMP'])/'gamepulse/search-catalog.json').read_bytes()
          before=subprocess.run(['gh','api',target],capture_output=True,text=True)
          if before.returncode not in (0,1):
              raise RuntimeError('private_catalog_read_failed')
          payload={'message':'chore(gamepulse): refresh private team/game/player search catalog',
                   'branch':'main','content':base64.b64encode(data).decode('ascii')}
          if before.returncode==0:
              payload['sha']=json.loads(before.stdout)['sha']
          changed=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],
                                 input=json.dumps(payload),capture_output=True,text=True)
          if changed.returncode:
              raise RuntimeError('private_catalog_write_failed')
          print('PRIVATE_CATALOG_COMMITTED',len(data),'bytes')
          PY
      - name: Publish generic summary without player or game data
        if: always()
        shell: bash
        run: |
          echo 'Search catalog refresh attempted. Data and detailed QA are private in 104.' >> "$GITHUB_STEP_SUMMARY"
