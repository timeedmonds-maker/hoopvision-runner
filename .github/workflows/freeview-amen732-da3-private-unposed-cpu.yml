# Reviewed research-only worker: fetch private six native JPEG exports ephemerally.
# No NBA frames, generated splats, depth, pose matrices or artifacts are committed to this public repository.
name: Amen732 unposed six-view DA3 CPU private output
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-da3-private-unposed-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amen732-unposed-cpu-private-output
  cancel-in-progress: false
jobs:
  run-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and private-only access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN" || { echo PRIVATE_ACCESS_NOT_CONFIGURED; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          echo UNPOSED_PUBLIC_RUNNER_PRIVATE_BOUNDARY_PASS
      - name: Fetch immutable private source-only diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-unposed"
          mkdir -p "$ROOT/frames" "$ROOT/output"
          COMMIT=1b0d73e9e0b39a45877ebd406f17acf55a8e980b
          gh api "repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_da3_unposed_sixview_trial.py?ref=$COMMIT" \
            --jq .content | base64 -d > "$ROOT/worker.py"
          for spec in broadcast-f275 high-tight-f235 left-above-rim-f247 right-above-rim-f234 left-slash-f221 right-slash-f211; do
            file="amen732-native-$spec.jpg"
            gh api "repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/$file?ref=$COMMIT" \
              --jq .content | base64 -d > "$ROOT/frames/$file"
            test -s "$ROOT/frames/$file"
          done
          python3 -m py_compile "$ROOT/worker.py"
          echo SIX_PRIVATE_NATIVE_FRAME_EXPORTS_EPHEMERALLY_STAGED
      - name: Prepare pinned DA3-SMALL CPU inference
        shell: bash
        run: |
          set -euo pipefail
          DA3="$RUNNER_TEMP/da3-source"
          mkdir -p "$DA3"
          git -C "$DA3" init -q
          git -C "$DA3" fetch --quiet --depth 1 https://github.com/ByteDance-Seed/Depth-Anything-3.git 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
          git -C "$DA3" checkout -q --detach FETCH_HEAD
          test "$(git -C "$DA3" rev-parse HEAD)" = 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' 'opencv-python-headless==4.10.0.84' pillow einops huggingface-hub omegaconf safetensors timm e3nn trimesh imageio 'transformers>=4.45,<5' plyfile 'moviepy==1.0.3' evo
          python3 -m pip install --quiet --disable-pip-version-check torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet --disable-pip-version-check --no-deps -e "$DA3"
          echo DA3_SMALL_CPU_PINNED_SETUP_COMPLETE
      - name: Run real model with six camera images and no calibration
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-unposed"
          python3 "$ROOT/worker.py" --source "$ROOT/frames" --out "$ROOT/output" \
            --model depth-anything/DA3-SMALL --process-res 336
          python3 - "$ROOT/output/amen732-da3-sixview-research-qa.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["input_view_count"]==6 and x["camera_pose_count"]==6
          assert x["model_inference_mode"]=="NO_INPUT_CAMERA_CALIBRATION"
          assert x["output_3840x2160"] and len(x["angles"])>=36 and x["full_360_diagnostic_sweep"]
          assert x["artifact_status"]=="DIAGNOSTIC_MODEL_RENDER_ONLY"
          assert not x["certified_25deg_freeview"]
          print("DA3_SIX_CAMERA_MODEL_INFERENCE_AND_360DEG_DIAGNOSTIC_PASS")
          PY
      - name: Publish exclusively to the private 104 release and SHA-verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-unposed/output"
          TAG=freeview-amen732-da3-unposed-sixview-20261028
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title 'Private research DA3 uncalibrated Amen732 six-camera diagnostic' \
              --notes 'Six provisional original camera frame exports, uncalibrated DA3-SMALL. Model-only geometry not NBA source-validated.' \
              --latest=false >/dev/null
          fi
          gh release upload "$TAG" "$ROOT"/* --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$ROOT" "$RUNNER_TEMP/release.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          assets={x["name"]:x for x in json.load(open(sys.argv[2]))["assets"]}
          for path in Path(sys.argv[1]).iterdir():
              assert assets[path.name]["digest"]=="sha256:"+hashlib.sha256(path.read_bytes()).hexdigest()
          print("AMEN732_UNPOSED_PRIVATE_4K_RECONSTRUCTION_ARTIFACTS_SHA_VERIFIED")
          PY
