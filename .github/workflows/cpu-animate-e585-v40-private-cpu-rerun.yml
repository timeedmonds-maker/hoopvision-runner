name: CPU Animate V51 source-foot and scorer-touch visual QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpu-animate-e585-v40-private-cpu-rerun.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-e585-v40-source-review
  cancel-in-progress: false

jobs:
  source-verified-v40-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: 'none'
      OPENCV_OPENCL_RUNTIME: disabled
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      V40_BRANCH: 'cpu-animate/e585-v40-attachment-continuity-possession-20261113'
      SOURCE_BRANCH: 'research/gamepulse-clock-boundary-integrity-20261025'
      OUTPUT_TAG: 'cpu-animate-0225-e585-v46-native-xyz-ball-sourcefirst-cpu-review-20261113'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public safety and CPU-only execution
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo "BLOCKED: Private source credentials unavailable"; exit 2; }
          private_flag="$(gh api repos/timeedmonds-maker/104 --jq .private)" || { echo "PRIVATE_REPO_ACCESS_FAILED"; exit 3; }
          test "$private_flag" = "true" || { echo "PRIVATE_DESTINATION_NOT_PRIVATE"; exit 3; }
          test ! -e /dev/nvidia0 && test ! -e /dev/kfd || { echo "GPU_DEVICE_PRESENT_REJECTED"; exit 3; }
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          echo "PUBLIC_BOUNDARY_AND_NO_GPU_PASS"
      - name: Retrieve actual V51 SHA-verified source render review stills
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/cpu-e585-v40/qa"
          mkdir -p "$stage"
          echo "V40_OUT=$stage" >> "$GITHUB_ENV"
          gh release download cpu-animate-0225-e585-v51-disciplined-footlock-floor-occlusion-cpu-review-20261113 \
            --repo timeedmonds-maker/104 --dir "$stage" \
            --pattern '*_f150.jpg' --pattern '*_f240.jpg' \
            --pattern '*_f241.jpg' --pattern '*_f242.jpg' \
            --pattern '*_f252.jpg' --pattern '*_f265.jpg' \
            --pattern '*_f270.jpg' --pattern '*_f300.jpg' \
            --pattern '*_f312.jpg' --pattern '*_f350.jpg'
          test "$(find "$stage" -name '*.jpg' | wc -l)" = 10
          echo "V51_SHA_PINNED_PRIVATE_MP4_FRAMES_RETRIEVED"
      - name: Preserve actual rendered V51 JPEG stills in private repo for review
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'opencv-python-headless==4.10.0.84' 'numpy==1.26.4'
          python3 - <<'PY'
          import pathlib,os,base64,hashlib,json,subprocess,cv2
          folder=pathlib.Path(os.environ["V40_OUT"])
          files=sorted(folder.glob("*.jpg"))
          if len(files)!=10:raise RuntimeError("SOURCE_FRAME_COUNT_MISMATCH")
          for source in files:
              im=cv2.imread(str(source))
              if im is None or im.shape[:2]!=(540,960):raise RuntimeError("INVALID_ORIGINAL_V51_JPEG_FRAME")
              yes,buf=cv2.imencode(".jpg",cv2.resize(im,(720,405)),
                                   [cv2.IMWRITE_JPEG_QUALITY,78])
              if not yes:raise RuntimeError("JPEG_ENCODE_FAIL")
              name=source.stem.split("_")[-1]
              dest="docs/cpu_animate/source_video_v51_review/V51_actual_"+name+".jpeg.b64.txt"
              api="repos/timeedmonds-maker/104/contents/"+dest
              payload={
                "message":"Private V51 actual frame foot/floor/custody visual review "+name,
                "branch":os.environ["V40_BRANCH"],
                "content":base64.b64encode((base64.b64encode(bytes(buf)).decode()+"\n").encode()).decode()}
              previous=subprocess.run(["gh","api",api+"?ref="+os.environ["V40_BRANCH"]],
                   capture_output=True,text=True)
              if previous.returncode==0:payload["sha"]=json.loads(previous.stdout)["sha"]
              request=folder/(name+".upload.json");request.write_text(json.dumps(payload))
              sent=subprocess.run(["gh","api","-X","PUT",api,"--input",str(request)],
                                  capture_output=True,text=True)
              if sent.returncode:raise RuntimeError("PRIVATE_V51_ACTUAL_FRAME_SAVE_FAILED")
              print("V51_PRIVATE_RENDERED_FRAME_REVIEW_READY",name,hashlib.sha256(bytes(buf)).hexdigest())
          PY
      - name: Protected source cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cpu-e585-v40"
          echo "PRIVATE_NBA_SOURCE_AND_XYZ_REMOVED_FROM_PUBLIC_RUNNER"
