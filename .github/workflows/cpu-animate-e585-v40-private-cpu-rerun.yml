name: CPU Animate e585 V50 actual rendered frame previews
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpu-animate-e585-v40-private-cpu-rerun.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-e585-v40-source-review
  cancel-in-progress: false

jobs:
  source-verified-v40-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: 'none'
      OPENCV_OPENCL_RUNTIME: disabled
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      V40_BRANCH: 'cpu-animate/e585-v40-attachment-continuity-possession-20261113'
      SOURCE_BRANCH: 'research/gamepulse-clock-boundary-integrity-20261025'
      OUTPUT_TAG: 'cpu-animate-0225-e585-v46-native-xyz-ball-sourcefirst-cpu-review-20261113'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public safety and CPU-only execution
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo "BLOCKED: Private source credentials unavailable"; exit 2; }
          private_flag="$(gh api repos/timeedmonds-maker/104 --jq .private)" || { echo "PRIVATE_REPO_ACCESS_FAILED"; exit 3; }
          test "$private_flag" = "true" || { echo "PRIVATE_DESTINATION_NOT_PRIVATE"; exit 3; }
          test ! -e /dev/nvidia0 && test ! -e /dev/kfd || { echo "GPU_DEVICE_PRESENT_REJECTED"; exit 3; }
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          echo "PUBLIC_BOUNDARY_AND_NO_GPU_PASS"
      - name: Retrieve exact V50 released frames (no rerender or GPU)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpu-e585-v40/qa"
          echo "V40_OUT=$RUNNER_TEMP/cpu-e585-v40/qa" >> "$GITHUB_ENV"
          tag=cpu-animate-0225-e585-v50-native-highball-catch-cpu-review-20261113
          gh release download "$tag" --repo timeedmonds-maker/104 \
            --dir "$RUNNER_TEMP/cpu-e585-v40/qa" \
            --pattern '*_f150.jpg' --pattern '*_f252.jpg' \
            --pattern '*_f265.jpg' --pattern '*_f270.jpg' \
            --pattern '*_f312.jpg'
          test "$(find "$RUNNER_TEMP/cpu-e585-v40/qa" -name '*_f*.jpg' | wc -l)" = 5
      - name: Export small real V50 JPEG frames into private review source, no public NBA artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'opencv-python-headless==4.10.0.84' 'numpy==1.26.4'
          python3 - <<'PY'
          import pathlib,os,base64,hashlib,json,subprocess,cv2
          folder=pathlib.Path(os.environ["V40_OUT"])
          originals=sorted(folder.glob("*_f*.jpg"))
          if len(originals)!=5:raise RuntimeError("V50_RELEASE_STILL_COUNT_NOT_5")
          for src in originals:
              im=cv2.imread(str(src))
              if im is None or im.shape[:2]!=(540,960):
                  raise RuntimeError("EXACT_V50_ORIGINAL_RENDERED_FRAME_MISSING")
              scaled=cv2.resize(im,(720,405),interpolation=cv2.INTER_AREA)
              ok,buf=cv2.imencode(".jpg",scaled,[cv2.IMWRITE_JPEG_QUALITY,76])
              if not ok:raise RuntimeError("V50_CPU_JPEG_FAIL")
              # GitHub stores literal base64 text; private repo only.
              source_b64=base64.b64encode(bytes(buf)).decode()
              frame=src.stem.split("_")[-1]
              dest="docs/cpu_animate/source_video_v50_review/V50_actual_"+frame+".jpeg.b64.txt"
              path="repos/timeedmonds-maker/104/contents/"+dest
              payload={
                  "message":"Private V50 actual ring render JPEG preview "+frame,
                  "branch":os.environ["V40_BRANCH"],
                  "content":base64.b64encode((source_b64+"\n").encode()).decode()}
              prior=subprocess.run(["gh","api",path+"?ref="+os.environ["V40_BRANCH"]],
                                   capture_output=True,text=True)
              if prior.returncode==0:payload["sha"]=json.loads(prior.stdout)["sha"]
              scratch=folder/(frame+".api.json")
              scratch.write_text(json.dumps(payload))
              up=subprocess.run(["gh","api","-X","PUT",path,"--input",str(scratch)],
                                capture_output=True,text=True)
              if up.returncode:
                  print("V50_PRIVATE_STILL_UPLOAD_ERROR",frame)
                  raise SystemExit(2)
              print("V50_ACTUAL_FRAME_READY_PRIVATE",frame,
                    "size",len(buf),"sha",hashlib.sha256(bytes(buf)).hexdigest())
          PY
      - name: Protected source cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cpu-e585-v40"
          echo "PRIVATE_NBA_SOURCE_AND_XYZ_REMOVED_FROM_PUBLIC_RUNNER"
