name: CPU Animate e585 V43 original-video tracklet forensics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpu-animate-e585-v40-private-cpu-rerun.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-e585-v40-source-review
  cancel-in-progress: false

jobs:
  source-verified-v40-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: 'none'
      OPENCV_OPENCL_RUNTIME: disabled
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      V40_BRANCH: 'cpu-animate/e585-v40-attachment-continuity-possession-20261113'
      SOURCE_BRANCH: 'research/gamepulse-clock-boundary-integrity-20261025'
      OUTPUT_TAG: 'cpu-animate-0225-e585-v43-source-tracklet-forensics-20261113'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public safety and CPU-only execution
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo "BLOCKED: Private source credentials unavailable"; exit 2; }
          private_flag="$(gh api repos/timeedmonds-maker/104 --jq .private)" || { echo "PRIVATE_REPO_ACCESS_FAILED"; exit 3; }
          test "$private_flag" = "true" || { echo "PRIVATE_DESTINATION_NOT_PRIVATE"; exit 3; }
          test ! -e /dev/nvidia0 && test ! -e /dev/kfd || { echo "GPU_DEVICE_PRESENT_REJECTED"; exit 3; }
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          echo "PUBLIC_BOUNDARY_AND_NO_GPU_PASS"
      - name: Prepare pinned private V40 source and immutable NBA original assets
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cpu-e585-v40"
          code="$root/code"
          source="$root/source"
          media="$root/media"
          out="$root/qa"
          mkdir -p "$code" "$source" "$media" "$out"
          chmod 700 "$root" "$code" "$source" "$media" "$out"
          echo "V40_CODE=$code" >> "$GITHUB_ENV"
          echo "V40_SOURCE=$source" >> "$GITHUB_ENV"
          echo "V40_MEDIA=$media" >> "$GITHUB_ENV"
          echo "V40_OUT=$out" >> "$GITHUB_ENV"
          gh auth setup-git
          git clone --quiet --filter=blob:none --depth=1 --no-checkout -b "$V40_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$code"
          git -C "$code" sparse-checkout init --cone
          git -C "$code" sparse-checkout set cpu_animate tools
          git -C "$code" checkout --quiet "$V40_BRANCH"
          git clone --quiet --filter=blob:none --depth=1 --no-checkout -b "$SOURCE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$source"
          git -C "$source" sparse-checkout init --no-cone
          git -C "$source" sparse-checkout set --no-cone \
            '/gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1/index.json' \
            '/gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1/original-native-*.jsonl.gz' \
            '/gamepulse/fusion/materialized/igp_full170_unified_source_default_v1/index.json'
          git -C "$source" checkout --quiet "$SOURCE_BRANCH"
          test "$(find "$source/gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1" -name 'original-native-*.jsonl.gz' | wc -l)" = 17
          gh release download cpu-animate-0022600225-event585-playbyplay-v20-source-20261112 \
            --repo timeedmonds-maker/104 --dir "$media" --pattern 'event585-playbyplay.mp4'
          gh release download cpu-animate-rockets-0225-e585-v21-source-shoe-scout-20261112 \
            --repo timeedmonds-maker/104 --dir "$media" \
            --pattern 'event585-native-video-pts.json' \
            --pattern 'scout_0225_585_videoonly_592.json.gz' \
            --pattern 'rockets_e585_full161_original_xyz_pts_shadow.json.gz'
          test "$(sha256sum "$media/event585-playbyplay.mp4" | cut -d' ' -f1)" = '06e5de702b58545799c7bbb678878e04da092fdec3f0ee98e97b3b65f552a234'
          echo "IMMUTABLE_PRIVATE_NBA_EVENT585_SOURCES_PRESENT"
      - name: Analyze source original jersey tracklets and private-only camera frames
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'numpy==1.26.4' 'opencv-python-headless==4.10.0.84'
          cd "$V40_CODE"
          python3 -m cpu_animate.e585_v43_original_video_tracklet_diagnostic \
            --video "$V40_MEDIA/event585-playbyplay.mp4" \
            --scout "$V40_MEDIA/scout_0225_585_videoonly_592.json.gz" \
            --out "$V40_OUT"
          test "$(find "$V40_OUT" -maxdepth 1 -name 'private_e585_v43_*.b64.txt' | wc -l)" = 2
      - name: Preserve three diagnostics inside private 104 ONLY (no source pixels in logs)
        shell: bash
        run: |
          set -euo pipefail
          cd "$V40_CODE"
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ["V40_OUT"])
          branch=os.environ["V40_BRANCH"]
          names=[
             "private_e585_red_video_tracklets.json",
             "private_e585_v43_early_original_red_detections.jpeg.b64.txt",
             "private_e585_v43_action_original_red_detections.jpeg.b64.txt"]
          for name in names:
              local=root/name
              b=local.read_bytes()
              path="docs/cpu_animate/source_video_v43/"+name
              dest="repos/timeedmonds-maker/104/contents/"+path
              record={
                "message":"Private CPU Animate event585 source-video frame/track audit "+name,
                "branch":branch,
                "content":base64.b64encode(b).decode("ascii")}
              prior=subprocess.run(["gh","api",dest+"?ref="+branch],text=True,
                                   capture_output=True)
              if prior.returncode==0:
                  record["sha"]=json.loads(prior.stdout)["sha"]
              payload=root/(name+".payload.json")
              payload.write_text(json.dumps(record))
              p=subprocess.run(["gh","api","-X","PUT",dest,"--input",str(payload)],
                               text=True,capture_output=True)
              if p.returncode:
                  print("PRIVATE_SOURCE_VIDEO_DIAGNOSTIC_UPLOAD_FAILED",name)
                  raise SystemExit(12)
              print("PRIVATE_SOURCE_VIDEO_DIAGNOSTIC_SAVED",
                    name,hashlib.sha256(b).hexdigest(),len(b))
          PY
          echo "EVENT585_V43_PRIVATE_VISUAL_SOURCE_FORENSICS_COMPLETE"
      - name: Protected source cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cpu-e585-v40"
          echo "PRIVATE_NBA_SOURCE_AND_XYZ_REMOVED_FROM_PUBLIC_RUNNER"
