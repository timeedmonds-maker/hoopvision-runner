name: CPU Animate V52 actual frame acceptance visual audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpu-animate-e585-v40-private-cpu-rerun.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-e585-v40-source-review
  cancel-in-progress: false

jobs:
  source-verified-v40-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: 'none'
      OPENCV_OPENCL_RUNTIME: disabled
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      V40_BRANCH: 'cpu-animate/e585-v40-attachment-continuity-possession-20261113'
      SOURCE_BRANCH: 'research/gamepulse-clock-boundary-integrity-20261025'
      OUTPUT_TAG: 'cpu-animate-0225-e585-v46-native-xyz-ball-sourcefirst-cpu-review-20261113'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public safety and CPU-only execution
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo "BLOCKED: Private source credentials unavailable"; exit 2; }
          private_flag="$(gh api repos/timeedmonds-maker/104 --jq .private)" || { echo "PRIVATE_REPO_ACCESS_FAILED"; exit 3; }
          test "$private_flag" = "true" || { echo "PRIVATE_DESTINATION_NOT_PRIVATE"; exit 3; }
          test ! -e /dev/nvidia0 && test ! -e /dev/kfd || { echo "GPU_DEVICE_PRESENT_REJECTED"; exit 3; }
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          echo "PUBLIC_BOUNDARY_AND_NO_GPU_PASS"
      - name: Retrieve exact private V52 release review frames; never download original video to public artifacts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/cpu-e585-v40/qa"
          mkdir -p "$stage"
          echo "V40_OUT=$stage" >> "$GITHUB_ENV"
          gh release download cpu-animate-0225-e585-v52-native-source-opponent-floor-safe-cpu-review-20261113 \
            --repo timeedmonds-maker/104 --dir "$stage" \
            --pattern '*_f150.jpg' --pattern '*_f240.jpg' \
            --pattern '*_f241.jpg' --pattern '*_f242.jpg' \
            --pattern '*_f252.jpg' --pattern '*_f265.jpg' \
            --pattern '*_f270.jpg' --pattern '*_f312.jpg'
          test "$(find "$stage" -maxdepth 1 -name '*.jpg' | wc -l)" = 8
          echo "V52_ORIGINAL_RENDER_FRAMES_RETRIEVED_PRIVATELY"
      - name: Save exact rendered V52 screenshots only in private code branch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'opencv-python-headless==4.10.0.84' 'numpy==1.26.4'
          python3 - <<'PY'
          import pathlib,os,base64,hashlib,json,subprocess,cv2
          folder=pathlib.Path(os.environ["V40_OUT"])
          frames=sorted(folder.glob("*.jpg"))
          if len(frames)!=8:raise RuntimeError("NOT_EXACT_V52_IMAGE_SET")
          for src in frames:
              im=cv2.imread(str(src))
              if im is None or im.shape[:2]!=(540,960):raise RuntimeError("INVALID_PRIVATE_MP4_FRAME")
              yes,picture=cv2.imencode(".jpg",cv2.resize(im,(720,405)),[cv2.IMWRITE_JPEG_QUALITY,78])
              if not yes:raise RuntimeError("JPEG_CANNOT_ENCODE")
              pos=src.stem.split("_")[-1]
              dest="docs/cpu_animate/source_video_v52_review/V52_actual_"+pos+".jpeg.b64.txt"
              api="repos/timeedmonds-maker/104/contents/"+dest
              request={"message":"Review authentic rendered V52 frame "+pos+" with original 3D and frozen rings",
                      "branch":os.environ["V40_BRANCH"],
                      "content":base64.b64encode((base64.b64encode(bytes(picture)).decode()+"\n").encode()).decode()}
              previous=subprocess.run(["gh","api",api+"?ref="+os.environ["V40_BRANCH"]],capture_output=True,text=True)
              if previous.returncode==0:request["sha"]=json.loads(previous.stdout)["sha"]
              scratch=folder/(pos+".upload.json");scratch.write_text(json.dumps(request))
              result=subprocess.run(["gh","api","-X","PUT",api,"--input",str(scratch)],capture_output=True,text=True)
              if result.returncode:raise RuntimeError("V52_PRIVATE_QA_UPLOAD_FAILED")
              print("V52_PRIVATE_ACTUAL_FRAME_ACCEPTANCE_REVIEW_READY",pos,hashlib.sha256(bytes(picture)).hexdigest())
          PY
      - name: Protected source cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cpu-e585-v40"
          echo "PRIVATE_NBA_SOURCE_AND_XYZ_REMOVED_FROM_PUBLIC_RUNNER"
