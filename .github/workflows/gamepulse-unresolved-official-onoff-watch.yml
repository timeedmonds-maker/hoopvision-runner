name: Game Pulse unresolved official ONOFF source retry
# Retain source failure as missing, never fabricate native possessions.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-unresolved-official-onoff-watch.yml']
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-private-exact-nba-onoff-3gap-source-retries
  cancel-in-progress: false
jobs:
  retry-official-source:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        game: ['0022600009','0022600099','0022600103']
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck only unverified original NBA game sources
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/native_28_qa/games/${{ matrix.game }}.json" \
            --jq .content | base64 -d > "$RUNNER_TEMP/game_qa.json"
          if python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); sys.exit(0 if r.get("nba_provider_onoff_certified") and r.get("formal_pbp_certified") else 1)' "$RUNNER_TEMP/game_qa.json"; then
            echo SOURCE_GAME_ALREADY_VERIFIED
          else
            python3 tools/licensed_feed/official_pbp_onoff_28.py one --game "${{ matrix.game }}"
          fi
  source-status:
    if: always()
    needs: [retry-official-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish truthful private full-PBP and partial/full-ONOFF QA
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 tools/licensed_feed/official_pbp_onoff_28.py assemble
