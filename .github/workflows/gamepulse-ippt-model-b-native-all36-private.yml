name: IPPT SHA original all36 native G2 and source anchor Model B complete tracking
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-model-b-native-all36-private.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: ippt-native-model-b-all36
  cancel-in-progress: false
jobs:
  source-native-model-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/ippt-event-snapshots-separate-20261028
      EXACT_SHA: 58bee8c4880d753bb516fbae78e839a3419f7193
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public source and checkout exact original NBA private SHA
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$EXACT_SHA"
          echo "PRIV_SRC=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Source free player original and G3 preservation tests and heldout QA regressions
        run: |
          set -euo pipefail
          cd "$PRIV_SRC"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_source_model_b_segments_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_source_model_b_masked_qa_2026.py
          python3 -m py_compile gamepulse/fusion/igp_ippt_source_model_b_native_36_2026.py
      - name: Build exact source SHA full36 native Model B and short ball private overlay
        run: |
          set -euo pipefail
          cd "$PRIV_SRC"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json
          from pathlib import Path
          from igp_ippt_source_model_b_native_36_2026 import run,QA
          g4=json.loads(Path("gamepulse/fusion/materialized/igp_g4_original_native_player_ball_possession_v1/index.json").read_text())
          ids=sorted(g4["games"])
          assert len(ids)==36
          result=run(Path("."),ids)
          p=Path(QA)
          assert not p.exists()
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          PY
      - name: SHA counts, 45 percent baseline and 36-game model lift acceptance
        run: |
          set -euo pipefail
          cd "$PRIV_SRC"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from collections import Counter
          from hashlib import sha256
          from sys import path
          path.insert(0,"gamepulse/fusion")
          from igp_ippt_source_model_b_native_36_2026 import QA
          a=json.loads(Path(QA).read_text());c=a["counts"]
          assert a["source_games"]==36 and len(a["games"])==36
          assert c["all_source_native_frames"]==1203986
          assert c["original_plus_G3_ten_ball"]==467785,("BASELINE_CHANGED",c["original_plus_G3_ten_ball"])
          assert c["chain_second_complete_before_B"]==121914
          assert c["chain_second_complete_after_B"]>121914
          assert c["original_plus_G3_plus_newB_ten_ball"]>=467785
          assert c["new_player_estimates"]>0 and c["new_ball_estimates"]>0
          assert not a["physical_custody_video_certified"]
          for gid,r in a["games"].items():
              p=Path(r["sidecar_path"])
              assert p.is_file() and sha256(p.read_bytes()).hexdigest()==r["sidecar_SHA256"]
              assert r["original_XYZ_never_mutated"]
              assert r["original_G3_never_mutated"]
              assert any(v["masked_original_source_XY_ball3D_errors"] for v in a["games"].values())
          safe={"status":"SOURCE_MODEL_B_ALL36_PASS","games":36,"source_original_frames":1203986,
                "model_counts":c,
                "model_test_strata_per_game_count":sum(bool(v["masked_original_source_XY_ball3D_errors"]) for v in a["games"].values()),
                "no_video_certified_physical_possessions":True}
          (Path(os.environ["RUNNER_TEMP"])/"safe-modelB-all36.json").write_text(json.dumps(safe,sort_keys=True,indent=2))
          print("IPPT_ALL36_ORIGINAL_SHA_NATIVE_MODEL_B_TEN_BALL_HOLDOUT_PASS",json.dumps(safe,sort_keys=True))
          PY
      - name: Commit private-only immutable derived sidecars and QA
        run: |
          set -euo pipefail
          cd "$PRIV_SRC"
          git config user.name "NBA Native Original Source Model B QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f gamepulse/fusion/materialized/igp_ippt_native_model_b_v1 gamepulse/fusion/qa/igp_progress_20261028/ippt_original_native_model_b_all36_v1.json
          git diff --cached --check
          git commit -qm "qa(ippt): full36 original NBA native Model B player and ball graded source-only sidecars and holdout"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IPPT_PRIVATE_MODEL_B_ALL36_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
      - name: Public aggregate receipt and delete licensed private NBA original coordinates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"]);p=root/"safe-modelB-all36.json"
          d=json.loads(p.read_text()) if p.exists() else {"status":os.environ["QA_STATUS"]}
          d.update({"run_id":os.environ["GITHUB_RUN_ID"],"code_sha":os.environ["EXACT_SHA"]})
          (root/"ippt-model-B-public.md").write_text("Original licensed NBA full-native model B tracking: aggregate counts only. No player/ball source XYZ, event UTC or actor IDs.\n\n~~~json\n"+json.dumps(d,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt-model-B-public.md"
# Individual NBA source licensed coordinates private.
