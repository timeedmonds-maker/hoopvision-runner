name: Repair Commercial Prepared L4 Session

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-commercial-prepared-l4.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-southeast1-c
  INSTANCE: hv-dev-l4
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  CANDIDATE_SHA: a81bf2f8683a126bd2a94ed24c9e8cbd911a6f4e
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Package exact control plane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/tools/release bundle/infra/hoopvision-dev
          cp src/tools/release/dev_supervisor.py bundle/tools/release/
          cp src/tools/release/durable_events.py bundle/tools/release/
          cp src/infra/hoopvision-dev/hoopvision-dev-supervisor.service bundle/infra/hoopvision-dev/
          tar -C bundle -czf /tmp/control-current.tgz .
          echo "CONTROL_BUNDLE_SHA=$(sha256sum /tmp/control-current.tgz | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Transfer repair inputs
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute scp /tmp/control-current.tgz scripts/repair_commercial_host.sh scripts/ensure_ppocrv6.py "$INSTANCE:/tmp/" --zone "$ZONE" --project "$PROJECT_ID" --quiet
      - name: Repair and attest host filesystem
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="sudo bash /tmp/repair_commercial_host.sh '$CANDIDATE_SHA' '$CONTROL_BUNDLE_SHA'"
      - name: Verify regenerated session manifest
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for i in $(seq 1 30); do
            gcloud storage cat "gs://$BUCKET/sessions/hv-dev-l4.json" > /tmp/session.json
            if jq -e '.restricted_ocr_assets_present == false' /tmp/session.json >/dev/null; then
              OK=1
              break
            fi
            sleep 2
          done
          test "$OK" = 1
          MODEL_SHA="$(jq -r '.models_manifest_sha256' /tmp/session.json)"
          test "${#MODEL_SHA}" = 64
          gcloud storage cat "gs://$BUCKET/manifests/models/$MODEL_SHA.json" > /tmp/models.json
          test "$(sha256sum /tmp/models.json | awk '{print $1}')" = "$MODEL_SHA"
          ! grep -qi soccernet /tmp/models.json
          grep -q 'ppocrv6/medium/model.safetensors' /tmp/models.json
          grep -q 'ppocrv6/small/model.safetensors' /tmp/models.json
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="test \"\$(cat /srv/hoopvision/commercial-prepared.candidate.sha)\" = '$CANDIDATE_SHA' && test \"\$(cat /srv/hoopvision/commercial-prepared.control-bundle.sha256)\" = '$CONTROL_BUNDLE_SHA' && test ! -e /srv/hoopvision/models/nbacv/parseq_soccernet.ckpt && test ! -e /srv/hoopvision/models/nbacv/legibility_soccernet.pth && echo HOOPVISION_COMMERCIAL_HOST_ATTESTED"
          echo "HOOPVISION_COMMERCIAL_PREPARED_SESSION=$(jq -c . /tmp/session.json)"
