name: IGP G3 original NBA shot-targeted disjoint 34 34 whole 2400ms ball-3D SHA acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g3-shot-targeted-68-2400ms-source-qa.yml']
permissions: {contents: read}
concurrency:
  group: igp-g3-original68-shot-targeted-source-2400ms
  cancel-in-progress: false
jobs:
  shot-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 707cbc4fa2dda6ddc1717d93a422409b3cc9e5a5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source guard and original NBA SHA private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free exact NBA official roster original ten plus ball shot event holdout unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g3_shot_semantic_disjoint_2400ms_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g3_targeted_original_shot68_blackout_v1.py'
      - name: Original NBA 68 game shot targeted all actor+ball blackout game disjoint 34 34 real data test
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_g3_targeted_original_shot68_blackout_v1.py \
            --root . --output "$RUNNER_TEMP/shot-targeted-original-private.json" \
            > "$RUNNER_TEMP/shot-targeted-original-private.log" 2>&1; then
            echo IGP_G3_ORIGINAL_SHOT_TARGETED_FULL68_QA_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          x=(Path(os.environ['RUNNER_TEMP'])/'shot-targeted-original-private.log').read_text(errors='replace').splitlines()
          last=next((v for v in reversed(x) if v.strip()),'NO_LOG')
          print('IGP_G3_SHOT_TARGETED_SAFE_FAILURE',re.sub(r'[^A-Za-z_]','_',last)[:100])
          print('IGP_G3_SHOT_TARGETED_GAMES_FINISHED',sum(v.startswith('IGP_G3_SHOT_TARGETED_ORIGINAL_NBA_GAME') for v in x))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'shot-targeted-original-private.json').read_text())
          a=j['validation_baseline_same_ball_predictions'];b=j['validation_shot_arc_same_ball_predictions']
          assert j['games']==68 and len(j['per_game'])==68
          assert len(j['development_games'])==len(j['validation_games'])==34
          assert not set(j['development_games'])&set(j['validation_games'])
          assert j['masked_full_original_player_extra_and_ball_ms']==2400
          assert j['development_ball_scorable_cases']>=0 and j['validation_ball_scorable_cases']>=0
          assert a['source_3D_error']['n']==b['source_3D_error']['n']==j['validation_ball_scorable_cases']
          assert j['all_original_NBA_XYZ_and_PBP_and_historical_dataset_unchanged']
          assert j['new_production_accepted_complete_NBA_scenes']==0
          assert j['physically_certified_shot_release_time_scenes']==0
          print('IGP_G3_TARGETED_SHOT_DISJOINT_NBA68_SOURCE_METRICS',json.dumps({
            'dev_cases':j['development_ball_scorable_cases'],
            'validation_cases':j['validation_ball_scorable_cases'],
            'locked_physics_weight':j['locked_ball_arc_weight'],
            'original_ball_source_3D_before':a['source_3D_error'],
            'original_ball_source_3D_after':b['source_3D_error'],
            'strict_p95_and_p99_tail_improves':j['validation_strict_p95_p99_positive'],
            'decision':j['release_decision'],
            'accepted_scene_delta':0},sort_keys=True))
          PY
      - name: Commit licensed NBA full source performance receipt privately only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g3_targeted_nba68_shot_arc_34dev34val_2400ms_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B g3-targeted-shot "origin/$BRANCH"
          cp "$RUNNER_TEMP/shot-targeted-original-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_G3_SHOT_TARGETED_QA_IDENTICAL
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original 68 NBA official shot-targeted game-disjoint full-actor 2400ms ball-source p95 p99'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G3_SHOT_TARGETED_ORIGINAL_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
