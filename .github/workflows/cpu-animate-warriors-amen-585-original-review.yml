name: CPU Animate Warriors Amen Thompson Sengun assist 0225 event585 original video shot-source review
on:
  push:
    branches: ['cpu-animate/warriors-amen-sengun-e585-cpu-rebuild-20261113']
    paths: ['.github/workflows/cpu-animate-warriors-amen-585-original-review.yml']
permissions:
  contents: read
concurrency:
  group: cpu-animate-warriors-amen-585-source-forensic
  cancel-in-progress: false
jobs:
  review-scoring-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Verify exact original Warriors event585 and export source-video scoring action frame review
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test ! -e /dev/nvidia0
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/source" "$root/scout" "$root/stills"
          python3 -m pip install -q --disable-pip-version-check opencv-python-headless numpy
          gh release download cpu-animate-0022600225-event585-playbyplay-v20-source-20261112 \
            --repo timeedmonds-maker/104 --dir "$root/source" \
            --pattern event585-playbyplay.mp4
          gh release download cpu-animate-rockets-0225-e585-v21-source-shoe-scout-20261112 \
            --repo timeedmonds-maker/104 --dir "$root/scout" \
            --pattern scout_0225_585_videoonly_592.json.gz
          echo "06e5de702b58545799c7bbb678878e04da092fdec3f0ee98e97b3b65f552a234  $root/source/event585-playbyplay.mp4" | sha256sum -c -
          echo "bdfae29c435a9ed99b366f740cc097fbb8a6bb71351dbe0ffbcd89694d99f104  $root/scout/scout_0225_585_videoonly_592.json.gz" | sha256sum -c -
          export SRC_ROOT="$root"
          python3 - <<'PY'
          import cv2,os,hashlib,json,gzip,numpy as np,base64,subprocess,pathlib
          root=pathlib.Path(os.environ["SRC_ROOT"])
          scout=json.load(gzip.open(root/"scout"/"scout_0225_585_videoonly_592.json.gz","rt"))
          assert scout["game_id"]=="0022600225" and scout["event"]==585 and scout["frame_count"]==592
          src=cv2.VideoCapture(str(root/"source"/"event585-playbyplay.mp4"))
          assert src.isOpened()
          frames_to_save={240,252,270,282,300,312,325,337,350,365,380,405,435,480}
          source={}
          for j in range(592):
              ok,frame=src.read()
              if not ok:raise RuntimeError(f"BAD_ORIGINAL_0225_SOURCE_FRAME_{j}")
              if j in frames_to_save:source[j]=frame.copy()
          src.release()
          assert len(source)==len(frames_to_save)
          for j in sorted(frames_to_save):
              frame=source[j]
              view=frame.copy()
              people=scout["frames"][j]["persons"]
              for obj in people:
                  x0,y0,x1,y1=map(int,obj["bbox"])
                  tid=obj.get("source_tracker_id",-1)
                  shoe=obj.get("shoe_xy")
                  cv2.rectangle(view,(max(0,x0),max(0,y0)),(min(959,x1),min(539,y1)),(15,220,220),1)
                  cv2.putText(view,str(tid),(max(0,x0),max(14,y0-2)),cv2.FONT_HERSHEY_SIMPLEX,.5,(10,10,10),3,cv2.LINE_AA)
                  cv2.putText(view,str(tid),(max(0,x0),max(14,y0-2)),cv2.FONT_HERSHEY_SIMPLEX,.5,(255,255,255),1,cv2.LINE_AA)
                  if shoe:
                      cv2.circle(view,(int(shoe[0]),int(shoe[1])),3,(0,10,255),-1)
              cv2.putText(view,f"0225 E585 NBA Q4 09:47 AMEN THOMPSON - SENGUN ASSIST VIDEO FR {j}",
                    (8,26),cv2.FONT_HERSHEY_SIMPLEX,.52,(20,20,20),3,cv2.LINE_AA)
              cv2.putText(view,f"0225 E585 NBA Q4 09:47 AMEN THOMPSON - SENGUN ASSIST VIDEO FR {j}",
                    (8,26),cv2.FONT_HERSHEY_SIMPLEX,.52,(255,255,255),1,cv2.LINE_AA)
              combo=np.concatenate((frame,view),axis=0)
              out=root/"stills"/f"0225_e585_scoring_f{j:03d}_original_and_tracker.jpg"
              assert cv2.imwrite(str(out),combo,[cv2.IMWRITE_JPEG_QUALITY,85])
              raw=out.read_bytes()
              txt=base64.b64encode(raw).decode("ascii")+"\n"
              path=f"gamepulse/clip_lab/qa/0225_e585_amen_sengun_source_20261113_f{j:03d}_jpg.b64.txt"
              branch="cpu-animate/warriors-amen-sengun-event585-scoring-rebuild-20261113"
              api=f"repos/timeedmonds-maker/104/contents/{path}"
              payload={"message":f"qa: original 0022600225 e585 Amen Sengun scoring source frame {j}",
                "branch":branch,"content":base64.b64encode(txt.encode()).decode()}
              prior=subprocess.run(["gh","api",api+"?ref="+branch],capture_output=True,text=True)
              if prior.returncode==0:payload["sha"]=json.loads(prior.stdout)["sha"]
              post=root/"stills"/f"commit_{j}.json";post.write_text(json.dumps(payload))
              r=subprocess.run(["gh","api","-X","PUT",api,"--input",str(post)],
                               capture_output=True,text=True)
              if r.returncode:raise RuntimeError(f"SOURCE_STILL_PRIVATE_COMMIT_{j}_FAILED: {r.stderr[:400]}")
              post.unlink()
              print("TRUE_WARRIORS_0225_AMEN_SENGUN_SOURCE_FRAME",j,
                    "PTS",scout["frames"][j]["pts_seconds"],
                    "SOURCE_TRACK_IDS",sorted(int(z["source_tracker_id"]) for z in people),
                    "SHA256",hashlib.sha256(raw).hexdigest(),flush=True)
          print("ORIGINAL_WARRIORS_AMEN_SENGUN_SOURCE_FRAMES_PUBLISHED_PRIVATE")
          PY
