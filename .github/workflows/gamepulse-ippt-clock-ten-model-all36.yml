name: IPPT SHA all36 official NBA clock modeled complete ten player and ball data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-clock-ten-model-all36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: ippt-clock-ten-model-all36
  cancel-in-progress: false
jobs:
  private-clock-tracking:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/ippt-event-snapshots-separate-20261028
      SHA: 9268edba5d4890ef96f51f492776260984bfacb9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Privacy guard and exact original private NBA source SHA
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SHA"
          echo "PRIV=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Original native source provisional timing and Model B source-free tests
        run: |
          set -euo pipefail
          cd "$PRIV"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -v gamepulse/fusion/test_query_igp_ippt_official_clock_ten_model_v1_2026.py
          python3 -m py_compile gamepulse/fusion/igp_ippt_clock_ten_model_materialize_all36_2026.py
          python3 -m py_compile gamepulse/fusion/query_igp_ippt_clock_ten_materialized_v1_2026.py
      - name: Materialize SHA original all36 clock ten-player plus ball private model
        run: |
          set -euo pipefail
          cd "$PRIV"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json
          from pathlib import Path
          from igp_ippt_clock_ten_model_materialize_all36_2026 import run,QA
          meta=json.loads(Path("gamepulse/fusion/materialized/igp_g4_original_native_player_ball_possession_v1/index.json").read_text())
          ids=sorted(meta["games"])
          assert len(ids)==36
          z=run(Path("."),ids)
          p=Path(QA)
          assert not p.exists()
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(z,sort_keys=True,indent=2)+"\n")
          PY
      - name: Verify exact all game source private SHA and real modeled query readback
        run: |
          set -euo pipefail
          cd "$PRIV"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import collections,gzip,hashlib,json,os
          from pathlib import Path
          from igp_ippt_clock_ten_model_materialize_all36_2026 import QA
          from query_igp_ippt_clock_ten_materialized_v1_2026 import query
          a=json.loads(Path(QA).read_text());c=a["counts"]
          assert a["source_games"]==36
          assert c["gameclock_seconds_materialized"]==98058
          assert c["model_gameclock_official_ten_known"]==98005
          assert c["model_player_ball_complete"]>=85000,("LOW_REAL_COMPLETE_MODEL",c)
          assert c["model_player_ball_all_two_sided_or_original"]>=70000
          assert c["low_confidence_one_sided_player_positions"]>0
          for gid,meta in a["games"].items():
              p=Path(meta["private_path"])
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==meta["sha256"]
              assert meta["source_XYZ_immutable"]
          sample_count=0
          for gid in ("0022600009","0022600092"):
              path=Path(a["games"][gid]["private_path"])
              for line in gzip.open(path,"rt"):
                  r=json.loads(line)
                  if not r.get("model_complete"):continue
                  x=query(".",gid,r["period"],r["NBA_game_clock_second_remaining"])
                  assert x["materialized_source_model_SHA_verified"]
                  assert len(x["result"]["players"])==10
                  assert x["result"]["ball"] is not None
                  assert not x["exact_physical_ball_custody_certified"]
                  sample_count+=1
                  break
          assert sample_count==2
          safe={"games":36,"source_clock_seconds":98058,"counts":c,
                "actual_source_modeled_query_games_tested":sample_count,
                "upstream_source_interpolation_flag_not_stratified":True,
                "exact_physical_ball_custody_certified":False}
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(json.dumps(safe,sort_keys=True))
          print("IPPT_ORIGINAL_SHA_ALL36_GAMECLOCK_TEN_BALL_POSITIONS_MATERIALIZED_AND_QUERY_PASS",
                json.dumps(safe,sort_keys=True))
          PY
      - name: Commit SHA private original gameclock ten-player and ball modeled source
        run: |
          set -euo pipefail
          cd "$PRIV"
          git config user.name "NBA Original Clock Ten Tracking QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f gamepulse/fusion/materialized/igp_ippt_clock_ten_model_all36_v1 gamepulse/fusion/qa/igp_progress_20261028/ippt_clock_ten_player_ball_model_all36_v1.json
          git diff --cached --check
          git commit -qm "data(ippt): model source SHA official NBA ten player ball at 98058 advancing clock moments, preserve originals"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IPPT_PRIVATE_CLOCK_TEN_MODEL_ALL36_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
      - name: Public aggregate QA and remove original NBA licensed tracking
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((d/"safe.json").read_text()) if (d/"safe.json").exists() else {"status":os.environ["STATUS"]}
          r.update({"run_id":os.environ["GITHUB_RUN_ID"],"code_sha":os.environ["SHA"]})
          (d/"receipt.md").write_text("Actual SHA original NBA 36-game clock-aligned official ten+ball model source. Source coordinates and person IDs private; public aggregate only. Physical custody/video accuracy not certified.\n\n~~~json\n"+json.dumps(r,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/receipt.md"
