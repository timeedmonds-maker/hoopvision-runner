name: Diagnose HoopVision L4 Start-Stop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-l4-start-stop.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-southeast1-c
  INSTANCE: hv-dev-l4
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect instance and project control state
        shell: bash
        run: |
          set +e
          echo '=== INSTANCE SUMMARY ==='
          gcloud compute instances describe "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" \
            --format='yaml(name,status,id,creationTimestamp,lastStartTimestamp,lastStopTimestamp,machineType,scheduling,resourcePolicies,metadata,labels,tags,serviceAccounts,disks,networkInterfaces)'
          echo '=== PROJECT METADATA ==='
          gcloud compute project-info describe --project="$PROJECT_ID" \
            --format='yaml(commonInstanceMetadata.items)'
          echo '=== RESOURCE POLICIES ==='
          gcloud compute instances describe "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" \
            --format='value(resourcePolicies)'
          echo '=== SERIAL BEFORE ==='
          gcloud compute instances get-serial-port-output "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" --port=1 2>&1 | tail -n 350
      - name: Reproduce one start and capture transition
        shell: bash
        run: |
          set +e
          gcloud compute instances remove-metadata "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" \
            --keys=shutdown-script >/dev/null 2>&1 || true
          echo '=== START ==='
          gcloud compute instances start "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" --async 2>&1
          for i in $(seq 1 20); do
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            gcloud compute instances describe "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" \
              --format='value(status,lastStartTimestamp,lastStopTimestamp)' 2>&1
            sleep 3
          done
          echo '=== SERIAL AFTER ==='
          gcloud compute instances get-serial-port-output "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" --port=1 2>&1 | tail -n 700
          echo '=== INSTANCE FINAL ==='
          gcloud compute instances describe "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" \
            --format='yaml(status,lastStartTimestamp,lastStopTimestamp,metadata,resourcePolicies,scheduling)'
      - name: Read recent Compute audit logs
        shell: bash
        run: |
          set +e
          echo '=== GCE AUDIT LOGS LAST 30 MIN ==='
          gcloud logging read \
            'resource.type="gce_instance" AND resource.labels.instance_name="hv-dev-l4"' \
            --project="$PROJECT_ID" --freshness=30m --limit=100 --order=desc \
            --format='table(timestamp,protoPayload.methodName,protoPayload.authenticationInfo.principalEmail,protoPayload.status.code,protoPayload.status.message,operation.id)' 2>&1
          echo '=== GUEST LOG EVENTS LAST 30 MIN ==='
          gcloud logging read \
            'resource.type="gce_instance" AND resource.labels.instance_name="hv-dev-l4"' \
            --project="$PROJECT_ID" --freshness=30m --limit=100 --order=desc \
            --format='value(timestamp,logName,textPayload,jsonPayload.message)' 2>&1 | tail -n 300
