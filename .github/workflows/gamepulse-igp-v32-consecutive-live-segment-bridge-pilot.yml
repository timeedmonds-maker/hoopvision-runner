# Private SHA-NBA original 5 game research; public logs aggregate counts only.
name: IGP 3.2 V2 player live-PBP source segment bridge fivegame
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-consecutive-live-segment-bridge-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-live-pbp-same-ten-bridge
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard and cloned private NBA source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_live_consecutive_segment_bridge_shadow_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_live_consecutive_segment_bridge_shadow_v1.py'
      - name: Run accepted-vs-shadow all original source same-clock 10Hz QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_live_consecutive_segment_bridge_shadow_v1.py \
            --root . --games 0022600006,0022600086,0022600111,0022600122,0022600130 \
            --max-mask-per-game 200 --output "$RUNNER_TEMP/igp-v32-live-bridge.json" \
            >"$RUNNER_TEMP/private-bridge.log" 2>&1 || {
              echo IGP_V32_SOURCE_LIVE_PBP_BRIDGE_QA_FAILED
              exit 91
            }
          grep '^IGP_V32_LIVE_SEGMENT_BRIDGE_SOURCE_SHADOW' "$RUNNER_TEMP/private-bridge.log" || true
      - name: Commit source-backed bridge QA to private repository only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_consecutive_live_pbp_bridge_fivegame_shadow_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v32bridge "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-v32-live-bridge.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo V32_BRIDGE_QA_ALREADY_PRESENT;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): fivegame source-running NBA PBP contiguous same-lineup bridge shadow'
          for n in 1 2 3 4 5 6;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo IGP_V32_PRIVATE_LIVE_BRIDGE_QA_COMMITTED;exit 0;fi
            sleep "$n"
          done
          exit 92
