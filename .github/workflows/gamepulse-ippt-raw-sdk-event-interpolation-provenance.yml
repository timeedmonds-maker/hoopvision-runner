name: IPPT original raw NBA SDK release shot event interpolation provenance pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-raw-sdk-event-interpolation-provenance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  per-actor-original-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      GAME_ID: "0022600001"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard and original NBA source read-only private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
              "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
              gamepulse/fusion data/extensions/nba_blueprint_2026_27
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Original per-actor SDK source flag source-free test
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_raw_sdk_release_event_source_flag_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_raw_sdk_release_event_source_flag_2026.py
      - name: Download original private immutable SDK TAR source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-sdk"
          gh release download "gamepulse-sdk-$GAME_ID" \
             --repo timeedmonds-maker/104 \
             --pattern 'sdk-part-*.tar.gz' \
             --dir "$RUNNER_TEMP/original-sdk"
          echo "ORIGINAL_NBA_SDK_ARCHIVES_DOWNLOADED_IN_PRIVATE_RUNNER_ONLY"
      - name: SHA original native event flags exact source XYZ actor matches
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_raw_sdk_release_event_source_flag_2026.py \
             --root . --game-id "$GAME_ID" --archive-dir "$RUNNER_TEMP/original-sdk"
          echo "IPPT_RAW_SDK_INTERPOLATED_VARIANT_ONE_GAME_ACTOR_QA_PASS"

# Original licensed raw assets remain in temporary private runner storage, only aggregate flags logged.

# One-game earliest-capture provenance crosscheck isolates archival source readback.
