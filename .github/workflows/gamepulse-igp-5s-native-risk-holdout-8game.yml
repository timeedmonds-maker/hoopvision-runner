name: "IGP five-second motion risk source train6 heldout2"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-5s-native-risk-holdout-8game.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-five-second-motion-risk-train6-test2
  cancel-in-progress: false
jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and clone original canonical NBA SHA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Source-free motion risk and no-fake-confidence regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_5s_native_motion_risk_gate_8game_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_5s_native_motion_risk_gate_8game_v1.py'
      - name: Train source risk filter on six NBA games and test on two without refit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_5s_native_motion_risk_gate_8game_v1.py --root . \
            --max-cases 150 \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_5s_native_motion_risk_train6_test2_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_5s_native_motion_risk_train6_test2_v1.json")
          q=json.loads(p.read_bytes())
          assert len(q["training_games"])==6 and len(q["heldout_games"])==2
          assert len(q["games"])==8
          assert q["source_verified_games"]==8
          assert q["entire_5second_masked_target_excluded_from_selection_features"]
          assert q["heldout_game_XYZ_not_used_to_choose_gate"]
          assert q["not_independent_video_accuracy"]
          assert q["not_production_promoted"]
          assert q["certified_physical_possessions"]==0
          assert q["all_evaluable_training"]["source_heldout_samples"]>=500
          assert q["all_evaluable_heldout"]["source_heldout_samples"]>=100
          print("IGP_5S_EIGHTGAME_SOURCE_RISK_TRAIN_TEST_ACCEPTED",json.dumps({
            "train_p95":q["all_evaluable_training"]["p95_error_ft"],
            "train_selected_gate":q["training_gate"],
            "test_p95_unfiltered":q["all_evaluable_heldout"]["p95_error_ft"],
            "test_selected":q["heldout_gate_result"],
            "physical_video_truth_labels":0},sort_keys=True))
          PY
      - name: Commit private native source 5s model risk QA, no coordinates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_5s_native_motion_risk_train6_test2_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): six training NBA games heldout two-game five-second motion prediction risk"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_5S_SOURCE_RISK_EIGHTGAME_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$try"
          done
          exit 23
