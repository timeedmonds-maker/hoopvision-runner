name: Rockets official logged-UTC chronology overlap QA (private only)
# Free GitHub CPU. Private original NBA/PBP and frame-window data never leave private 104.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-rockets-official-utc-overlap-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rockets-original-utc-overlap-graph
  cancel-in-progress: false
jobs:
  private-utc-overlap-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Protect private source and validate destination
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
          echo PRIVATE_SOURCE_EPHEMERAL_ONLY
      - name: Recompute source-SHA-pinned official logged-UTC chronology conflict graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          SCRIPT=gamepulse/fusion/igp_rockets_logged_utc_overlap_graph_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261027/rockets_spurs_logged_utc_overlap_graph_20261028.json
          python3 -m py_compile "$SCRIPT"
          python3 "$SCRIPT" --selftest
          test ! -e "$OUT"
          python3 "$SCRIPT" --root . --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["official_PBP_actions"]==586
          assert x["official_logical_chains"]==200
          assert x["coherent_logged_utc_windows"]==192
          assert x["coherent_window_overlap_pairs"]==26
          assert x["cross_period_overlap_pairs"]==3
          assert x["fully_contained_overlap_pairs"]==23
          assert len(x["zero_unique_frame_ambiguous_chains"])==15
          assert len(x["short_logged_utc_zero_frame_chains"])==3
          assert x["physical_possessions_certified"]==0
          assert x["candidate_frame_membership_modified"] is False
          assert x["full_gameplay_tracking_certified"] is False
          print("ROCKETS_PRIVATE_UTC_CHRONOLOGY_SOURCE_QA_ACCEPTED",x["coherent_window_overlap_pairs"])
          PY
      - name: Publish SHA-checked aggregate report exclusively in private 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261027/rockets_spurs_logged_utc_overlap_graph_20261028.json
          git config user.name 'Game Pulse Free CPU QA'
          git config user.email 'gamepulse-integrity@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          git commit -qm "qa(igp): retain source chronology overlap graph for Rockets"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo ROCKETS_PRIVATE_UTC_OVERLAP_QA_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          echo PRIVATE_QA_PUSH_FAILED
          exit 13
