name: Clip Lab event80 original frozen v3.1 CPU physical tracks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-rockets-event80-frozen-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-lab-rockets-event80-frozen-cpu
  cancel-in-progress: false
jobs:
  cpu-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      HOOPVISION_IDENTITY_ONLY: '1'
      HOOPVISION_TRACKING_ANALYSIS_ONLY: '1'
      OMP_NUM_THREADS: '4'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private-only output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-rockets-event80-frozen-cpu.yml'])
          print('ORIGINAL_FROZEN_CPU_PROBE_PUBLIC_BOUNDARY_PASS')
          PY
          test -n "${GH_TOKEN:-}" || exit 3
          # The rate_limit endpoint does not spend private GitHub REST quota.
          # Never rerun the costly original CPU inference when the auth quota
          # cannot also publish its results safely.
          QUOTA="$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo 0)"
          if [ "$QUOTA" -lt 100 ]; then
            RESET="$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || echo 0)"
            echo "PRIVATE_GITHUB_AUTH_QUOTA_NOT_READY reset_unix=$RESET"
            exit 7
          fi
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Install exact frozen v3.1 fast physical-tracking dependencies
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/frozen-event80-full20"
          mkdir -p "$ROOT/hoopvision/core" "$ROOT/tools" "$ROOT/models" "$ROOT/repos"
          touch "$ROOT/hoopvision/__init__.py" "$ROOT/hoopvision/core/__init__.py"
          for f in adams_screen_prod_v3.py adams_screen_prod_poc.py fetch_official_nba_event_clip.py render_deterministic_master.py; do
            gh api "repos/timeedmonds-maker/104/contents/tools/$f?ref=courtcoder%2Fintegration" --jq .content | base64 -d > "$ROOT/tools/$f"
          done
          for f in temporal_court_recovery.py court_standards.py; do
            gh api "repos/timeedmonds-maker/104/contents/hoopvision/core/$f?ref=courtcoder%2Fintegration" --jq .content | base64 -d > "$ROOT/hoopvision/core/$f"
          done
          gh release download clip-lab-hls-0022600009-80 --repo timeedmonds-maker/104 --pattern 'event80-broadcast.mp4' --dir "$ROOT" >/dev/null
          for item in \
            'trackers https://github.com/roboflow/trackers.git 3fb83d1618f29b7fdd4617757b6894e4ec71146d' \
            'ode https://github.com/ortizeg/object-detection-eval.git bcf6279073af042c3a5084a041f6c5d8e71e6af1' \
            'nbacv https://github.com/cyrushadavi1/nba_video_analysis_v2.git b7b115c7ace11348512c0ebfb679b48cad35f1fb'; do
            read -r name url commit <<< "$item"
            git init -q "$ROOT/repos/$name"
            git -C "$ROOT/repos/$name" remote add origin "$url"
            git -C "$ROOT/repos/$name" fetch -q --depth 1 origin "$commit"
            git -C "$ROOT/repos/$name" checkout -q --detach FETCH_HEAD
          done
          rm -f "$ROOT/repos/nbacv/src/nbacv/jersey.py" "$ROOT/repos/nbacv/scripts/bench_jersey_ocr.py"
          # Upstream metadata cannot resolve in one environment:
          # trackers 2.6.0 requires numpy>=2.0.2, while ODE 0.1.0
          # requires numpy<2. The original frozen pipeline uses the
          # older ODE/RF-DETR inference contract. Install pinned
          # runtime dependencies explicitly, then editable packages
          # without incompatible METADATA resolution. Import-smoke
          # both and fail closed before running the actual detector.
          python3 -m pip install --quiet 'numpy==1.26.4' pandas scipy pillow opencv-python-headless==4.10.0.84
          python3 -m pip install --quiet 'supervision==0.29.1' ultralytics 'onnxruntime>=1.23.2,<2' pyreadr requests timm pyyaml gdown
          python3 -m pip install --quiet 'rich>=13' 'pydeprecate>=0.8' 'jsonargparse>=4.48,<5' pydantic hydra-core loguru pycocotools matplotlib tqdm orjson httpx
          python3 -m pip install --quiet --no-deps -e "$ROOT/repos/trackers" -e "$ROOT/repos/ode"
          # Some downstream transitive dependencies reinstall NumPy 2.x after
          # the initial pin. Restore the original ODE/RF-DETR 1.26 ABI
          # explicitly without re-resolving the conflicting package metadata.
          python3 -m pip install --quiet --force-reinstall --no-deps 'numpy==1.26.4'
          PYTHONPATH="$ROOT/repos/nbacv/src" python3 - <<'PY'
          import numpy, supervision, cv2
          import trackers
          import object_detection_eval
          assert numpy.__version__.startswith('1.26.')
          print('ORIGINAL_FROZEN_CPU_DEPENDENCY_SMOKE_PASS')
          PY
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          curl -L --fail --retry 3 --silent --show-error \
            'https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx' -o "$ROOT/models/rfdetr_m_640.onnx"
          test "$(sha256sum "$ROOT/models/rfdetr_m_640.onnx" | cut -d' ' -f1)" = '708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939'
          curl -L --fail --retry 3 --silent --show-error \
            'https://huggingface.co/AnzeZ/basketball-court-yolo11m-pose/resolve/main/best.pt' -o "$ROOT/models/court_yolo11m_pose.pt"
          echo ORIGINAL_FROZEN_CPU_MODELS_VERIFIED
      - name: Probe 3 seconds of ORIGINAL frozen player detector and court solver
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/frozen-event80-full20"
          mkdir -p "$ROOT/output"
          START="$(date +%s)"
          set +e
          PYTHONPATH="$ROOT:$ROOT/tools:$ROOT/repos/nbacv/src" \
            python3 "$ROOT/tools/adams_screen_prod_v3.py" \
              --game 0022600009 --event 80 \
              --source-file "$ROOT/event80-broadcast.mp4" \
              --out "$ROOT/output" \
              --detector-onnx "$ROOT/models/rfdetr_m_640.onnx" \
              --object-eval-src "$ROOT/repos/ode/src" \
              --court-model "$ROOT/models/court_yolo11m_pose.pt" \
              --nbacv-src "$ROOT/repos/nbacv/src" \
              --analysis-fps 6 --court-fps 2 --number-fps 1 \
              --start-s 0 --end-s 20.3 --court-device cpu \
              > "$ROOT/full20-probe.log" 2>&1
          RC=$?
          set -e
          END="$(date +%s)"
          python3 - "$ROOT" "$RC" "$((END-START))" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);rc=int(sys.argv[2]);wall=int(sys.argv[3])
          out=root/'output'
          files={name:(out/name).exists() for name in ('tracks.csv','court_frames.json','qa.json')}
          track_rows=max(0,len((out/'tracks.csv').read_text().splitlines())-1) if files['tracks.csv'] else 0
          court_records=json.loads((out/'court_frames.json').read_text()) if files['court_frames.json'] else []
          court_frame_count=len(court_records)
          court_calibrated_count=sum(1 for rec in court_records if rec.get('H') is not None)

          report={'schema':'hoopvision.clip-lab.frozen-v31-cpu-perception-full20.v1',
                  'game_id':'0022600009','event':80,'source':'original frozen v3.1 adams_screen_prod_v3.py',
                  'source_clip':'private NBA exact event80 Broadcast original HLS',
                  'cpu_only':True,'gpu_used':False,'pilot_seconds':20.3,
                  'analysis_fps':6,'court_fps':2,'elapsed_wall_s':wall,
                  'return_code':rc,'files':files,'track_rows':track_rows,'court_frame_count':court_frame_count,'calibrated_court_h_frames':court_calibrated_count,
                  'state':('CPU_ORIGINAL_FROZEN_TRACKER_FULL20_PASS' if rc==0 and track_rows>=8 and court_calibrated_count>=3 else
                  'CPU_BODY_TRACKS_PASS_COURT_CALIBRATION_NOT_CERTIFIED' if rc==0 and track_rows>=8 else
                  'CPU_ORIGINAL_FROZEN_TRACKER_FULL20_FAILED'),
                  'blackwell_required':None,
                  'next':'Validate both tracked physical paths and camera geometry across entire 20s source; then select ROI 8.2s and apply original frozen ring presentation'}
          (root/'cpu_frozen_full20_qa.json').write_text(json.dumps(report,indent=2)+'\n')
          print('ORIGINAL_FROZEN_CPU_PERCEPTION_FULL20_STATE',report['state'],'wall_s',wall)
          PY
          # The GitHub App token has private Contents write but a release-upload
          # redirect may fail. Persist the small tracking/calibration artifacts
          # directly into PRIVATE 104 as SHA-verified git files.
          python3 - "$ROOT" <<'PY'
          import base64,hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          files={
              'gamepulse/clip_lab/qa/event80_frozen_full20_qa.json':root/'cpu_frozen_full20_qa.json',
              'gamepulse/clip_lab/qa/event80_frozen_full20_tracks.csv':root/'output'/'tracks.csv',
              'gamepulse/clip_lab/qa/event80_frozen_full20_court_frames.json':root/'output'/'court_frames.json',
          }
          for path,src in files.items():
              if not src.is_file() or not src.stat().st_size:
                  if 'qa.json' in path:raise RuntimeError('PRIVATE_CPU_QA_MISSING')
                  print('ORIGINAL_FROZEN_SOURCE_ARTIFACT_MISSING',path.rsplit('/',1)[-1])
                  continue
              if src.stat().st_size>900_000:raise RuntimeError('PRIVATE_TRACK_FILE_EXCEEDS_CONTENTS_API_CAP')
              endpoint='repos/timeedmonds-maker/104/contents/'+path
              old=subprocess.run(['gh','api',endpoint],capture_output=True,text=True,timeout=25)
              req={'branch':'main','message':'data(clip-lab): original frozen v3.1 CPU event80 tracking and court evidence',
                   'content':base64.b64encode(src.read_bytes()).decode()}
              if old.returncode==0:req['sha']=json.loads(old.stdout)['sha']
              elif '404' not in old.stderr and 'Not Found' not in old.stderr:
                  raise RuntimeError('PRIVATE_DESTINATION_INSPECTION_FAILED')
              pushed=subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],
                  input=json.dumps(req),capture_output=True,text=True,timeout=50)
              if pushed.returncode:raise RuntimeError('PRIVATE_TRACK_DATA_WRITE_FAILED')
              verify=subprocess.run(['gh','api',endpoint,'--jq','.content'],
                  capture_output=True,text=True,check=True,timeout=30)
              assert hashlib.sha256(base64.b64decode(verify.stdout)).digest()==hashlib.sha256(src.read_bytes()).digest()
              print('ORIGINAL_FROZEN_PRIVATE_SHA_READBACK_PASS',src.name)
          PY
          echo ORIGINAL_FROZEN_CPU_FULL20_PRIVATE_QA_PUBLISHED
