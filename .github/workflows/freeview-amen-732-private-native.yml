# Public runner supplies CPU only; no source media, private data, or result artifacts stored publicly.
name: Amen Wemby 732 private Freeview native cameras
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen-732-private-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freeview-amen-732-private-native
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private-only source boundary
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from public_content_guard import scan
          problems = scan(['.github/workflows/freeview-amen-732-private-native.yml'])
          if problems:
              for code, path in problems:
                  print('SOURCE_BOUNDARY_FAIL', code, path)
              raise SystemExit(3)
          print('FREEVIEW_PUBLIC_CONTENT_GUARD_PASS')
          PY
      - name: Fetch approved private code and native event media
        shell: bash
        run: |
          set -euo pipefail
          echo STAGE_TOKEN_PRESENT_CHECK
          test -n "$GH_TOKEN" || { echo PRIVATE_TOKEN_MISSING; exit 3; }
          echo STAGE_PRIVATE_REPO_CHECK
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          echo STAGE_PRIVATE_REPO_OK
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/hoopvision/freeview" "$TMP/evidence"
          touch "$TMP/hoopvision/__init__.py" "$TMP/hoopvision/freeview/__init__.py"
          echo STAGE_FETCH_PRIVATE_HELPERS
          for file in fetch_official_multicam.py provenance_engine.py; do
            gh api "repos/timeedmonds-maker/104/contents/hoopvision/freeview/$file?ref=b154a834a95a887226757a4ff0d5b34f69bc55e6" \
              --jq .content | base64 -d > "$TMP/hoopvision/freeview/$file"
          done
          echo STAGE_FETCH_PRIVATE_ENGINE
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/fetch_event_native_multicam.py?ref=9d93273a1612fbf0430b6def74a6b1f2078d80c6' \
            --jq .content | base64 -d > "$TMP/hoopvision/freeview/fetch_event_native_multicam.py"
          echo STAGE_FETCH_BLUEPRINT
          gh api 'repos/timeedmonds-maker/104/contents/data/extensions/nba_blueprint_2026_27/priority_0022600009_source_status.json?ref=main' \
            --jq .content | base64 -d > "$TMP/blueprint.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/qa/0022600009.json?ref=main' \
            --jq .content | base64 -d > "$TMP/pulse-qa.json"
          echo STAGE_DEPENDENCIES
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' opencv-python-headless==4.10.0.84
          echo STAGE_FFMPEG_CHECK
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          command -v ffmpeg
          command -v ffprobe
          echo STAGE_SELFTEST
          PYTHONPATH="$TMP" python3 -m hoopvision.freeview.fetch_event_native_multicam --selftest
          echo STAGE_NATIVE_SOURCE
          PYTHONPATH="$TMP" python3 -m hoopvision.freeview.fetch_event_native_multicam \
            --game 0022600009 --event 732 \
            --blueprint "$TMP/blueprint.json" --pulse-qa "$TMP/pulse-qa.json" \
            --out "$TMP/evidence" --publish
          echo 'PRIVATE_FREEVIEW_ORIGINAL_MULTICAM_EVIDENCE_PUBLISHED'
