name: Integrated Pulse unified 28-game original native source search
# CPU-only public execution; all source/player records and search results stay PRIVATE.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-unified-native-search.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-pulse-private-unified-original-native-source-query
  cancel-in-progress: false
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      SOURCE_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public source boundary and private repository credential
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_AUTH_REQUIRED'; exit 3; }
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
      - name: Fetch trusted private query code and verify five synthetic evidence-tier regressions
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/private-unified-native"
          mkdir -p "$WORK/gamepulse/fusion/tests"
          fetch() {
            local path="$1" ref="$2"
            mkdir -p "$(dirname "$WORK/$path")"
            gh api "repos/$PRIVATE_REPO/contents/$path?ref=$ref" --jq .content |
              base64 --decode > "$WORK/$path"
            test -s "$WORK/$path"
          }
          fetch gamepulse/fusion/native_label_season_search_2026.py "$SOURCE_REF"
          fetch gamepulse/fusion/tests/test_native_label_season_search_2026.py "$SOURCE_REF"
          python3 -m py_compile "$WORK/gamepulse/fusion/native_label_season_search_2026.py"
          python3 -m unittest discover -v -s "$WORK/gamepulse/fusion/tests" \
            -p 'test_native_label_season_search_2026.py'
      - name: Fetch one immutable private source snapshot for all 28 season games
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/private-unified-native"
          SOURCE_COMMIT="$(gh api "repos/$PRIVATE_REPO/git/ref/heads/main" --jq .object.sha)"
          test "${#SOURCE_COMMIT}" -eq 40
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          fetch() {
            local path="$1"
            mkdir -p "$(dirname "$WORK/$path")"
            gh api "repos/$PRIVATE_REPO/contents/$path?ref=$SOURCE_COMMIT" --jq .content |
              base64 --decode > "$WORK/$path"
            test -s "$WORK/$path"
          }
          for p in \
            gamepulse/catalog/2026-27-integrated-current.json \
            gamepulse/fusion/index/interactions/index-2026-27.json \
            gamepulse/fusion/index/unassigned_native_labels/index-2026-27.json \
            gamepulse/fusion/index/quarantined_native_labels/index-2026-27.json; do
            fetch "$p"
          done
          python3 - "$WORK" > "$RUNNER_TEMP/native-private-paths.txt" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])/"gamepulse/fusion/index"
          for folder in ("interactions","unassigned_native_labels","quarantined_native_labels"):
              doc=json.loads((root/folder/"index-2026-27.json").read_text())
              for gid in sorted(doc["games"]):
                  print("gamepulse/fusion/index/"+folder+"/"+gid+".json")
          PY
          while IFS= read -r src; do
            fetch "$src"
          done < "$RUNNER_TEMP/native-private-paths.txt"
      - name: Verify all current-season source labels and privately query Durant
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/private-unified-native"
          PY="$WORK/gamepulse/fusion/native_label_season_search_2026.py"
          python3 "$PY" --root "$WORK" --limit 1 \
            --out "$RUNNER_TEMP/unified-season-check.json"
          python3 "$PY" --root "$WORK" --player-id 201142 --limit 1500 \
            --out "$RUNNER_TEMP/durant-original-native-labels.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          doc=json.loads((root/"unified-season-check.json").read_text())
          assert doc["captured_season_games_checked"]==28
          assert doc["source_join_tier_games"]==28
          assert doc["source_clock_quarantine_games"]==0
          assert doc["archived_source_clock_quarantine_games"]==2
          assert doc["physical_possessions_certified"]==0
          tiers=doc["source_native_label_totals_by_tier"]
          assert len(tiers)==2
          assert tiers["VERIFIED_SOURCE_NATIVE_TOUCH_TO_NBA_TEAM_ACTION_RUN"]==12557
          assert tiers["SOURCE_NATIVE_UNATTRIBUTED_TO_PBP_RUN"]==11553
          assert "SOURCE_NATIVE_PBP_CLOCK_QUARANTINED" not in tiers
          assert sum(tiers.values())==24110
          one=json.loads((root/"durant-original-native-labels.json").read_text())
          assert one["requested_player_id"]=="201142"
          assert one["captured_season_games_checked"]==28
          assert one["physical_possessions_certified"]==0
          print("PRIVATE_UNIFIED_SOURCE_LABEL_SEARCH_ACCEPTED",
                "games",28,"source_evidence_tiers",2,"physical_possessions_certified",0)
          PY
      - name: Persist only private search report and player query with original SHA readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time
          from pathlib import Path
          repo=os.environ["PRIVATE_REPO"]
          home=Path(os.environ["RUNNER_TEMP"])
          source=json.loads((home/"unified-season-check.json").read_text())
          summary={k:v for k,v in source.items() if k not in
                   ("source_labels","source_manifest_sha256")}
          summary["source_manifest_sha256"]=source["source_manifest_sha256"]
          summary["source_repository_commit"]=os.environ["SOURCE_COMMIT"]
          files={
            "gamepulse/fusion/index/unified_native_source_search_status.json":
              (json.dumps(summary,indent=2,sort_keys=True)+"\n").encode(),
            "gamepulse/fusion/queries/durant_original_native_source_season_2026.json":
              (home/"durant-original-native-labels.json").read_bytes()}
          def gh(*args,input=None,check=True):
              p=subprocess.run(["gh","api",*args],input=input,text=True,
                               capture_output=True,timeout=100)
              if check and p.returncode:raise RuntimeError("PRIVATE_UNIFIED_SOURCE_API_FAILED")
              return p
          for path,data in files.items():
              endpoint="repos/"+repo+"/contents/"+path
              for attempt in range(10):
                  old=gh(endpoint,check=False)
                  payload={"branch":"main","message":"data(gamepulse): verify unified 28-game source-native label query",
                           "content":base64.b64encode(data).decode()}
                  if old.returncode==0:
                      obj=json.loads(old.stdout)
                      if base64.b64decode(obj["content"])==data:break
                      payload["sha"]=obj["sha"]
                  elif "404" not in old.stderr and "Not Found" not in old.stderr:
                      raise RuntimeError("PRIVATE_UNIFIED_SOURCE_PREVIOUS_READ_FAILED")
                  resp=gh("-X","PUT",endpoint,"--input","-",input=json.dumps(payload),check=False)
                  if resp.returncode:time.sleep(attempt+1);continue
                  sha=json.loads(resp.stdout)["content"]["sha"]
                  blob=json.loads(gh("repos/"+repo+"/git/blobs/"+sha).stdout)
                  received=base64.b64decode(blob["content"])
                  assert received==data and hashlib.sha256(received).digest()==hashlib.sha256(data).digest()
                  break
              else:raise RuntimeError("PRIVATE_UNIFIED_NATIVE_SOURCE_PUBLISH_FAILED")
          print("PRIVATE_UNIFIED_SOURCE_SEARCH_SHA_VERIFIED")
          PY
