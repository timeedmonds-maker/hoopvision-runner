name: PR776 targeted P2 rebound Broadcast recovery with native ffmpeg
# Exact ONE previously approved rebound action; source media and QA private.
# Reviewed by tools/public_content_guard.py allowlist; no public raw media or XYZ.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-rebound-video-recovery.yml'
permissions: {contents: read}
concurrency:
  group: pr776-p2-rebound-native-ffmpeg
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard private access and fetch exact canonical P2 probe
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE" --jq .private)" = true
          cat > "$RUNNER_TEMP/p2-askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/p2-askpass"
          echo "GIT_ASKPASS=$RUNNER_TEMP/p2-askpass" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          export GIT_ASKPASS="$RUNNER_TEMP/p2-askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/p2-private"
          git -C "$RUNNER_TEMP/p2-private" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/p2-private" >> "$GITHUB_ENV"
      - name: Install proven full system ffmpeg (not ephemeral imageio binary)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null
          command -v ffmpeg
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          echo P2_PROVEN_SYSTEM_FFMPEG_LIBX264_READY
      - name: Test and execute ONE source-proven NBA Broadcast #628 intake
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_p2_rebound_broadcast_visual_probe_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_p2_rebound_broadcast_visual_probe_2026.py'
          python3 gamepulse/fusion/igp_p2_rebound_broadcast_visual_probe_2026.py \
            --root . --out gamepulse/fusion/qa/igp_progress_20261027/wallclock_p2_first_rebound_broadcast_visual_36.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261027/wallclock_p2_first_rebound_broadcast_visual_36.json")
          d=json.loads(p.read_text())
          assert d["game_id"]=="0022600001" and d["NBA_action"]==628
          assert d["full_physical_possessions_certified"]==0
          print("P2_BROADCAST_SOURCE_STATUS",d["status"],
                "STAGE",d.get("capture_stage","NOT_SET"),
                "CODE",d.get("capture_diagnostic_code","NONE"))
          print("P2_SOURCE_REPLAY_DECODED",bool(d.get("private_visual_frame_count",0)),
                "SHA_RELEASE_VERIFIED",d.get("private_media_upload_sha_verified",False))
          PY
      - name: Persist only private original-source QA; never publish media
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          OUT=gamepulse/fusion/qa/igp_progress_20261027/wallclock_p2_first_rebound_broadcast_visual_36.json
          git add -f "$OUT"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -q -m "qa(igp): P2 Broadcast rebound proof from proven system ffmpeg"
          fi
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo P2_PRIVATE_BROADCAST_SOURCE_QA_SAVED
              exit 0
            fi
            sleep "$i"
          done
          exit 19
