name: Game Pulse gameplay cutoff verification (private result)
# Retain private frame QA even when the official reference API denies access.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-gameplay-audit.yml'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-gameplay-audit.yml'
      - 'tools/licensed_feed/verify_gameplay.py'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: gamepulse-gameplay-audit-private
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public content boundary and Python syntax
        run: |
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/licensed_feed/verify_gameplay.py
  private-gameplay-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate private checkpoint continuity through final whistle
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'PRIVATE_QA_CREDENTIAL_UNAVAILABLE'; exit 3; }
          python3 tools/licensed_feed/verify_gameplay.py
