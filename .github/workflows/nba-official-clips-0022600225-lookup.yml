# Read-only official NBA play-by-play lookup. No video, tracking, or licensed media.
name: NBA Official Clips event lookup 0022600225
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-official-clips-0022600225-lookup.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Public safety guard
        run: python3 tools/public_content_guard.py
      - name: Resolve exact source action number
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          gameid='0022600225'
          url=f'https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_{gameid}.json'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://www.nba.com/'})
          with urllib.request.urlopen(req,timeout=30) as resp:
              data=json.load(resp)
          events=data['game']['actions']
          matches=[]
          for row in events:
              if row.get('period')!=1:continue
              s=(row.get('description') or '')
              if row.get('personId')==203110 and ('10M18' in str(row.get('clock')) or '08M38' in str(row.get('clock'))):
                  matches.append(row)
          for row in matches:
              print('NBA_OFFICIAL_PBP_MATCH',json.dumps({k:row.get(k) for k in ['actionNumber','clock','description','period','personId','actionType','subType','scoreAway','scoreHome']},sort_keys=True))
              if row.get('actionNumber') is not None:
                  print('NBA_CLIPS_URL',f'https://clips.nba.com/?gameNo={gameid}&eventNum={row["actionNumber"]}&source=grs')
          if len(matches)<2:
              print('WARNING: expected both Q1 Draymond makes, found',len(matches))
          PY
