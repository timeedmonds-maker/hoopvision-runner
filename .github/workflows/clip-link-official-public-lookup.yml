name: Public NBA event clip lookup
on:
  push:
    branches: [public-clip-lookup-20261024]
    paths: [.github/workflows/clip-link-official-public-lookup.yml]
  workflow_dispatch:
jobs:
  official-public-event:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify NBA public multi-camera clip event pages
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,html
          for ev in (734,732):
            url="https://clips.nba.com/?gameNo=0022600009&eventNum="+str(ev)+"&source=grs"
            for agent in ("Mozilla/5.0 (compatible; HoopVision NBA formal-source audit)","Mozilla/5.0"):
              try:
                req=urllib.request.Request(url,headers={"User-Agent":agent,"Accept":"text/html","Referer":"https://www.nba.com/"})
                with urllib.request.urlopen(req,timeout=20) as resp:
                  status=resp.status; body=resp.read(950000).decode("utf-8","replace")
                print("CLIP",ev,"http",status,"bytes",len(body),"unavailable",("No video clip available" in body))
                titles=re.findall(r"<title[^>]*>(.*?)</title>",body,re.I|re.S)
                print("TITLE",ev,[html.unescape(re.sub(r"<[^>]+>","",x).strip()) for x in titles][:3])
                options=re.findall(r"<option[^>]*>(.*?)</option>",body,re.I|re.S)
                print("ANGLE_OPTIONS",ev,[html.unescape(re.sub(r"<[^>]+>","",x).strip()) for x in options][:24])
                print("HAS_PLAYER_NAME",ev,("Thompson" in body))
                print("HAS_HLS",ev,("lrmedia.nba.com" in body))
                break
              except Exception as e:
                print("CLIP_ERROR",ev,str(e)[:250])
          PY
