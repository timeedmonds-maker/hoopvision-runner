# V8 read-only official NBA chain -> separate original native and 10Hz S1 tiers.
# Retry after correcting the V8 source-free unit import path in private PR #776.
# All XYZ and original source data stay private; public logs show aggregate QA.
name: IGP 3.2 V8 unified 71 game original source chain query QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-v8-unified-native-chain-query.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-v8-unified-query-source-qa
  cancel-in-progress: false
jobs:
  v8-unified-original-source-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public source guard and V8 synthetic two-population query regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_v32_v8_unified_official_chain_original_native_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_v8_unified_official_chain_original_native_v1.py'
          echo IGP_V8_TWO_DISTINCT_NATIVE_AND_STRICT_10HZ_PROVENANCE_TESTS_PASS
      - name: Validate 54 supported and 17 unsupported NBA chain query source populations
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY' >"$RUNNER_TEMP/v8-original-private.log" 2>&1 || {
          import json,os,statistics,time
          from pathlib import Path
          from igp_v32_71_possession_fast_index_v1 import INDEX_DIR as V4
          from igp_v32_v7_native_official_logical_chain_bridge_v1 import DIR as V7
          from query_igp_v32_v8_unified_official_chain_original_native_v1 import query
          from igp_v32_v5_outside_s1_native_postings_v1 import canonical
          root=Path('.')
          v4=json.loads((root/V4/'index.json').read_bytes())
          v7=json.loads((root/V7/'index.json').read_bytes())
          assert v4['games']==71 and v4['official_NBA_logical_chains']==14612
          assert v7['games']==54 and v7['original_native_postings']==39996
          assert len(v4['parts'])==71 and len(v7['parts'])==54
          counts={'supported_queries':0,'unsupported_queries':0,
                  'source_original_native_XYZ_readback':0,
                  'supported_links_verified':0}
          sample_ms=[]
          for gid,item in sorted(v4['parts'].items()):
              chains=json.loads((root/V4/item['path']).read_bytes())['chains']
              if not chains:raise ValueError('V8_OFFICIAL_NBA_LOGICAL_GAME_WITH_NO_CHAINS')
              if gid in v7['parts']:
                  p=json.loads((root/V7/v7['parts'][gid]['path']).read_bytes())
                  tagged=sorted({r['chain_id'] for r in p['links'] if r['chain_id']})
                  cid=tagged[0] if tagged else chains[0]['chain_id']
                  started=time.perf_counter()
                  z=query(root,gid,cid,native_limit=1,
                          include_native_original_XYZ=bool(tagged))
                  sample_ms.append((time.perf_counter()-started)*1000)
                  assert z['strict_S1_and_native_are_disjoint_evaluation_populations']
                  assert not z['physical_custody_certified']
                  assert not z['accepted_S1_10hz_tracking_changed']
                  if tagged:
                      assert z['outside_S1_original_sdk_native_V7']['matched_original_native_postings']>=1
                      assert z['outside_S1_original_sdk_native_V7']['rows'][0]['source_original_XYZ'] is not None
                      counts['source_original_native_XYZ_readback']+=1
                      counts['supported_links_verified']+=1
                  counts['supported_queries']+=1
              else:
                  z=query(root,gid,chains[0]['chain_id'],native_limit=1)
                  assert z['outside_S1_original_sdk_native_V7']['status']==(
                      'NO_SHA_ORIGINAL_COMPANION_CLOCK_SOURCE_FOR_THIS_GAME')
                  assert z['strict_S1_10hz_source_QA_and_denominators'][
                      'new_native_postings_outside_S1_linked_to_logical_chain'] is None
                  counts['unsupported_queries']+=1
          assert counts['supported_queries']==54
          assert counts['unsupported_queries']==17
          assert counts['source_original_native_XYZ_readback']>0
          # Real-original source deep path: existing accepted V4 includes full
          # SHA validated native tracking, separately from V7 original-native.
          import random
          pick='0022600001'
          selected=json.loads((root/V4/v4['parts'][pick]['path']).read_bytes())['chains']
          q=query(root,pick,selected[2]['chain_id'],include_strict_S1_deep=True,
                 strict_limit=2,native_limit=1)
          assert q['nba_official_logical_chain_metadata_V4']['tracking_usability']==selected[2]
          assert not q['physical_custody_certified']
          counts['strict_S1_deep_original_source_queries']=1
          receipt={'schema':'igp.v32.v8.71game.unified-54native-original-NBA-chain-real-readback-qa.v1',
             'games_total':71,'source_supported_games':54,'source_companion_unsupported_games':17,
             'official_logical_NBA_chains_conserved':14612,'outside_S1_native_postings_indexed':39996,
             'original_SDK_XYZ_source_readbacks':counts['source_original_native_XYZ_readback'],
             'strict_S1_deep_original_source_queries':counts['strict_S1_deep_original_source_queries'],
             'source_only_54game_query_ms_p50':round(statistics.median(sample_ms),4),
             'source_only_54game_query_ms_max':round(max(sample_ms),4),
             'source_only_query_sample_count':len(sample_ms),
             'source_only_query_metric_is_not_population_p95':True,
             'original_NBA_PBP_and_SDK_immutable':True,
             'outside_native_10hz_population_denominators_never_combined':True,
             'independent_video_accuracy_certified':False,
             'physical_possessions_certified':0,
             'new_accepted_S1_10hz_scenes':0}
          (Path(os.environ['RUNNER_TEMP'])/'v8-original-qa.json').write_bytes(canonical(receipt))
          print('IGP_V8_SOURCE_QUERY_ACCEPTED',json.dumps({
             'games':71,'native_with_companion':54,'without_companion':17,
             'original_XYZ_game_readbacks':counts['source_original_native_XYZ_readback'],
             'strict_source_deep':1,
             'median_metadata_plus_sample_native_XYZ_ms':receipt['source_only_54game_query_ms_p50'],
             'no_physical_custody_claim':True},sort_keys=True))
          PY
            echo IGP_V8_ORIGINAL_SOURCE_QUERY_OR_POPULATION_GATE_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'v8-original-private.log').read_text(errors='replace').splitlines()
          last=next((s for s in reversed(lines) if re.match(
            r'^(?:ValueError|KeyError|TypeError|AssertionError|FileNotFoundError|ImportError|IndexError):',s)),None)
          print('IGP_V8_PRIVATE_FAILURE_REASON',re.sub(r'[0-9]{4,}','[ID]',last or 'UNKNOWN')[:180])
          PY
            exit 41
          }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'v8-original-qa.json').read_bytes())
          assert q['games_total']==71 and q['source_supported_games']==54
          assert q['source_companion_unsupported_games']==17
          assert q['official_logical_NBA_chains_conserved']==14612
          assert q['outside_S1_native_postings_indexed']==39996
          assert q['original_SDK_XYZ_source_readbacks']>0
          assert q['strict_S1_deep_original_source_queries']==1
          assert q['new_accepted_S1_10hz_scenes']==0
          print('IGP_V8_ORIGINAL_NATIVE_STRICT_S1_71GAME_CROSS_SOURCE_ACCEPTANCE',
             json.dumps({'games':71,'supported':54,'unsupported':17,
               'original_game_readbacks':q['original_SDK_XYZ_source_readbacks'],
               'cold_sample_query_p50_ms':q['source_only_54game_query_ms_p50'],
               'new_accepted_S1_scenes':0},sort_keys=True))
          PY
      - name: Commit only V8 original QA receipt to private PR 776 branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_v32/igp_v32_v8_unified_71game_native_54_source_qa_v1.json
          cp "$RUNNER_TEMP/v8-original-qa.json" "$receipt"
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$receipt"
          git diff --cached --check
          git commit -q -m 'qa(igp): certify unified 71game NBA logical chain and 54 original-native source readback'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_V8_PRIVATE_ORIGINAL_SHA_CROSS_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
