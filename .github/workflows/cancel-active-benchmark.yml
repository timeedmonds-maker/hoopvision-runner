name: Cancel Active HoopVision Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-active-benchmark.yml'

concurrency:
  group: hoopvision-public-runner
  cancel-in-progress: true

jobs:
  cancel-active:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Cancelled superseded HoopVision runner work."
