name: Integrated Pulse PBP event snapshots 36-game original source QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-event-snapshot-36-census.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard plus original SHA NBA private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free event-time guard tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_event_snapshot_census_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_event_snapshot_census_2026.py
      - name: SHA readbacks NBA Rockets and game 0092 PBP actual source action time
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from igp_ippt_event_snapshot_census_2026 import run_game
          for gid in ("0022600009","0022600092"):
              r=run_game(".",gid)
              c=r["counts"]
              assert c["official_timed_analysis_actions"]>300
              assert c.get("event_nearest_source_within_500ms",0)>0
              assert c.get("official_ten_candidate_at_500ms",0)>0
              print("IGP_EVENT_SNAPSHOT_SHA_TWO_GAME_PASS",gid,{
                 "official_actions":c["official_all_actions"],
                 "timed_event_types":c["official_timed_analysis_actions"],
                 "nearest_original_within_500ms":c.get("event_nearest_source_within_500ms",0),
                 "official_ten_candidate_500ms":c.get("official_ten_candidate_at_500ms",0),
                 "action_person_original_500ms":c.get("action_person_original_XYZ_within_500ms_ASYNC",0),
                 "original_G3_eleven_at_source_nearest":c.get("all_official_ten_plus_ball_original_G3_500ms",0),
                 "physical_event_clock_NOT_certified":True})
          PY
      - name: Entire 36-game SHA NBA official actions matched to original native XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_ippt_event_snapshot_census_2026.py --root .
          echo "IGP_EVENT_SNAPSHOT_36_ORIGINAL_SOURCE_ACCEPTED"

# Public runner reports original source event-time/lineup aggregate only; private XYZ never printed.
