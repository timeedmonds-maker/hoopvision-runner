name: Amen 732 original 23-frame SAM2 source masks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-sam21-23-source-frames.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: amen732-private-source-23-sam21
  cancel-in-progress: false
jobs:
  original-sam2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      SAM2_BUILD_CUDA: '0'
      OMP_NUM_THREADS: '3'
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public policy and private source via git
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/sourceask" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/sourceask"
          export GIT_ASKPASS="$RUNNER_TEMP/sourceask" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/nba"
          git -C "$RUNNER_TEMP/nba" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo SAM21_PRIVATE_NBA_SOURCE_GIT_ACCESS_PASS
      - name: Install pinned CPU source model and run mask QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            'numpy<2' 'opencv-python-headless==4.10.0.84' \
            'hydra-core>=1.3,<1.4' 'iopath>=0.1.10,<0.2' 'pillow>=10,<12'
          cd "$RUNNER_TEMP/nba"
          export PYTHONPATH="$PWD/hoopvision/freeview"
          python3 hoopvision/freeview/amen732_sam21_original_23_pixels.py --selftest
          python3 -m pip install --quiet --disable-pip-version-check \
            'torch==2.5.1' 'torchvision==0.20.1' \
            --index-url 'https://download.pytorch.org/whl/cpu'
          mkdir -p "$RUNNER_TEMP/model"
          git init -q "$RUNNER_TEMP/model/sam2"
          git -C "$RUNNER_TEMP/model/sam2" fetch --quiet --depth 1 \
            https://github.com/facebookresearch/sam2.git 2b90b9f5ceec907a1c18123530e92e794ad901a4
          git -C "$RUNNER_TEMP/model/sam2" checkout -q --detach FETCH_HEAD
          SHA="$(git -C "$RUNNER_TEMP/model/sam2" rev-parse HEAD)"
          test "$SHA" = 2b90b9f5ceec907a1c18123530e92e794ad901a4
          python3 -m pip install --quiet --disable-pip-version-check \
            -e "$RUNNER_TEMP/model/sam2" --no-deps --no-build-isolation
          curl -fsSL --retry 2 --connect-timeout 20 \
            'https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_tiny.pt' \
            -o "$RUNNER_TEMP/model/sam2.1_hiera_tiny.pt"
          test "$(sha256sum "$RUNNER_TEMP/model/sam2.1_hiera_tiny.pt" | cut -d' ' -f1)" = \
            7402e0d864fa82708a20fbd15bc84245c2f26dff0eb43a4b5b93452deb34be69
          python3 hoopvision/freeview/amen732_sam21_original_23_pixels.py \
            --root hoopvision/freeview/fixtures \
            --fixture hoopvision/freeview/fixtures/amen732_native_ball_pixels_extended_v2_20261026.json \
            --checkpoint "$RUNNER_TEMP/model/sam2.1_hiera_tiny.pt" \
            --out hoopvision/freeview/fixtures/amen732_23source_sam21_ball_masks_20261026.json \
            --model-commit "$SHA"
          python3 - <<'PY'
          import json
          j=json.load(open('hoopvision/freeview/fixtures/amen732_23source_sam21_ball_masks_20261026.json'))
          assert j['summary']['candidate_native_frames']==24
          assert not j['world_camera_KRt_certified']
          assert not j['first_hand_ball_contact_certified']
          print('SAM21_23_SOURCE_NATIVE_MASK_QA_ACCEPTED_COUNTS',j['summary'])
          PY
      - name: Commit only to canonical private branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/nba"
          git config user.name 'HoopVision original source CPU'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_23source_sam21_ball_masks_20261026.json
          git diff --cached --check
          git commit -qm 'qa(freeview): SAM2 original camera ball candidate masks with independent source colour holdout'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_23_SOURCE_NATIVE_PRIVATE_MASK_QA_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
