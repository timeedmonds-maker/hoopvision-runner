name: IGP P3 joint all11 blackout frozen handler external source benchmark
# Explicitly guard-allowlisted, source SHA pinned; no licensed coordinates in public.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gamepulse-igp-p3-joint-all11-handler-blackout-v1.yml
permissions: {contents: read}
concurrency:
  group: igp-p3-joint-all11-handler-blackout-v1
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 0c819b70ed6b46f657bc46a594594d587d378e35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard licensed source privacy and original NBA SHA pin
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free tests and private original all11 same-case benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_joint_scene_handler_mask_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_joint_scene_handler_mask_v1.py --root . --output "$RUNNER_TEMP/p3-joint-private.json" > "$RUNNER_TEMP/p3-joint-private.log" 2>&1; then
            echo IGP_P3_PRIVATE_JOINT_BLACKOUT_EVALUATION_FAILED
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'p3-joint-private.json').read_text())
          assert len(q['games'])==4 and len(q['per_game'])==4
          a=q['methods']['c0']; b=q['methods']['frozen_handler']
          assert a['target_full_original_source_scenes']==256
          assert a['recovered_simultaneous_eleven']==236
          assert a['within_player_2ft_ball_3ft_source_proxy']==28
          assert abs(a['player_XY_error_ft']['p95_ft']-3.8537)<.001
          assert abs(a['ball_XYZ_error_ft']['p95_ft']-14.4203)<.001
          assert a['player_XY_error_ft']==b['player_XY_error_ft']
          assert q['no_accepted_68_game_coverage_delta']
          assert q['source_only_not_video_certified']
          print('IGP_P3_JOINT_SOURCE_GRADED_RESULTS',json.dumps({
            'centers':256,'handler_eligible':q['stable_handler_subgroup_methods']['c0']['target_full_original_source_scenes'],
            'C0_ball_p95_ft':a['ball_XYZ_error_ft']['p95_ft'],
            'joint_ball_p95_ft':b['ball_XYZ_error_ft']['p95_ft'],
            'C0_simultaneous_source_proxy':28,
            'joint_simultaneous_source_proxy':b['within_player_2ft_ball_3ft_source_proxy'],
            'promoted_scenes':0},sort_keys=True))
          PY
      - name: Save reproducible original-source receipt ONLY in private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_joint_all11_frozen_handler_blackout_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-joint "origin/$BRANCH"
          cp "$RUNNER_TEMP/p3-joint-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): source-masked joint all11 frozen handler and C0 p95 decision'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_PRIVATE_JOINT_ALL11_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
