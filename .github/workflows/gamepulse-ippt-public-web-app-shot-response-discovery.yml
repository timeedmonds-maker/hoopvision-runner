name: NBA public web mirrored Game Pulse AWS shot detail endpoint discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-public-web-app-shot-response-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  public-html-network-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce public safe path and inspect only NBA public web pages
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test "$GITHUB_REPOSITORY" = timeedmonds-maker/hoopvision-runner
      - name: Install ONLY public puppeteer-core outside private EaseLive SDK package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browserdeps"
          echo '{"private":true,"type":"module"}' > "$RUNNER_TEMP/browserdeps/package.json"
          npm install --prefix "$RUNNER_TEMP/browserdeps" --ignore-scripts --no-audit --no-fund --no-package-lock puppeteer-core@24.43.1
          ln -s "$RUNNER_TEMP/browserdeps/node_modules" tools/licensed_feed/node_modules
      - name: Probe official public NBA game/Blueprint JSON structural field names only
        run: |
          set -euo pipefail
          node tools/licensed_feed/public_web_shot_response_probe.mjs "$RUNNER_TEMP/safe.json" > "$RUNNER_TEMP/probe.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"safe.json").read_text())
          assert d["original_native_NBA_iOS_app_not_intercepted"]
          assert d["source_payload_or_auth_headers_exposed"] is False
          assert len(d["pages"])==2
          for a in d["pages"]:
              assert "?" not in a["page"]
              assert all("?" not in v for v in a.get("shot_like_public_endpoint_paths",[]))
          print("IPPT_PUBLIC_WEB_BROWSED_MIRRORED_SHOT_FIELD_SOURCE_COMPLETE",json.dumps(d))
          PY
      - name: Public metadata-only response paths report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"safe.json").read_text()) if (root/"safe.json").exists() else {"status":os.environ["STATUS"]}
          r.update({"run_id":os.environ["GITHUB_RUN_ID"]})
          (root/"report.md").write_text("NBA first-party PUBLIC web game/Blueprint response schema discovery; NO native iOS app interception, request credentials, response values or licensed tracking XYZ.\n\n~~~json\n"+json.dumps(r,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/report.md"
