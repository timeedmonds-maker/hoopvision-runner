# Metadata-only season chain index built in private repository; original XYZ
# and per-game PBP remain private; public logs show aggregate chain QA only.
name: IGP 3.2 V4 fast possession chain metadata materialization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-v4-fast-possession-index.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-v4-fast-possession
  cancel-in-progress: false
jobs:
  build-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and check out private NBA provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_71_possession_fast_index_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_71_possession_fast_index_v1.py'
          echo V4_SOURCE_FREE_INDEX_TESTS_PASS
      - name: Build original-v2-locked 71-game partitioned index, benchmark metadata lookups
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_71_possession_fast_index_v1.py \
            --build --root . >"$RUNNER_TEMP/private-v4-build.log" 2>&1 || {
              echo V4_PRIVATE_ORIGINAL_QA_INDEX_BUILD_FAILED
              exit 41
            }
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          from igp_v32_71_possession_fast_index_v1 import INDEX_DIR,query
          ix=json.loads((INDEX_DIR/'index.json').read_text())
          assert ix['games']==71 and ix['official_NBA_logical_chains']==14612
          assert len(ix['parts'])==71
          assert sum(e['chains'] for e in ix['parts'].values())==14612
          times=[]
          for gid in sorted(ix['parts'])[:3]:
              row=json.loads((INDEX_DIR/(gid+'.json')).read_text())['chains'][0]
              t=time.perf_counter()
              got=query('.',gid,row['chain_id'])
              elapsed=(time.perf_counter()-t)*1000
              assert got['tracking_usability']==row
              assert got['returns_original_XYZ'] is False
              assert got['physical_custody_start_end_certified'] is False
              times.append(round(elapsed,2))
          print('V4_FAST_METADATA_INDEX_SOURCE_SHA_GATES_PASS',
                json.dumps({'games':71,'chains':14612,'three_metadata_ms':times}))
          PY
      - name: Commit private versioned index without any raw XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v4-fast "origin/$BRANCH"
          git add -f gamepulse/fusion/materialized/igp_v32_71_possession_metadata_index_v1
          git diff --cached --check
          if git diff --cached --quiet; then echo V4_INDEX_ALREADY_SAVED; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'data(igp): materialize 71-game exact PBP chain fast metadata partitions'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo V4_SOURCE_SHA_PINNED_METADATA_INDEX_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
