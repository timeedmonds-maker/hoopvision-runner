# Registered public-content guard: SHA-private only.
# Metadata-only season chain index built in private repository; original XYZ
# and per-game PBP remain private; public logs show aggregate chain QA only.
name: IGP 3.2 V4 fast possession chain metadata materialization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-v4-fast-possession-index.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-v4-fast-possession
  cancel-in-progress: false
jobs:
  build-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and check out private NBA provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_71_possession_fast_index_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_71_possession_fast_index_v1.py'
          echo V4_SOURCE_FREE_INDEX_TESTS_PASS
      - name: Build original-v2-locked 71-game partitioned index, benchmark metadata lookups
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! test -f gamepulse/fusion/materialized/igp_v32_71_possession_metadata_index_v1/index.json; then
            python3 gamepulse/fusion/igp_v32_71_possession_fast_index_v1.py \
              --build --root . >"$RUNNER_TEMP/private-v4-build.log" 2>&1 || {
                echo V4_PRIVATE_ORIGINAL_QA_INDEX_BUILD_FAILED
                exit 41
              }
          else
            echo V4_PREVIOUS_SOURCE_SHA_INDEX_RETAINED
          fi
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          from igp_v32_71_possession_fast_index_v1 import INDEX_DIR,query
          ix=json.loads((INDEX_DIR/'index.json').read_text())
          assert ix['games']==71 and ix['official_NBA_logical_chains']==14612
          assert len(ix['parts'])==71
          assert sum(e['chains'] for e in ix['parts'].values())==14612
          comparisons=[]
          for gid in sorted(ix['parts'])[:3]:
              rows=json.loads((INDEX_DIR/(gid+'.json')).read_text())['chains']
              row=next(x for x in rows if x['evaluated'])
              t=time.perf_counter()
              got=query('.',gid,row['chain_id'])
              fast_ms=round((time.perf_counter()-t)*1000,3)
              assert got['tracking_usability']==row
              assert got['returns_original_XYZ'] is False
              assert got['physical_custody_start_end_certified'] is False
              t=time.perf_counter()
              deep=query('.',gid,row['chain_id'],deep=True,limit=10,native_limit=10)
              deep_ms=round((time.perf_counter()-t)*1000,3)
              assert deep['tracking_usability']==row
              assert deep['full_possession_grade_QA_sha256']==ix['original_possession_v2_QA_sha256']
              comparisons.append({'game_id':gid,'chain_id':row['chain_id'],
                  'fast_metadata_ms':fast_ms,'full_original_sha_source_ms':deep_ms,
                  'fast_is_metadata_only':True})
          output={'schema':'igp.v32.v4.fast-vs-original-3chain-runtime.v1',
              'games':71,'total_NBA_chains':14612,
              'original_v2_QA_sha256':ix['original_possession_v2_QA_sha256'],
              'comparisons':comparisons,'physical_validation':False,
              'benchmark_not_general_p95_latency':True}
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'v4_runtime_private.json'
          p.write_text(json.dumps(output,indent=2,sort_keys=True)+'\n')
          print('V4_FAST_METADATA_INDEX_SOURCE_SHA_GATES_PASS',
                json.dumps({'games':71,'chains':14612,
                'fast_ms':[x['fast_metadata_ms'] for x in comparisons],
                'deep_ms':[x['full_original_sha_source_ms'] for x in comparisons]}))
          PY
      - name: Commit private versioned index without any raw XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v4-fast "origin/$BRANCH"
          git add -f gamepulse/fusion/materialized/igp_v32_71_possession_metadata_index_v1
          bench="gamepulse/fusion/qa/igp_v32/igp_v32_v4_fast_vs_original_3query_runtime_v1.json"
          mkdir -p "$(dirname "$bench")"
          cp "$RUNNER_TEMP/v4_runtime_private.json" "$bench"
          git add -f "$bench"
          git diff --cached --check
          if git diff --cached --quiet; then echo V4_INDEX_ALREADY_SAVED; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'data(igp): materialize 71-game exact PBP chain fast metadata partitions'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo V4_SOURCE_SHA_PINNED_METADATA_INDEX_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
