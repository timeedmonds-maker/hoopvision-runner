name: CPU Animate V37 original NBA XYZ to video time-camera fit diagnostic CPU
on:
  push:
    branches: ['cpu-animate/warriors-amen-sengun-e585-cpu-rebuild-20261113']
    paths: ['.github/workflows/cpu-animate-e585-v37-native-video-calibration-cpu.yml']
permissions:
  contents: read
concurrency:
  group: cpu-animate-v37-0225-e585-native-calibration
  cancel-in-progress: false
jobs:
  private-five-id-source-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENCV_OPENCL_RUNTIME: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify PRIVATE 0225 original native, original PTS and frame shoes; candidate fit ONLY
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test ! -e /dev/nvidia0
          test ! -e /dev/kfd
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          python3 -m pip install -q --disable-pip-version-check \
            'numpy==1.26.4' 'opencv-python-headless==4.10.0.84' \
            'ultralytics==8.3.176' 'pillow>=10,<12'
          gh auth setup-git
          code="$RUNNER_TEMP/v37-camera-code"
          root="$RUNNER_TEMP/v37-original-native"
          media="$RUNNER_TEMP/v37-original-media"
          scout="$RUNNER_TEMP/v37-original-scout"
          out="$RUNNER_TEMP/v37-original-native-video-candidate.json"
          mkdir -p "$media" "$scout"
          trap 'rm -rf "$code" "$root" "$media" "$scout" "$out" "$RUNNER_TEMP/v37-video-pts.json" "$RUNNER_TEMP/v37-upload-request.json"' EXIT
          git clone -q --filter=blob:none --depth=1 --no-checkout \
            --branch cpu-animate/e585-v37-native-camera-calibration-20261113 \
            https://github.com/timeedmonds-maker/104.git "$code"
          git -C "$code" sparse-checkout init --no-cone
          git -C "$code" sparse-checkout set --no-cone \
            '/cpu_animate/*' '/tools/locked_broadcast_screen_v5_rings.py'
          git -C "$code" checkout -q cpu-animate/e585-v37-native-camera-calibration-20261113
          test "$(git -C "$code" rev-parse HEAD)" = 2f140c559635953571e925279e96a26f7a7ca782
          git clone -q --filter=blob:none --depth=1 --no-checkout \
            --branch research/gamepulse-clock-boundary-integrity-20261025 \
            https://github.com/timeedmonds-maker/104.git "$root"
          git -C "$root" sparse-checkout init --no-cone
          git -C "$root" sparse-checkout set --no-cone \
            '/gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1/index.json' \
            '/gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1/original-native-*.jsonl.gz'
          git -C "$root" checkout -q research/gamepulse-clock-boundary-integrity-20261025
          test "$(git -C "$root" hash-object gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1/index.json)" = \
            da4d7bc7e9900ec4b186180057835ec11f4c0463
          gh release download cpu-animate-0022600225-event585-playbyplay-v20-source-20261112 \
            --repo timeedmonds-maker/104 --dir "$media" \
            --pattern event585-playbyplay.mp4
          test "$(sha256sum "$media/event585-playbyplay.mp4" | cut -d' ' -f1)" = \
            06e5de702b58545799c7bbb678878e04da092fdec3f0ee98e97b3b65f552a234
          gh release download cpu-animate-rockets-0225-e585-v21-source-shoe-scout-20261112 \
            --repo timeedmonds-maker/104 --dir "$scout" \
            --pattern scout_0225_585_videoonly_592.json.gz
          test -s "$scout/scout_0225_585_videoonly_592.json.gz"
          export V37_MEDIA="$media/event585-playbyplay.mp4"
          export V37_PTS="$RUNNER_TEMP/v37-video-pts.json"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          p=subprocess.run(["ffprobe","-v","error","-select_streams","v:0",
                            "-show_frames","-show_entries","frame=best_effort_timestamp_time",
                            "-of","json",os.environ["V37_MEDIA"]],
                           capture_output=True,text=True,check=True)
          a=json.loads(p.stdout)["frames"]
          pts=[float(x["best_effort_timestamp_time"]) for x in a]
          assert len(pts)==592
          pts=[round(x-pts[0],7) for x in pts]
          assert all(b>a for a,b in zip(pts,pts[1:]))
          pathlib.Path(os.environ["V37_PTS"]).write_text(json.dumps({
            "game_id":"0022600225","event_num":585,"camera":"Play by Play",
            "original_video_sha256":"06e5de702b58545799c7bbb678878e04da092fdec3f0ee98e97b3b65f552a234",
            "frame_pts_seconds":pts
          },separators=(",",":"))+"\n")
          PY
          cd "$code"
          python3 -m py_compile cpu_animate/e585_v37_native_video_calibration.py
          python3 -m cpu_animate.e585_v37_native_video_calibration \
            --source-root "$root" \
            --media "$V37_MEDIA" \
            --pts "$V37_PTS" \
            --scout "$scout/scout_0225_585_videoonly_592.json.gz" \
            --out "$out"
          export V37_REPORT="$out"
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ["V37_REPORT"])
          d=json.loads(p.read_text())
          assert d["game_id"]=="0022600225" and d["event_num"]==585
          assert d["video_sha256"]=="06e5de702b58545799c7bbb678878e04da092fdec3f0ee98e97b3b65f552a234"
          assert d["original_native_xyz_modified"] is False
          assert d["heldout_observation_count"]>=3
          assert d["independent_timing_anchors_accepted"]==0
          assert d["original_xyz_video_utc_alignment_physically_certified"] is False
          assert d["accepted_as_M1"] is False
          dest="gamepulse/clip_lab/qa/0022600225_e585_v37_original_five_id_native_video_candidate_calibration.json"
          body={"message":"qa(cpu-animate): [skip ci] privately archive original 0225 native-to-video camera/timing held-out QA NOT M1",
                "branch":"cpu-animate/e585-v37-native-camera-audit-receipts-20261113",
                "content":base64.b64encode(p.read_bytes()).decode()}
          req=pathlib.Path(os.environ["RUNNER_TEMP"])/"v37-upload-request.json"
          req.write_text(json.dumps(body))
          u=subprocess.run(["gh","api","-X","PUT",
                  "repos/timeedmonds-maker/104/contents/"+dest,
                  "--input",str(req)],capture_output=True,text=True)
          if u.returncode:raise RuntimeError("PRIVATE_CALIBRATION_REPORT_COMMIT_FAILED")
          print("V37_CALIBRATION_PRIVATE_SOURCE_REPORT_SHA",hashlib.sha256(p.read_bytes()).hexdigest())
          print("V37_NOT_APPROVED_FOR_M1_OR_RENDER",d["heldout_observation_count"],
                d["heldout_reprojection_p95_vs_approx_shoe_px"])
          PY
          echo V37_CPU_PRIVATE_CANDIDATE_CALIBRATION_REPRODUCED_NO_RENDER
