name: Jabari616 steady floor and Fred frame-zero candidate
on:
  push:
    branches: [agent/jabari616-steady-floor-fred]
    paths: ['.github/workflows/nba-jabari616-steady-floor-fred.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jabari616-steady-floor-fred
  cancel-in-progress: false
jobs:
  source-ring-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify confidentiality and source-only workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from tools.public_content_guard import scan
          file='.github/workflows/nba-jabari616-frozen-v31-quality.yml'
          bad=scan([file])
          if bad:raise SystemExit('PUBLIC_CONTENT_CHECK_REJECTED')
          print('CUMULATIVE_FIVE_PUBLIC_SOURCE_CHECK_PASS')
          PY
      - name: Process authentic NBA HLS clip using original frozen renderer and Game Pulse
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo NO_PRIVATE_REPO_AUTH; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          export YOLO_CONFIG_DIR="$ROOT/yolo"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_616_frozen_v31_quality_full20.py?ref=agent%2Fjabari616-steady-floor-fred' --jq .content | base64 -d > "$ROOT/cumulative.py"
          python3 -m py_compile "$ROOT/cumulative.py"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --disable-pip-version-check -q 'ultralytics==8.3.228' 'scipy>=1.11,<2' 'numpy<2' 'opencv-python-headless<4.11'
          python3 - "$ROOT" <<'PY'
          import base64,hashlib,os,subprocess,sys
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs
          root=Path(sys.argv[1])
          p=subprocess.run(["gh","api","repos/timeedmonds-maker/104/contents/courtcoder/nba_event_angle_discovery.py?ref=courtcoder%2Fintegration","--jq",".content"],capture_output=True,text=True)
          if p.returncode:raise RuntimeError("ANGLE_PARSER_UNAVAILABLE")
          (root/"nba_event_angle_discovery.py").write_bytes(base64.b64decode(p.stdout))
          sys.path.insert(0,str(root))
          from nba_event_angle_discovery import fetch_event_angles
          angles=fetch_event_angles("0022600091",616,timeout=22)
          if angles.get("state")!="AVAILABLE":raise RuntimeError("EVENT_616_REPLAY_UNAVAILABLE")
          cams=[a for a in angles["angles"] if a["label"]=="Broadcast"]
          if len(cams)!=1:raise RuntimeError("BROADCAST_CAMERA_MISSING")
          url=cams[0]["url"];q=urlsplit(url)
          if q.scheme!="https" or q.hostname!="lrmedia.nba.com" or not q.path.endswith(".m3u8") or "wowzatokenhash" not in parse_qs(q.query):raise RuntimeError("SOURCE_PROVENANCE_FAILED")
          dst=root/"event616-broadcast.mp4"
          p=subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-nostdin","-y","-user_agent","Mozilla/5.0","-i",url,"-t","24","-map","0:v:0","-map","0:a?","-c:v","libx264","-preset","veryfast","-crf","19","-pix_fmt","yuv420p","-c:a","aac","-movflags","+faststart",str(dst)],capture_output=True,timeout=180)
          if p.returncode or dst.stat().st_size<100000:raise RuntimeError("SOURCE_DECODE_FAILED")
          print("AUTHENTIC_BROADCAST_SOURCE_SHA256",hashlib.sha256(dst.read_bytes()).hexdigest())
          PY
          EVENT616_SOURCE_FILE="$ROOT/event616-broadcast.mp4" python3 "$ROOT/cumulative.py"

# Opening Fred floor-anchor correction at private commit 83c8f3c3a0c52b9745881bb36360cd52bc47c189.

