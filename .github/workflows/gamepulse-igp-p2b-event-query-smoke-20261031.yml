# Public privacy-safe smoke: private original source, no XYZ or per-action details in logs.
name: IGP P2B official action to nearby sequence real query smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-igp-p2b-event-query-smoke-20261031.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  private-original-12-action-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private original source query smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_v32_p2b_official_action_tracking_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_original_native_event_candidates_v2.py'
          python3 - <<'PY' >"$RUNNER_TEMP/igp-p2b-event-query.log" 2>&1 || {
          import json,collections
          from pathlib import Path
          from query_igp_v32_p2b_official_action_tracking_v1 import query
          qa=json.loads(Path("gamepulse/fusion/qa/igp_v32/igp_v32_p2b_all_official_action_tracking_crosswalk_v1.json").read_bytes())
          game=qa["games"]["0022600001"]
          rows=game["event_rows"]
          types=["2pt","3pt","rebound","turnover","substitution","freethrow"]
          selected=[]
          for typ in types:
              matches=[x for x in rows if x["official_action_type"]==typ
                       and x["original_official_logged_utc_ms"] is not None]
              selected.extend(matches[:2])
          if len(selected)!=12:raise ValueError("REAL_12_OFFICIAL_ACTIONS_NOT_AVAILABLE")
          report=collections.Counter()
          for r in selected:
              result=query(Path("."),"0022600001",r["period"],r["official_action_number"])
              if (result["engine_id"]!="IGP32_P2B_GUARDED_SOURCE_QA_10HZ_71G_20261031"
                  or result["official_action"]["nba_action_number"]!=r["official_action_number"]
                  or not result["official_log_time_only_not_physical_event_time"]
                  or result["physical_ball_custody_certified"]):
                  raise ValueError("UNVERIFIED_ACTION_P2B_ORIGINAL_QUERY")
              original_context=result["original_NBA_native_tracking_nearby_window"]
              if (original_context["official_action_number"]!=r["official_action_number"]
                  or original_context["physical_action_time_or_ball_custody_certified"]
                  or original_context["original_companion_source_grade"] is None):
                  raise ValueError("ORIGINAL_NATIVE_CONTEXT_QUERY_PROVENANCE_MISSING")
              near=result["P2B_nearby_source_graded_tracking_sequence"]
              stats=near["context_statistics"]
              bounds=near["candidate_time_window_utc_ms"]
              if bounds is not None and any(not bounds[0]<=x["utc_ms"]<=bounds[1]
                  for x in near["P2B_strict_S1_context"]):
                  raise ValueError("ACTION_CONTEXT_OUTSIDE_ORIGINAL_CHAIN")
              report["actions"]+=1
              report["with_complete_P2B_context"]+=int(
                  stats["has_source_qa_complete_possession_context"])
              report["with_unique_chain_context"]+=int(
                  near["has_source_qa_complete_logical_chain_context"])
              report["with_near_original_native"]+=int(
                  result["original_native_source_nearby_availability_grade"]["near_source_exists"])
          out=Path("gamepulse/fusion/qa/igp_v32/igp_v32_p2b_0001_12_event_context_query_readback_20261031.json")
          receipt={"schema":"igp.v32.p2b.12-real-PBP-action-bounded-source-context.readback.v1",
              "engine_id":"IGP32_P2B_GUARDED_SOURCE_QA_10HZ_71G_20261031",
              "game_id":"0022600001","action_sample_count":12,
              "sample_selection":"first two official logged-UTC actions per 2pt,3pt,rebound,turnover,substitution,freethrow",
              "counts":dict(report),
              "PBP_sha256":game["official_pbp_sha256"],
              "native_manifest_sha256":game["native_sdk_manifest_sha256"],
              "physical_action_time_certified":False,
              "physical_possessions_certified":0}
          out.parent.mkdir(parents=True,exist_ok=True)
          if out.exists() and json.loads(out.read_bytes())!=receipt:
              raise ValueError("SOURCE_ACTION_QUERY_SMOKE_QA_OVERWRITE")
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("IGP_12_ACTIONS_SOURCE_GRADED_P2B_REAL_QUERY_PASSED",dict(report))
          PY
              echo IGP_P2B_PRIVATE_QUERY_SMOKE_FAILED
              python3 - <<'PY'
          import re,os
          from pathlib import Path
          x=(Path(os.environ["RUNNER_TEMP"])/"igp-p2b-event-query.log").read_text(errors="replace").splitlines()
          a=next((s for s in reversed(x) if re.match(r"^(?:ValueError|KeyError|TypeError|AssertionError|FileNotFoundError|ImportError):",s)),None)
          if a:
              kind,_,msg=a.partition(":")
              code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("PRIVATE_QUERY_FAILURE",kind,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else: print("PRIVATE_QUERY_FAILURE UNCLASSIFIED")
          PY
              exit 41
            }
          grep 'IGP_12_ACTIONS_SOURCE_GRADED_P2B_REAL_QUERY_PASSED' "$RUNNER_TEMP/igp-p2b-event-query.log"
      - name: Commit immutable private 12 official action P2B query readbacks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_0001_12_event_context_query_readback_20261031.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'qa(igp): 12 real NBA PBP action-to-P2B sequence query readbacks'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_12_ACTION_REAL_P2B_QUERY_READBACKS_ACCEPTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
