name: Amen 732 SAM2 source ball to Game Pulse world holdout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-sam2-world-camera-holdout.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: amen732-sam2-source-world-camera-holdout
  cancel-in-progress: false
jobs:
  native-camera-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public policy and private original observations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/sourceauth" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/sourceauth"
          export GIT_ASKPASS="$RUNNER_TEMP/sourceauth" GIT_TERMINAL_PROMPT=0
          git clone --quiet --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo SAM2_ORIGINAL_SOURCE_CAMERA_PRIVATE_ACCESS_PASS
      - name: Test and execute original 3D to 2D independent holdouts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            numpy==1.26.4 scipy==1.14.1 opencv-python-headless==4.10.0.84
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH="$PWD/hoopvision/freeview"
          python3 hoopvision/freeview/amen732_sam21_world_camera_holdout.py --selftest
          python3 hoopvision/freeview/amen732_sam21_world_camera_holdout.py \
            --source hoopvision/freeview/fixtures/amen732_original_recapture_43_three_actor_xyz_20261026.json \
            --manual hoopvision/freeview/fixtures/amen732_source_rgb_ball_witnesses_manual_v1.json \
            --sam hoopvision/freeview/fixtures/amen732_23source_sam21_ball_masks_20261026.json \
            --previous hoopvision/freeview/fixtures/amen732_43xyz_23pixels_camera_holdout_20261026.json \
            --out hoopvision/freeview/fixtures/amen732_sam2_native_video_world_holdout_20261026.json
          python3 - <<'PY'
          import json
          p="hoopvision/freeview/fixtures/amen732_sam2_native_video_world_holdout_20261026.json"
          obj=json.load(open(p))
          assert obj["source_xyz_frame_count"]==43
          assert obj["summary"]["sam_accepted_original_video_ball_pixels"]==22
          assert obj["summary"]["independently_annotated_heldout_frames"]==6
          assert obj["summary"]["camera_metric_KRt_acceptances"]==0
          assert obj["first_hand_ball_touch_certified"] is False
          print("AMEN732_NBA_NATIVE_SAM_XYZ_INDEPENDENT_HOLDOUT_PASS",obj["summary"])
          PY
      - name: Commit measured model results only to private 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'HoopVision source CPU'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_sam2_native_video_world_holdout_20261026.json
          git diff --cached --check
          git commit -qm 'qa(freeview): source SAM2 ball pixels and Game Pulse XYZ heldout calibration evidence'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_SAM_XYZ_WORLD_CAMERA_PRIVATE_QA_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
