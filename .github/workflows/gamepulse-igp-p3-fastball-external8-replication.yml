name: IGP P3 NBA independent third eightgame fastball original source replication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-fastball-external8-replication.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-fastball-third8-source-replication
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 4f87cca530a161df416fffd18b9af8742f8907c1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public confidentiality guard and original NBA private source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Run fixed additional NBA 8game independent heldout original SDK short ball mask
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_fastball_second_disjoint_replication_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_fastball_second_disjoint_replication_v1.py --root . --output "$RUNNER_TEMP/external8-private.json" > "$RUNNER_TEMP/external8-private.log" 2>&1; then
            echo P3_NEW_EIGHT_NBA_SOURCE_REPLICATION_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          ls=(Path(os.environ['RUNNER_TEMP'])/'external8-private.log').read_text(errors='replace').splitlines()
          last=next((z for z in reversed(ls) if z.strip()),'NO_LOG')
          print('P3_REPLICATION_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:70])
          print('P3_REPLICATION_GAMES_FINISHED',sum(z.startswith('P3_BALL_PHYSICS_HELDOUT_GAME') for z in ls))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'external8-private.json').read_text())
          assert len(q['replication_games'])==8
          assert not set(q['replication_games'])&set(q['previous_24_games_excluded'])
          assert q['protocol_frozen_without_replication_tuning']
          assert q['max_original_source_bracket_ms']==600 and q['radius_ms']==[50,100,150]
          assert q['canonical_native_complete']==492617
          assert q['canonical_10hz_complete']==917686
          assert q['accepted_tracking_position_delta']==0 and not q['independent_video_physical_truth']
          for r in ('50','100','150'):
              a=q['decision_summary'][r]
              assert a['n']>=100
              assert a['games_improved_p95']+a['games_worse_or_equal_p95']==8
              assert all(z['n']>=10 for z in a['per_game'])
          print('IGP_P3_SECOND_DISJOINT_ORIGINAL_SDK_ACCURACY',json.dumps({
             r:{k:v for k,v in a.items() if k!='per_game'}
             for r,a in q['decision_summary'].items()},sort_keys=True))
          PY
      - name: Save source-original evidence in private NBA repository only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_fastball_second_disjoint_replication_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-replication-eight "origin/$BRANCH"
          cp "$RUNNER_TEMP/external8-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): independent third NBA eightgame actual short source ball velocity physics replication'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo P3_NBA_NEW_EIGHT_SOURCE_REPLICATION_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
