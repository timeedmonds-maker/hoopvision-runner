# Approved source-only public orchestration. Never print original NBA coordinates.
name: IGP v3.2 universal NBA event to P2B live query smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-universal-event-query-smoke.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-event-p2b-query-integrity
  cancel-in-progress: false
jobs:
  original-mem-por-events-and-p2b:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-0146-app-clock-stoppage-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source-free synthetic event-to-P2B integrity tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_v32_universal_event_source_aligned_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_query_igp_v32_universal_event_source_aligned_v1.py'
          echo IGP_UNIVERSAL_SOURCE_P2B_QUERY_SOURCEFREE_TESTS_PASS
      - name: Original MEM POR 0146 official events exact native and P2B smoke
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json
          from query_igp_v32_universal_event_source_aligned_v1 import query
          for action in (70,78,89):
              q=query(".", "0022600146",1,action,include_p2b_scene=True)
              assert q["nba_official_action"]==action
              assert q["nba_official_period"]==1
              assert q["NBA_official_PBP_SDK_original_source_unchanged"]
              assert q["physical_possession_custody_boundaries_certified"] is False
              assert q["physical_NBA_action_time_certified"] is False
              assert q["physical_player_XY_ball_XYZ_certified"] is False
              assert q["P2B_10hz_source_model_scene"] is not None
              assert q["P2B_10hz_source_model_scene"]["utc_ms"]%100==0
              assert q["original_native_nearest_utc_ms"] is not None
              assert q["source_NBA_PBP_sha256"]
              assert q["source_SDK_native_manifest_sha256"]
              assert q["original_native_source_positions"] is None
              print("IGP_P2B_OFFICIAL_EVENT_QUERY_ORIGINAL_SOURCE_PASS",json.dumps({
                 "nba_game_id":q["game_id"],"nba_action":action,
                 "official_chain_links":len(q["NBA_logical_chain_ids"]),
                 "lineup_grade":q["NBA_official_lineup_event_grade"],
                 "native_near_present":True,
                 "p2b_default_scene_aligned":True,
                 "physical_time_certified":False},sort_keys=True))
          PY
