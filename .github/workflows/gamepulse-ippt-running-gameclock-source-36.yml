name: IPPT original running NBA gameclock source coverage all36
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-running-gameclock-source-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  private-clock-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/ippt-event-snapshots-separate-20261028
      SHA: 3cf147e65903efda115013c9a5ff98e3ea3755a7
      QA: gamepulse/fusion/qa/igp_progress_20261028/ippt_running_NBA_gameclock_original_source_temporal1s_36_v2.json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source-free public privacy and pinned private SHA NBA G4
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SHA"
          echo "PRIV=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Execute exact SHA 36-game NBA PBP advancing clock/actor ball coverage
        run: |
          set -euo pipefail
          cd "$PRIV"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_running_gameclock_source_coverage_2026.py
          python3 gamepulse/fusion/igp_ippt_running_gameclock_source_coverage_2026.py --root . --out "$QA" > "$RUNNER_TEMP/private_clock.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads(Path(os.environ["QA"]).read_text());c=a["totals"]
          assert len(a["games"])==36
          assert 0<c["running_clock_seconds_with_original_player_and_direct_ball"]<=c["game_clock_seconds_in_valid_PBP_intervals"]
          assert c["running_clock_seconds_with_8_original_player_IDs_and_direct_ball"]<=c["running_clock_seconds_with_original_player_and_direct_ball"]
          assert c["running_clock_seconds_original_player_ball_observation_within_1s_of_clock_projection"]>=c["running_clock_seconds_with_original_player_and_direct_ball"]
          assert c["running_clock_seconds_player_ball_original_bracket_both_sides_within_1s"]<=c["running_clock_seconds_original_player_ball_observation_within_1s_of_clock_projection"]
          assert a["clock_progression_not_video_certified_live_ball"]
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(
              json.dumps({"counts":c,"games":36,"physical_ball_custody_certified":False},sort_keys=True))
          print("IPPT_NBA_GAMECLOCK_PROGRESSING_36_SOURCE_COVERAGE_PASS",json.dumps(c,sort_keys=True))
          PY
      - name: Commit private original SHA QA only
        run: |
          set -euo pipefail
          cd "$PRIV"
          git config user.name "NBA Native Gameclock Coverage QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$QA"
          git diff --cached --check
          git commit -qm "qa(ippt): original source tracking over NBA running clock not PBP wallclock"
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            sleep "$i"
          done
          exit 13
      - name: Public aggregate receipt and erase licensed original XYZ
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          data=json.loads((r/"safe.json").read_text()) if (r/"safe.json").exists() else {"status":os.environ["RESULT"]}
          data.update({"run_id":os.environ["GITHUB_RUN_ID"],"code_sha":os.environ["SHA"]})
          (r/"receipt.md").write_text("Original NBA PBP-progressing game clock source coverage. Aggregate counts only, not live-ball certification.\n\n~~~json\n"+json.dumps(data,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/receipt.md"
