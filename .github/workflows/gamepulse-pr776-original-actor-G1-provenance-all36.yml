name: PR776 G1 all-36 original SDK selected actor and ball keyframe provenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-original-actor-G1-provenance-all36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G1-actor-original-36
  cancel-in-progress: false
jobs:
  scan:
    name: SHA-verified G1 original actor lineage partition ${{ matrix.partition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        partition: [0,1,2,3,4,5]
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      PART: ${{ matrix.partition }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public privacy guard and original private source access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free per-actor SHA lineage tests and full-native query integration
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_original_per_actor_lineage_G1_2026.py \
            gamepulse/fusion/igp_original_per_actor_lineage_query_G1_2026.py \
            gamepulse/fusion/igp_original_per_actor_lineage_G1_summary_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_original_per_actor_lineage_G1_2026.py' -v
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_original_per_actor_lineage_query_G1_2026.py' -v
          echo PRIVATE_G1_ALL36_SOURCE_FREE_TESTS_PASSED
      - name: Verify or produce every selected actor original SDK lineage partition
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          mapfile -t GAMES < <(python3 - "$PART" <<'PY'
          import json,sys
          idx=json.load(open("gamepulse/fusion/materialized/igp_provisional_chain_tracking_interiors_36_v1/index.json"))
          gids=sorted(idx["games"])
          assert len(gids)==36
          partition=int(sys.argv[1])
          print("\n".join(gid for i,gid in enumerate(gids) if i%6==partition))
          PY
          )
          test "${#GAMES[@]}" -eq 6
          git config user.name "Game Pulse Original Source G1 QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          for GID in "${GAMES[@]}"; do
            OUT="gamepulse/fusion/materialized/igp_per_actor_G1_20261028/${GID}.jsonl.gz"
            QA="gamepulse/fusion/qa/igp_progress_20261028/igp_original_per_actor_G1_${GID}_v1.json"
            if test -e "$QA" || test -e "$OUT"; then
              test -e "$QA" && test -e "$OUT"
              python3 - "$GID" "$QA" "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          from igp_original_sdk_metadata_fidelity_2026 import sha_file
          gid,qpath,path=sys.argv[1:]
          q=json.load(open(qpath))
          original=json.load(open("gamepulse/fusion/materialized/igp_all_original_xyz/"+gid+"/index.json"))
          meta=json.load(open("gamepulse/fusion/qa/igp_progress_20261028/metadata_36/igp_original_sdk_metadata_fidelity_"+gid+"_v1.json"))
          assert q["game_id"]==gid and q["source_SDK_XYZ_not_modified"]
          assert q["original_13_archive_SHA256"]==original["original_archive_parts_sha256"]==meta["source_parts_sha256"]
          assert q["private_lineage_gzip_sha256"]==sha_file(Path(path))
          assert q["aggregate_counts"]["native_frames"]==meta["native_timestamps_unique"]
          assert q["aggregate_counts"]["actor_entries"]==original["original_frame_counts"]["direct_player_xyz_observations"]
          assert q["aggregate_counts"]["ball_entries"]==original["original_frame_counts"]["source_ball_xyz_timestamps"]
          PY
              echo "PRIVATE_G1_PREVIOUS_RAW_SOURCE_SHA_RECEIPT_VERIFIED $GID"
              continue
            fi
            mkdir -p "$RUNNER_TEMP/sdk-$GID"
            gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release-$GID.json"
            gh release download "gamepulse-sdk-$GID" -R "$PRIVATE_REPO" \
              --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk-$GID"
            test "$(find "$RUNNER_TEMP/sdk-$GID" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
            python3 gamepulse/fusion/igp_original_per_actor_lineage_G1_2026.py \
              --root . --game-id "$GID" \
              --archive-dir "$RUNNER_TEMP/sdk-$GID" \
              --release-json "$RUNNER_TEMP/release-$GID.json" \
              --out "$OUT" --receipt "$QA" > "$RUNNER_TEMP/private-G1-$GID.log"
            python3 - "$QA" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          x=q["aggregate_counts"]
          assert q["source_SDK_XYZ_not_modified"] and q["raw_original_player_XYZ_not_in_lineage_sidecar"]
          assert len(q["original_13_archive_SHA256"])==13
          assert x["actor_entries"]>0 and x["ball_entries"]>0
          assert x["native_only_flag_TRUE"]+x["native_any_flag_FALSE"]==x["native_frames"]
          print("G1_ORIGINAL_ACTOR_PRIVATE_PARTITION_ACCEPTED",q["game_id"],json.dumps({
            "native_frames":x["native_frames"],
            "source_actor_entries":x["actor_entries"],"ball_frames":x["ball_entries"],
            "selected_interp_true":x.get("selected_flag_TRUE",0),
            "selected_interp_false":x.get("selected_flag_FALSE",0)
          },sort_keys=True))
          PY
            rm -rf "$RUNNER_TEMP/sdk-$GID" "$RUNNER_TEMP/release-$GID.json" "$RUNNER_TEMP/private-G1-$GID.log"
            git add -f "$QA" "$OUT"
            test "$(git diff --cached --name-only | wc -l)" -eq 2
            git diff --cached --check
            git commit -qm "qa(gamepulse): original G1 selected actor/ball provenance for $GID"
            SUCCESS=0
            for ATTEMPT in 1 2 3 4 5 6 7 8; do
              git fetch -q origin "$BRANCH"
              git rebase -q "origin/$BRANCH"
              if git push -q origin "HEAD:refs/heads/$BRANCH"; then
                SUCCESS=1;break
              fi
              sleep "$ATTEMPT"
            done
            test "$SUCCESS" -eq 1
            echo "PRIVATE_G1_SELECTED_ACTOR_ORIGINAL_RECEIPT_PUBLISHED $GID"
          done
  aggregate:
    name: SHA-reconcile all 36 original actor interpolation lineage receipts
    needs: [scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confidentiality guard and private source verification
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Validate exact 468 original archive hashes and all saved actor flags
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_original_per_actor_G1_36game_summary_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_original_per_actor_lineage_G1_summary_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-G1-all36-summary.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          x=q["totals"]
          assert q["source_games"]==36
          assert x["native_frames"]==1203986
          assert x["actor_entries"]==8673975
          assert x["ball_entries"]==912704
          assert x["native_only_flag_TRUE"]==49552
          assert x["native_mixed_TRUE_FALSE"]==14
          assert x["original_SDK_raw_keyframes"]==2407199
          assert x["original_SHA_verified_archive_parts"]==468
          assert not q["physical_NBA_possession_and_live_state_certified"]
          print("PR776_G1_ALL36_ORIGINAL_ACTOR_KEYFRAME_SHA_ACCEPTED",json.dumps({
             "games":36,"native_frames":x["native_frames"],
             "source_players":x["actor_entries"],"ball_frames":x["ball_entries"],
             "selected_flag_TRUE":x.get("selected_flag_TRUE",0),
             "selected_flag_FALSE":x.get("selected_flag_FALSE",0),
             "selected_flag_MIXED":x.get("selected_flag_CONFLICTING_SELECTED_KEYFRAME_FLAGS",0),
             "archives":x["original_SHA_verified_archive_parts"]
          },sort_keys=True))
          PY
      - name: Commit only aggregate G1 QA to private canonical repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_original_per_actor_G1_36game_summary_v1.json
          git config user.name "Game Pulse Original Source G1 QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): certify all36 per-actor upstream interpolation keyframe lineage"
          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PR776_G1_ALL36_PRIVATE_SHA_AGGREGATE_PUBLISHED
              exit 0
            fi
            sleep "$ATTEMPT"
          done
          exit 13
