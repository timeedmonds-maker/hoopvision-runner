name: Game Pulse public CPU season private Release worker
run-name: NBA Game Pulse private Release season
on:
  schedule:
    - cron: '43 0,6,12,18 * 1-6,10-12 *'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-github-season.yml'
      - 'tools/licensed_feed/season_*'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover due games without capture'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: gamepulse-public-season-private-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs
  private-season:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check private secret availability without outputting it
        env:
          SECRET_PRESENT: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN != '' }}
        run: test "$SECRET_PRESENT" = true || { echo 'PRIVATE_104_RELEASE_TOKEN_MISSING'; exit 3; }
      - name: Install licensed SDK with scripts disabled and no private token
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Select due regular-season game and archive private checkpoints
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          GAMEPULSE_FULLGAME_PILOT: 'false'
          GAMEPULSE_PARTS_PER_RUN: '13'
          GAMEPULSE_MAX_GAMES: '3'
          GAMEPULSE_PRODUCTION_ENABLED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: node season_private_release.mjs
