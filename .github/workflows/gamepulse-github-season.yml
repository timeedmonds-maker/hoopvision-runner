name: Game Pulse public CPU season private Release worker
# 2026-10-24: Retire expired game-specific push fanout; keep scheduled private fullgame due-selector.
run-name: NBA Game Pulse public CPU private season archive
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-github-season.yml'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-github-season.yml'
      - 'tools/licensed_feed/season_*'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover due games without capture'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: gamepulse-public-season-private-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  private-season:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON('[0]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait until this full-game segment has elapsed
        if: ${{ false }}
        env:
          GAMEPULSE_PART: ${{ matrix.part }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt, os, time
          part=int(os.environ['GAMEPULSE_PART'])
          assert 7<=part<=12, 'unexpected_priority_part'
          tipoff=dt.datetime(2026,10,22,0,30,tzinfo=dt.timezone.utc)
          ready=tipoff+dt.timedelta(minutes=min((part+1)*25,310))
          seconds=max(0,(ready-dt.datetime.now(dt.timezone.utc)).total_seconds())
          if seconds>3*3600: raise RuntimeError('priority_wait_excessive')
          print('WAITING_FOR_ELAPSED_WINDOW',part,round(seconds),flush=True)
          time.sleep(seconds)
          PY
      - name: Check private secret availability without outputting it
        env:
          SECRET_PRESENT: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN != '' }}
        run: test "$SECRET_PRESENT" = true || { echo 'PRIVATE_104_RELEASE_TOKEN_MISSING'; exit 3; }
      - name: Install licensed SDK with scripts disabled and no private token
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Select due regular-season game and archive private checkpoints
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          GAMEPULSE_FULLGAME_PILOT: 'false'
          GAMEPULSE_PRODUCTION_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
          GAMEPULSE_PARTS_PER_RUN: '13'
          GAMEPULSE_PRIORITY_FANOUT: 'false'
          GAMEPULSE_PRIORITY_ID: '0022600091'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T00:30:00Z'
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node season_private_release.mjs
            exit 0
          fi
          # Season ingestion takes precedence over a prior partial pilot.
          # A stalled pilot must not block newly completed priority games.
          GAMEPULSE_FULLGAME_PILOT=false GAMEPULSE_PARTS_PER_RUN=13 node season_private_release.mjs
  finish-priority:
    if: ${{ false }}
    needs: private-season
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SDK dependencies without scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Verify complete private game archive and index
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600091'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T00:30:00Z'
        run: node season_private_release.mjs
