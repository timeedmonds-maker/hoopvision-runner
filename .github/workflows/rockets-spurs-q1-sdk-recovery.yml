name: Rockets Spurs Q1 original SDK clip recovery
# Free CPU only; original NBA SDK source and player XYZ stay private in 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rockets-spurs-q1-sdk-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rockets-spurs-q1-sdk-recovery
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SDK test dependencies without lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Verify source-window recovery and private-only boundary
        run: |
          node --test tools/licensed_feed/sdk_slot.test.mjs tools/licensed_feed/capture.test.mjs
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/rockets-spurs-q1-sdk-recovery.yml'])
          print('CLIP_Q1_PUBLIC_BOUNDARY_PASS')
          PY
  recover:
    if: github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAMEPULSE_FINAL_FASTLANE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private destination
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_TOKEN_UNAVAILABLE; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Install authorised NBA SDK without lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Recover exact first-quarter SDK slots
        working-directory: tools/licensed_feed
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rockets-q1-clip"
          mkdir -p "$ROOT"
          # Official Q1 substitution and 05:21–05:14 event timestamps.
          printf '%s\n' '{"game_id":"0022600009","account_id":"nba","program_id":"companion-0022600009-positions","start_ms":1792807060000,"count":24,"part":0}' > "$ROOT/job.json"
          node capture.mjs "$ROOT/job.json" "$ROOT/source"
          python3 - "$ROOT" <<'PY'
          import gzip,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);src=root/'source'
          manifest=json.loads((src/'manifest.json').read_text())
          assert manifest['game_id']=='0022600009'
          assert manifest['successful_windows']==24
          with gzip.open(src/'frames.jsonl.gz','rt') as stream:
              frames=[json.loads(line) for line in stream if line.strip()]
          assert len(frames)==manifest['unique_keyframes']
          players=[f for f in frames if any(k!='ball' for k in f.get('positions',{}))]
          both=[f for f in frames if '201142' in f.get('positions',{}) and '203500' in f.get('positions',{})]
          balls=[f for f in frames if 'ball' in f.get('positions',{})]
          assert len(players)==manifest['frames_with_players']
          assert len(balls)==manifest['frames_with_ball']
          report={
            'schema':'hoopvision.rockets-spurs-q1-original-sdk-coverage.v1',
            'game_id':'0022600009','clip_utc_window_ms':[1792807060000,1792807180000],
            'source':'ORIGINAL_AUTHORIZED_NBA_GAMEPULSE_SDK',
            'successful_5s_windows':manifest['successful_windows'],
            'unique_keyframes':len(frames),'frames_with_players':len(players),
            'frames_with_both_targets':len(both),'frames_with_ball':len(balls),
            'first_player_utc_ms':min((int(f['timestamp']) for f in players),default=None),
            'last_player_utc_ms':max((int(f['timestamp']) for f in players),default=None),
            'eligible_for_video_render':False,'video_pts_to_utc_certified':False,
            'reason':'Native XYZ does not certify broadcast foot geometry, camera calibration, body ID or PTS'
          }
          report['status']='RECOVERED_SOURCE_NEEDS_CAMERA_AND_ID_ALIGNMENT' if both and balls else 'NATIVE_Q1_XYZ_INCOMPLETE'
          (root/'coverage.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('PRIVATE_Q1_COVERAGE_CLASS',report['status'])
          PY
      - name: Publish source and SHA-verified QA only to private 104
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rockets-q1-clip"
          TAG=gamepulse-clip-0022600009-q1-durant-adams
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 --title 'Rockets Spurs Q1 SDK clip source' --notes 'Private original SDK positions. Video-to-UTC, body identities and floor geometry not certified.' --latest=false
          fi
          gh release upload "$TAG" "$ROOT/coverage.json" "$ROOT/source/checkpoint.tar.gz" --repo timeedmonds-maker/104 --clobber
          python3 - "$ROOT" <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1]);tag='gamepulse-clip-0022600009-q1-durant-adams'
          response=subprocess.run(['gh','api',f'repos/timeedmonds-maker/104/releases/tags/{tag}'],capture_output=True,text=True,check=True)
          assets={x['name']:x for x in json.loads(response.stdout)['assets']}
          for name,path in [('coverage.json',root/'coverage.json'),('checkpoint.tar.gz',root/'source/checkpoint.tar.gz')]:
            assert assets[name].get('digest')=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest(), 'PRIVATE_SHA_READBACK_FAILED'
          print('PRIVATE_Q1_SOURCE_SHA_VERIFIED')
          PY
      - name: Index original target XYZ and coverage in private 104 for Clip Lab
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/rockets-q1-clip" <<'PY'
          import base64,gzip,hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          with gzip.open(root/'source/frames.jsonl.gz','rt') as fh:
            frames=[json.loads(x) for x in fh if x.strip()]
          target={'201142','203500','ball'}
          scoped=[{'utc_ms':int(f['timestamp']),
                   'positions':{k:v for k,v in f.get('positions',{}).items() if k in target},
                   'lastTouch':f.get('lastTouch')}
                  for f in frames if any(k in f.get('positions',{}) for k in target)]
          payload={'schema':'hoopvision.native-gamepulse-clip-target-xyz.v1',
                   'game_id':'0022600009','source':'ORIGINAL_NBA_GAMEPULSE_SDK',
                   'clip_utc_window_ms':[1792807060000,1792807180000],
                   'source_checkpoint_sha256':hashlib.sha256((root/'source/checkpoint.tar.gz').read_bytes()).hexdigest(),
                   'source_release_tag':'gamepulse-clip-0022600009-q1-durant-adams',
                   'player_ids':{'Durant':'201142','Adams':'203500'},
                   'video_pts_sync_certified':False,
                   'pixel_floor_projection_certified':False,
                   'frames':scoped}
          base='repos/timeedmonds-maker/104/contents/'
          files={
            'gamepulse/clip_lab/qa/0022600009_q1_durant_adams.json':(root/'coverage.json').read_bytes(),
            'gamepulse/clip_lab/positions/0022600009_q1_durant_adams.json':(json.dumps(payload,separators=(',',':'))+'\n').encode(),
          }
          for path,data in files.items():
            loc=base+path
            before=subprocess.run(['gh','api',loc],capture_output=True,text=True)
            post={'message':'data(gamepulse): index source-recovered Q1 clip tracking privately',
                  'branch':'main','content':base64.b64encode(data).decode()}
            if before.returncode==0:post['sha']=json.loads(before.stdout)['sha']
            elif '404' not in before.stderr and 'Not Found' not in before.stderr:
              raise RuntimeError('PRIVATE_INDEX_READ_FAILED')
            result=subprocess.run(['gh','api','-X','PUT',loc,'--input','-'],
                                  input=json.dumps(post),capture_output=True,text=True)
            if result.returncode:raise RuntimeError('PRIVATE_INDEX_WRITE_FAILED')
            check=subprocess.run(['gh','api',loc],capture_output=True,text=True,check=True)
            assert base64.b64decode(json.loads(check.stdout)['content'])==data,'PRIVATE_INDEX_READBACK_FAILED'
          print('PRIVATE_Q1_TARGET_XYZ_AND_COVERAGE_INDEXED')
          PY
