name: PR776 official NBA video event access for clock anchors
# Limited two-action metadata probe, no licensed video download, clips or raw XYZ exported.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-broadcast-anchor-video-access.yml']
permissions: {contents: read}
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
      GAME: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and fetch private official NBA action metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Test and attempt public official NBA event-video reference, no clips
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_official_video_anchor_access_probe_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_official_video_anchor_access_probe_2026.py'
          OUT=gamepulse/fusion/qa/igp_progress_20261027/official_video_event_access_0022600009.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_official_video_anchor_access_probe_2026.py \
            --official-pbp gamepulse/fusion/official_pbp_timing/games/0022600009.json \
            --game-id "$GAME" --action-numbers '13,17' --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['game_id']=='0022600009'
          assert len(d['tested_official_actions'])==2
          assert d['independently_accepted_native_gameclock_labels']==0
          assert d['physical_possessions_certified']==0
          print('IGP_NBA_OFFICIAL_EVENT_VIDEO_ACCESS_PROBE_ACCEPTED',json.dumps({
              'tested_actions':2,
              'http_status':d['access_http_status_counts'],
              'event_clip_structural_candidates':d['source_video_event_candidate_matches'],
              'independent_clock_labels':0},sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          git commit -q -m "qa(igp): official NBA event video access for native scoreboard anchors"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_EVENT_VIDEO_ACCESS_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 14
