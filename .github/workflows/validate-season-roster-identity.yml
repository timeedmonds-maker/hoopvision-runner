name: Validate Season-Roster Identity Solver
# trigger regression run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-season-roster-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  season-roster-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: 40ca1b5ed3a24210d42d0c75fe87190d2dc5fdd8
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU dependencies
        run: python -m pip install -q numpy pandas scipy pytest

      - name: Run season-roster identity regressions
        run: |
          set -euo pipefail
          python -m py_compile             screen_tracker_nextgen/global_identity_solver.py             screen_tracker_nextgen/solve_fast_path_identities.py             tools/adams_screen_prod_v3.py             hoopvision/worker/run_pelicans_season_roster.py             hoopvision/worker/interactive_service.py             tools/release/dev_supervisor.py             tools/release/submit_dev.py
          python -m pytest -q screen_tracker_nextgen/test_season_roster_identity.py
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("hoopvision/config/pelicans_0022500375_q4_montage.json").read_text())
          roster=json.loads(Path("hoopvision/config/season_rosters_2025_26_hou_nop.json").read_text())
          cuts=cfg["video_edit_boundaries"]["boundaries_s"]
          assert cuts==sorted(cuts) and len(cuts)>=1
          assert cfg["identity"]["play_by_play_required"] is False
          assert cfg["identity"]["possession_data_required"] is False
          assert len(roster["teams"]["HOU"]["players"])>5
          assert len(roster["teams"]["NOP"]["players"])>5
          print({"private_head":"40ca1b5ed3a24210d42d0c75fe87190d2dc5fdd8","cut_count":len(cuts),
                 "hou_candidates":len(roster["teams"]["HOU"]["players"]),
                 "nop_candidates":len(roster["teams"]["NOP"]["players"])})
          PY
