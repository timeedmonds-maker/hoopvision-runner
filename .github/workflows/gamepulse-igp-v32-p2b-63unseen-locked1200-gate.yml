# Source masked 63 independent games, locked 1.2s two-sided player P2B.
# Public GitHub Actions only prints aggregate gate; original QA stays private.
name: IGP 3.2 P2B locked 63 unseen original source 1200ms gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-p2b-63unseen-locked1200-gate.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  independent-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard, private original source QA and locked independent holdout tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_63unseen_71game_locked_release_gate_v1.py'
          python3 gamepulse/fusion/igp_v32_p2b_63unseen_71game_locked_release_gate_v1.py \
            --root . --out "$RUNNER_TEMP/p2b-locked-private.json" \
            > "$RUNNER_TEMP/p2b-locked.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'p2b-locked-private.json').read_bytes())
          assert q['true_unseen_original_games']==63
          assert q['source_proxy_net_over_accepted_P2A']==19497
          assert q['total_source_proxy_complete_1200_shadow']==1035995
          assert q['research_remaining_to90']==7691
          assert q['production_promoted_new_scene_count']==0
          assert q['independent_physical_possessions_certified']==0
          print('IGP_P2B_63UNSEEN_1200_LOCKED_ORIGINAL_SOURCE_HOLDOUT',json.dumps({
            'all71_research_complete':q['total_source_proxy_complete_1200_shadow'],
            'unseen_source_proxy_pass':q['source_proxy_shadow_analytics_eligible'],
            'source_XY_tail_max_ft':q['source_proxy_tail_max_ft'],
            'physical_production_gain':0},sort_keys=True))
          PY
      - name: Commit original private 63 unseen source release gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_63unseen_71game_locked_1200ms_source_gate_v1.json
          cp "$RUNNER_TEMP/p2b-locked-private.json" "$dest"
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): independent63 source 1.2s p95/p99 gate and isolated 38ft tail not physical production'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P2B_INDEPENDENT63_SOURCE_1200MS_LOCKED_GATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
