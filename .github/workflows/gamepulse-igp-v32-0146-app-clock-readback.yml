# Reviewed public orchestration only. Licensed NBA source and video XYZ remain private.
name: IGP 0146 app clock source-P2B readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-0146-app-clock-readback.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-0146-app-clock-original-readback
  cancel-in-progress: false
jobs:
  original-nba-0146-clip:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-v32-0146-app-clock-stoppage-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and private original source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_companion_stoppage_guard_v1.py \
            gamepulse/fusion/igp_v32_0146_video_clock_native_p2b_readback_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_companion_stoppage_guard_v1.py'
          echo IGP_0146_VIDEO_CLOCK_SOURCE_FREE_REGRESSION_PASS
      - name: SHA-original NBA 0146 clip, clock and guarded P2B
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_0146_video_clock_native_p2b_readback_v1.py \
            --root . --out "$RUNNER_TEMP/igp-0146-private-qa.json" \
            > "$RUNNER_TEMP/igp-0146-private-run.log" 2>&1 || {
              echo IGP_0146_ORIGINAL_SHA_CLIP_READBACK_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          log=(Path(os.environ["RUNNER_TEMP"])/"igp-0146-private-run.log").read_text(errors="replace").splitlines()
          last=next((l for l in reversed(log) if re.match(
              r"^(?:AssertionError|ValueError|KeyError|TypeError|FileNotFoundError|ImportError|StopIteration|RuntimeError):",l)),None)
          if last:
              # Only error class + symbolic error code; never NBA source timestamps/coordinates.
              s=last.split(":",1)
              code=(s[1].strip().split(":",1)[0].split(" ",1)[0] if len(s)>1 else "UNKNOWN")
              if not re.fullmatch(r"[A-Z_]{5,80}",code):code="UNCLASSIFIED"
              print("IGP_0146_PRIVATE_FAIL",s[0],code)
          else:print("IGP_0146_PRIVATE_FAIL UNCLASSIFIED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-0146-private-qa.json").read_text())
          assert q["game_id"]=="0022600146"
          assert len(q["clock_stops"])==3
          assert q["71_game_S1_or_original_modified"] is False
          assert q["native_original_timestamps_whole_game"]==30261
          assert q["original_official_logical_chains"]==205
          assert q["new_production_promotion"] is False
          c=q["clip_original_source_counts"]
          g=q["frozen_S1_running_P2B_clip_grid"]
          assert g["union_complete"]==g["previous_default_complete"]+g["new_P2B_complete_beyond_previous"]
          print("IGP_0146_APP_PBP_COMPANION_STOP_CLOCK_PASS",json.dumps({
              "stopped_intervals_ms":[s["duration_ms"] for s in q["clock_stops"]],
              "original_clip_native_timestamps":c["original_native_frames"],
              "original_clip_exact_official_ten_and_ball":c["exact_official_ten_direct_and_ball"],
              "source_10plus_actor_frames":c["ten_or_more_raw_source_actors"],
              "source_ball_frames":c["original_ball_present"],
              "S1_running_10Hz_samples":g["frozen_S1_running_100ms_samples"],
              "default_complete":g["previous_default_complete"],
              "guarded_P2B_complete":g["guarded_P2B_complete"],
              "guarded_plus_fallback_complete":g["union_complete"],
              "additional_P2B_vs_default":g["new_P2B_complete_beyond_previous"],
              "new_production_promotion":False},sort_keys=True))
          PY
      - name: Commit immutable original NBA aggregate QA to private research branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_0146_user_app_clock_p2b_readback_source_v1.json
          mkdir -p "$(dirname "$dest")"
          if test -f "$dest"; then
            cmp -s "$RUNNER_TEMP/igp-0146-private-qa.json" "$dest"
            echo IGP_0146_PRIVATE_IMMUTABLE_RECEIPT_UNCHANGED
            exit 0
          fi
          cp "$RUNNER_TEMP/igp-0146-private-qa.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): SHA-original NBA 0146 app clock stoppage and P2B clip readback'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo IGP_0146_PRIVATE_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
