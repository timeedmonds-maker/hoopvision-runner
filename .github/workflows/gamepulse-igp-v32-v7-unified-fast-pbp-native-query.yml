# V7 rerun corrected test expectation: invalid game remains GAME_NOT_IN_71_SOURCE_COHORT.
name: IGP 3.2 V7 unified 71 game PBP plus original native query
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-v7-unified-fast-pbp-native-query.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-v7-unified-fast-possession-native
  cancel-in-progress: false
jobs:
  private-native-unified:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Synthetic guard of immutable default 71game fast PBP and opt-in rules
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_71_possession_fast_index_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_71_possession_fast_index_v1.py'
          echo IGP_V7_FAST_PBP_ORIGINAL_DEFAULT_REGRESSION_SOURCEFREE_PASS
      - name: Actual source-backed opt-in XYZ retrieval by existing NBA PBP chain
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from igp_v32_71_possession_fast_index_v1 import query as fast
          from igp_v32_v5b_original_native_logical_chain_v1 import DIR,canonical
          root=Path('.')
          checked=0;total_original_frames=0
          for gid in ('0022600099','0022600122','0022600130'):
              part=json.loads((root/DIR/(gid+'.json')).read_bytes())
              links=part['linked_chains']
              assert links and links[0]['native_source_count']>0
              cid=links[0]['chain_id']
              baseline=fast(root,gid,cid)
              enriched=fast(root,gid,cid,include_outside_s1_native=True,include_positions=True,native_limit=1)
              assert enriched['tracking_usability']==baseline['tracking_usability']
              assert enriched['original_possession_v2_QA_sha256']==baseline['original_possession_v2_QA_sha256']
              assert enriched['returns_original_XYZ'] is True
              a=enriched['additional_original_native_outside_S1']
              assert a['returned']==1 and a['source_native_total']>=1
              assert 'original_native_xyz' in a['rows'][0]
              assert not a['independently_video_certified_physical_custody']
              total_original_frames+=a['source_native_total'];checked+=1
          unknown_gid='0022600006'
          v4dir=root/'gamepulse/fusion/materialized/igp_v32_71_possession_metadata_index_v1'
          chains=json.loads((v4dir/(unknown_gid+'.json')).read_bytes())['chains']
          missing=fast(root,unknown_gid,chains[0]['chain_id'],include_outside_s1_native=True)
          native=missing['additional_original_native_outside_S1']
          assert native['original_native_source_unknown_not_zero'] is True
          assert native['original_native_source_frames'] is None
          assert checked==3
          receipt={'schema':'igp.v32.v7.71game-fast-official-chain-native-optional-readback.v1',
            'real_NBA_original_SDK_PBP_XYZ_query_cases':checked,
            'real_original_native_source_frames_in_3_chains':total_original_frames,
            'without_companion_preserves_unknown_case':unknown_gid,
            'original_71game_default_fast_PBP_result_unchanged':True,
            'original_source_SDK_NBA_PBP_untouched':True,
            'newly_accepted_10hz_S1_scenes':0,
            'independent_video_physical_custody_certified':0}
          out=Path(os.environ['RUNNER_TEMP'])/'v7-source-private-receipt.json'
          out.write_bytes(canonical(receipt))
          print('IGP_V7_FAST_71GAME_UNIFIED_SOURCE_NATIVE_QUERY_ACCEPTED',json.dumps({
             'real_original_sdk_XYZ_queries':checked,
             'native_sha_original_frames_in_checked_chains':total_original_frames,
             'unknown_companion_handled':True,
             'original_PBP_default_preserved':True,
             'accepted_S1_10hz_new_scenes':0},sort_keys=True))
          PY
      - name: Store private V7 original source query acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          f=gamepulse/fusion/qa/igp_v32/igp_v32_v7_71game_fast_PBP_native_optional_source_readback_v1.json
          mkdir -p "$(dirname "$f")"
          cp "$RUNNER_TEMP/v7-source-private-receipt.json" "$f"
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$f"
          git diff --cached --check
          git commit -q -m 'qa(igp): unified V7 71game fast PBP optional original native XYZ readback'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_V7_PRIVATE_71GAME_UNIFIED_SOURCE_READBACK_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
