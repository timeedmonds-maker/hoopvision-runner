name: IGP NBA touches v4 quality control and time support research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-touch-v4-quality-sweep-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-touch-v4-observation-quality
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v31-halfcourt-touch-sequence-query-20261031
      PINNED_PRIVATE_SHA: 0dc6b8c6326bb35863cf06b43af61e2d23c78f23
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and source SHA pin
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion gamepulse/live
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_touch_v4_control_quality_sweep.py'
      - name: NBA original source duration and control qualification (PRIVATE)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_touch_v4_control_quality_sweep.py \
             --root . \
             --reference gamepulse/fusion/benchmarks/nba_0022600138_rockets_user_screenshot_playertrack_v1.json \
             --output "$RUNNER_TEMP/igp-v4-custody-private.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-v4-custody-private.json').read_text())
          assert len(x['settings'])==140 and x['source_frames']==30643
          assert all(z['total']['nba']==195 and z['paint']['nba']==20 for z in x['settings'])
          assert all(z['total']['players']==7 and z['paint']['players']==7 for z in x['settings'])
          assert x['certified_physical_touches']==0 and x['nonpromotion']
          top=x['ranked_count_error'][0]
          print('IGP_V4_NBA_SOURCE_CUSTODY_QA_PASS',json.dumps({
               'settings':len(x['settings']),
               'best_in_development_count_wape':top['total']['wape'],
               'best_count_pred':top['total']['pred'],
               'best_count_paint_wape':top['paint']['wape'],
               'best_count_duration_wape':top['duration_wape']},sort_keys=True))
          PY
      - name: Save private research-only sensitivity report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          payload=(Path(os.environ['RUNNER_TEMP'])/'igp-v4-custody-private.json').read_bytes()
          if len(payload)>950000:raise ValueError('RESEARCH_REPORT_TOO_LARGE')
          dest='repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/igp_touch_v4_control_quality_0022600138_qa.json'
          branch=os.environ['BRANCH']
          old=subprocess.run(['gh','api',dest+'?ref='+branch],capture_output=True,text=True)
          body={'branch':branch,'message':'qa(igp): definition aligned NBA source v4 touched-control and duration sweep','content':base64.b64encode(payload).decode()}
          if old.returncode==0:body['sha']=json.loads(old.stdout)['sha']
          out=subprocess.run(['gh','api','-X','PUT',dest,'--input','-'],input=json.dumps(body),capture_output=True,text=True)
          if out.returncode:raise ValueError('PRIVATE_QA_WRITE_FAILED')
          print('IGP_V4_PRIVATE_QA_PERSISTED')
          PY