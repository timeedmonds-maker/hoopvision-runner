# Reviewed source-private multi-agent vs actual P2B guarded bracket on the same masks.
# Public logs contain only aggregate QA; model, original XYZ and provenance stay private.
name: IGP P3 multiagent vs P2B disjoint original-source QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-multiagent-p2b-disjoint-masked-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-p3-p2b-disjoint-original-masked-source
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-v32-multiagent-adapter-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard and private source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          python3 -m pip install -q numpy scikit-learn
      - name: Source-free regressions and same-mask paired source experiment
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_multiagent_p2b_disjoint_source_gate_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_multiagent_p2b_disjoint_source_gate_v1.py'
          python3 gamepulse/fusion/igp_multiagent_p2b_disjoint_source_gate_v1.py \
            --root . --out "$RUNNER_TEMP/p3-p2b-original-source-private.json" \
            > "$RUNNER_TEMP/p3-p2b-original-source-private.log" 2>&1 || {
              echo IGP_P3_P2B_ORIGINAL_SOURCE_EVALUATION_REJECTED
              exit 43
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"p3-p2b-original-source-private.json").read_bytes())
          assert q["model_training_excludes_test_games"] and q["all_eleven_source_masked_simultaneously"]
          assert q["frozen_S1_10hz_denominator"]==1159651
          assert q["frozen_P2B_guarded_default_10hz_complete"]==1015072
          assert q["new_production_complete_scenes"]==0 and not q["independent_video_certified"]
          for gap in ("1000","2000","5000"):
              r=q["by_gap_ms"][gap]
              assert r["train_original_source_native_masked_samples"]>0
              assert r["test_original_source_native_masked_samples"]>0
              for kind in ("player","ball"):
                  x=r["heldout_p2b_guarded_vs_multiagent"]["errors_ft"][kind]["all_source_targets"]
                  assert x["multiagent"]["eligible"]==x["linear"]["eligible"]
          print("IGP_P3_P2B_71_SOURCE_COHORT_PAIRED_DISJOINT_RESEARCH",
                json.dumps({g:{
                    "test_original_native_scenes":q["by_gap_ms"][g]["test_original_source_native_masked_samples"],
                    "P2B_complete_on_blackout":q["by_gap_ms"][g]["heldout_p2b_guarded_vs_multiagent"]["source_native_masked_scene_counts"].get("p2b_complete_proxy",0),
                    "multiagent_complete_candidate":q["by_gap_ms"][g]["heldout_p2b_guarded_vs_multiagent"]["source_native_masked_scene_counts"].get("multiagent_complete_candidate",0),
                    "multiagent_player_p95_ft":q["by_gap_ms"][g]["heldout_p2b_guarded_vs_multiagent"]["errors_ft"]["player"]["all_source_targets"]["multiagent"]["p95_ft"],
                    "multiagent_ball_p95_ft":q["by_gap_ms"][g]["heldout_p2b_guarded_vs_multiagent"]["errors_ft"]["ball"]["all_source_targets"]["multiagent"]["p95_ft"],
                } for g in ("1000","2000","5000")},sort_keys=True))
          PY
      - name: Persist immutable aggregate-only QA in private research branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_multiagent_p2b_fourgame_disjoint_source_gate_v1.json
          test ! -e "$dest"
          cp "$RUNNER_TEMP/p3-p2b-original-source-private.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): source-paired multiagent vs guarded P2B 1s 2s 5s research'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 44
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo IGP_P3_P2B_4GAME_PRIVATE_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 45
