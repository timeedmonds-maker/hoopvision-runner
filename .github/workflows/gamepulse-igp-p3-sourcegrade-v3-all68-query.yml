name: IGP P3 original NBA 68game real fastball sourcegrade v3 research query acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-sourcegrade-v3-all68-query.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-sourcegrade-v3-query-all68
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: c8826c0c7ec1b71cc0ed3947f4208a8285ad028f
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source confidentiality and frozen original 68-game private NBA SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test live original NBA v3 source-grade query in each of 68 games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_source_grade_query_all68_readback_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_source_grade_query_all68_readback_v1.py --root . --output "$RUNNER_TEMP/full68-private.json" > "$RUNNER_TEMP/full68-private.log" 2>&1; then
            echo P3_SOURCE_GRADE_ALL68_REAL_NBA_READBACK_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          ls=(Path(os.environ['RUNNER_TEMP'])/'full68-private.log').read_text(errors='replace').splitlines()
          last=next((s for s in reversed(ls) if s.strip()),'NO_LOG')
          print('P3_ALL68_QUERY_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:85])
          print('P3_ALL68_READBACK_GAMES_FINISHED',sum(s.startswith('P3_FASTBALL_QUERY_ALL68_ORIGINAL_GAME') for s in ls))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'full68-private.json').read_text())
          t=q['totals']
          assert len(q['per_game'])==t['games']==68
          assert t['rows']==204 and t['linear_shadow']>=68
          assert q['original_68_native_research_complete']==492617
          assert q['original_68_10hz_research_complete']==917686
          assert q['natural_original_68_bounded_velocity_ball_candidate_count']==40367
          assert q['natural_original_68_ten_plus_ball_candidate_count']==37182
          assert q['original_upstream_per_actor_interpolation_unresolved']
          assert q['physical_video_accuracy_not_certified'] and q['accepted_tracking_scene_delta']==0
          print('IGP_P3_NBA_SOURCE_GRADE_V3_FULL68_QA',json.dumps(t,sort_keys=True))
          PY
      - name: Preserve SHA-original NBA all68 report and query source provenance privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_source_grade_query_all68_readback_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-original-68-query "origin/$BRANCH"
          cp "$RUNNER_TEMP/full68-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): 68 original NBA source-grade fastball physics query game-scoped readback'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_ORIGINAL_68_SOURCE_GRADE_QUERY_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
