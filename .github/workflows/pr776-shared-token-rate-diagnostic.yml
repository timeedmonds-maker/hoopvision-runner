name: PR776 free runner shared-token read-only diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pr776-shared-token-rate-diagnostic.yml', 'tools/public_content_guard.py']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source boundaries
        run: python3 tools/public_content_guard.py
      - name: Inspect shared private-read token's REST quota without exposure
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,datetime
          url='https://api.github.com/rate_limit'
          req=urllib.request.Request(url,headers={
            'Accept':'application/vnd.github+json',
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'X-GitHub-Api-Version':'2022-11-28'})
          try:
            with urllib.request.urlopen(req,timeout=20) as r:
              d=json.load(r)
              quota=d['resources']['core']
              print('SHARED_TOKEN_REST_QUOTA',json.dumps({
                'http':r.status,'remaining':quota['remaining'],
                'limit':quota['limit'],
                'reset_utc':datetime.datetime.fromtimestamp(
                  quota['reset'],datetime.timezone.utc).isoformat()},sort_keys=True))
          except urllib.error.HTTPError as e:
            print('SHARED_TOKEN_REST_REJECTED',json.dumps({
              'http':e.code,'remaining':e.headers.get('X-RateLimit-Remaining'),
              'reset':e.headers.get('X-RateLimit-Reset'),
              'retry_after':e.headers.get('Retry-After')},sort_keys=True))
            raise SystemExit(2)
          PY
