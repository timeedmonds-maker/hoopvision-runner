name: IGP eight newer full original SDK XYZ private recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-eight-native-raw-backfill.yml']
  workflow_dispatch:
  schedule:
    - cron: '39 * * * *'
permissions: {contents: read}
jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check reviewed public workflow and clone private canonical data
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/igp-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) echo x-access-token;;
            *Password*) echo "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/igp-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/igp-askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Backfill source-verified eight new NBA games without invented clock alignment
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_extract_all_original_sdk_xyz_2026.py'
          python3 - <<'PY' > "$RUNNER_TEMP/igp-games.txt"
          import json,os
          from pathlib import Path
          r=Path("gamepulse/fusion/materialized")
          official=json.loads((r/"nba_episode_tracking_pr776_20261025/index.json").read_text())
          older=json.loads((r/"official_native_episode_xyz_pr776_20261026/index.json").read_text())
          gids=[f"0022600{i:03d}" for i in range(104,112)]
          assert all(gid in official["games"] and gid not in older["games"] for gid in gids)
          for n,gid in enumerate(gids):
              if n%4==int(os.environ["SHARD"]):print(gid)
          PY
          while read -r gid; do
            test -n "$gid" || continue
            out="gamepulse/fusion/materialized/igp_all_original_xyz/$gid"
            if test -f "$out/index.json"; then continue; fi
            mkdir -p "$RUNNER_TEMP/sdk-$gid"
            gh api "repos/$R/releases/tags/gamepulse-sdk-$gid" > "$RUNNER_TEMP/release-$gid.json"
            gh release download "gamepulse-sdk-$gid" -R "$R" --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk-$gid"
            test "$(find "$RUNNER_TEMP/sdk-$gid" -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
            python3 gamepulse/fusion/igp_extract_all_original_sdk_xyz_2026.py \
              --game-id "$gid" --archive-dir "$RUNNER_TEMP/sdk-$gid" \
              --release-manifest "$RUNNER_TEMP/release-$gid.json" --out-dir "$out"
            PYTHONPATH=gamepulse/fusion python3 - "$gid" <<'PY'
          import json,sys
          from pathlib import Path
          from query_igp_all_original_sdk_xyz_2026 import query
          gid=sys.argv[1];f=Path("gamepulse/fusion/materialized/igp_all_original_xyz")/gid/"index.json"
          m=json.loads(f.read_text());c=m["original_frame_counts"]
          assert m["game_id"]==gid and len(m["original_archive_parts_sha256"])==13
          assert c["unique_original_native_timestamps"]>0
          assert c["native_window_candidate_grades"]=={
              "NATIVE_WINDOW_INDEX_NOT_SUPPLIED":c["unique_original_native_timestamps"]}
          assert m["physical_possessions_certified"]==0
          result=query(Path("."),gid,limit=1,verify_all=True)
          assert result["matched_original_timestamps"]==c["unique_original_native_timestamps"]
          assert result["native_to_nba_clock_independently_validated"] is False
          print("IGP_NEW_GAME_FULL_NATIVE_SOURCE_ACCEPTED",
             gid,c["unique_original_native_timestamps"],
             c["direct_ten_players_plus_ball_timestamps"],"clock_certified=0")
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f "$out"
            git commit -q -m "data(igp): private all-original native XYZ $gid no clock fit"
            published=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch -q origin "$B"
              git rebase -q "origin/$B"
              if git push -q origin "HEAD:refs/heads/$B"; then
                published=1
                echo IGP_PRIVATE_NEW_SOURCE_GAME_COMMITTED "$gid"
                break
              fi
              sleep "$attempt"
            done
            test "$published" -eq 1
            rm -rf "$RUNNER_TEMP/sdk-$gid" "$RUNNER_TEMP/release-$gid.json"
          done < "$RUNNER_TEMP/igp-games.txt"
          echo IGP_EIGHT_GAME_SHA_SOURCE_SHARD_COMPLETE "$SHARD"
