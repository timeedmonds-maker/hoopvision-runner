name: Integrated Pulse complete 36-game unassigned source-label search
# Free public CPU only; no licensed player data or search output written publicly.
# Extend the frozen 28-game unmatched-source index to eight new final games; preserve per-game SHA receipts.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-unattributed-native-source.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-pulse-private-unassigned-native-touch-recovery
  cancel-in-progress: false
jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        game:
          - '0022600104'
          - '0022600105'
          - '0022600106'
          - '0022600107'
          - '0022600108'
          - '0022600109'
          - '0022600110'
          - '0022600111'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      GAME_ID: ${{ matrix.game }}
      SOURCE_REF: 387f02e27fe7dd9fa42ae8bf3a695e30532129dc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public-private content separation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_ACCESS_MISSING'; exit 3; }
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
      - name: Retrieve authentic private SDK index builder and tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pulse-unassigned"
          mkdir -p "$ROOT"/{sdk,tests}
          fetch() {
            local src="$1" dest="$2"
            gh api "repos/$PRIVATE_REPO/contents/$src?ref=$SOURCE_REF" --jq .content |
              base64 -d > "$ROOT/$dest"
            test -s "$ROOT/$dest"
          }
          fetch gamepulse/fusion/unattributed_source_labels_2026.py unattributed_source_labels_2026.py
          fetch gamepulse/fusion/gamepulse_ball_dynamics.py gamepulse_ball_dynamics.py
          fetch gamepulse/fusion/gamepulse_ball_control.py gamepulse_ball_control.py
          fetch gamepulse/fusion/tests/test_unattributed_source_labels_2026.py tests/test_unattributed_source_labels_2026.py
          for p in "gamepulse/fusion/index/interactions/$GAME_ID.json" \
                   "gamepulse/fusion/index/games/$GAME_ID.json"; do
            target=interaction.json
            if [[ "$p" == *"/index/games/"* ]]; then target=view.json; fi
            gh api "repos/$PRIVATE_REPO/contents/$p?ref=main" --jq .content |
              base64 -d > "$ROOT/$target"
            test -s "$ROOT/$target"
          done
          python3 -m py_compile "$ROOT/unattributed_source_labels_2026.py"
          PYTHONPATH="$ROOT" python3 -m unittest discover -v -s "$ROOT/tests" \
            -p 'test_unattributed_source_labels_2026.py'
      - name: Recover original thirteen-part private SDK archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pulse-unassigned"
          TAG="gamepulse-sdk-$GAME_ID"
          gh api "repos/$PRIVATE_REPO/releases/tags/$TAG" > "$ROOT/release.json"
          gh release download "$TAG" --repo "$PRIVATE_REPO" \
            --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk" --clobber >/dev/null
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"pulse-unassigned"
          expected={a["name"]:a.get("digest") for a in json.loads(
               (root/"release.json").read_text())["assets"]
               if re.fullmatch(r"sdk-part-\d{2}\.tar\.gz",a["name"])}
          actual=list((root/"sdk").glob("sdk-part-??.tar.gz"))
          assert len(expected)==len(actual)==13,"ORIGINAL_SDK_PART_COVERAGE_FAILURE"
          assert all(expected[f.name]=="sha256:"+hashlib.sha256(f.read_bytes()).hexdigest()
              for f in actual),"ORIGINAL_SDK_SOURCE_SHA_MISMATCH"
          print("PRIVATE_ORIGINAL_NATIVE_SDK_SOURCE_VERIFIED")
          PY
      - name: Reconcile unmatched labels against SHA-pinned accepted PBP team runs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pulse-unassigned"
          cd "$ROOT"
          python3 unattributed_source_labels_2026.py --game "$GAME_ID" \
            --sdk-dir sdk --interaction interaction.json --view view.json \
            --out unassigned.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"pulse-unassigned"
          doc=json.loads((root/"unassigned.json").read_text())
          interaction=json.loads((root/"interaction.json").read_text())
          assert doc["game_id"]==os.environ["GAME_ID"]
          assert doc["schema"]=="gamepulse.unassigned-original-native-touch-search.v1"
          assert doc["source_labels_with_valid_frame_times"]==interaction["source_event_counts"]["native_unique_touch_labels"]
          assert doc["source_native_labels_joined_in_EXISTING_interaction_index"]==interaction["source_event_counts"]["native_contact_start_attributed"]
          assert doc["source_native_labels_unassigned_in_this_index"]==len(doc["unassigned_touches"])
          assert doc["physical_possessions_certified"]==0
          assert all(t["nba_action_number"] is None for t in doc["unassigned_touches"])
          print("PRIVATE_UNASSIGNED_SOURCE_LABELS_RECONCILED")
          PY
      - name: Persist original unmatched labels privately with SHA readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time
          from pathlib import Path
          repo=os.environ["PRIVATE_REPO"];gid=os.environ["GAME_ID"]
          data=(Path(os.environ["RUNNER_TEMP"])/"pulse-unassigned/unassigned.json").read_bytes()
          path="repos/"+repo+"/contents/gamepulse/fusion/index/unassigned_native_labels/"+gid+".json"
          def gh(*args,input=None,check=True):
              p=subprocess.run(["gh","api",*args],input=input,text=True,
                               capture_output=True,timeout=100)
              if check and p.returncode:raise RuntimeError("PRIVATE_SOURCE_INDEX_API_FAILED")
              return p
          for attempt in range(20):
              existing=gh(path,check=False)
              payload={"branch":"main",
                 "message":"data(gamepulse): retain original unmatched native SDK label search "+gid,
                 "content":base64.b64encode(data).decode()}
              if existing.returncode==0:
                  current=json.loads(existing.stdout)
                  if base64.b64decode(current["content"])==data:
                      print("PRIVATE_ORIGINAL_UNASSIGNED_LABELS_UNCHANGED");break
                  payload["sha"]=current["sha"]
              elif "Not Found" not in existing.stderr and "404" not in existing.stderr:
                  raise RuntimeError("PRIVATE_SOURCE_PREVIOUS_READ_FAILED")
              put=gh("-X","PUT",path,"--input","-",input=json.dumps(payload),check=False)
              if put.returncode:
                  time.sleep(min(2+attempt,20)+(int(gid[-2:])%7)/7);continue
              sha=json.loads(put.stdout)["content"]["sha"]
              read=json.loads(gh("repos/"+repo+"/git/blobs/"+sha).stdout)
              observed=base64.b64decode(read["content"])
              assert observed==data and hashlib.sha256(observed).digest()==hashlib.sha256(data).digest()
              print("PRIVATE_SOURCE_UNATTRIBUTED_LABEL_INDEX_SHA_VERIFIED");break
          else:raise RuntimeError("PRIVATE_UNATTRIBUTED_LABEL_PUBLISH_RETRIES_EXHAUSTED")
          PY
  aggregate:
    needs: recover
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble full private 36-game unmatched-source-label search manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time
          repo=os.environ["PRIVATE_REPO"]
          def gh(*args,input=None,check=True):
              p=subprocess.run(["gh","api",*args],input=input,
                 capture_output=True,text=True,timeout=100)
              if check and p.returncode:raise RuntimeError("PRIVATE_UNASSIGNED_MANIFEST_API_FAILED")
              return p
          def read(path):
              d=json.loads(gh("repos/"+repo+"/contents/"+path).stdout)
              raw=base64.b64decode(d["content"])
              return json.loads(raw),raw
          manifest,_=read("gamepulse/fusion/index/interactions/index-2026-27.json")
          records={};total=0;observed=0
          for gid,source in sorted(manifest["games"].items()):
              path="gamepulse/fusion/index/unassigned_native_labels/"+gid+".json"
              doc,raw=read(path)
              assert doc["schema"]=="gamepulse.unassigned-original-native-touch-search.v1"
              assert doc["game_id"]==gid
              assert doc["input_sha256"]["interaction_index_json"]==source["sha256"]
              assert doc["physical_possessions_certified"]==0
              native=doc["source_native_labels_unassigned_in_this_index"]
              assert native==len(doc["unassigned_touches"])
              records[gid]={"path":path,"sha256":hashlib.sha256(raw).hexdigest(),
                 "unassigned_native_labels":native,
                 "source_labels":doc["source_native_distinct_labels"]}
              total+=native;observed+=doc["source_native_distinct_labels"]
          assert len(records)==36,"EXPECTED_ALL_36_VERIFIED_PBP_RUN_GAMES"
          previous,_=read("gamepulse/fusion/index/unassigned_native_labels/index-2026-27.json")
          assert previous["game_count"]==28,"ORIGINAL_28_UNASSIGNED_MANIFEST_COUNT_CHANGED"
          assert set(previous["games"]).issubset(records),"ORIGINAL_28_UNASSIGNED_MANIFEST_MISSING"
          assert all(records[gid]==v for gid,v in previous["games"].items()), "ORIGINAL_28_UNASSIGNED_SHA_MUTATED"
          result={"schema":"gamepulse.unassigned-original-native-season-index.v1",
                  "season":"2026-27","game_count":len(records),"games":records,
                  "unassigned_source_native_labels":total,
                  "all_original_source_labels_in_joined_games":observed,
                  "physical_possessions_certified":0,
                  "state":"UNASSIGNED_NATIVE_LABELS_AVAILABLE_WITHOUT_UNVERIFIED_PBP_JOIN"}
          data=(json.dumps(result,sort_keys=True,indent=2)+"\n").encode()
          endpoint="repos/"+repo+"/contents/gamepulse/fusion/index/unassigned_native_labels/index-2026-27.json"
          for attempt in range(12):
              old=gh(endpoint,check=False)
              payload={"branch":"main","message":"data(gamepulse): original native unassigned touch search across 36 games",
                       "content":base64.b64encode(data).decode()}
              if old.returncode==0:
                  prev=json.loads(old.stdout)
                  if base64.b64decode(prev["content"])==data:break
                  payload["sha"]=prev["sha"]
              elif "404" not in old.stderr and "Not Found" not in old.stderr:
                  raise RuntimeError("PRIVATE_UNASSIGNED_MANIFEST_PREVIOUS_READ_FAILED")
              new=gh("-X","PUT",endpoint,"--input","-",input=json.dumps(payload),check=False)
              if new.returncode:time.sleep(attempt+1);continue
              sha=json.loads(new.stdout)["content"]["sha"]
              blob=json.loads(gh("repos/"+repo+"/git/blobs/"+sha).stdout)
              assert base64.b64decode(blob["content"])==data,"PRIVATE_UNASSIGNED_INDEX_HASH_READBACK_FAILED"
              break
          else:raise RuntimeError("PRIVATE_UNASSIGNED_SOURCE_SEASON_INDEX_WRITE_FAILED")
          print("PRIVATE_UNATTRIBUTED_NATIVE_SOURCE_SEASON_SEARCH_VERIFIED",
                "game_count",len(records),"source_labels_indexed",total)
          PY
