# Six official NBA angle videos are fetched at runtime; no NBA source,
# source tokens, generated frames or output assets are stored in this PUBLIC repo.
name: Amen732 six public official camera videos to 3D UHD virtual-camera MP4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-sixvideo-public-reacquire.yml']
permissions:
  contents: read
concurrency:
  group: amen732-official-sixvideo-public-source-private-output
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and public privacy boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/amen732_freeview_sixvideo_public_source.py
          echo PUBLIC_OFFICIAL_SOURCE_PRIVATE_SINK_PRESERVED
      - name: Install SHA-pinned DA3 BASE CPU model and native video encoder
        run: |
          set -euo pipefail
          DA3="$RUNNER_TEMP/da3"
          mkdir -p "$DA3"
          git -C "$DA3" init -q
          git -C "$DA3" fetch --quiet --depth 1 https://github.com/ByteDance-Seed/Depth-Anything-3.git 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
          git -C "$DA3" checkout -q --detach FETCH_HEAD
          test "$(git -C "$DA3" rev-parse HEAD)" = 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
          python3 -m pip install -q --disable-pip-version-check 'numpy<2' 'opencv-python-headless==4.10.0.84' pillow einops huggingface-hub omegaconf safetensors timm e3nn trimesh imageio 'transformers>=4.45,<5' plyfile 'moviepy==1.0.3' evo addict pycolmap pillow-heif imageio-ffmpeg
          python3 -m pip install -q --disable-pip-version-check torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q --disable-pip-version-check --no-deps -e "$DA3"
          echo SIXVIDEO_PUBLIC_ORIGINAL_CPU_MODEL_SETUP_PASS
      - name: Reacquire six native NBA MP4 feeds, jointly reconstruct and render unrestricted camera movements
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amen732-sixvideo"
          python3 tools/amen732_freeview_sixvideo_public_source.py \
            --out "$RUNNER_TEMP/amen732-sixvideo"
          python3 - "$RUNNER_TEMP/amen732-sixvideo/amen732-six-native-public-source-research-qa.json" <<'PY'
          import json,sys
          from pathlib import Path
          q=json.load(open(sys.argv[1]))
          assert q['original_source_count']==6
          assert q['native_source_frames_evaluated']==18
          assert len(q['moving_camera_mp4_outputs'])==2
          assert not q['same_physical_instant_verified']
          for v in q['moving_camera_mp4_outputs']:
              assert (Path(sys.argv[1]).parent/v['file']).stat().st_size>10000
              assert v['frames']==96
          print("REAL_SIXVIDEO_FREE_VIEW_MOVING_CAMERA_MP4S_EXECUTED")
          PY
      - name: Retain outputs ONLY in private GitHub 104 release with SHA readback
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo PRIVATE_SINK_TOKEN_NOT_CONFIGURED; exit 3; }
          ROOT="$RUNNER_TEMP/amen732-sixvideo"
          TAG=freeview-amen732-public-original-sixvideo-20261028
          for attempt in $(seq 1 55); do
            if gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1 || \
               gh release create "$TAG" --repo timeedmonds-maker/104 \
                 --title 'Amen/Wemby six official native angle video 3D virtual camera' \
                 --notes 'Source-original HLS 6-angle fusion, model-only 170/360 diagnostic, not certified replay' \
                 --latest=false >/dev/null 2>&1; then break; fi
            echo WAITING_FOR_PRIVATE_OUTPUT_SINK_ACCESS
            sleep 60
          done
          gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null
          for attempt in $(seq 1 12); do
            if gh release upload "$TAG" \
                 "$ROOT/amen732-sixvideo-unposed-170deg-3840x2160.mp4" \
                 "$ROOT/amen732-sixvideo-unposed-360deg-3840x2160.mp4" \
                 "$ROOT/amen732-six-native-public-source-research-qa.json" \
                 --repo timeedmonds-maker/104 --clobber >/dev/null 2>&1; then break; fi
            echo PRIVATE_SINK_TEMPORARILY_UNAVAILABLE
            sleep 60
          done
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$RUNNER_TEMP/private-release.json"
          python3 - "$ROOT" "$RUNNER_TEMP/private-release.json" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assets={x['name']:x for x in json.load(open(sys.argv[2]))['assets']}
          for name in ('amen732-sixvideo-unposed-170deg-3840x2160.mp4',
                       'amen732-sixvideo-unposed-360deg-3840x2160.mp4',
                       'amen732-six-native-public-source-research-qa.json'):
              assert assets[name]['digest']=='sha256:'+hashlib.sha256((root/name).read_bytes()).hexdigest()
          print('PRIVATE_SIXVIDEO_SOURCE_FREEVIEW_MP4_SHA_VERIFIED')
          PY
