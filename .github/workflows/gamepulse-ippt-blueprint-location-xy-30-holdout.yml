name: IPPT original Game Pulse shooter XY vs published Blueprint shot location 30game holdout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-blueprint-location-xy-30-holdout.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  shooter-chart-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: 3f846082057a44da5b9b9d32402f95ee54705113
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and SHA original NBA Game Pulse / published Blueprint
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
              "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
              gamepulse/fusion data/extensions/nba_blueprint_2026_27
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-to-chart calibration / heldout dataset leakage tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_blueprint_shot_location_source_xy_holdout_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_blueprint_shot_location_source_xy_holdout_2026.py
      - name: All 36 native games six development thirty heldout independent Blueprint shot XY
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_blueprint_shot_location_source_xy_holdout_2026.py --root . | tee "$RUNNER_TEMP/ippt_landmark_aggregate.log"
          echo "IPPT_SHOOTER_XY_BLUEPRINT_LOCATION_30GAME_HOLDOUT_PASS"
      - name: Publish sanitized aggregate-only QA receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"ippt_landmark_aggregate.log"
          report={"github_run_id":os.environ["GITHUB_RUN_ID"],
                  "job_result_prior_to_receipt":os.environ["QA_JOB_RESULT"],
                  "private_source_commit_expected":"3f846082057a44da5b9b9d32402f95ee54705113"}
          if path.exists():
              lines=[line.split(" ",1)[1] for line in path.read_text().splitlines()
                     if line.startswith("IPPT_SOURCE_SHOOTER_XY_VS_BLUEPRINT_SHOT_CHART_30GAME_HOLDOUT ")]
              if len(lines)==1:
                  doc=json.loads(lines[0])
                  report["schema"]=doc["schema"]
                  report["game_count"]=doc["games"]
                  report["holdout_game_count"]=doc["heldout_games"]
                  report["baseline_shooter_30game"]=doc["untouched_30game_holdout"]
                  paired=doc["paired_ball_vs_shooter_landmark_and_chart_scale_probe"]
                  report["paired_original_native_ball_shooter_30game"]={
                      k:paired[k] for k in (
                          "development_paired_shots","holdout_paired_shots",
                          "shooter_common_holdout",
                          "ball_common_holdout_same_shooter_transform",
                          "ball_common_holdout_ball_transform_fit_only_on_six_dev",
                          "chart_distance_control_selected_on_six_dev",
                          "chart_distance_controls_holdout_not_used_to_choose_model",
                          "by_shot_type")}
          body="Original NBA licensed XY are NOT present. Cross-source chart disagreement is NOT optical positional validation.\n\n" + "~~~json\n" + json.dumps(report,sort_keys=True,indent=2) + "\n~~~\n"
          (Path(os.environ["RUNNER_TEMP"])/"ippt_landmark_qa_comment.md").write_text(body)
          PY
          gh issue comment 122 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_landmark_qa_comment.md"

# Paired ball/shooter native same-frame, Blueprint shot-distance semantics controls.
# No original individual native NBA coordinates written to public runner logs.
