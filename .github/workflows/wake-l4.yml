name: Wake HoopVision L4
# wake-trigger: identity-evidence-debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wake-l4.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-southeast1-c
  INSTANCE: hv-dev-l4
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Start prepared L4 if stopped
        shell: bash
        run: |
          set -euo pipefail
          # A one-time shutdown diagnostic previously installed shutdown-script
          # metadata. Clear it defensively before every wake so the instance
          # cannot immediately stop itself again.
          gcloud compute instances remove-metadata "$INSTANCE" \
            --project="$PROJECT_ID" --zone="$ZONE" --keys=shutdown-script >/dev/null 2>&1 || true

          STATUS="$(gcloud compute instances describe "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" --format='value(status)')"
          echo "Current status: $STATUS"
          if [ "$STATUS" != "RUNNING" ]; then
            gcloud compute instances start "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" --async
          fi

          for i in $(seq 1 90); do
            STATUS="$(gcloud compute instances describe "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" --format='value(status)')"
            echo "L4 status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "HOOPVISION_L4_RUNNING"
              exit 0
            fi
            sleep 4
          done
          echo "L4 did not reach RUNNING" >&2
          exit 1
