name: PR776 original full-SDK 120 trajectory gap fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-direct-full-sdk-120-fallback.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and stage canonical private full original SDK XYZ
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: SHA-verify recoverable raw XYZ in 120 previously unmatched native subset gaps
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_original_full_source_chain_gap_recovery_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261026/monotone_chain_full_original_sdk_120_fallback_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_original_full_source_chain_gap_recovery_2026.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          a=j['recovery_counts']
          assert a['previously_unqueryable_candidates']==120
          assert a['full_original_SDK_fallback_recovered']==120
          assert j['physical_possessions_certified']==0
          print('IGP_120_DIRECT_ORIGINAL_SOURCE_FALLBACK_ACCEPTED',json.dumps(a,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          git commit -q -m "data(igp): source-SHA verify 120 provisional NBA chain XYZ full SDK fallbacks"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then echo IGP_120_DIRECT_XYZ_FALLBACK_PRIVATE_COMMITTED; exit 0; fi
            sleep "$i"
          done
          exit 11
