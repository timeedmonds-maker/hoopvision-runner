name: IPPT all36 NBA official gameclock ten-player ModelB source readiness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-official-gameclock-ten-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  private-source-ten:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/ippt-event-snapshots-separate-20261028
      SHA: e990f414acd86be957a473bd41dd65fbc7b88247
      QA: gamepulse/fusion/qa/igp_progress_20261028/ippt_official_gameclock_ten_model_ready_all36_v1.json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Original full native private SHA and public privacy
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SHA"
          echo "PRIV=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Measure official on-court ten source brackets and ball on 98058 running gameclock seconds
        run: |
          set -euo pipefail
          cd "$PRIV"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_official_gameclock_model_ready_2026.py
          python3 gamepulse/fusion/igp_ippt_official_gameclock_model_ready_2026.py --root . --out "$QA" > "$RUNNER_TEMP/private-result.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads(Path(os.environ["QA"]).read_text());c=a["totals"]
          assert len(a["games"])==36 and c["activity_gameclock_seconds"]==98058
          assert c["official_gameclock_ten_known"]+c["official_gameclock_ten_unknown"]==98058
          assert c["official_ten_10_players_bracket_1s"]<=c["official_gameclock_ten_known"]
          assert c["official_ten_8_players_near_2s_plus_ball_near_2s"]>=c["official_ten_10_players_near_2s_plus_ball_near_2s"]
          assert a["two_sided_source_bracket_is_model_support_not_position_accuracy"]
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(
              json.dumps({"games":36,"totals":c,"physical_custody_certified":False},sort_keys=True))
          print("IPPT_ALL36_NBA_OFFICIAL_TEN_GAMECLOCK_SOURCE_MODEL_READY_PASS",json.dumps(c,sort_keys=True))
          PY
      - name: Commit original private source QA
        run: |
          set -euo pipefail
          cd "$PRIV"
          git config user.name "NBA Official Clock Model Source QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$QA"
          git diff --cached --check
          git commit -qm "qa(ippt): real official gameclock ten-player ModelB bracketing all 36 native NBA games"
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            sleep "$i"
          done
          exit 13
      - name: Publish aggregate-only and destroy private NBA source
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          d=json.loads((r/"safe.json").read_text()) if (r/"safe.json").exists() else {"status":os.environ["STATUS"]}
          d.update({"run_id":os.environ["GITHUB_RUN_ID"],"code_sha":os.environ["SHA"]})
          (r/"receipt.md").write_text("Official NBA gameclock ten-player original SDK source model readiness, aggregate counts only, independent video unverified.\n\n~~~json\n"+json.dumps(d,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/receipt.md"
