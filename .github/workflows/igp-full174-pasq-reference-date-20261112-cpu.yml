name: IGP Full174 2026-11-12 prior similar-shot reference census
on:
  push:
    branches: [research/igp-full174-pasq-private-cpu-20261114]
    paths: ['.github/workflows/igp-full174-pasq-reference-date-20261112-cpu.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full174-pasq-target-shooters-20261112-v1
  cancel-in-progress: true
jobs:
  source_graded_reference_census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GIT_TERMINAL_PROMPT: '0'
      PRIVATE_REPO: timeedmonds-maker/104
      SOURCE_BRANCH: analysis/full174-pasq-historical-recency-20261114
      SOURCE_COMMIT: 6f0c2821a7c356f98c356ee43ba8ad77d6da1efb
    steps:
      - name: Authenticate original private source and checkout immutable code
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/"$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$SOURCE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$SOURCE_COMMIT"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$SOURCE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion \
            gamepulse/third_party/courtsketch data/extensions/nba_blueprint_2026_27 \
            data/extensions/nba_gravity_2026_27
          test -f "$RUNNER_TEMP/private/gamepulse/fusion/igp_full174_pasq_reference_date_audit_v1.py"
          mkdir -p "$RUNNER_TEMP/history" "$RUNNER_TEMP/output"
          gh release download igp-2025-26-xfg-archive-20261105 \
            --repo "$PRIVATE_REPO" --pattern 'nba-xfg-*.jsonl.gz' \
            --pattern 'nba-xfg-*-qa.json' --dir "$RUNNER_TEMP/history"
          gh release download igp-public-gamepulse-2025-26-20261105 \
            --repo "$PRIVATE_REPO" --pattern 'nba-2025-26-source-index.json' \
            --dir "$RUNNER_TEMP/history"
          test "$(find "$RUNNER_TEMP/history" -name 'nba-xfg-*.jsonl.gz' | wc -l)" -eq 15
          test "$(find "$RUNNER_TEMP/history" -name 'nba-xfg-*-qa.json' | wc -l)" -eq 15
          test "$(sha256sum "$RUNNER_TEMP/history/nba-2025-26-source-index.json" | cut -d' ' -f1)" = b17861f106f3eed544f745fba26fe42e7a81a33a0e4c67d460d2da9d959fee47
          echo REFERENCE_CENSUS_PRIVATE_SOURCE_READY
      - name: Execute tests then exact prior match-count audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          set +e
          PYTHONPATH=gamepulse/fusion python3 -m unittest -v \
            gamepulse/fusion/tests/test_igp_full174_pasq_historical_similar_v1.py \
            > "$RUNNER_TEMP/output/tests.log" 2>&1
          tests=$?
          model=99
          if test "$tests" -eq 0; then
            PYTHONPATH=gamepulse/fusion python3 gamepulse/fusion/igp_full174_pasq_reference_date_audit_v1.py \
              --root . --source-index "$RUNNER_TEMP/history/nba-2025-26-source-index.json" \
              --historical-dir "$RUNNER_TEMP/history" --date-us 2026-11-12 \
              --output "$RUNNER_TEMP/output/reference.qa.json" --workers 4 \
              > "$RUNNER_TEMP/output/model.log" 2>&1
            model=$?
          fi
          set -e
          printf '{"tests":%s,"model":%s}\n' "$tests" "$model" > "$RUNNER_TEMP/output/status.json"
          if test "$tests" -eq 0 && test "$model" -eq 0; then
            echo FULL174_REFERENCE_CENSUS_SOURCE_QA_PASSED
          else
            echo FULL174_REFERENCE_CENSUS_FAILED_PRIVATE_DIAGNOSTICS
          fi
      - name: Save QA privately, with failure diagnostics if needed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,time,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'output';root.mkdir(exist_ok=True)
          state=json.loads((root/'status.json').read_text()) if (root/'status.json').exists() else {'setup_failed':True}
          ok=state.get('tests')==0 and state.get('model')==0 and (root/'reference.qa.json').exists()
          if ok:
              entries=[('qa.json',(root/'reference.qa.json').read_bytes())]
          else:
              detail={'status':'FAIL','source_commit':os.environ['SOURCE_COMMIT'],'returncodes':state}
              entries=[('failure.json',(json.dumps(detail,indent=2)+'\n').encode())]
              for name in ('tests.log','model.log'):
                  p=root/name
                  if p.exists(): entries.append((name,p.read_bytes()[-32000:]))
          for name,data in entries:
              path='gamepulse/fusion/qa/pasq_full174_reference_20261112_v1/'+name
              endpoint='repos/'+os.environ['PRIVATE_REPO']+'/contents/'+path
              payload={'branch':os.environ['SOURCE_BRANCH'],
                       'message':'qa(private): 12 Nov 2026 similar-shot reference '+name,
                       'content':base64.b64encode(data).decode()}
              for attempt in range(8):
                  get=subprocess.run(['gh','api',endpoint+'?ref='+os.environ['SOURCE_BRANCH']],
                                     capture_output=True,text=True)
                  current=dict(payload)
                  if get.returncode==0:current['sha']=json.loads(get.stdout)['sha']
                  post=subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],
                                      input=json.dumps(current),capture_output=True,text=True)
                  if post.returncode==0:break
                  time.sleep(attempt+1)
              else:raise RuntimeError('PRIVATE_REFERENCE_QA_WRITE_FAILED')
          print('FULL174_REFERENCE_QA_PRIVATE_RECEIPT_COMMITTED')
          if not ok:sys.exit(1)
          PY
