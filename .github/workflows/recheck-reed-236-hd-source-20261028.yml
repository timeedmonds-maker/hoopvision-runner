name: Recheck Reed Sheppard exact 720p shot video and alternate clips HLS
on:
  push:
    paths:
      - '.github/workflows/recheck-reed-236-hd-source-20261028.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recheck official video source at multiple cache keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os,base64,re,html,urllib.parse,time,datetime,random
          G='0022600125';P=1642263;E=236
          agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          H={'User-Agent':agent,'Referer':'https://www.nba.com/','Origin':'https://www.nba.com','Accept':'application/json, text/html, */*','Cache-Control':'no-cache','Pragma':'no-cache'}
          base=f'https://stats.gleague.nba.com/stats/shotqualityvideologs?GameID={G}&PlayerID={P}'
          o={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'game_id':G,'event':E,'player':P,'source_attempts':[]}
          for i in range(3):
            u=base+('&_='+str(int(time.time()*1000)+i) if i else '')
            a={'try':i+1}
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20) as r:
                data=json.load(r);a['http_status']=r.status
              rows=[x for x in data.get('shotList',[]) if int(x.get('eventNum') or 0)==E]
              a['matched_count']=len(rows)
              if rows:
                x=rows[0]
                a['media']={k:x.get(k) for k in ('guid','largeUrl','largeHls','mediumUrl','smallUrl','playListUrl','shotQuality')}
                a['player_source_count']=len(data.get('shotList',[]))
                a['other_player_shots_with_video']=sum(bool(v.get('largeUrl')) for v in data.get('shotList',[]))
                if x.get('largeUrl'):o['working_candidate']=x['largeUrl']
            except Exception as e:a['error']=type(e).__name__+': '+str(e)[:150]
            o['source_attempts'].append(a)
          urls=[
            ('multiangle',f'https://clips.nba.com/?gameNo={G}&eventNum={E}&source=grs'),
            ('xfg_detail',f'https://www.nba.com/inside-the-game/video-detail?GameID={G}&PlayerID={P}&eventNum={E}'),
            ('game_pbp',f'https://www.nba.com/game/atl-vs-hou-{G}/play-by-play?period=2')]
          for name,url in urls:
            a={'url':url}
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=20) as r:
                raw=r.read(3000000).decode('utf-8','replace');a['http_status']=r.status;a['bytes']=len(raw)
              a['hls_mentions']=raw.lower().count('.m3u8')
              a['nba_video_mentions']=raw.lower().count('videos.nba.com')
              a['unavailable_mentions']=raw.lower().count('video not available')
              a['actual_camera_labels']=[]
              if name=='multiangle':
                opts=[]
                for m in re.finditer(r'<option\s+value="([^"]+)"([^>]*)>(.*?)</option>',raw,re.I|re.S):
                  source=html.unescape(m.group(1));label=re.sub('<[^>]*>','',html.unescape(m.group(3))).strip()
                  if '.m3u8' in source:
                    opts.append({'label':label,'url':source})
                a['angle_count']=len(opts)
                a['actual_camera_labels']=[x['label'] for x in opts]
                if opts:o['working_candidate']=opts[0]['url']
                title=re.search(r'<title>(.*?)</title>',raw,re.I|re.S)
                a['title']=html.unescape(title.group(1)[:250]) if title else None
                # direct property extraction without storing raw HTML or signed HLS
                a['media_src_count']=len(re.findall(r'<(?:video|source)\b[^>]+(?:src|data-src)=',raw,re.I))
              elif name=='xfg_detail':
                a['has_next_data']='__NEXT_DATA__' in raw
                a['event_mentions']=raw.count('"eventNum":236')
            except Exception as e:a['error']=type(e).__name__+': '+str(e)[:160]
            o[name]=a
          # Confirm media signature if provider returned a URL.
          if o.get('working_candidate'):
            u=o['working_candidate']
            a={}
            try:
              h=dict(H);h['Range']='bytes=0-31'
              with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=15) as r:
                data=r.read(40);a={'http_status':r.status,'content_type':r.headers.get('content-type',''),'signature':data[:24].decode('latin-1','replace'),'bytes_checked':len(data)}
              a['is_mp4']=len(data)>=8 and data[4:8]==b'ftyp'
              a['is_hls']=data.startswith(b'#EXTM3U')
            except Exception as e:a={'error':type(e).__name__+': '+str(e)[:160]}
            o['media_probe']=a
            if not(a.get('is_mp4') or a.get('is_hls')):o.pop('working_candidate',None)
          api=f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/contents/reed_236_hd_refresh_check.json'
          gh={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          try:
            with urllib.request.urlopen(urllib.request.Request(api,headers=gh),timeout=12) as r:sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
            sha=None
          payload={'message':'Recheck exact Reed 236 NBA high definition xFG clip source, media availability','content':base64.b64encode(json.dumps(o,indent=2).encode()).decode()}
          if sha:payload['sha']=sha
          with urllib.request.urlopen(urllib.request.Request(api,headers=gh,data=json.dumps(payload).encode(),method='PUT'),timeout=20) as r:print('WRITE',r.status)
          print('RECHECK',json.dumps({'working':bool(o.get('working_candidate')),'camera_count':o.get('multiangle',{}).get('angle_count'),'source_tries':o['source_attempts']}))
          PY
