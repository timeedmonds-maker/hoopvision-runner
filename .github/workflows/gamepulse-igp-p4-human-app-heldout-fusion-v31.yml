name: IGP P4 human validated NBA app court projection heldout vs Fusion v3.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p4-human-app-heldout-fusion-v31.yml']
permissions: {contents: read}
concurrency:
  group: igp-p4-human-app-unchanged-viewport-fusion-v31
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 46e947b4b3082e549db099251f1144108f08f821
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confidentiality guard and pinned original NBA private source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Frozen human validated app player heldout vs source-only and IGP Fusion v3.1
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_p4_human_app_heldout_query_v1.py'
          if ! python3 gamepulse/fusion/igp_fusion_p4_human_app_heldout_query_v1.py --root . --output "$RUNNER_TEMP/human-app-private.json" > "$RUNNER_TEMP/human-app-private.log" 2>&1; then
            echo IGP_P4_ORIGINAL_HUMAN_APP_V31_INTEGRATION_FAILED
            python3 - <<'PY'
          import re,os
          from pathlib import Path
          ls=(Path(os.environ['RUNNER_TEMP'])/'human-app-private.log').read_text(errors='replace').splitlines()
          tail=next((x for x in reversed(ls) if x.strip()),'NO_LOG')
          print('IGP_P4_HUMAN_APP_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',tail)[:90])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'human-app-private.json').read_text())
          assert j['game_id']=='0022600138'
          assert j['engine_version']=='igp-fusion-v3.1-research'
          assert j['frozen_calibration_training_video_seconds']==[9,10]
          assert j['independent_of_fit_human_heldout_video_second']==11
          assert not j['original_camera_to_court_or_app_projection_refit']
          assert j['frozen_source_view_heldout_reference']['n']==7
          assert j['additional_10hz_rounding_offset_ms']==12
          assert j['original_SDK_app_markers_are_provider_correlated']
          assert j['new_accepted_tracking_positions']==0
          assert j['independent_broadcast_foot_XY_accuracy_p95_ft'] is None
          for k in ('IGP_Fusion_accepted_800','IGP_Fusion_research_1200'):
              x=j[k]
              assert x['eligible_human_identified_marker_count']==7
              assert 0<=x['model_matched_human_marker_count']<=7
              assert x['model_matched_human_marker_count']+x['model_abstained_markers']==7
          print('IGP_P4_REAL_HUMAN_VALIDATED_APP_V31',json.dumps({
             'heldout_human_app_markers':7,
             'accepted_matched':j['IGP_Fusion_accepted_800']['model_matched_human_marker_count'],
             'accepted_pixel_p95':j['IGP_Fusion_accepted_800']['p95_heldout_app_render_error_px'],
             'research_matched':j['IGP_Fusion_research_1200']['model_matched_human_marker_count'],
             'research_pixel_p95':j['IGP_Fusion_research_1200']['p95_heldout_app_render_error_px'],
             'original_direct_matched':j['original_direct_same_10hz_source']['model_matched_human_marker_count'],
             'camera_view_refit':False,'independent_physical_3D_accuracy':None},sort_keys=True))
          PY
      - name: Preserve exact original SHA human app frame QA only privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_p4_human_app_heldout_v31_result.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p4-human-app-same "origin/$BRANCH"
          cp "$RUNNER_TEMP/human-app-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): actual heldout human NBA app 7 player marker source vs integrated v3.1 original 800/P3 without view refit'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P4_HUMAN_APP_FUSION_V31_QA_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
