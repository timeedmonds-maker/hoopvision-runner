name: PR776 G4 SHA official roster and substitution context query 36
on:
  push:
    branches: [research/pr776-trusted-igp-runner-20261028]
    paths:
      - '.github/workflows/gamepulse-pr776-G4-official-context-query-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G4-private-official-context-query-36
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public source and obtain SHA private NBA data
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free G4 context regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g4_native_actor_possession_2026.py' -v
      - name: Private 36-game original G1 G2 G3 plus official candidate ten and substitution evidence query
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G4_official_context_substitution_36_v2.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g4_native_actor_possession_qa_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-G4-context-qa.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]));r=q['counts'];c=q['accepted_postings_counts']
          assert q['source_games']==36 and r['original_games_checked']==36
          assert r['G2_official_ten_period_substitution_query_readbacks']==36
          assert c['nba_original_source_frames']==1203986
          assert c['official_logical_NBA_chains']==7474
          assert c['g3_derived_player_entries']==285536
          assert c['g3_derived_ball_frames']==8504
          assert q['NBA_UTC_logical_chains_NOT_physical_ball_control_boundaries']
          print('G4_PRIVATE_OFFICIAL_CONTEXT_36_PASS',json.dumps({
            'games':36,'G2_context_readbacks':r['G2_official_ten_period_substitution_query_readbacks'],
            'source_frames':c['nba_original_source_frames'],
            'logical_chains':c['official_logical_NBA_chains']},sort_keys=True))
          PY
      - name: Commit private G4 official context query acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          git config user.name "Game Pulse G4 Private Context QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261028/igp_G4_official_context_substitution_36_v2.json
          git diff --cached --check
          git commit -qm "qa(gamepulse): verify G4 official ten period and G2 substitution context across 36 games"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo G4_OFFICIAL_CONTEXT_PRIVATE_QA_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
