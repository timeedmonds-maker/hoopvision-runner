name: Amen732 six original versus reacquired video SHA identity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-original-vs-reacquired-source-sha.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - name: Compare immutable private archive six-video MP4 SHA with reacquired six-camera input
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          mkdir -p "$ROOT/archived" "$ROOT/new"
          gh release download freeview-native-0022600009-732 \
            --repo timeedmonds-maker/104 --dir "$ROOT/archived" --pattern source_manifest.json
          gh release download freeview-amen732-sixview-original-contact-consensus-20261028 \
            --repo timeedmonds-maker/104 --dir "$ROOT/new" --pattern amen732-sixview-native-exact-frame-package-v2.json
          python3 - "$ROOT/archived/source_manifest.json" "$ROOT/new/amen732-sixview-native-exact-frame-package-v2.json" <<'PY'
          import json,sys
          old=json.load(open(sys.argv[1]));new=json.load(open(sys.argv[2]))
          assert old['event']['game_id']=='0022600009' and old['event']['event_num']==732
          assert new['game_id']=='0022600009' and new['event_num']==732
          archived={r['label']:r['native_media_sha256'] for r in old['feeds']}
          current={r['camera']:r['original_video_sha256'] for r in new['before_after']}
          assert len(current)==6 and all(len(v)==64 for v in current.values())
          matching=[label for label in current if archived.get(label)==current[label]]
          print('AMEN732_ORIGINAL_VERSUS_REACQUIRED_VIDEO_HASHES_MATCH',len(matching),'of',len(current))
          for label in current:
            print('SOURCE_VIDEO_IDENTITY',label.replace(' ','_'),
                  'same_archived_sha',archived.get(label)==current[label])
          print('REQUIRED_SIX_FRAME_SOURCE_IDENTITY_ACCEPTANCE',
                len(matching)==6)
          print('CONTACT_STILL_UNCERTIFIED',not new['first_hand_ball_touch_certified'])
          PY
