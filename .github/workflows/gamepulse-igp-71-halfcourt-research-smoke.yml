name: IGP 71 halfcourt v3.1 new-source validation
# Reviewed private-only original source and NBA PBP; public aggregate counts only.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-71-halfcourt-research-smoke.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-71-halfcourt-new-source
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public data boundary
        run: python3 tools/public_content_guard.py
      - name: Evaluate 3 appended games both teams using original SDK and official PBP
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p test_igp_halfcourt_touch_query_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from igp_71_halfcourt_touch_query_v1 import read_official_roster,run
          root=Path('.')
          games=('0022600144','0022600145','0022600146')
          results={}
          counts={'games':0,'team_game_evaluations':0,'eligible_touch_records':0,'abstained_score_chronology':0}
          for gid in games:
              meta,_,grade=read_official_roster(root,gid)
              for team in (meta['home'],meta['away']):
                  result=run(root,[gid],team=team,zone='paint',source_cohort=71)
                  if result['certified_physical_possessions']!=0:
                      raise ValueError('RESEARCH_TOUCH_WRONGLY_PROMOTED_TO_PHYSICAL')
                  qa=result['source_qa_by_game'][gid]
                  out={'game_id':gid,'team':team,'roster_grade':grade,
                       'status':qa['status'],'source_frames':qa['source_frames'],
                       'logical_chains':qa['logical_chains'],'eligible_rows':qa['eligible_rows'],
                       'counts':qa['counts'],'score_chronology':qa['score_chronology'],
                       'physically_certified_touches':0}
                  results[gid+'_'+team]=out
                  counts['team_game_evaluations']+=1
                  counts['eligible_touch_records']+=len(result['matched_possessions'])
                  counts['abstained_score_chronology']+=qa['status'].startswith('ABSTAIN_')
                  print('IGP71_NEW3_HALFCOURT_TEAM_QA',gid,team,qa['status'],qa['eligible_rows'],flush=True)
              counts['games']+=1
          assert counts['games']==3 and counts['team_game_evaluations']==6
          report={'schema':'igp.71-new3-original-sha-source-graded-halfcourt-touch-research.v1',
                  'population_games':71,'evaluated_games':3,'counts':counts,'by_team_game':results,
                  'source_original_XYZ_unchanged':True,
                  'provisional_contact_not_physical_possession_certified':True,
                  'clinical_or_video_independent_accuracy':None}
          path=root/'gamepulse/fusion/qa/igp_progress_20261031/igp_71_new3_halfcourt_touch_source_qa_v1.json'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('IGP71_NEW3_HALFCOURT_AGGREGATE',json.dumps(counts,sort_keys=True))
          PY
      - name: Commit source-graded candidate QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261031/igp_71_new3_halfcourt_touch_source_qa_v1.json
          git diff --cached --check
          if git diff --cached --quiet;then echo IGP71_HALFCOURT_QA_CURRENT;exit 0;fi
          git commit -q -m 'qa(igp): new3 both-team original-PBP v3.1 halfcourt touch source graded research'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo IGP71_HALFCOURT_PRIVATE_QA_COMMITTED;exit 0;fi
            sleep "$attempt"
          done
          exit 25
