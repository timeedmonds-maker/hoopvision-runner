name: PR776 official 36-game candidate possession backbone
# Reviewed private NBA PBP only; no private XYZ, player-level outputs or public artifacts.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-physical-nba-candidate-36.yml']
permissions: {contents: read}
concurrency:
  group: pr776-physical-nba-candidate-36
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard runner and retrieve private canonical NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/pbp-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/pbp-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/pbp-askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Test, build and SHA-check source-supported official candidate chains
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_official_physical_possession_candidates_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_official_physical_possession_candidates_2026.py'
          OUT=gamepulse/fusion/materialized/igp_official_possession_candidates_36_v1
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_official_physical_possession_candidates_2026.py --root . --out-dir "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          out=Path(sys.argv[1])
          idx=json.loads((out/"index.json").read_text())
          assert idx['game_count']==36
          assert len(idx['games'])==36
          assert idx['counts']['official_nba_pbp_action_rows']==22314
          assert idx['physical_possessions_certified']==0
          n=0
          for gid,row in idx['games'].items():
              raw=(out/row['path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              game=json.loads(raw)
              assert game['physical_possessions_certified']==0
              assert all(c['native_tracking_frames_assigned']==0 and c['physical_possessions_certified']==0 for c in game['candidate_chains'])
              n+=len(game['candidate_chains'])
          assert n==idx['counts']['official_event_chain_candidates']
          print('IGP_NBA_36_OFFICIAL_CANDIDATES_SHA_ACCEPTED',json.dumps({
              'games':36,'official_events':22314,'candidate_chains':n,
              'physical_possessions_certified':0},sort_keys=True))
          PY
      - name: Publish candidate backbone in private PR776 only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT=gamepulse/fusion/materialized/igp_official_possession_candidates_36_v1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 37
          git commit -q -m "data(igp): publish SHA-checked 36 NBA possession candidate chain backbone"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_36_NBA_OFFICIAL_CANDIDATES_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 13
