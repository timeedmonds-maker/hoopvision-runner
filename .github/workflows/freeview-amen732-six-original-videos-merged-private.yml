name: Amen732 six complete original videos private UHD merge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-six-original-videos-merged-private.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amen732-six-full-video-uhd-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce private media boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          # PAT primary REST quota is shared with many concurrent project workers.
          # Read the non-counting rate_limit endpoint; never print or expose credentials.
          if ! gh api repos/timeedmonds-maker/104 --jq .private > "$RUNNER_TEMP/private-status" 2>/dev/null; then
            gh api rate_limit > "$RUNNER_TEMP/private-quota.json"
            python3 - "$RUNNER_TEMP/private-quota.json" <<'PY'
          import json,sys,time
          q=json.load(open(sys.argv[1]))["resources"]["core"]
          wait=max(0,int(q["reset"])-int(time.time())+7)
          print("PRIVATE_API_QUOTA_REMAINING",q["remaining"],"RESET_WAIT_SECONDS",wait,flush=True)
          assert q["remaining"]==0 and wait<2100,"PRIVATE_API_AUTH_OR_QUOTA_BLOCKER"
          time.sleep(wait)
          PY
            gh api repos/timeedmonds-maker/104 --jq .private > "$RUNNER_TEMP/private-status"
          fi
          test "$(cat "$RUNNER_TEMP/private-status")" = true
          echo PRIVATE_SOURCE_API_READY
      - name: Recover SIX complete source-original videos and pinned merger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/multicam/input" "$RUNNER_TEMP/multicam/output"
          ROOT="$RUNNER_TEMP/multicam/input"
          gh release download freeview-native-0022600009-732 \
            --repo timeedmonds-maker/104 --dir "$ROOT" \
            --pattern '0022600009-e732-*.mp4' \
            --pattern 'source_manifest.json' \
            --pattern 'native_presentation_timestamps.json' >/dev/null
          test "$(find "$ROOT" -maxdepth 1 -name '0022600009-e732-*.mp4' | wc -l)" -eq 6
          gh api "repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_merge_six_original_videos_uhd.py?ref=b8c00eb7a715cc2607169d307341738bb70777c2" \
            --jq .content | base64 -d > "$RUNNER_TEMP/multicam/worker.py"
          python3 -m py_compile "$RUNNER_TEMP/multicam/worker.py"
          python3 - "$ROOT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); manifest=json.loads((root/"source_manifest.json").read_text())
          valid=[]
          for f in manifest["feeds"]:
              p=root/f["file"]
              if p.is_file():
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==f["native_media_sha256"]
                  valid.append(f["label"])
          assert len(valid)==6,valid
          print("ORIGINAL_NBA_ALL_SIX_FULL_VIDEO_HASHES_PASS",len(valid))
          PY
      - name: Install native video decoding and encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' 'opencv-python-headless==4.10.0.84'
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Join all six native camera feeds on one relative action timeline
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/multicam/worker.py" \
            --source "$RUNNER_TEMP/multicam/input" \
            --out "$RUNNER_TEMP/multicam/output"
          VIDEO="$RUNNER_TEMP/multicam/output/amen732-six-native-videos-merged-3840x2160.mp4"
          test -s "$VIDEO"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames \
            -of json "$VIDEO" > "$RUNNER_TEMP/multicam/probe.json"
          python3 - "$RUNNER_TEMP/multicam/output" "$RUNNER_TEMP/multicam/probe.json" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); qa=json.loads((root/"amen732-six-native-videos-merged-qa.json").read_text())
          probe=json.load(open(sys.argv[2]))["streams"][0]
          assert (probe["width"],probe["height"])==(3840,2160)
          assert qa["input_original_sha_verified_videos"]==6
          assert int(probe["nb_frames"])==qa["output_frames"]
          assert not qa["true_virtual_camera_motion"]
          print("SIX_REAL_VIDEO_FEEDS_MERGED_UHD_PASS",qa["output_frames"])
          PY
      - name: Deliver UHD merge and QA to PRIVATE 104 release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/multicam/output"
          TAG=freeview-amen732-six-native-videos-merged-uhd-20261028
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title 'Amen Wemby block - six native original feeds merged UHD' \
              --notes 'Video synchronization preview. Provisional action seeds; not 3D novel view or certified hand-ball contact.' \
              --latest=false >/dev/null
          fi
          gh release upload "$TAG" "$ROOT"/* --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$RUNNER_TEMP/multicam/release.json"
          python3 - "$ROOT" "$RUNNER_TEMP/multicam/release.json" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          assets={a["name"]:a for a in json.load(open(sys.argv[2]))["assets"]}
          for p in Path(sys.argv[1]).iterdir():
              assert assets[p.name]["digest"]=="sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(),p.name
          print("SIX_FULL_VIDEO_UHD_PRIVATE_SHA_READBACK_PASS")
          PY
