name: Amen732 private source direct download alternative
on:
  push:
    branches: [research/freeview-amen732-private-source-direct-20261028]
    paths: ['.github/workflows/freeview-amen732-six-original-videos-merged-private.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check REST-free private release download using real source credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          URL='https://github.com/timeedmonds-maker/104/releases/download/freeview-native-0022600009-732/0022600009-e732-broadcast.mp4'
          OUT="$RUNNER_TEMP/amen732-broadcast-test.mp4"
          STATUS="$(curl -L --silent --show-error --max-time 50 \
            -H "Authorization: Bearer $GH_TOKEN" \
            --output "$OUT" --write-out '%{http_code}' "$URL" || true)"
          echo "SOURCE_DIRECT_HTTP_STATUS=$STATUS"
          if [ "$STATUS" = 200 ] && [ "$(stat -c '%s' "$OUT")" -gt 1000000 ]; then
            echo "PRIVATE_FULL_VIDEO_DIRECT_FETCH_PASS"
          else
            echo "PRIVATE_FULL_VIDEO_DIRECT_FETCH_UNAVAILABLE"
          fi
          # GraphQL search is a separate rate bucket from the saturated core REST API.
          QUERY='query { repository(owner:"timeedmonds-maker",name:"104") { release(tagName:"freeview-native-0022600009-732") { releaseAssets(first:15) { nodes { name downloadUrl } } } } }'
          if gh api graphql -f query="$QUERY" --jq '.data.repository.release.releaseAssets.nodes | length' >/dev/null 2>&1; then
            echo "PRIVATE_GRAPHQL_RELEASE_ASSETS_AVAILABLE"
          else
            echo "PRIVATE_GRAPHQL_RELEASE_ASSETS_UNAVAILABLE"
          fi
