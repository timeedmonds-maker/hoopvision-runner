name: Clip Lab event80 native-origin-and-unit floor diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-event80-direct-native-frozen.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event80-frozen-native-private-evidence-reuse
  cancel-in-progress: false
jobs:
  saved_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public private-source boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-event80-direct-native-frozen.yml'])
          PY
          test -n "$GH_TOKEN"
      - name: Obtain original frozen tracks and Game Pulse from PRIVATE canonical release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/clip-lab-private"
          mkdir -p "$ROOT"
          for FILE in native.json physical_paths.csv court_frames.json tracks.csv; do
            gh release download clip-lab-hls-0022600009-80 \
              --repo timeedmonds-maker/104 --pattern "$FILE" --dir "$ROOT"
            test -s "$ROOT/$FILE"
          done
          echo 'ae045c4bd7308837fd0d322686215a1c85d9dd368ac083341225dabc599a2ea8  '"$ROOT/native.json" | sha256sum -c
          echo '03a86bc232b83a1fd946d80330352cf8e446864b285c9617a988718af9586d97  '"$ROOT/physical_paths.csv" | sha256sum -c
          echo '079f070b013da345bd2fc24ab5e1f1042a7fd1eed0a1e015a3a82af612d87bcf  '"$ROOT/court_frames.json" | sha256sum -c
          echo 'b79aed523851aa7c480455d9b47ef134fa3bc09dc22e538ac14157b492c6466e  '"$ROOT/tracks.csv" | sha256sum -c
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone -q \
            --depth 1 --filter=blob:none --sparse --branch main \
            https://github.com/timeedmonds-maker/104.git "$ROOT/canonical"
          git -C "$ROOT/canonical" -c "http.extraheader=AUTHORIZATION: basic $AUTH" sparse-checkout set gamepulse/clip_lab >/dev/null
          unset AUTH
          python3 -m pip install --quiet numpy==1.26.4
          python3 -m py_compile "$ROOT/canonical/gamepulse/clip_lab/shot_window_native_diagnostic.py" \
            "$ROOT/canonical/gamepulse/clip_lab/frozen_v31_gamepulse_bridge.py"
          echo SOURCE_SHA_AND_PRIVATE_FROZEN_EVIDENCE_VERIFIED
      - name: Test independent units and clock offsets on first nine seconds
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/clip-lab-private"
          python3 "$ROOT/canonical/gamepulse/clip_lab/shot_window_native_diagnostic.py" \
            --native "$ROOT/native.json" --physical "$ROOT/physical_paths.csv" \
            --courts "$ROOT/court_frames.json" \
            --event-video-s 6.5 --end-s 9.0 \
            --out "$ROOT/shot-window-diagnostic.json"
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          q=json.loads((Path(sys.argv[1])/'shot-window-diagnostic.json').read_text())
          assert q['screen_feet_source']=='ORIGINAL_FROZEN_V31_TRACKER'
          assert q['render_authorized'] is False
          print('FROZEN_SHOT_DIAGNOSTIC_REPORT_ONLY',len(q['best']), 'UNIT_ORIGIN_GROUPS',len(q['basis_max_coverage']))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: event80-frozen-nba-pulse-aggregate-diagnostic
          path: ${{ runner.temp }}/clip-lab-private/shot-window-diagnostic.json
          if-no-files-found: error
          retention-days: 2
