name: Clip Lab frozen v3.1 original NBA Durant-exclusion tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-event80-direct-native-frozen.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event80-frozen-native-private-evidence-reuse
  cancel-in-progress: false
jobs:
  saved_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public private-source boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-event80-direct-native-frozen.yml'])
          PY
          test -n "$GH_TOKEN"
      - name: Obtain original frozen tracks and Game Pulse from PRIVATE canonical release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/clip-lab-private"
          mkdir -p "$ROOT"
          for FILE in native.json physical_paths.csv court_frames.json tracks.csv; do
            gh release download clip-lab-hls-0022600009-80 \
              --repo timeedmonds-maker/104 --pattern "$FILE" --dir "$ROOT"
            test -s "$ROOT/$FILE"
          done
          echo 'ae045c4bd7308837fd0d322686215a1c85d9dd368ac083341225dabc599a2ea8  '"$ROOT/native.json" | sha256sum -c
          echo '03a86bc232b83a1fd946d80330352cf8e446864b285c9617a988718af9586d97  '"$ROOT/physical_paths.csv" | sha256sum -c
          echo '079f070b013da345bd2fc24ab5e1f1042a7fd1eed0a1e015a3a82af612d87bcf  '"$ROOT/court_frames.json" | sha256sum -c
          echo 'b79aed523851aa7c480455d9b47ef134fa3bc09dc22e538ac14157b492c6466e  '"$ROOT/tracks.csv" | sha256sum -c
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone -q \
            --depth 1 --filter=blob:none --sparse --branch main \
            https://github.com/timeedmonds-maker/104.git "$ROOT/canonical"
          git -C "$ROOT/canonical" -c "http.extraheader=AUTHORIZATION: basic $AUTH" sparse-checkout set gamepulse/clip_lab >/dev/null
          unset AUTH
          python3 -m pip install --quiet numpy==1.26.4
          python3 -m py_compile "$ROOT/canonical/gamepulse/clip_lab/shot_window_native_diagnostic.py" \
            "$ROOT/canonical/gamepulse/clip_lab/frozen_v31_gamepulse_bridge.py"
          echo SOURCE_SHA_AND_PRIVATE_FROZEN_EVIDENCE_VERIFIED
      - name: Verify independent 3-player Game Pulse against both original SDK captures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/clip-lab-private"
          cd "$ROOT/canonical/gamepulse/clip_lab"
          python3 -m py_compile event80_green_possession.py verified_three_player_source.py independent_durant_render_gate.py event80_frozen_delivery.py
          python3 -m py_compile guard_adams_not_durant.py test_guard_adams_not_durant.py
          python3 -m unittest -v test_guard_adams_not_durant.py
          python3 event80_green_possession.py \
            --native-q1 "$ROOT/canonical/gamepulse/clip_lab/positions/0022600009_q1_durant_adams.json" \
            --out "$ROOT/fred-native-frozen-green-interval.json"
          python3 verified_three_player_source.py \
            --event80 "$ROOT/native.json" \
            --q1 "$ROOT/canonical/gamepulse/clip_lab/positions/0022600009_q1_durant_adams.json" \
            --merged "$ROOT/three-player-native-private.json" \
            --qa "$ROOT/three-player-crosscheck.json"
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          q=json.loads((p/'three-player-crosscheck.json').read_text())
          g=json.loads((p/'fred-native-frozen-green-interval.json').read_text())
          assert q['joined_utc_frames']>=25 and q['render_authorized'] is False
          assert g['possession_intervals'][0]['player_id']==1627832
          assert 6.2<=g['possession_intervals'][0]['end_s']<=6.8
          print('ORIGINAL_FROZEN_GREEN_AND_DURANT_EXCLUSION_EVIDENCE_ACCEPTED',
                q['median_original_adams_source_disagreement_cm'],
                g['possession_intervals'][0]['end_s'])
          PY
      - name: Reject Adams-to-Durant track swaps using native three-player negative evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/clip-lab-private"
          (cd "$ROOT/canonical/gamepulse/clip_lab" && python3 -m unittest -v test_independent_durant_render_gate.py)
          python3 "$ROOT/canonical/gamepulse/clip_lab/three_player_durant_exclusion.py" \
            --native "$ROOT/three-player-native-private.json" \
            --physical "$ROOT/physical_paths.csv" \
            --courts "$ROOT/court_frames.json" \
            --end-s 9.0 --out "$ROOT/three-player-negative-qa.json"
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          q=json.loads((root/'three-player-negative-qa.json').read_text())
          assert q['render_authorized'] is False
          assert q['physical_track_identity_certified'] is False
          assert q['native_to_screen_ring_projection_allowed'] is False
          assert q['negative_player']==201142
          assert q['target_players']==[1627832,203500]
          assert q['clock_orient_hypotheses']>5
          print('DURANT_EXCLUSION_ORIGINAL_FROZEN_DIAGNOSTIC',
                q['maximum_durant_exclusion_coverage'],
                q['maximum_pair_coverage'],q['sampled_buckets'])
          PY
      - name: Persist SHA-backed three-player native and frozen possession input privately
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/clip-lab-private"
          gh release upload clip-lab-hls-0022600009-80 \
            "$ROOT/three-player-native-private.json#event80-three-player-original-gamepulse.json" \
            "$ROOT/fred-native-frozen-green-interval.json#event80-fred-native-v31-green.json" \
            --repo timeedmonds-maker/104 --clobber
          echo THREE_PLAYER_DURANT_EXCLUSION_NATIVE_AND_FROZEN_GREEN_INPUT_PRIVATE
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: event80-frozen-three-player-native-possession-qa
          path: |
            ${{ runner.temp }}/clip-lab-private/fred-native-frozen-green-interval.json
            ${{ runner.temp }}/clip-lab-private/three-player-crosscheck.json
            ${{ runner.temp }}/clip-lab-private/three-player-negative-qa.json
          if-no-files-found: error
          retention-days: 2
