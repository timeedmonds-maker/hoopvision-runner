# V5B private original source keyframes linked to official PBP logged UTC
# chain intervals uniquely. Never certify physical possession or print XYZ.
name: IGP 3.2 V5B 54 original native to official NBA PBP chain links
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-v5b-native-to-official-pbp-54.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-v5b-original-native-official-PBP
  cancel-in-progress: false
jobs:
  private-original-source-to-official-PBP:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard private original source and synthetic PBP ownership tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_v5b_original_native_logical_chain_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_v5b_original_native_logical_chain_v1.py'
          echo IGP_V5B_UNIQUE_OFFICIAL_LOGICAL_CHAIN_AND_ENDPOINT_TESTS_PASS
      - name: Build all 54 SHA-native postings to official NBA PBP chain partitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_v5b_original_native_logical_chain_v1.py \
            --root . --build >"$RUNNER_TEMP/v5b-private.log" 2>&1 || {
              echo V5B_NATIVE_OFFICIAL_PBP_54_SHA_OR_OWNERSHIP_GATE_FAILED
              python3 - <<'PY'
          import re,os
          from pathlib import Path
          a=(Path(os.environ['RUNNER_TEMP'])/'v5b-private.log').read_text(errors='replace').splitlines()
          z=next((x for x in reversed(a) if re.match(
             r'^(?:ValueError|KeyError|TypeError|AssertionError|IndexError|ImportError):',x)),None)
          print('V5B_PRIVATE_FAIL_CLASS',re.sub(r'[0-9]{4,}','[ID]',z or 'UNKNOWN')[:180])
          PY
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from igp_v32_v5b_original_native_logical_chain_v1 import DIR,query,canonical
          root=Path('.')
          index=json.loads((root/DIR/'index.json').read_bytes())
          a=index['counts']
          assert index['games']==54 and len(index['parts'])==54
          assert a['original_source_native_frames']==39996
          assert (a.get('unambiguous_source_native_within_PBP_UTC',0)+
                  a.get('ambiguous_multiple_PBP_chains_unassigned',0)+
                  a.get('no_measurable_PBP_logged_chain_unassigned',0))==39996
          assert index['new_accepted_10hz_scenes']==0
          assert index['physical_possession_boundaries_certified']==0
          assert index['no_ambiguous_NBA_PBP_ownership_promoted']
          verified=0;sha_bound=0
          for gid in index['parts']:
              part=json.loads((root/DIR/(gid+'.json')).read_bytes())
              links=part['linked_chains']
              sha_bound+=1
              for chain in links[:1]:
                  q=query(root,gid,chain['chain_id'],limit=1,positions=True)
                  assert q['source_native_total']>=1 and q['returned']==1
                  assert q['rows'][0]['original_native_xyz'] is not None
                  assert not q['independently_video_certified_physical_custody']
                  verified+=1
          assert sha_bound==54 and verified>=40
          receipt={'schema':'igp.v32.v5b.54game.original-native-PBP-logical-chain-readback-QA.v1',
            'games':54,'source_original_native_frames':39996,
            'unique_original_native_PBP_UTC_links':a.get('unambiguous_source_native_within_PBP_UTC',0),
            'ambiguous_multiple_PBP_logical_intervals_unassigned':a.get('ambiguous_multiple_PBP_chains_unassigned',0),
            'native_outside_measurable_PBP_intervals':a.get('no_measurable_PBP_logged_chain_unassigned',0),
            'source_original_official_ten_ball_links':a.get('linked_original_exact_official_ten_ball',0),
            'NBA_official_PBP_chains_with_extra_original_native':a.get('chains_with_original_native_links',0),
            'readback_real_original_XYZ_chain_queries':verified,
            'V5B_partitions_source_SHA_checked':sha_bound,
            'source_V5_index_sha256':index['source_V5_sha256'],
            'source_NBA_PBP_V4_index_sha256':index['source_official_PBP_V4_sha256'],
            'new_accepted_10hz_scenes':0,'independently_physical_custody_certified':0,
            'original_XYZ_or_NBA_PBP_mutated':False}
          (Path(os.environ['RUNNER_TEMP'])/'v5b-receipt.json').write_bytes(canonical(receipt))
          print('IGP_V5B_ORIGINAL_NATIVE_PBP_LINKED_ACCEPTED',json.dumps({
             'games':54,'source_frames':39996,
             'unique_logical_chain_linked_source_native':receipt['unique_original_native_PBP_UTC_links'],
             'independent_original_XYZ_readbacks':verified,
             'physical_possessions_certified':0},sort_keys=True))
          PY
      - name: Commit original provenance links and readback receipt to private canonical 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_v32/igp_v32_v5b_native_to_PBP_logical_chain_54_readback_v1.json
          mkdir -p "$(dirname "$receipt")"
          cp "$RUNNER_TEMP/v5b-receipt.json" "$receipt"
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/materialized/igp_v32_v5b_original_native_PBP_logical_chain_links_v1 "$receipt"
          git diff --cached --check
          git commit -q -m 'data(igp): 54game SHA-original native outside-S1 to NBA logical PBP chain UTC links'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_V5B_PRIVATE_SHA_NATIVE_PBP_CHAIN_LINKS_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
