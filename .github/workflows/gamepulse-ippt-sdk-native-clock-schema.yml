name: IPPT SHA original Game Pulse SDK native gameclock metadata existence diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-sdk-native-clock-schema.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  native-sdk-clock-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: 983314ce07a1fb8f168096e0ea8309e383f3b1bb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original SDK content privacy guard and exact private code SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free SDK time schema key whitelist and nonleakage tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_original_sdk_gameclock_schema_probe_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_original_sdk_gameclock_schema_probe_2026.py
      - name: Two real NBA game SHA original SDK release archive clock-field existence scan
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          for game in 0022600009 0022600092; do
            mkdir -p "$RUNNER_TEMP/source-$game"
            gh release download "gamepulse-sdk-$game" --repo timeedmonds-maker/104 \
               --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/source-$game"
            python3 -u gamepulse/fusion/igp_ippt_original_sdk_gameclock_schema_probe_2026.py \
               --root . --game-id "$game" --archive-dir "$RUNNER_TEMP/source-$game" \
               | tee -a "$RUNNER_TEMP/ippt_clock_fields_aggregates.log"
            rm -rf "$RUNNER_TEMP/source-$game"
          done
          echo "IPPT_ORIGINAL_NBA_RAW_SDK_CLOCK_METADATA_ONLY_TWO_GAME_PASS"
      - name: Public receipt of sanitized metadata field counts only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"ippt_clock_fields_aggregates.log"
          report={"github_run_id":os.environ["GITHUB_RUN_ID"],
                  "prior_job_status":os.environ["QA_JOB_RESULT"],
                  "private_code_expected_sha":"983314ce07a1fb8f168096e0ea8309e383f3b1bb"}
          if path.exists():
            vals=[json.loads(line.partition(" ")[2])
                 for line in path.read_text().splitlines()
                 if line.startswith("IPPT_NBA_ORIGINAL_SDK_CLOCK_FIELD_SCHEMA_ONLY ")]
            report["game_aggregate_counts"]=[
                {"game_id":v["game_id"],"counts":v["counts"],
                "original_archives_SHA_verified":v["original_archives_SHA_verified"]}
                 for v in vals]
          (Path(os.environ["RUNNER_TEMP"])/"ippt_clock_metadata_receipt.md").write_text(
             "Metadata keys COUNT only; no actual gameclock, UTC, player/ball XYZ or private archive contents.\n\n~~~json\n"+
             json.dumps(report,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          gh issue comment 127 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_clock_metadata_receipt.md"

# Never expose original licensed SDK actor values, native timestamps, per-shot locations, or private asset URLs.
