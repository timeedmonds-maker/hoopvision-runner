name: NBA Blueprint 14-game source backfill
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-blueprint-14-backfill.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/public_content_guard.py
