name: Read Failed Toronto Local Evidence
# diagnostic-trigger: continuity-and-action-evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-failed-local.yml'
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-southeast1-c
  INSTANCE: hv-dev-l4
  RUN_ID: public-35500155486-1-9091f1475b0c
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read continuity and action evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/srv/hoopvision/runs/$RUN_ID/artifacts"
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="
            set -e
            echo '=== CONTINUITY HEADER ==='
            sudo head -1 '$ROOT/sam31/continuity_groups.csv'
            echo '=== CONTINUITY KEY SEGMENTS ==='
            sudo awk -F, 'NR==1 || \$1==3 || \$1==4 || \$1==6 || \$1==7 || \$1==8 || \$1==121 || \$1==148' '$ROOT/sam31/continuity_groups.csv'
            echo '=== SOURCE TRACK 0 SEGMENTS ==='
            sudo awk -F, 'NR==1 || \$2==0' '$ROOT/identity_segments/segments.csv' | head -50
            echo '=== SOURCE TRACK 8 SEGMENTS ==='
            sudo awk -F, 'NR==1 || \$2==8' '$ROOT/identity_segments/segments.csv' | head -50
            echo '=== ACTION ASSOCIATIONS HEADER ==='
            sudo head -1 '$ROOT/semantic_anchors.associations.csv'
            echo '=== ACTION SOURCE 8/16 ==='
            sudo awk -F, 'NR==1 || \$3==8 || \$3==16' '$ROOT/semantic_anchors.associations.csv'
            echo '=== ADAMS/REED 8-10 ==='
            sudo awk -F, 'NR==1 || ((\$1>=8 && \$1<=10) && (\$3==203500 || \$3==1642263))' '$ROOT/global_identity/identity_assignments.csv'
          "
