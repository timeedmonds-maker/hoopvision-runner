name: Read Failed Toronto Local Evidence
# diagnostic-trigger: identity-neighborhoods-grep
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-failed-local.yml'
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-southeast1-c
  INSTANCE: hv-dev-l4
  RUN_ID: public-35500155486-1-9091f1475b0c
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read compact identity neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/srv/hoopvision/runs/$RUN_ID/artifacts"
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="
            set -e
            echo '=== TRACKS HEADER ==='
            sudo head -1 '$ROOT/nextgen_mask/tracks.csv'
            echo '=== TRACKS 9.3038 ==='
            sudo grep '9.3038' '$ROOT/nextgen_mask/tracks.csv' || true
            echo '=== OBS HEADER ==='
            sudo head -1 '$ROOT/identity_segments/uniform_observations.csv'
            echo '=== OBS 9.3038 ==='
            sudo grep '9.3038' '$ROOT/identity_segments/uniform_observations.csv' || true
            echo '=== ASSIGN HEADER ==='
            sudo head -1 '$ROOT/global_identity/identity_assignments.csv'
            echo '=== ASSIGN 9.3038 ==='
            sudo grep '^9.3038,' '$ROOT/global_identity/identity_assignments.csv' || true
            echo '=== SEGMENTS HEADER ==='
            sudo head -1 '$ROOT/identity_segments/segments.csv'
            echo '=== SEGMENT 148 ==='
            sudo grep '^148,' '$ROOT/identity_segments/segments.csv' || true
            echo '=== ASSIGN NEAR 11.9 ==='
            sudo grep -E '^11\\.(80|83|87|90|93|97|99|10|13|17|20)[0-9]*,' '$ROOT/global_identity/identity_assignments.csv' || true
            echo '=== DICK ASSIGNMENTS TAIL ==='
            sudo grep ',1641711,' '$ROOT/global_identity/identity_assignments.csv' | tail -80 || true
          "
