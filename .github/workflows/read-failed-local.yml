name: Read Failed Toronto Local Evidence
# diagnostic-trigger: identity-neighborhoods-stdlib
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-failed-local.yml'
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-southeast1-c
  INSTANCE: hv-dev-l4
  RUN_ID: public-35500155486-1-9091f1475b0c
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read compact identity neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/srv/hoopvision/runs/$RUN_ID/artifacts"
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="sudo ROOT='$ROOT' python3 - <<'PY'
import csv, os, json
R=os.environ['ROOT']
def rows(path):
    with open(path,newline='') as f: return list(csv.DictReader(f))
def ff(v):
    try:return float(v)
    except:return 0.0
def show(title, data, fields=None):
    print('=== '+title+' ===')
    for r in data:
        if fields: print({k:r.get(k) for k in fields})
        else: print(r)
tr=rows(R+'/nextgen_mask/tracks.csv')
ob=rows(R+'/identity_segments/uniform_observations.csv')
sg=rows(R+'/identity_segments/segments.csv')
ass=rows(R+'/global_identity/identity_assignments.csv')
show('TRACKS 9.3038',[r for r in tr if abs(ff(r['time_s'])-9.3038)<0.02],['time_s','track_id','x1','y1','x2','y2','conf'])
show('OBS 9.3038',[r for r in ob if abs(ff(r['time_s'])-9.3038)<0.02],['time_s','source_track_id','raw_source_track_id','identity_segment_id','x1','y1','x2','y2','conf','uniform_cluster','cluster_conf','ambiguous'])
show('ASSIGN 9.3038',[r for r in ass if abs(ff(r['time_s'])-9.3038)<0.02],['time_s','player_id','player_name','source_track_id','raw_source_track_id','identity_segment_id','x1','y1','x2','y2','global_margin','safe','direct_ocr','jersey_support','ambiguous'])
show('SEGMENT 148',[r for r in sg if int(float(r['segment_id']))==148])
show('ASSIGN 11.9064',[r for r in ass if abs(ff(r['time_s'])-11.9064)<0.12],['time_s','player_id','player_name','source_track_id','raw_source_track_id','identity_segment_id','x1','y1','x2','y2','global_margin','safe','direct_ocr','jersey_support','ambiguous'])
show('DICK WINDOW',[r for r in ass if int(float(r['player_id']))==1641711 and 10.8<=ff(r['time_s'])<=12.8],['time_s','source_track_id','raw_source_track_id','identity_segment_id','x1','y1','x2','y2','global_margin','safe','direct_ocr','jersey_support','ambiguous'])
PY"
