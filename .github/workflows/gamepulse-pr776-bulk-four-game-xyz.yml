name: PR776 original four-game XYZ concurrency-safe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-bulk-four-game-xyz.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: pr776-original-nba-fourgame-expansion
  cancel-in-progress: false
jobs:
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game_id: ['0022600005','0022600091','0022600094','0022600103']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GID: ${{ matrix.game_id }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and read private 104 source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-private" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-private"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-private" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/canonical"
          git -C "$RUNNER_TEMP/canonical" sparse-checkout set gamepulse/fusion
          echo "ROOT=$RUNNER_TEMP/canonical" >> "$GITHUB_ENV"
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Download 13 original SDK parts once for this game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          gh api "repos/$PRIVATE/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release.json"
          gh release download "gamepulse-sdk-$GID" -R "$PRIVATE" --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk"
          test "$(find "$RUNNER_TEMP/sdk" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          echo ORIGINAL_PRIVATE_13_SDK_PARTS_VERIFIED
      - name: Replay frozen episode QA into original player and ball XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          PYTHONPATH=gamepulse/fusion python3 gamepulse/fusion/bulk_private_source_episode_xyz_2026.py \
            --repo-root . --game-id "$GID" --max-episodes 50 \
            --archive-dir "$RUNNER_TEMP/sdk" --release-manifest "$RUNNER_TEMP/release.json" \
            --official-lineup "gamepulse/fusion/official_lineup_clock/games/$GID.json" \
            --auto-qa "gamepulse/fusion/qa/auto_physics/${GID:0:8}/$GID.json" \
            --nba-episode-view "gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/$GID.json" \
            --original-qa "gamepulse/fusion/qa/official_native_episode_xyz_bridge_${GID}_20261026.json"
          python3 - "$GID" <<'PY'
          import json,sys,pathlib
          game=sys.argv[1]
          p=pathlib.Path('gamepulse/fusion/materialized/private_native_event_xyz_pr776_20261026')/game
          d=json.loads((p/'index_v2.json').read_bytes())
          assert d['game_id']==game
          assert d['original_archive_parts']==13
          assert d['source_qa_episode_count']==d['materialized_event_episodes']+d['quarantined_episode_count']
          assert d['physical_possessions_certified']==0
          assert d['materialized_event_episodes']>0
          print('PRIVATE_NATIVE_SOURCE_EPISODE_ACCEPTANCE',
            json.dumps({'game_id':game,
                        'accepted_episodes':d['materialized_event_episodes'],
                        'quarantined_episodes':d['quarantined_episode_count'],
                        'original_frames':d['candidate_native_source_frames'],
                        'ten_player_ball_frames':d['ten_plus_ball_source_frames']},sort_keys=True))
          PY
      - name: Commit private original trajectories, never to public runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add "gamepulse/fusion/materialized/private_native_event_xyz_pr776_20261026/$GID"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -qm "data(gamepulse): private original native ten-player XYZ source for game $GID"
            # Preserve concurrent PR updates. Never force-push source data.
            for attempt in 1 2 3 4 5; do
              if git push -q origin "HEAD:$BRANCH"; then break; fi
              git fetch -q origin "$BRANCH"
              git rebase "origin/$BRANCH"
              if [ "$attempt" -eq 5 ]; then
                git push -q origin "HEAD:$BRANCH"
              fi
            done
          fi
          echo SOURCE_ONLY_PRIVATE_NBA_XYZ_COMMITTED
