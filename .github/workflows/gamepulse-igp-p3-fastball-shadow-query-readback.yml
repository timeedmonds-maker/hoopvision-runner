name: IGP P3 read-only 10Hz source-graded fast-ball shadow query real NBA QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-fastball-shadow-query-readback.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-60ft-ball-shadow-source-query
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: dd563b52d0e18a4968b004834a8b99a1f8210c6d
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public confidentiality guard and pinned private SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test and source-verified readback first real fast-ball candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_68_p3_fastball_shadow_10hz_v1.py'
          if ! python3 gamepulse/fusion/query_igp_68_p3_fastball_shadow_10hz_v1.py --root . --game-id 0022600123 --auto-first --output "$RUNNER_TEMP/ball-private.json" > "$RUNNER_TEMP/ball-private.log" 2>&1; then
            echo IGP_P3_PRIVATE_SHADOW_QUERY_REAL_SOURCE_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          ls=(Path(os.environ['RUNNER_TEMP'])/'ball-private.log').read_text(errors='replace').splitlines()
          last=next((z for z in reversed(ls) if z.strip()),'NO_LOG')
          print('IGP_P3_QUERY_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:80])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'ball-private.json').read_text())
          assert j['research_only'] and j['source_original_not_changed'] and j['no_production_model_change']
          assert not j['physical_video_certified'] and j['no_possession_custody_inferred']
          assert j['accepted_68_complete_native']==492617
          assert j['accepted_68_complete_10hz_research']==917686
          assert len(j['rows'])==3 and j['counts']['experimental_fast_ball_positions']>=1
          candidates=[z for z in j['rows'] if z.get('candidate_ball_shadows')]
          assert candidates
          assert all(z['canonical_ball'] is None and not z['canonical_research_1200ms_complete'] for z in candidates)
          assert all(z['candidate_ball_shadows'][0]['grade'].endswith('NOT_CERTIFIED') for z in candidates)
          print('IGP_P3_PRIVATE_FAST_BALL_SOURCE_READBACK_PASSED',json.dumps({
            'rows':len(j['rows']),
            'added_research_ball_candidates':j['counts']['experimental_fast_ball_positions'],
            'complete_ten_ball_shadow_candidates':j['counts']['additional_complete_ten_plus_ball_candidates'],
            'changed_original_sdk_rows':0,'promoted_production_scenes':0},sort_keys=True))
          PY
      - name: Commit source-verified research shadow query smoke output privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_fastball_shadow_query_readback_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-ball-shadow-query "origin/$BRANCH"
          cp "$RUNNER_TEMP/ball-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): real 10Hz SDK/PBP fast ball shadow query preserving production 68game acceptance'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_PRIVATE_10HZ_FAST_BALL_SHADOW_QUERY_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
