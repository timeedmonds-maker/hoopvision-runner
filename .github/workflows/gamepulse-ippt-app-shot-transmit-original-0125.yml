name: IPPT original EaseLive vs NBA Inside the Game app shot-detail schema audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-app-shot-transmit-original-0125.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  authorized-original-source-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GID: '0022600125'
      SHA: 0e02114d4e986f582dd3cbc0abcd2a0f25bacbb1
      BRANCH: research/ippt-event-snapshots-separate-20261028
      QA: gamepulse/fusion/qa/igp_progress_20261029/ippt_original_app_shot_transmit_schema_0022600125_v1.json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and original NBA source authorization
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SHA"
          echo "PRIV=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Download existing authenticated private SDK source archive ONLY
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/originalsdk"
          gh release download "gamepulse-sdk-$GID" --repo timeedmonds-maker/104 \
            --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/originalsdk"
          test "$(find "$RUNNER_TEMP/originalsdk" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          echo SHA_ORIGINAL_PRIVATE_SDK_13_RELEASE_ARCHIVE_PARTS_FOUND
      - name: Exact-archive-SHA raw EaseLive event structure vs stored Blueprint shot attributes
        run: |
          set -euo pipefail
          cd "$PRIV"
          python3 -m py_compile gamepulse/fusion/igp_ippt_sdk_app_shot_transmit_schema_probe_2026.py
          python3 gamepulse/fusion/igp_ippt_sdk_app_shot_transmit_schema_probe_2026.py \
            --root . --game-id "$GID" --archive-dir "$RUNNER_TEMP/originalsdk" --output "$QA" \
            > "$RUNNER_TEMP/private-results.log"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          x=json.loads(Path(os.environ["QA"]).read_text())
          assert x["source_SDK_archive_sha_verified"]
          assert x["counts"]["sha_verified_original_sdk_parts"]==13
          assert x["counts"]["original_sdk_events"]>0
          assert x["blueprint_shot_count"]>0
          assert x["only_original_SDK_program_positions_scanned"]
          assert not x["ios_app_network_responses_observed"]
          safe={"game_count":1,
                "game_type":"Original 36 captured NBA games, DET-NYK 2026-10-27",
                "original_SDK_archive_SHA_verified_parts":13,
                "original_EaseLive_SDK_events":x["counts"]["original_sdk_events"],
                "raw_EaseLive_events_contain_shot_like_JSON_paths":len(x["SDK_shot_like_paths"]),
                "raw_EaseLive_shot_like_keys":sorted(x["SDK_shot_like_paths"]),
                "original_Blueprint_shots":x["blueprint_shot_count"],
                "original_Blueprint_fields_present":x["blueprint_expected_fields_present"],
                "Blueprint_raw_sub_tenth_release_values":x["blueprint_raw_release_values_not_quantized_to_tenth"],
                "defender_jump_field_present_in_saved_EaseLive_events":any(
                  re.search(r"defender.*jump|jump.*defend",k,re.I)
                  for k in x["SDK_shot_like_paths"]),
                "NBA_native_iOS_app_network_captured":False,
                "source_unchanged":True}
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(json.dumps(safe,sort_keys=True))
          print("IPPT_ORIGINAL_SHA_EASELIVE_SHOT_DETAIL_TRANSMIT_SCHEMA_PASS",json.dumps(safe,sort_keys=True))
          PY
      - name: Commit source-only PRIVATE JSON keys and counts, not original events
        run: |
          set -euo pipefail
          cd "$PRIV"
          git config user.name "Game Pulse Original Shot Transport Audit"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$QA"
          git diff --cached --check
          git commit -qm "qa(ippt): original NBA EaseLive raw event shot schema and Blueprint fields, single source game"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_EASELIVE_SHOT_TRANSPORT_SCHEMA_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
      - name: Publish only aggregate safe schema receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          safe=json.loads((r/"safe.json").read_text()) if (r/"safe.json").exists() else {"status":os.environ["RESULT"]}
          safe.update({"run_id":os.environ["GITHUB_RUN_ID"],"code_sha":os.environ["SHA"]})
          (r/"safe.md").write_text("Original NBA Game Pulse SDK raw-slot structure versus Blueprint shot-detail schema (one game). No raw source positions, NBA app session tokens, screenshots or per-shot measurements. Native iOS app NOT intercepted.\n\n~~~json\n"+json.dumps(safe,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private" "$RUNNER_TEMP/originalsdk"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/safe.md"
