name: "IGP G4 56-game original native possession product and NBA shot QA"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-g4-all56-native-possession-product-qa.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-original-native-56-game-possessions-query-acceptance
  cancel-in-progress: false
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Safe checkout private canonical source only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/games
      - name: Source-free 56-game query tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_source_first_possession_product_v1.py \
            gamepulse/fusion/query_igp_g4_post36_native_possession_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_source_first_possession_product_v1.py'
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_query_igp_g4_post36_native_possession_v1.py'
      - name: Verify 56 real games native readback PBP chain lookup official action shot and 1Hz model context
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json,statistics,time
          from pathlib import Path
          from query_igp_source_first_possession_product_v1 import query
          from query_igp_g4_native_actor_possession_2026 import load_index as old_reader
          from query_igp_g4_post36_native_possession_v1 import read_index as new_reader
          from igp_tracking_pilot_run_2026 import BASE
          root=Path(".")
          old=json.loads((root/BASE/"materialized/igp_g4_original_native_player_ball_possession_v1/index.json").read_bytes())
          new=json.loads((root/BASE/"materialized/igp_g4_post36_additive_original_native_possession_v1/index.json").read_bytes())
          index=json.loads((root/BASE/"materialized/igp_2026_27_unified_season_v3/index.json").read_bytes())
          games=sorted(index["per_game_model"])
          assert len(games)==56 and set(games)==set(old["games"])|set(new["games"])
          assert not set(old["games"])&set(new["games"])
          qa={"schema":"igp.full56.original-native-PBP-action-shot-1hz-model-query-with-official-ten-QA.v3",
              "canonical_56_game_count":56,"frozen_G4_games":36,"new_G4_games":20,
              "frozen_native_original_frames":old["counts"]["nba_original_source_frames"],
              "new_native_original_frames":new["counts"]["nba_original_source_frames"],
              "games":{}, "physical_possessions_certified":0,
              "source_XYZ_not_copied_to_public":True,
              "G4_NBA_logged_UTC_and_player_identity_explicitly_provisional":True}
          route_count={};latency=[];model_status={};grade_probes=0;dispute_probes=0
          import gzip
          source_ten=Path("gamepulse/fusion/materialized/igp_g4_post36_official_ten_evidence_v1")
          for gid in games:
            b,sha=(old_reader(root,gid) if gid in old["games"] else new_reader(root,gid))
            candidates=[(cid,chain) for cid,chain in sorted(b["nba_canonical_logical_chains"].items())
              if chain["native_logged_frame_ordinals"]
              and any(type(a) is int and a>0 for a in chain["official_action_ids"])]
            assert candidates,("NO_TESTABLE_LOGICAL_NATIVE_CHAIN",gid)
            cid,chain=candidates[0]
            tick=time.perf_counter()
            x=query(root,gid,chain_id=cid,limit=2,action_limit=1,include_original_xyz=True,
                    include_1hz_action_tracking=True)
            latency.append(round((time.perf_counter()-tick)*1000,3))
            native=x["native"]
            assert x["database_games"]==56 and x["accepted_G4_native_logical_chain_games"]==56,(gid,x["native_PBP_join_route"])
            assert native["matched_source_frames"]>0 and native["returned_frames"]
            assert len(x["official_actions_with_source_shot_features"])==1
            assert x["official_actions_with_source_shot_features"][0]["official_action"]["nba_action_number"] in chain["official_action_ids"]
            assert not x["physical_possession_custody_certified"]
            model=x["official_actions_with_source_shot_features"][0]["coarse_1Hz_action_tracking"]
            assert isinstance(model,dict) and model.get("status"),(gid,model)
            model_status[model["status"]]=model_status.get(model["status"],0)+1
            assert x["official_actions_with_source_shot_features"][0]["coarse_1Hz_action_tracking_is_not_exact_physical_action_instant"]
            assert native["NBA_logical_chain"]["official_action_ids"]==chain["official_action_ids"]
            assert native["returned_frames"][0]["original_native_UTC_ms"]==b["native_frames"][chain["native_logged_frame_ordinals"][0]][0]
            if gid in new["games"]:
              assert native["NBA_official_ten_evidence_attached"],gid
              assert all("NBA_official_ten_source_ID_match_grade" in z
                         for z in native["returned_frames"])
              rows=json.loads(gzip.decompress(
                (source_ten/(gid+".json.gz")).read_bytes()))["graded_native_source_ordinals"]
              strict=next((row for row in rows if row[2]=="DIRECT_EXACT_OFFICIAL_TEN"),None)
              assert strict is not None,("NO_DIRECT_EXACT_TEN_SOURCE",gid)
              source_t=b["native_frames"][strict[0]][0]
              direct=query(root,gid,start=source_t,end=source_t,limit=1,
                           action_limit=1,include_original_xyz=True)
              frame=direct["native"]["returned_frames"][0]
              assert frame["NBA_official_ten_source_ID_match_grade"]=="DIRECT_EXACT_OFFICIAL_TEN"
              assert set(frame["source_players"])==set(frame["NBA_official_ten_candidate"])
              assert not frame["NBA_exact_physical_possession_custody_certified"]
              grade_probes+=1
              dispute=next((row for row in rows if row[2]=="SOURCE_ACTOR_DISPUTED"),None)
              if dispute:
                disputed_t=b["native_frames"][dispute[0]][0]
                uncertain=query(root,gid,start=disputed_t,end=disputed_t,
                                limit=1,include_original_xyz=True)["native"]["returned_frames"][0]
                assert uncertain["NBA_official_ten_source_ID_match_grade"]=="SOURCE_ACTOR_DISPUTED"
                assert uncertain["source_actor_nonofficial_extra_count"]>0
                dispute_probes+=1
            route=x["native_PBP_join_route"]
            route_count[route]=route_count.get(route,0)+1
            qa["games"][gid]={"native_original_frames":len(b["native_frames"]),
                 "nba_logical_chains":len(b["nba_canonical_logical_chains"]),
                 "first_native_possession_index_query":True,
                 "official_NBA_action_source_verified":True,
                 "native_original_source_sha_readback":True,
                 "index_route":route,
                 "1Hz_action_model_status":model["status"],
                 "NBA_physical_custody_certified":False}
          assert route_count=={"G4_NATIVE_PBP_LOGICAL_CHAIN_INDEX":36,
                               "G4_POST36_NATIVE_PBP_LOGICAL_CHAIN_INDEX":20},route_count
          assert grade_probes==20 and dispute_probes>=15,(grade_probes,dispute_probes)
          qa["post36_source_exact_official_ten_readback_games"]=grade_probes
          qa["post36_source_actor_dispute_readback_games"]=dispute_probes
          assert qa["frozen_native_original_frames"]+qa["new_native_original_frames"]==1878131
          assert sum(z["nba_logical_chains"] for z in qa["games"].values())==11550
          qa["total_original_native_timestamps_indexed"]=1878131
          qa["NBA_official_PBP_logical_chains_indexed"]=11550
          qa["source_game_query_acceptance"]=56
          qa["route_counts"]=route_count
          qa["1Hz_action_context_all56_verified"]=True
          qa["1Hz_action_context_status_counts"]=model_status
          qa["query_latency_ms_sample"]={"n":len(latency),
             "median":round(statistics.median(latency),3),
             "p95":sorted(latency)[int(.95*(len(latency)-1))]}
          path=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_G4_all56_original_native_possession_product_readback_v3.json")
          if path.exists():raise FileExistsError("DO_NOT_OVERWRITE_56_GAME_PRODUCT_QA_V3")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(qa,sort_keys=True,indent=2)+"\n")
          print("IGP_ALL56_REAL_SOURCE_NATIVE_PBP_ACTION_SHOT_QUERY_ACCEPTED",
             json.dumps({k:v for k,v in qa.items() if k!="games"},sort_keys=True))
          PY
      - name: Commit accepted all56 private source aggregate QA without leaking coordinate payloads
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_G4_all56_original_native_possession_product_readback_v3.json
          git diff --cached --check
          git commit -q -m "qa(igp): full56 original-native NBA PBP action-shot and coarse 1Hz tracking plus direct official-ten and disputed actor QA v3"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_ALL56_G4_ORIGINAL_SOURCE_NATIVE_PBP_ACTION_SEARCH_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
