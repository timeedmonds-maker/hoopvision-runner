# Reviewed allowlist: public logs contain counts only; original NBA XYZ and model sidecars remain private.
name: Integrated Pulse unified 56-game season tracking QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-unified-56-season-tracking.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-unified-private-56-season
  cancel-in-progress: false
jobs:
  unified-season:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CANONICAL: research/gamepulse-clock-boundary-integrity-20261025
      RESEARCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify private source access
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$CANONICAL" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/unified"
          git -C "$RUNNER_TEMP/unified" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/games docs/gamepulse
      - name: Bring accepted 36-game model and all original Blueprint reports into the single canonical working tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unified"
          git fetch -q origin "$RESEARCH"
          git checkout FETCH_HEAD -- \
            gamepulse/fusion/igp_ippt_running_gameclock_source_coverage_2026.py \
            gamepulse/fusion/query_igp_ippt_official_clock_ten_model_v1_2026.py \
            gamepulse/fusion/igp_ippt_clock_ten_model_materialize_all36_2026.py \
            gamepulse/fusion/qa/igp_progress_20261028/ippt_clock_ten_player_ball_model_all36_v1.json \
            gamepulse/fusion/materialized/igp_ippt_clock_ten_model_all36_v1 \
            docs/gamepulse/IPPT_OFFICIAL_CLOCK_TEN_PLAYER_BALL_91_PERCENT_MODELED_PRODUCT_ACCEPTANCE_2026-10-28.md \
            docs/gamepulse/INTEGRATED_PULSE_SOLVE_V2_TWICE_REVIEWED_EXECUTION_PLAN_2026-10-29.md
          while IFS= read -r path; do
            if [ ! -f "$path" ]; then
              mkdir -p "$(dirname "$path")"
              git show "FETCH_HEAD:$path" > "$path"
            fi
          done < <(git ls-tree -r --name-only FETCH_HEAD data/extensions/nba_blueprint_2026_27/games)
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          shot=json.loads(Path("gamepulse/fusion/qa/igp_progress_20261029/igp_blueprint_official_56_source_qa.json").read_bytes())
          assert len(shot["games"])==56
          for gid,row in shot["games"].items():
              p=Path("data/extensions/nba_blueprint_2026_27/games")/gid/"blueprint_report_raw.json"
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==row["blueprint_original_report_sha256"],gid
          model=json.loads(Path("gamepulse/fusion/qa/igp_progress_20261028/ippt_clock_ten_player_ball_model_all36_v1.json").read_bytes())
          assert model["counts"]["model_player_ball_complete"]==89273 and model["counts"]["gameclock_seconds_materialized"]==98058
          for gid,row in model["games"].items():
              p=Path(row["private_path"])
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row["sha256"],gid
          print("IGP_56_SHOT_REPORTS_AND_36_ACCEPTED_MODEL_SHA_VERIFIED")
          PY
      - name: Execute new game models and unified 56-game sample coverage QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unified"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_unified_56_gameclock_model_20261029.py
          python3 gamepulse/fusion/igp_unified_56_gameclock_model_20261029.py --root .
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          b=Path("gamepulse/fusion")
          q=json.loads((b/"qa/igp_progress_20261029/igp_unified_56_model_clock_second_acceptance_v1.json").read_bytes())
          i=json.loads((b/"materialized/igp_2026_27_unified_season_v1/index.json").read_bytes())
          assert len(q["games"])==56 and len(i["per_game_model"])==56
          assert sum(x["status"]=="PRESERVED_ACCEPTED_36_MODEL" for x in q["games"].values())==36
          assert sum(x["status"]=="POST36_MODELED_PBP_SUB_LINEUP_PROVISIONAL" for x in q["games"].values())==18
          assert sum(x["status"]=="MISSING_ORIGINAL_XYZ" for x in q["games"].values())==2
          for gid,row in q["games"].items():
              if row.get("model_path"):
                  assert hashlib.sha256(Path(row["model_path"]).read_bytes()).hexdigest()==row["model_SHA256"],gid
          assert q["accuracy_status"]=="UNCERTIFIED_PHYSICAL_POSITION_AND_CLOCK_PRECISION"
          print("IGP_UNIFIED_56_SOURCE_QA",q["all56_model_complete_pct"],q["all56_PBP_paired_advancing_clock_seconds_including_unrecovered"])
          PY
      - name: Commit accepted source and model outputs only on canonical private branch
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unified"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/igp_ippt_running_gameclock_source_coverage_2026.py \
            gamepulse/fusion/query_igp_ippt_official_clock_ten_model_v1_2026.py \
            gamepulse/fusion/igp_ippt_clock_ten_model_materialize_all36_2026.py \
            gamepulse/fusion/qa/igp_progress_20261028/ippt_clock_ten_player_ball_model_all36_v1.json \
            gamepulse/fusion/materialized/igp_ippt_clock_ten_model_all36_v1 \
            gamepulse/fusion/materialized/igp_2026_27_unified_season_v1 \
            gamepulse/fusion/qa/igp_progress_20261029/igp_unified_56_model_clock_second_acceptance_v1.json \
            data/extensions/nba_blueprint_2026_27/games \
            docs/gamepulse/IPPT_OFFICIAL_CLOCK_TEN_PLAYER_BALL_91_PERCENT_MODELED_PRODUCT_ACCEPTANCE_2026-10-28.md \
            docs/gamepulse/INTEGRATED_PULSE_SOLVE_V2_TWICE_REVIEWED_EXECUTION_PLAN_2026-10-29.md
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_UNIFIED_56_ALREADY_CURRENT; exit 0; fi
          git commit -q -m 'data(igp): unify full56 official shot and 54-game tracking data with accepted 36 model'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$CANONICAL"
            git rebase -q "origin/$CANONICAL"
            if git push -q origin "HEAD:refs/heads/$CANONICAL"; then
              echo IGP_56_SINGLE_CANONICAL_MODEL_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 23
