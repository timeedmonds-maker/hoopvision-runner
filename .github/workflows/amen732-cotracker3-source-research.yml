name: Amen 732 CoTracker3 controlled CPU experiment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amen732-cotracker3-source-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source/rights boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          assert scan(['.github/workflows/amen732-cotracker3-source-research.yml'])==[]
          print("NONCOMMERCIAL_ISOLATED_RESEARCH_GUARD_PASS")
          PY
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Install pinned CPU research dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            'torch==2.5.1+cpu' 'torchvision==0.20.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet --disable-pip-version-check \
            'numpy<2' 'opencv-python-headless==4.10.0.84' 'einops==0.8.1' \
            'timm==1.0.20' 'scipy==1.14.1' 'tqdm==4.67.1'
          python3 -c 'import torch;print("SOURCE_COTRACKER_CPU_PYTORCH_READY",torch.__version__)'
      - name: Track original right-side contact window under 15-minute limit
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          TAG='freeview-native-0022600009-732'
          mkdir -p "$TMP/original" "$TMP/qa"
          gh release download "$TAG" --repo timeedmonds-maker/104 --dir "$TMP/original" \
            --pattern '*right-slash.mp4' --pattern 'source_manifest.json' \
            --pattern 'native_presentation_timestamps.json'
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_cotracker3_research_probe.py?ref=6578a2bca5aeb822518b302d563df6af8614e8ef' \
            --jq .content | base64 -d > "$TMP/research.py"
          python3 "$TMP/research.py" --selftest
          timeout 900 python3 "$TMP/research.py" \
            --root "$TMP/original" \
            --out "$TMP/qa/event732-cotracker3-rightslash-research.json"
          gh release upload "$TAG" "$TMP/qa/event732-cotracker3-rightslash-research.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="event732-cotracker3-rightslash-research.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$TMP/qa/event732-cotracker3-rightslash-research.json" | cut -d' ' -f1)"
          echo NBA_COTRACKER3_PRIVATE_RESEARCH_SHA256_PASS
