name: IGP NBA 2027 player pergame advanced ratings and rotation stints source probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-2027-player-advanced-rotations-probe-20261031.yml']
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download checked public 2027 player advanced and rotation datasets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 - <<'PY'
          import urllib.request,hashlib,os
          from pathlib import Path
          for d in ["player_game_logs","game_rotations"]:
              url=f"https://basketball-data.billmill.org/nba/stats/{d}/season=2027/data.parquet"
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"IGP-2027-NBA-open-source-stint-audit/1.0"})
                  with urllib.request.urlopen(req,timeout=28) as r:
                      buf=r.read(25000001)
                      assert r.status==200
                  assert len(buf)<25000000 and buf[:4]==b"PAR1" and buf[-4:]==b"PAR1"
                  (Path(os.environ["RUNNER_TEMP"])/(d+".parquet")).write_bytes(buf)
                  print("IGP_NBA_ADVANCED_PLAYER_ROTATION_PARQUET_DOWNLOADED",d,"length",len(buf),"sha256",hashlib.sha256(buf).hexdigest())
              except Exception as e:
                  print("IGP_NBA_ADVANCED_PLAYER_ROTATION_SOURCE_FAILURE",d,type(e).__name__)
                  raise
          PY
      - name: Inspect 2027 original player advanced, rotation rows and sample IGP games
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install duckdb
          python3 - <<'PY'
          import os,duckdb,json
          from pathlib import Path
          c=duckdb.connect()
          for name in ("player_game_logs","game_rotations"):
              path=str(Path(os.environ["RUNNER_TEMP"])/(name+".parquet"))
              cols=c.execute(f"DESCRIBE SELECT * FROM read_parquet('{path}')").fetchall()
              print("IGP_NBA_PLAYER_ROTATION_ORIGINAL_SCHEMA",name,json.dumps([(x[0],x[1]) for x in cols],sort_keys=True))
              fields={x[0] for x in cols}
              need=({"game_id","team_id","player_id","min","off_rating","def_rating","net_rating","poss"} if name=="player_game_logs" else {"game_id","team_id","player_id","in_time","out_time"})
              assert need<=fields, (name,sorted(need-fields))
              census=c.execute(f"SELECT count(*),count(distinct game_id),sum(CASE WHEN game_id LIKE '00226%' THEN 1 ELSE 0 END),count(distinct CASE WHEN game_id LIKE '00226%' THEN game_id END) FROM read_parquet('{path}')").fetchone()
              print("IGP_NBA_PLAYER_ROTATION_2027_CENSUS",name,json.dumps(census))
              if name=="player_game_logs":
                  r=c.execute(f"SELECT game_id,player_id,team_id,min,off_rating,def_rating,net_rating,poss FROM read_parquet('{path}') WHERE game_id IN ('0022600009','0022600146') ORDER BY game_id,team_id,player_id LIMIT 32").fetchall()
                  print("IGP_NBA_PLAYER_ADVANCED_SAMPLE",json.dumps(r))
                  anomalies=c.execute(f"SELECT count(*),count(*) FILTER(WHERE off_rating IS NULL),count(*) FILTER(WHERE poss IS NULL),count(*) FILTER(WHERE poss=0),sum(poss) FROM read_parquet('{path}') WHERE game_id LIKE '00226%'").fetchone()
                  print("IGP_NBA_PLAYER_ADVANCED_MISSINGNESS",json.dumps(anomalies))
              else:
                  r=c.execute(f"SELECT game_id,player_id,team_id,period,in_time,out_time,pts,plus_minus FROM read_parquet('{path}') WHERE game_id='0022600009' ORDER BY team_id,player_id,in_time LIMIT 32").fetchall()
                  print("IGP_NBA_ROTATION_SAMPLE",json.dumps(r))
          PY
