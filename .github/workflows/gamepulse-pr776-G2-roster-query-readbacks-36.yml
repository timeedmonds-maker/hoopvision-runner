name: PR776 G2 36-game original NBA XYZ roster + G1 lineage live-query QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-roster-query-readbacks-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G2-roster-native-query-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confidentiality guard and authenticated private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Unit tests for source-safe official NBA G2 query extension
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_g2_official_pbp_longpair_roster_query_2026.py \
            gamepulse/fusion/igp_g2_official_pbp_roster_query_acceptance_2026.py \
            gamepulse/fusion/query_igp_original_full_native_source_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_official_pbp_longpair_roster_query_2026.py' -v
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_official_pbp_longpair_roster_2026.py' -v
          echo G2_ORIGINAL_NBA_OFFICIAL_ROSTER_QUERY_SOURCE_FREE_PASS
      - name: All 36 original real player plus ball native G2 and G1 source equality
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_official_pbp_roster_G1_query_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_official_pbp_roster_query_acceptance_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-NBA-G2-original-query.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          t=q["tested"];a=q["accepted_G2_candidate_counts"]
          assert q["source_games"]==36
          assert t["games_with_real_original_G2_query_readback"]==36
          assert t["DIRECT_TEN_AGREEMENT"]>0
          assert t["SOURCE_DISAGREEMENT"]>0
          assert a["new_official_roster_pbp_pair_candidates"]==165108
          assert a["strict_frames"]==412619
          assert q["NBA_SDK_original_spatial_XYZ_authoritative"]
          assert q["G2_source_disagreements_remain_explicit"]
          assert not q["physical_live_and_custody_not_certified"] is False
          print("PR776_G2_ALL36_ORIGINAL_NBA_XYZ_OFFICIAL_PBP_ROSTER_G1_QUERY_ACCEPTED",
            json.dumps({"games":36,"tested":t,
              "long_pair_native_candidates":a["new_official_roster_pbp_pair_candidates"],
              "source_conflicting_ID_candidates":a["new_pbp_source_unexpected_actor_keys"]},sort_keys=True))
          PY
      - name: Commit private-only G2 query acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_official_pbp_roster_G1_query_36_v1.json
          git config user.name "Game Pulse Private NBA G2 QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): source-verifiable 36-game NBA official PBP roster + G1 player-ball query"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PR776_G2_ALL36_PRIVATE_NBA_ORIGINAL_ROSTER_QUERY_RECEIPT_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
