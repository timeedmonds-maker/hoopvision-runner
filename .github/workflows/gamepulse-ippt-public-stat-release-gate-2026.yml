name: IPPT private source QA public statistics reliability release gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-public-stat-release-gate-2026.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  public-stats-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/ippt-event-snapshots-separate-20261028
      SHA: e4b91456eb3f8ad446010eed07d05c95a31b23c9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public runner source privacy and pin private QA
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SHA"
          echo "PRIVATE=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Execute source-free fail-closed public-stat tests and actual SHA QA manifests
        run: |
          set -euo pipefail
          cd "$PRIVATE"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_public_stat_release_gate_2026.py
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from igp_ippt_public_stat_release_gate_2026 import report,PUBLIC_COVERAGE,EXPERIMENTAL,BLOCK
          r=report(".",[
            "official_clock_model_completeness",
            "official_clock_direct_or_two_sided_completeness",
            "annotated_predicted_court_snapshot",
            "player_heatmap_comparison",
            "team_spacing",
            "player_to_player_distance",
            "player_speed_or_acceleration",
            "ball_handler_or_physical_custody",
            "tracking_derived_physical_PPP"])
          d=r["decisions"]
          assert d["official_clock_model_completeness"]["status"]==PUBLIC_COVERAGE
          assert d["official_clock_direct_or_two_sided_completeness"]["status"]==PUBLIC_COVERAGE
          assert d["annotated_predicted_court_snapshot"]["status"]==EXPERIMENTAL
          assert all(d[k]["status"]==BLOCK for k in (
             "player_heatmap_comparison","team_spacing","player_to_player_distance",
             "player_speed_or_acceleration","ball_handler_or_physical_custody",
             "tracking_derived_physical_PPP"))
          e=r["evidence"]
          assert e["accepted_gameclock_seconds"]==98058
          assert e["complete_10_official_players_plus_ball"]==89273
          assert e["complete_direct_or_two_sided"]==76701
          assert not e["clock_native_UTC_independently_video_validated"]
          safe={"source_games":e["source_games"],"accepted_clock_seconds":e["accepted_gameclock_seconds"],
             "complete_modeled_ten_ball_samples":e["complete_10_official_players_plus_ball"],
             "complete_direct_or_two_sided_samples":e["complete_direct_or_two_sided"],
             "public_metric_decisions":{k:v["status"] for k,v in d.items()},
             "test_status":"PASS","independent_physical_accuracy_certified":False}
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(json.dumps(safe,sort_keys=True))
          print("IPPT_ORIGINAL_SHA_ALL36_PUBLIC_STATS_RELEASE_GATE_PASS",json.dumps(safe,sort_keys=True))
          PY
      - name: Public only aggregate QA / remove private source
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          d=json.loads((r/"safe.json").read_text()) if (r/"safe.json").exists() else {"status":os.environ["RESULT"]}
          d.update({"run_id":os.environ["GITHUB_RUN_ID"],"code_sha":os.environ["SHA"]})
          (r/"receipt.md").write_text("Integrated Pulse actual-source 36-game public statistics release gate. No original NBA XYZ or actor identities.\n\n~~~json\n"+json.dumps(d,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/receipt.md"
