# Original NBA licensed XYZ remain in private repository on runner; public aggregate logs only.
name: IGP 3.2 conservative ball hazard all71 postselection source QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-ballonly-hazard-all71.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-ball-hazard-all71
  cancel-in-progress: false
jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      SHARD: ${{ matrix.shard }}
      SHARDS: "8"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard and source-free hazard gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_ballonly_hazard_diagnostic_v1.py gamepulse/fusion/igp_v32_ballonly_hazard_all71_gate_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_ballonly_hazard_diagnostic_v1.py'
      - name: SHA-verified original source eight-game hazard audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_ballonly_hazard_all71_gate_v1.py \
            --root . --shard-index "$SHARD" --shard-count "$SHARDS" \
            --output "$RUNNER_TEMP/v32-hazard-shard.json" >"$RUNNER_TEMP/v32-hazard-private.log" 2>&1 || {
              echo IGP_V32_HAZARD_ALL71_SOURCE_SHARD_FAILED
              exit 81
            }
          grep '^IGP_V32_BALL_HAZARD_71_SHARD' "$RUNNER_TEMP/v32-hazard-private.log" || true
      - name: Commit private per-game hazard QA shard
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_ballonly_hazard_shard_$SHARD"
          receipt="$receipt""_of_$SHARDS.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v32hazard "origin/$BRANCH"
          cp "$RUNNER_TEMP/v32-hazard-shard.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo V32_HAZARD_SHARD_ALREADY_PRESENT;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): ball 3D conservative hazard shadow original source shard'
          for n in 1 2 3 4 5 6 7 8 9;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo V32_HAZARD_PRIVATE_SOURCE_SHARD_SAVED;exit 0;fi
            sleep "$n"
          done
          exit 82
  final:
    needs: [shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard and source clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Aggregate all 71 same original NBA source cohort
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_ballonly_hazard_all71_gate_v1.py \
            --root . --finalize --shard-count 8 \
            --output "$RUNNER_TEMP/v32-hazard71-final.json" >"$RUNNER_TEMP/v32-hazard-final-private.log" 2>&1 || {
              echo IGP_V32_HAZARD_ALL71_COHORT_FINAL_GATE_FAILED
              exit 83
            }
          grep '^IGP_V32_BALL_HAZARD_ALL71_FINAL' "$RUNNER_TEMP/v32-hazard-final-private.log" || true
      - name: Retain final rejected or shadow result in private QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_ballonly_hazard_all71_shadow_decision_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v32end "origin/$BRANCH"
          cp "$RUNNER_TEMP/v32-hazard71-final.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo V32_HAZARD_FINAL_ALREADY_PRESENT;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): source-verified all71 conservative ball hazard, no production promotion'
          for n in 1 2 3 4 5 6;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo V32_HAZARD_ALL71_PRIVATE_QA_SAVED;exit 0;fi
            sleep "$n"
          done
          exit 84
