name: Validate Toronto SAM Planner Fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-toronto-sam-planner-fix.yml']
  pull_request:
    paths: ['.github/workflows/validate-toronto-sam-planner-fix.yml', 'README.md']

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SHA: 6ac9fad67411f074e2c3062370964986e9929aea

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q --disable-pip-version-check 'numpy<2' pandas pytest opencv-python-headless
      - name: Run governing and corrected planner regressions
        run: |
          set -euo pipefail
          python src/tools/validate_governing_delivery_policy.py
          python src/screen_tracker_nextgen/test_global_identity_solver.py
          PYTHONPATH=src python -m pytest -q             src/screen_tracker_nextgen/test_global_identity_solver.py             src/hoopvision/tests/test_global_identity_mixed_uniform_abstention.py             src/hoopvision/tests/test_semantic_defender_soft_team.py
          python -m py_compile src/screen_tracker_nextgen/sam31_ambiguity_continuity.py
          PYTHONPATH=src python -m pytest -q src/screen_tracker_nextgen/test_sam31_same_lane_split.py
          echo HOOPVISION_TORONTO_SAM_PLANNER_CORRECTED_CPU_OK
