name: IPPT original NBA empty 129 native source scorer UTC lag tier all36
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-empty-chain-source-lag-tiers-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  empty-chain-source-lag-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      RESEARCH_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_CODE_SHA: ca1e977337b4773d227947bf06e5c32e914c68c1
      QA: gamepulse/fusion/qa/igp_progress_20261028/ippt_all36_empty409_original_native_source_scorer_lag_tiers_v1.json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce public privacy and exact private research source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$RESEARCH_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-src"
          git -C "$RUNNER_TEMP/private-src" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private-src" rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          echo "IPPT_PRIVATE=$RUNNER_TEMP/private-src" >> "$GITHUB_ENV"
      - name: Source free scorer-native proximity grades and G4 native frame immutability tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_PRIVATE"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_409_empty_chain_lag_tiers_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_409_empty_chain_lag_tiers_2026.py
      - name: Full SHA all36 source-native nearest scorer lag 129 unresolved chain QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_PRIVATE"
          export PYTHONPATH=gamepulse/fusion
          test ! -e "$QA"
          python3 gamepulse/fusion/igp_ippt_409_empty_chain_lag_tiers_2026.py \
             --root . --out "$QA" > "$RUNNER_TEMP/ippt_lag_full_private.log"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.environ["QA"]))
          t=x["counts"]
          assert x["source_games"]==36
          assert x["original_empty_NBA_chains"]==409
          assert t["empty_chains_originally_no_native_within_1s"]==129
          assert x["all_original_NBA_logical_chains_immutable"]==7474
          assert x["distant_native_UTC_never_promoted_to_physical_possession"]
          d={"source_games":36,"original_empty_chains":409,
             "no_original_source_within_1s":129,
             **t,"physical_ball_custody_certified":False}
          import pathlib
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"ippt_129_safe_summary.json").write_text(
              json.dumps(d,indent=2,sort_keys=True))
          print("IPPT_SHA_129_EMPTY_CHAINS_SCORER_SOURCE_LAG_TIER_PASS",json.dumps(d,sort_keys=True))
          PY
      - name: Commit private exact SHA protected additive 36 game lag QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_PRIVATE"
          git config user.name "NBA Native Original Source Integrity"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$QA"
          git diff --cached --check
          git commit -qm "qa(ippt): diagnose all129 missing NBA chains original scorer source lag strata"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$RESEARCH_BRANCH"
            git rebase -q "origin/$RESEARCH_BRANCH"
            if git push -q origin "HEAD:refs/heads/$RESEARCH_BRANCH"; then
              echo IPPT_PRIVATE_129_G4_ORIGINAL_SOURCE_LAG_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
      - name: Publish aggregate only research receipt and erase private original NBA source
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          summary={"run_id":os.environ["GITHUB_RUN_ID"],
            "job_status":os.environ["JOB_RESULT"],
            "private_code_sha":os.environ["EXPECTED_CODE_SHA"],
            "physical_ball_control_certified":False}
          if (root/"ippt_129_safe_summary.json").exists():
             summary["aggregate_only"]=json.loads((root/"ippt_129_safe_summary.json").read_text())
          (root/"ippt_129_public_receipt.md").write_text(
             "Original NBA native source nearest UTC grades — no private coordinates, source individual times or actor identities shared.\n\n~~~json\n"+
             json.dumps(summary,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private-src"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner \
             --body-file "$RUNNER_TEMP/ippt_129_public_receipt.md"
# No original player-ball XYZ or per-source-event UTC in public runner.
