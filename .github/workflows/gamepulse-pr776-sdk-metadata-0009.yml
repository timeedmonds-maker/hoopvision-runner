name: PR776 Rockets original SDK direct clock metadata gate
# Licensed raw SDK stays in runner memory; metadata QA and SHA receipt stay private.
# This is NOT gameplay tracking, lineup, or physical possession certification.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-sdk-metadata-0009.yml'
      - 'tools/licensed_feed/audit_sdk_metadata_0009.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-pr776-original-sdk-metadata-0022600009
  cancel-in-progress: false
jobs:
  original-metadata-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard and synthetic metadata-key tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/licensed_feed/audit_sdk_metadata_0009.py
          python3 tools/licensed_feed/audit_sdk_metadata_0009.py --self-test
      - name: Verify private boundary and original archive authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_SOURCE_AUTH_UNAVAILABLE; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          echo ORIGINAL_METADATA_PRIVATE_DESTINATION_CONFIRMED
      - name: Audit all 13 original parts and privately publish SHA receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/licensed_feed/audit_sdk_metadata_0009.py
