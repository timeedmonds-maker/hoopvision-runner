name: Integrated Pulse PR776 official native XYZ bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-official-native-xyz-bridge.yml', 'tools/public_content_guard.py']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PIN: baa593bf73752bf27851e83b7e398f6875cb65c0
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GAME_ID: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run source-independent private regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          ROOT="$RUNNER_TEMP/private-native-xyz"
          mkdir -p "$ROOT/sdk"
          echo "WORK=$ROOT" >> "$GITHUB_ENV"
          for path in \
            gamepulse/fusion/provisional_official_lineup_native_xyz_2026.py \
            gamepulse/fusion/official_lineup_trajectory_2026.py \
            gamepulse/fusion/original_sdk_xyz_clock_chain_aggregation_2026.py \
            gamepulse/fusion/automatic_clock_feature_search_2026.py \
            gamepulse/fusion/universal_possession_alignment_2026.py \
            gamepulse/fusion/tests/test_provisional_official_lineup_native_xyz_2026.py; do
            gh api "repos/$PRIVATE_REPO/contents/$path?ref=$PIN" --jq .content |
              base64 -d > "$ROOT/$(basename "$path")"
          done
          (cd "$ROOT" && python3 -m py_compile *.py &&
           python3 -m unittest -v test_provisional_official_lineup_native_xyz_2026)
      - name: SHA-verified original 13-part SDK pilot
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GAME_ID" > release.json
          gh release download "gamepulse-sdk-$GAME_ID" --repo "$PRIVATE_REPO" \
            --dir sdk --pattern 'sdk-part-*.tar.gz'
          test "$(find sdk -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          for pair in "gamepulse/fusion/official_lineup_clock/index.json:index.json" \
                      "gamepulse/fusion/official_lineup_clock/games/0022600009.json:official.json" \
                      "gamepulse/fusion/qa/automatic_hoop_anchor_fullgame_0022600009_20261025.json:auto.json"; do
            path="$(echo "$pair" | cut -d: -f1)"
            dst="$(echo "$pair" | cut -d: -f2)"
            gh api "repos/$PRIVATE_REPO/contents/$path?ref=$PIN" --jq .content |
              base64 -d > "$dst"
          done
          python3 - <<'PY'
          import hashlib,json,os
          j=json.load(open("index.json"))
          assert len(j["games"])==28
          assert hashlib.sha256(open("official.json","rb").read()).hexdigest()==j["games"][os.environ["GAME_ID"]]["sha256"]
          PY
          python3 provisional_official_lineup_native_xyz_2026.py \
            --game-id "$GAME_ID" --official-lineup official.json \
            --auto-qa auto.json --release-json release.json --archive-dir sdk \
            --out result.json
      - name: Publish private-only source QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          d=json.load(open("result.json"));c=d["counts"]
          assert c["original_unique_frames"]==34979
          assert c["original_ball_xyz_frames"]==26189
          assert c["PROVISIONAL_CLOCK_OFFICIAL_LINEUP"]>0
          assert d["physical_possessions_certified"]==0 and not d["original_coordinates_exported"]
          uri="repos/"+os.environ["PRIVATE_REPO"]+"/contents/gamepulse/fusion/qa/official_native_lineup_xyz_bridge_0022600009_20261026.json"
          raw=(json.dumps(d,sort_keys=True,indent=2)+"\n").encode()
          item={"branch":os.environ["BRANCH"],"message":"data(gamepulse): source-verified NBA lineup original XYZ pilot",
                "content":base64.b64encode(raw).decode()}
          existing=subprocess.run(["gh","api",uri+"?ref="+os.environ["BRANCH"]],capture_output=True,text=True)
          if existing.returncode==0:
            old=json.loads(existing.stdout)
            if base64.b64decode(old["content"])==raw:
              print("PRIVATE_QA_UNCHANGED");raise SystemExit(0)
            item["sha"]=old["sha"]
          elif "404" not in existing.stderr and "Not Found" not in existing.stderr:
            raise ValueError("PRIVATE_QA_LOOKUP_FAILURE")
          put=subprocess.run(["gh","api","--method","PUT",uri,"--input","-"],
                             input=json.dumps(item),text=True,capture_output=True)
          if put.returncode:raise ValueError("PRIVATE_QA_WRITE_FAILURE")
          print("PRIVATE_QA_COMMITTED")
          print("SAFE_COUNTS",json.dumps({k:c.get(k,0) for k in
                ("original_unique_frames","PROVISIONAL_CLOCK_OFFICIAL_LINEUP",
                 "full_official_ten_direct_frames","full_official_ten_reconstructed_frames",
                 "full_official_ten_plus_ball_frames")},sort_keys=True))
          PY
