# Original NBA SDK exact 13 SHA keyframe archive private provenance only.
name: IGP v3.2 40ft ball original upstream provenance fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-ball-source-variant-0001.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  variant:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard and clone original source privately
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Verify prior original SHA 13-part keyframe provenance via Git data
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          git fetch -q origin research/igp-68-live-gap-census-20261030
          git show FETCH_HEAD:gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g1_original_actor_upstream_interp_0001_v1.jsonl.gz >"$RUNNER_TEMP/upstream-original.gz"
          git show FETCH_HEAD:gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g1_original_actor_upstream_interp_0001_v1.json >"$RUNNER_TEMP/upstream-summary.json"
          python3 gamepulse/fusion/igp_v32_ball_original_g1_upstream_spike_grade_v1.py \
            --root . --original-sidecar "$RUNNER_TEMP/upstream-original.gz" \
            --original-summary "$RUNNER_TEMP/upstream-summary.json" \
            --output "$RUNNER_TEMP/private-ball-upstream.json" >"$RUNNER_TEMP/private-upstream.log" 2>&1 || {
              echo IGP_V32_ORIGINAL_UPSTREAM_SPIKE_SHA_GRADE_FAILED
              exit 84
            }
          grep '^IGP_V32_G1_SPIKE_PROVENANCE' "$RUNNER_TEMP/private-upstream.log"
          python3 gamepulse/fusion/igp_v32_g1_false_source_ball_anchor_shadow_v1.py --root . --output "$RUNNER_TEMP/private-g1-sourcefalse.json" >"$RUNNER_TEMP/private-false-source.log" 2>&1 || {
            echo IGP_V32_G1_FALSE_ANCHOR_SOURCE_MASK_TEST_FAILED
            exit 85
          }
          grep '^IGP_V32_G1_FALSE_ANCHOR_BALL_SHADOW' "$RUNNER_TEMP/private-false-source.log"
      - name: Preserve alternative original source keyframes private
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_ball_upstream_original_g1_source_grade_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B original-variants "origin/$BRANCH"
          cp "$RUNNER_TEMP/private-ball-upstream.json" "$receipt"
          cp "$RUNNER_TEMP/upstream-original.gz" gamepulse/fusion/qa/igp_v32/igp_v32_g1_original_actor_upstream_by_utc_v1.jsonl.gz
          cp "$RUNNER_TEMP/upstream-summary.json" gamepulse/fusion/qa/igp_v32/igp_v32_g1_upstream_original_source_summary_v1.json
          cp "$RUNNER_TEMP/private-g1-sourcefalse.json" gamepulse/fusion/qa/igp_v32/igp_v32_g1_false_anchors_ball_source_mask_shadow_v1.json
          git add -f "$receipt" gamepulse/fusion/qa/igp_v32/igp_v32_g1_false_anchors_ball_source_mask_shadow_v1.json gamepulse/fusion/qa/igp_v32/igp_v32_g1_original_actor_upstream_by_utc_v1.jsonl.gz gamepulse/fusion/qa/igp_v32/igp_v32_g1_upstream_original_source_summary_v1.json
          git diff --cached --check
          if git diff --cached --quiet;then echo VARIANT_QA_ALREADY_SAVED;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): verify SHA G1 original keyframe upstream ball anomaly flags'
          for n in 1 2 3 4 5 6;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo IGP_V32_RAW_ORIGINAL_VARIANTS_QA_SAVED_PRIVATE;exit 0;fi
            sleep "$n"
          done
          exit 83
