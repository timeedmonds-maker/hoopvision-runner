name: IGP fifth actor extra source all68 continuity diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-fifth-extra-actor-diagnostic.yml']
permissions: {contents: read}
concurrency:
  group: igp-fifth-extra-all68
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 8754c2ea0d079e803cacc1f1fad2864b3bc9fb7a
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public logs and checkout exact private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free candidate continuity tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fifth_extra_actor_diagnostic_v1.py'
      - name: Exhaustive SHA original NBA native actor extra audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fifth_extra_actor_diagnostic_v1.py \
              --root . --output "$RUNNER_TEMP/fifth-extra-private.json" \
              > "$RUNNER_TEMP/fifth-extra-private.log" 2>&1; then
            echo IGP_FIFTH_EXTRA_AUDIT_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'fifth-extra-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('IGP_FIFTH_EXTRA_REDACTED_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:90])
          print('IGP_FIFTH_EXTRA_GAMES_FINISHED',sum(x.startswith('IGP_FIFTH_EXTRA_GAME') for x in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'fifth-extra-private.json').read_text())
          assert j['counts']['games']==68 and j['counts']['native_frames']==2280600
          assert j['counts']['strict_frames']==867735
          assert j['identity_aliases_accepted']==0 and j['newly_accepted_complete_scenes']==0
          print('IGP_FIFTH_EXTRA_SAFE_COUNTS',json.dumps(j['counts'],sort_keys=True))
          PY
      - name: Commit only private original-source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fifth_extra_actor_diagnostic_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B fifth-extra-all68 "origin/$BRANCH"
          cp "$RUNNER_TEMP/fifth-extra-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_FIFTH_EXTRA_QA_ALREADY_COMMITTED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): all68 source fifth extra actor alias and continuity diagnostics'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_FIFTH_EXTRA_ALL68_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
