name: NBA 2026-27 independent ONOFF and 5man NBA validation
# Official NBA 5man, player ONOFF and possession rates are canonical; sampled tracking WOWY is separate.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-official-onoff-qa.yml']
  workflow_dispatch:
  schedule:
    - cron: '29 17 * * *'
permissions:
  contents: read
concurrency:
  group: nba-2026-independent-onoff-qa
  cancel-in-progress: false
jobs:
  validate-private-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure public-safe code and authorized private destination
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = 'true'
      - name: Fetch reviewed validator and original 14 private search views
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/onoff"
          mkdir -p "$ROOT/games" "$ROOT/tests"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/validate_official_onoff_2026.py?ref=main' --jq .content |
            base64 -d > "$ROOT/validate_official_onoff_2026.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_official_onoff_2026.py?ref=main' --jq .content |
            base64 -d > "$ROOT/tests/test_official_onoff_2026.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/index.json?ref=main' --jq .content |
            base64 -d > "$ROOT/index.json"
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"onoff"
          ids=sorted(json.loads((root/"index.json").read_text())["games"])
          assert len(ids)>=14
          for gid in ids:
              res=subprocess.check_output(["gh","api",
                  "repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/"+gid+".json?ref=main",
                  "--jq",".content"])
              (root/"games"/(gid+".json")).write_bytes(base64.b64decode(res))
          print("ORIGINAL_PRIVATE_GAME_VIEWS_FETCHED",len(ids))
          PY
          python3 -m py_compile "$ROOT/validate_official_onoff_2026.py"
          python3 -m unittest discover -v -s "$ROOT/tests" -p 'test_official_onoff_2026.py'
      - name: Probe official team ONOFF and game five-man sources independently
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/onoff"
          python3 "$ROOT/validate_official_onoff_2026.py" --root "$ROOT"
          test -s "$ROOT/official_onoff_qa.json"
          test -s "$ROOT/official_onoff_matches.json"
      - name: Publish source provenance and match results solely into private 104
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/onoff"
          TAG='gamepulse-independent-onoff-2026-27'
          gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1 ||
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title '2026-27 independent NBA ON/OFF and lineup QA' \
              --notes 'Official NBA player on/off and 5-man comparison to observed private Game Pulse. Absent sources remain unverified.' \
              --latest=false >/dev/null
          gh release upload "$TAG" "$ROOT/official_onoff_matches.json" "$ROOT/official_onoff_qa.json" \
              --repo timeedmonds-maker/104 --clobber >/dev/null
          python3 - <<'PY'
          import base64,json,os,subprocess,hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"onoff"
          data=json.loads((root/"official_onoff_qa.json").read_text())
          assert data["source_count"]==14
          target="repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_onoff_qa_2026_27.json"
          current=subprocess.run(["gh","api",target],capture_output=True,text=True)
          payload={"branch":"main","message":"chore(2026): independently validate Game Pulse on/off against NBA sources",
                   "content":base64.b64encode((root/"official_onoff_qa.json").read_bytes()).decode()}
          if current.returncode==0:payload["sha"]=json.loads(current.stdout)["sha"]
          elif not ("404" in current.stderr or "Not Found" in current.stderr):
              raise RuntimeError("PRIVATE_ONOFF_QA_LOOKUP_FAILED")
          res=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
              input=json.dumps(payload),capture_output=True,text=True)
          if res.returncode:raise RuntimeError("PRIVATE_ONOFF_QA_PUBLISH_FAILED")
          print("PRIVATE_ONOFF_QA_SUMMARY",
                {k:data[k] for k in ("source_count","official_lineups","matched_tracking_lineups",
                    "verified_player_onoff_records","games_with_official_lineups","games_with_verified_onoff")})
          PY
      - name: Publish game-level NBA ONOFF and official possessions alongside certified tracked shot samples
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/onoff"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/materialize_official_onoff_2026.py?ref=main' --jq .content |
            base64 -d > "$ROOT/materialize_official_onoff_2026.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_materialize_official_onoff_2026.py?ref=main' --jq .content |
            base64 -d > "$ROOT/tests/test_materialize_official_onoff_2026.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/verified_event_lineup_shots_2026_27.json?ref=main' --jq .content |
            base64 -d > "$ROOT/verified_event_shot_sample.json"
          python3 -m unittest discover -v -s "$ROOT/tests" -p test_materialize_official_onoff_2026.py
          python3 "$ROOT/materialize_official_onoff_2026.py" \
            --qa "$ROOT/official_onoff_qa.json" \
            --matches "$ROOT/official_onoff_matches.json" \
            --shots "$ROOT/verified_event_shot_sample.json" \
            --out "$ROOT/search"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"onoff/search"
          manifest=json.loads((root/"index.json").read_text())
          assert manifest["stats"]["games"]==14
          assert manifest["stats"]["official_five_rows"]>=500
          targets=[(root/(gid+".json"),"gamepulse/fusion/onoff/games/"+gid+".json")
                   for gid in sorted(manifest["games"])]
          targets.append((root/"index.json","gamepulse/fusion/onoff/index.json"))
          for src,where in targets:
              path="repos/timeedmonds-maker/104/contents/"+where
              blob=src.read_bytes()
              existing=subprocess.run(["gh","api",path],capture_output=True,text=True)
              item={"branch":"main","message":"data(2026): preserve independently validated NBA game ONOFF and 5-man denominators",
                    "content":base64.b64encode(blob).decode()}
              if existing.returncode==0:
                  old=json.loads(existing.stdout)
                  if base64.b64decode(old["content"])==blob:continue
                  item["sha"]=old["sha"]
              elif not ("404" in existing.stderr or "Not Found" in existing.stderr):
                  raise RuntimeError("private_onoff_search_lookup_failed")
              put=subprocess.run(["gh","api","-X","PUT",path,"--input","-"],
                  input=json.dumps(item),capture_output=True,text=True)
              if put.returncode:raise RuntimeError("private_onoff_search_write_failed")
              readback=subprocess.run(["gh","api",path],capture_output=True,text=True)
              if readback.returncode:raise RuntimeError("private_onoff_search_readback_failed")
              if hashlib.sha256(base64.b64decode(json.loads(readback.stdout)["content"])).digest()!=hashlib.sha256(blob).digest():
                  raise RuntimeError("private_onoff_search_sha_mismatch")
          print("PRIVATE_2026_OFFICIAL_ONOFF_SEARCH_PUBLISHED",
                json.dumps(manifest["stats"],sort_keys=True))
          PY
      - name: Public workflow has no private data output
        if: always()
        run: echo 'All source results and validation are recorded solely in private 104.' >> "$GITHUB_STEP_SUMMARY"
