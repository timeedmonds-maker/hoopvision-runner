name: Amen 732 stationary Right Above Rim court source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-static-right-above-rim.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: amen732-right-above-rim-source-court
  cancel-in-progress: false
jobs:
  original-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public workflow guard, private source through Git not rate-limited API
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/nba"
          git -C "$RUNNER_TEMP/nba" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo AMEN732_STATIC_RIGHT_ABOVE_RIM_SOURCE_PRIVATE_GIT_PASS
      - name: Original NBA court lines stable across two separate source images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            numpy==1.26.4 opencv-python-headless==4.10.0.84
          cd "$RUNNER_TEMP/nba"
          python3 hoopvision/freeview/amen732_right_above_rim_static_court_source.py --selftest
          python3 hoopvision/freeview/amen732_right_above_rim_static_court_source.py \
            --root hoopvision/freeview/fixtures \
            --out hoopvision/freeview/fixtures/amen732_right_above_rim_original_static_court_QA_20261026.json \
            --jpeg hoopvision/freeview/fixtures/amen732_right_above_rim_original_static_UHD_20261026.jpg
          python3 - <<'PY'
          import json
          p='hoopvision/freeview/fixtures/amen732_right_above_rim_original_static_court_QA_20261026.json'
          q=json.load(open(p))
          assert q['UHD_QA_size']==[3840,2160]
          assert q['source_independent_static_court_line_matches']>=1
          assert not q['metric_KRt_certified']
          print("AMEN732_RIGHT_ABOVE_RIM_ORIGINAL_NBA_COURT_SOURCE_QA_PASS",
                q['native_Hough_candidates'],q['source_independent_static_court_line_matches'])
          PY
      - name: Save private verified source line proof; no public artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/nba"
          git config user.name 'HoopVision native source CPU'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_right_above_rim_original_static_court_QA_20261026.json \
            hoopvision/freeview/fixtures/amen732_right_above_rim_original_static_UHD_20261026.jpg
          git diff --cached --check
          git commit -qm 'qa(freeview): independent source court markings in stationary third camera, UHD original images'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_PRIVATE_THIRD_SOURCE_STATIC_COURT_QA_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
