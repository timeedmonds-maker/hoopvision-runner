name: HoopVision OIDC Request Bridge v5

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional pre-registered random opaque token (req- + 32 lowercase hex)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - bridge_outbox/oidc-trigger.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: hoopvision-public-oidc-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISPATCH_URL: ${{ secrets.HOOPVISION_DISPATCH_URL }}
      DISPATCH_AUDIENCE: ${{ secrets.HOOPVISION_DISPATCH_AUDIENCE }}
    steps:
      - uses: actions/checkout@v4

      - name: Enforce public content boundary
        run: python tools/public_content_guard.py

      - name: Require private gateway configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISPATCH_URL"
          test -n "$DISPATCH_AUDIENCE"

      - name: Resolve random opaque token
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          REQUEST_ID="${INPUT_REQUEST_ID:-}"
          if [ "$EVENT_NAME" = "push" ]; then
            REQUEST_ID="$(python - <<'PY'
          import json,re
          d=json.load(open("bridge_outbox/oidc-trigger.json"))
          if set(d)!={"schema","request_id"} or d.get("schema")!="hoopvision.public-trigger.v1":
              raise SystemExit("invalid public trigger envelope")
          rid=str(d.get("request_id") or "")
          if not re.fullmatch(r"req-[0-9a-f]{32}",rid):
              raise SystemExit("invalid opaque request id")
          print(rid)
          PY
          )"
          elif [ -z "$REQUEST_ID" ]; then
            REQUEST_ID="req-$(python - <<'PY'
          import secrets
          print(secrets.token_hex(16))
          PY
          )"
          fi
          [[ "$REQUEST_ID" =~ ^req-[0-9a-f]{32}$ ]] || exit 2
          echo "REQUEST_ID=$REQUEST_ID" >> "$GITHUB_ENV"

      - name: Obtain short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          AUD="$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["DISPATCH_AUDIENCE"], safe=""))
          PY
          )"
          curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" \
            -o /tmp/oidc.json
          python - <<'PY'
          import json,os
          value=json.load(open("/tmp/oidc.json")).get("value")
          if not isinstance(value,str) or value.count(".")!=2:
              raise SystemExit("OIDC token acquisition failed")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("OIDC_TOKEN="+value+"\n")
          PY
          rm -f /tmp/oidc.json

      - name: Dispatch opaque request to private gateway
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/request.json
          import json,os
          print(json.dumps({"request_id":os.environ["REQUEST_ID"]}, separators=(",",":")))
          PY
          code="$(curl --silent --show-error \
            --output /tmp/response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/request.json \
            "$DISPATCH_URL")"
          unset OIDC_TOKEN
          rm -f /tmp/request.json
          [ "$code" = 202 ] || { echo "Private dispatch rejected"; rm -f /tmp/response.json; exit 4; }
          python - <<'PY'
          import json,os
          d=json.load(open("/tmp/response.json"))
          if set(d) - {"request_id","status"}:
              raise SystemExit("Unexpected response fields")
          if d.get("request_id") != os.environ["REQUEST_ID"] or d.get("status") not in {"ACCEPTED","DUPLICATE_ACCEPTED"}:
              raise SystemExit("Invalid private dispatch response")
          print("PRIVATE_DISPATCH_ACCEPTED")
          PY
          rm -f /tmp/response.json
