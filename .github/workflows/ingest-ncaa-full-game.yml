name: Ingest NCAA Full Game Fixture
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ingest-ncaa-full-game.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Resolve and ingest official NCAA full replay
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.ncaa.com/embed/video/basketball-men%3A2024-03-16%3Atrine-vs-hampden-sydney-2024-ncaa-diii-mens-basketball-championship-full-replay'
          python3 - <<'PY' > hls.txt
          import urllib.request,re,json,html
          url='https://www.ncaa.com/embed/video/basketball-men%3A2024-03-16%3Atrine-vs-hampden-sydney-2024-ncaa-diii-mens-basketball-championship-full-replay'
          H={'User-Agent':'Mozilla/5.0','Referer':'https://www.ncaa.com/'}
          txt=urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=30).read().decode('utf-8','ignore')
          # NCAA embeds JSON-escape media URLs; normalize before extracting.
          norm=txt.replace('\\\\/','/').replace('\\u0026','&')
          urls=re.findall(r'https?[^"\\ ]+?\.m3u8[^"\\< ]*',norm,re.I)
          urls=[html.unescape(x) for x in urls]
          if not urls: raise SystemExit('no HLS URL resolved')
          # Prefer master/highest-level playlist: shortest unique m3u8 URL is generally master.
          u=sorted(set(urls),key=len)[0]
          print(u)
          PY
          HLS="$(cat hls.txt)"
          echo "Resolved official NCAA HLS host: $(python3 -c 'import urllib.parse; print(urllib.parse.urlparse(open("hls.txt").read().strip()).netloc)')"
          ffmpeg -y -v warning -rw_timeout 30000000 \
            -headers $'User-Agent: Mozilla/5.0\r\nReferer: https://www.ncaa.com/\r\n' \
            -i "$HLS" -map 0:v:0 -map 0:a:0? -c copy -movflags +faststart source_native.mp4
          test -s source_native.mp4
          ffprobe -v error -show_entries format=duration,size,format_name,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate -of json source_native.mp4 > ffprobe.json
          SHA="$(sha256sum source_native.mp4 | awk '{print $1}')"
          PREFIX="fixtures/full-game/ncaa-trine-hampden-sydney-2024/sha256/$SHA"
          python3 - "$SHA" "$PREFIX" <<'PY'
          import json,sys,hashlib
          sha,prefix=sys.argv[1:]
          probe=json.load(open('ffprobe.json'))
          json.dump({
            'schema':'hoopvision.full-game-fixture.v1',
            'source':'official_ncaa_embed',
            'source_page':'https://www.ncaa.com/embed/video/basketball-men%3A2024-03-16%3Atrine-vs-hampden-sydney-2024-ncaa-diii-mens-basketball-championship-full-replay',
            'content_sha256':sha,
            'gcs_prefix':'gs://project-d88c48c6-7f48-4c33-928-hoopvision-dev/'+prefix,
            'ffprobe':probe
          },open('fixture_manifest.json','w'),indent=2,sort_keys=True)
          PY
          gcloud storage cp --if-generation-match=0 source_native.mp4 "gs://$BUCKET/$PREFIX/source_native.mp4"
          gcloud storage cp --if-generation-match=0 ffprobe.json "gs://$BUCKET/$PREFIX/ffprobe.json"
          gcloud storage cp --if-generation-match=0 fixture_manifest.json "gs://$BUCKET/$PREFIX/fixture_manifest.json"
          cat fixture_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ncaa-full-game-fixture-manifest
          path: |
            fixture_manifest.json
            ffprobe.json
          retention-days: 14
