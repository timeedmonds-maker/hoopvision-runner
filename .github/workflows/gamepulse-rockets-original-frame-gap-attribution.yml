name: Rockets original SDK frame-window gap attribution (private QA)
# Free GitHub CPU; source frame timestamps and report remain in private 104.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-rockets-original-frame-gap-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rockets-original-frame-window-gap-attribution
  cancel-in-progress: false
jobs:
  private-original-gap-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public repository and private destination
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
          echo PRIVATE_ORIGINAL_SOURCE_EPHEMERAL_ONLY
      - name: Recompute SHA-checked original frame versus official logged-window gaps
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          SCRIPT=gamepulse/fusion/igp_rockets_gap_source_attribution_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261027/rockets_spurs_original_frame_window_gap_attribution_20261028.json
          python3 -m py_compile "$SCRIPT"
          python3 "$SCRIPT" --selftest
          test ! -e "$OUT"
          python3 "$SCRIPT" --root . --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["official_logical_chains"]==200
          assert x["coherent_official_logged_windows"]==192
          assert x["coherent_zero_unique_original_frame_chains"]==18
          assert x["noncoherent_official_logged_windows"]==8
          assert x["physical_possessions_certified"]==0
          assert x["full_gameplay_tracking_certified"] is False
          assert x["original_source_xyz_overwritten"] is False
          assert sum(x["zero_unique_frame_reason_counts"].values())==18
          print("ROCKETS_SOURCE_GAP_QA_ACCEPTED_PRIVATE_ONLY",json.dumps(x["zero_unique_frame_reason_counts"],sort_keys=True))
          PY
      - name: Publish only private source-provenance QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261027/rockets_spurs_original_frame_window_gap_attribution_20261028.json
          git config user.name 'Game Pulse Free CPU QA'
          git config user.email 'gamepulse-integrity@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          git commit -qm "qa(igp): publish original Rockets zero-frame window root-cause categories"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo ROCKETS_SOURCE_GAP_PRIVATE_QA_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          echo PRIVATE_QA_PUSH_FAILED
          exit 13
