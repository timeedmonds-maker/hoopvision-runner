name: "IGP source original 5s alias endpoint and co-occurrence audit"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-original-five-second-alias-continuity.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-five-second-original-actor-alias-physical-continuity
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public boundary and fetch original licensed private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Unit checks reject dual-ID simultaneous original source presence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_original_5s_extra_actor_endpoint_continuity_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_original_5s_extra_actor_endpoint_continuity_v1.py'
      - name: Evaluate exactly 18 actual original SDK extra actor possibilities
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_original_5s_extra_actor_endpoint_continuity_v1.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_native_5s_original_extra_actor_endpoint_continuity_18_v1.json")
          q=json.loads(p.read_bytes())
          assert len(q["candidate_cases"])==18
          assert q["original_source_games"]==36
          assert q["counts"]["hypotheses_evaluated"]==18
          assert q["new_certified_player_ID_aliases"]==0
          assert q["new_certified_physical_possessions"]==0
          assert q["original_sources_modified"] is False
          assert all(c["video_identity_confirmed"] is False for c in q["candidate_cases"])
          print("IGP_REAL_18_EXTRA_ID_ORIGINAL_CONTINUITY_QA_PASS",json.dumps({
             "candidate_source_gaps":18,
             "physically_compatible_without_simultaneous_ID_overlap":q["counts"]["strict_continuity_pass"],
             "simultaneous_2ID_source_contradictions":q["counts"]["overlap_source_IDs_contradict_one_body"],
             "source_coverage_over_90pct":q["counts"]["direct_extra_coverage_over_90pct"],
             "player_aliases_certified_without_video":0},sort_keys=True))
          PY
      - name: Commit private original-source identity hypothesis QA only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_native_5s_original_extra_actor_endpoint_continuity_18_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): 18 original player 5s alternate-ID endpoint overlap source checks"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_FIVE_SECOND_ORIGINAL_SOURCE_ID_CONTINUITY_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$try"
          done
          exit 23
