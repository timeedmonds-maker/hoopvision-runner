name: IGP 3.2 original ball source-grade query private smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-source-grade-query-v2.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source_grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public source privacy guard
        run: python3 tools/public_content_guard.py
      - name: Checkout licensed source in private CPU runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Check source-free unit tests and exact NBA source view
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_v32_original_ball_source_grade_v2.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_original_ball_source_grade_v2.py'
          python3 -m py_compile gamepulse/fusion/igp_v32_allgame_per_actor_source_provenance_v1.py gamepulse/fusion/query_igp_v32_original_ball_per_game_source_grade_v3.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_allgame_per_actor_source_provenance_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_v32_original_ball_per_game_source_grade_v3.py'
          python3 - <<'PY'
          from query_igp_v32_original_ball_source_grade_v2 import query,TRUE
          from query_igp_v32_ball_source_integrity_overlay_v1 import query as old
          gid="0022600001";t=1792529535721
          out=query(".",gid,t,t+200,hz=10)
          control=old(".",gid,t,t+200,hz=10)
          assert len(out["rows"])==len(control["rows"])==3
          assert out["schema"].endswith("ball-grade-v2")
          assert out["accepted_native_and_10hz_scene_completeness_unchanged"]
          assert out["rows"][0]["ball_source_provenance_v2"]["provider_interpolated_original_at_exact_t"]==TRUE
          assert all(a["scene"]==b["scene"] and a["source_original_xyz_native"]==b["source_original_xyz_native"]
                     and a["complete_ten_plus_ball"]==b["complete_ten_plus_ball"]
                     for a,b in zip(out["rows"],control["rows"]))
          assert all(not r["ball_source_provenance_v2"]["physical_ball_accuracy_certified"] for r in out["rows"])
          other=query(".","0022600009",1792809248567,1792809248667,hz=10)
          assert all(r["ball_source_provenance_v2"]["grade"]=="OTHER_GAME_ORIGINAL_BALL_UPSTREAM_UNJOINED" for r in other["rows"])
          print("IGP_V32_ORIGINAL_NBA_BALL_SOURCE_GRADE_V2_QA_PASSED rows_g1=3 unknown_other=2 source_unchanged=1")
          PY
