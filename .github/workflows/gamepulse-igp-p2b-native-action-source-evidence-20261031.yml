# Public CPU runner only. Private NBA original XYZ and play-by-play rows remain in private repo 104.
name: IGP full71 original ten ball near official scorer events
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-native-action-source-evidence-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full71-original-near-action-native-tenball
  cancel-in-progress: true
jobs:
  original-source-qa-0001-then-all71:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source-free exact-ten original evidence tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_all71_action_original_native_500ms_evidence_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_all71_action_original_native_500ms_evidence_v1.py'
      - name: Original NBA game0001 full native official ten and ball source near action
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_all71_action_original_native_500ms_evidence_v1.py \
            --root . --only-game 0022600001 --out "$RUNNER_TEMP/igp-original-native-action-0001.json" \
            >"$RUNNER_TEMP/igp-original-native-action-0001.log" 2>&1 || {
              echo IGP_ORIGINAL_NATIVE_ACTION_0001_QA_FAILED
              python3 - <<'PY'
          import re,os
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"igp-original-native-action-0001.log").read_text(errors="replace").splitlines()
          e=next((s for s in reversed(z) if re.match(r"^(?:ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|ImportError):",s)),None)
          if e:
              k,_,msg=e.partition(":");q=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_PRIVATE_NATIVE_ACTION_PILOT",k,q if re.fullmatch(r"[A-Z_]{6,90}",q) else "REDACTED")
          else:print("IGP_PRIVATE_NATIVE_ACTION_PILOT UNCLASSIFIED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-original-native-action-0001.json").read_bytes())
          c=d["counts"];assert d["games"]==1 and c["actions"]==593 and c["native_within_500ms"]==593
          print("IGP_NATIVE_ORIGINAL_ACTION0001_TENBALL_SOURCE_QA_PASS",c)
          PY
      - name: Original NBA all71 43,419 actions direct ten-plus-ball evidence within 500ms
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_all71_action_original_native_500ms_evidence_v1.py \
            --root . --out "$RUNNER_TEMP/igp-original-native-action-all71.json" \
            >"$RUNNER_TEMP/igp-original-native-action-71.log" 2>&1 || {
              echo IGP_ORIGINAL_NATIVE_ACTION_71_QA_FAILED
              python3 - <<'PY'
          import re,os
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"igp-original-native-action-71.log").read_text(errors="replace").splitlines()
          e=next((s for s in reversed(z) if re.match(r"^(?:ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|ImportError):",s)),None)
          if e:
              k,_,msg=e.partition(":");q=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_PRIVATE_NATIVE_ACTION_ALL71",k,q if re.fullmatch(r"[A-Z_]{6,90}",q) else "REDACTED")
          else:print("IGP_PRIVATE_NATIVE_ACTION_ALL71 UNCLASSIFIED")
          PY
              exit 42
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-original-native-action-all71.json").read_bytes())
          c=d["counts"]
          assert d["games"]==71 and c["actions"]==43419
          assert c["native_within_500ms"]==42753 and c["no_native"]==666
          assert c["native_direct_ten_ball_observed_within_500ms"]<=42753
          print("IGP_ALL71_ORIGINAL_DIRECT_NATIVE_ACTION_EVIDENCE_PASS",c)
          PY
      - name: Commit private original raw and compact QA receipts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"igp-original-native-action-all71.json").read_bytes()
          d=json.loads(raw)
          base=Path("gamepulse/fusion/qa/igp_v32")
          original=base/"igp_v32_p2b_all71_official_action_native_500ms_evidence_v1.json"
          summary=base/"igp_v32_p2b_all71_action_original_native_500ms_summary_20261031.json"
          receipt={"schema":"igp.v32.p2b.71game.original-near-action-tenball-source-qa.summary.v1",
              "full_QA_SHA256":hashlib.sha256(raw).hexdigest(),
              "counts":d["counts"],
              "per_game":{gid:g["counts"] for gid,g in d["per_game"].items()},
              "original_NBA_SDK_PBP_unchanged":True,
              "exact_physical_ball_action_times_certified":0}
          base.mkdir(parents=True,exist_ok=True)
          if original.exists() and original.read_bytes()!=raw:raise ValueError("REFUSE_ORIGINAL_NATIVE_ACTION_QA_REWRITE")
          if summary.exists() and json.loads(summary.read_bytes())!=receipt:
              raise ValueError("REFUSE_ORIGINAL_NATIVE_ACTION_SUMMARY_REWRITE")
          original.write_bytes(raw)
          summary.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\\n")
          print("IGP_FULL71_NATIVE_NEAR_ACTION_RAW_QA_SHA256",receipt["full_QA_SHA256"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_all71_official_action_native_500ms_evidence_v1.json
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_all71_action_original_native_500ms_summary_20261031.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'qa(igp): original NBA native official-ten plus ball evidence near all71 scorer actions'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_FULL71_ORIGINAL_DIRECT_NEAR_ACTION_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
