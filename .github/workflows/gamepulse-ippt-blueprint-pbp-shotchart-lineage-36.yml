name: IPPT published Blueprint vs SHA original NBA PBP legacy shot chart source lineage 36game
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-blueprint-pbp-shotchart-lineage-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  nba-pbp-shotchart-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: 44bfb9d0f59645a273079da54bd4b3166bd7df65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard / source SHA / no private XYZ disclosure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
              "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
              gamepulse/fusion data/extensions/nba_blueprint_2026_27
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free official NBA PBP vs Blueprint XY lineage tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_blueprint_pbp_chart_coordinate_lineage_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_blueprint_pbp_chart_coordinate_lineage_2026.py
      - name: Two NBA original PBP SHA exact-source smoke games
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_blueprint_pbp_chart_coordinate_lineage_2026.py \
              --root . --games 0022600009 0022600092
      - name: All 36 NBA raw PBP SHA matched Blueprint shot-chart fields
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_blueprint_pbp_chart_coordinate_lineage_2026.py \
              --root . --games all36 | tee "$RUNNER_TEMP/ippt_public_pbp_lineage_summary.log"
          echo "IPPT_ALL36_SHA_NBA_PBP_VS_BLUEPRINT_XY_LINEAGE_PASS"
      - name: Publish only aggregate lineage acceptance receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"ippt_public_pbp_lineage_summary.log"
          safe={"github_run_id":os.environ["GITHUB_RUN_ID"],
                "prior_job_status":os.environ["QA_JOB_RESULT"],
                "private_code_sha_expected":"44bfb9d0f59645a273079da54bd4b3166bd7df65"}
          if path.exists():
            lines=[l.partition(" ")[2] for l in path.read_text().splitlines()
              if l.startswith("IPPT_BLUEPRINT_PBP_LEGACY_SHOT_CHART_LINEAGE_QA ")]
            if len(lines)==1:
              obj=json.loads(lines[0])
              safe.update({"schema":obj["schema"],"games":obj["games"],
                 "counts":obj["totals"],"by_shot_type":obj["by_shot_type"],
                 "nba_public_pbp_source_sha_validated":obj["all_public_nba_pbp_raw_SHA_verified"],
                 "not_independent_optical_tracking_accuracy":True})
          (Path(os.environ["RUNNER_TEMP"])/"ippt_nba_pbp_lineage_issue.md").write_text(
             "Aggregate official NBA shot-chart source lineage only (no private XYZ or per-shot coordinates).\n\n~~~json\n"+
             json.dumps(safe,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          gh issue comment 124 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_nba_pbp_lineage_issue.md"

# Original Game Pulse XYZ never accessed; NBA-PBP original source SHA verified before public chart field comparison.
