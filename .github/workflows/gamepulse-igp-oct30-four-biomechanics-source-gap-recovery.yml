name: IGP targeted missing original shot biomechanics 0142 0143 and Blueprint recheck
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-oct30-four-biomechanics-source-gap-recovery.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-20261030-shot-biomechanics-missing-source
  cancel-in-progress: false
jobs:
  native-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {gid: '0022600142', tipoff: '2026-10-29T01:30:00Z', previous: '0'}
          - {gid: '0022600143', tipoff: '2026-10-29T02:30:00Z', previous: '24'}
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      NBA_GAME_ID: ${{ matrix.gid }}
      NBA_TIPOFF_UTC: ${{ matrix.tipoff }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      PREVIOUS_SHOTS: ${{ matrix.previous }}
      IGP_SDK_INIT_TIMEOUT_MS: '40000'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate public guard and install previously approved first-party licensed SDK
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          (cd tools/licensed_feed && npm install --ignore-scripts --no-audit --no-fund --silent)
      - name: Revisit each authorized app program and select strongest genuine original response
        shell: bash
        run: |
          set -euo pipefail
          export IGP_PRIVATE_CAPTURE_DIR="$RUNNER_TEMP/biomechanics-original-best"
          mkdir -p "$IGP_PRIVATE_CAPTURE_DIR"
          for attempt in 1 2; do
            export IGP_PRIVATE_CAPTURE_DIR="$RUNNER_TEMP/biomechanics-attempt-$attempt"
            mkdir -p "$IGP_PRIVATE_CAPTURE_DIR"
            node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/biomechanics-probe-$attempt.log" 2>&1 || true
          done
          python3 - <<'PY'
          import json,os,hashlib,shutil
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          records=[]
          for n in (1,2):
              folder=temp/f'biomechanics-attempt-{n}'
              p=folder/'companion_probe_receipt.json'
              if not p.is_file():continue
              d=json.loads(p.read_bytes())
              assert d['game_id']==os.environ['NBA_GAME_ID']
              assert d['authentication_bypass_attempted'] is False
              records.append((d.get('original_body_shot_details_count',0),n,d,folder))
          assert records,'NO_AUTHORISED_SDK_DIAGNOSTIC_RECEIPT'
          records.sort(key=lambda x:(x[2].get('status')=='FULL_EVENT_RESPONSE_OBSERVED',x[0]),reverse=True)
          shots,n,d,folder=records[0]
          dest=temp/'biomechanics-original-best'
          dest.mkdir(exist_ok=True)
          shutil.copy2(folder/'companion_probe_receipt.json',dest/'companion_probe_receipt.json')
          raw=folder/'companion_original_sdk_response.json'
          if raw.exists():
              body=raw.read_bytes()
              assert hashlib.sha256(body).hexdigest()==d['original_body_sha256']
              assert len(body)==d['original_body_bytes']
              if d['status']=='FULL_EVENT_RESPONSE_OBSERVED':
                  events=json.loads(body)
                  events=events if isinstance(events,list) else events['events']
                  assert len(events)==d['original_body_event_count']
                  assert len([e for e in events if e.get('event')=='ShotDetails#show'])==shots
              shutil.copy2(raw,dest/'companion_original_sdk_response.json')
          print('IGP_AUTHORISED_REPROBE',d['game_id'],
                'source_status',d['status'],'shot_events',shots,
                'prior_shots',os.environ['PREVIOUS_SHOTS'])
          PY
      - name: Preserve immutable originals and save improved source only when observed
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion/evidence/companion_sdk_original_$NBA_GAME_ID gamepulse/fusion/qa/igp_progress_20261030
          cd "$RUNNER_TEMP/private"
          export RECOVERY_DIR="$RUNNER_TEMP/biomechanics-original-best"
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path('gamepulse/fusion')
          gid=os.environ['NBA_GAME_ID']
          prior=int(os.environ['PREVIOUS_SHOTS'])
          data=Path(os.environ['RECOVERY_DIR'])
          rec=json.loads((data/'companion_probe_receipt.json').read_bytes())
          assert rec['game_id']==gid and not rec['authentication_bypass_attempted']
          count=rec.get('original_body_shot_details_count',0)
          better=(rec['status']=='FULL_EVENT_RESPONSE_OBSERVED' and count>prior)
          evid=root/'evidence'/f'companion_sdk_original_{gid}'
          evid.mkdir(parents=True,exist_ok=True)
          if better:
              raw=(data/'companion_original_sdk_response.json').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==rec['original_body_sha256']
              events=json.loads(raw)
              events=events if isinstance(events,list) else events['events']
              new={(str(e.get('metadata',{}).get('playId')),str(e.get('metadata',{}).get('playerId'))) for e in events if e.get('event')=='ShotDetails#show'}
              if gid=='0022600143':
                  old=json.loads((evid/'sdk_observed_original.json').read_bytes())
                  old=old if isinstance(old,list) else old['events']
                  original={(str(e.get('metadata',{}).get('playId')),str(e.get('metadata',{}).get('playerId'))) for e in old if e.get('event')=='ShotDetails#show'}
                  assert original <= new,'REPROBE_DISCARDS_ORIGINAL_KNOWN_SHOT_ACTIONS'
              dest=evid/'sdk_observed_original_recovery_20261030.json'
              if dest.exists():
                  assert hashlib.sha256(dest.read_bytes()).hexdigest()==rec['original_body_sha256']
              else:dest.write_bytes(raw)
          receipt=root/'qa/igp_progress_20261030'/f'igp_original_companion_source_{gid}_recovery_20261030.json'
          receipt.parent.mkdir(parents=True,exist_ok=True)
          rec['targeted_recovery_baseline_shots']=prior
          rec['targeted_recovery_verified_improvement']=bool(better)
          if receipt.exists():
              old=json.loads(receipt.read_bytes())
              assert old['game_id']==gid
              if old.get('targeted_recovery_verified_improvement') and not better:
                  print('IGP_KEEP_PREVIOUSLY_ACCEPTED_BETTER_RECOVERY')
              elif old.get('targeted_recovery_verified_improvement') and better:
                  assert old['original_body_sha256']==rec['original_body_sha256']
              else:receipt.write_text(json.dumps(rec,sort_keys=True,indent=2)+'\n')
          else:receipt.write_text(json.dumps(rec,sort_keys=True,indent=2)+'\n')
          print('IGP_ORIGINAL_SHOT_BIOMECHANICS_RECOVERY',gid,
                'new_original_shots',count,'exceeds_baseline',better)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261030/igp_original_companion_source_${NBA_GAME_ID}_recovery_20261030.json
          if test -e "gamepulse/fusion/evidence/companion_sdk_original_${NBA_GAME_ID}/sdk_observed_original_recovery_20261030.json"; then
            git add -f "gamepulse/fusion/evidence/companion_sdk_original_${NBA_GAME_ID}/sdk_observed_original_recovery_20261030.json"
          fi
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_SOURCE_RECHECK_ALREADY_SAVED; exit 0; fi
          git commit -q -m "qa(igp): SHA source-only biomechanical shot gap recheck $NBA_GAME_ID"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_BIOMECHANICS_RECHECK_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 23
  blueprint-fullgame-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Re-read actual final NBA Blueprint for 0143 and compare original shot identities
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set scripts data/extensions/nba_blueprint_2026_27 gamepulse/fusion/qa/igp_progress_20261030
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from update_nba_blueprint_daily_2026_27 import read_report,canonical
          gid='0022600143'
          root=Path('data/extensions/nba_blueprint_2026_27/games')/gid
          old=json.loads((root/'blueprint_report_raw.json').read_bytes())
          oldshots=old['shot_difficulty']['shotDifficulty']
          assert len(oldshots)==24
          try:
              new,src=read_report(gid)
              fresh=new['shot_difficulty']['shotDifficulty']
              assert new['game_header']['gameStatus']==3
              original={(s['ngssEventId'],s['shooter']['playerId']) for s in oldshots}
              newer={(s['ngssEventId'],s['shooter']['playerId']) for s in fresh}
              assert len(fresh)<=153,'RECHECK_MORE_THAN_OFFICIAL_SHOT_ATTEMPTS'
              assert original <= newer,'RECHECK_SOURCE_CONFLICT_OR_INCOMPLETE'
              expanded=len(fresh)>len(oldshots)
              if expanded:
                  b=canonical(new).encode('utf-8')
                  q=root/'blueprint_report_recovery_20261030.json'
                  if q.exists():assert q.read_bytes()==b
                  else:q.write_bytes(b)
              info={'schema':'igp.0143-final-blueprint-source-recheck.v1',
                    'game_id':gid,'old_original_shots':len(oldshots),
                    'fresh_original_shots':len(fresh),'improved':expanded,
                    'fresh_sha256':hashlib.sha256(canonical(new).encode()).hexdigest(),
                    'source':'NBA_BLUEPRINT_FIRST_PARTY_REPORT',
                    'old_report_immutable':True,'raw_29joint_pose_60hz_present':False}
          except Exception as exc:
              info={'schema':'igp.0143-final-blueprint-source-recheck.v1',
                    'game_id':gid,'old_original_shots':len(oldshots),
                    'recheck_error_type':type(exc).__name__,
                    'recheck_error':str(exc)[:160],
                    'improved':False,'old_report_immutable':True}
          p=Path('gamepulse/fusion/qa/igp_progress_20261030/igp_0143_final_blueprint_recheck_20261030.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          if not p.exists():p.write_text(json.dumps(info,sort_keys=True,indent=2)+'\n')
          print('IGP_0143_OFFICIAL_BLUEPRINT_RECHECK',info.get('old_original_shots'),
                info.get('fresh_original_shots'),info['improved'],
                info.get('recheck_error_type','NO_ERROR'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261030/igp_0143_final_blueprint_recheck_20261030.json
          test ! -f data/extensions/nba_blueprint_2026_27/games/0022600143/blueprint_report_recovery_20261030.json || git add -f data/extensions/nba_blueprint_2026_27/games/0022600143/blueprint_report_recovery_20261030.json
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_BLUEPRINT_RECHECK_ALREADY_SAVED; exit 0; fi
          git commit -q -m 'qa(igp): recheck official finalized 0143 shot features without original overwrite'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_BLUEPRINT_RECHECK_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 23
