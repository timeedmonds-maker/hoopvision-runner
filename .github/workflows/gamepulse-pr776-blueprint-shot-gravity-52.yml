name: PR776 52-game original NBA Blueprint shot defender gravity release indexed QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-blueprint-shot-gravity-52.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-blueprint-52-native-defender-gravity
  cancel-in-progress: false
jobs:
  private-original-source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public confidentiality guard and licensed private source access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/blueprint-private"
          git -C "$RUNNER_TEMP/blueprint-private" sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_blueprint_release_leaderboard_2026.py' \
            '/gamepulse/fusion/igp_blueprint_native_shot_gravity_2026.py' \
            '/gamepulse/fusion/query_igp_blueprint_native_shot_gravity_2026.py' \
            '/gamepulse/fusion/tests/test_igp_blueprint_native_shot_gravity_2026.py' \
            '/gamepulse/fusion/tests/test_igp_blueprint_release_leaderboard_2026.py' \
            '/data/extensions/nba_blueprint_2026_27/games/'
          git clone -q --filter=blob:none --depth=1 --sparse -b main \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/blueprint-official-pbp"
          git -C "$RUNNER_TEMP/blueprint-official-pbp" sparse-checkout set --no-cone \
            '/gamepulse/fusion/official_pbp_timing/games/'
          echo "BLUEPRINT_ROOT=$RUNNER_TEMP/blueprint-private" >> "$GITHUB_ENV"
          echo "PBP_ROOT=$RUNNER_TEMP/blueprint-official-pbp" >> "$GITHUB_ENV"
      - name: Run source-free exact Blueprint release and gravity/defender tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$BLUEPRINT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_blueprint_release_leaderboard_2026.py \
            gamepulse/fusion/igp_blueprint_native_shot_gravity_2026.py \
            gamepulse/fusion/query_igp_blueprint_native_shot_gravity_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_blueprint_native_shot_gravity_2026.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_blueprint_release_leaderboard_2026.py'
          echo BLUEPRINT_SOURCE_FREE_NATIVE_SHOT_DEFENDER_GRAVITY_TESTS_PASS
      - name: Build all 52 native shots, all original featured gravity metrics and full release rankings
        shell: bash
        run: |
          set -euo pipefail
          cd "$BLUEPRINT_ROOT"
          OUT=gamepulse/fusion/materialized/igp_blueprint_native_52_20261028/blueprint_native.sqlite
          QA=gamepulse/fusion/qa/igp_progress_20261028/blueprint_native_shot_defender_gravity_52_v1.json
          test ! -e "$OUT" && test ! -e "$QA"
          python3 gamepulse/fusion/igp_blueprint_native_shot_gravity_2026.py \
             --root . --pbp-root "$PBP_ROOT" --out "$OUT" --qa "$QA" \
             --expected-games 52 --min-3pa 20
          python3 - "$QA" "$OUT" <<'PY'
          import json,sqlite3,sys
          from pathlib import Path
          q=json.loads(Path(sys.argv[1]).read_text())
          c=q["counts"]
          assert q["games"]==52 and len(q["original_sources"])==52
          assert c["native_3pa"]==3715 and c["native_valid_3pa_release"]==3705
          assert c["zero_releases"]>=10
          assert c["identical_duplicates"]==1
          assert c["exact_official_3pa"]==3688
          assert c["exact_official_valid_release"]==3682
          assert q["native_qualifying_players"]==51
          assert q["official_pbp_exact_qualifying_players"]==49
          assert q["native_three_leaderboard"][0]["player"]=="Reed Sheppard"
          assert q["native_three_leaderboard"][0]["three_point_attempts"]==24
          assert q["featured_game_player_gravity_rows"]+2*c.get("gravity_modules_missing",0)==104
          assert q["original_tracking_XYZ_modified"] is False
          assert q["historical_hybrid_sources_modified"] is False
          with sqlite3.connect(sys.argv[2]) as con:
              assert con.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert con.execute("SELECT count(*) FROM source_games").fetchone()[0]==52
              assert con.execute("SELECT count(*) FROM native_shots WHERE shot_type='3pt'").fetchone()[0]==3715
              assert con.execute("SELECT count(*) FROM game_featured_gravity").fetchone()[0]==q["featured_game_player_gravity_rows"]
              assert con.execute("SELECT count(*) FROM native_shots WHERE blueprint_defender_id IS NOT NULL").fetchone()[0]>7000
          print("BLUEPRINT_52_SOURCE_ACCEPTED_COUNTS",json.dumps({
            "source_games":q["games"],"original_3pa":c["native_3pa"],
            "exact_nba_3pa":c["exact_official_3pa"],
            "shot_rows":q["native_shot_rows"],
            "defender_gravity_game_player_rows":q["featured_game_player_gravity_rows"],
            "native_qualifying":q["native_qualifying_players"],
            "official_exact_qualifying":q["official_pbp_exact_qualifying_players"]
          },sort_keys=True))
          PY
      - name: Read-only indexed user query smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd "$BLUEPRINT_ROOT"
          DB=gamepulse/fusion/materialized/igp_blueprint_native_52_20261028/blueprint_native.sqlite
          python3 gamepulse/fusion/query_igp_blueprint_native_shot_gravity_2026.py \
            --db "$DB" --kind shots --player 1642263 --shot-type 3pt --limit 1 > "$RUNNER_TEMP/private-shot-query.json"
          python3 gamepulse/fusion/query_igp_blueprint_native_shot_gravity_2026.py \
            --db "$DB" --kind gravity --team HOU --limit 1 > "$RUNNER_TEMP/private-gravity-query.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          shot=json.loads((p/"private-shot-query.json").read_text())
          gravity=json.loads((p/"private-gravity-query.json").read_text())
          assert len(shot)==1 and shot[0]["shooter_id"]==1642263
          assert len(gravity)==1 and gravity[0]["team"]=="HOU"
          assert gravity[0]["overall_gravity"] is not None
          assert shot[0]["blueprint_defender_id"] is not None
          print("BLUEPRINT_PLAYER_DEFENDER_GRAVITY_INDEX_QUERY_PASS")
          PY
      - name: Commit private-only validated SQLite search layer and provenance QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$BLUEPRINT_ROOT"
          OUT=gamepulse/fusion/materialized/igp_blueprint_native_52_20261028/blueprint_native.sqlite
          QA=gamepulse/fusion/qa/igp_progress_20261028/blueprint_native_shot_defender_gravity_52_v1.json
          git config user.name "NBA Blueprint private source integration"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT" "$QA"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -qm "data(gamepulse): accept 52 native Blueprint shot defender release and featured gravity SQLite"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin HEAD:refs/heads/"$BRANCH"; then
              echo BLUEPRINT_52_NATIVE_SHOT_DEFENDER_GRAVITY_SQLITE_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          echo PRIVATE_BLUEPRINT_INDEX_PUSH_FAILED >&2
          exit 14
