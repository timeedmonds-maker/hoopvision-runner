name: Game Pulse Blueprint private fusion searchable x-man warehouse
# 2026-10-26: original SDK season catch-up from 28 to 36 verified archived games, keep private source and old scientific gates.
# Recheck SHA-safe GitHub private archive writes and ON/OFF WOWY source-gated PPP.
# Public runner CPU only. Licensed XYZ and all generated outputs go exclusively
# to PRIVATE 104 Releases; no public artifacts or data-bearing logs.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-private-blueprint-fusion.yml']
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-private-blueprint-fusion
  cancel-in-progress: false
jobs:
  build-private-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check confidentiality guard and private repository
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN" || { echo 'PRIVATE_FUSION_CREDENTIAL_UNAVAILABLE'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Gate on verified 36-game original SDK catalog; do not rebuild earlier validated snapshot
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27-auto-refresh-provisional.json?ref=main' --jq .content | base64 -d > "$RUNNER_TEMP/season36-catalog.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/index.json?ref=main' --jq .content | base64 -d > "$RUNNER_TEMP/season36-existing.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          cat=json.loads((root/"season36-catalog.json").read_text())
          old=json.loads((root/"season36-existing.json").read_text())
          expected=set(["0022600104","0022600105","0022600106","0022600107","0022600108","0022600109","0022600110","0022600111"])
          assert cat["season"]=="2026-27" and cat["game_count"]==36
          assert len(cat["games"])==36 and expected.issubset(cat["games"])
          assert all(g["index_state"]=="VERIFIED_ARCHIVE_INDEX" and g.get("source_signature")
                     for g in cat["games"].values()), "UNCERTIFIED_ARCHIVE_IN_CATALOG"
          assert set(old["games"]).issubset(cat["games"]) and len(old["games"])>=28, "EXISTING_INDEX_NOT_PRESERVED"
          print("36_GAME_PRIVATE_SOURCE_GATE_PASSED",len(old["games"]),"existing",len(cat["games"]),"verified")
          with open(os.environ["GITHUB_OUTPUT"],"a") as handle:
              handle.write("needed="+("false" if len(old["games"])==36 else "true")+"\n")
          PY
      - name: Download private integration code and run synthetic tests
        if: steps.ready.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gamepulse-fusion"
          mkdir -p "$ROOT/tests"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/build.py?ref=main' --jq .content |
            base64 -d > "$ROOT/build.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_fusion.py?ref=main' --jq .content |
            base64 -d > "$ROOT/tests/test_fusion.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27-auto-refresh-provisional.json?ref=main' --jq .content |
            base64 -d > "$ROOT/gamepulse-catalog.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/materialize.py?ref=main' --jq .content |
            base64 -d > "$ROOT/materialize.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_materialize.py?ref=main' --jq .content |
            base64 -d > "$ROOT/tests/test_materialize.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/onoff_ppp.py?ref=main' --jq .content |
            base64 -d > "$ROOT/onoff_ppp.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_onoff_ppp.py?ref=main' --jq .content |
            base64 -d > "$ROOT/tests/test_onoff_ppp.py"
          python3 -m py_compile "$ROOT/build.py" "$ROOT/materialize.py" "$ROOT/onoff_ppp.py"
          python3 -m unittest discover -v -s "$ROOT/tests"
      - name: Build private event xFG XYZ and x-man search warehouse
        if: steps.ready.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gamepulse-fusion"
          python3 "$ROOT/build.py" build --catalog "$ROOT/gamepulse-catalog.json" \
            --out "$ROOT/gamepulse-fusion.sqlite3"
          python3 - <<'PY'
          import json,os,sqlite3
          from pathlib import Path
          folder=Path(os.environ["RUNNER_TEMP"])/"gamepulse-fusion"
          db=sqlite3.connect(folder/"gamepulse-fusion.sqlite3")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          games=db.execute("SELECT COUNT(*) FROM games").fetchone()[0]
          rows=db.execute("SELECT COUNT(*) FROM frames").fetchone()[0]
          assert games==36 and rows>900000
          assert db.execute("SELECT COUNT(*) FROM lineups_xman WHERE x BETWEEN 1 AND 5").fetchone()[0]>0
          db.close()
          report=json.loads((folder/"gamepulse-fusion.sqlite3.manifest.json").read_text())
          assert report["game_count"]==games and len(report["game_coverage"])==36
          assert report["total_frames"]==rows
          assert report["canonical_source_verified"]>=14, "ORIGINAL_14_BLUEPRINT_SOURCE_LOST"
          assert report["canonical_source_deferred"]<=games-14, "ORIGINAL_14_BLUEPRINT_SOURCE_DEFERRED"
          assert report["blueprint_game_count"]>=14, "ORIGINAL_14_BLUEPRINT_SHOTS_MISSING"
          assert report["games_with_gravity"]>=14, "ORIGINAL_14_BLUEPRINT_GRAVITY_NOT_INDEXED"
          assert report["games_with_leverage"]>=14, "ORIGINAL_14_BLUEPRINT_LEVERAGE_NOT_INDEXED"
          assert report["gravity_heatmaps"]>=84, "ORIGINAL_14_BLUEPRINT_SPATIAL_GRIDS_INCOMPLETE"
          print("PRIVATE_FUSION_WAREHOUSE_VALIDATED_NO_DATA_IN_PUBLIC_LOG")
          PY
      - name: Upload SQLite and QA to private 104 Release and verify SHA
        if: steps.ready.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gamepulse-fusion"
          gzip -n -c "$ROOT/gamepulse-fusion.sqlite3" > "$ROOT/gamepulse-fusion.sqlite3.gz"
          cp "$ROOT/gamepulse-fusion.sqlite3.manifest.json" "$ROOT/manifest.json"
          TAG='gamepulse-fusion-2026-27'
          gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1 ||
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title 'Private Blueprint Game Pulse searchable warehouse' \
              --notes 'Observed tracking and 1-5 man lineups, Blueprint exact event and coarse/precise xFG; PBP nearby timing not shot-release-certified.' --latest=false >/dev/null
          gh release upload "$TAG" "$ROOT/gamepulse-fusion.sqlite3.gz" "$ROOT/manifest.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          export ROOT
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          folder=Path(os.environ["ROOT"])
          response=subprocess.run(["gh","api","repos/timeedmonds-maker/104/releases/tags/gamepulse-fusion-2026-27"],
                                  capture_output=True,text=True,check=True)
          assets={a["name"]:a for a in json.loads(response.stdout)["assets"]}
          for name in ("gamepulse-fusion.sqlite3.gz","manifest.json"):
              digest=assets.get(name,{}).get("digest")
              assert digest=="sha256:"+hashlib.sha256((folder/name).read_bytes()).hexdigest(), \
                  "private_remote_sha_readback_discrepancy"
          print("PRIVATE_FUSION_RELEASE_SHA_VERIFIED")
          PY
      - name: Materialize private GitHub-native game and x-man search views
        if: steps.ready.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gamepulse-fusion"
          python3 "$ROOT/materialize.py" --db "$ROOT/gamepulse-fusion.sqlite3" \
            --out "$ROOT/search-views"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gamepulse-fusion/search-views"
          manifest=json.loads((root/"index.json").read_text())
          assert manifest["schema"]=="gamepulse.blueprint-chat-search.v1"
          assert len(manifest["games"])==36 and "0022600111" in manifest["games"]
          assert manifest["contains_raw_XYZ"] is False
          files=[(root/(gid+".json"),entry["path"])
                 for gid,entry in sorted(manifest["games"].items())]
          files.append((root/"index.json","gamepulse/fusion/index/index.json"))
          for src,path in files:
              blob=src.read_bytes()
              target="repos/timeedmonds-maker/104/contents/"+path
              before=subprocess.run(["gh","api",target],capture_output=True,text=True)
              data={"branch":"main","message":"chore(gamepulse): refresh private searchable Blueprint and x-man index"}
              if before.returncode==0:
                  old=json.loads(before.stdout)
                  current=base64.b64decode(old["content"])
                  if hashlib.sha256(current).digest()==hashlib.sha256(blob).digest():
                      continue
                  data["sha"]=old["sha"]
              elif before.returncode!=1:
                  raise RuntimeError("private_search_view_lookup_failed")
              data["content"]=base64.b64encode(blob).decode()
              res=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                                 input=json.dumps(data),text=True,capture_output=True)
              if res.returncode: raise RuntimeError("private_search_view_write_failed")
          print("PRIVATE_SEARCH_VIEWS_PUBLISHED_NO_RAW_XYZ")
          PY
      - name: Compute ON OFF WOWY and certified-possession PPP only from verified sources
        if: steps.ready.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gamepulse-fusion"
          python3 "$ROOT/onoff_ppp.py" build --db "$ROOT/gamepulse-fusion.sqlite3" --out "$ROOT/onoff"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gamepulse-fusion/onoff"
          m=json.loads((root/"index.json").read_text())
          assert m["schema"]=="gamepulse.2026-27-onoff-ppp.v1"
          assert len(m["games"])==36 and "0022600111" in m["games"]
          assert m["xman_onoff_rows"]>=11104
          assert m["native_5v5_samples"]>=144442
          assert m["no_fabrication"] is True
          for gid,entry in m["games"].items():
              view=json.loads((root/(gid+".json")).read_text())
              assert len(view["lineups"])==entry["records"]
              for row in view["lineups"]:
                  assert (row["on_samples"]+row["off_samples"]+row["mixed_samples"]
                          == row["eligible_samples"])
                  assert row["offensive_ppp_on"] is None or entry["certified_possessions"]>0
          files=[(root/(gid+".json"),entry["path"]) for gid,entry in sorted(m["games"].items())]
          files.append((root/"index.json","gamepulse/fusion/tracking_onoff/index.json"))
          for src,path in files:
              target="repos/timeedmonds-maker/104/contents/"+path
              existing=subprocess.run(["gh","api",target],capture_output=True,text=True)
              payload={"branch":"main","message":"data(gamepulse): certified-source ON/OFF PPP search view",
                       "content":base64.b64encode(src.read_bytes()).decode()}
              if existing.returncode==0:
                  old=json.loads(existing.stdout)
                  if hashlib.sha256(base64.b64decode(old["content"])).digest()==hashlib.sha256(src.read_bytes()).digest():
                      continue
                  payload["sha"]=old["sha"]
              elif "404" not in existing.stderr and "Not Found" not in existing.stderr:
                  raise RuntimeError("private_onoff_lookup_failed")
              result=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                  input=json.dumps(payload),capture_output=True,text=True)
              if result.returncode:
                  error=result.stderr
                  if "409" in error or "Conflict" in error or "422" in error:
                      import time
                      time.sleep(2)
                      before=subprocess.run(["gh","api",target],capture_output=True,text=True)
                      if before.returncode==0:
                          payload["sha"]=json.loads(before.stdout)["sha"]
                      result=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                                            input=json.dumps(payload),capture_output=True,text=True)
                  if result.returncode:
                      print("ONOFF_PRIVATE_PUBLISH_REJECTED",path,
                            "status", "conflict" if "409" in result.stderr else
                            "too_large" if "422" in result.stderr else "other")
                      raise RuntimeError("private_onoff_publish_failed")
          print("PRIVATE_ONOFF_WOWY_INDEX_VERIFIED_NO_INVENTED_POSSESSION_PPP")
          PY
      - name: Commit summary pointer to private 104 only
        if: steps.ready.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          folder=Path(os.environ["RUNNER_TEMP"])/"gamepulse-fusion"
          m=json.loads((folder/"manifest.json").read_text())
          state={
            "schema":"gamepulse.fusion-search-status.v1",
            "updated_at_utc":datetime.now(timezone.utc).isoformat(),
            "release_tag":"gamepulse-fusion-2026-27",
            "games":m["game_count"],
            "blueprint_games":m["blueprint_game_count"],
            "blueprint_shots":m["blueprint_shot_rows"],
            "shots":m["total_shots"],
            "tracking_frames":m["total_frames"],
            "exact_5v5_frames":m["exact_5v5_frames"],
            "xman_index_rows":m["xman_rows"],
            "event_world_candidates_not_release_certified":m["nearby_qualified_candidates"],
            "confidence_notice":"Source archive verified; no certified shot-release/camera synchronization"
          }
          target="repos/timeedmonds-maker/104/contents/gamepulse/fusion/status.json"
          previous=subprocess.run(["gh","api",target],capture_output=True,text=True)
          payload={"message":"chore(gamepulse): update private Blueprint x-man search status",
                   "branch":"main","content":base64.b64encode((json.dumps(state,indent=2)+"\n").encode()).decode()}
          if previous.returncode==0:
              saved=json.loads(previous.stdout)
              previous_status=json.loads(base64.b64decode(saved["content"]))
              for key in ("official_pbp_verified_games","nba_provider_onoff_verified_games",
                          "official_pbp_index","nba_provider_onoff_index",
                          "original_source_onoff_qa","independently_certified_full_possession_chains",
                          "possession_qa_state"):
                  if key in previous_status and key not in state:
                      state[key]=previous_status[key]
              payload["content"]=base64.b64encode((json.dumps(state,indent=2)+"\n").encode()).decode()
              payload["sha"]=saved["sha"]
          elif previous.returncode!=1:raise RuntimeError("private_status_lookup_failed")
          result=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                                input=json.dumps(payload),capture_output=True,text=True)
          if result.returncode:raise RuntimeError("private_status_commit_failed")
          print("PRIVATE_FUSION_STATUS_COMMITTED")
          PY
