name: Probe Alternate Single-L4 G2 Shapes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-alternate-l4-shapes.yml']

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  INSTANCE: hv-l4-shape-probe
  RUNTIME_SA: hoopvision-worker@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: List G2 shapes and probe alternate one-L4 allocations
        shell: bash
        run: |
          set -euo pipefail
          echo "=== G2 SHAPES BY ZONE ==="
          for Z in asia-southeast1-a asia-southeast1-b asia-southeast1-c; do
            echo "--- $Z"
            gcloud compute machine-types list --zones "$Z" --project "$PROJECT_ID"               --filter='name~^g2-standard-' --format='table(name,guestCpus,memoryMb)' || true
          done

          RESULT=""
          # Probe small-to-large shapes. Successful probe is deleted immediately.
          for SHAPE in g2-standard-4 g2-standard-8 g2-standard-12 g2-standard-16; do
            for Z in asia-southeast1-a asia-southeast1-b asia-southeast1-c; do
              echo "=== PROBE $SHAPE $Z ==="
              set +e
              gcloud compute instances create "$INSTANCE"                 --project "$PROJECT_ID" --zone "$Z" --machine-type "$SHAPE"                 --image-family common-cu129-ubuntu-2204-nvidia-580                 --image-project deeplearning-platform-release                 --boot-disk-type pd-balanced --boot-disk-size 50GB                 --service-account "$RUNTIME_SA" --scopes cloud-platform                 --maintenance-policy TERMINATE --no-restart-on-failure                 --max-run-duration 10m --instance-termination-action DELETE                 --quiet > /tmp/probe.log 2>&1
              RC=$?
              set -e
              cat /tmp/probe.log
              if test "$RC" -eq 0; then
                echo "L4_SHAPE_AVAILABLE=$SHAPE zone=$Z"
                gcloud compute instances describe "$INSTANCE" --zone "$Z" --project "$PROJECT_ID"                   --format='yaml(name,status,zone,machineType,guestAccelerators)'
                gcloud compute instances delete "$INSTANCE" --zone "$Z" --project "$PROJECT_ID" --delete-disks=all --quiet || true
                RESULT="$SHAPE@$Z"
                break 2
              fi
              if grep -Eqi 'invalid.*machine type|does not exist|not found|not supported' /tmp/probe.log; then
                echo "L4_SHAPE_UNSUPPORTED=$SHAPE zone=$Z"
                break
              fi
            done
          done
          if test -z "$RESULT"; then
            echo "L4_ALTERNATE_SHAPE_RESULT=NO_CAPACITY"
          else
            echo "L4_ALTERNATE_SHAPE_RESULT=AVAILABLE $RESULT"
          fi
