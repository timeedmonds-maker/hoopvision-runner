name: IGP 68 game original-source 12 slate SHA index QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gamepulse-igp-post56-oct28-unified-qa.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-post56-oct28-private-source-sha-qa
  cancel-in-progress: false
jobs:
  private-index-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce private source only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/games
      - name: Source-backed readbacks all twelve new games and one frozen historic game
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_unified_2026_27_season_v1.py gamepulse/fusion/query_igp_post56_oct28_additive_v1.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from query_igp_unified_2026_27_season_v1 import query
          base=Path("gamepulse/fusion")
          idx=json.loads((base/"materialized/igp_2026_27_unified_season_v3/index.json").read_bytes())
          add=json.loads(Path(idx["post56_additive_oct28"]["index"]).read_bytes())
          games=[f"0022600{i:03d}" for i in range(132,144)]
          assert len(idx["per_game_model"])==idx["official_games"]==56
          assert idx["total_indexed_games_including_additive"]==68
          assert set(games)==set(add["games"]) and add["unified_total_after_append"]==68
          total_actions=0;orig_xyz=0;comp_matched=0;shots=0
          for gid in games:
            rec=add["games"][gid]
            p=Path(rec["official_pbp_path"])
            assert hashlib.sha256(p.read_bytes()).hexdigest()==rec["official_pbp_sha256"], gid
            a=json.loads(p.read_bytes())["actions"]
            assert len(a)==rec["official_pbp_actions"],gid
            total_actions+=len(a)
            if rec.get("original_xyz_manifest"):
              native=json.loads(Path(rec["original_xyz_manifest"]).read_bytes())
              assert native["game_id"]==gid and native["original_archive_part_count_verified"]==13
              assert native["original_frame_counts"]["unique_original_native_timestamps"]==rec["original_native_timestamps"]
              orig_xyz+=1
            if rec.get("original_companion_shot_crosswalk"):
              cross=json.loads(Path(rec["original_companion_shot_crosswalk"]).read_bytes())
              assert cross["game_id"]==gid and len(cross["shot_events"])==rec["original_companion_shots_count"]
              comp_matched+=sum(s["official_join_status"]=="MATCHED_OFFICIAL_FGA_SHOOTER" for s in cross["shot_events"])
              shots+=len(cross["shot_events"])
            first=a[0]["nba_action_number"]
            out=query(".",gid,action_number=first,include_positions=False)
            assert out["game_id"]==gid and out["unified_season_total_games"]==68 and not out["physical_custody_certified"]
            assert out["model_tracking"]=="OMITTED_ON_REQUEST"
          assert orig_xyz==1 and shots==168 and comp_matched==167
          hou=query(".","0022600138",action_number=7,include_positions=False)
          feat=hou["original_companion_shot"]
          assert feat["status"]=="ORIGINAL_SHA_VERIFIED_MATCHED_OFFICIAL_SHOOTER"
          assert len(feat["source_features"])==30
          assert feat["published_exp_field_goal_pct"] is not None
          assert feat["defensive_info"] is not None and feat["shot_release_info"] is not None
          assert not feat["physical_release_certified"] and hou["model_tracking"]=="OMITTED_ON_REQUEST"
          prior=query(".","0022600009",action_number=7,include_positions=False)
          assert prior["game_id"]=="0022600009"
          assert prior["all_official_field_goal_attempts_indexed"]==10003
          assert prior["source_status"]=="PRESERVED_ACCEPTED_36_MODEL"
          assert not prior["physical_custody_certified"]
          result={"schema":"igp.post56-oct28-12game-original-source-query-QA.v1",
             "base_games_preserved":56,"new_games_official_source_SHA_verified":12,
             "combined_games_indexed":68,"new_official_actions_SHA_verified":total_actions,
             "new_games_full_native_13part_source_sha_indexed":orig_xyz,
             "new_games_original_companion_shot_events":shots,
             "new_game_original_companion_official_shooter_matched":comp_matched,
             "source_verified_0138_shot_30features":True,
             "frozen_existing_game_0009_regression":True,
             "unmeasured_11_games_raw_native_not_promoted":True,
             "physical_custody_certified":False,
             "no_historical_data_rebuilt":True}
          dest=base/"qa/igp_progress_20261030/igp_oct28_twelve_game_additive_68_season_query_qa_v1.json"
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("IGP_68_UNIFIED_SOURCE_SHA_READBACK_PASS",json.dumps(result,sort_keys=True))
          PY
      - name: Persist immutable private-source QA only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261030/igp_oct28_twelve_game_additive_68_season_query_qa_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_68_QA_UNCHANGED; exit 0; fi
          git commit -q -m 'qa(igp): certify Oct28 twelve-game official-source additive readbacks'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_68_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 23
