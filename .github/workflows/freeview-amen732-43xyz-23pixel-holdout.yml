name: Amen 732 43-XYZ 23-pixel camera holdout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-43xyz-23pixel-holdout.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: amen732-private-xyz-camera-holdout
  cancel-in-progress: false
jobs:
  measured-real-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public files and clone private evidence with git only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          git clone --quiet --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo AMEN732_PRIVATE_SOURCE_GIT_ONLY_ACCESS_PASS
      - name: Execute real original-camera holdouts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            numpy==1.26.4 scipy==1.14.1 opencv-python-headless==4.10.0.84
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH="$PWD/hoopvision/freeview"
          python3 hoopvision/freeview/amen732_extended_ball_fit_eval.py --selftest
          python3 hoopvision/freeview/amen732_extended_ball_fit_eval.py \
            --source hoopvision/freeview/fixtures/amen732_original_recapture_43_three_actor_xyz_20261026.json \
            --original-pixels hoopvision/freeview/fixtures/amen732_source_rgb_ball_witnesses_manual_v1.json \
            --extended-pixels hoopvision/freeview/fixtures/amen732_native_ball_pixels_extended_v2_20261026.json \
            --output hoopvision/freeview/fixtures/amen732_43xyz_23pixels_camera_holdout_20261026.json
          python3 - <<'PY'
          import json
          p='hoopvision/freeview/fixtures/amen732_43xyz_23pixels_camera_holdout_20261026.json'
          j=json.load(open(p))
          assert j["summary"]["extended_pixels"]==23
          assert j["summary"]["original_pixels"]==13
          assert j["source_ball_xyz_count"]==43
          assert j["summary"]["heldout_frames"]==6
          assert not j["same_frame_metric_camera_certified"]
          assert not j["first_hand_ball_contact_certified"]
          print('AMEN732_REAL_SOURCE_HELDOUT_QA_PASS',j["summary"])
          PY
      - name: Commit measured result only to private 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'HoopVision original-source CPU'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_43xyz_23pixels_camera_holdout_20261026.json
          git diff --cached --check
          git commit -qm 'qa(freeview): 43 real SDK positions, 23 video ball pixels, six independent heldout projections'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_PRIVATE_CAMERA_HOLDOUT_SOURCE_QA_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
