name: Game Pulse 0075 defensive pair microtrajectory (private result)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rockets-pnr-0075-gamepulse-review.yml'
  pull_request:
    paths:
      - '.github/workflows/rockets-pnr-0075-gamepulse-review.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: rockets-pnr-0075-private-review
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
  private-0075-analysis:
    needs: preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Extract complete 0075 frame microtrajectory and save private result only
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || exit 3
          gh api repos/timeedmonds-maker/104/contents/gamepulse/coverage/pnr_detector_v0.py --jq .content | base64 -d > /tmp/pnr_detector_v0.py
          gh api repos/timeedmonds-maker/104/contents/gamepulse/coverage/pnr_0075_tracking_deepreview.py --jq .content | base64 -d > /tmp/pnr_0075_tracking_deepreview.py
          python3 -m py_compile /tmp/pnr_detector_v0.py /tmp/pnr_0075_tracking_deepreview.py
          python3 /tmp/pnr_0075_tracking_deepreview.py --selftest
          python3 /tmp/pnr_0075_tracking_deepreview.py
          rm -f /tmp/pnr_detector_v0.py /tmp/pnr_0075_tracking_deepreview.py
