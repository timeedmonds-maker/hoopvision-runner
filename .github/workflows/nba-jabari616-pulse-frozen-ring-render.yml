# Runs on free public GitHub-hosted CPU. Source, media and results always remain in private 104.
name: Jabari 616 Pulse Frozen Ball Handler Video Render
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-jabari616-pulse-frozen-ring-render.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jabari616-frozen-render
  cancel-in-progress: false
jobs:
  frozen-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      YOLO_CONFIG_DIR: ${{ runner.temp }}/yolo-config
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed public workflow privacy boundary
        run: |
          python3 - <<'PY'
          from tools.public_content_guard import scan
          path=".github/workflows/nba-jabari616-pulse-frozen-ring-render.yml"
          errors=scan([path])
          if errors:
              print("FROZEN_PULSE_PUBLIC_PRIVACY_CHECK_FAIL",len(errors))
              raise SystemExit(3)
          print("FROZEN_PULSE_PUBLIC_PRIVACY_CHECK_PASS")
          PY
      - name: Execute source-backed frozen ring compositor on CPU
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_AUTH_MISSING'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_616_dynamic_ball_handler_render.py?ref=main' --jq .content | base64 -d > "$ROOT/render.py"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --disable-pip-version-check -q 'ultralytics==8.3.228' 'scipy>=1.11,<2' 'numpy<2' 'opencv-python-headless<4.11'
          python3 "$ROOT/render.py"
