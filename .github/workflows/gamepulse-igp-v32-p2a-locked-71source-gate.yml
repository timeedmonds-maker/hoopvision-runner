# Trusted original NBA QA only, no source XYZ in public logs or artifacts.
name: IGP 3.2 P2A locked 71 game DEV VAL 500ms source gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-p2a-locked-71source-gate.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-locked-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify original 71 private QA SHA and prelocked source proxy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
             -p 'test_igp_v32_p2a_source_holdout_locked_gate_v1.py'
          python3 gamepulse/fusion/igp_v32_p2a_71game_source_holdout_locked_gate_v1.py \
             --root . --out "$RUNNER_TEMP/p2a-locked-private.json" \
             > "$RUNNER_TEMP/p2a-private.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'p2a-locked-private.json').read_bytes())
          assert q['schema']=='igp.v32.p2a.71game.source-proxy-dev-val-locked-release-gate.v1'
          assert q['production_promoted_new_scenes']==0
          assert q['research_challenger_complete_10hz']==1016498
          assert q['research_increment']==14187
          assert all(q['measured_dev_val'][c+'_'+k]['measured']['tested']>0
              for c in ('DEV','VAL') for k in ('single_r250_cap500','two_r250_cap500'))
          print('IGP_P2A_71GAME_LOCKED_SOURCE_ONLY_GATE',json.dumps({
              'research_increment':q['research_increment'],
              'locked_source_proxy_pass':q['source_proxy_analytics_shadow_gate_passed'],
              'production_new_positions':0},sort_keys=True))
          PY
      - name: Commit locked validation gate receipt privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          file=gamepulse/fusion/qa/igp_v32/igp_v32_p2a_locked_71game_source_holdout_gate_v1.json
          cp "$RUNNER_TEMP/p2a-locked-private.json" "$file"
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$file"
          git diff --cached --check
          git commit -q -m 'qa(igp): lock all71 500ms source masked DEV VAL eligibility only; no physical promotion'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P2A_LOCKED_DEV_VAL_SOURCE_GATE_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
