name: IGP 2027 NBA team player and 2-to-5 lineup possession consistency probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-2027-player-team-lineup-possession-consistency-probe.yml']
permissions: {contents: read}
jobs:
  official-public-mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download original NBA sourced 2027 advanced team and player parquet
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m pip -q install duckdb
          python3 - <<'PY'
          from pathlib import Path
          import os,urllib.request,hashlib
          p=Path(os.environ["RUNNER_TEMP"])
          for name in ("team_game_logs","player_game_logs","game_rotations"):
              url=f"https://basketball-data.billmill.org/nba/stats/{name}/season=2027/data.parquet"
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"IGP-audit-2027/1.0"}),timeout=20) as f:
                  raw=f.read(25000001)
              assert 100 < len(raw) <25000000 and raw[:4]==b"PAR1" and raw[-4:]==b"PAR1"
              (p/(name+".parquet")).write_bytes(raw)
              print("IGP_PUBLIC_ADVANCED_MIRROR_PROVENANCE",name,len(raw),hashlib.sha256(raw).hexdigest())
          PY
      - name: Test NBA direct team-vs-player total oncourt possessions plus rotation minute validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,duckdb,json,collections
          p=Path(os.environ["RUNNER_TEMP"])
          d=duckdb.connect()
          for name in ("team_game_logs","player_game_logs","game_rotations"):
              d.execute(f"CREATE VIEW {name} AS SELECT * FROM read_parquet('{p/(name+'.parquet')}')")
          rows=d.execute("""
            SELECT t.game_id, t.team_id,t.pts, t.poss,
                   count(p.player_id) AS player_rows,
                   sum(coalesce(p.poss,0))::INT AS player_poss_sum,
                   count(*) FILTER(WHERE p.poss=0) AS player_zero_poss,
                   sum(p.min) AS player_minutes,
                   sum(p.plus_minus)::INT AS pm_sum
            FROM team_game_logs t
            LEFT JOIN player_game_logs p USING(game_id,team_id)
            WHERE t.game_id LIKE '00226%'
            GROUP BY 1,2,3,4 ORDER BY 1,2
          """).fetchall()
          c=collections.Counter();ds=[]
          for gid,tid,pts,poss,n,s,zero,mins,pm in rows:
              dlt=s-5*poss
              ds.append({"game":gid,"team_id":tid,"points":pts,"NBA_team_POSS":poss,
                "sum_NBA_player_POSS":s,"5x_team_POSS":5*poss,
                "player_poss_minus_5x_team_POSS":dlt,"NBA_player_rows":n,
                "sum_player_minutes":round(mins,2) if mins is not None else None})
              c["team_games"]+=1;c["exact_fivefold_sum"]+=int(dlt==0);c["delta_pos"]+=int(dlt>0)
              c["delta_neg"]+=int(dlt<0);c["delta_abs"]+=abs(dlt)
              c["max_abs_delta"]=max(c["max_abs_delta"],abs(dlt))
              c["player_rows"]+=n
              if gid in ("0022600009","0022600146"):print("IGP_PUBLIC_PLAYER_TEAM_POSS_EXAMPLE",json.dumps(ds[-1],sort_keys=True))
          rot=d.execute("""
            SELECT r.game_id,r.team_id,r.player_id,
                   sum(r.out_time-r.in_time)/60 AS stint_minutes,
                   max(p.min) AS player_minutes,
                   count(*) as stints
            FROM game_rotations r
            JOIN player_game_logs p USING(game_id,team_id,player_id)
            WHERE r.game_id LIKE '00226%'
            GROUP BY 1,2,3
          """).fetchall()
          mr=[{"g":g,"tid":tid,"pid":pid,"stint":stint,"player":player,"diff":stint-player}
              for g,tid,pid,stint,player,n in rot if abs(stint-player)>0.04]
          print("IGP_PUBLIC_PLAYER_5X_TEAM_POSS_ALL_SEASON",json.dumps(c,sort_keys=True))
          print("IGP_PUBLIC_ROTATION_MATCHED_PLAYER_STINT_MINUTES",json.dumps({
              "matched_players":len(rot),"minute_diffs_over_0point04":len(mr),
              "examples":mr[:6]},sort_keys=True))
          print("IGP_PUBLIC_POSS_MOST_DISAGREED",json.dumps(sorted(ds,key=lambda x:abs(x["player_poss_minus_5x_team_POSS"]),reverse=True)[:12],sort_keys=True))
          PY
      - name: Independent official NBA 2-5 lineup API bounded source-availability test
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          # One actual Rockets 2026-10-20 game; season/date/team/period scope explicit.
          params={"Conference":"","DateFrom":"10/20/2026","DateTo":"10/20/2026",
              "Division":"","GameSegment":"","GroupQuantity":5,"LastNGames":0,
              "LeagueID":"00","Location":"","MeasureType":"Advanced","Month":0,
              "OpponentTeamID":0,"Outcome":"","PORound":0,"PaceAdjust":"N",
              "PerMode":"Totals","Period":0,"PlusMinus":"N","Rank":"N",
              "Season":"2026-27","SeasonSegment":"","SeasonType":"Regular Season",
              "ShotClockRange":"","TeamID":"1610612745","VsConference":"","VsDivision":""}
          url="https://stats.nba.com/stats/leaguedashlineups?"+urllib.parse.urlencode(params)
          headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Referer":"https://www.nba.com/","Origin":"https://www.nba.com",
              "x-nba-stats-origin":"stats","x-nba-stats-token":"true","Accept":"application/json"}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=7) as f:
                  raw=f.read(2000000)
              d=json.loads(raw)
              line=next((x for x in d.get("resultSets",[]) if x.get("name")=="Lineups"),{})
              headers=line.get("headers",[])
              print("IGP_NBA_OFFICIAL_LINEUP_ENDPOINT_K5_ACCESSIBLE",json.dumps({
                  "rows":len(line.get("rowSet",[])),"has_POSS":"POSS" in headers,"fields":headers[:52]}))
          except Exception as e:
              print("IGP_NBA_OFFICIAL_LINEUP_ENDPOINT_K5_UNAVAILABLE",type(e).__name__)
          PY
