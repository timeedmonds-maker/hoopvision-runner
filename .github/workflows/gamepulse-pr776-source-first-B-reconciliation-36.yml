name: PR776 source-first Model B accounting reconciliation original 36
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-source-first-B-reconciliation-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-source-first-B-slot-reconciliation
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard and hydrate SHA-frozen private acceptance manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH"             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Verify source-free conservation tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_tracking_source_first_B_reconciliation_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests             -p 'test_igp_tracking_source_first_B_reconciliation_2026.py' -v
      - name: Reconcile immutable original direct XYZ and approved Model B all 36
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_source_first_B_slot_reconciliation_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_tracking_source_first_B_reconciliation_2026.py             --root . --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          t=j["totals"]
          assert j["games_checked"]==36
          assert t["native_frames"]==1203986 and t["strict_frames"]==412619
          assert t["raw_missing_player_slots"]==t["B_recovered_player_slots"]+t["B_unsupported_player_slots"]
          assert t["B_covered_player_slots"]+t["B_unsupported_player_slots"]==t["official_ten_player_slots"]
          print("SOURCE_FIRST_B_FROZEN_ACCEPTANCE",json.dumps({
            "games":36,"direct":t["direct_original_player_slots"],
            "recovered_B":t["B_recovered_player_slots"],
            "unknown_B":t["B_unsupported_player_slots"],
            "full_ten_direct_ball":t["B_full_ten_and_direct_ball_frames"],
            "slot_coverage_pct":j["accepted_B_official_player_slot_coverage_pct"]
          },sort_keys=True))
          PY
      - name: Commit only new private aggregate reconciliation receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_source_first_B_slot_reconciliation_36_v1.json
          git config user.name "Game Pulse Free CPU Source QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): reconcile all original official slots with Model B reconstruction"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PR776_SOURCE_FIRST_B_QA_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
