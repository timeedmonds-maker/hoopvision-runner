name: PR776 NBA UTC to original native possession acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-wallclock-native-possession-query.yml'
permissions: {contents: read}
concurrency:
  group: pr776-wallclock-native-possession-query
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and use canonical existing private code and original SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Run code and source-free crossover tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_wallclock_native_possession_query_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_igp_wallclock_native_possession_query_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_igp_native_boundary_lookup_2026.py
      - name: Real-data original XYZ by wallclock chain and native source interval
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261027/wallclock_native_possession_query_acceptance_20261027.json
          test ! -e "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          from igp_wallclock_native_possession_query_2026 import inspect
          cases=(
              ("0022600001","0022600001-P1-C0006"),
              ("0022600099","0022600099-P3-C0129"),
              ("0022600009","0022600009-P1-C0003"))
          rows=[]
          for game,chain in cases:
              x=inspect(".",game,chain,include_xyz=False,limit=3)
              candidate=x["native_interval_frames"]
              rows.append({"game_id":game,"chain":chain,
                "original_UTC_chain_frames":x["logged_UTC_assigned_original_frames"],
                "direct_ten_and_ball":x["logged_UTC_direct_ten_plus_ball_frames"],
                "native_interval_status":x["native_source_interval_state"],
                "native_source_frames":candidate["original_source_frames"] if candidate else None,
                "native_overlap_grades":candidate["graded_counts"] if candidate else {},
                "source_sha256":x["source_sha256"],
                "certified_physical_possessions":0})
          assert rows[0]["native_interval_status"]=="TWO_NATIVE_EVENT_PROPOSALS_NOT_PHYSICAL_CERTIFICATION"
          assert rows[0]["native_source_frames"] and rows[0]["native_source_frames"]>0
          assert rows[1]["native_interval_status"]=="TWO_NATIVE_EVENT_PROPOSALS_NOT_PHYSICAL_CERTIFICATION"
          assert rows[1]["native_source_frames"] and rows[1]["native_source_frames"]>0
          assert all(r["original_UTC_chain_frames"]>0 for r in rows)
          record={"schema":"gamepulse.wallclock-native-possession-real-source-acceptance.v1",
                  "three_real_source_cases":rows,
                  "native_UTC_is_the_NBA_player_time_axis":True,
                  "physical_possessions_certified":0}
          p=Path(sys.argv[1]);p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(record,indent=2,sort_keys=True)+"\n")
          print("NBA_WALLCLOCK_NATIVE_POSSESSION_REAL_SOURCE_ACCEPTED",
            json.dumps([{"game":r["game_id"],
                         "logged_frames":r["original_UTC_chain_frames"],
                         "native_interval_frames":r["native_source_frames"],
                         "grades":r["native_overlap_grades"]}
                         for r in rows],sort_keys=True))
          PY
      - name: Preserve private QA and source lineage on existing PR
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261027/wallclock_native_possession_query_acceptance_20261027.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          git commit -q -m "data(igp): accept wallclock-first original XYZ native possession crossover"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_WALLCLOCK_NATIVE_POSSESSION_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 19
