name: PR776 NBA UTC to original native possession acceptance
# Security-reviewed in tools/public_content_guard.py; private source and output only.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-wallclock-native-possession-query.yml'
permissions: {contents: read}
concurrency:
  group: pr776-wallclock-native-possession-query
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and use canonical existing private code and original SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Test existing native query and 36-game materializer
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_wallclock_season_frame_index_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_wallclock_season_frame_index_2026.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_wallclock_native_possession_query_2026.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_original_xyz_timeactual_chain_join_36_2026.py'
      - name: Join all 36 SHA-verified original tracking games to official NBA UTC chains
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/materialized/igp_wallclock_native_frame_possession_36_v1
          if [ ! -e "$OUT" ]; then
            python3 gamepulse/fusion/igp_wallclock_season_frame_index_2026.py --root . --out-dir "$OUT"
          fi
          python3 - "$OUT" <<'PY'
          import sys,hashlib,json
          from pathlib import Path
          p=Path(sys.argv[1]);idx=json.loads((p/"index.json").read_text())
          s=idx["counts"]
          assert idx["source_games"]==36 and len(idx["games"])==36
          assert s["source_frames"]==1203986
          assert s["source_direct_ball_frames"]==912704
          assert s["source_exact_ten_ball_frames"]==387956
          assert s["unique_NBA_UTC_frames"]==1031792
          assert s["ambiguous_NBA_UTC_frames"]==28799
          assert s["unassigned_NBA_UTC_frames"]==143395
          assert s["source_frames"]==sum(v for k,v in s.items() if k.startswith("grade_"))
          assert not idx["physical_possessions_certified"] and idx["original_xyz_not_copied"]
          assert all(hashlib.sha256((p/g["file"]).read_bytes()).hexdigest()==g["sha256"]
                     for g in idx["games"].values())
          n=sum(g["native_two_event_proposal_intervals"] for g in idx["games"].values())
          assert n>0
          print("NBA_36_GAME_UTC_TRACKING_INDEX_SOURCE_ACCEPTED",
                json.dumps({"source_frames":s["source_frames"],"source_games":36,
                 "unique_NBA_UTC_frames":s["unique_NBA_UTC_frames"],
                 "native_candidate_intervals":n,
                 "grade_counts":{k:v for k,v in s.items() if k.startswith("grade_")},
                 "certified_physical_possessions":0},sort_keys=True))
          PY
      - name: Test new original-frame NBA chain/action/team/player search
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_wallclock_season_frame_index_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_query_igp_wallclock_season_frame_index_2026.py'
          python3 - <<'PY'
          import json
          from pathlib import Path
          from query_igp_wallclock_season_frame_index_2026 import query
          from igp_wallclock_season_frame_index_2026 import BASE
          idx=json.loads((BASE/'materialized/igp_wallclock_native_frame_possession_36_v1/index.json').read_bytes())
          cases=[
           ('0022600001','0022600001-P1-C0006',144,141,3),
           ('0022600099','0022600099-P3-C0129',58,54,4),
           ('0022600009','0022600009-P1-C0003',89,0,0)]
          results=[]
          for game,cid,expected_logged,expected_native,expected_conflicts in cases:
              a=query(Path('.'),game,chain_id=cid,mode='logged',limit=1)
              n=query(Path('.'),game,chain_id=cid,mode='native',limit=1)
              assert a['query']['matching_frames']>=expected_logged
              assert n['query']['matching_frames']==expected_native
              grade=n['query']['graded_counts']
              assert grade.get('NATIVE_VS_NBA_LOGGED_CHAIN_CONFLICT',0)==expected_conflicts
              action=a['source_NBA_chain_matches'][0]['NBA_official_action_numbers'][0]
              byaction=query(Path('.'),game,action_number=action,limit=1)
              assert byaction['source_NBA_chain_matches'][0]['NBA_chain_id']==cid
              results.append(dict(game_id=game,chain_id=cid,
                  NBA_logged_window_frames=a['query']['matching_frames'],
                  original_native_candidate_frames=n['query']['matching_frames'],
                  cross_owner_candidate_frames=expected_conflicts,
                  actual_action_checked=action))
          # Every accepted original game has an independently SHA checked,
          # searchable original-frame pointer, including newer games.
          checked=0
          for gid,g in sorted(idx['games'].items()):
              chain=next((cid for cid,c in g['nba_chain_unique_source_frame_counts'].items()
                          if c>0),None)
              assert chain is not None
              x=query(Path('.'),gid,chain_id=chain,limit=1)
              assert x['query']['matching_frames']>=g['nba_chain_unique_source_frame_counts'][chain]
              checked+=1
          # Real private original player+ball XYZ read-back from the existing
          # SHA-pinned source, not in the public Actions summary.
          xyz=query(Path('.'),'0022600009',chain_id='0022600009-P1-C0003',
                    limit=1,include_original_xyz=True)
          assert xyz['private_original_chain_XYZ']['returned_original_xyz']
          assert xyz['private_original_chain_XYZ']['total_unique_source_original_frames']==89
          out=BASE/'qa/igp_progress_20261027/wallclock_season_private_query_acceptance.json'
          receipt={'schema':'gamepulse.wallclock-36-original-query-acceptance.v1',
                   'all_games_metadata_search_checked':checked,
                   'three_real_source_chain_cases':results,
                   'original_private_source_XYZ_readback':True,
                   'full_source_frame_index_sha256':xyz['private_frame_index_sha256'],
                   'physical_possessions_certified':0}
          if out.exists():
              assert json.loads(out.read_text())==receipt
          else:
              out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+chr(10))
          print('NBA_36_GAME_PRIVATE_CHAIN_SEARCH_ACCEPTED',
                json.dumps({'games':checked,'cases':results,'original_XYZ_readback':True,
                            'physical_possessions_certified':0},sort_keys=True))
          PY
      - name: Verify NBA official ten-player roster against actual private XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/accept_igp_wallclock_official_ten_2026.py
          python3 gamepulse/fusion/accept_igp_wallclock_official_ten_2026.py --root .
      - name: Quantify all original native versus NBA logged possession owner conflicts
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_native_owner_conflict_triage_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_native_owner_conflict_triage_2026.py'
          python3 gamepulse/fusion/igp_native_owner_conflict_triage_2026.py \
            --root . --out gamepulse/fusion/qa/igp_progress_20261027/wallclock_native_owner_conflict_triage_36.json
      - name: Stratify NBA scorer UTC vs original native physical-candidate transitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_native_transition_event_context_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_native_transition_event_context_2026.py'
          python3 gamepulse/fusion/igp_native_transition_event_context_2026.py \
            --root . \
            --out gamepulse/fusion/qa/igp_progress_20261027/wallclock_native_transition_event_context_36.json
      - name: Preserve private original source pointer index on canonical PR
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          OUT=gamepulse/fusion/materialized/igp_wallclock_native_frame_possession_36_v1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git add -f gamepulse/fusion/qa/igp_progress_20261027/wallclock_season_private_query_acceptance.json
          git add -f gamepulse/fusion/qa/igp_progress_20261027/wallclock_official_ten_private_source_acceptance.json
          git add -f gamepulse/fusion/qa/igp_progress_20261027/wallclock_native_owner_conflict_triage_36.json
          git add -f gamepulse/fusion/qa/igp_progress_20261027/wallclock_native_transition_event_context_36.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 0 || test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 37
            git commit -q -m "data(igp): materialize 36-game NBA UTC original tracking frame index"
          fi
          for i in 1 2 3 4 5 6 7; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo NBA_36_GAME_WALLCLOCK_ORIGINAL_FRAME_INDEX_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 19
