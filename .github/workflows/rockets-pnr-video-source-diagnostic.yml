name: Rockets PNR xFG provider video delivery diagnostic (private report)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rockets-pnr-video-source-diagnostic.yml'
  pull_request:
    paths:
      - '.github/workflows/rockets-pnr-video-source-diagnostic.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: rockets-pnr-provider-video-probe
  cancel-in-progress: true
jobs:
  public-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
  private-provider-probe:
    needs: public-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Test bounded provider HTTP headers/media signatures and persist private results
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || exit 3
          gh api repos/timeedmonds-maker/104/contents/gamepulse/coverage/probe_nba_shot_video_delivery.py --jq .content | base64 -d > /tmp/probe_nba_shot_video_delivery.py
          python3 -m py_compile /tmp/probe_nba_shot_video_delivery.py
          python3 /tmp/probe_nba_shot_video_delivery.py --selftest
          python3 /tmp/probe_nba_shot_video_delivery.py
          rm -f /tmp/probe_nba_shot_video_delivery.py

      - name: Probe real event MP4 decoding and scoreboard-to-source clock, private QA only
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || exit 3
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          gh api repos/timeedmonds-maker/104/contents/gamepulse/fusion/rockets_video_clock_probe.py --jq .content | base64 -d > "$WORK/rockets_video_clock_probe.py"
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install --disable-pip-version-check -q imageio-ffmpeg
          "$WORK/venv/bin/python" -m py_compile "$WORK/rockets_video_clock_probe.py"
          "$WORK/venv/bin/python" "$WORK/rockets_video_clock_probe.py" --selftest
          "$WORK/venv/bin/python" "$WORK/rockets_video_clock_probe.py"

      - name: Inspect owner-supplied complete-game video metadata, no media download
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          python3 -m venv "$WORK/venv"
          if ! "$WORK/venv/bin/pip" install --disable-pip-version-check -q yt-dlp; then
            echo 'FULL_GAME_METADATA_EXTRACTOR_INSTALL_UNAVAILABLE'
          fi
          gh api repos/timeedmonds-maker/104/contents/gamepulse/fusion/fullgame_source_probe_20261023.py --jq .content | base64 -d > "$WORK/probe.py"
          "$WORK/venv/bin/python" "$WORK/probe.py" --selftest
          "$WORK/venv/bin/python" "$WORK/probe.py"

      - name: Inspect original SHA-backed 510-action event/world archive and test video join code
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/tests"
          ROOT='repos/timeedmonds-maker/104/contents/gamepulse/fusion'
          for f in possession_video.py possession_touch_video_search.py possession_touch_query.py inspect_rockets_pbp_for_video_sync.py; do
            gh api "$ROOT/$f" --jq .content | base64 -d > "$WORK/$f"
          done
          for f in test_possession_video_2026.py test_possession_touch_query_2026.py; do
            gh api "$ROOT/tests/$f" --jq .content | base64 -d > "$WORK/tests/$f"
          done
          python3 -m py_compile "$WORK/"*.py
          PYTHONPATH="$WORK:$WORK/tests" python3 -m unittest discover -s "$WORK/tests" -p 'test_possession*2026.py' -v
          python3 "$WORK/inspect_rockets_pbp_for_video_sync.py"
