name: Rockets official NBA PBP event-clock validation
# Formal NBA play-by-play is the only authoritative game/event clock.
# No third-party game replays, media OCR, video downloads or inferred PTS.
# Private QA and exact event indexes publish only to PRIVATE 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rockets-pnr-video-source-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: rockets-official-nba-event-timing
  cancel-in-progress: false
jobs:
  public-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
  official-nba-timing:
    needs: public-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Validate NBA official action, period, game clock, timeActual and official boxscore
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_OFFICIAL_SOURCE_ACCESS_UNAVAILABLE'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timestamps_2026.py?ref=main' --jq .content | base64 -d > "$WORK/official_nba.py"
          python3 -m py_compile "$WORK/official_nba.py"
          python3 "$WORK/official_nba.py" --selftest
          python3 "$WORK/official_nba.py" --game 0022600091
          echo 'NBA_FORMAL_EVENT_CLOCK_QA_PRIVATE_ONLY'
