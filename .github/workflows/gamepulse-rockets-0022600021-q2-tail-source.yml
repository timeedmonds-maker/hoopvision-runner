name: Rockets Dallas full Q2 tail SDK immutable source completion
# Licensed NBA original positions never leave the private 104 Releases.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-0022600021-q2-tail-source.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  q2-tail:
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        block: [8,9]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BLOCK: ${{ matrix.block }}
      GAME_ID: '0022600021'
      GAME_TIPOFF_UTC: '2026-10-31T00:00:00Z'
      GAMEPULSE_LIVE_ELAPSED_FASTLANE: 'true'
      TAG: gamepulse-firsthalf-sdk-0022600021
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify privacy, authorized NBA SDK and original eight preserved
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          test -n "$GH_TOKEN"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          (cd tools/licensed_feed && npm install --ignore-scripts --no-audit --no-fund --silent)
      - name: Capture two ten-minute mature original SDK tail intervals
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q2-tail"
          node --input-type=module <<'JS'
          import {capture} from './tools/licensed_feed/capture.mjs';
          import {planGame} from './tools/licensed_feed/season_core.mjs';
          import {readFileSync,writeFileSync,copyFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const gid=process.env.GAME_ID,block=Number(process.env.BLOCK),s=Date.parse(process.env.GAME_TIPOFF_UTC);
          const plan=planGame({id:gid,start:s});
          const from=plan.begin+block*600000;
          const j={game_id:gid,account_id:'nba',program_id:'companion-'+gid+'-positions',
              part:Math.floor((from-plan.begin)/(300*5000)),start_ms:from,count:120};
          const d=process.env.RUNNER_TEMP+'/q2-tail';
          await capture(j,d);
          const m=JSON.parse(readFileSync(d+'/manifest.json','utf8'));
          if(m.game_id!==gid||m.start_ms!==from||m.successful_windows!==120||
             m.observed!==true||m.imputed!==false)throw Error('Q2_TAIL_SOURCE_MISSING');
          const name='firsthalf-block-'+block;
          const blob=readFileSync(d+'/checkpoint.tar.gz');
          copyFileSync(d+'/checkpoint.tar.gz',d+'/'+name+'.tar.gz');
          const sha=createHash('sha256').update(blob).digest('hex');
          writeFileSync(d+'/'+name+'.json',JSON.stringify({...m,archive_sha256:sha,
             window_end_ms:from+600000,original_sdk_immutable:true})+'\n');
          console.log('Q2_TAIL_ORIGINAL_BLOCK',block,'NATIVE',m.unique_keyframes,
              'PLAYERS',m.frames_with_players,'BALL',m.frames_with_ball);
          JS
      - name: Archive recovered original Q2 tail only in private repository
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/q2-tail/firsthalf-block-$BLOCK.tar.gz" \
             "$RUNNER_TEMP/q2-tail/firsthalf-block-$BLOCK.json" \
             --repo timeedmonds-maker/104 --clobber
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          b=os.environ['BLOCK'];root=Path(os.environ['RUNNER_TEMP'])/'q2-tail'
          src=json.loads((root/('firsthalf-block-'+b+'.json')).read_text())
          r=json.loads(subprocess.check_output(['gh','api',
             'repos/timeedmonds-maker/104/releases/tags/'+os.environ['TAG']]))
          a={x['name']:x for x in r['assets']}
          assert a['firsthalf-block-'+b+'.tar.gz']['digest']=='sha256:'+src['archive_sha256']
          print('PRIVATE_ORIGINAL_Q2_TAIL_SHA_CONFIRMED',b)
          PY
