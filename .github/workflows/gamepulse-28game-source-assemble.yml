name: Game Pulse official event sources 36-game private catch-up
# Preserve frozen source QA; publish truthful partial coverage when providers omit current-game data.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-28game-source-assemble.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Game Pulse 28-game official PBP and ONOFF verification']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: verified-private-28game-pbp-onoff-index-materialization
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public runner, materialize only source-verified native NBA indexes privately
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          python3 tools/licensed_feed/official_pbp_onoff_28.py assemble

  oct24-official-pbp:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch verified private 36-game catalog and frozen NBA event parser
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          mkdir -p "$RUNNER_TEMP/official36"
          SOURCE_SHA=$(gh api repos/timeedmonds-maker/104/git/ref/heads/main --jq .object.sha)
          test "${#SOURCE_SHA}" -eq 40
          for src in official_pbp_allgames_2026.py official_pbp_timestamps_2026.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$src?ref=$SOURCE_SHA" --jq .content | base64 -d > "$RUNNER_TEMP/official36/$src"
          done
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27-auto-refresh-provisional.json?ref=$SOURCE_SHA" --jq .content | base64 -d > "$RUNNER_TEMP/official36/catalog.json"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json?ref=$SOURCE_SHA" --jq .content | base64 -d > "$RUNNER_TEMP/official36/previous.json"
          python3 -m py_compile "$RUNNER_TEMP/official36/"*.py
          python3 "$RUNNER_TEMP/official36/official_pbp_timestamps_2026.py" --selftest
      - name: Validate eight official NBA game scores, full PBP actions and private SHA readback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"official36"
          sys.path.insert(0,str(root))
          from official_pbp_allgames_2026 import certify_game
          from official_pbp_timestamps_2026 import publish
          cat=json.loads((root/"catalog.json").read_text())
          prev=json.loads((root/"previous.json").read_text())
          gids=["0022600104","0022600105","0022600106","0022600107",
                "0022600108","0022600109","0022600110","0022600111"]
          assert cat["game_count"]==36 and len(cat["games"])==36
          assert prev["game_count"]==28 and len(prev["games"])==28, "ORIGINAL_PBP_28_SNAPSHOT_UNEXPECTED"
          assert set(prev["games"]).isdisjoint(gids) and all(g in cat["games"] for g in gids)
          out=dict(prev["games"])
          for gid in gids:
              expected=cat["games"][gid]
              assert expected["index_state"]=="VERIFIED_ARCHIVE_INDEX"
              game=certify_game(gid,[expected["away_team"],expected["home_team"]])
              assert game["qa"]["nba_score_reconciled_to_boxscore"] is True
              assert len(game["actions"])>=300
              assert game["official_final"]["home"]["team"]==expected["home_team"]
              assert game["official_final"]["away"]["team"]==expected["away_team"]
              assert all(a["possession_start_end_certified"] is False for a in game["actions"])
              path=f"gamepulse/fusion/official_pbp_timing/games/{gid}.json"
              disposition=publish(game,path)
              out[gid]={"game_id":gid,"state":game["state"],
                  "action_records":len(game["actions"]), "source_file":path,
                  "source_pbp_sha256":game["source_provenance"]["nba_pbp_sha256"],
                  "official_final":game["official_final"],"video_pts_certified":0,
                  "disposition":disposition}
              print("NBA_OFFICIAL_24OCT_VERIFIED",gid,"actions",len(game["actions"]),
                    "source_sha",game["source_provenance"]["nba_pbp_sha256"][:12])
          assert set(out)==set(cat["games"]) and len(out)==36
          marker={"schema":"gamepulse.formal-nba-official-event-clock-36game.v1",
              "season":"2026-27","through_us_game_date":"2026-10-24",
              "game_count":36,"complete_36":True,"games":out,
              "catalog_sha256":hashlib.sha256((root/"catalog.json").read_bytes()).hexdigest(),
              "prior_index_game_count":28,
              "possession_boundary_time_certified":False,
              "shot_release_video_sync_certified":False,
              "source_policy":"Official NBA action clocks and PBP scores; no SDK physical-possession certification"}
          dest="gamepulse/fusion/official_pbp_timing/index-2026-27-through-20261024.json"
          print("PRIVATE_36GAME_EVENT_INDEX",publish(marker,dest))
          # Keep existing 28-game strict-crosswalk consumer pinned until the
          # separate 36-game native interaction index has been rebuilt.
          print("NBA_OFFICIAL_36_EVENT_SOURCES_ACCEPTED",len(out),
                "native_physical_possessions_certified",0)
          PY
