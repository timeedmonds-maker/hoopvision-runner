name: Integrated Pulse 36-game official overtime-safe lineup acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-official-36game-expansion.yml','tools/public_content_guard.py']
permissions:
  contents: read
concurrency:
  group: private-gamepulse-36-official-lineup-rebuild
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public-private boundary and clone canonical Git history without REST API
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/git-askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *Password*) printf '%s\n' "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/git-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/git-askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse \
            --branch "$BRANCH" "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private104"
          git -C "$RUNNER_TEMP/private104" sparse-checkout set gamepulse/fusion
          git -C "$RUNNER_TEMP/private104" fetch -q --depth=1 origin main:refs/remotes/origin/main
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private104" >> "$GITHUB_ENV"
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Replay 8 NEW official NBA PBP, roster and independent provider 5-man sets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          import collections,hashlib,json,subprocess
          from pathlib import Path
          from official_lineup_clock_intervals_2026 import build,SCHEMA
          def show(branch,path):
              return subprocess.check_output(['git','show',branch+':'+path],stderr=subprocess.DEVNULL)
          old_index_path=Path('gamepulse/fusion/official_lineup_clock/index.json')
          index=json.loads(old_index_path.read_bytes())
          assert len(index['games'])==28 and index['stats']['accepted_games']==28
          old_paths={g:v['sha256'] for g,v in index['games'].items()}
          source_index=json.loads(show('origin/main','gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json'))
          provider_index=json.loads(show('origin/main','gamepulse/fusion/onoff/index-2026-27-expanded.json'))
          assert source_index.get('complete_36') is True and provider_index.get('complete_36') is True
          assert set(source_index['games'])==set(provider_index['games'])
          ids=sorted(set(source_index['games'])-set(index['games']))
          assert ids==['0022600'+str(x) for x in range(104,112)],ids
          output=Path('gamepulse/fusion/official_lineup_clock/games')
          intervals=0
          for gid in ids:
              entry=source_index['games'][gid]
              pbpraw=show('origin/main',entry['source_file'])
              pbp=json.loads(pbpraw)
              assert pbp['game_id']==gid
              assert pbp['source_provenance']['nba_pbp_sha256']==entry['source_pbp_sha256']
              prov_path='gamepulse/fusion/onoff/games/'+gid+'.json'
              provraw=show('origin/main',prov_path)
              provider=json.loads(provraw)
              assert hashlib.sha256(provraw).hexdigest()==provider_index['games'][gid]['sha256']
              roster_path='gamepulse/fusion/index/games/'+gid+'.json'
              rosterraw=show('origin/main',roster_path)
              roster=json.loads(rosterraw)
              doc=build(pbp,provider,roster)
              assert doc['qa']['physical_possessions_certified']==0
              assert all(len(row['teams'])==2 and all(len(players)==5 for players in row['teams'].values())
                         for row in doc['lineup_intervals'])
              doc['source_provenance']['input_sha256']={
                  'pbp':hashlib.sha256(pbpraw).hexdigest(),
                  'provider':hashlib.sha256(provraw).hexdigest(),
                  'roster':hashlib.sha256(rosterraw).hexdigest()}
              raw=(json.dumps(doc,sort_keys=True,separators=(',',':'))+'\n').encode()
              dest=output/(gid+'.json')
              assert not dest.exists(),'DO_NOT_OVERWRITE_VALIDATED_28'
              dest.write_bytes(raw)
              index['games'][gid]={
                  'path':'gamepulse/fusion/official_lineup_clock/games/'+gid+'.json',
                  'sha256':hashlib.sha256(raw).hexdigest(),
                  'intervals':len(doc['lineup_intervals']),'qa':doc['qa']}
              intervals+=len(doc['lineup_intervals'])
              for team in (roster['game']['home'],roster['game']['away']):
                  index['by_team'].setdefault(team,[])
                  if gid not in index['by_team'][team]:index['by_team'][team].append(gid)
              for row in doc['lineup_intervals']:
                  for five in row['teams'].values():
                      for pid in five:
                          index['by_player'].setdefault(pid,[])
                          if gid not in index['by_player'][pid]:index['by_player'][pid].append(gid)
          index['by_team']={k:sorted(v) for k,v in sorted(index['by_team'].items())}
          index['by_player']={k:sorted(v) for k,v in sorted(index['by_player'].items())}
          index['source_manifest']='gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json'
          index['source_commit']=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          index['source_partition']={'existing_28_clock_source_preserved':True,
             'added_8_nba_provider_source_main_commit':index['source_commit']}
          index['stats']={'source_games':36,'accepted_games':36,'unresolved_games':0,
             'ten_player_game_clock_intervals':sum(v['intervals'] for v in index['games'].values())}
          assert len(index['games'])==36 and not index['unresolved_games']
          for gid,sha in old_paths.items():assert index['games'][gid]['sha256']==sha
          assert index['stats']['ten_player_game_clock_intervals']>=1016+intervals
          assert index['physical_possessions_certified']==0
          old_index_path.write_text(json.dumps(index,sort_keys=True,indent=2)+'\n')
          print('PRIVATE_OFFICIAL_LINEUP_36_ACCEPTED',
             json.dumps({'games':36,'added':len(ids),'additional_ten_player_intervals':intervals,
                         'all_ten_player_intervals':index['stats']['ten_player_game_clock_intervals'],
                         'original_28_immutable':True},sort_keys=True))
          PY
      - name: Run official clock regression and atomic private git publication
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v \
            -s gamepulse/fusion/tests -p "test_official_lineup_clock_intervals_2026.py"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add gamepulse/fusion/official_lineup_clock/index.json \
             gamepulse/fusion/official_lineup_clock/games/00226001{04,05,06,07,08,09,10,11}.json
          git diff --cached --check
          git commit -qm "data(gamepulse): extend official NBA source-verified lineup clock from 28 to 36"
          git push -q origin "HEAD:$BRANCH"
          echo "PRIVATE_36_OFFICIAL_LINEUP_CLOCK_SOURCE_COMMITTED"
