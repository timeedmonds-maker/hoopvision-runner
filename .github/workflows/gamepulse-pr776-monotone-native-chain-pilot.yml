name: PR776 monotone native XYZ to NBA chain research pilot
# Reviewed: private original XYZ remains private. Public runner logs aggregate counts only.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-monotone-native-chain-pilot.yml']
permissions: {contents: read}
concurrency:
  group: pr776-monotone-native-nba-pilot-v1
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public content and fetch private canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/private-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/private-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/private-askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Test and run source-native real NBA chain sequence matcher
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_monotone_native_chain_pilot_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -v -p 'test_igp_monotone_native_chain_pilot_2026.py'
          OUT=gamepulse/fusion/qa/igp_progress_20261026/monotone_native_chain_v1
          test ! -e "$OUT"
          mkdir -p "$OUT"
          for gid in 0022600009 0022600008; do
            python3 gamepulse/fusion/igp_monotone_native_chain_pilot_2026.py --root . --game-id "$gid" --out "$OUT/$gid.json"
          done
          python3 - "$OUT" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1]);index={'schema':'gamepulse.igp-native-nba-monotone-pilot-index.v1','games':{},'physical_possessions_certified':0}
          for gid in ('0022600009','0022600008'):
              p=root/(gid+'.json');raw=p.read_bytes();o=json.loads(raw)
              assert o['game_id']==gid and o['physical_possessions_certified']==0
              assert o['NBA_gameclock_independently_verified'] is False
              assert len(o['results'])==o['native_window_count']
              assert all(x['physical_possessions_certified']==0 and x['source_xyz_not_assigned_to_certified_physical_possession'] for x in o['results'])
              index['games'][gid]={'path':gid+'.json','sha256':hashlib.sha256(raw).hexdigest(),'counts':o['counts']}
          (root/'index.json').write_text(json.dumps(index,sort_keys=True,indent=2)+'\n')
          print('IGP_NATIVE_NBA_MONOTONE_RESEARCH_PRIVATE_QA',json.dumps({gid:x['counts'] for gid,x in index['games'].items()},sort_keys=True))
          PY
      - name: Publish source-sha provenance and research QA to private PR776
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261026/monotone_native_chain_v1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 3
          git commit -q -m "data(igp): private provisional source-native monotone NBA chain pilot"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_MONOTONE_NATIVE_NBA_PRIVATE_PUBLISHED
              exit 0
            fi
            sleep "$i"
          done
          exit 13
