name: Integrated Pulse private event snapshot search readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-event-snapshot-query-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-event-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard and SHA private original NBA source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free per-actor original event snapshots time and null regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_ippt_event_snapshots_2026.py
          python3 -m unittest -v \
             gamepulse/fusion/test_query_igp_ippt_event_snapshots_2026.py \
             gamepulse/fusion/test_igp_ippt_event_snapshot_census_2026.py
      - name: Real original NBA two game event ID source XYZ readback
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from query_igp_ippt_event_snapshots_2026 import query
          for gid in ("0022600009","0022600092"):
              types={"2pt","3pt","rebound","turnover"}
              page=query(".",gid,types=types,limit=50,max_lag_ms=250)
              assert page["source_original_XYZ_untouched"]
              assert page["not_certified_physical_action_alignment"]
              assert page["total_matching_official_actions"]>200
              assert len(page["records"])==50
              for row in page["records"]:
                  assert row["NBA_event_type"] in types
                  assert not row["event_specific_physical_instant_certified"]
                  for pid,pos in row["players_original_near_event"].items():
                      assert abs(pos["signed_source_minus_official_event_UTC_ms"])<=250
                      assert pos["source_kind"]=="ORIGINAL_SDK_SUPPLIED_XYZ"
                  assert not (set(row["players_original_near_event"])&
                              set(row["players_accepted_G3_at_nearest_native_not_direct"]))
              candidate=next((row for row in page["records"]
                              if row["NBA_event_person_id"] is not None and
                              row["nearest_original_frame_within_requested_lag"]),None)
              assert candidate is not None
              exact=query(".",gid,action_number=candidate["NBA_action_number"],limit=10)
              assert exact["total_matching_official_actions"]==1
              assert exact["records"][0]["NBA_action_number"]==candidate["NBA_action_number"]
              subject=query(".",gid,types={candidate["NBA_event_type"]},
                            subject_player=candidate["NBA_event_person_id"],limit=10)
              assert subject["total_matching_official_actions"]>=1
              print("IGP_EVENT_ORIGINAL_QUERY_PASS",gid,{
                  "action_types":["2pt","3pt","rebound","turnover"],
                  "source_actions_queryable":page["total_matching_official_actions"],
                  "original_actor_positions_retain_actual_native_timestamps":True,
                  "official_exact_action_ID_lookup":True,
                  "subject_player_filter":True,
                  "source_and_G3_disjoint":True,
                  "physical_event_alignment_not_claimed":True})
          PY

# Public logs contain source-event aggregate acceptance only; no SDK XYZ is printed.
