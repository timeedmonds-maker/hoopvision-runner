name: Live CLE-PHI Game Pulse private fast capture
# Operational activation after public allowlist update.
# Exact NBA game 0022600006, Thu Oct 22 2026 19:00 EDT.
# Source SDK tokens/XYZ stay in ephemeral runner memory and PRIVATE 104 Releases.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-live-cle-phi-20261022.yml']
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
concurrency:
  group: live-cle-phi-report-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  first-live-fanout:
    if: false # Initial fanout has run; scheduled source recovery now owns missing windows.
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        part: [7, 8, 9, 10, 11, 12]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sanctioned SDK with no lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Capture exact elapsed Game Pulse slots, SHA verify private 104
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs
  certify-full-cavs:
    if: false # Durable scheduled-finalize only runs after source horizon matures.
    needs: [verify, first-live-fanout]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licensed SDK without lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Check every original checkpoint and certify full-game source
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
        run: node season_private_release.mjs
  follow-live-source:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sanctioned SDK
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Capture next two elapsed windows without synthetic records
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRODUCTION_ENABLED: 'true'
          GAMEPULSE_LIVE_ELAPSED_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
        run: node season_private_release.mjs
  scheduled-finalize:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require mature full-game window before final certification
        id: due
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime,timezone
          import os
          now=datetime.now(timezone.utc)
          ready=datetime.fromisoformat('2026-10-23T04:15:00+00:00')
          import subprocess
          complete=subprocess.run(['gh','release','view','gamepulse-sdk-0022600006','--repo','timeedmonds-maker/104','--json','assets','--jq','.assets[].name'],capture_output=True,text=True,timeout=30)
          already=complete.returncode==0 and 'sdk-COMPLETE.json' in complete.stdout.splitlines()
          due=now>=ready and not already
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('due='+('true' if due else 'false'),file=f)
          print('CAVS_FULLGAME_WINDOW_MATURE',now>=ready,'ALREADY_COMPLETE',already)
          PY
      - name: Install authenticated SDK without lifecycle scripts
        if: steps.due.outputs.due == 'true'
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Resume all missing source windows and certify original private archive
        if: steps.due.outputs.due == 'true'
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRODUCTION_ENABLED: 'true'
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
        run: node season_private_release.mjs
  scheduled-catalog-refresh:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.scheduled-finalize.result == 'success'
    needs: [scheduled-finalize]
    concurrency:
      group: gamepulse-cavs-15game-private-catalog
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the original full-game complete marker
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          assets=$(gh release view gamepulse-sdk-0022600006 --repo timeedmonds-maker/104 --json assets --jq '.assets[].name')
          if grep -Fxq sdk-COMPLETE.json <<< "$assets"; then
            # The SDK marker proves window transport only. A game lacking Q3/Q4
            # observed player and ball frames must NEVER promote its source.
            if gh api 'repos/timeedmonds-maker/104/contents/gamepulse/coverage/season16/0022600006.json?ref=main' --jq .content \
              | base64 -d | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["full_active_play_observation_gate"].startswith("PASSED_") and not d["sdk_parts_missing"] and all(q["coverage_gate"].startswith("PASS") for q in d["quarters"])'; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            else
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo 'CAVS_ARCHIVE_COMPLETE_BUT_ACTIVE_PLAY_TRACKING_INCOMPLETE'
            fi
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'CAVS_ORIGINAL_SDK_ARCHIVE_INCOMPLETE'
          fi
      - name: Validate and rebuild original plus Cavaliers team/game/player search
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cavs-15-index"
          mkdir -p "$ROOT/tests"
          for spec in 'catalog.py' 'tests/test_catalog.py'; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/catalog/$spec?ref=main" --jq .content | base64 -d > "$ROOT/$spec"
          done
          python3 -m unittest discover -v -s "$ROOT/tests"
          python3 "$ROOT/catalog.py" build --output "$ROOT/catalog.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads((Path(os.environ['RUNNER_TEMP'])/'cavs-15-index/catalog.json').read_text())
          gid='0022600006'
          original=('0022600001','0022600002','0022600003','0022600004','0022600005',
                    '0022600085','0022600086','0022600087','0022600088','0022600089',
                    '0022600090','0022600091','0022600092','0022600093')
          assert len(obj['games'])>=15 and set(original+(gid,)).issubset(obj['games'])
          entry=obj['games'][gid]
          assert entry['index_state']=='VERIFIED_ARCHIVE_INDEX'
          assert entry['away_team']=='CLE' and entry['home_team']=='PHI'
          assert entry['observed_frame_count']>0
          assert gid in obj['by_team']['CLE'] and gid in obj['by_team']['PHI']
          print('CAVS_15GAME_PRIVATE_CATALOG_VERIFIED')
          PY
      - name: Publish private 15-game catalog with byte-identical readback
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,subprocess,time
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'cavs-15-index/catalog.json').read_bytes()
          dest='repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27.json'
          for attempt in range(8):
              old=subprocess.run(['gh','api',dest],capture_output=True,text=True)
              if old.returncode:return_code=old.returncode;raise RuntimeError('private_catalog_read_failed')
              x=json.loads(old.stdout)
              if base64.b64decode(x['content'])==raw:break
              body={'branch':'main','message':'data(gamepulse): add verified Cavaliers to source search catalog',
                    'sha':x['sha'],'content':base64.b64encode(raw).decode()}
              p=subprocess.run(['gh','api','-X','PUT',dest,'--input','-'],
                               input=json.dumps(body),text=True,capture_output=True)
              if p.returncode==0:break
              if not any(t in p.stderr for t in ('409','422','Conflict')):raise RuntimeError('private_catalog_write_failed')
              time.sleep(2+attempt)
          else:raise RuntimeError('private_catalog_publish_retries_exhausted')
          actual=json.loads(subprocess.check_output(['gh','api',dest]))
          assert base64.b64decode(actual['content'])==raw
          print('CAVS_15GAME_CATALOG_PRIVATE_SHA_VERIFIED')
          PY
  scheduled-official-event-index:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.scheduled-catalog-refresh.result == 'success'
    needs: [scheduled-catalog-refresh]
    concurrency:
      group: gamepulse-cavs-15game-official-events
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Verify full original source and private catalog before PBP extension
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if ! gh release view gamepulse-sdk-0022600006 --repo timeedmonds-maker/104 --json assets --jq '.assets[].name' | grep -Fxq sdk-COMPLETE.json; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          elif ! gh api 'repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27.json' --jq '.content' | base64 -d | jq -e '.game_count >= 15 and .games["0022600006"].index_state == "VERIFIED_ARCHIVE_INDEX"' >/dev/null; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Extend official PBP source index while preserving the original 14
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cavs-pbp"
          mkdir -p "$ROOT"
          for n in official_pbp_timestamps_2026.py official_pbp_allgames_2026.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$n?ref=main" --jq .content | base64 -d > "$ROOT/$n"
          done
          export PYTHONPATH="$ROOT"
          python3 - <<'PY'
          import hashlib,json
          from official_pbp_allgames_2026 import certify_game,private_json
          from official_pbp_timestamps_2026 import publish
          gid='0022600006'
          pbp=certify_game(gid,['CLE','PHI'])
          assert pbp['qa']['nba_score_reconciled_to_boxscore']
          assert pbp['qa']['nba_action_records']>=300
          path='gamepulse/fusion/official_pbp_timing/games/'+gid+'.json'
          result=publish(pbp,path)
          frozen,freeze_sha=private_json('gamepulse/fusion/official_pbp_timing/index.json')
          assert len(frozen['games'])==14 and gid not in frozen['games']
          game=pbp['official_final']
          extension=dict(frozen['games'])
          extension[gid]={
            'game_id':gid,'state':pbp['state'],
            'action_records':pbp['qa']['nba_action_records'],
            'actions_with_official_timeActual_utc':pbp['qa']['nba_actions_with_formal_utc'],
            'official_final':game,'source_file':path,
            'source_pbp_sha256':pbp['source_provenance']['nba_pbp_sha256'],
            'disposition':'PRIVATE_NBA_PBP_EVENT_TIMELINE_SHA_VERIFIED',
            'video_pts_certified':0
          }
          expanded={**frozen,'schema':'gamepulse.formal-nba-official-event-clock-season.v2',
                    'source_game_count':len(extension),'games':extension,
                    'state':'NBA_OFFICIAL_EVENTS_RECONCILED_SEASON_EXTENSION',
                    'nba_action_count':sum(r['action_records'] for r in extension.values()),
                    'nba_actions_with_direct_nba_timeActual':sum(r['actions_with_official_timeActual_utc'] for r in extension.values()),
                    'nba_game_score_checks_passed':len(extension),
                    'frozen_original_14_manifest_sha256':freeze_sha,
                    'full_possession_video_links_certified':0}
          assert len(extension)>=15
          publish(expanded,'gamepulse/fusion/official_pbp_timing/index-2026-27.json')
          print('CAVS_OFFICIAL_PBP_15GAME_PRIVATE_SEARCH_TIMING_SHA_VERIFIED')
          PY
  scheduled-native-cavs-fusion:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.scheduled-official-event-index.result == 'success'
    needs: [scheduled-official-event-index]
    concurrency:
      group: gamepulse-cavs-15game-native-fusion
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require 15-game verified search sources and abstain if not ready
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          if gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/0022600006.json' >/dev/null 2>&1; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'CAVS_NATIVE_FUSION_ALREADY_INDEXED'
          elif gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/0022600006.json' >/dev/null 2>&1 &&
               gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/0022600006.json' >/dev/null 2>&1 &&
               gh release view gamepulse-sdk-0022600006 --repo timeedmonds-maker/104 --json assets --jq '.assets[].name' | grep -Fxq sdk-COMPLETE.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'WAIT_FOR_CAVS_PBP_AND_BLUEPRINT_VIEW'
          fi
      - name: Fetch private original SDK source and trusted native fusion
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cavs-native-fusion"
          mkdir -p "$ROOT/sdk" "$ROOT/tests"
          for n in gamepulse_ball_control.py gamepulse_ball_dynamics.py interaction_fusion_2026.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$n?ref=main" --jq .content | base64 -d > "$ROOT/$n"
          done
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_interaction_fusion_2026.py?ref=main' --jq .content | base64 -d > "$ROOT/tests/test_interaction_fusion_2026.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/0022600006.json?ref=main' --jq .content | base64 -d > "$ROOT/pbp.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/0022600006.json?ref=main' --jq .content | base64 -d > "$ROOT/view.json"
          PYTHONPATH="$ROOT" python3 -m unittest discover -v -s "$ROOT/tests" -p test_interaction_fusion_2026.py
          gh api 'repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-0022600006' > "$ROOT/source.json"
          gh release download gamepulse-sdk-0022600006 --repo timeedmonds-maker/104 --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cavs-native-fusion'
          manifest=json.loads((root/'source.json').read_text())
          assets={a['name']:a['digest'] for a in manifest['assets']}
          parts=sorted((root/'sdk').glob('sdk-part-??.tar.gz'))
          assert len(parts)==13 and 'sdk-COMPLETE.json' in assets
          for p in parts:
              assert assets[p.name]=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print('CAVS_13_ORIGINAL_SDK_CHUNKS_SHA_VERIFIED')
          PY
      - name: Fuse Cavs source-native player touches, NBA PBP and Blueprint
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cavs-native-fusion"
          python3 "$ROOT/interaction_fusion_2026.py" --sdk-dir "$ROOT/sdk" --pbp "$ROOT/pbp.json" --view "$ROOT/view.json" --out "$ROOT/interaction.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cavs-native-fusion'
          doc=json.loads((root/'interaction.json').read_text())
          assert doc['game_id']=='0022600006'
          assert doc['schema']=='gamepulse.interaction-event-possession-fusion.v1'
          assert doc['reconciliation']['nba_team_score_reconciled'] is True
          assert doc['source_event_counts']['native_unique_touch_labels']>0
          assert len(doc['possessions'])>0
          assert set(doc['teams'])=={'CLE','PHI'}
          assert doc['certified_touch_possessions']==0
          print('CAVS_NATIVE_PBP_BLUEPRINT_FUSION_VERIFIED')
          PY
      - name: Publish Cavs native interaction index privately with SHA readback
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess,time,hashlib
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'cavs-native-fusion/interaction.json').read_bytes()
          path='repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/0022600006.json'
          for attempt in range(12):
              old=subprocess.run(['gh','api',path],capture_output=True,text=True)
              body={'branch':'main','message':'data(gamepulse): Cavaliers authoritative native-touch PBP Blueprint fusion',
                    'content':base64.b64encode(raw).decode()}
              if old.returncode==0:
                  current=json.loads(old.stdout)
                  if base64.b64decode(current['content'])==raw:break
                  body['sha']=current['sha']
              elif '404' not in old.stderr and 'Not Found' not in old.stderr:
                  raise RuntimeError('private_native_index_read_failed')
              result=subprocess.run(['gh','api','-X','PUT',path,'--input','-'],input=json.dumps(body),capture_output=True,text=True)
              if result.returncode==0:break
              if not any(x in result.stderr for x in ('409','422','Conflict')):raise RuntimeError('private_native_index_publish_failed')
              time.sleep(2+attempt)
          else:raise RuntimeError('private_native_index_write_conflict')
          final=json.loads(subprocess.check_output(['gh','api',path]))
          assert hashlib.sha256(base64.b64decode(final['content'])).digest()==hashlib.sha256(raw).digest()
          print('CAVS_NATIVE_INTERACTION_PRIVATE_SHA_VERIFIED')
          PY
  scheduled-15game-search-verification:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.scheduled-native-cavs-fusion.result == 'success'
    needs: [scheduled-native-cavs-fusion]
    concurrency:
      group: gamepulse-cavs-15game-cross-source-search
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Check Cavs native fusion index exists
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/0022600006.json' >/dev/null 2>&1; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve original fourteen and independently prove fifteen-game query works
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cavs-crossgame"
          mkdir -p "$ROOT/games"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/index.json' --jq .content | base64 -d > "$ROOT/frozen.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/interaction_search_2026.py?ref=main' --jq .content | base64 -d > "$ROOT/interaction_search_2026.py"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,sys,time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cavs-crossgame'
          original=json.loads((root/'frozen.json').read_text())
          assert original['game_count']==14 and len(original['games'])==14
          assert '0022600006' not in original['games']
          def read(p):
              raw=subprocess.check_output(['gh','api','repos/timeedmonds-maker/104/contents/'+p,'--jq','.content'])
              return base64.b64decode(raw)
          retained={}
          for game,meta in sorted(original['games'].items()):
              raw=read('gamepulse/fusion/index/interactions/'+game+'.json')
              assert hashlib.sha256(raw).hexdigest()==meta['sha256']
              retained[game]=meta
              (root/'games'/(game+'.json')).write_bytes(raw)
          gid='0022600006'
          raw=read('gamepulse/fusion/index/interactions/'+gid+'.json')
          cavs=json.loads(raw)
          assert cavs['game_id']==gid and cavs['reconciliation']['nba_team_score_reconciled']
          assert cavs['source_event_counts']['native_unique_touch_labels']>0
          (root/'games'/(gid+'.json')).write_bytes(raw)
          retained[gid]={
             'sha256':hashlib.sha256(raw).hexdigest(),
             'source_native_touch_labels':cavs['source_event_counts']['native_unique_touch_labels'],
             'team_action_runs':len(cavs['possessions']),
             'nba_scores_reconciled':True}
          manifest={**original,'schema':'gamepulse.interaction-fusion-season-index.v2',
             'game_count':len(retained),'games':retained,
             'status':'SOURCE_NATIVE_TOUCH_PBP_BLUEPRINT_15_GAME_SEARCH',
             'original_14_manifest_sha256':hashlib.sha256((root/'frozen.json').read_bytes()).hexdigest(),
             'original_14_preserved':True}
          assert len(retained)==15 and all(x['nba_scores_reconciled'] for x in retained.values())
          sys.path.insert(0,str(root))
          from interaction_search_2026 import search
          candidate=next((t['player_id'] for p in cavs['possessions']
                            for t in p['native_touch_events'] if t.get('player_id')),None)
          assert candidate is not None
          result=search(sorted((root/'games').glob('*.json')),all_touched=(candidate,),
                        evidence='native_start',expected_games=15)
          assert result['games_count']==15 and gid in result['games_searched']
          assert any(p['game_id']==gid for p in result['possessions'])
          assert result['denominator_unit']=='NBA_OFFICIAL_POSSESSION_TEAM_ACTION_RUN'
          def save(path,body):
              dest='repos/timeedmonds-maker/104/contents/'+path
              data=(json.dumps(body,sort_keys=True,ensure_ascii=False,separators=(',',':'))+chr(10)).encode()
              for trial in range(10):
                  old=subprocess.run(['gh','api',dest],capture_output=True,text=True)
                  payload={'branch':'main','message':'data(gamepulse): certified 15-game private source search',
                           'content':base64.b64encode(data).decode()}
                  if old.returncode==0:
                      previous=json.loads(old.stdout)
                      if base64.b64decode(previous['content'])==data:break
                      payload['sha']=previous['sha']
                  elif '404' not in old.stderr and 'Not Found' not in old.stderr:
                      raise RuntimeError('private_search_read_failed')
                  change=subprocess.run(['gh','api','-X','PUT',dest,'--input','-'],
                           input=json.dumps(payload),capture_output=True,text=True)
                  if change.returncode==0:break
                  if not any(k in change.stderr for k in ('409','422','Conflict')):
                      raise RuntimeError('private_search_write_failed')
                  time.sleep(2+trial)
              else:raise RuntimeError('private_search_write_retries_exhausted')
              check=read(path)
              assert check==data
          save('gamepulse/fusion/index/interactions/index-2026-27.json',manifest)
          save('gamepulse/fusion/queries/cavs_15game_search_smoke.json',result)
          print('CAVS_FIFTEEN_GAME_SEARCH_SHA_VERIFIED',len(retained),
                'cavs_native_touches',retained[gid]['source_native_touch_labels'],
                'cavs_official_action_runs',retained[gid]['team_action_runs'])
          PY
  quarter-native-report:
    if: always() && needs.verify.result == 'success' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Read all original SHA-backed source releases without public artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/timeedmonds-maker/104 --jq '.private')" = true
          ROOT="$RUNNER_TEMP/lebron-touch-analysis"
          mkdir -p "$ROOT"
          gh release download gamepulse-sdk-0022600006 --repo timeedmonds-maker/104 --pattern 'sdk-part-*.tar.gz' --dir "$ROOT"
          for name in source_touch_counts roster_resolver quarter_native_2026; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/live/$name.py?ref=main" --jq .content | base64 -d > "$ROOT/$name.py"
          done
          python3 -m py_compile "$ROOT/"*.py
          python3 "$ROOT/quarter_native_2026.py" --dir "$ROOT" > "$ROOT/quarter.json"
          python3 - <<'PY'
          import os,json,base64,subprocess
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"lebron-touch-analysis/quarter.json").read_bytes()
          report=json.loads(raw)
          if report["unmatched"]:
              raise ValueError("source_touch_period_attribution_incomplete")
          url="repos/timeedmonds-maker/104/contents/gamepulse/live/queries/lebron_20261022_quarters.json"
          for i in range(5):
              existing=subprocess.run(["gh","api",url],capture_output=True,text=True)
              entry={"branch":"main","message":"data: full-game LeBron native source touches per quarter",
                     "content":base64.b64encode(raw).decode()}
              if existing.returncode==0:entry["sha"]=json.loads(existing.stdout)["sha"]
              result=subprocess.run(["gh","api","-X","PUT",url,"--input","-"],
                 input=json.dumps(entry),capture_output=True,text=True)
              if result.returncode==0:break
          else:raise RuntimeError("private_game_touch_write_failed")
          readback=json.loads(subprocess.check_output(["gh","api",url]))
          if base64.b64decode(readback["content"])!=raw:raise RuntimeError("report_readback_failed")
          print("PRIVATE_FULL_GAME_QUARTER_TOUCH_REPORT_SHA_VERIFIED")
          PY
  official-quarter-touches:
    # Nonblocking supplementary NBA player-quarter publication; full SDK/PBP/search have independent hard gates.
    continue-on-error: true
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Fetch NBA published quarter tracking and reconcile full game privately
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/timeedmonds-maker/104 --jq '.private')" = true
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/nba_official_touches_quarter.py?ref=main' --jq .content | base64 -d > "$RUNNER_TEMP/quarter.py"
          python3 "$RUNNER_TEMP/quarter.py" --output "$RUNNER_TEMP/result.json"
          python3 - <<'PY'
          import os,json,base64,subprocess
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"result.json").read_bytes()
          d=json.loads(raw)
          assert d["touches_reconciled"] and sum(d["periods"].values())==d["official_total"]
          url="repos/timeedmonds-maker/104/contents/gamepulse/live/queries/lebron_20261022_official_quarters.json"
          for _ in range(4):
              old=subprocess.run(["gh","api",url],capture_output=True,text=True)
              body={"branch":"main","message":"data: NBA official touch counts by quarter",
                    "content":base64.b64encode(raw).decode()}
              if old.returncode==0:body["sha"]=json.loads(old.stdout)["sha"]
              r=subprocess.run(["gh","api","-X","PUT",url,"--input","-"],
                               input=json.dumps(body),capture_output=True,text=True)
              if r.returncode==0:break
          else:raise RuntimeError("private_official_quarter_write_failed")
          verify=json.loads(subprocess.check_output(["gh","api",url]))
          if base64.b64decode(verify["content"])!=raw:raise RuntimeError("private_readback_failed")
          print("PRIVATE_NBA_OFFICIAL_QUARTER_TOUCHES_VERIFIED")
          PY
  live-private-query-index:
    if: always() && needs.verify.result == 'success' && github.ref == 'refs/heads/main'
    needs: [verify, first-live-fanout, follow-live-source]
