name: Live CLE-PHI Game Pulse private fast capture
# Operational activation after public allowlist update.
# Exact NBA game 0022600006, Thu Oct 22 2026 19:00 EDT.
# Source SDK tokens/XYZ stay in ephemeral runner memory and PRIVATE 104 Releases.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-live-cle-phi-20261022.yml']
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
concurrency:
  group: live-cle-phi-20261022-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  first-live-fanout:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        part: [4, 5, 6, 7, 8, 9, 10, 11, 12]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sanctioned SDK with no lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Capture exact elapsed Game Pulse slots, SHA verify private 104
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs
  follow-live-source:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sanctioned SDK
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Capture next two elapsed windows without synthetic records
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRODUCTION_ENABLED: 'true'
          GAMEPULSE_LIVE_ELAPSED_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
        run: node season_private_release.mjs
  live-private-query-index:
    if: always() && needs.verify.result == 'success' && github.ref == 'refs/heads/main'
    needs: [verify, first-live-fanout, follow-live-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce all indexed sources and output stay private
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = "true"
      - name: Refresh private live search snapshot of captured slots, official ONOFF scoring and published Blueprint xFG
        run: |
          set -euo pipefail
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/live_game_index.py?ref=main' --jq '.content' |
            base64 -d > "$RUNNER_TEMP/live_game_index.py"
          python3 -m py_compile "$RUNNER_TEMP/live_game_index.py"
          python3 "$RUNNER_TEMP/live_game_index.py"
      - name: Validate searchable native 1-5 man, ESPN scoring on-off and xFG source abstention
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/search_live.py?ref=main' --jq '.content' |
            base64 -d > "$RUNNER_TEMP/search_live.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/games/0022600006.json?ref=main' --jq '.content' |
            base64 -d > "$RUNNER_TEMP/live.json"
          python3 -m py_compile "$RUNNER_TEMP/search_live.py"
          python3 "$RUNNER_TEMP/search_live.py" --index "$RUNNER_TEMP/live.json" --kind lineups --team CLE --x 2 --players "Donovan Mitchell,Evan Mobley" > "$RUNNER_TEMP/lineups.json"
          python3 "$RUNNER_TEMP/search_live.py" --index "$RUNNER_TEMP/live.json" --kind onoff --player "Donovan Mitchell" > "$RUNNER_TEMP/onoff.json"
          python3 "$RUNNER_TEMP/search_live.py" --index "$RUNNER_TEMP/live.json" --kind xfg --team CLE > "$RUNNER_TEMP/xfg.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          lineup=json.loads((tmp/'lineups.json').read_text())
          onoff=json.loads((tmp/'onoff.json').read_text())
          xfg=json.loads((tmp/'xfg.json').read_text())
          assert lineup['filtered_total']>0
          assert len(lineup['rows'])>0
          assert len(onoff['rows'])==1
          assert onoff['rows'][0]['net_rating_on'] is None
          assert xfg['source_status'] in ('NBA_NATIVE_BLUEPRINT_PUBLISHED','NO_PUBLISHED_XFG','NOT_PUBLISHED','REPORT_NOT_READY')
          assert all('native_blueprint_xfg' in r for r in xfg['rows'])
          print('PRIVATE_LIVE_QUERY_CONTRACT_TESTS_OK_NO_PLAYER_DATA_PUBLIC')
          PY
      - name: Publish only generic private-search pointer
        if: always()
        run: |
          echo 'Queryable source-qualified live snapshot, where available, is private in 104: gamepulse/live/games/0022600006.json' >> "$GITHUB_STEP_SUMMARY"
