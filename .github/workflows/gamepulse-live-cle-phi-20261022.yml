name: Live CLE-PHI Game Pulse private fast capture
# Operational activation after public allowlist update.
# Exact NBA game 0022600006, Thu Oct 22 2026 19:00 EDT.
# Source SDK tokens/XYZ stay in ephemeral runner memory and PRIVATE 104 Releases.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-live-cle-phi-20261022.yml']
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
concurrency:
  group: live-cle-phi-report-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  first-live-fanout:
    if: false # Initial fanout has run; scheduled source recovery now owns missing windows.
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        part: [7, 8, 9, 10, 11, 12]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sanctioned SDK with no lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Capture exact elapsed Game Pulse slots, SHA verify private 104
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs
  certify-full-cavs:
    if: false # Durable scheduled-finalize only runs after source horizon matures.
    needs: [verify, first-live-fanout]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licensed SDK without lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Check every original checkpoint and certify full-game source
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
        run: node season_private_release.mjs
  follow-live-source:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sanctioned SDK
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Capture next two elapsed windows without synthetic records
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRODUCTION_ENABLED: 'true'
          GAMEPULSE_LIVE_ELAPSED_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
        run: node season_private_release.mjs
  scheduled-finalize:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require mature full-game window before final certification
        id: due
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime,timezone
          import os
          now=datetime.now(timezone.utc)
          ready=datetime.fromisoformat('2026-10-23T04:15:00+00:00')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('due='+('true' if now>=ready else 'false'),file=f)
          print('CAVS_FULLGAME_WINDOW_MATURE',now>=ready)
          PY
      - name: Install authenticated SDK without lifecycle scripts
        if: steps.due.outputs.due == 'true'
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Resume all missing source windows and certify original private archive
        if: steps.due.outputs.due == 'true'
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRODUCTION_ENABLED: 'true'
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600006'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T23:00:00Z'
        run: node season_private_release.mjs
  quarter-native-report:
    if: always() && needs.verify.result == 'success' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Read all original SHA-backed source releases without public artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/timeedmonds-maker/104 --jq '.private')" = true
          ROOT="$RUNNER_TEMP/lebron-touch-analysis"
          mkdir -p "$ROOT"
          gh release download gamepulse-sdk-0022600006 --repo timeedmonds-maker/104 --pattern 'sdk-part-*.tar.gz' --dir "$ROOT"
          for name in source_touch_counts roster_resolver quarter_native_2026; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/live/$name.py?ref=main" --jq .content | base64 -d > "$ROOT/$name.py"
          done
          python3 -m py_compile "$ROOT/"*.py
          python3 "$ROOT/quarter_native_2026.py" --dir "$ROOT" > "$ROOT/quarter.json"
          python3 - <<'PY'
          import os,json,base64,subprocess
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"lebron-touch-analysis/quarter.json").read_bytes()
          report=json.loads(raw)
          if report["unmatched"]:
              raise ValueError("source_touch_period_attribution_incomplete")
          url="repos/timeedmonds-maker/104/contents/gamepulse/live/queries/lebron_20261022_quarters.json"
          for i in range(5):
              existing=subprocess.run(["gh","api",url],capture_output=True,text=True)
              entry={"branch":"main","message":"data: full-game LeBron native source touches per quarter",
                     "content":base64.b64encode(raw).decode()}
              if existing.returncode==0:entry["sha"]=json.loads(existing.stdout)["sha"]
              result=subprocess.run(["gh","api","-X","PUT",url,"--input","-"],
                 input=json.dumps(entry),capture_output=True,text=True)
              if result.returncode==0:break
          else:raise RuntimeError("private_game_touch_write_failed")
          readback=json.loads(subprocess.check_output(["gh","api",url]))
          if base64.b64decode(readback["content"])!=raw:raise RuntimeError("report_readback_failed")
          print("PRIVATE_FULL_GAME_QUARTER_TOUCH_REPORT_SHA_VERIFIED")
          PY
  official-quarter-touches:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Fetch NBA published quarter tracking and reconcile full game privately
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/timeedmonds-maker/104 --jq '.private')" = true
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/nba_official_touches_quarter.py?ref=main' --jq .content | base64 -d > "$RUNNER_TEMP/quarter.py"
          python3 "$RUNNER_TEMP/quarter.py" --output "$RUNNER_TEMP/result.json"
          python3 - <<'PY'
          import os,json,base64,subprocess
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"result.json").read_bytes()
          d=json.loads(raw)
          assert d["touches_reconciled"] and sum(d["periods"].values())==d["official_total"]
          url="repos/timeedmonds-maker/104/contents/gamepulse/live/queries/lebron_20261022_official_quarters.json"
          for _ in range(4):
              old=subprocess.run(["gh","api",url],capture_output=True,text=True)
              body={"branch":"main","message":"data: NBA official touch counts by quarter",
                    "content":base64.b64encode(raw).decode()}
              if old.returncode==0:body["sha"]=json.loads(old.stdout)["sha"]
              r=subprocess.run(["gh","api","-X","PUT",url,"--input","-"],
                               input=json.dumps(body),capture_output=True,text=True)
              if r.returncode==0:break
          else:raise RuntimeError("private_official_quarter_write_failed")
          verify=json.loads(subprocess.check_output(["gh","api",url]))
          if base64.b64decode(verify["content"])!=raw:raise RuntimeError("private_readback_failed")
          print("PRIVATE_NBA_OFFICIAL_QUARTER_TOUCHES_VERIFIED")
          PY
  live-private-query-index:
    if: always() && needs.verify.result == 'success' && github.ref == 'refs/heads/main'
    needs: [verify, first-live-fanout, follow-live-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce all indexed sources and output stay private
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = "true"
      - name: Refresh private live search snapshot of captured slots, official ONOFF scoring and published Blueprint xFG
        run: |
          set -euo pipefail
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/live_game_index.py?ref=main' --jq '.content' |
            base64 -d > "$RUNNER_TEMP/live_game_index.py"
          python3 -m py_compile "$RUNNER_TEMP/live_game_index.py"
          python3 "$RUNNER_TEMP/live_game_index.py"
      - name: Validate searchable native 1-5 man, ESPN scoring on-off and xFG source abstention
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/search_live.py?ref=main' --jq '.content' |
            base64 -d > "$RUNNER_TEMP/search_live.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/games/0022600006.json?ref=main' --jq '.content' |
            base64 -d > "$RUNNER_TEMP/live.json"
          python3 -m py_compile "$RUNNER_TEMP/search_live.py"
          python3 "$RUNNER_TEMP/search_live.py" --index "$RUNNER_TEMP/live.json" --kind lineups --team CLE --x 2 --players "Donovan Mitchell,Evan Mobley" > "$RUNNER_TEMP/lineups.json"
          python3 "$RUNNER_TEMP/search_live.py" --index "$RUNNER_TEMP/live.json" --kind onoff --player "Donovan Mitchell" > "$RUNNER_TEMP/onoff.json"
          python3 "$RUNNER_TEMP/search_live.py" --index "$RUNNER_TEMP/live.json" --kind xfg --team CLE > "$RUNNER_TEMP/xfg.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          lineup=json.loads((tmp/'lineups.json').read_text())
          onoff=json.loads((tmp/'onoff.json').read_text())
          xfg=json.loads((tmp/'xfg.json').read_text())
          assert lineup['filtered_total']>0
          assert len(lineup['rows'])>0
          assert len(onoff['rows'])==1
          assert onoff['rows'][0]['net_rating_on'] is None
          assert xfg['source_status'] in ('NBA_NATIVE_BLUEPRINT_PUBLISHED','NO_PUBLISHED_XFG','NOT_PUBLISHED','REPORT_NOT_READY')
          assert all('native_blueprint_xfg' in r for r in xfg['rows'])
          print('PRIVATE_LIVE_QUERY_CONTRACT_TESTS_OK_NO_PLAYER_DATA_PUBLIC')
          PY
      - name: Publish only generic private-search pointer
        if: always()
        run: |
          echo 'Queryable source-qualified live snapshot, where available, is private in 104: gamepulse/live/games/0022600006.json' >> "$GITHUB_STEP_SUMMARY"
