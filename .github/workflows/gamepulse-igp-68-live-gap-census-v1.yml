# Reviewed against public content guard: private source, public aggregate QA only.
name: IGP 68 live gap census research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-live-gap-census-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-68-live-gap-census-research
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 93f0d9e71b219dff283cb7679567578e88736b3a
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin private 68 game source and research candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test and score exact live cohort
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_live_gap_census_v1.py'
          python3 gamepulse/fusion/igp_68_live_gap_census_v1.py \
            --root . --output "$RUNNER_TEMP/gap-census.json" \
            > "$RUNNER_TEMP/private-census.log" 2>&1 || {
              echo IGP68_GAP_CENSUS_FAILED_PRIVATE_DIAGNOSTIC
              exit 41
            }
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'gap-census.json').read_text())
          c=q['counts']
          assert q['games']==68 and len(q['per_game'])==68
          assert c['native_frames']==543024 and c['native_800_complete']==474914
          assert c['grid_samples']==1106941 and c['grid_800_complete']==871858
          assert c['native_1200_new_complete']>=0 and c['grid_1200_new_complete']>=0
          print('IGP68_GAP_RESEARCH',json.dumps({
              'counts':c, 'missing_slot_reasons':q['missing_slot_reasons'],
              'masked_player_xy_ft':q['masked_player_xy_ft']},sort_keys=True))
          PY
      - name: Retain private research receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_live_gap_census_research_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B gap-census "origin/$BRANCH"
          cp "$RUNNER_TEMP/gap-census.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): retain all68 live gap census research receipt'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP68_GAP_RESEARCH_PRIVATE_RECEIPT_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
