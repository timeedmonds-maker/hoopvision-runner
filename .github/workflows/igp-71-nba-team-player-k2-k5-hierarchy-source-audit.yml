name: IGP 71 NBA team player and kman source QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-71-nba-team-player-k2-k5-hierarchy-source-audit.yml']
permissions: {contents: read}
jobs:
  private-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Run all original 71 source records against NBA player advanced and rotations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b research/igp-71-multilevel-possession-hierarchy-20261031 https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          python3 -m pip -q install duckdb
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          cd "$RUNNER_TEMP/private"
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_v32_71_multilevel_possession_roster_audit_v1.py'
          python3 - <<'PY'
          from pathlib import Path
          import os,urllib.request
          for name in ("player_game_logs","game_rotations"):
              u="https://basketball-data.billmill.org/nba/stats/"+name+"/season=2027/data.parquet"
              with urllib.request.urlopen(u,timeout=30) as f:raw=f.read(30000000)
              assert raw[:4]==b"PAR1" and raw[-4:]==b"PAR1"
              (Path(os.environ["RUNNER_TEMP"])/(name+".parquet")).write_bytes(raw)
          PY
          python3 gamepulse/fusion/igp_v32_71_multilevel_possession_roster_audit_v1.py --root . --player-parquet "$RUNNER_TEMP/player_game_logs.parquet" --rotation-parquet "$RUNNER_TEMP/game_rotations.parquet" --out "$RUNNER_TEMP/igp-71-multilevel-qa.json" > "$RUNNER_TEMP/igp-71-multilevel-output.log" || { echo IGP71_MULTILEVEL_AUDIT_FAILED; exit 35; }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-71-multilevel-qa.json").read_text())
          c=x["counts"]
          assert c["games"]==71 and c["team_games"]==142
          print("IGP71_MULTILEVEL_PASS",json.dumps(c,sort_keys=True))
          PY
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_71_multilevel_team_player_candidate_k2_k5_v1.json
          if test -e "$dest"; then cmp "$dest" "$RUNNER_TEMP/igp-71-multilevel-qa.json"; exit 0; fi
          cp "$RUNNER_TEMP/igp-71-multilevel-qa.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git commit -m 'qa: NBA team/player POSS and provisional k-man chain hierarchy original 71'
          git push origin HEAD:refs/heads/research/igp-71-multilevel-possession-hierarchy-20261031
