name: IGP 68 game source-preserving continuous scene QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-continuous-scene-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-68-continuous-scene-v1
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      PINNED_PRIVATE_SHA: baafcf9d85438437ee9a6128da6a7100f8a6c5d0
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin private original source and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test bounded timeline and deterministic batch source QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_68_continuous_scene_v1.py'
          python3 gamepulse/fusion/igp_native_scene_batch_query_real_qa_v2.py \
            --root . --output gamepulse/fusion/qa/igp_progress_20261030/igp_native_scene_batch_query_real_qa_v2.json \
            > "$RUNNER_TEMP/batch-private.log" 2>&1
          tail -n 1 "$RUNNER_TEMP/batch-private.log"
      - name: Build new 68 game official source index and score every official window at 10 Hz
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_68_official_ten_possession_ab_v3.py \
            --root . --output gamepulse/fusion/qa/igp_progress_20261030/igp_68_official_ten_scene_possession_ab_v3.json \
            > "$RUNNER_TEMP/official-private.log" 2>&1 || {
              echo IGP_68_OFFICIAL_V3_FAILED_PRIVATE_DIAGNOSTIC
              exit 21
            }
          tail -n 1 "$RUNNER_TEMP/official-private.log"
          python3 gamepulse/fusion/igp_68_continuous_scene_full_qa_v1.py \
            --root . --output gamepulse/fusion/qa/igp_progress_20261030/igp_68_continuous_scene_full_qa_v1.json \
            > "$RUNNER_TEMP/continuous-private.log" 2>&1 || {
              echo IGP_68_CONTINUOUS_QA_FAILED_PRIVATE_DIAGNOSTIC
              exit 22
            }
          tail -n 1 "$RUNNER_TEMP/continuous-private.log"
      - name: Verify and commit private QA and bounded source-backed index
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import gzip,json
          from pathlib import Path
          from igp_68_continuous_scene_v1 import query
          base=Path('gamepulse/fusion/qa/igp_progress_20261030')
          a=json.loads((base/'igp_68_official_ten_scene_possession_ab_v3.json').read_text())
          b=json.loads((base/'igp_68_continuous_scene_full_qa_v1.json').read_text())
          c=json.loads((base/'igp_native_scene_batch_query_real_qa_v2.json').read_text())
          assert a['evaluated_games']==b['games']==68 and len(a['per_game'])==len(b['per_game'])==68
          assert a['counts']['original_native_frames']>=2280600
          assert a['counts']['conditioned_direct10_excluded']==0
          assert b['counts']['official_window_10hz_samples']>=500000
          assert b['counts']['complete_without_exact_native_timestamp']>0
          assert b['physical_possessions_certified']==0
          assert c['total_clip_requests']==1440 and c['single_scene_parity_cases']==9
          game='0022600129'
          packed=Path(a['per_game'][game]['path']).read_bytes()
          row=json.loads(gzip.decompress(packed))['official_paired_windows'][0]
          start=((row[0]+99)//100)*100
          out=query(Path('.'),game,start,min(start+900,row[1]),hz=10)
          assert out['rows'] and out['physical_possessions_certified']==0
          print('IGP68_CONTINUOUS_QUERY_ACCEPTED',{'games':68,'samples':b['counts']['official_window_10hz_samples'],
                'complete':b['counts']['complete_official_ten_ball_samples']})
          PY
          cp gamepulse/fusion/qa/igp_progress_20261030/igp_68_official_ten_scene_possession_ab_v3.json "$RUNNER_TEMP/official-v3.json"
          cp gamepulse/fusion/qa/igp_progress_20261030/igp_68_continuous_scene_full_qa_v1.json "$RUNNER_TEMP/continuous-v1.json"
          cp gamepulse/fusion/qa/igp_progress_20261030/igp_native_scene_batch_query_real_qa_v2.json "$RUNNER_TEMP/batch-v2.json"
          cp -R gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/official_ten_scene_possession_68_v3 "$RUNNER_TEMP/official-v3-sidecars"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B continuous-qa "origin/$BRANCH"
          cp "$RUNNER_TEMP/official-v3.json" gamepulse/fusion/qa/igp_progress_20261030/igp_68_official_ten_scene_possession_ab_v3.json
          cp "$RUNNER_TEMP/continuous-v1.json" gamepulse/fusion/qa/igp_progress_20261030/igp_68_continuous_scene_full_qa_v1.json
          cp "$RUNNER_TEMP/batch-v2.json" gamepulse/fusion/qa/igp_progress_20261030/igp_native_scene_batch_query_real_qa_v2.json
          cp -R "$RUNNER_TEMP/official-v3-sidecars" gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/
          git add -f gamepulse/fusion/qa/igp_progress_20261030/igp_68_official_ten_scene_possession_ab_v3.json
          git add -f gamepulse/fusion/qa/igp_progress_20261030/igp_68_continuous_scene_full_qa_v1.json
          git add -f gamepulse/fusion/qa/igp_progress_20261030/igp_native_scene_batch_query_real_qa_v2.json
          git add -f gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/official_ten_scene_possession_68_v3/
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): accept full68 bounded continuous native scene'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_68_CONTINUOUS_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
