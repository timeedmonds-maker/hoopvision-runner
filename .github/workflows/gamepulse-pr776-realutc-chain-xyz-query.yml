name: PR776 query original source frames by NBA realworld UTC chain
# Source-verified private readback; no original XYZ values published to public runner logs.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-realutc-chain-xyz-query.yml']
permissions: {contents: read}
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and clone canonical existing private PR
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Test and query original source Rockets Spurs plus one of eight newer games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_nba_realutc_provisional_chain_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p test_query_igp_nba_realutc_provisional_chain_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261027/realutc_chain_source_query_v1
          test ! -e "$OUT"
          mkdir -p "$OUT"
          python3 gamepulse/fusion/query_igp_nba_realutc_provisional_chain_2026.py \
            --game-id 0022600009 --chain-id 0022600009-P1-C0003 --out "$OUT/rockets_spurs.json"
          python3 gamepulse/fusion/query_igp_nba_realutc_provisional_chain_2026.py \
            --game-id 0022600104 --chain-id 0022600104-P1-C0002 --out "$OUT/newer_game.json"
          python3 - "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          a=json.loads((p/'rockets_spurs.json').read_text())
          b=json.loads((p/'newer_game.json').read_text())
          assert a['total_unique_source_original_frames']==89
          assert a['direct_ten_plus_original_ball_frames']==66
          assert b['total_unique_source_original_frames']==89
          assert b['direct_ten_plus_original_ball_frames']==59
          assert a['official_chain_offense_team']=='SAS'
          assert a['physical_possessions_certified']==b['physical_possessions_certified']==0
          assert not a['gameclock_frame_alignment_independently_verified']
          print('IGP_NATIVE_REALUTC_CHAIN_QUERY_SOURCE_ACCEPTED',json.dumps({
              'Rockets_Spurs':{'native_frames':89,'ten_ball_direct':66},
              'Newer_game':{'native_frames':89,'ten_ball_direct':59},
              'physical_possessions_certified':0},sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 2
          git commit -q -m "data(igp): verify original player-ball frames by NBA timeActual chain across old and new games"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_ORIGINAL_REALUTC_CHAIN_QUERY_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$i"
          done
          exit 19
