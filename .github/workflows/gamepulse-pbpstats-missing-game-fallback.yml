name: Game Pulse source-checked PBPStats missing game native PPP
# Private three-game source-grain and score-reconciliation audit; never synthesize possession boundaries.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pbpstats-missing-game-fallback.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nba-private-native-pbpstats-gameid-fallback
  cancel-in-progress: false
jobs:
  validate-three-provider-gaps:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        game: ['0022600009','0022600099','0022600103']
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private-only data boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Independently reconcile PBPStats game-scoped five-man possessions
        run: |
          set -euo pipefail
          python3 tools/licensed_feed/pbpstats_missing_onoff_fallback.py --game "${{ matrix.game }}"
