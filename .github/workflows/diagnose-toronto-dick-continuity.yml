name: Diagnose Toronto Dick Continuity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-toronto-dick-continuity.yml'
      - 'scripts/diag_toronto_dick_continuity.py'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-northeast1-b
  INSTANCE: hv-dev-l4-tokyo
  CANDIDATE_PREFIX: 0b1290c674a3 # current-candidate-only
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Start retained Tokyo VM if stopped
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --format='value(status)')"
          echo "TOKYO_INSTANCE_STATUS_BEFORE=$STATUS"
          if test "$STATUS" != "RUNNING"; then
            gcloud compute instances start "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet
            echo "HV_DIAG_STARTED_INSTANCE=1" >> "$GITHUB_ENV"
          else
            echo "HV_DIAG_STARTED_INSTANCE=0" >> "$GITHUB_ENV"
          fi
          ok=0
          for i in $(seq 1 60); do
            if gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command='echo DIAG_SSH_OK' >/tmp/diag-ssh.out 2>/tmp/diag-ssh.err; then cat /tmp/diag-ssh.out; ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1 || { cat /tmp/diag-ssh.err; exit 3; }
      - name: Copy diagnostic
        run: gcloud compute scp scripts/diag_toronto_dick_continuity.py "$INSTANCE:/tmp/diag_toronto_dick_continuity.py" --zone "$ZONE" --project "$PROJECT_ID" --quiet
      - name: Locate and inspect newest exact-candidate Toronto continuity
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="sudo find /srv/hoopvision/runs -mindepth 1 -maxdepth 1 -type d -printf '%f\\n' | grep '$CANDIDATE_PREFIX' | sort -r | head -1")"
          test -n "$RUN_ID" || { echo "NO_EXACT_CANDIDATE_RUN_FOUND=$CANDIDATE_PREFIX"; exit 4; }
          echo "DIAG_RUN_ID=$RUN_ID"
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="sudo bash -lc 'ROOT=/srv/hoopvision/runs/$RUN_ID; echo DIAG_ROOT=\$ROOT; echo ===TOP_LEVEL===; find \$ROOT -maxdepth 2 -type f -printf "%P\\n" | sort | head -200; echo ===IDENTITY_CANDIDATES===; find \$ROOT -type f \( -name "*identity*" -o -name "*sam*" -o -name "*continuity*" -o -name "*status*" -o -name "*result*" \) -printf "%P\\n" | sort | head -300; if test -f \$ROOT/artifacts/global_identity/identity_assignments.csv; then sudo python3 /tmp/diag_toronto_dick_continuity.py \$ROOT/artifacts; else echo GLOBAL_IDENTITY_ASSIGNMENTS_MISSING; echo ===ARTIFACT_TREE===; find \$ROOT/artifacts -maxdepth 4 -type f -printf "%P\\n" 2>/dev/null | sort | head -500; fi'"
          echo '=== CONTAINER / PROCESS FAILURE BOUNDARY ==='
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="sudo bash -lc 'ROOT=/srv/hoopvision/runs/$RUN_ID; echo ===RUN_FILES_MTIME===; find \$ROOT -maxdepth 4 -type f -printf \"%TY-%Tm-%Td %TH:%TM:%TS %s %P\\n\" 2>/dev/null | sort | tail -120; echo ===RUN_LOG_TAILS===; for f in \$(find \$ROOT -maxdepth 4 -type f \\( -name \"*.log\" -o -name \"*.txt\" -o -name \"*stderr*\" -o -name \"*stdout*\" \\) 2>/dev/null | sort); do echo ---\$f; tail -n 160 \$f 2>/dev/null || true; done; echo ===CONTAINERS===; docker ps -a --no-trunc --format \"{{.ID}} {{.Names}} {{.Status}}\" | head -40; C=\$(docker ps -a --filter name=hvdev --format \"{{.ID}}\" | head -1); if test -n \"\$C\"; then echo ===LATEST_CONTAINER_INSPECT===; docker inspect \$C --format \"exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} finished={{.State.FinishedAt}}\"; echo ===LATEST_CONTAINER_LOG_TAIL===; docker logs --tail 300 \$C 2>&1 || true; fi'"
      - name: Stop VM if diagnostic started it
        if: always()
        shell: bash
        run: |
          if test "${HV_DIAG_STARTED_INSTANCE:-0}" = "1"; then gcloud compute instances stop "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet || true; fi
