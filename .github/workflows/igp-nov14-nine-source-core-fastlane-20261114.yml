# 2026-11-14 source security gate accepted in public_content_guard.py; rerun independently from raw SDK archive status.
name: IGP Nov14 nine-game official source fastlane
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-nov14-nine-source-core-fastlane-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: igp-nov14-nine-source-core-fastlane
  cancel-in-progress: false
jobs:
  official-companion-blueprint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public-to-private separation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
      - name: Ingest all nine official-final PBP, box, Blueprint, companion and chains without SDK wait
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27 scripts
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion:scripts
          python3 gamepulse/fusion/igp_official_20_additive_20261029.py --root . > "$RUNNER_TEMP/official.log"
          python3 gamepulse/fusion/igp_auto_extend_unified_season_2026.py --root . > "$RUNNER_TEMP/extend.log"
          python3 scripts/update_nba_blueprint_daily_2026_27.py --daily --lookback 7 > "$RUNNER_TEMP/blueprint-update.log" 2>&1 || echo IGP_NOV14_BLUEPRINT_PROVIDER_RETRY_PENDING
          python3 scripts/build_nba_blueprint_2026_27.py > "$RUNNER_TEMP/blueprint-build.log"
          python3 gamepulse/fusion/igp_post56_original_companion_index_v1.py --root . > "$RUNNER_TEMP/companion.log"
          python3 gamepulse/fusion/igp_post56_blueprint_original_index_v1.py --root . > "$RUNNER_TEMP/bpindex.log"
          python3 gamepulse/fusion/igp_post56_official_logical_chain_index_v1.py --root . > "$RUNNER_TEMP/chain.log"
          python3 gamepulse/fusion/igp_post56_native_index_refresh_v1.py --root . > "$RUNNER_TEMP/native.log"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          base=Path('gamepulse/fusion')
          master=json.loads((base/'materialized/igp_2026_27_unified_season_v3/index.json').read_bytes())
          add=json.loads(Path(master['post56_additive_oct28']['index']).read_bytes())
          expected=[f'002260{i:04d}' for i in range(34,43)]
          old=json.loads((base/'materialized/igp_full174_unified_source_default_v1/index.json').read_bytes())
          assert old['counts']['games']==174 and old['counts']['official_FGA']==30585,'FULL174_BASELINE_NOT_FROZEN'
          assert set(expected)<=set(add['games']),'NINE_OFFICIAL_FINAL_GAMES_NOT_YET_INDEXED'
          grades={}
          for gid in expected:
            g=add['games'][gid]
            p=Path(g['official_pbp_path'])
            data=p.read_bytes()
            assert hashlib.sha256(data).hexdigest()==g['official_pbp_sha256'],gid+':PBP_SHA'
            events=json.loads(data)
            assert events['game_id']==gid and len(events['actions'])==g['official_pbp_actions'],gid+':PBP'
            assert g['nba_logical_chain_original_index_sha256'],gid+':LOGICAL_CHAIN_MISSING'
            row=g.get('source_capture_grades') or {}
            grades[gid]={'official_actions':len(events['actions']),
                         'official_fga':sum(x['action_type'] in ('2pt','3pt') for x in events['actions']),
                         'official_pbp_sha256':g['official_pbp_sha256'],
                         'logical_chain_sha256':g['nba_logical_chain_original_index_sha256'],
                         'original_native_13part_certified':bool(g.get('original_source_13_part_complete')),
                         'original_companion_grade':row.get('original_companion','PENDING'),
                         'original_blueprint_grade':row.get('original_nba_blueprint','PENDING'),
                         'raw_29joint_pose_certified':False,
                         'physical_possessions_certified':0}
          assert len(set(expected))==9 and not set(expected)&set(old['additive_game_ids'])
          dest=base/'qa/igp_20261114/nov14_nine_ingest_fastlane_sourcegrade_v1.json'
          dest.parent.mkdir(parents=True,exist_ok=True)
          receipt={'schema':'igp.nov14-nine-sourcegrade-fastlane.v1',
             'us_game_date':'2026-11-13','nz_game_date':'2026-11-14',
             'expected_game_count':9,'expected_game_ids':expected,
             'verified_original_official_game_count':9,'total_official_indexed_games':master['total_indexed_games_including_additive'],
             'full174_immutable_manifest_sha256':hashlib.sha256(
                (base/'materialized/igp_full174_unified_source_default_v1/index.json').read_bytes()).hexdigest(),
             'release_status':'SOURCE_LAYER_INGESTION_NOT_YET_FULL183_ACCEPTANCE',
             'games':grades}
          dest.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('IGP_NOV14_ALL_NINE_OFFICIAL_SHA_INDEXED',sum(v['official_actions'] for v in grades.values()),
                'FGA',sum(v['official_fga'] for v in grades.values()),
                'native_full13',sum(v['original_native_13part_certified'] for v in grades.values()))
          PY
          python3 gamepulse/fusion/igp_fullx_incremental_release_manifest_v1.py --root . > "$RUNNER_TEMP/fullx.log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/official_pbp_timing gamepulse/fusion/evidence gamepulse/fusion/qa/igp_progress_20261030 gamepulse/fusion/qa/igp_20261114 gamepulse/fusion/qa/igp_fullx gamepulse/fusion/materialized/igp_2026_27_unified_season_v3 data/extensions/nba_blueprint_2026_27
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_NOV14_NINE_SOURCE_ALREADY_INDEXED; exit 0; fi
          git commit -q -m "data(igp): SHA-index all nine Nov 13 US NBA official games and provider source grades"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || { git rebase --abort; echo IGP_FASTLANE_CONCURRENT_SOURCE_INDEX_REBUILD_REQUIRED; exit 41; }
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_NOV14_NINE_OFFICIAL_SOURCE_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 23

  original-live-nine:
    needs: official-companion-blueprint
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard private original player-ball XYZ
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: SHA-read original live sources, deduplicate native timebase and materialize all nine privately
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            'gamepulse/fusion/live_original_20261114/**' \
            'gamepulse/fusion/igp_extract_all_original_sdk_xyz_2026.py' \
            'gamepulse/fusion/igp_0212_live_original_xyz_materialize_v1.py' \
            'gamepulse/fusion/igp_nov14_nine_original_live_xyz_materialize_v1.py' \
            'gamepulse/fusion/materialized/igp_full174_unified_source_default_v1/index.json' \
            'gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json'
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_nov14_nine_original_live_xyz_materialize_v1.py
          python3 gamepulse/fusion/igp_nov14_nine_original_live_xyz_materialize_v1.py --root . > "$RUNNER_TEMP/native-private.log"
          python3 - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path('gamepulse/fusion/qa/igp_20261114/nov14_nine_original_live_xyz_sourcegraded_v1.json')
          q=json.loads(p.read_bytes())
          assert len(q['games'])==9
          assert q['games_with_player_ball_source']>0
          assert q['original_13_part_fullgame_certified'] is False
          assert q['independent_physical_accuracy_certified'] is False
          print('IGP_NOV14_PRIVATE_LIVE_XYZ_SOURCE_SHA_VERIFIED',
                q['games_with_player_ball_source'],
                q['total_original_native_timestamps'],
                q['total_direct_original_player_and_ball_timestamps'],
                hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/materialized/igp_nov14_nine_live_original_xyz_v1 \
                     gamepulse/fusion/qa/igp_20261114/nov14_nine_original_live_xyz_sourcegraded_v1.json \
                     gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json
          git diff --cached --check
          git commit -q -m "data(igp): preserve SHA-verified original nine-game live XYZ with source grades"
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || { git rebase --abort; echo IGP_NOV14_CONCURRENT_SOURCE_CHANGED_RETRY; exit 41; }
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo IGP_NOV14_SHA_VERIFIED_LIVE_XYZ_PRIVATE_COMMITTED; exit 0; fi
            sleep "$n"
          done
          exit 23

  recover-nov13-original-shot-source-gaps:
    # Original companion/Blueprint retries are explicit/manual; newly added independent NBA shotquality source runs on push.
    # The immutable accepted FULL174 and FULL183 v2 releases are never modified.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      IGP_SDK_INIT_TIMEOUT_MS: '35000'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify public/private separation and CPU-only original SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Clone exact current source-graduated private Full183 originals
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_full183_gap_recovery_v1.py' \
            '/gamepulse/fusion/igp_post56_original_companion_index_v1.py' \
            '/gamepulse/fusion/igp_post56_blueprint_original_index_v1.py' \
            '/gamepulse/fusion/materialized/igp_full174_unified_source_default_v1/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/evidence/companion_sdk_original_*/**' \
            '/gamepulse/fusion/official_pbp_timing/games/**' \
            '/gamepulse/fusion/qa/igp_progress_20261030/**' \
            '/data/extensions/nba_blueprint_2026_27/games/**' \
            '/scripts/update_nba_blueprint_daily_2026_27.py' \
            '/scripts/build_nba_blueprint_2026_27.py'
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_full183_gap_recovery_v1.py
          python3 -m py_compile gamepulse/fusion/igp_post56_original_companion_index_v1.py
          python3 -m py_compile gamepulse/fusion/igp_post56_blueprint_original_index_v1.py
      - name: Recheck all nine official NBA Blueprint reports for late-published shots
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          PYTHONPATH=scripts:gamepulse/fusion python3 gamepulse/fusion/igp_full183_gap_recovery_v1.py --mode blueprint --root .
      - name: Install existing authorized original SDK client
        shell: bash
        run: |
          set -euo pipefail
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          cd tools/licensed_feed
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Retry nine original companion event programs with priority for 0036 and 0042
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          PYTHONPATH=scripts:gamepulse/fusion python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('g','gamepulse/fusion/igp_full183_gap_recovery_v1.py')
          g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g)
          a,_=g.init(__import__('pathlib').Path('.'))
          assert len(g.IDS)==9
          print('FULL183_ORIGINAL_SDK_PRIORITY_GAMES_VALIDATED',len(g.IDS))
          PY
          for gid in 0022600036 0022600042 0022600034 0022600035 0022600037 0022600038 0022600039 0022600040 0022600041; do
            tipoff=$(python3 -c 'import json,sys;print(json.load(open("data/extensions/nba_blueprint_2026_27/games/"+sys.argv[1]+"/blueprint_report_raw.json"))["game_header"]["gameTimeUTC"])' "$gid")
            attempts=1
            if test "$gid" = "0022600036" || test "$gid" = "0022600042"; then attempts=2; fi
            for number in $(seq 1 "$attempts"); do
              probe="$RUNNER_TEMP/igp-full183-gap-$gid-$number"
              mkdir -p "$probe"
              if (cd "$GITHUB_WORKSPACE" && NBA_GAME_ID="$gid" NBA_TIPOFF_UTC="$tipoff" IGP_PRIVATE_CAPTURE_DIR="$probe" node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/sdk-private-$gid-$number.log" 2>&1); then
                PYTHONPATH=scripts:gamepulse/fusion python3 gamepulse/fusion/igp_full183_gap_recovery_v1.py --mode companion --game-id "$gid" --probe "$probe" --root .
              else
                echo "FULL183_AUTHORIZED_SDK_RETRY_EXECUTION_UNAVAILABLE $gid $number"
              fi
            done
          done
      - name: Rebuild exact official shot crosswalks and validate parent SHA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          PYTHONPATH=scripts:gamepulse/fusion python3 gamepulse/fusion/igp_full183_gap_recovery_v1.py --mode reconcile --root .
          python3 - <<'PY'
          import json
          p='gamepulse/fusion/qa/igp_20261114/nov14_full183_gap_recovery_v1.json'
          d=json.load(open(p))
          assert d['provider_values_inferred']==0 and d['original_full183_v2_immutable']
          assert sum(v['official_FGA'] for v in d['post_recovery'].values())==1612
          print('FULL183_SOURCE_RECOVERY_QA_PASS',
                d['upgrade_evidence_count'],d['new9_exact_source_union'],
                d['unresolved_official_FGA'])
          PY
      - name: Commit only private SHA-preserved original revisions and receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/evidence/companion_sdk_original_002260003* gamepulse/fusion/evidence/companion_sdk_original_002260004* \
            gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json \
            gamepulse/fusion/qa/igp_20261114/nov14_full183_gap_recovery_v1.json \
            gamepulse/fusion/qa/igp_progress_20261030/igp_post56_companion_11_original_source_enrichment_v1.json \
            gamepulse/fusion/qa/igp_progress_20261030/igp_post56_blueprint_12_original_sha_join_v1.json \
            data/extensions/nba_blueprint_2026_27/games/002260003* data/extensions/nba_blueprint_2026_27/games/002260004*
          if test -d data/extensions/nba_blueprint_2026_27/source_revision_history; then
            git add --sparse -f data/extensions/nba_blueprint_2026_27/source_revision_history
          fi
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL183_NINE_GAME_ORIGINAL_SOURCE_UNCHANGED; exit 0; fi
          git commit -q -m "data(igp): source-only FULL183 November 13 nine-game gap recovery, versioned SHA"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || { git rebase --abort; echo FULL183_SOURCE_CHANGED_RECONCILE_RETRY; exit 41; }
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL183_GAP_RECOVERY_ORIGINAL_SOURCE_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 23

  recover-nov13-shotquality-video:
    # Original public NBA shotqualityvideologs is a separate independent source
    # from partial companion and Blueprint, and can supply original xFG/media.
    # All NBA event rows, media URLs and player details remain PRIVATE in 104.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source gate and private Git authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Clone exact canonical 183-game private official source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_full183_shotquality_original_recovery_v1.py' \
            '/gamepulse/fusion/materialized/igp_full174_unified_source_default_v1/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/official_pbp_timing/games/**' \
            '/gamepulse/fusion/evidence/shotqualityvideologs_original_20261113/**' \
            '/gamepulse/fusion/qa/igp_20261114/nov14_shotqualityvideologs_source_recheck_v1.json'
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_full183_shotquality_original_recovery_v1.py
      - name: Recover original source for missing 0036 and second-half 0042
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_full183_shotquality_original_recovery_v1.py \
            --games 0022600036,0022600042 --workers 4 --root .
      - name: Backfill official published xFG and NBA media source for other seven
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_full183_shotquality_original_recovery_v1.py \
            --games 0022600034,0022600035,0022600037,0022600038,0022600039,0022600040,0022600041 \
            --workers 5 --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('gamepulse/fusion/qa/igp_20261114/nov14_shotqualityvideologs_source_recheck_v1.json').read_bytes())
          d=q['provider_recovered_source_games']
          assert len(d)==9 and q['modelled_xfg_values']==0 and q['original_full183_v2_immutable']
          assert sum(x['official_FGA'] for x in d.values())==1612
          print('FULL183_ORIGINAL_INDEPENDENT_SHOTQUALITY_SOURCE_QA_PASS',
                sum(x['numeric_xfg'] for x in d.values()),
                sum(x['exact_original_video_references'] for x in d.values()))
          PY
      - name: Version SHA-pinned original independent source only on private branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/evidence/shotqualityvideologs_original_20261113 \
            gamepulse/fusion/qa/igp_20261114/nov14_shotqualityvideologs_source_recheck_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo FULL183_SHOTQUALITY_SOURCE_UNCHANGED
            exit 0
          fi
          git commit -q -m "data(igp): preserve nine NBA ShotQualityVideoLogs original shot xFG and media evidence"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || { git rebase --abort; echo FULL183_SHOTQUALITY_SOURCE_CHANGED_RETRY; exit 41; }
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL183_ORIGINAL_SHOTQUALITY_SHA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 23
