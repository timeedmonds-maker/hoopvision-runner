name: IGP NBA definition-aligned Rockets Bucks touches v2 candidate QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-definition-aligned-touch-v2-rockets-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v31-halfcourt-touch-sequence-query-20261031
      PINNED_PRIVATE_SHA: 38f70587f778ef8dc28b2787601c03f9e2680da8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public source policy and pinned private source branch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion gamepulse/live
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test source-free possession-aware touch grouping
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_nba_touch_definition_candidate_v2.py'
      - name: Benchmark source game against user-supplied NBA player touches
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          ref=gamepulse/fusion/benchmarks/nba_0022600138_rockets_user_screenshot_playertrack_v1.json
          out="$RUNNER_TEMP/igp-touch-v2-private.json"
          python3 gamepulse/fusion/igp_nba_touch_definition_candidate_v2.py \
            --root . --game-id 0022600138 --nba-playertrack-file "$ref" --gap-ms 1200 --output "$out"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'igp-touch-v2-private.json'
          r=json.loads(p.read_text())
          assert r['total_accuracy']['players']==7 and r['total_accuracy']['nba_total']==195
          assert r['paint_accuracy']['players']==7 and r['paint_accuracy']['nba_total']==20
          assert r['certified_physical_touches']==0 and r['source_frames']>30000
          print('IGP_NBA_DEFINITION_ALIGNED_TOUCHES_V2_VALIDATED',json.dumps({
            'nba_touches':r['total_accuracy']['nba_total'],
            'igp_touches':r['total_accuracy']['igp_total'],
            'igp_touch_wape':r['total_accuracy']['weighted_absolute_percentage_error'],
            'nba_paint_touches':r['paint_accuracy']['nba_total'],
            'igp_paint_receptions':r['paint_accuracy']['igp_total'],
            'igp_paint_wape':r['paint_accuracy']['weighted_absolute_percentage_error'],
            'merged_dribble_candidates':r['merge_qa']['merged_dribble_candidates'],
            'original_source_frames':r['source_frames']},sort_keys=True))
          PY
      - name: Publish private benchmark without raw XYZ or player traces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'igp-touch-v2-private.json'
          raw=p.read_bytes()
          assert len(raw)<950000
          endpoint='repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/igp_rockets_bucks_touch_definition_v2_candidate_benchmark.json'
          branch=os.environ['BRANCH']
          old=subprocess.run(['gh','api',endpoint+'?ref='+branch],capture_output=True,text=True)
          body={'branch':branch,'message':'qa(igp): original-source NBA-definition touch and paint reception test, research only','content':base64.b64encode(raw).decode()}
          if old.returncode==0:body['sha']=json.loads(old.stdout)['sha']
          out=subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],input=json.dumps(body),capture_output=True,text=True)
          if out.returncode:raise RuntimeError('PRIVATE_TOUCH_QA_WRITE_FAILED')
          print('IGP_NBA_TOUCH_DEFINITION_V2_PRIVATE_RESEARCH_RESULT_SAVED')
          PY