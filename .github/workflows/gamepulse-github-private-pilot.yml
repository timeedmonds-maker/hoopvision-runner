name: Game Pulse GitHub-only private Release pilot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gamepulse-github-private-pilot.yml"
  pull_request:
    paths:
      - ".github/workflows/gamepulse-github-private-pilot.yml"
      - "tools/licensed_feed/github_private_release*"
      - "tools/public_content_guard.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-github-only-private-acceptance
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce zero-public-data allowlist
        run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install public licensed SDK, no install scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Synthetic tests for 104-only private GitHub Releases readback
        working-directory: tools/licensed_feed
        run: node --test github_private_release.test.mjs
  private-acceptance:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify GitHub secret is configured
        env:
          SECRET_PRESENT: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SECRET_PRESENT" = true || { echo 'PRIVATE_104_RELEASE_TOKEN_MISSING'; exit 3; }
      - name: Install public SDK, no package scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Capture 300 windows, upload directly to private 104 and verify exact SHA
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: node github_private_release.mjs
