name: Find Exact Adams Hawks Event
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/find-adams-hawks-event.yml'
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-24.04
    steps:
      - name: Scan NBA clip event titles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,html,concurrent.futures
          GAME='0012500014'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          H={'User-Agent':UA,'Referer':'https://clips.nba.com/','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'}
          def one(ev):
            try:
              url=f'https://clips.nba.com/?gameNo={GAME}&eventNum={ev}&source=grs'
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=8) as r:
                txt=r.read(50000).decode('utf-8','ignore')
              m=re.search(r'<title[^>]*>(.*?)</title>',txt,re.I|re.S)
              title=re.sub(r'\s+',' ',html.unescape(m.group(1))).strip() if m else ''
              valid='Period:' in title
              return ev,title,valid
            except Exception as e:
              return ev,'',False
          found=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            for ev,title,valid in ex.map(one,range(250,551)):
              if valid:
                if 'Adams' in title or 'Thompson' in title or 'Dunk' in title or 'DUNK' in title:
                  found.append((ev,title))
          for ev,title in found:
            print('EVENT',ev,title)
          exact=[x for x in found if 'Adams' in x[1] and ('Dunk' in x[1] or 'DUNK' in x[1])]
          print('EXACT',exact)
          PY
