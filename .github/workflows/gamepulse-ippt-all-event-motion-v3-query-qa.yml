name: IPPT original NBA 22314 event PBP-first scorer XY causal source motion v3 query acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-all-event-motion-v3-query-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  private-readonly-all-event-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      RESEARCH_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_CODE_SHA: 5f46276a9263345df29834cc9366d91865de68af
      DATA_BRANCH: data/ippt-all-pbp-native-xy-causal-motion-36-20261028-v3
      EXPECTED_DATA_SHA: 5deb5ee1ef3b1cec5ed336a705a126e79a26ad0c
      DB_FILE: gamepulse/fusion/materialized/ippt_all_pbp_native_xy_motion_36_v3/nba_pbp_original_native_xy_motion.sqlite
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source privacy guard and exact private original SHA query checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$RESEARCH_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-code"
          git -C "$RUNNER_TEMP/igp-code" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/igp-code" rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$DATA_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private-db"
          git -C "$RUNNER_TEMP/igp-private-db" sparse-checkout set gamepulse/fusion/materialized/ippt_all_pbp_native_xy_motion_36_v3
          test "$(git -C "$RUNNER_TEMP/igp-private-db" rev-parse HEAD)" = "$EXPECTED_DATA_SHA"
          echo "IPPT_CODE=$RUNNER_TEMP/igp-code" >> "$GITHUB_ENV"
          echo "IPPT_DB=$RUNNER_TEMP/igp-private-db/$DB_FILE" >> "$GITHUB_ENV"
      - name: Source-free all-event query stable pages and unknown-physics safety regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_CODE"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_ippt_all_pbp_native_motion_v3_2026.py
          python3 -m unittest -v gamepulse/fusion/test_query_igp_ippt_all_pbp_native_motion_v3_2026.py
      - name: Full 22314 PBP actions private licensed XY readback and independent source SHA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_CODE"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          from query_igp_ippt_all_pbp_native_motion_v3_2026 import search,event
          p=Path(os.environ["IPPT_DB"])
          m=json.loads(p.with_name("original_source_motion_v3_SHA_manifest.json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["v3_private_SQLite_SHA256"]
          assert m["counts"]["pbp_event"]==22314
          assert m["counts"]["event_source_motion_hypothesis"]==5893
          total=0;offset=0;with_source=0;shots=0
          while True:
              page=search(p,offset=offset,limit=100)
              assert page["total_matching_official_PBP_actions"]==22314
              rows=page["rows"]
              assert all(a["physical_utc_ms"] is None for a in rows)
              assert all(a["motion_video_verified"] in (None,0) for a in rows)
              total+=len(rows)
              with_source+=sum(a["motion_supported_original_native_utc_ms"] is not None for a in rows)
              shots+=sum(a["action_type"] in ("2pt","3pt","heave") for a in rows)
              if page["next_offset"] is None:break
              assert page["next_offset"]>offset
              offset=page["next_offset"]
          assert (total,with_source,shots)==(22314,5893,6451),(total,with_source,shots)
          sample=event(p,"0022600009",7)
          assert sample and sample["NBA_event_primary_key"]["action_number"]==7
          assert sample["NBA_official_event"]["physical_utc_ms"] is None
          assert sample["NBA_PBP_scorer_UTC_is_not_physical_event_UTC"]
          rebound=search(p,action_type="rebound")
          assert rebound["total_matching_official_PBP_actions"]==3948
          assert search(p,action_type="rebound",has_motion=True)["total_matching_official_PBP_actions"]==397
          assert search(p,has_motion=False)["total_matching_official_PBP_actions"]==16421
          assert search(p,action_type="turnover")["total_matching_official_PBP_actions"]==1215
          assert search(p,action_type="substitution")["total_matching_official_PBP_actions"]==5070
          print("IPPT_PRIVATE_QUERY_V3_ALL22K_NATIVE_XY_CAUSAL_AND_SOURCE_MOTION_PASS",json.dumps(
            {"official_PBP_actions":total,"source_motion_candidates":with_source,
             "official_shots":shots,"official_rebounds":3948,
             "strict_native_rebound_candidates":397,
             "video_certified_event_UTC":0},sort_keys=True))
          PY
      - name: Publish aggregate-only private query acceptance and remove transient licensed source
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          r={"github_run_id":os.environ["GITHUB_RUN_ID"],
             "prior_job_status":os.environ["QA_JOB_RESULT"],
             "research_code_SHA":os.environ["EXPECTED_CODE_SHA"],
             "private_db_commit_SHA":os.environ["EXPECTED_DATA_SHA"],
             "expected_NBA_PBP_rows":22314,"expected_original_source_motion_candidates":5893,
             "physical_event_time_independently_video_certified":False}
          (root/"ippt_private_v3_readonly_query_receipt.md").write_text(
            "All NBA PBP actions and original SDK native XYZ query tested privately. Public receipt has counts only; no actor coordinates or per-event UTC.\n\n~~~json\n"+
            json.dumps(r,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/igp-code" "$RUNNER_TEMP/igp-private-db"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_private_v3_readonly_query_receipt.md"
# Never emit private licensed NBA original XY, per-event time, or player identities on public runner.
