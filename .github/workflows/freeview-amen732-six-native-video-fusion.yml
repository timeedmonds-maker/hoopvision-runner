# Real multi-video workflow: six complete NBA original MP4s from private 104.
# Ephemeral CPU worker; original footage, decoded frames, model positions, and
# rendered UHD videos stay private. Public repo stores only workflow source.
name: Amen732 six full native NBA videos to 3D moving-camera MP4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-six-native-video-fusion.yml']
permissions:
  contents: read
concurrency:
  group: amen732-sixvideo-fusion-private
  cancel-in-progress: false
jobs:
  fuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: 
          persist-credentials: false
      - name: Verify public content guard and private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN" || { echo PRIVATE_TOKEN_MISSING; exit 3; }
          # Do not exhaust the private PAT quota on a redundant early check.
          # Source hashes are validated after download by the private worker.
          echo PRIVATE_TOKEN_PROVISIONED_WITHOUT_REST_PRECHECK
      - name: Download six original MP4 videos and SHA-verifiable source manifests into ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-sixvideo"
          mkdir -p "$ROOT/input" "$ROOT/private_code" "$ROOT/output"
          TAG=freeview-native-0022600009-732
          # Retry only the known provider rate-limit window, never disable source QA.
          # A source download is successful only if all six private native videos
          # plus both native manifests can be verified byte-for-byte later.
          good=0
          for attempt in $(seq 1 55); do
            if gh release download "$TAG" --repo timeedmonds-maker/104 --dir "$ROOT/input" \
                 --pattern '*.mp4' --pattern source_manifest.json \
                 --pattern native_presentation_timestamps.json --skip-existing >/dev/null 2>"$ROOT/download_error.txt"; then
              good=1; break
            fi
            python3 - "$ROOT/download_error.txt" <<'PY'
          import sys
          msg=open(sys.argv[1]).read().lower()
          classes={"rate_limit":("rate limit","rate_limit","http 429"),
                   "permission":("permission","forbidden","authentication","http 403"),
                   "not_found":("not found","http 404","could not resolve"),
                   "cli_syntax":("unknown flag","accepts","unknown shorthand")}
          flags=[key for key,phrases in classes.items() if any(p in msg for p in phrases)]
          print("PRIVATE_SOURCE_DOWNLOAD_ERROR_CLASS",",".join(flags) or "unclassified")
          PY
            if grep -Eqi "rate limit|rate_limit|http 429|http 403|forbidden" "$ROOT/download_error.txt"; then
              echo PRIVATE_GITHUB_TOKEN_QUOTA_OR_ACCESS_PENDING
              sleep 60
            else
              echo PRIVATE_RELEASE_DOWNLOAD_FAILED_NON_QUOTA_ERROR
              exit 5
            fi
          done
          test "$good" = 1 || { echo PRIVATE_RELEASE_NOT_FETCHED_WITHIN_BOUND; exit 6; }
          for spec in broadcast high-tight left-above-rim right-above-rim left-slash right-slash; do
            test -s "$ROOT/input/0022600009-e732-$spec.mp4"
          done
          test -s "$ROOT/input/source_manifest.json"
          test -s "$ROOT/input/native_presentation_timestamps.json"
          REF=91ad3a2169e3531334e0aeca0b77aae7b0cf0392
          for file in amen732_native_six_video_frame_sets.py amen732_da3_unposed_sixview_trial.py amen732_native_sixvideo_fusion_mp4.py; do
            fetched=0
            for attempt in $(seq 1 12); do
              if gh api "repos/timeedmonds-maker/104/contents/hoopvision/freeview/$file?ref=$REF" \
                  --jq .content 2>"$ROOT/code_error.txt" | base64 -d > "$ROOT/private_code/$file"; then
                test -s "$ROOT/private_code/$file" && fetched=1 && break
              fi
              if grep -qi "rate limit" "$ROOT/code_error.txt"; then sleep 60; else break; fi
            done
            test "$fetched" = 1 || { echo PRIVATE_SOURCE_WORKER_FETCH_FAILED; exit 7; }
          done
          python3 -m py_compile "$ROOT/private_code/"*.py
          echo ALL_SIX_ORIGINAL_MP4S_STAGED_NO_PUBLIC_ARTIFACT
      - name: Pin open-source Depth Anything 3 and install CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          DA3="$RUNNER_TEMP/da3-source"
          mkdir -p "$DA3"
          git -C "$DA3" init -q
          git -C "$DA3" fetch --quiet --depth 1 https://github.com/ByteDance-Seed/Depth-Anything-3.git 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
          git -C "$DA3" checkout -q --detach FETCH_HEAD
          test "$(git -C "$DA3" rev-parse HEAD)" = 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
          python3 -m pip install -q --disable-pip-version-check 'numpy<2' 'opencv-python-headless==4.10.0.84' pillow einops huggingface-hub omegaconf safetensors timm e3nn trimesh imageio 'transformers>=4.45,<5' plyfile 'moviepy==1.0.3' evo addict pycolmap pillow-heif imageio-ffmpeg
          python3 -m pip install -q --disable-pip-version-check torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q --disable-pip-version-check --no-deps -e "$DA3"
          python3 - <<'PY'
          import imageio_ffmpeg,torch
          print("SIXVIDEO_CPU_MODEL_FFMPEG_READY",torch.__version__)
          assert imageio_ffmpeg.get_ffmpeg_exe()
          PY
      - name: Fuse 3 temporal slices from six full MP4s and render two UHD orbit videos
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-sixvideo"
          ENCODER="$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          python3 "$ROOT/private_code/amen732_native_sixvideo_fusion_mp4.py" \
            --root "$ROOT/input" --out "$ROOT/output" --ffmpeg "$ENCODER"
          python3 - "$ROOT/output/amen732-native-sixvideo-3d-reconstruction-qa.json" <<'PY'
          import json,sys
          from pathlib import Path
          q=json.load(open(sys.argv[1]))
          assert q["real_six_video_multi_camera_reconstruction_executed"]
          assert q["input_original_camera_video_count"]==6
          assert q["total_native_frame_observations"]==18
          assert len(q["per_time_sixview_model_diagnostics"])==3
          assert len(q["outputs"])==2
          for o in q["outputs"]:
              assert o["encoded_dimensions"]==[3840,2160]
              assert o["frames"]==96
              assert Path(sys.argv[1]).parent.joinpath(o["mp4"]).stat().st_size>10000
          assert not q["full_360_sweep_coverage_certified"]
          print("REAL_SIXVIDEO_3D_FUSION_UHD_MP4_QA_PASS",q["total_native_frame_observations"])
          PY
      - name: Upload diagnostic MP4s ONLY to private repository and SHA verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-sixvideo/output"
          TAG=freeview-amen732-six-native-video-fusion-20261028
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title 'Amen732 six-native-video 3D fused moving-camera UHD proof' \
              --notes 'Uncalibrated six-input-video 3D scene and 170/360-degree model-only moving-camera diagnostics; not physically certified.' \
              --latest=false >/dev/null
          fi
          gh release upload "$TAG" \
            "$ROOT/amen732-sixvideo-wide170-candidate-3840x2160.mp4" \
            "$ROOT/amen732-sixvideo-full360-diagnostic-3840x2160.mp4" \
            "$ROOT/amen732-native-sixvideo-3d-reconstruction-qa.json" \
            "$ROOT/decoded_native/amen732-six-native-video-window-source-qa.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$RUNNER_TEMP/sixvideo-release.json"
          python3 - "$ROOT" "$RUNNER_TEMP/sixvideo-release.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);assets={x["name"]:x for x in json.load(open(sys.argv[2]))["assets"]}
          names=["amen732-sixvideo-wide170-candidate-3840x2160.mp4",
                 "amen732-sixvideo-full360-diagnostic-3840x2160.mp4",
                 "amen732-native-sixvideo-3d-reconstruction-qa.json",
                 "amen732-six-native-video-window-source-qa.json"]
          for name in names:
              p=root/name
              if name=="amen732-six-native-video-window-source-qa.json":p=root/"decoded_native"/name
              assert assets[name]["digest"]=="sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(),name
          print("PRIVATE_SIXVIDEO_MP4_SHA_VERIFIED",len(names))
          PY
