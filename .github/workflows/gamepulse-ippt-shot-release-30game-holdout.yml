name: IPPT original NBA shot release 30 untouched games paired validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-shot-release-30game-holdout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  untouched:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and SHA-pinned original NBA + Blueprint
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
            gamepulse/fusion data/extensions/nba_blueprint_2026_27
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Predeclared physics and paired-control test suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
             gamepulse/fusion/igp_ippt_source_ball_shot_release_candidate_2026.py \
             gamepulse/fusion/igp_ippt_shot_release_30game_holdout_2026.py
          python3 -m unittest -v \
             gamepulse/fusion/test_igp_ippt_source_ball_shot_release_candidate_2026.py \
             gamepulse/fusion/test_igp_ippt_shot_release_30game_holdout_2026.py
      - name: Full 30 completely unused original NBA game source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_ippt_shot_release_30game_holdout_2026.py --root .
          echo "IPPT_30_UNTOUCHED_RELEASE_PAIRED_BENCHMARK_PASS"

# Original NBA event-release 30-game independent source comparison.

