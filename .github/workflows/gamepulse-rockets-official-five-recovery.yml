name: Rockets independent NBA five-man source recovery
# Reviewed CPU-only provider recovery. Private source remains in 104; public logs contain aggregate QA.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-official-five-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_PIN: f555326aa40b9afddd63e63dc94bdcf2b1b5213a
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GAME_ID: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private source and run existing NBA provider validator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          mkdir -p "$RUNNER_TEMP/official-five"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/validate_official_onoff_2026.py?ref=$PRIVATE_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/official-five/validator.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/index/games/$GAME_ID.json?ref=$PRIVATE_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/official-five/view.json"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/qa/rockets_original_lineup_conflicts_0022600009_20261026.json?ref=$PRIVATE_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/official-five/conflicts.json"
          python3 -m py_compile "$RUNNER_TEMP/official-five/validator.py"
          python3 - <<'PY'
          import base64, importlib.util, json, os, subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"official-five"
          spec=importlib.util.spec_from_file_location("validator",root/"validator.py")
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          view=json.loads((root/"view.json").read_text())
          qa, result=module.validate_game(view)
          verified=all(
              qa["teams"].get(team,{}).get("official_single_game_scope_verified") and
              qa["teams"][team].get("official_full_game_lineup_time_covered") and
              qa["teams"][team].get("official_5man",0)>0
              for team in ("HOU","SAS")
          )
          print("OFFICIAL_FIVE_RECOVERY",json.dumps({
              "game_id":os.environ["GAME_ID"],"verified":bool(verified),
              "teams":{team:{
                  "scope":bool(qa["teams"][team]["official_single_game_scope_verified"]),
                  "minute_partition":bool(qa["teams"][team]["official_full_game_lineup_time_covered"]),
                  "lineups":qa["teams"][team]["official_5man"],
                  "lineup_error_types":[a.get("error",{}).get("type","UNKNOWN")
                       for a in (qa["teams"][team].get("lineup_error") or {}).get("attempts",[])]
              } for team in ("HOU","SAS")}},sort_keys=True))
          if not verified:
              print("OFFICIAL_FIVE_UNRESOLVED: no lineup whitelist has been promoted")
              raise SystemExit(0)
          whitelist={(r["team"],frozenset(str(r["five"]).split(",")))
                     for r in result["lineup_compared"]
                     if r["game_id"]==os.environ["GAME_ID"] and
                     r.get("team_lineup_minute_partition_reconciled")}
          conflicts=json.loads((root/"conflicts.json").read_text())
          categories={"both_provider":0,"predicted_only":0,"observed_only":0,"neither":0}
          rows=[]
          for conflict in conflicts["private_conflict_details"]:
              for team in ("HOU","SAS"):
                  predicted=frozenset(conflict["predicted"][team])
                  observed=frozenset(conflict["observed"][team])
                  if predicted==observed:continue
                  p=(team,predicted) in whitelist
                  o=(team,observed) in whitelist
                  category=("both_provider" if p and o else
                            "predicted_only" if p else
                            "observed_only" if o else "neither")
                  categories[category]+=1
                  rows.append({"action":conflict["anchor_nba_action"],"team":team,
                               "classification":category})
          print("OFFICIAL_FIVE_CONFLICT_CLASSIFICATION",json.dumps(categories,sort_keys=True))
          assert sum(categories.values())==conflicts["counts"]["source_anchor_conflicting_team_sides"]
          payload={"schema":"gamepulse.rockets.official-five-source-recovery.v1",
                   "game_id":os.environ["GAME_ID"],
                   "source_commit":os.environ["PRIVATE_PIN"],
                   "source_qa":qa,
                   "official_lineups":result["lineup_compared"],
                   "conflict_classification":categories,
                   "conflict_details":rows,
                   "interpretation":"A provider five-player set validates game-level membership, not its exact time. Anchor conflicts remain unresolved until temporal evidence agrees."}
          data=json.dumps(payload,sort_keys=True,indent=2).encode()
          target="repos/"+os.environ["PRIVATE_REPO"]+"/contents/gamepulse/fusion/qa/rockets_official_five_recovery_0022600009_20261026.json"
          item={"branch":os.environ["PRIVATE_BRANCH"],
                "message":"qa(gamepulse): retain verified Rockets official five-player source comparison",
                "content":base64.b64encode(data).decode()}
          existing=subprocess.run(["gh","api",target+"?ref="+os.environ["PRIVATE_BRANCH"]],
                                  text=True,capture_output=True)
          if existing.returncode==0:
              item["sha"]=json.loads(existing.stdout)["sha"]
          elif "404" not in existing.stderr and "Not Found" not in existing.stderr:
              raise RuntimeError("PRIVATE_QA_LOOKUP_FAILED")
          put=subprocess.run(["gh","api","--method","PUT",target,"--input","-"],
                             input=json.dumps(item),text=True,capture_output=True)
          if put.returncode:raise RuntimeError("PRIVATE_QA_PUBLISH_FAILED")
          print("VERIFIED_PROVIDER_QA_PUBLISHED_PRIVATE")
          PY
