# Frozen original NBA source P3 causal gap 600,1000,1400,1800,2400 ms.
name: IGP P3 causal one-sided source blackout duration curve
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-one-sided-duration-curve-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-one-sided-source-duration-curve
  cancel-in-progress: false
jobs:
  duration:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 85da3979a8769156f23b144a238bad42233fca27
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard source and SHA pin private original NBA tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test source mask and score frozen causal peer model
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_one_sided_duration_qa_v1.py'
          python3 gamepulse/fusion/igp_68_p3_one_sided_duration_qa_v1.py \
            --root . --output "$RUNNER_TEMP/igp68-p3-gap-curve.json" \
            > "$RUNNER_TEMP/igp68-p3-gap-curve-private.log" 2>&1 || {
              echo P3_ONE_SIDED_ORIGINAL_SOURCE_DURATION_QA_FAILED
              tail -n 12 "$RUNNER_TEMP/igp68-p3-gap-curve-private.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp68-p3-gap-curve.json').read_bytes())
          assert q['duration_ms']==[600,1000,1400,1800,2400]
          assert q['original_NBA_sdk_lineup_pbp_sha_immutable']
          assert q['no_refit_no_tuning_on_any_evaluation_game']
          assert len(q['evaluated_heldout_game_ids'])==8
          assert q['newly_accepted_68game_tracking_scenes']==0
          for ms in q['duration_ms']:
            for kind in ('player','ball'):
              v=q['pooled'][str(ms)][kind]
              assert v['paired_targets']>=200
              assert v['multiagent_one_sided']['n']==v['last_two_source_velocity']['n']
          print('IGP_P3_ONE_SIDED_DURATION_SOURCE_METRICS',json.dumps({
            str(ms):{kind:{
              'n':q['pooled'][str(ms)][kind]['paired_targets'],
              'context_p95':q['pooled'][str(ms)][kind]['multiagent_one_sided']['p95_ft'],
              'velocity_p95':q['pooled'][str(ms)][kind]['last_two_source_velocity']['p95_ft']}
            for kind in ('player','ball')} for ms in q['duration_ms']
          },sort_keys=True))
          PY
      - name: Preserve source-backed original SDK duration curve privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_frozen_one_sided_duration_curve_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-duration "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp68-p3-gap-curve.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): causal one sided model source masked multi-duration performance'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_SOURCE_MASK_DURATION_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
