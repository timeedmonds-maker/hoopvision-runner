# Read private release JSON and retain research evidence in private 104.
# Never put NBA frames, per-camera poses, or raw JSON in public artifacts/logs.
name: Amen732 six-view DA3 private QA receipt
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-da3-private-qa-readback.yml']
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce private readback boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          echo PRIVATE_DA3_RECEIPT_BOUNDARY_PASS
      - name: Verify immutable release JSON and commit into private research branch
        shell: bash
        run: |
          set -euo pipefail
          TAG=freeview-amen732-da3-base-unposed-sixview-20261028
          FILE=amen732-da3-sixview-research-qa.json
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh release download "$TAG" --repo timeedmonds-maker/104 \
            --dir "$ROOT" --pattern "$FILE" >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/release.json"
          python3 - "$ROOT/$FILE" "$ROOT/release.json" "$ROOT/payload.json" <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          source=Path(sys.argv[1]);release=json.load(open(sys.argv[2]))
          assets={v["name"]:v for v in release["assets"]}
          digest="sha256:"+hashlib.sha256(source.read_bytes()).hexdigest()
          assert assets[source.name]["digest"]==digest
          x=json.load(open(source))
          assert x["game_id"]=="0022600009" and x["event_num"]==732
          assert x["input_view_count"]==6 and x["full_360_diagnostic_sweep"]==True
          assert len(x["angles"])>=36 and x["camera_pose_count"]==6
          assert x["source_support_status"]=="NOT_VERIFIED"
          p={"branch":"research/amen-wemby-freeze-spin-20261024",
             "message":"data(freeview): preserve real DA3 BASE unposed 360 sweep diagnostics from 6 NBA views",
             "content":base64.b64encode(source.read_bytes()).decode()}
          Path(sys.argv[3]).write_text(json.dumps(p))
          # Source-free scalars only; preserve full assessment in private branch.
          print("DA3_PRIVATE_SHA_360_READBACK_PASS",
                "angles",len(x["angles"]),"predicted_views",x["camera_pose_count"],
                "model_points",x["shared_geometry_sampled_points"],
                "max_certified_arc","UNKNOWN")
          PY
          TARGET="repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_da3_base_unposed_sixview_20261028_qa.json"
          CURRENT="$(gh api "$TARGET?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha 2>/dev/null || true)"
          if [ -n "$CURRENT" ]; then
            python3 - "$ROOT/payload.json" "$CURRENT" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]));p["sha"]=sys.argv[2]
          open(sys.argv[1],"w").write(json.dumps(p))
          PY
          fi
          gh api --method PUT "$TARGET" --input "$ROOT/payload.json" >/dev/null
          gh api "$TARGET?ref=research/amen-wemby-freeze-spin-20261024" \
            --jq .content | base64 -d | cmp -s - "$ROOT/$FILE"
          echo DA3_FULL360_PRIVATE_FIXTURE_BYTE_IDENTICAL_COMMIT_PASS
