name: "IGP post36 NBA official-ten source identity evidence 20-game QA"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-post36-official-ten-pbp-native-evidence-qa.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-post36-official-ten-native-QA-v1
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public security guard and private sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Source-free official roster replay tests and py_compile
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g4_post36_official_ten_evidence_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_g4_post36_official_ten_evidence_v1.py'
      - name: Evaluate all 20 actual NBA source index partitions and source-signed PBP box starters
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_g4_post36_official_ten_evidence_v1.py \
            --root . \
            --out-dir gamepulse/fusion/materialized/igp_g4_post36_official_ten_evidence_v1
          python3 - <<'PY'
          import json,gzip,hashlib
          from pathlib import Path
          root=Path("gamepulse/fusion")
          target=root/"materialized/igp_g4_post36_official_ten_evidence_v1"
          index=json.loads((target/"index.json").read_bytes())
          prior=json.loads((root/"materialized/igp_g4_post36_additive_original_native_possession_v1/index.json").read_bytes())
          assert index["source_games"]==20 and set(index["games"])==set(prior["games"])
          assert index["source_native_frames"]==674145
          count=index["counts"]
          total=sum(v for k,v in count.items() if k.startswith("grade_"))
          assert total==674145
          assert count["grade_DIRECT_EXACT_OFFICIAL_TEN"]>=0
          assert index["physical_possessions_certified"]==0
          windows=0
          for gid,row in index["games"].items():
            path=target/row["path"];raw=path.read_bytes()
            assert hashlib.sha256(raw).hexdigest()==row["sha256"]
            blob=json.loads(gzip.decompress(raw))
            assert blob["game_id"]==gid and blob["source"]["original_native_frames"]==row["native_frames"]
            assert blob["independently_certified_ten_video_labels"]==0
            assert blob["original_positions_are_not_duplicated"]
            assert len(blob["graded_native_source_ordinals"])==row["counts"].get("strict_window_frames",0)
            windows+=row["windows"]
          assert windows>100
          print("IGP_POST36_REAL_SOURCE_OFFICIAL_TEN_EVIDENCE_QA_PASS",json.dumps({
           "source_games":20,"original_native_frames":674145,
           "verified_ordinary_NBA_PBP_ten_windows":windows,
           "frame_grade_counts":count,
           "physical_video_certified_possessions":0},sort_keys=True))
          PY
      - name: Commit versioned PRIVATE source lineage and safe QA only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/materialized/igp_g4_post36_official_ten_evidence_v1
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_g4_post36_official_ten_20game_qa_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): 20-game original native NBA official-ten source-grading from box starters and substitutions"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_OFFICIAL_TEN_20GAME_EVIDENCE_ACCEPTED
              exit 0
            fi
            sleep "$n"
          done
          exit 23
