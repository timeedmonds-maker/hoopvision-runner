# Approved game 0022600092 only, original raw NBA tracking stays immutable.
name: IGP 0092 approved Booker ID source alias live AB
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-0092-approved-booker-source-alias-ab-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp0092-approved-booker-alias-ab
  cancel-in-progress: false
jobs:
  alias_ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 242512859a03b744559566acf52a704ff41a06f7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public content and pin private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Execute exact game0092 Booker correction source QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_0092_approved_booker_alias_live_repair_v1.py'
          python3 gamepulse/fusion/igp_0092_approved_booker_alias_live_repair_v1.py \
            --root . --output "$RUNNER_TEMP/booker-0092.json" \
            > "$RUNNER_TEMP/0092-source-qa.log" 2>&1 || {
                echo IGP0092_APPROVED_BOOKER_ALIAS_QA_FAILED_PRIVATE_DIAGNOSTIC
                tail -n 15 "$RUNNER_TEMP/0092-source-qa.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
                exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'booker-0092.json').read_text())
          a=q['scene_coverage']
          assert q['approved_game_only_relabelled_frames']==13829
          assert q['counts']['native_frames']==8083
          assert q['counts']['grid_samples']==16221
          assert a['native_fixed_800_complete']>=a['native_raw_800_complete']
          assert a['native_fixed_1200_complete']>=a['native_raw_1200_complete']
          assert a['grid_fixed_1200_complete']>=a['grid_raw_1200_complete']
          print('BOOKER_0092_APPROVED_SOURCE_ALIAS_QA',json.dumps({
            'original_sha_unchanged':q['original_source_xyz_unchanged'],
            'native_frames':q['counts']['native_frames'],
            'grid_samples':q['counts']['grid_samples'],
            'coverage':a,
            'masked':q['masked'],
            'masked_source_accuracy_ft':q['masked_source_accuracy_ft']
          },sort_keys=True))
          PY
      - name: Gate actual 68-game query integration against Booker source truth
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_continuous_approved_alias_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p1_booker_query_and_coverage_acceptance_v1.py'
          python3 gamepulse/fusion/igp_68_p1_booker_query_and_coverage_acceptance_v1.py \
            --root . --output "$RUNNER_TEMP/booker-query-accepted.json" \
            > "$RUNNER_TEMP/booker-query-private.log" 2>&1 || {
              echo IGP0092_DERIVED_QUERY_GATE_FAILED_NO_PRIVATE_COORDINATES_EXPORTED
              exit 43
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'booker-query-accepted.json').read_text())
          a=r['all68_live_only_same_denominator_after_approved_alias']
          assert a['native']['1200']['new_complete']==492617
          assert a['continuous_10hz']['1200']['new_complete']==917686
          assert r['game0092_source_query_probes']['verified_live_booker_direct_source_frames']==3
          assert r['original_source_XYZ_and_identifiers_unmodified'] is True
          print('IGP68_APPROVED_0092_BOOKER_QUERY_AND_AGGREGATE',json.dumps({
            'native_800':a['native']['800']['new_complete'],
            'native_1200':a['native']['1200']['new_complete'],
            'grid_800':a['continuous_10hz']['800']['new_complete'],
            'grid_1200':a['continuous_10hz']['1200']['new_complete'],
            'source_equal_probes':r['game0092_source_query_probes']['verified_live_booker_direct_source_frames']
          },sort_keys=True))
          PY
      - name: Retain private source audit and release decision evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_0092_approved_booker_alias_live_repair_v1.json
          integrated=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p1_booker_query_acceptance_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B booker-ab "origin/$BRANCH"
          cp "$RUNNER_TEMP/booker-0092.json" "$receipt"
          cp "$RUNNER_TEMP/booker-query-accepted.json" "$integrated"
          git add -f "$receipt" "$integrated"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): retain approved Booker game0092 source alias live tracking A/B'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP0092_APPROVED_ALIAS_RECEIPT_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
