# 2.4-second causal one-sided source-blackout P3 eight train/eight unseen benchmark.
# No private raw NBA XYZ/identifiable source exported to public job logs.
name: IGP P3 one sided peer motion 8train 8unseen source QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-one-sided-eighttrain-eightunseen-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p3-one-sided-source
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: deb6c011cb32c1c9b53ee5fad993060fb909db00
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private original-source SHA and public guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Run causal source masked peer imputation with strict disjoint games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_one_sided_multiagent_v1.py'
          python3 gamepulse/fusion/igp_68_p3_one_sided_multiagent_v1.py \
            --root . --output "$RUNNER_TEMP/igp68-p3-onesided-private.json" \
            > "$RUNNER_TEMP/igp68-p3-onesided.log" 2>&1 || {
              echo IGP_P3_CAUSAL_ONE_SIDED_PRIVATE_SOURCE_QA_FAILED
              tail -n 11 "$RUNNER_TEMP/igp68-p3-onesided.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp68-p3-onesided-private.json').read_bytes())
          assert len(q['training_games'])==len(q['strict_heldout_games'])==8
          assert not (set(q['training_games'])&set(q['strict_heldout_games']))
          assert q['causal_source_only_target_past_of_blackout']
          assert q['experimental_model_not_promoted'] and q['original_SDK_XYZ_and_UTC_immutable']
          assert q['accepted_68_game_tracking_scene_coverage_gain']==0
          for kind in ('player','ball'):
            z=q['results'][kind]['strict_disjoint_heldout']['metrics']
            assert z['paired_targets']>=250
            assert z['last_original_position']['n']==z['last_two_source_velocity']['n']==z['multiagent_one_sided']['n']
          print('IGP_P3_CAUSAL_ONE_SIDED_EIGHT_HELDOUT',json.dumps({
            kind:q['results'][kind]['strict_disjoint_heldout']['metrics']
            for kind in ('player','ball')},sort_keys=True))
          PY
      - name: Retain actual private source evidence and experiment
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_causal_one_sided_eighttrain_eightunseen_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-onesided "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp68-p3-onesided-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): P3 causal one-sided original SDK peer imputation eight unseen games'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_ONE_SIDED_PRIVATE_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
