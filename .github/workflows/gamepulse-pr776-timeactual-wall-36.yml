name: PR776 source-checked 36-game NBA real-world PBP wall time
# Private NBA event and source metadata only; no SDK coordinates enter public artifacts.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-timeactual-wall-36.yml']
permissions: {contents: read}
concurrency:
  group: pr776-timeactual-realworld-36-game-clock
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Secure canonical PR source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Test, run 36-game original official NBA UTC event timeline and source chain QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_official_timeactual_36_acceptance_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -v -p 'test_igp_official_timeactual_wallclock_2026.py'
          OUT=gamepulse/fusion/materialized/igp_official_realworld_utc_36_v1
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_official_timeactual_36_acceptance_2026.py --root . --out-dir "$OUT"
          python3 - "$OUT" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          j=json.loads((p/'index.json').read_text());t=j['totals']
          assert j['game_count']==36 and len(j['games'])==36
          assert t['real_utc_available']+t['real_utc_missing']==22314
          assert t['source_PBP_chain_candidates']==7474
          assert t['native_timestamps_in_accepted_original_SDK']==1203986
          assert j['physical_possessions_certified']==0
          for gid,g in j['games'].items():
              raw=(p/g['path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==g['sha256']
              z=json.loads(raw)
              assert z['game_id']==gid and z['physical_possessions_certified']==0
              assert len(z['official_timeline'])==g['event_count']
          print('IGP_36_OFFICIAL_NBA_TIMEACTUAL_REALWORLD_SHA_ACCEPTED',json.dumps(t,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 37
          git commit -q -m "data(igp): integrate 36 NBA realworld timeActual timelines and PBP chain boundary QA"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_NBA_TIMEACTUAL_36_REALWORLD_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$i"
          done
          exit 17
