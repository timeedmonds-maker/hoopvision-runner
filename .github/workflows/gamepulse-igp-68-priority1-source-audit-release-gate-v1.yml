# Private source QA only. Public exposes audited counts, not positions or IDs.
name: IGP 68 P1 source audit acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-priority1-source-audit-release-gate-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p1-source-release-gate
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: b7913e794bedfc7d0117fdf373042fee80146599
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin accepted private five-game 68-source receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test and close bounded original-source P1 stage
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p1_source_audit_release_gate_v1.py'
          python3 gamepulse/fusion/igp_68_p1_source_audit_release_gate_v1.py \
            --root . --output "$RUNNER_TEMP/igp-p1-final.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-p1-final.json').read_text())
          assert q['status']=='P1_FIVE_GAME_SOURCE_AND_IDENTITY_AUDIT_COMPLETE'
          assert q['native_live_1200ms']['new_complete']==492617
          assert q['continuous_live_10hz_1200ms']['new_complete']==917686
          assert q['game0122_repeat_original_SDK_recheck_improved_parts']==0
          assert q['original_NBA_pbp_lineups_SDK_XYZ_unchanged']
          assert q['next_priority']=='P2_ADAPTIVE_GAP_RECONSTRUCTION_NOT_YET_STARTED'
          print('IGP_68_P1_RELEASE_ACCEPTED',json.dumps({
           'native_complete':492617,'native_denominator':543024,
           'grid_complete':917686,'grid_denominator':1106941,
           'original_sdk_recheck_improved_parts':0,
           'next':'P2_NOT_STARTED'
          },sort_keys=True))
          PY
      - name: Retain full private SHA provenance closure
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p1_source_audit_release_gate_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p1-source-closure "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-p1-final.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): accept source verified P1 five-game audit and blocker disposition'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP68_P1_SOURCE_AUDIT_PRIVATE_RELEASE_ACCEPTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
