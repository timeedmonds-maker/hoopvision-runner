name: Amen732 official six MP4 video-merge moving-camera UHD
on:
  push:
    branches: [main]
    paths: [.github/workflows/freeview-amen732-direct-sixvideo-render.yml]
permissions:
  contents: read
concurrency:
  group: amen732-official-sixvideo-direct-merge
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: 
          persist-credentials: false
      - name: Enforce public source privacy and verify six-camera CPU scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/amen732_official_sixvideo_acquire.py \
            tools/amen732_native_six_video_frame_sets.py \
            tools/amen732_da3_unposed_sixview_trial.py \
            tools/amen732_native_sixvideo_fusion_mp4.py
          echo ALL_SIXVIDEO_SOURCE_SCRIPTS_COMPILE_PASS
      - name: Install original-frame PTS reader and pinned DA3 BASE inference
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y ffmpeg >/dev/null
          fi
          DA3="$RUNNER_TEMP/da3-source"
          mkdir -p "$DA3"
          git -C "$DA3" init -q
          git -C "$DA3" fetch --quiet --depth 1 https://github.com/ByteDance-Seed/Depth-Anything-3.git 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
          git -C "$DA3" checkout -q --detach FETCH_HEAD
          test "$(git -C "$DA3" rev-parse HEAD)" = 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
          python3 -m pip install -q --disable-pip-version-check 'numpy<2' 'opencv-python-headless==4.10.0.84' pillow einops huggingface-hub omegaconf safetensors timm e3nn trimesh imageio 'transformers>=4.45,<5' plyfile 'moviepy==1.0.3' evo addict pycolmap pillow-heif imageio-ffmpeg
          python3 -m pip install -q --disable-pip-version-check torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q --disable-pip-version-check --no-deps -e "$DA3"
          python3 - <<'PY'
          import cv2,torch,imageio_ffmpeg
          assert imageio_ffmpeg.get_ffmpeg_exe()
          print("DIRECT_SIXVIDEO_DA3_CPU_DEPENDENCIES_OK",torch.__version__,cv2.__version__)
          PY
      - name: Download and hash all six original NBA event 732 cameras with native frame PTS
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/freeview-amen732"
          mkdir -p "$ROOT/source" "$ROOT/out"
          python3 tools/amen732_official_sixvideo_acquire.py \
            --root "$ROOT/source" \
            --page 'https://clips.nba.com/?gameNo=0022600009&eventNum=732&source=grs' \
            --ffmpeg "$(command -v ffmpeg)" \
            --ffprobe "$(command -v ffprobe)"
          test "$(find "$ROOT/source" -maxdepth 1 -name '*.mp4' | wc -l)" = 6
          echo SIX_ORIGINAL_NBA_NATIVE_MP4S_EPHEMERAL_HASH_AND_PTS_PASS
      - name: Real six-video three-instant DA3 fused reconstruction and 170/360 UHD orbit MP4s
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/freeview-amen732"
          python3 tools/amen732_native_sixvideo_fusion_mp4.py \
            --root "$ROOT/source" --out "$ROOT/out" \
            --ffmpeg "$(command -v ffmpeg)"
          python3 - "$ROOT/out/amen732-native-sixvideo-3d-reconstruction-qa.json" <<'PY'
          import json,sys
          from pathlib import Path
          qa=json.load(open(sys.argv[1]))
          assert qa["input_original_camera_video_count"]==6
          assert qa["total_native_frame_observations"]==18
          assert qa["real_six_video_multi_camera_reconstruction_executed"]
          assert len(qa["per_time_sixview_model_diagnostics"])==3
          assert len(qa["outputs"])==2
          assert qa["widest_physically_faithful_arc_degrees"] is None
          for row in qa["outputs"]:
              assert row["encoded_dimensions"]==[3840,2160] and row["frames"]==96
              assert (Path(sys.argv[1]).parent/row["mp4"]).stat().st_size>10000
          print("REAL_SIX_NATIVE_MP4S_FUSED_MODEL_CANDIDATE_TWO_UHD_VIDEOS_OK")
          PY
      - name: Publish only generated diagnostic MP4 and QA, never original source or model poses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amen732-six-cameras-3d-uhd-diagnostic-mp4-only
          path: |
            ${{ runner.temp }}/freeview-amen732/out/amen732-sixvideo-wide170-candidate-3840x2160.mp4
            ${{ runner.temp }}/freeview-amen732/out/amen732-sixvideo-full360-diagnostic-3840x2160.mp4
            ${{ runner.temp }}/freeview-amen732/out/amen732-native-sixvideo-3d-reconstruction-qa.json
          if-no-files-found: error
          retention-days: 7
