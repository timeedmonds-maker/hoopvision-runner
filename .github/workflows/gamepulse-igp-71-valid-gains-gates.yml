name: IGP 71 source gates and matched valid gains
# Public runner executes only private source SHA checks; no XYZ or private records in logs. Guard reviewed.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-71-valid-gains-gates.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-71-valid-gains-source
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public source boundary guard
        run: python3 tools/public_content_guard.py
      - name: SHA source 71 and no-source unit gates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_71_source_context_v1.py gamepulse/fusion/igp_71_matched_live_masked_800_v1200_v1.py gamepulse/fusion/igp_71_halfcourt_touch_query_v1.py gamepulse/fusion/query_igp_71_source_first_live_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p test_igp_71_valid_gains_gates_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p test_igp_halfcourt_touch_query_v1.py
          mkdir -p gamepulse/fusion/qa/igp_progress_20261031
          python3 gamepulse/fusion/igp_71_source_context_v1.py --root . --verify-context-files --output gamepulse/fusion/qa/igp_progress_20261031/igp_71_source_context_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from query_igp_71_source_first_live_v1 import query
          from igp_71_source_context_v1 import source_index,load_context
          root=Path('.');qa=source_index(root)
          n=0;status={}
          for gid in ('0022600001','0022600144','0022600145','0022600146'):
            cx,_=load_context(root,gid,entries=qa['per_game'])
            w=cx['official_paired_windows'][0]
            t=((w[0]+400+99)//100)*100
            row=query(root,gid,t,t+900,hz=10,max_side_ms=800)
            assert row['original_sdk_source_not_mutated'] is True
            assert len(row['rows'])==10
            assert row['physical_possessions_certified']==0
            status[gid]=sum(r['play_state_proxy']=='LIVE_CLOCK_RUNNING_PBP_PROXY' for r in row['rows'])
            n+=len(row['rows'])
          print('IGP71_SOURCE_QUERY_SMOKE',json.dumps({'games':4,'returned_rows':n,'live_proxy_samples':sum(status.values())}))
          PY
      - name: Real three-game matched masked 800-v1200 holdout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_71_matched_live_masked_800_v1200_v1.py --root . --games 0022600144,0022600145,0022600146 --output gamepulse/fusion/qa/igp_progress_20261031/igp_71_new3_matched_masked_800_v1200_v1.json >"$RUNNER_TEMP/holdout3.log" 2>&1 || {
            tail -50 "$RUNNER_TEMP/holdout3.log" | sed -E 's/[0-9]{10,}/[UTC_REDACTED]/g'
            exit 31
          }
          grep 'IGP71_PAIRED_MASKED_LIVE_FINAL' "$RUNNER_TEMP/holdout3.log" || true
          python3 gamepulse/fusion/igp_71_valid_gains_release_decision_v1.py --root . --output gamepulse/fusion/qa/igp_progress_20261031/igp_71_valid_gains_release_decision_v1.json
      - name: Private QA acceptance commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261031/igp_71_source_context_v1.json gamepulse/fusion/qa/igp_progress_20261031/igp_71_new3_matched_masked_800_v1200_v1.json gamepulse/fusion/qa/igp_progress_20261031/igp_71_valid_gains_release_decision_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP71_VALID_GAINS_QA_ALREADY_PRESENT;exit 0;fi
          git commit -q -m 'qa(igp): all71 source context, new3 paired live 800-v1200 masked original holdout'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo IGP71_VALID_GAINS_PRIVATE_QA_COMMITTED;exit 0;fi
            sleep "$attempt"
          done
          exit 25
