name: Extract Corrected P1A Continuity Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/extract-corrected-p1a-continuity.yml']

permissions: {contents: read, actions: read}
env:
  P1A_RUN_ID: '35972465174'
  PARENT_RUN_ID: '35976079683'

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pandas
      - name: Recover evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p p1a parent
          gh run download "$P1A_RUN_ID" --repo timeedmonds-maker/hoopvision-runner --name hoopvision-corrected-p1a-replay --dir p1a
          gh run download "$PARENT_RUN_ID" --repo timeedmonds-maker/hoopvision-runner --name hoopvision-corrected-fragment-parent-diagnostic --dir parent
      - name: Extract exact structured SAM evidence
        run: |
          python - <<'PY'
          import json, pandas as pd
          cand=pd.read_csv('parent/parent_candidates.csv')
          paths=pd.read_csv('p1a/physical_paths.csv')
          sam=json.load(open('p1a/sam31_decisions.json'))
          decisions=sam.get('decisions',sam if isinstance(sam,list) else [])
          idcols=[x for x in paths.columns if any(k in x.lower() for k in ['track','path','segment','root'])]
          rev={}
          for col in idcols:
              for pid,g in paths.groupby('physical_path_id'):
                  for v in g[col].dropna().astype(str).unique(): rev.setdefault((col,v),set()).add(str(pid))
          evidence=[]
          for i,rec in enumerate(decisions):
              flat={}
              def walk(x,prefix=''):
                  if isinstance(x,dict):
                      for k,v in x.items(): walk(v,(prefix+'.'+k).strip('.'))
                  elif isinstance(x,list):
                      for n,v in enumerate(x): walk(v,f'{prefix}[{n}]')
                  elif x is not None: flat[prefix]=str(x)
              walk(rec)
              mentioned=set(); matches=[]
              for key,val in flat.items():
                  leaf=key.split('.')[-1].split('[')[0].lower()
                  if not any(k in leaf for k in ['track','path','segment','root']): continue
                  for col in idcols:
                      hits=rev.get((col,val),set())
                      if hits:
                          mentioned |= hits
                          matches.append({'field':key,'value':val,'path_column':col,'fragments':sorted(hits)})
              evidence.append({'decision_index':i,'reason':str(rec.get('resolver_reason') or rec.get('reason') or ''),'mentioned_fragments':';'.join(sorted(mentioned)),'exact_identifier_matches':json.dumps(matches,sort_keys=True),'record':json.dumps(rec,sort_keys=True,default=str)})
          e=pd.DataFrame(evidence)
          e.to_csv('continuity_evidence.csv',index=False)
          rows=[]
          for _,r in cand.iterrows():
              a,b=str(r.fragment),str(r.candidate_parent)
              hits=e[e.mentioned_fragments.fillna('').apply(lambda x:a in x.split(';') and b in x.split(';'))]
              rec=r.to_dict(); rec['structured_evidence_rows']=int(len(hits)); rec['sam31_rows']=int(len(hits)); rec['sam_reasons']=';'.join(sorted(set(hits.reason.astype(str)))) if len(hits) else ''; rec['join_authorized']=False; rows.append(rec)
          out=pd.DataFrame(rows); out.to_csv('candidate_continuity_crosscheck.csv',index=False)
          summary={'schema':'hoopvision.corrected-p1a-continuity-extract.v2','qualification_claim':'NONE_DIAGNOSTIC_ONLY','sam31_decisions':len(decisions),'sam31_decisions_mapped_to_any_fragment':int((e.mentioned_fragments.fillna('')!='').sum()),'candidate_pairs_with_sam31_evidence':int((out.sam31_rows>0).sum()),'joins_applied':0,'motion_only_joins_applied':0,'identity_accuracy':'UNKNOWN','id_columns':idcols,'first_decision':decisions[0] if decisions else {}}
          open('summary.json','w').write(json.dumps(summary,indent=2,sort_keys=True,default=str)+'\n')
          print('HOOPVISION_CORRECTED_CONTINUITY='+json.dumps(summary,sort_keys=True,default=str))
          print(out[out.sam31_rows>0].sort_values(['fragment','diagnostic_score']).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hoopvision-corrected-p1a-continuity-extract
          path: |
            continuity_evidence.csv
            candidate_continuity_crosscheck.csv
            summary.json
          retention-days: 14
