name: Sengun 0039 official NBA PBP dunk event lookup
on:
  push:
    branches:
      - research/sengun-0039-official-pbp-event-lookup-20261114
jobs:
  verify-official-dunks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Fetch original NBA liveData and print exact made-dunk action numbers
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          game_id = "0022600039"
          url = f"https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_{game_id}.json"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://www.nba.com/",
              "Origin": "https://www.nba.com",
              "Accept": "application/json",
          })
          with urllib.request.urlopen(req, timeout=25) as response:
              data = json.load(response)
          game = data["game"]
          assert str(game["gameId"]) == game_id, "wrong official game"
          actions = game["actions"]
          found = []
          for a in actions:
              if str(a.get("personId")) != "1630578":
                  continue
              if a.get("actionType", "").lower() not in ("2pt", "3pt"):
                  continue
              if "dunk" not in str(a.get("subType", "")).lower() and "dunk" not in str(a.get("description", "")).lower():
                  continue
              result = {
                  "game_id": game_id,
                  "action_number": a.get("actionNumber"),
                  "period": a.get("period"),
                  "clock": a.get("clock"),
                  "shot_result": a.get("shotResult"),
                  "sub_type": a.get("subType"),
                  "description": a.get("description"),
                  "score_home": a.get("scoreHome"),
                  "score_away": a.get("scoreAway"),
                  "clip": f"https://clips.nba.com/?gameNo={game_id}&eventNum={a.get('actionNumber')}&source=grs",
              }
              found.append(result)
          print("NBA_ORIGINAL_PBP_ACTIONS", len(actions))
          print("SENGUN_DUNK_ACTIONS_JSON", json.dumps(found, ensure_ascii=False, sort_keys=True))
          assert found, "no Sengun dunk actions in official PBP"
          assert all(type(x["action_number"]) is int and x["action_number"] > 0 for x in found)
          PY
