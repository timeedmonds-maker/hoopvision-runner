name: Sengun 0039 official NBA PBP dunk event lookup
on:
  push:
    branches:
      - research/sengun-0039-official-pbp-event-lookup-20261114
jobs:
  verify-official-dunks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Probe read-only original NBA sources and mirror
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, re
          game_id = "0022600039"
          source = f"https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_{game_id}.json"
          urls = [
              ("nba_cdn",source),
              ("nba_cdn_old_ua",source),
              ("jina_nba_original","https://r.jina.ai/"+source),
              ("nba_stats","https://stats.nba.com/stats/playbyplayv3?GameID=0022600039&StartPeriod=0&EndPeriod=0"),
              ("nba_game_page","https://www.nba.com/game/uta-vs-hou-0022600039/play-by-play"),
          ]
          for label,url in urls:
              try:
                  ua = "Mozilla/5.0 (compatible; HoopVision NBA formal-source audit)" if label=="nba_cdn_old_ua" else "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36"
                  req = urllib.request.Request(url, headers={"User-Agent":ua,"Referer":"https://www.nba.com/","Origin":"https://www.nba.com","Accept":"application/json,text/html,*/*","x-nba-stats-origin":"stats","x-nba-stats-token":"true"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      raw = response.read(4000000)
                      print("SOURCE_HTTP",label,response.status,len(raw),response.headers.get("content-type"))
                  txt = raw.decode("utf-8","replace")
                  try:
                      doc=json.loads(txt)
                  except ValueError:
                      start=txt.find('{"meta"')
                      if start<0:start=txt.find('{"game"')
                      try:doc=json.loads(txt[start:]) if start>=0 else None
                      except ValueError:doc=None
                  if isinstance(doc,dict) and isinstance(doc.get("game"),dict) and str(doc["game"].get("gameId"))==game_id:
                      actions=doc["game"].get("actions",[])
                      found=[{"event":a.get("actionNumber"),"period":a.get("period"),"clock":a.get("clock"),"subtype":a.get("subType"),"result":a.get("shotResult"),"score_home":a.get("scoreHome"),"score_away":a.get("scoreAway")} for a in actions if str(a.get("personId"))=="1630578" and "dunk" in (str(a.get("subType",""))+" "+str(a.get("description",""))).lower()]
                      print("OFFICIAL_NBA_DUNK_EVENTS",label,len(actions),json.dumps(found))
                      if found:break
                  else:
                      print("SOURCE_BODY_SNIPPET",label,txt[:200].replace("\n"," "))
              except Exception as exc:
                  print("SOURCE_ERROR",label,type(exc).__name__,str(exc)[:180])
          PY
