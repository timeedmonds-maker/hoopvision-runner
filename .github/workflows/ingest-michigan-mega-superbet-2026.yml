name: Ingest Michigan Mega Superbet Full Game

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-michigan-mega-superbet-2026.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  VIDEO_ID: michigan-mega-superbet-2026
  SOURCE_URL: "ytsearch5:Michigan Mega Superbet full game Michigan Athletics 2026"
  ZONE: asia-southeast1-b
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Launch outbound-only YouTube extractor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ingest
          VM="hv-yt-${GITHUB_RUN_ID}"
          STATUS_OBJ="gs://$BUCKET/runs/youtube-ingest/${GITHUB_RUN_ID}/status.json"

          cleanup() {
            gcloud compute instances delete "$VM" \
              --project="$PROJECT_ID" --zone="$ZONE" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud storage rm "$STATUS_OBJ" >/dev/null 2>&1 || true
          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf 'ACCESS_TOKEN=%q\n' "$ACCESS_TOKEN"
            printf 'BUCKET=%q\n' "$BUCKET"
            printf 'VIDEO_ID=%q\n' "$VIDEO_ID"
            printf 'SOURCE_URL=%q\n' "$SOURCE_URL"
            printf 'RUN_ID=%q\n' "$GITHUB_RUN_ID"
            cat <<'EOF'
          set -uo pipefail
          WORK=/var/tmp/hoopvision-youtube
          STATUS_PATH="runs/youtube-ingest/$RUN_ID/status.json"
          SUCCESS=0

          gcs_put() {
            local FILE="$1"
            local OBJ="$2"
            local TYPE="${3:-application/octet-stream}"
            curl --fail --silent --show-error \
              --retry 4 --retry-delay 2 --retry-all-errors \
              -X PUT \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: $TYPE" \
              --upload-file "$FILE" \
              "https://storage.googleapis.com/$BUCKET/$OBJ"
          }

          report_failure() {
            local RC="$1"
            mkdir -p "$WORK"
            python3 - "$RC" <<'PY'
          import json, os, sys
          p=os.path.join("/var/tmp/hoopvision-youtube","status.json")
          json.dump({
              "status":"failure",
              "exit_code":int(sys.argv[1]),
              "video_id":"michigan-mega-superbet-2026",
              "run_id":os.environ.get("RUN_ID",""),
          }, open(p,"w"), indent=2, sort_keys=True)
          PY
            gcs_put "$WORK/status.json" "$STATUS_PATH" "application/json" || true
          }

          finish() {
            RC=$?
            if [ "$SUCCESS" -ne 1 ]; then
              report_failure "$RC"
            fi
            exit "$RC"
          }
          trap finish EXIT

          export RUN_ID VIDEO_ID BUCKET
          set -e
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"

          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg curl nodejs ca-certificates >/dev/null
          curl -fL --retry 4 --silent --show-error \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o /usr/local/bin/yt-dlp
          chmod 0755 /usr/local/bin/yt-dlp

          OK=0
          for CLIENT in tv android_vr web_embedded; do
            rm -f source_native.*
            echo "HOOPVISION_YT_CLIENT=$CLIENT"
            if /usr/local/bin/yt-dlp --verbose --js-runtimes node \
              --extractor-args "youtube:player_client=$CLIENT" \
              --no-playlist --write-info-json \
              --retries 4 --fragment-retries 4 --concurrent-fragments 4 \
              --merge-output-format mp4 --remux-video mp4 \
              -f 'bv*+ba/b' -o 'source_native.%(ext)s' "$SOURCE_URL"; then
              test -s source_native.mp4
              OK=1
              break
            fi
          done
          test "$OK" -eq 1

          cp source_native.info.json yt_dlp.info.json
          ffprobe -v error \
            -show_entries format=duration,size,format_name,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,pix_fmt \
            -of json source_native.mp4 > ffprobe.json
          SHA="$(sha256sum source_native.mp4 | awk '{print $1}')"
          SIZE="$(wc -c < source_native.mp4 | tr -d ' ')"
          PREFIX="fixtures/youtube/$VIDEO_ID/$SHA"
          MEDIA_OBJ="$PREFIX/source_native.mp4"

          echo "HOOPVISION_YT_SHA256=$SHA"
          echo "HOOPVISION_YT_SIZE=$SIZE"

          gcs_put source_native.mp4 "$MEDIA_OBJ" "video/mp4"
          gcs_put yt_dlp.info.json "$PREFIX/yt_dlp.info.json" "application/json"
          gcs_put ffprobe.json "$PREFIX/ffprobe.json" "application/json"

          export SHA SIZE MEDIA_OBJ
          python3 - <<'PY'
          import json, os
          json.dump({
              "status":"success",
              "video_id":os.environ["VIDEO_ID"],
              "run_id":os.environ["RUN_ID"],
              "content_sha256":os.environ["SHA"],
              "size_bytes":int(os.environ["SIZE"]),
              "gcs_uri":"gs://"+os.environ["BUCKET"]+"/"+os.environ["MEDIA_OBJ"],
          }, open("status.json","w"), indent=2, sort_keys=True)
          PY
          gcs_put status.json "$STATUS_PATH" "application/json"
          SUCCESS=1
          trap - EXIT
          exit 0
          EOF
          } > /tmp/yt-startup.sh
          chmod 0700 /tmp/yt-startup.sh

          gcloud compute instances create "$VM" \
            --project="$PROJECT_ID" \
            --zone="$ZONE" \
            --machine-type=e2-micro \
            --image-family=ubuntu-2404-lts-amd64 \
            --image-project=ubuntu-os-cloud \
            --boot-disk-size=30GB \
            --boot-disk-type=pd-balanced \
            --network=default \
            --no-service-account \
            --no-scopes \
            --metadata-from-file=startup-script=/tmp/yt-startup.sh \
            --quiet

          found=0
          for i in $(seq 1 180); do
            if gcloud storage cat "$STATUS_OBJ" > ingest/status.json 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done

          if [ "$found" -ne 1 ]; then
            echo "Extractor did not publish terminal status" >&2
            gcloud compute instances get-serial-port-output "$VM" \
              --project="$PROJECT_ID" --zone="$ZONE" --port=1 2>/dev/null | tail -n 250 || true
            exit 1
          fi

          cat ingest/status.json
          STATUS="$(python3 -c 'import json; print(json.load(open("ingest/status.json"))["status"])')"
          if [ "$STATUS" != "success" ]; then
            echo "Extractor reported failure" >&2
            gcloud compute instances get-serial-port-output "$VM" \
              --project="$PROJECT_ID" --zone="$ZONE" --port=1 2>/dev/null | tail -n 350 || true
            exit 1
          fi

          SHA="$(python3 -c 'import json; print(json.load(open("ingest/status.json"))["content_sha256"])')"
          SIZE="$(python3 -c 'import json; print(json.load(open("ingest/status.json"))["size_bytes"])')"
          PREFIX="gs://$BUCKET/fixtures/youtube/$VIDEO_ID/$SHA"
          gcloud storage cp "$PREFIX/yt_dlp.info.json" ingest/yt_dlp.info.json
          gcloud storage cp "$PREFIX/ffprobe.json" ingest/ffprobe.json
          printf '%s\n' "$SHA" > ingest/sha256.txt
          printf '%s\n' "$SIZE" > ingest/size_bytes.txt

      - name: Build immutable source manifest
        shell: bash
        run: |
          set -euo pipefail
          cd ingest
          export CONTENT_SHA256="$(cat sha256.txt)"
          export SIZE_BYTES="$(cat size_bytes.txt)"
          export GCS_URI="gs://$BUCKET/fixtures/youtube/$VIDEO_ID/$CONTENT_SHA256/source_native.mp4"
          python3 - <<'PY'
          import json, os, pathlib
          info = json.load(open("yt_dlp.info.json"))
          probe = json.load(open("ffprobe.json"))
          keep = {
              "id": info.get("id"),
              "title": info.get("title"),
              "uploader": info.get("uploader"),
              "channel": info.get("channel"),
              "upload_date": info.get("upload_date"),
              "duration": info.get("duration"),
              "webpage_url": info.get("webpage_url"),
              "original_url": info.get("original_url"),
          }
          manifest = {
              "schema": "hoopvision.source_fixture.v1",
              "source_kind": "youtube",
              "video_id": os.environ["VIDEO_ID"],
              "requested_url": os.environ["SOURCE_URL"],
              "content_sha256": os.environ["CONTENT_SHA256"],
              "size_bytes": int(os.environ["SIZE_BYTES"]),
              "gcs_uri": os.environ["GCS_URI"],
              "yt_dlp": keep,
              "ffprobe": probe,
              "runner_repository": os.environ["GITHUB_REPOSITORY"],
              "runner_sha": os.environ["GITHUB_SHA"],
              "runner_run_id": os.environ["GITHUB_RUN_ID"],
          }
          pathlib.Path("source_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Publish manifest beside immutable source
        shell: bash
        run: |
          set -euo pipefail
          cd ingest
          SHA="$(cat sha256.txt)"
          PREFIX="fixtures/youtube/$VIDEO_ID/$SHA"
          gcloud storage cp source_manifest.json "gs://$BUCKET/$PREFIX/source_manifest.json"
          gcloud storage ls -l "gs://$BUCKET/$PREFIX/**"

      - uses: actions/upload-artifact@v4
        with:
          name: michigan-mega-superbet-2026-source-manifest
          path: |
            ingest/source_manifest.json
            ingest/status.json
            ingest/ffprobe.json
            ingest/yt_dlp.info.json
            ingest/sha256.txt
          compression-level: 0
          retention-days: 14
