name: Clip Lab exact event80 frozen v3.1 two-player ring render
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-rockets-event80-frozen-render.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-lab-event80-frozen-two-ring-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public runner boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-rockets-event80-frozen-render.yml'])
          print('ORIGINAL_RING_PRIVATE_MEDIA_BOUNDARY_PASS')
          PY
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_SOURCE_AUTH_NOT_AVAILABLE; exit 3; }
          # git smart HTTP uses the existing scoped private token without
          # consuming the exhausted shared GitHub REST API request quota.
          export GIT_TERMINAL_PROMPT=0
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" ls-remote --exit-code             https://github.com/timeedmonds-maker/104.git refs/heads/main >/dev/null 2>&1             || { echo PRIVATE_GIT_AUTH_UNAVAILABLE; exit 3; }
          unset AUTH
      - name: Load SHA-pinned original Broadcast, native Pulse and frozen physical evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/event80-v31-render"
          mkdir -p "$ROOT/tools" "$ROOT/hoopvision/core" "$ROOT/screen_tracker_nextgen" "$ROOT/gamepulse/clip_lab"
          touch "$ROOT/hoopvision/__init__.py" "$ROOT/hoopvision/core/__init__.py" "$ROOT/screen_tracker_nextgen/__init__.py"
          TAG='clip-lab-hls-0022600009-80'
          # Use an authenticated direct release download as the primary
          # transport when the shared private REST API budget is exhausted.
          # Signed source/authorization data must never enter public logs.
          for name in event80-broadcast.mp4 native.json manifest.json; do
            code="$(curl --silent --show-error --location --max-time 70 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -o "$ROOT/$name" -w '%{http_code}' \
              "https://github.com/timeedmonds-maker/104/releases/download/$TAG/$name" || true)"
            if [ "$code" != '200' ]; then
              rm -f "$ROOT/$name"
              gh release download "$TAG" --repo timeedmonds-maker/104 --pattern "$name" --dir "$ROOT" >/dev/null || {
                echo ORIGINAL_PRIVATE_RELEASE_UNAVAILABLE_OR_RATE_LIMITED
                exit 4
              }
            fi
          done
          # Frozen worker stores private tracking & homography only inside 104.
          for item in \
            'event80_frozen_full20_tracks.csv cpu-full20-tracks.csv' \
            'event80_frozen_full20_court_frames.json cpu-full20-court_frames.json' \
            'event80_frozen_full20_qa.json cpu_frozen_full20_qa.json'; do
            read -r private_name local_name <<< "$item"
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/qa/$private_name?ref=main" --jq .content | base64 -d > "$ROOT/$local_name" || { echo FROZEN_PRIVATE_TRACKING_OR_CALIBRATION_NOT_YET_STAGED; exit 4; }
          done
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/release.json"
          python3 - "$ROOT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          d=Path(sys.argv[1])
          r=json.loads((d/'release.json').read_text())
          assets={a['name']:a for a in r['assets']}
          for name in ('event80-broadcast.mp4','native.json','manifest.json'):
              actual=hashlib.sha256((d/name).read_bytes()).hexdigest()
              assert assets[name]['digest']=='sha256:'+actual,'PRIVATE_ORIGINAL_ASSET_HASH_MISMATCH'
          manifest=json.loads((d/'manifest.json').read_text())
          native=json.loads((d/'native.json').read_text())
          qa=json.loads((d/'cpu_frozen_full20_qa.json').read_text())
          assert manifest['angle']=='Broadcast' and manifest['event']['nba_event_num']==80
          assert manifest['event']['nba_game_id']=='0022600009'
          assert manifest['source_video']['sha256']==hashlib.sha256((d/'event80-broadcast.mp4').read_bytes()).hexdigest()
          assert native['game_id']=='0022600009' and native['event_num']==80
          assert native['official_event_utc_ms']==1792807093640
          assert native['player_ids']==['1627832','203500']
          assert qa['state']=='CPU_ORIGINAL_FROZEN_TRACKER_FULL20_PASS'
          assert qa['calibrated_court_h_frames']>=3 and qa['track_rows']>=8
          print('ORIGINAL_FROZEN_AND_NATIVE_SOURCE_CERTIFICATES_PASS')
          PY
          for f in locked_broadcast_screen_v2.py locked_broadcast_screen_v4.py locked_broadcast_screen_v5_rings.py render_deterministic_master.py; do
            gh api "repos/timeedmonds-maker/104/contents/tools/$f?ref=courtcoder%2Fintegration" --jq .content | base64 -d > "$ROOT/tools/$f"
          done
          gh api 'repos/timeedmonds-maker/104/contents/screen_tracker_nextgen/render_all_player_labels.py?ref=courtcoder%2Fintegration' --jq .content | base64 -d > "$ROOT/screen_tracker_nextgen/render_all_player_labels.py"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/core/broadcast_activity.py?ref=courtcoder%2Fintegration' --jq .content | base64 -d > "$ROOT/hoopvision/core/broadcast_activity.py"
          for f in prepare_frozen_physical.py frozen_v31_gamepulse_bridge.py launch_frozen_ring_only.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/$f?ref=main" --jq .content | base64 -d > "$ROOT/gamepulse/clip_lab/$f"
          done
          python3 -m pip install --quiet 'numpy==1.26.4' 'opencv-python-headless==4.10.0.84' pandas scipy pillow
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          python3 -m py_compile "$ROOT"/gamepulse/clip_lab/*.py "$ROOT/screen_tracker_nextgen/render_all_player_labels.py"
          echo FROZEN_SOURCE_MODULES_READY
      - name: Fuse original two-player native positions to independently detected frozen physical paths
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/event80-v31-render"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$ROOT/event80-broadcast.mp4")"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$ROOT/event80-broadcast.mp4")"
          python3 "$ROOT/gamepulse/clip_lab/prepare_frozen_physical.py" --tracks "$ROOT/cpu-full20-tracks.csv" --courts "$ROOT/cpu-full20-court_frames.json" --output "$ROOT/physical_paths.csv" --fps 30 --duration-s "$DURATION" > "$ROOT/physical_qa.json"
          python3 "$ROOT/gamepulse/clip_lab/frozen_v31_gamepulse_bridge.py" \
            --native "$ROOT/native.json" \
            --frozen-physical-paths "$ROOT/physical_paths.csv" \
            --frozen-court-frames "$ROOT/cpu-full20-court_frames.json" \
            --target-players '1627832:Fred VanVleet,203500:Steven Adams' \
            --fps 30 --duration-s "$DURATION" \
            --utc-search-from-ms 1792807070000 --utc-search-to-ms 1792807095000 \
            --out "$ROOT/fused" > "$ROOT/bridge-output.log"
          python3 - "$ROOT" <<'PY'
          import csv,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);qa=json.loads((root/'fused/frozen_v31_gamepulse_qa.json').read_text())
          assignments=list(csv.DictReader((root/'fused/frozen_v31_gamepulse_assignments.csv').open()))
          assert qa['alignment']['cost_cm']<=115 and qa['alignment']['identity_margin_cm']>=22
          assert {int(r['player_id']) for r in assignments}=={1627832,203500}
          assert all(str(r['ring_authorized']).lower() in ('true','1') for r in assignments)
          assert qa['rows']==len(assignments)>=24
          print('INDEPENDENT_FROZEN_FOOT_AND_NATIVE_PLAYER_MATCH_PASS')
          PY
          # Source last-touch is not independently certified possession.
          # Rings remain the original HOU team colour; do not force green.
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          (root/'neutral_possession.json').write_text(json.dumps({
            'schema':'hoopvision.clip-lab.native-last-touch-intervals.v1',
            'possession_intervals':[]})+'\n')
          PY
      - name: Render ORIGINAL frozen rings only, with live player-body occlusion and audio
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/event80-v31-render"
          python3 "$ROOT/gamepulse/clip_lab/launch_frozen_ring_only.py" "$ROOT/screen_tracker_nextgen/render_all_player_labels.py" \
            --source "$ROOT/event80-broadcast.mp4" \
            --assignments "$ROOT/fused/frozen_v31_gamepulse_assignments.csv" \
            --paths "$ROOT/fused/frozen_v31_gamepulse_assignments.csv" \
            --court-frames "$ROOT/cpu-full20-court_frames.json" \
            --occlusion-tracks "$ROOT/cpu-full20-tracks.csv" \
            --possession-events "$ROOT/neutral_possession.json" \
            --frame-ledger "$ROOT/final_frame_ledger.csv" \
            --out "$ROOT/rockets-spurs-event80-adams-vanvleet-frozen-v31.mp4" > "$ROOT/render.log" 2>&1 || { echo ORIGINAL_FROZEN_RING_RENDER_FAILED; exit 5; }
          python3 - "$ROOT" <<'PY'
          import csv,hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1]);movie=root/'rockets-spurs-event80-adams-vanvleet-frozen-v31.mp4'
          if not movie.exists() or movie.stat().st_size<200000:raise RuntimeError('ORIGINAL_RINGED_MOVIE_MISSING')
          def probe(p):
            return json.loads(subprocess.run(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],check=True,capture_output=True,text=True).stdout)
          a=probe(root/'event80-broadcast.mp4');b=probe(movie)
          av=next(s for s in a['streams'] if s['codec_type']=='video')
          bv=next(s for s in b['streams'] if s['codec_type']=='video')
          assert (av['width'],av['height'])==(bv['width'],bv['height'])
          assert abs(float(a['format']['duration'])-float(b['format']['duration']))<0.15
          if any(s['codec_type']=='audio' for s in a['streams']):
              assert any(s['codec_type']=='audio' for s in b['streams'])
          ledger=list(csv.DictReader((root/'final_frame_ledger.csv').open()))
          counts={pid:sum(r['player_id']==pid and r['ring_rendered']=='True' for r in ledger)
                  for pid in ('1627832','203500')}
          total_frames=int(bv.get('nb_frames') or 0)
          assert total_frames>=200, 'ENCODED_VIDEO_TOO_SHORT'
          # User requires both floor rings from first to last video frame.
          for pid in ('1627832','203500'):
              rendered={int(float(row['output_frame'])) for row in ledger
                        if row.get('player_id')==pid and row.get('ring_rendered')=='True'}
              assert 0 in rendered and (total_frames-1) in rendered,'RING_NOT_VISIBLE_AT_CLIP_BOUNDARY'
              assert len(rendered)/total_frames>=.98, 'RING_END_TO_END_CONTINUITY_TOO_LOW'
              missing=sorted(set(range(total_frames))-rendered)
              longest=0;current=0;previous=None
              for i in missing:
                  current=current+1 if previous is not None and i==previous+1 else 1
                  longest=max(longest,current);previous=i
              assert longest<=3, 'FLOOR_RING_HAS_UNACCEPTABLE_INTERIOR_GAP'
          qa={'schema':'hoopvision.clip-lab.original-v31-two-ring-video.v1',
              'nba_game_id':'0022600009','event_num':80,'angle':'Broadcast',
              'targets':{'1627832':'Fred VanVleet','203500':'Steven Adams'},
              'frozen_ring_source_sha_locked':True,'names_suppressed_independently':True,
              'private_source_mp4_sha256':hashlib.sha256((root/'event80-broadcast.mp4').read_bytes()).hexdigest(),
              'ringed_mp4_sha256':hashlib.sha256(movie.read_bytes()).hexdigest(),
              'native_to_camera_qa':json.loads((root/'fused/frozen_v31_gamepulse_qa.json').read_text()),
              'ring_render_frame_rows':counts,'output_bytes':movie.stat().st_size,
              'encoded_duration_s':float(b['format']['duration']),
              'status':'FROZEN_V31_TWO_RING_ENCODED_CPU_QA_PASS'}
          (root/'event80-frozen-two-player-qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          print('ORIGINAL_FROZEN_V31_TWO_RING_MOVIE_ENCODED_AND_VERIFIED')
          PY
          echo FROZEN_RING_RENDER_VERIFIED_SAFE_FOR_USER_ARTIFACT
      - uses: actions/upload-artifact@v4
        with:
          name: event80-adams-vanvleet-frozen-v31-chat-mp4
          path: ${{ runner.temp }}/event80-v31-render/rockets-spurs-event80-adams-vanvleet-frozen-v31.mp4
          retention-days: 1
          if-no-files-found: error
