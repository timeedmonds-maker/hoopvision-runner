# Public orchestration only. Licensed NBA tracking stays private; aggregate-only logs.
name: IGP v3.2 event alignment exact frozen71 P2B regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-event-alignment-fixed-p2b-regression.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-event-join-p2b-fixed-denominator
  cancel-in-progress: false
jobs:
  original71-immutable-P2B-exact-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-0146-app-clock-stoppage-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source and privacy verified
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_guarded_71game_exact_default_union_v2.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
             -p 'test_igp_v32_companion_stoppage_guard_v1.py'
          echo IGP_P2B_OPTIONAL_GUARD_EXISTING_ANCHOR_TESTS_PASS
      - name: Recompute exact frozen 71game P2B union on original source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_guarded_71game_exact_default_union_v2.py \
            --root . --out "$RUNNER_TEMP/igp-v32-p2b-71-recomputed.json" \
            > "$RUNNER_TEMP/igp-v32-p2b-71-recomputed.log" 2>&1 || {
               echo IGP_P2B_EXACT_FROZEN_REGRESSION_FAILED
               python3 - <<'PY'
          import os,re
          from pathlib import Path
          a=(Path(os.environ["RUNNER_TEMP"])/"igp-v32-p2b-71-recomputed.log").read_text(errors="replace").splitlines()
          v=next((x for x in reversed(a) if re.match(r"^(?:ValueError|KeyError|TypeError|AssertionError):",x)),None)
          if v:
              name,_,msg=v.partition(":");code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_P2B_PRIVATE_FAILURE",name,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_P2B_PRIVATE_FAILURE UNCLASSIFIED")
          PY
               exit 41
             }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          baseline=Path("gamepulse/fusion/qa/igp_v32/igp_v32_p2b_guarded_71game_exact_default_union_v2.json")
          old=json.loads(baseline.read_bytes())
          new=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-v32-p2b-71-recomputed.json").read_bytes())
          assert old["schema"]==new["schema"]
          assert old["counts"]==new["counts"], "FROZEN_71GAME_P2B_COUNTS_CHANGED"
          assert old["games"]==new["games"], "FROZEN_71GAME_P2B_PER_GAME_QA_CHANGED"
          assert new["counts"]["s1_10hz_samples"]==1159651
          assert new["new_production_promoted_scenes"]==0
          print("IGP_P2B_FROZEN_71_EXACT_COUNTS_AND_PER_GAME_UNCHANGED",
                json.dumps(new["counts"],sort_keys=True))
          PY
