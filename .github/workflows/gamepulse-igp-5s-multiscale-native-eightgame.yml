name: "IGP 5s native eight-game multiscale fullpath source benchmark"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-5s-multiscale-native-eightgame.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-five-second-native-multiscale-eightgame
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public content and checkout original private NBA evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Validate source-free five-second fullpath and support rules
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_5s_native_multiscale_fullpath_holdout_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
             -p 'test_igp_5s_native_multiscale_fullpath_holdout_v1.py'
      - name: Evaluate eight actual NBA games; six train, two excluded test games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_5s_native_multiscale_fullpath_holdout_v1.py \
            --root . --max-cases 240 \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_5s_native_multiscale_sixtrain_twotest_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_5s_native_multiscale_sixtrain_twotest_v1.json")
          r=json.loads(p.read_text())
          assert r["source_games_eight"]==8 and r["model_not_promoted"]
          assert r["train_and_holdout_game_IDs_disjoint"]
          assert r["original_tracking_sources_untouched"]
          assert set(r["heldout_test_games"])=={"0022600009","0022600092"}
          assert r["train_only_selection"]["training_cases"]>=60
          for g,row in r["heldout_test_games"].items():
            assert row["paired_masked_original_native_samples"]>500,(g,row)
            assert row["n_5s_cases"]>=40
            assert row["physical_video_labels"]==0
          print("IGP_5S_NATIVE_8GAME_CROSSGAME_TRAIN_TEST_PASS",
                json.dumps({"selected":r["train_only_selection"]["selected_key"],
                            "heldout":r["heldout_test_games"]},sort_keys=True))
          PY
      - name: Preserve private QA only; append no source player XYZ to public runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_5s_native_multiscale_sixtrain_twotest_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): eight-game 5s original native multiscale six-train two-test benchmark"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_5S_MULTISCALE_SOURCE_BENCHMARK_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$try"
          done
          exit 23
