# Private source SHA 0122 licensed SDK recheck: two weakest midgame parts only.
# No original release overwrite; public aggregate counts only.
name: IGP 0122 P1 two-part original SDK source recheck
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-0122-original-source-p1-two-part-recheck.yml']
permissions: {contents: read}
concurrency:
  group: igp-0122-P1-source-recheck
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAMEPULSE_P1_0122_SDK_RECHECK: approved_source_only
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate reviewed source and SDK dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          node --check tools/licensed_feed/igp_p1_0122_bounded_original_sdk_recheck.mjs
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          (cd tools/licensed_feed && npm install --ignore-scripts --no-audit --no-fund --silent)
          test -n "$GH_TOKEN"
      - name: Recheck two original 0122 game windows via licensed SDK
        shell: bash
        run: |
          set -euo pipefail
          node tools/licensed_feed/igp_p1_0122_bounded_original_sdk_recheck.mjs
      - name: Save non-coordinate source-only receipt to private research branch
        shell: bash
        env:
          BRANCH: research/igp-68-live-gap-census-20261030
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh auth setup-git
          mkdir -p original-qa
          gh release download gamepulse-sdk-recovery-0022600122-20261030-P1 \
            --repo timeedmonds-maker/104 \
            --pattern 'igp_0122_p1_recheck_receipt.json' --dir original-qa
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('original-qa/igp_0122_p1_recheck_receipt.json').read_bytes())
          assert q['game_id']=='0022600122' and q['original_parts_indexed']==13
          assert len(q['rechecks'])==2 and q['original_source_unchanged']
          assert all(r['raw_original_part_unmodified'] for r in q['rechecks'])
          print('IGP0122_P1_ORIGINAL_RECHECK_QA',json.dumps({
            'original13_parts_unchanged':True,
            'rechecked_parts':q['selected_parts'],
            'improved_parts':q['improved_parts'],
            'read_success_count':sum(
              r['status']=='ORIGINAL_SDK_SOURCE_RECAPTURED' for r in q['rechecks'])
          },sort_keys=True))
          PY
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_0122_p1_original_two_part_recheck_v1.json
          cp "$RUNNER_TEMP/original-qa/igp_0122_p1_recheck_receipt.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): retain 0122 original SDK P1 two-part recheck without overwriting source'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP0122_P1_SOURCE_RECHECK_PRIVATE_QA_SAVED
              exit 0
            fi
            sleep "$n"
          done
          exit 42
