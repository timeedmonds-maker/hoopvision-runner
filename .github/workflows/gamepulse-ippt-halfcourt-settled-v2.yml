name: IPPT v2 source-formation settled halfcourt all36 verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-halfcourt-settled-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/ippt-halfcourt-dual-track-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and SHA-backed private original SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free strict transition exclusion and official two-team tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_halfcourt_settled_selector_2026.py \
            gamepulse/fusion/igp_ippt_halfcourt_settled_benchmark_2026.py
          python3 -m unittest -v \
            gamepulse/fusion/test_igp_ippt_halfcourt_settled_selector_2026.py \
            gamepulse/fusion/test_igp_ippt_halfcourt_selector_2026.py \
            gamepulse/fusion/test_igp_ippt_halfcourt_team_split_2026.py
      - name: Real original NBA 2 game v1 versus v2 source SHA QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from igp_ippt_halfcourt_settled_benchmark_2026 import run_game
          for gid in ("0022600009","0022600092"):
              r=run_game(".",gid,stride=10)
              c=r["counts"]
              assert c.get("v1_candidate_sample_frames",0)>0
              assert c.get("v2_formation_supported_frames",0)>0
              assert c.get("v2_formation_supported_frames",0)<=c["v1_candidate_sample_frames"]
              print("IPPT_V2_SETTLED_REAL_GAME_PASS",gid,{
                "original_frame_count":r["original_native_frames"],
                "v1_sample":c["v1_candidate_sample_frames"],
                "v2_sample":c["v2_formation_supported_frames"],
                "v2_original_G3":c.get("v2_original_plus_accepted_G3_ten_ball",0),
                "v2_expanded_estimated":c.get("v2_expanded_IPPT_estimated_ten_ball",0),
                "v2_long_FG_unreliable":c.get("v2_expanded_with_weak_FG",0)})
          PY
      - name: All36 SHA-conserved original/G3/predictive strict settled NBA source population
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_ippt_halfcourt_settled_benchmark_2026.py \
            --root . --stride 10
          echo "IPPT_V2_36GAME_SHA_SOURCE_RUN_PASS"
