name: Rockets first clip private event/XYZ pilot via public CPU
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-rockets-private-clip-pilot.yml'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-rockets-private-clip-pilot.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: rockets-private-clip-world-pilot
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce source and artifact boundary on public repository
        run: python3 tools/public_content_guard.py
  private-licensed-source-pilot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Acquire authorised private-source analysis in temporary workspace
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_LICENSED_ANALYSIS_CONNECTION_UNAVAILABLE'; exit 3; }
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/rockets_pilot_tools"
          ROOT='repos/timeedmonds-maker/104/contents/gamepulse/sdk-season'
          for name in build_rockets_first_clip_pilot_2026.py \
                      test_rockets_first_clip_pilot_2026.py \
                      sync_nba_pbp_espn_gamepulse_2026_27.py \
                      fetch_nba_pbp_2026_27.py; do
            gh api "$ROOT/rockets_pilot_tools/$name" --jq .content | base64 -d > "$WORK/rockets_pilot_tools/$name"
          done
          gh api "$ROOT/defender_spacing_calc.py" --jq .content | base64 -d > "$WORK/defender_spacing_calc.py"
          gh api "$ROOT/rockets_clip_pilot_run.py" --jq .content | base64 -d > "$WORK/rockets_clip_pilot_run.py"
          # Private runner code checks SHA-verified private Release inputs, runs
          # offline tests, writes raw outcomes back to private Release only.
          # Public workflow exposes no private source, data, images or results.
          python3 "$WORK/rockets_clip_pilot_run.py"
          echo 'PRIVATE_PILOT_EXECUTION_COMPLETED_NO_GPU'

  clip-lab-sdksource-test:
    name: Rockets real SDK source + Clip Lab adapter regression QA
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Verify private current-branch adapter and first real Rockets checkpoint
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          export PYTHONDONTWRITEBYTECODE=1
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/courtcoder/qa" "$WORK/courtcoder/tools" "$WORK/courtcoder/static" "$WORK/rockets"
          BRANCH='courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022'
          ROOT='repos/timeedmonds-maker/104/contents/courtcoder'
          for f in nba_clip_intake.py nba_event_angle_bundle.py nba_clip_process.py nba_clip_private_dispatch.py nba_clip_publication.py nba_gamepulse_archive.py nba_gamepulse_layer.py nba_gamepulse_renderer_bridge.py nba_gamepulse_render_handoff.py; do
            gh api "$ROOT/$f?ref=$BRANCH" --jq .content | base64 -d > "$WORK/courtcoder/$f"
          done
          for f in build_gamepulse_assisted_clip.py fetch_private_gamepulse_clip.py; do
            gh api "$ROOT/tools/$f?ref=$BRANCH" --jq .content | base64 -d > "$WORK/courtcoder/tools/$f"
          done
          for f in test_nba_gamepulse_archive.py test_nba_gamepulse_layer.py test_nba_gamepulse_render_handoff.py test_nba_clip_process.py; do
            gh api "$ROOT/qa/$f?ref=$BRANCH" --jq .content | base64 -d > "$WORK/courtcoder/qa/$f"
          done
          for f in nba_clip_process.js nba_clip_upload.js nba_measurements.js index.html; do
            gh api "$ROOT/static/$f?ref=$BRANCH" --jq .content | base64 -d > "$WORK/courtcoder/static/$f"
          done
          for f in test_nba_clip_process.cjs test_nba_gamepulse_single_upload.cjs test_nba_measurements.cjs; do
            gh api "$ROOT/qa/$f?ref=$BRANCH" --jq .content | base64 -d > "$WORK/courtcoder/qa/$f"
          done
          python3 -m unittest discover -s "$WORK/courtcoder/qa" -p 'test_nba_gamepulse*.py' -v
          python3 -m unittest discover -s "$WORK/courtcoder/qa" -p 'test_nba_clip_process.py' -v
          node "$WORK/courtcoder/qa/test_nba_clip_process.cjs"
          node "$WORK/courtcoder/qa/test_nba_gamepulse_single_upload.cjs"
          node "$WORK/courtcoder/qa/test_nba_measurements.cjs"
          gh release download gamepulse-sdk-0022600091 --repo timeedmonds-maker/104 --dir "$WORK/rockets" --pattern 'sdk-part-01.tar.gz' --pattern 'sdk-part-01.json' --pattern 'sdk-COMPLETE.json'
          export CC_PRIVATE_SMOKE="$WORK"
          python3 - <<'PY'
          import json,os,sys,subprocess,re
          from pathlib import Path
          base=Path(os.environ["CC_PRIVATE_SMOKE"])
          sys.path.insert(0,str(base/"courtcoder"))
          from nba_gamepulse_archive import load_private_sdk_parts
          from nba_gamepulse_layer import normalize_keyframes
          p=subprocess.run(["gh","api","repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-0022600091"],check=True,capture_output=True,text=True,timeout=45)
          release=json.loads(p.stdout)
          digests={}
          for a in release["assets"]:
              if a.get("name") in ("sdk-part-01.tar.gz","sdk-part-01.json"):
                  digest=a.get("digest","")
                  assert re.fullmatch(r"sha256:[0-9a-f]{64}",digest)
                  digests[a["name"]]=digest.split(":")[1]
          complete_asset=next(a for a in release["assets"] if a.get("name")=="sdk-COMPLETE.json")
          complete_bytes=(base/"rockets"/"sdk-COMPLETE.json").read_bytes()
          import hashlib
          assert "sha256:"+hashlib.sha256(complete_bytes).hexdigest()==complete_asset["digest"]
          complete=json.loads(complete_bytes)
          assert complete["game_id"]=="0022600091" and complete["parts"]==13 and complete["successful_windows"]==3720
          assert len(digests)==2
          frames,qa=load_private_sdk_parts("0022600091",base/"rockets",
              part_numbers=[1],trusted_asset_digests=digests,
              verified_planned_start_ms=complete["planned_start_ms"])
          assert len(frames)>500
          eligible=[r for r in frames if len(r.get("positions",{}))>=9]
          assert eligible,"No observable active ten-player gameplay in selected part"
          raw=eligible[0]["positions"]
          keys=[k for k in raw if k!="ball"]
          assert keys and all(k.isdecimal() and int(k)>0 for k in keys)
          for key in keys:
              point=raw[key]
              assert isinstance(point,list) and len(point)==3
          identity={k:int(k) for k in keys}
          validated=normalize_keyframes("0022600091",[eligible[0]],
              identity,source_units="nba_centered_inches")
          assert len(validated[0]["players"])>=8
          print("ROCKETS_REAL_SDK_PART01_SHA_AND_NATIVE_XYZ_SCHEMA_PASS",
                "frames",len(frames),"fully_observed_example_players",
                len(validated[0]["players"]))
          print("VIDEO_CLOCK_AND_CAMERA_GEOMETRY_NOT_CERTIFIED")
          PY
