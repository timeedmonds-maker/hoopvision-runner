# Public only aggregate metrics; NBA original XYZ and PBP exist solely in private sandbox.
name: IGP 3.2 all71 consecutive official NBA live clock source bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-consecutive-live-bridge-all71.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-consecutive-live-clock-all71
  cancel-in-progress: false
jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      SHARD: ${{ matrix.shard }}
      SHARDS: "8"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public source privacy guard and private original SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_live_consecutive_segment_bridge_shadow_v1.py gamepulse/fusion/igp_v32_consecutive_live_bridge_all71_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_live_consecutive_segment_bridge_shadow_v1.py'
      - name: Full original NBA per-game source anchor bridge and 10Hz scoring
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_consecutive_live_bridge_all71_v1.py \
            --root . --shard-index "$SHARD" --shard-count "$SHARDS" \
            --output "$RUNNER_TEMP/live-bridge-source-shard.json" \
            >"$RUNNER_TEMP/bridge-private.log" 2>&1 || {
              echo IGP_V32_SOURCE_71_LIVE_CLOCK_BRIDGE_SHARD_FAILED
              exit 101
            }
          grep '^IGP_V32_LIVE_BRIDGE_SHARD' "$RUNNER_TEMP/bridge-private.log" || true
      - name: Commit private source-only QA per shard
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_consecutive_live_bridge_shard_$SHARD"
          receipt="$receipt""_of_$SHARDS.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B bridge71 "origin/$BRANCH"
          cp "$RUNNER_TEMP/live-bridge-source-shard.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo V32_BRIDGE_71_SHARD_ALREADY_PRESENT;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): full71 NBA same official roster continuous clock bridge shadow shard'
          for n in 1 2 3 4 5 6 7 8 9;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo V32_BRIDGE71_SOURCE_SHARD_COMMITTED;exit 0;fi
            sleep "$n"
          done
          exit 102
  final:
    needs: [shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Full71 original NBA same-cohort release shadow reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_consecutive_live_bridge_all71_v1.py \
            --root . --finalize --shard-count 8 \
            --output "$RUNNER_TEMP/bridge71-final.json" >"$RUNNER_TEMP/bridge-private-final.log" 2>&1 || {
              echo IGP_V32_BRIDGE71_FROZEN_SOURCE_RECONCILIATION_FAILED
              exit 103
            }
          grep '^IGP_V32_LIVE_BRIDGE_ALL71_FINAL' "$RUNNER_TEMP/bridge-private-final.log" || true
      - name: Retain source-only shadow decision in private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_consecutive_live_bridge_all71_shadow_decision_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B bridge71end "origin/$BRANCH"
          cp "$RUNNER_TEMP/bridge71-final.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo V32_BRIDGE71_FINAL_ALREADY_PRESENT;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original NBA all71 same-clock same-lineup source bridge shadow'
          for n in 1 2 3 4 5 6;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo V32_BRIDGE71_FULL_SOURCE_QA_COMMITTED;exit 0;fi
            sleep "$n"
          done
          exit 104
