name: Clip Lab Rockets Spurs Adams 86 private native broadcast
# Original NBA event media remains exclusively in PRIVATE 104 release.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-rockets-spurs-adams-86-native-video.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-lab-rockets-spurs-adams-86-private
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public content guard and private destination
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-rockets-spurs-adams-86-native-video.yml'])
          print('PUBLIC_BOUNDARY_PASS')
          PY
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_AUTH_UNAVAILABLE; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true || { echo PRIVATE_DESTINATION_REQUIRED; exit 4; }
      - name: Acquire event86 original broadcast and publish private SHA-verified release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          mkdir -p "$ROOT/hoopvision/freeview" "$ROOT/clip"
          touch "$ROOT/hoopvision/__init__.py" "$ROOT/hoopvision/freeview/__init__.py"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/fetch_official_multicam.py?ref=b154a834a95a887226757a4ff0d5b34f69bc55e6' --jq .content | base64 -d > "$ROOT/hoopvision/freeview/fetch_official_multicam.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/0022600009.json?ref=main' --jq .content | base64 -d > "$ROOT/official.json"
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' opencv-python-headless==4.10.0.84
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          PYTHONPATH="$ROOT" python3 - "$ROOT" <<'PY'
          import hashlib,json,sys,subprocess
          from pathlib import Path
          import cv2,numpy as np
          from hoopvision.freeview.fetch_official_multicam import resolve_options,download_hls,probe,sha256
          root=Path(sys.argv[1])
          official=json.loads((root/'official.json').read_text())
          matches=[a for a in official['actions'] if a.get('nba_action_number')==86]
          if len(matches)!=1 or matches[0].get('person_id')!=203500 or matches[0].get('period')!=1 or matches[0].get('action_type')!='2pt':
              raise RuntimeError('OFFICIAL_ADAMS_LAYUP_EVENT86_IDENTITY_GATE_FAILED')
          print('OFFICIAL_EVENT86_ADAMS_ID_VERIFIED')
          try:
              opts=resolve_options('0022600009',86)
          except Exception as e:
              print('NBA_EVENT86_HLS_RESOLVE_FAILED',type(e).__name__)
              raise SystemExit(4)
          print('NBA_EVENT86_ANGLE_COUNT',len(opts))
          if 'Broadcast' not in opts:
              raise RuntimeError('NBA_EVENT86_BROADCAST_UNAVAILABLE')
          out=root/'clip'/'0022600009-e86-broadcast.mp4'
          try:
              download_hls(opts['Broadcast'],out)
          except Exception as e:
              print('NBA_EVENT86_MEDIA_FETCH_FAILED',type(e).__name__)
              raise SystemExit(5)
          meta=probe(out)
          if not (meta['width']>=640 and meta['height']>=360 and meta['fps']>=24 and 4<=meta['duration_s']<=40):
              raise RuntimeError('NBA_EVENT86_MEDIA_METADATA_GATE_FAILED')
          cap=cv2.VideoCapture(str(out))
          n=int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          samples=[]
          for i in np.linspace(0,n-1,7,dtype=int):
              cap.set(cv2.CAP_PROP_POS_FRAMES,int(i))
              ok,frame=cap.read()
              if not ok:raise RuntimeError('NBA_EVENT86_FRAME_DECODE_FAILED')
              samples.append(cv2.resize(cv2.cvtColor(frame,cv2.COLOR_BGR2GRAY),(160,90)))
          cap.release()
          movement=float(np.median([np.mean(cv2.absdiff(samples[0],x)) for x in samples[1:]]))
          if movement<.5:raise RuntimeError('NBA_EVENT86_STATIC_PLACEHOLDER_REJECTED')
          report={
            'schema':'hoopvision.clip-lab.event86-native-broadcast.v1',
            'game_id':'0022600009','nba_event':86,'nba_player_id':203500,
            'event':'Q1 05:14 Adams layup','source':'ORIGINAL_NBA_CLIPS_HLS_BROADCAST',
            'video_filename':out.name,'video_sha256':sha256(out),
            'media':meta,'decoded_frames':n,'temporal_motion_absdiff':round(movement,3),
            'camera_video_utc_sync_certified':False,
            'native_gamepulse_positions':'gamepulse/clip_lab/positions/0022600009_q1_durant_adams.json',
            'floor_tracking_certified':False,
            'renderer':'original frozen v3.1 required, not Jabari3 replica',
            'status':'VIDEO_SOURCE_RECOVERED_FROZEN_TRACKING_REQUIRED'
          }
          (root/'clip'/'event86_source_qa.json').write_text(json.dumps(report,indent=2)+'\n')
          print('NBA_EVENT86_SOURCE_VIDEO_VERIFIED',meta['width'],meta['height'],round(meta['duration_s'],2),n)
          PY
          TAG='clip-lab-rockets-spurs-0022600009-e86-broadcast'
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 --title 'Clip Lab Rockets Spurs Adams event86 original broadcast' --notes 'Private original NBA broadcast event clip, not yet floor-ring rendered.' --latest=false
          fi
          gh release upload "$TAG" "$ROOT/clip/0022600009-e86-broadcast.mp4" "$ROOT/clip/event86_source_qa.json" --repo timeedmonds-maker/104 --clobber
          python3 - "$ROOT" <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1])/'clip'
          d=json.loads(subprocess.check_output(['gh','api','repos/timeedmonds-maker/104/releases/tags/clip-lab-rockets-spurs-0022600009-e86-broadcast'],text=True))
          a={x['name']:x for x in d['assets']}
          for name in ['0022600009-e86-broadcast.mp4','event86_source_qa.json']:
              assert a[name]['digest']=='sha256:'+hashlib.sha256((root/name).read_bytes()).hexdigest(),'PRIVATE_SOURCE_SHA_READBACK_FAILED'
          print('NBA_EVENT86_PRIVATE_SOURCE_SHA_VERIFIED')
          PY
