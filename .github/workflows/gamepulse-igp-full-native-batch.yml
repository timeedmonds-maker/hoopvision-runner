name: IGP source XYZ batch 28 game private backfill
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-full-native-batch.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions: {contents: read}
jobs:
  backfill:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) echo x-access-token;;
            *Password*) echo "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Extract original full game archives this shard
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_extract_all_original_sdk_xyz_2026.py'
          python3 - <<'PY' > "$RUNNER_TEMP/games.txt"
          import json,os
          from pathlib import Path
          j=json.loads(Path("gamepulse/fusion/materialized/official_native_episode_xyz_pr776_20261026/index.json").read_text())
          assert len(j["games"])==28
          for i,g in enumerate(sorted(j["games"])):
              if i%4==int(os.environ["SHARD"]):print(g)
          PY
          while read -r gid; do
            test -n "$gid" || continue
            target="gamepulse/fusion/materialized/igp_all_original_xyz/$gid"
            if test -f "$target/index.json"; then continue; fi
            mkdir -p "$RUNNER_TEMP/sdk-$gid"
            gh api "repos/$R/releases/tags/gamepulse-sdk-$gid" > "$RUNNER_TEMP/release-$gid.json"
            gh release download "gamepulse-sdk-$gid" -R "$R" --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk-$gid"
            python3 gamepulse/fusion/igp_extract_all_original_sdk_xyz_2026.py --game-id "$gid" --archive-dir "$RUNNER_TEMP/sdk-$gid" --release-manifest "$RUNNER_TEMP/release-$gid.json" --window-source "gamepulse/fusion/materialized/native_episode_windows_v2_pr776_20261026/games/$gid.json" --out-dir "$target"
            python3 - "$gid" <<'PY'
          import json,sys
          from pathlib import Path
          gid=sys.argv[1];r=Path("gamepulse/fusion")
          x=json.loads((r/"materialized/igp_all_original_xyz"/gid/"index.json").read_text())
          f=json.loads((r/"qa"/("official_native_episode_xyz_bridge_"+gid+"_20261026.json")).read_text())
          expected=f["counts"]["original_unique_frames"]+f["counts"]["conflicting_native_timestamps_quarantined"]
          assert x["original_frame_counts"]["unique_original_native_timestamps"]==expected
          assert len(x["original_archive_parts_sha256"])==13
          assert x["physical_possessions_certified"]==0
          print("IGP_FROZEN_NATIVE_GAME_ACCEPTED",gid,expected)
          PY
            rm -rf "$RUNNER_TEMP/sdk-$gid" "$RUNNER_TEMP/release-$gid.json"
          done < "$RUNNER_TEMP/games.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while read -r gid; do git add -f "gamepulse/fusion/materialized/igp_all_original_xyz/$gid"; done < "$RUNNER_TEMP/games.txt"
          if git diff --cached --quiet; then echo IGP_SHARD_ALREADY_DONE; exit 0; fi
          git commit -q -m "data(igp): private original full-game XYZ shard $SHARD"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_PRIVATE_SHARD_PUBLISHED "$SHARD"
              exit 0
            fi
            sleep "$i"
          done
          exit 1
