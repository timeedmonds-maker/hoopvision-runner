name: Clip Lab event80 local MP4 handoff smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-event80-delivery-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Make harmless retrieval test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/event80"
          printf 'CLIP_LAB_ARTIFACT_CHAT_FILE_HANDOFF\n' > "$RUNNER_TEMP/event80/handshake.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: clip-lab-event80-handoff-smoke
          path: ${{ runner.temp }}/event80/handshake.txt
          retention-days: 1
          if-no-files-found: error
