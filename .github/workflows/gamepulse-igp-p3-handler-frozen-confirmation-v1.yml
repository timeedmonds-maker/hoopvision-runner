name: IGP P3 independent ball-handler confirmation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-handler-frozen-confirmation-v1.yml']
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PINNED_PRIVATE_SHA: c88563d914e6ef50946fa13ef801cdacaa6c9a2d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository guard
        run: python3 tools/public_content_guard.py
      - name: Validate source models and unseen NBA games
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b research/igp-68-live-gap-census-20261030 https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_ball_handler_anchor_pilot_v1.py'
          python3 gamepulse/fusion/igp_68_p3_ball_handler_anchor_pilot_v1.py --root . --new-confirmation --output "$RUNNER_TEMP/confirmation.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'confirmation.json').read_text())
          assert j['evaluation_role']=='PREDECLARED_SECOND_FOUR_GAME_CONFIRMATION'
          assert j['no_source_modified'] and j['no_model_promoted']
          print('P3_BALL_HANDLER_SECOND_FOUR_QA',json.dumps(j['pooled_heldout'],sort_keys=True))
          PY
