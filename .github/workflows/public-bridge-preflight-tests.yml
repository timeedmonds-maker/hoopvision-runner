name: HoopVision Public Bridge Preflight Tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/public_bridge_preflight.py'
      - 'tests/test_public_bridge_preflight.py'
      - 'tools/wait_for_consumer_receipt.py'
      - 'tests/test_consumer_receipt_waiter.py'
      - '.github/workflows/public-bridge-preflight-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run bridge control tests
        run: python -m pytest -q tests/test_public_bridge_preflight.py tests/test_consumer_receipt_waiter.py
