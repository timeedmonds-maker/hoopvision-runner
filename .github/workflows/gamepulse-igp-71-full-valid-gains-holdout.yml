name: IGP 71 full matched live masked 800 1200 holdout
# Reviewed public-only aggregate outcomes. All original NBA data remains in private repository.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-71-full-valid-gains-holdout.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-71-masked-all-original-holdout
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public content boundary
        run: python3 tools/public_content_guard.py
      - name: Entire all71 matched NBA live-clock 800 and 1200 original masked source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_71_matched_live_masked_800_v1200_v1.py --root . --games all --output gamepulse/fusion/qa/igp_progress_20261031/igp_71_all_matched_masked_800_v1200_v1.json >"$RUNNER_TEMP/holdout71.log" 2>&1 || {
            tail -40 "$RUNNER_TEMP/holdout71.log" | sed -E 's/[0-9]{10,}/[UTC_REDACTED]/g'
            exit 30
          }
          grep 'IGP71_PAIRED_MASKED_LIVE_FINAL' "$RUNNER_TEMP/holdout71.log" || true
          python3 - <<'PY'
          import json
          d=json.load(open('gamepulse/fusion/qa/igp_progress_20261031/igp_71_all_matched_masked_800_v1200_v1.json'))
          c=d['counts']
          assert d['evaluated_games']==71 and len(d['per_game'])==71
          assert c['masked_live_complete_source_frames']>=6800
          assert c['matched_player_slots_1200']>=c['matched_player_slots_800']
          assert c['complete_ten_ball_1200']>=c['complete_ten_ball_800']
          print('IGP71_VALID_GAIN_GATE',json.dumps({'games':71,'selected_frames':c['masked_live_complete_source_frames'],
            'new_player_slots_1200':c['new_1200_player_slots'],'new_ball_frames_1200':c['new_1200_ball_frames'],
            'original_source_video_accuracy_certified':False},sort_keys=True))
          PY
      - name: Write accepted private original-source QA only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261031/igp_71_all_matched_masked_800_v1200_v1.json
          git diff --cached --check
          if git diff --cached --quiet;then echo IGP71_ALL_MASKED_QA_ALREADY_CURRENT;exit 0;fi
          git commit -q -m 'qa(igp): 71-game live PBP same-cohort masked player and ball 800 versus 1200 feet'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo IGP71_ALL_MASKED_PRIVATE_QA_COMMITTED;exit 0;fi
            sleep "$attempt"
          done
          exit 24
