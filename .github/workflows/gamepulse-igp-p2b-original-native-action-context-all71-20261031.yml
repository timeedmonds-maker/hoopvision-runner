# Public orchestration only; original NBA actor XYZ, UTC and per-event detail remain private.
name: IGP P2B all71 original-native action context beyond S1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-original-native-action-context-all71-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-all71-original-native-event-context-v3
  cancel-in-progress: true
jobs:
  native-event-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private original SHA source and source-free direct-context tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_original_native_action_context_all71_v3.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_original_native_action_context_all71_v3.py'
          echo IGP_NATIVE_ALL71_ACTION_CONTEXT_SOURCEFREE_TESTS_PASS
      - name: Validate NBA game0001 SHA-original native context
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_original_native_action_context_all71_v3.py \
            --root . --only-game 0022600001 \
            --out "$RUNNER_TEMP/igp-native-context-0001.json" \
            >"$RUNNER_TEMP/igp-native-context-0001.log" 2>&1 || {
              echo IGP_NATIVE_GAME0001_SOURCE_QA_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          v=(Path(os.environ["RUNNER_TEMP"])/"igp-native-context-0001.log").read_text(errors="replace").splitlines()
          e=next((s for s in reversed(v) if re.match(r"^(?:ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|ImportError):",s)),None)
          if e:
              typ,_,msg=e.partition(":")
              code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_NATIVE_CONTEXT_PRIVATE_FAILURE",typ,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_NATIVE_CONTEXT_PRIVATE_FAILURE UNCLASSIFIED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-native-context-0001.json").read_text())
          c=a["counts"]
          assert a["games"]==1 and c["official_actions"]==593
          assert len(a["per_game"]["0022600001"]["action_rows"])==593
          assert c["direct_official_ten_ball_in_context_not_stopped"]<=c["any_native_in_context"]<=593
          print("IGP_NATIVE_GAME0001_ACTION_CONTEXT_PASS",json.dumps(c,sort_keys=True))
          PY
      - name: Original NBA SHA verified 71game native event context
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_original_native_action_context_all71_v3.py \
            --root . --out "$RUNNER_TEMP/igp-native-context-71.json" \
            >"$RUNNER_TEMP/igp-native-context-71.log" 2>&1 || {
              echo IGP_NATIVE_ALL71_ACTION_CONTEXT_SOURCE_QA_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          v=(Path(os.environ["RUNNER_TEMP"])/"igp-native-context-71.log").read_text(errors="replace").splitlines()
          e=next((s for s in reversed(v) if re.match(r"^(?:ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|ImportError):",s)),None)
          if e:
              typ,_,msg=e.partition(":")
              code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_NATIVE_CONTEXT_PRIVATE_FAILURE",typ,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_NATIVE_CONTEXT_PRIVATE_FAILURE UNCLASSIFIED")
          PY
              exit 42
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-native-context-71.json").read_text())
          c=a["counts"]
          assert a["games"]==71 and c["official_actions"]==43419
          assert len(a["per_game"])==71
          assert all(len(v["action_rows"])==v["counts"]["official_actions"] for v in a["per_game"].values())
          assert c["direct_official_ten_ball_in_context_not_stopped"]<=c["any_native_in_context"]<=43419
          assert a["original_SDK_PBP_and_P2B_default_unchanged"]
          assert a["physical_possessions_certified"]==0
          print("IGP_NATIVE_ORIGINAL_ALL71_ACTION_CONTEXT_PASS",json.dumps(c,sort_keys=True))
          PY
      - name: Commit private full event ledger and compact aggregate source SHA receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"igp-native-context-71.json").read_bytes()
          d=json.loads(raw)
          root=Path("gamepulse/fusion/qa/igp_v32")
          full=root/"igp_v32_p2b_original_native_action_context_all71_v3.json"
          compact=root/"igp_v32_p2b_original_native_action_context_71_summary_20261031.json"
          record={
              "schema":"igp.v32.p2b.71game.original-native-event-context.summary.v3",
              "full_original_NBA_QA_SHA256":hashlib.sha256(raw).hexdigest(),
              "P2B_v1_all_action_QA_sha256":d["original_P2B_event_V1_QA_SHA256"],
              "counts":d["counts"],
              "per_game":{gid:v["counts"] for gid,v in d["per_game"].items()},
              "physical_possessions_certified":0,
              "source_original_NBA_xyz_and_PBP_modified":False}
          root.mkdir(parents=True,exist_ok=True)
          if full.exists() and full.read_bytes()!=raw:raise RuntimeError("REFUSE_NATIVE_ACTION_LEDGER_OVERWRITE")
          if compact.exists() and json.loads(compact.read_bytes())!=record:raise RuntimeError("REFUSE_NATIVE_ACTION_SUMMARY_OVERWRITE")
          full.write_bytes(raw)
          compact.write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("IGP_NATIVE_ALL71_ACTION_QA_SHA",record["full_original_NBA_QA_SHA256"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_original_native_action_context_all71_v3.json
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_original_native_action_context_71_summary_20261031.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_NATIVE_ALL71_EVENT_CONTEXT_ALREADY_COMMITTED
            exit 0
          fi
          git commit -q -m 'qa(igp): SHA original all71 PBP action native context outside S1'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_NATIVE_ALL71_ACTION_CONTEXT_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
