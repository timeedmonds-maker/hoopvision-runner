# P3 heldout generalization: 6 training original SDK games, 4 previously UNUSED test games.
name: IGP P3 ten-game unseen context original-mask validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-ten-game-fresh-context-holdout-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p3-unseen-ten-game-qa
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: c157396024b28a40a118a9bdf2c27b0286dfa959
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source privacy guard and strict pinned private QA code
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Unit tests and original-source independent P3 experiment
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_ten_game_independent_context_validation_v1.py'
          python3 gamepulse/fusion/igp_68_p3_ten_game_independent_context_validation_v1.py \
            --root . --out "$RUNNER_TEMP/igp-p3-ten-game-private.json" \
            > "$RUNNER_TEMP/igp-p3-private.log" 2>&1 || {
              echo IGP_P3_NEW_10_GAME_PRIVATE_QA_FAILED
              tail -n 15 "$RUNNER_TEMP/igp-p3-private.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-p3-ten-game-private.json').read_bytes())
          assert q['train_and_test_no_game_overlap']
          assert q['architecture_frozen_prior_to_new_test']
          assert not q['no_model_promotion'] is False
          assert len(q['training_games'])==6 and len(q['heldout_games_never_used_in_P2_P3'])==4
          assert not (set(q['training_games'])|set(q['heldout_games_never_used_in_P2_P3']))&set(q['prior_development_games_sorted'])
          for kind in ['player','ball']:
            e=q['evaluation'][kind]['unseen_test_source_masked']
            assert e['n']>=100 and e['baseline_C0_error_ft']['n']==e['multiagent_error_ft']['n']
          print('P3_FRESH_GAME_HELDOUT_SDK_QA',json.dumps({
            k:q['evaluation'][k]['unseen_test_source_masked']
            for k in ['player','ball']},sort_keys=True))
          PY
      - name: Save independently tested source metrics privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_tengame_fresh_context_holdout_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-ten-game "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-p3-ten-game-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): ten-game P3 six-train four-fresh-heldout source evaluation'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_TEN_GAME_INDEPENDENT_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$i"
          done
          exit 42
