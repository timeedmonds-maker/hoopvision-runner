# Source-controlled audit: SHA-verified private receipts, no private XYZ in public logs.
name: IGP 68 Priority 1 source outlier triage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-priority1-source-triage-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-68-priority1-outlier-triage
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: baf69f558347a1b5be7cd237fc938cd6e852832e
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin private accepted full68 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test source/denominator gates and generate private full68 audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_priority1_outlier_triage_v1.py'
          python3 gamepulse/fusion/igp_68_priority1_outlier_triage_v1.py \
            --root . --output "$RUNNER_TEMP/igp-p1-private.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-p1-private.json').read_text())
          assert q['games']==68 and len(q['all_games'])==68
          assert q['native']['total']==543024 and q['native']['complete']==487991
          assert q['continuous_10hz']['total']==1106941 and q['continuous_10hz']['complete']==909052
          assert q['native']['need_for_95pct']==27882
          assert q['continuous_10hz']['need_for_95pct']==142542
          assert len(q['priority_per_game'])==5
          assert sum(x['source_population_evidence'].startswith('RECOVERED_13PART')
                     for x in q['all_games'].values())==11
          print('P1_68_COHORT_AND_TARGET_GATES_PASSED')
          PY
      - name: Commit reproducible audit to original private research branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_priority1_outlier_triage_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p1-triage "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-p1-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): retain 68 game priority one outlier source triage'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo P1_TRIAGE_RECEIPT_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
