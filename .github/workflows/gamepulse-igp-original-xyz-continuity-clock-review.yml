name: IGP original XYZ continuity and independent clock review acceptance
# Private player XYZ stays in the temporary private clone and private canonical repo.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-original-xyz-continuity-clock-review.yml']
permissions:
  contents: read
concurrency:
  group: igp-private-xyz-continuity-clock-review
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      QA_DIR: gamepulse/fusion/qa/igp_progress_20261026
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner and fetch private source with Git
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_GIT_TOKEN_MISSING; exit 4; }
          cat > "$RUNNER_TEMP/igp-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/igp-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/igp-askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
          echo IGP_PRIVATE_SOURCE_CLONED_WITH_NO_PUBLIC_ARTIFACTS
      - name: Run both audited tracks against real original XYZ and official NBA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests -v \
            -p 'test_igp_xyz_continuity_clock_review_2026.py'
          test ! -e "$QA_DIR" || { echo REFUSE_OVERWRITE_PRIVATE_IGP_RECEIPT; exit 7; }
          mkdir -p "$QA_DIR"
          python3 gamepulse/fusion/igp_native_xyz_continuity_audit_2026.py \
            --root . --out "$QA_DIR/native_xyz_continuity_532.json"
          python3 gamepulse/fusion/igp_clock_video_holdout_targets_2026.py \
            --root . --out "$QA_DIR/independent_clock_review_targets_36.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path('gamepulse/fusion/qa/igp_progress_20261026')
          p=json.loads((folder/'native_xyz_continuity_532.json').read_text())
          c=json.loads((folder/'independent_clock_review_targets_36.json').read_text())
          assert p['game_count']==c['game_count']==36
          assert p['games_with_accepted_original_xyz']==28
          assert p['sha_verified_original_episode_files']==532
          assert p['counts']['total_frames']==29297
          assert p['counts']['complete_ten_plus_ball_frames']==23469
          assert p['counts']['native_contiguous_runs']>=1
          assert c['independent_holdout_video_labels_available']==0
          assert c['counts']['games_with_clock_source_windows']==28
          assert c['counts']['review_targets']>0
          assert p['physical_possessions_certified']==c['physical_possessions_certified']==0
          print('IGP_DUAL_TRACK_REAL_DATA_ACCEPTED',
                json.dumps({'original_games':28,'episode_files_sha_verified':532,
                'observed_frame_entries':29297,'ten_player_plus_direct_ball_entries':23469,
                'native_contiguous_runs':p['counts']['native_contiguous_runs'],
                'runs_5_plus_frames':p['counts']['native_runs_at_least_5_frames'],
                'runs_10_plus_frames':p['counts']['native_runs_at_least_10_frames'],
                'independent_clock_review_targets':c['counts']['review_targets'],
                'independently_accepted_clock_labels':0,
                'physical_possessions_certified':0},sort_keys=True))
          PY
      - name: Publish SHA-referenced audit and target queue to canonical private branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$QA_DIR/native_xyz_continuity_532.json" \
                     "$QA_DIR/independent_clock_review_targets_36.json"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -q -m "data(igp): accept source-pinned XYZ continuity and non-basket clock review targets"
          git fetch -q origin "$PRIVATE_BRANCH"
          git rebase "origin/$PRIVATE_BRANCH"
          git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
          echo IGP_DUAL_TRACK_PRIVATE_QA_RECEIPTS_COMMITTED
