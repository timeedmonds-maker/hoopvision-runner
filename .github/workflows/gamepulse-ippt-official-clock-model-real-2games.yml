name: IPPT actual original NBA official clock ten-player position model smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-official-clock-model-real-2games.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  original-model-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/ippt-event-snapshots-separate-20261028
      SHA: 9ac3019d78e6ce7b28b823bf702159c2b05a173d
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public contents and checkout private SHA native source
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SHA"
          echo "PRIV=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Source-free tests, real NBA official-clock ten player and ball modeled query
        run: |
          set -euo pipefail
          cd "$PRIV"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -v gamepulse/fusion/test_query_igp_ippt_official_clock_ten_model_v1_2026.py
          python3 -m py_compile gamepulse/fusion/query_igp_ippt_official_clock_ten_model_v1_2026.py
          python3 - <<'PY'
          import collections,json,os
          from pathlib import Path
          from query_igp_ippt_official_clock_ten_model_v1_2026 import at
          from igp_ippt_running_gameclock_source_coverage_2026 import intervals
          from igp_tracking_stable_lineup_windows_2026 import official_ten_at
          from igp_tracking_pilot_run_2026 import BASE,load
          totals=collections.Counter()
          for gid in ("0022600009","0022600092"):
              m,_=load(".",BASE/"materialized/igp_g4_original_native_player_ball_possession_v1/index.json")
              sha=m["games"][gid]["source_sha256"]
              pbp,_=load(".",BASE/"official_pbp_timing/games"/(gid+".json"),sha["NBA_PBP"])
              lineup,_=load(".",BASE/"official_lineup_clock/games"/(gid+".json"),sha["NBA_official_lineup"])
              valid=0
              for ta,tb,p,ca,cb in intervals(pbp["actions"]):
                  clock=(ca+cb)//2
                  if not cb<clock<ca or official_ten_at(lineup["lineup_intervals"],p,clock) is None:continue
                  out=at(".",gid,p,clock)
                  assert len(out["official_NBA_ten"])==10
                  assert len(out["players"])==10
                  assert out["model_UTC_mapping_not_independently_video_certified"]
                  assert not out["physical_ball_custody_certified"]
                  totals["actual_source_clock_model_points_queried"]+=1
                  totals["model_positions_returned"]+=out["candidate_player_positions_returned"]
                  totals["ten_plus_ball_model_complete"]+=out["ten_plus_ball_model_complete"]
                  totals["ten_plus_ball_two_sided"]+=out["all_ten_plus_ball_two_sided_or_direct"]
                  valid+=1
                  if valid>=5:break
              assert valid>=3
              totals["real_original_NBA_games"]+=1
          assert totals["real_original_NBA_games"]==2
          assert totals["actual_source_clock_model_points_queried"]>=6
          assert totals["model_positions_returned"]>=30
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(
              json.dumps({"counts":dict(totals),"physical_custody_certified":False},sort_keys=True))
          print("IPPT_REAL_ORIGINAL_NBA_GAMECLOCK_TEN_PLAYER_3D_BALL_MODEL_QUERY_PASS",
                json.dumps(dict(totals),sort_keys=True))
          PY
      - name: Public aggregate-only source model QA receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          x=json.loads((r/"safe.json").read_text()) if (r/"safe.json").exists() else {"status":os.environ["RESULT"]}
          x.update({"run_id":os.environ["GITHUB_RUN_ID"],"code_sha":os.environ["SHA"]})
          (r/"receipt.md").write_text("Actual private NBA official gameclock ten-player/ball position model pilot. Aggregates only; model confidence and physical timing provisional.\n\n~~~json\n"+json.dumps(x,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/receipt.md"
