name: CPU Animate V50 ephemeral authenticated asset handoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpu-animate-v50-private-cdn-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-ephemeral-url:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check no content or private source is released publicly
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          echo "PRIVATE_SOURCE_ONLY_VALIDATED"
      - name: Obtain short-lived GitHub release asset CDN redirect and persist privately
        shell: bash
        run: |
          set -euo pipefail
          asset='https://api.github.com/repos/timeedmonds-maker/104/releases/assets/741833886'
          scratch="$RUNNER_TEMP/cpu-v50-signed-cdn"
          mkdir -m 700 -p "$scratch"
          # GitHub's REST asset API supports octet-stream 302 to
          # temporary signed release-assets.githubusercontent.com URL.
          # Never print authorization header or resulting pre-signed URL.
          status=$(curl --fail-with-body -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -w '%{http_code}' -o "$scratch/v50.mp4" "$asset")
          test "$status" = 200
          test "$(wc -c < "$scratch/v50.mp4")" = 9323525
          test "$(sha256sum "$scratch/v50.mp4" | cut -d' ' -f1)" = \
              '9cba2662bc4d208a0c60ec25bb75fc9bd4320b1f27d5dfc9c23cb513ced392eb'
          # Second request: capture effective authenticated signed CDN URL to
          # private 104 only. Do NOT print signed URL or upload media anywhere.
          curl --fail-with-body -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -w '%{url_effective}' -o /dev/null "$asset" > "$scratch/signed_url.txt"
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.parse,hashlib
          scratch=pathlib.Path(os.environ["RUNNER_TEMP"])/"cpu-v50-signed-cdn"
          url=(scratch/"signed_url.txt").read_text().strip()
          u=urllib.parse.urlparse(url)
          if not u.scheme=="https" or not u.netloc.endswith(".githubusercontent.com"):
              print("GITHUB_AUTHENTICATED_ASSET_DID_NOT_RETURN_SIGNED_CDN")
              raise SystemExit(12)
          if len(url)>5000:raise ValueError("SIGNED_URL_UNEXPECTED_LENGTH")
          path="docs/cpu_animate/source_video_v50_review/v50_ephemeral_cdn_link.txt"
          api="repos/timeedmonds-maker/104/contents/"+path
          branch="cpu-animate/e585-v40-attachment-continuity-possession-20261113"
          blob=(url+"\n").encode()
          payload={"message":"Ephemeral authenticated V50 original MP4 signed CDN bridge; private and short expiry",
                   "branch":branch,"content":base64.b64encode(blob).decode()}
          prior=subprocess.run(["gh","api",api+"?ref="+branch],capture_output=True,text=True)
          if prior.returncode==0:payload["sha"]=json.loads(prior.stdout)["sha"]
          src=scratch/"api.json";src.write_text(json.dumps(payload))
          posted=subprocess.run(["gh","api","-X","PUT",api,"--input",str(src)],
                                 capture_output=True,text=True)
          if posted.returncode:raise RuntimeError("PRIVATE_SIGNED_URL_UPLOAD_FAILED")
          print("EPHEMERAL_GITHUB_CDN_LINK_STORED_PRIVATE",len(url),
                hashlib.sha256(url.encode()).hexdigest()[:12])
          PY
      - name: Remove all private data from public execution
        if: always()
        run: rm -rf "$RUNNER_TEMP/cpu-v50-signed-cdn"
