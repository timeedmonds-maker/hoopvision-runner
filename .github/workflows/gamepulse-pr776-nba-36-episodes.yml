name: Integrated Pulse 36-game NBA source-field episode materialization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-nba-36-episodes.yml','tools/public_content_guard.py']
permissions:
  contents: read
concurrency:
  group: private-gamepulse-36-nba-field-episodes
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and private source Git sparse clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-36" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *Password*) printf '%s\n' "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-36"
          echo "GIT_ASKPASS=$RUNNER_TEMP/askpass-36" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          GIT_ASKPASS="$RUNNER_TEMP/askpass-36" GIT_TERMINAL_PROMPT=0 \
            git clone -q --depth=1 --filter=blob:none --sparse --branch "$BRANCH" \
                "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/ep36"
          GIT_ASKPASS="$RUNNER_TEMP/askpass-36" GIT_TERMINAL_PROMPT=0 git -C "$RUNNER_TEMP/ep36" sparse-checkout set gamepulse/fusion
          GIT_ASKPASS="$RUNNER_TEMP/askpass-36" GIT_TERMINAL_PROMPT=0 \
            git -C "$RUNNER_TEMP/ep36" fetch -q --depth=1 origin main:refs/remotes/origin/main
          echo "WORK=$RUNNER_TEMP/ep36" >> "$GITHUB_ENV"
      - name: Overlay only missing eight original source games from same canonical main commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 - <<'PY'
          import subprocess,json
          from pathlib import Path
          def show(p):return subprocess.check_output(['git','show','origin/main:'+p],stderr=subprocess.DEVNULL)
          source='gamepulse/fusion/'
          indexes=[
            'official_pbp_timing/index-2026-27-expanded.json',
            'index/interactions/index-2026-27.json',
            'index/unassigned_native_labels/index-2026-27.json',
            'index/index.json']
          gids=['0022600'+str(i) for i in range(104,112)]
          for rel in indexes:
            path=Path(source+rel)
            raw=show(str(path)); j=json.loads(raw)
            assert len(j['games'])==36 and set(gids)<=set(j['games'])
            path.write_bytes(raw)
          for gid in gids:
            for rel in (
              'official_pbp_timing/games/'+gid+'.json',
              'index/interactions/'+gid+'.json',
              'index/unassigned_native_labels/'+gid+'.json',
              'index/games/'+gid+'.json'):
              target=Path(source+rel)
              assert not target.exists(),'REFUSE_EXISTING_CAPTURED_GAME_OVERWRITE'
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(show(str(target)))
          print('SOURCE_36_MAIN_CANONICAL_FILES_OVERLAID','games',len(gids))
          PY
      - name: Run full 36-game SHA-checked materialization and preserve old 28 original bytes
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          from materialize_nba_episode_views_2026 import build
          base=Path('gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025')
          old=json.loads((base/'index.json').read_bytes())
          assert len(old['games'])==28
          stage=Path('gamepulse/fusion/materialized/.episode_rebuild36')
          fresh=build(Path('.'),stage)
          assert len(fresh['games'])==36 and fresh['totals']['games']==36
          for gid,meta in old['games'].items():
            if fresh['games'][gid]['sha256']!=meta['sha256']:
              raise ValueError('REFUSE_TO_REPLACE_OLD_28_EPISODE_BYTES:'+gid)
            assert hashlib.sha256((base/(gid+'.json')).read_bytes()).hexdigest()==meta['sha256']
          new=sorted(set(fresh['games'])-set(old['games']))
          assert new==['0022600'+str(i) for i in range(104,112)]
          for gid in new:shutil.copyfile(stage/(gid+'.json'),base/(gid+'.json'))
          old['games'].update({gid:fresh['games'][gid] for gid in new})
          old['totals']=fresh['totals']
          old['source_action_run_status_by_game'].update({
             gid:fresh['source_action_run_status_by_game'][gid] for gid in new})
          old['source_partition']={'prior_28_sha256_unchanged':True,
             'new_8_full_source_main':True}
          (base/'index.json').write_text(json.dumps(old,sort_keys=True,indent=2)+'\n')
          shutil.rmtree(stage)
          print('NBA_36_EPISODE_REBUILD_ACCEPTED',json.dumps({
             'games':36,'total_episodes':old['totals']['nba_field_episodes'],
             'original_touch_labels':old['totals']['original_native_labels'],
             'old_28_byte_identical':True},sort_keys=True))
          PY
      - name: Commit source manifests and incremental queryable episode views privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json \
            gamepulse/fusion/index/index.json \
            gamepulse/fusion/index/interactions/index-2026-27.json \
            gamepulse/fusion/index/unassigned_native_labels/index-2026-27.json \
            gamepulse/fusion/official_pbp_timing/games/00226001{04,05,06,07,08,09,10,11}.json \
            gamepulse/fusion/index/interactions/00226001{04,05,06,07,08,09,10,11}.json \
            gamepulse/fusion/index/unassigned_native_labels/00226001{04,05,06,07,08,09,10,11}.json \
            gamepulse/fusion/index/games/00226001{04,05,06,07,08,09,10,11}.json \
            gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/index.json \
            gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/00226001{04,05,06,07,08,09,10,11}.json
          git diff --cached --check
          git commit -qm "data(gamepulse): add eight NBA source-field episode games and original source indexes"
          git push -q origin "HEAD:$BRANCH"
          echo PRIVATE_EPISODE_36_COMMITTED
