name: Integrated Pulse PR776 indexed XYZ and position holdout checkpoint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-event-first-36.yml'
permissions:
  contents: read
concurrency:
  group: gamepulse-pr776-event-first-36
  cancel-in-progress: false
jobs:
  d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard and hydrate private 36-game source views using free Git CPU
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-event" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *Password*) printf '%s\n' "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-event"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-event" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
             "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private-events"
          git -C "$RUNNER_TEMP/private-events" sparse-checkout set gamepulse/fusion
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$RUNNER_TEMP/private-events" >> "$GITHUB_ENV"
      - name: Run fail-closed source-free regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v \
            -s gamepulse/fusion/tests -p 'test_query_nba_event_native_tracking_36_2026.py'
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v \
            -s gamepulse/fusion/tests -p 'test_private_xyz_index_integrity_2026.py'
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v \
            -s gamepulse/fusion/tests -p 'test_private_event_position_holdout_2026.py'
      - name: Verify current 36-game query and held-out original positions
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          python3 gamepulse/fusion/accept_private_event_xyz_36_2026.py \
            --repo-root . \
            --out gamepulse/fusion/qa/event_first_lookup_36game_private_xyz_checkpoint2_20261026.json
          python3 gamepulse/fusion/audit_private_event_position_holdout_2026.py \
            --repo-root . \
            --out gamepulse/fusion/qa/private_event_position_holdout_checkpoint2_20261026.json
      - name: Commit aggregate receipts only to private PR
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add gamepulse/fusion/qa/event_first_lookup_36game_private_xyz_checkpoint2_20261026.json
          git add gamepulse/fusion/qa/private_event_position_holdout_checkpoint2_20261026.json
          git diff --cached --check
          git commit -qm "data(gamepulse): indexed event query and original position holdout checkpoint"
          for attempt in 1 2 3 4 5; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo PRIVATE_XYZ_POSITION_HOLDOUT_CHECKPOINT_ACCEPTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
