name: Integrated Pulse PR776 D1 36-game exact-action acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-event-first-36.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: gamepulse-pr776-event-first-36
  cancel-in-progress: false
jobs:
  d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard and hydrate private 36-game source views using free Git CPU
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-event" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *Password*) printf '%s\n' "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-event"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-event" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
             "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private-events"
          git -C "$RUNNER_TEMP/private-events" sparse-checkout set gamepulse/fusion
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$RUNNER_TEMP/private-events" >> "$GITHUB_ENV"
      - name: Run fail-closed source-free regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v \
            -s gamepulse/fusion/tests -p 'test_query_nba_event_native_tracking_36_2026.py'
      - name: Check exact original NBA events in every captured game
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          import json
          from pathlib import Path
          from query_nba_event_native_tracking_36_2026 import assemble
          base=Path('.')
          eindex=json.loads(Path('gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/index.json').read_bytes())
          nindex=json.loads(Path('gamepulse/fusion/materialized/official_native_episode_xyz_pr776_20261026/index.json').read_bytes())
          assert len(eindex['games'])==36 and len(nindex['games'])==28
          counts={'games':0,'official_nba_episodes':0,'native_QA_games':0,
                  'pending_native_QA_games':0,'event_source_sha_verified':0,
                  'action_lineup_ambiguous_count':0,
                  'unique_official_ten_at_exact_action_clock':0,
                  'selected_qualified_native_episodes':0,
                  'physical_possessions_certified':0}
          receipts={}
          for gid in sorted(eindex['games']):
              episode_path='gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/'+gid+'.json'
              episode_doc=json.loads(Path(episode_path).read_bytes())
              assert episode_doc['episodes'] and episode_doc['game_id']==gid
              action=episode_doc['episodes'][0]['official_action_numbers'][0]
              q=assemble(base,gid,nba_action_number=action,limit=3)
              assert q['official_game_in_36'] and q['matched_nba_action_records']>=1
              assert q['physical_possessions_certified']==0
              is_native=gid in nindex['games']
              assert q['native_qa_available'] is is_native
              if not is_native:
                  assert all(x['tracking']['status']=='NATIVE_XYZ_QA_NOT_MATERIALIZED'
                             and x['tracking']['candidate_frames'] is None
                             for x in q['episodes'])
              action_ids={a for e in episode_doc['episodes']
                          for a in e.get('official_action_numbers',[])}
              lu=json.loads(Path('gamepulse/fusion/official_lineup_clock/games/'+gid+'.json').read_bytes())
              pbp=json.loads(Path('gamepulse/fusion/official_pbp_timing/games/'+gid+'.json').read_bytes())
              unique_action=None
              for ev in pbp['actions']:
                  if ev['nba_action_number'] not in action_ids:continue
                  hits=[row for row in lu['lineup_intervals']
                        if row['period']==ev['period'] and
                        row['start_clock_ms_remaining']>ev['game_clock_ms_remaining']>
                        row['end_clock_ms_remaining']]
                  if len(hits)==1:
                      unique_action=ev['nba_action_number']
                      break
              assert unique_action is not None,'NO_UNIQUE_OFFICIAL_LINEUP_NBA_ACTION:'+gid
              exact=assemble(base,gid,nba_action_number=unique_action,limit=3)
              assert exact['episodes'] and exact['matched_nba_action_records']==1
              assert exact['episodes'][0]['event_official_lineup_identity_grade']==(
                   'OFFICIAL_NBA_EVENT_LINEUP_UNIQUE')
              assert exact['episodes'][0]['official_ten_players_at_exact_nba_action_clock']
              counts['unique_official_ten_at_exact_action_clock']+=1
              counts['games']+=1
              counts['official_nba_episodes']+=len(episode_doc['episodes'])
              counts['native_QA_games']+=bool(is_native)
              counts['pending_native_QA_games']+=not is_native
              counts['event_source_sha_verified']+=1
              counts['action_lineup_ambiguous_count']+=sum(
                   x['event_official_lineup_identity_grade']!='OFFICIAL_NBA_EVENT_LINEUP_UNIQUE'
                   for x in q['episodes'])
              receipts[gid]={'native_qa':is_native,'official_episodes':len(episode_doc['episodes']),
                             'source_event_lookup_tested':True,
                             'official_ten_at_exact_nba_action_tested':True}
          assert counts['games']==36 and counts['official_nba_episodes']==7524
          assert counts['native_QA_games']==28 and counts['pending_native_QA_games']==8
          assert counts['unique_official_ten_at_exact_action_clock']==36
          # At least one real qualified original native episode must be selectable
          gid='0022600009'
          qap='gamepulse/fusion/qa/official_native_episode_xyz_bridge_0022600009_20261026.json'
          qa=json.loads(Path(qap).read_bytes())
          ep_id=next(k for k,v in qa['source_episode_tracking_qa'].items()
                     if v.get('full_official_ten_plus_ball_frames',0)>0)
          rock=assemble(base,gid,episode_id=ep_id)
          assert rock['episodes'] and rock['episodes'][0]['tracking']['status']=='PROVISIONAL_NATIVE_EPISODE_QA'
          assert rock['episodes'][0]['tracking']['complete_ten_plus_ball_candidate_frames']>0
          assert not rock['raw_original_sdk_coordinates_in_this_output']
          counts['selected_qualified_native_episodes']+=1
          print('PRIVATE_SOURCE_GRADED_EVENT_D1_ACCEPTANCE',json.dumps(counts,sort_keys=True))
          result={'schema':'gamepulse.36game-event-first-query-acceptance.v1',
                  'source_grade':'OFFICIAL_NBA_SOURCE_PLUS_PROVISIONAL_NATIVE_28_GAME_QA',
                  'counts':counts,'games':receipts,
                  'independent_native_clock_accuracy_accepted':False,
                  'physical_possessions_certified':0,
                  'source_original_sdk_coordinates_exported':False}
          path=Path('gamepulse/fusion/qa/event_first_lookup_36game_exact_action_acceptance_20261026.json')
          if path.exists():raise FileExistsError('REFUSE_EXISTING_D1_ACCEPTANCE_OVERWRITE')
          path.write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          PY
      - name: Publish only private aggregate D1 acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add gamepulse/fusion/qa/event_first_lookup_36game_acceptance_20261026.json
          git diff --cached --check
          git commit -qm "data(gamepulse): prove 36-game official action lookup with 28 original native QA source statuses"
          git push -q origin "HEAD:$BRANCH"
          echo PRIVATE_D1_36_GAME_EVENT_LOOKUP_ACCEPTED
