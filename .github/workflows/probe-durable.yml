name: Probe HoopVision Durable State
# probe-trigger: serialized-dedup-postfail
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-durable.yml'
      - 'PROBE_RUN_ID'
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read durable state only
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(tr -d '[:space:]' < PROBE_RUN_ID)"
          echo "RUN_ID=$RUN_ID"
          echo "=== EVENTS ==="
          gcloud storage cat "gs://$BUCKET/runs/$RUN_ID/events/*.json" 2>/dev/null || true
          echo "=== LOG OBJECTS ==="
          gcloud storage ls "gs://$BUCKET/runs/$RUN_ID/logs/*.bin" 2>/dev/null >/tmp/all_logs.txt || true
          tail -n 8 /tmp/all_logs.txt >/tmp/logs.txt || true
          cat /tmp/logs.txt || true
          echo "=== SAM SUMMARY ==="
          {
            head -n 18 /tmp/all_logs.txt
            tail -n 18 /tmp/all_logs.txt
          } | awk 'NF && !seen[$0]++' >/tmp/sample_logs.txt
          while IFS= read -r obj; do
            [ -n "$obj" ] || continue
            gcloud storage cat "$obj" 2>/dev/null               | grep -E 'HOOPVISION_SAM31_BATCHING|HOOPVISION_SAM31_POINT_BATCH|HOOPVISION_NAMED_RENDER_PATHS|physically impossible short jumps|HOOPVISION_FRESH_REPLAY_OK|Traceback|RuntimeError'               || true
          done </tmp/sample_logs.txt
          echo "=== LOG TAIL ==="
          while IFS= read -r obj; do
            [ -n "$obj" ] || continue
            echo "--- $obj ---"
            gcloud storage cat "$obj" 2>/dev/null || true
          done </tmp/logs.txt
          echo "=== RESULT ==="
          gcloud storage cat "gs://$BUCKET/runs/$RUN_ID/result.json" 2>/dev/null || true
