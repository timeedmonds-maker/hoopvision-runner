name: IPPT screenshot game DET-NYK official NBA Blueprint vs app shot-field precision
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-app-shot-details-0022600129-blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  exact-shot-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GID: '0022600129'
      BRANCH: research/ippt-event-snapshots-separate-20261028
      SHA: e2e45b0025e2f54b931369fd78a06edcb85a74ae
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Official public game source and original private repository boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set scripts data/extensions/nba_blueprint_2026_27 gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SHA"
          echo "PRIV=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Fetch public NBA Inside the Game Blueprint game ID 0022600129 and compare screenshot
        run: |
          set -euo pipefail
          cd "$PRIV"
          PYTHONPATH=scripts python3 - <<'PY'
          import collections,json,os
          from pathlib import Path
          from update_nba_blueprint_daily_2026_27 import read_report,canonical,BASE
          gid=os.environ["GID"]
          meta={"source_game_id":gid,
             "screenshot_game":"DET @ NYK October 27 2026",
             "ios_network_observed":False,
             "source":"PUBLIC_NBA_INSIDE_THE_GAME_BLUEPRINT",
             "screenshot_reference_only_not_NBA_API":True}
          try:
              report,upstream=read_report(gid)
              if report["game_header"]["awayTeam"]["teamTricode"]!="DET" or report["game_header"]["homeTeam"]["teamTricode"]!="NYK":
                  raise ValueError("SCREENSHOT_GAME_TEAM_DIFFERENT_FROM_BLUEPRINT")
              shots=report["shot_difficulty"]["shotDifficulty"]
              attrs=collections.Counter()
              possible=[]
              for sh in shots:
                  a=sh.get("attributes") or {}
                  attrs.update(a.keys())
                  shoot=sh.get("shooter") or {}
                  defend=sh.get("defender") or {}
                  if (shoot.get("lastName")=="Prince" and defend.get("lastName")=="Kolek"
                      and sh.get("period")==4 and sh.get("shotType")=="3pt"
                      and sh.get("success") is False):
                      possible.append({
                         "NBA_action_id":sh.get("ngssEventId"),
                         "clock":sh.get("gameClockTime"),
                         "xfg":sh.get("expFieldGoalPct"),
                         "contestDistance_in":a.get("contestDistance"),
                         "contestHeight_in":a.get("contestHeight"),
                         "shotVertical_in":a.get("shotVertical"),
                         "releaseTime_sec":a.get("releaseTime"),
                         "shotDistance_ft":a.get("shotDistance")})
              precisions=[(s.get("attributes") or {}).get("releaseTime") for s in shots]
              meta.update({"status":"ORIGINAL_NBA_BLUEPRINT_READ_SUCCESS",
                "raw_NBA_shot_rows":len(shots),
                "shot_attribute_fields":dict(sorted(attrs.items())),
                "field_defenderJump_present":any("defend" in k.lower() and "jump" in k.lower() for k in attrs),
                "release_time_values_finer_than_tenth":sum(
                    type(v) in (int,float) and abs(v-round(v,1))>1e-9 for v in precisions),
                "screenshot_Prince_vs_Kolek_miss_shots":possible,
                "source_HTML_SHA256":upstream["html_sha256"],
                "source_page_build":upstream.get("page_build"),
                "provider_shotVertical_says_shooter_not_defender":True})
              target=BASE/"games"/gid/"blueprint_report_raw.json"
              if target.exists() and target.read_text()!=canonical(report):
                  raise ValueError("BLUEPRINT_SOURCE_REVISION_PRESERVE_EXISTING")
              if not target.exists():
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_text(canonical(report))
                  meta["new_raw_report_committed_privately"]=True
              else:
                  meta["new_raw_report_committed_privately"]=False
          except Exception as e:
              if isinstance(e,ValueError) and ("DIFFERENT" in str(e) or "REVISION" in str(e)):
                  raise
              meta.update({"status":"ORIGINAL_NBA_BLUEPRINT_NOT_YET_AVAILABLE",
                 "reason_type":type(e).__name__,
                 "error_summary":str(e)[:160]})
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/ippt_app_shot_0022600129_blueprint_exact_source_check.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          if p.exists():raise FileExistsError("REFUSE_REWRITE_EXISTING_APP_SHOT_QA")
          p.write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          safe={k:meta[k] for k in ("source_game_id","status","ios_network_observed")}
          for k in ("raw_NBA_shot_rows","shot_attribute_fields","field_defenderJump_present",
                    "release_time_values_finer_than_tenth","screenshot_Prince_vs_Kolek_miss_shots",
                    "reason_type","error_summary","new_raw_report_committed_privately"):
              if k in meta:safe[k]=meta[k]
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(json.dumps(safe,sort_keys=True))
          print("IPPT_NBA_APP_SHOT_BLUEPRINT_0129_PUBLIC_SOURCE_CHECK",json.dumps(safe,sort_keys=True))
          PY
      - name: Persist official-public Blueprint report and read-status to PRIVATE research branch
        run: |
          set -euo pipefail
          cd "$PRIV"
          git config user.name "NBA Public Blueprint Shot Research"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f data/extensions/nba_blueprint_2026_27/games/0022600129 gamepulse/fusion/qa/igp_progress_20261029/ippt_app_shot_0022600129_blueprint_exact_source_check.json
          git diff --cached --check
          git commit -qm "data(ippt): capture official Blueprint DET-NYK screenshot game 0129 and audit app shot-precision"
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin HEAD:refs/heads/"$BRANCH"; then exit 0; fi
            sleep "$n"
          done
          exit 12
      - name: Public aggregate-only source check receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])
          x=json.loads((d/"safe.json").read_text()) if (d/"safe.json").exists() else {"status":os.environ["STATUS"]}
          x.update({"run_id":os.environ["GITHUB_RUN_ID"]})
          (d/"public.md").write_text("NBA screenshot game 0022600129 public Blueprint source field/precision audit. The separate mobile app network is NOT inspected. No licensed original tracking XYZ disclosed.\n\n~~~json\n"+json.dumps(x,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/public.md"
