name: Integrated Pulse 28-game bounded shadow-clock expansion acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-clock-shadow-study.yml','tools/public_content_guard.py']
permissions:
  contents: read
concurrency:
  group: private-gamepulse-clock-shadow-study
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and hydrate SHA-linked private clock modules with sparse Git
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-c" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-c"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-c" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse \
              -b "$BRANCH" "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/clock-study"
          git -C "$RUNNER_TEMP/clock-study" sparse-checkout set gamepulse/fusion
          echo "ROOT=$RUNNER_TEMP/clock-study" >> "$GITHUB_ENV"
          echo "GIT_ASKPASS=$RUNNER_TEMP/askpass-c" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Prove no false source-clock certification in negative controls
        run: |
          set -euo pipefail
          cd "$ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v \
            -s gamepulse/fusion/tests -p 'test_shadow_screened_clock_expansion_2026.py'
      - name: Reconstruct and independently shadow-screen all existing 28 NBA hoop QA
        run: |
          set -euo pipefail
          cd "$ROOT"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from shadow_screened_clock_expansion_2026 import analyze
          index=json.loads(Path('gamepulse/fusion/official_lineup_clock/index.json').read_bytes())
          gids=sorted(g for g in index['games'] if g<'0022600104')
          assert len(gids)==28 and len(index['games'])==36
          by={};totals={}
          for gid in gids:
              p=Path('gamepulse/fusion/qa/auto_physics')/gid[:8]/(gid+'.json')
              raw=p.read_bytes();qa=json.loads(raw)
              pp=Path('gamepulse/fusion/official_pbp_timing/games')/(gid+'.json')
              pr=pp.read_bytes();pbp=json.loads(pr)
              if qa['game_id']!=gid or pbp['game_id']!=gid:
                  raise ValueError('CLOCK_SOURCE_ID_MISMATCH')
              report=analyze(qa,pbp)
              report['source_sha256']={'auto_qa':hashlib.sha256(raw).hexdigest(),
                                       'official_pbp':hashlib.sha256(pr).hexdigest()}
              by[gid]=report
              for k in ('baseline_clock_ms','added_clock_ms','combined_candidate_clock_ms',
                        'nominal_clock_ms','additional_shadow_screened_brackets'):
                  totals[k]=totals.get(k,0)+report[k]
          assert totals['baseline_clock_ms']==7103400
          assert totals['nominal_clock_ms']==80640000
          assert totals['combined_candidate_clock_ms']>=totals['baseline_clock_ms']
          doc={'schema':'gamepulse.shadow-screened-28game-clock-research.v1',
               'games':by,'totals':totals,'original_28_games':28,
               'complete_36_original_source_clocks':False,
               'independent_clock_validation_complete':False,
               'physical_possessions_certified':0}
          target=Path('gamepulse/fusion/qa/shadow_screened_clock_28game_20261026.json')
          if target.exists():raise ValueError('REFUSE_EXISTING_SHADOW_CLOCK_QA_OVERWRITE')
          target.write_text(json.dumps(doc,sort_keys=True,indent=2)+'\n')
          print('SHADOW_CLOCK_SOURCE_28_QA',json.dumps(totals,sort_keys=True))
          PY
      - name: Commit original-source screening report privately
        run: |
          set -euo pipefail
          cd "$ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add gamepulse/fusion/qa/shadow_screened_clock_28game_20261026.json
          git diff --cached --check
          git commit -qm "data(gamepulse): 28-game bounded source-chronology screened clock research QA"
          git push -q origin "HEAD:$BRANCH"
