name: PR776 G2 original NBA SDK substitution-side official roster 36 game extension
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-substitution-side-roster-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-g2-nba-substitution-side-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original private NBA source under public content guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Unit regressions for substitution-side NBA period/gameclock roster
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g2_official_nba_substitution_side_expansion_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_official_nba_substitution_side_expansion_2026.py' -v
      - name: Verify 36 original NBA SDK source games and candidate-count conservation
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_substitution_side_official_roster_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_official_nba_substitution_side_expansion_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-G2-NBA-subside.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          a=x["totals"]
          assert x["source_games"]==36
          assert a["all_native_frames"]==1203986
          assert a["previous_strict_frames"]==412619
          assert a["previous_long_pair_frames"]==165108
          assert a["previous_strict_frames"]+a["previous_long_pair_frames"]+a["new_NBA_substitution_side_source_frames"]+a["original_outside_any_NBA_PBP_time_pair"]==1203986
          assert x["NBA_original_source_XYZ_unchanged"]
          assert x["strict_and_long_pair_original_source_groups_unchanged"]
          assert x["NBA_clock_and_actor_grade_is_candidate_not_gold"]
          print("G2_ALL36_NBA_SUBSTITUTION_SIDE_OFFICIAL_CLOCK_SOURCE_QA_PASS",json.dumps({
             "games":36,"new_frames":a["new_NBA_substitution_side_source_frames"],
             "NBA_direct_actor_source_slots":a["new_original_direct_official_actor_positions"],
             "NBA_original_ball_frames":a["new_original_ball_positions"],
             "compatible_source":a["new_raw_source_fully_matching_ten_frames"]+
                a["new_raw_source_partial_compatible_frames"],
             "contradictory_raw_source_IDs":a["new_raw_source_actor_disagreement_frames"],
             "previous_strict":a["previous_strict_frames"],
             "previous_long":a["previous_long_pair_frames"]
          },sort_keys=True))
          PY
      - name: Commit only original NBA SDK source private aggregate QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_substitution_side_official_roster_36_v1.json
          git config user.name "Game Pulse Official NBA Side QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): classify NBA official post/pre substitution source roster 36 games"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_NBA_G2_SUBSTITUTION_SIDE_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
