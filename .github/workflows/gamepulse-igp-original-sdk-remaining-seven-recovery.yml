name: IGP original SDK remaining seven full-game XYZ recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-original-sdk-remaining-seven-recovery.yml']
permissions:
  contents: read
concurrency:
  group: igp-seven-game-original-sdk-private-backfill
  cancel-in-progress: false
jobs:
  verify-and-recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      QA_DIR: gamepulse/fusion/qa/igp_progress_20261026/sdk_native_recovery_8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public content guard and authenticated private canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || exit 4
          cat > "$RUNNER_TEMP/igp-private-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/igp-private-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/igp-private-askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Run source-native QA tests, verify and process all remaining seven original releases
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests -v \
             -p 'test_igp_original_sdk_eight_native_inventory_2026.py'
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,sys,shutil
          from pathlib import Path
          m=json.loads(Path("gamepulse/fusion/qa/igp_original_sdk_eight_release_asset_manifest_20261026.json").read_text())
          qa=Path(os.environ["QA_DIR"])
          assert set(m['games'])=={
              '0022600104','0022600105','0022600106','0022600107',
              '0022600108','0022600109','0022600110','0022600111'}
          assert (qa/'0022600104.json').is_file()
          for gid in sorted(m['games']):
              if gid=='0022600104':continue
              outfile=qa/(gid+'.json')
              if outfile.exists():
                  prior=json.loads(outfile.read_text())
                  if (prior['game_id']!=gid or prior['original_archive_parts']!=13 or
                      prior['physical_possessions_certified']!=0):
                      raise RuntimeError('INVALID_PRIOR_PRIVATE_GAME_SOURCE')
                  print('IGP_PRIOR_PRIVATE_SHA_SOURCE_RECEIPT_PRESERVED',gid,flush=True)
                  continue
              entry=m['games'][gid]
              assets=entry['assets']
              assert len(assets)==13
              folder=Path(os.environ['RUNNER_TEMP'])/'original_source_assets'/gid
              folder.mkdir(parents=True)
              total_bytes=0
              for a in assets:
                  if not re.fullmatch(r'sdk-part-\d{2}\.tar\.gz',a['name']):
                      raise RuntimeError('INVALID_ORIGINAL_SOURCE_ASSET_NAME')
                  url='https://api.github.com/repos/timeedmonds-maker/104/releases/assets/'+str(a['id'])
                  f=folder/a['name']
                  cmd=['curl','-fLsS','--connect-timeout','15','--max-time','120',
                       '--retry','2','--retry-delay','2','--proto','=https',
                       '--proto-redir','=https',
                       '-H','Accept: application/octet-stream',
                       '-H','Authorization: Bearer '+os.environ['GH_TOKEN'],url,
                       '-w','%{http_code}','-o',str(f)]
                  p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)
                  if p.returncode:
                      raise RuntimeError('SDK_ASSET_DOWNLOAD_UNAVAILABLE:'+gid+':'+a['name']+
                                         ':HTTP_'+p.stdout.strip())
                  b=f.read_bytes()
                  if len(b)!=a['size_bytes'] or hashlib.sha256(b).hexdigest()!=a['digest'][7:]:
                      raise RuntimeError('ORIGINAL_PRIVATE_SDK_SHA_MISMATCH:'+gid+':'+a['name'])
                  total_bytes+=len(b)
              result=subprocess.run([sys.executable,
                  'gamepulse/fusion/igp_original_sdk_eight_native_inventory_2026.py',
                  '--root','.', '--game-id',gid,
                  '--archive-dir',str(folder),'--out',str(outfile)],check=False)
              if result.returncode:raise RuntimeError('ORIGINAL_GAME_NATIVE_QA_FAILED:'+gid)
              recorded=json.loads(outfile.read_text())
              if recorded['original_archive_parts']!=13 or recorded['physical_possessions_certified']!=0:
                  raise RuntimeError('FALSELY_ACCEPTED_ORIGINAL_GAME')
              print('IGP_ORIGINAL_NEW_GAME_SOURCE_VERIFIED',
                    'game='+gid,'original_sdk_parts=13',
                    'original_bytes='+str(total_bytes),
                    'observed_native_frames='+str(recorded['counts']['unique_observed_native_timestamps']),
                    'exact_raw_ten_plus_ball='+str(recorded['counts']['raw_exact_ten_plus_ball_frames']),
                    'gameclock_certified=NO',flush=True)
              # Checkpoint independently verified source provenance before
              # the next game's potentially rate-limited asset requests.
              for command in (
                  ['git','config','user.name','github-actions[bot]'],
                  ['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],
                  ['git','add','-f',str(outfile)],
                  ['git','commit','-q','-m',
                   'data(igp): SHA-verified original full SDK native XYZ QA '+gid],
                  ['git','fetch','-q','origin',os.environ['PRIVATE_BRANCH']],
                  ['git','rebase','origin/'+os.environ['PRIVATE_BRANCH']],
                  ['git','push','-q','origin',
                   'HEAD:refs/heads/'+os.environ['PRIVATE_BRANCH']]
              ):
                  p=subprocess.run(command,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if p.returncode:raise RuntimeError('PRIVATE_SOURCE_QA_CHECKPOINT_GIT_FAILED:'+gid)
              print('IGP_ORIGINAL_GAME_QA_DURABLY_COMMITTED',gid,flush=True)
              shutil.rmtree(folder)
          PY
          test ! -e "$QA_DIR/eight_game_native_xyz_index.json"
          python3 gamepulse/fusion/igp_original_sdk_eight_qa_aggregate_2026.py \
            --root . --out "$QA_DIR/eight_game_native_xyz_index.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          idx=json.loads(Path(
              'gamepulse/fusion/qa/igp_progress_20261026/sdk_native_recovery_8/eight_game_native_xyz_index.json').read_text())
          assert idx['game_count']==8 and idx['all_original_sdk_parts_verified']==104
          assert idx['physical_possessions_certified']==0
          assert len(idx['games'])==8
          a=idx['totals']
          assert a['unique_observed_native_timestamps']>0
          assert a['original_direct_ball_xyz_frames']>0
          assert a['raw_exact_ten_plus_ball_frames']>0
          print('IGP_EIGHT_FULL_GAME_ORIGINAL_XYZ_ACCEPTANCE_PASSED',
                'games=8 parts=104 source_native_frames='+str(a['unique_observed_native_timestamps']),
                'ball_frames='+str(a['original_direct_ball_xyz_frames']),
                'raw_ten_ball='+str(a['raw_exact_ten_plus_ball_frames']),
                'NBA_clock_certified=NO physical_possessions_certified=0')
          PY
      - name: Publish seven game audits and eight-game source hash index to private PR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$QA_DIR/eight_game_native_xyz_index.json"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -q -m "data(igp): index eight independently checkpointed 13-part original SDK native XYZ game receipts"
          git fetch -q origin "$PRIVATE_BRANCH"
          git rebase "origin/$PRIVATE_BRANCH"
          git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
          echo IGP_EIGHT_ORIGINAL_SDK_NATIVE_XYZ_INVENTORIES_COMMITTED
