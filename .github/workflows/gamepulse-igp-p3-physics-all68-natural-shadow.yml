name: IGP P3 original NBA all68 natural bounded physics ball candidate audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-physics-all68-natural-shadow.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-physics-all68-natural-shadow
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: f8ab936350a2e5566aeefe76420fe73168374468
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner, pin original NBA SDK and PBP private SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Compare v2 ball physics support against exact 68-game natural 10Hz denominator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_physics_all68_natural_shadow_census_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_physics_all68_natural_shadow_census_v1.py --root . --output "$RUNNER_TEMP/natural-physics-private.json" > "$RUNNER_TEMP/natural-physics-private.log" 2>&1; then
            echo P3_NBA_68_PHYSICS_SOURCE_ELIGIBILITY_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'natural-physics-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('P3_NATURAL_PHYSICS_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:75])
          print('P3_NATURAL_PHYSICS_GAMES_FINISHED',sum(x.startswith('P3_PHYSICS_NATURAL_68_GAME') for x in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'natural-physics-private.json').read_text())
          t=j['totals']
          assert len(j['games'])==68 and len(j['per_game'])==68
          assert (t['live_samples'],t['missing_canonical_ball'])==(1106941,83286)
          assert t['both_source_bracket_within_1200']==41401
          assert t['60ft_speed_source_eligible']==41121
          assert t['ten_plus_ball_shadow_candidate']==37806
          assert t['bounded_xy_hermite_source_eligible']<=41121
          assert t['ten_plus_ball_bounded_hermite_candidate']<=37806
          assert j['frozen_research_1200ms_native_complete']==492617
          assert j['frozen_research_1200ms_grid_complete']==917686
          assert j['original_XYZ_PBP_official_ten_unmodified']
          assert j['newly_accepted_complete_scenes']==0
          print('IGP_P3_ORIGINAL_NBA_68_FASTBALL_SOURCE_SUPPORT',json.dumps({
             'native_original_complete_unchanged':492617,
             'grid_original_complete_unchanged':917686,
             'ball_missing':83286,
             'fast_ball_linear_candidates':41121,
             'fast_ball_full_scene_candidates':37806,
             'bounded_velocity_ball_candidates':t['bounded_xy_hermite_source_eligible'],
             'bounded_velocity_full_scene_candidates':t['ten_plus_ball_bounded_hermite_candidate'],
             'source_bracket_bins':{k:v for k,v in t.items() if k.startswith('candidate_bracket_')},
             'new_accepted_tracking':0},sort_keys=True))
          PY
      - name: Save original source QA and exact per-game support in PRIVATE repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_physics_all68_natural_shadow_census_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-natural-physics "origin/$BRANCH"
          cp "$RUNNER_TEMP/natural-physics-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original 68 NBA PBP live source 10Hz full 11 ball physics candidate support'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_NBA_68_NATURAL_PHYSICS_SOURCE_QA_ACCEPTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
