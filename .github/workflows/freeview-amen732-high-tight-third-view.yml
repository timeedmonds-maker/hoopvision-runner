name: Amen 732 third native High Tight exact PTS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-high-tight-third-view.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: amen732-third-source-original-hightight
  cancel-in-progress: false
jobs:
  third-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Reviewed public CPU workflow; pull only private text sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          git clone --quiet --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo AMEN732_THIRD_SOURCE_PRIVATE_GIT_ACCESS_PASS
      - name: Retrieve exact native third camera or fail without altering frozen evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video"
          remain="$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo 0)"
          echo "AMEN732_THIRD_PRIVATE_RELEASE_CORE_QUOTA=$remain"
          if [ "$remain" -lt 6 ]; then
            echo AMEN732_THIRD_VIDEO_RATE_LIMIT_BLOCKED_BEFORE_SOURCE_TRANSFER
            exit 43
          fi
          gh release download freeview-native-0022600009-732 \
            -R "$PRIVATE" --pattern 0022600009-e732-high-tight.mp4 \
            --dir "$RUNNER_TEMP/video"
          test "$(sha256sum "$RUNNER_TEMP/video/0022600009-e732-high-tight.mp4" | cut -d' ' -f1)" = \
            136181dda85021be85caac36115f3dc2e97481fbd5fd90d29cf547274fd5eab5
          echo AMEN732_ORIGINAL_HIGH_TIGHT_SHA256_PASS
      - name: Independent source-native High Tight third-camera frames and exact PTS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            numpy==1.26.4 opencv-python-headless==4.10.0.84
          cd "$RUNNER_TEMP/source"
          export PYTHONPATH="$PWD/hoopvision/freeview"
          python3 hoopvision/freeview/amen732_high_tight_original_third_view.py --selftest
          python3 hoopvision/freeview/amen732_high_tight_original_third_view.py \
            --video "$RUNNER_TEMP/video/0022600009-e732-high-tight.mp4" \
            --sam hoopvision/freeview/fixtures/amen732_23source_sam21_ball_masks_20261026.json \
            --out hoopvision/freeview/fixtures/amen732_high_tight_original_third_native_QA_20261026.json \
            --uhd-jpeg hoopvision/freeview/fixtures/amen732_high_tight_original_contact_3840x2160.jpg
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("hoopvision/freeview/fixtures/amen732_high_tight_original_third_native_QA_20261026.json").read_text())
          assert j["source_original_frame_PTS_from_ffprobe"]
          assert j["source_support_UHD_contact_sheet"]==[3840,2160]
          assert not j["same_world_time_three_view_certified"]
          assert not j["first_touch_source_frame_certified"]
          print("AMEN732_THIRD_REAL_ORIGINAL_SOURCE_AGGREGATES",j["qa_counts"])
          print("AMEN732_THIRD_SOURCE_TURN_FRAME_HYPOTHESIS",j["closest_provisional_high_tight_frame_to_turn"],
                j["closest_provisional_high_tight_frame_residual_ms"])
          PY
      - name: Private-branch report and UHD source RGB QA only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          git config user.name 'HoopVision original source CPU'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_high_tight_original_third_native_QA_20261026.json \
            hoopvision/freeview/fixtures/amen732_high_tight_original_contact_3840x2160.jpg
          git diff --cached --check
          git commit -qm 'qa(freeview): original High Tight third camera SHA PTS source mask and 4K contact sheet'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_THIRD_ORIGINAL_SOURCE_AND_UHD_PRIVATE_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
