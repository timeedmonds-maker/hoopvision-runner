name: IPPT private-only 36-game ALL NBA PBP native XY SQLite SHA asset publish and readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-all-event-sqlite-private-release.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  publish-private-research-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: bfa7efcc496a96af9998b48f1f79c7a9bbc3e3a1
      TAG: ippt-all-pbp-native-xy-36-20261028-v1
      ASSET: ippt_all36_pbp_native_xy_20261028.sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PRIVATE repository and write-scoped token before any new release
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq '.private')" = "true"
          test "$(gh api "repos/$PRIVATE_REPO" --jq '.permissions.push')" = "true"
          if gh release view "$TAG" --repo "$PRIVATE_REPO" >/dev/null 2>&1; then
            echo "IPPT_PRIVATE_RELEASE_TAG_ALREADY_EXISTS_REFUSE_TO_OVERWRITE"
            exit 1
          fi
          echo "IPPT_PRIVATE_REPOSITORY_ONLY_RELEASE_PERMISSION_CONFIRMED"
      - name: Private original SHA source read-only
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Build and verify all 22,314 official event rows and licensed NBA original XY locally
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -q gamepulse/fusion/test_igp_ippt_all_pbp_event_native_sqlite_2026.py
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_event_native_sqlite_2026.py \
            --root . --out "$RUNNER_TEMP/$ASSET" | tee "$RUNNER_TEMP/ippt_private_sqlite_publish_build.log"
          python3 - <<'PY'
          import os,sqlite3,hashlib
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/os.environ["ASSET"]
          with sqlite3.connect(p) as db:
            counts={t:db.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                for t in ("pbp_event","native_frame","original_actor")}
            assert counts=={"pbp_event":22314,"native_frame":10623,"original_actor":110839},counts
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE native_utc_ms IS NOT NULL").fetchone()[0]==21653
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          (Path(os.environ["RUNNER_TEMP"])/"ippt_sqlite_expected.sha256").write_text(digest)
          print("IPPT_PRIVATE_ALL22314_EVENT_XY_INDEX_VERIFIED_COUNTS_ONLY",counts)
          PY
      - name: Publish derived SQLite exclusively as PRIVATE GitHub release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
            --repo "$PRIVATE_REPO" --target "$EXPECTED_PRIVATE_SHA" \
            --title "Integrated Pulse all NBA PBP event-source XY research v1" \
            --prerelease \
            --notes "Private research SQLite, 36 SHA original NBA Game Pulse games, 22,314 official actions, 10,623 deduplicated source frames, 110,839 original actor/ball XYZ observations. Physical event instants NOT video-certified; all scorer-UTC windows provenance graded. Source commit $EXPECTED_PRIVATE_SHA. Does not replace canonical PR 776." \
            >/dev/null
          echo "IPPT_PRIVATE_RELEASE_CREATED_NO_PUBLIC_ORIGINAL_XYZ"
      - name: Independent private release asset readback SHA and SQLite acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ippt-private-readback"
          gh release download "$TAG" --repo "$PRIVATE_REPO" \
            --pattern "$ASSET" --dir "$RUNNER_TEMP/ippt-private-readback"
          python3 - <<'PY'
          import hashlib,os,sqlite3
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          p=root/"ippt-private-readback"/os.environ["ASSET"]
          expected=(root/"ippt_sqlite_expected.sha256").read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected,"DERIVED_PRIVATE_SQLITE_SHA_MISMATCH"
          with sqlite3.connect(p) as db:
            counts=[db.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                for t in ("pbp_event","native_frame","original_actor")]
            assert counts==[22314,10623,110839],counts
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
          print("IPPT_PRIVATE_RELEASE_SHA_SQLITE_AND_PHYSICAL_TIME_NULL_READBACK_PASS")
          PY
      - name: Delete local licensed database and publish sanitized private-release receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r={"github_run_id":os.environ["GITHUB_RUN_ID"],
             "prior_job_status":os.environ["QA_JOB_RESULT"],
             "private_repository":os.environ["PRIVATE_REPO"],
             "private_release_tag":os.environ["TAG"],
             "source_commit_SHA":os.environ["EXPECTED_PRIVATE_SHA"],
             "physical_event_utc_verified":False,
             "licensed_original_NBA_XYZ_not_published_to_public_runner":True}
          path=Path(os.environ["RUNNER_TEMP"])/"ippt_private_release_receipt.md"
          path.write_text("Only PRIVATE GitHub release may contain derived original NBA source coordinates. No public artifact.\n\n~~~json\n"+
              json.dumps(r,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -f "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/ippt-private-readback/$ASSET"
          gh issue comment 130 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_private_release_receipt.md"

# No public artifact uploading. Private repo original source unchanged. Never label PBP scorer UTC as physical action UTC.
