name: PR776 G2 36 original NBA SDK exact-ten substitution transition UTC alignment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-exact-ten-transition-UTC-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G2-original-ten-NBA-sub-UTC36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Protect public GitHub boundary and hydrate private original NBA SDK source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Unit source strict ten pre/post NBA substitution timing and abstentions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g2_source_exact_ten_substitution_transition_clock_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
             -p 'test_igp_g2_source_exact_ten_substitution_transition_clock_2026.py' -v
          echo G2_ORIGINAL_NBA_SDK_SOURCE_EXACT_TEN_TRANSITION_UNIT_PASS
      - name: SHA-verify all original 36 NBA games and timestamp NBA official substitution source ten transitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_source_exact_ten_substitution_transition_UTC_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_source_exact_ten_substitution_transition_clock_2026.py \
             --root . --out "$OUT" > "$RUNNER_TEMP/private-NBA-exact-ten-transition.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]));c=q["totals"]
          assert q["source_games"]==36
          assert c["distinct_official_substitution_UTC_with_change"]>0
          assert c["SDK_two_sided_exact_original_ten_source_frames"]>=0
          assert sum(c.get(k,0) for k in (
             "INSUFFICIENT_TWO_SIDED_EXACT_TEN_ANCHORS",
             "AMBIGUOUS_INTERLEAVED_OR_REVERSED_EXACT_SOURCE_TEN",
             "SOURCE_TEN_TRANSITION_OBSERVED_BEFORE_NBA_LOGGED_UTC",
             "SOURCE_TEN_TRANSITION_OBSERVED_AFTER_NBA_LOGGED_UTC",
             "OFFICIAL_SUB_UTC_INSIDE_SOURCE_TEN_BRACKET"))==c["distinct_official_substitution_UTC_with_change"]
          assert q["original_SDK_XYZ_used_as_authoritative_source_measurements"]
          assert not q["original_SDK_XYZ_or_NBA_official_lineups_modified"]
          assert q["source_actor_transition_offsets_not_automatically_applied"]
          assert q["private_original_player_IDs_and_XYZ_not_exported"]
          print("G2_NBA_ORIGINAL_SUBSTITUTION_SDK_TEN_TRANSITION_CLOCK_36_PASS",json.dumps({
             "games":36,"sub_events":c["distinct_official_substitution_UTC_with_change"],
             "source_exact_pre_post_anchors":c["SDK_two_sided_exact_original_ten_source_frames"],
             "official_inside_source_transition":c.get("OFFICIAL_SUB_UTC_INSIDE_SOURCE_TEN_BRACKET",0),
             "source_transition_after_logged_UTC":c.get("SOURCE_TEN_TRANSITION_OBSERVED_AFTER_NBA_LOGGED_UTC",0),
             "source_transition_before_logged_UTC":c.get("SOURCE_TEN_TRANSITION_OBSERVED_BEFORE_NBA_LOGGED_UTC",0),
             "source_ID_interleaving":c.get("AMBIGUOUS_INTERLEAVED_OR_REVERSED_EXACT_SOURCE_TEN",0),
             "insufficient_source_anchors":c.get("INSUFFICIENT_TWO_SIDED_EXACT_TEN_ANCHORS",0)
          },sort_keys=True))
          PY
      - name: Commit private-only original NBA source-clock evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_source_exact_ten_substitution_transition_UTC_36_v1.json
          git config user.name "Game Pulse NBA Original Clock QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): 36-game original NBA SDK exact ten/source time vs official PBP substitution UTC bracket audit"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_G2_NBA_ORIGINAL_SUBSTITUTION_TRANSITION_CLOCK_SHA_ACCEPTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
