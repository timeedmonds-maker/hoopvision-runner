      - name: Test official ten lineup tracker reconstruction on original Rockets and Phoenix source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_lineup_tracker_pilot_2026.py'
          OUT=gamepulse/fusion/qa/igp_progress_20261027/igp_official_ten_tracker_pilot_2_games_2026.json
          if [ ! -e "$OUT" ]; then
            python3 gamepulse/fusion/igp_tracking_pilot_run_2026.py --root . --out "$OUT"
          fi
          python3 - <<'PY'
