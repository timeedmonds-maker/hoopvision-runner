          assert qa["schema"]=="gamepulse.igp-official-PBP-actor-vs-original-native-XYZ-identity-36.v1"
          assert qa["source_games"]==36 and len(qa["games"])==36
          assert qa["counts"]["eligible_PBP_actor_events"]>5000
          assert qa["no_original_coordinates_written_to_QA"] is True
