name: PR776 physical possession native 36 continuity acceptance
# Reviewed allowlist entry in tools/public_content_guard.py; private XYZ never published.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-physical-native-36-continuity.yml']
permissions: {contents: read}
concurrency:
  group: pr776-physical-native-36-continuity
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public content and fetch canonical private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/private-git-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/private-git-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/private-git-askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Execute 36-game source-derived handler team possession changes and persist private QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ball_handler_team_transitions_2026.py gamepulse/fusion/igp_automatic_possession_boundary_fusion_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p test_igp_ball_handler_team_transitions_2026.py
          ACCEPTED=gamepulse/fusion/qa/igp_progress_20261027/igp_handler_team_all36_source_qa.json
          if [ -e "$ACCEPTED" ]; then
            python3 - "$ACCEPTED" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["schema"]=="gamepulse.igp-original-handler-team-source36-qa.v1"
          assert x["source_games"]==36 and len(x["games"])==36
          assert x["total"]["original_native_frames"]==1203986
          assert x["total"]["NBA_candidate_chains"]==7199
          assert x["independently_certified_physical_possessions"]==0
          print("IGP_EXISTING_36_SPATIAL_ACCEPTANCE_REUSED")
          PY
            exit 0
          fi
          python3 gamepulse/fusion/igp_automatic_possession_boundary_fusion_2026.py \
            --root . --game-ids all --team-control-changes \
            --out "$RUNNER_TEMP/igp-handler-all36.json"
          python3 - <<'PY'
          import collections,json
          from pathlib import Path
          source=json.loads((Path(__import__('os').environ['RUNNER_TEMP'])/'igp-handler-all36.json').read_bytes())
          assert source["game_count"]==36 and len(source["games"])==36
          aggregate=collections.Counter()
          games={}
          for gid,game in sorted(source["games"].items()):
              result=game["ball_handler_team_control_changes"]
              assert result["physical_possessions_certified"]==0
              assert result["source_native_touch_events"]==game["tracking_touch_source_episodes"]
              assert result["counts"]["source_touch_candidates"]==result["source_native_touch_events"]
              assert result["counts"].get("opponent_control_change_candidates",0)==sum(
                  e["type"]=="OPPONENT_CONTROL_CHANGE_CANDIDATE" for e in result["events"])
              assert all(e.get("physical_control_verified") is False for e in result["events"])
              aggregate.update(result["counts"])
              aggregate["original_native_frames"]+=game["source_native_frames_read_exactly_once"]
              aggregate["NBA_candidate_chains"]+=game["nba_candidate_chains"]
              for key,count in game["NBA_official_chain_terminal_reason_counts"].items():
                  aggregate["NBA_terminal_"+key]+=count
              games[gid]={"source_sha256":game["source_sha256"],
                          "NBA_terminal_counts":game["NBA_official_chain_terminal_reason_counts"],
                          "NBA_candidate_chains":game["nba_candidate_chains"],
                          "native_frame_count":game["source_native_frames_read_exactly_once"],
                          "candidate_control_changes":result}
          assert aggregate["original_native_frames"]==1203986
          assert aggregate["NBA_candidate_chains"]==7199
          receipt={"schema":"gamepulse.igp-original-handler-team-source36-qa.v1",
                   "source_games":36,"total":dict(sorted(aggregate.items())),"games":games,
                   "source_frames_unchanged":True,"PBP_logged_time_not_physical_time":True,
                   "independently_certified_physical_possessions":0}
          out=Path("gamepulse/fusion/qa/igp_progress_20261027/igp_handler_team_all36_source_qa.json")
          if out.exists(): assert json.loads(out.read_text())==receipt
          else: out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          safe={key:aggregate.get(key,0) for key in (
              "original_native_frames","NBA_candidate_chains","source_touch_candidates",
              "opponent_control_change_candidates","class_DEFENSIVE_REBOUND",
              "class_LIVE_STEAL","class_UNCLASSIFIED_OPPONENT_GAIN",
              "class_POST_SCORE_NEW_TEAM_CONTROL_RESTART",
              "same_team_contact_continuations","unusable_contact_evidence")}
          print("PR776_HANDLER_TEAM_36_SOURCE_ACCEPTED",
                json.dumps({"source_games":36,"counts":safe,
                            "physical_possessions_certified":0},sort_keys=True))
          PY
          OUT=gamepulse/fusion/qa/igp_progress_20261027/igp_handler_team_all36_source_qa.json
          git config user.name 'Game Pulse Free CPU Runner'
          git config user.email 'gamepulse-runner@users.noreply.github.com'
          git add -f "$OUT"
          if git diff --cached --quiet; then
            echo IGP_EXISTING_SPATIAL_QA_UNCHANGED
            exit 0
          fi
          git diff --cached --check
          git commit -qm "qa(igp): execute original ball-handler team changes across 36 NBA games"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo PR776_36_GAME_HANDLER_CHANGE_PRIVATE_QA_SAVED
              break
            fi
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            sleep "$attempt"
          done
      - name: Reconcile native lastTouch team labels with all 36 original PBP and spatial QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_native_lasttouch_team_reconciliation_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_native_lasttouch_team_reconciliation_2026.py'
          OUT=gamepulse/fusion/qa/igp_progress_20261027/igp_native_lasttouch_team_36_source_qa.json
          if [ ! -e "$OUT" ]; then
            python3 gamepulse/fusion/igp_native_lasttouch_team_reconciliation_2026.py \
              --root . --out "$OUT"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261027/igp_native_lasttouch_team_36_source_qa.json")
          q=json.loads(p.read_bytes())
          assert q["schema"]=="gamepulse.igp-native-lasttouch-team-evidence-v1"
          assert q["source_games"]==36 and len(q["games"])==36
          assert q["physical_possessions_certified"]==0
          a=q["aggregate"]
          assert a["games"]==36
          assert a["candidate_native_team_switches"]==sum(
              len(g["candidate_changes"]) for g in q["games"].values())
          assert a["distinct_native_touch_start_times"]>=a["unique_fresh_native_player_states"]
          print("IGP_NATIVE_LASTTOUCH_36_PRIVATE_SOURCE_ACCEPTED",
                json.dumps({"source_games":36,"aggregate":a,
                            "physical_possessions_certified":0},sort_keys=True))
          PY
          git config user.name 'Game Pulse Free CPU Runner'
          git config user.email 'gamepulse-runner@users.noreply.github.com'
          git add -f "$OUT"
          if git diff --cached --quiet; then
            echo IGP_NATIVE_LASTTOUCH_ACCEPTED_EXISTING
          else
            git diff --cached --check
            git commit -qm "qa(igp): original lastTouch player-team 36-game PBP and XYZ reconciliation"
            for attempt in 1 2 3 4 5 6 7 8; do
              if git push -q origin "HEAD:refs/heads/$B"; then
                echo IGP_NATIVE_LASTTOUCH_36_PRIVATE_PUBLISHED
                break
              fi
              git fetch -q origin "$B"
              git rebase -q "origin/$B"
              sleep "$attempt"
            done
          fi
      - name: Accept PBP-first logical possession identity in the existing canonical tracking query
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_possession_tracking_with_control_brackets_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_query_igp_possession_tracking_with_control_brackets_2026.py'
          python3 - <<'PY'
          import json,collections
          from pathlib import Path
          from query_igp_possession_tracking_with_control_brackets_2026 import query
          from universal_possession_alignment_2026 import event_chain
          from query_igp_wallclock_season_frame_index_2026 import load
          base=Path("gamepulse/fusion")
          games=["0022600001","0022600009","0022600099"]
          cases=[(games[0],games[0]+"-P1-C0006"),
                 (games[1],games[1]+"-P1-C0003"),
                 (games[2],games[2]+"-P3-C0129")]
          checked=[]
          for gid,cid in cases:
              r=query(Path("."),gid,cid)
              logical=r["official_NBA_logical_possession"]
              assert logical["chain_id"]==cid
              assert logical["offense_team"]==r["NBA_offense_team"]
              assert set(r["NBA_source_actions"]).issubset(set(logical["official_action_ids"]))
              assert logical["recorded_event_chain_not_certified_physical_custody"]
              assert not logical["reconstructed_from_contact_proximity"]
              assert r["candidate_tracking_counts"]["unique_NBA_logged_frames"]>0
              checked.append({"game":gid,"chain":cid,
                  "points":logical["official_points"],
                  "official_terminal_reason":logical["official_terminal_reason"],
                  "native_source_frames":r["candidate_tracking_counts"]["unique_NBA_logged_frames"]})
          idx,_=load(Path("."),base/"materialized/igp_official_realworld_utc_36_v1/index.json")
          assert len(idx["games"])==36
          total=0
          for gid in sorted(idx["games"]):
              pbp,_=load(Path("."),base/"official_pbp_timing/games"/(gid+".json"))
              e=event_chain(pbp)
              assert e["chain_count"]==len(e["chains"])>0
              total+=e["chain_count"]
          assert total==7474,("UNEXPECTED_OFFICIAL_LOGICAL_CHAIN_DENOMINATOR",total)
          print("PBP_FIRST_EXISTING_POSSESSION_AND_TRACKING_QUERY_REAL_SOURCE_ACCEPTED",
                json.dumps({"real_games_checked":len(games),
                            "source_games_with_ordered_logical_possessions":36,
                            "official_event_chains":total,
                            "three_real_tracking_queries":checked,
                            "physical_possessions_certified":0},sort_keys=True))
          PY
      - name: Test canonical NBA possession query with original native lastTouch evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_native_lasttouch_chain_projection_2026.py gamepulse/fusion/query_igp_possession_tracking_with_control_brackets_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_native_lasttouch_chain_projection_2026.py'
          python3 - <<'PY'
          from pathlib import Path
          from query_igp_possession_tracking_with_control_brackets_2026 import query
          tests=[("0022600001","0022600001-P4-C0168"),
                 ("0022600099","0022600099-P3-C0129"),
                 ("0022600009","0022600009-P1-C0003")]
          checked=[]
          for gid,cid in tests:
              out=query(Path("."),gid,cid,native_lasttouch=True)
              native=out["native_lasttouch_team_transition_candidates"]
              assert native["source_game_id"]==gid and native["NBA_chain_id"]==cid
              assert native["physical_possessions_certified"]==0
              assert all(x["physical_possession_edge_verified"] is False
                         for x in native["source_native_candidate_switches"])
              assert "original_native_lasttouch_team_QA" in out["source_SHA256"]
              checked.append({"game":gid,"chain_id":cid,
                              "original_native_candidates":native["candidate_count"],
                              "official_actions":len(out["NBA_source_actions"])})
          print("IGP_THREE_REAL_SOURCE_CANONICAL_QUERY_NATIVE_LASTTOUCH_ACCEPTED",
                __import__('json').dumps(checked,sort_keys=True))
          PY
      - name: Accept joint native lastTouch, official PBP and XYZ evidence tiers across all 36
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_native_lasttouch_joint_edge_acceptance_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_igp_native_lasttouch_joint_edge_acceptance_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261027/igp_native_lasttouch_joint_edge_36_acceptance.json
          python3 gamepulse/fusion/igp_native_lasttouch_joint_edge_acceptance_2026.py --root . --out "$OUT"
          git config user.name 'Game Pulse Free CPU Runner'
          git config user.email 'gamepulse-runner@users.noreply.github.com'
          git add -f "$OUT"
          if git diff --cached --quiet; then
            echo IGP_JOINT_NATIVE_36_ALREADY_ACCEPTED
            exit 0
          fi
          git diff --cached --check
          git commit -qm "qa(igp): source-accept native PBP XYZ joint control candidate tiers"
          for n in 1 2 3 4 5 6 7 8; do
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_36_JOINT_NATIVE_PBP_XYZ_PRIVATE_ACCEPTED
              exit 0
            fi
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            sleep "$n"
          done
          exit 15
      - name: Test and run actual 36-game full original XYZ continuity audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_native_fullgame_continuity_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_native_fullgame_continuity_2026.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_physical_pilot_postscore_guard_2026.py'
          OUT=gamepulse/fusion/qa/igp_progress_20261026/native_fullgame_continuity_36_v1.json
          if [ ! -e "$OUT" ]; then
            python3 gamepulse/fusion/igp_native_fullgame_continuity_2026.py --root . --out "$OUT"
          fi
          POST=gamepulse/fusion/qa/igp_progress_20261026/physical_possession_postscore_negative_gate_v1.json
          if [ ! -e "$POST" ]; then
            python3 gamepulse/fusion/igp_physical_pilot_postscore_guard_2026.py --root . --out "$POST"
          fi
          python3 - "$OUT" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]));c=j['source_counts']
          assert j['game_count']==36
          assert c['original_native_timestamps']==1203986
          assert c['direct_ten_plus_ball_timestamps']==387956
          assert j['physical_possessions_certified']==0
          assert all(x['whole_physical_possessions_certified']==0 for x in j['games'].values())
          print('IGP_36_NATIVE_REAL_SOURCE_CONTINUITY_QA_ACCEPTED',json.dumps({
              'games':36,'native_frames':c['original_native_timestamps'],
              'ball_direct_frames':c['direct_ball_xyz_timestamps'],
              'ten_ball_direct_frames':c['direct_ten_plus_ball_timestamps'],
              'ball_native_runs_ge10s':c.get('ball_runs_ge_10s',0),
              'ten_ball_native_runs_ge10s':c.get('ten_plus_ball_runs_ge_10s',0),
              'physical_possessions_certified':0},sort_keys=True))
          PY
          python3 - "$POST" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['physical_possessions_certified']==0
          assert j['pilot_episode_count']>=12
          checks={x['source_episode_id']:x for x in j['records']}
          for eid in ('0022600008-P2-NBAF0061','0022600001-P4-NBAF0164','0022600103-P3-NBAF0125'):
              assert checks[eid]['assignment_gate']=='POST_TERMINAL_NATIVE_WINDOW_REJECT_SCORE_TEAM_POSSESSION_ASSUMPTION',eid
          print('IGP_PILOT_SOURCE_EPISODE_POSTSCORE_OWNERSHIP_NEGATIVE_ACCEPTED',
                {'source_episodes':j['pilot_episode_count'],
                 'mandatory_postscore_negative_cases':3,
                 'physical_possessions_certified':0})
          PY
      - name: Persist accepted aggregate QA only into private 104 PR776
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261026/native_fullgame_continuity_36_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT" gamepulse/fusion/qa/igp_progress_20261026/physical_possession_postscore_negative_gate_v1.json
          if git diff --cached --quiet; then
            echo ALREADY_ACCEPTED_HISTORICAL_CONTINUITY
            exit 0
          fi
          git diff --cached --check
          git commit -q -m "data(igp): accept full 36 native continuity and postscore ownership negative gates"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_36_FULL_GAME_NATIVE_CONTINUITY_PRIVATE_PUBLISHED
              exit 0
            fi
            sleep "$i"
          done
          exit 12
