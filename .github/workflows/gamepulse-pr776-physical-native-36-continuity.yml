          PY
          git config user.name 'Game Pulse Free CPU Runner'
          git config user.email 'gamepulse-runner@users.noreply.github.com'
          git add -f "$OUT"
          if git diff --cached --quiet; then
            echo IGP_ORIGINAL_ACTOR_ID_QA_ALREADY_PUBLISHED
          else
            git diff --cached --check
            git commit -qm "qa(igp): check PBP actor ID versus direct original SDK XYZ 36-game source"
            published=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if git push -q origin "HEAD:refs/heads/$B"; then
                published=1;break
              fi
              git fetch -q origin "$B"
              git rebase -q "origin/$B"
