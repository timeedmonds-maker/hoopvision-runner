          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_player_id_integrity_view_2026.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_official_ten_source_view_2026.py'
