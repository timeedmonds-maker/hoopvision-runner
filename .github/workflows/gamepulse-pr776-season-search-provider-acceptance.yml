name: Integrated Pulse 28-game season search and real NBA provider acceptance
# Public CPU only. Private game, tracking and provider JSON stays in ephemeral storage.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-season-search-provider-acceptance.yml'
permissions:
  contents: read
jobs:
  nba-season-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PIN: ab54bd722c80c8f92d922cc318fd2ac627d31faa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch source-pinned private indices, scripts and original NBA provider games
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_TOKEN_NOT_CONFIGURED'; exit 3; }
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          ROOT="$RUNNER_TEMP/pulse-private"
          mkdir -p "$ROOT"
          echo "PULSE_ROOT=$ROOT" >> "$GITHUB_ENV"
          get_private () {
            local path="$1"
            mkdir -p "$(dirname "$ROOT/$path")"
            gh api "repos/$PRIVATE_REPO/contents/$path?ref=$PIN" --jq .content |
              base64 --decode > "$ROOT/$path"
            test -s "$ROOT/$path" || exit 4
          }
          for f in \
            gamepulse/fusion/query_nba_episode_season_2026.py \
            gamepulse/fusion/query_nba_episode_tracking_2026.py \
            gamepulse/fusion/nba_provider_onoff_source_2026.py \
            gamepulse/fusion/official_nba_advanced_ratings_2026.py \
            gamepulse/fusion/tests/test_query_nba_episode_season_2026.py \
            gamepulse/fusion/tests/test_nba_provider_onoff_source_2026.py \
            gamepulse/fusion/tests/test_query_nba_episode_tracking_2026.py \
            gamepulse/fusion/tests/test_query_nba_episode_tracking_index_2026.py \
            gamepulse/fusion/tests/test_nba_possession_tracking_crosswalk_2026.py \
            gamepulse/fusion/nba_possession_tracking_crosswalk_2026.py \
            gamepulse/fusion/onoff/index-2026-27-expanded.json \
            gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/index.json; do
            get_private "$f"
          done
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          p=root/'gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/index.json'
          o=root/'gamepulse/fusion/onoff/index-2026-27-expanded.json'
          index=json.loads(p.read_bytes());prov=json.loads(o.read_bytes())
          assert index['schema']=='gamepulse.nba-source-episode-tracking-season-index.v1'
          assert prov['schema']=='gamepulse.official-nba-onoff-tracking-reconciled.v1'
          assert len(index['games'])==28 and len(prov['games'])==27
          assert set(prov['games']) <= set(index['games'])
          paths=[
              'gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/'+g+'.json'
              for g in sorted(index['games'])
          ] + [prov['games'][g]['path'] for g in sorted(prov['games'])]
          (root/'files-to-fetch.txt').write_text('\n'.join(paths)+'\n')
          print('PRIVATE_SOURCE_MANIFESTS_FOUND',len(index['games']),len(prov['games']))
          PY
          while IFS= read -r path; do
            get_private "$path"
          done < "$ROOT/files-to-fetch.txt"
          echo 'ORIGINAL_PRIVATE_SOURCE_FETCH_COMPLETE'
      - name: Run Python acceptance and all 27 real NBA provider snapshots
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          export PYTHONPATH="$PULSE_ROOT/gamepulse/fusion:$PULSE_ROOT/gamepulse/fusion/tests"
          python3 -m compileall -q "$PULSE_ROOT/gamepulse/fusion"
          for pattern in \
            test_query_nba_episode_season_2026.py \
            test_nba_provider_onoff_source_2026.py \
            test_query_nba_episode_tracking_2026.py \
            test_query_nba_episode_tracking_index_2026.py; do
            python3 -m unittest discover \
              -s "$PULSE_ROOT/gamepulse/fusion/tests" -p "$pattern" -v
          done
          python3 - "$PULSE_ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          from query_nba_episode_tracking_2026 import read_indexed_view
          from nba_provider_onoff_source_2026 import load, INDEX
          from query_nba_episode_season_2026 import search
          root=Path(sys.argv[1])
          snap=root/'gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025'
          index=json.loads((snap/'index.json').read_bytes())
          onoff=json.loads((root/INDEX).read_bytes())
          totals={'episodes':0,'linked':0,'unassigned':0,'labels':0}
          for gid in index['games']:
              view=read_indexed_view(snap,gid)
              totals['episodes']+=len(view['episodes'])
              totals['linked']+=view['source_action_run_touch_labels_reused']
              totals['unassigned']+=view['original_unassigned_touch_labels_retained']
              totals['labels']+=view['original_source_touch_labels_preserved']
          assert totals=={'episodes':5819,'linked':12557,'unassigned':11553,'labels':24110}
          verified=0
          for gid,rec in sorted(onoff['games'].items()):
              doc=json.loads((root/rec['path']).read_bytes())
              rows=doc['player_onoff']
              assert len(rows)==rec['player_onoff_verified']
              for player in rows:
                  accepted=load(root,gid,player['player_id'],player['team'],
                                allow_missing_player=True)
                  assert accepted['status']=='VERIFIED_NBA_GAME_SCOPED_ONOFF_SNAPSHOT'
                  assert accepted['rates']['net_rating_on'] is not None
                  assert accepted['not_derived_from_tracking']
                  verified+=1
          assert verified==sum(rec['player_onoff_verified']
                               for rec in onoff['games'].values())
          assert verified==623, 'ORIGINAL_PROVIDER_PLAYER_ROW_COUNT_CHANGED'
          q=search(snap,team='HOU',player_id='1627832',provider_root=root,limit=20)
          assert q['captured_games_in_snapshot']==28
          assert q['games_in_requested_scope']>0
          assert q['official_provider']['source_provider_games_with_verified_player_rows']>=1
          assert q['official_provider']['season_aggregate_onoff_rate'] is None
          assert q['independently_certified_physical_possessions']==0
          assert len(q['episodes'])<=20
          print('PRIVATE_28_GAME_CROSS_GAME_SEARCH_ACCEPTED',
                'game_scope',q['games_in_requested_scope'],
                'native_episode_matches',q['matching_nba_source_field_episodes'],
                'observed_focal_labels',q['observed_focal_original_touch_labels'],
                'verified_provider_game_rows',q['official_provider']['source_provider_games_with_verified_player_rows'])
          print('PRIVATE_27_GAME_PROVIDER_ONOFF_ACCEPTED',
                'games',len(onoff['games']),'verified_rows',verified,
                'snapshots_sha_checked',28,'source_episodes',totals['episodes'])
          PY
          echo 'SEASON_SEARCH_AND_PROVIDER_ACCEPTANCE_PASSED'

      - name: Verify 28 original PBP ending-event windows and source-native tracking partitions
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PULSE_ROOT"
          get_private () {
            local path="$1"
            mkdir -p "$(dirname "$ROOT/$path")"
            gh api "repos/$PRIVATE_REPO/contents/$path?ref=$PIN" --jq .content |
              base64 --decode > "$ROOT/$path"
            test -s "$ROOT/$path"
          }
          for f in \
            gamepulse/fusion/universal_possession_alignment_2026.py \
            gamepulse/fusion/build_terminal_window_recovery_v2_2026.py \
            gamepulse/fusion/query_terminal_window_recovery_2026.py \
            gamepulse/fusion/tests/test_universal_possession_alignment_2026.py \
            gamepulse/fusion/tests/test_terminal_window_source_2026.py \
            gamepulse/fusion/index/unassigned_native_labels/index-2026-27.json \
            gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json; do
              get_private "$f"
          done
          export PYTHONPATH="$ROOT/gamepulse/fusion:$ROOT/gamepulse/fusion/tests"
          python3 -m py_compile "$ROOT/gamepulse/fusion/build_terminal_window_recovery_v2_2026.py"
          python3 -m unittest discover -s "$ROOT/gamepulse/fusion/tests" \
            -p 'test_terminal_window_source_2026.py' -v
          python3 - "$ROOT" <<'PY'
          import base64,collections,hashlib,json,subprocess,sys
          from pathlib import Path
          from build_terminal_window_recovery_v2_2026 import build
          root=Path(sys.argv[1]);base=root/'gamepulse/fusion'
          snapshot=json.loads((base/'materialized/nba_episode_tracking_pr776_20261025/index.json').read_bytes())
          unassigned_index=json.loads((base/'index/unassigned_native_labels/index-2026-27.json').read_bytes())
          pbp_index=json.loads((base/'official_pbp_timing/index-2026-27-expanded.json').read_bytes())
          ids=sorted(snapshot['games'])
          assert len(ids)==28 and set(ids)==set(unassigned_index['games'])==set(pbp_index['games'])
          def fetch_private(path):
              args=['gh','api','repos/timeedmonds-maker/104/contents/'+path+'?ref=ab54bd722c80c8f92d922cc318fd2ac627d31faa','--jq','.content']
              reply=subprocess.run(args,capture_output=True,text=True,timeout=90,check=True)
              return base64.b64decode(reply.stdout)
          totals=collections.Counter()
          out=root/'terminal_window_candidate_output'
          out.mkdir(exist_ok=False)
          game_manifest={}
          for gid in ids:
              snap=snapshot['games'][gid]
              ua=unassigned_index['games'][gid]
              pi=pbp_index['games'][gid]
              raw_s=(base/'materialized/nba_episode_tracking_pr776_20261025'/snap['path']).read_bytes()
              raw_u=fetch_private(ua['path'])
              raw_p=fetch_private(pi['source_file'])
              assert hashlib.sha256(raw_s).hexdigest()==snap['sha256']
              assert hashlib.sha256(raw_u).hexdigest()==ua['sha256']
              assert hashlib.sha256(raw_p).hexdigest()==snap['source_hashes']['pbp']
              s=json.loads(raw_s);u=json.loads(raw_u);p=json.loads(raw_p)
              assert p['source_provenance']['nba_pbp_sha256']==pi['source_pbp_sha256']
              result=build(p,s,u)
              raw_result=(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n').encode()
              (out/(gid+'.json')).write_bytes(raw_result)
              game_manifest[gid]={'sha256':hashlib.sha256(raw_result).hexdigest(),
                  'original_touch_labels':snap['original_touch_labels'],
                  'source_nba_pbp_sha256':pi['source_pbp_sha256'],
                  'source_crosswalk_sha256':snap['sha256'],
                  'source_unassigned_sha256':ua['sha256']}
              assert result['original_native_touch_labels_preserved']==snap['original_touch_labels']
              assert result['previously_linked_unique_terminal_candidates']+result['previously_linked_unresolved']==snap['reused_touch_labels']
              assert result['originally_unassigned']==snap['unassigned_touch_labels']
              assert result['new_certified_native_touch_memberships']==0
              for key in ['terminal_window_count','original_native_touch_labels_preserved','previously_linked_unique_terminal_candidates','previously_linked_unresolved','originally_unassigned','new_research_only_source_utc_window_candidates']:
                  totals[key]+=result[key]
              totals['linked_time_candidate_agrees']+=result['qa_counts'].get('linked_utc_candidate_agrees_with_existing_chain',0)
              totals['linked_time_candidate_disagrees']+=result['qa_counts'].get('linked_utc_candidate_disagrees_with_existing_chain',0)
              totals['linked_time_candidate_unmatched']+=result['qa_counts'].get('linked_utc_candidate_not_unique',0)
              if gid=='0022600009':
                  import copy
                  altered=copy.deepcopy(u)
                  altered['unassigned_touches'][0]['player_id']='POISONED_SOURCE_PLAYER'
                  try:build(p,s,altered)
                  except ValueError as exc:
                      assert 'UNASSIGNED_ORIGINAL_IDENTITY_CONFLICT' in str(exc)
                  else:raise AssertionError('SOURCE_ID_CORRUPTION_ACCEPTED')
          assert totals['original_native_touch_labels_preserved']==24110
          assert totals['terminal_window_count']==5781
          assert totals['originally_unassigned']==11553
          assert totals['previously_linked_unique_terminal_candidates']+totals['previously_linked_unresolved']==12557
          index={'schema':'gamepulse.terminal-window-original-native-28game-index.v1',
              'source_private_branch_sha':'ab54bd722c80c8f92d922cc318fd2ac627d31faa',
              'original_games':28,'games':game_manifest,
              'totals':dict(sorted(totals.items())),
              'new_verified_native_touch_assignments':0,
              'new_native_xyz_observations_processed':0,
              'nba_record_utc_cannot_certify_physical_boundary':True,
              'research_candidates_do_not_count_as_accepted_physical_possessions':True}
          (out/'index.json').write_text(json.dumps(index,sort_keys=True,indent=2)+'\n')
          from query_terminal_window_recovery_2026 import query
          example=query(out,gid='0022600009',player='1627832',limit=25)
          assert example['matches_total']>=1
          assert example['new_certified_tracking_possession_memberships']==0
          print('PRIVATE_TERMINAL_WINDOW_SEARCH_SMOKE_PASSED',
                example['game_id'],example['matches_total'])
          print('REAL_28_GAME_TERMINAL_WINDOW_SOURCE_AUDIT',json.dumps(dict(sorted(totals.items())),sort_keys=True))
          print('POSSESSION_ENDING_EVENT_28_GAME_QA_PASSED')
          PY

      - name: Publish 29 source-graded NBA terminal tracking views to private PR atomically
        shell: bash
        run: |
          set -euo pipefail
          export OUT_DIR="$PULSE_ROOT/terminal_window_candidate_output"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          repo=os.environ['PRIVATE_REPO']
          pin=os.environ['PIN']
          branch='research/gamepulse-clock-boundary-integrity-20261025'
          root=Path(os.environ['OUT_DIR'])
          files=sorted(root.glob('*.json'))
          assert len(files)==29,'EXPECTED_28_GAMES_PLUS_INDEX'
          def gh(path,method='GET',body=None):
              cmd=['gh','api',f'repos/{repo}/{path}']
              if method!='GET':cmd+=['-X',method,'--input','-']
              output=subprocess.run(cmd,
                  input=json.dumps(body) if body is not None else None,
                  capture_output=True,text=True,timeout=110)
              if output.returncode:
                  raise RuntimeError('PRIVATE_GITHUB_WRITE_FAILED:'+path+':'+output.stderr[-300:])
              return json.loads(output.stdout)
          ref='git/ref/heads/'+branch
          assert gh(ref)['object']['sha']==pin,'PR_BRANCH_HEAD_MOVED'
          base_tree=gh('git/commits/'+pin)['tree']['sha']
          prefix='gamepulse/fusion/materialized/terminal_window_recovery_pr776_20261025/'
          entries=[]
          for path in files:
              raw=path.read_bytes()
              blob=gh('git/blobs','POST',
                  {'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              correct_sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
              assert blob['sha']==correct_sha,'BLOB_SOURCE_INTEGRITY_FAILED'
              entries.append({'path':prefix+path.name,
                  'mode':'100644','type':'blob','sha':blob['sha']})
          tree=gh('git/trees','POST',{'base_tree':base_tree,'tree':entries})
          new=gh('git/commits','POST',{
              'message':'data(gamepulse): 28 NBA terminal windows with original native touch evidence and provenance',
              'tree':tree['sha'],'parents':[pin]})
          assert gh(ref)['object']['sha']==pin,'CONCURRENT_SOURCE_PR_UPDATE'
          updated=gh('git/refs/heads/'+branch,'PATCH',
                     {'sha':new['sha'],'force':False})
          assert updated['object']['sha']==new['sha']
          print('PRIVATE_TERMINAL_WINDOW_ATOMIC_PUBLICATION',
                'files',len(files),'sha',new['sha'])
          PY

# Accepted public/private guard entry present. Re-run original-source verification.
