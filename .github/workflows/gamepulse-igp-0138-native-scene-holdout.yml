name: IGP 0138 native ten and ball scene model source holdout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-0138-native-scene-holdout.yml']
permissions: {contents: read}
concurrency:
  group: igp-0138-native-scene-research
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      PINNED_PRIVATE_SHA: d64b2ad76d6b0cf5d0f988547af718c67de5414e
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public content and private source preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free model tests, then actual SHA original-game reconstruction
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_0138_native_scene_holdout_20261030.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_tracking_model_c0_endpoint_velocity_bridge_2026.py'
          python3 gamepulse/fusion/app_feed_calibrate_2026.py \
            gamepulse/fusion/evidence/companion_sdk_original_0022600138/Q1_252_native_frame_window_v1.json \
            gamepulse/fusion/evidence/user_app_0022600138/manual_markers_9_10_11s_v1.json \
            --output "$RUNNER_TEMP/recomputed-app-qa.json" > "$RUNNER_TEMP/app-qa-stdout.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads((Path(__import__('os').environ['RUNNER_TEMP'])/'recomputed-app-qa.json').read_text())
          frozen=json.loads(Path('gamepulse/fusion/qa/igp_progress_20261030/igp_0138_user_app_render_xy_holdout_v1.json').read_text())
          assert actual == frozen, 'APP_VIDEO_RECONSTRUCTION_QA_DRIFT'
          assert actual['heldout']['n'] >= 7 and actual['heldout']['p95_px'] < 5
          print('IGP_0138_VIDEO_APP_HELDOUT_PIXEL_QA',actual['heldout']['n'],actual['heldout']['p95_px'])
          PY
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_native_scene_model_v2.py'
          python3 gamepulse/fusion/igp_0138_native_scene_v2_ball_qa.py --root . \
            --output gamepulse/fusion/qa/igp_progress_20261030/igp_0138_native_scene_v2_ball_qa.json
          python3 gamepulse/fusion/igp_0138_native_scene_holdout_20261030.py --root .
          python3 gamepulse/fusion/igp_native_scene_crossgame_qa_v2.py --root . \
            --output gamepulse/fusion/qa/igp_progress_20261030/igp_native_scene_v2_two_other_games_qa.json
          python3 gamepulse/fusion/igp_0138_user_video_scene_join_v1.py --root .
          python3 - <<'PY'
          from pathlib import Path
          from igp_0138_user_video_scene_join_v1 import query
          sample=query(Path('.'),9000,11000,limit=100)
          assert len(sample['rows'])==11
          assert sample['rows'][0]['video_ms']==9000
          assert sample['rows'][-1]['video_ms']==11000
          entire=query(Path('.'),0,95800,limit=480)
          assert len(entire['rows'])==480
          assert entire['physical_possessions_certified']==0
          print('IGP_0138_SHA_BOUNDED_CLIP_VIDEO_TIME_QUERY_PASS',len(sample['rows']),len(entire['rows']))
          PY
      - name: Verify no source loss and retain candidate only in private branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('gamepulse/fusion/qa/igp_progress_20261030/igp_0138_native_scene_holdout_v1.json').read_text())
          assert qa['full_original_source_frames_preserved']==30643
          assert qa['counts']['native_frames']==30643
          assert qa['physical_possessions_certified']==0
          assert qa['official_ten_certified'] is False
          for window in ('200','400','800'):
              r=qa['heldout_exact_ten_original_scene'][window]
              assert r['heldout_exact_ten_ball_frames'] > 100
              assert r['recovered_actor_XY_proxy_ft']['n'] > 500
          print('IGP_0138_NATIVE_SCENE_AGGREGATE_ONLY',qa['counts']['native_frames'],qa['counts']['model_ten_and_ball'])
          cross=json.loads(Path('gamepulse/fusion/qa/igp_progress_20261030/igp_native_scene_v2_two_other_games_qa.json').read_text())
          assert set(cross['games'])=={'0022600009','0022600092'}
          for row in cross['games'].values():
              assert row['heldout_whole_frames']==100
              assert row['player_XY_source_proxy_ft']['n']>500
              assert row['ball_3D_source_proxy_ft']['n']>80
          clip=json.loads(Path('gamepulse/fusion/qa/igp_progress_20261030/igp_0138_user_app_clip_native_scene_5hz_v1.json').read_text())
          assert clip['counts']['sampled_video_ticks']==480
          assert clip['video_sha256']=='266f9fac53033570548ca46b90a93999059c90025901326f7f9845cf851e944c'
          assert clip['physical_possessions_certified']==0
          print('IGP_0138_USER_CLIP_5HZ_CANDIDATES',clip['counts'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261030/igp_0138_native_scene_holdout_v1.json \
            gamepulse/fusion/qa/igp_progress_20261030/igp_0138_native_scene_v2_ball_qa.json \
            gamepulse/fusion/qa/igp_progress_20261030/igp_native_scene_v2_two_other_games_qa.json \
            gamepulse/fusion/qa/igp_progress_20261030/igp_0138_user_app_clip_native_scene_5hz_v1.json \
            gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/native_scene_additive/0022600138/user_app_clip_5hz_v1.jsonl.gz \
            gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/native_scene_additive/0022600138/full_native_candidate_scene_800ms.jsonl.gz
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_0138_SOURCE_PINNED_MODEL_REPLAY_NO_DRIFT
            exit 0
          fi
          git commit -q -m 'research(igp): SHA-backed 0138 native scene and masked ten-ball holdout'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_0138_NATIVE_SCENE_PRIVATE_CANDIDATE_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
