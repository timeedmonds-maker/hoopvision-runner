# Relative native NBA audio offsets only. Source MP4, timings and QA remain private.
name: Amen 732 private native audio sync preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen-732-private-audio-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freeview-amen-732-private-audio-sync
  cancel-in-progress: false
jobs:
  native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public content boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          p='.github/workflows/freeview-amen-732-private-audio-sync.yml'
          problems=scan([p])
          if problems:
              for code,path in problems:print("PRIVATE_AUDIO_BOUNDARY_REJECTED",code,path)
              raise SystemExit(3)
          print("PRIVATE_AUDIO_BOUNDARY_PASS")
          PY
      - name: Source-local CPU audio preflight and private QA upload
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/src"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/audio_sync_native.py?ref=04bdbf1097eea70e4cdf0fd861fdde2b07eb40a6' \
            --jq .content | base64 -d > "$TMP/native_sync.py"
          echo PRIVATE_SYNC_SOURCE_VERIFIED
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' opencv-python-headless==4.10.0.84
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/native_contact_review.py?ref=49ef05318000c95210fd246b166bf8eec1379936' \
            --jq .content | base64 -d > "$TMP/contact_review.py"
          python3 "$TMP/contact_review.py" --selftest
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          python3 - "$TMP/native_sync.py" <<'PY'
          import importlib.util,sys,numpy as np
          spec=importlib.util.spec_from_file_location("sync",sys.argv[1])
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          x=np.zeros(1000);x[200]=1;x[300]=.8;x[401]=.6
          y=np.zeros_like(x);y[12:]=x[:-12]
          lag,quality=m.fft_lag(x,y,50)
          assert lag==12 and quality>0.1,(lag,quality)
          print("NATIVE_AUDIO_FFT_LAG_SELFTEST_PASS")
          PY
          TAG="freeview-native-0022600009-732"
          gh release download "$TAG" --repo timeedmonds-maker/104 --dir "$TMP/src" \
            --pattern '*.mp4' --pattern 'source_manifest.json' --pattern 'native_presentation_timestamps.json'
          python3 - "$TMP/src/source_manifest.json" "$TMP/config.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["event"]["game_id"]=="0022600009"
          assert m["event"]["event_num"]==732
          feeds=m["feeds"]
          assert len(feeds)>=3 and feeds[0]["label"]=="Broadcast"
          assert all(f["media_placeholder_rejected"] for f in feeds)
          json.dump({"angles":[{"label":f["label"],"file":f["file"]} for f in feeds]},open(sys.argv[2],"w"))
          print("SIX_VIEW_SOURCE_MANIFEST_VALIDATED",len(feeds))
          PY
          python3 "$TMP/native_sync.py" --config "$TMP/config.json" --clips "$TMP/src" \
            --reference Broadcast --sample-rate 8000 --max-lag-seconds 2.0 \
            --min-edge-quality 0.10 --out "$TMP/native_audio_sync.json" \
            > "$TMP/private_audio_sync.log"
          python3 - "$TMP/native_audio_sync.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a["coarse_audio_only"] is True
          assert a["first_hand_ball_contact_certified"] is False
          assert len(a["angles"])>=3
          print("RELATIVE_AUDIO_GRAPH_COMPUTED",len(a["angles"]),a["selected_edge_count"])
          PY
          gh release upload "$TAG" "$TMP/native_audio_sync.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" \
             --jq '.assets[] | select(.name=="native_audio_sync.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$TMP/native_audio_sync.json" | cut -d' ' -f1)"
          echo PRIVATE_NATIVE_AUDIO_SYNC_SHA256_READBACK_PASS
          python3 - "$TMP/native_audio_sync.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          for row in a["angles"]:
              print("AUDIO_OFFSET_RESULT",row["label"],
                    "relative_seconds",row["audio_lag_seconds_vs_reference"],
                    "confidence",row["confidence"],
                    "mean_quality",row["mean_incident_quality"])
          PY
          mkdir -p "$TMP/contact_review"
          python3 "$TMP/contact_review.py" --clips "$TMP/src" \
            --source-manifest "$TMP/src/source_manifest.json" \
            --native-pts "$TMP/src/native_presentation_timestamps.json" \
            --out "$TMP/contact_review"
          gh release upload "$TAG" "$TMP/contact_review/"*.jpg \
             "$TMP/contact_review/native_contact_review.json" \
             --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$TMP/release_receipt.json"
          python3 - "$TMP/contact_review" "$TMP/release_receipt.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);r=json.load(open(sys.argv[2]))
          assets={a["name"]:a for a in r["assets"]}
          for file in root.iterdir():
              sha=hashlib.sha256(file.read_bytes()).hexdigest()
              assert assets[file.name]["digest"]=="sha256:"+sha,file.name
          print("PRIVATE_NATIVE_CONTACT_REVIEW_SHA256_READBACK_PASS",len(list(root.iterdir())))
          PY
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/native_contact_window.py?ref=83dd50178d9a68c8cfcfa439f1f9c29838986367' \
            --jq .content | base64 -d > "$TMP/contact_window.py"
          python3 "$TMP/contact_window.py" --selftest
          mkdir -p "$TMP/contact_windows"
          python3 "$TMP/contact_window.py" --clips "$TMP/src" \
            --manifest "$TMP/src/source_manifest.json" \
            --pts "$TMP/src/native_presentation_timestamps.json" \
            --audio "$TMP/native_audio_sync.json" \
            --out "$TMP/contact_windows" --broadcast-seed 9.5
          gh release upload "$TAG" "$TMP/contact_windows/"*.jpg \
            "$TMP/contact_windows/native_contact_windows.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$TMP/release_receipt_contact.json"
          python3 - "$TMP/contact_windows" "$TMP/release_receipt_contact.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);r=json.load(open(sys.argv[2]))
          assets={a["name"]:a for a in r["assets"]}
          for file in root.iterdir():
              sha=hashlib.sha256(file.read_bytes()).hexdigest()
              assert assets[file.name]["digest"]=="sha256:"+sha,file.name
          print("PRIVATE_NATIVE_4K_CONTACT_WINDOWS_SHA256_READBACK_PASS",len(list(root.iterdir())))
          PY
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/audio_local_contact_refine.py?ref=88baf894a0ee5d75f1c6b9056970f1ea4d1e1511' \
            --jq .content | base64 -d > "$TMP/local_audio.py"
          python3 "$TMP/local_audio.py" --selftest
          python3 "$TMP/local_audio.py" \
            --clips "$TMP/src" \
            --source-manifest "$TMP/src/source_manifest.json" \
            --whole-audio "$TMP/native_audio_sync.json" \
            --broadcast-seed 9.5 \
            --out "$TMP/local_audio_qa.json"
          gh release upload "$TAG" "$TMP/local_audio_qa.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="local_audio_qa.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$TMP/local_audio_qa.json" | cut -d' ' -f1)"
          echo PRIVATE_LOCAL_CONTACT_AUDIO_QA_SHA256_PASS

          gh release download "$TAG" --repo timeedmonds-maker/104 \
            --dir "$TMP/src" --pattern 'native_contact_windows.json'
          gh release download 'freeview-gamepulse-0022600009-e732-recovery' \
            --repo timeedmonds-maker/104 --dir "$TMP/src" \
            --pattern 'frames.jsonl.gz'
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_event_source_bracket.py?ref=e6afced72e9223bc35856af3f07f2ecef4865847' \
            --jq .content | base64 -d > "$TMP/amen732_bracket.py"
          mkdir -p "$TMP/amen732_event_bracket"
          python3 "$TMP/amen732_bracket.py" \
            --root "$TMP/src" --out "$TMP/amen732_event_bracket" --shift -0.42
          gh release upload "$TAG" \
            "$TMP/amen732_event_bracket/"*.jpg \
            "$TMP/amen732_event_bracket/event732-contact-bracket-qa.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$TMP/amen732_event_bracket/receipt.json"
          python3 - "$TMP/amen732_event_bracket" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assets={v["name"]:v for v in json.loads((root/"receipt.json").read_text())["assets"]}
          files=[v for v in root.iterdir() if v.name!="receipt.json"]
          for file in files:
              digest=hashlib.sha256(file.read_bytes()).hexdigest()
              assert assets[file.name]["digest"]=="sha256:"+digest,file.name
          qa=json.loads((root/"event732-contact-bracket-qa.json").read_text())
          assert len(qa["source_video_views"])>=5
          assert len(qa["original_tracking_contact_time_window"])>=5
          assert qa["first_touch_frame"]=="PENDING_VISUAL_CROSS_VIEW_AND_3D_RAY_QA"
          print("EVENT732_SOURCE_TRACKING_BRACKET_SHA_VERIFIED",len(files),
                "six_video_views",len(qa["source_video_views"]),
                "source_tracking_frames",len(qa["original_tracking_contact_time_window"]))
          PY
          python3 - "$TMP/amen732_event_bracket/event732-contact-bracket-qa.json" "$TMP/amen732_event_bracket/private_put.json" <<'PY'
          import base64,json,sys
          from pathlib import Path
          source=Path(sys.argv[1]).read_bytes()
          assert len(source)<200000
          Path(sys.argv[2]).write_text(json.dumps({
              "branch":"research/amen-wemby-freeze-spin-20261024",
              "message":"data(freeview): original six camera video and source tracking contact bracket",
              "content":base64.b64encode(source).decode("ascii")
          }))
          PY
          QA_PATH='repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_contact_bracket_qa.json'
          if gh api "$QA_PATH?ref=research/amen-wemby-freeze-spin-20261024" \
             --jq .content | base64 -d | cmp -s - "$TMP/amen732_event_bracket/event732-contact-bracket-qa.json"; then
            echo EVENT732_PRIVATE_CONTACT_BRACKET_UNCHANGED
          else
            python3 - "$TMP/amen732_event_bracket/private_put.json" "$(gh api "$QA_PATH?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha)" <<'PY'
          import json,sys
          f=sys.argv[1];data=json.load(open(f));data["sha"]=sys.argv[2]
          open(f,"w").write(json.dumps(data))
          PY
            gh api -X PUT "$QA_PATH" --input "$TMP/amen732_event_bracket/private_put.json" \
              --jq '.content.path' >/dev/null
            echo EVENT732_PRIVATE_CONTACT_BRACKET_UPDATED
          fi

          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_native_optical_motion_qa.py?ref=e9bdbbcb572c706540cab872915690a8514e3122' \
            --jq .content | base64 -d > "$TMP/native_optics.py"
          python3 "$TMP/native_optics.py" --selftest
          python3 "$TMP/native_optics.py" \
            --root "$TMP/src" \
            --manifest "$TMP/src/source_manifest.json" \
            --bracket "$TMP/amen732_event_bracket/event732-contact-bracket-qa.json" \
            --out "$TMP/event732-native-optics-qa.json"
          gh release upload "$TAG" "$TMP/event732-native-optics-qa.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="event732-native-optics-qa.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$TMP/event732-native-optics-qa.json" | cut -d' ' -f1)"
          echo EVENT732_NATIVE_OPTICS_READBACK_PASS
          python3 - "$TMP/event732-native-optics-qa.json" <<'PY'
          import json,sys
          qa=json.load(open(sys.argv[1]))
          for c in qa["cameras"]:
              print("EVENT732_OPTICS_GATE",c["label"],c["status"],
                    "measured_pairs",c["measured_frame_pairs"],
                    "p95_px_peak",c["max_measured_p95_native_px"])
          PY

          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_stationary_basket_motion_qa.py?ref=be4e6eee5dd5cb6511515470ce00d034afdf5bc0' \
            --jq .content | base64 -d > "$TMP/stationary_motion.py"
          python3 "$TMP/stationary_motion.py" --selftest
          python3 "$TMP/stationary_motion.py" \
            --root "$TMP/src" \
            --manifest "$TMP/src/source_manifest.json" \
            --bracket "$TMP/amen732_event_bracket/event732-contact-bracket-qa.json" \
            --out "$TMP/event732-stationary-anchor-qa.json"
          gh release upload "$TAG" "$TMP/event732-stationary-anchor-qa.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="event732-stationary-anchor-qa.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$TMP/event732-stationary-anchor-qa.json" | cut -d' ' -f1)"
          echo EVENT732_STATIONARY_BASKET_READBACK_PASS
          python3 - "$TMP/event732-stationary-anchor-qa.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          for c in q["per_camera"]:
              print("SOURCE_STATIONARY_MOTION",c["label"],
                    c["status"],c["max_stationary_anchor_shift_px"])
          PY
