name: Integrated Pulse official Oct 25 seven-game source extension
# Private originals stay in 104; public runner only executes authorized CPU work.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-official-20261025-seven.yml']
  workflow_run:
    workflows: ['Game Pulse private team game player search refresh']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: gamepulse-private-20261025-official-seven
  cancel-in-progress: false
jobs:
  official:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public/private boundary and private auth
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_ACCESS_MISSING'; exit 2; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone -q --depth 1 https://github.com/timeedmonds-maker/104 "$RUNNER_TEMP/private104"
      - name: Require original seven full-game archives and indexed identity
        id: gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'private104'
          cat=json.loads((root/'gamepulse/catalog/2026-27-auto-refresh-provisional.json').read_text())
          ids=[f'0022600{x:03d}' for x in range(112,119)]
          ready=cat.get('game_count',0)>=43 and all(
            cat['games'].get(gid,{}).get('index_state')=='VERIFIED_ARCHIVE_INDEX' and
            cat['games'][gid].get('archive_qa',{}).get('completed_windows')==3720
            for gid in ids)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('ready='+str(ready).lower()+'\n')
          print('SEVEN_GAME_PRIVATE_ARCHIVE_GATE', 'passed' if ready else 'not_ready')
          PY
      - name: Reconcile official PBP, scores and available source-native advanced player statistics
        if: steps.gate.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}/private104
        run: |
          set -euo pipefail
          PYTHONPATH=gamepulse/fusion python3 gamepulse/fusion/official_pbp_timestamps_2026.py --selftest
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          from official_pbp_allgames_2026 import certify_game
          from official_nba_advanced_source_2026 import fetch_nba_advanced,produce_game
          base=Path('gamepulse/fusion/official_pbp_timing')
          previous_path=base/'index-2026-27-through-20261024.json'
          previous_bytes=previous_path.read_bytes()
          previous=json.loads(previous_bytes)
          assert previous['game_count']==36 and len(previous['games'])==36
          assert previous.get('through_us_game_date')=='2026-10-24'
          cat=json.loads(Path('gamepulse/catalog/2026-27-auto-refresh-provisional.json').read_text())
          new_ids=[f'0022600{x:03d}' for x in range(112,119)]
          assert len(set(new_ids))==7 and set(previous['games']).isdisjoint(new_ids)
          output=dict(previous['games'])
          advanced={}
          for gid in new_ids:
              item=cat['games'][gid]
              assert item['index_state']=='VERIFIED_ARCHIVE_INDEX' and item['archive_qa']['completed_windows']==3720
              result=certify_game(gid,[item['away_team'],item['home_team']])
              assert result['qa']['nba_score_reconciled_to_boxscore'] is True
              assert result['qa']['nba_action_records']>=300
              assert result['qa']['nba_actions_with_formal_utc']>0
              assert all(a.get('possession_start_end_certified') is not True for a in result['actions'])
              path=base/'games'/f'{gid}.json'
              blob=(json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
              if path.exists():assert path.read_bytes()==blob,'EXISTING_OFFICIAL_GAME_IMMUTABILITY'
              else:path.write_bytes(blob)
              output[gid]={
                'game_id':gid,'state':result['state'],'action_records':len(result['actions']),
                'actions_with_official_timeActual_utc':result['qa']['nba_actions_with_formal_utc'],
                'source_file':str(path),'source_pbp_sha256':result['source_provenance']['nba_pbp_sha256'],
                'source_boxscore_sha256':result['source_provenance']['nba_boxscore_sha256'],
                'official_final':result['official_final'],
                'video_pts_certified':0,'physical_possession_boundaries_certified':0}
              try:
                  provider,raw,url=fetch_nba_advanced(gid,'FULL')
                  doc=produce_game(result,'FULL',provider,raw,url)
                  provider_path=Path('gamepulse/fusion/nba_advanced/games')/gid/'FULL.json'
                  provider_path.parent.mkdir(parents=True,exist_ok=True)
                  b=(json.dumps(doc,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
                  if provider_path.exists():assert provider_path.read_bytes()==b,'EXISTING_OFFICIAL_ADVANCED_IMMUTABILITY'
                  else:provider_path.write_bytes(b)
                  advanced[gid]={'status':'NBA_OFFICIAL_ADVANCED_VERIFIED',
                     'source_sha256':sha256(raw).hexdigest(), 'file':str(provider_path),
                     'player_records':len(doc['players'])}
              except (OSError,TimeoutError,ValueError,RuntimeError) as exc:
                  advanced[gid]={'status':'SOURCE_UNAVAILABLE_NOT_ESTIMATED',
                     'error_class':type(exc).__name__, 'source_file':None,
                     'player_records':0}
          assert len(output)==43 and set(previous['games']).issubset(output)
          assert all(output[gid]==previous['games'][gid] for gid in previous['games'])
          manifest={'schema':'gamepulse.2026-27-official-nba-sources-through-20261025.v1',
            'season':'2026-27','through_us_game_date':'2026-10-25','game_count':43,
            'prior_36_source_sha256':sha256(previous_bytes).hexdigest(),
            'new_games':new_ids,'games':output,'advanced_fullgame':advanced,
            'possession_boundary_time_certified':False,
            'physical_tracking_possession_memberships_certified':0,
            'source_policy':'NBA official PBP, scoring, event-clock and boxscore are authoritative; native XYZ membership remains separately uncertified'}
          dest=base/'index-2026-27-through-20261025.json'
          b=(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode()
          if dest.exists():assert dest.read_bytes()==b,'EXISTING_INDEX_IMMUTABILITY'
          else:dest.write_bytes(b)
          print('PRIVATE_OFFICIAL_SOURCE_EXTENDED', 'source_scope_validated', len(new_ids))
          PY
      - name: Publish immutable official seven-game extension privately
        if: steps.gate.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}/private104
        run: |
          set -euo pipefail
          git config user.name 'gamepulse-source-worker'
          git config user.email 'gamepulse-source-worker@users.noreply.github.com'
          git add gamepulse/fusion/official_pbp_timing/games/002260011*.json \
            gamepulse/fusion/official_pbp_timing/index-2026-27-through-20261025.json \
            gamepulse/fusion/nba_advanced/games/002260011*/FULL.json 2>/dev/null || true
          git add gamepulse/fusion/official_pbp_timing/games/002260011*.json \
            gamepulse/fusion/official_pbp_timing/index-2026-27-through-20261025.json
          git diff --cached --quiet && { echo 'PRIVATE_OFFICIAL_SOURCE_ALREADY_CURRENT'; exit 0; }
          git commit -qm 'data(gamepulse): reconcile Oct 25 seven-game official NBA source extension'
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo 'PRIVATE_OFFICIAL_SOURCE_COMMITTED'
              exit 0
            fi
            git fetch -q origin main
            git rebase -q origin/main || { echo 'PRIVATE_CONCURRENT_CONFLICT'; exit 4; }
          done
          echo 'PRIVATE_SOURCE_PUSH_RETRY_EXHAUSTED'
          exit 5
