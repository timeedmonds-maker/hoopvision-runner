name: Game 2 multiangle resolution audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/game2-resolution-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests
      - name: Scan early game HLS ladders
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, urllib.parse, requests
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          gid='0022600002'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          H={'User-Agent':UA,'Referer':'https://clips.nba.com/','Accept':'text/html,*/*'}
          S=requests.Session(); S.headers.update(H)

          def signed_join(base,child):
              j=urllib.parse.urljoin(base,child)
              bp=urllib.parse.urlsplit(base); cp=urllib.parse.urlsplit(j)
              if bp.query and not cp.query:
                  j=urllib.parse.urlunsplit(cp._replace(query=bp.query))
              return j

          def ladder(master):
              r=S.get(master,timeout=(5,20))
              rec={'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type')}
              if r.status_code!=200: return rec
              variants=[]
              lines=[x.strip() for x in r.text.splitlines() if x.strip()]
              for i,line in enumerate(lines):
                  if not line.startswith('#EXT-X-STREAM-INF'): continue
                  bm=re.search(r'BANDWIDTH=(\d+)',line); bw=int(bm.group(1)) if bm else None
                  rm=re.search(r'RESOLUTION=(\d+)x(\d+)',line)
                  wh=[int(rm.group(1)),int(rm.group(2))] if rm else None
                  child=next((z for z in lines[i+1:i+5] if not z.startswith('#')),None)
                  variants.append({'bandwidth':bw,'resolution':wh,'url':signed_join(master,child) if child else None})
              rec['variants']=variants
              rec['max_resolution']=max((v['resolution'] for v in variants if v['resolution']),key=lambda x:x[0]*x[1],default=None)
              return rec

          def event(n):
              u=f'https://clips.nba.com/?gameNo={gid}&eventNum={n}&source=grs'
              rec={'event_num':n,'url':u}
              try:
                  r=S.get(u,timeout=(5,18))
                  rec['status']=r.status_code
                  tm=re.search(r'<title>(.*?)</title>',r.text,re.I|re.S)
                  rec['title']=html.unescape(tm.group(1).strip()) if tm else ''
                  opts=[]
                  for m in re.finditer(r'<option\s+value=["\']([^"\']+)["\']([^>]*)>(.*?)</option>',r.text,re.I|re.S):
                      master=html.unescape(m.group(1).strip())
                      label=re.sub(r'<[^>]+>','',html.unescape(m.group(3))).strip()
                      if '.m3u8' in master.lower():
                          opts.append({'label':label or 'unlabelled','master':master})
                  rec['angles']=opts
                  rec['angle_count']=len(opts)
              except Exception as e: rec['error']=repr(e)
              return rec

          events=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs=[ex.submit(event,n) for n in range(1,121)]
              for f in as_completed(futs): events.append(f.result())
          events.sort(key=lambda x:x['event_num'])
          viable=[e for e in events if e.get('angle_count',0)>0]

          # Audit the earliest event with the maximum angle count seen so far.
          max_angles=max((e['angle_count'] for e in viable),default=0)
          target=next((e for e in viable if e['angle_count']==max_angles),None)
          audited=[]
          if target:
              for a in target['angles']:
                  audited.append({'label':a['label'],'ladder':ladder(a['master'])})

          result={
              'game_id':gid,
              'scan_event_range':[1,120],
              'hls_event_page_count':len(viable),
              'distinct_labels':sorted({a['label'] for e in viable for a in e.get('angles',[])}),
              'max_angle_count':max_angles,
              'target_event':{
                  'event_num':target['event_num'],
                  'title':target.get('title'),
                  'angle_count':target.get('angle_count')
              } if target else None,
              'audited_angles':audited,
              'overall_max_resolution':max((a['ladder'].get('max_resolution') for a in audited if a['ladder'].get('max_resolution')),
                                           key=lambda x:x[0]*x[1],default=None)
          }
          out=Path('experiment_results/game2_resolution'); out.mkdir(parents=True,exist_ok=True)
          (out/'latest.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          git config user.name hoopvision-public-probe
          git config user.email hoopvision-public-probe@users.noreply.github.com
          git add experiment_results/game2_resolution/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record game 2 multiangle resolution audit [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
