name: PR776 original SDK nested timing metadata definitive source audit
# Exact original 13 SDK part digests; all raw inputs/field paths stay private.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-direct-sdk-time-probe.yml']
permissions: {contents: read}
concurrency:
  group: pr776-original-sdk-clock-schema-one-game
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
      GAME: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public content guard, private canonical code checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Source-free schema and SHA-negative regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_original_sdk_direct_time_probe_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_original_sdk_direct_time_probe_2026.py'
      - name: Probe original 13 signed-SDK source parts and original event metadata
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/priv-original"
          mkdir -p "$BASE/archive"
          gh api "repos/$R/releases/tags/gamepulse-sdk-$GAME" > "$BASE/release.json"
          gh release download "gamepulse-sdk-$GAME" --repo "$R" --pattern 'sdk-part-*.tar.gz' --dir "$BASE/archive" --clobber >/dev/null
          cd "$RUNNER_TEMP/private"
          OUT="gamepulse/fusion/qa/igp_progress_20261027/direct_sdk_timing_metadata_nested_v2_$GAME.json"
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_original_sdk_direct_time_probe_2026.py --game-id "$GAME" --archive-dir "$BASE/archive" --release-manifest "$BASE/release.json" --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['verified_original_sdk_parts']==13 and d['original_events']>0
          assert d['original_keyframes']>0 and d['physical_possessions_certified']==0
          assert d['independent_native_to_nba_clock_labels']==0
          assert len(d['field_paths'])>0
          print('IGP_PRIVATE_NATIVE_EVENT_METADATA_SHA_ACCEPTED',json.dumps({
              'source_parts':d['verified_original_sdk_parts'],
              'original_event_count':d['original_events'],
              'source_keyframe_count':d['original_keyframes'],
              'field_path_count':len(d['field_paths']),
              'direct_clock_or_id_named_candidates':len(d['direct_named_field_candidates']),
              'independent_clock_labels':0,'certified_physical_possessions':0
          },sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          git commit -q -m "qa(igp): original 13-part Rockets Spurs SDK metadata direct clock/id probe"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_DIRECT_SDK_METADATA_PRIVATE_ACCEPTANCE_PUBLISHED
              exit 0
            fi
            sleep "$i"
          done
          exit 13
