name: IPPT PRIVATE v3 all NBA action native XY plus source physics hypotheses SHA acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-private-v3-event-source-physics-sqlite.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  private-native-xy-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      RESEARCH_BRANCH: research/ippt-event-snapshots-separate-20261028
      RESEARCH_SHA: c4f9a968f483249e23373c9bf0613fc2648be2de
      V2_DATA_BRANCH: data/ippt-all-pbp-native-xy-causal-36-20261028-v2
      V2_SHA: dbd3e23787d5974082d794402c2d61b2c44c4b26
      V2_PATH: gamepulse/fusion/materialized/ippt_all_pbp_native_xy_causal_36_v2/nba_pbp_original_native_xy_causal.sqlite
      NEW_DATA_BRANCH: data/ippt-all-pbp-native-xy-causal-physics-36-20261028-v3
      V3_PATH: gamepulse/fusion/materialized/ippt_all_pbp_native_xy_causal_physics_36_v3/nba_pbp_original_native_xy_causal_physics.sqlite
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SHA pinned PRIVATE source + v2 original XY clone, no force overwrite
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          if git ls-remote --exit-code --heads "https://github.com/$PRIVATE_REPO.git" "$NEW_DATA_BRANCH" >/dev/null 2>&1; then
            echo "IPPT_PRIVATE_V3_BRANCH_ALREADY_EXISTS_REFUSE_OVERWRITE"
            exit 1
          fi
          git clone -q --filter=blob:none --depth=1 --sparse -b "$RESEARCH_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-code"
          git -C "$RUNNER_TEMP/private-code" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private-code" rev-parse HEAD)" = "$RESEARCH_SHA"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$V2_DATA_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-v2"
          git -C "$RUNNER_TEMP/private-v2" sparse-checkout set gamepulse/fusion/materialized/ippt_all_pbp_native_xy_causal_36_v2
          test "$(git -C "$RUNNER_TEMP/private-v2" rev-parse HEAD)" = "$V2_SHA"
          echo "IPPT_CODE=$RUNNER_TEMP/private-code" >> "$GITHUB_ENV"
          echo "IPPT_V2=$RUNNER_TEMP/private-v2" >> "$GITHUB_ENV"
      - name: Verify original private NBA v2 source XYZ SHA read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["IPPT_V2"])/os.environ["V2_PATH"]
          meta=json.loads(p.with_name("source_and_causal_sqlite_manifest.json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==meta["v2_private_SQLite_SHA256"]
          assert meta["counts"]["pbp_event"]==22314
          assert meta["counts"]["event_bundle"]==6336
          assert meta["counts"]["original_actor"]==110839
          assert meta["all_physical_event_UTC_unverified_null"]
          print("IPPT_PRIVATE_V2_SOURCE_BINARY_SHA_VERIFIED_UNMODIFIED")
          PY
      - name: All PBP event source candidate and private SQLite v3 source-free regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_CODE"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_ippt_all_pbp_native_xy_physics_v3_2026.py \
            gamepulse/fusion/igp_ippt_all_pbp_event_source_physics_candidates_2026.py
          python3 -m unittest -v \
            gamepulse/fusion/test_igp_ippt_all_pbp_native_xy_physics_v3_2026.py \
            gamepulse/fusion/test_igp_ippt_all_pbp_event_source_physics_candidates_2026.py \
            gamepulse/fusion/test_igp_ippt_rebound_native_label_xy_crosscheck_2026.py
      - name: Original SHA 36 NBA game physics candidates + private v3 all-event indexed XY
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_CODE"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_native_xy_physics_v3_2026.py \
            --root . --v2 "$IPPT_V2/$V2_PATH" --out "$IPPT_CODE/$V3_PATH" \
            | tee "$RUNNER_TEMP/ippt_private_v3_aggregate_only.log"
          python3 - <<'PY'
          import json,os,sqlite3,hashlib
          from pathlib import Path
          p=Path(os.environ["IPPT_CODE"])/os.environ["V3_PATH"]
          with sqlite3.connect(p) as db:
            tables={k:db.execute(f"SELECT COUNT(*) FROM {k}").fetchone()[0] for k in
              ("pbp_event","native_frame","original_actor","event_bundle",
               "bundle_membership","bundle_causal_edge","event_motion_candidate")}
            expected={"pbp_event":22314,"native_frame":10623,"original_actor":110839,
                "event_bundle":6336,"bundle_membership":14655,
                "bundle_causal_edge":9241,"event_motion_candidate":5893}
            assert tables==expected,tables
            rows=dict(db.execute("SELECT candidate_kind,COUNT(*) FROM event_motion_candidate GROUP BY candidate_kind").fetchall())
            assert sum(rows.values())==5893
            assert rows.get("rebound")==397,rows
            assert sum(rows.get(k,0) for k in ("2pt","3pt","heave"))==5496,rows
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
            assert db.execute("SELECT COUNT(*) FROM event_motion_candidate WHERE independently_video_certified != 0").fetchone()[0]==0
            assert db.execute("SELECT COUNT(*) FROM event_motion_candidate WHERE original_ball_xyz_json IS NULL").fetchone()[0]==0
            assert db.execute("SELECT COUNT(*) FROM bundle_causal_edge e JOIN event_motion_candidate s ON e.game_id=s.game_id AND e.action_a=s.action_number JOIN event_motion_candidate r ON e.game_id=r.game_id AND e.action_b=r.action_number WHERE e.relation='SHOT_RELEASE_BEFORE_REBOUND_CONTROL' AND NOT (r.source_native_utc_ms-s.source_native_utc_ms BETWEEN 150 AND 4500)").fetchone()[0]==0
            assert not db.execute("PRAGMA foreign_key_check").fetchall()
          m={"schema":"IPPT_ALL_NBA_PBP_NATIVE_XY_CAUSAL_PHYSICS_PRIVATE_SQLITE_V3",
            "source_code_SHA":os.environ["RESEARCH_SHA"],
            "v2_private_data_SHA":os.environ["V2_SHA"],
            "v3_binary_SHA256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "counts":tables,"NBA_event_source_hypotheses_by_kind":rows,
            "scorer_UTC_native_source_observation_preserved":True,
            "candidate_native_UTC_not_video_certified":True,
            "original_NBA_PBP_primary_key_physical_utc_NULL":True,
            "all_36_games_original_source_PBP_SHA_verified":True}
          p.with_name("source_and_physics_sqlite_manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          print("IPPT_PRIVATE_NBA_V3_EVENT_NATIVE_CANDIDATE_INDEX_VERIFY_COUNTS_ONLY",tables)
          PY
      - name: NEW private source data branch, never overwrite v1/v2 or public artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_CODE"
          git config user.name 'Integrated Pulse QA'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$NEW_DATA_BRANCH"
          git add "$V3_PATH" "$(dirname "$V3_PATH")/source_and_physics_sqlite_manifest.json"
          git commit -qm 'data(ippt): all22314 NBA PBP source XY plus 5893 unverified motion candidates private v3'
          git push -q origin "HEAD:refs/heads/$NEW_DATA_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/ippt_v3_private_data_sha.txt"
          echo "IPPT_PRIVATE_V3_NATIVE_XY_GIT_BRANCH_COMMITTED"
      - name: Fresh independent private Git clone and SHA of original NBA actor XY v3
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$NEW_DATA_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-v3-check"
          git -C "$RUNNER_TEMP/private-v3-check" sparse-checkout set "$(dirname "$V3_PATH")"
          python3 - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"private-v3-check"/os.environ["V3_PATH"]
          m=json.loads(p.with_name("source_and_physics_sqlite_manifest.json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["v3_binary_SHA256"]
          assert m["source_code_SHA"]==os.environ["RESEARCH_SHA"]
          with sqlite3.connect(p) as db:
            assert db.execute("SELECT COUNT(*) FROM pbp_event").fetchone()[0]==22314
            assert db.execute("SELECT COUNT(*) FROM event_motion_candidate").fetchone()[0]==5893
            assert db.execute("SELECT COUNT(*) FROM bundle_causal_edge").fetchone()[0]==9241
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
          print("IPPT_PRIVATE_V3_FRESH_CLONE_BINARY_SHA_AND_5893_EVENT_CANDIDATE_READBACK_PASS")
          PY
      - name: Destroy local licensed source XY and publish only sanitized v3 QA receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])
          p=d/"ippt_v3_private_data_sha.txt"
          r={"github_run_id":os.environ["GITHUB_RUN_ID"],
             "prior_job_status":os.environ["QA_JOB_RESULT"],
             "private_data_branch":os.environ["NEW_DATA_BRANCH"],
             "private_data_commit_sha":p.read_text().strip() if p.exists() else None,
             "research_source_SHA":os.environ["RESEARCH_SHA"],
             "v2_unmodified_input_SHA":os.environ["V2_SHA"],
             "physical_event_UTC_video_certified":False,
             "public_licensed_NBA_source_XYZ":False}
          (d/"ippt_private_v3_event_qa_note.md").write_text(
             "PRIVATE-only all NBA source XY plus **source-derived hypotheses**, NOT ground-truth physical event times; no original actor/ball XYZ published.\n\n~~~json\n"+
             json.dumps(r,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private-code" "$RUNNER_TEMP/private-v2" "$RUNNER_TEMP/private-v3-check"
          gh issue comment 138 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_private_v3_event_qa_note.md"
# Original NBA SDK source and all coordinates licensed private. No public uploads.
