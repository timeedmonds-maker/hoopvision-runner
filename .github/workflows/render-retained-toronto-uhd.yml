name: Render Retained Toronto UHD QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-retained-toronto-uhd.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-southeast1-c
  INSTANCE: hv-dev-l4
  RUN_ID: public-36202716389-1-c7637a7c34a2
  CANDIDATE_SHA: ebb9cbcca8327596958d15734fdaa039efb26e2d
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact solved candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Assert established UHD presentation chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "src/tools")
          from render_deterministic_master import FILTER_BASE
          expected = "hqdn3d=0.6:0.6:2.0:2.0,scale={w}:{h}:flags=lanczos,cas=0.22,fps=30"
          assert FILTER_BASE == expected, FILTER_BASE
          kick = Path("src/screen_tracker_kickout3/render_kickout3.py").read_text()
          assert "hqdn3d=0.6:0.6:2.0:2.0,scale=3840:2160:flags=lanczos,cas=0.22,fps=30" in kick
          print("HOOPVISION_ESTABLISHED_UHD_PRESENTATION_CHAIN_OK", FILTER_BASE)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cheap renderer checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/screen_tracker_nextgen/render_global_identity_safe.py \
            src/screen_tracker_nextgen/render_all_player_labels.py \
            src/screen_tracker_nextgen/materialize_sam31_player_paths.py \
            src/screen_tracker_nextgen/build_continuous_role_render_bundle.py \
            src/screen_tracker_nextgen/summarize_render_timeline.py \
            src/screen_tracker_kickout3/fetch_exact_angle_native.py \
            src/tools/render_deterministic_master.py
          python src/tools/validate_governing_delivery_policy.py

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Tokyo host and install instance-scoped SSH key
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --format='value(status)')"
          echo "TOKYO_STATUS_BEFORE=$STATUS"
          if test "$STATUS" != RUNNING; then
            gcloud compute instances start "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet
            echo "HV_STARTED_INSTANCE=1" >> "$GITHUB_ENV"
          else
            echo "HV_STARTED_INSTANCE=0" >> "$GITHUB_ENV"
          fi
          gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --format='get(metadata.items.ssh-keys)' > /tmp/orig-keys || true
          rm -f /tmp/hv-key /tmp/hv-key.pub
          ssh-keygen -q -t ed25519 -N '' -C 'hoopvision-retained-render' -f /tmp/hv-key
          cp /tmp/orig-keys /tmp/new-keys
          if test -s /tmp/new-keys; then printf '\n' >> /tmp/new-keys; fi
          printf 'runner:%s\n' "$(cat /tmp/hv-key.pub)" >> /tmp/new-keys
          gcloud compute instances add-metadata "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --metadata-from-file ssh-keys=/tmp/new-keys --quiet
          IP="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --format='get(networkInterfaces[0].accessConfigs[0].natIP)')"
          echo "HV_IP=$IP" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if ssh -i /tmp/hv-key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "runner@$IP" 'echo ok' >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          exit 3

      - name: Stage exact render code
        shell: bash
        run: |
          set -euo pipefail
          tar -C src -czf /tmp/render-code.tgz screen_tracker_nextgen screen_tracker_kickout3 tools hoopvision/core
          scp -i /tmp/hv-key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/render-code.tgz "runner@$HV_IP:/tmp/"

      - name: Restore retained Toronto replay evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/timeedmonds-maker/hoopvision-runner/actions/artifacts/10902980992/zip" \
            -o /tmp/toronto-replay.zip
          rm -rf /tmp/toronto-replay
          mkdir -p /tmp/toronto-replay
          unzip -q /tmp/toronto-replay.zip -d /tmp/toronto-replay
          find /tmp/toronto-replay -maxdepth 4 -type f -print
          tar -C /tmp/toronto-replay -czf /tmp/toronto-replay.tgz .
          scp -i /tmp/hv-key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/toronto-replay.tgz "runner@$HV_IP:/tmp/"
          ssh -i /tmp/hv-key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "runner@$HV_IP" '
            set -euo pipefail
            R="/srv/hoopvision/runs/'"$RUN_ID"'"
            sudo mkdir -p "$R/replay-d3b56542"
            sudo tar -C "$R/replay-d3b56542" --strip-components=1 -xzf /tmp/toronto-replay.tgz replay
            sudo test -f "$R/replay-d3b56542/global_identity/resolved_config.json"
            sudo test -f "$R/replay-d3b56542/global_identity/global_identity_qa.json"
            sudo test -f "$R/replay-d3b56542/global_identity/visual_identity_oracle_qa.json"
            sudo test -f "$R/replay-d3b56542/global_identity/identity_assignments.csv"
          '

      - name: Render corrected normal and continuous-player UHD
        shell: bash
        run: |
          set -euo pipefail
          ssh -i /tmp/hv-key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "runner@$HV_IP" '
            set -euxo pipefail
            R="/srv/hoopvision/runs/'"$RUN_ID"'"
            REPLAY="$R/replay-d3b56542"
            OUT="$REPLAY/final_corrected"
            ORACLE="$REPLAY/global_identity/visual_identity_oracle_qa.json"
            ASSIGN="$REPLAY/global_identity/identity_assignments.csv"
            DURABLE_SOURCE="$R/artifacts/nextgen_mask/source_native.mp4"

            # Extract the staged candidate before any source rehydration uses its fetcher.
            sudo rm -rf /tmp/retained-render-code
            sudo mkdir -p /tmp/retained-render-code
            sudo tar -C /tmp/retained-render-code -xzf /tmp/render-code.tgz

            # Singapore failover hosts may not retain the historical Toronto source.
            # Re-fetch the exact official Broadcast rendition when the durable copy is absent.
            if ! sudo test -f "$DURABLE_SOURCE"; then
              sudo mkdir -p "$(dirname "$DURABLE_SOURCE")"
              BASE="$(sudo grep "^HOOPVISION_BASE_IMAGE=" /etc/hoopvision-dev.env | cut -d= -f2-)"
              test -n "$BASE"
              sudo docker run --rm --pull=never                 -v /tmp/retained-render-code:/opt/hoopvision:ro                 -v "$R:/run/hoopvision"                 -e PYTHONUNBUFFERED=1 -e PYTHONPATH=/opt/hoopvision                 --workdir /opt/hoopvision --entrypoint python "$BASE"                 /opt/hoopvision/screen_tracker_kickout3/fetch_exact_angle_native.py                 --game 0022500131 --event 585 --angle Broadcast --target-width 960                 --out /run/hoopvision/artifacts/nextgen_mask/source_native.mp4                 --meta /run/hoopvision/artifacts/nextgen_mask/source_native_selection.json
            fi
            sudo test -s "$DURABLE_SOURCE"
            sudo test -f "$REPLAY/global_identity/resolved_config.json"
            sudo test -f "$REPLAY/global_identity/global_identity_qa.json"
            sudo test -f "$ORACLE"
            sudo test -f "$ASSIGN"
            sudo test -s /srv/hoopvision/models/cache/sam3.1_multiplex.pt

            sudo python3 - "$ORACLE" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          checks=q.get("checks") or []
          assert q.get("pass") is True, q
          assert len(checks)==5, len(checks)
          assert all(x.get("pass") is True for x in checks), checks
          print("TORONTO_RETAINED_ORACLE_5_OF_5")
          PY

            BASE="$(sudo grep "^HOOPVISION_BASE_IMAGE=" /etc/hoopvision-dev.env | cut -d= -f2-)"
            test -n "$BASE"

            sudo rm -rf "$OUT"
            sudo mkdir -p "$OUT"

            COMMON="-v /tmp/retained-render-code:/opt/hoopvision:ro -v $R:/run/hoopvision -e PYTHONUNBUFFERED=1 -e PYTHONPATH=/opt/hoopvision --workdir /opt/hoopvision --entrypoint python"

            # Normal NBA event clips top out at 960x540. Select the best official
            # 960 rendition by bandwidth instead of relying on master-playlist order.
            sudo docker run --rm --pull=never $COMMON "$BASE" \
              /opt/hoopvision/screen_tracker_kickout3/fetch_exact_angle_native.py \
              --game 0022500131 --event 585 --angle Broadcast --target-width 960 \
              --out /run/hoopvision/replay-d3b56542/final_corrected/source_best_960.mp4 \
              --meta /run/hoopvision/replay-d3b56542/final_corrected/source_selection.json

            BEST_SOURCE="$OUT/source_best_960.mp4"
            sudo test -s "$BEST_SOURCE"
            sudo ffprobe -v error -show_entries stream=width,height,avg_frame_rate \
              -show_entries format=duration,size,bit_rate -of json "$BEST_SOURCE" \
              | sudo tee "$OUT/source_best_probe.json" >/dev/null
            sudo ffprobe -v error -show_entries stream=width,height,avg_frame_rate \
              -show_entries format=duration,size,bit_rate -of json "$DURABLE_SOURCE" \
              | sudo tee "$OUT/source_durable_probe.json" >/dev/null

            sudo python3 - "$OUT/source_best_probe.json" "$OUT/source_durable_probe.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          va=a["streams"][0]; vb=b["streams"][0]
          assert int(va["width"])==960 and int(va["height"])==540, va
          assert int(vb["width"])==960 and int(vb["height"])==540, vb
          assert va["avg_frame_rate"]==vb["avg_frame_rate"], (va,vb)
          da=float(a["format"]["duration"]); db=float(b["format"]["duration"])
          assert abs(da-db)<0.08, (da,db)
          print("TORONTO_BEST_960_SOURCE_METADATA_ALIGNED",a["format"].get("bit_rate"),b["format"].get("bit_rate"))
          PY

            # Ensure the refetched rendition is the same temporally aligned
            # broadcast content before reusing solved 960x540 geometry.
            set +e
            sudo ffmpeg -nostdin -i "$DURABLE_SOURCE" -i "$BEST_SOURCE" \
              -lavfi "[0:v][1:v]ssim" -f null - 2>&1 | sudo tee "$OUT/source_ssim.log"
            SSIM_RC="${PIPESTATUS[0]}"
            set -e
            test "$SSIM_RC" = 0
            sudo python3 - "$OUT/source_ssim.log" <<'PY'
          import re,sys
          s=open(sys.argv[1],errors="ignore").read()
          vals=re.findall(r"All:([0-9.]+)",s)
          assert vals, s[-2000:]
          score=float(vals[-1])
          assert score>=0.95, score
          print("TORONTO_BEST_960_SOURCE_VISUALLY_ALIGNED",score)
          PY

            # Seed only from identities already authorized safe by the solved
            # 5/5 state, then propagate their physical bodies bidirectionally
            # through the entire visible render window with SAM3.1 multiplex.
            sudo docker run --rm --pull=never --gpus all \
              -v /srv/hoopvision/models/cache:/models:ro $COMMON "$BASE" \
              /opt/hoopvision/screen_tracker_nextgen/materialize_sam31_player_paths.py \
              --source /run/hoopvision/replay-d3b56542/final_corrected/source_best_960.mp4 \
              --assignments /run/hoopvision/replay-d3b56542/global_identity/identity_assignments.csv \
              --out-csv /run/hoopvision/replay-d3b56542/final_corrected/continuous_player_paths.csv \
              --out-qa /run/hoopvision/replay-d3b56542/final_corrected/continuous_player_paths_qa.json \
              --checkpoint /models/sam3.1_multiplex.pt \
              --start-s 5.5 --end-s 15.5 --required-player-count 0 \
              --require-full-window-coverage

            sudo python3 - "$OUT/continuous_player_paths_qa.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          assert q.get("safe_only") is True, q
          assert q.get("player_count")==3, q
          names=sorted(x["player_name"] for x in q["players"].values())
          assert names==["Gradey Dick","Kevin Durant","Steven Adams"], names
          assert not q.get("coverage_failures"), q
          for rec in q["players"].values():
              assert rec["covers_render_window_start"] is True, rec
              assert rec["covers_render_window_end"] is True, rec
              assert int(rec["max_materialized_gap_frames"])==0, rec
          print("TORONTO_THREE_SAFE_PLAYERS_CONTINUOUS_SAM31_OK",names)
          PY

            # Convert the same validated continuous player paths into v100 role
            # tracks, so the commercial clip and QA clip share one geometry truth.
            sudo docker run --rm --pull=never $COMMON "$BASE" \
              /opt/hoopvision/screen_tracker_nextgen/build_continuous_role_render_bundle.py \
              --config /run/hoopvision/replay-d3b56542/global_identity/resolved_config.json \
              --paths /run/hoopvision/replay-d3b56542/final_corrected/continuous_player_paths.csv \
              --out-config /run/hoopvision/replay-d3b56542/final_corrected/continuous_resolved_config.json \
              --out-tracks /run/hoopvision/replay-d3b56542/final_corrected/continuous_role_tracks.csv \
              --out-qa /run/hoopvision/replay-d3b56542/final_corrected/continuous_role_bundle_qa.json

            sudo docker run --rm --pull=never $COMMON "$BASE" \
              /opt/hoopvision/screen_tracker_nextgen/render_global_identity_safe.py \
              --source /run/hoopvision/replay-d3b56542/final_corrected/source_best_960.mp4 \
              --tracks /run/hoopvision/replay-d3b56542/final_corrected/continuous_role_tracks.csv \
              --config /run/hoopvision/replay-d3b56542/final_corrected/continuous_resolved_config.json \
              --identity-qa /run/hoopvision/replay-d3b56542/global_identity/global_identity_qa.json \
              --require-sam31 \
              --out /run/hoopvision/replay-d3b56542/final_corrected/normal

            NORMAL="$(sudo find "$OUT/normal" -maxdepth 1 -type f -name "*_UHD.mp4" -print -quit)"
            test -n "$NORMAL"

            sudo docker run --rm --pull=never $COMMON "$BASE" \
              /opt/hoopvision/screen_tracker_nextgen/render_all_player_labels.py \
              --source /run/hoopvision/replay-d3b56542/final_corrected/source_best_960.mp4 \
              --assignments /run/hoopvision/replay-d3b56542/global_identity/identity_assignments.csv \
              --paths /run/hoopvision/replay-d3b56542/final_corrected/continuous_player_paths.csv \
              --out /run/hoopvision/replay-d3b56542/final_corrected/toronto_all_player_UHD.mp4 \
              --start-s 5.5 --end-s 15.5 --uhd \
              --frame-ledger /run/hoopvision/replay-d3b56542/final_corrected/all_player_ledger.csv

            sudo docker run --rm --pull=never $COMMON "$BASE" \
              /opt/hoopvision/screen_tracker_nextgen/summarize_render_timeline.py \
              --ledger /run/hoopvision/replay-d3b56542/final_corrected/all_player_ledger.csv \
              --out /run/hoopvision/replay-d3b56542/final_corrected/all_player_qa.json

            sudo python3 - "$OUT/all_player_qa.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          assert q.get("structural_pass") is True, q
          assert q.get("player_count")==3, q
          assert q.get("safely_identified_player_count")==3, q
          for rec in q["players"]:
              assert rec["complete_overlay_frames"]==rec["render_window_frames"], rec
              assert rec["name_visible_frames"]==rec["render_window_frames"], rec
              assert rec["ring_visible_frames"]==rec["render_window_frames"], rec
          print("TORONTO_CONTINUOUS_OVERLAY_300_OF_300_PER_PLAYER")
          PY

            ALL="$OUT/toronto_all_player_UHD.mp4"
            sudo test -s "$ALL"

            for VIDEO in "$NORMAL" "$ALL"; do
              W="$(sudo ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
              H="$(sudo ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
              test "$W" = 3840
              test "$H" = 2160
              sudo ffmpeg -nostdin -v error -i "$VIDEO" -f null -
            done

            sudo ffprobe -v error -count_frames -select_streams v:0 \
              -show_entries stream=width,height,r_frame_rate,nb_read_frames \
              -show_entries format=duration -of json "$NORMAL" \
              | sudo tee /tmp/normal_ffprobe.json >/dev/null
            sudo ffprobe -v error -count_frames -select_streams v:0 \
              -show_entries stream=width,height,r_frame_rate,nb_read_frames \
              -show_entries format=duration -of json "$ALL" \
              | sudo tee /tmp/all_player_ffprobe.json >/dev/null

            sudo cp "$NORMAL" /tmp/toronto_normal_5of5_UHD.mp4
            sudo cp "$ALL" /tmp/toronto_all_player_5of5_UHD.mp4
            sudo cp "$OUT/all_player_ledger.csv" /tmp/all_player_ledger.csv
            sudo cp "$OUT/all_player_qa.json" /tmp/all_player_qa.json
            sudo cp "$OUT/continuous_player_paths_qa.json" /tmp/continuous_player_paths_qa.json
            sudo cp "$OUT/continuous_role_bundle_qa.json" /tmp/continuous_role_bundle_qa.json
            sudo cp "$OUT/source_selection.json" /tmp/source_selection.json
            sudo cp "$OUT/source_best_probe.json" /tmp/source_best_probe.json
            sudo cp "$OUT/source_durable_probe.json" /tmp/source_durable_probe.json
            sudo cp "$OUT/source_ssim.log" /tmp/source_ssim.log
            sudo cp "$ORACLE" /tmp/visual_identity_oracle_qa.json
            sudo chown runner:runner \
              /tmp/toronto_normal_5of5_UHD.mp4 \
              /tmp/toronto_all_player_5of5_UHD.mp4 \
              /tmp/all_player_ledger.csv /tmp/all_player_qa.json \
              /tmp/continuous_player_paths_qa.json /tmp/continuous_role_bundle_qa.json \
              /tmp/source_selection.json /tmp/source_best_probe.json /tmp/source_durable_probe.json \
              /tmp/source_ssim.log /tmp/visual_identity_oracle_qa.json \
              /tmp/normal_ffprobe.json /tmp/all_player_ffprobe.json
            sha256sum /tmp/toronto_normal_5of5_UHD.mp4 /tmp/toronto_all_player_5of5_UHD.mp4 \
              > /tmp/retained-render-sha256.txt
            echo "TORONTO_CORRECTED_CONTINUOUS_UHD_RENDER_OK"
          ' 2>&1 | tee render.log

          for f in \
            toronto_normal_5of5_UHD.mp4 \
            toronto_all_player_5of5_UHD.mp4 \
            all_player_ledger.csv all_player_qa.json \
            continuous_player_paths_qa.json continuous_role_bundle_qa.json \
            source_selection.json source_best_probe.json source_durable_probe.json source_ssim.log \
            visual_identity_oracle_qa.json \
            normal_ffprobe.json all_player_ffprobe.json \
            retained-render-sha256.txt; do
            scp -i /tmp/hv-key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "runner@$HV_IP:/tmp/$f" .
          done

      - name: Install local media verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verify retrieved UHD clips completely
        shell: bash
        run: |
          set -euo pipefail
          for VIDEO in toronto_normal_5of5_UHD.mp4 toronto_all_player_5of5_UHD.mp4; do
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")" = "3840"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")" = "2160"
            ffmpeg -nostdin -v error -i "$VIDEO" -f null -
          done
          python - <<'PY'
          import json
          q=json.load(open("visual_identity_oracle_qa.json"))
          assert q.get("pass") is True and len(q.get("checks") or [])==5
          assert all(x.get("pass") is True for x in q["checks"])
          a=json.load(open("all_player_qa.json"))
          assert a.get("structural_pass") is True, a
          assert a.get("player_count")==3 and a.get("safely_identified_player_count")==3, a
          for rec in a["players"]:
              assert rec["complete_overlay_frames"]==rec["render_window_frames"], rec
          p=json.load(open("continuous_player_paths_qa.json"))
          assert p.get("player_count")==3 and not p.get("coverage_failures"), p
          print("RETRIEVED_UHD_CONTINUITY_AND_ORACLE_VALIDATION_OK")
          PY
          sha256sum toronto_normal_5of5_UHD.mp4 toronto_all_player_5of5_UHD.mp4 | tee retrieved-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hoopvision-toronto-corrected-continuous-uhd-established-v100
          path: |
            toronto_normal_5of5_UHD.mp4
            toronto_all_player_5of5_UHD.mp4
            all_player_ledger.csv
            all_player_qa.json
            continuous_player_paths_qa.json
            continuous_role_bundle_qa.json
            source_selection.json
            source_best_probe.json
            source_durable_probe.json
            source_ssim.log
            visual_identity_oracle_qa.json
            normal_ffprobe.json
            all_player_ffprobe.json
            retained-render-sha256.txt
            retrieved-sha256.txt
            render.log
          compression-level: 0
          retention-days: 30

      - name: Restore instance SSH metadata
        if: always()
        shell: bash
        run: |
          if test -s /tmp/orig-keys; then
            gcloud compute instances add-metadata "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" \
              --metadata-from-file ssh-keys=/tmp/orig-keys --quiet || true
          else
            gcloud compute instances remove-metadata "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" \
              --keys=ssh-keys --quiet || true
          fi
          rm -f /tmp/hv-key /tmp/hv-key.pub /tmp/new-keys
