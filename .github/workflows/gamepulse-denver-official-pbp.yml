name: Integrated Pulse player possession clip index
# Public CPU orchestrator. Per-player result data and full NBA event lists are
# stored only in the private repository's releases, never public artifacts.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-denver-official-pbp.yml']
  workflow_dispatch:
    inputs:
      game_id:
        description: Official NBA game ID
        type: string
        required: true
        default: '0022600009'
      player_id:
        description: Official NBA player ID
        type: string
        required: true
        default: '203500'
permissions:
  contents: read
concurrency:
  group: pulse-player-clips-${{ inputs.game_id || '0022600009' }}-${{ inputs.player_id || '203500' }}
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      NBA_GAME_ID: ${{ inputs.game_id || '0022600009' }}
      NBA_PLAYER_ID: ${{ inputs.player_id || '203500' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce private results and public workflow policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          [[ "$NBA_GAME_ID" =~ ^00[0-9]{8}$ ]]
          [[ "$NBA_PLAYER_ID" =~ ^[1-9][0-9]{0,11}$ ]]
      - name: Load trusted private-source read-only clip query
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nba-official"
          mkdir -p "$ROOT"
          for mod in official_pbp_timestamps_2026.py player_possession_clips.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$mod?ref=main" --jq .content | base64 -d > "$ROOT/$mod"
          done
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_player_possession_clips.py?ref=main' --jq .content | base64 -d > "$ROOT/test_player_possession_clips.py"
          python3 -m py_compile "$ROOT/"*.py
          cd "$ROOT"
          python3 -m unittest -q test_player_possession_clips
      - name: Build source-verified full-game player possessions and NBA clip references
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nba-official"
          cd "$ROOT"
          python3 player_possession_clips.py --game "$NBA_GAME_ID" --player "$NBA_PLAYER_ID" --out "$ROOT/player-clips.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('player-clips.json').read_text())
          assert data["game_id"]==os.environ["NBA_GAME_ID"]
          assert data["player_id"]==os.environ["NBA_PLAYER_ID"]
          assert data["clip_count"]==len(data["clips"])
          assert len({x["event_num"] for x in data["clips"]})==data["clip_count"]
          assert all("eventNum="+str(x["event_num"]) in x["clip_url"] for x in data["clips"])
          Path('release-notes.json').write_text(json.dumps(data,separators=(',',':')))
          print("PLAYER_SOURCE_EVENT_CLIPS_VERIFIED",data["game_id"],"event_urls",data["clip_count"],"stints",len(data["on_court_spans"]))
          PY
      - name: Publish result only to canonical private repository and SHA-readback
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nba-official"
          TAG="gamepulse-player-possession-clips-$NBA_GAME_ID-$NBA_PLAYER_ID"
          REPO=timeedmonds-maker/104
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes-file "$ROOT/release-notes.json" >/dev/null
          else
            gh release create "$TAG" --repo "$REPO" --title "Private official NBA player possession clip references" --notes-file "$ROOT/release-notes.json" --latest=false >/dev/null
          fi
          gh release upload "$TAG" "$ROOT/player-clips.json" --repo "$REPO" --clobber >/dev/null
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          tag=f"gamepulse-player-possession-clips-{os.environ['NBA_GAME_ID']}-{os.environ['NBA_PLAYER_ID']}"
          raw=subprocess.check_output(["gh","api",f"repos/timeedmonds-maker/104/releases/tags/{tag}"])
          remote=json.loads(raw)
          local=Path(os.environ["RUNNER_TEMP"])/"nba-official/player-clips.json"
          assets={x["name"]:x for x in remote["assets"]}
          assert assets["player-clips.json"]["digest"]=="sha256:"+hashlib.sha256(local.read_bytes()).hexdigest()
          assert json.loads(remote["body"])["clip_count"]==json.loads(local.read_text())["clip_count"]
          print("PRIVATE_NBA_EVENT_LINKS_SHA256_READBACK_PASS")
          PY
