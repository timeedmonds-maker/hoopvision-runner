# P3 model weights frozen from two train games, evaluate eight entirely new originals.
name: IGP P3 frozen multiagent eight unseen NBA games source QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-frozen-eightgame-external-source-validation-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-frozen-external-eight
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 3e849a8abaae68fbf9d1f500cdb46e796e46aaa0
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private source SHA pin and public guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Validate eight unseen original SHA games with frozen model coefficients
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_external_eightgame_validation_v1.py'
          python3 gamepulse/fusion/igp_68_p3_external_eightgame_validation_v1.py \
            --root . --out "$RUNNER_TEMP/igp68-p3-8-unseen.json" \
            > "$RUNNER_TEMP/igp68-p3-8-unseen-private.log" 2>&1 || {
              echo P3_ORIGINAL_SOURCE_EIGHT_UNSEEN_GAME_PRIVATE_QA_FAILED
              tail -n 12 "$RUNNER_TEMP/igp68-p3-8-unseen-private.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp68-p3-8-unseen.json').read_bytes())
          assert len(q['per_game'])==8
          assert len(q['external_validation_game_ids'])==8
          assert q['model_frozen_no_fit_on_external_games']
          assert not (set(q['external_validation_game_ids']) &
                      (set(q['training_games_not_used_for_validation']) |
                       set(q['prior_development_heldout_games_not_used_for_validation'])))
          assert q['original_NBA_source_immutable'] and q['newly_accepted_68game_complete_scenes']==0
          for kind in ('player','ball'):
            r=q['pooled_external_original_source_masked'][kind]
            assert r['paired_targets']>=240
            assert r['baseline_C0']['n']==r['multiagent_frozen_weights']['n']
          print('IGP_P3_FROZEN_EIGHT_UNSEEN_SOURCE_QA',json.dumps(
            q['pooled_external_original_source_masked'],sort_keys=True))
          PY
      - name: Retain source-backed eight-game QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_frozen_eightgame_external_source_qa_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-external8 "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp68-p3-8-unseen.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): frozen P3 multiagent eight unseen original NBA games'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_FROZEN_EIGHT_EXTERNAL_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
