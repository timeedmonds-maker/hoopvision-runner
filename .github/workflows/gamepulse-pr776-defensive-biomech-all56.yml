name: PR776 free CPU all56 defender mechanics 3PT and midrange
# Audited, allowlisted, aggregate-only private analysis; canonical data never published here.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-defensive-biomech-all56.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-free-cpu-defensive-biomech-all56
  cancel-in-progress: false
jobs:
  private-source-aggregates-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify guard and private access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/disruption-private"
          git -C "$RUNNER_TEMP/disruption-private" sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_defensive_shot_disruption_3pt_midrange_2026.py' \
            '/gamepulse/fusion/qa/igp_progress_20261029/igp_all56_advanced_companion_biomechanics_v2.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all56_v2/'
          echo "PRIVATE_ROOT=$RUNNER_TEMP/disruption-private" >> "$GITHUB_ENV"
      - name: Source-free unit checks and original 56-game analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          python3 -m py_compile gamepulse/fusion/igp_defensive_shot_disruption_3pt_midrange_2026.py
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          from igp_defensive_shot_disruption_3pt_midrange_2026 import baseline
          assert baseline([1.,2.,3.,4.,5.,6.,7.,8.])
          assert baseline([0.]*8) is None
          assert baseline([1.,2.,3.]) is None
          print("SOURCE_FREE_TESTS_PASS")
          PY
          python3 gamepulse/fusion/igp_defensive_shot_disruption_3pt_midrange_2026.py --root . \
            --output gamepulse/fusion/qa/igp_progress_20261029/igp_defensive_shot_disruption_all56_3pt_midrange_v1.json
      - name: Validate full cohort and output private aggregate only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          python3 - <<'PY'
          import json
          a=json.load(open("gamepulse/fusion/qa/igp_progress_20261029/igp_defensive_shot_disruption_all56_3pt_midrange_v1.json"))
          assert a["counts"]["official_fga_read"]==10003
          for category in ("3PT","MIDRANGE_2PT_10FT_PLUS"):
              assert a["counts"]["shot_"+category] > 0
              assert a["rankings"][category]["total_defenders"] > 0
          print("SOURCE_SHA_QA_PASS",json.dumps({"counts":a["counts"],
             "eligible":{k:v["exploratory_eligible_defenders"] for k,v in a["rankings"].items()},
             "association":a["association"]},sort_keys=True))
          PY
          OUT=gamepulse/fusion/qa/igp_progress_20261029/igp_defensive_shot_disruption_all56_3pt_midrange_v1.json
          git config user.name "GamePulse private QA via free CPU"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add --sparse "$OUT"
          git diff --cached --check
          git commit -qm "data(gamepulse): source-verified 56-game 3PT/midrange defender biomechanics"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin HEAD:refs/heads/"$BRANCH"; then
              echo PRIVATE_56GAME_DEFENSIVE_MECHANICAL_ANALYSIS_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1
