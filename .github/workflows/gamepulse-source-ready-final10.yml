name: Game Pulse exact-ready final ten private checkpoints
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-source-ready-final10.yml'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-source-ready-final10.yml'
      - 'tools/licensed_feed/sdk_slot.mjs'
      - 'tools/licensed_feed/sdk_slot.test.mjs'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: nba-gamepulse-exact-ready-last10
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  capture:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {game_id: '0022600005', tipoff: '2026-10-22T02:00:00Z', part: 10}
          - {game_id: '0022600092', tipoff: '2026-10-22T02:00:00Z', part: 10}
          - {game_id: '0022600093', tipoff: '2026-10-22T02:30:00Z', part: 9}
          - {game_id: '0022600005', tipoff: '2026-10-22T02:00:00Z', part: 11}
          - {game_id: '0022600092', tipoff: '2026-10-22T02:00:00Z', part: 11}
          - {game_id: '0022600093', tipoff: '2026-10-22T02:30:00Z', part: 10}
          - {game_id: '0022600005', tipoff: '2026-10-22T02:00:00Z', part: 12}
          - {game_id: '0022600092', tipoff: '2026-10-22T02:00:00Z', part: 12}
          - {game_id: '0022600093', tipoff: '2026-10-22T02:30:00Z', part: 11}
          - {game_id: '0022600093', tipoff: '2026-10-22T02:30:00Z', part: 12}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait only until the actual five-second source window has elapsed
        shell: bash
        env:
          GAMEPULSE_PART: ${{ matrix.part }}
          GAMEPULSE_TIPOFF: ${{ matrix.tipoff }}
        run: |
          python3 - <<'PY'
          import datetime as dt, os, time
          part=int(os.environ['GAMEPULSE_PART'])
          assert part in (9,10,11,12)
          tipoff=dt.datetime.fromisoformat(os.environ['GAMEPULSE_TIPOFF'].replace('Z','+00:00'))
          count=120 if part==12 else 300
          end=tipoff-dt.timedelta(minutes=10)+dt.timedelta(seconds=(part*300+count)*5)
          # Minimal publication grace; never request slots in the future.
          eligible=end+dt.timedelta(seconds=30)
          wait=max(0,(eligible-dt.datetime.now(dt.timezone.utc)).total_seconds())
          if wait>90*60: raise RuntimeError('unexpected_source_window_horizon')
          print('SDK_SOURCE_WINDOW_ELIGIBLE_AT',eligible.isoformat(),flush=True)
          print('SDK_SOURCE_WINDOW_WAIT_SECONDS',int(wait),flush=True)
          if wait: time.sleep(wait)
          print('SDK_WINDOW_ELAPSED_CAPTURE_NOW',flush=True)
          PY
      - name: Install authorised SDK with scripts disabled
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Retrieve authentic exact slots and SHA-verify private archive
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: ${{ matrix.game_id }}
          GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.tipoff }}
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs
  certify:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.preflight.result == 'success'
    needs: [preflight, capture]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {game_id: '0022600005', tipoff: '2026-10-22T02:00:00Z'}
          - {game_id: '0022600092', tipoff: '2026-10-22T02:00:00Z'}
          - {game_id: '0022600093', tipoff: '2026-10-22T02:30:00Z'}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authorised SDK with scripts disabled
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Independently verify all thirteen parts and sign private full-game marker
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: ${{ matrix.game_id }}
          GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.tipoff }}
        run: node season_private_release.mjs
