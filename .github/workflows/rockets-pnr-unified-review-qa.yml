name: Rockets PNR unified private review UI smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rockets-pnr-unified-review-qa.yml
  pull_request:
    paths:
      - .github/workflows/rockets-pnr-unified-review-qa.yml
      - tools/public_content_guard.py
permissions:
  contents: read
concurrency:
  group: rockets-pnr-unified-ui-smoke
  cancel-in-progress: false
jobs:
  public-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
  private-ui-source-smoke:
    needs: public-content
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read only source-pinned private reviewer code and run no-media tests
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || exit 3
          mkdir -p /tmp/rockets-pnr-ui/courtcoder/{qa,static,runtime-config/pnr}
          cd /tmp/rockets-pnr-ui
          ref='courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022'
          for f in             courtcoder/nba_pnr_video_review.py             courtcoder/qa/test_nba_pnr_video_review.py             courtcoder/qa/test_nba_pnr_video_review.cjs             courtcoder/static/nba_pnr_video_review.js             courtcoder/static/index.html             courtcoder/app.py             courtcoder/runtime-config/pnr/rockets_0022600091.json; do
            gh api "repos/timeedmonds-maker/104/contents/$f?ref=$ref" --jq .content | base64 -d > "$f"
          done
          python3 -m py_compile courtcoder/nba_pnr_video_review.py courtcoder/app.py
          node --check courtcoder/static/nba_pnr_video_review.js
          python3 -m unittest discover -s courtcoder/qa -p test_nba_pnr_video_review.py -q
          node courtcoder/qa/test_nba_pnr_video_review.cjs
          python3 - <<'PY'
          from pathlib import Path
          html=Path('courtcoder/static/index.html').read_text()
          app=Path('courtcoder/app.py').read_text()
          assert html.count('id="nbaPnrReviewPanel"')==1
          assert html.count('id="nbaPnrCoverage"')==1
          assert html.count('id="nbaPnrNotes"')==1
          assert html.count('id="nbaPnrSaveStatus"')==1
          assert '/static/nba_pnr_video_review.js' in html
          assert 'id="nbaPnrVideoPanel"' not in html
          assert 'get_nba_pnr_video_review' in app and 'save_nba_pnr_video_review' in app
          assert 'PREVIEW_TOKEN_SHA256' in app and 'ANNOTATION_ONLY' in app
          print('PASS: one private reviewer UI, durable annotations, no media download')
          PY
          rm -rf /tmp/rockets-pnr-ui
