# Approved public runner: all NBA original tracking and shot JSON stays private; only aggregate QA is logged.
# Private-source SHA query check. Do not print original NBA XYZ or derived coordinates.
name: Integrated Pulse unified 56-game action/shot/model read-only query QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-unified-56-private-query-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  unified-private-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and use only canonical private repository
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b research/gamepulse-clock-boundary-integrity-20261025 https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/games
      - name: SHA-verify game, actual shot identity, historic model and new model queries
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_unified_2026_27_season_v1.py
          python3 gamepulse/fusion/query_igp_unified_2026_27_season_v1.py --game-id 0022600009 --action-number 7 --omit-positions > "$RUNNER_TEMP/old.json"
          python3 gamepulse/fusion/query_igp_unified_2026_27_season_v1.py --game-id 0022600129 --action-number 790 --omit-positions > "$RUNNER_TEMP/shot.json"
          python3 gamepulse/fusion/query_igp_unified_2026_27_season_v1.py --game-id 0022600129 --period 1 --clock-second 701 > "$RUNNER_TEMP/new.json"
          python3 gamepulse/fusion/query_igp_unified_2026_27_season_v1.py --game-id 0022600009 --period 1 --clock-second 701 > "$RUNNER_TEMP/oldmodel.json"
          python3 gamepulse/fusion/query_igp_unified_2026_27_season_v1.py --game-id 0022600130 --period 1 --clock-second 600 > "$RUNNER_TEMP/recovered0130.json"
          python3 gamepulse/fusion/query_igp_unified_2026_27_season_v1.py --game-id 0022600131 --period 4 --clock-second 100 > "$RUNNER_TEMP/late0131.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          old=json.loads((p/"old.json").read_bytes())
          shot=json.loads((p/"shot.json").read_bytes())
          new=json.loads((p/"new.json").read_bytes())
          prior=json.loads((p/"oldmodel.json").read_bytes())
          recovered=json.loads((p/"recovered0130.json").read_bytes())
          late=json.loads((p/"late0131.json").read_bytes())
          assert old["source_status"]=="PRESERVED_ACCEPTED_36_MODEL"
          assert old["full_companion_shot_source"]["status"]=="IDENTITY_MATCHED_PROVISIONAL_TIME_CHAIN"
          assert len(old["full_companion_shot_source"]["shot_details"]["source_features"])==30
          assert old["full_companion_shot_source"]["physical_release_certified"] is False
          assert shot["source_status"]=="POST36_MODELED_PBP_SUB_LINEUP_PROVISIONAL"
          assert shot["official_action"]["nba_action_number"]==790
          assert shot["shot_source"]["status"]=="MATCHED_BLUEPRINT_ACTION_SHOOTER_TYPE"
          assert shot["shot_source"]["published_shot"]["expFieldGoalPct"] is not None
          assert old["canonical_official_shot_with_all_published_features"]["published_advanced_companion"] is not None
          assert old["canonical_official_shot_with_all_published_features"]["nba_action_number"]==7
          assert old["all_official_field_goal_attempts_indexed"]==10003
          assert len(old["canonical_official_shot_with_all_published_features"]["published_advanced_companion"]["source_biomechanics_features"])==30
          assert shot["canonical_official_shot_with_all_published_features"]["published_blueprint"] is not None
          assert shot["canonical_official_shot_with_all_published_features"]["nba_action_number"]==790
          assert shot["advanced_30_feature_companion_source_games"]==54
          assert shot["official_shots_with_advanced_biomechanical_source"]==8797
          assert shot["official_shots_with_any_published_xfg"]==9263
          assert old["official_shots_with_advanced_biomechanical_source"]==8797
          assert not old["raw_29joint_60hz_biomechanics_certified"]
          assert new["model_tracking"]["status"]=="SAMPLED_MODEL"
          assert prior["model_tracking"]["status"] in (
              "SAMPLED_MODEL","NO_UNAMBIGUOUS_ELIGIBLE_GAMECLOCK_SAMPLE")
          assert recovered["model_tracking"]["status"]=="SAMPLED_MODEL"
          assert late["model_tracking"]["status"]=="SAMPLED_MODEL"
          assert recovered["original_archive_parts_verified"]==7
          assert late["original_archive_parts_verified"]==8
          assert late["observed_source_covers_recorded_game_end"] is True
          assert shot["complete_ten_ball_56_coverage_pct"]==91.8301
          assert not old["physical_custody_certified"]
          print("IGP_PRIVATE_UNIFIED_SOURCE_QUERY_ACCEPTED",json.dumps({
              "games_total":56,"source_xyz_games":56,
              "new_model_lookup":new["model_tracking"]["status"],
              "historic_model_lookup":prior["model_tracking"]["status"],
              "new_shot_identity":shot["shot_source"]["status"],
              "recovered_0130":recovered["model_tracking"]["status"],
              "late_0131":late["model_tracking"]["status"],
              "all56_1hz_completeness_pct":shot["complete_ten_ball_56_coverage_pct"]},
              sort_keys=True))
          PY

      - name: Verify added shot UTC guard is available in the SAME unified season query
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from query_igp_unified_2026_27_season_v1 import query
          cases=[
             ("0022600002",424,"BLOCK_PHYSICAL_ANCHOR_GT_60S"),
             ("0022600102",112,"BLOCK_PHYSICAL_ANCHOR_GT_60S"),
             ("0022600009",7,"SOURCE_PBP_UTC_LOGGED_AGREEMENT_LE_3S"),
             ("0022600006",8,"COMPANION_SOURCE_PROGRAM_UNAVAILABLE")]
          for gid,aid,expected in cases:
              q=query(".",gid,action_number=aid,include_positions=False)
              grade=q["original_companion_shot_utc_guard"]["grade"]
              assert grade.startswith(expected),(gid,aid,grade)
              assert q["physical_custody_certified"] is False
              assert q["real_world_clock_alignment_certified"] is False
              assert q["all_official_field_goal_attempts_indexed"]==10003
          p=query(".","0022600009",period=1,clock_second=701,include_positions=False)
          assert "original_companion_shot_utc_guard" not in p
          print("IGP_CANONICAL_UNIFIED_SHOT_UTC_GUARD_QUERY_PASS",
                {"real_games":4,"known_unsafe_UTC_blocked":2,
                 "source_program_unavailable_explicit":1,
                 "old_model_or_possession_mutations":0})
          PY

      - name: Verify indexed native C0 short-gap source path without changing accepted 1Hz tracking
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path(".")
          idx=json.loads((root/"gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json").read_bytes())
          p=idx["original_native_bounded_velocity_v1"]
          assert idx["official_games"]==56
          assert idx["physical_possession_certified"]==0
          assert p["ball_direct_observed_only"] is True
          assert p["player_model_total_bracket_limit_ms"]==2000
          src=(root/p["frozen36_strict_native_qa"]).read_bytes()
          blob=hashlib.sha1(b"blob "+str(len(src)).encode()+b"\x00"+src).hexdigest()
          assert blob==p["frozen36_strict_native_qa_github_blob_sha"]
          q=json.loads(src)
          c=q["counts"]
          assert q["tested_source_games"]==36 and c["original_native_frames"]==1203986
          assert c["direct_ten_ball_frames"]==224860
          assert c["C0_ten_ball_frames"]==298553
          assert c["B_ten_ball_frames"]==316906
          assert p["source_self_holdout_not_video_ground_truth"]
          print("IGP_CANONICAL_INDEX_NATIVE_C0_SAFE_READBACK",json.dumps({
            "source_games":36,"source_original_native_frames":1203986,
            "strict_native_direct_ten_ball":224860,
            "strict_native_bounded_C0_ten_ball":298553,
            "accepted_1Hz_or_physical_possessions_rewritten":False},sort_keys=True))
          PY
