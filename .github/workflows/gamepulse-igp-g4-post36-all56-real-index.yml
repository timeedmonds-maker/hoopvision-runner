name: "IGP G4 post36 twenty-game full native NBA logical possession index"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-g4-post36-all56-real-index.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-g4-native-remaining20-pbp-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard runner and access private original full-native 56-game source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Source-free add-on index regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g4_post36_native_logical_possession_index_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_g4_post36_native_logical_possession_index_v1.py'
      - name: Build real SHA-checked original 20-game additive native actor ball and logical possession index
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_g4_post36_native_logical_possession_index_v1.py \
            --root . \
            --out-dir gamepulse/fusion/materialized/igp_g4_post36_additive_original_native_possession_v1
      - name: Verify every game, official chain, SHA and original frames conserved
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          b=Path("gamepulse/fusion/materialized/igp_g4_post36_additive_original_native_possession_v1")
          idx=json.loads((b/"index.json").read_bytes())
          season=json.loads(Path("gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json").read_bytes())
          old=json.loads(Path("gamepulse/fusion/materialized/igp_g4_original_native_player_ball_possession_v1/index.json").read_bytes())
          assert len(idx["games"])==20 and len(old["games"])==36 and len(season["per_game_model"])==56
          assert set(idx["games"]).isdisjoint(old["games"])
          assert set(idx["games"])|set(old["games"])==set(season["per_game_model"])
          sums={"frames":0,"ball":0,"chains":0,"logged":0,"multi":0,"unlinked":0}
          for gid,row in idx["games"].items():
            raw=(b/row["path"]).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==row["sha256"]
            j=json.loads(gzip.decompress(raw))
            assert j["game_id"]==gid and len(j["native_frames"])==row["counts"]["nba_original_source_frames"]
            assert len(j["nba_canonical_logical_chains"])==row["counts"]["official_logical_NBA_chains"]
            assert not j["g3_derived_actor_ordinals"] and not j["g3_derived_ball_ordinals"]
            assert not j["physical_possession_custody_certified"]
            assert j["post36_official_ten_unknown"]
            sums["frames"]+=len(j["native_frames"])
            sums["ball"]+=len(j["original_ball_ordinals"])
            sums["chains"]+=len(j["nba_canonical_logical_chains"])
            sums["logged"]+=j["counts"].get("join_grade_NBA_LOGGED_CHAIN_ONLY_PROVISIONAL",0)
            sums["multi"]+=j["counts"].get("join_grade_MULTIPLE_NBA_LOGGED_CHAINS_ABSTAIN",0)
            sums["unlinked"]+=j["counts"].get("join_grade_NO_ACCEPTED_NBA_CHAIN_WINDOW",0)
          assert sums["frames"]==sums["logged"]+sums["multi"]+sums["unlinked"]
          assert sums["frames"]>400000 and sums["chains"]>2500
          receipt={"schema":"igp.G4-full56-existing-frozen36-plus-post36-native-source-acceptance.v1",
            "canonical_season_games":56,"frozen_G4_existing_games":36,"new_additive_native_G4_games":20,
            "new_post36_counts":sums,"native_frozen36_original_frames":old["counts"]["nba_original_source_frames"],
            "total_native_original_frames_indexed":old["counts"]["nba_original_source_frames"]+sums["frames"],
            "original_56_game_ids_exactly_conserved":True,
            "original_source_XYZ_not_duplicated_or_changed":True,
            "G4_post36_official_lineup_and_G3_not_invented":True,
            "PBP_logical_chain_join_not_physical_possession":True,
            "physical_possessions_certified":0}
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_G4_post36_full56_additive_original_native_index_v1.json")
          assert not p.exists()
          p.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("IGP_ALL56_G4_SOURCE_INDEX_REAL_NBA_ACCEPTED_AGGREGATES",json.dumps(receipt,sort_keys=True))
          PY
      - name: Commit additive original-native source postings and private 56-game acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/materialized/igp_g4_post36_additive_original_native_possession_v1
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_G4_post36_full56_additive_original_native_index_v1.json
          git diff --cached --check
          git commit -q -m "data(igp): extend accepted original-native G4 NBA logical possession postings from 36 to 56 games"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_ADD20_G4_PRIVATE_SOURCE_POSSESSION_INDEX_COMMITTED
              exit 0
            fi
            sleep "$try"
          done
          exit 23
