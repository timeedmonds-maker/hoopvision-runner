name: PR776 C1 5s 8s 10s held-out original-source benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-c1-5-8-10s-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-c1-actual-source-benchmark
  cancel-in-progress: false
jobs:
  compare:
    name: Real NBA C1 vs C0 vs B - two held-out games
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public boundary guard and authenticate private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH"             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
          echo "C1_PRIVATE_ORIGINAL_XYZ_SHA_GUARDED"
      - name: C1 source-free regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m compileall -q gamepulse/fusion/igp_tracking_model_c1_*.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_tracking_model_c1_*.py'
      - name: Real NBA 5s 8s 10s source-blackout held-out game benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          QA=gamepulse/fusion/qa/igp_progress_20261028/igp_C1_two_game_5_8_10s_original_source_holdout_20261028.json
          test ! -e "$QA"
          python3 gamepulse/fusion/igp_tracking_model_c1_cross_game_holdout_2026.py             --root . --out "$QA" --games 0022600009 0022600092
          python3 - "$QA" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["source_games"]==2 and x["no_same_game_template_leakage"]
          assert x["hidden_player_source_positions_not_used_by_scene_features"]
          for gid,game in sorted(x["games"].items()):
              for dur,row in sorted(game["masked_gap_midpoint"].items()):
                  assert row["C1"]["predicted"]<=row["withheld_source_midpoint_cases"]
                  assert row["C0"]["predicted"]<=row["withheld_source_midpoint_cases"]
                  assert row["B"]["predicted"]<=row["withheld_source_midpoint_cases"]
                  print("C1_REAL_SOURCE_RESULT",json.dumps({
                     "game_id":gid,"seconds":int(dur)//1000,
                     "withheld_cases":row["withheld_source_midpoint_cases"],
                     "C1":row["C1"],"C0":row["C0"],"B":row["B"],
                     "matched_C1_C0":row["matched_C1_vs_C0"],
                     "ambiguous_C1":row["ambiguous_C1_cases"],
                     "train_templates":row["direct_templates"]},sort_keys=True))
          PY
      - name: Save measured QA privately without original player coordinates
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          git config user.name "Game Pulse Free CPU QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          QA=gamepulse/fusion/qa/igp_progress_20261028/igp_C1_two_game_5_8_10s_original_source_holdout_20261028.json
          git add -f "$QA"
          test "$(git diff --cached --name-only)" = "$QA"
          git diff --cached --check
          git commit -qm "qa(igp): independently measure C1 vs C0/B at 5 8 10s on held-out NBA games"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
               echo C1_ACTUAL_SOURCE_RESULTS_PUBLISHED_PRIVATE
               exit 0
            fi
            sleep "$attempt"
          done
          exit 13
