# Only aggregated source-QA counters reach public logs. Original SDK/companion
# content, player positions, and exact per-chain UTC data stay in private 104.
name: IGP 3.2 V3 companion clock corroboration 54 of 71
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-v3-companion-clock-54.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-v3-companion-clock
  cancel-in-progress: false
jobs:
  companion-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner and clone SHA-original source privately
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_companion_clock_corroboration_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_companion_clock_corroboration_v1.py'
          echo V3_COMPANION_CLOCK_SOURCE_FREE_GATES_PASS
      - name: Evaluate original companion Time events and 71-game strict S1
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_companion_clock_corroboration_v1.py \
            --root . --out "$RUNNER_TEMP/v3_clock_private.json" \
            >"$RUNNER_TEMP/v3_clock_private.log" 2>&1 || {
              echo V3_COMPANION_CLOCK_PRIVATE_ORIGINAL_SOURCE_AUDIT_FAILED
              tail -n 12 "$RUNNER_TEMP/v3_clock_private.log" | sed -E 's/[0-9]{10,}/[REDACTED]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'v3_clock_private.json').read_text())
          assert q['games_with_SHA_companion_time']==54
          assert q['original_games_total']==71
          assert len(q['games_without_SHA_companion_clock_evidence'])==17
          assert q['strict_S1_immutable'] and not q['source_XYZ_and_PBP_modified']
          assert q['S1E_confirmed_physical_live_samples']==0
          assert q['physically_certified_possession_boundaries']==0
          assert q['counts']['original_companion_time_events']==24873
          assert q['counts']['source_QA_complete_within_original_S1']>0
          print('V3_SHA_COMPANION_CLOCK_GATES_PASS_54_GAMES_NO_PHYSICAL_CLAIM')
          print('V3_COUNTS',json.dumps({
            'clock_corrob_outside_strict_S1':q['counts'].get('companion_corrob_outside_S1',0),
            'clock_corrob_inside_strict_S1':q['counts'].get('companion_corrob_in_S1',0),
            'chains_with_5plus_clock_corroboration':q['counts'].get('chains_with_5plus_clock_corrob',0)},sort_keys=True))
          PY
      - name: Preserve only immutable derived QA in the private 104 branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest="gamepulse/fusion/qa/igp_v32/igp_v32_v3_companion_clock_corrob_54_source_qa_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v3-clock "origin/$BRANCH"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/v3_clock_private.json" "$dest" || {
              echo V3_CLOCK_QA_EXISTING_CONFLICT
              exit 43
            }
            echo V3_COMPANION_CLOCK_QA_ALREADY_COMMITTED
            exit 0
          fi
          mkdir -p "$(dirname "$dest")"
          cp "$RUNNER_TEMP/v3_clock_private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): preserve 54-game SHA original companion clock V3 evidence'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo V3_COMPANION_CLOCK_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
