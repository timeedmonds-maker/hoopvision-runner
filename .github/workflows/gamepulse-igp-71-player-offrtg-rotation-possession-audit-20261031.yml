# Public orchestration only. Original NBA source and per-player QA remain private.
name: IGP 71game NBA player OffRtg POSS and rotation substitution disagreement audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-71-player-offrtg-rotation-possession-audit-20261031.yml']
permissions: {contents: read}
concurrency:
  group: igp-nba-71-player-advanced-substitution-possession-audit
  cancel-in-progress: false
jobs:
  original-71-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-71-player-advanced-rotation-possession-reconcile-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Clone SHA original private IGP and test source-free opponent/substitution boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
             https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m pip -q install duckdb
          python3 -m py_compile gamepulse/fusion/igp_v32_71_player_advanced_rotation_possession_audit_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_71_player_advanced_rotation_possession_audit_v1.py'
          echo IGP_PLAYER_ADVANCED_ROTATION_SOURCEFREE_POSS_AND_BOUNDARY_TESTS_PASS
      - name: Acquire the public upstream original-source-mirrored player/rotation Parquets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,urllib.request
          from pathlib import Path
          for name in ("player_game_logs","game_rotations"):
              url=f"https://basketball-data.billmill.org/nba/stats/{name}/season=2027/data.parquet"
              req=urllib.request.Request(url,headers={"User-Agent":"IGP-original-source-player-rotation-2027/1.0"})
              with urllib.request.urlopen(req,timeout=28) as r:
                  assert r.status==200
                  blob=r.read(15000001)
              assert len(blob)<15000000 and blob[:4]==b"PAR1" and blob[-4:]==b"PAR1"
              (Path(os.environ["RUNNER_TEMP"])/(name+".parquet")).write_bytes(blob)
              print("IGP_PLAYER_ROTATION_NBA_MIRROR_SOURCE_SHA",
                    name,hashlib.sha256(blob).hexdigest(),len(blob))
          PY
      - name: Exhaustive IGP 71 original PBP and official ten versus NBA player OffRtg/POSS and rotation stints
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if python3 gamepulse/fusion/igp_v32_71_player_advanced_rotation_possession_audit_v1.py \
            --root . \
            --player-parquet "$RUNNER_TEMP/player_game_logs.parquet" \
            --rotation-parquet "$RUNNER_TEMP/game_rotations.parquet" \
            --out "$RUNNER_TEMP/igp-71-player-sub-possession-qa.json" \
            >"$RUNNER_TEMP/igp-71-player-sub-possession-qa.log" 2>&1
          then
            python3 - <<'PY'
          from pathlib import Path
          import json,os
          f=Path(os.environ["RUNNER_TEMP"])/"igp-71-player-sub-possession-qa.json"
          d=json.loads(f.read_bytes());c=d["counts"]
          assert c["games"]==71 and c["original_logical_chains"]==14612
          assert c["player_rows"]>=1300 and d["sources"]["included_player_rows"]==c["player_rows"]
          print("IGP_PLAYER_OFFRTG_ROTATION_71_EXHAUSTIVE_SOURCE_COUNTS",json.dumps(c,sort_keys=True))
          print("IGP_PLAYER_OFFRTG_ROTATION_SOURCE_PRIVATE_QA_READY",d["sources"]["included_player_rows"],d["sources"]["included_rotation_stints"])
          PY
          else
            echo IGP_PLAYER_ROTATION_71_ORIGINAL_SOURCE_AUDIT_BLOCKED
            python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ["RUNNER_TEMP"])/"igp-71-player-sub-possession-qa.log").read_text(errors="replace").splitlines()
          v=next((x for x in reversed(s) if re.match(r"^(?:ValueError|KeyError|TypeError|AssertionError|duckdb\.[A-Za-z]+Exception):",x)),None)
          if v:
              name,_,detail=v.partition(":")
              code=detail.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_PLAYER_ROTATION_PRIVATE_AUDIT_FAILURE",name,code if re.fullmatch(r"[A-Z_]{6,120}",code) else "REDACTED")
          else:print("IGP_PLAYER_ROTATION_PRIVATE_AUDIT_FAILURE UNCLASSIFIED")
          PY
            exit 43
          fi
      - name: Store original-private immutable all71 per-player and substitution QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_71_nba_player_advanced_rotation_stint_possession_audit_v1.json
          mkdir -p "$(dirname "$dest")"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/igp-71-player-sub-possession-qa.json" "$dest"
            echo IGP_PLAYER_ADVANCED_PRIVATE_QA_SAME_SHA
            exit 0
          fi
          cp "$RUNNER_TEMP/igp-71-player-sub-possession-qa.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa: NBA player 71game advanced OffRtg POSS and rotation stint scorer/substitution audit'
          gh auth setup-git
          for n in 1 2 3 4; do
              git fetch -q origin "$BRANCH"
              git rebase -q "origin/$BRANCH" || exit 44
              if git push -q origin "HEAD:refs/heads/$BRANCH"; then
                  echo IGP_PLAYER_ROTATION_71_ORIGINAL_PRIVATE_QA_COMMITTED
                  exit 0
              fi
              sleep "$n"
          done
          exit 45
