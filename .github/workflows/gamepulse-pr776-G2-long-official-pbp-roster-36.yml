name: PR776 G2 official NBA PBP two-ended long roster alignment 36 games
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-long-official-pbp-roster-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-pr776-G2-official-roster-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard and private NBA approved originals
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free official NBA PBP adjacency and roster tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g2_official_pbp_longpair_roster_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_official_pbp_longpair_roster_2026.py' -v
          echo G2_SOURCE_FREE_NBA_PBP_AND_ROSTER_TESTS_PASSED
      - name: Evaluate 36 SHA-verified original NBA SDK frames and official PBP long pairs
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_official_pbp_long_pair_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_official_pbp_longpair_roster_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-G2-36-source.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          z=json.load(open(sys.argv[1]))
          t=z["totals"]
          assert z["source_games"]==36
          assert t["native_frames"]==1203986
          assert t["strict_frames"]==412619
          assert t["strict_frames"]+t["new_official_roster_pbp_pair_candidates"]+t["outside_strict_no_new_official_pair"]==1203986
          assert z["source_original_NBA_XYZ_is_accepted_measurement"]
          assert z["source_keyframes_player_ball_XYZ_unchanged"]
          assert z["provisional_source_ten_not_promoted"]
          assert not z["physical_live_play_or_custody_certified"]
          print("G2_ORIGINAL_NBA_OFFICIAL_TWO_ENDED_PBP_LONG_PAIR_36",json.dumps({
           "games":36,"native_frames":t["native_frames"],
           "gold_unchanged":t["strict_frames"],
           "new_official_two_ended_candidate_frames":t["new_official_roster_pbp_pair_candidates"],
           "new_source_direct_roster_slots":t["new_pbp_direct_official_player_xyz_slots"],
           "new_ball_frames":t["new_pbp_original_ball_xyz"],
           "new_exact_ten_source_match":t["new_pbp_source_exact_ten_match"],
           "new_exact_ten_source_conflict":t["new_pbp_source_exact_ten_conflict"],
           "more_than_ten_raw_actors":t["new_pbp_source_more_than_ten"]
          },sort_keys=True))
          PY
      - name: Publish aggregate original source results only to private PR branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_official_pbp_long_pair_36_v1.json
          git config user.name "Game Pulse Official NBA Time QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): 36-game SHA-verified official PBP long-pair lineup source candidate coverage"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo G2_ORIGINAL_NBA_OFFICIAL_PBP_36_PRIVATE_AGGREGATE_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          echo G2_PRIVATE_QA_COMMIT_FAILED >&2
          exit 13
