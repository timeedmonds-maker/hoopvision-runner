name: IGP P4 source-first original NBA native HOU MIL seven human marker heldout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p4-human-app-sourcefirst-native-heldout-v2.yml']
permissions: {contents: read}
concurrency:
  group: igp-p4-human-app-native-sourcefirst-g0138
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 3e137782f4348dffbd9451a812d7a6b0f8318189
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source confidentiality guard and original NBA source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free tests and original native source vs human app seven player marker holdout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_p4_human_app_sourcefirst_heldout_v2.py'
          if ! python3 gamepulse/fusion/igp_fusion_p4_human_app_sourcefirst_heldout_v2.py --root . --output "$RUNNER_TEMP/p4-app-sourcefirst.json" > "$RUNNER_TEMP/p4-app-sourcefirst.log" 2>&1; then
            echo IGP_P4_NATIVE_SOURCE_FIRST_HUMAN_APP_BENCHMARK_FAILED
            python3 - <<'PY'
          import re,os
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'p4-app-sourcefirst.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('IGP_P4_ORIGINAL_NATIVE_ERROR',re.sub(r'[^A-Za-z_]','_',last)[:90])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'p4-app-sourcefirst.json').read_text())
          source=j['G0_original_native_source_first']['heldout_source_original_app_pixels']
          candidate=j['G3_original_source_800ms_model_at_10hz']['heldout_source_model_app_pixels']
          assert j['game_id']=='0022600138'
          assert j['independent_of_fit_human_heldout_video_second']==11
          assert not j['original_camera_to_court_or_app_projection_refit']
          assert j['G3_original_source_800ms_model_at_10hz']['official_NBA_lineup_identity_grade']=='SOURCE_TEN_PROVISIONAL'
          assert j['G3_original_source_800ms_model_at_10hz']['not_canonical_800ms_official_live_window']
          assert 0<=source['model_matched_human_marker_count']<=7
          assert 0<=candidate['model_matched_human_marker_count']<=7
          assert source['model_abstained_markers']+source['model_matched_human_marker_count']==7
          assert candidate['model_abstained_markers']+candidate['model_matched_human_marker_count']==7
          assert j['newly_accepted_official_full_ten_scenes']==0
          assert j['independent_broadcast_physical_ball_3D_p95_ft'] is None
          print('IGP_P4_SOURCE_FIRST_SEVEN_HUMAN_APP_MARKERS',json.dumps({
             'human_labels':7,
             'official_accepted_returned':j['IGP_Fusion_accepted_800']['model_matched_human_marker_count'],
             'source_nearest_UTC_delta_ms':j['G0_original_native_source_first']['original_native_UTC_offset_ms'],
             'source_native_matched':source['model_matched_human_marker_count'],
             'source_native_app_px_p95':source['p95_heldout_app_render_error_px'],
             'native_source_model_matched':candidate['model_matched_human_marker_count'],
             'native_model_app_px_p95':candidate['p95_heldout_app_render_error_px'],
             'physical_foot_accuracy':None,'accepted_delta':0},sort_keys=True))
          PY
      - name: Keep source coordinates and human marked pixel comparisons PRIVATE only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_p4_human_app_sourcefirst_heldout_v2.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p4-sourcefirst-human-app "origin/$BRANCH"
          cp "$RUNNER_TEMP/p4-app-sourcefirst.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original NBA full-native player positions vs human app markers outside official window, source-only model preserved'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P4_ORIGINAL_SOURCEFIRST_HUMAN_APP_QA_SAVED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
