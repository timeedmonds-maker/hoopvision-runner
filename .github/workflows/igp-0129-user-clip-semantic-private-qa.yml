name: IGP 0129 clip semantic private-source QA
# Explicitly allowlisted by public data guard; no licensed coordinates in logs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-0129-user-clip-semantic-private-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Checkout verified private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Source-free clip tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_clip_semantic_evidence_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_clip_semantic_evidence_v1.py'
      - name: Run SHA-checked annotated substitution and clock acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_0129_clip_semantic_acceptance_20261030.py
          python3 gamepulse/fusion/igp_0129_clip_semantic_acceptance_20261030.py \
            --root . \
            --output gamepulse/fusion/qa/igp_progress_20261030/igp_0129_annotated_clip_official_qa_v1.json \
            > "$RUNNER_TEMP/clip-qa-private.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'clip-qa-private.json').read_text())
          assert q['observations']==15
          assert q['source_verified_official_event_links']==28
          assert len(q['substitution_groups'])==2
          assert q['native_source_utc_mapping_verified'] is False
          assert q['independently_certified_physical_possessions_added']==0
          print('IGP_CLIP_0129_OFFICIAL_ACTION_QA_PASS',15,28,2)
          PY
      - name: Real private source SHA readback and event QA (no XYZ in public logs)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json
          from pathlib import Path
          from igp_clip_semantic_evidence_v1 import inspect
          from igp_native_scene_season_68_benchmark_v1 import load_game
          from query_igp_season68_native_scene_batch_v1 import batch
          root=Path('.')
          d=root/'gamepulse/fusion/qa/igp_progress_20261030'
          ledger=json.loads((d/'igp_0129_user_clip_semantic_ledger_v1.json').read_bytes())
          qa=json.loads((d/'igp_0129_user_clip_semantic_validation_v1.json').read_bytes())
          assert ledger['clip_sha256']==qa['clip_sha256']
          result=inspect(root,ledger,0,ledger['duration_ms'],100)
          assert result['observations_returned']==15
          assert result['matched_official_actions']==28
          assert result['video_source_utc_calibrated'] is False
          for row in result['rows']:
              assert row['native_source_frame_utc_ms'] is None
              for action in row['matched_official_pbp']:
                  for key in ('lineup_before_full_substitution_group','lineup_after_full_substitution_group'):
                      group=action[key]
                      if group is not None:
                          assert set(group)=={'DET','NYK'}
                          assert all(len(ids)==5 for ids in group.values())
          frames,manifest,manifest_sha=load_game(root,'0022600129')
          assert len(frames)==36215
          assert manifest_sha==ledger['original_native_game_manifest_sha256']
          assert sum('ball' in xyz for t,xyz in frames)==27828
          original=dict(frames)
          timestamps=[frames[len(frames)//3][0],frames[len(frames)//2][0]]
          native=batch(root,'0022600129',timestamps,nearest_tolerance_ms=0,max_side_ms=800)
          assert native['matched_count']==2
          tested=0
          for s in native['scenes']:
              scene=s['scene']
              assert scene is not None
              reference=original[s['matched_native_utc_ms']]
              for pid,actor in scene['players_by_source_id'].items():
                  if actor['grade']=='ORIGINAL_SDK_DIRECT':
                      assert actor['xyz_native']==reference[pid]
                      tested+=1
              ball=scene['ball']
              if ball and ball['grade']=='ORIGINAL_SDK_DIRECT':
                  assert ball['xyz_native']==reference['ball']
          assert tested>0
          print('IGP_0129_CLIP_PRIVATE_SHA_READBACK_PASS', 'screen_action_refs=28',
                'source_native_frames=36215','source_direct_players_checked='+str(tested),
                'physical_possessions_certified=0', 'independent_video_accuracy=UNMEASURED')
          PY
      - name: SHA-native actor identity probe at 18 annotated official action UTCs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_0129_clip_official_native_actor_probe_v1.py
          python3 gamepulse/fusion/igp_0129_clip_official_native_actor_probe_v1.py \
            --root . \
            --output gamepulse/fusion/qa/igp_progress_20261030/igp_0129_clip_official_event_native_actor_probe_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_progress_20261030/igp_0129_clip_official_event_native_actor_probe_v1.json')
          q=json.loads(p.read_bytes())
          assert q['counts']['annotated_ordinary_nba_actions']==18 and len(q['rows'])==18
          assert q['physical_possessions_certified']==0
          assert q['independent_animation_to_original_source_UTC_holdout'] is False
          assert q['source_actor_ID_comparison_is_not_true_visual_physical_player_accuracy']
          print('IGP_0129_IDENTITY_PROXY_QA_PASS',
                q['counts']['source_frame_found'],q['counts']['selected_official_all10_frames'])
          PY
      - name: Official-ten-conditioned native scene A/B on same 18 source times
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_0129_official_roster_native_scene_ab_v1.py
          python3 gamepulse/fusion/igp_0129_official_roster_native_scene_ab_v1.py \
            --root . \
            --output gamepulse/fusion/qa/igp_progress_20261030/igp_0129_official_roster_conditioned_scene_ab_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('gamepulse/fusion/qa/igp_progress_20261030/igp_0129_official_roster_conditioned_scene_ab_v1.json').read_bytes())
          s=q['summary']
          assert s['annotated_official_actions']==18
          assert s['conditioned_official_player_slots']>=s['unconstrained_official_player_slots']
          assert s['conditioned_complete10']>=s['unconstrained_complete10']
          assert s['conditioned_incorrect_exclusion']==0
          assert q['physical_possessions_certified']==0
          assert not q['official_PBP_action_UTC_to_source_time_independently_verified']
          print('IGP_OFFICIAL_ROSTER_CONDITIONED_SOURCE_PROXY_QA',
                s['unconstrained_complete10'],s['conditioned_complete10'])
          PY
      - name: Persist accepted clip QA only to private canonical branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          qa=gamepulse/fusion/qa/igp_progress_20261030/igp_0129_annotated_clip_official_qa_v1.json
          actor_qa=gamepulse/fusion/qa/igp_progress_20261030/igp_0129_clip_official_event_native_actor_probe_v1.json
          ab_qa=gamepulse/fusion/qa/igp_progress_20261030/igp_0129_official_roster_conditioned_scene_ab_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('gamepulse/fusion/qa/igp_progress_20261030/igp_0129_annotated_clip_official_qa_v1.json').read_text())
          assert q['observations']==15 and q['source_verified_official_event_links']==28
          assert len(q['substitution_groups'])==2 and q['independently_certified_physical_possessions_added']==0
          assert not q['native_source_utc_mapping_verified']
          assert all(x['before_players_per_team']=={'DET':5,'NYK':5} and
                     x['after_players_per_team']=={'DET':5,'NYK':5} for x in q['substitution_groups'])
          PY
          cp "$qa" "$RUNNER_TEMP/igp0129-private-qa.json"
          cp "$actor_qa" "$RUNNER_TEMP/igp0129-native-id-qa.json"
          cp "$ab_qa" "$RUNNER_TEMP/igp0129-conditioned-ab-qa.json"
          git fetch -q origin "$BRANCH"
          git checkout -q -B clip-qa-staging "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp0129-private-qa.json" "$qa"
          cp "$RUNNER_TEMP/igp0129-native-id-qa.json" "$actor_qa"
          cp "$RUNNER_TEMP/igp0129-conditioned-ab-qa.json" "$ab_qa"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$qa" "$actor_qa" "$ab_qa"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_0129_CLIP_SHA_QA_ALREADY_ACCEPTED
            exit 0
          fi
          git commit -q -m 'qa(igp): accept source-verified 0129 annotation and official lineup replay'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_0129_CLIP_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
