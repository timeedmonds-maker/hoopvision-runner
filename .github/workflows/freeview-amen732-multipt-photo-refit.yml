name: Amen 732 physical full-arc photometric refit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-multipt-photo-refit.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: freeview-amen732-multipt-photo-refit
  cancel-in-progress: false
jobs:
  real-original-nba:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify source boundary, clone private original NBA stills via Git
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth 1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo AMEN732_PRIVATE_NBA_ORIGINAL_3PT_SOURCE_ACCESS_PASS
      - name: Multi-point NBA world projection on actual original 960x540 RGB
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            numpy==1.26.4 scipy==1.14.1 opencv-python-headless==4.10.0.84
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH="$PWD/hoopvision/freeview"
          python3 hoopvision/freeview/amen732_multipt_3pt_photo_refit.py --selftest
          if [ ! -f hoopvision/freeview/fixtures/amen732_multipt_3pt_photo_refit_source_holdout_v1.json ]; then
            python3 hoopvision/freeview/amen732_multipt_3pt_photo_refit.py \
              --root hoopvision/freeview/fixtures \
              --camera hoopvision/freeview/fixtures/amen732_right_above_rim_world_camera_trial_20261026.json \
              --colour hoopvision/freeview/fixtures/amen732_two_original_frame_rim_source_colour_20261026.json \
              --out hoopvision/freeview/fixtures/amen732_multipt_3pt_photo_refit_source_holdout_v1.json
          else
            echo AMEN732_ORIGINAL_MULTIPOINT_SOURCE_QA_ALREADY_PRESENT
          fi
          python3 - <<'PY'
          import json
          p="hoopvision/freeview/fixtures/amen732_multipt_3pt_photo_refit_source_holdout_v1.json"
          j=json.load(open(p))
          assert j['train_original_frame']==231
          assert j['withheld_original_frame']==234
          assert len(j['all_training_selected_candidates'])==4
          assert j['stale_manual_clicked_rim_should_not_be_used_as_ground_truth']
          assert not j['true_nba_KRt_metric_certified']
          assert not j['true_25deg_UHD_source_supported_replay']
          print('AMEN732_MULTIPOINT_REAL_SOURCE_CAMERA_QA',
                j['prior']['training_p95_px'],j['new']['training_p95_px'],
                j['prior']['heldout_colour_rim_error_px'],
                j['new']['heldout_colour_rim_error_px'])
          PY
      - name: Commit only source-derived QA to private repository; no public raw pixels
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'HoopVision original source CPU'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_multipt_3pt_photo_refit_source_holdout_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo AMEN732_SOURCE_ALREADY_PRESERVED
            exit 0
          fi
          git commit -qm 'qa(freeview): NBA source full-court 3PT photometric pose refinement versus withheld rim and second image'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_ORIGINAL_NBA_MULTIPOINT_PHOTO_QA_PRIVATE_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
