name: IPPT halfcourt evidence and predictive dual benchmark
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-halfcourt-dual-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ippt-halfcourt-source-20261028
  cancel-in-progress: false
jobs:
  halfcourt:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/ippt-halfcourt-dual-track-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard and private original NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free halfcourt classifier regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_halfcourt_selector_2026.py \
             gamepulse/fusion/igp_ippt_halfcourt_dual_benchmark_2026.py
          python3 -m unittest gamepulse/fusion/test_igp_ippt_halfcourt_selector_2026.py -v
      - name: Private SHA-backed two-game evidence/predictive halfcourt pilot
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from igp_ippt_halfcourt_dual_benchmark_2026 import run_game
          for gid in ("0022600009","0022600092"):
              q=run_game(".",gid,stride=10)
              assert q["source_native_unique_UTC_and_SDK_XYZ_immutable"]
              assert q["original_NBA_logical_chains"]>100
              c=q["counts"]
              print("IPPT_HALFCOURT_TWO_GAME_SHA_PILOT",gid,{
                  "source_frames":q["original_native_frames"],
                  "half_court_sample_frames":c.get("halfcourt_frames",0),
                  "half_court_evidence_direct":c.get("halfcourt_evidence_direct_ten_ball_official_compatible",0),
                  "half_court_evidence_G3":c.get("halfcourt_evidence_plus_G3_ten_ball_official_compatible",0),
                  "half_court_IPPT_v01":c.get("halfcourt_IPPT_v01_ten_ball_estimate",0),
                  "half_court_IPPT_v02":c.get("halfcourt_IPPT_v02_ten_ball_estimate",0)})
          PY
      - name: All36 private SHA evidence-based original and G3 versus predictive v0.1 v0.2
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json
          from igp_ippt_halfcourt_dual_benchmark_2026 import run_all
          r=run_all(".",stride=10)
          c=r["counts"]
          for k in ("halfcourt_frames","other_logged_unknown_or_transition_frames"):
              assert c.get(k,0)>0,(k,c.get(k,0))
          print("IPPT_HALFCOURT_DUAL_ALL36_ACCEPTED",json.dumps({
            "games":r["games"],
            "stride":r["sample_stride"],
            "counts":c,
            "strict_semantics":"ball original 2sec frontcourt dwell with unique NBA logged chain; not independently certified halfcourt"})
          )
          PY

# Reviewed private-source aggregate-only workflow; licensed XYZ never printed.


      - name: Original halfcourt versus other-logged blackout errors at 2 5 10s
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_halfcourt_masked_accuracy_2026.py
          python3 - <<'PY'
          from igp_ippt_halfcourt_dual_benchmark_2026 import annotated_frames
          from igp_ippt_halfcourt_masked_accuracy_2026 import run
          for gid in ("0022600009","0022600092"):
              raw,g4,rosters,sha=annotated_frames(".",gid)
              for ms in (2000,5000,10000):
                  q=run(raw,g4["native_frames"],window_ms=ms,windows=12)
                  for group in ("half_court_proxy","other_unique_logged"):
                      assert q["cohorts"][group]["original_position_masked_for_evaluation"]>0
                  print("IPPT_HALFCOURT_BLACKOUT_ORIGINAL_QA",gid,ms,{
                    "half_court":q["cohorts"]["half_court_proxy"],
                    "other_logged":q["cohorts"]["other_unique_logged"],
                    "note":"Retrospective cohort from original-ball pre-mask; errors not independent from selection"})
          PY
      - name: Private halfcourt possession search original and predictive QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_ippt_halfcourt_dual_2026.py
          python3 - <<'PY'
          from query_igp_ippt_halfcourt_dual_2026 import search
          for gid in ("0022600009","0022600092"):
              direct=search(".",gid,model="direct",limit=2)
              accepted=search(".",gid,model="evidence",limit=2)
              predictive=search(".",gid,model="predictive",limit=2)
              assert direct["total_matching_source_frames"]>100
              assert (direct["total_matching_source_frames"]==
                  accepted["total_matching_source_frames"]==
                  predictive["total_matching_source_frames"])
              assert len(direct["rows"])==len(accepted["rows"])==len(predictive["rows"])==2
              assert all(r["original_coordinates_never_overwritten"] for r in
                 (direct,accepted,predictive))
              print("IPPT_HALFCOURT_PRIVATE_SEARCH_PASS",gid,{
                "frames_queryable":direct["total_matching_source_frames"],
                "modes":["direct","evidence","predictive"],
                "source_preserved":True})
          PY
