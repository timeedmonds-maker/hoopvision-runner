name: CPU Animate synthetic transfer check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpu-animate-transfer-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-file-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Guard no sensitive data in transfer
        run: |
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/cpu-animate-transfer-probe.yml'])
          print('SYNTHETIC_ONLY_TRANSFER_GUARD_PASS')
          PY
      - name: Create harmless synthetic sample
        run: |
          printf 'CPU ANIMATE FILE BRIDGE SYNTHETIC ONLY - V50 20261113\n' > synthetic_test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-animate-synthetic-test
          path: synthetic_test.txt
          retention-days: 1
