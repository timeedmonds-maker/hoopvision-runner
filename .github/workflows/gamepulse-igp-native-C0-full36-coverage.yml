name: "IGP 36-game original native official-ten bounded C0 coverage"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-native-C0-full36-coverage.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-native-strict-36-C0-coverage
  cancel-in-progress: false
jobs:
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify safe public boundary and clone accepted private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Source-free original player slot and ball gate tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_native_shortgap_C0_36_coverage_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_native_shortgap_C0_36_coverage_v1.py'
      - name: Validate two real NBA games before full36 original native census
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_native_shortgap_C0_36_coverage_v1.py \
            --root . --games 0022600009 0022600092 \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_native_2game_shortgap_C0_coverage_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_native_2game_shortgap_C0_coverage_v1.json")
          q=json.loads(p.read_text())
          c=q["counts"]
          assert q["tested_source_games"]==2
          assert c["frames_source_actor_compatible"]>100
          assert c["direct_ten_ball_frames"]>0
          assert c["C0_ten_ball_frames"]>=c["direct_ten_ball_frames"]
          assert q["independently_certified_complete_physical_possessions"]==0
          print("IGP_2_SOURCE_GAMES_C0_NATIVE_COVERAGE_GATE_PASS",json.dumps({
              "frames":c["frames_source_actor_compatible"],
              "direct":c["direct_ten_ball_frames"],
              "C0":c["C0_ten_ball_frames"]},sort_keys=True))
          PY
      - name: Count all 36 original games strict official-ten source XYZ with bounded 2s C0
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_native_shortgap_C0_36_coverage_v1.py --root . \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_native_36game_shortgap_bounded_coverage_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_native_36game_shortgap_bounded_coverage_v1.json")
          q=json.loads(p.read_bytes())
          c=q["counts"]
          assert q["tested_source_games"]==36 and len(q["games"])==36
          assert c["original_native_frames"]==1203986
          assert c["frames_strict_official_ten_window"]>=10000
          assert c["direct_ten_ball_frames"]>0
          assert c["C0_ten_ball_frames"]>=c["direct_ten_ball_frames"]
          assert c["direct_official_player_slots"]<=10*c["frames_source_actor_compatible"]
          assert q["original_tracking_and_lineup_immutable"]
          assert q["model_not_production_promoted"]
          print("IGP_SOURCE_36_NATIVE_C0_COVERAGE_QA_PASS",json.dumps({
             "original_frames":c["original_native_frames"],
             "strict_compatible":c["frames_source_actor_compatible"],
             "original_direct_ten_ball":c["direct_ten_ball_frames"],
             "bounded_C0_ten_ball":c["C0_ten_ball_frames"],
             "bounded_B_ten_ball":c["B_ten_ball_frames"],
             "new_C0_actor_slots":c["C0_bounded_player_slots"],
             "full_video_certified_possessions":0},sort_keys=True))
          PY
      - name: Commit private-only source-native QA receipts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_native_2game_shortgap_C0_coverage_v1.json \
            gamepulse/fusion/qa/igp_progress_20261029/igp_native_36game_shortgap_bounded_coverage_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): 36-game source-native official-ten bounded C0 player/ball availability"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_ALL36_NATIVE_C0_COVERAGE_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$try"
          done
          exit 23
