name: IPPT source anchored ten plus ball all36 audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-source-ten-coverage-all36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  all36:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      SOURCE_SHA: 13fcb0ecea71f4716133918c264646b22bc44f45
      BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify SHA and run source-first private all36 audit
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SOURCE_SHA"
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_source_anchored_allnative_recovery_36_2026.py
          python3 gamepulse/fusion/igp_ippt_source_anchored_allnative_recovery_36_2026.py --root . --out gamepulse/fusion/qa/ippt_all36_source_anchored_ten_v1.json > "$RUNNER_TEMP/private-results.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/ippt_all36_source_anchored_ten_v1.json")
          a=json.loads(p.read_text());c=a["counts"]
          assert a["source_games"]==36 and c["native_frames"]==1203986
          assert c["G2_official_ten_candidate_frames"]==580047
          assert c["raw_source_frames_with_ball"]==912704
          assert c["G2_source_combined_G3_ten_ball_frames"]>=359869
          assert a["source_only_lineups_are_provisional"]
          safe={"run_id":os.environ["GITHUB_RUN_ID"],"job_status":"success","source_code_sha":os.environ["SOURCE_SHA"],"aggregates":c,"physical_accuracy_video_certified":False}
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(json.dumps(safe,indent=2,sort_keys=True))
          print("IPPT_SHA_ALL36_SOURCE_ANCHORED_TEN_COVERAGE_PASS",json.dumps(c,sort_keys=True))
          PY
      - name: Publish aggregate-only audit outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"]);p=root/"safe.json"
          x=json.loads(p.read_text()) if p.exists() else {"run_id":os.environ["GITHUB_RUN_ID"],"job_status":os.environ["STATUS"]}
          (root/"comment.md").write_text("Original NBA source anchored candidate ten audit, aggregate only.\n\n~~~json\n"+json.dumps(x,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/comment.md"
