name: Inspect Prepared L4 Runtime
# release-candidate-attestation-20260925
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-l4-runtime.yml'
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-southeast1-c
  INSTANCE: hv-dev-l4
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect runtime
        shell: bash
        run: |
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="
            set -e
            echo '=== GPU ==='
            nvidia-smi --query-gpu=name --format=csv,noheader
            echo '=== CONTAINERS ==='
            sudo docker ps --format '{{.ID}} {{.Image}} {{.Names}} {{.Status}}'
            echo '=== IMAGES ==='
            sudo docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | head -20
            echo '=== MODEL CACHE ==='
            sudo find /srv/hoopvision/models -maxdepth 5 -type f \( -name 'sam3.1_multiplex.pt' -o -name 'rfdetr_m_640.onnx' -o -name 'court_yolo11m_pose.pt' -o -name 'model.safetensors' -o -name '*soccernet*' \) -printf '%p %s\n' 2>/dev/null | head -30
            echo '=== COMMERCIAL MARKERS ==='
            sudo cat /srv/hoopvision/commercial-prepared.candidate.sha 2>/dev/null || true
            sudo cat /srv/hoopvision/commercial-prepared.control-bundle.sha256 2>/dev/null || true
            echo '=== SUPERVISOR STATUS ==='
            sudo systemctl --no-pager --full status hoopvision-dev-supervisor.service || true
            echo '=== SUPERVISOR JOURNAL ==='
            sudo journalctl -u hoopvision-dev-supervisor.service -n 120 --no-pager || true
          "
