name: Private release direct asset read probe
on:
  push:
    branches: [agent/jabari616-steady-floor-fred]
    paths: [.github/workflows/jabari616-source-direct-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Report private token API budget
        shell: bash
        run: |
          set -euo pipefail
          gh api rate_limit --jq '.resources.core | {remaining, reset}'
