name: Private release direct asset read probe
on:
  push:
    branches: [agent/jabari616-steady-floor-fred]
    paths: [.github/workflows/jabari616-source-direct-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Verify direct private release URL without API listing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 3
          curl --fail --silent --show-error --location --max-time 90 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/octet-stream' \
            'https://github.com/timeedmonds-maker/104/releases/download/clip-lab-hls-0022600091-616/event616-broadcast.mp4' \
            -o "$RUNNER_TEMP/source.mp4"
          echo '9df90d9f76b3bf2f9698ac3d1c25016eb8adfab27dc65b12c3202e7b661e8aba  '"$RUNNER_TEMP/source.mp4" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/source.mp4")" = 8352439
          echo VERIFIED_DIRECT_PRIVATE_SOURCE
