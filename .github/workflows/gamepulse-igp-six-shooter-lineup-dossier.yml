name: "IGP source-verified six-shot original lineup conflict dossier"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-six-shooter-lineup-dossier.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-six-companion-shooter-source-dossier
  cancel-in-progress: false
jobs:
  real-source-identity-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public boundary and fetch SHA-provenanced private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Test fail-closed snapshot and official-substitution logic
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_companion_official_shooter_conflict_dossier_v1.py \
            gamepulse/fusion/test_igp_companion_official_shooter_conflict_dossier_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_companion_official_shooter_conflict_dossier_v1.py'
      - name: Validate all 54 authentic event packages and identify every shooter conflict
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_companion_official_shooter_conflict_dossier_v1.py \
            --root . \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_companion_official_shooter_lineup_conflicts_54_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_companion_official_shooter_lineup_conflicts_54_v1.json")
          q=json.loads(p.read_bytes())
          assert q["source_games"]==54 and q["companion_events_immutable"]==78690
          assert q["official_shooter_matched_original_shots"]==9077
          assert q["shot_lineup_source_window_180s_denominator"]==7295
          assert q["conflicts"]==len(q["cases"])==6
          assert len(q["source_games_with_conflicts"])==5
          assert q["model_coordinates_changed"]==q["video_certified_shots"]==0
          assert all(x["interpretation"].endswith("NO_PLAYER_ID_PROMOTION") for x in q["cases"])
          print("IGP_SIX_SHOT_LINEUP_SOURCE_CONFLICTS_QA_PASS",json.dumps({
            "games":54,"original_app_events":78690,"compared_shot_lineups":7295,
            "source_lineup_conflicts":6,"start_time_shooter_restored":q["summary"].get("start_snapshot_contains_shooter",0),
            "future_30s_observation_shooter_restored":q["summary"].get("future_30s_snapshot_contains_shooter",0),
            "original_player_coordinates_promoted":0,"physical_video_shots_certified":0},sort_keys=True))
          PY
      - name: Commit only private identity-conflict QA receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_companion_official_shooter_lineup_conflicts_54_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): SHA-provenanced six NBA source shot-lineup identity conflicts"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_SIX_SHOT_LINEUP_IDENTITY_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$try"
          done
          exit 23
