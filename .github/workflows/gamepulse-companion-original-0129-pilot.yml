name: Integrated Pulse original companion event response pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-companion-original-0129-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-companion-original-0129-private
  cancel-in-progress: false
jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce public content boundary
        run: python3 tools/public_content_guard.py
      - name: GET original event stream without credentials or access-control bypass
        env:
          GID: '0022600129'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.error,urllib.request
          from pathlib import Path
          gid=os.environ["GID"]
          url="https://nba-cdn.cloud.easelive.tv/api/v1/programs/companion-"+gid+"/events"
          root=Path(os.environ["RUNNER_TEMP"])
          status="UNAVAILABLE";body=b""
          for attempt in range(3):
              try:
                  req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"IntegratedPulse-SourceRecovery/1.0"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      status="HTTP_"+str(response.status)
                      body=response.read(32_000_001)
                  if len(body)>32_000_000:status="OVERSIZE";body=b""
                  break
              except urllib.error.HTTPError as exc:
                  status="HTTP_"+str(exc.code)
                  if exc.code not in (429,500,502,503,504):break
              except (urllib.error.URLError,TimeoutError):
                  status="NETWORK_ERROR"
              if attempt<2:time.sleep(2*(attempt+1))
          record={"schema":"igp.companion-original-http-pilot.v1","game_id":gid,
                  "endpoint_path":"/api/v1/programs/companion-"+gid+"/events",
                  "http_status":status,"auth_context":"NONE","raw_bytes_sha256":None,
                  "raw_bytes":0,"source_event_count":None,"raw_data_private_only":True}
          if status=="HTTP_200":
              try:
                  data=json.loads(body)
                  events=data if isinstance(data,list) else data.get("events") if isinstance(data,dict) else None
                  record["json_schema_grade"]="EVENT_ARRAY" if isinstance(events,list) else "JSON_OTHER"
                  record["source_event_count"]=len(events) if isinstance(events,list) else None
                  record["raw_bytes_sha256"]=hashlib.sha256(body).hexdigest()
                  record["raw_bytes"]=len(body)
                  (root/"companion-original.json").write_bytes(body)
              except (ValueError,TypeError):
                  record["http_status"]="HTTP_200_INVALID_JSON"
          (root/"companion-source-qa.json").write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("IGP_COMPANION_0129_HTTP_PROBE",json.dumps({
              "status":record["http_status"],"bytes":record["raw_bytes"],
              "events":record["source_event_count"],"schema":record.get("json_schema_grade")},sort_keys=True))
          PY
      - name: Keep exact original response in private release and SHA read back
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/companion-original.json"; then
            tag=igp-companion-original-0022600129
            if ! gh release view "$tag" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
              gh release create "$tag" --repo timeedmonds-maker/104 --target main --title "$tag" --notes 'Immutable original companion event JSON; source QA in private research branch' --latest=false
            fi
            if ! gh release view "$tag" --repo timeedmonds-maker/104 --json assets --jq '.assets[].name' | grep -qx companion-original.json; then
              gh release upload "$tag" "$RUNNER_TEMP/companion-original.json" --repo timeedmonds-maker/104
            fi
            mkdir -p "$RUNNER_TEMP/source-readback"
            gh release download "$tag" --pattern companion-original.json --dir "$RUNNER_TEMP/source-readback" --repo timeedmonds-maker/104
            cmp "$RUNNER_TEMP/companion-original.json" "$RUNNER_TEMP/source-readback/companion-original.json"
            echo IGP_COMPANION_ORIGINAL_PRIVATE_SHA_READBACK_PASS
          fi
      - name: Commit private source availability receipt without payload
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b research/gamepulse-clock-boundary-integrity-20261025 https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion/qa
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261029/igp_companion_original_http_0022600129_v1.json
          mkdir -p "$(dirname "$dest")"
          cp "$RUNNER_TEMP/companion-source-qa.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): record Oct27 original companion event source availability'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin research/gamepulse-clock-boundary-integrity-20261025
            git rebase -q origin/research/gamepulse-clock-boundary-integrity-20261025
            if git push -q origin HEAD:refs/heads/research/gamepulse-clock-boundary-integrity-20261025; then
              echo IGP_COMPANION_PRIVATE_SOURCE_RECEIPT_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
