name: IGP 54-game companion clock and NBA PBP source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-companion-pbp-clock-agreement-v1.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-original-companion-clock-pbp-v1
  cancel-in-progress: false
jobs:
  real-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner and clone private original NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
             https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Run clock regression and SHA-backed all54 real-game audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_companion_pbp_clock_agreement_v1.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_companion_pbp_clock_agreement_v1.py' -v
          python3 gamepulse/fusion/igp_companion_pbp_clock_agreement_v1.py --root . > "$RUNNER_TEMP/clock-private.log"
          python3 - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          root=Path('gamepulse/fusion')
          report=root/'qa/igp_progress_20261029/igp_companion_pbp_clock_grades_v1.json'
          r=json.loads(report.read_bytes())
          app=json.loads((root/'qa/igp_progress_20261029/igp_companion_app_packages_all56_qa_v1.json').read_bytes())
          totals=r['totals']
          assert totals['games']==len(r['games'])==54
          assert sum(g['original_companion_time_events'] for g in r['games'].values())==24873
          assert totals['official_actions']>25000
          assert 0<totals['within_2s']<=totals['official_actions']
          assert r['source_original_companion_event_count_baseline']==78690
          assert app['original_source_event_records']==78690
          assert not r['independent_video_clock_certified'] and r['physical_possessions_certified']==0
          for gid,g in r['games'].items():
              assert g['original_companion_response_sha256']==app['games'][gid]['original_response_sha256']
              p=Path(g['path'])
              assert hashlib.sha256(p.read_bytes()).hexdigest()==g['source_sha256']
              rows=[json.loads(x) for x in gzip.decompress(p.read_bytes()).splitlines()]
              assert len(rows)==g['official_actions']==sum(g['grades'].values())
              assert all(not x['source_clock_exact_physical_time_certified'] for x in rows)
          ip=root/'materialized/igp_2026_27_unified_season_v3/index.json'
          idx=json.loads(ip.read_bytes())
          assert idx['official_games']==56 and idx['physical_possession_certified']==0
          assert 'original_nba_companion_pbp_clock_grades' not in idx, 'REFUSE_INDEX_OVERWRITE'
          idx['original_nba_companion_pbp_clock_grades']={
              'qa_path':str(report),'qa_sha256':hashlib.sha256(report.read_bytes()).hexdigest(),
              'source_original_companion_games':54,'official_games_in_model':56,
              'per_game_partitions':'gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/companion_pbp_clock_grades_v1/',
              'grade_type':'logged-PBP versus source companion clock agreement, NOT physical time',
              'independent_physical_clock_certified':False}
          ip.write_text(json.dumps(idx,sort_keys=True,indent=2)+'\n')
          print('IGP_SOURCE_CLOCK_PBP_54GAME_PASS',json.dumps({
              'games':54,'actions':totals['official_actions'],
              'nearby_clock':totals['within_2s'],
              'agree_le_1s':totals.get('AGREE_LE_1S',0),
              'agree_le_2s':totals.get('AGREE_LE_2S',0),
              'conflict_gt_3s':totals.get('CONFLICT_GT_3S',0),
              'physical_possessions_certified':0},sort_keys=True))
          PY
      - name: Commit new graded sidecar to same canonical private 56-game index
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/companion_pbp_clock_grades_v1 \
             gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json \
             gamepulse/fusion/qa/igp_progress_20261029/igp_companion_pbp_clock_grades_v1.json
          git diff --cached --check
          git commit -q -m 'data(igp): accept 54-game companion-PBP clock grades with original SHA'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_CLOCK_GRADES_ACCEPTED_PRIVATE
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
