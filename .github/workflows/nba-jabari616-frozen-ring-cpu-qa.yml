name: Jabari616 original frozen ring CPU acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-jabari616-frozen-ring-cpu-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-ring-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy-check exact public CPU test bridge
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          p='.github/workflows/nba-jabari616-frozen-ring-cpu-qa.yml'
          assert not scan([p]),'Privacy guard rejected ring test bridge'
          print('FROZEN_RING_BRIDGE_GUARD_PASS')
          PY
      - name: Exercise unchanged v1.3 renderer, strict original source admission
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_SOURCE_TOKEN_MISSING; exit 3; }
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          mkdir -p "$ROOT/nba/qa"
          REF='courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022'
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/nba_pulse_frozen_ring_cpu.py?ref=$REF" --jq .content | base64 -d > "$ROOT/nba/nba_pulse_frozen_ring_cpu.py"
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/qa/test_nba_pulse_frozen_ring_cpu.py?ref=$REF" --jq .content | base64 -d > "$ROOT/nba/qa/test_nba_pulse_frozen_ring_cpu.py"
          gh api "repos/timeedmonds-maker/104/contents/tools/locked_broadcast_screen_v5_rings.py?ref=courtcoder%2Fintegration" --jq .content | base64 -d > "$ROOT/frozen.py"
          python3 -m pip install --disable-pip-version-check --quiet opencv-python-headless==4.10.0.84 'numpy<2' pillow
          export COURTCODER_FROZEN_SOURCE_FILE="$ROOT/frozen.py"
          PYTHONPATH="$ROOT/nba" python3 -m unittest discover -s "$ROOT/nba/qa" -p test_nba_pulse_frozen_ring_cpu.py -v
