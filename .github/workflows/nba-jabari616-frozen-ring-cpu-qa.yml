name: Original frozen CourtCoder ring CPU acceptance
# Source-of-truth: unchanged frozen HoopVision v1.3 engine, NOT the Jabari3 replica.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-jabari616-frozen-ring-cpu-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-ring-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy-check exact public CPU test bridge
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          p='.github/workflows/nba-jabari616-frozen-ring-cpu-qa.yml'
          assert not scan([p]),'Privacy guard rejected ring test bridge'
          print('FROZEN_RING_BRIDGE_GUARD_PASS')
          PY
      - name: Exercise unchanged v1.3 renderer, strict original source admission
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_SOURCE_TOKEN_MISSING; exit 3; }
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          mkdir -p "$ROOT/nba/qa"
          REF='courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022'
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/nba_pulse_frozen_ring_cpu.py?ref=$REF" --jq .content | base64 -d > "$ROOT/nba/nba_pulse_frozen_ring_cpu.py"
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/qa/test_nba_pulse_frozen_ring_cpu.py?ref=$REF" --jq .content | base64 -d > "$ROOT/nba/qa/test_nba_pulse_frozen_ring_cpu.py"
          gh api "repos/timeedmonds-maker/104/contents/tools/locked_broadcast_screen_v5_rings.py?ref=courtcoder%2Fintegration" --jq .content | base64 -d > "$ROOT/frozen.py"
          python3 -m pip install --disable-pip-version-check --quiet opencv-python-headless==4.10.0.84 'numpy<2' pillow
          export COURTCODER_FROZEN_SOURCE_FILE="$ROOT/frozen.py"
          PYTHONPATH="$ROOT/nba" python3 -m unittest discover -s "$ROOT/nba/qa" -p test_nba_pulse_frozen_ring_cpu.py -v
          python3 - <<'PY'
          import importlib.util,json,os,time,cv2,numpy as np
          from pathlib import Path
          source=Path(os.environ['COURTCODER_FROZEN_SOURCE_FILE'])
          spec=importlib.util.spec_from_file_location('original_frozen_v13',source)
          module=importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          assert module.TOOL_ID=='HOOPVISION_1_3_RINGS'
          blank=np.full((512,908,3),(96,141,172),np.uint8)
          matte=np.zeros((512,908),np.uint8)
          t0=time.perf_counter()
          for i in range(246):
            frame=blank.copy()
            for pid,x,y in [(201142,480,230),(203500,560,260)]:
              module.draw_ring(frame,x,y-4,(65,17,206),35,13,t=i/30,seed=pid,occlusion_mask=matte)
          elapsed=time.perf_counter()-t0
          assert elapsed>0
          print('ORIGINAL_FROZEN_CPU_RENDER_BENCHMARK',json.dumps({
            'frames':246,'rings_per_frame':2,'size':[908,512],
            'wall_s':round(elapsed,3),'frames_per_second':round(246/elapsed,1),
            'GPU_used':False,'player_detection_included':False,
            'renderer_blob':'9fac8a8915b90bbd9bd1235532c297c35da77ca2'}))
          PY
