name: PR776 G2 original actor versus official NBA clock forensic dossier
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-clock-source-conflict-dossier-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G2-source-clock-328-dossier
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content boundary and original NBA private SHA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: G2 original SDK player actor and official NBA clock model tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g2_source_official_clock_conflict_dossier_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
             -p 'test_igp_g2_source_official_clock_conflict_dossier_2026.py' -v
      - name: SHA check all 36 source NBA games and investigate 328 direct actor mismatches
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_official_clock_328_source_actor_dossier_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_source_official_clock_conflict_dossier_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-G2-clock-conflicts.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          a=x["totals"]
          assert x["source_games"]==36
          assert a["all_source_ten_vs_NBA_official_disagreements"]==447
          assert a["direct_actor_contradictions"]==328
          assert a["proposal_only_disagreements"]==119
          assert a["episode_count"]==158
          assert x["original_NBA_SDK_XYZ_measurement_authoritative"]
          assert x["NBA_current_official_roster_not_overridden"]
          assert x["report_private_only"]
          print("G2_ORIGINAL_NBA_328_ACTOR_CLOCK_FORENSIC_PASS",json.dumps({
              "games":36,"all":447,"direct":328,"proposal_only":119,
              "distinct_episodes":158,
              "raw_ten_other_NBA_period_roster":a["raw_ten_matches_another_official_same_period"],
              "NBA_PBP_clock_bracket":a["valid_official_PBP_clock_bracket"],
              "source_alternate_NBA_same_period":a["proposed_ten_matches_official_same_period"]
          },sort_keys=True))
          PY
      - name: Private-only original NBA G2 forensic identity and clock dossier receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_official_clock_328_source_actor_dossier_36_v1.json
          git config user.name "Game Pulse Original NBA Clock QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): SHA-backed 36-game direct original SDK actor conflict clock dossier"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo ORIGINAL_PRIVATE_G2_328_ACTOR_CLOCK_QA_COMMITTED
              exit 0
            fi
            sleep "$try"
          done
          exit 13
