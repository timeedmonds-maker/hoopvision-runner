name: IGP P3 full68 native-live 10Hz PBP shot gap and source-anchor atlas
# Source-only aggregate results; licensed NBA records are committed privately.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-igp-p3-all68-natural-event-gap-atlas.yml'
permissions: {contents: read}
concurrency:
  group: igp-p3-all68-natural-source-event-atlas
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 642b4702a340c15a1176074f4054b5cb277a596f
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public-content guard and exact original NBA 68 SHA private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Run natural source gap tests and all68 frozen same-denominator QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_natural_event_gap_atlas_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_natural_event_gap_atlas_v1.py --root . --output "$RUNNER_TEMP/actual-gap-private.json" > "$RUNNER_TEMP/actual-gap-private.log" 2>&1; then
            echo P3_REAL_68_SOURCE_GAP_EVAL_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'actual-gap-private.log').read_text(errors='replace').splitlines()
          last=next((s for s in reversed(lines) if s.strip()),'NO_LOG')
          print('P3_PRIVATE_FAILURE_EXCEPTION',re.sub(r'[^A-Z_a-z]','_',last.split(':',1)[0])[:50])
          print('P3_PRIVATE_FAILURE_CLASS',re.sub(r'[^A-Z_a-z]','_',last)[:95])
          print('P3_GAMES_FINISHED',sum(s.startswith('P3_NATURAL_EVENT_GAP_GAME') for s in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'actual-gap-private.json').read_text())
          assert j['evaluated_games']==68 and len(j['per_game'])==68
          a=j['totals']['native']; b=j['totals']['continuous_10hz']
          assert (a['live'],a['complete'])==(543024,492617)
          assert (b['live'],b['complete'])==(1106941,917686)
          assert b['ball_unavailable']==83286 and b['multi_player_ball_present']==17050
          assert a['live']==a['complete']+a['unresolved_scene']
          assert b['live']==b['complete']+b['unresolved_scene']
          assert j['event_shot_is_semantic_identity_timing_only_NO_XYZ']
          assert j['experiment_not_model_promotion'] and j['accepted_new_tracking_positions']==0
          print('IGP_P3_REAL_68_NATURAL_SOURCE_EVENT_ATLAS',json.dumps({
              'games':68,'native_total':a['live'],'native_complete':a['complete'],
              'grid_total':b['live'],'grid_complete':b['complete'],
              'ball_absent':b['ball_unavailable'],
              'ball_source_both_long':b.get('ball_anchor_BOTH_OVER_1200',0),
              'ball_source_past_only':b.get('ball_anchor_PAST_ONLY',0),
              'ball_source_future_only':b.get('ball_anchor_FUTURE_ONLY',0),
              'ball_source_none':b.get('ball_anchor_NO_SAME_LIVE_PAIR_ANCHORS',0),
              'ball_near_shot':b.get('ball_shot_SHOT_WITHIN_1S',0)+b.get('ball_shot_SHOT_1_TO_2P5S',0),
              'ball_near_shooter_official':b.get('ball_shot_official_player_identity_nearby',0),
              'multiplayer_no_ball':b.get('multi_player_and_ball_missing',0),
              'multiplayer_with_ball':b.get('multi_player_ball_present',0),
              'newly_promoted_positions':0},sort_keys=True))
          PY
      - name: Store original per-game source QA only in private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_natural_event_gap_atlas_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-natural-event-atlas "origin/$BRANCH"
          cp "$RUNNER_TEMP/actual-gap-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): all68 actual unsupported ball and multi-player source gaps with NBA PBP shot context'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_ACTUAL_NATURAL_68_QA_PRIVATE_SUCCESS
              exit 0
            fi
            sleep "$i"
          done
          exit 42
