name: Rockets Spurs original gameplay source QA
# All licensed frames and QA reports stay in private 104; public logs are categorical.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-rockets-spurs-original-qa.yml'
      - 'tools/licensed_feed/verify_gameplay_0009.py'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-rockets-spurs-original-qa.yml'
      - 'tools/licensed_feed/verify_gameplay_0009.py'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
  # Private release token was secondarily rate-limited on 2026-10-24.
  # Retry on free public CPU after a cooling interval; QA remains fail-closed.
  schedule:
    - cron: '31 14 * * *'
permissions:
  contents: read
concurrency:
  group: gamepulse-original-0022600009-qa
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public-only boundary and synthetic temporal logic
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/licensed_feed/verify_gameplay_0009.py tools/licensed_feed/verify_gameplay.py
          PYTHONPATH=tools/licensed_feed python3 - <<'PY'
          from verify_gameplay_0009 import nearest_gap, unix_ms, observed_slot_diagnostic, frame_position_presence, original_qa_blocker_codes, private_qa_payload, GAME, BEGIN, SLOT_MS
          assert nearest_gap([], 100) is None
          assert nearest_gap([10, 30, 50], 40) == 10
          assert nearest_gap([10, 30, 50], 50) == 0
          assert unix_ms('2026-10-24T01:30:00Z') == 1792805400000
          observed = observed_slot_diagnostic(
              {BEGIN + 10, BEGIN + SLOT_MS + 10},
              {BEGIN + 20}, BEGIN, BEGIN + 2 * SLOT_MS)
          assert observed["official_action_span_5s_bins"] == 3
          assert observed["bins_with_original_player_positions"] == 2
          assert observed["bins_with_original_ball_position"] == 1
          assert observed["bins_with_both_player_and_ball"] == 1
          assert observed["longest_consecutive_bins_without_both"] == 2
          assert observed["certified"] is False
          assert observed_slot_diagnostic(set(), set(), None, None)["certified"] is False
          # Same-frame co-presence is stricter than sharing a five-second bin.
          assert frame_position_presence({"ball": {"x": 1}, "201142": {"x": 2}}) == (True, True)
          assert frame_position_presence({"ball": {"x": 1}}) == (False, True)
          assert frame_position_presence({"201142": {"x": 2}}) == (True, False)
          coframe = observed_slot_diagnostic(
              {BEGIN + 10}, {BEGIN + 10}, BEGIN, BEGIN + 2 * SLOT_MS)
          assert coframe["bins_with_both_player_and_ball"] == 1
          absent = original_qa_blocker_codes({
              "observed_original_same_frame_player_ball": {
                  "unique_source_timestamps_with_both_position_keys": 0}})
          assert "OBSERVED_SAME_FRAME_PLAYER_BALL_ABSENT" in absent
          import base64, json
          minimal = {
              "game_id": GAME, "source_parts_sha256_verified": 13,
              "source_windows_sha256_verified": 3720,
              "tracking_gameplay_certified": False,
              "independent_player_team_id_certified": False,
              "possession_lineup_chain_certified": False,
              "video_pts_certified": False,
          }
          raw = json.dumps(minimal).encode()
          assert base64.b64decode(private_qa_payload(raw)["content"]) == raw
          for field in ("tracking_gameplay_certified",
                        "independent_player_team_id_certified",
                        "possession_lineup_chain_certified", "video_pts_certified"):
              invalid = dict(minimal, **{field: True})
              try:
                  private_qa_payload(json.dumps(invalid).encode())
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("certification promotion must fail")
          for key, bad_value in (("game_id", "OTHER_GAME"),
                                 ("source_parts_sha256_verified", 12),
                                 ("source_windows_sha256_verified", 3719)):
              invalid = dict(minimal, **{key: bad_value})
              try:
                  private_qa_payload(json.dumps(invalid).encode())
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("unverified source scope must fail")
          print('ORIGINAL_TEMPORAL_QA_SYNTHETIC_PASS')
          PY
  private-qa:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce private destination
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          echo 'PRIVATE_DESTINATION_VERIFIED'
      - name: SHA-audit actual frames against independent official NBA action UTC
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/licensed_feed/verify_gameplay_0009.py
