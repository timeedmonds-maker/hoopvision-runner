name: Validate Descriptive Tactical Contracts

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-tactical-descriptive-contracts.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TACTICAL_SHA: e7ff6d386cdbbe9eb2014e51a6982db2d848d523

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact tactical revision
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.TACTICAL_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pytest
      - name: Enforce base governance and tactical contract tests
        run: |
          set -euo pipefail
          python src/tools/validate_governing_delivery_policy.py
          PYTHONPATH=src python -m pytest -q src/hoopvision/tests/test_tactical_descriptive_contracts.py src/hoopvision/tests/test_governing_delivery_policy.py
      - name: Verify no advice fields entered tactical contracts
        run: |
          set -euo pipefail
          ! grep -RniE 'player_grade|decision_quality|preferred_alternative|option_rank|expected_points|simulation|recommendation' src/hoopvision/tactical src/hoopvision/config/tactical_dictionary_v1.json
          echo "HOOPVISION_TACTICAL_DESCRIPTIVE_CONTRACTS_OK"
