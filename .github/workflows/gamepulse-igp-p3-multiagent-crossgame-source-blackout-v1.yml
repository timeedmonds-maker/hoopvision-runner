# First actual P3 source-context model: never export original NBA XYZ to public runner.
name: IGP P3 multiagent crossgame source blackout pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-multiagent-crossgame-source-blackout-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p3-crossgame-source-blackout
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 747a37aca5b3ca60cd1cda5e440410e3182ffae3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public disclosure and pin original source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Execute non-leakage source-unit tests and multiagent pilot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_multiagent_context_pilot_v1.py'
          python3 gamepulse/fusion/igp_68_p3_multiagent_context_pilot_v1.py \
            --root . --out "$RUNNER_TEMP/igp68-p3-context.json" \
            > "$RUNNER_TEMP/igp68-p3-private.log" 2>&1 || {
              echo IGP_P3_PRIVATE_CROSSGAME_PILOT_FAILED
              tail -n 8 "$RUNNER_TEMP/igp68-p3-private.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp68-p3-context.json').read_bytes())
          assert q['training_game_ids']==['0022600006','0022600086']
          assert q['heldout_test_game_ids']==['0022600111','0022600122']
          assert q['original_source_XYZ_and_UTC_immutable']
          assert q['no_train_test_game_overlap'] and q['research_only_no_model_promotion']
          assert len(q['source_evidence'])==4
          for kind in ('player','ball'):
            train=q['metrics'][kind]['train']['metrics']
            test=q['metrics'][kind]['test']['metrics']
            assert train['paired_targets']>=75 and test['paired_targets']>=75
            assert test['baseline_C0']['n']==test['multiagent_residual']['n']
          print('IGP68_P3_CROSSGAME_MULTIAGENT_MASKED_SOURCE',json.dumps({
            kind:{'train':q['metrics'][kind]['train']['metrics'],
                  'heldout_test':q['metrics'][kind]['test']['metrics']}
            for kind in ('player','ball')},sort_keys=True))
          PY
      - name: Commit private 4-game cross-game real-source QA receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_fourgame_crossgame_multiagent_context_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-context "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp68-p3-context.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): four-game P3 crossgame multiagent source-masked comparison'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP68_P3_ORIGINAL_MASKED_CROSSGAME_RECEIPT_ACCEPTED_PRIVATE
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
