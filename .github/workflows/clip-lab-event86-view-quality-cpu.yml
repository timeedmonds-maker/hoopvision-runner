name: Clip Lab Event86 CPU camera quality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-event86-view-quality-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-lab-event86-view-quality-cpu
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private evidence gate
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-event86-view-quality-cpu.yml'])
          print('EVENT86_PRIVATE_ONLY_PASS')
          PY
      - name: Compare six original NBA feeds against user video fingerprint
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==1.26.4' 'opencv-python-headless==4.10.0.84'
          ROOT="$RUNNER_TEMP/clip86"
          mkdir -p "$ROOT/hoopvision/freeview" "$ROOT/output"
          touch "$ROOT/hoopvision/__init__.py" "$ROOT/hoopvision/freeview/__init__.py"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/fetch_official_multicam.py?ref=b154a834a95a887226757a4ff0d5b34f69bc55e6' --jq .content | base64 -d > "$ROOT/hoopvision/freeview/fetch_official_multicam.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/clip_orb_sync.py?ref=main' --jq .content | base64 -d > "$ROOT/clip_orb_sync.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/qa/0022600009_user_video_orb_fingerprint.json?ref=main' --jq .content | base64 -d > "$ROOT/user_fingerprint.json"
          PYTHONPATH="$ROOT" python3 - "$ROOT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          import cv2,numpy as np
          from hoopvision.freeview.fetch_official_multicam import resolve_options,download_hls,probe
          from clip_orb_sync import align
          root=Path(sys.argv[1]);out=root/'output'
          user=json.loads((root/'user_fingerprint.json').read_text())
          assert user['source_sha256']=='b96324b522cd75e46ab8bc8da6a51af751299ac3f931b7db3cb021316e61020a'
          opts=resolve_options('0022600009',86)
          assert 'Broadcast' in opts
          labels=[k for k in ('Broadcast','Left Slash','Right Slash','In Arena','Left Above Rim','Right Above Rim') if k in opts]
          rows=[]
          for label in labels:
            path=out/f'view_{len(rows):02d}.mp4'
            row={'label':label}
            try:
              download_hls(opts[label],path)
              metadata=probe(path)
              if metadata['width']<640 or metadata['duration_s']<8:raise ValueError('invalid replay')
              cap=cv2.VideoCapture(str(path));n=int(cap.get(cv2.CAP_PROP_FRAME_COUNT));lap=[]
              for i in np.linspace(0,n-1,10,dtype=int):
                cap.set(cv2.CAP_PROP_POS_FRAMES,int(i))
                ok,frame=cap.read()
                if ok:
                  mini=cv2.resize(cv2.cvtColor(frame,cv2.COLOR_BGR2GRAY),(640,360))
                  lap.append(float(cv2.Laplacian(mini,cv2.CV_64F).var()))
              cap.release()
              if len(lap)<8:raise ValueError('unreadable')
              matches=align(path,user,step_frames=10)
              row.update(state='DECODED_UNCERTIFIED',metadata=metadata,sha256=hashlib.sha256(path.read_bytes()).hexdigest(),
                         media_bytes=path.stat().st_size,laplacian_640x360=round(float(np.median(lap)),2),
                         orb_offset_candidates=matches[:4],sync_certified=False)
            except Exception as exc:
              row.update(state='FAILED',failure=type(exc).__name__)
              path.unlink(missing_ok=True)
            rows.append(row)
            print('SOURCE_ANGLE',label,row['state'],flush=True)
          good=[(i,row) for i,row in enumerate(rows) if row['state']=='DECODED_UNCERTIFIED']
          if not good:raise RuntimeError('NO_VALID_ORIGINAL_ANGLE')
          def score(x):
            r=x[1];m=r['orb_offset_candidates']
            return ((m[0].get('median_inliers',0) if m else 0),r['laplacian_640x360'])
          winners=sorted(good,key=score,reverse=True)
          retained=[]
          for j,(index,row) in enumerate(winners):
            p=out/f'view_{index:02d}.mp4'
            if j<2:
              name=f'event86_native_angle_{j+1:02d}.mp4'
              p.rename(out/name);row['retained_video_asset']=name;retained.append(name)
            else:p.unlink(missing_ok=True)
          qa={'schema':'hoopvision.clip-lab.event86-source-quality.v1','game_id':'0022600009','event_num':86,
              'available_feeds':len(opts),'tested_feeds':len(labels),'decoded_feeds':len(good),
              'best_video_candidate':winners[0][1]['label'],'retained_video_assets':retained,
              'video_sync_certified':False,'frozen_player_foot_tracking_certified':False,
              'xfg_pbp_conflict':'xFG names Durant at event86; official PBP names Adams; do not assign possession from this event label',
              'method':'original NBA HLS, CPU ORB vs user recording, normalized sharpness, no GPU',
              'views':rows}
          (out/'event86_source_quality_qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          print('EVENT86_MULTIANGLE_QA_COMPLETE',len(good),winners[0][1]['label'])
          PY
      - name: Publish private QA and selected original videos with SHA readback
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/clip86/output"
          TAG=clip-lab-rockets-spurs-e86-angles-quality
          gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1 || gh release create "$TAG" --repo timeedmonds-maker/104 --title 'Event86 original NBA multi-angle comparison' --notes 'Private native media; visual timing candidate only, no frozen foot-alignment certification.' --latest=false
          gh release upload "$TAG" "$OUT/event86_source_quality_qa.json" "$OUT"/event86_native_angle_*.mp4 --repo timeedmonds-maker/104 --clobber >/dev/null
          python3 - "$OUT" "$TAG" <<'PY'
          import json,hashlib,subprocess,sys
          from pathlib import Path
          out=Path(sys.argv[1]);tag=sys.argv[2]
          d=json.loads(subprocess.check_output(['gh','api',f'repos/timeedmonds-maker/104/releases/tags/{tag}'],text=True))
          a={r['name']:r for r in d['assets']}
          for file in [out/'event86_source_quality_qa.json',*out.glob('event86_native_angle_*.mp4')]:
            assert a[file.name].get('digest')=='sha256:'+hashlib.sha256(file.read_bytes()).hexdigest()
          print('PRIVATE_NBA_VIDEO_QUALITY_SOURCE_SHA_VERIFIED')
          PY
