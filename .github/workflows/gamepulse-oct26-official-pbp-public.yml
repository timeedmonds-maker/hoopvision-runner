name: Game Pulse Oct26 official NBA PBP reconciliation on free public CPU
# Public runner executes trusted private original NBA parsers.
# All full NBA events, verification and writes stay private in 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-oct26-official-pbp-public.yml']
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: gamepulse-private-nba-oct26-official-source
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate confidentiality guard and read-only public checkout
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Sparse-fetch existing authoritative private NBA official source parsers
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private-igp-pbp"
          git -C "$RUNNER_TEMP/private-igp-pbp" sparse-checkout set --no-cone \
            /gamepulse/fusion/official_pbp_timing/ \
            /gamepulse/fusion/official_pbp_allgames_2026.py \
            /gamepulse/fusion/official_pbp_timestamps_2026.py
          test -f "$RUNNER_TEMP/private-igp-pbp/gamepulse/fusion/official_pbp_timing/index-2026-27-through-20261025.json"
          test -f "$RUNNER_TEMP/private-igp-pbp/gamepulse/fusion/official_pbp_allgames_2026.py"
      - name: Source parser regression checks
        working-directory: ${{ runner.temp }}/private-igp-pbp
        run: python3 gamepulse/fusion/official_pbp_timestamps_2026.py --selftest
      - name: Preserve earlier 43 and independently reconcile available official October 26 games
        working-directory: ${{ runner.temp }}/private-igp-pbp
        env:
          PYTHONPATH: gamepulse/fusion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          from official_pbp_allgames_2026 import certify_game
          now=datetime.now(timezone.utc)
          if now>datetime(2026,10,29,16,tzinfo=timezone.utc):
              print('NBA_OCT26_NINE_SOURCE_WINDOW_COMPLETE_NO_FURTHER_PROVIDER_RETRIES')
              raise SystemExit(0)
          root=Path('gamepulse/fusion/official_pbp_timing')
          prior_path=root/'index-2026-27-through-20261025.json'
          prior_raw=prior_path.read_bytes()
          prior=json.loads(prior_raw)
          assert prior['game_count']==43 and len(prior['games'])==43
          expected={
            '0022600119':('WAS','CHA'),
            '0022600120':('MIN','CLE'),
            '0022600121':('CHI','BOS'),
            '0022600122':('DAL','MIA'),
            '0022600123':('IND','MIL'),
            '0022600124':('PHX','OKC'),
            '0022600125':('ATL','HOU'),
            '0022600126':('MEM','UTA'),
            '0022600127':('GSW','DEN')}
          assert set(prior['games']).isdisjoint(expected)
          new={}
          for gid,(away,home) in expected.items():
              try:
                  accepted=certify_game(gid,[away,home])
              except (OSError,TimeoutError,RuntimeError,ValueError,KeyError) as exc:
                  print('NBA_OCT26_OFFICIAL_SOURCE_NOT_YET_VERIFIED',gid,type(exc).__name__)
                  continue
              assert accepted['game_id']==gid
              assert accepted['qa']['nba_score_reconciled_to_boxscore'] is True
              assert len(accepted['actions'])>=300
              assert accepted['qa']['nba_actions_with_formal_utc']>0
              assert all(a.get('possession_start_end_certified') is not True for a in accepted['actions'])
              destination=root/'games'/f'{gid}.json'
              raw=(json.dumps(accepted,sort_keys=True,ensure_ascii=False,separators=(',',':'))+'\n').encode()
              if destination.exists(): assert destination.read_bytes()==raw,'NBA_IMMUTABLE_EVENT_SOURCE_CONFLICT'
              else: destination.write_bytes(raw)
              new[gid]={
                  'game_id':gid,
                  'state':accepted['state'],
                  'action_records':len(accepted['actions']),
                  'actions_with_official_timeActual_utc':accepted['qa']['nba_actions_with_formal_utc'],
                  'source_file':str(destination),
                  'source_pbp_sha256':accepted['source_provenance']['nba_pbp_sha256'],
                  'source_boxscore_sha256':accepted['source_provenance']['nba_boxscore_sha256'],
                  'official_final':accepted['official_final'],
                  'physical_possession_boundaries_certified':0,
                  'video_pts_certified':0}
              print('NBA_OCT26_OFFICIAL_NBA_SOURCE_SHA_VERIFIED',gid,len(accepted['actions']))
          if len(new)==9:
              index={
                  'schema':'gamepulse.2026-27-official-nba-sources-through-20261026.v1',
                  'season':'2026-27','through_us_game_date':'2026-10-26',
                  'game_count':52,'prior_game_count':43,
                  'new_games':sorted(new),
                  'prior_43_source_sha256':hashlib.sha256(prior_raw).hexdigest(),
                  'games':{**prior['games'],**new},
                  'source_policy':prior['source_policy'],
                  'physical_tracking_possession_memberships_certified':False,
                  'possession_boundary_time_certified':False}
              assert len(index['games'])==52
              assert all(index['games'][k]==v for k,v in prior['games'].items())
              target=root/'index-2026-27-through-20261026.json'
              payload=(json.dumps(index,sort_keys=True,ensure_ascii=False,indent=2)+'\n').encode()
              if target.exists():assert target.read_bytes()==payload,'OFFICIAL_NBA_52_MANIFEST_DRIFT'
              else:target.write_bytes(payload)
              print('NBA_OCT26_OFFICIAL_52_SOURCE_INDEX_ACCEPTED')
          else:
              print('NBA_OCT26_INDIVIDUAL_NBA_SOURCES_VERIFIED',len(new),'OF_9_NOT_A_52_GAME_INDEX')
          PY
      - name: Commit only independently verified NBA event sources to private canonical main
        working-directory: ${{ runner.temp }}/private-igp-pbp
        run: |
          set -euo pipefail
          git config user.name gamepulse-source-worker
          git config user.email gamepulse-source-worker@users.noreply.github.com
          for n in {119..127}; do
            id="0022600$n"
            target="gamepulse/fusion/official_pbp_timing/games/$id.json"
            test ! -f "$target" || git add "$target"
          done
          idx="gamepulse/fusion/official_pbp_timing/index-2026-27-through-20261026.json"
          test ! -f "$idx" || git add "$idx"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo NBA_OCT26_NO_ADDITIONAL_VERIFIED_SOURCE
            exit 0
          fi
          git commit -qm 'data(gamepulse): incrementally accept official Oct26 nine PBP games and final SHA source index'
          published=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main
            git rebase -q origin/main || exit 4
            if git push -q origin HEAD:main; then published=1;break;fi
            sleep "$attempt"
          done
          test "$published" -eq 1
          echo NBA_OCT26_OFFICIAL_SOURCE_COMMITTED_PRIVATELY
