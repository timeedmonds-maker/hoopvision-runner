name: IPPT original full NBA native 409 empty chains and ten plus ball coverage audit 36
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-native-409-chain-coverage-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: ippt-native-409-chain-coverage36
  cancel-in-progress: false
jobs:
  private-full-native-slot-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      RESEARCH_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_CODE_SHA: 544d90394d75c9b7b11d69b826fe3a1a66ecefeb
      QA_FILE: gamepulse/fusion/qa/igp_progress_20261028/ippt_all36_native_409_empty_chain_player_ball_slot_second_qa_v1.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public confidentiality guard and exact pinned private original source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$RESEARCH_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/ippt-private"
          git -C "$RUNNER_TEMP/ippt-private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/ippt-private" rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          echo "IPPT_PRIVATE=$RUNNER_TEMP/ippt-private" >> "$GITHUB_ENV"
      - name: Source-free full-native grade, ball, source and 409-chain abstention unit QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_PRIVATE"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_full_native_possession_coverage_audit_v1_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_full_native_possession_coverage_audit_v1_2026.py
      - name: Two-game original SHA G4 roster and PBP pilot with empty-chain count check
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_PRIVATE"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from pathlib import Path
          from query_igp_g4_native_actor_possession_2026 import load_index
          from igp_tracking_pilot_run_2026 import BASE,load
          from igp_ippt_full_native_possession_coverage_audit_v1_2026 import count_game
          from igp_g3_short_gap_reconstruction_2026 import evidence_windows
          root=Path(".")
          for gid in ("0022600009","0022600092"):
              blob,_=load_index(root,gid)
              meta=blob["source_sha256"]
              pbp,_=load(root,BASE/"official_pbp_timing/games"/(gid+".json"),meta["NBA_PBP"])
              lineup,_=load(root,BASE/"official_lineup_clock/games"/(gid+".json"),
                            meta["NBA_official_lineup"])
              r=count_game(gid,blob,pbp["actions"],evidence_windows(
                           pbp["actions"],lineup["lineup_intervals"]))
              assert r["counts"]["native_frames"]>10000
              assert r["counts"]["canonical_NBA_logical_chains"]>150
              assert r["native_source_preserved"]
          print("IPPT_409_EMPTY_CHAIN_AND_FULL_NATIVE_SLOT_SHA_TWO_GAME_PILOT_PASS")
          PY
      - name: Run source-backed all 36 game native direct/G3 slot, ball, canonical chain seconds and 409 empties
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_PRIVATE"
          export PYTHONPATH=gamepulse/fusion
          test ! -e "$QA_FILE"
          python3 gamepulse/fusion/igp_ippt_full_native_possession_coverage_audit_v1_2026.py \
            --root . --out "$QA_FILE" > "$RUNNER_TEMP/ippt_coverage_private_full.log"
          python3 - <<'PY'
          import json,os
          a=json.load(open(os.environ["QA_FILE"]));t=a["totals"]
          assert a["source_games"]==36 and len(a["games"])==36
          assert t["native_frames"]==1203986
          assert t["source_player_actor_entries"]==8673975
          assert t["direct_ball_frames"]==912704
          assert t["G3_derived_player_entries"]==285536
          assert t["G3_ball_frames"]==8504
          assert t["canonical_NBA_logical_chains"]==7474
          assert t["chains_without_any_native_postings"]==409
          assert not a["physical_ball_custody_certified"]
          # Safe release totals: no individual native UTC, actor ID or XYZ.
          summary={k:v for k,v in t.items() if k in (
              "native_frames","source_player_actor_entries","direct_ball_frames",
              "G3_derived_player_entries","G3_ball_frames","canonical_NBA_logical_chains",
              "chains_without_any_native_postings",
              "empty_chains_with_scorer_near_source",
              "empty_chains_without_any_scorer_near_source",
              "empty_chains_with_source_player","empty_chains_with_source_ball",
              "empty_chains_scorer_near_frames_on_other_chains",
              "source_actor_keys_0","source_actor_keys_1_to_9","source_actor_keys_10",
              "source_actor_keys_gt10","source_compatible_official_ten_frames",
              "source_compatible_official_ten_slots",
              "indexed_logical_chain_second_buckets",
              "chain_second_buckets_with_direct_official_ten_ball",
              "chain_second_buckets_with_G3_official_ten_any_ball",
              "raw_10_or_more_plus_direct_ball_frames",
              "raw_10_or_more_plus_G3_plus_any_ball_frames")}
          summary["official_ten_candidate_strata"]=a["official_ten_candidate_strata"]
          summary["physical_custody_certified"]=False
          open(os.environ["RUNNER_TEMP"]+"/ippt_coverage_safe_summary.json","w").write(
             json.dumps(summary,sort_keys=True,indent=2))
          print("IPPT_ORIGINAL_NATIVE_409_CHAIN_PLAYER_BALL_SLOT_SECOND_36_PASS",
                json.dumps(summary,sort_keys=True))
          PY
      - name: Commit immutable SHA original source QA only into private research
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_PRIVATE"
          git config user.name "Integrated Pulse Private Native QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$QA_FILE"
          git diff --cached --check
          git commit -qm "qa(ippt): full36 SHA native possession-second, official ten and 409 empty-chain evidence"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$RESEARCH_BRANCH"
            git rebase -q "origin/$RESEARCH_BRANCH"
            if git push -q origin "HEAD:refs/heads/$RESEARCH_BRANCH"; then
              echo IPPT_PRIVATE_ALL36_NATIVE_COVERAGE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
      - name: Publish aggregate-only QA and erase all private NBA source
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          payload={"run_id":os.environ["GITHUB_RUN_ID"],
             "job_status":os.environ["QA_JOB_RESULT"],
             "private_original_source_code_sha":os.environ["EXPECTED_CODE_SHA"],
             "private_full_native_QA_path":os.environ["QA_FILE"],
             "exact_physical_ball_control_certified":False}
          safe=root/"ippt_coverage_safe_summary.json"
          if safe.exists():
              payload["all36_safe_aggregate"]=json.loads(safe.read_text())
          (root/"ippt_coverage_public_issue.md").write_text(
             "Integrated Pulse original native 409-chain and player-slot coverage QA; counts only, no private XYZ, native UTC or actor IDs.\n\n~~~json\n"+
             json.dumps(payload,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/ippt-private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner \
             --body-file "$RUNNER_TEMP/ippt_coverage_public_issue.md"
# All original/licensed NBA frame coordinates and per-event individual source times remain PRIVATE.
