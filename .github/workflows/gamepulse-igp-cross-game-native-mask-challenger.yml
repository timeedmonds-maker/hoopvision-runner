name: "IGP original-native cross-game full-path masked accuracy challenger"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-cross-game-native-mask-challenger.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-original-native-masked-crossgame-20261029
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce content boundary and clone private original NBA SDK source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Run source-free original-coordinate holdout and no-leakage gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_cross_game_masked_native_motion_blend_v1.py
          python3 -m unittest discover -s gamepulse/fusion -v \
            -p 'test_igp_cross_game_masked_native_motion_blend_v1.py'
      - name: Run two NBA games original SHA-backed full path blackout and held-out comparison
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_cross_game_masked_native_motion_blend_v1.py \
            --root . --max-cases 240 \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_cross_game_masked_native_motion_blend_2game_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_cross_game_masked_native_motion_blend_2game_v1.json")
          q=json.loads(p.read_bytes())
          assert set(q["games"])=={"0022600009","0022600092"}
          assert q["new_model_not_promoted_to_canonical"]
          assert q["source_accuracy_not_video_ground_truth"]
          assert q["physical_possessions_certified"]==0
          assert q["original_player_positions_and_ball_not_overwritten"]
          n=0
          for gid,v in q["games"].items():
            assert v["trained_on_excluded_game"]!=gid
            assert v["source"]["source_native_frames_sha_verified"]>20000
            for ms,x in v["blocked_gap"].items():
              if x["baseline_B"]["matched"]:
                assert x["baseline_B"]["p95_ft"]>=0
              assert x["masked_original_frames"]>=x["baseline_B"]["matched"]
              assert x["masked_original_frames"]>=0
              n+=x["masked_original_frames"]
          assert n>=10,"NO_ELIGIBLE_MASKED_SOURCE_SAMPLES"
          print("IGP_ORIGINAL_XYZ_CROSSGAME_MASKED_QA_PASS",json.dumps({
            "games":2,"masked_original_samples":n,
            "true_video_3D_position_labels":0,
            "accepted_trajectory_model_replaced":False},sort_keys=True))
          PY
      - name: Save immutable QA metrics privately, never source XYZ in public
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_cross_game_masked_native_motion_blend_2game_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): two-game original native full-gap masked reconstruction accuracy"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_MASKED_ORIGINAL_CROSS_GAME_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$try"
          done
          exit 23
