name: IGP G3 NBA shot-semantic conditional ball 3D disjoint full68 2400ms original source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g3-nba-shot-conditional-ball-68-holdout.yml']
permissions: {contents: read}
concurrency:
  group: igp-g3-nba-shot-semantic-2400ms-original
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 548c5cc94eeb9784e381641711d52ad67164ae06
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify reviewed public content guard and pinned original NBA private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free NBA PBP event ambiguity original XYZ conservation tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g3_shot_semantic_disjoint_2400ms_v1.py'
      - name: All68 original NBA SDK 543 blackout disjoint official shot semantic ball 3D QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_g3_shot_semantic_disjoint_68_2400ms_v1.py \
             --root . --output "$RUNNER_TEMP/shot-3d-original-private.json" \
             > "$RUNNER_TEMP/shot-3d-original-private.log" 2>&1; then
            echo IGP_G3_NBA_SHOT_3D_SOURCE_DISJOINT_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          x=(Path(os.environ['RUNNER_TEMP'])/'shot-3d-original-private.log').read_text(errors='replace').splitlines()
          last=next((v for v in reversed(x) if v.strip()),'NO_LOG')
          print('IGP_G3_NBA_SHOT_3D_REDACTED_ERROR',re.sub(r'[^A-Za-z_]','_',last)[:100])
          print('IGP_G3_NBA_SHOT_3D_GAMES_FINISHED',sum(v.startswith('G3_SHOT_CONTEXT_ORIGINAL_NBA_GAME') for v in x))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'shot-3d-original-private.json').read_text())
          a=j['validation_all_matched_ball_predictions']
          b=j['validation_event_eligible_matched_ball_predictions']
          assert j['68_original_games']==68 and len(j['per_game'])==68
          assert len(j['dev_games'])==len(j['validation_games'])==34
          assert not set(j['dev_games'])&set(j['validation_games'])
          assert j['counts']['original_full_source_blackouts']==543
          assert a['same_predictions']==a['baseline']['all_3D_source_error_ft']['n']
          assert a['same_predictions']==a['candidate']['all_3D_source_error_ft']['n']
          assert b['same_predictions']==b['baseline']['all_3D_source_error_ft']['n']
          assert b['same_predictions']==b['candidate']['all_3D_source_error_ft']['n']
          assert j['ball_prediction_count_and_player_scene_support_unchanged']
          assert j['original_NBA_SDK_PBP_and_historical_db_unchanged']
          assert not j['independently_aligned_physical_ball_3D_groundtruth']
          assert j['new_production_accepted_scenes']==0
          print('IGP_G3_NBA_SHOT_DISJOINT_68_SOURCE_GRADED',json.dumps({
            'masked_original_full_scenes':543,
            'dev_eligible_event_classes':j['development_semantic_eligible_shots'],
            'val_eligible_event_classes':j['validation_event_eligible_centers'],
            'dev_selected_ballistic_weight':j['frozen_development_weight'],
            'val_all_ball_source_3D_old':a['baseline']['all_3D_source_error_ft'],
            'val_all_ball_source_3D_candidate':a['candidate']['all_3D_source_error_ft'],
            'val_shot_ball_source_3D_old':b['baseline']['all_3D_source_error_ft'],
            'val_shot_ball_source_3D_candidate':b['candidate']['all_3D_source_error_ft'],
            'release_decision':j['release_decision'],
            'accepted_production_scenes':0},sort_keys=True))
          PY
      - name: Save only original NBA source SHA score receipt privately, no public actor coordinates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g3_original_nba_shot_semantic_disjoint34_2400ms_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B g3-semantic-shots "origin/$BRANCH"
          cp "$RUNNER_TEMP/shot-3d-original-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_G3_NBA_SHOT_EXISTING_QA_IDENTICAL
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original NBA68 34/34 disjoint shot semantic bounded 3D ball 2p4s blackout matched p95 p99'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G3_SHOT_SEMANTIC_SOURCE_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
