name: PR776 missing fifth identity in original NBA chain XYZ QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-chain-xyz-query-pilot.yml']
permissions: {contents: read}
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confidential private source staging
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Query genuine player and ball trajectories against both provisional chains
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_provisional_nba_chain_xyz_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p test_query_igp_provisional_nba_chain_xyz_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p test_igp_lineup_identity_completion_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261026/native_chain_ten_player_ball_query_identity_v2
          test ! -e "$OUT"
          mkdir -p "$OUT"
          python3 gamepulse/fusion/query_igp_provisional_nba_chain_xyz_2026.py --game-id 0022600009 --chain-id 0022600009-P1-C0003 --out "$OUT/rockets_spurs.json"
          python3 gamepulse/fusion/query_igp_provisional_nba_chain_xyz_2026.py --game-id 0022600008 --chain-id 0022600008-P2-C0062 --out "$OUT/celtics_knicks.json"
          python3 - "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          a=json.loads((p/'rockets_spurs.json').read_text())
          b=json.loads((p/'celtics_knicks.json').read_text())
          assert a['game_id']=='0022600009' and b['game_id']=='0022600008'
          assert a['official_offense_team']=='SAS' and b['official_offense_team']=='BOS'
          assert a['source_counts']['frames']==49
          assert b['source_counts']['frames']==85
          assert a['physical_possessions_certified']==b['physical_possessions_certified']==0
          assert not a['gameclock_independently_validated']
          assert a['lineup_derived_missing_identity_not_a_new_XYZ_observation']
          assert b['lineup_derived_missing_identity_not_a_new_XYZ_observation']
          assert a['source_counts']['missing_players']==6
          assert b['source_counts']['missing_players']==0
          assert a['source_counts']['one_missing_known_player_id_frames']>=1
          assert all(x['missing_XYZ_not_imputed'] for x in a['original_native_frames']+b['original_native_frames'])
          print('IGP_NATIVE_CHAIN_ORIGINAL_FRAME_JOIN_ACCEPTED',json.dumps(
              {'Rockets_Spurs':a['source_counts'],'Celtics_Knicks':b['source_counts'],
               'certified_physical_possessions':0},sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 2
          git commit -q -m "data(igp): preserve fifth player identity separately from missing physical positions"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_NATIVE_CHAIN_PRIVATE_ORIGINAL_XYZ_QUERY_PUBLISHED
              exit 0
            fi
            sleep "$i"
          done
          exit 11
