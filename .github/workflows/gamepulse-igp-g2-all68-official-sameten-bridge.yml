name: IGP Fusion G2 full68 two-ended official NBA same-ten native roster candidate acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g2-all68-official-sameten-bridge.yml']
permissions: {contents: read}
concurrency:
  group: igp-g2-full68-twoended-sameten-source
  cancel-in-progress: false
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 911109c71e207d65b075aeb872607a3509691500
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify NBA original source privacy and private original SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free 68 game NBA PBP 10 player same-ten bridge and actor conflict tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g2_all68_two_ended_roster_bridge_v1.py'
      - name: SHA original NBA SDK and official PBP game-clock candidate bridge all68 readback
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_g2_all68_bridges_census_v1.py \
            --root . --output "$RUNNER_TEMP/g2-original-private.json" \
            > "$RUNNER_TEMP/g2-original-private.log" 2>&1; then
            echo IGP_G2_SHA_ORIGINAL_NBA_COHORT_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"g2-original-private.log").read_text(errors="replace").splitlines()
          last=next((v for v in reversed(z) if v.strip()),"NO_LOG")
          print("IGP_G2_SAFE_FAILURE_CLASS",re.sub(r"[^A-Za-z_]","_",last)[:95])
          print("IGP_G2_GAMES_COMPLETED",sum(x.startswith("IGP_G2_NBA_ROSTER_BRIDGE_GAME") for x in z))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"g2-original-private.json").read_text())
          n=j["totals"]
          assert j["game_count"]==68 and len(j["per_game"])==68
          assert j["preexisting_original_source_first_native_total"]==2280600
          assert j["preexisting_outside_strict_original_native_timestamps"]==1412865
          assert j["preexisting_official_strict_native_timestamps"]==867735
          assert j["original_source_NBA_PBP_historical_database_modified"] is False
          assert j["newly_accepted_800ms_scene_numerator_delta"]==0
          assert j["independent_physical_possessions_certified"]==0
          assert n["verified_unchanged_strict_query_rows"]==68
          assert n["native_additive_two_ended_candidate_frames"]<=1412865
          assert n["native_bridge_original_exact_official10_plus_ball"]<=259146
          for gid,row in j["per_game"].items():
            assert row["existing_original_source_and_lineup_unchanged"]
          print("IGP_G2_ALL68_SAFE_OFFICIAL_SAMETEN_SOURCE_COUNTS",json.dumps(n,sort_keys=True))
          PY
      - name: Commit exact original NBA source evidence to private research QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g2_all68_official_sameten_bridge_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B g2-68-sameten "origin/$BRANCH"
          cp "$RUNNER_TEMP/g2-original-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): SHA original 68 NBA PBP G2 same-ten bridge candidate sources and conflict abstention'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G2_TWO_ENDED_NBA_ALL68_SOURCE_QA_PRIVATE_SAVED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
