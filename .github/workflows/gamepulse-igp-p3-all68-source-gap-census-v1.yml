# Original 68-game NBA source-only native actor availability and gap classes.
# Public logs expose aggregate counts only, original licensed source remains private.
name: IGP P3 all 68 original native actor gap class census
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-all68-source-gap-census-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p3-native-source-gap-census
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 99d64d3b8653f07d61f1b203addcd576e5270010
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and SHA pin immutable private NBA original source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test source-only cases and score native live actor gaps across 68 games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_natural_missing_source_census_v1.py'
          python3 gamepulse/fusion/igp_68_p3_natural_missing_source_census_v1.py \
            --root . --output "$RUNNER_TEMP/igp68-p3-original-gap-census.json" \
            > "$RUNNER_TEMP/igp68-p3-native-private.log" 2>&1 || {
              echo P3_ALL_68_ORIGINAL_SDK_NATIVE_GAP_CENSUS_QA_FAILED
              tail -n 14 "$RUNNER_TEMP/igp68-p3-native-private.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp68-p3-original-gap-census.json').read_bytes())
          assert q['games']==68 and len(q['per_game'])==68
          assert q['all_68_original_native_pbp_live_frames']==543024
          assert q['experimental_1200ms_p1_native_complete']==492617
          assert q['experimental_1200ms_p1_continuous_complete']==917686
          assert q['source_XYZ_and_UTC_preserved'] and q['accepted_new_scenes_or_source_positions']==0
          c=q['aggregate_counts']
          assert c['native_raw_full_ten_ball']<=543024
          assert c['native_direct_player_slots_present']+c['native_direct_player_slots_missing']==5430240
          print('P3_ALL_68_ORIGINAL_NATIVE_ACTOR_GAP_CENSUS',json.dumps({
            'live_native_frames':543024,
            'original_complete_ten_ball':c['native_raw_full_ten_ball'],
            'one_missing_player_with_ball':c['frames_exact_one_player_missing_ball_present'],
            'past_only_one_missing':c.get('single_player_missing_PAST_ONLY',0),
            'past_only_0_600ms':sum(c.get('single_player_missing_PAST_ONLY_lag_'+name,0)
              for name in ('0_200ms','201_400ms','401_600ms')),
            'original_all_ten_absent':c['frames_all_ten_original_direct_players_absent']
          },sort_keys=True))
          PY
      - name: Retain SHA original 68-game QA in private research branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_original_native_actor_gap_census_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-all68-gap "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp68-p3-original-gap-census.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original NBA 68 game native actor gap class and peer availability census'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_ALL68_ORIGINAL_ACTOR_GAP_CENSUS_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
