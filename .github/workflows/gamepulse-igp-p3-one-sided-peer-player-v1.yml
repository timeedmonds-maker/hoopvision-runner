name: IGP P3 missing-player one-sided source holdout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-one-sided-peer-player-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-one-sided-player
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PINNED_PRIVATE_SHA: cce9fe4463715fcc6062472e53715922e5e57b36
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public code
        run: python3 tools/public_content_guard.py
      - name: Source-verified 6 train 4 test P3 one-sided reconstruction
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b research/igp-68-live-gap-census-20261030 https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_one_sided_peer_player_pilot_v1.py'
          python3 gamepulse/fusion/igp_68_p3_one_sided_peer_player_pilot_v1.py --root . --output "$RUNNER_TEMP/one-sided.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'one-sided.json').read_text())
          assert len(r['training_games'])==6 and len(r['previously_unused_test_games'])==4
          assert not set(r['training_games'])&set(r['previously_unused_test_games'])
          assert r['original_SDK_XYZ_official_ten_PBP_immutable']
          assert r['research_only_no_product_promotion']
          print('IGP_P3_PLAYER_ONE_SIDED_HELDOUT',json.dumps(r['metrics']['test'],sort_keys=True))
          PY
      - name: Preserve original NBA source QA receipt privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git fetch -q origin research/igp-68-live-gap-census-20261030
          git checkout -q -B one-sided origin/research/igp-68-live-gap-census-20261030
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_one_sided_player_peer_heldout_v1.json
          cp "$RUNNER_TEMP/one-sided.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original source one-sided player peer-context long-gap test'
          git push -q origin HEAD:refs/heads/research/igp-68-live-gap-census-20261030
