name: Bounded CP-SAT identity shadow

on:
  push:
    branches: [main]
    paths:
      - 'tools/bounded_event_cp_sat.py'
      - 'experiments/mirkovic_114s_cp_sat_shadow_v1.json'
      - '.github/workflows/bounded-cp-sat-shadow.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bounded-cp-sat-shadow
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CP-SAT backend
        run: python -m pip install --disable-pip-version-check --no-cache-dir ortools==9.14.6206

      - name: Run bounded Mirkovic CP-SAT shadow
        run: |
          set -euo pipefail
          python tools/bounded_event_cp_sat.py             --input experiments/mirkovic_114s_cp_sat_shadow_v1.json             --out experiment_results/mirkovic_114s_cp_sat_shadow_v1.json

      - name: Persist measured result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hoopvision-public-runner
          git config user.email hoopvision-public-runner@users.noreply.github.com
          git add experiment_results/mirkovic_114s_cp_sat_shadow_v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Record measured Mirkovic CP-SAT shadow result"
            git push origin HEAD:main
          fi
