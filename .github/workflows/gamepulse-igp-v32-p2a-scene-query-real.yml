# Private original NBA SDK source, public displays only QA counts and source grades.
name: IGP 3.2 P2A original NBA bounded two player ball scene query acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-p2a-scene-query-real.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  scene-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private checkout, source free P2A query provenance tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_v32_p2a_scene_source_shadow_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_v32_p2a_scene_source_shadow_v1.py'
          echo IGP_P2A_SINGLE_SCENE_PROVENANCE_SOURCE_FREE_QA_PASS
      - name: Original SDK real source SHA and PBP 2-game strict S1 query
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY' > "$RUNNER_TEMP/p2a-scene-private.log" 2>&1 || {
          import json
          from pathlib import Path
          from igp_71_source_context_v1 import source_index,load_context
          from igp_68_live_play_tracking_qa_v1 import (
            LIVE,official_event_pair_segments,clip_to_official_windows
          )
          from query_igp_v32_p2a_scene_source_shadow_v1 import query
          from igp_v32_v5_outside_s1_native_postings_v1 import canonical
          root=Path('.')
          si=source_index(root)
          checked=[]
          for gid in ('0022600001','0022600092','0022600122'):
              ctx,e=load_context(root,gid,entries=si['per_game'])
              p=json.loads((root/'gamepulse/fusion/official_pbp_timing/games'/(gid+'.json')).read_bytes())
              seg=clip_to_official_windows(
                 official_event_pair_segments(p['actions'])[0],ctx['official_paired_windows'])
              live=next((s for s in seg if s[2]==LIVE and (s[0]+99)//100*100<=s[1]),None)
              if live is None:raise ValueError('NO_ORIGINAL_S1_SOURCE_TEST_SEGMENT')
              t=((live[0]+99)//100)*100
              ans=query(root,gid,t,cap=500)
              assert ans['status']=='SOURCE_GROUNDED_OFFICIAL_NBA_S1_PBP_CLOCK_PROXY'
              assert ans['original_sdk_manifest_sha256']==e['native_source_manifest_sha256']
              assert ans['not_a_certified_physical_possession']
              assert ans['P2A_shadow_tracking']['source_not_independent_video_physical_truth'] if (
                  'source_not_independent_video_physical_truth' in ans['P2A_shadow_tracking']
                  ) else True
              assert len(ans['official_oncourt_ten'])==10
              assert ans['new_accepted_physical_scenes']==0
              checked.append(gid)
          assert len(checked)==3
          print('IGP_P2A_REAL_NBA_SINGLE_SCENE_ORIGINAL_SOURCE_QA',
            json.dumps({'source_games':len(checked),'source_sha_verified':True,
               'correct_official_NBA_ten':True,'no_physical_custody_claim':True}))
          PY
            echo IGP_P2A_REAL_SDK_SCENE_OR_PBP_PROVENANCE_QUERY_REJECTED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          x=(Path(os.environ['RUNNER_TEMP'])/'p2a-scene-private.log').read_text(errors='replace').splitlines()
          v=next((s for s in reversed(x) if re.match(
              r'^(?:ValueError|KeyError|TypeError|AssertionError|ImportError|FileNotFoundError):',s)),None)
          print('IGP_P2A_SCENE_QUERY_PRIVATE_FAILURE',re.sub(r'[0-9]{4,}','[ID]',v or 'UNKNOWN')[:160])
          PY
            exit 41
          }
          echo IGP_P2A_REAL_THREE_GAME_SHA_NATIVE_AND_OFFICIAL_PBP_QUERY_PASS
