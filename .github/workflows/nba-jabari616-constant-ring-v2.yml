name: Jabari616 source-observed frozen 1.3 team and green ring video
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-jabari616-constant-ring-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jabari616-source-observed-frozen-ring-v2
  cancel-in-progress: false
jobs:
  frozen-ring-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact public runner confidentiality policy
        run: |
          python3 - <<'PY'
          from tools.public_content_guard import scan
          path='.github/workflows/nba-jabari616-constant-ring-v2.yml'
          findings=scan([path])
          if findings:
              raise SystemExit('JABARI_PUBLIC_BRIDGE_PRIVACY_REJECTED')
          print('JABARI_PUBLIC_BRIDGE_PRIVACY_PASS')
          PY
      - name: Run SHA-locked source-observed frozen HoopVision rings on real Jabari video
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 3
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          export YOLO_CONFIG_DIR="$ROOT/yolo"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_616_constant_jabari_render.py?ref=main' --jq .content | base64 -d > "$ROOT/renderer.py"
          python3 -m py_compile "$ROOT/renderer.py"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --disable-pip-version-check -q 'ultralytics==8.3.228' 'scipy>=1.11,<2' 'numpy<2' 'opencv-python-headless<4.11'
          python3 "$ROOT/renderer.py"
