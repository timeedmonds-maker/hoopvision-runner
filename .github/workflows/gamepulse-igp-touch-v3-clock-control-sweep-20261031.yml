name: IGP Rockets Bucks v3 clock-control touch research sensitivity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-touch-v3-clock-control-sweep-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-touch-v3-clock-control-development
  cancel-in-progress: false
jobs:
  evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v31-halfcourt-touch-sequence-query-20261031
      PINNED_PRIVATE_SHA: b7865d56f46e67827f375bd757ad378c33bb96ed
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify private SHA and public data guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion gamepulse/live
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free deterministic clock tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_touch_v3_clock_control_sweep.py'
      - name: Original game 0022600138 all candidate sensitivity (PRIVATE)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_touch_v3_clock_control_sweep.py \
            --root . --game-id 0022600138 \
            --reference gamepulse/fusion/benchmarks/nba_0022600138_rockets_user_screenshot_playertrack_v1.json \
            --output "$RUNNER_TEMP/igp_touch_v3_clock_control_0138_private.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp_touch_v3_clock_control_0138_private.json').read_text())
          assert len(obj['settings'])==24
          assert obj['reference_players']==7
          assert obj['source_frames']==30643
          assert obj['raw_source_and_accepted_model_unchanged']
          for item in obj['settings']:
              assert item['total']['nba']==195 and item['paint']['nba']==20
              assert item['total']['players']==7 and item['paint']['players']==7
              assert item['unresolved_orientation']<=3
          print('IGP_TOUCH_V3_SWEEP_PRIVATE_QA_PASS',json.dumps({
              'settings':len(obj['settings']), 'original_proximity_episodes':obj['original_proximity_episodes'],
              'original_episode_clock_labels':obj['original_episode_clock_labels'],
              'best_development_wape':obj['ranked_settings'][0]['total']['wape'],
              'best_development_paint_wape':obj['ranked_settings'][0]['paint']['wape'],
              'nba_reference_players':obj['reference_players'],
              'certified_physical_touches':0},sort_keys=True))
          PY
      - name: Commit data-only sensitivity results to private branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'igp_touch_v3_clock_control_0138_private.json'
          payload=src.read_bytes()
          if len(payload)>950000:raise ValueError('PRIVATE_REPORT_TOO_LARGE')
          dest='repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/igp_touch_v3_clock_control_0022600138_sweep_qa.json'
          branch=os.environ['BRANCH']
          for i in range(4):
            prior=subprocess.run(['gh','api',dest+'?ref='+branch],capture_output=True,text=True)
            body={'branch':branch,'message':'qa(igp): NBA-source live/dead touch sweep private development QA','content':base64.b64encode(payload).decode()}
            if prior.returncode==0:body['sha']=json.loads(prior.stdout)['sha']
            done=subprocess.run(['gh','api','-X','PUT',dest,'--input','-'],input=json.dumps(body),capture_output=True,text=True)
            if done.returncode==0:break
          else:raise ValueError('PRIVATE_DEVELOPMENT_QA_WRITE_FAILED')
          print('IGP_TOUCH_V3_DEVELOPMENT_REPORT_SAVED_PRIVATE')
          PY