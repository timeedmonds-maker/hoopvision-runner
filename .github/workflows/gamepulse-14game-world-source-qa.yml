name: Game Pulse 14-game world teacher source QA (private receipt)
# Sources and detailed QA stay PRIVATE. Public GitHub CPU reads an immutable
# audited commit from private 104 and saves report ONLY to private 104 Release.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-14game-world-source-qa.yml']
  pull_request:
    paths: ['.github/workflows/gamepulse-14game-world-source-qa.yml', 'tools/public_content_guard.py']
permissions:
  contents: read
concurrency:
  group: gamepulse-world-14game-source-qa
  cancel-in-progress: false
jobs:
  public-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no private licensed payload is committed publicly
        run: python3 tools/public_content_guard.py
  qualify-private-archives:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: public-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Verify 14 SDK captures and save private qualification report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          AUDIT_COMMIT: 6221b350c44fcea2b7a1e2d86edd86c2f1fd93aa
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_QA_CREDENTIAL_UNAVAILABLE'; exit 3; }
          WORK="$(mktemp -d)"
          export WORK
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/scripts" "$WORK/qa"
          gh api "repos/timeedmonds-maker/104/contents/scripts/audit_gamepulse_training_2026_27.py?ref=$AUDIT_COMMIT" --jq .content | base64 -d > "$WORK/scripts/audit.py"
          python3 -m py_compile "$WORK/scripts/audit.py"
          echo 'SOURCE_AUDIT_BEGIN_PRIVATE_DOWNLOAD_AND_VERIFY'
          for ID in 0022600001 0022600002 0022600003 0022600004 0022600005 0022600085 0022600086 0022600087 0022600088 0022600089 0022600090 0022600091 0022600092 0022600093; do
            TAG="gamepulse-sdk-$ID"
            D="$WORK/$TAG"
            mkdir -p "$D"
            gh release download "$TAG" --repo timeedmonds-maker/104 --dir "$D" \
              --pattern 'sdk-part-*.tar.gz' --pattern 'sdk-part-*.json' --pattern 'sdk-COMPLETE.json' >/dev/null
            gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$D/release_metadata.json"
            export AUDIT_DIR="$D"
            python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          p=Path(os.environ['AUDIT_DIR'])
          release=json.loads((p/'release_metadata.json').read_text())
          expected={}
          for asset in release['assets']:
              name=asset['name']
              if re.fullmatch(r'sdk-part-\d{2}\.(json|tar\.gz)|sdk-COMPLETE\.json',name):
                  digest=asset.get('digest','')
                  if not re.fullmatch(r'sha256:[a-f0-9]{64}',digest):
                      raise ValueError('missing trusted source asset SHA')
                  expected[name]=digest.partition(':')[2]
          if len(expected)!=27: raise ValueError('missing one or more original release assets')
          for name,digest in expected.items():
              data=(p/name).read_bytes()
              if hashlib.sha256(data).hexdigest()!=digest:
                  raise ValueError('source asset SHA mismatch')
          PY
            if python3 "$WORK/scripts/audit.py" --sdk-dir "$D" --out "$WORK/qa/$ID.json" >/dev/null 2>"$WORK/qa/$ID.error"; then
              rm -f "$WORK/qa/$ID.error"
              echo "SOURCE_QA_GAME_PASSED_$ID"
            else
              echo "$ID" >> "$WORK/quarantined_ids.txt"
              echo "SOURCE_QA_GAME_QUARANTINED_$ID"
              export AUDIT_ERROR_PATH="$WORK/qa/$ID.error" AUDIT_FAILURE_ID="$ID"
              python3 - <<'PY'
          import os
          from pathlib import Path
          error=Path(os.environ['AUDIT_ERROR_PATH']).read_text()
          known=['invalid source observations','SDK part range gap/overlap',
                 'part source identity / manifest discrepancy',
                 'sidecar archive_sha256 does not match original tarball',
                 'declared SDK inclusive end_ms disagrees with windows',
                 'SDK source part ordinal mismatch',
                 'SDK start/window_count is not five-second aligned',
                 'more distinct timestamps than part manifest',
                 'incomplete window capture','cross-game','missing']
          category=next((x.replace(' ','_') for x in known if x in error),'OTHER_QUARANTINE')
          print('SOURCE_QA_FAILURE_CLASS',os.environ['AUDIT_FAILURE_ID'],category,flush=True)
          PY
              export DEBUG_DIR="$D" DEBUG_GAME="$ID"
              # Expose only mismatch field NAMES and equality booleans; never
              # private position values, source timestamps, tokens or footage.
              python3 - <<'PY'
          import json,os,tarfile
          from pathlib import Path
          path=Path(os.environ['DEBUG_DIR'])
          for p in sorted(path.glob('sdk-part-??.tar.gz')):
              with tarfile.open(p,'r:gz') as t:
                  members={Path(m.name).name:m for m in t.getmembers() if m.isfile()}
                  payload=json.loads(t.extractfile(members['manifest.json']).read())
              side=json.loads((path/(p.name.replace('.tar.gz','.json'))).read_text())
              different=sorted(k for k in set(payload)|set(side) if payload.get(k)!=side.get(k))
              game_ok=payload.get('game_id')==os.environ['DEBUG_GAME']
              schema_ok=payload.get('schema')=='nba-gamepulse-sdk-chunk.v1'
              if different or not game_ok or not schema_ok:
                  print('SOURCE_MANIFEST_ROOTCAUSE',os.environ['DEBUG_GAME'],p.name,
                        'different_fields='+','.join(different),
                        'game_id_match='+str(game_ok),
                        'schema_match='+str(schema_ok),flush=True)
                  break
          PY
            fi
            rm -rf "$D"
          done
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          work=Path(os.environ['WORK'])
          files=sorted((work/'qa').glob('*.json'))
          reports=[json.loads(f.read_text())['games'][0] for f in files]
          quarantined=(work/'quarantined_ids.txt')
          bad=quarantined.read_text().splitlines() if quarantined.exists() else []
          if len(reports)+len(bad)!=14: raise RuntimeError('incomplete_14game_run')
          sys.path.insert(0,str(work/'scripts'))
          from audit import split_games
          allids=['0022600001','0022600002','0022600003','0022600004','0022600005',
                  '0022600085','0022600086','0022600087','0022600088','0022600089',
                  '0022600090','0022600091','0022600092','0022600093']
          if set([q['game_id'] for q in reports]+bad)!=set(allids):
              raise RuntimeError('duplicate_or_unknown_game_id')
          errors={gid:(work/'qa'/(gid+'.error')).read_text().splitlines()[-1] for gid in bad}
          result={'schema':'courtcoder.gamepulse-14game-world-source-qualification.v1',
                  'release_count_inspected':len(allids),
                  'deep_source_audits_passed':len(reports),
                  'quarantined_game_ids':bad,
                  'private_failure_reasons':errors,
                  'qualification_state':'INTEGRITY_QUARANTINE' if bad else 'PRELIMINARY_SOURCE_QA_COMPLETE',
                  'video_supervised_labels_admitted':0,
                  'training_or_runtime_authorized':False,
                  'protected_evaluator_touched':False,
                  'frozen_world_engine_changed':False,
                  'training_split':split_games(allids),
                  'games':reports,
                  'camera_video_PTS_sync':'NOT_ESTABLISHED',
                  'next_gate':'REPAIR_SOURCE_MANIFESTS_AND_CERTIFY_INDEPENDENT_VIDEO_WORLD'}
          (work/'gamepulse-14game-qualification.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          TAG='gamepulse-world-source-qa-20261022'
          gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1 ||
            gh release create "$TAG" --repo timeedmonds-maker/104 --title 'Private 14-game CourtCoder source qualification' \
              --notes 'Observed SDK archives QA; no player-level data outside private repository; no model or video labels.' --latest=false >/dev/null
          gh release upload "$TAG" "$WORK/gamepulse-14game-qualification.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          echo 'SOURCE_QA_14GAME_PRIVATE_RECEIPT_UPLOADED_NO_VIDEO_LABELS'
          if [ -s "$WORK/quarantined_ids.txt" ]; then
            echo 'SOURCE_QA_INTEGRITY_QUARANTINE__NOT_TRAINING_READY'
            exit 2
          fi
