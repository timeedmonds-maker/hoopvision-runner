name: Provision Singapore L4 Failover

on:
  push:
    branches: [main]
    paths: ['.github/workflows/provision-singapore-l4-failover.yml']

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONES: asia-southeast1-a asia-southeast1-b
  INSTANCE: hv-dev-l4
  MACHINE_TYPE: g2-standard-8
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  RUNTIME_SA: hoopvision-worker@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
  CANDIDATE_SHA: 4c43854249343623f4b79bdb34fa37af9b4a6e5b
  BASE_IMAGE: asia-southeast1-docker.pkg.dev/project-d88c48c6-7f48-4c33-928/hoopvision-containers/hoopvision-nextgen@sha256:d4eb6ac02af990bb40d1aa56fbf57ce9c9787f7f1e7eb722f511dc52f0c7c74c
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  PROVISION_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact candidate control plane
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PROVISION_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Create failover L4 in first available Singapore zone
        shell: bash
        run: |
          set -euo pipefail
          SELECTED_ZONE=""
          for Z in $ZONES; do
            if gcloud compute instances describe "$INSTANCE" --zone "$Z" --project "$PROJECT_ID" >/dev/null 2>&1; then
              STATUS="$(gcloud compute instances describe "$INSTANCE" --zone "$Z" --project "$PROJECT_ID" --format='value(status)')"
              if test "$STATUS" = "RUNNING"; then SELECTED_ZONE="$Z"; break; fi
              echo "Existing $INSTANCE in $Z is $STATUS; skipping."
              continue
            fi
            set +e
            gcloud compute instances create "$INSTANCE"               --project "$PROJECT_ID" --zone "$Z" --machine-type "$MACHINE_TYPE"               --image-family common-cu129-ubuntu-2204-nvidia-580               --image-project deeplearning-platform-release               --boot-disk-type pd-balanced --boot-disk-size 200GB               --service-account "$RUNTIME_SA" --scopes cloud-platform               --maintenance-policy TERMINATE --no-restart-on-failure               --max-run-duration 4h --instance-termination-action STOP               --labels hoopvision=development,role=prepared-l4,failover=true               > /tmp/create.log 2>&1
            RC=$?
            set -e
            cat /tmp/create.log
            if test "$RC" -eq 0; then SELECTED_ZONE="$Z"; break; fi
            if grep -Eq 'ZONE_RESOURCE_POOL_EXHAUSTED|resource_availability|does not have enough resources|currently unavailable|STOCKOUT' /tmp/create.log; then
              echo "STOCKOUT $Z"
              continue
            fi
            exit "$RC"
          done
          test -n "$SELECTED_ZONE" || { echo "NO_SINGAPORE_L4_CAPACITY"; exit 42; }
          echo "SELECTED_ZONE=$SELECTED_ZONE" >> "$GITHUB_ENV"
          echo "HOOPVISION_FAILOVER_ZONE=$SELECTED_ZONE"
      - name: Wait for SSH
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            if gcloud compute ssh "$INSTANCE" --zone "$SELECTED_ZONE" --project "$PROJECT_ID" --quiet --command='echo SSH_OK' >/tmp/ssh.out 2>/tmp/ssh.err; then
              cat /tmp/ssh.out; ok=1; break
            fi
            sleep 5
          done
          if test "$ok" != 1; then cat /tmp/ssh.err; exit 3; fi
      - name: Copy exact control plane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          cp src/tools/release/dev_supervisor.py stage/
          cp src/tools/release/durable_events.py stage/
          cp src/hoopvision/core/control_plane_contract.py stage/
          cp src/infra/hoopvision-dev/hoopvision-dev-supervisor.service stage/
          cp scripts/install_ppocrv6_exact.py stage/
          gcloud compute scp stage/* "$INSTANCE:/tmp/" --zone "$SELECTED_ZONE" --project "$PROJECT_ID" --quiet
      - name: Configure prepared host and commercial assets
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "$INSTANCE" --zone "$SELECTED_ZONE" --project "$PROJECT_ID" --quiet --command="sudo bash -s" <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          ROOT=/srv/hoopvision
          CONTROL=/opt/hoopvision-control
          BASE_IMAGE='asia-southeast1-docker.pkg.dev/project-d88c48c6-7f48-4c33-928/hoopvision-containers/hoopvision-nextgen@sha256:d4eb6ac02af990bb40d1aa56fbf57ce9c9787f7f1e7eb722f511dc52f0c7c74c'
          BUCKET='project-d88c48c6-7f48-4c33-928-hoopvision-dev'
          mkdir -p "$ROOT"/{models/cache,models/nbacv,fixtures,apps,runs,spool} "$CONTROL"
          touch "$ROOT/last_activity"
          apt-get update -qq
          apt-get install -y -qq docker.io curl ca-certificates gnupg python3-venv python3-pip ffmpeg jq
          systemctl enable --now docker
          if ! command -v nvidia-ctk >/dev/null 2>&1; then
            curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
            curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list |               sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#'               > /etc/apt/sources.list.d/nvidia-container-toolkit.list
            apt-get update -qq
            apt-get install -y -qq nvidia-container-toolkit
          fi
          nvidia-ctk runtime configure --runtime=docker
          systemctl restart docker
          nvidia-smi

          install -m 0755 /tmp/dev_supervisor.py "$CONTROL/dev_supervisor.py"
          install -m 0644 /tmp/durable_events.py "$CONTROL/durable_events.py"
          install -m 0644 /tmp/control_plane_contract.py "$CONTROL/control_plane_contract.py"
          install -m 0644 /tmp/hoopvision-dev-supervisor.service /etc/systemd/system/hoopvision-dev-supervisor.service
          if test ! -x "$CONTROL/venv/bin/python"; then python3 -m venv "$CONTROL/venv"; fi
          "$CONTROL/venv/bin/pip" install --disable-pip-version-check -q google-cloud-storage==3.4.0 google-cloud-pubsub==2.31.1 huggingface_hub

          curl -L --fail --retry 3 -o "$ROOT/models/cache/rfdetr_m_640.onnx" https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx
          echo "708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939  $ROOT/models/cache/rfdetr_m_640.onnx" | sha256sum -c -
          curl -L --fail --retry 3 -o "$ROOT/models/cache/court_yolo11m_pose.pt" https://huggingface.co/AnzeZ/basketball-court-yolo11m-pose/resolve/main/best.pt
          curl -L --fail --retry 3 -o "$ROOT/models/cache/ppocrv5_latin_rec.onnx" https://github.com/gitakoos/ocr-models/releases/download/v1/rec_latin.onnx
          echo "995b0f5f28d2073896a78c03b5b863eae6af3744bafa0245b8522beea6994927  $ROOT/models/cache/ppocrv5_latin_rec.onnx" | sha256sum -c -
          curl -L --fail --retry 3 -o "$ROOT/models/cache/ppocrv5_latin_dict.txt" https://github.com/gitakoos/ocr-models/releases/download/v1/ppocrv5_latin_dict.txt
          echo "ccbcc45730b3fbbd9050c5bc74db6a99067141ef1035e3d14889a84a6b9b1aff  $ROOT/models/cache/ppocrv5_latin_dict.txt" | sha256sum -c -
          rm -f "$ROOT/models/nbacv/parseq_soccernet.ckpt" "$ROOT/models/nbacv/legibility_soccernet.pth"
          "$CONTROL/venv/bin/python" /tmp/install_ppocrv6_exact.py
          gcloud storage cp "gs://$BUCKET/models/sam31/sam3.1_multiplex.pt" "$ROOT/models/cache/sam3.1_multiplex.pt"
          test "$(stat -c %s "$ROOT/models/cache/sam3.1_multiplex.pt")" = "3502755717"

          cat > "$ROOT/fixtures/toronto_fixture.json" <<'JSON'
          {"schema":"hoopvision.fixture-descriptor.v1","game":"0022500131","event":"585","angle":"Broadcast","start_s":5.5,"end_s":15.5}
          JSON
          cat > /etc/hoopvision-dev.env <<EOF
          GOOGLE_CLOUD_PROJECT=project-d88c48c6-7f48-4c33-928
          HOOPVISION_DEV_SESSION_ID=hv-dev-l4
          HOOPVISION_RELEASE_BUCKET=$BUCKET
          HOOPVISION_EVIDENCE_BUCKET=$BUCKET
          HOOPVISION_DEV_SUBSCRIPTION=hv-dev-worker
          HOOPVISION_BASE_IMAGE=$BASE_IMAGE
          HOOPVISION_OUTPUT_BUCKET=$BUCKET
          HOOPVISION_DEV_ROOT=$ROOT
          HOOPVISION_DEV_PORT=18080
          HOOPVISION_READY_TIMEOUT_S=300
          HOOPVISION_BENCHMARK_TIMEOUT_S=900
          HOOPVISION_SUPERVISOR_BUILD_REVISION=4c43854249343623f4b79bdb34fa37af9b4a6e5b
          EOF
          chmod 0600 /etc/hoopvision-dev.env
          systemctl daemon-reload
          systemctl enable hoopvision-dev-supervisor.service
          REMOTE
      - name: Preload immutable GPU image
        shell: bash
        run: |
          set -euo pipefail
          set +x
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          printf '%s
' "$ACCESS_TOKEN" | gcloud compute ssh "$INSTANCE" --zone "$SELECTED_ZONE" --project "$PROJECT_ID" --quiet             --command='sudo docker login -u oauth2accesstoken --password-stdin asia-southeast1-docker.pkg.dev >/dev/null'
          unset ACCESS_TOKEN
          set -x
          gcloud compute ssh "$INSTANCE" --zone "$SELECTED_ZONE" --project "$PROJECT_ID" --quiet             --command="sudo docker pull '$BASE_IMAGE'; RC=\$?; sudo docker logout asia-southeast1-docker.pkg.dev >/dev/null 2>&1 || true; exit \$RC"
          gcloud compute ssh "$INSTANCE" --zone "$SELECTED_ZONE" --project "$PROJECT_ID" --quiet             --command="sudo docker run --rm --pull=never --gpus all --entrypoint python '$BASE_IMAGE' -c 'import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))'"
      - name: Start supervisor and verify queued Toronto consumption
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "$INSTANCE" --zone "$SELECTED_ZONE" --project "$PROJECT_ID" --quiet             --command='sudo systemctl restart hoopvision-dev-supervisor.service && sleep 4 && sudo systemctl is-active hoopvision-dev-supervisor.service'
          RUN_ID='public-36062527172-1-95bd1d0abd99'
          for i in $(seq 1 90); do
            EVENTS="$(gcloud storage ls "gs://$BUCKET/runs/$RUN_ID/events/**" 2>/dev/null | wc -l | tr -d ' ')"
            echo "EVENT_COUNT=$EVENTS"
            if test "$EVENTS" -ge 2; then
              for x in $(gcloud storage ls "gs://$BUCKET/runs/$RUN_ID/events/**"); do gcloud storage cat "$x"; done
              exit 0
            fi
            sleep 2
          done
          echo "QUEUED_TORONTO_NOT_CONSUMED"
          exit 5
