name: Probe G4 Rolls Royce Now

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-g4-rolls-royce-now.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  RUNTIME_SA: hoopvision-worker@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
  PROBE_NONCE: '1790303137241'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe full G4 RTX PRO 6000 capacity
        shell: bash
        run: |
          set -euo pipefail

          probe_g4() {
            LABEL="$1"
            ZONE="$2"
            INSTANCE="$3"
            echo "=== PROBE $LABEL g4-standard-48 $ZONE ==="
            gcloud compute machine-types describe g4-standard-48 --zone "$ZONE" --project "$PROJECT_ID" --format='yaml(name,guestCpus,memoryMb)' || {
              echo "$LABEL"_RESULT=UNSUPPORTED
              return 0
            }
            set +e
            gcloud compute instances create "$INSTANCE" \
              --project "$PROJECT_ID" \
              --zone "$ZONE" \
              --machine-type g4-standard-48 \
              --image-family common-cu129-ubuntu-2204-nvidia-580 \
              --image-project deeplearning-platform-release \
              --boot-disk-type hyperdisk-balanced \
              --boot-disk-size 100GB \
              --service-account "$RUNTIME_SA" \
              --scopes cloud-platform \
              --maintenance-policy TERMINATE \
              --no-restart-on-failure \
              --max-run-duration 10m \
              --instance-termination-action DELETE \
              --quiet > "/tmp/$LABEL.log" 2>&1
            RC=$?
            set -e
            cat "/tmp/$LABEL.log"
            if test "$RC" -eq 0; then
              echo "$LABEL"_RESULT=AVAILABLE
              gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" \
                --format='yaml(name,status,zone,machineType,guestAccelerators,disks.initializeParams.diskType)'
              gcloud compute instances delete "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --delete-disks=all --quiet || true
            else
              echo "$LABEL"_RESULT=UNAVAILABLE_OR_BLOCKED
            fi
          }

          probe_g4 TOKYO_G4 asia-northeast1-b hv-probe-tokyo-g4
          probe_g4 TAIWAN_G4 asia-east1-a hv-probe-taiwan-g4
          echo "HOOPVISION_G4_ROLLS_ROYCE_PROBE_COMPLETE"
