name: IPPT physical shot release ball-shooter source-only challenger
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-ball-shot-release-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content safety and original SHA NBA source private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
            gamepulse/fusion data/extensions/nba_blueprint_2026_27
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Original-source physics candidate tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_source_ball_shot_release_candidate_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_source_ball_shot_release_candidate_2026.py
      - name: Two prior development games original NBA real ball shooter release candidates
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_ippt_source_ball_shot_release_candidate_2026.py \
            --root . --games 0022600009 0022600092
          echo "IPPT_BALL_SHOOTER_TWO_DEV_GAMES_PASS"
      - name: Four prior diagnostics games physics candidate no contest target leakage
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_ippt_source_ball_shot_release_candidate_2026.py \
             --root . --games 0022600089 0022600098 0022600103 0022600107
          echo "IPPT_BALL_SHOOTER_FOUR_DIAGNOSTIC_GAMES_PASS"

# Source-only hypothesis not a physically certified NBA shot-release measurement.
