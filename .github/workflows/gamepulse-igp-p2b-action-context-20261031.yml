# Public orchestrator only. NBA original player/ball XYZ and per-action QA stay in private repository.
name: IGP v32 P2B 71game PBP bounded possession action context
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-igp-p2b-action-context-20261031.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-p2b-action-context-full71-20261031
  cancel-in-progress: true
jobs:
  game0001-context-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Original private source and pure event-context tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_v32_p2b_event_context_window_v1.py \
            gamepulse/fusion/igp_v32_p2b_all71_official_action_context_source_qa_v1.py \
            gamepulse/fusion/query_igp_v32_p2b_official_action_tracking_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_event_context_window_v1.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_all71_official_action_context_source_qa_v1.py'
          echo IGP_P2B_PBP_ACTION_CONTEXT_SOURCEFREE_QA_PASSED
      - name: Original game0001 all action P2B tracking-sequence coverage
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_all71_official_action_context_source_qa_v1.py \
            --root . --only-game 0022600001 \
            --out "$RUNNER_TEMP/igp-p2b-0001-context.json" \
            >"$RUNNER_TEMP/igp-p2b-0001-context.log" 2>&1 || {
              echo IGP_P2B_ORIGINAL_ACTION_CONTEXT_0001_FAILURE
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"igp-p2b-0001-context.log").read_text(errors="replace").splitlines()
          t=next((z for z in reversed(lines) if re.match(r"^(?:ValueError|KeyError|TypeError|FileNotFoundError|ImportError|AssertionError):",z)),None)
          if t:
              typ,_,msg=t.partition(":");code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_P2B_CONTEXT_PRIVATE_FAILURE",typ,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_P2B_CONTEXT_PRIVATE_FAILURE UNCLASSIFIED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-p2b-0001-context.json").read_text())
          c=q["counts"]
          assert q["games"]==1
          assert c["actions"]==593
          assert c["S1_scene_count"]==14354
          assert c["P2B_complete_all_S1"]==13142
          assert c["official_logical_chains"]==198
          assert len(q["per_game"]["0022600001"]["official_action_context_rows"])==593
          print("IGP_P2B_0001_ACTION_TRACKING_SEQUENCE_PILOT",json.dumps(c,sort_keys=True))
          PY
      - name: Save private source-verified game0001 context QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"igp-p2b-0001-context.json").read_bytes()
          x=json.loads(raw)
          o=Path("gamepulse/fusion/qa/igp_v32/igp_v32_p2b_0001_action_context_pilot_20261031.json")
          rec={"schema":"igp.v32.p2b.0001.action-context.source-QA.v1",
               "original_game_source_QA_SHA256":hashlib.sha256(raw).hexdigest(),
               "counts":x["counts"],"physical_possessions_certified":0}
          o.parent.mkdir(parents=True,exist_ok=True)
          if o.exists() and json.loads(o.read_bytes())!=rec:
              raise ValueError("CONTEXT_PILOT_IMMUTABLE_RECEIPT_CONFLICT")
          o.write_text(json.dumps(rec,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_0001_action_context_pilot_20261031.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'qa(igp): 0001 P2B official event bounded sequence context'
          gh auth setup-git
          for n in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P2B_0001_ACTION_CONTEXT_PILOT_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
  all71-action-context:
    needs: game0001-context-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Full immutable original NBA source action-context QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_all71_official_action_context_source_qa_v1.py \
            --root . --out "$RUNNER_TEMP/igp-p2b-71-context.json" \
            >"$RUNNER_TEMP/igp-p2b-71-context.log" 2>&1 || {
              echo IGP_P2B_ORIGINAL_ALL71_ACTION_CONTEXT_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"igp-p2b-71-context.log").read_text(errors="replace").splitlines()
          t=next((z for z in reversed(lines) if re.match(r"^(?:ValueError|KeyError|TypeError|FileNotFoundError|ImportError|AssertionError):",z)),None)
          if t:
              typ,_,msg=t.partition(":");code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_P2B_CONTEXT_PRIVATE_FAILURE",typ,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_P2B_CONTEXT_PRIVATE_FAILURE UNCLASSIFIED")
          PY
              exit 42
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-p2b-71-context.json").read_text())
          c=d["counts"]
          assert d["games"]==71
          assert c["actions"]==43419 and c["official_logical_chains"]==14612
          assert c["S1_scene_count"]==1159651
          assert c["P2B_complete_all_S1"]==1015072
          assert all(len(x["official_action_context_rows"])==x["counts"]["actions"]
                     for x in d["per_game"].values())
          print("IGP_P2B_ALL71_ACTION_SEQUENCE_CONTEXT_MEASURED",json.dumps(c,sort_keys=True))
          PY
      - name: Commit original source full71 action context privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"igp-p2b-71-context.json").read_bytes()
          d=json.loads(raw)
          root=Path("gamepulse/fusion/qa/igp_v32")
          qa=root/"igp_v32_p2b_all71_official_action_context_source_qa_v1.json"
          summary=root/"igp_v32_p2b_all71_action_context_summary_20261031.json"
          receipt={"schema":"igp.v32.p2b.all71.action-context.source-QA.summary.v1",
             "full_SHA256":hashlib.sha256(raw).hexdigest(),
             "engine_id":d["engine_id"],"counts":d["counts"],
             "released_P2B_source_QA_SHA256":d["original_release_source_QA_SHA256"],
             "per_game":{gid:v["counts"] for gid,v in d["per_game"].items()},
             "physical_possessions_certified":0}
          root.mkdir(parents=True,exist_ok=True)
          if qa.exists() and qa.read_bytes()!=raw:raise ValueError("CONTEXT_QA_IMMUTABLE_DRIFT")
          if summary.exists() and json.loads(summary.read_bytes())!=receipt:
              raise ValueError("CONTEXT_QA_SUMMARY_IMMUTABLE_DRIFT")
          qa.write_bytes(raw)
          summary.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("IGP_P2B_ALL71_ACTION_CONTEXT_QA_SHA256",receipt["full_SHA256"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_all71_official_action_context_source_qa_v1.json
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_all71_action_context_summary_20261031.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'qa(igp): exact all71 P2B official action tracking-sequence context evidence'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P2B_ALL71_ACTION_CONTEXT_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
