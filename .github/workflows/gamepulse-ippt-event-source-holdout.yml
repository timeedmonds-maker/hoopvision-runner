name: IPPT event snapshot original-source 36 game withheld accuracy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-event-source-holdout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-event-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and authenticated private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Python syntax and zero-source heldout QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_event_source_holdout_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_event_source_holdout_2026.py
      - name: Real six-game independent original NBA event-source withheld positions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_ippt_event_source_holdout_2026.py --root . \
             --games 0022600009 0022600092 0022600089 0022600098 0022600103 0022600107
          echo "IPPT_EVENT_SIX_GAME_SOURCE_HOLDOUT_PASS"
      - name: Complete 36 game source event native XYZ short-neighbor accuracy QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_ippt_event_source_holdout_2026.py --root .
          echo "IPPT_EVENT_36GAME_SOURCE_HOLDOUT_PASS"

# Original NBA source frame masked truth: aggregate only, never private XYZ.
