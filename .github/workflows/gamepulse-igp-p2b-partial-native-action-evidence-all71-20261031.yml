# Private SHA original NBA coordinates and official PBP rows never go to public logs.
name: IGP P2B 71game official action partial original-native player-ball census
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-partial-native-action-evidence-all71-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-71-source-native-player-ball-partial-action
  cancel-in-progress: true
jobs:
  private-all71-original-native-partial:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Sourcefree original partial actor-plus-ball tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_original_native_partial_actor_ball_all71_v4.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_original_native_partial_actor_ball_all71_v4.py'
          echo IGP_ORIGINAL_NATIVE_PARTIAL_ACTOR_BALL_SOURCEFREE_PASS
      - name: Original NBA all71 player ball same-native-timestamp source census
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_original_native_partial_actor_ball_all71_v4.py \
            --root . --out "$RUNNER_TEMP/igp-native-partial-all71.json" \
            >"$RUNNER_TEMP/igp-native-partial-all71.log" 2>&1 || {
              echo IGP_PARTIAL_NATIVE_ALL71_SOURCE_QA_FAILED
              python3 - <<'PY'
          import re,os
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"igp-native-partial-all71.log").read_text(errors="replace").splitlines()
          s=next((v for v in reversed(z) if re.match(r"^(?:ValueError|KeyError|TypeError|FileNotFoundError|AssertionError|ImportError):",v)),None)
          if s:
              k,_,detail=s.partition(":")
              code=detail.strip().split(":",1)[0].split(" ",1)[0].strip("\u0027\u0022")
              print("IGP_PARTIAL_NATIVE_FAILURE",k,code if re.fullmatch(r"[A-Z0-9_]{6,90}",code) else ("MISSING_SCHEMA_"+code.upper() if k=="KeyError" and re.fullmatch(r"[A-Za-z_]{4,60}",code) else "REDACTED"))
          else:print("IGP_PARTIAL_NATIVE_FAILURE UNCLASSIFIED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-native-partial-all71.json").read_text())
          c=q["counts"]
          assert q["games"]==71 and c["actions"]==43419
          assert c["missing_full_context"]==16513
          assert c["native_same_tick_ten_official_ball"]==26502
          assert 0<=c["missing_full_but_any_player_ball"]<=16513
          assert c["native_same_tick_nine_official_ball"]<=c["native_same_tick_five_official_ball"]<=c["native_same_tick_any_player_ball"]<=43419
          assert q["physical_possessions_certified"]==0
          print("IGP_ORIGINAL_NATIVE_ALL71_PARTIAL_TRACKING_ACTION_QA_PASS",json.dumps(c,sort_keys=True))
          PY
      - name: Commit full private original source QA and compact aggregate receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"igp-native-partial-all71.json").read_bytes()
          d=json.loads(raw)
          root=Path("gamepulse/fusion/qa/igp_v32")
          full=root/"igp_v32_p2b_original_native_action_partial_ball_actor_all71_v4.json"
          summary=root/"igp_v32_p2b_partial_native_action_71_summary_20261031.json"
          receipt={"schema":"igp.v32.p2b.all71.original-native-partial-player-ball.source-summary.v4",
              "original_full_QA_SHA256":hashlib.sha256(raw).hexdigest(),
              "base_original_native_QA_SHA256":d["original_native_v3_QA_SHA256"],
              "base_native_P2B_union_QA_SHA256":d["native_P2B_union_QA_SHA256"],
              "counts":d["counts"],
              "per_game":{gid:v["counts"] for gid,v in d["per_game"].items()},
              "physical_possessions_certified":0}
          root.mkdir(parents=True,exist_ok=True)
          if full.exists() and full.read_bytes()!=raw:raise ValueError("PARTIAL_ORIGINAL_QA_OVERWRITE_FORBIDDEN")
          if summary.exists() and json.loads(summary.read_bytes())!=receipt:raise ValueError("PARTIAL_ORIGINAL_SUMMARY_OVERWRITE_FORBIDDEN")
          full.write_bytes(raw)
          summary.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("IGP_PARTIAL_NATIVE_71_PRIVATE_QA_SHA256",receipt["original_full_QA_SHA256"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_original_native_action_partial_ball_actor_all71_v4.json
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_partial_native_action_71_summary_20261031.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'qa(igp): all71 source player and ball partial coverage in incomplete official action contexts'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_ORIGINAL_NATIVE_PARTIAL_ALL71_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
