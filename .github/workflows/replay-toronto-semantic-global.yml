name: Replay Toronto Semantic Global

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replay-toronto-semantic-global.yml'

permissions:
  contents: read
  actions: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-northeast1-b
  INSTANCE: hv-dev-l4-tokyo
  RUN_ID: public-36202716389-1-c7637a7c34a2
  CANDIDATE_SHA: ec999610bf66452c6329c8993d788f6c36a4e6e9
  SAM_CHAIN_A_ARTIFACT_ID: '10899279286'
  SAM_CHAIN_B_ARTIFACT_ID: '10899218405'
  SAM_CHAIN_C_ARTIFACT_ID: '10899922899'
  SAM_DICK_ARTIFACT_ID: '10900741227'
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch exact executed SAM evidence artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "a:$SAM_CHAIN_A_ARTIFACT_ID" \
            "b:$SAM_CHAIN_B_ARTIFACT_ID" \
            "c:$SAM_CHAIN_C_ARTIFACT_ID" \
            "d:$SAM_DICK_ARTIFACT_ID"; do
            key="${spec%%:*}"
            aid="${spec##*:}"
            curl -fL --retry 4 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/timeedmonds-maker/hoopvision-runner/actions/artifacts/$aid/zip" \
              -o "/tmp/sam-chain-$key.zip"
            unzip -t "/tmp/sam-chain-$key.zip" >/dev/null
          done

      - name: Run focused CPU regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check numpy pandas pytest opencv-python-headless
          python -m py_compile src/screen_tracker_nextgen/merge_sam31_continuity_evidence.py
          set +e
          PYTHONPATH=src python -m pytest -q \
            src/screen_tracker_nextgen/test_soft_uniform_team_mapping.py \
            src/screen_tracker_nextgen/test_identity_ambiguity.py \
            src/screen_tracker_nextgen/test_global_identity_solver.py 2>&1 | tee cpu-tests.log
          RC=${PIPESTATUS[0]}
          set -e
          python src/tools/validate_governing_delivery_policy.py 2>&1 | tee -a cpu-tests.log
          git -C src diff --check 2>&1 | tee -a cpu-tests.log
          test "$RC" -eq 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Tokyo host and install instance-scoped replay key
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --format='value(status)')"
          echo "STATUS_BEFORE=$STATUS"
          if test "$STATUS" != RUNNING; then
            gcloud compute instances start "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet
          fi

          gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" \
            --format='get(metadata.items.ssh-keys)' > /tmp/hv-original-instance-ssh-keys || true

          rm -f /tmp/hv-replay-ssh /tmp/hv-replay-ssh.pub
          ssh-keygen -q -t ed25519 -N '' -C 'hoopvision-replay' -f /tmp/hv-replay-ssh
          cp /tmp/hv-original-instance-ssh-keys /tmp/hv-instance-ssh-keys.new
          if test -s /tmp/hv-instance-ssh-keys.new; then printf '\n' >> /tmp/hv-instance-ssh-keys.new; fi
          printf 'runner:%s\n' "$(cat /tmp/hv-replay-ssh.pub)" >> /tmp/hv-instance-ssh-keys.new
          gcloud compute instances add-metadata "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" \
            --metadata-from-file ssh-keys=/tmp/hv-instance-ssh-keys.new --quiet

          IP="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')"
          test -n "$IP"
          echo "HV_SSH_IP=$IP" >> "$GITHUB_ENV"
          echo "HV_SSH_USER=runner" >> "$GITHUB_ENV"
          echo "HV_SSH_KEY=/tmp/hv-replay-ssh" >> "$GITHUB_ENV"

          for i in $(seq 1 60); do
            if ssh -i /tmp/hv-replay-ssh \
              -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 "runner@$IP" 'echo SSH_OK' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          exit 3

      - name: Build explicit replay scripts
        shell: bash
        run: |
          set -euo pipefail
          tar -C src -czf /tmp/toronto-replay-code.tgz screen_tracker_nextgen

          cat > /tmp/container-replay.sh <<'CONTAINER'
          #!/usr/bin/env bash
          set -euxo pipefail
          A=/run/hoopvision/artifacts
          O=/run/hoopvision/replay-d3b56542

          echo HV_REPLAY_STAGE=merge_sam_continuity
          python /opt/hoopvision/screen_tracker_nextgen/merge_sam31_continuity_evidence.py \
            --segments "$A/identity_segments/segments.csv" \
            --source "$O/sam_sources/a/out" \
            --source "$O/sam_sources/b/out" \
            --source "$O/sam_sources/c/out" \
            --source "$O/sam_sources/d/out" \
            --source "$A/sam31" \
            --edge 35:37 \
            --edge 43:44 \
            --edge 59:105 \
            --edge 65:69 \
            --edge 69:71 \
            --edge 71:107 \
            --out-dir "$O/sam31_merged"
          cat "$O/sam31_merged/continuity_links.csv"
          cat "$O/sam31_merged/continuity_groups.csv"
          cat "$O/sam31_merged/sam31_qa.json"

          echo HV_REPLAY_STAGE=semantic_anchors
          python /opt/hoopvision/screen_tracker_nextgen/build_kickout_semantic_anchors.py \
            --source "$A/nextgen_mask/source_native.mp4" \
            --observations "$A/identity_segments/uniform_observations.csv" \
            --segments "$A/identity_segments/segments.csv" \
            --ocr-dir "$A/identity_ocr" \
            --roster "$A/exact_lineup_roster.json" \
            --base-config "$A/base_config.json" \
            --detector-onnx /models/rfdetr_m_640.onnx \
            --object-eval-src /opt/object-detection-eval/src \
            --court-frames "$A/nextgen_mask/court_frames.json" \
            --court-scale-attempts "$A/nextgen_mask/court_scale_attempts.csv" \
            --out "$O/semantic_anchors.json"

          echo HV_REPLAY_STAGE=global_identity
          python /opt/hoopvision/screen_tracker_nextgen/global_identity_solver.py \
            --observations "$A/identity_segments/uniform_observations.csv" \
            --segments "$A/identity_segments/segments.csv" \
            --ocr-dir "$A/identity_ocr" \
            --roster "$A/exact_lineup_roster.json" \
            --base-config "$A/base_config.json" \
            --sam31-dir "$O/sam31_merged" \
            --identity-anchors "$O/semantic_anchors.json" \
            --out-dir "$O/global_identity" \
            --min-render-margin 0.75

          echo HV_REPLAY_STAGE=visual_oracle
          python /opt/hoopvision/screen_tracker_nextgen/validate_toronto_visual_identity.py \
            --tracks "$A/nextgen_mask/tracks.csv" \
            --config "$O/global_identity/resolved_config.json" \
            --nextgen-qa "$A/nextgen_mask/qa.json" \
            --oracle /opt/hoopvision/screen_tracker_nextgen/toronto_visual_identity_oracle.json \
            --out "$O/global_identity/visual_identity_oracle_qa.json"

          echo HV_REPLAY_STAGE=complete
          cat "$O/semantic_anchors.json"
          cat "$O/global_identity/global_identity_qa.json"
          cat "$O/global_identity/visual_identity_oracle_qa.json"
          CONTAINER
          chmod +x /tmp/container-replay.sh

          cat > /tmp/host-replay.sh <<'HOST'
          #!/usr/bin/env bash
          set -euxo pipefail
          RUN_ID="$1"
          R="/srv/hoopvision/runs/$RUN_ID"
          test -d "$R/artifacts"
          BASE="$(grep '^HOOPVISION_BASE_IMAGE=' /etc/hoopvision-dev.env | cut -d= -f2-)"
          MODELS="$(grep '^HOOPVISION_MODEL_CACHE_HOST=' /etc/hoopvision-dev.env | cut -d= -f2- || true)"
          if test -z "$MODELS"; then MODELS=/srv/hoopvision/models/cache; fi
          test -n "$BASE"
          test -d "$MODELS"

          rm -rf "$R/replay-d3b56542"
          mkdir -p "$R/replay-d3b56542/global_identity"
          mkdir -p "$R/replay-d3b56542/sam_sources/a" "$R/replay-d3b56542/sam_sources/b" "$R/replay-d3b56542/sam_sources/c" "$R/replay-d3b56542/sam_sources/d"
          python3 -m zipfile -e /tmp/sam-chain-a.zip "$R/replay-d3b56542/sam_sources/a"
          python3 -m zipfile -e /tmp/sam-chain-b.zip "$R/replay-d3b56542/sam_sources/b"
          python3 -m zipfile -e /tmp/sam-chain-c.zip "$R/replay-d3b56542/sam_sources/c"
          python3 -m zipfile -e /tmp/sam-chain-d.zip "$R/replay-d3b56542/sam_sources/d"

          rm -rf /tmp/toronto-replay-code
          mkdir -p /tmp/toronto-replay-code
          tar -C /tmp/toronto-replay-code -xzf /tmp/toronto-replay-code.tgz
          install -m 0755 /tmp/container-replay.sh /tmp/toronto-replay-code/run-container-replay.sh

          set +e
          docker run --rm --pull=never --gpus all \
            -v /tmp/toronto-replay-code:/opt/hoopvision:ro \
            -v "$MODELS:/models:ro" \
            -v "$R:/run/hoopvision" \
            -e PYTHONUNBUFFERED=1 \
            -e PYTHONPATH=/opt/hoopvision \
            --workdir /opt/hoopvision \
            --entrypoint bash "$BASE" /opt/hoopvision/run-container-replay.sh
          RC=$?
          set -e

          if test -d "$R/replay-d3b56542"; then
            tar -C "$R/replay-d3b56542" -czf /tmp/toronto-replay-d3b56542.tgz .
            chown runner:runner /tmp/toronto-replay-d3b56542.tgz
          fi
          exit "$RC"
          HOST
          chmod +x /tmp/host-replay.sh

      - name: Stage exact replay code and scripts
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HV_SSH_KEY" \
            -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/toronto-replay-code.tgz /tmp/container-replay.sh /tmp/host-replay.sh \
            /tmp/sam-chain-a.zip /tmp/sam-chain-b.zip /tmp/sam-chain-c.zip /tmp/sam-chain-d.zip \
            "$HV_SSH_USER@$HV_SSH_IP:/tmp/"

      - name: Replay semantic anchors global identity and oracle
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i "$HV_SSH_KEY" \
            -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$HV_SSH_USER@$HV_SSH_IP" \
            "sudo bash /tmp/host-replay.sh '$RUN_ID'" 2>&1 | tee replay-remote.log
          RC=${PIPESTATUS[0]}
          set -e
          tail -n 400 replay-remote.log || true

          set +e
          scp -i "$HV_SSH_KEY" \
            -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$HV_SSH_USER@$HV_SSH_IP:/tmp/toronto-replay-d3b56542.tgz" .
          SCP_RC=$?
          set -e
          if test "$SCP_RC" -eq 0; then
            mkdir -p replay
            tar -xzf toronto-replay-d3b56542.tgz -C replay
          fi
          exit "$RC"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toronto-semantic-global-replay-d3b56542
          path: |
            replay/
            cpu-tests.log
            replay-remote.log
          if-no-files-found: warn
          retention-days: 30

      - name: Restore instance SSH metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/hv-original-instance-ssh-keys; then
            gcloud compute instances add-metadata "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" \
              --metadata-from-file ssh-keys=/tmp/hv-original-instance-ssh-keys --quiet || true
          else
            gcloud compute instances remove-metadata "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" \
              --keys=ssh-keys --quiet || true
          fi
          rm -f /tmp/hv-replay-ssh /tmp/hv-replay-ssh.pub /tmp/hv-instance-ssh-keys.new

      - name: Stop Tokyo on replay failure
        if: failure()
        run: gcloud compute instances stop "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet || true
