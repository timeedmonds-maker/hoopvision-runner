# Private SDK XYZ stays in private 104. Only aggregate status reaches public logs.
name: IGP P2B guarded default release-candidate preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-p2b-guarded-default-preflight.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  guarded-default-private-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: release/igp-v32-p2b-guarded-default-candidate-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SHA private source and fail-closed regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_default_tracking_engine_v1.py \
            gamepulse/fusion/query_igp_71_source_first_live_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_p2b_guarded_shadow_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_p2b_default_candidate_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_default_10hz_source_qa_engine_v1.py'
          echo P2B_GUARDED_NEW_DEFAULT_SOURCEFREE_QA_OK
      - name: Original NBA SHA real query readback new default vs old fallback
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY' > "$RUNNER_TEMP/guarded-default-private.log" 2>&1 || {
          from pathlib import Path
          from igp_71_source_context_v1 import source_index,load_context
          from igp_68_live_play_tracking_qa_v1 import LIVE,official_event_pair_segments,clip_to_official_windows
          from igp_v32_default_tracking_engine_v1 import DEFAULT_ENGINE,PREVIOUS_DEFAULT_ENGINE
          from query_igp_71_source_first_live_v1 import query
          import json
          root=Path(".")
          idx=source_index(root)
          for gid in ("0022600006","0022600100","0022600101"):
              ctx,_=load_context(root,gid,entries=idx["per_game"])
              actions=json.loads((root/"gamepulse/fusion/official_pbp_timing/games"/(gid+".json")).read_bytes())["actions"]
              live=next(s for s in clip_to_official_windows(
                  official_event_pair_segments(actions)[0],ctx["official_paired_windows"])
                  if s[2]==LIVE and (s[0]+99)//100*100<=s[1])
              t=(live[0]+99)//100*100
              new=query(root,gid,t,t)
              old=query(root,gid,t,t,engine=PREVIOUS_DEFAULT_ENGINE)
              assert new["engine_id"]==DEFAULT_ENGINE
              assert old["engine_id"]==PREVIOUS_DEFAULT_ENGINE
              assert new["source_qa_accepted_not_independent_physical_P1"]
              assert new["rows"][0]["source_original_xyz_native"]==old["rows"][0]["source_original_xyz_native"]
              assert new["rows"][0]["official_expected_ten"]==old["rows"][0]["official_expected_ten"]
              if old["rows"][0]["complete_ten_plus_ball"]:
                  assert new["rows"][0]["complete_ten_plus_ball"]
          print("P2B_GUARDED_NEW_DEFAULT_REAL_SOURCE_SHA_READBACK",3,"games")
          PY
            echo P2B_GUARDED_DEFAULT_REAL_SOURCE_QA_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"guarded-default-private.log").read_text(errors="replace").splitlines()
          line=next((s for s in reversed(lines) if re.match(
              r"^(?:AssertionError|ValueError|KeyError|TypeError|FileNotFoundError|ImportError|RuntimeError|StopIteration):",s)),None)
          print("P2B_DEFAULT_REDACTED_FAILURE",re.sub(r"[0-9]{4,}","[ID]",line or "UNKNOWN")[:150])
          PY
            exit 41
          }
          echo P2B_GUARDED_NEW_DEFAULT_REAL_SOURCE_QA_PASSED
