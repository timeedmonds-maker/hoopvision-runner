name: "IGP full56 real recovered late 0131 source upgraded model v3"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-0131-late-full56-model-v3.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  private-late-source-56:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private original source and all historic model SHA checks
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Rerun only 0131 from 8 original captured sources and update real 56 game model coverage
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_0131_late_original_model_upgrade_v3_20261029.py
          python3 gamepulse/fusion/igp_0131_late_original_model_upgrade_v3_20261029.py --root .
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          b=Path("gamepulse/fusion")
          p=b/"qa/igp_progress_20261029/igp_unified_56_0131_late_original_source_model_v3.json"
          x=json.loads(p.read_bytes())
          ix=json.loads((b/"materialized/igp_2026_27_unified_season_v3/index.json").read_bytes())
          assert x["games_with_original_XYZ"]==56
          assert x["full_13part_archive_games"]==54
          assert x["seven_part_original_games"]==["0022600130"]
          assert x["eight_part_original_games"]==["0022600131"]
          assert x["late_original_new_native_timestamps"]>100
          assert x["preexisting_55_game_model_sha_preserved"]
          assert x["clock_seconds_total_all56"]==153797
          assert x["counts"]["gameclock_seconds_materialized"]==153797
          assert x["complete_ten_ball_1Hz_clock_second_samples"]>=141070
          assert len(ix["per_game_model"])==56
          for gid,row in x["games"].items():
            m=Path(row["model_path"])
            assert hashlib.sha256(m.read_bytes()).hexdigest()==row["model_SHA256"],gid
          assert x["model_timestamp_accuracy_certified"] is False
          print("IGP_FINAL_GAME_LATE_SOURCE_56_MODEL_QA_PASSED",json.dumps({
            "original_games":56,"late_0131_new_native":x["late_original_new_native_timestamps"],
            "model_complete":x["complete_ten_ball_1Hz_clock_second_samples"],
            "modeled_coverage_percent":x["model_sample_coverage_pct"],
            "strict_coverage_percent":x["strict_source_supported_coverage_pct"]},sort_keys=True))
          PY
      - name: Commit validated late original tracking model and unified 56 search index to canonical private branch
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            gamepulse/fusion/materialized/igp_2026_27_unified_season_v3 \
            gamepulse/fusion/qa/igp_progress_20261029/igp_unified_56_0131_late_original_source_model_v3.json
          git diff --cached --check
          git commit -q -m 'data(igp): incorporate original 0131 final game tracking into all56 physical source model'
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_REAL_LATE_ORIGINAL_0131_SINGLE_CANONICAL_MODEL_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 23
