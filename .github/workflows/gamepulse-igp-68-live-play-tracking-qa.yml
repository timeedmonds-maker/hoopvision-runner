name: IGP 68 game live play tracking QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-live-play-tracking-qa.yml']
permissions: {contents: read}
concurrency:
  group: igp-68-live-play-tracking-qa
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      PINNED_PRIVATE_SHA: 5489417656c3f6e24b876a9593899fd6ef3c7cbd
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin private accepted source and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test state policy and score all 68 games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_live_play_tracking_qa_v1.py'
          python3 gamepulse/fusion/igp_68_live_play_tracking_qa_v1.py \
            --root . \
            --output gamepulse/fusion/qa/igp_progress_20261030/igp_68_live_play_tracking_qa_v1.json \
            > "$RUNNER_TEMP/live-private.log" 2>&1 || {
              echo IGP68_LIVE_PLAY_QA_FAILED_PRIVATE_DIAGNOSTIC
              exit 41
            }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_progress_20261030/igp_68_live_play_tracking_qa_v1.json')
          q=json.loads(p.read_text());c=q['counts']
          live='live_clock_running_pbp_proxy'
          dead='dead_clock_stopped_pbp_proxy'
          unknown='unknown_play_state'
          assert q['games']==68 and len(q['per_game'])==68
          assert c['official_window_native_frames']==867735
          assert c['official_window_10hz_samples']==1768712
          assert sum(c[x+'_native_frames'] for x in (live,dead,unknown))==867735
          assert sum(c[x+'_10hz_samples'] for x in (live,dead,unknown))==1768712
          assert c[live+'_native_frames']>0 and c[live+'_10hz_samples']>0
          assert c[live+'_conditioned_complete_ten_ball']>=c[live+'_baseline_complete_ten_ball']
          assert q['play_state_policy']['stopped_clock_breaks_excluded_from_primary_metrics'] is True
          assert q['original_source_XYZ_unchanged'] is True
          print('IGP68_LIVE_PLAY_QA_OK',json.dumps({
              'games':q['games'],
              'live_native_frames':c[live+'_native_frames'],
              'live_native_complete':c[live+'_conditioned_complete_ten_ball'],
              'live_10hz_samples':c[live+'_10hz_samples'],
              'live_10hz_complete':c[live+'_10hz_complete_ten_ball']},sort_keys=True))
          PY
      - name: Commit private immutable live-play receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_live_play_tracking_qa_v1.json
          cp "$receipt" "$RUNNER_TEMP/live-receipt.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B live-qa "origin/$BRANCH"
          cp "$RUNNER_TEMP/live-receipt.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): accept all68 live-play-only tracking metrics'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP68_LIVE_PLAY_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
