name: Recover Prepared Session Manifests
# metadata/control-plane only
# release-candidate-refresh-20260925

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-prepared-session-manifests.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  SESSION_ID: hv-dev-l4
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Recover immutable prepared-session manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p session-evidence
          gcloud storage cat "gs://$BUCKET/sessions/$SESSION_ID.json" > session-evidence/session.json
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          session=json.loads(Path("session-evidence/session.json").read_text())
          out={"session":session}
          for kind,key in (
              ("models","models_manifest_sha256"),
              ("fixtures","fixture_manifest_sha256"),
          ):
              expected=str(session.get(key) or "")
              if len(expected)!=64:
                  raise SystemExit(f"session missing valid {key}")
              uri=f"gs://project-d88c48c6-7f48-4c33-928-hoopvision-dev/manifests/{kind}/{expected}.json"
              raw=subprocess.check_output(["gcloud","storage","cat",uri])
              actual=hashlib.sha256(raw).hexdigest()
              if actual!=expected:
                  raise SystemExit(f"{kind} manifest hash mismatch {actual} != {expected}")
              Path(f"session-evidence/{kind}_manifest.json").write_bytes(raw)
              out[f"{kind}_manifest"]={
                  "uri":uri,"sha256":actual,"size_bytes":len(raw),
                  "payload":json.loads(raw),
              }
          Path("session-evidence/recovery.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hoopvision-prepared-session-manifests
          path: session-evidence/
          retention-days: 14
