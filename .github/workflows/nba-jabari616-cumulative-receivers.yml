name: NBA five receiver cumulative frozen ring output
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-jabari616-cumulative-receivers.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jabari616-five-receiver-annotated-mp4
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact reviewed user-authorized public video boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from tools.public_content_guard import scan
          p='.github/workflows/nba-jabari616-cumulative-receivers.yml'
          assert not scan([p]),'PUBLIC_BOUNDARY_VIOLATION'
          print('CUMULATIVE_RECEIVER_PUBLIC_VIDEO_BOUNDARY_PASS')
          PY
      - name: Source-lock and execute cumulative five-receiver frozen rings on CPU
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_RELEASE_AUTH_NOT_CONFIGURED; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          export YOLO_CONFIG_DIR="$ROOT/yolo"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_616_cumulative_receivers.py?ref=main' --jq .content | base64 -d > "$ROOT/renderer.py"
          python3 -m py_compile "$ROOT/renderer.py"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --disable-pip-version-check -q 'ultralytics==8.3.228' 'scipy>=1.11,<2' 'numpy<2' 'opencv-python-headless<4.11'
          python3 "$ROOT/renderer.py" --activation-selftest
          python3 "$ROOT/renderer.py"
      - name: Verify the actual five ring receivers and original green and team pulse output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/received-ring-video"
          gh release download clip-lab-jabari616-frozen-cumulative-rings --repo timeedmonds-maker/104 --dir "$RUNNER_TEMP/received-ring-video" --clobber
          export QA_DIR="$RUNNER_TEMP/received-ring-video"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['QA_DIR'])
          media=root/'jabari616-five-receivers-frozen-v13.mp4'
          qa=json.loads((root/'processing-qa.json').read_text())
          required={'1627832','201142','1630578','203992','1631095'}
          activated=set(qa.get('received_activated_players',[]))
          drawn=set(qa.get('ring_by_native_player_id',{}))
          checks={
           'exact_five_receipts': activated==required,
           'five_real_video_ring_recipients': drawn==required,
           'renderer_sha_pinned': qa.get('original_frozen_renderer_blob_sha')=='9fac8a8915b90bbd9bd1235532c297c35da77ca2',
           'original_frozen_id': qa.get('original_renderer_id')=='HOOPVISION_1_3_RINGS',
           'flashing_green_seen':qa.get('green_ring_draws',0)>0,
           'team_colour_pulse_seen':qa.get('team_colour_ring_draws',0)>0,
           'mode_count_matches_ring_draws':qa.get('green_ring_draws',0)+qa.get('team_colour_ring_draws',0)==qa.get('rendered_ring_frames',0),
           'release_media_sha':hashlib.sha256(media.read_bytes()).hexdigest()==qa.get('output_sha256'),
           'pass_activation_in_time':len(qa.get('first_reception_sequence',[]))==5
          }
          print('FIVE_RECEIVER_FROZEN_RING_QA',json.dumps(checks,sort_keys=True))
          print('FIRST_RECEIPT_SEQUENCE',json.dumps(qa.get('first_reception_sequence',[])))
          print('RING_COUNT_GREEN_TEAM',qa.get('green_ring_draws'),qa.get('team_colour_ring_draws'))
          if not all(checks.values()):
            raise RuntimeError('OUTPUT_VISUAL_QA_EVIDENCE_INCOMPLETE_NO_PUBLIC_RELEASE')
          PY
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of json "$QA_DIR/jabari616-five-receivers-frozen-v13.mp4"
          cp "$QA_DIR/jabari616-five-receivers-frozen-v13.mp4" "$GITHUB_WORKSPACE/jabari616-five-cumulative-frozen-rings.mp4"
      - name: Publish user-authorized playable MP4 publicly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='jabari616-five-receivers-frozen-rings-v1'
          gh release view "$TAG" --repo timeedmonds-maker/hoopvision-runner >/dev/null 2>&1 || gh release create "$TAG" --repo timeedmonds-maker/hoopvision-runner --title "Jabari 616 cumulative possession rings pilot" --notes "One authentic 20-second NBA clip with original SHA-locked HoopVision v1.3 floor rings. Once a Rockets player first receives the ball, their ring remains team-coloured after passing; the active holder flashes green. Exact frame/camera calibration is a visual pilot, not independent certified tracking." --latest=false
          gh release upload "$TAG" jabari616-five-cumulative-frozen-rings.mp4 --repo timeedmonds-maker/hoopvision-runner --clobber
          echo "PUBLIC_VIDEO_ASSET_READY"
      - uses: actions/upload-artifact@v4
        with:
          name: jabari616-five-receivers-frozen-ring-playable
          path: jabari616-five-cumulative-frozen-rings.mp4
          retention-days: 7
          if-no-files-found: error
