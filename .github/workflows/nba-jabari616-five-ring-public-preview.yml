name: Public playable Jabari #616 improved v3.1 CRF12 ring video
on:
  workflow_run:
    workflows: ["Jabari616 original locked v3.1 five-player ring quality rebuild", "Jabari616 frozen v3.1 efficient complete five-player ring master"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-jabari616-five-ring-public-preview.yml']
permissions:
  contents: write
jobs:
  publish-only-video:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public confidentiality policy and single-clip scope
        shell: bash
        run: |
          python3 - <<'PY'
          from tools.public_content_guard import scan
          file='.github/workflows/nba-jabari616-five-ring-public-preview.yml'
          assert not scan([file]),'PUBLIC_PREVIEW_SCOPE_REJECTED'
          print('JABARI_SINGLE_VIDEO_PUBLIC_PREVIEW_GUARD_PASS')
          PY
      - name: Export only reviewed cumulative-five video file
        shell: bash
        env:
          PRIVATE_104_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          PUBLIC_RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_104_TOKEN:-}" || exit 3
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          SOURCE_TAG=clip-lab-jabari616-v31-frozen-quality-full20
          SOURCE_VIDEO=jabari616-five-cumulative-rings-original-v31-full20-CRF12.mp4
          GH_TOKEN="$PRIVATE_104_TOKEN" gh release download "$SOURCE_TAG" --repo timeedmonds-maker/104 --dir "$ROOT"
          cp "$ROOT/$SOURCE_VIDEO" "$ROOT/jabari616-five-cumulative-rings-frozen-v31.mp4"
          export ROOT
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          video=root/'jabari616-five-cumulative-rings-frozen-v31.mp4'
          qa=root/'processing-qa.json'
          if not (video.is_file() and qa.is_file()):raise RuntimeError('UNFINISHED_PRIVATE_RENDER')
          obj=json.loads(qa.read_text())
          ids={'1627832','201142','1630578','203992','1631095'}
          drawn=obj.get('ring_by_native_player_id',{})
          modes=obj.get('ring_modes_rendered',{})
          requirements={
            'correct_event':obj.get('source_game_id')=='0022600091' and obj.get('event_num')==616,
            'five_receivers_activated':set(obj.get('final_activated_player_ids',[]))==ids,
            'all_five_drawn':all(int(drawn.get(pid,0))>0 for pid in ids),
            'one_holder_green_and_others_pulsing':int(modes.get('green',0))>0 and int(modes.get('team_pulse',0))>0,
            'frozen_original_engine':obj.get('original_frozen_renderer_git_blob_sha')=='9fac8a8915b90bbd9bd1235532c297c35da77ca2',
            'original_v31_ring_footprint':obj.get('presentation_pipeline')=='FROZEN_V31_LOCAL_FLOOR_ELLIPSE_CRF12_FULL_GAMEPLAY',
            'original_v31_radius':obj.get('locked_ring_rx')==35 and obj.get('locked_ring_ry')==13,
            'correct_camera_usage':obj.get('court_homography_role')=='PLAYER_FOOT_ASSOCIATION_ONLY_NOT_ART_WARP',
            'master_encoding':obj.get('source_master')=='H264_FROM_RAW_FRAMES_CRF12_NO_LOSSY_INTERMEDIATE',
            'complete_play_600_frames':obj.get('source_frames')==600,
            'five_rings_simultaneously_shown':obj.get('frames_with_five_visible_rings',0)>=1,
            'authentic_video_sha256':obj.get('output_sha256')==hashlib.sha256(video.read_bytes()).hexdigest(),
            'source_observed_tracking':obj.get('source_pulse_frames',0)>=100,
            'sufficient_actual_ring_frames':obj.get('rendered_ring_frames',0)>=30
          }
          print('PUBLIC_MEDIA_PREVIEW_QA_GATES',json.dumps(requirements,sort_keys=True))
          if not all(requirements.values()):raise RuntimeError('ANNOTATED_VIDEO_NOT_VALIDATED_FOR_PREVIEW')
          print('PUBLIC_MEDIA_APPROVED_MP4_BYTES',video.stat().st_size)
          PY
          test -n "${PUBLIC_RELEASE_TOKEN:-}" || exit 3
          TAG="jabari616-v31-CRF12-full20-quality-20261024"
          if ! GH_TOKEN="$PUBLIC_RELEASE_TOKEN" gh release view "$TAG" --repo timeedmonds-maker/hoopvision-runner >/dev/null 2>&1; then
            GH_TOKEN="$PUBLIC_RELEASE_TOKEN" gh release create "$TAG" --repo timeedmonds-maker/hoopvision-runner \
              --title "Jabari616 20s improved frozen v3.1 five-player rings CRF12" \
              --notes "User-approved 20-second derived MP4 preview. Original HoopVision frozen v3.1 local floor ring footprint, H.264 CRF12 single encode, five accumulating rings; Game Pulse/video/camera alignment is estimated and remains subject to visual review." \
              --latest=false
          fi
          GH_TOKEN="$PUBLIC_RELEASE_TOKEN" gh release upload "$TAG" \
            "$ROOT/jabari616-five-cumulative-rings-frozen-v31.mp4" \
            --repo timeedmonds-maker/hoopvision-runner --clobber
          GH_TOKEN="$PUBLIC_RELEASE_TOKEN" gh api repos/timeedmonds-maker/hoopvision-runner/releases/tags/"$TAG" \
            --jq '.assets[] | select(.name=="jabari616-five-cumulative-rings-frozen-v31.mp4") | [.size,.digest] | @tsv'
          echo 'USER_APPROVED_PUBLIC_PLAYABLE_JABARI_FIVE_RING_MP4_PUBLISHED'
