# Research only: 4-game same-source live 1200/1300/1500ms QA and masked contiguous gaps.
name: IGP 68 P2 4-game contiguous-gap 1300/1500 pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2-fourgame-contiguous-gap-pilot-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p2-fourgame-gap-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 6bb1deaf2e718ebcc1f4138c87851bc894f6735b
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and pin full original private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free contiguous blackouts and real-data pilot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p2_adaptive_gap_pilot_v1.py'
          python3 gamepulse/fusion/igp_68_p2_adaptive_gap_pilot_v1.py \
            --root . --output "$RUNNER_TEMP/igp68-p2-pilot-private.json" \
            > "$RUNNER_TEMP/igp68-p2-pilot-private.log" 2>&1 || {
              echo IGP68_P2_PRIVATE_ORIGINAL_SOURCE_QA_FAILED
              tail -n 8 "$RUNNER_TEMP/igp68-p2-pilot-private.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp68-p2-pilot-private.json').read_bytes())
          assert len(q["per_game"])==4 and q["scope"]=="FOUR_GAME_RESEARCH_ONLY"
          assert q["holdout_is_contiguous_original_source_blackout_not_single_frame"]
          baseline={"0022600006":(3904,15832,3639,6798),
                    "0022600111":(4040,14812,3486,6544),
                    "0022600086":(4776,13824,4421,8184),
                    "0022600122":(9863,19788,5819,10742)}
          for gid,(n,g,nc,gc) in baseline.items():
            row=q["per_game"][gid]
            assert row["counts"]["native"]==n and row["counts"]["grid"]==g
            assert row["by_side"]["1200"]["native_complete"]==nc
            assert row["by_side"]["1200"]["grid_complete"]==gc
            for dimension in ["native_complete","grid_complete"]:
              assert row["by_side"]["1200"][dimension]<=row["by_side"]["1300"][dimension]<=row["by_side"]["1500"][dimension]
          print("IGP68_P2_PILOT_MASKED_SOURCE_QA",json.dumps({
            gid:{"counts":r["counts"],"side_counts":r["by_side"],
                 "holdouts":r["masked_contiguous_original_frame_candidates"],
                 "player_added_1500_p95":r["newly_recovered_masked_error_ft"]["player_1500"]["p95"],
                 "ball_added_1500_p95":r["newly_recovered_masked_error_ft"]["ball_1500"]["p95"]}
            for gid,r in q["per_game"].items()},sort_keys=True))
          PY
      - name: Retain verified original source QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p2_fourgame_natural_gap_pilot_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p2-pilot "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp68-p2-pilot-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): retain 4-game P2 1300/1500 original SDK contiguous masked pilot'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP68_P2_PILOT_PRIVATE_RECEIPT_SAVED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
