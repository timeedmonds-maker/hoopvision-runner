name: Game Pulse Rockets Spurs original NBA FULL P1 advanced source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-rockets-spurs-native-advanced.yml'
permissions:
  contents: read
jobs:
  original-nba-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PIN: 16cff35994e15c6de9df6a3a87d42f4e562efd54
      PR_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GAME_ID: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get exact pinned private canonical code, official PBP and original user reference
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_AUTH_MISSING'; exit 3; }
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          ROOT="$RUNNER_TEMP/nba-original-provider"
          mkdir -p "$ROOT/gamepulse/fusion/tests" "$ROOT/gamepulse/fusion/nba_advanced/references"
          echo "PRIVATE_ROOT=$ROOT" >> "$GITHUB_ENV"
          fetch() {
            local path="$1"
            mkdir -p "$(dirname "$ROOT/$path")"
            gh api "repos/$PRIVATE_REPO/contents/$path?ref=$PIN" --jq .content |
              base64 --decode > "$ROOT/$path"
            test -s "$ROOT/$path" || { echo 'SOURCE_FILE_EMPTY'; exit 4; }
          }
          for file in \
            gamepulse/fusion/official_nba_advanced_ratings_2026.py \
            gamepulse/fusion/official_nba_advanced_source_2026.py \
            gamepulse/fusion/reconcile_rockets_spurs_native_advanced_2026.py \
            gamepulse/fusion/tests/test_rockets_spurs_native_provider_reconciliation_2026.py \
            gamepulse/fusion/nba_advanced/references/0022600009_hou_full_p1_all_players_20261025.json \
            gamepulse/fusion/nba_advanced/references/0022600009_hou_full_p1_20261025.json \
            gamepulse/fusion/official_pbp_timing/games/0022600009.json; do
              fetch "$file"
          done
          echo 'ORIGINAL_NBA_SOURCE_CODE_AND_REFERENCE_RETRIEVED'
      - name: Regression-test original provider fields and fail-closed screenshots
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          export PYTHONPATH="$PRIVATE_ROOT/gamepulse/fusion"
          python3 -m compileall -q "$PRIVATE_ROOT/gamepulse/fusion"
          python3 -m unittest discover \
            -s "$PRIVATE_ROOT/gamepulse/fusion/tests" \
            -p 'test_rockets_spurs_native_provider_reconciliation_2026.py' -v
      - name: Retrieve actual NBA game and quarter provider responses
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          export PYTHONPATH="$PRIVATE_ROOT/gamepulse/fusion"
          python3 - "$PRIVATE_ROOT" <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          from official_nba_advanced_source_2026 import fetch_nba_advanced,produce_game
          from reconcile_rockets_spurs_native_advanced_2026 import compare
          root=Path(sys.argv[1])
          sub=root/'gamepulse/fusion'
          pbp=json.loads((sub/'official_pbp_timing/games/0022600009.json').read_bytes())
          results={}
          for scope in ('FULL','P1'):
              try:
                  payload,raw,url=fetch_nba_advanced('0022600009',scope)
              except Exception as err:
                  print('ORIGINAL_NBA_ADVANCED_FETCH_UNAVAILABLE',scope,type(err).__name__,
                        str(err)[:1100],flush=True)
                  raise
              parsed=produce_game(pbp,scope,payload,raw,url)
              assert parsed['game_id']=='0022600009' and parsed['scope']==scope
              (root/(scope+'.native.json')).write_bytes(raw)
              (root/(scope+'.parsed.json')).write_text(json.dumps(parsed,sort_keys=True)+'\n')
              results[scope]=parsed
              print('ACTUAL_NBA_ADVANCED_SOURCE_ACQUIRED',scope,
                    'players',len(parsed['players']),
                    'original_source_sha256',hashlib.sha256(raw).hexdigest())
          ref=json.loads((sub/'nba_advanced/references/0022600009_hou_full_p1_all_players_20261025.json').read_bytes())
          ast=json.loads((sub/'nba_advanced/references/0022600009_hou_full_p1_20261025.json').read_bytes())
          report=compare(results['FULL'],results['P1'],ref,ast)
          (root/'reconciliation.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('ORIGINAL_NBA_ADVANCED_FULL_P1_FIELD_COMPARISON',
                'matching',report['cases_matching'],'total',report['cases_tested'],
                'all_match',report['all_cases_match'])
          PY
      - name: Atomically save original native responses and verification to private PR only
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PRIVATE_ROOT" <<'PY'
          import base64,hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1]);repo=os.environ['PRIVATE_REPO']
          branch=os.environ['PR_BRANCH'];pin=os.environ['PIN']
          directory='gamepulse/fusion/nba_advanced/independent_0022600009_20261025'
          def gh(endpoint,method='GET',payload=None):
              cmd=['gh','api','repos/'+repo+'/'+endpoint]
              if method!='GET':cmd+=['-X',method,'--input','-']
              res=subprocess.run(cmd,input=json.dumps(payload) if payload is not None else None,
                 capture_output=True,text=True,timeout=100)
              if res.returncode:raise RuntimeError('PRIVATE_GITHUB_API_FAILED:'+endpoint)
              return json.loads(res.stdout)
          assert gh('git/ref/heads/'+branch)['object']['sha']==pin, 'PR_HEAD_CHANGED'
          existing=subprocess.run(['gh','api','repos/'+repo+'/contents/'+directory+'?ref='+pin],
              capture_output=True,text=True,timeout=50)
          assert existing.returncode!=0 and ('404' in existing.stderr or 'Not Found' in existing.stderr), 'PR_SNAPSHOT_EXISTS_OR_UNKNOWN'
          files=[root/(scope+'.'+kind+'.json') for scope in ('FULL','P1') for kind in ('native','parsed')]
          files.append(root/'reconciliation.json')
          for p in files:assert p.is_file() and p.stat().st_size>100
          tree=[]
          for p in files:
              b=p.read_bytes()
              blob=gh('git/blobs','POST',{'encoding':'base64','content':base64.b64encode(b).decode()})
              sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert blob['sha']==sha,'PRIVATE_BLOB_HASH_MISMATCH'
              tree.append({'path':directory+'/'+p.name,'type':'blob','mode':'100644','sha':sha})
          base=gh('git/commits/'+pin)['tree']['sha']
          newtree=gh('git/trees','POST',{'base_tree':base,'tree':tree})
          commit=gh('git/commits','POST',{
              'message':'data(gamepulse): independent NBA Rockets Spurs FULL P1 advanced source and screenshot QA',
              'parents':[pin],'tree':newtree['sha']})
          assert gh('git/ref/heads/'+branch)['object']['sha']==pin,'PR_HEAD_CHANGED_DURING_SAVE'
          changed=gh('git/refs/heads/'+branch,'PATCH',
                     {'sha':commit['sha'],'force':False})
          assert changed['object']['sha']==commit['sha']
          print('PRIVATE_NBA_ADVANCED_ORIGINAL_SOURCE_STORED',
                'files',len(files),'head',commit['sha'])
          PY
      - name: Reject mismatched advanced provider fields without inventing rates
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          python3 - "$PRIVATE_ROOT/reconciliation.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print('NBA_17_SCOPE_ACCEPTANCE',r['cases_matching'],r['cases_tested'])
          if not r['all_cases_match']:
              raise SystemExit('INDEPENDENT_PROVIDER_DISAGREES_WITH_RETAINED_REFERENCE')
          print('NBA_OFFICIAL_FULL_P1_PROVIDER_RECONCILIATION_PASSED')
          PY
