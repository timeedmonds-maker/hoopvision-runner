name: Integrated Pulse Wembanyama halfcourt defensive XY comparison
# Approved NBA database CPU analysis; raw NBA SDK data stay in private 104 and ephemeral memory.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-wemby-defensive-position.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        game: ['0022600003', '0022600009']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private-only data authority
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo "PRIVATE_SOURCE_AUTH_MISSING"; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch original private source script and fused official inputs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/wemby-defense-$GAME_ID"
          mkdir -p "$ROOT/sdk"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/wemby_defensive_position_compare_2026.py?ref=main" --jq .content | base64 -d > "$ROOT/analyse.py"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/$GAME_ID.json?ref=main" --jq .content | base64 -d > "$ROOT/view.json"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/$GAME_ID.json?ref=main" --jq .content | base64 -d > "$ROOT/pbp.json"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/$GAME_ID.json?ref=main" --jq .content | base64 -d > "$ROOT/interaction.json"
          python3 -m py_compile "$ROOT/analyse.py"
      - name: Download and independently SHA-verify original private Game Pulse archives
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/wemby-defense-$GAME_ID"
          TAG="gamepulse-sdk-$GAME_ID"
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/release.json"
          gh release download "$TAG" --repo timeedmonds-maker/104 --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk" --clobber >/dev/null
          python3 - <<'PY'
          import os,hashlib,json,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/('wemby-defense-'+os.environ['GAME_ID'])
          expected={a['name']:a.get('digest') for a in json.loads((root/'release.json').read_text())['assets']
              if re.fullmatch(r'sdk-part-\d\d\.tar\.gz',a['name'])}
          actual={a.name:'sha256:'+hashlib.sha256(a.read_bytes()).hexdigest() for a in (root/'sdk').glob('sdk-part-??.tar.gz')}
          if len(expected)!=13 or actual!=expected:raise RuntimeError('ORIGINAL_SOURCE_ARCHIVE_SHA_MISMATCH')
          print('PRIVATE_SOURCE_ARCHIVES_VERIFIED')
          PY
      - name: Calculate halfcourt positions and compare validated defensive filters
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/wemby-defense-$GAME_ID"
          python3 "$ROOT/analyse.py" --game "$GAME_ID" --sdk "$ROOT/sdk" --view "$ROOT/view.json" --pbp "$ROOT/pbp.json" --interaction "$ROOT/interaction.json" --out "$ROOT/result.json"
      - name: Publish numeric results privately with SHA-verified readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          game=os.environ['GAME_ID']
          root=Path(os.environ['RUNNER_TEMP'])/('wemby-defense-'+game)
          data=(root/'result.json').read_bytes()
          obj=json.loads(data)
          assert obj['game_id']==game and obj['player_id']=='1641705'
          target='repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/wemby_defensive_position_'+game+'.json'
          old=subprocess.run(['gh','api',target],capture_output=True,text=True,timeout=30)
          payload={'branch':'main','message':'data(gamepulse): persist Wembanyama defensive XY court comparison '+game,'content':base64.b64encode(data).decode()}
          if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
          elif 'Not Found' not in old.stderr and '404' not in old.stderr:raise RuntimeError('PRIVATE_READ_ERROR')
          out=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],input=json.dumps(payload),capture_output=True,text=True,timeout=90)
          if out.returncode:raise RuntimeError('PRIVATE_WRITE_ERROR')
          back=base64.b64decode(subprocess.check_output(['gh','api',target,'--jq','.content'],timeout=40))
          assert hashlib.sha256(data).digest()==hashlib.sha256(back).digest()
          print('PRIVATE_WEMBY_HALFCOURT_ANALYSIS_STORED_AND_VERIFIED')
          PY
