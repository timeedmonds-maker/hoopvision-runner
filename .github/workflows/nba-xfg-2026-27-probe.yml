name: NBA 2026-27 shot-level xFG probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-xfg-2026-27-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe shotqualityvideologs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests
          python - <<'PY'
          import json, math, requests
          from pathlib import Path

          endpoint='https://stats.gleague.nba.com/stats/shotqualityvideologs'
          headers={
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':'https://www.nba.com/',
              'Origin':'https://www.nba.com',
              'Accept':'application/json, text/plain, */*',
          }
          tests=[
              {'label':'MIA_TOR_WIGGINS','game_id':'0012600009','player_id':203952,'expected_event':48},
              {'label':'UTA_DEN_CAMERON_JOHNSON','game_id':'0012600067','player_id':1629661,'expected_event':72},
          ]
          results=[]
          s=requests.Session(); s.headers.update(headers)
          for t in tests:
              rec={k:v for k,v in t.items()}
              try:
                  r=s.get(endpoint,params={'GameID':t['game_id'],'PlayerID':t['player_id']},timeout=(8,45))
                  rec['http_status']=r.status_code
                  rec['content_type']=r.headers.get('content-type')
                  rec['response_bytes']=len(r.content)
                  r.raise_for_status()
                  j=r.json()
                  shots=j.get('shotList') or []
                  rec['response_game_id']=str(j.get('gameId') or '').zfill(10)
                  rec['shot_count']=len(shots)
                  qualities=[]
                  compact=[]
                  expected=None
                  for z in shots:
                      q=z.get('shotQuality')
                      try:
                          qf=float(q)
                      except Exception:
                          qf=None
                      if qf is not None:
                          qualities.append(qf)
                      ev=None
                      try: ev=int(z.get('eventNum'))
                      except Exception: pass
                      row={
                          'event_num':ev,
                          'period':z.get('period'),
                          'game_clock':z.get('gameClock'),
                          'action_type':z.get('actionType'),
                          'shot_type':z.get('shotType'),
                          'success':z.get('success'),
                          'shot_quality':qf,
                          'xfg_pct':(100*qf if qf is not None and qf <= 1.5 else qf),
                          'loc_x':z.get('locX'),
                          'loc_y':z.get('locY'),
                      }
                      compact.append(row)
                      if ev==t['expected_event']:
                          expected=row
                  rec['numeric_shot_quality_count']=len(qualities)
                  rec['min_shot_quality']=min(qualities) if qualities else None
                  rec['max_shot_quality']=max(qualities) if qualities else None
                  rec['expected_event_row']=expected
                  rec['join_key_supported']=expected is not None
                  rec['sample_rows']=compact[:5]
                  rec['available']=(
                      rec['http_status']==200
                      and rec['response_game_id']==t['game_id']
                      and len(shots)>0
                      and len(qualities)>0
                  )
              except Exception as e:
                  rec['available']=False
                  rec['error']=repr(e)
              results.append(rec)

          summary={
              'schema':'hoopvision.nba-shotlevel-xfg-2026-27-probe.v1',
              'endpoint':endpoint,
              'season':'2026-27',
              'season_phase_tested':'Pre Season',
              'route_available':all(r.get('available') for r in results),
              'exact_event_join_confirmed':all(r.get('join_key_supported') for r in results),
              'tests':results,
          }
          out=Path('experiment_results/xfg_2026_27')
          out.mkdir(parents=True,exist_ok=True)
          (out/'latest.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          if not summary['route_available']:
              raise SystemExit(2)
          PY
      - name: Commit sanitized probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hoopvision-public-probe
          git config user.email hoopvision-public-probe@users.noreply.github.com
          git add experiment_results/xfg_2026_27/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 2026-27 NBA shot-level xFG probe [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
