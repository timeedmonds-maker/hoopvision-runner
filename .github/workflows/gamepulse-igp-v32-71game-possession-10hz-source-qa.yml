name: IGP32 71game all NBA logical PBP chain 10Hz source QA usability
# Source privately SHA-verified; public output is count-only.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-71game-possession-10hz-source-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  all71-chains:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: All 71 original NBA PBP possession UTC windows and accepted IGP32 ten player ball grid
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_71_possession_10hz_source_qa_v1.py gamepulse/fusion/query_igp_v32_71_combined_research_scene_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_possession_10hz_source_qa_v1.py'
          python3 gamepulse/fusion/igp_v32_71_possession_10hz_source_qa_v1.py \
            --root . --out gamepulse/fusion/qa/igp_v32/igp_v32_71_possession_10hz_source_qa_v1.json
      - name: Commit immutable private all71 possession-chain grade and full QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          p=gamepulse/fusion/qa/igp_v32/igp_v32_71_possession_10hz_source_qa_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$p"
          git diff --cached --check
          if git diff --cached --quiet; then echo ALL71_POSSESSION_QA_NO_CHANGE; exit 0; fi
          git commit -qm 'qa(igp): SHA-grounded all 71game PBP logical chain usability under accepted 10Hz source QA'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo ALL71_SOURCE_QA_POSSESSION_METRICS_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
