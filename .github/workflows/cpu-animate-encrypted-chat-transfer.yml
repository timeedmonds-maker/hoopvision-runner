# Encrypted GitHub Actions artifact: AES-256-GCM ciphertext ONLY.
# Original private NBA video and AES key never appear in public artifact or logs.
name: CPU Animate V50 private MP4 encrypted chat attachment transport
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpu-animate-encrypted-chat-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-animate-v50-private-mp4-chat-transport
  cancel-in-progress: false
jobs:
  encrypted-chat-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: 'none'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate ciphertext-only bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          path='.github/workflows/cpu-animate-encrypted-chat-transfer.yml'
          assert not scan([path]), 'PUBLIC_CONTENT_GUARD_REJECTED'
          print('CPU_ANIMATE_V50_AES256_GCM_CIPHERTEXT_ONLY_BRIDGE_GUARD_PASS')
          PY
          test ! -e /dev/nvidia0 && test ! -e /dev/kfd
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Authenticated private MP4 verification and ciphertext-only artifact
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -c 'import cryptography' 2>/dev/null; then
            python3 -m pip install -q --disable-pip-version-check 'cryptography>=44,<47'
          fi
          ROOT="$(mktemp -d)"
          chmod 700 "$ROOT"
          export CPU_TRANSFER_PRIVATE_TEMP="$ROOT"
          export CPU_TRANSFER_TAG="cpu-animate-v50-private-chat-transfer-key-${GITHUB_RUN_ID}"
          export CPU_TRANSFER_CIPHERTEXT_DIR="$RUNNER_TEMP/cpuanimate-v50-encrypted"
          mkdir -p "$CPU_TRANSFER_CIPHERTEXT_DIR"
          chmod 700 "$CPU_TRANSFER_CIPHERTEXT_DIR"
          trap 'rm -rf "$ROOT"' EXIT
          gh release download cpu-animate-0225-e585-v50-native-highball-catch-cpu-review-20261113 \
            --repo timeedmonds-maker/104 --dir "$ROOT" \
            --pattern '0022600225_E585_HOU31_SENGUN28_AMEN1_V50_NATIVE_BALL_CATCH_FOOTLOCK.mp4'
          python3 - <<'PY'
          import hashlib,json,os,pathlib,secrets,subprocess
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=pathlib.Path(os.environ['CPU_TRANSFER_PRIVATE_TEMP'])
          mp4=root/'0022600225_E585_HOU31_SENGUN28_AMEN1_V50_NATIVE_BALL_CATCH_FOOTLOCK.mp4'
          data=mp4.read_bytes()
          expected_sha='9cba2662bc4d208a0c60ec25bb75fc9bd4320b1f27d5dfc9c23cb513ced392eb'
          if len(data)!=9323525 or hashlib.sha256(data).hexdigest()!=expected_sha:
              raise RuntimeError('V50_ORIGINAL_MP4_SHA256_OR_SIZE_MISMATCH')
          key=secrets.token_bytes(32)
          nonce=secrets.token_bytes(12)
          aad=b'CPU_ANIMATE_V50_0022600225_EVENT585_PRIVATE_MP4_CHAT_TRANSFER_V1'
          encrypted=nonce+AESGCM(key).encrypt(nonce,data,aad)
          dest=pathlib.Path(os.environ['CPU_TRANSFER_CIPHERTEXT_DIR'])/'CPU_ANIMATE_V50_585_MP4_Encrypted.aesgcm'
          dest.write_bytes(encrypted)
          os.chmod(dest,0o600)
          report={
              'schema':'cpu-animate.private-chat-transport-aes256gcm.v50',
              'secret_key_hex':key.hex(),
              'authenticated_associated_data_utf8':aad.decode(),
              'nonce_location':'first_12_bytes_of_artifact',
              'expected_plaintext_sha256':expected_sha,
              'expected_plaintext_size':len(data),
              'original_filename':mp4.name,
              'encrypted_artifact_sha256':hashlib.sha256(encrypted).hexdigest(),
              'encrypted_artifact_bytes':len(encrypted),
              'public_artifact_contains_only_ciphertext':True,
          }
          note=root/'private_chat_transfer_key.json'
          note.write_text(json.dumps(report,indent=2))
          cmd=['gh','release','create',os.environ['CPU_TRANSFER_TAG'],
               '--repo','timeedmonds-maker/104',
               '--title','Private V50 ChatGPT AES256-GCM transport key',
               '--notes-file',str(note),'--latest=false']
          process=subprocess.run(cmd,capture_output=True,text=True,timeout=60)
          if process.returncode:
              raise RuntimeError('PRIVATE_ENCRYPTION_KEY_RELEASE_CREATION_FAILED')
          note.unlink()
          print('V50_ORIGINAL_MP4_HASH_VERIFIED')
          print('V50_AES256_GCM_KEY_SAVED_PRIVATE')
          print('V50_PUBLIC_ARTIFACT_CONTAINS_CIPHERTEXT_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-animate-v50-private-mp4-aesgcm-${{ github.run_id }}
          path: ${{ runner.temp }}/cpuanimate-v50-encrypted/CPU_ANIMATE_V50_585_MP4_Encrypted.aesgcm
          retention-days: 1
          if-no-files-found: error
      - name: Verify only encrypted file can be exported publicly
        shell: bash
        run: |
          set -euo pipefail
          test ! -e 0022600225_E585_HOU31_SENGUN28_AMEN1_V50_NATIVE_BALL_CATCH_FOOTLOCK.mp4
          test "$(find "$RUNNER_TEMP/cpuanimate-v50-encrypted" -maxdepth 1 -type f | wc -l)" = 1
          echo 'V50_CIPHERTEXT_ONLY_ARTIFACT_COMPLETE'
      - name: Delete transient encrypted transport bytes
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/cpuanimate-v50-encrypted"
