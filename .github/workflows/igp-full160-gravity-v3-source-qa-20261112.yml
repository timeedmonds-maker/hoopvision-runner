# Allowlisted and source-confined. Only GitHub-hosted CPU. All NBA source-derived player Gravity remains private in 104.
name: Integrated Pulse FULL160 Gravity v3 source-graded acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full160-gravity-v3-source-qa-20261112.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full160-gravity-v3-source-20261112
  cancel-in-progress: false
jobs:
  verify-gravity-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_REF: research/gamepulse-clock-boundary-integrity-20261025
      RELEASE: igp-full160-gravity-v3-source-graded-20261112
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source-confinement and no-GPU gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          echo FULL160_GRAVITY_PRIVATE_CPU_ONLY_GATE_PASS
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Sparse read of SHA-pinned Full160 Gravity private source and QA
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/full160-gravity-v3-private"
          git clone -q --no-checkout --filter=blob:none --depth=1 \
              -b "$PRIVATE_REF" "https://github.com/$PRIVATE_REPO.git" "$DIR"
          git -C "$DIR" sparse-checkout init --no-cone
          git -C "$DIR" sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_full160_source_default_v1.py' \
            '/gamepulse/fusion/igp_full160_gravity_single_game_snapshot_delta_v1.py' \
            '/gamepulse/fusion/qa/igp_fullx/shot_event_multiview_FULL160_dd9c934ae34e_v2.json' \
            '/data/extensions/nba_blueprint_2026_27/season_to_date/gravity_spotlight_player_game.csv' \
            '/gamepulse/fusion/official_pbp_timing/original_nba_20261029/002260021*/boxscore.json' \
            '/gamepulse/fusion/tests/test_igp_full160_gravity_v3_20261112.py' \
            '/data/extensions/nba_gravity_2026_27/nba_gravity_2026_27_player_game_unified_source_verified_20261111_v2.csv' \
            '/data/extensions/nba_gravity_2026_27/nba_gravity_2026_27_player_game_unified_source_verified_20261112_v3.csv' \
            '/gamepulse/fusion/materialized/igp_full160_multilayer_default_v1/full160_gravity_player_game_source_graded_20261112_v3.jsonl' \
            '/gamepulse/fusion/materialized/igp_full160_multilayer_default_v1/full160_gravity_game_coverage_20261112_v3.json' \
            '/gamepulse/fusion/qa/igp_fullx/full160_gravity_v3_backfill_acceptance_20261112.json' \
            '/gamepulse/fusion/materialized/igp_full160_multilayer_default_v1/index.json'
          git -C "$DIR" checkout -q "$PRIVATE_REF"
          python3 -m py_compile "$DIR/gamepulse/fusion/igp_full160_source_default_v1.py"
          test -s "$DIR/gamepulse/fusion/materialized/igp_full160_multilayer_default_v1/full160_gravity_player_game_source_graded_20261112_v3.jsonl"
          cd "$DIR"
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
             -p 'test_igp_full160_gravity_v3_20261112.py'
          python3 - <<'PY'
          from pathlib import Path
          import sys
          root=Path.cwd()
          sys.path.insert(0,str(root/'gamepulse/fusion'))
          import igp_full160_source_default_v1 as m
          qualified,sha,n=m.gravity_rows(root)
          assert n==1571 and len(qualified)==91
          kd=m.gravity_graded_player_game(root,'0022600208')
          assert len(kd)==24 and kd['201142']['gravity']['overall_gravity']==25.765
          assert sum(v['value_grade']=='OFFICIAL_PLAYER_UNPUBLISHED' for v in kd.values())==6
          print('FULL160_GRAVITY_V3_SOURCE_SHA_QUERY_KD_AND_160_GAME_TESTS_PASS',
                'qualified_rows',n,'qualified_games',len(qualified),
                'kd_player_games',len(kd),'new_rows',107)
          PY
      - name: Independently replay 107 game Gravity increments from immutable NBA snapshots
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/full160-gravity-v3-private"
          git -C "$DIR" rev-parse HEAD
          python3 -m py_compile "$DIR/gamepulse/fusion/igp_full160_gravity_single_game_snapshot_delta_v1.py"
          pre_commit="79c4fa969525d64bf0ef21bbb1446aba1ed918e7"
          post_commit="c0c16895c753ec8aedc8433f7f0eee26b8164150"
          file="public_nba_gravity_leaders_2026_27_current.json"
          gh api "repos/timeedmonds-maker/hoopvision-runner/contents/$file?ref=$pre_commit" --jq .content | base64 -d > "$RUNNER_TEMP/gravity-pre.json"
          gh api "repos/timeedmonds-maker/hoopvision-runner/contents/$file?ref=$post_commit" --jq .content | base64 -d > "$RUNNER_TEMP/gravity-post.json"
          test -s "$RUNNER_TEMP/gravity-pre.json"
          test -s "$RUNNER_TEMP/gravity-post.json"
          python3 "$DIR/gamepulse/fusion/igp_full160_gravity_single_game_snapshot_delta_v1.py" \
            --pre "$RUNNER_TEMP/gravity-pre.json" --post "$RUNNER_TEMP/gravity-post.json" \
            --boxscore "$DIR/gamepulse/fusion/official_pbp_timing/original_nba_20261029/"002260021{1,2,3,4,5,6}"/boxscore.json" \
            --spotlight-csv "$DIR/data/extensions/nba_blueprint_2026_27/season_to_date/gravity_spotlight_player_game.csv" \
            --full160-index "$DIR/gamepulse/fusion/qa/igp_fullx/shot_event_multiview_FULL160_dd9c934ae34e_v2.json" \
            --pre-commit "$pre_commit" --post-commit "$post_commit" --strict \
            --out-csv "$RUNNER_TEMP/gravity-replay.csv" --qa-out "$RUNNER_TEMP/gravity-replay-qa.json" \
            --expect-rows 107 --expect-direct 12
          python3 - <<'PY'
          import csv,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          private=root/"full160-gravity-v3-private"
          old=private/"data/extensions/nba_gravity_2026_27/nba_gravity_2026_27_player_game_unified_source_verified_20261112_v3.csv"
          def csvrows(path):
              with open(path,encoding="utf-8-sig",newline="") as f:return list(csv.DictReader(f))
          expected={(r["game_id"],r["player_id"]):r for r in csvrows(old) if r["source_post_sha"]=="c0c16895c753"}
          observed={(r["game_id"],r["player_id"]):r for r in csvrows(root/"gravity-replay.csv")}
          assert len(expected)==len(observed)==107
          assert expected.keys()==observed.keys()
          for key,expected_row in expected.items():
              got=observed[key]
              for field in expected_row:
                  if field in ("overall_gravity","on_ball_perimeter_gravity","off_ball_perimeter_gravity","on_ball_interior_gravity","off_ball_interior_gravity"):
                      a=expected_row[field];b=got[field]
                      assert a==b or (a!="" and b!="" and abs(float(a)-float(b))<=0.0010001), (key,field,a,b)
                  else:
                      assert expected_row[field]==got[field],(key,field,expected_row[field],got[field])
          replay=json.loads((root/"gravity-replay-qa.json").read_text())
          assert replay["verified_unique_player_game_rows"]==107
          assert replay["source_blueprint_direct_player_games_5field_crosschecked"]==12
          print("FULL160_GRAVITY_V3_INDEPENDENT_SOURCE_REPLAY_PASS", "rows",len(observed),
                "games",len(set(k[0] for k in observed)),"direct",12)
          PY
      - name: Publish additive Gravity v3 source-grade layer privately after validation
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/full160-gravity-v3-private"
          if gh release view "$RELEASE" -R "$PRIVATE_REPO" >/dev/null 2>&1; then
            echo FULL160_GRAVITY_V3_PRIVATE_RELEASE_ALREADY_EXISTS_NO_CLOBBER
          else
            gh release create "$RELEASE" -R "$PRIVATE_REPO" --target "$PRIVATE_REF" \
              --title "FULL160 player-game Gravity v3: 1,571 qualified, 2,558 source-graded" \
              --notes "Independent CPU source/QA acceptance for 107 newly derived one-game Gravity records; 1,571 qualified player-games across 91/160 games, 316 featured spotlights, 2,558 source-graded player-game records including explicit nulls. Original Full160 accepted multimodal release unchanged. No physical tracking certification." \
              "$DIR/data/extensions/nba_gravity_2026_27/nba_gravity_2026_27_player_game_unified_source_verified_20261112_v3.csv" \
              "$DIR/gamepulse/fusion/materialized/igp_full160_multilayer_default_v1/full160_gravity_player_game_source_graded_20261112_v3.jsonl" \
              "$DIR/gamepulse/fusion/materialized/igp_full160_multilayer_default_v1/full160_gravity_game_coverage_20261112_v3.json" \
              "$DIR/gamepulse/fusion/qa/igp_fullx/full160_gravity_v3_backfill_acceptance_20261112.json" >/dev/null
            echo FULL160_GRAVITY_V3_PRIVATE_RELEASE_CREATED
          fi
