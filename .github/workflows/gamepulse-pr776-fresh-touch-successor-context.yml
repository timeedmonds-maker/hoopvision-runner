name: PR776 fresh-touch NBA successor source context acceptance
# Free public CPU; player-level data and coordinates stay in the private checkout.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-fresh-touch-successor-context.yml', 'tools/public_content_guard.py']
permissions:
  contents: read
concurrency:
  group: pr776-successor-context
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source-guard and authenticated private sparse clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          # No redundant API preflight: shared private token may hit REST rate limits.
          # Restricted private Git authentication and subsequent SHA checks remain required.
          cat > "$RUNNER_TEMP/pr776-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/pr776-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/pr776-askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/pr776-context"
          git -C "$RUNNER_TEMP/pr776-context" sparse-checkout set --no-cone \
            /gamepulse/fusion/pr776_fresh_touch_successor_context_2026.py \
            /gamepulse/fusion/tests/test_pr776_fresh_touch_successor_context_2026.py \
            '/gamepulse/fusion/materialized/physical_control_review_pr776_20261026/*.json' \
            '/gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/*.json' \
            /gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json \
            '/gamepulse/fusion/official_pbp_timing/games/*.json'
          echo "PRIVATE_ROOT=$RUNNER_TEMP/pr776-context" >> "$GITHUB_ENV"
          echo "SOURCE_HEAD=$(git -C "$RUNNER_TEMP/pr776-context" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo PR776_PRIVATE_SPARSE_SOURCE_ACQUIRED
      - name: Test and execute real original 93-candidate source audit
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/pr776_fresh_touch_successor_context_2026.py \
            gamepulse/fusion/tests/test_pr776_fresh_touch_successor_context_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -v \
            -p 'test_pr776_fresh_touch_successor_context_2026.py'
          python3 gamepulse/fusion/pr776_fresh_touch_successor_context_2026.py \
            --root . --summary-only --out "$RUNNER_TEMP/pr776-successor-93-qa.json"
          python3 - "$RUNNER_TEMP/pr776-successor-93-qa.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a['candidate_count']==93 and a['game_count']==26
          assert a['source_team_context_counts']=={
              'FOLLOWING_NBA_SOURCE_TEAM_MATCH_UNCERTIFIED':93}
          assert a['preceding_episode_has_scored_points']=={'True':93}
          assert a['uncalibrated_utc_enclosure_diagnostics']=={
              'True':91,'False':2}
          assert len(a['per_game_source_sha256'])==26
          assert a['independently_certified_physical_possessions']==0
          print('PR776_93_SUCCESSOR_SOURCE_CONTEXT_ACCEPTED',
                'games=26 candidates=93 following_team=93',
                'NBA_UTC_enclosed=91 NBA_UTC_disagreement=2',
                'predecessor_scored=93 certified_physical_possessions=0')
          PY
      # All QA is read-only; the accepted private receipt is committed by the
      # independently authorised private GitHub connector (not rate-limited REST).
