name: Private Rockets Durant halfcourt context QA
# Retry after removal of Sengun-only focal output from Durant analytic.
# Retry after private source v2 function-name correction.
# Derive bounded two-defender proximity after source Sengun touches from original private XYZ.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/durant-context-inspection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Fetch original source privately and verify original archive hashes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_ACCESS_UNAVAILABLE'; exit 3; }
          ROOT="$RUNNER_TEMP/sengun-hub"
          mkdir -p "$ROOT/sdk"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/durant_halfcourt_context_and_attack_end_v2_2026.py?ref=main' --jq .content | base64 -d > "$ROOT/qa.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/0022600091.json?ref=main' --jq .content | base64 -d > "$ROOT/interactions.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/0022600091.json?ref=main' --jq .content | base64 -d > "$ROOT/view.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/0022600091.json?ref=main' --jq .content | base64 -d > "$ROOT/pbp.json"
          gh api repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/rockets_durant_reviewed_double_team_v4_qa.json --jq .content | base64 -d > "$ROOT/durant-qa.json"
          gh release download gamepulse-sdk-0022600091 --repo timeedmonds-maker/104 --dir "$ROOT/sdk" --pattern 'sdk-part-??.tar.gz' --clobber >/dev/null
          gh api repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-0022600091 > "$ROOT/release.json"
          python3 - <<'PY'
          import json,hashlib,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sengun-hub'
          release=json.loads((root/'release.json').read_text())
          expected={x['name']:x['digest'] for x in release['assets'] if re.fullmatch(r'sdk-part-\d{2}\.tar\.gz',x['name'])}
          assert len(expected)==13
          found=list((root/'sdk').glob('sdk-part-??.tar.gz'))
          assert len(found)==13
          for p in found:assert expected[p.name]=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print('PRIVATE_ORIGINAL_SHA_VERIFIED_COUNT',len(found))
          PY
      - name: Compute only private spatial Sengun touch provenance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/sengun-hub"
          python3 "$ROOT/qa.py" --archives "$ROOT/sdk" --interaction "$ROOT/interactions.json" --view "$ROOT/view.json" --pbp "$ROOT/pbp.json" --durant_qa "$ROOT/durant-qa.json" --out "$ROOT/result.json"
      - name: Publish QA only to private 104 and confirm read-back
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sengun-hub'
          blob=(root/'result.json').read_bytes()
          target='repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/rockets_durant_halfcourt_attack_end_v2_qa.json'
          old=subprocess.run(['gh','api',target],capture_output=True,text=True,timeout=30)
          item={'branch':'main','message':'data(gamepulse): source-verified Rockets Durant double-team calibrated detection v4 QA','content':base64.b64encode(blob).decode()}
          if old.returncode==0:item['sha']=json.loads(old.stdout)['sha']
          elif '404' not in old.stderr and 'Not Found' not in old.stderr:raise RuntimeError('PRIVATE_DESTINATION_READ_FAILED')
          res=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],input=json.dumps(item),capture_output=True,text=True,timeout=80)
          if res.returncode:raise RuntimeError('PRIVATE_DESTINATION_WRITE_FAILED')
          actual=base64.b64decode(subprocess.check_output(['gh','api',target,'--jq','.content']))
          assert hashlib.sha256(actual).digest()==hashlib.sha256(blob).digest()
          print('PRIVATE_DURANT_DOUBLE_TEAM_V4_STORED_SHA_VERIFIED')
          PY
