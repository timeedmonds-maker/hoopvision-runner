name: CPU Animate REAL Warriors Amen Thompson basket Sengun assist game0225 e585 frozen rings V34 CPU
on:
  push:
    branches: ['cpu-animate/warriors-amen-sengun-e585-cpu-rebuild-20261113']
    paths: ['.github/workflows/cpu-animate-warriors-amen-sengun-real-bucket-v33.yml']
permissions:
  contents: read
concurrency:
  group: cpu-animate-real-warriors-amen-bucket-sengun-assist-v33
  cancel-in-progress: false
jobs:
  private-source-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
      OPENCV_OPENCL_RUNTIME: disabled
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Explicit private-only source and CPU guards
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo PRIVATE_104_RELEASE_AUTH_UNAVAILABLE; exit 3; }
          test ! -e /dev/nvidia0
          test ! -e /dev/kfd
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          python3 -m pip install -q --disable-pip-version-check numpy==1.26.4
          gh auth setup-git
          echo PRIVATE_AUTHENTICATED_CPU_ONLY_PASS

      - name: Read SHA-pinned PRIVATE 104 V21 source gate and exact original Rockets native XYZ
        shell: bash
        run: |
          set -euo pipefail
          code="$RUNNER_TEMP/v21-rockets-private-code"
          root="$RUNNER_TEMP/v21-rockets-private-xyz"
          media="$RUNNER_TEMP/v21-rockets-private-video"
          mkdir -p "$media"
          chmod 700 "$media"
          echo "CODE_ROOT=$code" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$root" >> "$GITHUB_ENV"
          echo "MEDIA_ROOT=$media" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --no-checkout \
            --branch cpu-animate/warriors-amen-sengun-e585-v34-failclosed-20261113 \
            https://github.com/timeedmonds-maker/104.git "$code"
          git -C "$code" sparse-checkout init --no-cone
          git -C "$code" sparse-checkout set --no-cone \
            '/cpu_animate/__init__.py' \
            '/cpu_animate/rockets_e585_full161_v21_source_gate.py' \
            '/cpu_animate/rockets_e585_full161_video_alignment_forensic.py' \
            '/cpu_animate/rockets_e585_original_video_foot_scout_v21.py' \
            '/cpu_animate/rockets_e585_full161_video_pts_shadow.py' \
            '/cpu_animate/rockets_e585_full161_native_foot_candidate_audit.py' \
            '/cpu_animate/rockets_e585_full161_v21_original_shoelock_render.py' \
            '/cpu_animate/rockets_e585_full170_kd_v21_floorlock_port.py' \
            '/cpu_animate/rockets_e585_full170_pre_v21_v6_xyz_motion.py' \
            '/cpu_animate/rockets_e585_full170_v32_frozen_court_repair.py' \
            '/cpu_animate/warriors_amen_basket_sengun_assist_0225_e585_frozen_v33.py' \
            '/cpu_animate/floor_lock_v12.py' \
            '/cpu_animate/floor_ground_lock_v22.py' \
            '/cpu_animate/video_only_floor_engine_v23_2.py' \
            '/cpu_animate/v22_multiplayer_floor_adapter.py' \
            '/cpu_animate/video_only_render_0208_v23.py' \
            '/tools/locked_broadcast_screen_v5_rings.py' \
            '/cpu_animate/test_rockets_e585_full161_video_pts_shadow.py' \
            '/cpu_animate/test_rockets_e585_full161_v21_source_gate.py'
          git -C "$code" checkout -q cpu-animate/warriors-amen-sengun-e585-v34-failclosed-20261113
          test "$(git -C "$code" rev-parse HEAD)" = 3cb9808dc453f022293fe35adfc34c344db4f090
          git clone -q --filter=blob:none --depth=1 --no-checkout \
            --branch research/gamepulse-clock-boundary-integrity-20261025 \
            https://github.com/timeedmonds-maker/104.git "$root"
          git -C "$root" sparse-checkout init --no-cone
          git -C "$root" sparse-checkout set --no-cone \
            '/gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1/index.json' \
            '/gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1/original-native-*.jsonl.gz' \
            '/gamepulse/fusion/materialized/igp_full170_unified_source_default_v1/index.json'
          git -C "$root" checkout -q research/gamepulse-clock-boundary-integrity-20261025
          native="$root/gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1"
          test "$(git -C "$root" hash-object "gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1/index.json")" = \
            da4d7bc7e9900ec4b186180057835ec11f4c0463
          test "$(find "$native" -name 'original-native-*.jsonl.gz' | wc -l)" = 17
          gh release download cpu-animate-0022600225-event585-playbyplay-v20-source-20261112 \
            --repo timeedmonds-maker/104 --dir "$media" \
            --pattern event585-playbyplay.mp4 --pattern manifest.json
          test "$(sha256sum "$media/event585-playbyplay.mp4" | cut -d' ' -f1)" = \
            06e5de702b58545799c7bbb678878e04da092fdec3f0ee98e97b3b65f552a234
          echo ORIGINAL_PRIVATE_0225_XYZ_CHUNKS_AND_EXACT_PBP_MP4_SHA_READY

      - name: Test V21 strict three player source-foot native identity and heldout gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$CODE_ROOT"
          python3 -m unittest cpu_animate.test_rockets_e585_full161_v21_source_gate cpu_animate.test_rockets_e585_full161_video_pts_shadow -v
          echo V21_THREE_PLAYER_NATIVE_SOURCE_SHOE_GATES_TESTED

      - name: Verify 17 native Rockets source chunk SHA and 33,639 timestamps in PRIVATE RAM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/event585-private-qa"
          cd "$CODE_ROOT"
          python3 -m cpu_animate.rockets_e585_full161_v21_source_gate \
            --root "$SOURCE_ROOT" \
            --output "$RUNNER_TEMP/event585-private-qa/full161-rockets-event585-v21-native-gate.json"
          python3 - "$RUNNER_TEMP/event585-private-qa/full161-rockets-event585-v21-native-gate.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          assert q["game_id"]=="0022600225" and q["event"]==585
          assert q["native_chunks"]==17 and q["original_native_timestamps"]==33639
          assert q["native_chunk_sha256_verified"]
          assert set(q["nba_player_ids"].values())=={"203992","1630578","1641708"}
          assert all(q["direct_event_window_samples"][k]>0 for k in ("Bogdanovic","Sengun","Thompson"))
          assert q["alignment_check"]=="NOT_RUN"
          assert not q["accepted_for_publication"]
          print("FULL161_ROCKETS_EVENT585_PRIVATE_NATIVE_IDENTITY_SOURCE_PASS")
          print("PHYSICAL_XYZ_TO_VIDEO_ALIGNMENT_NOT_CERTIFIED_NO_FALSE_RING_MP4")
          PY

      - name: Investigate native XYZ-to-video motion on broader camera timing window; private QA only
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          cd "$CODE_ROOT"
          python3 -m cpu_animate.rockets_e585_full161_video_alignment_forensic \
            --root "$SOURCE_ROOT" \
            --video "$MEDIA_ROOT/event585-playbyplay.mp4" \
            --output "$RUNNER_TEMP/event585-private-qa/0022600225_e585_full161_expanded_alignment_forensic.json"
          export CPU_E585_FORENSIC="$RUNNER_TEMP/event585-private-qa/0022600225_e585_full161_expanded_alignment_forensic.json"
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, tempfile
          d=pathlib.Path(os.environ["CPU_E585_FORENSIC"])
          q=json.loads(d.read_text())
          assert q["game_id"]=="0022600225" and q["event_num"]==585
          assert q["original_native_chunks_verified"]==17 and q["source_native_xyz_actually_joined"]
          assert q["coarse_source_video_proxies_are_independent_GT"] is False
          assert q["source_xyz_camera_alignment_accepted"] is False
          path="gamepulse/clip_lab/qa/0022600225_e585_full161_expanded_video_alignment_forensic.json"
          api=f"repos/timeedmonds-maker/104/contents/{path}"
          branch="research/gamepulse-clock-boundary-integrity-20261025"
          req={"message":"research(cpu-animate): e585 original Full161 player XYZ actual source versus wider 6-16s video-offset ablation",
               "branch":branch,
               "content":base64.b64encode(d.read_bytes()).decode()}
          old=subprocess.run(["gh","api",f"{api}?ref={branch}"],
              text=True,capture_output=True)
          if old.returncode==0:
              prior=json.loads(old.stdout)
              prior_content=base64.b64decode(prior["content"].replace("\n",""))
              if prior_content==d.read_bytes():
                  print("EVENT585_PRIVATE_EXTENDED_CALIBRATION_QA_UNCHANGED")
                  raise SystemExit(0)
              req["sha"]=prior["sha"]
          elif "404" not in old.stderr and "Not Found" not in old.stderr:
              raise ValueError("PRIVATE_RESEARCH_TARGET_LOOKUP_FAILED")
          tmp=pathlib.Path(tempfile.mkdtemp())/"put.json"
          tmp.write_text(json.dumps(req))
          out=subprocess.run(["gh","api","-X","PUT",api,"--input",str(tmp)],
              text=True,capture_output=True)
          if out.returncode:
              raise ValueError("PRIVATE_RESEARCH_CALIBRATION_REPORT_COMMIT_FAILED")
          print("EVENT585_PRIVATE_EXPANDED_XYZ_VIDEO_CALIBRATION_QA_COMMITTED")
          PY

      - name: Generate immutable original 592-frame video-PTS sidecar and actual Full161 XYZ shadow
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          export OUT_PTS="$RUNNER_TEMP/event585-private-qa/event585-native-video-pts.json"
          export IN_MP4="$MEDIA_ROOT/event585-playbyplay.mp4"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          p=subprocess.run(["ffprobe","-v","error","-select_streams","v:0",
             "-show_frames","-show_entries","frame=best_effort_timestamp_time",
             "-of","json",os.environ["IN_MP4"]],capture_output=True,text=True,check=True)
          d=json.loads(p.stdout)
          times=[float(x["best_effort_timestamp_time"]) for x in d["frames"]]
          assert len(times)==592,(len(times),"not the original video 592 frames")
          times=[round(x-times[0],7) for x in times]
          assert all(y>x for x,y in zip(times,times[1:]))
          assert abs(times[-1]-19.72)<.15
          obj={"game_id":"0022600225","event_num":585,"camera":"Play by Play",
               "original_video_sha256":"06e5de702b58545799c7bbb678878e04da092fdec3f0ee98e97b3b65f552a234",
               "frame_pts_seconds":times}
          pathlib.Path(os.environ["OUT_PTS"]).write_text(json.dumps(obj,separators=(",",":"))+"\n")
          print("ORIGINAL_0225_E585_FFMPEG_VIDEO_PTS_PRESERVED",len(times))
          PY
          cd "$CODE_ROOT"
          python3 -m cpu_animate.rockets_e585_full161_video_pts_shadow \
            --source-root "$SOURCE_ROOT" --video-pts "$OUT_PTS" \
            --out "$RUNNER_TEMP/event585-private-qa/rockets_e585_full161_original_xyz_pts_shadow.json.gz" \
            --scorer-video-pts 10.0
          echo ROCKETS_0225_NATIVE_FULL161_XYZ_VS_ORIGINAL_PTS_PRIVATE_SHADOW_COMPLETE

      - name: CPU-only original player segmentation and shoe candidate scout, roster names abstained
        shell: bash
        run: |
          set -euo pipefail
          tag=cpu-animate-rockets-0225-e585-v21-source-shoe-scout-20261112
          out="$RUNNER_TEMP/e585-private-cpu-video-shoe-scout"
          mkdir -p "$out"
          if gh api "repos/timeedmonds-maker/104/releases/tags/$tag" --jq .tag_name >/dev/null 2>&1; then
            # Reuse immutable private source scout; never rerun expensive inference.
            gh release download "$tag" --repo timeedmonds-maker/104 \
              --dir "$out" --pattern 'scout_0225_*'
            echo REAL_VIDEO_SHOE_SCOUT_EXISTING_PRIVATE_SOURCE_REUSED
          else
            python3 -m pip install -q --disable-pip-version-check \
              'numpy==1.26.4' 'opencv-python-headless==4.10.0.84' 'ultralytics==8.3.176'
            export YOLO_DISABLE_MODEL_DOWNLOAD_WARNINGS=1
            cd "$CODE_ROOT"
            python3 -m cpu_animate.rockets_e585_original_video_foot_scout_v21 \
              --media "$MEDIA_ROOT/event585-playbyplay.mp4" \
              --manifest "$RUNNER_TEMP/event585-private-qa/event585-native-video-pts.json" \
              --model yolo11n-seg.pt --stride 2 --out "$out"
          fi
          test "$(find "$out" -name 'scout_0225_f*.jpg' | wc -l)" = 20
          test -s "$out/scout_0225_585_review_index.json"
          test -s "$out/scout_0225_585_videoonly_592.json.gz"
          test -s "$out/scout_0225_585_videoonly_qa.json"
          echo ROCKETS_0225_REAL_VIDEO_SHOE_SCOUT_FRAME_STILLS_PRIVATE

      - name: Publish original video foot candidates and Full161 source timing shadow PRIVATE only
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          tag=cpu-animate-rockets-0225-e585-v21-source-shoe-scout-20261112
          dir="$RUNNER_TEMP/e585-private-cpu-video-shoe-scout"
          if gh api "repos/timeedmonds-maker/104/releases/tags/$tag" --jq .tag_name >/dev/null 2>&1; then
            echo RESEARCH_SCOUT_PRIVATE_TAG_ALREADY_PRESENT_NO_REPLACEMENT
          else
            gh release create "$tag" \
              "$dir"/*.jpg "$dir"/*.json "$dir"/*.gz \
              "$RUNNER_TEMP/event585-private-qa/event585-native-video-pts.json" \
              "$RUNNER_TEMP/event585-private-qa/rockets_e585_full161_original_xyz_pts_shadow.json.gz" \
              --repo timeedmonds-maker/104 \
              --title "CPU Animate Rockets e585 exact original source shoe candidates and Full161 XYZ clock shadow" \
              --notes "CPU-only, original licensed PBP private; 592 frame PTS, direct original Full161 native player XYZ time-candidate sidecar, video-only unassigned person track IDs and segmentation shoes. Physical camera registration, jersey identification and UTC timing NOT CERTIFIED. No MP4 rings."
          fi
          gh api "repos/timeedmonds-maker/104/releases/tags/$tag" --jq '.assets[].name' | \
            grep -qx 'rockets_e585_full161_original_xyz_pts_shadow.json.gz'
          echo EVENT585_PRIVATE_ORIGINAL_VIDEO_SHOE_CANDIDATES_AND_ACTUAL_FULL161_XYZ_SAVED

      - name: Quantify actual native Full161 XYZ vs anonymous original video segmented-shoe candidates
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          export E585_CALIB_QA="$RUNNER_TEMP/event585-private-qa/0022600225_e585_full161_expanded_alignment_forensic.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/qa/0022600225_e585_full161_expanded_video_alignment_forensic.json?ref=research%2Fgamepulse-clock-boundary-integrity-20261025' \
            --jq '.content' | base64 -d > "$E585_CALIB_QA"
          cd "$CODE_ROOT"
          python3 -m cpu_animate.rockets_e585_full161_native_foot_candidate_audit \
            --scout "$RUNNER_TEMP/e585-private-cpu-video-shoe-scout/scout_0225_585_videoonly_592.json.gz" \
            --native-shadow "$RUNNER_TEMP/event585-private-qa/rockets_e585_full161_original_xyz_pts_shadow.json.gz" \
            --calibration "$E585_CALIB_QA" \
            --out "$RUNNER_TEMP/event585-private-qa/0022600225_e585_full161_native_vs_video_shoe_candidate_audit.json"
          export E585_CAND_QA="$RUNNER_TEMP/event585-private-qa/0022600225_e585_full161_native_vs_video_shoe_candidate_audit.json"
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,tempfile
          p=pathlib.Path(os.environ["E585_CAND_QA"])
          q=json.loads(p.read_text())
          assert q["game_id"]=="0022600225" and q["event_num"]==585
          assert q["original_full161_xyz_consumed"] is True
          assert q["actual_roster_identity_certified"] is False
          assert q["three_player_ring_render_approved"] is False
          dest="gamepulse/clip_lab/qa/0022600225_e585_full161_native_vs_video_shoe_candidate_audit.json"
          api="repos/timeedmonds-maker/104/contents/"+dest
          branch="research/gamepulse-clock-boundary-integrity-20261025"
          req={"message":"research(cpu-animate): actual exact rockets native XYZ versus video segmentation foot candidate QA (uncertified)",
             "branch":branch,"content":base64.b64encode(p.read_bytes()).decode()}
          old=subprocess.run(["gh","api",api+"?ref="+branch],capture_output=True,text=True)
          if old.returncode==0:
              prev=json.loads(old.stdout)
              if base64.b64decode(prev["content"].replace("\n",""))==p.read_bytes():
                  print("PRIVATE_NATIVE_VS_SHOE_CANDIDATE_QA_IDENTICAL")
                  raise SystemExit(0)
              req["sha"]=prev["sha"]
          elif "404" not in old.stderr and "Not Found" not in old.stderr:
              raise ValueError("PRIVATE_CANDIDATE_QA_LOOKUP_FAILED")
          request=pathlib.Path(tempfile.mkdtemp())/"request.json"
          request.write_text(json.dumps(req))
          r=subprocess.run(["gh","api","-X","PUT",api,"--input",str(request)],
                           capture_output=True,text=True)
          if r.returncode:raise ValueError("PRIVATE_CANDIDATE_QA_PERSIST_FAILED")
          print("PRIVATE_NATIVE_VS_VIDEO_SHOE_CANDIDATE_QA_COMMITTED")
          PY

      - name: Render original 592-frame Play By Play video with V21 three-player shoe-locked rings and actual Full161 source XYZ
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            'opencv-python-headless==4.10.0.84' 'pillow>=10,<12'
          out="$RUNNER_TEMP/e585-private-xyz-v21-rings"
          mkdir -p "$out"
          native_sha=$(sha256sum "$SOURCE_ROOT/gamepulse/fusion/materialized/igp_0022600225_full160_additive_v1/index.json" | cut -d' ' -f1)
          cd "$CODE_ROOT"
          python3 -m cpu_animate.rockets_e585_full161_v21_original_shoelock_render \
            --media "$MEDIA_ROOT/event585-playbyplay.mp4" \
            --pts "$RUNNER_TEMP/event585-private-qa/event585-native-video-pts.json" \
            --scout "$RUNNER_TEMP/e585-private-cpu-video-shoe-scout/scout_0225_585_videoonly_592.json.gz" \
            --native-shadow "$RUNNER_TEMP/event585-private-qa/rockets_e585_full161_original_xyz_pts_shadow.json.gz" \
            --native-index-sha "$native_sha" \
            --out "$out"
          test -s "$out/0022600225_E585_FULL161_V21_THREE_RINGS_SOURCE_SHOE_RESEARCH.mp4"
          test -s "$out/0022600225_event585_v21_full161_three_ring_research_QA.json"
          test "$(find "$out" -name '*_ring_f*.jpg' | wc -l)" = 6
          echo ORIGINAL_ROCKETS_XYZ_ASSISTED_V21_THREE_PLAYER_CPU_MP4_RENDER_COMPLETED

      - name: Publish source-verified CPU MP4 and review frames to PRIVATE GitHub Release
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          tag=cpu-animate-0225-e585-original-full161-v21-trio-research-20261113
          out="$RUNNER_TEMP/e585-private-xyz-v21-rings"
          qa="$out/0022600225_event585_v21_full161_three_ring_research_QA.json"
          if gh api "repos/timeedmonds-maker/104/releases/tags/$tag" --jq '.tag_name' >/dev/null 2>&1; then
            # Immutable research release: rerun must match the source and rendered
            # MP4 hashes. Do not clobber another result.
            gh release download "$tag" --repo timeedmonds-maker/104 \
              --dir "$RUNNER_TEMP/event585-existing-ring-qa" \
              --pattern '0022600225_event585_v21_full161_three_ring_research_QA.json'
            python3 - "$qa" "$RUNNER_TEMP/event585-existing-ring-qa/0022600225_event585_v21_full161_three_ring_research_QA.json" <<'PY'
          import json,sys
          now=json.load(open(sys.argv[1]))
          old=json.load(open(sys.argv[2]))
          assert now["source_mp4_sha256"]==old["source_mp4_sha256"],"IMMUTABLE_PRIVATE_MP4_SHA_DRIFT"
          assert now["original_video_sha256"]==old["original_video_sha256"]
          print("IMMUTABLE_ROCKETS_EVENT585_PRIVATE_MP4_READBACK_MATCH")
          PY
          else
            gh release create "$tag" "$out"/*.mp4 "$out"/*.json "$out"/*.jpg \
              --repo timeedmonds-maker/104 \
              --title "CPU Animate Rockets 0022600225 e585 Full161 native XYZ assisted V21 three-player rings research clip" \
              --notes "Original Play By Play 592f NBA footage, SHA-verified 17 direct native Rockets tracking chunks; V21 frozen artwork, original-video foot-locked manual reviewed source tracker seeds, only short bounded native XYZ curvature assisted fills; scoreboard clock running time matched. Research preview: native UTC offset 10s estimated, world-to-image projection NOT certified; many unsupported player frames intentionally show no ring. PRIVATE licensed media, zero GPU."
          fi
          gh api "repos/timeedmonds-maker/104/releases/tags/$tag" --jq '.assets[].name' | \
            grep -qx '0022600225_E585_FULL161_V21_THREE_RINGS_SOURCE_SHOE_RESEARCH.mp4'
          echo PRIVATE_ACTUAL_ROCKETS_FULL161_V21_THREE_RING_MP4_RELEASE_AVAILABLE

      - name: Render actual KD V21 FloorLockV12 port from FULL170 original game 0225 tracking
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check \
            'ultralytics==8.3.176'
          out="$RUNNER_TEMP/rockets-full170-real-kd-v21"
          mkdir -p "$out"
          cd "$CODE_ROOT"
          python3 -m cpu_animate.rockets_e585_full170_kd_v21_floorlock_port \
            --media "$MEDIA_ROOT/event585-playbyplay.mp4" \
            --pts "$RUNNER_TEMP/event585-private-qa/event585-native-video-pts.json" \
            --scout "$RUNNER_TEMP/e585-private-cpu-video-shoe-scout/scout_0225_585_videoonly_592.json.gz" \
            --native-shadow "$RUNNER_TEMP/event585-private-qa/rockets_e585_full161_original_xyz_pts_shadow.json.gz" \
            --full170-manifest "$SOURCE_ROOT/gamepulse/fusion/materialized/igp_full170_unified_source_default_v1/index.json" \
            --native-index-sha 5bfc0eadb67535e2912ef47a972db8b1e1fefcba9af31413528880799579aa5f \
            --out "$out"
          test -s "$out/0022600225_E585_FULL170_KD_V21_COURT_FLOOR_THREE_RINGS.mp4"
          test -s "$out/0022600225_E585_FULL170_KD_V21_COURT_FLOOR_THREE_RINGS_qa.json"
          echo EXACT_FROZEN_KD_V21_FLOOR_LOCK_FULL170_ROCKETS_RENDER_SUCCESS

      - name: Publish exact KD V21 FloorLock three-ring FULL170 adaptation to PRIVATE release
        if: ${{ false }}
        shell: bash
        run: |
