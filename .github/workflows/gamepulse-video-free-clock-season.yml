name: Game Pulse season video-free physical clock anchor index
# 36-game source backfill: preserve daily due selector and SHA-verified private originals
on:
  schedule:
    - cron: '18 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-video-free-clock-season.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: gamepulse-auto-hoop-clock-season
  cancel-in-progress: false
jobs:
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      games: ${{ steps.select.outputs.games }}
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate separation of free CPU runner and private NBA source
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Select at most 14 missing original-source games without enumerating videos
        id: select
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          def gh(path):
              return subprocess.run(['gh','api',path],capture_output=True,text=True)
          result=gh('repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/index-2026-27.json?ref=main')
          if result.returncode:raise RuntimeError('CANONICAL_SEASON_SOURCE_INDEX_INACCESSIBLE')
          manifest=json.loads(base64.b64decode(json.loads(result.stdout)['content']))
          all_games=sorted(manifest['games'],reverse=True)
          groups=sorted({gid[:8] for gid in all_games})
          processed=set()
          for prefix in groups:
              path='repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/auto_physics/'+prefix+'?ref=main'
              out=gh(path)
              if out.returncode:
                  if '404' in out.stderr or 'Not Found' in out.stderr:continue
                  raise RuntimeError('PRIVATE_SOURCE_QA_LIST_FAILED')
              for row in json.loads(out.stdout):
                  name=row.get('name','')
                  if name.endswith('.json') and name[:-5].isdigit():
                      processed.add(name[:-5])
          due=[gid for gid in all_games if gid not in processed][:14]
          print('AUTOMATIC_PHYSICAL_EVENT_DUE_GAMES',len(due),'indexed',len(processed),
                'total_source_games',len(all_games))
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write('games='+json.dumps(due,separators=(',',':'))+'\n')
          PY
  source-clock-candidates:
    needs: due
    if: needs.due.outputs.games != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ${{ fromJSON(needs.due.outputs.games) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate private archive source and fetch original NBA official PBP
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          ROOT="$RUNNER_TEMP/video-free-gamepulse"
          mkdir -p "$ROOT/sdk"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/automatic_native_hoop_anchor_candidates_2026.py?ref=main" --jq .content |
            base64 -d > "$ROOT/auto.py"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/$GAME_ID.json?ref=main" --jq .content |
            base64 -d > "$ROOT/pbp.json"
          gh api "repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-$GAME_ID" > "$ROOT/release.json"
          gh release download "gamepulse-sdk-$GAME_ID" --repo timeedmonds-maker/104 --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk" >/dev/null
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'video-free-gamepulse'
          release=json.loads((root/'release.json').read_text())
          expected={a['name']:a['digest'] for a in release['assets']
                     if re.fullmatch(r'sdk-part-\d{2}\.tar\.gz',a['name'])}
          got=sorted((root/'sdk').glob('sdk-part-??.tar.gz'))
          assert len(expected)==len(got)==13,'FULL_SOURCE_SDK_ARCHIVE_NOT_READY'
          for f in got:
              h=hashlib.sha256()
              with f.open('rb') as stream:
                  for b in iter(lambda:stream.read(1048576),b''):h.update(b)
              assert expected[f.name]=='sha256:'+h.hexdigest(),'ORIGINAL_SDK_SOURCE_SHA_MISMATCH'
          assert json.loads((root/'pbp.json').read_text())['game_id']==os.environ['GAME_ID']
          print('AUTOMATIC_SOURCE_GAME_INDEPENDENT_SHA_VERIFIED',os.environ['GAME_ID'])
          PY
      - name: Extract physical hoop events and quarter-safe candidate clock segments
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/video-free-gamepulse"
          parts=()
          for f in "$ROOT"/sdk/sdk-part-??.tar.gz; do parts+=(--sdk-part "$f"); done
          python3 -m py_compile "$ROOT/auto.py"
          python3 "$ROOT/auto.py" --pbp "$ROOT/pbp.json" "${parts[@]}" --all-periods --out "$ROOT/qa.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'video-free-gamepulse'
          j=json.loads((root/'qa.json').read_text())
          assert j['game_id']==os.environ['GAME_ID']
          assert j['video_required'] is False
          assert j['clock_anchors_are_independently_certified'] is False
          assert j['matched_made_fg']<=j['nba_made_fg']
          print('PHYSICAL_HOOP_CANDIDATES',j['game_id'],
                j['matched_made_fg'],j['nba_made_fg'],
                'strict_quarters',j['qualified_candidate_periods'],
                'candidate_clock_brackets',j['bracket_candidates'])
          PY
      - name: Preserve searchable game-specific QA and SHA provenance in private 104
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess,time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'video-free-gamepulse'
          raw=(root/'qa.json').read_bytes()
          gid=os.environ['GAME_ID']
          dest='repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/auto_physics/'+gid[:8]+'/'+gid+'.json'
          for attempt in range(9):
              old=subprocess.run(['gh','api',dest],capture_output=True,text=True)
              payload={'branch':'main','message':'data(gamepulse): original NBA PBP and native SDK video-free full-game clock candidate QA '+gid,
                       'content':base64.b64encode(raw).decode()}
              if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
              elif '404' not in old.stderr and 'Not Found' not in old.stderr:
                  raise RuntimeError('PRIVATE_VIDEO_FREE_QA_READ_FAILED')
              cp=subprocess.run(['gh','api','-X','PUT',dest,'--input','-'],
                    input=json.dumps(payload),capture_output=True,text=True)
              if cp.returncode==0:break
              if not any(x in cp.stderr for x in ('409','422','429','500','502','503')):
                  raise RuntimeError('PRIVATE_VIDEO_FREE_QA_WRITE_FAILED')
              time.sleep(2+attempt)
          else:raise RuntimeError('PRIVATE_VIDEO_FREE_QA_RETRIES_EXHAUSTED')
          stored=base64.b64decode(subprocess.check_output(['gh','api',dest,'--jq','.content']))
          assert stored==raw,'PRIVATE_ORIGINAL_QA_SHA_READBACK_MISMATCH'
          print('PRIVATE_VIDEO_FREE_SEASON_GAME_PUBLISHED',gid)
          PY
      - name: Public log has no private source data or player coordinates
        if: always()
        run: echo 'Private original NBA tracking archived and QA indexed privately; zero video processing, zero invented possession certification.' >> "$GITHUB_STEP_SUMMARY"
