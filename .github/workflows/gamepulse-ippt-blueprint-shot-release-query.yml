name: Integrated Pulse Blueprint published shot and source release private query QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-blueprint-shot-release-query.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-source-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and checkout of original private NBA and Blueprint source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
            gamepulse/fusion data/extensions/nba_blueprint_2026_27
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free Blueprint event query validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_ippt_blueprint_source_release_2026.py
          python3 -m unittest -v gamepulse/fusion/test_query_igp_ippt_blueprint_source_release_2026.py
      - name: Original NBA two private real games paginated event query and result QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from query_igp_ippt_blueprint_source_release_2026 import query
          for gid in ("0022600009","0022600092"):
              report=query(".",gid,limit=100,include_other_source_players=True)
              assert report["total_matching_official_Blueprint_shots"]>=150
              assert len(report["records"])==100
              assert report["next_offset"]==100
              next_page=query(".",gid,offset=100,limit=100)
              full=report["records"]+next_page["records"]
              assert len(full)==report["total_matching_official_Blueprint_shots"]
              assert sum(r["source_physics_release_status"]=="SOURCE_PHYSICS_HYPOTHESIS"
                         for r in full)>=100
              assert sum(r["NBA_PBP_exact_join_verified"] for r in full)>=150
              for shot in full:
                  assert shot["shot_release_physical_instant_video_certified"] is False
                  assert shot["published_NBA_Blueprint"]["source_type"]=="OFFICIAL_NBA_BLUEPRINT_SHOT"
                  anchor=shot["source_physics_release_candidate"]
                  if anchor:
                      assert anchor["source_kind"]=="ORIGINAL_SDK_SUPPLIED_XYZ"
                      assert shot["source_original_ball"] is not None
                      assert shot["source_original_shooter"] is not None
                      assert shot["source_physics_release_UTC_ms"]==anchor["native_UTC_ms"]
                      assert shot["source_original_others"] is not None if shot in report["records"] else True
              subject=next(x for x in full if x["NBA_PBP_exact_join_verified"])
              exact=query(".",gid,action_number=subject["NBA_Blueprint_ngssEventId"],limit=100)
              assert any(z["NBA_shooter_player_id"]==subject["NBA_shooter_player_id"]
                         for z in exact["records"])
              filtered=query(".",gid,shooter_id=subject["NBA_shooter_player_id"],
                             shot_type=subject["NBA_shot_type"],limit=100)
              assert filtered["total_matching_official_Blueprint_shots"]>=1
              print("IPPT_BLUEPRINT_RELEASE_EVENT_QUERY_QA_PASS",gid,{
                  "all_original_Blueprint_shots":len(full),
                  "exact_PBP_shooter_matches":sum(x["NBA_PBP_exact_join_verified"] for x in full),
                  "source_ball_shooter_release_candidates":sum(
                     x["source_physics_release_UTC_ms"] is not None for x in full),
                  "source_original_shooter_defender_pairs":sum(
                     x["source_original_shooter"] is not None and
                     x["source_original_published_nearest_defender"] is not None for x in full),
                  "physical_time_video_certified":False,
                  "original_native_coordinates_printed":False})
          PY

# Real NBA event query with published Blueprint metrics and original source candidate.
