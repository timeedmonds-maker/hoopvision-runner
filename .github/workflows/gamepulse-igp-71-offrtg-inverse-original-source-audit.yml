# Public aggregate orchestration; all original official NBA PBP and rating refs stay private.
name: IGP 71game original NBA team OffRtg inverse possession audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-71-offrtg-inverse-original-source-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-71-nba-team-offrtg-inverse-audit
  cancel-in-progress: false
jobs:
  entire-original-71:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-71-nba-offrtg-possession-inverse-audit-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Clone immutable original NBA PBP and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_71_team_offrtg_inverse_audit_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
             -p 'test_igp_71_team_offrtg_inverse_audit_v1.py'
          echo IGP_TEAM_OFFRTG_INVERSE_SOURCEFREE_TESTS_PASSED
      - name: Verify original 71game official score and logical chains vs 14game NBA lineups
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_71_team_offrtg_inverse_audit_v1.py \
            --root . --out "$RUNNER_TEMP/igp-team-offrtg-inverse-71-audit.json" \
            >"$RUNNER_TEMP/igp-team-offrtg-inverse-71-audit.log" 2>&1 || {
              echo IGP_TEAM_OFFRTG_PRIVATE_71_AUDIT_FAILED
              python3 - <<'PY'
          from pathlib import Path
          import os,re
          lines=(Path(os.environ["RUNNER_TEMP"])/"igp-team-offrtg-inverse-71-audit.log").read_text(errors="replace").splitlines()
          v=next((x for x in reversed(lines) if re.match(r"^(?:ValueError|KeyError|TypeError|AssertionError):",x)),None)
          if v:
              name,_,detail=v.partition(":")
              code=detail.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_TEAM_OFFRTG_PRIVATE_FAILURE",name,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_TEAM_OFFRTG_PRIVATE_FAILURE UNCLASSIFIED")
          PY
              exit 43
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-team-offrtg-inverse-71-audit.json").read_bytes())
          c=x["counts"]
          assert c["games"]==71 and c["team_games"]==142
          assert c["all71_logical_chains"]==14612
          assert c["advanced_player_integer_inverse_cases"]==17
          assert c["advanced_player_integer_inverse_passed"]==17
          assert c["historical_team_games"]==28
          assert c["historical_NBA_lineup_possessions"]==3010
          assert c["historical_IGP_adjusted_action_runs"]==2914
          assert c["historical_exact_lineup_vs_runs"]==2
          assert x["NBA_official_team_advanced_source_completeness"]=="INCOMPLETE_NO_FABRICATED_TEAM_OFFRTG"
          print("IGP_TEAM_OFFRTG_ORIGINAL_SOURCE_71_AUDIT_PASSED",json.dumps(c,sort_keys=True))
          print("IGP_OFFICIAL_TEAM_ADVANCED_MISSING_NO_FABRICATION")
          PY
      - name: Commit original QA privately without overwriting existing source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_71_team_offrtg_inverse_possession_audit_v1.json
          mkdir -p "$(dirname "$dest")"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/igp-team-offrtg-inverse-71-audit.json" "$dest"
            echo IGP_TEAM_OFFRTG_AUDIT_PRIOR_SAME_SHA
            exit 0
          fi
          cp "$RUNNER_TEMP/igp-team-offrtg-inverse-71-audit.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): source-first 71game team OffRtg inverse test and audited 14game lineup vs action-run divergence'
          gh auth setup-git
          for n in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 44
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
               echo IGP_TEAM_OFFRTG_PRIVATE_QA_COMMITTED
               exit 0
            fi
          done
          exit 45
