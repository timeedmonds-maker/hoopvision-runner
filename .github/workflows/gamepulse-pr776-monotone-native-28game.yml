name: PR776 NBA native monotone 28-game research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-monotone-native-28game.yml']
permissions: {contents: read}
jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private source guard and clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Run private source-native matching for all 28 clock-window games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_monotone_native_chain_season_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p test_igp_monotone_native_chain_pilot_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261026/monotone_native_chain_28game_v1
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_monotone_native_chain_season_2026.py --out-dir "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          j=json.loads((Path(sys.argv[1])/'index.json').read_text())
          assert j['source_game_count']==28
          assert len(j['games'])==28 and j['physical_possessions_certified']==0
          t=j['totals']
          assert t['source_windows']==t['matched_provisional']+t['unassigned']
          print('IGP_28_NATIVE_NBA_CANDIDATE_ACCEPTED',json.dumps(t,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 29
          git commit -q -m "data(igp): preserve 28-game source NBA monotone research candidate index"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_28_MONOTONE_NATIVE_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 11
