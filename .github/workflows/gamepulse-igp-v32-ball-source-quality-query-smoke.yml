# Source-first NBA original coordinates remain SHA private; only grade label logged.
name: IGP 3.2 source integrity 71game optin query smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-ball-source-quality-query-smoke.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public repo, source-verify private QA and test safely
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_v32_ball_source_integrity_overlay_v1.py'
          python3 - <<'PY'
          from query_igp_v32_ball_source_integrity_overlay_v1 import query
          gid='0022600001'
          t=1792529535721
          q=query('.',gid,t,t,hz=10)
          assert q['warning_rows']==1
          row=q['rows'][0]
          assert row['source_original_native_timestamp']
          assert row['source_original_xyz_native'].get('ball') is not None
          assert row['ball_source_integrity']['original_spike_alert_at_utc_ms']==t
          assert row['ball_source_integrity']['original_SDK_ball_keyframe_upstream_grade']=='SDK_UPSTREAM_INTERPOLATED_TRUE'
          assert row['ball_source_integrity']['provider_upstream_interpolated_true_ball_source_involved']
          assert q['provider_upstream_interpolated_ball_rows']==1
          assert not row['ball_source_integrity']['query_source_ball_usable_for_physical_analysis_without_review']
          assert q['accepted_scene_coverage_unchanged']
          print('IGP_V32_NATIVE_SOURCE_QUALITY_INTEGRATED_QUERY_PASSED warning_rows=1 source_changed=false')
          PY
