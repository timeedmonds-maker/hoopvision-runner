name: Game Pulse quarantined games independent native touch search
# CPU-only; raw SDK and all source player records remain ephemeral or PRIVATE 104.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-quarantined-native-labels.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-pulse-quarantined-source-touch-search
  cancel-in-progress: false
jobs:
  original-native-labels:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600009','0022600101']
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.game }}
      PRIVATE_REPO: timeedmonds-maker/104
      SOURCE_REF: 3d1adf72eaee46c02ef63feef2169cec60ccf140
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public private source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_CREDENTIAL_UNAVAILABLE'; exit 3; }
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
      - name: Acquire private original source code and deterministic synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-native-labels"
          mkdir -p "$ROOT"/{sdk,tests}
          fetch() {
            local src="$1" dest="$2"
            gh api "repos/$PRIVATE_REPO/contents/$src?ref=$SOURCE_REF" --jq .content |
              base64 --decode > "$ROOT/$dest"
            test -s "$ROOT/$dest"
          }
          fetch gamepulse/fusion/quarantined_tracking_labels_2026.py quarantined_tracking_labels_2026.py
          fetch gamepulse/fusion/gamepulse_ball_dynamics.py gamepulse_ball_dynamics.py
          fetch gamepulse/fusion/gamepulse_ball_control.py gamepulse_ball_control.py
          fetch gamepulse/fusion/tests/test_quarantined_tracking_labels_2026.py tests/test_quarantined_tracking_labels_2026.py
          for src in "gamepulse/fusion/official_pbp_timing/games/$GAME_ID.json" \
                     "gamepulse/fusion/index/games/$GAME_ID.json"; do
            name=pbp.json
            if [[ "$src" == *"/index/games/"* ]]; then name=view.json; fi
            gh api "repos/$PRIVATE_REPO/contents/$src?ref=main" --jq .content |
              base64 --decode > "$ROOT/$name"
            test -s "$ROOT/$name"
          done
          python3 -m py_compile "$ROOT/quarantined_tracking_labels_2026.py"
          PYTHONPATH="$ROOT" python3 -m unittest discover -s "$ROOT/tests" \
            -p 'test_quarantined_tracking_labels_2026.py' -v
      - name: Download full SHA-verified original Game Pulse SDK source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-native-labels"
          TAG="gamepulse-sdk-$GAME_ID"
          gh api "repos/$PRIVATE_REPO/releases/tags/$TAG" > "$ROOT/release.json"
          gh release download "$TAG" --repo "$PRIVATE_REPO" \
            --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk" --clobber >/dev/null
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'private-native-labels'
          entries={a['name']:a.get('digest') for a in json.loads((r/'release.json').read_text())['assets']
                   if re.fullmatch(r'sdk-part-\d{2}\.tar\.gz',a['name'])}
          files=sorted((r/'sdk').glob('sdk-part-??.tar.gz'))
          assert len(files)==len(entries)==13,'ORIGINAL_SOURCE_ARCHIVE_INCOMPLETE'
          for f in files:
              assert entries[f.name]=='sha256:'+hashlib.sha256(f.read_bytes()).hexdigest(), 'ORIGINAL_SOURCE_PART_HASH_MISMATCH'
          print('PRIVATE_QUARANTINED_GAME_ORIGINAL_SDK_SHA_VERIFIED')
          PY
      - name: Index all original source-native labels with no NBA possession claims
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-native-labels"
          cd "$ROOT"
          python3 quarantined_tracking_labels_2026.py --game "$GAME_ID" \
            --sdk-dir sdk --pbp pbp.json --view view.json --out source-native.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads((Path(os.environ['RUNNER_TEMP'])/'private-native-labels/source-native.json').read_text())
          assert doc['game_id']==os.environ['GAME_ID']
          assert doc['schema']=='gamepulse.source-native-quarantined-touch-search.v1'
          assert doc['native_source_unique_touch_labels']>0
          assert doc['native_source_unique_touch_labels']==len(doc['touches'])
          assert doc['nba_pbp_action_tracking_utc_joins_certified']==0
          assert doc['physical_possessions_certified']==0
          assert all(t['nba_action_number'] is None for t in doc['touches'])
          print('PRIVATE_QUARANTINED_NATIVE_SEARCH_VALIDATED_NO_UNSUPPORTED_JOINS')
          PY
      - name: Persist source-only search index SHA-verified in private 104
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time
          from pathlib import Path
          repo=os.environ['PRIVATE_REPO'];gid=os.environ['GAME_ID']
          data=(Path(os.environ['RUNNER_TEMP'])/'private-native-labels/source-native.json').read_bytes()
          path='repos/'+repo+'/contents/gamepulse/fusion/index/quarantined_native_labels/'+gid+'.json'
          def gh(*args,input=None,check=True):
              r=subprocess.run(['gh','api',*args],input=input,
                               capture_output=True,text=True,timeout=90)
              if check and r.returncode:raise RuntimeError('PRIVATE_SOURCE_INDEX_GITHUB_OPERATION_FAILED')
              return r
          for attempt in range(9):
              old=gh(path,check=False)
              if old.returncode and '404' not in old.stderr and 'Not Found' not in old.stderr:
                  raise RuntimeError('PRIVATE_SOURCE_INDEX_PREVIOUS_READ_FAILED')
              payload={'branch':'main','message':'data(gamepulse): quarantine-safe original SDK native touch search '+gid,
                       'content':base64.b64encode(data).decode()}
              if old.returncode==0:
                  prior=json.loads(old.stdout)
                  if base64.b64decode(prior['content'])==data:
                      print('PRIVATE_SOURCE_ONLY_INDEX_UNCHANGED');break
                  payload['sha']=prior['sha']
              change=gh('-X','PUT',path,'--input','-',input=json.dumps(payload),check=False)
              if change.returncode:
                  time.sleep(min(attempt+2,12));continue
              blob=json.loads(change.stdout)['content']['sha']
              readback=json.loads(gh('repos/'+repo+'/git/blobs/'+blob).stdout)
              observed=base64.b64decode(readback['content'])
              assert observed==data and hashlib.sha256(observed).digest()==hashlib.sha256(data).digest()
              print('PRIVATE_SOURCE_ONLY_SEARCH_SHA_READBACK_VERIFIED')
              break
          else:raise RuntimeError('PRIVATE_SOURCE_ONLY_INDEX_WRITE_CONFLICT')
          PY
  aggregate:
    needs: original-native-labels
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private source index and publish manifest of both quarantined games
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time
          repo=os.environ['PRIVATE_REPO']
          def api(*args,input=None,check=True):
              p=subprocess.run(['gh','api',*args],input=input,
                               capture_output=True,text=True,timeout=80)
              if check and p.returncode:raise RuntimeError('PRIVATE_INDEX_MANIFEST_API_FAILED')
              return p
          entries={}
          for gid in ('0022600009','0022600101'):
              path='gamepulse/fusion/index/quarantined_native_labels/'+gid+'.json'
              raw=base64.b64decode(json.loads(api('repos/'+repo+'/contents/'+path).stdout)['content'])
              doc=json.loads(raw)
              assert doc['game_id']==gid and doc['nba_pbp_action_tracking_utc_joins_certified']==0
              entries[gid]={'path':path,'sha256':hashlib.sha256(raw).hexdigest(),
                            'native_labels':doc['native_source_unique_touch_labels'],
                            'official_actions':doc['official_pbp_actions_indexed']}
          out={'schema':'gamepulse.quarantined-native-touch-season-index.v1',
               'season':'2026-27','game_count':2,'games':entries,
               'state':'SOURCE_ONLY_NATIVE_TRACKING_SEARCH_NO_PBP_POSSESSION_JOIN',
               'physical_possessions_certified':0}
          data=(json.dumps(out,sort_keys=True,indent=2)+'\n').encode()
          target='repos/'+repo+'/contents/gamepulse/fusion/index/quarantined_native_labels/index-2026-27.json'
          for attempt in range(10):
              old=api(target,check=False)
              payload={'branch':'main','message':'data(gamepulse): index two source-only quarantined SDK games',
                       'content':base64.b64encode(data).decode()}
              if old.returncode==0:
                  prior=json.loads(old.stdout)
                  if base64.b64decode(prior['content'])==data:break
                  payload['sha']=prior['sha']
              elif '404' not in old.stderr and 'Not Found' not in old.stderr:
                  raise RuntimeError('PRIVATE_SOURCE_ONLY_MANIFEST_LOOKUP_FAILED')
              result=api('-X','PUT',target,'--input','-',input=json.dumps(payload),check=False)
              if result.returncode:
                  time.sleep(attempt+1);continue
              blob=json.loads(result.stdout)['content']['sha']
              saved=json.loads(api('repos/'+repo+'/git/blobs/'+blob).stdout)
              assert base64.b64decode(saved['content'])==data,'SOURCE_ONLY_MANIFEST_SHA_READBACK_FAILED'
              break
          else:raise RuntimeError('PRIVATE_SOURCE_ONLY_SEASON_MANIFEST_CONFLICT')
          print('PRIVATE_SOURCE_ONLY_QUARANTINE_GAME_INDEX_VERIFIED',len(entries))
          PY
