name: Game Pulse Denver bounded genuine-source retry
# Genuine SDK event-slot arrays only. Source transport completion is NOT
# independent Q1-Q4 active-play coverage certification. No private outputs here.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-denver-source-ready-retry.yml']
  schedule:
    - cron: '19 7,9,11,13,17,21 23 10 *'
permissions:
  contents: read
concurrency:
  group: gamepulse-denver-bounded-postgame-source-retry
  cancel-in-progress: false
jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.horizon.outputs.eligible }}
    steps:
      - name: Restrict capture to 2026-10-23 UTC source horizon
        id: horizon
        shell: bash
        run: |
          if [ "$(date -u +%Y-%m-%d)" = '2026-10-23' ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi
  recover:
    if: github.event_name == 'schedule' && needs.eligibility.outputs.eligible == 'true'
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAMEPULSE_PRODUCTION_ENABLED: 'true'
      GAMEPULSE_PRIORITY_FINALIZE: 'true'
      GAMEPULSE_FINAL_FASTLANE: 'true'
      GAMEPULSE_PRIORITY_ID: '0022600007'
      GAMEPULSE_PRIORITY_TIPOFF: '2026-10-23T01:30:00Z'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce strict public content boundary
        run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sanctioned SDK with scripts disabled
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Recover only source-published arrays and independently SHA-verify original checkpoints
        working-directory: tools/licensed_feed
        run: node season_private_release.mjs
      - name: State transport versus play certification
        if: always()
        run: echo 'Private 104 holds actual SDK manifests; success here does not prove Q1-Q4 player coverage.' >> "$GITHUB_STEP_SUMMARY"
