name: Clip Lab Rockets Spurs Adams 86 source-native video sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-rockets-spurs-adams-86-video-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-lab-rockets-spurs-adams-86-video-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private-only output and public content guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-rockets-spurs-adams-86-video-sync.yml'])
          print('PRIVATE_VISUAL_SYNC_PUBLIC_BOUNDARY_PASS')
          PY
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_AUTH_MISSING; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Compare original screen recording to native event86 broadcast on CPU
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/clip_fingerprint.py?ref=main' --jq .content | base64 -d > "$ROOT/clip_fingerprint.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/qa/0022600009_user_video_visual_fingerprint.json?ref=main' --jq .content | base64 -d > "$ROOT/source_fingerprints.json"
          gh release download clip-lab-rockets-spurs-0022600009-e86-broadcast --repo timeedmonds-maker/104 --pattern '0022600009-e86-broadcast.mp4' --dir "$ROOT" >/dev/null
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' opencv-python-headless==4.10.0.84
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          PYTHONPATH="$ROOT" python3 - "$ROOT" <<'PY'
          import base64,hashlib,json,subprocess,sys
          from pathlib import Path
          from clip_fingerprint import align
          root=Path(sys.argv[1])
          fp=json.loads((root/'source_fingerprints.json').read_text())
          video=root/'0022600009-e86-broadcast.mp4'
          results=align(video,fp,step_frames=2)
          best=results[0] if results else None
          others=[r for r in results if best and abs(r['native_start_s']-best['native_start_s'])>=1.0]
          alternative=max((r['mean_ncc'] for r in others),default=-1.0)
          good=bool(best and best['mean_ncc']>=.72 and best['min_ncc']>=.40
                    and best['mean_ncc']-alternative>=.04
                    and best['matched']>=10)
          report={
            'schema':'hoopvision.clip-lab.video-content-sync.v1',
            'game_id':'0022600009','event_num':86,
            'original_source_video_sha256':fp['source_file_sha256'],
            'native_video_sha256':hashlib.sha256(video.read_bytes()).hexdigest(),
            'fingerprint_sample_count':len(fp['source_frames']),
            'method':'CPU_ONLY_MULTI_FRAME_NORMALIZED_GRAYSCALE_CORRELATION',
            'best_matches':results,
            'unrelated_alternative_ncc':alternative,
            'match_certified':good,
            'matched_native_video_start_s':best['native_start_s'] if good else None,
            'native_video_to_absolute_utc_certified':False,
            'physical_foot_tracks_certified':False,
            'state':'NATIVE_VIDEO_TO_USER_SCREENRECORD_MATCHED' if good else 'NATIVE_VIDEO_VISUAL_MATCH_NOT_CERTIFIED'
          }
          (root/'visual_sync_qa.json').write_text(json.dumps(report,indent=2)+'\n')
          # Private GitHub index: no source pixels or video publicly retained.
          target='repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/qa/0022600009_native_to_screenrecord_alignment.json'
          before=subprocess.run(['gh','api',target],capture_output=True,text=True)
          payload={'message':'data(clip-lab): native event86 to uploaded screenshot video visual sync QA',
                   'branch':'main','content':base64.b64encode((root/'visual_sync_qa.json').read_bytes()).decode()}
          if before.returncode==0:payload['sha']=json.loads(before.stdout)['sha']
          result=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],input=json.dumps(payload),text=True,capture_output=True)
          if result.returncode:raise RuntimeError('PRIVATE_SYNC_QA_PUBLISH_FAILED')
          readback=subprocess.check_output(['gh','api',target,'--jq','.content'])
          assert base64.b64decode(readback)==(root/'visual_sync_qa.json').read_bytes()
          print('PRIVATE_VIDEO_SYNC_QA_PUBLISHED',report['state'])
          if good:
              start=best['native_start_s']
              subprocess.run(['ffmpeg','-nostdin','-y','-v','error','-ss',f'{start:.5f}',
                '-i',str(video),'-t','8.2','-map','0:v:0','-map','0:a?',
                '-c:v','libx264','-preset','fast','-crf','12','-pix_fmt','yuv420p',
                '-c:a','aac','-b:a','192k','-movflags','+faststart',
                str(root/'0022600009-e86-user-matched-8s.mp4')],check=True,timeout=180)
              print('USER_WINDOW_NATIVE_VIDEO_MATCHED_AND_TRIMMED')
          else:
              print('NO_UNVERIFIED_NATIVE_VIDEO_TRIM_CREATED')
          PY
          if [ -f "$ROOT/0022600009-e86-user-matched-8s.mp4" ]; then
            gh release upload clip-lab-rockets-spurs-0022600009-e86-broadcast "$ROOT/0022600009-e86-user-matched-8s.mp4" "$ROOT/visual_sync_qa.json" --repo timeedmonds-maker/104 --clobber
            python3 - "$ROOT" <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          d=json.loads(subprocess.check_output(['gh','api','repos/timeedmonds-maker/104/releases/tags/clip-lab-rockets-spurs-0022600009-e86-broadcast'],text=True))
          a={x['name']:x for x in d['assets']}
          for name in ['0022600009-e86-user-matched-8s.mp4','visual_sync_qa.json']:
              assert a[name]['digest']=='sha256:'+hashlib.sha256((root/name).read_bytes()).hexdigest(),'PRIVATE_MATCHED_CLIP_SHA_READBACK_FAILED'
          print('PRIVATE_MATCHED_USER_WINDOW_SHA_VERIFIED')
          PY
          fi

          # Private-only low-resolution visual QA thumbnails for camera comparison.
          python3 - "$ROOT" <<'PY'
          import base64,json,subprocess,sys
          from pathlib import Path
          import cv2
          root=Path(sys.argv[1]);video=root/'0022600009-e86-broadcast.mp4'
          cap=cv2.VideoCapture(str(video));fps=float(cap.get(cv2.CAP_PROP_FPS))
          for second in (0,4,8,12,16):
              cap.set(cv2.CAP_PROP_POS_FRAMES,int(round(second*fps)))
              ok,frame=cap.read()
              if not ok:continue
              small=cv2.resize(frame,(480,270))
              ok,buf=cv2.imencode('.jpg',small,[int(cv2.IMWRITE_JPEG_QUALITY),70])
              if not ok:continue
              raw=base64.b64encode(buf.tobytes()).decode()
              target=f'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/qa/native_event86_preview_t{second:02d}.jpg.b64.txt'
              old=subprocess.run(['gh','api',target],capture_output=True,text=True)
              payload={'branch':'main','message':f'qa(private): native event86 video frame at {second}s',
                       'content':base64.b64encode(raw.encode()).decode()}
              if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
              put=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],input=json.dumps(payload),text=True,capture_output=True)
              if put.returncode:raise RuntimeError('PRIVATE_PREVIEW_WRITE_FAILED')
          cap.release()
          print('PRIVATE_NATIVE_EVENT86_VISUAL_QA_THUMBNAILS_INDEXED')
          PY
