# V3B licensed source readback occurs solely inside private checkout. Public
# logs contain bounded aggregate QA counts, never XYZ, exact UTC or source events.
name: IGP 3.2 V3B outside S1 source-native evidence 54 games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-v3b-outside-s1-original-native.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-v3b-original-native-outside-s1
  cancel-in-progress: false
jobs:
  v3b-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public confidentiality guard and private original SHA checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_outside_s1_original_native_census_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_outside_s1_original_native_census_v1.py'
          echo V3B_SOURCE_FREE_NATIVE_VS_10HZ_AND_ROSTER_GATES_PASS
      - name: Audit 54 original SDK games at verified companion clock windows
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_outside_s1_original_native_census_v1.py \
            --root . --out "$RUNNER_TEMP/v3b-native-private.json" \
            >"$RUNNER_TEMP/v3b-native-private.log" 2>&1 || {
              echo V3B_ORIGINAL_SDK_COMPANION_SHA_OR_DENOMINATOR_GATE_FAILED
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'v3b-native-private.json').read_text())
          a=q['counts']
          assert a['source_games']==54
          assert len(q['games'])==54
          assert a['V3_companion_outside_strict_S1_10hz_candidate_ticks']==80271
          assert (a['outside_S1_10hz_near_original_native_within_50ms']+
                  a['outside_S1_10hz_without_native_within_50ms'])==80271
          assert a['outside_S1_10hz_exact_original_same_UTC']<=a[
             'outside_S1_10hz_near_original_native_within_50ms']
          assert not q['source_XYZ_or_official_NBA_PBP_mutated']
          assert not q['accepted_IGP32_tracking_10hz_changed']
          assert q['certified_physical_possessions']==0
          print('IGP_V3B_54GAME_SHA_NATIVE_ORIGINAL_COUNTS_PASS',json.dumps({
             'clock_outside_s1_100ms':80271,
             'near50_native_grid_ticks':a['outside_S1_10hz_near_original_native_within_50ms'],
             'exact_native_grid_ticks':a['outside_S1_10hz_exact_original_same_UTC'],
             'direct_original_native_frames':a['original_native_frames_in_companion_corrob_outside_S1'],
             'raw_exact_official_ten_ball_native_frames':a.get('outside_S1_original_native_exact_official10_ball',0),
             'native_in_official_roster_window':a.get('outside_S1_original_native_in_official_lineup_window',0),
             'independently_video_confirmed':0,
          },sort_keys=True))
          PY
      - name: Commit original-source SHA and read-only evidence in private 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest="gamepulse/fusion/qa/igp_v32/igp_v32_v3b_outside_S1_original_native_54_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v3b-evidence "origin/$BRANCH"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/v3b-native-private.json" "$dest" || {
              echo V3B_PRIVATE_QA_ALREADY_EXISTS_WITH_DIFFERENT_BYTES
              exit 42
            }
            echo V3B_PRIVATE_QA_ALREADY_RECORDED
            exit 0
          fi
          mkdir -p "$(dirname "$dest")"
          cp "$RUNNER_TEMP/v3b-native-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): 54-game V3B outside-S1 original native source census'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo V3B_SHA_ORIGINAL_NATIVE_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 43
