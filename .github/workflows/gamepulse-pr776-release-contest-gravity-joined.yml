name: PR776 NBA shot release reported-defender and Gravity joined exports
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-release-contest-gravity-joined.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-release-contest-gravity-exports
  cancel-in-progress: false
jobs:
  private-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read the accepted 52-game private SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/shot-private"
          git -C "$RUNNER_TEMP/shot-private" sparse-checkout set --no-cone \
            '/gamepulse/fusion/materialized/igp_blueprint_native_52_20261028/blueprint_native_plus_nba_gravity_9cb23e11adcb.sqlite'
          echo "PRIVATE_ROOT=$RUNNER_TEMP/shot-private" >> "$GITHUB_ENV"
      - name: Export two fully joined source-backed CSV files with QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          python3 - <<'PY'
          import sqlite3,csv,json,hashlib
          from pathlib import Path
          folder=Path("gamepulse/fusion/materialized/igp_blueprint_native_52_20261028")
          source=folder/"blueprint_native_plus_nba_gravity_9cb23e11adcb.sqlite"
          original_sha=hashlib.sha256(source.read_bytes()).hexdigest()
          out=folder/"release_defender_gravity_join_20261028"
          assert not out.exists(), "REFUSE_TO_OVERWRITE_JOIN"
          out.mkdir()
          db=sqlite3.connect("file:"+str(source.resolve())+"?mode=ro",uri=True)
          db.row_factory=sqlite3.Row
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          counts={t:db.execute("SELECT count(*) FROM "+t).fetchone()[0] for t in
                 ("source_games","native_shots","game_featured_gravity","nba_official_gravity_leaders")}
          assert counts=={"source_games":52,"native_shots":8608,"game_featured_gravity":102,"nba_official_gravity_leaders":304}
          player_query="""
          WITH s AS (
            SELECT shooter_id player_id,MAX(shooter_name) blueprint_player,
            GROUP_CONCAT(DISTINCT shooter_team) blueprint_teams,
            COUNT(*) all_fga,
            SUM(CASE WHEN shot_type='3pt' THEN 1 ELSE 0 END) source_3pa,
            SUM(CASE WHEN shot_type='3pt' AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT' THEN 1 ELSE 0 END) official_matched_3pa,
            SUM(CASE WHEN shot_type='3pt' AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'
               AND release_time_seconds IS NOT NULL THEN 1 ELSE 0 END) valid_3pt_release_count,
            ROUND(AVG(CASE WHEN shot_type='3pt' AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'
               THEN release_time_seconds END),6) avg_3pt_release_seconds,
            SUM(CASE WHEN shot_type='3pt' AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'
               AND contest_distance_inches IS NOT NULL THEN 1 ELSE 0 END) contest_distance_count,
            ROUND(AVG(CASE WHEN shot_type='3pt' AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'
               THEN contest_distance_inches END),3) avg_provider_contest_distance_inches,
            SUM(CASE WHEN shot_type='3pt' AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'
               AND blueprint_defender_id IS NOT NULL THEN 1 ELSE 0 END) reported_defender_count
            FROM native_shots GROUP BY shooter_id)
          SELECT g.player_id,g.player_name player,g.team gravity_team,g.games_played gravity_games,
            g.frames gravity_frames,g.avg_gravity_score overall_gravity,
            g.on_ball_perimeter_avg on_ball_perimeter_gravity,
            g.off_ball_perimeter_avg off_ball_perimeter_gravity,
            g.on_ball_interior_avg on_ball_interior_gravity,
            g.off_ball_interior_avg off_ball_interior_gravity,
            s.blueprint_teams,s.all_fga,s.source_3pa,s.official_matched_3pa,
            s.valid_3pt_release_count,s.avg_3pt_release_seconds,
            s.contest_distance_count,s.avg_provider_contest_distance_inches,s.reported_defender_count,
            CASE WHEN s.official_matched_3pa>=20 AND s.valid_3pt_release_count>=20 THEN 1 ELSE 0 END
               qualified_release_20
          FROM nba_official_gravity_leaders g LEFT JOIN s ON s.player_id=g.player_id
          ORDER BY g.avg_gravity_score DESC,g.frames DESC,g.player_id"""
          shot_query="""
          SELECT s.game_id,s.game_date,s.period,s.game_clock,s.event_id,s.shot_type,
            s.official_match_grade,s.shooter_id,s.shooter_name,s.shooter_team,
            s.release_time_seconds,s.original_release_time_seconds,s.release_status,
            s.blueprint_defender_id provider_reported_defender_id,
            s.blueprint_defender_name provider_reported_defender_name,
            s.blueprint_defender_team provider_reported_defender_team,
            s.contest_distance_inches provider_contest_distance_inches,
            s.contest_height_inches,s.shot_distance_feet,s.made,s.expected_fg_pct,
            g.avg_gravity_score shooter_season_gravity,
            g.on_ball_perimeter_avg shooter_on_ball_perimeter_gravity,
            g.off_ball_perimeter_avg shooter_off_ball_perimeter_gravity,
            g.on_ball_interior_avg shooter_on_ball_interior_gravity,
            g.off_ball_interior_avg shooter_off_ball_interior_gravity,
            d.avg_gravity_score reported_defender_season_gravity,
            s.source_sha256 blueprint_source_sha256,s.official_pbp_sha256
          FROM native_shots s
          LEFT JOIN nba_official_gravity_leaders g ON g.player_id=s.shooter_id
          LEFT JOIN nba_official_gravity_leaders d ON d.player_id=s.blueprint_defender_id
          ORDER BY s.game_date,s.game_id,s.event_id"""
          result={}
          for filename,sql in (("player_gravity_release_contest.csv",player_query),
                               ("shots_release_reported_defender_gravity.csv",shot_query)):
              cursor=db.execute(sql)
              fieldnames=[x[0] for x in cursor.description]
              values=[dict(x) for x in cursor]
              with (out/filename).open("w",newline="",encoding="utf-8") as f:
                  writer=csv.DictWriter(f,fieldnames=fieldnames,lineterminator="\n")
                  writer.writeheader()
                  writer.writerows(values)
              result[filename]=values
          p=result["player_gravity_release_contest.csv"]
          s=result["shots_release_reported_defender_gravity.csv"]
          assert len(p)==304 and len(s)==8608
          assert len({(r["game_id"],r["event_id"]) for r in s})==8608
          assert sum(r["shot_type"]=="3pt" for r in s)==3715
          assert sum(r["shot_type"]=="3pt" and r["official_match_grade"]=="NBA_ACTION_SHOOTER_TYPE_EXACT" for r in s)==3688
          assert sum(r["qualified_release_20"]==1 for r in p)==49
          assert sum((r["official_matched_3pa"] or 0)>0 for r in p)==276
          record={"schema":"gamepulse.native_blueprint_shot_defender_nba_gravity.v1",
            "source_sqlite_sha256":original_sha,"source_counts":counts,
            "player_rows":len(p),"shot_rows":len(s),
            "nba_gravity_players_with_exact_blueprint_3pa":276,
            "qualified_release_players":49,
            "with_reported_defender":sum(r["provider_reported_defender_id"] is not None for r in s),
            "with_reported_contest_distance":sum(r["provider_contest_distance_inches"] is not None for r in s),
            "notes":"Provider-designated Blueprint defender is not independently certified physically closest. Official NBA Gravity is season-to-capture; Blueprint shots are 20-26 October 2026.",
            "top20_gravity":p[:20],
            "top20_qualified_fastest_release":sorted((r for r in p if r["qualified_release_20"]==1),
               key=lambda r:r["avg_3pt_release_seconds"])[:20],
            "file_sha256":{fn:hashlib.sha256((out/fn).read_bytes()).hexdigest() for fn in result}}
          (out/"join_qa.json").write_text(json.dumps(record,indent=2,ensure_ascii=False,sort_keys=True)+"\n")
          assert hashlib.sha256(source.read_bytes()).hexdigest()==original_sha
          print("BLUEPRINT_GRAVITY_SHOT_JOIN_QA",
                json.dumps({k:record[k] for k in ("player_rows","shot_rows",
                  "with_reported_defender","with_reported_contest_distance",
                  "nba_gravity_players_with_exact_blueprint_3pa","qualified_release_players")},sort_keys=True))
          PY
      - name: Publish all three verified files exclusively to private PR 776
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT=gamepulse/fusion/materialized/igp_blueprint_native_52_20261028/release_defender_gravity_join_20261028
          git config user.name "NBA joined-data source validation"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add --sparse -f "$OUT"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check >/dev/null 2>&1 || { echo PRIVATE_JOIN_DIFF_CHECK_FAILED; exit 12; }
          git commit -qm "data(gamepulse): materialize NBA release, reported contest defender and official Gravity joins"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin HEAD:refs/heads/"$BRANCH"; then
              echo PRIVATE_RELEASE_DEFENDER_GRAVITY_JOIN_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 16
