name: IGP 68 unified native ten-ball original source query real SHA readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-native-scene-query-readback.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test single canonical query across raw, reconstructed and unavailable games
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/games
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_season68_native_scene_v1.py gamepulse/fusion/query_igp_unified_2026_27_season_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_native_scene_model_v2.py'
          python3 - <<'PY'
          import json
          from pathlib import Path
          from igp_native_scene_season_68_benchmark_v1 import load_game
          from query_igp_unified_2026_27_season_v1 import query
          good=0
          for gid in ('0022600001','0022600138'):
            frames,manifest,sha=load_game(Path('.'),gid)
            t,raw=frames[len(frames)//2]
            q=query('.',gid,native_utc_ms=t)
            assert q['native_source_manifest_sha256']==sha
            assert q['native_source_timestamp_count']==len(frames)
            assert not q['physical_possessions_certified']
            assert q['scene']['official_lineup_verified'] is False
            assert q['scene']['gameclock_period_certified'] is False
            for actor,p in q['scene']['players_by_source_id'].items():
                if p['grade']=='ORIGINAL_SDK_DIRECT':
                    assert p['xyz_native']==raw[actor]
            if 'ball' in raw:
                assert q['scene']['ball']['xyz_native']==raw['ball']
            assert q['scene']['physical_possession_certified'] is False
            good+=1
          pending=query('.','0022600142',native_utc_ms=1793232000000)
          assert pending['status']=='ORIGINAL_XYZ_SOURCE_NOT_MATERIALIZED'
          idx=json.loads(Path('gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json').read_bytes())
          assert idx['total_indexed_games_including_additive']==68
          old=query('.','0022600009',action_number=7,include_positions=False)
          assert old['source_status']=='PRESERVED_ACCEPTED_36_MODEL'
          print('IGP_68_NATIVE_SCENE_CANONICAL_QUERY_SHA_PASS',good,'legacy_unchanged',True,'unavailable_not_fabricated',True)
          PY
