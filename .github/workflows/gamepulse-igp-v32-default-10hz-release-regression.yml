name: IGP32 permanently locked 10Hz accepted source QA default regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-default-10hz-release-regression.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  default-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin IGP32 default engine policy source QA and original timestamp grade controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_default_tracking_engine_v1.py gamepulse/fusion/query_igp_71_source_first_live_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_default_10hz_source_qa_engine_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_promoted_source_query_v1.py'
          python3 - <<'PY'
          import json
          from pathlib import Path
          from query_igp_71_source_first_live_v1 import query
          from igp_v32_default_tracking_engine_v1 import (
              DEFAULT_ENGINE,DEFAULT_HZ,EXPLICIT_LEGACY_ENGINE)
          root="."
          frozen=json.loads(Path("gamepulse/fusion/qa/igp_v32/igp_v32_v1_all71_recoverability_census_v1.json").read_bytes())
          five=json.loads(Path("gamepulse/fusion/qa/igp_v32/igp_v32_71_fivehz_ten_ball_strict_audit_v1.json").read_bytes())
          player=json.loads(Path("gamepulse/fusion/qa/igp_v32/igp_v32_71_promoted_350ms_original_source_quality_v1.json").read_bytes())
          ball=json.loads(Path("gamepulse/fusion/qa/igp_v32/igp_v32_71_ball_source_proxy_materialize_v1.json").read_bytes())
          assert DEFAULT_HZ==10
          assert frozen["all_counts"]["grid_total"]==1159651
          assert frozen["all_counts"]["grid_complete"]==923032
          assert player["promoted_player_source_qa_rows"]==41117
          assert ball["new_complete_10hz_research_P0"]==38162
          assert 923032+41117+38162==1002311
          assert five["counts"]["fivehz_total"]==579827
          assert five["counts"]["fivehz_source_QA_complete"]==501126
          assert len(five["per_game"])==71
          cases=(
              ("0022600092",1792635308600,1792635308800),
              ("0022600123",1793062774900,1793062775100),
              ("0022600113",1792966243500,1792966243700))
          for gid,a,b in cases:
              d=query(root,gid,a,b)
              assert d["engine_id"]==DEFAULT_ENGINE
              assert d["hz"]==10 and d["engine_is_default"] is True
              assert d["source_qa_accepted_not_independent_physical_P1"] is True
              assert d["original_sdk_source_not_mutated"] is True
              assert len(d["rows"])==3 and all(x["utc_ms"]%100==0 for x in d["rows"])
              if gid=="0022600092":
                  assert "PLAYER_350MS" in d["rows"][0]["model_grade"]
                  assert d["rows"][0]["complete_ten_plus_ball"]
              if gid=="0022600123":
                  flags=d["original_source_actor_quality_flags"]
                  assert len(flags)==1 and flags[0]["original_native_utc_ms"]==1793062774928
              print("IGP32_LOCKED_10HZ_DEFAULT_REAL_ORIGINAL_SHA_GAME",gid)
          fivehz=query(root,"0022600092",1792635308600,1792635309000,hz=5)
          assert fivehz["engine_id"]==DEFAULT_ENGINE
          assert all(x["utc_ms"]%200==0 for x in fivehz["rows"])
          legacy=query(root,"0022600092",1792635308600,1792635308800,
                       engine=EXPLICIT_LEGACY_ENGINE)
          assert legacy["engine_is_default"] is False
          assert "LEGACY" in legacy["rows"][0]["model_grade"]
          print("IGP32_10HZ_ALWAYS_DEFAULT_5HZ_OPT_IN_31_EXPLICIT_NO_SOURCE_DRIFT_PASS")
          PY
