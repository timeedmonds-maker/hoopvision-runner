name: HoopVision Public Request Bridge

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional pre-registered random opaque token (req- + 32 lowercase hex)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - bridge_outbox/trigger.json

# Canonical public-outbox/private-pull transport: contents:write is required only
# to publish the opaque outbox. The public workflow has no private/cloud authority.
permissions:
  contents: write

concurrency:
  group: hoopvision-public-request-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce public privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python tools/public_content_guard.py
          python - <<'PY'
          import json
          p=json.load(open("runner_policy.json"))
          assert p["schema"]=="hoopvision.public-runner-policy.v5"
          assert p["opaque_request_only"] is True
          assert p["public_safe_code_allowed"] is True
          assert p["commercial_ip_allowed"] is False
          assert p["private_source_allowed"] is False
          assert p["private_data_allowed"] is False
          assert p["private_evidence_allowed"] is False
          assert p["credentials_allowed"] is False
          assert p["detailed_private_result_allowed"] is False
          assert p["public_payload_fields"]==["request_id"]
          print("PUBLIC_PRIVACY_BOUNDARY_OK")
          PY

      - name: Require fresh private-consumer heartbeat
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git show origin/main:bridge_consumer_heartbeat.json > /tmp/heartbeat.json
          python tools/public_bridge_preflight.py --heartbeat /tmp/heartbeat.json --max-age-s 900
          echo "PRIVATE_PULL_CONSUMER_READY"

      - name: Resolve random opaque token
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          REQUEST_ID="${INPUT_REQUEST_ID:-}"
          if [ "$EVENT_NAME" = "push" ]; then
            REQUEST_ID="$(python - <<'PY'
          import json,re
          p="bridge_outbox/trigger.json"
          d=json.load(open(p))
          if set(d)!={"schema","request_id"} or d.get("schema")!="hoopvision.public-trigger.v1":
              raise SystemExit("invalid public trigger envelope")
          rid=str(d.get("request_id") or "")
          if not re.fullmatch(r"req-[0-9a-f]{32}",rid):
              raise SystemExit("invalid opaque request id")
          print(rid)
          PY
          )"
          elif [ -z "$REQUEST_ID" ]; then
            REQUEST_ID="req-$(python - <<'PY'
          import secrets
          print(secrets.token_hex(16))
          PY
          )"
          fi
          [[ "$REQUEST_ID" =~ ^req-[0-9a-f]{32}$ ]] || {
            echo "Request ID must be random opaque req-<32 lowercase hex>" >&2
            exit 2
          }
          echo "REQUEST_ID=$REQUEST_ID" >> "$GITHUB_ENV"

      - name: Publish opaque request only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge_outbox
          python - <<'PY'
          import datetime,json,os
          payload={
            "schema":"hoopvision.public-bridge-outbox.v1",
            "request_id":os.environ["REQUEST_ID"],
            "public_run_id":os.environ["GITHUB_RUN_ID"],
            "queued_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          open("bridge_outbox/latest.json","w").write(json.dumps(payload,indent=2)+"\n")
          PY
          git config user.name "hoopvision-public-bridge"
          git config user.email "hoopvision-public-bridge@users.noreply.github.com"
          git add bridge_outbox/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Queue opaque request [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "OPAQUE_REQUEST_PUBLISHED_ONLY"

      - name: Observe generic private-consumer receipt
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+900))
          verdict=WAIT
          while (( SECONDS < deadline )); do
            git fetch --quiet origin main
            if git cat-file -e origin/main:bridge_consumer_receipt.json 2>/dev/null; then
              git show origin/main:bridge_consumer_receipt.json > /tmp/receipt.json
              verdict="$(python - "$REQUEST_ID" /tmp/receipt.json <<'PY'
          import json,sys
          rid,path=sys.argv[1],sys.argv[2]
          try: doc=json.load(open(path))
          except Exception:
              print("WAIT"); raise SystemExit
          if doc.get("schema")!="hoopvision.public-consumer-receipt.v1" or doc.get("request_id")!=rid:
              print("WAIT")
          elif doc.get("status")=="CONSUMED":
              print("SUCCESS")
          elif doc.get("status") in {"REJECTED_UNREGISTERED","FAILED_TO_START_RESOLVER"}:
              print("FAILURE")
          else:
              print("WAIT")
          PY
          )"
              [ "$verdict" = SUCCESS ] && break
              [ "$verdict" = FAILURE ] && exit 4
            fi
            sleep 5
          done
          [ "$verdict" = SUCCESS ] || { echo "No matching private receipt" >&2; exit 4; }
          echo "OPAQUE_REQUEST_CONSUMED"

      - name: Wait for coarse terminal status
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+16200))
          while (( SECONDS < deadline )); do
            git fetch --quiet origin main
            if git cat-file -e origin/main:bridge_execution_status.json 2>/dev/null; then
              git show origin/main:bridge_execution_status.json > /tmp/status.json
              outcome="$(python - "$REQUEST_ID" /tmp/status.json <<'PY'
          import json,sys
          rid,path=sys.argv[1],sys.argv[2]
          try: doc=json.load(open(path))
          except Exception:
              print("WAIT"); raise SystemExit
          if doc.get("schema")!="hoopvision.public-execution-status.v1" or doc.get("request_id")!=rid:
              print("WAIT"); raise SystemExit
          status=str(doc.get("status") or "")
          terminal={"SUCCESS","FAILURE","TIMEOUT","CANCELLED","EXPIRED","INTERNAL_ERROR","UNKNOWN_TERMINAL","SUCCESS_MISSING_RESULT"}
          print(("TERMINAL:" if status in terminal else "PROGRESS:")+status)
          PY
          )"
              case "$outcome" in
                TERMINAL:SUCCESS)
                  echo "PUBLIC_SAFE_TERMINAL_SUCCESS"; exit 0 ;;
                TERMINAL:*)
                  echo "PUBLIC_SAFE_TERMINAL_NON_SUCCESS"; exit 3 ;;
                PROGRESS:*)
                  echo "PUBLIC_SAFE_PROGRESS" ;;
              esac
            fi
            sleep 30
          done
          echo "Timed out waiting for coarse terminal status" >&2
          exit 3
