name: HoopVision Request Bridge

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque HoopVision request identifier
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - REQUEST_ID

permissions:
  contents: read
  id-token: write

env:
  HV_PROJECT_ID: project-d88c48c6-7f48-4c33-928
  HV_REGION: asia-southeast1
  HV_RESOLVER_JOB: hoopvision-request-resolver
  HV_WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  HV_CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

concurrency:
  group: hoopvision-request-bridge
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Resolve opaque request identifier
        id: request
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          REQUEST_ID="${INPUT_REQUEST_ID:-}"
          if [ -z "$REQUEST_ID" ] && [ -f REQUEST_ID ]; then
            REQUEST_ID="$(tr -d '[:space:]' < REQUEST_ID)"
          fi
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || {
            echo "Invalid request identifier" >&2
            exit 2
          }
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Authenticate to private control plane
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.HV_WIF_PROVIDER }}
          service_account: ${{ env.HV_CONTROL_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit opaque request to private CPU resolver
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          HV_PROJECT_ID: ${{ env.HV_PROJECT_ID }}
          HV_REGION: ${{ env.HV_REGION }}
          HV_RESOLVER_JOB: ${{ env.HV_RESOLVER_JOB }}
        run: |
          set -euo pipefail
          gcloud run jobs execute "$HV_RESOLVER_JOB" \
            --project "$HV_PROJECT_ID" \
            --region "$HV_REGION" \
            --update-env-vars "HOOPVISION_REQUEST_ID=$REQUEST_ID" \
            --wait \
            --quiet
          echo "HoopVision opaque request resolved and accepted."
