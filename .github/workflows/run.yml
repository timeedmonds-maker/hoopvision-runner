name: HoopVision CPU Request Bridge

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque HoopVision request identifier
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - REQUEST_ID
      - .github/workflows/run.yml
      - runner_policy.json

permissions:
  contents: write
  id-token: write

env:
  HV_PROJECT_ID: project-d88c48c6-7f48-4c33-928
  HV_REGION: asia-southeast1
  HV_RESOLVER_JOB: hoopvision-request-resolver
  HV_EVIDENCE_BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  HV_WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-104
  HV_CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

concurrency:
  group: hoopvision-request-bridge
  cancel-in-progress: false

jobs:
  resolve-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce public CPU-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open("runner_policy.json"))
          assert p["schema"]=="hoopvision.public-runner-policy.v1"
          assert p["compute"]=="github_hosted_cpu"
          assert p["gpu_allowed"] is False
          assert p["private_source_checkout_allowed"] is False
          assert p["pat_allowed"] is False
          assert p["service_account_key_allowed"] is False
          assert p["authentication"]=="github_oidc_to_gcp_workload_identity_federation"
          assert p["transport"]=="public_runner_wif_private_cpu_resolver"
          assert p["dispatch_target"]=="private_cpu_request_resolver"
          assert p["gpu_authorization_allowed"] is False
          assert p["public_observation"]["gpu_dispatch_allowed"] is False
          print("HOOPVISION_PUBLIC_WIF_CPU_BOUNDARY_OK")
          PY

      - name: Resolve opaque request identifier
        id: request
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          REQUEST_ID="${INPUT_REQUEST_ID:-}"
          if [ -z "$REQUEST_ID" ] && [ -f REQUEST_ID ]; then
            REQUEST_ID="$(tr -d '[:space:]' < REQUEST_ID)"
          fi
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || {
            echo "Invalid request identifier" >&2
            exit 2
          }
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Authenticate keylessly to GCP control plane
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.HV_WIF_PROVIDER }}
          service_account: ${{ env.HV_CONTROL_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute private CPU resolver
        id: resolver
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          gcloud run jobs execute "$HV_RESOLVER_JOB" \
            --project="$HV_PROJECT_ID" \
            --region="$HV_REGION" \
            --update-env-vars="HOOPVISION_REQUEST_ID=$REQUEST_ID" \
            --wait \
            --quiet

          AUTH="gs://$HV_EVIDENCE_BUCKET/runs/$REQUEST_ID/resolver_result.json"
          gcloud storage cp "$AUTH" /tmp/resolver-result.json >/dev/null
          cat /tmp/resolver-result.json
          state="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/resolver-result.json'))
          s=str(d.get('state') or '')
          assert s in {'VALIDATED_ONLY','CPU_COMPLETED','AUTHORIZED','DISPATCHED'}, d
          if s in {'VALIDATED_ONLY','CPU_COMPLETED'}:
              assert d.get('gpu_dispatched') is False, d
          print(s)
          PY
          )"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "HOOPVISION_PUBLIC_RESOLVER_STATE=$state"

      - name: Observe CPU shadow result
        if: steps.resolver.outputs.state == 'CPU_COMPLETED'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          result_object="$(python -c "import json; print(json.load(open('/tmp/resolver-result.json')).get('result_object') or '')")"
          test -n "$result_object"
          gcloud storage cp "gs://$HV_EVIDENCE_BUCKET/$result_object" /tmp/cpu-shadow-result.json >/dev/null
          cat /tmp/cpu-shadow-result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cpu-shadow-result.json'))
          assert d.get('production_authorized') is False, d
          assert d.get('identity_authorizing') is False, d
          print("HOOPVISION_CPU_SHADOW_OK", d.get("job_id"), (d.get("solve") or {}).get("status"))
          PY

      - name: Refuse public GPU dispatch
        if: steps.resolver.outputs.state == 'AUTHORIZED' || steps.resolver.outputs.state == 'DISPATCHED'
        shell: bash
        run: |
          echo "Resolver returned a GPU-capable state. Public runner will not dispatch GPU by policy." >&2
          exit 1
