name: HoopVision Public OIDC Claim Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print non-sensitive GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.googleapis.com")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          TOKEN="$token" python - <<'PY'
          import os,json,base64
          token=os.environ["TOKEN"]
          payload=token.split(".")[1]
          payload += "="*((4-len(payload)%4)%4)
          d=json.loads(base64.urlsafe_b64decode(payload.encode()))
          keys=[
              "sub","aud","repository","repository_id","repository_owner","repository_owner_id",
              "ref","ref_type","workflow","workflow_ref","job_workflow_ref",
              "event_name","actor","actor_id","sha","runner_environment"
          ]
          print(json.dumps({k:d.get(k) for k in keys},indent=2,sort_keys=True))
          PY
