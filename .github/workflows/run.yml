name: HoopVision Public Request Bridge

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque request token
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - REQUEST_ID
      - .github/workflows/run.yml

permissions:
  contents: write

concurrency:
  group: hoopvision-public-request-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce public privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open("runner_policy.json"))
          assert p["schema"]=="hoopvision.public-runner-policy.v2"
          assert p["execution_entrypoint"]=="timeedmonds-maker/hoopvision-runner@main"
          assert p["opaque_request_only"] is True
          for k in (
              "commercial_ip_allowed",
              "private_source_allowed",
              "private_data_allowed",
              "credentials_allowed",
              "cloud_identifiers_allowed",
              "internal_topology_allowed",
          ):
              assert p[k] is False
          assert p["public_payload_fields"]==["request_id"]
          print("PUBLIC_PRIVACY_BOUNDARY_OK")
          PY

      - name: Resolve opaque token
        id: request
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          REQUEST_ID="${INPUT_REQUEST_ID:-}"
          if [ -z "$REQUEST_ID" ] && [ -f REQUEST_ID ]; then
            REQUEST_ID="$(tr -d '[:space:]' < REQUEST_ID)"
          fi
          [[ "$REQUEST_ID" =~ ^req-[A-Za-z0-9-]{8,64}$ ]] || {
            echo "Invalid opaque request token" >&2
            exit 2
          }
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Publish opaque request
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge_outbox
          python - <<'PY'
          import json,os,datetime
          payload={
            "schema":"opaque-request.v1",
            "request_id":os.environ["REQUEST_ID"],
            "public_run_id":os.environ["GITHUB_RUN_ID"],
            "queued_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          open("bridge_outbox/latest.json","w").write(json.dumps(payload,indent=2)+"\n")
          PY
          git config user.name "hoopvision-public-bridge"
          git config user.email "hoopvision-public-bridge@users.noreply.github.com"
          git add bridge_outbox/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Queue opaque request $REQUEST_ID [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "OPAQUE_REQUEST_QUEUED"
