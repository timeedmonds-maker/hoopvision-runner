name: HoopVision Public Cross-Repo Checkout Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact private v3.2-dev source with caller token
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: 547c5b7fbde711fdbc7228730725f44f5ce95906
          token: ${{ github.token }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact v3.2-dev source
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "547c5b7fbde711fdbc7228730725f44f5ce95906"
          test "$(tr -d '[:space:]' < src/courtcoder/ENGINE_VERSION)" = "3.2-dev"
          echo "PUBLIC_CROSS_REPO_CHECKOUT_OK"
