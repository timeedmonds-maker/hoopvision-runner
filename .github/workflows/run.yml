name: HoopVision CPU Request Bridge

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque HoopVision request identifier
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - REQUEST_ID
      - .github/workflows/run.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: hoopvision-request-bridge
  cancel-in-progress: false

env:
  HV_PROJECT_ID: project-d88c48c6-7f48-4c33-928
  HV_REGION: asia-southeast1
  HV_RELEASE_BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  HV_WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  HV_CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  queue-private-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate canonical public bridge to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.HV_WIF_PROVIDER }}
          service_account: ${{ env.HV_CONTROL_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify canonical public WIF control plane
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$HV_PROJECT_ID" >/dev/null
          account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test -n "$account"
          gcloud run jobs describe hoopvision-request-resolver             --project="$HV_PROJECT_ID"             --region="$HV_REGION"             --format='value(metadata.name)' >/tmp/resolver-name
          test "$(cat /tmp/resolver-name)" = "hoopvision-request-resolver"
          echo "HOOPVISION_PUBLIC_WIF_CONTROL_OK"

      - name: Enforce public opaque-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open("runner_policy.json"))
          assert p["schema"]=="hoopvision.public-runner-policy.v1"
          assert p["compute"]=="github_hosted_cpu"
          assert p["gpu_allowed"] is False
          assert p["gpu_capacity_owned_by_runner"] is False
          assert p["private_source_checkout_allowed"] is False
          assert p["pat_allowed"] is False
          assert p["service_account_key_allowed"] is False
          assert p["dispatch_target"]=="private_cpu_request_resolver"
          assert p["public_payload"]["fields"]==["schema","request_id"]
          print("HOOPVISION_PUBLIC_CPU_BOUNDARY_OK")
          PY

      - name: Resolve opaque request identifier
        id: request
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          REQUEST_ID="${INPUT_REQUEST_ID:-}"
          if [ -z "$REQUEST_ID" ] && [ -f REQUEST_ID ]; then
            REQUEST_ID="$(tr -d '[:space:]' < REQUEST_ID)"
          fi
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || {
            echo "Invalid request identifier" >&2
            exit 2
          }
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Publish opaque request to public outbox
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge_outbox
          python - <<'PY'
          import json,os,datetime
          payload={
            "schema":"hoopvision.public-bridge-outbox.v1",
            "request_id":os.environ["REQUEST_ID"],
            "public_run_id":os.environ["GITHUB_RUN_ID"],
            "queued_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          open("bridge_outbox/latest.json","w").write(json.dumps(payload,indent=2)+"\n")
          PY
          git config user.name "hoopvision-public-bridge"
          git config user.email "hoopvision-public-bridge@users.noreply.github.com"
          git add bridge_outbox/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Queue opaque HoopVision request $REQUEST_ID [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "HOOPVISION_PUBLIC_REQUEST_QUEUED=$REQUEST_ID"
