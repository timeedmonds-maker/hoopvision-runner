name: PR776 exact event episode crosswalk acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-event-episode-crosswalk-test.yml', 'tools/public_content_guard.py']
permissions:
  contents: read
concurrency:
  group: gamepulse-pr776-event-episode-crosswalk-test
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public repo and fetch private branch in temporary CPU storage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_ACCESS_TOKEN_UNAVAILABLE; exit 3; }
          # Repository is pinned; the Git read authenticates access to the private source.
          cat > "$RUNNER_TEMP/private-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/private-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/private-askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/pr776-src"
          git -C "$RUNNER_TEMP/pr776-src" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/pr776-src" >> "$GITHUB_ENV"
          echo PRIVATE_SOURCE_CHECKOUT_OK
      - name: Run Python crosswalk and legacy query regression tests
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          python3 -m py_compile gamepulse/fusion/query_event_tracking_2026.py \
            gamepulse/fusion/tests/test_event_episode_crosswalk_2026.py
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_event_episode_crosswalk_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_query_event_tracking_2026.py
      - name: Verify all 49 original source-pinned NBA scoring event links
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          import json
          from pathlib import Path
          from query_event_tracking_2026 import query
          root=Path(".")
          gid="0022600009"
          directory=root/"gamepulse/fusion/event_tracking"
          events=json.loads((directory/"games"/(gid+".json")).read_bytes())["events"]
          cross=json.loads((directory/("episode_crosswalk_"+gid+".json")).read_bytes())
          assert len(events)==49 and len(cross["links"])==49
          bykey={x["event_key"]:x for x in cross["links"]}
          assert len(bykey)==49
          complete=shared=0
          for event in events:
              match=bykey[event["event_key"]]
              result=query(root,gid,action_number=event["nba_action_number"],
                           period=event["period"],episode_id=match["episode_id"])
              assert result["episode_crosswalk_source_verified"]
              assert result["physical_possessions_certified"]==0
              assert result["clock_alignment_independently_certified"] is False
              assert len(result["events"])==1
              row=result["events"][0]
              assert row["event_key"]==event["event_key"]
              assert row["ball_xyz_native"]==event["ball_xyz_native"]
              assert row["nba_source_field_episode_id"]==match["episode_id"]
              assert row["nba_source_field_chain_status"]==match["field_chain_status"]
              assert row["nba_source_field_offense_team"]==match["offense_team"]
              assert row["nba_source_field_episode_is_certified_physical_possession"] is False
              complete+=int(not row["unresolved_player_ids"])
              shared+=int(row["nba_source_field_chain_status"]=="SHARED_ONSET_MULTIPLE_EVENT_CHAINS")
          assert complete==43 and shared==1
          print("PR776_PRIVATE_CROSSWALK_ACCEPTED",
                "verified_events=49 unique_episodes=49 full_ten=43 shared_onset=1",
                "certified_physical_possessions=0")
          PY

      - name: Run 11 original XYZ episode query regressions and audit all 532 original files
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          python3 -m py_compile gamepulse/fusion/query_original_xyz_episode_season_2026.py \
            gamepulse/fusion/tests/test_query_original_xyz_episode_season_2026.py
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v \
            -s gamepulse/fusion/tests -p test_query_original_xyz_episode_season_2026.py
          PYTHONPATH=gamepulse/fusion python3 gamepulse/fusion/query_original_xyz_episode_season_2026.py \
            --root . --verify-all --out "$RUNNER_TEMP/verified_original_xyz_season.json"
          python3 - "$RUNNER_TEMP/verified_original_xyz_season.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          x=d["source_inventory"]
          assert (x["games"], x["indexed_episodes"], x["candidate_native_frames"],
                  x["ten_plus_direct_ball_frames"]) == (28, 532, 29297, 23469)
          assert (x["verified_original_xyz_episodes"],
                  x["verified_original_xyz_frames"]) == (532, 29297)
          assert d["matched_episodes"] == 532
          assert d["physical_possessions_certified"] == 0
          assert d["original_native_clock_independently_validated"] is False
          assert d["official_nba_action_to_native_frame_clock_validated"] is False
          assert all(e["original_xyz_source_hash_verified_this_query"] for e in d["episodes"])
          assert not any("frames" in e for e in d["episodes"])
          print("PR776_ALL_PRIVATE_ORIGINAL_XYZ_ACCEPTED",
                "games=28 episodes=532 frames=29297 ten_plus_ball=23469",
                "verified_files=532 certified_physical_possessions=0")
          PY

      - name: Audit provisional XYZ episode clock overlap against official NBA event windows
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion:gamepulse/fusion/tests
          python3 -m py_compile gamepulse/fusion/audit_original_xyz_episode_clock_consistency_2026.py \
            gamepulse/fusion/tests/test_audit_original_xyz_episode_clock_consistency_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_audit_original_xyz_episode_clock_consistency_2026.py
          python3 gamepulse/fusion/audit_original_xyz_episode_clock_consistency_2026.py \
            --root . --game-id 0022600009 --summary-only --out "$RUNNER_TEMP/rockets_temporal.json"
          python3 gamepulse/fusion/audit_original_xyz_episode_clock_consistency_2026.py \
            --root . --summary-only --out "$RUNNER_TEMP/season_temporal.json"
          python3 - "$RUNNER_TEMP/rockets_temporal.json" "$RUNNER_TEMP/season_temporal.json" <<'PY'
          import json,sys
          local,season=(json.load(open(p)) for p in sys.argv[1:])
          assert (season["game_count"],season["episode_count"],
                  season["candidate_frames"],season["ten_plus_direct_ball_frames"]) == (28,532,29297,23469)
          assert local["game_count"] == 1 and local["episode_count"] == 13
          assert season["certified_physical_possessions"] == 0
          assert local["certified_physical_possessions"] == 0
          assert season["window_definition"] == "SOURCE_EPISODE_START_TO_NEXT_SOURCE_EPISODE_START"
          assert season["frame_status"] == {"INSIDE":29297}
          assert season["ten_ball_frame_status"] == {"INSIDE":23469}
          assert local["frame_status"] == {"INSIDE":858}
          print("PR776_ROCKETS_SOURCE_TIME_CONSISTENCY",
                "frame_status="+json.dumps(local["frame_status"],sort_keys=True),
                "episode_status="+json.dumps(local["episode_status"],sort_keys=True),
                "ten_ball_status="+json.dumps(local["ten_ball_frame_status"],sort_keys=True))
          print("PR776_SEASON_SOURCE_TIME_CONSISTENCY",
                "frame_status="+json.dumps(season["frame_status"],sort_keys=True),
                "episode_status="+json.dumps(season["episode_status"],sort_keys=True),
                "ten_ball_status="+json.dumps(season["ten_ball_frame_status"],sort_keys=True),
                "certified_physical_possessions=0")
          PY

      - name: Verify live private XYZ query tests source episode bounds
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          from pathlib import Path
          from query_original_xyz_episode_season_2026 import query
          d = query(Path("."), game_id="0022600009",
                    episode_id="0022600009-P1-NBAF0002", include_xyz=True)
          assert d["matched_episodes"] == 1
          row = d["episodes"][0]
          assert row["provisional_clock_episode_conflict"] is False
          assert row["provisional_clock_vs_episode_one_second_guard"].get(
              "PROVISIONALLY_WITHIN_OFFICIAL_EPISODE", 0) == 49
          assert any(f["provisional_clock_vs_official_episode"] ==
              "PROVISIONALLY_WITHIN_OFFICIAL_EPISODE" for f in row["frames"])
          assert row["exact_action_to_frame_association_certified"] is False
          assert row["correct_source_episode_clock_end_ms"] == 658000
          print("PR776_PRIVATE_XYZ_CORRECT_SOURCE_WINDOW_ACCEPTED",
                "episode=0022600009-P1-NBAF0002",
                "one_second_guard_classes=" +
                repr(row["provisional_clock_vs_episode_one_second_guard"]),
                "physical_possessions_certified=0")
          PY

      - name: Verify first Rockets Spurs post-score ten-player candidate against private original data
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/build_rockets_first_postscore_candidate_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_build_rockets_first_postscore_candidate_2026.py
          python3 gamepulse/fusion/build_rockets_first_postscore_candidate_2026.py \
            --root . --out "$RUNNER_TEMP/rockets_first_postscore_candidate.json"
          python3 - "$RUNNER_TEMP/rockets_first_postscore_candidate.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["candidate_native_frames"]==49
          assert d["complete_ten_plus_direct_ball"]==43
          assert d["native_span_ms"]==9684
          assert d["candidate_offense_team"]=="SAS"
          assert d["prior_scoring_action"]==13 and d["next_scoring_action"]==17
          assert d["physical_possession_certified"] is False
          assert len(d["stable_ten_player_ids"])==10
          print("PR776_FIRST_REAL_POST_SCORE_INTERVAL_VERIFIED",
                "frames=49 ten_ball=43 span_ms=9684 next_team=SAS",
                "certified_physical_possessions=0")
          PY

      - name: Audit post-terminal source frames versus next-team candidate 28 game season
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/audit_post_terminal_source_episode_transitions_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_audit_post_terminal_source_episode_transitions_2026.py
          python3 gamepulse/fusion/audit_post_terminal_source_episode_transitions_2026.py \
            --root . --game-id 0022600009 --summary-only --out "$RUNNER_TEMP/post_terminal_rockets.json"
          python3 gamepulse/fusion/audit_post_terminal_source_episode_transitions_2026.py \
            --root . --summary-only --out "$RUNNER_TEMP/post_terminal_season.json"
          python3 - "$RUNNER_TEMP/post_terminal_rockets.json" "$RUNNER_TEMP/post_terminal_season.json" <<'PY'
          import json,sys
          local,season=(json.load(open(p)) for p in sys.argv[1:])
          assert (season["game_count"],season["episode_count"],
                  season["candidate_frames"],season["ten_plus_ball_frames"]) == (28,532,29297,23469)
          assert local["game_count"]==1 and local["episode_count"]==13
          assert season["certified_physical_possessions"]==0
          assert sum(season["frame_classes"].values())==29297
          assert sum(season["ten_ball_frame_classes"].values())==23469
          assert sum(season["post_terminal_ball_proximity_relation"].values())==19209
          print("PR776_ROCKETS_POST_TERMINAL_ACCEPTED",
                "frame_classes="+json.dumps(local["frame_classes"],sort_keys=True),
                "research_labels="+json.dumps(local["research_labels"],sort_keys=True))
          print("PR776_SEASON_POST_TERMINAL_ACCEPTED",
                "frame_classes="+json.dumps(season["frame_classes"],sort_keys=True),
                "ten_ball_classes="+json.dumps(season["ten_ball_frame_classes"],sort_keys=True),
                "research_labels="+json.dumps(season["research_labels"],sort_keys=True),
                "post_terminal_ball_nearest_team="+json.dumps(season["post_terminal_ball_proximity_relation"],sort_keys=True),
                "physical_possessions_certified=0")
          PY

      - name: Verify real post-terminal episode query
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          from pathlib import Path
          from query_original_xyz_episode_season_2026 import query
          r=query(Path("."),game_id="0022600009",episode_id="0022600009-P1-NBAF0002",include_xyz=True)
          assert r["matched_episodes"]==1
          e=r["episodes"][0]["post_terminal_next_team_research"]
          assert e["following_source_offense_team"]=="SAS"
          assert e["post_terminal_interior_frames"]==45
          assert e["physical_possession_owner_independently_confirmed"] is False
          print("PR776_ROCKETS_POSTSCORE_NEXT_TEAM_QUERY_PASS",
                "postframes=45 source=HOU next=SAS certified_possessions=0")
          PY

      - name: Verify sustained original ball/player proximity and source-touch checks
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/qa_sustained_ball_proximity_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_qa_sustained_ball_proximity_2026.py
          python3 gamepulse/fusion/qa_sustained_ball_proximity_2026.py \
            --root . --game-id 0022600009 --summary-only --out "$RUNNER_TEMP/rockets_streaks.json"
          python3 gamepulse/fusion/qa_sustained_ball_proximity_2026.py \
            --root . --summary-only --out "$RUNNER_TEMP/season_streaks.json"
          python3 - "$RUNNER_TEMP/rockets_streaks.json" "$RUNNER_TEMP/season_streaks.json" <<'PY'
          import json,sys
          rockets,season=(json.load(open(p)) for p in sys.argv[1:])
          assert rockets["game_count"]==1 and rockets["episode_count"]==13
          assert season["game_count"]==28 and season["episode_count"]==532
          assert season["original_frame_entries_considered"]==29297
          assert sum(season["frame_quality"].values())==29297
          assert season["independently_certified_possessions"]==0
          print("PR776_ROCKETS_SUSTAINED_BALL_PROXIMITY_ACCEPTED",
                "strong="+str(rockets["frame_quality"].get("STRONG_DIRECT_NEAREST_XY",0)),
                "streaks="+str(rockets["sustained_nearest_player_streaks"]),
                "following="+str(rockets["following_source_team_streaks"]),
                "touch_supported="+str(rockets["episodes_with_nearby_original_source_touch_label"]))
          print("PR776_SEASON_SUSTAINED_BALL_PROXIMITY_ACCEPTED",
                "quality="+json.dumps(season["frame_quality"],sort_keys=True),
                "streaks="+str(season["sustained_nearest_player_streaks"]),
                "following="+str(season["following_source_team_streaks"]),
                "preceding="+str(season["preceding_source_team_streaks"]),
                "touch_supported="+str(season["episodes_with_nearby_original_source_touch_label"]),
                "physical_possessions_certified=0")
          PY

      - name: Verify exact source episode player streak search on actual Rockets data
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p test_qa_sustained_ball_proximity_2026.py
          python3 gamepulse/fusion/qa_sustained_ball_proximity_2026.py \
            --root . --game-id 0022600009 --episode-id 0022600009-P1-NBAF0002 \
            --out "$RUNNER_TEMP/rockets_postscore_streak_search.json"
          python3 - "$RUNNER_TEMP/rockets_postscore_streak_search.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["episode_count"]==1 and d["game_count"]==1
          e=d["games"][0]["episodes"][0]
          assert e["original_episode_id"]=="0022600009-P1-NBAF0002"
          assert e["original_episode_official_nba_action_numbers"]==[12,13]
          assert e["following_source_team"]=="SAS"
          assert e["last_action_clock_ms_remaining"]==670000
          assert e["following_episode_start_clock_ms_remaining"]==658000
          assert len(e["original_episode_json_sha256"])==64
          assert d["original_frame_entries_considered"]==49
          assert e["physical_possession_certified"] is False
          print("PR776_EXACT_EPISODE_STREAK_QUERY_ACCEPTED",
                "original_frames=49",
                "strong_direct_frames="+str(e["strong_direct_nearest_frames"]),
                "streaks="+str(len(e["sustained_nearest_player_streaks"])),
                "following_streaks="+str(e["following_team_streaks"]),
                "independently_certified_possessions=0")
          PY

      - name: Crosscheck all original SDK lastTouch states against direct XY player streaks
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/qa_original_native_touch_vs_streak_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p test_qa_original_native_touch_vs_streak_2026.py
          python3 gamepulse/fusion/qa_original_native_touch_vs_streak_2026.py \
            --root . --game-id 0022600009 --summary-only --out "$RUNNER_TEMP/rockets_touch_streak_check.json"
          python3 gamepulse/fusion/qa_original_native_touch_vs_streak_2026.py \
            --root . --summary-only --out "$RUNNER_TEMP/season_touch_streak_check.json"
          python3 - "$RUNNER_TEMP/rockets_touch_streak_check.json" "$RUNNER_TEMP/season_touch_streak_check.json" <<'PY'
          import json,sys
          rockets,season=(json.load(open(p)) for p in sys.argv[1:])
          assert rockets["game_count"]==1 and rockets["reviewed_episode_count"]==13
          assert season["game_count"]==28 and season["reviewed_episode_count"]==532
          assert season["reviewed_streak_count"]==1267
          assert sum(season["crosscheck_grades"].values())==1267
          assert season["certified_physical_possessions"]==0
          print("PR776_ROCKETS_ORIGINAL_LASTTOUCH_STREAK_ACCEPTED",
                "grade_counts="+json.dumps(rockets["crosscheck_grades"],sort_keys=True),
                "native_label_intervals="+str(rockets["original_native_label_intervals"]))
          print("PR776_SEASON_ORIGINAL_LASTTOUCH_STREAK_ACCEPTED",
                "grade_counts="+json.dumps(season["crosscheck_grades"],sort_keys=True),
                "original_label_intervals="+str(season["original_native_label_intervals"]),
                "certified_physical_possessions=0")
          PY
