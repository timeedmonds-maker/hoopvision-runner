name: IGP P3 ball-specific native speed cap 68 game and source masked 8 game QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-ball-speed-native68-qa.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-ball-speed-native68
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 33f6403d780172c0b2240ac2f3f9d824fd913f93
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Protect licensed source and checkout source SHA locked NBA PBP and XYZ
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test and evaluate original all68 native 10Hz ball speed rejection and 8 heldout games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_ball_speed_cap_qa_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_ball_speed_cap_qa_v1.py --root . --output "$RUNNER_TEMP/speed-private.json" > "$RUNNER_TEMP/speed-private.log" 2>&1; then
            echo IGP_P3_SOURCE_SPEED_GATE_EXPERIMENT_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          ls=(Path(os.environ['RUNNER_TEMP'])/'speed-private.log').read_text(errors='replace').splitlines()
          last=next((z for z in reversed(ls) if z.strip()),'NO_LOG')
          print('IGP_P3_SPEED_FAIL_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:85])
          print('IGP_P3_SPEED_GAMES_FINISHED',sum(z.startswith('IGP_P3_ACTUAL_BALL_SPEED_GAME') for z in ls))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'speed-private.json').read_text())
          a=j['all68_natural']['totals'];h=j['original_NBA_source_masked_heldout']
          assert a['grid_samples']==1106941
          assert a['ball_missing_control']==83286
          assert a['ball_both_close_anchors']==41401
          assert sum(a.get('short_missing_speed_'+s,0) for s in
            ('under_31p667','31p667_to_60','60_to_90','90_to_120','over_120'))==41401
          assert len(h['heldout_games'])==8
          assert j['unmodified_68_research_complete_native']==492617
          assert j['unmodified_68_research_complete_10hz']==917686
          assert j['no_added_accepted_ten_ball_scenes'] and j['not_independently_video_certified']
          print('IGP_P3_ACTUAL_BALL_SPEED_RELEASE_RESEARCH_ONLY',json.dumps({
            'original_speed_ceiling_ft_s':j['original_linear_speed_limit_ft_s'],
            'incomplete_ball_10hz':a['ball_missing_control'],
            'both_close_sources':a['ball_both_close_anchors'],
            'speed_bins':{s:a.get('short_missing_speed_'+s,0) for s in
                ('under_31p667','31p667_to_60','60_to_90','90_to_120','over_120')},
            'hypothetical_ball90':a.get('hypothetical_ball_linear_90',0),
            'hypothetical_complete_ten_ball90':a.get('hypothetical_complete_ten_plus_ball_90',0),
            'masked_holdout_ball_error':h['all_predicted_error_ft'],
            'newly_available_holdout_ball_error':h['new_vs_player_speed_cap_error_ft'],
            'promoted_scenes':0},sort_keys=True))
          PY
      - name: Save source evidence only to private 68 game QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_ball_speed_cap_qa_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-ball-speed "origin/$BRANCH"
          cp "$RUNNER_TEMP/speed-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original NBA 68 ball speed source candidate and masked heldout error'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_BALL_SPEED_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
