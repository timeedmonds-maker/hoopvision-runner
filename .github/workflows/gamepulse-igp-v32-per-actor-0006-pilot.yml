name: IGP 3.2 71game one missing official player strict 200 350 500ms XY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  season-player-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify 71game frozen official context and masked source player XY
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_single_missing_player_short_edge_challenger_v1.py'
          mkdir -p "$RUNNER_TEMP/igp-qa"
          python3 gamepulse/fusion/igp_v32_71_single_missing_player_short_edge_challenger_v1.py \
            --root . --masked-per-game 140 \
            --out "$RUNNER_TEMP/igp-qa/igp_v32_71game_single_missing_player_short_edge_challenger_v1.json"
      - name: Commit only aggregate original-source XY A B QA in canonical private PR 776
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          qa=gamepulse/fusion/qa/igp_v32/igp_v32_71game_single_missing_player_short_edge_challenger_v1.json
          cp "$RUNNER_TEMP/igp-qa/igp_v32_71game_single_missing_player_short_edge_challenger_v1.json" "$qa"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$qa"
          git diff --cached --check
          if git diff --cached --quiet; then echo PLAYER_EDGE_SEASON_ALREADY_PUBLISHED; exit 0; fi
          git commit -qm 'qa(igp): 71game player single missing edge 200 350 500ms and source-masked XY'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_71_SINGLE_PLAYER_SHORT_EDGE_PRIVATE_QA_PUBLISHED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
