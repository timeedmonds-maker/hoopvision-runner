name: IGP3.2 71game true 5Hz ten on court plus ball source-QA census
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  fivehz-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Score original 71game frozen and accepted source-QA on actual UTC 200ms S1 sample keys
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_v32_71_combined_research_scene_v1.py gamepulse/fusion/igp_v32_71_fivehz_ten_ball_strict_audit_v1.py
          python3 gamepulse/fusion/igp_v32_71_fivehz_ten_ball_strict_audit_v1.py \
            --root . \
            --out gamepulse/fusion/qa/igp_v32/igp_v32_71_fivehz_ten_ball_strict_audit_v1.json
      - name: Preserve 71game fiveHz verified QA in private canonical branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          p=gamepulse/fusion/qa/igp_v32/igp_v32_71_fivehz_ten_ball_strict_audit_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$p"
          git diff --cached --check
          if git diff --cached --quiet; then echo FIVE_HZ_QA_ALREADY_COMMITTED; exit 0; fi
          git commit -qm 'qa(igp): source SHA 71game actual 5Hz 10 on-court player+ball source QA coverage'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP32_5HZ_10_PLAYER_PLUS_BALL_71GAME_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
