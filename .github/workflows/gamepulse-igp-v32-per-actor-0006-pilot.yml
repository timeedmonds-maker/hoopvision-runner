name: IGP 3.2 71game source-graded 350ms player edge materialization and query
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  player-P0:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Materialize exact 71game source-graded P0 short-edge player positions and test query
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_single_missing_player_short_edge_challenger_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_v32_71_single_player_edge_v1.py'
          mkdir -p "$RUNNER_TEMP/igp-qa"
          python3 gamepulse/fusion/igp_v32_71_single_player_edge_materialize_v1.py \
            --root . \
            --overlay gamepulse/fusion/materialized/igp_v32_research_overlays/player_71_350ms_one_side_10hz_p0.jsonl.gz \
            --summary gamepulse/fusion/qa/igp_v32/igp_v32_71_single_player_edge_materialize_v1.json
          python3 gamepulse/fusion/query_igp_v32_71_single_player_edge_v1.py \
            --root . --game-id 0022600141 --limit 1000 --metrics-only
          python3 gamepulse/fusion/query_igp_v32_71_single_player_edge_v1.py \
            --root . --game-id 0022600006 --max-source-gap-ms 200 --limit 1000 --metrics-only
      - name: Commit exact source-provenance P0 reviewed player XYZ only privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          data=gamepulse/fusion/materialized/igp_v32_research_overlays/player_71_350ms_one_side_10hz_p0.jsonl.gz
          qa=gamepulse/fusion/qa/igp_v32/igp_v32_71_single_player_edge_materialize_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$data" "$qa"
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_71_PLAYER_EDGE_ALREADY_COMMITTED; exit 0; fi
          git commit -qm 'data(igp): 71game source 350ms player ID edge P0 graded original XY only'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_71_PLAYER_EDGE_P0_SHA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
