name: IGP 3.2 original native 71-game 95pct source-aware BALL and PLAYER P0 A-B
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-71:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Measure 71 game original native 95pct research target on frozen S1
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_71_native_ball_and_one_player_shadow_v1.py
          mkdir -p "$RUNNER_TEMP/igp-qa"
          python3 gamepulse/fusion/igp_v32_71_native_ball_and_one_player_shadow_v1.py \
            --root . --out "$RUNNER_TEMP/igp-qa/igp_v32_71_native_ball_and_one_player_shadow_v1.json"
      - name: Commit SHA-original native A-B 71game findings privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_71_native_ball_and_one_player_shadow_v1.json
          cp "$RUNNER_TEMP/igp-qa/igp_v32_71_native_ball_and_one_player_shadow_v1.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          if git diff --cached --quiet; then echo NATIVE71_ALREADY_PRESENT; exit 0; fi
          git commit -qm 'qa(igp): 71game original native S1 ball80 player350 research gain vs 95 target'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_71_NATIVE_S1_BALL_PLAYER_PRIVATE_QA_PUBLISHED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
