name: IGP 3.2 accepted source-graded 350ms readback and combined real scenes QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-qa-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test exact source spike exclusion and accepted 71game tracked player+ball scene queries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_0123_source_spike_promotion_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_promoted_source_query_v1.py'
          python3 -m py_compile gamepulse/fusion/query_igp_v32_71_combined_research_scene_v1.py
          python3 gamepulse/fusion/query_igp_v32_71_promoted_player_source_qc_v1.py \
             --root . --game-id 0022600123 --limit 2000 --metrics-only
          python3 gamepulse/fusion/query_igp_v32_71_combined_research_scene_v1.py \
             --root . --game-id 0022600123 --limit 2
          python3 gamepulse/fusion/query_igp_v32_71_combined_research_scene_v1.py \
             --root . --game-id 0022600092 --limit 2
          python3 gamepulse/fusion/query_igp_v32_71_combined_research_scene_v1.py \
             --root . --game-id 0022600113 --limit 2
          echo IGP_350MS_ACCEPTED_SOURCE_QA_FULL_REAL_READBACK_SUCCEEDED
