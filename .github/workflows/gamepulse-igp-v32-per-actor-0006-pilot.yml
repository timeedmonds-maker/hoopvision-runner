name: IGP 3.2 materialize 71-game original-source-graded P0 BALL 10Hz overlay
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  ball-source-P0:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SHA verify frozen 71 game and materialize original source-graded ball P0
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_v32_71_ball_source_proxy_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_ball_speed_domain_challenger_v1.py'
          python3 -m py_compile gamepulse/fusion/igp_v32_71_ball_source_proxy_materialize_v1.py
          python3 gamepulse/fusion/igp_v32_71_ball_source_proxy_materialize_v1.py \
            --root . \
            --overlay gamepulse/fusion/materialized/igp_v32_research_overlays/ball_all71_80fts_p0_original_anchored_v1.jsonl.gz \
            --summary gamepulse/fusion/qa/igp_v32/igp_v32_71_ball_source_proxy_materialize_v1.json
          python3 gamepulse/fusion/query_igp_v32_71_ball_source_proxy_v1.py \
            --root . --game-id 0022600113 --limit 1000 --metrics-only
          python3 gamepulse/fusion/query_igp_v32_71_ball_source_proxy_v1.py \
            --root . --game-id 0022600006 --limit 1000 --metrics-only
      - name: Commit SHA original source graded P0 ball tracking only to private branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          overlay=gamepulse/fusion/materialized/igp_v32_research_overlays/ball_all71_80fts_p0_original_anchored_v1.jsonl.gz
          qa=gamepulse/fusion/qa/igp_v32/igp_v32_71_ball_source_proxy_materialize_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$overlay" "$qa"
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_71_BALL_SHADOW_ALREADY_PRESENT; exit 0; fi
          git commit -qm 'data(igp): materialize 71game 38162 source-anchored 80fts ball proxy P0 research positions'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_71_BALL_SOURCE_P0_RESEARCH_TRACKING_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
