name: IGP v3.2 original SDK actor provenance game 0122 validation
# reviewed public-only QA, actor flags remain in private repository
# Retest verified 0006 source-matching extractor on highest-loss game 0122.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GAME: '0022600122'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and source-free per-actor variants
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_allgame_per_actor_source_provenance_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_allgame_per_actor_source_provenance_v1.py'
      - name: Download SHA-original SDK releases and match actor XYZ locally
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/per-actor"
          gh api "repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-$GAME" > "$RUNNER_TEMP/release.json"
          gh release download "gamepulse-sdk-$GAME" -R timeedmonds-maker/104 --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk"
          test "$(find "$RUNNER_TEMP/sdk" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          python3 gamepulse/fusion/igp_v32_allgame_per_actor_source_provenance_v1.py \
            --root . --game-id "$GAME" --archive-dir "$RUNNER_TEMP/sdk" --release-json "$RUNNER_TEMP/release.json" \
            --sidecar "$RUNNER_TEMP/per-actor/actor_flags.jsonl.gz" --out "$RUNNER_TEMP/per-actor/summary.json"
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'per-actor'
          s=json.loads((root/'summary.json').read_bytes())
          assert s['game_id']==os.environ['GAME']
          assert s['counts']['original_archive_parts_sha_verified']==13
          assert s['per_actor_time_and_selected_coordinate_matched_fraction']>0
          assert s['sidecar_sha256']==hashlib.sha256((root/'actor_flags.jsonl.gz').read_bytes()).hexdigest()
          assert s['newly_accepted_physical_positions']==0
          print('IGP_V32_GAME_SOURCE_PROVENANCE_VERIFIED',json.dumps({'source_games':1,'parts':13,'actor_grade_counts':{k:v for k,v in s['counts'].items() if k.startswith('native_selected_actor_flag_')},'ball_grade_counts':{k:v for k,v in s['counts'].items() if k.startswith('selected_ball_flag_')},'accepted_scene_delta':0},sort_keys=True))
          PY
      - name: Diagnose game 0122 official missing actors and extra original source IDs (shadow only)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_0122_actor_identity_missingness_dossier_v1.py \
            --root . --out "$RUNNER_TEMP/per-actor/igp_v32_0122_actor_identity_missingness_dossier_v1.json"
      - name: Read all SHA-original 0122 keyframe variants and rescore frozen S1 native plus 10Hz
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_0122_raw_variant_rescue_shadow_v1.py \
            --root . --archive-dir "$RUNNER_TEMP/sdk" --release-json "$RUNNER_TEMP/release.json" \
            --out "$RUNNER_TEMP/per-actor/igp_v32_0122_raw_variant_rescue_shadow_v1.json"
      - name: Retain SHA original metadata sidecars privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest="gamepulse/fusion/qa/igp_v32/upstream_actors_71"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/per-actor/summary.json" "$dest/igp_v32_upstream_${GAME}_summary.json"
          cp "$RUNNER_TEMP/per-actor/actor_flags.jsonl.gz" "$dest/igp_v32_upstream_${GAME}.jsonl.gz"
          cp "$RUNNER_TEMP/per-actor/igp_v32_0122_actor_identity_missingness_dossier_v1.json" "gamepulse/fusion/qa/igp_v32/igp_v32_0122_actor_identity_missingness_dossier_v1.json"
          cp "$RUNNER_TEMP/per-actor/igp_v32_0122_raw_variant_rescue_shadow_v1.json" "gamepulse/fusion/qa/igp_v32/igp_v32_0122_raw_variant_rescue_shadow_v1.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest/igp_v32_upstream_${GAME}_summary.json" "$dest/igp_v32_upstream_${GAME}.jsonl.gz"
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_0122_actor_identity_missingness_dossier_v1.json
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_0122_raw_variant_rescue_shadow_v1.json
          git diff --cached --check
          git commit -qm "qa(igp): game $GAME original SDK actor/ball provenance SHA"
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo IGP_GAME_ACTOR_PROVENANCE_PRIVATE_PUBLISHED; exit 0; fi
            sleep "$n"
          done
          exit 83
