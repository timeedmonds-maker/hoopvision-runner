name: IGP 3.2 71-game SHA-original player and ball source-vacancy census
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-vacancy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify all original source parts and score 71 games native and 10Hz vacancy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_71game_source_vacancy_priority_inventory_v1.py
          mkdir -p "$RUNNER_TEMP/igp-qa"
          python3 gamepulse/fusion/igp_v32_71game_source_vacancy_priority_inventory_v1.py \
            --root . --out "$RUNNER_TEMP/igp-qa/igp_v32_71game_source_vacancy_priority_inventory_v1.json"
      - name: Commit aggregated source-vacancy season inventory only privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest="gamepulse/fusion/qa/igp_v32/igp_v32_71game_source_vacancy_priority_inventory_v1.json"
          cp "$RUNNER_TEMP/igp-qa/igp_v32_71game_source_vacancy_priority_inventory_v1.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP71_SOURCE_VACANCY_ALREADY_COMMITTED; exit 0; fi
          git commit -qm 'qa(igp): 71-game original SDK source vacancy 10Hz ROI census exact source SHA'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP71_SOURCE_VACANCY_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
