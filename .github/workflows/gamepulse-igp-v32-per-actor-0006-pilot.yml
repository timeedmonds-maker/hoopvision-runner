name: IGP 3.2 game 0093 human-visual-attested reviewed identity materialization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  user-reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner and fetch private canonical SHA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_0093_user_reviewed_identity_overlay_v1.py
          python3 -m py_compile gamepulse/fusion/query_igp_v32_user_reviewed_identity_overlay_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_0093_user_reviewed_identity_v1.py'
          mkdir -p "$RUNNER_TEMP/igp-reviewed"
          python3 gamepulse/fusion/igp_v32_0093_user_reviewed_identity_overlay_v1.py \
            --root . \
            --reviewed gamepulse/fusion/materialized/igp_v32_reviewed_overlays/0022600093/identity_human_attested_0093_v1.jsonl.gz \
            --summary gamepulse/fusion/qa/igp_v32/igp_v32_0093_user_reviewed_identity_overlay_v1.json
          python3 gamepulse/fusion/query_igp_v32_user_reviewed_identity_overlay_v1.py \
            --root . --cadence NATIVE --limit 2000 --metrics-only
          python3 gamepulse/fusion/query_igp_v32_user_reviewed_identity_overlay_v1.py \
            --root . --cadence 10HZ --limit 2000 --metrics-only
      - name: Publish SHA checked reviewed view only inside private canonical branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          overlay=gamepulse/fusion/materialized/igp_v32_reviewed_overlays/0022600093/identity_human_attested_0093_v1.jsonl.gz
          manifest=gamepulse/fusion/qa/igp_v32/igp_v32_0093_user_reviewed_identity_overlay_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$overlay" "$manifest"
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_HUMAN_REVIEWED_VIEW_ALREADY_ACCEPTED; exit 0; fi
          git commit -qm 'data(igp): materialize 0093 P0 human-attested source-graded reviewed identity view'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_0093_HUMAN_ATTESTED_P0_PRIVATE_REVIEWED_VIEW_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
