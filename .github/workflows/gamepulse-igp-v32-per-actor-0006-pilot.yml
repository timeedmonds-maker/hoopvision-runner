name: IGP 3.2 verified 0093 source-graded query API and regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public isolation and private SHA original NBA sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_0093_substitution_tracklet_adjudication_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_0093_substitution_tracklet_adjudication_v1.py'
          mkdir -p "$RUNNER_TEMP/private-qa"
          python3 gamepulse/fusion/igp_v32_0093_substitution_tracklet_adjudication_v1.py \
            --root . --out "$RUNNER_TEMP/private-qa/igp_v32_0093_substitution_tracklet_adjudication_v1.json"
          python3 gamepulse/fusion/igp_v32_0093_source_actor_oncourt_geometry_audit_v1.py \
            --root . --out "$RUNNER_TEMP/private-qa/igp_v32_0093_source_actor_oncourt_geometry_audit_v1.json"
          python3 gamepulse/fusion/igp_v32_0093_research_identity_overlay_v1.py \
            --root . \
            --overlay gamepulse/fusion/materialized/igp_v32_research_overlays/0022600093/identity_provisional_0093_v1.jsonl.gz \
            --summary "$RUNNER_TEMP/private-qa/igp_v32_0093_research_identity_overlay_v1.json"
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_v32_research_identity_overlay_v1.py'
          python3 gamepulse/fusion/query_igp_v32_research_identity_overlay_v1.py \
            --root . --game-id 0022600093 --cadence NATIVE --limit 2000 --metrics-only
          python3 gamepulse/fusion/query_igp_v32_research_identity_overlay_v1.py \
            --root . --game-id 0022600093 --cadence 10HZ --limit 2000 --metrics-only
      - name: Publish SHA-original event/actor audit only to private canonical branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest="gamepulse/fusion/qa/igp_v32/igp_v32_0093_substitution_tracklet_adjudication_v1.json"
          cp "$RUNNER_TEMP/private-qa/igp_v32_0093_substitution_tracklet_adjudication_v1.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          geometry="gamepulse/fusion/qa/igp_v32/igp_v32_0093_source_actor_oncourt_geometry_audit_v1.json"
          cp "$RUNNER_TEMP/private-qa/igp_v32_0093_source_actor_oncourt_geometry_audit_v1.json" "$geometry"
          git add -f "$geometry"
          overlay="gamepulse/fusion/materialized/igp_v32_research_overlays/0022600093/identity_provisional_0093_v1.jsonl.gz"
          manifest="gamepulse/fusion/qa/igp_v32/igp_v32_0093_research_identity_overlay_v1.json"
          cp "$RUNNER_TEMP/private-qa/igp_v32_0093_research_identity_overlay_v1.json" "$manifest"
          git add -f "$overlay" "$manifest"
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_0093_AUDIT_ALREADY_PUBLISHED; exit 0; fi
          git commit -qm 'test(igp): SHA source-graded query API confirmed with private native and 10Hz readback'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_0093_PRIVATE_SUBSTITUTION_EVIDENCE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
