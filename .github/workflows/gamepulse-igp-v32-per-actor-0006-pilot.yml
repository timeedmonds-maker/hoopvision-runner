name: IGP 3.2 high-priority 0093 and 0009 source actor capacity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard, private SHA-verified source and official PBP
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_0122_gap_rootcause_by_player_and_window_v1.py
          python3 -m py_compile gamepulse/fusion/igp_v32_0122_actor_balance_counterfactual_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_0122_actor_balance_counterfactual_v1.py'
          mkdir -p "$RUNNER_TEMP/rootcause"
          python3 gamepulse/fusion/igp_v32_0122_gap_rootcause_by_player_and_window_v1.py \
            --root . --out "$RUNNER_TEMP/rootcause/igp_v32_0122_gap_rootcause_by_player_and_window_v1.json"
          python3 gamepulse/fusion/igp_v32_0122_actor_balance_counterfactual_v1.py \
            --root . --out "$RUNNER_TEMP/rootcause/igp_v32_0122_actor_balance_counterfactual_v1.json"
          python3 gamepulse/fusion/igp_v32_71_id_only_source_capacity_frontier_v1.py \
            --root . --out "$RUNNER_TEMP/rootcause/igp_v32_71_id_only_source_capacity_frontier_v1.json"
          for game in 0022600093 0022600009; do
            python3 gamepulse/fusion/igp_v32_anygame_actor_balance_counterfactual_v1.py \
              --root . --game-id "$game" \
              --out "$RUNNER_TEMP/rootcause/igp_v32_actor_balance_${game}_v1.json"
          done
      - name: Preserve original per-player cause and window QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dst=gamepulse/fusion/qa/igp_v32/igp_v32_0122_gap_rootcause_by_player_and_window_v1.json
          cp "$RUNNER_TEMP/rootcause/igp_v32_0122_gap_rootcause_by_player_and_window_v1.json" "$dst"
          cp "$RUNNER_TEMP/rootcause/igp_v32_0122_actor_balance_counterfactual_v1.json" "gamepulse/fusion/qa/igp_v32/igp_v32_0122_actor_balance_counterfactual_v1.json"
          cp "$RUNNER_TEMP/rootcause/igp_v32_71_id_only_source_capacity_frontier_v1.json" "gamepulse/fusion/qa/igp_v32/igp_v32_71_id_only_source_capacity_frontier_v1.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dst" gamepulse/fusion/qa/igp_v32/igp_v32_0122_actor_balance_counterfactual_v1.json gamepulse/fusion/qa/igp_v32/igp_v32_71_id_only_source_capacity_frontier_v1.json
          for game in 0022600093 0022600009; do
            cp "$RUNNER_TEMP/rootcause/igp_v32_actor_balance_${game}_v1.json" "gamepulse/fusion/qa/igp_v32/igp_v32_actor_balance_${game}_v1.json"
            git add -f "gamepulse/fusion/qa/igp_v32/igp_v32_actor_balance_${game}_v1.json"
          done
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_0122_ROOTCAUSE_ALREADY_PUBLISHED; exit 0; fi
          git commit -qm 'qa(igp): direct source-only actor capacity for games 0093 and 0009'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_0122_ROOTCAUSE_PRIVATE_QA_PUBLISHED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
