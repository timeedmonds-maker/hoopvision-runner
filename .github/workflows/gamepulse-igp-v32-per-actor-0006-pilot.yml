name: IGP 3.2 0123 44.8ft original source actor spike adjudication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-player-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Reproduce original actor 44.8ft masked error and inspect unmodified source geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_0123_44ft_source_spike_adjudication_v1.py
          mkdir -p "$RUNNER_TEMP/private-qa"
          python3 gamepulse/fusion/igp_v32_0123_44ft_source_spike_adjudication_v1.py \
            --root . --out "$RUNNER_TEMP/private-qa/igp_v32_0123_44ft_source_spike_adjudication_v1.json"
      - name: Store SHA anchored original native actor source anomaly privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          qa=gamepulse/fusion/qa/igp_v32/igp_v32_0123_44ft_source_spike_adjudication_v1.json
          cp "$RUNNER_TEMP/private-qa/igp_v32_0123_44ft_source_spike_adjudication_v1.json" "$qa"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$qa"
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_0123_SOURCE_SPIKE_PREVIOUSLY_RECONCILED; exit 0; fi
          git commit -qm 'qa(igp): exact 0123 original SDK 44.8ft source actor spike audit provenance'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_44FT_SOURCE_SPIKE_ORIGINAL_SHA_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
