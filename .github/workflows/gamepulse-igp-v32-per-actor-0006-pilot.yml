name: IGP 3.2 Priority V1 Source Horizon Audit for 10Hz 0006 0111 0086
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  timebase-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify original source and diagnose highest-yield 10Hz cohort
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_priority_threegame_10hz_timebase_audit_v1.py
          mkdir -p "$RUNNER_TEMP/private-qa"
          python3 gamepulse/fusion/igp_v32_priority_threegame_10hz_timebase_audit_v1.py \
            --root . --out "$RUNNER_TEMP/private-qa/igp_v32_priority_threegame_10hz_timebase_audit_v1.json"
      - name: Publish only aggregated source horizon findings to private PR 776
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dst="gamepulse/fusion/qa/igp_v32/igp_v32_priority_threegame_10hz_timebase_audit_v1.json"
          cp "$RUNNER_TEMP/private-qa/igp_v32_priority_threegame_10hz_timebase_audit_v1.json" "$dst"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dst"
          git diff --cached --check
          if git diff --cached --quiet; then echo ALREADY_PUBLISHED; exit 0; fi
          git commit -qm 'qa(igp): three high-debt 10Hz games source timebase versus original horizon'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_V32_10HZ_3GAME_HORIZON_AUDIT_PRIVATE_PUBLISHED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
