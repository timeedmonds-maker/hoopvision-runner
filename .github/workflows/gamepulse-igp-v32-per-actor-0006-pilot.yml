name: IGP 3.2 universal default 10Hz accepted source QA 71game release gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-qa-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test default engine source-free then real 71game original NBA SDK + PBP
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_default_tracking_engine_v1.py gamepulse/fusion/query_igp_71_source_first_live_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_default_10hz_source_qa_engine_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_promoted_source_query_v1.py'
          python3 - <<'PY'
          from query_igp_71_source_first_live_v1 import query
          from igp_v32_default_tracking_engine_v1 import DEFAULT_ENGINE,EXPLICIT_LEGACY_ENGINE
          src="."
          cases=(
              ("0022600092",1792635308600,1792635308800),
              ("0022600123",1793062774900,1793062775100),
              ("0022600113",1792966243500,1792966243700))
          for gid,start,end in cases:
              d=query(src,gid,start,end)
              assert d["hz"]==10 and d["engine_id"]==DEFAULT_ENGINE
              assert d["engine_is_default"] is True and d["UTC_aligned_sampling"] is True
              assert not d["independent_video_ID_accuracy_certified"]
              assert len(d["rows"])==3
              assert all(r["utc_ms"]%100==0 for r in d["rows"])
              assert all(r["original_source_actor_quality_flags"] is not None for r in d["rows"])
              print("IGP32_DEFAULT_10HZ_ACCEPTED_GAME",gid,
                    [r["model_grade"] for r in d["rows"]],
                    [r["complete_ten_plus_ball"] for r in d["rows"]])
              if gid=="0022600123":
                  flags=d["original_source_actor_quality_flags"]
                  assert len(flags)==1 and flags[0]["original_native_utc_ms"]==1793062774928
              if gid=="0022600092":
                  assert d["rows"][0]["complete_ten_plus_ball"] is True
                  assert "PLAYER_350MS" in d["rows"][0]["model_grade"]
          h=query(src,"0022600092",1792635308600,1792635309000,hz=5)
          assert h["engine_id"]==DEFAULT_ENGINE and h["hz"]==5
          assert all(x["utc_ms"]%200==0 for x in h["rows"])
          old=query(src,"0022600092",1792635308600,1792635308800,
              hz=10,engine=EXPLICIT_LEGACY_ENGINE)
          assert old["engine_is_default"] is False
          assert old["source_qa_analytical_release_accepted"] is False
          assert "LEGACY" in old["rows"][0]["model_grade"]
          print("IGP32_SOURCE_FIRST_DEFAULT_VS_EXPLICIT_LEGACY_REAL_READBACK_ACCEPTED")
          PY
