name: IGP 3.2 verify committed 71-game P0 ball overlay SHA and 4 exact game readbacks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-per-actor-0006-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-existing-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: No new source, independently verify remote 38,162 rows with SHA and P1 guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_v32_71_ball_source_proxy_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_ball_speed_domain_challenger_v1.py'
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from query_igp_v32_71_ball_source_proxy_v1 import query,QA
          metadata=json.loads(Path(QA).read_bytes())
          assert metadata["rows"]==38162
          assert metadata["new_complete_10hz_research_P0"]==38162
          assert metadata["original_S1_grid_complete"]==923032
          assert metadata["original_S1_grid_total"]==1159651
          assert metadata["new_P1_or_P2_certified_10hz"]==0
          assert len(metadata["per_game"])==71
          assert metadata["source_anchor_le300ms_rows"]==38065
          assert metadata["ball_motion_gt_generic_player_speed_rows"]==38162
          seen=0
          for game in ("0022600006","0022600092","0022600130","0022600146"):
              q=query(Path("."),game_id=game,limit=2000)
              assert q["total_matched"]==metadata["per_game"][game]["new_grid_complete_shadow"]
              assert q["new_P1_or_P2_certified"]==0
              print("IGP_71_SHA_BALL_REAL_GAME_READBACK",game,q["total_matched"],q["source_checksum_sha256"])
              seen+=q["returned"]
          print("IGP_71_EXISTING_BALL_SOURCE_GRADED_OVERLAY_VERIFIED",json.dumps({
              "files":71,"source_sha":metadata["overlay_sha256"],
              "rows":metadata["rows"],"P0_complete_pct":metadata["total_research_P0_complete_10hz_pct"],
              "QA_source_SHA":metadata["challenger_71game_private_QA_SHA256"],
              "four_real_game_returned":seen,"P1_accepted":0},sort_keys=True))
          PY
