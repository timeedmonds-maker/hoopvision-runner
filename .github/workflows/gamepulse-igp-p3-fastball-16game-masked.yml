name: IGP P3 fast-ball original SDK 16 game independent time-spaced masked QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-fastball-16game-masked.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-fastball-16-masked
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 0d39839029576d241fcb7630d28ae3d75290c093
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public source guard and exact private NBA original source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free regressions and genuine NBA 16game masked fast-ball evaluation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_fastball_targeted_holdout_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_fastball_targeted_holdout_v1.py --root . --output "$RUNNER_TEMP/targeted-private.json" > "$RUNNER_TEMP/targeted-private.log" 2>&1; then
            echo IGP_P3_FAST_BALL_MASKED_REAL_SOURCE_EVALUATION_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'targeted-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('IGP_P3_FAST_BALL_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:75])
          print('IGP_P3_FAST_BALL_GAMES_DONE',sum(x.startswith('P3_FAST_BALL_MASKED_GAME') for x in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'targeted-private.json').read_text())
          assert len(j['evaluated_games'])==len(j['per_game'])==16
          assert j['mask_halfwidth_ms']==[200,350,500]
          assert j['source_speed_policy_ft_s']['maximum_inclusive']==60
          assert j['center_ball_original_sdk_coordinates_hidden_until_scoring']
          assert j['no_model_promotion'] and j['newly_accepted_scenes']==0
          print('IGP_P3_FASTBALL_TARGETED_ORIGINAL_SOURCE_ACCURACY',json.dumps(j['pooled'],sort_keys=True))
          PY
      - name: Store real original NBA withheld truth scores privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_fastball_targeted_holdout_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-fastball-targeted "origin/$BRANCH"
          cp "$RUNNER_TEMP/targeted-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): masked 31p7-60ft fast ball true SDK source 16game nonoverlap p95'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_TARGETED_FASTBALL_PRIVATE_SOURCE_QA_SUCCESS
              exit 0
            fi
            sleep "$i"
          done
          exit 42
