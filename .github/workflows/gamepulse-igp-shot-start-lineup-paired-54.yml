name: IGP original shot-start versus event lineup source QA 54 games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-shot-start-lineup-paired-54.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-source-shot-start-54-qa
  cancel-in-progress: false
jobs:
  original-shot-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public boundary and access private canonical original evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Run source-free temporal lineup tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_shot_start_vs_event_lineup_temporal_54_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_shot_start_vs_event_lineup_temporal_54_v1.py'
      - name: Audit 54 source SHA and cross-check 9077 real official shots
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_shot_start_vs_event_lineup_temporal_54_v1.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_shot_start_vs_published_event_lineup_54_v1.json")
          q=json.loads(p.read_bytes())
          t=q["totals"]
          assert len(q["games"])==54 and q["source_original_event_records"]==78690
          assert t["source_shot_shooter_matches"]==9077
          assert t["paired_recent_lineups"]==sum(t.get(s,0) for s in
              ("PRESENT_BOTH","START_ONLY","EVENT_ONLY","MISSING_BOTH"))
          assert q["certified_physical_possessions"]==0
          assert q["native_xyz_or_accepted_model_modified"] is False
          print("IGP_SHA_SOURCE_54_SHOT_TEMPORAL_IDENTITY_QA_PASS",json.dumps({
            "matched_official_shots":9077,
            "paired_source_lineups":t["paired_recent_lineups"],
            "source_start_only_shooter":t.get("START_ONLY",0),
            "source_event_only_shooter":t.get("EVENT_ONLY",0),
            "source_shooter_missing_both":t.get("MISSING_BOTH",0),
            "scorer_utc_discrepancy_gt60s":t.get("scorer_event_utc_discrepancy_over_60s",0),
            "certified_video_accuracy":0},sort_keys=True))
          PY
      - name: Commit immutable private QA evidence only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_shot_start_vs_published_event_lineup_54_v1.json
          git diff --cached --check
          git commit -q -m 'qa(igp): original 54-game NBA shot-start and event lineup comparison'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_SHOT_START_LINEUP_PAIRED_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
