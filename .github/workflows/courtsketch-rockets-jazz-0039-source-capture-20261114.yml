# CourtSketch 0039: original game browser capture, exact HOU–UTA one CPU job.
# Licensed NBA CourtSketch original source preserved only in private 104, no artificial XYZ.
name: CourtSketch 0039 exact same-origin game availability check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtsketch-rockets-jazz-0039-source-capture-20261114.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: courtsketch-full160-0189-original-capture-repair-20261114
  cancel-in-progress: false
jobs:
  original-source-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game: ['0022600039']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_REF: research/gamepulse-clock-boundary-integrity-20261025
      GID: ${{ matrix.game }}
      SOURCE_TAG: courtsketch-original-${{ matrix.game }}-20261114
      MODEL_TAG: courtsketch-full160-${{ matrix.game }}-10hz-v1
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce free CPU and strict private 104 source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          case "$GID" in 0022600039) ;; *) exit 17;; esac
          gh auth setup-git
          echo "COURTSKETCH_BATCH_PRIVATE_CPU_BOUNDARY_OK game=$GID"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install free CPU browser for exact game endpoint probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps chromium > "$RUNNER_TEMP/courtsketch-browser-install.txt" 2>&1
      - name: Test only observed first-party CourtSketch game paths and selector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          from playwright.sync_api import sync_playwright
          gid=os.environ['GID']
          report={'schema':'igp.courtsketch-0039-sameorigin-firstparty-availability.v1',
                  'game_id':gid,'source_original_L0_preserved':True,
                  'auth_bypass_attempted':False,'unsupported_direct_frame_fetch_attempted':False}
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
            context=browser.new_context(viewport={'width':1400,'height':950})
            page=context.new_page()
            page.goto(f'https://courtsketch.com/tracking#src=game&g={gid}&n=0',
                      wait_until='domcontentloaded',timeout=60000)
            page.wait_for_timeout(4500)
            lookups=['/api/tracking/games',
                     '/api/tracking/game/0022600039',
                     '/api/tracking/game/0022600230']
            result=[]
            for p in lookups:
              data=page.evaluate("""async p => {
                try {
                  const r = await fetch(p,{credentials:'same-origin',
                                         headers:{Accept:'application/json'}});
                  const txt=await r.text();
                  let doc=null;
                  try {doc=JSON.parse(txt)} catch{}
                  return {path:p,status:r.status,bytes:txt.length,
                    has0039:txt.includes('0022600039'),
                    jsonType:Array.isArray(doc)?'array':typeof doc,
                    topKeys:doc && typeof doc==='object'&&!Array.isArray(doc)?Object.keys(doc):[],
                    topCount:Array.isArray(doc)?doc.length:null,
                    windows:doc && Array.isArray(doc.windows)?doc.windows.length:null,
                    metadataGameId:doc?.game_id ?? doc?.gameId ?? null,
                    reason:!r.ok?txt.slice(0,130):null};
                } catch (e) {return {path:p,error:String(e).slice(0,130)};}
              }""",p)
              result.append(data)
            report['first_party_requests']=result
            report['viewer_url_after_selection']=page.url.split('#')[0]
            report['viewer_html_contains_game_id']=gid in page.content()
            browser.close()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'courtsketch_0039_firstparty_availability.json'
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('COURTSKETCH_0039_EXACT_GAME_AVAILABILITY',json.dumps({
            'paths':[{k:v for k,v in x.items() if k in
              ('path','status','bytes','has0039','metadataGameId','windows','topCount','error')}
              for x in report['first_party_requests']]},sort_keys=True))
          PY
          gh release upload "$SOURCE_TAG" "$RUNNER_TEMP/courtsketch_0039_firstparty_availability.json" -R "$PRIVATE_REPO" >/dev/null
          echo COURTSKETCH_0039_FIRSTPARTY_AVAILABILITY_SAVED_PRIVATE
