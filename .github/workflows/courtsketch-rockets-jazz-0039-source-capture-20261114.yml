# CourtSketch 0039: original game browser capture, exact HOU–UTA one CPU job.
# Licensed NBA CourtSketch original source preserved only in private 104, no artificial XYZ.
name: CourtSketch 0039 original L0 source inventory and viewer gap diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtsketch-rockets-jazz-0039-source-capture-20261114.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: courtsketch-full160-0189-original-capture-repair-20261114
  cancel-in-progress: false
jobs:
  original-source-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game: ['0022600039']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_REF: research/gamepulse-clock-boundary-integrity-20261025
      GID: ${{ matrix.game }}
      SOURCE_TAG: courtsketch-original-${{ matrix.game }}-20261114
      MODEL_TAG: courtsketch-full160-${{ matrix.game }}-10hz-v1
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce free CPU and strict private 104 source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          case "$GID" in 0022600039) ;; *) exit 17;; esac
          gh auth setup-git
          echo "COURTSKETCH_BATCH_PRIVATE_CPU_BOUNDARY_OK game=$GID"
      - name: Read preserved SHA-original CourtSketch 0039 browser source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/courtsketch-0039-recovery"
          mkdir -p "$root"
          gh release download "$SOURCE_TAG" -R "$PRIVATE_REPO" \
            --pattern 'manifest.json' --dir "$root"
          gh release download "$SOURCE_TAG" -R "$PRIVATE_REPO" \
            --pattern "courtsketch-$GID-original-browser-payloads.tar.gz" --dir "$root"
          python3 - <<'PY'
          import pathlib,json,hashlib,os,tarfile,io,collections,urllib.parse
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'courtsketch-0039-recovery'
          gid=os.environ['GID']
          d=json.loads((r/'manifest.json').read_bytes())
          p=r/f'courtsketch-{gid}-original-browser-payloads.tar.gz'
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==d['private_archive_sha256']
          index=[];bodies={}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tar:
            for mem in tar:
              if not mem.isfile():continue
              body=tar.extractfile(mem).read()
              if mem.name.endswith('responses-index.json'):index=json.loads(body)
              if '/responses/' in mem.name and mem.name.endswith(('.json','.bin')):
                bodies[pathlib.PurePosixPath(mem.name).name]=body
          assert len(index)==d['distinct_network_bodies']
          records=[]
          for row in index:
            k=pathlib.PurePosixPath(row['file']).name
            b=bodies[k]
            assert hashlib.sha256(b).hexdigest()==row['sha256']
            try:j=json.loads(b)
            except Exception:j=None
            if isinstance(j,dict):
              shape={x:('list:'+str(len(y)) if isinstance(y,list) else 'object:'+str(len(y)) if isinstance(y,dict) else type(y).__name__) for x,y in j.items()}
            elif isinstance(j,list):shape={'array_length':len(j)}
            else:shape={'non_json':True}
            url=urllib.parse.urlsplit(row['source_url'])
            records.append({'source_path':url.path,'source_host':url.hostname,
              'bytes':len(b),'json_type':type(j).__name__,'top_level_shape':shape,
              'contains_game_id':gid.encode() in b,
              'contains_t_players_ball':all(x in b for x in [b'"t"',b'"players"',b'"ball"'])})
          output={'schema':'igp.courtsketch-0039-source-gap-diagnostic.v1','game_id':gid,
            'original_l0_sha256':d['private_archive_sha256'],'source_count':len(records),
            'capture_summary':{k:d.get(k) for k in
               ['game_dropdown_selected','queue_built_attempted','next_play_requests',
                'direct_play_hash_requests','viewer_showed_request_failed',
                'viewer_showed_load_a_clip','errors','period_hints_from_json',
                'observed_timestamp_positions_objects','websocket_frames_received']},
            'responses':records,'certified_position_frames':0,'source_L1_accepted':False}
          (r/'courtsketch_0039_original_source_diagnostic.json').write_text(json.dumps(output,indent=2,sort_keys=True)+'\n')
          print('COURTSKETCH_0039_SOURCE_AVAILABILITY',json.dumps({
            'responses':len(records),'game_id_found_in_responses':sum(x['contains_game_id'] for x in records),
            'frame_payload_shapes':sum(x['contains_t_players_ball'] for x in records),
            'viewer_404':d.get('viewer_showed_request_failed'),
            'viewer_empty':d.get('viewer_showed_load_a_clip'),
            'deep_link_selected':d.get('game_dropdown_selected'),
            'source_paths':[x['source_path'] for x in records]},sort_keys=True))
          PY
          gh release upload "$SOURCE_TAG" "$root/courtsketch_0039_original_source_diagnostic.json" -R "$PRIVATE_REPO" >/dev/null
          echo COURTSKETCH_0039_SHA_ORIGINAL_L0_DIAGNOSTIC_PRIVATE_PRESERVED
