# Licensed NBA source stays in private sandbox, no XYZ in public run logs.
name: IGP 3.2 V2B ball hazard sixgame source masked diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-ballonly-hazard-sixgame.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-ball-hazard-sixgame-source-private
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard and private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_ballonly_hazard_diagnostic_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_ballonly_hazard_diagnostic_v1.py'
      - name: Inspect six SHA-original games and disjoint ball source holdout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_ballonly_hazard_diagnostic_v1.py \
            --root . --games 0022600001,0022600009,0022600095,0022600120,0022600130,0022600143 \
            --output "$RUNNER_TEMP/igp-v32-ball-hazard.json" >"$RUNNER_TEMP/private-original-hazards.log" 2>&1 || {
              echo IGP_V32_BALL_HAZARD_ORIGINAL_SOURCE_QA_FAILED
              exit 71
            }
          grep '^IGP_V32_BALL_HAZARD_SUMMARY' "$RUNNER_TEMP/private-original-hazards.log" || true
      - name: Commit SHA-original hazard receipts only to private canonical branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_ballonly_sixgame_source_hazard_diagnostic_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v32hazards "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-v32-ball-hazard.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo V32_HAZARD_RECEIPT_ALREADY_PRESENT;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): preserve source-masked ball hazard and 40ft outlier attribution'
          for n in 1 2 3 4 5 6;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo IGP_V32_PRIVATE_HAZARD_QA_COMMITTED;exit 0;fi
            sleep "$n"
          done
          exit 72
