name: HoopVision Existing Secret Capability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secret-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report only presence/absence
        shell: bash
        env:
          S1: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          S2: ${{ secrets.GH_TOKEN }}
          S3: ${{ secrets.PRIVATE_REPO_TOKEN }}
          S4: ${{ secrets.GITHUB_PAT }}
          S5: ${{ secrets.PAT }}
          S6: ${{ secrets.GCP_SA_KEY }}
          S7: ${{ secrets.GOOGLE_CREDENTIALS }}
          S8: ${{ secrets.GCP_CREDENTIALS }}
          S9: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          S10: ${{ secrets.GCP_SA_KEY_JSON }}
          S11: ${{ secrets.HV_WIF_PROVIDER }}
          S12: ${{ secrets.HV_CONTROL_SA }}
          S13: ${{ secrets.HV_PROJECT_ID }}
        run: |
          set -euo pipefail
          names=(HOOPVISION_104_READ_TOKEN GH_TOKEN PRIVATE_REPO_TOKEN GITHUB_PAT PAT GCP_SA_KEY GOOGLE_CREDENTIALS GCP_CREDENTIALS GCP_SERVICE_ACCOUNT_KEY GCP_SA_KEY_JSON HV_WIF_PROVIDER HV_CONTROL_SA HV_PROJECT_ID)
          for i in $(seq 1 13); do
            v="S$i"
            if [ -n "${!v:-}" ]; then echo "${names[$((i-1))]}=PRESENT"; else echo "${names[$((i-1))]}=ABSENT"; fi
          done
