name: "IGP five-second masked original NBA player and peer scene warp QA"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-5s-peer-scene-warp-real-source.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-five-second-peer-scene-warp
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate safe public guard and clone canonical private original source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Verify source-free scene features and cross-game selection
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_5s_peer_scene_warp_holdout_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_5s_peer_scene_warp_holdout_v1.py'
      - name: Two-game genuine NBA masked 5s other-nine and ball scene comparison
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_5s_peer_scene_warp_holdout_v1.py \
            --root . --max-cases 150 \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_5s_peer_scene_warp_2game_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_5s_peer_scene_warp_2game_v1.json")
          q=json.loads(p.read_bytes())
          assert set(q["games"])=={"0022600009","0022600092"}
          assert q["masked_target_player_original_XYZ_never_in_scene_features"]
          assert q["training_source_game_excludes_entire_evaluation_game"]
          assert q["original_source_untouched"] and q["model_not_promoted"]
          for gid,row in q["games"].items():
            assert row["source"]["source_native_frames_sha_verified"]>30000
            assert row["windows"]>10
            assert row["errors"]["C0"]["n"]>50
          print("IGP_REAL_5S_SOURCE_SCENE_SOURCE_CROSSGAME_QA_PASS",json.dumps({
             "games":2,"5s_windows":{gid:row["windows"] for gid,row in q["games"].items()},
             "selected_model":q["heldout_selection"],
             "physical_video_ground_truth":False},sort_keys=True))
          PY
      - name: Commit only private experiment QA without source XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_5s_peer_scene_warp_2game_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): real-source 5s player gap peer-scene warp train-test evaluation"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_5S_SCENE_WARP_SOURCE_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$try"
          done
          exit 23
