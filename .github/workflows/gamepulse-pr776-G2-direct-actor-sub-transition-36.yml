name: PR776 G2 original NBA enter exit player source UTC bracket challenger 36 games
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-direct-actor-sub-transition-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-original-NBA-source-enter-exit-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public source and hydrate frozen private original NBA SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Compile private original source-only entering and leaving NBA actor tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g2_nba_substitution_direct_actor_transition_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_source_exact_ten_substitution_transition_clock_2026.py' -v
      - name: Evaluate NBA original SDK incoming/outgoing player ID clock brackets for all36
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_source_direct_enter_exit_substitution_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_nba_substitution_direct_actor_transition_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-NBA-direct-exit-enter-transitions.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          assert q["source_games"]==36
          for threshold in ("4","5","6","7"):
              row=q["thresholds"][threshold]
              assert row["eligible_NBA_substitution_events"]==1537
              assert sum(row.get(k,0) for k in (
                "NOT_ENOUGH_SOURCE_ENTER_EXIT_ANCHORS",
                "AMBIGUOUS_SOURCE_ENTER_EXIT_INTERLEAVED",
                "SOURCE_PLAYER_ID_SWITCH_BEFORE_OFFICIAL_NBA_UTC",
                "SOURCE_PLAYER_ID_SWITCH_AFTER_OFFICIAL_NBA_UTC",
                "NBA_UTC_INSIDE_SOURCE_PLAYER_ID_SWITCH_BRACKET"))==1537
          assert q["NBA_SDK_original_player_ball_XYZ_unchanged"]
          assert q["NBA_current_official_lineups_unchanged"]
          assert not q["new_global_UTC_shift_or_official_roster_promotion_applied"]
          print("G2_ORIGINAL_NBA_SDK_ENTER_EXIT_SOURCE_PLAYER_SUBSTITUTION_36",json.dumps({
             "games":36,"per_shared_actor_threshold":q["thresholds"]},sort_keys=True))
          PY
      - name: Commit private original NBA substitution source actor confidence QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_source_direct_enter_exit_substitution_36_v1.json
          git config user.name "Game Pulse NBA Source Clock QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): all36 original source NBA direct enter-exit actor substitution UTC confidence candidate"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo G2_ORIGINAL_NBA_SOURCE_ENTRY_EXIT_TRANSITION_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
