name: IGP Fusion v3.1 G1 original player ball keyframe interpolation opt-in integrated query
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-fusion-g1-original-upstream-integrated-query.yml']
permissions: {contents: read}
concurrency:
  group: igp-fusion-g1-original-source-upstream-integrated
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 5c151c368b63f3114c09676709ce7a824df8f72d
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public content guard and exact SHA private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free regressions and real IGP Fusion video window original actor flags QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g1_original_upstream_source_overlay_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_integrated_pulse_engine_v3.py'
          if ! python3 - > "$RUNNER_TEMP/g1-query-private.log" 2>&1 <<'PY'
          import json,hashlib
          from pathlib import Path
          from integrated_pulse_engine_v3 import query,query_with_original_upstream_G1
          from igp_fusion_g1_original_upstream_source_overlay_v1 import native_source_grade
          from igp_fusion_p4_g1_upstream_stratified_ball_source_holdout_v1 import load_upstream
          gid="0022600001";start=1792530819900;end=1792530825100
          original=query(".",gid,start,end,"layered_p3_research")
          enhanced=query_with_original_upstream_G1(".",gid,start,end,"layered_p3_research")
          assert len(original["rows"])==len(enhanced["rows"])==53
          assert enhanced["original_upstream_per_actor_game0001_G1_joined"]
          assert not enhanced["original_upstream_per_actor_all68_games_joined"]
          assert original["candidate_ball_shadow_timestamps"]==enhanced["candidate_ball_shadow_timestamps"]==11
          assert original["matched_short_source_bounded_xy_candidates"]==enhanced["matched_short_source_bounded_xy_candidates"]==8
          assert enhanced["G1_source_actor_flag_coordinate_sha_matches"]==266681
          assert enhanced["newly_accepted_tracking_scenes"]==0
          for x,y in zip(original["rows"],enhanced["rows"]):
              assert x=={k:v for k,v in y.items() if k!="original_upstream_source_provenance_G1"}
              assert not y["original_upstream_source_provenance_G1"]["independently_certified_physical_possession"]
          receipt,flags=load_upstream(".")
          valid=[t for t in sorted(flags) if 1792530819821<=t<=1792530825116]
          assert len(valid)==28
          original_native=native_source_grade(".",gid,valid)
          observed=original_native["original_native_UTC_rows"]
          ntrue=sum(a["grade"]=="SDK_UPSTREAM_INTERPOLATED_TRUE"
                    for r in observed for a in r["original_SDK_actor_interpolation"].values())
          total=sum(len(r["original_SDK_actor_interpolation"]) for r in observed)
          original_ball_true=sum(
              r["original_SDK_actor_interpolation"].get("ball",{}).get("grade")=="SDK_UPSTREAM_INTERPOLATED_TRUE"
              for r in observed)
          assert (ntrue,total,original_ball_true)==(11,306,1)
          assert original_native["newly_accepted_tracking_positions"]==0
          save=Path(__import__("os").environ["RUNNER_TEMP"])/"igp-source-upstream-v31-private.json"
          save.write_text(json.dumps({
              "schema":"igp.fusion-v31-one-engine-optin-original-13part-upstream-by-actor.v1",
              "game_id":gid,
              "baseline_IGP_query_sha256":hashlib.sha256(json.dumps(original,sort_keys=True,allow_nan=False).encode()).hexdigest(),
              "integrated_IGP_layered_private_query":enhanced,
              "native_original_P4_28frame_per_actor_upstream_evidence":original_native,
              "original_IGP_model_coordinates_unchanged":True,
              "research_model_coordinates_unchanged":True,
              "newly_accepted_tracking_scenes":0,
              "independently_certified_physical_possessions":0
          },sort_keys=True,indent=2,allow_nan=False)+"\n")
          print("IGP_G1_UNIFIED_PRIVATE_ENGINE_SOURCE_QUERY",json.dumps({
             "game_id":gid,"IGP_source_10hz_rows":53,
             "source_provenance_ball_candidates":enhanced["G1_source_grade_counts"],
             "P4_original_native_actor_slots":total,
             "P4_original_keyframe_upstream_true_slots":ntrue,
             "P4_original_ball_upstream_true":original_ball_true,
             "newly_accepted_tracking":0},sort_keys=True))
          PY
          then
            echo IGP_G1_SOURCE_13PART_INTEGRATED_QUERY_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"g1-query-private.log").read_text(errors="replace").splitlines()
          last=next((s for s in reversed(lines) if s.strip()),"NO_LOG")
          print("IGP_G1_PRIVATE_QUERY_FAILURE_CLASS",re.sub(r"[^A-Za-z_]","_",last)[:90])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-source-upstream-v31-private.json").read_text())
          assert q["newly_accepted_tracking_scenes"]==0
          assert q["original_IGP_model_coordinates_unchanged"]
          assert q["research_model_coordinates_unchanged"]
          assert len(q["native_original_P4_28frame_per_actor_upstream_evidence"]["original_native_UTC_rows"])==28
          print("IGP_G1_FUSION_68SOURCE_IMMUTABILITY_GUARD_PASS",json.dumps({
              "game_id":q["game_id"],"native_source_provenance_rows":28,
              "igp_PBP_10Hz_rows":53,"newly_accepted_tracking":0},sort_keys=True))
          PY
      - name: Commit private original NBA 13part same IGP Fusion optin QA only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g1_original_upstream_integrated_query_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B g1-igp-provenance-integrated "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-source-upstream-v31-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): G1 native per actor original SDK provenance attached to unified IGP v3.1, 53 10Hz and 28 native P4 frames'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G1_ORIGINAL_UPSTREAM_UNIFIED_FUSION_QA_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
