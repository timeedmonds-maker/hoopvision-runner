name: Jabari event616 ball-handler-follow frozen rings MP4 artifact
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-jabari616-ball-handler-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check approved public output workflow
        run: |
          python3 - <<'PY'
          from tools.public_content_guard import scan
          file='.github/workflows/nba-jabari616-ball-handler-media.yml'
          assert not scan([file]),'Confidentiality policy did not approve export'
          print('BALL_HANDLER_SOURCE_BOUNDARY_PASS')
          PY
      - name: Fetch ringed MP4 and verify native dynamic handler evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 3
          ROOT="$RUNNER_TEMP/jabari-dynamic-ring-video"
          mkdir -p "$ROOT"
          gh release download clip-lab-jabari616-frozen-ball-handler-pilot --repo timeedmonds-maker/104 --dir "$ROOT" --clobber
          export ROOT
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,base64,subprocess
          r=Path(os.environ['ROOT'])
          v=r/'jabari616-dynamic-ball-handler-frozen-v13.mp4'
          q=r/'processing-qa.json'
          assert v.exists() and q.exists()
          meta=json.loads(q.read_text())
          sha=hashlib.sha256(v.read_bytes()).hexdigest()
          assert meta.get('output_sha256')==sha
          assert meta.get('original_renderer_id')=='HOOPVISION_1_3_RINGS'
          assert meta.get('source_game_id')=='0022600091'
          assert meta.get('event_num')==616
          assert meta.get('rendered_ring_frames',0)>20
          assert v.stat().st_size>200000
          ids=meta.get('ring_by_native_player_id',{})
          print('BALL_HANDLER_FOLLOW_RENDER_QA',json.dumps({
            'mp4_bytes':v.stat().st_size,
            'rendered_ring_frames':meta.get('rendered_ring_frames'),
            'source_frames':meta.get('source_frames'),
            'handler_switches':meta.get('ring_handler_switches'),
            'handler_ids':ids,
            'render_validation':meta.get('published_as'),
            'foot_anchor_review':meta.get('foot_anchor_review_state'),
            'camera_alignment':meta.get('camera_alignment')
          },sort_keys=True))
          target='repos/timeedmonds-maker/104/contents/gamepulse/status/jabari616_ball_handler_media_export_qa.json'
          safe={'sha256':sha,'native_ids':ids,'source_game_id':'0022600091',
             'event_num':616,'source_video_frames':meta.get('source_frames'),
             'rendered_ring_frames':meta.get('rendered_ring_frames'),
             'handler_switches':meta.get('ring_handler_switches'),
             'published_as':meta.get('published_as'),
             'foot_anchor_review_state':meta.get('foot_anchor_review_state'),
             'camera_alignment':meta.get('camera_alignment'),
             'this_is_dynamic_not_constant_jabari':True,
             'verified_original_frozen_renderer_id':meta.get('original_renderer_id')}
          old=subprocess.run(['gh','api',target],capture_output=True,text=True)
          payload={'message':'qa: ball-handler-follow v1.3 video exported, not constant Jabari',
                   'branch':'main','content':base64.b64encode(json.dumps(safe,indent=2).encode()).decode()}
          if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
          p=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],
                    input=json.dumps(payload),capture_output=True,text=True)
          if p.returncode:raise RuntimeError('PRIVATE_EXPORT_QA_PERSISTENCE_FAILED')
          PY
          cp "$ROOT/jabari616-dynamic-ball-handler-frozen-v13.mp4" "$GITHUB_WORKSPACE/jabari616-ball-handler-follow-frozen-ring-v13.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: jabari616-ball-handler-follow-playable-mp4
          path: jabari616-ball-handler-follow-frozen-ring-v13.mp4
          if-no-files-found: error
          retention-days: 7
