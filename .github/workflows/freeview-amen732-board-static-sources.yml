name: Amen 732 source backboard geometry verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-board-static-sources.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
jobs:
  board-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public boundary and clone private source frames
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo AMEN732_BOARD_SOURCE_PRIVATE_READ_SUCCESS
      - name: Run original 2-frame backboard line tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            numpy==1.26.4 opencv-python-headless==4.10.0.84
          cd "$RUNNER_TEMP/private"
          python3 hoopvision/freeview/amen732_backboard_original_border_check.py --selftest
          python3 hoopvision/freeview/amen732_backboard_original_border_check.py \
            --root hoopvision/freeview/fixtures \
            --out hoopvision/freeview/fixtures/amen732_right_above_rim_backboard_RGB_two_frames_v1.json
          python3 - <<'PY'
          import json
          p='hoopvision/freeview/fixtures/amen732_right_above_rim_backboard_RGB_two_frames_v1.json'
          q=json.load(open(p))
          assert q['event']=='0022600009:732'
          assert not q['automatic_lines_confirm_physical_outer_regulation_glass']
          assert not q['metric_camera_KRt_certified']
          print('AMEN732_SOURCE_GLASS_BORDER_QA',len(q['line_source']['distinct_static_line_offsets']))
          PY
      - name: Commit original static pixel candidate receipt privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'HoopVision source CPU'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_right_above_rim_backboard_RGB_two_frames_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo AMEN732_SOURCE_BORDER_ALREADY_PRESERVED
            exit 0
          fi
          git commit -qm 'qa(freeview): independent stationary source backboard edge checks on two NBA images'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_PRIVATE_SOURCE_BACKBOARD_GEOMETRY_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
