          run(["git","-C",str(root),"config","user.email","runner@users.noreply.github.com"])
          run(["git","-C",str(root),"add","-f",folder])
          run(["git","-C",str(root),"commit","-qm",
               "data(private): held-out NBA81 v3 context-based expected nearest-opponent evaluation"])
          for k in range(6):
              push=subprocess.run(["git","-C",str(root),"push","-q","origin",
                  f"HEAD:refs/heads/{ref}"],capture_output=True,text=True)
              if push.returncode==0:break
              run(["git","-C",str(root),"pull","-q","--rebase","origin",ref])
              time.sleep(k+1)
