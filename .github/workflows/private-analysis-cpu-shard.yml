  private-paint-residence-rank:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public source boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
      - name: Reconcile and apply 85pct outside-paint share using private source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess,sys,time
          def run(a,**kw):
              return subprocess.run(a,check=True,**kw)
          repo="timeedmonds-maker/104"
          ref="analysis/igp81-outside-paint-proximity-20261101"
          parent="gamepulse/fusion/qa/analysis"
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-igp81-paint-share"
          run(["gh","auth","setup-git"],stdout=subprocess.DEVNULL)
          run(["git","clone","-q","--depth=1","--filter=blob:none","--sparse",
               "-b",ref,f"https://github.com/{repo}.git",str(root)])
          run(["git","-C",str(root),"sparse-checkout","set",
               "gamepulse/fusion/analysis",parent],stdout=subprocess.DEVNULL)
          source=root/"gamepulse/fusion/analysis/igp81_halfcourt_outside_paint_residence_share_v1.py"
          tests=root/"gamepulse/fusion/analysis/test_igp81_halfcourt_outside_paint_residence_share_v1.py"
          run([sys.executable,"-m","py_compile",str(source),str(tests)])
          probe=subprocess.run([sys.executable,str(tests)],cwd=root,
              capture_output=True,text=True,
              env={**os.environ,"PYTHONPATH":str(source.parent)})
          if probe.returncode:
              print("PRIVATE_85PCT_SOURCE_FREE_REGRESSION_FAILED")
              sys.exit(1)
          base=root/parent/"igp81_halfcourt_nearest_defender_20261101"/"all_league_players.json"
          outer=root/parent/"igp81_outside_paint_nearest_defender_20261101"/"all_league_players.json"
          dest=root/parent/"igp81_outside_paint_residence_85_20261101"
          dest.mkdir(parents=True,exist_ok=True)
          outputs={
             "out-json":"outside_paint_residence_top20_and_league.json",
             "out-league-csv":"all_league_players_residence_85.csv",
             "out-team-csv":"all_player_team_splits_residence_85.csv",
             "out-top20-csv":"top20_outside_paint_residence_85.csv"}
          args=[sys.executable,str(source),
                "--baseline-json",str(base),"--outside-json",str(outer)]
          for key,name in outputs.items():args.extend(["--"+key,str(dest/name)])
          task=subprocess.run(args,cwd=root,capture_output=True,text=True)
          if task.returncode:
              (dest/"private_validation_failure.json").write_text(json.dumps({
                 "state":"OUTSIDE_PAINT_RESIDENCE_GATE_FAILED",
                 "return_code":task.returncode,
                 "details_private":task.stderr[-4000:]}))
              print("PRIVATE_OUTSIDE_PAINT_RESIDENCE_VALIDATION_FAILED")
          else:
              d=json.loads((dest/outputs["out-json"]).read_bytes())
              assert d["games_processed"]==81
              assert d["minimum_outside_paint_time_share_pct"]==85
              assert d["three_point_filter_applied"] is False
              assert d["eligible_players"]==157
              assert len(d["top20"])==20
              assert d["excluded_inside_paint_frames"]==127281
              print("PRIVATE_OUTSIDE_PAINT_RESIDENCE_FILTER_85_VALIDATED")
          run(["git","-C",str(root),"config","user.name","IGP Protected Runner"])
          run(["git","-C",str(root),"config","user.email",
               "runner@users.noreply.github.com"])
          run(["git","-C",str(root),"add","-f",str(dest.relative_to(root))])
          run(["git","-C",str(root),"commit","-qm",
               "data(private): validated NBA81 >=85pct outside paint residence player league view"])
          for i in range(5):
              push=subprocess.run(["git","-C",str(root),"push","-q","origin",
                  f"HEAD:refs/heads/{ref}"],capture_output=True,text=True)
              if push.returncode==0:break
              run(["git","-C",str(root),"pull","-q","--rebase","origin",ref])
              time.sleep(i+1)
          else:
              print("PRIVATE_PAINT_SHARE_RESULT_PUSH_FAILED")
              sys.exit(1)
          if task.returncode:sys.exit(1)
          print("IGP81_OUTSIDE_PAINT_85_RESIDENCE_TOP20_PUBLISHED_PRIVATE")
          PY

