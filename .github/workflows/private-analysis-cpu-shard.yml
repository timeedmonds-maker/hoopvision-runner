              (summaries/f"shard_{i}.json").write_bytes(raw)
          script=root/source
          run([sys.executable,"-m","py_compile",str(script)])
          args=[sys.executable,str(script),"--dir",str(summaries)]
          outputs={"top20.json":summaries/"top20.json",
