              print("PRIVATE_IGP81_V3_LEAVE_PLAYER_AND_GAME_OUT_RECONCILED")
              print("PRIVATE_V3_RESEARCH_SUMMARY",json.dumps({
                  "qa":d["qa"],"heldout_performance":d["heldout_performance"],
                  "rank_pool_sizes":d["rank_pool_sizes"]}))
