              print(unit.stderr[-2500:])
              sys.exit(1)
          staged=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-v3-shards"
          staged.mkdir()
          for i in range(9):
              b=f"analysis/igp81-context-v3-shard-{runid}-{i}"
              run(["git","-C",str(root),"fetch","-q","--no-tags","--depth=1",
