          summaries=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-summaries"
          summaries.mkdir()
          for i in range(9):
              branch=f"analysis/igp81-threepoint-shard-{run_id}-{i}"
              run(["git","-C",str(root),"fetch","-q","--no-tags","--depth=1",
