name: NBA Jabari616 constant ring original frozen CPU export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-jabari616-constant-ring-render.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jabari616-constant-floor-ring-cpu
  cancel-in-progress: false
jobs:
  render-frozen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      YOLO_CONFIG_DIR: ${{ runner.temp }}/yolo-config
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check this exact reviewed public CPU bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from tools.public_content_guard import scan
          name='.github/workflows/nba-jabari616-constant-ring-render.yml'
          errors=scan([name])
          if errors:raise SystemExit('BRIDGE_PRIVACY_GATE_REJECTED')
          print('CONSTANT_JABARI_CPU_BRIDGE_GUARD_PASS')
          PY
      - name: Render original v1.3 constant Jabari ring with source Game Pulse and CPU segmentation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_SOURCE_AUTH_MISSING; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_616_constant_jabari_render.py?ref=main' --jq .content | base64 -d > "$ROOT/constant_jabari.py"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install -q --disable-pip-version-check 'ultralytics==8.3.228' 'scipy>=1.11,<2' 'numpy<2' 'opencv-python-headless<4.11'
          python3 "$ROOT/constant_jabari.py"
