# Official-stat-mirror original 2026-27 Parquet public source probe; no private XYZ.
name: IGP public NBA stats mirror 2027 game OffRtg DefRtg NetRtg POSS probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-open-nba-advanced-parquet-probe-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect-open-stats-parquet:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public dataset access and 2027 schema
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 - <<'PY'
          import urllib.request,json,os
          from pathlib import Path
          url="https://basketball-data.billmill.org/nba/metadata.json"
          for name,link in (
              ("metadata",url),
              ("2027_team_logs","https://basketball-data.billmill.org/nba/stats/team_game_logs/season=2027/data.parquet")):
            try:
              req=urllib.request.Request(link,headers={"User-Agent":"IGP-source-integrity-audit/1.0"})
              with urllib.request.urlopen(req,timeout=18) as f:
                  body=f.read(15000000)
                  if f.read(1):raise ValueError("DATA_OVER_15MB")
                  print("NBA_OPEN_DATA_SOURCE",name,"http",f.status,"bytes",len(body))
              if name=="metadata":
                  meta=json.loads(body)
                  print("NBA_OPEN_DATA_METADATA_TYPE",type(meta).__name__)
                  print("NBA_OPEN_DATA_METADATA_HEAD",str(meta)[:1400])
              else:
                  assert body[:4]==b"PAR1" and body[-4:]==b"PAR1"
                  (Path(os.environ["RUNNER_TEMP"])/"nba_2027_team_logs.parquet").write_bytes(body)
            except Exception as ex:
              print("NBA_OPEN_DATA_SOURCE_ACCESS_FAILURE",name,type(ex).__name__)
              raise
          PY
      - name: Check exact official columns, season and source game IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install duckdb
          python3 - <<'PY'
          import os,json,duckdb
          from pathlib import Path
          path=str(Path(os.environ["RUNNER_TEMP"])/"nba_2027_team_logs.parquet")
          con=duckdb.connect()
          print("NBA_OPEN_DATA_SCHEMA",json.dumps(con.execute(f"DESCRIBE SELECT * FROM read_parquet('{path}')").fetchall()))
          cols={x[0] for x in con.execute(f"DESCRIBE SELECT * FROM read_parquet('{path}')").fetchall()}
          must={"game_id","team_id","pts","off_rating","def_rating","net_rating","poss"}
          if not must<=cols:raise ValueError("NBA_OPEN_2027_COLUMNS_MISSING")
          rows=con.execute(f"SELECT game_id,pts,off_rating,def_rating,net_rating,poss FROM read_parquet('{path}') WHERE game_id IN ('0022600146','0022600009') ORDER BY game_id,team_id").fetchall()
          print("NBA_OPEN_2027_IGP_TWO_GAME_PROVENANCE",json.dumps(rows,default=str))
          counts=con.execute(f"SELECT COUNT(*),COUNT(DISTINCT game_id),COUNT(*) FILTER (WHERE off_rating IS NULL OR poss IS NULL),MIN(game_date),MAX(game_date) FROM read_parquet('{path}') WHERE game_id LIKE '00226%'").fetchone()
          print("NBA_OPEN_2027_TEAM_GAMES_SOURCE_CENSUS",json.dumps(counts,default=str))
          if not rows:raise ValueError("NBA_OPEN_2027_NO_IGP_INTERSECTING_GAMES")
          PY
