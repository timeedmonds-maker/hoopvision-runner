# Only SHA-private 0122 original NBA XYZ + official roster/PBP; public aggregate counts.
name: IGP 0122 Priority 1 source identity gap diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-0122-source-identity-gap-diagnostic-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-0122-p1-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: f0a2a57f2de8bfb74325cdcc863b92b2a14d5dcf
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Review guard and pin original private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Validate source and diagnose one game
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_0122_source_identity_gap_diagnostic_v1.py'
          python3 gamepulse/fusion/igp_0122_source_identity_gap_diagnostic_v1.py \
            --root . --output "$RUNNER_TEMP/igp-0122-p1.json" \
            > "$RUNNER_TEMP/0122-private-diagnostic.log" 2>&1 || {
              echo IGP0122_ORIGINAL_SOURCE_PRIVATE_DIAGNOSTIC_FAILED
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-0122-p1.json').read_text())
          c,g=q["counts"],q["grid"]
          assert q["game_id"]=="0022600122"
          assert c["native_live"]==9863 and c["native_1200_complete"]==5819
          assert g["samples"]==19788 and g["complete_1200"]==10742
          assert q["original_source_coordinates_unchanged"]
          print("IGP0122_P1_SHA_SOURCE_COUNTS",json.dumps({
            "counts":c,"grid":g,"source_frame_interval_ms":q["source_frame_interval_ms"],
            "missing_reason_1200":q["missing_reason_1200"],
            "candidate_pair_count":len(q["candidate_extra_co_missing_pairs_NOT_ALIASES"])
          },sort_keys=True))
          PY
      - name: Commit candidate and source-gaps diagnostic private only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_0122_source_identity_gap_diagnostic_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B source0122 "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-0122-p1.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): private 0122 source identity and gap diagnostic'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP0122_P1_DIAGNOSTIC_PRIVATE_RECEIPT_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
