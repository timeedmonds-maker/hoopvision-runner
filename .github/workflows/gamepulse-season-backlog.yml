name: Game Pulse complete season backlog
# Certified private tracking only; public runner executes code, not publishes source data.
# 2026-10-27 NZDT: gap-only completed NBA 25 Oct US slate recovery; preserve original private SHA parts.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-season-backlog.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-all-missing-certified-backfill
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      games: ${{ steps.plan.outputs.games }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - name: Discover all final games not in private verified catalog
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh api repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27-integrated-current.json --jq .content | base64 -d > "$RUNNER_TEMP/catalog.json"
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const cat=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/catalog.json','utf8'));
          const sources=[['modern','https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json'],
            ['legacy','https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2026/league/00_full_schedule.json']];
          let games=[];
          for(const [kind,url] of sources){
            try{
              const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://www.nba.com/'},signal:AbortSignal.timeout(20000)});
              if(!r.ok)continue;
              const j=await r.json();
              if(kind==='modern')games=(j.leagueSchedule?.gameDates||[]).flatMap(d=>d.games||[])
                .filter(g=>String(g.gameStatus)==='3').map(g=>({id:String(g.gameId),tipoff:g.gameDateTimeUTC}));
              else games=(j.data?.lscd||[]).flatMap(m=>Array.isArray(m.mscd)?m.mscd.flatMap(d=>d.g||[]):m.mscd?.g||[])
                .filter(g=>/^final/i.test(String(g.stt||''))).map(g=>({id:String(g.gid),tipoff:String(g.gdtutc)+'T'+String(g.utctm)+':00Z'}));
              if(games.length)break;
            }catch{console.log('OFFICIAL_SCHEDULE_FALLBACK',kind);}
          }
          if(!games.length)throw Error('official_schedule_unavailable');
          const now=Date.now();
          const ready=games.filter(g=>/^00226\d{5}$/.test(g.id)&&Number.isFinite(Date.parse(g.tipoff))
            &&Date.parse(g.tipoff)>=Date.parse('2026-10-20T00:00:00Z')
            &&Date.parse(g.tipoff)+315*60000<now);
          const missing=ready.filter(g=>cat.games[g.id]?.index_state!=='VERIFIED_ARCHIVE_INDEX')
            .sort((a,b)=>Date.parse(a.tipoff)-Date.parse(b.tipoff));
          if(missing.length>19||missing.some(g=>now-Date.parse(g.tipoff)>7*86400000))
            throw Error('backlog_outside_bounded_authenticated_fanout');
          const incomplete=[],parts=[];let complete=0,reused=0;
          // Preserve original private capture SHA assets: only missing source parts fan out.
          for(const game of missing){
            const response=await fetch('https://api.github.com/repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-'+game.id,{
              headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json', 'User-Agent':'nba-private-slate-source-readback'},
              signal:AbortSignal.timeout(30000)});
            if(response.status!==404&&!response.ok)throw Error('private_archive_lookup_denied_'+response.status);
            const names=new Set(response.status===404?[]:((await response.json()).assets||[]).map(a=>a.name));
            if(names.has('sdk-COMPLETE.json')){complete++;continue;}
            incomplete.push(game);
            for(let part=0;part<13;part++){
              const base='sdk-part-'+String(part).padStart(2,'0');
              if(names.has(base+'.tar.gz')&&names.has(base+'.json')){reused++;continue;}
              parts.push({...game,part});
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'games='+JSON.stringify({include:incomplete})+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'parts='+JSON.stringify({include:parts})+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'count='+incomplete.length+'\n');
          console.log('FINAL_READY',ready.length,'CATALOG_VERIFIED',Object.keys(cat.games).length,
            'PRIVATE_COMPLETE_SKIPPED',complete,'PRIVATE_PARTS_REUSED',reused,
            'GAMES_INCOMPLETE',incomplete.length,'PARTS_TO_CAPTURE',parts.length);
          console.log('INCOMPLETE_GAME_IDS',incomplete.map(x=>x.id).join(','));
          JS
  capture:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.parts) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: ${{ matrix.id }}
          GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.tipoff }}
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs
  certify:
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.count != '0'
    needs: [discover, capture]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.games) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: ${{ matrix.id }}
          GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.tipoff }}
        run: node season_private_release.mjs
