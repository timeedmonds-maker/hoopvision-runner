# Public repo contains only private commit refs and source-free test entrypoints.
# Private source, video, labels, model outputs and diagnostics stay private.
name: CourtCoder protected P1 CPU source-free controls
on:
  push:
    branches:
      - research/courtcoder-p1-public-safe-controls-20261102
      - research/courtcoder-p1-dual-gate-controls-20261102
      - research/courtcoder-p1-strict-protected-controls-20261102
      - research/courtcoder-v28-tier99-guarded-tests-20261102
      - research/courtcoder-v29-blocked-selfconsistency-20261102
      - research/courtcoder-v30-original-gap-protected-controls-20261102
      - research/courtcoder-v30-pin-merged-private-prod-20261102
      - research/courtcoder-v31-gap-confidence-controls-20261102
      - research/courtcoder-v31-source-custody-controls-20261102
      - research/courtcoder-v31-pin-merged-private-source-20261102
      - research/courtcoder-v32-owner-review-sourcefree-20261102
      - main
    paths:
      - .github/workflows/courtcoder-p1-protected-control-tests.yml
      - tools/public_content_guard.py
permissions:
  contents: read
jobs:
  private-control-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_HEAD_SHA: 3b8c65dbb33deca3661c1bcb9208a1ec645efd34
      PRIVATE_SOURCE_BRANCH: research/courtcoder-recovered-owner40-12-frozen-evaluator-20261102
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public boundary
        run: python3 tools/public_content_guard.py
      - name: Execute pinned private Python CPU tests without public private-source logs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_SOURCE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PRIVATE_HEAD_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PRIVATE_HEAD_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set \
            tools/diagnostics tools/github_first hoopvision/core hoopvision/tests
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PRIVATE_HEAD_SHA"
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile \
            tools/diagnostics/cc_full81_p1_strict_original_artifact_replay.py \
            tools/diagnostics/cc_full81_p1_strict_h1_private_score.py \
            tools/diagnostics/cc_full81_p1_tiered_original_offline.py \
            tools/diagnostics/cc_full81_p1_h1_subset_envelope.py \
            tools/diagnostics/cc_full81_p1_blocked_incumbent_self_consistency.py \
            tools/diagnostics/cc_full81_p1_true_producer_frozen.py \
            tools/diagnostics/cc_full81_p1_native_gap_masked_holdout.py \
            tools/diagnostics/cc_full81_p1_native_gap_original_replay.py \
            tools/diagnostics/cc_full81_p1_native_gap_h1_private_score.py \
            tools/diagnostics/cc_full81_recovered_owner_reviews_score.py \
            tools/diagnostics/cc_full81_owner40_original_frame_freeze.py \
            tools/diagnostics/cc_full81_owner40_protected_gcs_packet.py \
            tools/diagnostics/cc_full81_owner40_protected_end_to_end.py \
            tools/diagnostics/cc_full81_h1_foot_support_sensitivity.py \
            tools/diagnostics/cc_full81_h1_foot_support_protected.py \
            tools/diagnostics/cc_full81_p1_subset_monotonicity.py \
            tools/diagnostics/cc_v32_original_h1_archive_replay.py \
            > "$RUNNER_TEMP/courtcoder-private-compile.log" 2>&1 || { echo "COURTCODER_PRIVATE_COMPILE_FAILED"; exit 3; }
          failed=0
          for module in \
            hoopvision.tests.test_p1_ocr_source_triage \
            hoopvision.tests.test_p1_worker_output_adapter \
            hoopvision.tests.test_p1_identity_replay \
            hoopvision.tests.test_p1_analytics_adapter \
            hoopvision.tests.test_p1_certified_worker_path \
            hoopvision.tests.test_p1_strict_evidence_gate \
            hoopvision.tests.test_p1_tiered_identity_shadow \
            hoopvision.tests.test_p1_h1_subset_envelope \
            hoopvision.tests.test_p1_blocked_model_label_holdout \
            hoopvision.tests.test_p1_native_gap_shadow \
            hoopvision.tests.test_p1_native_gap_masked_holdout \
            hoopvision.tests.test_p1_native_gap_confidence \
            hoopvision.tests.test_recovered_owner_reviews_score \
            hoopvision.tests.test_owner40_original_frame_freeze \
            hoopvision.tests.test_owner40_protected_gcs_packet \
            hoopvision.tests.test_owner40_protected_end_to_end \
            hoopvision.tests.test_h1_foot_support_sensitivity \
            hoopvision.tests.test_h1_foot_support_protected \
            hoopvision.tests.test_cc_full81_p1_subset_monotonicity \
            hoopvision.tests.test_cc_v32_original_h1_archive_replay; do
            if python3 -m unittest "$module" > "$RUNNER_TEMP/courtcoder-private-tests.log" 2>&1; then
              echo "COURTCODER_SUITE_OK ${module##*.}"
            else
              echo "COURTCODER_SUITE_FAILED ${module##*.}"
              if [ "$module" = hoopvision.tests.test_owner40_original_frame_freeze ]; then
                for case in \
                  test_true_packet_structure \
                  test_packet_integrity \
                  test_human_answer_absent_from_source_queue \
                  test_original_bbox_ambiguity_abstains \
                  test_multiframe_different_entity_abstains \
                  test_wrong_video_source_rejected \
                  test_p1_reads_real_shapinned_original_arm_not_h1_score_projection; do
                  if python3 -m unittest "$module.OriginalCasePacketTest.$case" > "$RUNNER_TEMP/courtcoder-private-case.log" 2>&1; then
                    echo "COURTCODER_OWNER40_CASE_OK $case"
                  else
                    echo "COURTCODER_OWNER40_CASE_FAILED $case"
                    if [ "$case" = test_p1_reads_real_shapinned_original_arm_not_h1_score_projection ]; then
                      # This is entirely synthetic source-free fixture data.
                      # Print only a short Python exception class / symbolic code.
                      python3 - <<'PY'
          import os,re
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"courtcoder-private-case.log").read_text(errors="replace")
          matches=re.findall(r"(?m)^([A-Za-z]+Error): ([A-Z0-9_]+)$",raw)
          print("COURTCODER_OWNER40_SYNTHETIC_FIXTURE_ERROR",
                *(matches[-1] if matches else ("UNCLASSIFIED","NO_SYMBOLIC_CODE")))
          PY
                    fi
                  fi
                done
              fi
              if [ "$module" = hoopvision.tests.test_p1_native_gap_confidence ]; then
                for case in \
                  test_four_roots_smooth_are_analysis_only \
                  test_outer_gap_abstains_but_preserves_original_two_root \
                  test_camera_cut_blocks_four_root_promotion \
                  test_authorization_and_identity_spoof_rejected \
                  test_duplicate_gap_rows_and_source_rejected \
                  test_camera_cut_at_inner_pair_is_not_accepted \
                  test_invalid_velocity_gate_rejected; do
                  if python3 -m unittest "$module.FourAnchorConfidenceTests.$case" > "$RUNNER_TEMP/courtcoder-private-case.log" 2>&1; then
                    echo "V31_TEST_OK $case"
                  else
                    echo "V31_TEST_FAILED $case"
                  fi
                done
              fi
              if [ "$module" = hoopvision.tests.test_p1_strict_evidence_gate ]; then
                n=0
                for case in \
                  test_supported_remains_provisional_and_incumbents_immutable \
                  test_nonobservable_abstains \
                  test_nearby_conflicting_incumbent_abstains \
                  test_cross_path_root_abstains \
                  test_no_certifications_allowed \
                  test_no_forged_provisional_renderer_flag \
                  test_duplicate_and_mismatched_frame_rejected \
                  test_bad_window_and_far_root_abstain; do
                  n=$((n+1))
                  if python3 -m unittest "$module.StrictP1Tests.$case" > "$RUNNER_TEMP/courtcoder-private-case.log" 2>&1; then
                    echo "COURTCODER_STRICT_CASE_${n}_PASS"
                  else
                    echo "COURTCODER_STRICT_CASE_${n}_FAIL"
                  fi
                done
              fi
              failed=1
            fi
          done
          if [ "$failed" -eq 0 ]; then
            echo "COURTCODER_PINNED_PRIVATE_CPU_TESTS_PASS"
          else
            echo "COURTCODER_PINNED_PRIVATE_CPU_TESTS_FAIL_DIAGNOSTICS_PRIVATE_ONLY"
            python3 - <<'PY'
          import os
          from pathlib import Path
          log=Path(os.environ["RUNNER_TEMP"])/"courtcoder-private-tests.log"
          private_message=Path(os.environ["RUNNER_TEMP"])/"courtcoder-private-comment.txt"
          private_message.write_text(
            "Pinned private CourtCoder CPU unit tests failed. Commit: "
            +os.environ["PRIVATE_HEAD_SHA"]
            +"\n\n"+log.read_text(errors="replace")[-16000:]
          )
          PY
            gh api --method POST repos/timeedmonds-maker/104/issues/1005/comments \
              -F body=@"$RUNNER_TEMP/courtcoder-private-comment.txt" >/dev/null || true
            rm -f "$RUNNER_TEMP/courtcoder-private-tests.log" "$RUNNER_TEMP/courtcoder-private-comment.txt"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/courtcoder-private-tests.log"
          # Original 15,614-row frozen producer archive stays ephemeral,
          # never published to this public repository or its artifacts/logs.
          if curl -fsSL --retry 1 --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/timeedmonds-maker/104/actions/artifacts/13113878628/zip" \
            -o "$RUNNER_TEMP/courtcoder-private-frozen.zip" 2> "$RUNNER_TEMP/private-artifact-access.log"; then
            if python3 -m tools.diagnostics.cc_full81_p1_strict_original_artifact_replay \
               --archive "$RUNNER_TEMP/courtcoder-private-frozen.zip" \
               --out "$RUNNER_TEMP/courtcoder-private-original-shadow" \
               > "$RUNNER_TEMP/courtcoder-private-replay.log" 2>&1; then
              echo "COURTCODER_15614_FROZEN_SHA_WORKER_SHADOW_PASS"
            else
              echo "COURTCODER_FROZEN_ORIGINAL_PRIVATE_REPLAY_FAILED"
              exit 7
            fi
          else
            echo "COURTCODER_FROZEN_ARTIFACT_ACTIONS_READ_NOT_AUTHORIZED_OR_UNAVAILABLE_REPLAY_NOT_RUN"
          fi
          rm -rf "$RUNNER_TEMP/courtcoder-private-frozen.zip" \
            "$RUNNER_TEMP/courtcoder-private-original-shadow" \
            "$RUNNER_TEMP/courtcoder-private-replay.log" \
            "$RUNNER_TEMP/private-artifact-access.log"
