name: PR776 G4 one-anchor original NBA source query 36
on:
  push:
    branches: [research/pr776-trusted-igp-runner-20261028]
    paths:
      - '.github/workflows/gamepulse-pr776-G4-one-anchor-query-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G4-one-anchor-query-36
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and accepted private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free nullable-membership regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g4_one_anchor_source_query_2026.py' -v
      - name: Original XYZ and G1 SHA source readback in all 36 games
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G4_206_one_anchor_source_query_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g4_one_anchor_query_qa_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-G4-one-anchor-query.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a['counts']['games_with_original_source_readback']==36
          assert len(a['readbacks'])==36
          assert a['queried_chain_membership_not_assigned']
          assert a['original_source_XYZ_not_modified'] and not a['physical_custody_certified']
          print('G4_ONE_ANCHOR_SOURCE_QUERY_36_ACCEPTED',json.dumps(a['counts'],sort_keys=True))
          PY
      - name: Publish private query QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          git config user.name "Game Pulse G4 Private One Anchor Query QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261028/igp_G4_206_one_anchor_source_query_36_v1.json
          git diff --cached --check
          git commit -qm "qa(gamepulse): accept one-anchor original source query across 36 games"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo G4_PRIVATE_ONE_ANCHOR_QUERY_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
