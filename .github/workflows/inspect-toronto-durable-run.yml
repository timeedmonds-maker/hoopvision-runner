name: Recover Toronto Backward SAM Evidence

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-toronto-durable-run.yml']

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-northeast1-b
  INSTANCE: hv-dev-l4-tokyo
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Recover exact retained SAM evidence in one SSH session
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --format='value(status)')"
          echo "INSTANCE_STATUS=$STATUS"
          if test "$STATUS" != "RUNNING"; then
            gcloud compute instances start "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet
          fi
          mkdir -p recovered
          ok=0
          for i in $(seq 1 90); do
            if gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command='
              set -euo pipefail
              W=/tmp/hv-toronto-sam-observe
              test -d "$W/out"
              echo "=== QA ==="
              cat "$W/out/sam31_qa.json"
              echo "=== LINKS ==="
              cat "$W/out/continuity_links.csv"
              echo "=== PLAN ==="
              cat "$W/out/sam31_plan.json"
              echo "=== GROUPS ==="
              cat "$W/out/continuity_groups.csv"
              echo "=== PROGRESS ==="
              cat "$W/out/sam31_progress.jsonl"
              echo "=== EXIT ==="
              cat "$W/sam31_exit_code.txt" 2>/dev/null || true
              echo "=== WALL ==="
              cat "$W/wall_s.txt" 2>/dev/null || true
            ' > recovered/evidence.txt 2>/tmp/recover.err; then
              cat recovered/evidence.txt
              ok=1
              break
            fi
            cat /tmp/recover.err || true
            sleep 5
          done
          test "$ok" = 1 || { cat /tmp/recover.err; exit 3; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toronto-backward-sam-recovery
          path: recovered/
          retention-days: 30
