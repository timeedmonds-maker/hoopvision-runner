name: Recover Toronto Backward SAM Evidence

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-toronto-durable-run.yml']

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-northeast1-b
  INSTANCE: hv-dev-l4-tokyo
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Recover exact retained SAM evidence
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            if gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command='echo SSH_OK' >/tmp/recover.out 2>/tmp/recover.err; then
              cat /tmp/recover.out
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { cat /tmp/recover.err; exit 3; }
          mkdir -p recovered
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command='
            set -euo pipefail
            W=/tmp/hv-toronto-sam-observe
            test -d "$W/out"
            tar -C "$W" -czf /tmp/toronto-backward-sam-recovery.tgz out sam31_exit_code.txt wall_s.txt
          '
          gcloud compute scp "$INSTANCE:/tmp/toronto-backward-sam-recovery.tgz" recovered/ --zone "$ZONE" --project "$PROJECT_ID" --quiet
          tar -xzf recovered/toronto-backward-sam-recovery.tgz -C recovered
          echo '=== QA ==='
          cat recovered/out/sam31_qa.json
          echo '=== LINKS ==='
          cat recovered/out/continuity_links.csv
          echo '=== PLAN ==='
          cat recovered/out/sam31_plan.json
          echo '=== GROUPS ==='
          cat recovered/out/continuity_groups.csv
      - uses: actions/upload-artifact@v4
        with:
          name: toronto-backward-sam-recovery
          path: recovered/
          retention-days: 30
