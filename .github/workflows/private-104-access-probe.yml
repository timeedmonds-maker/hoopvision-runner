name: Public runner private-104 access probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-104-access-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact private v3.2-dev candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: 547c5b7fbde711fdbc7228730725f44f5ce95906
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source/version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "547c5b7fbde711fdbc7228730725f44f5ce95906"
          test "$(tr -d '[:space:]' < src/courtcoder/ENGINE_VERSION)" = "3.2-dev"
          echo "PUBLIC_RUNNER_PRIVATE_104_ACCESS_OK"
