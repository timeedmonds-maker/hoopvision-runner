name: Integrated Pulse PR776 original ten-player extraction corrected
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-private-event-xyz.yml', 'tools/public_content_guard.py']
permissions:
  contents: read
concurrency:
  group: gamepulse-pr776-private-event-xyz
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GID: '0022600009'
      EPISODE: '0022600009-P1-NBAF0002'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and hydrate private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-sdk" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *Password*) printf '%s\n' "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-sdk"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-sdk" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
             "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/104-src"
          git -C "$RUNNER_TEMP/104-src" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/104-src" >> "$GITHUB_ENV"
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Skip retry when verified private extract already exists
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$SOURCE_ROOT/gamepulse/fusion/materialized/private_native_event_xyz_pr776_20261026/$GID/$EPISODE.json"
          if [ -f "$OUT" ]; then
            python3 - "$OUT" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1]))
          counts=doc["counts"]
          assert doc["game_id"]=="0022600009"
          assert doc["episode_id"]=="0022600009-P1-NBAF0002"
          assert counts["candidate_source_frames"]==49
          assert counts["complete_ten_plus_ball_frames"]==43
          assert counts["direct_full_ten_frames"]==39
          assert counts["two_sided_interpolated_player_slots"]==4
          assert doc["physical_possessions_certified"]==0
          PY
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "PRIVATE_VERIFIED_ORIGINAL_EXTRACT_EXISTS_SKIP_RETRY"
          else
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "ORIGINAL_SDK_EXTRACT_MISSING_TRY_AGAIN"
          fi
      - name: Run source-independent private event XYZ tests
        if: steps.gate.outputs.retry == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v \
            -s gamepulse/fusion/tests -p 'test_extract_private_nba_event_xyz_2026.py'
      - name: Download original immutable release assets
        if: steps.gate.outputs.retry == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-source"
          gh api "repos/$PRIVATE/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release.json"
          gh release download "gamepulse-sdk-$GID" --repo "$PRIVATE" \
            --dir "$RUNNER_TEMP/sdk-source" --pattern 'sdk-part-*.tar.gz'
          test "$(find "$RUNNER_TEMP/sdk-source" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          echo ORIGINAL_PRIVATE_13_SDK_PARTS_DOWNLOADED
      - name: Produce and verify one original ten-player ball event subset
        if: steps.gate.outputs.retry == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          OUT="gamepulse/fusion/materialized/private_native_event_xyz_pr776_20261026/$GID/$EPISODE.json"
          test ! -e "$OUT"
          PYTHONPATH=gamepulse/fusion python3 gamepulse/fusion/extract_private_nba_event_xyz_2026.py \
            --game-id "$GID" --episode-id "$EPISODE" \
            --archive-dir "$RUNNER_TEMP/sdk-source" \
            --release-manifest "$RUNNER_TEMP/release.json" \
            --official-lineup "gamepulse/fusion/official_lineup_clock/games/$GID.json" \
            --auto-qa "gamepulse/fusion/qa/auto_physics/00226000/$GID.json" \
            --nba-episode-view "gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/$GID.json" \
            --frozen-original-episode-qa "gamepulse/fusion/qa/official_native_episode_xyz_bridge_0022600009_20261026.json" \
            --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          c=d['counts']
          assert c['candidate_source_frames']==49
          assert c['complete_ten_plus_ball_frames']==43
          assert c['direct_full_ten_frames']==39
          assert c['two_sided_interpolated_player_slots']==4
          assert d['physical_possessions_certified']==0
          assert not d['native_clock_independently_validated']
          assert not d['native_xyz_units_calibrated_to_feet']
          assert len(d['frames'])==49 and all(len(x['actors'])==10 for x in d['frames'])
          print("PRIVATE_ORIGINAL_EVENT_XYZ_COUNTS_ACCEPTED",
                json.dumps({'game_id':d['game_id'],'episode_id':d['episode_id'],
                'frames':c['candidate_source_frames'],'ten_player_ball':c['complete_ten_plus_ball_frames']},
                sort_keys=True))
          PY
      - name: Commit coordinates to private canonical repository only
        if: steps.gate.outputs.retry == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add "gamepulse/fusion/materialized/private_native_event_xyz_pr776_20261026/$GID/$EPISODE.json"
          git diff --cached --check
          git commit -qm "data(gamepulse): private source-verified ten-player ball Rockets NBA event subset"
          git push -q origin "HEAD:$BRANCH"
          echo ORIGINAL_PRIVATE_EVENT_SOURCE_COMMITTED
