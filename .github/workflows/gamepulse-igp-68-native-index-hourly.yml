name: IGP hourly all games original XYZ and NBA possession source index
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-native-index-hourly.yml']
permissions: {contents: read}
concurrency:
  group: igp-hourly-private-original-playerball-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SHA-refresh all recovered game and possession source layers without re-fetching NBA PBP
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_post56_native_index_refresh_v1.py --root .
          python3 gamepulse/fusion/igp_post56_allgames_official_ten_native_chain_v1.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          index=json.loads(Path('gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json').read_bytes())
          extra=json.loads(Path(index['post56_additive_oct28']['index']).read_bytes())
          assert index['official_games']==56
          assert index['total_indexed_games_including_additive']==56+len(extra['games'])
          accepted=[g for g,d in extra['games'].items() if d.get('original_source_13_part_complete')]
          assert extra['official_ten_native_chain_source_linked_games']==len(accepted)
          assert len(accepted)>=5
          assert all(extra['games'][g]['official_ten_native_chain_sha256'] for g in accepted)
          print('IGP_HOURLY_ORIGINAL_XYZ_AND_LOGICAL_POSSESSION_GAMES',len(accepted))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/official_ten_native_chains gamepulse/fusion/qa/igp_progress_20261030/igp_oct28_native_source_12_game_refresh_v1.json gamepulse/fusion/qa/igp_progress_20261030/igp_post56_allgames_native_official_ten_chains_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_HOURLY_SOURCE_ALREADY_CURRENT; exit 0; fi
          git commit -q -m 'data(igp): hourly original NBA XYZ and official logical possession source crosswalk'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo IGP_HOURLY_SOURCE_COMMITTED; exit 0; fi
            sleep "$n"
          done
          exit 27
