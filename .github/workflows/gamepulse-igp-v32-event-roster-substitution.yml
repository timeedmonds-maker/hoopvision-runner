# Private original NBA PBP/official roster contexts; public logs aggregate counts only.\n# Revalidated with current public-content guard after concurrent runner workflow updates.
name: IGP v3.2 all71 NBA event lineup substitution replay
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-event-roster-substitution.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-event-roster-sub
  cancel-in-progress: false
jobs:
  original-71game-event-roster:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-0146-app-clock-stoppage-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private original source and synthetic event roster regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_event_lineup_substitution_71_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_event_lineup_substitution_71_v1.py'
          echo IGP_EVENT_ROSTER_SUB_SOURCEFREE_TESTS_PASSED
      - name: Original NBA all71 play-by-play and official lineup context SHA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_event_lineup_substitution_71_v1.py \
            --root . --out "$RUNNER_TEMP/igp-event-rosters-71.json" \
            > "$RUNNER_TEMP/igp-event-rosters-71.log" 2>&1 || {
              echo IGP_EVENT_ROSTER_SOURCE_QA_REJECTED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"igp-event-rosters-71.log").read_text(errors="replace").splitlines()
          v=next((x for x in reversed(lines) if re.match(
              r"^(?:ValueError|KeyError|TypeError|AssertionError|FileNotFoundError):",x)),None)
          if not v:print("IGP_EVENT_ROSTER_PRIVATE_ERROR UNCLASSIFIED")
          else:
            a,_,b=v.partition(":");code=b.strip().split(":",1)[0].split(" ",1)[0]
            print("IGP_EVENT_ROSTER_PRIVATE_ERROR",a,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-event-rosters-71.json").read_text())
          c=q["counts"]
          assert q["source_games"]==71
          assert c["logical_chains"]==14612
          assert q["original_NBA_PBP_and_SDK_XYZ_immutable"] is True
          assert q["physical_ball_custody_certified"]==0
          assert sum(q["per_game"][gid]["original_official_NBA_actions"] for gid in q["per_game"])==c["official_actions"]
          assert len(q["per_game"]["0022600146"]["event_rows"])==623
          print("IGP_EVENT_ROSTER_ORIGINAL_71_PASS",json.dumps(c,sort_keys=True))
          PY
      - name: Immutable all71 event-side lineup provenance private commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_71_event_lineup_substitution_context_v1.json
          mkdir -p "$(dirname "$dest")"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/igp-event-rosters-71.json" "$dest"
            echo IGP_ALL71_EVENT_ROSTER_SOURCE_QA_UNCHANGED
            exit 0
          fi
          cp "$RUNNER_TEMP/igp-event-rosters-71.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): all71 NBA event-side official roster context and substitution pre-post grades'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_EVENT_ROSTER_SOURCE_ALL71_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
