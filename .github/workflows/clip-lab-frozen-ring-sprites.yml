name: Clip Lab frozen v3.1 ring sprite export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-frozen-ring-sprites.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sprites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Produce exact v3.1 animated ring pixels as transparent raster atlases
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          D="$RUNNER_TEMP/original-frozen"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone -q --depth 1 \
            --filter=blob:none --sparse --branch courtcoder/integration \
            https://github.com/timeedmonds-maker/104.git "$D"
          git -C "$D" -c "http.extraheader=AUTHORIZATION: basic $AUTH" sparse-checkout set tools >/dev/null
          unset AUTH
          python3 -m pip install -q numpy==1.26.4 opencv-python-headless==4.10.0.84 pillow
          PYTHONPATH="$D/tools" python3 - <<'PY'
          import cv2,numpy as np,json,hashlib
          from pathlib import Path
          from PIL import Image
          import locked_broadcast_screen_v5_rings as v5
          assert v5.TOOL_ID=='HOOPVISION_1_3_RINGS'
          f=Path(v5.__file__).read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(f)).encode()+b'\0'+f).hexdigest()
          assert sha=='9fac8a8915b90bbd9bd1235532c297c35da77ca2'
          out=Path('ring-stencils');out.mkdir(exist_ok=True)
          tw,th,cols,n=128,80,16,288
          for pid in (1627832,203500):
            atlas=Image.new('RGBA',(tw*cols,th*((n+cols-1)//cols)),(0,0,0,0))
            for i in range(n):
              black=np.zeros((th,tw,3),np.uint8)
              white=np.full((th,tw,3),255,np.uint8)
              args=dict(t=i/30.0,seed=pid,possession=False)
              v5.draw_ring(black,64,40,(65,17,206),22,10,**args)
              v5.draw_ring(white,64,40,(65,17,206),22,10,**args)
              a=np.clip(1-(white.astype(np.float32)-black.astype(np.float32)).mean(axis=2)/255,0,1)
              rgb=np.clip(black.astype(np.float32)/np.maximum(a[:,:,None],1e-5),0,255).astype('uint8')
              rgba=np.dstack((rgb[:,:,::-1],np.rint(a*255).astype('uint8')))
              atlas.paste(Image.fromarray(rgba,'RGBA'),((i%cols)*tw,(i//cols)*th))
            atlas.save(out/f'{pid}-v31-atlas.png',optimize=True)
          (out/'metadata.json').write_text(json.dumps(dict(schema='frozen-v31-native-ring-rgba',
            source_git_blob=sha,frames=n,fps=30,tile_width=tw,tile_height=th,
            columns=cols,center=[64,40],rx=22,ry=10),indent=2))
          print('FROZEN_V31_UNMODIFIED_RING_ART_READY')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: clip-lab-frozen-v31-ring-raster-atlas
          path: ring-stencils/
          if-no-files-found: ignore
          retention-days: 2
