name: "IGP native five-second identity official team exclusion"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-original-five-second-team-identity-v2.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-native-fivesecond-source-opponent-ID-v2
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify safe public boundary and private original source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Test fail-closed opposing team ID gate and run all eighteen source cases
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -v -s gamepulse/fusion -p test_igp_original_5s_alias_team_exclusion_v2.py
          python3 gamepulse/fusion/igp_original_5s_alias_team_exclusion_v2.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_5s_original_alias_team_exclusion_18_v2.json")
          q=json.loads(p.read_bytes())
          assert len(q["cases"])==18
          assert q["original_36game_candidate_count"]==18
          assert q["confirmed_physical_player_ID_remaps"]==0
          assert q["video_verified_physical_5s_paths"]==0
          assert q["accepted_legacy_or_gamepulse_2026_models_modified"] is False
          assert q["counts"]["REJECT_ALTERNATE_SOURCE_ID_ON_OFFICIAL_OPPONENT_TEAM"]>=1
          print("IGP_FIVESECOND_SOURCE_OFFICIAL_TEAM_V2_QA_PASS",json.dumps({
             "cases":18,"source_only_ID_candidates":q["counts"],
             "automatic_player_ID_remaps":0,"physical_5s_video_certified":0},sort_keys=True))
          PY
      - name: Commit private-only team gate source receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_5s_original_alias_team_exclusion_18_v2.json
          git diff --cached --check
          git commit -q -m "qa(igp): original five-second source aliases official opponent-team exclusion"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_ORIGINAL_NATIVE_5S_TEAM_EXCLUSION_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$try"
          done
          exit 23
