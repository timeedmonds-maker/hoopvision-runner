name: IGP public NBA player touches season mirror pinned source QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-public-nba-touch-season-mirror-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  ingest-public-nba-tracking:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      IGP_PRIVATE_BRANCH: research/igp-v31-halfcourt-touch-sequence-query-20261031
      PINNED_PRIVATE_SHA: 2be321361992d67f2bdf9f0ad396846ebb5cbbd8
      PUBLIC_SOURCE_SHA: b4ad0203f590bcb13fd632d0ae3e81ab6a964438
      PUBLIC_COMMIT_UTC: 2026-10-26T08:22:27Z
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce public bridge confidentiality and private research SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$IGP_PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Download immutable public NBA season tracking CSV and verify exact schema
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_public_nba_touch_season_snapshot_v1.py'
          curl --fail --silent --show-error --location --retry 2 --max-time 35 \
            "https://raw.githubusercontent.com/meharpalbasi/NBA_Lineup202324_Analyzer/$PUBLIC_SOURCE_SHA/data/tracking_2026-27.csv" \
            -o "$RUNNER_TEMP/public-nba-tracking.csv"
          python3 gamepulse/fusion/public_nba_touch_season_snapshot_v1.py \
            --csv "$RUNNER_TEMP/public-nba-tracking.csv" \
            --source-commit "$PUBLIC_SOURCE_SHA" \
            --source-timestamp "$PUBLIC_COMMIT_UTC" --team HOU \
            --output "$RUNNER_TEMP/public-hou-season-qa.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'public-hou-season-qa.json').read_text())
          assert j['granularity']=='PLAYER_SEASON_TO_DATE'
          assert j['eligible_for_game_level_benchmark'] is False
          assert j['eligible_for_paint_touch_event_validation'] is False
          assert j['player_count']>=10
          p={x['player_name']:x for x in j['players']}
          assert p['Clint Capela']['touches']==19
          assert p['Amen Thompson']['touches']==196
          assert p['Fred VanVleet']['touches']==141
          print("IGP_PUBLIC_GITHUB_OFFICIAL_NBA_SEASON_MIRROR_VERIFIED",json.dumps({
            "players":j['player_count'],"season":j['season'],
            "game_level_benchmark":False,"public_snapshot_through_commit":j['source']['last_tracking_file_commit_utc'],
            "source_sha256":j['source']['raw_csv_sha256']},sort_keys=True))
          PY
      - name: Publish small provenance-locked season-only NBA reference privately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          payload=(Path(os.environ['RUNNER_TEMP'])/'public-hou-season-qa.json').read_bytes()
          branch=os.environ['IGP_PRIVATE_BRANCH']
          dest="repos/timeedmonds-maker/104/contents/gamepulse/fusion/benchmarks/public_nba_tracking_2026_27_HOU_season_snapshot_20261026.json"
          existing=subprocess.run(['gh','api',dest+'?ref='+branch],capture_output=True,text=True)
          body={'branch':branch,
                'message':'qa(igp): store pinned public NBA 2026-27 season touch mirror, not one-game truth',
                'content':base64.b64encode(payload).decode()}
          if existing.returncode==0:body['sha']=json.loads(existing.stdout)['sha']
          put=subprocess.run(['gh','api','-X','PUT',dest,'--input','-'],
            input=json.dumps(body),capture_output=True,text=True)
          if put.returncode:raise RuntimeError('PRIVATE_PUBLIC_NBA_MIRROR_PUBLICATION_FAILED')
          print('IGP_PUBLIC_NBA_SEASON_REFERENCE_SAVED_PRIVATELY')
          PY