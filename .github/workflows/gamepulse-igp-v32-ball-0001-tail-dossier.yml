# Private original NBA SDK target source and semantic clock only; public aggregates.
name: IGP 3.2 ball 0001 40ft outlier source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-ball-0001-tail-dossier.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-ball-0001-tail-audit
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source privacy guard and private original NBA source clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_ball_0001_source_tail_dossier_v1.py
      - name: Reproduce 40 foot masked-source failure and diagnose source support
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_ball_0001_source_tail_dossier_v1.py \
            --root . --output "$RUNNER_TEMP/v32-0001-private-tail.json" >"$RUNNER_TEMP/v32-0001-private.log" 2>&1 || {
              echo IGP_V32_BALL_0001_ORIGINAL_SOURCE_OUTLIER_REPRO_FAILED
              exit 71
            }
          grep '^IGP_V32_BALL_0001_SOURCE_OUTLIER_QA' "$RUNNER_TEMP/v32-0001-private.log" || true
      - name: Commit private outlier evidence only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_ball_0001_unseen_40ft_source_outlier_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B tail "origin/$BRANCH"
          cp "$RUNNER_TEMP/v32-0001-private-tail.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo IGP_V32_BALL_TAIL_QA_ALREADY_COMMITTED;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): source-masked ball 40ft tail cause and NBA clock context'
          for n in 1 2 3 4 5 6;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo IGP_V32_BALL_TAIL_PRIVATE_QA_COMMITTED;exit 0;fi
            sleep "$n"
          done
          exit 72
