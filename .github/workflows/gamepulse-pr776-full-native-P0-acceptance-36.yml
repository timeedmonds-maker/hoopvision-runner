name: PR776 P0 full-native original source XYZ acceptance, 36 games
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-full-native-P0-acceptance-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-full-native-P0-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public confidentiality and hydrate private verified source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
          echo PR776_FULL_NATIVE_PRIVATE_SOURCE_READY
      - name: Compile and run synthetic all-native reader and acceptance regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/query_igp_original_full_native_source_2026.py \
            gamepulse/fusion/igp_full_native_source_P0_acceptance_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_query_igp_original_full_native_source_2026.py' -v
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_full_native_source_P0_acceptance_2026.py' -v
          echo PR776_FULL_NATIVE_SOURCE_FREE_TESTS_PASSED
      - name: SHA-verified 36-game original timestamp actor and ball readback
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_full_native_P0_original_readback_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_full_native_source_P0_acceptance_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-full-native-audit.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          x=q["aggregate_counts"]
          assert q["source_games"]==36
          assert x["native_frames"]==1203986
          assert x["direct_actor_slots_unfiltered"]==8673975
          assert x["original_ball_direct"]==912704
          assert x["strict_frames"]==412619
          assert x["outside_strict_frames"]==791367
          assert x["outside_strict_xyz_readbacks"]>=36
          assert q["outside_strict_coordinate_access_verified_all_games"]
          assert q["SHA_verified_original_XYZ_chunk_reader"]
          assert q["private_licensed_coordinates_in_report"] is False
          print("PR776_FULL_NATIVE_P0_ALL36_PASSED",json.dumps({
             "games":q["source_games"],"native_frames":x["native_frames"],
             "source_actor_entries":x["direct_actor_slots_unfiltered"],
             "direct_ball_frames":x["original_ball_direct"],
             "strict_QA":x["strict_frames"],"outside_strict_accessible":x["outside_strict_frames"],
             "private_source_readback_tests":x["original_xyz_native_readbacks"]
          },sort_keys=True))
          PY
      - name: Publish versioned private-only full-native acceptance QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_full_native_P0_original_readback_36_v1.json
          git config user.name "Game Pulse Private Tracking QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): accept all 36 source-native XYZ readbacks without strict PBP gating"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PR776_FULL_NATIVE_P0_PRIVATE_SHA_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          echo PR776_FULL_NATIVE_P0_ACCEPTANCE_PRIVATE_PUBLISH_FAILED >&2
          exit 13
