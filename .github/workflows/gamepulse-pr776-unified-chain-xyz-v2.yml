name: PR776 unified NBA chain XYZ direct fallback acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-unified-chain-xyz-v2.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public and privately stage original NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Verify both source-original ten-player ball query routes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_provisional_nba_chain_xyz_v2_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261026/unified_native_nba_chain_query_v2
          test ! -e "$OUT"
          mkdir -p "$OUT"
          python3 gamepulse/fusion/query_igp_provisional_nba_chain_xyz_v2_2026.py --game-id 0022600001 --chain-id 0022600001-P1-C0011 --out "$OUT/fallback_0001.json"
          python3 gamepulse/fusion/query_igp_provisional_nba_chain_xyz_v2_2026.py --game-id 0022600009 --chain-id 0022600009-P1-C0003 --out "$OUT/event_0009.json"
          python3 - "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          from query_igp_provisional_nba_chain_xyz_v2_2026 import lookup
          p=Path(sys.argv[1])
          a=json.loads((p/'fallback_0001.json').read_text())
          b=json.loads((p/'event_0009.json').read_text())
          assert a['query_mode']=='SHA_VERIFIED_FULL_ORIGINAL_SDK_DIRECT_ONLY'
          assert b['query_mode']=='SHA_VERIFIED_MATERIALIZED_ORIGINAL_EVENT_XYZ'
          assert a['source_counts']['frames']==62
          assert a['source_counts']['direct_ball_frames']==58
          assert a['source_counts']['all_direct_ten_plus_ball']==46
          assert b['source_counts']['frames']==49
          assert a['physical_possessions_certified']==b['physical_possessions_certified']==0
          raw=lookup(Path('.'),'0022600001','0022600001-P1-C0011',include_xyz=True)
          assert len(raw['original_native_frames'])==62
          assert all(len(f['actors'])==10 for f in raw['original_native_frames'])
          assert all(f['nba_clock_remaining_ms_provisional'] is None for f in raw['original_native_frames'])
          print('IGP_UNIFIED_CHAIN_REAL_SOURCE_V2_PASS',json.dumps({
              'full_original_SDK_fallback':a['source_counts'],
              'prior_event_XYZ':b['source_counts'],
              'certified_physical_possessions':0},sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -q -m "data(igp): accept unified original NBA chain XYZ query source fallback"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then echo IGP_UNIFIED_ORIGINAL_CHAIN_XYZ_V2_PRIVATE_COMMITTED; exit 0; fi
            sleep "$i"
          done
          exit 11
