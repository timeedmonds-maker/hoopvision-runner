name: Verify Rockets PPP vs Wembanyama on
# Independent native possession query, validated against both team final scores.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rockets-wemby-opponent-ppp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public runner data boundary
        run: python3 tools/public_content_guard.py
      - name: Retrieve and crosscheck native game-scoped possession totals
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,time,hashlib
          url='https://api.pbpstats.com/get-wowy-stats/nba'
          base={'Season':'2026-27','SeasonType':'Regular Season','TeamId':'1610612759',
                'FromDate':'2026-10-23','ToDate':'2026-10-23'}
          def fetch(state,perspective):
              q=dict(base);q['Type']=perspective
              q['0Exactly1'+state+'Floor']='1641705'
              last=''
              for attempt in range(4):
                  try:
                      u=url+'?'+urllib.parse.urlencode(q)
                      req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36','Accept':'application/json',
                         'Origin':'https://www.pbpstats.com','Referer':'https://www.pbpstats.com/'})
                      with urllib.request.urlopen(req,timeout=32) as r:
                          raw=r.read(300000)
                          if r.status!=200:raise ValueError('provider_not_success')
                      j=json.loads(raw)
                      row=j.get('single_row_table_data',{})
                      if not isinstance(row,dict) or not {'OffPoss','Points','SecondsPlayed'} <= row.keys():
                          raise ValueError('missing_native_opponent_sufficient_statistics')
                      vals={k:row[k] for k in ('OffPoss','DefPoss','Points','SecondsPlayed','GamesPlayed') if k in row}
                      print('SOURCE',state,perspective,'sha256',hashlib.sha256(raw).hexdigest(),'values',json.dumps(vals,sort_keys=True))
                      return vals
                  except Exception as exc:
                      last=type(exc).__name__+':'+str(exc)[:100]
                      time.sleep(2+attempt*2)
              raise RuntimeError('PBP_PROVIDER_UNAVAILABLE_'+last)
          data={(state,typ):fetch(state,typ) for state in ('On','Off') for typ in ('Team','Opponent')}
          def n(state,typ,key):return float(data[state,typ][key])
          for typ,total in [('Opponent',114),('Team',110)]:
              pts=n('On',typ,'Points')+n('Off',typ,'Points')
              assert abs(pts-total)<0.001,('SINGLE_GAME_POINTS_NOT_RECONCILED',typ,pts)
              seconds=n('On',typ,'SecondsPlayed')+n('Off',typ,'SecondsPlayed')
              assert abs(seconds-2880)<3,('ON_OFF_MINUTES_NOT_GAME_SCOPED',seconds)
          on=n('On','Opponent','Points');poss=n('On','Opponent','OffPoss')
          off=n('Off','Opponent','Points');offposs=n('Off','Opponent','OffPoss')
          assert on>=0 and poss>0 and off>=0 and offposs>0
          assert abs(n('On','Opponent','SecondsPlayed')-1927)<10,'WEMBY_PLAYED_MINUTES_CONFLICT'
          print('CERTIFIED_ROCKETS_WEMBY_ON_PPP',round(on/poss,6),'POINTS',on,'POSSESSIONS',poss)
          print('CERTIFIED_ROCKETS_WEMBY_OFF_PPP',round(off/offposs,6),'POINTS',off,'POSSESSIONS',offposs)
          PY
