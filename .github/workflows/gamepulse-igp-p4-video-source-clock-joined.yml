name: IGP Fusion P4 independent original NBA Broadcast plus companion clock joined evaluation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p4-video-source-clock-joined.yml']
permissions: {contents: read}
concurrency:
  group: igp-p4-independent-video-original-sdk-join-v2
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: ace354e9167276c4132ca1d6793daf3a149caeaf
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public confidentiality and exact SHA original NBA private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Run physical P4 fail-closed tests and join three independent source QA receipts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_v31_p4_video_source_clock_join_benchmark_v2.py'
          if ! python3 gamepulse/fusion/igp_fusion_v31_p4_video_source_clock_join_benchmark_v2.py --root . --output "$RUNNER_TEMP/p4-joined-private.json" > "$RUNNER_TEMP/p4-joined-private.log" 2>&1; then
            echo IGP_P4_INDEPENDENT_VIDEO_PHYSICAL_SOURCE_JOIN_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'p4-joined-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('IGP_P4_SOURCE_BENCH_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:80])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'p4-joined-private.json').read_text())
          assert q['engine_version']=='igp-fusion-v3.1-research'
          assert q['clock_pair_alignment']['matching_nonPBP_source_clock_event_pairs']==2
          assert q['clock_pair_alignment']['implied_offset_difference_ms']==16
          assert q['clock_pair_alignment']['absolute_subsecond_video_SDK_time_certified'] is False
          assert q['independent_dense_actual_video_frames']==16
          assert q['independent_video_clock_snapshots']==9
          assert q['original_native_PBP_chain_source_frame_count']==28
          assert q['original_native_official_ten_ball_direct_source_count']==26
          assert q['scorecard']['independent_video_offense_team_correct_against_official_PBP']==1
          assert q['scorecard']['independent_video_ball_XYZ_error_p95_ft'] is None
          assert q['scorecard']['independently_video_certified_full_possessions']==0
          assert q['scorecard']['newly_accepted_NBA_tracking_positions']==0
          assert q['original_NBA_SDK_UTC_XYZ_official_ten_NBA_PBP_accepted_800_P3_unchanged']
          print('IGP_P4_INDEPENDENT_NBA_BROADCAST_UNIFIED_PHYSICAL_BENCHMARK',json.dumps({
             'engine_version':q['engine_version'],
             'broadcast_frames':q['independent_dense_actual_video_frames'],
             'independent_scoreboard_observations':q['independent_video_clock_snapshots'],
             'original_source_clock_pairs':q['clock_pair_alignment']['matching_nonPBP_source_clock_event_pairs'],
             'clock_pair_offset_spread_ms':q['clock_pair_alignment']['implied_offset_difference_ms'],
             'NBA_source_PBP_native_frames':q['original_native_PBP_chain_source_frame_count'],
             'IGP_10hz_PBP_window':q['IGP_logged_NBA_window_10hz_source_counts'],
             'physical_ball_3D_p95_ft':None,
             'certified_physical_possessions':0,
             'promotion':0},sort_keys=True))
          PY
      - name: Commit source-private actual joined video P4 benchmark receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_v31_p4_video_source_clock_join_benchmark_v2.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p4-endtoend-independent "origin/$BRANCH"
          cp "$RUNNER_TEMP/p4-joined-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): independently decoded NBA video + companion source clock P4 physical evidence scorecard with explicit abstention'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P4_INDEPENDENT_VIDEO_SOURCE_CLOCK_FULL_BENCHMARK_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
