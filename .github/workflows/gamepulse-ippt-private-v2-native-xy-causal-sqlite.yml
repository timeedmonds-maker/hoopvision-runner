name: IPPT private all22k NBA PBP native XY SQLite v2 with causal scorer-event graph SHA readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-private-v2-native-xy-causal-sqlite.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  nba-private-causal-event-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      SOURCE_BRANCH: research/ippt-event-snapshots-separate-20261028
      SOURCE_SHA: 1ba41a9de756539704cd3b0a68c6c3c1b4810c48
      INPUT_BRANCH: data/ippt-all-pbp-native-xy-36-20261028-v1
      INPUT_SHA: 1fe2df6b9a37a267db91f8a4f25fb8f6df572a9e
      NEW_DATA_BRANCH: data/ippt-all-pbp-native-xy-causal-36-20261028-v2
      INPUT_FILE: gamepulse/fusion/materialized/ippt_all_pbp_native_xy_36_v1/nba_pbp_original_native_xy.sqlite
      OUTPUT_FILE: gamepulse/fusion/materialized/ippt_all_pbp_native_xy_causal_36_v2/nba_pbp_original_native_xy_causal.sqlite
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private Git branch no-overwrite and original NBA XYZ public guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          if git ls-remote --exit-code --heads "https://github.com/$PRIVATE_REPO.git" "$NEW_DATA_BRANCH" >/dev/null 2>&1; then
            echo "PRIVATE_V2_BRANCH_ALREADY_EXISTS_REFUSE_OVERWRITE"
            exit 1
          fi
          git clone -q --filter=blob:none --depth=1 --sparse -b "$SOURCE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-code"
          git -C "$RUNNER_TEMP/private-code" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private-code" rev-parse HEAD)" = "$SOURCE_SHA"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$INPUT_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-v1"
          git -C "$RUNNER_TEMP/private-v1" sparse-checkout set gamepulse/fusion/materialized/ippt_all_pbp_native_xy_36_v1
          test "$(git -C "$RUNNER_TEMP/private-v1" rev-parse HEAD)" = "$INPUT_SHA"
          echo "IPPT_CODE=$RUNNER_TEMP/private-code" >> "$GITHUB_ENV"
          echo "IPPT_V1=$RUNNER_TEMP/private-v1" >> "$GITHUB_ENV"
      - name: Original v1 private SHA independently verified and no source alteration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["IPPT_V1"])
          p=root/os.environ["INPUT_FILE"]
          manifest=json.loads(p.with_name("source_and_sqlite_sha_manifest.json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==manifest["sha256_private_SQLite"]
          assert manifest["PBP_actions"]==22314
          assert manifest["deduplicated_PBP_selected_native_frames"]==10623
          assert manifest["same_native_original_ball_player_observations"]==110839
          print("IPPT_PRIVATE_V1_ORIGINAL_BINARY_SHA_AND_COUNTS_SOURCE_VERIFIED")
          PY
      - name: Unit tests all PBP scorer causal episode edge and original source native query
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_CODE"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_all_pbp_native_sqlite_causal_upgrade_2026.py
          python3 -m unittest -v \
             gamepulse/fusion/test_igp_ippt_all_pbp_causal_event_bundle_2026.py \
             gamepulse/fusion/test_igp_ippt_all_pbp_native_sqlite_causal_upgrade_2026.py
      - name: Build exact 36 SHA original NBA PBP causal graph in PRIVATE original XY database v2
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_CODE"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_native_sqlite_causal_upgrade_2026.py \
             --root . --v1 "$IPPT_V1/$INPUT_FILE" --out "$IPPT_CODE/$OUTPUT_FILE" \
             | tee "$RUNNER_TEMP/ippt_v2_aggregate_counts.log"
          python3 - <<'PY'
          import os,sqlite3,hashlib,json
          from pathlib import Path
          root=Path(os.environ["IPPT_CODE"]);p=root/os.environ["OUTPUT_FILE"]
          with sqlite3.connect(p) as db:
            counts={n:db.execute(f"SELECT COUNT(*) FROM {n}").fetchone()[0] for n in
                    ("pbp_event","native_frame","original_actor",
                     "event_bundle","bundle_membership","bundle_causal_edge")}
            assert counts=={"pbp_event":22314,"native_frame":10623,"original_actor":110839,
                 "event_bundle":6336,"bundle_membership":14655,"bundle_causal_edge":9241},counts
            assert not db.execute("PRAGMA foreign_key_check").fetchall()
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={"schema":"IPPT_ALL_NBA_PBP_NATIVE_XY_CAUSAL_PRIVATE_SQLITE_V2",
            "v1_private_source_commit_SHA":os.environ["INPUT_SHA"],
            "causal_upgrade_source_code_SHA":os.environ["SOURCE_SHA"],
            "v2_private_SQLite_SHA256":digest,"counts":counts,
            "original_22314_official_action_primary_keys_preserved":True,
            "original_source_xyz_untouched":True,
            "all_physical_event_UTC_unverified_null":True}
          p.with_name("source_and_causal_sqlite_manifest.json").write_text(
             json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print("IPPT_PRIVATE_CAUSAL_SQLITE_V2_VALIDATED_COUNTS_ONLY",counts)
          PY
      - name: New PRIVATE data branch only, no public original NBA player XY artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_CODE"
          git config user.name 'Integrated Pulse QA'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$NEW_DATA_BRANCH"
          git add "$OUTPUT_FILE" "$(dirname "$OUTPUT_FILE")/source_and_causal_sqlite_manifest.json"
          git commit -qm 'data(ippt): private all NBA event original XY SQLite v2 with physical sequence graph'
          git push -q origin "HEAD:refs/heads/$NEW_DATA_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/private_v2_commit.txt"
          echo "IPPT_PRIVATE_DATA_V2_PUSHED_NO_PUBLIC_COORDINATES"
      - name: Fresh PRIVATE Git clone verifies v2 original NBA XY and all causal bundle rows
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$NEW_DATA_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-v2"
          git -C "$RUNNER_TEMP/private-v2" sparse-checkout set "$(dirname "$OUTPUT_FILE")"
          python3 - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"private-v2"/os.environ["OUTPUT_FILE"]
          m=json.loads(p.with_name("source_and_causal_sqlite_manifest.json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["v2_private_SQLite_SHA256"]
          assert m["original_22314_official_action_primary_keys_preserved"]
          with sqlite3.connect(p) as db:
            assert db.execute("SELECT COUNT(*) FROM pbp_event").fetchone()[0]==22314
            assert db.execute("SELECT COUNT(*) FROM event_bundle").fetchone()[0]==6336
            assert db.execute("SELECT COUNT(*) FROM bundle_causal_edge").fetchone()[0]==9241
            assert db.execute("SELECT COUNT(*) FROM bundle_membership WHERE game_id='0022600009' AND action_number IN (7,8)").fetchone()[0]==2
            assert db.execute("SELECT COUNT(*) FROM bundle_causal_edge WHERE game_id='0022600009' AND action_a=7 AND action_b=8 AND relation='SHOT_RELEASE_BEFORE_REBOUND_CONTROL'").fetchone()[0]==1
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
          print("IPPT_PRIVATE_V2_FRESH_CLONE_BINARY_SHA_AND_ALL_CAUSAL_EDGES_PASS")
          PY
      - name: Delete transient licensed original XY copies; post aggregate-only receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          p=root/"private_v2_commit.txt"
          summary={"github_run_id":os.environ["GITHUB_RUN_ID"],
             "prior_job_status":os.environ["QA_JOB_RESULT"],
             "private_data_branch":os.environ["NEW_DATA_BRANCH"],
             "private_data_commit_SHA":p.read_text().strip() if p.exists() else None,
             "original_v1_private_SHA":os.environ["INPUT_SHA"],
             "research_code_SHA":os.environ["SOURCE_SHA"],
             "physical_event_UTC_certified":False,"licensed_original_XYZ_publicly_released":False}
          (root/"ippt_private_v2_receipt.md").write_text(
             "PRIVATE only original NBA source XY v2 with PBP same-UTC episode relation graph; no public player XYZ, no physical event-time accuracy claim.\n\n~~~json\n"+
             json.dumps(summary,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private-code" "$RUNNER_TEMP/private-v1" "$RUNNER_TEMP/private-v2"
          gh issue comment 136 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_private_v2_receipt.md"
# Source original NBA game tracking remains private, no public binary artifacts.
