name: Clip Lab encrypted original CourtCoder event86 evidence handoff
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clip-lab-encrypted-event86-handoff.yml'
permissions:
  contents: read
jobs:
  secure-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve private original NBA footage and matching frozen tracking
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo AUTHORIZED_PRIVATE_TOKEN_MISSING; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          mkdir -p "$RUNNER_TEMP/secure-source" "$RUNNER_TEMP/sealed"
          gh release download clip-lab-rockets-spurs-0022600009-e86-broadcast \
            --pattern '0022600009-e86-broadcast.mp4' \
            --pattern 'cpu-full20-tracks.csv' \
            --pattern 'cpu-full20-court_frames.json' \
            --pattern 'cpu_frozen_full20_qa.json' \
            --repo timeedmonds-maker/104 --dir "$RUNNER_TEMP/secure-source" >/dev/null
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/positions/0022600009_q1_durant_adams.json' --jq .content | base64 -d > "$RUNNER_TEMP/secure-source/native_gamepulse_q1.json"
          gh api 'repos/timeedmonds-maker/104/contents/tools/locked_broadcast_screen_v5_rings.py?ref=courtcoder/integration' --jq .content | base64 -d > "$RUNNER_TEMP/secure-source/original_frozen_rings_v31.py"
          gh api 'repos/timeedmonds-maker/104/contents/screen_tracker_nextgen/materialize_fast_path_render_assignments.py?ref=courtcoder/integration' --jq .content | base64 -d > "$RUNNER_TEMP/secure-source/official_floor_anchor_materializer.py"
          python3 - "$RUNNER_TEMP/secure-source" <<'PY'
          import hashlib,json,csv,sys
          from pathlib import Path
          d=Path(sys.argv[1])
          expected={
            '0022600009-e86-broadcast.mp4':'c388f5f9936c8b044195c18bb2c6239c6831a065bf722aa8dc2113889c4dbcd0',
            'cpu-full20-tracks.csv':'94806b5644daf84031614a24f6e2b0660e5df00c135fe0b828cf5dd24f63f761',
            'cpu-full20-court_frames.json':'0957931147504dcc3c077ad7d5fd5ee85410d30da8ed63831d6298a39d196c08'}
          for n,digest in expected.items():assert hashlib.sha256((d/n).read_bytes()).hexdigest()==digest,n
          rows=list(csv.DictReader((d/'cpu-full20-tracks.csv').open()))
          courts=json.loads((d/'cpu-full20-court_frames.json').read_text())
          pulse=json.loads((d/'native_gamepulse_q1.json').read_text())
          assert len(rows)>=8 and sum(x.get('H') is not None for x in courts)>=3
          assert pulse['game_id']=='0022600009'
          print('PRIVATE_SOURCE_SHA_AND_TRACKER_VERIFIED')
          PY
      - name: Seal private media as CMS AES256 for receiving user's local chat only
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/secure-source" -czf "$RUNNER_TEMP/sealed/private_source.tgz" .
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/sealed/private_source.tgz" \
            -outform DER -out "$RUNNER_TEMP/sealed/original-courtcoder-event86.cms" \
            tools/clip_lab_public_handoff_cert.pem
          test -s "$RUNNER_TEMP/sealed/original-courtcoder-event86.cms"
          rm -rf "$RUNNER_TEMP/secure-source" "$RUNNER_TEMP/sealed/private_source.tgz"
          echo 'ENCRYPTED_PRIVATE_HANDOFF_READY'
      - uses: actions/upload-artifact@v4
        with:
          name: hoopvision-event86-encrypted-private-inputs
          path: ${{ runner.temp }}/sealed/original-courtcoder-event86.cms
          retention-days: 1
          if-no-files-found: error
