name: Game Pulse verified failed checkpoints source retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-20261022-targeted-retry.yml'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-20261022-targeted-retry.yml'
      - 'tools/licensed_feed/capture.mjs'
      - 'tools/licensed_feed/season_private_release.mjs'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: gamepulse-20261022-known-failed-checkpoint-retries
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  retry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { game_id: '0022600004', tipoff: '2026-10-21T23:30:00Z', part: 6 }
          - { game_id: '0022600005', tipoff: '2026-10-22T02:00:00Z', part: 12 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 0 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 3 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 5 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 6 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 7 }
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authenticated SDK without lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Reuse verified checkpoint or retry genuine source window reads
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: ${{ matrix.game_id }}
          GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.tipoff }}
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs
