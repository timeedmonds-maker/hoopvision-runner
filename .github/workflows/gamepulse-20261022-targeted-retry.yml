name: Game Pulse verified failed checkpoints source retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-20261022-targeted-retry.yml'
  # Bounded postgame checks for provider backfill, no fabricated coordinates.
  # 2026-10-24: recheck genuine source after reviewed public workflow guard repair.
  # Cavaliers Q2-Q4 checks are source-native only; the QA gate must still
  # reject completion unless official active-play positions exist in all periods.
  schedule:
    - cron: '17 9,13,17,21 23-24 10 *'
    - cron: '17 13 25-31 10 *'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-20261022-targeted-retry.yml'
      - 'tools/licensed_feed/capture.mjs'
      - 'tools/licensed_feed/season_private_release.mjs'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: gamepulse-20261022-known-failed-checkpoint-retries
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  retry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { game_id: '0022600004', tipoff: '2026-10-21T23:30:00Z', part: 6 }
          - { game_id: '0022600005', tipoff: '2026-10-22T02:00:00Z', part: 12 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 0 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 3 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 5 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 6 }
          - { game_id: '0022600085', tipoff: '2026-10-21T23:00:00Z', part: 7 }
          - { game_id: '0022600007', tipoff: '2026-10-23T01:30:00Z', part: 11 }
          - { game_id: '0022600007', tipoff: '2026-10-23T01:30:00Z', part: 12 }
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authenticated SDK without lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Reuse verified checkpoint or retry genuine source window reads
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: ${{ matrix.game_id }}
          GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.tipoff }}
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs

      - name: Certify all thirteen Denver original SDK parts after successful genuine source recovery
        if: matrix.game_id == '0022600007' && matrix.part == 12
        working-directory: tools/licensed_feed
        env:
          GAMEPULSE_PRIORITY_FANOUT: 'false'
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
        run: node season_private_release.mjs

  cavs-source-gap-probes:
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { label: 'q2-late', start_ms: 1792714480000, part: 3 }
          - { label: 'q3-early', start_ms: 1792716080000, part: 4 }
          - { label: 'q3-mid', start_ms: 1792716650000, part: 4 }
          - { label: 'q3-late', start_ms: 1792717685000, part: 5 }
          - { label: 'q4-early', start_ms: 1792718265000, part: 5 }
          - { label: 'q4-mid', start_ms: 1792718860000, part: 6 }
          - { label: 'q4-late', start_ms: 1792720025000, part: 7 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure no private data is exposed publicly
        run: python3 tools/public_content_guard.py
      - name: Limit scheduled retries to 23–31 October 2026 UTC
        id: horizon
        shell: bash
        run: |
          today="$(date -u +%Y-%m-%d)"
          if [ "${{ github.event_name }}" = 'push' ] || [[ "$today" > '2026-10-22' && "$today" < '2026-11-01' ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.horizon.outputs.eligible == 'true'
        with:
          node-version: '22'
      - name: Install licensed SDK without lifecycle scripts
        if: steps.horizon.outputs.eligible == 'true'
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Probe real game-action SDK windows and privately preserve evidence
        if: steps.horizon.outputs.eligible == 'true'
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          PROBE_LABEL: ${{ matrix.label }}
          PROBE_START: ${{ matrix.start_ms }}
          PROBE_PART: ${{ matrix.part }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {mkdtempSync,readFileSync,writeFileSync,rmSync,existsSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {spawnSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const priv=process.env.GH_TOKEN, game='0022600006';
          if(!priv||priv.length<30||process.env.GITHUB_REPOSITORY!=='timeedmonds-maker/hoopvision-runner'
              ||process.env.GITHUB_REF!=='refs/heads/main'
              ||!['push','schedule'].includes(process.env.GITHUB_EVENT_NAME))
            throw Error('unauthorized_private_source_probe');
          const from=Number(process.env.PROBE_START),part=Number(process.env.PROBE_PART);
          const label=process.env.PROBE_LABEL;
          if(!Number.isSafeInteger(from)||from%5000||!Number.isInteger(part)
             ||!/^q[234]-(early|mid|late)$/.test(label))
            throw Error('invalid_probe_assignment');
          delete process.env.GH_TOKEN;
          const {capture}=await import('./capture.mjs');
          const work=mkdtempSync(join(tmpdir(),'gpcavs-'));
          const gh=(args)=>spawnSync('gh',args,{encoding:'utf8',
             env:{...process.env,GH_TOKEN:priv},timeout:100000,maxBuffer:2*1024*1024});
          const tag='gamepulse-cavs-source-gap-probes';
          const job={game_id:game,account_id:'nba',
             program_id:'companion-'+game+'-positions',part,start_ms:from,count:12};
          let summary={schema:'gamepulse.authentic-cavs-source-gap-probe.v1',game_id:game,
             label,source_start_ms:from,window_count:12,
             source_observed:false,player_frames:0,ball_frames:0,
             active_play_source_usable:false,status:'NOT_COLLECTED'};
          try{
            try {
              await capture(job,work);
              const m=JSON.parse(readFileSync(join(work,'manifest.json'),'utf8'));
              if(m.observed!==true||m.imputed!==false||m.successful_windows!==12)
                throw Error('source_manifest_not_authentic');
              summary={...summary,source_observed:true,player_frames:m.frames_with_players,
                 ball_frames:m.frames_with_ball,empty_windows:m.empty_windows,
                 active_play_source_usable:m.frames_with_players>0&&m.frames_with_ball>0,
                 status:m.frames_with_players>0&&m.frames_with_ball>0
                   ?'SOURCE_PLAYER_BALL_OBSERVED':'SDK_EMPTY_FOR_OFFICIAL_ACTIVE_PLAY'};
            } catch(e) {
              const reason=/^[a-z_]+$/.test(e?.message||'')?e.message:'source_probe_failed';
              summary.status='SDK_PROBE_FAILED';
              summary.error_code=reason;
            }

            // Escalate a successful historical probe into a full, separate
            // original-SDK checkpoint re-collection. Never overwrite canonical
            // gamepulse-sdk-0022600006 source assets or invent any empty frames.
            const recoveryParts={'q2-late':3,'q3-early':4,'q3-late':5,
              'q4-mid':6,'q4-late':7};
            if(summary.active_play_source_usable &&
               Object.hasOwn(recoveryParts,label)){
              const sdkPart=recoveryParts[label];
              const fullStart=Date.parse('2026-10-22T22:50:00Z')+sdkPart*300*5000;
              const recoveryJob={...job,start_ms:fullStart,count:300,part:sdkPart};
              const candidateDir=mkdtempSync(join(tmpdir(),'gpcavs-fullpart-'));
              const recoveryTag='gamepulse-cavs-backfill-0022600006';
              summary.regather={sdk_part:sdkPart,status:'STARTED'};
              try{
                process.env.GAMEPULSE_FINAL_FASTLANE='true';
                await capture(recoveryJob,candidateDir);
                const m=JSON.parse(readFileSync(join(candidateDir,'manifest.json'),'utf8'));
                if(m.game_id!==game||m.part!==sdkPart||m.successful_windows!==300||
                   m.observed!==true||m.imputed!==false)
                  throw Error('recovery_original_manifest_invalid');
                summary.regather={sdk_part:sdkPart,status:'SOURCE_RECOLLECTED',
                  frames_with_players:m.frames_with_players,frames_with_ball:m.frames_with_ball,
                  unique_keyframes:m.unique_keyframes,empty_windows:m.empty_windows,
                  active_play_coverage_certified:false};
                if(m.frames_with_players>0&&m.frames_with_ball>0){
                  const filename='sdk-part-'+String(sdkPart).padStart(2,'0')+'.tar.gz';
                  const archive=join(candidateDir,'checkpoint.tar.gz');
                  const ready=join(candidateDir,filename);
                  const {copyFileSync}=await import('node:fs');
                  copyFileSync(archive,ready);
                  if(gh(['release','view',recoveryTag,'--repo','timeedmonds-maker/104']).status!==0){
                    const cr=gh(['release','create',recoveryTag,'--repo','timeedmonds-maker/104',
                      '--title',recoveryTag,'--notes','Candidate genuine source backfill, separate from frozen canonical source',
                      '--latest=false']);
                    if(cr.status!==0&&gh(['release','view',recoveryTag,
                       '--repo','timeedmonds-maker/104']).status!==0)
                      throw Error('private_candidate_release_failed');
                  }
                  if(gh(['release','upload',recoveryTag,ready,'--repo',
                         'timeedmonds-maker/104','--clobber']).status!==0)
                    throw Error('private_candidate_part_upload_failed');
                  const proof=gh(['api','repos/timeedmonds-maker/104/releases/tags/'+recoveryTag]);
                  if(proof.status!==0)throw Error('candidate_digest_lookup_failed');
                  const asset=JSON.parse(proof.stdout).assets.find(a=>a.name===filename);
                  const expected='sha256:'+createHash('sha256').update(readFileSync(ready)).digest('hex');
                  if(asset?.digest!==expected)throw Error('candidate_archive_digest_mismatch');
                  summary.regather.status='PRIVATE_SHA_VERIFIED_CANDIDATE';
                  summary.regather.digest=expected;
                  summary.regather.private_release=recoveryTag;
                }else summary.regather.status='FULLPART_SDK_RETURNED_NO_PLAYER_BALL';
              }catch(e){
                summary.regather.status='SOURCE_RECOLLECTION_FAILED';
                summary.regather.safe_error_code=/^[a-z_]+$/.test(e?.message||'')
                  ?e.message:'unclassified_recovery_error';
              }finally{delete process.env.GAMEPULSE_FINAL_FASTLANE;
                         rmSync(candidateDir,{recursive:true,force:true});}
            }
            const newRelease=gh(['release','view',tag,'--repo','timeedmonds-maker/104']);
            if(newRelease.status!==0){
              const create=gh(['release','create',tag,'--repo','timeedmonds-maker/104',
                '--title',tag,'--notes','Private original SDK action-time source QA; no imputation',
                '--latest=false']);
              if(create.status!==0 && gh(['release','view',tag,'--repo','timeedmonds-maker/104']).status!==0)
                throw Error('private_probe_release_failed');
            }
            const base='cavs-'+label+'-'+from;
            const receipt=join(work,base+'.json');
            writeFileSync(receipt,JSON.stringify(summary)+'\n');
            if(gh(['release','upload',tag,receipt,'--repo','timeedmonds-maker/104','--clobber']).status!==0)
              throw Error('private_probe_receipt_save_failed');
            const archive=join(work,'checkpoint.tar.gz');
            if(summary.active_play_source_usable && existsSync(archive)){
              const name=base+'.tar.gz';
              const target=join(work,name);
              const {copyFileSync}=await import('node:fs');
              copyFileSync(archive,target);
              if(gh(['release','upload',tag,target,'--repo','timeedmonds-maker/104','--clobber']).status!==0)
                throw Error('private_probe_source_save_failed');
              const list=gh(['api','repos/timeedmonds-maker/104/releases/tags/'+tag]);
              if(list.status!==0)throw Error('private_probe_sha_listing_failed');
              const digest=JSON.parse(list.stdout).assets.find(x=>x.name===name)?.digest;
              if(digest!=='sha256:'+createHash('sha256').update(readFileSync(target)).digest('hex'))
                throw Error('private_probe_sha_mismatch');
            }
            console.log('PRIVATE_CAVS_SOURCE_PROBE_RECEIPT_SAVED',label,summary.status,
              summary.player_frames,summary.ball_frames);
          } finally{rmSync(work,{recursive:true,force:true});}
          NODE

  cavs-clean-room-scratch:
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the trusted licensed feed SDK
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Fresh independent Q1 positive control against Q3 and Q4 source gaps
        working-directory: tools/licensed_feed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {mkdtempSync,rmSync,writeFileSync,readFileSync,copyFileSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {spawnSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {planGame} from './season_core.mjs';
          const game='0022600006', start=Date.parse('2026-10-22T23:00:00Z');
          const tag='gamepulse-cavs-cleanroom-0022600006',token=process.env.GH_TOKEN;
          if(!token||token.length<30||process.env.GITHUB_REPOSITORY!=='timeedmonds-maker/hoopvision-runner'
            ||!['push','schedule'].includes(process.env.GITHUB_EVENT_NAME)||process.env.GITHUB_REF!=='refs/heads/main')
            throw Error('unauthorized_clean_room');
          delete process.env.GH_TOKEN;
          const {capture}=await import('./capture.mjs');
          const gh=args=>spawnSync('gh',args,{encoding:'utf8',
            env:{...process.env,GH_TOKEN:token},timeout:120000,maxBuffer:2*1024*1024});
          if(gh(['release','view',tag,'--repo','timeedmonds-maker/104']).status!==0){
            const r=gh(['release','create',tag,'--repo','timeedmonds-maker/104',
              '--title',tag,'--notes','Completely independent clean-room historical SDK re-collection; original release untouched',
              '--latest=false']);
            if(r.status!==0&&gh(['release','view',tag,'--repo','timeedmonds-maker/104']).status!==0)
              throw Error('private_clean_room_release_failed');
          }
          const plan=planGame({id:game,start});
          const samples=[
            {label:'q1-positive-control',ts:Date.parse('2026-10-22T23:28:00Z')},
            {label:'q3-fresh',ts:Date.parse('2026-10-23T00:50:50Z')},
            {label:'q4-fresh',ts:Date.parse('2026-10-23T01:27:40Z')}
          ];
          const evidence=[];
          for(const sample of samples){
            const part=Math.floor((sample.ts-plan.begin)/(300*5000));
            const path=mkdtempSync(join(tmpdir(),'cavs-scratch-'));
            const job={...plan.parts[part],start_ms:sample.ts,count:12};
            let item={label:sample.label,source_start_utc_ms:sample.ts,part,
              status:'SOURCE_UNAVAILABLE',frames_with_players:0,frames_with_ball:0,
              reused_source_assets:false};
            try{
              process.env.GAMEPULSE_FINAL_FASTLANE='true';
              await capture(job,path);
              const m=JSON.parse(readFileSync(join(path,'manifest.json'),'utf8'));
              if(m.imputed!==false||m.observed!==true||m.successful_windows!==12)
                throw Error('invalid_authentic_sdk_manifest');
              item={...item,status:'SOURCE_OBSERVED',source_windows:m.successful_windows,
                frames_with_players:m.frames_with_players,
                frames_with_ball:m.frames_with_ball,empty_windows:m.empty_windows,
                unique_keyframes:m.unique_keyframes};
            }catch(e){
              item.error_code=/^[a-z_]+$/.test(e.message||'')?e.message:'source_unavailable';
            }finally{
              delete process.env.GAMEPULSE_FINAL_FASTLANE;
              rmSync(path,{recursive:true,force:true});
            }
            evidence.push(item);
            console.log('CAVS_CLEANROOM_SOURCE_SUMMARY',item.label,item.status,
              item.frames_with_players,item.frames_with_ball);
          }
          const good=evidence.every(x=>x.status==='SOURCE_OBSERVED'
            &&x.frames_with_players>0&&x.frames_with_ball>0);
          const evidenceDir=mkdtempSync(join(tmpdir(),'cavs-scratch-out-'));
          const report={schema:'gamepulse.cavs-cleanroom-source-diagnostic.v1',
            game_id:game,method:'NEW_SDK_SESSIONS_NEW_TEMP_DIRECT_PROVIDER_WINDOWS',
            reused_original_archive:false,samples:evidence,
            genuine_second_half_source_restored:good,
            complete_game_tracking_certified:false,
            next_action:good?'BUILD_FULL_FRESH_SDK_CANDIDATE'
              :'DO_NOT_DELETE_ORIGINAL_SOURCE_PROVIDER_SECOND_HALF_STILL_ABSENT'};
          const out=join(evidenceDir,'cleanroom-source-diagnostic.json');
          try{
            writeFileSync(out,JSON.stringify(report)+'\n');
            if(gh(['release','upload',tag,out,'--repo','timeedmonds-maker/104','--clobber']).status!==0)
              throw Error('private_source_diagnostic_publish_failed');
            const listing=gh(['api','repos/timeedmonds-maker/104/releases/tags/'+tag]);
            if(listing.status!==0)throw Error('source_diagnostic_readback_failed');
            const asset=JSON.parse(listing.stdout).assets.find(x=>x.name==='cleanroom-source-diagnostic.json');
            if(asset?.digest!=='sha256:'+createHash('sha256').update(readFileSync(out)).digest('hex'))
              throw Error('source_diagnostic_sha_mismatch');
            console.log('CAVS_CLEANROOM_SHA_VERIFIED',good?'SECOND_HALF_RESTORED':'SECOND_HALF_UNAVAILABLE');
          }finally{rmSync(evidenceDir,{recursive:true,force:true});}
          if(!good)process.exit(0);
          for(const j of plan.parts){
            const work=mkdtempSync(join(tmpdir(),'cavs-full-fresh-'));
            try{
              process.env.GAMEPULSE_FINAL_FASTLANE='true';
              await capture(j,work);
              const m=JSON.parse(readFileSync(join(work,'manifest.json'),'utf8'));
              if(m.game_id!==game||m.part!==j.part||m.successful_windows!==j.count
                ||m.imputed!==false||m.observed!==true)
                throw Error('fresh_part_source_validation_failed');
              const name='sdk-part-'+String(j.part).padStart(2,'0')+'.tar.gz';
              const target=join(work,name);
              copyFileSync(join(work,'checkpoint.tar.gz'),target);
              if(gh(['release','upload',tag,target,'--repo','timeedmonds-maker/104','--clobber']).status!==0)
                throw Error('fresh_source_archive_upload_failed');
              const release=gh(['api','repos/timeedmonds-maker/104/releases/tags/'+tag]);
              if(release.status!==0)throw Error('fresh_source_asset_check_failed');
              const digest=JSON.parse(release.stdout).assets.find(x=>x.name===name)?.digest;
              if(digest!=='sha256:'+createHash('sha256').update(readFileSync(target)).digest('hex'))
                throw Error('fresh_source_sha256_mismatch');
              console.log('CAVS_CLEANROOM_NEW_PART_VERIFIED',j.part,
                m.frames_with_players,m.frames_with_ball);
            }finally{delete process.env.GAMEPULSE_FINAL_FASTLANE;
              rmSync(work,{recursive:true,force:true});}
          }
          console.log('CAVS_CLEANROOM_ALL_ORIGINAL_PARTS_RECAPTURED_PENDING_Q1_Q4_INDEPENDENT_QA');
          NODE
