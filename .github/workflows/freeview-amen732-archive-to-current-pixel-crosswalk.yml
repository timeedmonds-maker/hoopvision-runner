name: Amen732 archived six-video original-to-fresh pixel-frame crosswalk
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-archive-to-current-pixel-crosswalk.yml']
permissions:
  contents: read
concurrency:
  group: amen732-six-camera-original-versus-fresh-pixel-correspondence
  cancel-in-progress: false
jobs:
  correspondences:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public boundary and independently test frame-matching algorithm
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m pip install -q --disable-pip-version-check 'numpy<2' 'opencv-python-headless==4.10.0.84'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          test -n "$(command -v ffmpeg)" && test -n "$(command -v ffprobe)"
          python3 -m py_compile tools/amen732_archive_fresh_visual_correspondences.py
          python3 tools/amen732_archive_fresh_visual_correspondences.py --selftest
      - name: Acquire six distinct current official NBA camera videos from original streams
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-crosswalk"
          mkdir -p "$ROOT/fresh" "$ROOT/old" "$ROOT/private_results"
          python3 tools/amen732_official_sixvideo_acquire.py \
            --root "$ROOT/fresh" --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)"
          echo SIX_FRESH_OFFICIAL_NATIVE_MP4S_SHA_VERIFIED
      - name: Read twelve ORIGINAL high-bitrate archive source-frame references from private 104
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo PRIVATE_ARCHIVE_SOURCE_TOKEN_MISSING; exit 4; }
          ROOT="$RUNNER_TEMP/amen732-crosswalk"
          REF=262cee526ee19783218600853f95326adccbab4e
          for pair in \
            broadcast:272 broadcast:275 \
            high-tight:228 high-tight:235 \
            left-above-rim:239 left-above-rim:247 \
            right-above-rim:231 right-above-rim:234 \
            left-slash:213 left-slash:221 \
            right-slash:203 right-slash:211; do
            CAM="${pair%%:*}"
            FRAME="${pair##*:}"
            NAME="amen732-native-$CAM-f$FRAME.jpg"
            API="repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/$NAME?ref=$REF"
            gh api "$API" --jq .content | base64 --decode > "$ROOT/old/$NAME"
            test "$(wc -c < "$ROOT/old/$NAME")" -gt 15000
          done
          test "$(find "$ROOT/old" -maxdepth 1 -type f -name '*.jpg' | wc -l)" = 12
          echo TWELVE_ARCHIVED_NATIVE_FRAME_REFERENCES_PRIVATE_READ_PASS
      - name: Match full video native pixels with archived 12 sources, enforce independent two-frame map
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-crosswalk"
          python3 tools/amen732_archive_fresh_visual_correspondences.py \
            --fresh "$ROOT/fresh" --archived-jpegs "$ROOT/old" \
            --out "$ROOT/private_results/amen732_archive_to_fresh_pixel_frame_crosswalk.json"
          python3 - "$ROOT/private_results/amen732_archive_to_fresh_pixel_frame_crosswalk.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          assert q['camera_count']==6 and q['reference_jpegs_total']==12
          assert len(q['camera_results'])==6
          print('SIX_VIDEO_PIXEL_CROSSWALK_MEASURED',
                q['full_frame_pixel_correspondences_accepted_camera_count'],
                'of',q['camera_count'],
                'source_versions_interchangeable',q['all_six_video_version_frame_maps_verified'])
          PY
      - name: Preserve confidential source-version map privately, no public licensed frames
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-crosswalk"
          TAG=freeview-amen732-archive-vs-fresh-sixvideo-pixel-crosswalk-20261029
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title "Amen732 twelve archived native frames vs six fresh videos pixel crosswalk" \
              --notes "12 independently source-matched private JPEG frames, exact original/fresh SHA, and explicit pass/reject per camera. No new Freeview geometry." \
              --latest=false >/dev/null
          fi
          gh release upload "$TAG" \
            "$ROOT/private_results/amen732_archive_to_fresh_pixel_frame_crosswalk.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/release_receipt.json"
          python3 - "$ROOT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          p=root/'private_results/amen732_archive_to_fresh_pixel_frame_crosswalk.json'
          q=json.load(open(root/'release_receipt.json'))
          a={z['name']:z for z in q['assets']}[p.name]
          assert a['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print('ARCHIVE_CURRENT_SIX_VIDEO_SOURCE_CROSSWALK_PRIVATE_SHA_READBACK_PASS')
          PY
