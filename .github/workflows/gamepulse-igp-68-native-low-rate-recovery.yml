name: IGP targeted five missing Oct28 original XYZ recovery (SHA resume)
# Reviewed public content guard entries restored; retry remaining source capture.
# Re-dispatched after exact security guard allowlist addition.
on:
  schedule:
    - cron: '24 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-native-low-rate-recovery.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  # Retriggered on 30 Oct after asset-by-asset source audit: 0139 has 10/13 tar; 0140-0143 not source complete.
  # Source-only recovery; no zero-filled, synthetic or fabricated original XYZ.
  group: igp-targeted-missing-native-five
  cancel-in-progress: false
jobs:
  original-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {game: '0022600139', tipoff: '2026-10-29T00:00:00Z'}
          - {game: '0022600140', tipoff: '2026-10-29T00:00:00Z'}
          - {game: '0022600141', tipoff: '2026-10-29T01:00:00Z'}
          - {game: '0022600142', tipoff: '2026-10-29T01:30:00Z'}
          - {game: '0022600143', tipoff: '2026-10-29T02:30:00Z'}
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAMEPULSE_PRIORITY_FINALIZE: 'true'
      GAMEPULSE_FINAL_FASTLANE: 'true'
      GAMEPULSE_PRIORITY_ID: ${{ matrix.game }}
      GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.tipoff }}
      GID: ${{ matrix.game }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve all original Game Pulse parts using single-worker resume
        shell: bash
        working-directory: tools/licensed_feed
        run: |
          set -euo pipefail
          (cd ../.. && python3 tools/public_content_guard.py)
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
          for attempt in 1 2 3; do
            # Scheduled targeted recovery is production-scoped; ordinary push still uses the existing priority gate.
            if test "$GITHUB_EVENT_NAME" = schedule; then export GAMEPULSE_PRODUCTION_ENABLED=true; fi
            if node season_private_release.mjs; then break; fi
            if test "$attempt" -eq 3; then exit 31; fi
            sleep $((attempt*15))
          done
      - name: SHA-verify and store original player-ball XYZ on existing private branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/part"
          gh api "repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release.json"
          gh release download "gamepulse-sdk-$GID" --repo timeedmonds-maker/104 --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/part"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          target="gamepulse/fusion/materialized/igp_all_original_xyz/$GID"
          if ! test -f "$target/index.json"; then
            python3 gamepulse/fusion/igp_extract_all_original_sdk_xyz_2026.py --game-id "$GID" --archive-dir "$RUNNER_TEMP/part" --release-manifest "$RUNNER_TEMP/release.json" --out-dir "$target"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          path=Path("gamepulse/fusion/materialized/igp_all_original_xyz")/os.environ["GID"]/"index.json"
          x=json.loads(path.read_bytes())
          assert x["capture_archive_all_13_parts_verified"] and x["original_archive_part_count_verified"]==13
          assert x["physical_possessions_certified"]==0
          print("IGP_SOURCE_ONLY_FULL_NATIVE_RECOVERED",os.environ["GID"],x["original_frame_counts"]["unique_original_native_timestamps"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$target"
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -q -m "data(igp): original NBA player and ball XYZ $GID"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            sleep "$n"
          done
          exit 32
