name: IGP P4 independently heldout original Broadcast scoreboard vs NBA SDK source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p4-video-clock-blind-holdout.yml']
permissions: {contents: read}
concurrency:
  group: igp-p4-video-clock-blind-second-cohort
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: d2549d4aa6fe5985a4ae9e3de4459a03dbe91191
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public confidentiality and immutable original SDK private source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Four genuinely heldout video clock readings and companion source flag scope
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_p4_video_clock_blind_holdout_and_provenance_v1.py'
          if ! python3 gamepulse/fusion/igp_fusion_p4_video_clock_blind_holdout_and_provenance_v1.py --root . --output "$RUNNER_TEMP/blind-video-private.json" > "$RUNNER_TEMP/blind-video-private.log" 2>&1; then
            echo IGP_P4_NBA_INDEPENDENT_VIDEO_CLOCK_HOLDOUT_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'blind-video-private.log').read_text(errors='replace').splitlines()
          last=next((z for z in reversed(lines) if z.strip()),'NO_LOG')
          print('P4_INDEPENDENT_SOURCE_CLOCK_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:80])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'blind-video-private.json').read_text())
          assert q['game_id']=='0022600001'
          assert q['holdout_video_clock_labels']==4
          assert q['frozen_previous_video_clock_training_points_s']==[8.0,16.0]
          assert q['physical_ball_3D_XYZ_groundtruth_count']==0
          assert q['physical_player_ground_XY_groundtruth_count']==0
          assert not q['per_actor_NBA_original_upstream_interpolated_flag_joined']
          assert not q['physical_video_to_SDK_subsecond_absolute_clock_verified']
          assert q['independently_certified_physical_possessions']==0
          assert q['newly_accepted_tracking_positions']==0
          assert q['original_companion_position_event_source_provenance'].get('positions_show_events',0)==0
          assert q['original_XYZ_archive_release_required_for_upstream_actor_flags']
          print('IGP_P4_ORIGINAL_NBA_VIDEO_BLIND_HOLDOUT',json.dumps({
             'source_blind_video_labels':q['holdout_video_clock_labels'],
             'fresh_original_SDK_matches':q['unseen_original_SDK_source_clock_matches'],
             'source_within_1s':q['holdout_clock_consistency_1_second_count'],
             'max_candidate_offset_deviation_ms':q['max_absolute_unseen_pair_delta_ms'],
             'holdout_grade':q['source_second_holdout_status'],
             'event_level_flag_counts':q['original_companion_position_event_source_provenance'],
             'source_original_player_interpolation_unknown':True,
             'physical_XYZ_certification':False},sort_keys=True))
          PY
      - name: Save original NBA SDK heldout clock and provenance source evidence privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_p4_video_clock_blind_holdout_and_provenance_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p4-blind-video-clock "origin/$BRANCH"
          cp "$RUNNER_TEMP/blind-video-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): four blind Broadcast scoreboard time labels matched against SHA original NBA companion Time records'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P4_VIDEO_CLOCK_BLIND_HOLDOUT_PRIVATE_QA_SAVED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
