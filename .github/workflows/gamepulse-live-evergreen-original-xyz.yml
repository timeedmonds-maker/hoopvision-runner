# 2026-11-11 05:34 UTC operator live-to-final Kings 0022600215 pre-armed SDK recovery test, original XYZ SHA-private only.
name: Integrated Pulse Whistle Capture - NBA original XYZ
# 2026-11-11 US Nov 10 OKC@POR game 0022600216: source-only pregame CPU capture priority; restart current all-game source discovery immediately.
# Whistle Capture: every NBA season/date via official schedule, not fixed team/game-ID list.
# Reposition cron away from minute 00/05 and update schedule actor to recover automatic dispatch.
# Authenticated original SDK only; raw slots and XYZ only in private timeedmonds-maker/104.
# CPU-only GitHub ubuntu-24.04: no GPU or inference. Zero-XYZ produces retry failure.
# Each 5m discovery pre-arms up to 135m early and sustains an authenticated SDK observer per game
# from just before tipoff until official final + 3m or scheduled tipoff + 5h.
# Per-game concurrency queues a replacement if a capture runner fails; no postgame replay required.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  # Two independent scheduled parents can start this workflow without manual
  # dispatch. Trigger on REQUESTED rather than waiting for historical 13-part
  # recovery jobs to complete. The local schedule remains independent.
  workflow_run:
    workflows:
      - 'Game Pulse NBA all-game live-first private capture'
      - 'Integrated Pulse automatic full-fidelity every-game capture and unified index'
    types: [requested]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-live-evergreen-original-xyz.yml'
      - 'tools/licensed_feed/live_realtime_all_games.mjs'
      - 'tools/licensed_feed/live_evergreen_discovery.mjs'
      - 'tools/licensed_feed/live_evergreen_discovery.test.mjs'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      games: ${{ steps.games.outputs.games }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test original SDK code, multi-season official schedule and public-private boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          node --check tools/licensed_feed/live_realtime_all_games.mjs
          node --check tools/licensed_feed/live_evergreen_discovery.mjs
          node --test tools/licensed_feed/live_evergreen_discovery.test.mjs
      - name: Discover every active or imminent NBA game from official schedule
        id: games
        run: |
          set -euo pipefail
          node tools/licensed_feed/live_evergreen_discovery.mjs
  original-xyz:
    needs: discover
    if: needs.discover.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        game: ${{ fromJSON(needs.discover.outputs.games) }}
    concurrency:
      group: igp-evergreen-live-original-${{ matrix.game.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        if: matrix.game.id != 'none'
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        if: matrix.game.id != 'none'
        with: {node-version: '22'}
      - name: Require authorized private repository
        if: matrix.game.id != 'none'
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Install existing licensed NBA SDK on CPU without scripts
        if: matrix.game.id != 'none'
        working-directory: tools/licensed_feed
        run: |
          set -euo pipefail
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Save original player-ball XYZ to private Git with remote SHA readback
        if: matrix.game.id != 'none'
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_LIVE_ID: ${{ matrix.game.id }}
          GAMEPULSE_LIVE_TIPOFF: ${{ matrix.game.tipoff }}
          IGP_REALTIME_CAPTURE_MS: '18300000'
          IGP_REALTIME_LIVE_STOP_MS: '18000000'
          IGP_REALTIME_PRETIPOFF_WAIT_MS: '8400000'
          IGP_REALTIME_FLUSH_MS: '30000'
        run: |
          set -euo pipefail
          node live_realtime_all_games.mjs
      - name: Do not certify full game from partial source
        if: always() && matrix.game.id != 'none'
        run: |
          echo 'Only authentic private NBA SDK original slots; check remote SHA and both player/ball timestamp counts. No GPU, no inferred tracking.' >> "$GITHUB_STEP_SUMMARY"

  final-whistle-xyz:
    # Extended original source window: allow 19min post-FINAL to recover all 13
    # legitimate SDK partitions while access remains available. No GPU.
    # Independent of the prearmed live SDK job. Kings 0022600215 proved
    # original player+ball XYZ can be recovered by a FRESH final-state SDK.
    needs: discover
    if: needs.discover.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        game: ${{ fromJSON(needs.discover.outputs.games) }}
    concurrency:
      group: igp-evergreen-final-whistle-v3-${{ matrix.game.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        if: matrix.game.id != 'none'
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        if: matrix.game.id != 'none'
        with: {node-version: '22'}
      - name: Validate final-watcher and licensed source boundaries
        if: matrix.game.id != 'none'
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          node --check tools/licensed_feed/live_evergreen_discovery.mjs
          node --check tools/licensed_feed/live_realtime_all_games.mjs
          node --test tools/licensed_feed/live_evergreen_discovery.test.mjs
      - name: Validate private original-source destination
        if: matrix.game.id != 'none'
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Prepare licensed SDK before observing FINAL
        if: matrix.game.id != 'none'
        working-directory: tools/licensed_feed
        run: |
          set -euo pipefail
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Watch exact NBA game FINAL; launch fresh authorised SDK immediately
        if: matrix.game.id != 'none'
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_LIVE_ID: ${{ matrix.game.id }}
          GAMEPULSE_LIVE_TIPOFF: ${{ matrix.game.tipoff }}
          IGP_REALTIME_CAPTURE_MS: '1140000'
          IGP_REALTIME_LIVE_STOP_MS: '21000000'
          IGP_REALTIME_PRETIPOFF_WAIT_MS: '0'
          IGP_REALTIME_FLUSH_MS: '20000'
        run: |
          set -euo pipefail
          node live_evergreen_discovery.mjs --watch-final
          echo IGP_EVERGREEN_FRESH_FINAL_XYZ_CAPTURE_ATTEMPT_COMPLETE
      - name: Report scope of completion-triggered capture
        if: always() && matrix.game.id != 'none'
        run: |
          echo 'Fresh SDK is launched only following official exact-game status 3. Licensed original XYZ is SHA-checked in private 104; no invented positions, no GPU, no claim of complete-game capture without separate QA.' >> "$GITHUB_STEP_SUMMARY"
