name: IGP 71 final Blueprint and original-source acceptance
on:
  push:
    paths:
      - .github/workflows/gamepulse-igp-71-final-blueprint-aggregate-readback.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no private data is present in public repository
        run: python3 tools/public_content_guard.py
      - name: Private 71-game Blueprint aggregate and native source QA
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27 scripts
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion:scripts
          python3 scripts/build_nba_blueprint_2026_27.py
          python3 - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          root=Path("."); base=root/"gamepulse/fusion"
          b=root/"data/extensions/nba_blueprint_2026_27"
          report=json.loads((b/"season_to_date/integration_qa.json").read_bytes())
          assert report["game_count"]==71 and report["shot_rows"]==11664
          assert len(report["exact_identical_original_source_duplicate_shot_events"])==4
          ids=("0022600144","0022600145","0022600146")
          assert set(ids)<=set(report["game_ids"])
          index=json.loads((base/"materialized/igp_2026_27_unified_season_v3/index.json").read_bytes())
          extra=json.loads((root/index["post56_additive_oct28"]["index"]).read_bytes())
          qa=json.loads((base/"qa/igp_progress_20261030/igp_71_new3_official_ten_scene_possession_ab_v1.json").read_bytes())
          assert index["total_indexed_games_including_additive"]==71
          assert len(index["per_game_model"])==56 and len(extra["games"])==15
          assert qa["population_games"]==71 and qa["evaluated_games"]==3
          assert qa["counts"]["official_lineup_source_verified"]==3
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          native_total=0
          for gid in ids:
            e=extra["games"][gid]
            g=e["source_capture_grades"]
            assert [g[k] for k in ("official_nba_pbp_box","original_native_xyz","original_companion","original_nba_blueprint","official_logical_chains")]==["SHA_VERIFIED","SHA_FULL_13PART","COMPLETE_ORIGINAL_RESPONSE","SOURCE_SHA_ACCEPTED","SHA_VERIFIED"]
            p=base/"materialized/igp_all_original_xyz"/gid/"index.json"
            native=json.loads(p.read_bytes())
            assert native["capture_archive_all_13_parts_verified"] and native["original_archive_part_count_verified"]==13
            q=qa["per_game"][gid]
            assert digest(p)==q["native_source_manifest_sha256"]
            assert digest(base/"official_pbp_timing/games"/(gid+".json"))==q["official_PBP_sha256"]
            assert digest(root/q["path"])==q["sha256"]
            chains=json.loads(gzip.decompress((root/q["path"]).read_bytes()))
            assert len(chains["logical_chains"])==e["nba_logical_chain_count"]
            assert digest(root/e["published_blueprint_shot_report"])==e["published_blueprint_original_sha256"]
            native_total+=native["original_frame_counts"]["unique_original_native_timestamps"]
          assert native_total==95402
          print("IGP_71_FINAL_SOURCE_BLUEPRINT_SHA_VERIFIED",71,95402,628,11664)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/extensions/nba_blueprint_2026_27/season_to_date
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_71_BLUEPRINT_AGGREGATE_ALREADY_CURRENT; exit 0; fi
          git commit -q -m 'data(igp): accept 71-game season Blueprint aggregate and source-duplicate QA'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_71_BLUEPRINT_AGGREGATE_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 23
