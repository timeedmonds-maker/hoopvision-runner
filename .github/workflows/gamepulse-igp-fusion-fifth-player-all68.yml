name: IGP Fusion v3.1 official fifth player original native all68 QA
# Guard-reviewed aggregate-only source QA; pinned private research commit, source coordinates private.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-fusion-fifth-player-all68.yml']
permissions: {contents: read}
concurrency:
  group: igp-fusion-fifth-player-all68
  cancel-in-progress: false
jobs:
  official-fifth:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 4b4e9e5cacebf14ccbc91782a6af8ec41d6e0aa5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private source exact commit and public content guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free fifth player tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_fifth_player_v1.py'
      - name: SHA verified original NBA 68-game native census
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_fifth_player_all68_census_v1.py \
              --root . --output "$RUNNER_TEMP/igp-fifth-private.json" \
              > "$RUNNER_TEMP/igp-fifth-private.log" 2>&1; then
            echo IGP_FIFTH_ALL68_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'igp-fifth-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('IGP_FIFTH_REDACTED_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:90])
          print('IGP_FIFTH_GAMES_FINISHED',sum(x.startswith('IGP_FIFTH_SAFE_GAME') for x in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-fifth-private.json').read_text())
          t=j['counts']
          assert t['games']==68 and t['all_original_native_timestamps']==2280600
          assert t['inside_verified_paired_lineup']==867735
          assert j['new_XYZ_positions']==0 and j['new_accepted_complete_ten_ball_scenes']==0
          assert j['original_NBA_source_and_PBP_unchanged']
          print('IGP_FIFTH_ALL68_AGGREGATE',json.dumps(t,sort_keys=True))
          PY
      - name: Commit private aggregate QA without public coordinates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_fifth_player_all68_census_v2.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B fifth-player-all68 "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-fifth-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_FIFTH_QA_ALREADY_COMMITTED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): source-backed 68-game official fifth identity-only native census'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_FIFTH_ALL68_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
