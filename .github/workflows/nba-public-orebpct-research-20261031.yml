name: Public NBA official team offensive rebounding research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-public-orebpct-research-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: nba-public-orebpct-research-20261031
  cancel-in-progress: false
jobs:
  official:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Retrieve public official NBA sources only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,datetime,concurrent.futures
          params={'LeagueID':'00','Season':'2026-27','SeasonType':'Regular Season','MeasureType':'Advanced','PerMode':'Totals','LastNGames':0,'Month':0,'OpponentTeamID':0,'PaceAdjust':'N','PlusMinus':'N','Rank':'N','Period':0,'TeamID':0,'DateFrom':'10/20/2026','DateTo':'10/29/2026','Conference':'','Division':'','GameScope':'','GameSegment':'','Location':'','Outcome':'','PlayerExperience':'','PlayerPosition':'','SeasonSegment':'','StarterBench':'','VsConference':'','VsDivision':''}
          urls=[('advanced','https://stats.nba.com/stats/leaguedashteamstats?'+urllib.parse.urlencode(params)),('glossary','https://www.nba.com/stats/help/glossary'),('schedule','https://cdn.nba.com/static/json/staticData/scheduleLeagueV2_1.json')]
          def run(item):
            name,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.nba.com/','Origin':'https://www.nba.com','Accept':'application/json, text/plain, */*'})
              with urllib.request.urlopen(req,timeout=75) as r:raw=r.read()
              out={'name':name,'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'fetched_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              if name=='advanced':out['response']=json.loads(raw)
              elif name=='glossary':
                text=raw.decode();i=text.find('Offensive Rebounding Percentage');out['excerpt']=text[max(0,i-300):i+1700]
              else:
                d=json.loads(raw);out['leagueSchedule_seasonYear']=d.get('leagueSchedule',{}).get('seasonYear')
              print('PUBLIC_NBA_SOURCE '+json.dumps(out,separators=(',',':')),flush=True)
            except Exception as e:print('PUBLIC_NBA_ERROR '+json.dumps({'name':name,'url':url,'error':str(e)}),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(run,urls))
          PY
