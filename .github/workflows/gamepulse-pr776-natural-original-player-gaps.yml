name: PR776 actual natural Game Pulse actor position gaps 36 games
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-natural-original-player-gaps.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: igp-real-natural-actor-gaps-36
  cancel-in-progress: false
jobs:
  qa:
    name: SHA-verified genuine direct SDK gaps, no synthetic masks
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public content; hydrate only private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH"             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Run original-source natural-gap logic tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -s gamepulse/fusion/tests             -p test_igp_tracking_original_natural_gap_atlas_2026.py -v
      - name: Audit actual unmasked player observations across full 36 games
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_natural_source_player_gaps_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_tracking_original_natural_gap_atlas_2026.py --root . --out "$OUT" > "$RUNNER_TEMP/gaps.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["games_evaluated"]==36 and x["source_original_XYZ_immutable"]
          s=x["aggregate_counts"]
          assert s["original_source_timestamps"]==1203986
          assert s["strict_direct_player_slots"]+s["strict_missing_player_slots"]==s["strict_official_player_slots"]
          for k in ("strict_source_timestamps","source_pairs_gt_5sec","source_gt_5sec_with_dense_intervening_native_frames",
                     "direct_player_observation_pairs","raw_keyframe_variants_at_multiple_timestamps"):
              print("ORIGINAL_SDK_NATURAL_GAPS",k,s.get(k,0))
          print("ORIGINAL_SDK_NATURAL_GAP_BINS",json.dumps(x["natural_direct_gap_bins_strict"],sort_keys=True))
          PY
      - name: Publish only derived private QA aggregates, no original coordinates
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_natural_source_player_gaps_36_v1.json
          git config user.name "Game Pulse Free CPU QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): count actual natural source player gaps over 36 games"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo ORIGINAL_36_GAME_NATURAL_GAP_QA_PRIVATE_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
