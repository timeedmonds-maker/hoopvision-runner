name: IGP P3 real incomplete scenes one sided shadow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-fourgame-one-sided-shadow-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p3-real-one-sided-shadow
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: e7142acb618eba2ca3ebfe8884f1d7f7fac09c9f
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Review public guard and pin original private NBA SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free tests and four-game real missing scene census
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_one_sided_scene_shadow_v1.py'
          python3 gamepulse/fusion/igp_68_p3_one_sided_scene_shadow_safe_v1.py --root . --output "$RUNNER_TEMP/p3-shadow.json" > "$RUNNER_TEMP/p3-shadow-private.log" 2>&1 || {
            echo P3_FOUR_GAME_SHADOW_QA_FAILED
            tail -n 12 "$RUNNER_TEMP/p3-shadow-private.log"
            exit 41
          }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'p3-shadow.json').read_text())
          assert len(j["per_game"])==4 and j["do_not_add_shadow_candidates_to_complete_scene_numerator"]
          expected={"0022600006":(3904,3639,15832,6798),
                    "0022600111":(4040,3486,14812,6544),
                    "0022600086":(4776,4421,13824,8184),
                    "0022600122":(9863,5819,19788,10742)}
          for gid,(n,nc,g,gc) in expected.items():
            row=j["per_game"][gid]
            assert row["native"]["live_samples"]==n
            assert row["native"]["control_complete"]==nc
            assert row["continuous_10hz"]["live_samples"]==g
            assert row["continuous_10hz"]["control_complete"]==gc
          print("P3_ORIGINAL_SOURCE_SHADOW_AGGREGATE",json.dumps(j["four_game_totals"],sort_keys=True))
          PY
      - name: Save original NBA source shadow evidence only in private GitHub
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_fourgame_one_sided_shadow_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B shadow "origin/$BRANCH"
          cp "$RUNNER_TEMP/p3-shadow.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): source-backed P3 actual incomplete scenes one-sided shadow'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo P3_ORIGINAL_SOURCE_SHADOW_RECEIPT_SAVED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
