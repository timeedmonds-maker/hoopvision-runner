# Security reviewed: original NBA SDK XYZ and screen-video pixels remain PRIVATE.
# Public workflow logs only game IDs, source counts and aggregate positional errors.
name: IGP MEM POR 0146 P3 vs P2B source blackout experiment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-p2b-0146-source-shadow.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-p3-p2b-0146-20261031
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-v32-p3-paired-10hz-20261031
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify privacy allowlist and sparse clone private original NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Run frozen P2B vs P3 source-free regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p3_p2b_paired_shadow_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p3_p2b_paired_shadow_v1.py'
          echo P3_P2B_SOURCEFREE_QA_PASSED
      - name: Compare current exact P2B with peer-context model on original MEM POR and two others
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p3_p2b_paired_shadow_v1.py \
            --root . --games 0022600144,0022600145,0022600146 \
            --holdout-limit 64 --out "$RUNNER_TEMP/p3-p2b-0146-private-qa.json" \
            > "$RUNNER_TEMP/p3-p2b-0146-private.log" 2>&1 || {
              echo P3_P2B_0146_ORIGINAL_SHA_QA_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"p3-p2b-0146-private.log").read_text(errors="replace").splitlines()
          err=next((x for x in reversed(lines) if re.match(r"^(?:RuntimeError|AssertionError|ValueError|KeyError|TypeError|FileNotFoundError|ImportError):",x)),"UNKNOWN")
          print("P3_PRIVATE_REDACTED_ERROR",re.sub(r"\d{4,}","[REDACTED]",err)[:180])
          PY
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"p3-p2b-0146-private-qa.json"
          d=json.loads(p.read_bytes())
          assert d["games_evaluated"]==3
          assert d["fixed_P2B_71_denominator"]==1159651
          assert d["frozen_P2B_complete_71"]==1015072
          assert d["original_source_and_PBP_immutable"]
          assert d["production_new_scenes"]==0
          assert len(d["source_masked_holdouts_new3"])==3
          print("P3_P2B_MEM_POR_SOURCE_RESEARCH_QA",json.dumps({
            "games":d["games_evaluated"],
            "new_research_candidates_3games":d["p3_shadow_increment_not_promoted"],
            "missing_pattern":{k:v for k,v in d["shadow_counts"].items()
               if k in ("remaining_incomplete","ball_unavailable","two_plus_missing_players","exact_nine_plus_ball","P3_shadow_new_complete_scene")},
            "masked_test":{gid:data["errors"] for gid,data in d["source_masked_holdouts_new3"].items()},
            "model":d["release_decision"]
          },sort_keys=True))
          PY
      - name: Commit immutable original-SHA aggregate and private full metrics
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_p3_p2b_0144_0145_0146_source_paired_shadow_v1.json
          test ! -f "$dest"
          cp "$RUNNER_TEMP/p3-p2b-0146-private-qa.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): original MEM POR P3-vs-P2B source-masked 3game shadow'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo P3_P2B_ORIGINAL_0146_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 44
