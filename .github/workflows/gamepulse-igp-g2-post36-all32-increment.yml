name: IGP G2 post36 original NBA 32 game PBP official lineup incremental census
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g2-post36-all32-increment.yml']
permissions: {contents: read}
concurrency:
  group: igp-post36-32-official-boxscore-pbp-long-sub-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: d3089b5bd47574ff9f547ea61d138a773d779431
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Original NBA source private confidentiality and exact research SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free post36 NBA official starter and substitution replay guards
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g2_post36_nba_replay_v1.py'
      - name: Real NBA SHA all32 post36 source and official long/sub gains excluding prior 266165
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_g2_post36_all32_incremental_census_v1.py \
             --root . --output "$RUNNER_TEMP/igp-post36-32-qa-private.json" \
             > "$RUNNER_TEMP/igp-post36-32-qa-private.log" 2>&1; then
            echo IGP_POST36_FULL32_ORIGINAL_NBA_SOURCE_QA_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          z=(Path(os.environ['RUNNER_TEMP'])/'igp-post36-32-qa-private.log').read_text(errors='replace').splitlines()
          last=next((v for v in reversed(z) if v.strip()),'NO_LOG')
          print('IGP_POST36_SOURCE_SAFE_FAILURE',re.sub(r'[^A-Za-z_]','_',last)[:100])
          print('IGP_POST36_COMPLETED_GAMES',sum(x.startswith('IGP_G2_POST36_ORIGINAL_NBA_GAME') for x in z))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-post36-32-qa-private.json').read_text())
          c=q['totals']
          assert q['game_count']==32 and len(q['per_game'])==32
          assert c['games']==32
          assert q['previous_G2_68_additive_candidate_native_frames']==266165
          assert 266165<q['all_G2_68_nonoverlap_candidate_native_frames']<=1412865
          assert q['remaining_outside_strict_and_G2_68_native_frames']>=0
          assert q['newly_accepted_tracking_scene_delta']==0
          assert c['unified_Fusion_v31_native_G2_readbacks_verified']>=32
          assert q['independent_physical_possessions_certified']==0
          assert q['existing_NBA_historical_hybrid_source_unmodified']
          print('IGP_POST36_32_GAIN_SOURCE_AGGREGATE',json.dumps({
            'new_32_NBA_official_roster_candidate_native':q['new_additive_post36_long_sub_nonoverlap_frames'],
            'new_32_source_direct_ten_plus_ball':q['post36_new_candidate_direct_official_ten_ball_source_frames'],
            'new_32_conflicts_abstained':q['post36_new_candidate_source_actor_conflict_abstains'],
            'total_original68_G2_candidate_native':q['all_G2_68_nonoverlap_candidate_native_frames'],
            'new_32_long_native':c['new_long_native'],
            'new_32_sub_native':c['new_sub_native'],
            'overlap_old_short_not_double_counted':c.get('already_new_short_bridge_native_overlap',0),
            'new_physically_certified':0,'production_promotions':0},sort_keys=True))
          PY
      - name: Persist only original NBA SHA verified 32 game results privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g2_post36_32_original_long_sub_increment_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B igp-post36-32 "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-post36-32-qa-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_POST36_32_QA_ALREADY_IDENTICAL
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original NBA32 verified boxscore/PBP long/sub evidence incremental G2 source gains'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_POST36_32_G2_ORIGINAL_NBA_SOURCE_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
