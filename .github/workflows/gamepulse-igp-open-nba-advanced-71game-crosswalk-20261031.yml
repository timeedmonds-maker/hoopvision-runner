# Public orchestration only; original official NBA PBP/IGP records and QA stay private.
name: IGP NBA open advanced team Off Def Net and possession 71game SHA crosswalk
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-open-nba-advanced-71game-crosswalk-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-nba-public-mirror-source-advanced-71game
  cancel-in-progress: false
jobs:
  all71-original-pbp-vs-open-official-stats-mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-71-nba-stats-mirror-team-poss-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Full original-source, mirror scheme and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
             https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m pip -q install duckdb
          python3 -m py_compile gamepulse/fusion/igp_v32_71_nba_game_advanced_mirror_reconcile_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_71_nba_game_advanced_mirror_reconcile_v1.py'
          echo IGP_NBA_PUBLIC_TEAM_ADVANCED_MIRROR_SOURCEFREE_TESTS_PASS
          python3 - <<'PY'
          import urllib.request,os,hashlib
          from pathlib import Path
          u="https://basketball-data.billmill.org/nba/stats/team_game_logs/season=2027/data.parquet"
          req=urllib.request.Request(u,headers={"User-Agent":"IGP-2027-NBA-advanced-source-audit/1.0"})
          with urllib.request.urlopen(req,timeout=25) as r:
            assert r.status==200
            content=r.read(10000001)
          assert len(content)<10000000 and content[:4]==b"PAR1" and content[-4:]==b"PAR1"
          (Path(os.environ["RUNNER_TEMP"])/"nba-2027-team-advanced-original-mirror.parquet").write_bytes(content)
          print("IGP_NBA_PUBLIC_ADVANCED_SHA",hashlib.sha256(content).hexdigest(),"BYTES",len(content))
          PY
      - name: Reconcile every source-backed 2026-27 game, score and NBA team possessions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_71_nba_game_advanced_mirror_reconcile_v1.py \
            --root . --mirror-parquet "$RUNNER_TEMP/nba-2027-team-advanced-original-mirror.parquet" \
            --out "$RUNNER_TEMP/igp-nba-2027-all71-advanced-mirror-qa.json" \
            > "$RUNNER_TEMP/igp-nba-2027-all71-advanced-mirror-qa.log" 2>&1 || {
              echo IGP_NBA_MIRROR_71_ORIGINAL_SOURCE_AUDIT_FAILED
              python3 - <<'PY'
          from pathlib import Path
          import os,re
          lines=(Path(os.environ["RUNNER_TEMP"])/"igp-nba-2027-all71-advanced-mirror-qa.log").read_text(errors="replace").splitlines()
          v=next((x for x in reversed(lines) if re.match(r"^(?:ValueError|KeyError|TypeError|AssertionError):",x)),None)
          if v:
            name,_,detail=v.partition(":")
            code=detail.strip().split(":",1)[0].split(" ",1)[0]
            print("IGP_PUBLIC_NBA_ADVANCED_PRIVATE_SOURCE_FAILURE",name,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_PUBLIC_NBA_ADVANCED_PRIVATE_SOURCE_FAILURE UNCLASSIFIED")
          PY
              exit 42
            }
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-nba-2027-all71-advanced-mirror-qa.json").read_bytes())
          c=q["counts"]
          assert c["games"]==71 and c["team_games"]==142 and c["IGP_logical_chains"]==14612
          print("IGP_NBA_STATS_MIRROR_TEAM_ADVANCED_ALL71_SOURCE_RECONCILIATION",json.dumps(c,sort_keys=True))
          if c["source_mirror_team_joined"]<142:
            print("IGP_NBA_PUBLIC_ADVANCED_MIRROR_INCOMPLETE_GAME_JOIN",142-c["source_mirror_team_joined"])
          else:print("IGP_NBA_PUBLIC_ADVANCED_ALL142_TEAM_GAMES_JOINED")
          if c["official_PBP_score_matches_mirror"]<c["source_mirror_team_joined"]:
            print("IGP_NBA_OFFICIAL_PBP_VS_MIRROR_SCORE_DIFFS_PRESENT")
          print("IGP_NBA_MIRROR_OFFRTG_DEFRTG_NETRTG_AND_POSS_QA_SOURCE_COMPLETE")
          PY
      - name: Commit only SHA source-manifest and private aggregate/event reconciliation, preserve original tracking
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_71_nba_stats_open_2027_team_advanced_possession_reconciliation_v1.json
          mkdir -p "$(dirname "$dest")"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/igp-nba-2027-all71-advanced-mirror-qa.json" "$dest"
            echo IGP_NBA_MIRROR_71_QA_PREVIOUS_SHA_MATCH
            exit 0
          fi
          cp "$RUNNER_TEMP/igp-nba-2027-all71-advanced-mirror-qa.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): source verified 71 game NBA advanced open mirror OFF DEF NET POSS and official PBP/chain reconciliation'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 44
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_NBA_OPEN_ADVANCED_MIRROR_71_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 45
