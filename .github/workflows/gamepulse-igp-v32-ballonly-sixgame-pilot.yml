# Source-private NBA 71 GamePulse V2 ball-only 10Hz shadow candidate.
# V2 exploratory six-game cohort; original licensed player/ball XYZ never emitted.
name: IGP 3.2 V2 ball-only sixgame speed source masked pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-ballonly-sixgame-pilot.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-ballonly-sixgame-sourceqa
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      PILOT: 0022600006,0022600092,0022600113,0022600122,0022600123,0022600132
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and private original source clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_ball_only_speed_gate_shadow_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_ball_only_speed_gate_shadow_v1.py'
      - name: Run six private NBA source games — exact 71 frozen clock/roster
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_ball_only_speed_gate_shadow_v1.py \
            --root . --games "$PILOT" --holdout-max-per-game 300 \
            --output "$RUNNER_TEMP/igp-v32-sixball.json" >"$RUNNER_TEMP/v32-ball-private.log" 2>&1 || {
              echo IGP_V32_BALL_ONLY_PRIVATE_SOURCE_OR_UNIT_QA_FAILED
              exit 51
            }
          grep '^IGP_V32_SHADOW_BALL_COMPLETE' "$RUNNER_TEMP/v32-ball-private.log" || true
      - name: Commit pilot research result PRIVATE only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_ballonly_sixgame_source_mask_shadow_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v32ball "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-v32-sixball.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet; then echo V32_BALL_PILOT_ALREADY_SAVED;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): sixgame 10Hz ball speed-only shadow with withheld original accuracy'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then
              echo IGP_V32_BALL_ONLY_PILOT_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 52
