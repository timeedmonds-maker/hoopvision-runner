name: IPPT acquire missing Oct27 original NBA Blueprint shot reports privately
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-oct27-blueprint-backfill.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        gid: ['0022600128','0022600130','0022600131']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/ippt-event-snapshots-separate-20261028
      GID: ${{ matrix.gid }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Acquire official public original into the private research branch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/ippt"
          cd "$RUNNER_TEMP/ippt"
          git sparse-checkout set scripts data/extensions/nba_blueprint_2026_27 gamepulse/fusion/qa
          PYTHONPATH=scripts python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from update_nba_blueprint_daily_2026_27 import read_report,canonical,BASE
          gid=os.environ["GID"]
          target=BASE/"games"/gid/"blueprint_report_raw.json"
          report,upstream=read_report(gid)
          assert report["game_header"]["gameId"]==gid,"NBA_BLUEPRINT_ID_MISMATCH"
          shots=report["shot_difficulty"]["shotDifficulty"]
          assert isinstance(shots,list) and len(shots)>0,"NBA_BLUEPRINT_SHOT_SOURCE_EMPTY"
          payload=canonical(report)
          if target.exists():
              assert target.read_text()==payload,"NBA_BLUEPRINT_ORIGINAL_REVISION_REQUIRES_VERSIONED_AUDIT"
          else:
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(payload)
          receipt={"schema":"igp.original-blueprint-oct27-shot-acquisition.v1",
                   "game_id":gid,"source":"NBA_INSIDE_THE_GAME_BLUEPRINT",
                   "original_report_sha256":hashlib.sha256(payload.encode()).hexdigest(),
                   "original_html_sha256":upstream["html_sha256"],
                   "original_shot_rows":len(shots),
                   "shot_xfg_rows":sum(s.get("expFieldGoalPct") is not None for s in shots),
                   "shot_defender_rows":sum(bool(s.get("defender")) for s in shots),
                   "raw_tracking_pose_29_joint_obtained":False,
                   "companion_full_event_feed_obtained":False}
          path=Path("gamepulse/fusion/qa/igp_progress_20261029")/("igp_blueprint_original_"+gid+".json")
          path.parent.mkdir(parents=True,exist_ok=True)
          if path.exists():assert json.loads(path.read_text())==receipt,"BLUEPRINT_QA_REGRESSION"
          else:path.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\\n")
          print("IGP_OFFICIAL_BLUEPRINT_SOURCE_CAPTURE",gid,len(shots),receipt["shot_xfg_rows"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "data/extensions/nba_blueprint_2026_27/games/$GID/blueprint_report_raw.json" "gamepulse/fusion/qa/igp_progress_20261029/igp_blueprint_original_$GID.json"
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_BLUEPRINT_SOURCE_ALREADY_CURRENT; exit 0; fi
          git commit -q -m "data(ippt): preserve original NBA Blueprint shot report $GID"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo IGP_BLUEPRINT_PRIVATE_SOURCE_COMMITTED; exit 0; fi
            sleep "$n"
          done
          exit 23
