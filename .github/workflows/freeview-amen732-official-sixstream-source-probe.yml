name: Amen732 official six camera source availability probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/freeview-amen732-official-sixstream-source-probe.yml
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - name: Check official six streams without exposing signed media addresses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,html
          URL='https://clips.nba.com/?gameNo=0022600009&eventNum=732&source=grs'
          HEADERS={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/122 Safari/537.36','Referer':'https://clips.nba.com/'}
          def get(u):
            req=urllib.request.Request(u,headers=HEADERS)
            with urllib.request.urlopen(req,timeout=25) as response:
              return response.read(8192 if '.m3u8' in u else 1000000)
          source=get(URL).decode('utf8','replace')
          options={}
          for m in re.finditer(r'<option\s+value="([^"]+)"([^>]*)>(.*?)</option>',source,flags=re.I|re.S):
            u=html.unescape(m.group(1).strip())
            label=re.sub(r'<[^>]+>','',html.unescape(m.group(3))).strip()
            if '.m3u8' in u.lower() and 'lrmedia.nba.com' in u.lower():options[label]=u
          wanted=['Broadcast','High Tight','Left Above Rim','Right Above Rim','Left Slash','Right Slash']
          missing=[x for x in wanted if x not in options]
          print('SOURCE_CAMERA_OPTION_LABELS',','.join(sorted(options)))
          if missing:raise RuntimeError('OFFICIAL_CAMERA_OPTIONS_MISSING:'+','.join(missing))
          ready=[]
          for x in wanted:
            try:
              playlist=get(options[x]).decode('utf8','replace')
              if '#EXTM3U' not in playlist:raise RuntimeError('NOT_HLS')
              ready.append(x)
            except Exception as e:
              print('SOURCE_PLAYLIST_UNAVAILABLE',x,type(e).__name__)
          print('OFFICIAL_NATIVE_SIX_PLAYLISTS_READABLE',len(ready))
          if len(ready)!=6:raise SystemExit('NBA_SOURCE_UNAVAILABLE_OR_TOKEN_EXPIRED')
          print('PUBLIC_RUNNER_OFFICIAL_SIX_CAMERA_DIRECT_ROUTE_PASS')
          PY
