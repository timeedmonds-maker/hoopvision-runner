name: Amen 732 world-camera Right Above Rim source calibration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-right-above-rim-metric.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: amen732-stationary-right-above-rim-metric
  cancel-in-progress: false
jobs:
  original-metric:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and private original court image via Git
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo AMEN732_RIGHT_ABOVE_RIM_WORLD_SOURCE_PRIVATE_GIT_PASS
      - name: Fit NBA Game Pulse court world in the verified stationary third view
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            numpy==1.26.4 scipy==1.14.1 opencv-python-headless==4.10.0.84
          cd "$RUNNER_TEMP/source"
          python3 hoopvision/freeview/amen732_stationary_right_above_rim_metric_calibration.py --selftest
          python3 hoopvision/freeview/amen732_stationary_right_above_rim_metric_calibration.py \
            --root hoopvision/freeview/fixtures \
            --source hoopvision/freeview/fixtures/amen732-native-right-above-rim-f231.jpg \
            --lineqa hoopvision/freeview/fixtures/amen732_right_above_rim_original_static_court_QA_20261026.json \
            --out hoopvision/freeview/fixtures/amen732_right_above_rim_world_camera_trial_20261026.json \
            --imgout hoopvision/freeview/fixtures/amen732_right_above_rim_world_camera_overlay_UHD_20261026.jpg
          python3 - <<'PY'
          import json
          p='hoopvision/freeview/fixtures/amen732_right_above_rim_world_camera_trial_20261026.json'
          d=json.load(open(p))
          assert d['source_original_nba_git_blob_sha']=='87e312b199ea6825d19f3f962b35fd6aab295271'
          assert not d['physical_NBA_source_KRt_certified']
          assert not d['first_hand_ball_contact_certified']
          assert not d['0_25_degree_source_supported_UHD_certified']
          print("AMEN732_WORLD_NBA_CAMERA_REAL_IMAGE_HELDOUT",
             d['original_native_training_p95_px'],d['independent_heldout_rim_error_px'],
             d['camera_model']['focal_length_px'])
          PY
      - name: Independently inspect real stationary basket pixel candidates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python3 hoopvision/freeview/amen732_right_above_rim_real_hoop_pixels.py --selftest
          python3 hoopvision/freeview/amen732_right_above_rim_real_hoop_pixels.py \
            --root hoopvision/freeview/fixtures \
            --out hoopvision/freeview/fixtures/amen732_right_above_rim_stationary_hoop_source_QA_20261026.json \
            --uhd hoopvision/freeview/fixtures/amen732_right_above_rim_stationary_hoop_UHD_20261026.jpg
          python3 - <<'PY'
          import json
          q=json.load(open('hoopvision/freeview/fixtures/amen732_right_above_rim_stationary_hoop_source_QA_20261026.json'))
          assert not q["candidate_visual_hoop_identity_verified"]
          assert not q["source_court_metric_KRt_verified"]
          print("AMEN732_INDEPENDENT_HOOP_RGB_COLOUR_SOURCE_AGGREGATES",q["matched_component_count"])
          PY
      - name: Independent physical NBA 3PT arc heldout in original source images
        # Compare multiple Canny thresholds and independent fixed-shift controls; do not optimize camera from this arc.
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python3 hoopvision/freeview/amen732_right_above_rim_three_point_arc_holdout.py --selftest
          python3 hoopvision/freeview/amen732_right_above_rim_three_point_arc_holdout.py \
            --root hoopvision/freeview/fixtures \
            --camera hoopvision/freeview/fixtures/amen732_right_above_rim_world_camera_trial_20261026.json \
            --out hoopvision/freeview/fixtures/amen732_right_above_rim_3pt_arc_source_holdout_20261026.json \
            --uhd hoopvision/freeview/fixtures/amen732_right_above_rim_3pt_arc_UHD_20261026.jpg
          python3 - <<'PY'
          import json
          j=json.load(open('hoopvision/freeview/fixtures/amen732_right_above_rim_3pt_arc_source_holdout_20261026.json'))
          assert j['camera_fit_has_NOT_used_three_point_arc']
          assert not j['current_metric_camera_certified']
          assert not j['first_hand_ball_contact_certified']
          print('AMEN732_REAL_SOURCE_3PT_ARC_INDEPENDENT_RESULTS',
                j['curve_samples']['true_untrained_curve'],
                'beats_20px_negative_controls=',j['true_curve_beats_all_20px_shifts'])
          PY
      - name: Correct Canny painted-line width and test contrast specificity against 12 shifted controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python3 hoopvision/freeview/amen732_3pt_arc_detector_specificity.py --selftest
          python3 hoopvision/freeview/amen732_3pt_arc_detector_specificity.py \
            --root hoopvision/freeview/fixtures \
            --camera hoopvision/freeview/fixtures/amen732_right_above_rim_world_camera_trial_20261026.json \
            --out hoopvision/freeview/fixtures/amen732_3pt_arc_detector_specificity_20261026.json
          python3 - <<'PY'
          import json
          j=json.load(open('hoopvision/freeview/fixtures/amen732_3pt_arc_detector_specificity_20261026.json'))
          assert not j["camera_KRt_certified"]
          assert not j["physical_first_hand_ball_touch_certified"]
          print("AMEN732_SOURCE_REAL_ARC_DETECTOR_SPECIFICITY_RESULT",j["discriminative_settings"])
          PY
      - name: Preserve source-only original NBA geometry results privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          git config user.name 'HoopVision original source CPU'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_3pt_arc_detector_specificity_20261026.preview.jpg \
            hoopvision/freeview/fixtures/amen732_3pt_arc_detector_specificity_20261026.json \
            hoopvision/freeview/fixtures/amen732_right_above_rim_3pt_arc_source_holdout_20261026.json \
            hoopvision/freeview/fixtures/amen732_right_above_rim_3pt_arc_UHD_20261026.jpg \
            hoopvision/freeview/fixtures/amen732_right_above_rim_world_camera_trial_20261026.json \
            hoopvision/freeview/fixtures/amen732_right_above_rim_world_camera_overlay_UHD_20261026.jpg \
            hoopvision/freeview/fixtures/amen732_right_above_rim_stationary_hoop_source_QA_20261026.json \
            hoopvision/freeview/fixtures/amen732_right_above_rim_stationary_hoop_UHD_20261026.jpg
          git diff --cached --check
          git commit -qm 'qa(freeview): NBA source-world stable court-camera pose trial with withheld rim and UHD QA'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_RIGHT_ABOVE_RIM_WORLD_KRT_RESEARCH_QA_PRIVATE_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
