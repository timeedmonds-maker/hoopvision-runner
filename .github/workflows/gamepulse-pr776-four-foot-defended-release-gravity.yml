name: PR776 four-foot contested release and NBA perimeter Gravity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-four-foot-defended-release-gravity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-defender-within-six-feet-release
  cancel-in-progress: false
jobs:
  private-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm confidential source and clone accepted private SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          # Previous accepted QA fixes private repository identity; Git authentication
          # plus source SQLite SHA and census below enforce access without API rate calls.
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/defended"
          git -C "$RUNNER_TEMP/defended" sparse-checkout set --no-cone \
            '/gamepulse/fusion/materialized/igp_blueprint_native_52_20261028/blueprint_native_plus_nba_gravity_9cb23e11adcb.sqlite'
          echo "PRIVATE_ROOT=$RUNNER_TEMP/defended" >> "$GITHUB_ENV"
      - name: Recalculate three-point release only for reported defender within four feet
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          python3 - <<'PY'
          import csv,hashlib,json,sqlite3
          from pathlib import Path
          folder=Path("gamepulse/fusion/materialized/igp_blueprint_native_52_20261028")
          dbpath=folder/"blueprint_native_plus_nba_gravity_9cb23e11adcb.sqlite"
          original_sha=hashlib.sha256(dbpath.read_bytes()).hexdigest()
          output=folder/"release_defender_gravity_join_20261028/defender_within_4ft"
          assert not output.exists(), "REFUSE_OVERWRITE_FILTERED_RELEASE"
          output.mkdir(parents=True)
          con=sqlite3.connect("file:"+str(dbpath.resolve())+"?mode=ro",uri=True)
          con.row_factory=sqlite3.Row
          assert con.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          source_counts={t:con.execute("SELECT COUNT(*) FROM "+t).fetchone()[0]
             for t in ("source_games","native_shots","game_featured_gravity","nba_official_gravity_leaders")}
          assert source_counts=={"source_games":52,"native_shots":8608,"game_featured_gravity":102,
                                  "nba_official_gravity_leaders":304},source_counts
          total=con.execute("""SELECT COUNT(*),COUNT(release_time_seconds)
            FROM native_shots WHERE shot_type='3pt'
            AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'""").fetchone()
          assert tuple(total)==(3688,3682),tuple(total)
          within=con.execute("""SELECT COUNT(*),COUNT(release_time_seconds),
             COUNT(DISTINCT shooter_id) FROM native_shots
             WHERE shot_type='3pt'
             AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'
             AND contest_distance_inches IS NOT NULL
             AND contest_distance_inches>=0
             AND contest_distance_inches<=48""").fetchone()
          assert 0<within[0]<=3688 and 0<within[1]<=within[0]
          # Only the original 3PT observations inside the distance gate
          # contribute to every per-player release average and qualification.
          player_query="""
          WITH x AS (
            SELECT shooter_id AS player_id,
              MAX(shooter_name) shooter_name,
              MAX(shooter_team) team,
              COUNT(*) AS shots_defender_within_4ft,
              COUNT(release_time_seconds) AS valid_release_shots_within_4ft,
              ROUND(AVG(release_time_seconds),6) AS avg_release_seconds_within_4ft,
              ROUND(AVG(contest_distance_inches)/12,3) AS avg_defender_distance_ft_within_4ft,
              MIN(contest_distance_inches)/12 AS nearest_distance_ft,
              MAX(contest_distance_inches)/12 AS furthest_included_distance_ft
            FROM native_shots
            WHERE shot_type='3pt'
              AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'
              AND contest_distance_inches IS NOT NULL
              AND contest_distance_inches>=0
              AND contest_distance_inches<=48
            GROUP BY shooter_id
          ),
          allshot AS (
            SELECT shooter_id AS player_id, COUNT(*) AS all_official_matched_3pa
            FROM native_shots WHERE shot_type='3pt'
            AND official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'
            GROUP BY shooter_id
          )
          SELECT x.*,a.all_official_matched_3pa,
            g.team AS gravity_team,g.games_played AS gravity_games,
            g.frames AS gravity_frames,
            g.avg_gravity_score AS nba_overall_gravity,
            g.off_ball_perimeter_avg AS nba_off_ball_perimeter_gravity,
            g.off_ball_perimeter_frames AS nba_off_ball_perimeter_frames,
            g.on_ball_perimeter_avg AS nba_on_ball_perimeter_gravity,
            g.on_ball_perimeter_frames AS nba_on_ball_perimeter_frames,
            CASE WHEN x.valid_release_shots_within_4ft>=20 THEN 1 ELSE 0 END
                 AS release_qualified_at_least_20_contested_attempts
          FROM x LEFT JOIN allshot a ON x.player_id=a.player_id
                 LEFT JOIN nba_official_gravity_leaders g ON x.player_id=g.player_id
          ORDER BY x.avg_release_seconds_within_4ft,x.valid_release_shots_within_4ft DESC,x.player_id
          """
          shot_query="""
          SELECT s.game_id,s.game_date,s.period,s.game_clock,s.event_id,
             s.shooter_id,s.shooter_name,s.shooter_team,
             s.release_time_seconds,s.original_release_time_seconds,s.release_status,
             s.blueprint_defender_id AS reported_defender_id,
             s.blueprint_defender_name AS reported_defender_name,
             s.blueprint_defender_team AS reported_defender_team,
             s.contest_distance_inches AS reported_distance_inches,
             ROUND(s.contest_distance_inches/12,3) AS reported_distance_feet,
             s.contest_height_inches,s.shot_distance_feet,s.made,
             s.expected_fg_pct,s.official_match_grade,
             g.off_ball_perimeter_avg AS shooter_season_off_ball_perimeter_gravity,
             g.on_ball_perimeter_avg AS shooter_season_on_ball_perimeter_gravity,
             s.source_sha256 AS original_blueprint_source_sha256,s.official_pbp_sha256
          FROM native_shots s
          LEFT JOIN nba_official_gravity_leaders g ON s.shooter_id=g.player_id
          WHERE s.shot_type='3pt'
            AND s.official_match_grade='NBA_ACTION_SHOOTER_TYPE_EXACT'
            AND s.contest_distance_inches IS NOT NULL
            AND s.contest_distance_inches>=0
            AND s.contest_distance_inches<=48
          ORDER BY s.game_date,s.game_id,s.event_id
          """
          def query_rows(sql):
              return [dict(row) for row in con.execute(sql)]
          players=query_rows(player_query)
          shots=query_rows(shot_query)
          assert len(shots)==within[0]
          assert len(players)==within[2]
          assert len({(r["game_id"],r["event_id"]) for r in shots})==len(shots)
          assert sum(r["valid_release_shots_within_4ft"] for r in players)==within[1]
          assert sum(r["shots_defender_within_4ft"] for r in players)==within[0]
          assert all(0<=r["reported_distance_inches"]<=48 for r in shots)
          assert all(r["avg_release_seconds_within_4ft"] is not None
                     for r in players if r["valid_release_shots_within_4ft"])
          qualifies=[r for r in players if r["release_qualified_at_least_20_contested_attempts"]]
          files=(("players_within_4ft_gravity.csv",players),
                 ("shots_within_4ft_gravity.csv",shots))
          for name,rows in files:
              with (output/name).open("w",newline="",encoding="utf-8") as f:
                  writer=csv.DictWriter(f,fieldnames=list(rows[0]),lineterminator="\n")
                  writer.writeheader()
                  writer.writerows(rows)
          receipt={
            "schema":"gamepulse.official_3pa_blueprint_reported_defender_48inch_release_gravity.v1",
            "filter":"shot_type = 3pt; NBA action/shooter/type exact; 0<=Blueprint contestDistance<=48 inches",
            "maximum_defender_distance_inches_inclusive":48,
            "source_private_sqlite_sha256":original_sha,
            "source_counts":source_counts,
            "original_official_matched_3pa":total[0],
            "original_official_matched_valid_release_3pa":total[1],
            "defender_within_4ft_3pa":within[0],
            "defender_within_4ft_valid_release_3pa":within[1],
            "distinct_shooters_within_4ft":len(players),
            "qualifying_players_min_20_valid_contested_3pa":len(qualifies),
            "gravity_source":"NBA-published season-to-2026-10-28 qualified-player feed; not shot-specific",
            "blueprint_period":"2026-10-20 to 2026-10-26",
            "defender_definition":"Blueprint-reported defender; not independently proven closest player at shot.",
            "release_precision":"Original shot release values quantized to tenths; source zero release excluded from averages.",
            "min_sample_rule":"At least 20 valid release observations AFTER applying <=48-inch distance filter.",
            "qualified_fastest":qualifies,
            "fastest_with_at_least_5_valid_contested_3pa":[r for r in players if r["valid_release_shots_within_4ft"]>=5][:40],
            "all_players":[r for r in players],
            "output_sha256":{name:hashlib.sha256((output/name).read_bytes()).hexdigest()
                             for name,_ in files}
          }
          (output/"six_foot_release_gravity_QA.json").write_text(
            json.dumps(receipt,indent=2,ensure_ascii=False,sort_keys=True)+"\n",
            encoding="utf8")
          assert hashlib.sha256(dbpath.read_bytes()).hexdigest()==original_sha
          print("PRIVATE_FOUR_FOOT_DEFENDER_RELEASE_GRAVITY_QA",json.dumps(
            {k:receipt[k] for k in ("original_official_matched_3pa",
            "defender_within_4ft_3pa","defender_within_4ft_valid_release_3pa",
            "distinct_shooters_within_4ft","qualifying_players_min_20_valid_contested_3pa")},sort_keys=True))
          PY
      - name: Commit only SHA-reviewed filtered QA and CSV to private PR 776
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT=gamepulse/fusion/materialized/igp_blueprint_native_52_20261028/release_defender_gravity_join_20261028/defender_within_4ft
          git config user.name 'NBA gamepulse private QA'
          git config user.email 'gamepulse-integrity@users.noreply.github.com'
          git add --sparse -f "$OUT"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check >/dev/null 2>&1 || { echo PRIVATE_FOUR_FOOT_CSV_DIFF_FAILED; exit 12; }
          git commit -qm 'data(gamepulse): recalculate 3pt release with reported defender within four feet'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin HEAD:refs/heads/"$BRANCH"; then
              echo FOUR_FOOT_DEFENDED_RELEASE_GRAVITY_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 16
