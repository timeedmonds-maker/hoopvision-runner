name: Game Pulse Oct26 final three private parallel native SDK parts
# Accelerate eligible source windows for games 0125-0127. Only original
# observations; no public data or fabricated future slots.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-oct26-last3-parallel-parts.yml']
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  discover-eligible-source-parts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      parts: ${{ steps.pick.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public source-only guard and eligibility test
        run: |
          python3 tools/public_content_guard.py
          node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
      - name: Schedule each missing original SDK source part only when elapsed
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          import {planGame} from './tools/licensed_feed/season_core.mjs';
          const repo='timeedmonds-maker/104';
          const known={
            '0022600125':'2026-10-27T00:30:00.000Z',
            '0022600126':'2026-10-27T01:00:00.000Z',
            '0022600127':'2026-10-27T02:00:00.000Z'
          };
          const cutoff=Date.parse('2026-10-29T16:00:00.000Z');
          const now=Date.now(),due=[];
          if(now<=cutoff)for(const [id,tipoff] of Object.entries(known)){
            const start=Date.parse(tipoff),plan=planGame({id,start});
            if(now<start)continue;
            const read=spawnSync('gh',['release','view','gamepulse-sdk-'+id,'--repo',repo,
              '--json','assets'],{encoding:'utf8',timeout:35000,
              env:process.env,stdio:['ignore','pipe','ignore']});
            let archived=new Set();
            if(read.status===0){
              const listed=JSON.parse(read.stdout).assets||[];
              archived=new Set(listed.map(x=>x.name));
            }
            for(const job of plan.parts){
              const base='sdk-part-'+String(job.part).padStart(2,'0');
              if(archived.has(base+'.tar.gz')&&archived.has(base+'.json'))continue;
              // Exact source window has elapsed plus ten minutes, as required
              // by the already accepted SDK priority-fanout implementation.
              if(now<job.start_ms+job.count*5000+600000)continue;
              due.push({id,tipoff,part:job.part});
            }
          }
          due.sort((a,b)=>a.part-b.part||a.id.localeCompare(b.id));
          if(due.length>39)throw Error('outside_bounded_nine_game_source_population');
          appendFileSync(process.env.GITHUB_OUTPUT,
              'parts='+JSON.stringify(due.length?due:[{id:'none',tipoff:'',part:0}])+'\n');
          console.log('IGP_OCT26_LAST3_ELAPSED_MISSING_SOURCE_PARTS',due.length);
          JS
  collect-parts:
    needs: discover-eligible-source-parts
    if: needs.discover-eligible-source-parts.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        item: ${{ fromJSON(needs.discover-eligible-source-parts.outputs.parts) }}
    concurrency:
      group: gp-oct26-source-part-${{ matrix.item.id }}-${{ matrix.item.part }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        if: matrix.item.id != 'none'
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        if: matrix.item.id != 'none'
        with: {node-version: '22'}
      - name: Verify original source parser and public confidentiality
        if: matrix.item.id != 'none'
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
      - name: Install SDK with scripts disabled and no GitHub credential
        if: matrix.item.id != 'none'
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: SHA-check or persist one already elapsed original SDK source part privately
        if: matrix.item.id != 'none'
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRODUCTION_ENABLED: 'true'
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_PRIORITY_ID: ${{ matrix.item.id }}
          GAMEPULSE_PRIORITY_PART: ${{ matrix.item.part }}
          GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.item.tipoff }}
          GAMEPULSE_FULLGAME_PILOT: 'false'
        run: |
          set -euo pipefail
          node season_private_release.mjs
          echo 'PRIVATE_OCT26_SOURCE_PART_SHA_VERIFIED'
