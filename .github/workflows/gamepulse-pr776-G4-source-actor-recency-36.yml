name: PR776 G4 original source actor recency 36
on:
  push:
    branches: [research/pr776-trusted-igp-runner-20261028]
    paths:
      - '.github/workflows/gamepulse-pr776-G4-source-actor-recency-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G4-source-actor-recency-36
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and private source index
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free past-only recency regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g4_source_actor_recency_coverage_2026.py' -v
      - name: All 36 SHA-verified original source actor recency audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G4_raw_source_actor_past_recency_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g4_source_actor_recency_coverage_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-G4-recency.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]));c=a['counts']
          assert a['source_games']==36 and len(a['games'])==36
          assert c['native_frames']==1203986 and c['direct_ball_frames']==912704
          assert c['exact_ten_direct_ball']==387956
          assert c['raw_ten_or_more_past_800ms_direct_ball']>=c['raw_ten_or_more_past_0ms_direct_ball']
          assert a['past_only_source_actor_presence_not_same_instant_XYZ']
          assert a['raw_source_IDs_not_certified_official_on_court_ten']
          print('G4_RAW_SOURCE_RECENCY_36_ACCEPTED',json.dumps({
            'percent':a['percent_of_all_native_frames'],
            'direct_ten_ball':c['exact_ten_direct_ball']},sort_keys=True))
          PY
      - name: Publish private recency QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          git config user.name "Game Pulse G4 Private Recency QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261028/igp_G4_raw_source_actor_past_recency_36_v1.json
          git diff --cached --check
          git commit -qm "qa(gamepulse): accept 36-game past-only source actor recency census"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo G4_PRIVATE_RECENCY_QA_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
