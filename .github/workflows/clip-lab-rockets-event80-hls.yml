name: Clip Lab Rockets event80 original NBA Broadcast HLS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-rockets-event80-hls.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-lab-rockets-event80-original-broadcast
  cancel-in-progress: false
jobs:
  acquire-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      NBA_GAME_ID: '0022600009'
      NBA_EVENT_NUM: '80'
      NBA_PLAYER_ID: '1627832'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public safety and private source destination
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-rockets-event80-hls.yml'])
          print('PUBLIC_CONTENT_BOUNDARY_PASS')
          PY
          test -n "$GH_TOKEN" || { echo PRIVATE_AUTH_UNAVAILABLE; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch and execute reviewed private exact-event HLS intake
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_hls_ingest_event.py?ref=main' --jq .content | base64 -d > "$ROOT/ingest.py"
          python3 -m pip install --quiet 'numpy<2' 'opencv-python-headless==4.10.0.84'
          command -v ffmpeg
          python3 "$ROOT/ingest.py" --selftest
          python3 "$ROOT/ingest.py"
