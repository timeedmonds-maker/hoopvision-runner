name: "IGP private native short-gap C0 source-first query readback"
# Eight-game masked-source error reference; direct originals remain authoritative.
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-native-bounded-velocity-query-qa.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-native-short-gap-source-query-readback
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public boundary and clone original private SDK source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Run source-only model and ball abstention regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_native_bounded_velocity_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_query_igp_native_bounded_velocity_v1.py'
      - name: Readback two actual original-source NBA games, immutable positions and bounded candidates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from igp_tracking_pilot_source_2026 import read
          from query_igp_native_bounded_velocity_v1 import query,candidate_for_track
          accepted={}
          for gid in ("0022600009","0022600092"):
            frames=read(".",gid)
            assert len(frames)>20000
            first=next((t,p) for t,p in frames if any(k!="ball" for k in p))
            t,p=first
            pid=next(k for k in p if k!="ball")
            direct=query(".",gid,pid,t,strict=True)
            assert direct["status"]=="ORIGINAL_SOURCE_XYZ"
            assert direct["position"]["position_native_units"]==list(p[pid])
            assert direct["position"]["original_observation"]
            track=[(t,tuple(pos[pid])) for t,pos in frames if pid in pos]
            sample=None
            for i in range(1,len(track)-2):
              ts=[x[0] for x in track[i-1:i+3]]
              if any(not 0<b-a<=400 for a,b in zip(ts,ts[1:])):continue
              target=(ts[1]+ts[2])//2
              pred=candidate_for_track(
                 [a for a,_ in track],[b for _,b in track],target)
              if pred is not None and pred["method"]=="EXPERIMENTAL_C0_TWO_SIDED_VELOCITY":
                sample=target;break
            assert sample is not None,("NO_ELIGIBLE_NATIVE_C0_SAMPLE",gid)
            predicted=query(".",gid,pid,sample,strict=False)
            strict=query(".",gid,pid,sample,strict=True)
            assert predicted["status"]=="EXPERIMENTAL_C0_TWO_SIDED_VELOCITY"
            assert not predicted["position"]["original_observation"]
            assert 0<predicted["position"]["source_bracket_ms"]<=2000
            assert strict["position"] is None
            assert predicted["empirical_masked_source_error_reference"]["per_query_uncertainty_calibrated"] is False
            source_ball=next((t for t,p in frames if "ball" in p),None)
            assert source_ball is not None
            assert query(".",gid,"ball",source_ball)["status"]=="ORIGINAL_SOURCE_XYZ"
            assert query(".",gid,"ball",sample)["status"]!="EXPERIMENTAL_C0_TWO_SIDED_VELOCITY"
            accepted[gid]={
              "original_timestamps_sha_verified":len(frames),
              "original_source_manifest_sha256":predicted["original_source_manifest_sha256"],
              "strict_direct_source_equal":True,
              "experimental_short_bounded_query_pass":True,
              "strict_mode_abstained_on_missing_original":True,
              "ball_never_source_interpolated":True,
              "video_ground_truth_accuracy_certified":False}
          dst=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_native_bounded_velocity_query_two_game_qa_v2.json")
          if dst.exists():raise FileExistsError("REFUSE_OVERWRITE_QUERY_ACCEPTANCE")
          dst.write_text(json.dumps({
             "schema":"igp.native-source-first-2s-bounded-query-qa.v2",
             "games":accepted,"source_data_rewritten":False,
             "accepted_season_tracking_rewritten":False,
             "physical_possessions_certified":0},sort_keys=True,indent=2)+"\n")
          print("IGP_SOURCE_FIRST_TWO_GAME_C0_QUERY_ACCEPTED",json.dumps({
            "games":2,"strict_direct_source_equal":True,
            "bounded_player_predictions_verified":2,
            "strict_abstentions_verified":2,
            "ball_inference_abstained":True,
            "independent_video_labels":0},sort_keys=True))
          PY
      - name: Save source-only QA evidence in canonical private branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_native_bounded_velocity_query_two_game_qa_v2.json
          git diff --cached --check
          git commit -q -m "qa(igp): two real NBA games source-first bounded 2s C0 query gate"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_NATIVE_SHORT_VELOCITY_SOURCE_READBACK_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$try"
          done
          exit 23
