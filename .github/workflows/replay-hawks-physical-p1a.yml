name: Replay Frozen Hawks Physical P1A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replay-hawks-physical-p1a.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: 96e0275e27708b80b336746193a1f4ad99068b6b
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU dependencies
        run: python -m pip install -q numpy pandas scipy

      - name: Download frozen completed-run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen
          gh run download 35891572936 --repo timeedmonds-maker/hoopvision-runner --name hoopvision-evidence-completed --dir frozen
          test -f frozen/identity_segments/uniform_observations.csv
          test -f frozen/physical_paths/physical_paths_qa.json

      - name: Replay and compare
        run: |
          set -euo pipefail
          mkdir -p candidate
          python -m screen_tracker_nextgen.build_fast_physical_paths \
            --observations frozen/identity_segments/uniform_observations.csv \
            --segments frozen/identity_segments/segments.csv \
            --ocr-dir frozen/identity_ocr \
            --roster frozen/exact_lineup_roster.json \
            --out-dir candidate
          python -m screen_tracker_nextgen.diagnose_physical_first_loss \
            --observations frozen/identity_segments/uniform_observations.csv \
            --physical-qa candidate/physical_paths_qa.json \
            --out candidate/first_loss_diagnostic.json
          mkdir -p baseline_identity candidate_identity
          python -m screen_tracker_nextgen.solve_fast_path_identities \
            --paths frozen/physical_paths/physical_paths.csv \
            --segments frozen/identity_segments/segments.csv \
            --ocr-dir frozen/identity_ocr \
            --roster frozen/exact_lineup_roster.json \
            --out-dir baseline_identity
          python -m screen_tracker_nextgen.solve_fast_path_identities \
            --paths candidate/physical_paths.csv \
            --segments frozen/identity_segments/segments.csv \
            --ocr-dir frozen/identity_ocr \
            --roster frozen/exact_lineup_roster.json \
            --out-dir candidate_identity
          python - <<'PY'
          import json
          import pandas as pd
          base=json.load(open("frozen/physical_paths/physical_paths_qa.json"))
          cand=json.load(open("candidate/physical_paths_qa.json"))
          diag=json.load(open("candidate/first_loss_diagnostic.json"))
          baseline_identity=json.load(open("baseline_identity/path_identity_qa.json"))
          candidate_identity=json.load(open("candidate_identity/path_identity_qa.json"))
          executed_identity=json.load(open("frozen/physical_paths/path_identity/path_identity_qa.json"))
          report={}
          for team in ("ATL","HOU"):
              b=base["teams"][team]; c=cand["teams"][team]
              report[team]={
                  "baseline_fragments":int(b["physical_fragment_count"]),
                  "candidate_fragments":int(c["physical_fragment_count"]),
                  "baseline_fb_agreement":float(b["forward_backward_agreement_fraction"]),
                  "candidate_fb_agreement":float(c["forward_backward_agreement_fraction"]),
                  "baseline_precision_required":int(b["precision_required_rows"]),
                  "candidate_precision_required":int(c["precision_required_rows"]),
                  "baseline_margin":int(b["forward_tracking"]["margin_rejections"]),
                  "candidate_margin":int(c["forward_tracking"]["margin_rejections"]),
                  "candidate_same_raw_margin":int(diag["teams"][team]["forward_rejections"]["same_raw_margin"]),
                  "baseline_forward_hard":int(b["forward_tracking"]["hard_rejections"]),
                  "candidate_forward_hard":int(c["forward_tracking"]["hard_rejections"]),
                  "baseline_forward_cost":int(b["forward_tracking"]["cost_rejections"]),
                  "candidate_forward_cost":int(c["forward_tracking"]["cost_rejections"]),
                  "baseline_backward_margin":int(b["backward_tracking"]["margin_rejections"]),
                  "candidate_backward_margin":int(c["backward_tracking"]["margin_rejections"]),
                  "candidate_unmatched_active_states":int(c["forward_tracking"].get("unmatched_active_states",0)),
                  "candidate_unmatched_observations":int(c["forward_tracking"].get("unmatched_observations",0)),
                  "candidate_raw_claim_revocations":int(c["forward_tracking"].get("raw_claim_revocations",0)),
              }
          houqa=cand["teams"]["HOU"]
          def compact_rejections(key):
              out=[]
              for r in houqa[key].get("rejection_records",[]):
                  out.append({
                      "direction":r.get("direction"),
                      "time_s":r.get("time_s"),
                      "from_time_s":r.get("from_time_s"),
                      "from_raw":r.get("from_raw_source_track_id"),
                      "to_raw":r.get("to_raw_source_track_id"),
                      "from_segment":r.get("from_segment_id"),
                      "to_segment":r.get("to_segment_id"),
                      "cost":r.get("association_cost"),
                      "margin":r.get("association_margin"),
                      "reason":r.get("rejection_reason"),
                      "same_raw":bool((r.get("detail") or {}).get("same_raw_track")),
                      "same_track":bool((r.get("detail") or {}).get("same_source_track")),
                      "candidates":r.get("competing_to_candidates",[]),
                  })
              return out
          print("P1A_HOU_FORWARD_REJECTIONS="+json.dumps(compact_rejections("forward_tracking"),sort_keys=True))
          print("P1A_HOU_BACKWARD_REJECTIONS="+json.dumps(compact_rejections("backward_tracking"),sort_keys=True))
          paths=pd.read_csv("candidate/physical_paths.csv")
          for raw in (4,29):
              q=paths[(paths.team.astype(str)=="HOU") & (paths.raw_source_track_id.astype(int)==raw)]
              q=q[q.time_s.between(13.2758,13.4095)].sort_values("time_s")
              wanted=q[q.time_s.round(6).isin([13.275933,13.342667,13.4094])]
              assert len(wanted)>=3,(raw,q[["time_s","path_slot"]].to_dict("records"))
              assert wanted.path_slot.nunique()==1,(raw,wanted[["time_s","path_slot"]].to_dict("records"))
          report["baseline_sam_decisions"]=int(base.get("sam31_decision_count",0))
          report["candidate_sam_decisions"]=int(cand.get("sam31_decision_count",0))
          report["baseline_precision_windows"]=int(base.get("precision_window_count",0))
          report["candidate_precision_windows"]=int(cand.get("precision_window_count",0))
          focus=paths[
              (paths.team.astype(str)=="HOU")
              & paths.time_s.between(13.20,14.15)
              & paths.raw_source_track_id.astype(int).isin([3,4,8,9,29,31,32])
          ][["time_s","raw_source_track_id","source_track_id","identity_segment_id","physical_path_id","path_slot","forward_backward_agree","precision_required"]].sort_values(["time_s","raw_source_track_id"])
          print("P1A_FIRST_LOSS_ROWS="+focus.to_json(orient="records"))
          report["identity_reachability"]={
              "executed_run_with_original_path_ocr":{
                  "accepted_fragments":int(executed_identity.get("accepted_fragment_count",0)),
                  "accepted_players":int(executed_identity.get("accepted_player_count",0)),
                  "missing_players":int(executed_identity.get("missing_player_count",10)),
              },
              "controlled_baseline_segment_ocr_only":{
                  "accepted_fragments":int(baseline_identity.get("accepted_fragment_count",0)),
                  "accepted_players":int(baseline_identity.get("accepted_player_count",0)),
                  "missing_players":int(baseline_identity.get("missing_player_count",10)),
                  "quarantined_shared_segments":int(baseline_identity.get("quarantined_shared_segment_count",0)),
              },
              "controlled_candidate_segment_ocr_only":{
                  "accepted_fragments":int(candidate_identity.get("accepted_fragment_count",0)),
                  "accepted_players":int(candidate_identity.get("accepted_player_count",0)),
                  "missing_players":int(candidate_identity.get("missing_player_count",10)),
                  "quarantined_shared_segments":int(candidate_identity.get("quarantined_shared_segment_count",0)),
              },
          }
          print("P1A_REPLAY_REPORT="+json.dumps(report,sort_keys=True))
          # Safety invariant added after exact-source diagnostic review:
          # no selected transition may move to a different raw/source tracker
          # using motion/scale alone. Cross-track continuation requires an
          # accepted continuity cue (currently source-track or SAM evidence).
          p=paths.sort_values(["team","physical_path_id","time_s"])
          unsupported=[]
          for (_,pid),g in p.groupby(["team","physical_path_id"],sort=False):
              prev=None
              for row in g.itertuples(index=False):
                  if prev is not None:
                      detail=json.loads(str(row.association_detail or "{}"))
                      if (
                          int(row.raw_source_track_id)!=int(prev.raw_source_track_id)
                          and int(row.source_track_id)!=int(prev.source_track_id)
                          and not bool(detail.get("same_sam31_continuity_group"))
                          and not bool(detail.get("same_source_track"))
                      ):
                          unsupported.append({
                              "team":str(row.team),
                              "physical_path_id":str(pid),
                              "from_time_s":float(prev.time_s),
                              "to_time_s":float(row.time_s),
                              "from_raw":int(prev.raw_source_track_id),
                              "to_raw":int(row.raw_source_track_id),
                          })
                  prev=row
          print("P1A_UNSUPPORTED_CROSS_TRACK_ACCEPTS="+json.dumps(unsupported,sort_keys=True))
          assert unsupported==[],unsupported

          h=report["HOU"]
          assert h["candidate_fragments"] < h["baseline_fragments"]
          assert h["candidate_margin"] < h["baseline_margin"]
          assert h["candidate_same_raw_margin"] == 0
          PY

      - name: Upload P1A replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoopvision-p1a-current-replay
          path: |
            candidate/
            baseline_identity/
            candidate_identity/
          if-no-files-found: error
          retention-days: 7
