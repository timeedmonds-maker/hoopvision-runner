name: IGP P3 11-actor whole scene source blackout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-whole-scene-original-2p4s-mask-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-original-whole-scene-2p4s
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: ade797ad730a0d27125240363618225bbcbc5f99
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public source and pin official NBA SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test original source whole-scene mask and evaluate four games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_whole_scene_source_blackout_v1.py'
          python3 gamepulse/fusion/igp_68_p3_whole_scene_source_blackout_v1.py --root . --output "$RUNNER_TEMP/whole-scene-private.json" > "$RUNNER_TEMP/whole-scene-private.log" 2>&1 || {
            echo IGP_P3_ALL_11_ACTOR_SOURCE_MASK_QA_FAILED
            tail -n 9 "$RUNNER_TEMP/whole-scene-private.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
            exit 41
          }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'whole-scene-private.json').read_bytes())
          assert len(j['games'])==4 and len(j['per_game'])==4
          assert j['all_ten_players_and_ball_masked_at_same_UTC']
          assert j['source_truth_unavailable_to_candidate_at_masked_times']
          assert j['accepted_68_game_coverage_gain']==0 and j['no_model_promotion']
          for kind,stats in j['pooled'].items():
            assert stats['target_full_original_source_scenes']>=200
            assert stats['recovered_simultaneous_eleven']<=stats['target_full_original_source_scenes']
            assert stats['within_player_2ft_ball_3ft_source_proxy']<=stats['recovered_simultaneous_eleven']
          print('IGP_P3_REAL_ALL11_SCENE_MASK_METRICS',json.dumps(j['pooled'],sort_keys=True))
          PY
      - name: Commit original-source SHA whole-scene evaluation privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_fourgame_whole_scene_blackout_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B whole-scene "origin/$BRANCH"
          cp "$RUNNER_TEMP/whole-scene-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): exact original NBA all11 source blackouts 2p4s heldout source proxy'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_ORIGINAL_FULL_SCENE_MASK_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
