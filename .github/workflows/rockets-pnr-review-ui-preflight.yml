name: Rockets PNR Clip Lab private review UI preflight
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rockets-pnr-review-ui-preflight.yml
  pull_request:
    paths:
      - .github/workflows/rockets-pnr-review-ui-preflight.yml
      - tools/public_content_guard.py
permissions:
  contents: read
concurrency:
  group: rockets-pnr-private-review-ui-preflight
  cancel-in-progress: false
jobs:
  public-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
  private-source-ui-tests:
    needs: public-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Validate private review data and UI source, do not download provider media
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || exit 3
          mkdir -p /tmp/pnr-review-private/courtcoder/{static,qa,private-review}
          cd /tmp/pnr-review-private
          ref='agents%2Frockets-pnr-xfg-review-ui-20261022'
          for file in             courtcoder/nba_pnr_xfg_review.py             courtcoder/private-review/rockets_0022600091.pnr_xfg.v1.json             courtcoder/qa/test_nba_pnr_xfg_review.py             courtcoder/qa/test_nba_pnr_xfg_review.cjs             courtcoder/static/nba_pnr_xfg_review.js             courtcoder/static/nba_pnr_xfg_review.css             courtcoder/static/index.html             courtcoder/app.py; do
            gh api "repos/timeedmonds-maker/104/contents/$file?ref=$ref" --jq .content | base64 -d > "$file"
          done
          python3 -m py_compile courtcoder/nba_pnr_xfg_review.py courtcoder/app.py
          node --check courtcoder/static/nba_pnr_xfg_review.js
          python3 -m unittest discover -s courtcoder/qa -p test_nba_pnr_xfg_review.py -q
          node courtcoder/qa/test_nba_pnr_xfg_review.cjs
          python3 - <<'PY'
          from pathlib import Path
          html=Path('courtcoder/static/index.html').read_text()
          source=Path('courtcoder/app.py').read_text()
          assert 'id="nbaPnrVideoPanel"' in html
          assert '/static/nba_pnr_xfg_review.js' in html
          assert '/static/nba_pnr_xfg_review.css' in html
          assert 'def rockets_pnr_video_review' in source
          assert 'if not PREVIEW_TOKEN_SHA256 or not _preview_authorized()' in source
          print("PRIVATE_ROCKETS_PNR_UI_SOURCE_TESTS_PASS")
          PY
          rm -rf /tmp/pnr-review-private
