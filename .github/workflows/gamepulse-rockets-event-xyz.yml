name: Integrated Pulse Rockets source-backed scoring event XYZ
# Security reviewed: original SHA-verified aggregate QA only; one-game acceptance pilot.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-event-xyz.yml']
permissions:
  contents: read
jobs:
  audit-original-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: '0022600009'
      PRIVATE_REPO: timeedmonds-maker/104
      BIDIR_PIN: 0ddecc9351dc86ced2ed9e27c7cbbb5c974e46fb
      LINEUP_PIN: 1158571e1712a18b6b1b1cc100caa4eba7a0d477
      EVENT_PIN: ccfef2f98163ea1678a216e81913f9d92aca1df7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight private source and regression tests before archive transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          mkdir -p "$RUNNER_TEMP/pulse/raw"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/audit_original_sdk_bidirectional_holdout_2026.py?ref=$BIDIR_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/audit_original_sdk_bidirectional_holdout_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/official_lineup_trajectory_2026.py?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/official_lineup_trajectory_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/tests/test_original_sdk_bidirectional_holdout_2026.py?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/test_original_sdk_bidirectional_holdout_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/tests/test_official_lineup_trajectory_2026.py?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/test_official_lineup_trajectory_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/qa/rockets_official_five_recovery_0022600009_20261026.json?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/provider.json"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/event_tracking_states_2026.py?ref=$EVENT_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/event_tracking_states_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/tests/test_event_tracking_states_2026.py?ref=$EVENT_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/test_event_tracking_states_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/official_lineup_clock/games/$GAME_ID.json?ref=$EVENT_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/clock_intervals.json"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/index/games/$GAME_ID.json?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/roster.json"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/qa/auto_physics/${GAME_ID:0:8}/$GAME_ID.json?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/hoop_qa.json"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/official_pbp_timing/games/$GAME_ID.json?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/pbp.json"
          (cd "$RUNNER_TEMP/pulse" && python3 -m py_compile audit_original_sdk_bidirectional_holdout_2026.py official_lineup_trajectory_2026.py event_tracking_states_2026.py && python3 -m unittest discover -p 'test_*2026.py' -v)
          gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GAME_ID" > "$RUNNER_TEMP/pulse/release.json"
          gh release download "gamepulse-sdk-$GAME_ID" --repo "$PRIVATE_REPO" --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/pulse/raw"
          python3 "$RUNNER_TEMP/pulse/event_tracking_states_2026.py" --game-id "$GAME_ID" --archive-dir "$RUNNER_TEMP/pulse/raw" --release-json "$RUNNER_TEMP/pulse/release.json" --roster "$RUNNER_TEMP/pulse/roster.json" --pbp "$RUNNER_TEMP/pulse/pbp.json" --hoop-qa "$RUNNER_TEMP/pulse/hoop_qa.json" --clock-intervals "$RUNNER_TEMP/pulse/clock_intervals.json" --out "$RUNNER_TEMP/pulse/event_states.json"
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"pulse/event_states.json"
          doc=json.loads(path.read_bytes())
          assert doc["game_id"]==os.environ["GAME_ID"]
          assert not doc["clock_alignment_independently_certified"]
          assert doc["physical_possessions_certified"]==0
          target="repos/"+os.environ["PRIVATE_REPO"]+"/contents/gamepulse/fusion/event_tracking/games/"+os.environ["GAME_ID"]+".json"
          payload={"branch":"research/gamepulse-clock-boundary-integrity-20261025",
                   "message":"data(gamepulse): retain private source-backed Rockets scoring event states",
                   "content":base64.b64encode(path.read_bytes()).decode()}
          old=subprocess.run(["gh","api",target+"?ref="+payload["branch"]],
                             capture_output=True,text=True)
          if old.returncode==0:payload["sha"]=json.loads(old.stdout)["sha"]
          elif "404" not in old.stderr and "Not Found" not in old.stderr:
              raise RuntimeError("PRIVATE_EVENT_LOOKUP_FAILED")
          put=subprocess.run(["gh","api","--method","PUT",target,"--input","-"],
                             input=json.dumps(payload),capture_output=True,text=True)
          if put.returncode:raise RuntimeError("PRIVATE_EVENT_WRITE_FAILED")
          print("PRIVATE_EVENT_STATES_PUBLISHED",json.dumps(doc["qa"],sort_keys=True))
          PY
