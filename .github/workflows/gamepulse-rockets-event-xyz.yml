name: Integrated Pulse Rockets source-backed scoring event XYZ
# Security reviewed: original SHA-verified aggregate QA only; one-game acceptance pilot.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-event-xyz.yml']
permissions:
  contents: read
jobs:
  audit-original-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: '0022600009'
      PRIVATE_REPO: timeedmonds-maker/104
      BIDIR_PIN: 0ddecc9351dc86ced2ed9e27c7cbbb5c974e46fb
      LINEUP_PIN: 1158571e1712a18b6b1b1cc100caa4eba7a0d477
      EVENT_PIN: ccfef2f98163ea1678a216e81913f9d92aca1df7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight private source and regression tests before archive transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          # Git smart transport does not consume the exhausted REST API quota.
          cat > "$RUNNER_TEMP/private-askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *Password*) printf '%s\n' "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/private-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/private-askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b research/gamepulse-clock-boundary-integrity-20261025 "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-source"
          git -C "$RUNNER_TEMP/private-source" fetch -q --depth=1 origin "$EVENT_PIN"
          git -C "$RUNNER_TEMP/private-source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/private-source" rev-parse HEAD)" = "$EVENT_PIN"
          git -C "$RUNNER_TEMP/private-source" sparse-checkout set gamepulse/fusion
          mkdir -p "$RUNNER_TEMP/pulse/raw"
          SRC="$RUNNER_TEMP/private-source/gamepulse/fusion"
          cp "$SRC/audit_original_sdk_bidirectional_holdout_2026.py" "$SRC/official_lineup_trajectory_2026.py" "$SRC/event_tracking_states_2026.py" "$RUNNER_TEMP/pulse/"
          cp "$SRC/tests/test_original_sdk_bidirectional_holdout_2026.py" "$SRC/tests/test_official_lineup_trajectory_2026.py" "$SRC/tests/test_event_tracking_states_2026.py" "$RUNNER_TEMP/pulse/"
          cp "$SRC/index/games/$GAME_ID.json" "$RUNNER_TEMP/pulse/roster.json"
          cp "$SRC/official_pbp_timing/games/$GAME_ID.json" "$RUNNER_TEMP/pulse/pbp.json"
          cp "$SRC/qa/auto_physics/00226000/$GAME_ID.json" "$RUNNER_TEMP/pulse/hoop_qa.json"
          cp "$SRC/official_lineup_clock/games/$GAME_ID.json" "$RUNNER_TEMP/pulse/clock_intervals.json"
          (cd "$RUNNER_TEMP/pulse" && python3 -m py_compile audit_original_sdk_bidirectional_holdout_2026.py official_lineup_trajectory_2026.py event_tracking_states_2026.py && python3 -m unittest discover -p 'test_*2026.py' -v)
          # Immutable hashes were retained by the earlier successful, private original-archive extract.
          cp "$SRC/materialized/private_native_event_xyz_pr776_20261026/$GAME_ID/$GAME_ID-P1-NBAF0002.json" "$RUNNER_TEMP/pulse/frozen_extract.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"pulse"
          frozen=json.loads((root/"frozen_extract.json").read_bytes())
          assert frozen["game_id"]==os.environ["GAME_ID"] and frozen["counts"]["original_game_distinct_source_frames"]==34979
          digests=frozen["archive_part_sha256"]
          assert len(digests)==13 and all(
              digests.get(f"sdk-part-{i:02}.tar.gz","").startswith("sha256:")
              for i in range(13))
          (root/"release.json").write_text(json.dumps({
              "assets":[{"name":name,"digest":digest} for name,digest in sorted(digests.items())]}))
          PY
          # The authenticated release API is required for private assets. Wait for
          # the shared user's primary REST quota to reset, without redownloading source.
          read remaining reset_epoch < <(gh api rate_limit --jq '[.resources.core.remaining,.resources.core.reset] | join(" ")')
          if [ "$remaining" -lt 30 ]; then
            now=$(date +%s)
            wait_seconds=$((reset_epoch-now+10))
            if [ "$wait_seconds" -lt 0 ] || [ "$wait_seconds" -gt 3700 ]; then
              echo PRIVATE_RELEASE_RATE_RESET_INVALID
              exit 1
            fi
            echo "PRIVATE_RELEASE_QUOTA_WAIT_SECONDS=$wait_seconds"
            sleep "$wait_seconds"
          fi
          gh release download "gamepulse-sdk-$GAME_ID" --repo "$PRIVATE_REPO" \
            --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/pulse/raw"
          test "$(find "$RUNNER_TEMP/pulse/raw" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          python3 "$RUNNER_TEMP/pulse/event_tracking_states_2026.py" --game-id "$GAME_ID" --archive-dir "$RUNNER_TEMP/pulse/raw" --release-json "$RUNNER_TEMP/pulse/release.json" --roster "$RUNNER_TEMP/pulse/roster.json" --pbp "$RUNNER_TEMP/pulse/pbp.json" --hoop-qa "$RUNNER_TEMP/pulse/hoop_qa.json" --clock-intervals "$RUNNER_TEMP/pulse/clock_intervals.json" --out "$RUNNER_TEMP/pulse/event_states.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads((Path(os.environ["RUNNER_TEMP"])/"pulse/event_states.json").read_bytes())
          assert doc["game_id"]==os.environ["GAME_ID"]
          assert not doc["clock_alignment_independently_certified"]
          assert doc["physical_possessions_certified"]==0
          print("EVENT_STATES_ACCEPTED_AGGREGATE",json.dumps(doc["qa"],sort_keys=True))
          PY
          BRANCH=research/gamepulse-clock-boundary-integrity-20261025
          git -C "$RUNNER_TEMP/private-source" fetch -q origin "$BRANCH"
          git -C "$RUNNER_TEMP/private-source" checkout -q -B event-publication FETCH_HEAD
          target="$RUNNER_TEMP/private-source/gamepulse/fusion/event_tracking/games/$GAME_ID.json"
          mkdir -p "$(dirname "$target")"
          cp "$RUNNER_TEMP/pulse/event_states.json" "$target"
          git -C "$RUNNER_TEMP/private-source" config user.name "Game Pulse Free CPU Runner"
          git -C "$RUNNER_TEMP/private-source" config user.email "gamepulse-runner@users.noreply.github.com"
          git -C "$RUNNER_TEMP/private-source" add "gamepulse/fusion/event_tracking/games/$GAME_ID.json"
          if ! git -C "$RUNNER_TEMP/private-source" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/private-source" diff --cached --check
            git -C "$RUNNER_TEMP/private-source" commit -qm "data(gamepulse): retain private Rockets scoring event XYZ"
            git -C "$RUNNER_TEMP/private-source" push -q origin "HEAD:$BRANCH"
          fi
          echo PRIVATE_EVENT_XYZ_COMMITTED
