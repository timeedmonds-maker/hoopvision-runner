# Reproducible private original SDK source void census. Public logs only totals.
name: IGP 3.2 V2D six game source clock void forensics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-v2d-sixgame-original-clock-voids.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-v2d-sixgame-source-void
  cancel-in-progress: false
jobs:
  original-voids:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public guard and original private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_source_void_sixgame_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_source_void_sixgame_v1.py'
          echo IGP_V2D_SOURCE_FREE_S1_GAP_REGRESSIONS_PASS
      - name: SHA-verified original native SDK versus frozen official S1
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_source_void_sixgame_v1.py \
            --root . --out "$RUNNER_TEMP/v2d-private.json" \
            >"$RUNNER_TEMP/v2d-private.log" 2>&1 || {
              echo IGP_V2D_PRIVATE_SOURCE_OR_FROZEN_DENOMINATOR_GATE_FAILED
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'v2d-private.json').read_text())
          a=q['counts']
          assert a['source_games']==6 and len(q['games'])==6
          assert a['strict_10hz_no_original_native_within800ms']<=a['frozen_igp31_10hz_incomplete_scenes']
          assert a['strict_10hz_near_original_native_within800ms']+a[
             'strict_10hz_no_original_native_within800ms']==a['strict_S1_10hz_total']
          assert not q['source_coordinates_and_NBA_PBP_modified']
          assert q['new_completed_10hz_scenes_accepted']==0
          assert q['physical_custody_boundaries_certified']==0
          print('IGP_V2D_SIXGAME_ORIGINAL_SOURCE_QA_PASS',json.dumps({
             'games':6,'S1_clock_10hz':a['strict_S1_10hz_total'],
             'no_original_native_within_800ms':a['strict_10hz_no_original_native_within800ms'],
             'no_original_native_inside_recorded_span':a.get('strict_no_native_between_first_last_source',0),
             'no_original_native_before_capture':a.get('strict_no_native_before_first_saved_source',0),
             'no_original_native_after_capture':a.get('strict_no_native_after_last_saved_source',0),
             'accepted_new_scenes':0},sort_keys=True))
          PY
      - name: Save forensic original-source SHA QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_v32/igp_v32_v2d_sixgame_original_source_clock_voids_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v2d-source "origin/$BRANCH"
          if test -e "$receipt"; then
            cmp -s "$RUNNER_TEMP/v2d-private.json" "$receipt" || {
              echo IGP_V2D_EXISTING_PRIVATE_QA_DIFFERENT
              exit 42
            }
            echo IGP_V2D_SOURCE_QA_ALREADY_COMMITTED
            exit 0
          fi
          mkdir -p "$(dirname "$receipt")"
          cp "$RUNNER_TEMP/v2d-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): preserve 6-game exact source voids in frozen S1 clock'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_V2D_SIXGAME_PRIVATE_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 43
