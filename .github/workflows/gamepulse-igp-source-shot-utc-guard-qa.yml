name: IGP source shot UTC guard verified real-game readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-source-shot-utc-guard-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-shot-utc-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public path and clone private canonical source
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
        shell: bash
      - name: Execute exact-source original and source-free shot UTC tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion -v \
             -p 'test_query_igp_original_shot_utc_guard_v1.py'
          python3 - <<'PY'
          import json
          from pathlib import Path
          from query_igp_original_shot_utc_guard_v1 import query
          cases=[("0022600002",424,"BLOCK_PHYSICAL_ANCHOR"),
                 ("0022600102",112,"BLOCK_PHYSICAL_ANCHOR"),
                 ("0022600009",7,"SOURCE_PBP_UTC_LOGGED_AGREEMENT")]
          out=[]
          for gid,aid,prefix in cases:
              v=query(".",gid,aid)
              assert v["grade"].startswith(prefix),(gid,aid,v["grade"])
              assert v["physical_time_certified"] is False
              assert len(v["original_companion_source_sha256"])==64
              assert v["source_event_array_index"]>=0
              assert not v.get("ball_position_accuracy_certified",True)
              out.append({"game_id":gid,"action":aid,"grade":v["grade"]})
          official=json.loads(Path("gamepulse/fusion/official_pbp_timing/games/0022600006.json").read_bytes())
          missing=next(x for x in official["actions"] if x["action_type"] in ("2pt","3pt"))
          absent=query(".","0022600006",missing["nba_action_number"])
          assert absent["grade"]=="COMPANION_SOURCE_PROGRAM_UNAVAILABLE"
          out.append({"game_id":"0022600006","action":missing["nba_action_number"],
                      "grade":absent["grade"]})
          target=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_original_shot_utc_guard_four_real_source_queries_v1.json")
          assert not target.exists()
          target.write_text(json.dumps({
             "schema":"igp.original-shot-utc-guard-source-real-query.v1",
             "cases":out,"source_original_sha_verified":True,
             "original_nba_shot_clock_not_video_certified":True,
             "source_xyz_models_modified":False,"physical_possessions_certified":0
          },sort_keys=True,indent=2)+"\n")
          print("IGP_ORIGINAL_SOURCE_SHOT_UTC_GUARD_REAL_QA_PASSED",
                json.dumps({"real_cases":len(out),"blocked_known_outliers":2,
                  "unavailable_original_source_grades":1,
                  "independently_certified_release_times":0},sort_keys=True))
          PY
      - name: Commit small query QA only to private branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_original_shot_utc_guard_four_real_source_queries_v1.json
          git diff --cached --check
          git commit -q -m 'qa(igp): source-backed shot event UTC guard four real-game queries'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_REAL_SOURCE_SHOT_UTC_GUARD_QA_ACCEPTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
