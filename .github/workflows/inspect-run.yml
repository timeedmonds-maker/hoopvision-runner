name: Inspect HoopVision Durable Run
# snapshot-trigger: extract-role-qa-fields

on:
  push:
    branches: [main]
    paths:
      - 'INSPECT_RUN_ID'
      - '.github/workflows/inspect-run.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Print sanitized durable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(tr -d '[:space:]' < INSPECT_RUN_ID)"
          test -n "$RUN_ID"
          TMP="$(mktemp)"
          echo "=== L4 serial tail ==="
          gcloud compute instances get-serial-port-output hv-dev-l4 --project="$PROJECT_ID" --zone="asia-southeast1-c" --port=1 2>/dev/null | tail -n 350 || true
          echo "=== L4 VM state ==="
          gcloud compute instances describe hv-dev-l4 --zone asia-southeast1-c --format='yaml(status,lastStartTimestamp,lastStopTimestamp)' || true
          echo "=== prepared session object ==="
          gcloud storage cat "gs://$BUCKET/sessions/hv-dev-l4.json" 2>/dev/null || true
          echo "=== Pub/Sub subscription state ==="
          gcloud pubsub subscriptions describe hv-dev-worker --format='yaml(name,topic,ackDeadlineSeconds,expirationPolicy,deadLetterPolicy)' || true
          echo "=== durable run objects ==="
          gcloud storage ls "gs://$BUCKET/runs/$RUN_ID/**" || true
          echo "=== durable events ==="
          gcloud storage cat "gs://$BUCKET/runs/$RUN_ID/events/*.json" 2>/dev/null || true
          echo "=== durable result ==="
          gcloud storage cat "gs://$BUCKET/runs/$RUN_ID/result.json" 2>/dev/null || true
          gcloud storage cat "gs://$BUCKET/runs/$RUN_ID/logs/*.bin" > "$TMP" 2>/dev/null || true
          echo "=== SAM continuity diagnostics ==="
          python - "$TMP" <<'PY'
          import sys
          p=sys.argv[1]
          lines=open(p,errors="replace").read().splitlines()
          needles=(
              "HOOPVISION_STAGE",
              "HOOPVISION_SAM31",
              "Adding new object with id",
              "Refining existing object with id",
              "Running SAM2 propagation",
              "Fetching existing VG predictions",
              "propagation ended in session",
              "SAM3.1 continuity QA failed",
              "OutOfMemoryError",
          )
          for line in lines:
              if any(n in line for n in needles):
                  print(line)
          PY
          echo "=== global identity role QA ==="
          python - "$TMP" <<'PY'
          import sys
          lines=open(sys.argv[1],errors="replace").read().splitlines()
          needles=('"safe_samples"','"fully_abstained"','"player_id"','"assignment_samples"','"safe_coverage"')
          idx=[i for i,l in enumerate(lines) if any(n in l for n in needles)]
          if not idx:
              print("role QA fields not found")
              raise SystemExit(0)
          spans=[]
          for i in idx:
              a=max(0,i-10); b=min(len(lines),i+22)
              if spans and a<=spans[-1][1]:
                  spans[-1]=(spans[-1][0],max(spans[-1][1],b))
              else:
                  spans.append((a,b))
          for a,b in spans[-20:]:
              for line in lines[a:b]:
                  print(line)
              print("---")
          PY
          echo "=== render failure diagnostics ==="
          python - "$TMP" <<'PY'
          import sys
          p=sys.argv[1]
          lines=open(p,errors="replace").read().splitlines()
          needles=(
              "render_global_identity_safe.py",
              "refusing render",
              "refusing production render",
              "RuntimeError:",
              "ValueError:",
              "KeyError:",
              "AttributeError:",
              "TypeError:",
              "IndexError:",
              "NameError:",
          )
          hits=[i for i,l in enumerate(lines) if any(n in l for n in needles)]
          seen=set()
          for i in hits:
              a=max(0,i-8); b=min(len(lines),i+14)
              key=(a,b)
              if key in seen: continue
              seen.add(key)
              for line in lines[a:b]:
                  print(line)
              print("---")
          PY
          echo "=== worker failure traceback ==="
          python - "$TMP" <<'PY'
          import sys
          p=sys.argv[1]
          lines=open(p,errors="replace").read().splitlines()
          idx=[i for i,l in enumerate(lines) if "Traceback (most recent call last):" in l]
          if idx:
              start=max(0,idx[-1]-160)
              end=min(len(lines),idx[-1]+100)
          else:
              start=max(0,len(lines)-320)
              end=len(lines)
          for line in lines[start:end]:
              print(line)
          PY
