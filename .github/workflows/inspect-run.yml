name: Inspect HoopVision Durable Run

on:
  push:
    branches: [main]
    paths:
      - 'INSPECT_RUN_ID'
      - '.github/workflows/inspect-run.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Print sanitized durable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(tr -d '[:space:]' < INSPECT_RUN_ID)"
          test -n "$RUN_ID"
          TMP="$(mktemp)"
          gcloud storage cat "gs://$BUCKET/runs/$RUN_ID/logs/*.bin" > "$TMP" 2>/dev/null || true
          echo "=== sanitized worker diagnostics ==="
          grep -E 'HOOPVISION_STAGE|HOOPVISION_INTERACTIVE|HOOPVISION_PRIMARY_MASK_MODE|HOOPVISION_TRACKING_POLICY|HOOPVISION_SAM31_ASSET|HOOPVISION_TORONTO_NEXTGEN_OK|Traceback|RuntimeError|BFloat16|bias type|CalledProcessError|subprocess.CalledProcessError|CUDA|ONNX|Error:' "$TMP" | tail -n 250 || true
