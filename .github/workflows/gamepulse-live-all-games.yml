name: Game Pulse NBA all-game live-first private capture
# 2026-10-31 NZ: Rockets @ Mavericks 0022600021 first-half source recovery; trigger existing live discovery/capture, preserve SHA-private originals and QA.
# 2026-10-25 UTC operator catch-up: run all active/recently-final Oct 24 US fixtures; preserve private original SDK evidence.
# 2026-10-24 Rockets-Spurs last eligible live-minute catch-up: preserve additional exact SDK slots.
# 2026-10-24 Rockets-Spurs late-game source recovery: collect further elapsed private NBA SDK minute windows.
# 2026-10-24 Rockets-Spurs second-half catch-up: renew private source SHA collection while the NBA final gate resolves.
# 2026-10-24 Rockets-Spurs halftime priority: immediate source-respecting live discovery, private SHA archive; match 0022600009.
# 2026-10-23: Resume Denver–OKC with guarded live-first eligible-slot priority after missed schedule.
# 2026-10-24: Authorized refresh of live/final discovery; retain source-only capture and private SHA gates.
# Each simultaneous NBA game gets its own independent free GitHub-hosted CPU job.
# Licensed tracking remains only in private 104 Releases; no public player assets.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-live-all-games.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    outputs:
      games: ${{ steps.active.outputs.games }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify concurrent slate selection and original SDK integrity
        run: |
          node --test tools/licensed_feed/live_discovery.test.mjs tools/licensed_feed/live_capture_cycle.test.mjs tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
      - name: Select every currently active or recently final NBA fixture
        id: active
        run: node tools/licensed_feed/live_discovery.mjs
  collect:
    needs: discover
    if: needs.discover.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        game: ${{ fromJSON(needs.discover.outputs.games) }}
    concurrency:
      group: gamepulse-live-2026-${{ matrix.game.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        if: matrix.game.id != 'none'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: matrix.game.id != 'none'
        with:
          node-version: '22'
      - name: Install licensed SDK with scripts disabled
        if: matrix.game.id != 'none'
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Ingest all available elapsed one-minute windows, resume missing private checkpoints
        if: matrix.game.id != 'none'
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_LIVE_ID: ${{ matrix.game.id }}
          GAMEPULSE_LIVE_TIPOFF: ${{ matrix.game.tipoff }}
        run: node live_capture_cycle.mjs
      - name: Privately materialize SDK native touch counts and source-gated paint touches
        if: always() && matrix.game.id != 'none'
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAME_ID: ${{ matrix.game.id }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-live-touch"
          mkdir -p "$ROOT"
          gh release view "gamepulse-live-sdk-$GAME_ID" --repo timeedmonds-maker/104 --json assets >/dev/null
          gh release download "gamepulse-live-sdk-$GAME_ID" --repo timeedmonds-maker/104 --pattern 'live-*.tar.gz' --dir "$ROOT"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/source_touch_counts.py?ref=main' --jq .content | base64 -d > "$ROOT/source_touch_counts.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/touch_report_cli.py?ref=main' --jq .content | base64 -d > "$ROOT/touch_report_cli.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/test_native_touches.py?ref=main' --jq .content | base64 -d > "$ROOT/test_native_touches.py"
          python3 "$ROOT/test_native_touches.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/tracking_touch_reconstruction.py?ref=main' --jq .content | base64 -d > "$ROOT/tracking_touch_reconstruction.py"
          python3 -m py_compile "$ROOT/tracking_touch_reconstruction.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/audit_live_parts.py?ref=main' --jq .content | base64 -d > "$ROOT/audit_live_parts.py"
          python3 "$ROOT/audit_live_parts.py" --game "$GAME_ID" --input "$ROOT" --out "$ROOT/live-qa.json"
          if gh api "repos/timeedmonds-maker/104/contents/gamepulse/live/verified_paint_geometry/$GAME_ID.json?ref=main" --jq .content > "$ROOT/geometry.base64" 2>/dev/null; then
            base64 -d "$ROOT/geometry.base64" > "$ROOT/geometry.json"
            python3 "$ROOT/touch_report_cli.py" --game "$GAME_ID" --input "$ROOT" --output "$ROOT/touches.json" --geometry "$ROOT/geometry.json"
          else
            python3 "$ROOT/touch_report_cli.py" --game "$GAME_ID" --input "$ROOT" --output "$ROOT/touches.json"
          fi
          python3 - <<'PY'
          import base64,json,os,subprocess,time
          from pathlib import Path
          path="repos/timeedmonds-maker/104/contents/gamepulse/live/touches/"+os.environ["GAME_ID"]+".json"
          payload=Path(os.environ["RUNNER_TEMP"]+"/private-live-touch/touches.json").read_bytes()
          if len(payload)>950000:raise ValueError("source_touch_oversize")
          for retry in range(12):
              previous=subprocess.run(["gh","api",path],capture_output=True,text=True)
              write={"branch":"main","message":"data: refresh private live native touch counts","content":base64.b64encode(payload).decode()}
              if previous.returncode==0:write["sha"]=json.loads(previous.stdout)["sha"]
              out=subprocess.run(["gh","api","-X","PUT",path,"--input","-"],input=json.dumps(write),capture_output=True,text=True)
              if out.returncode==0:
                  check=json.loads(subprocess.check_output(["gh","api",path]))
                  if base64.b64decode(check["content"])!=payload:raise ValueError("private_live_touch_readback_failed")
                  print("PRIVATE_NATIVE_TOUCH_INDEX_SAVED")
                  break
              # Many distinct NBA game workers share the same private main ref.
              # Refresh the blob SHA each attempt, and back off on 409 conflicts.
              time.sleep(min(8.0,0.7+retry*0.7)+(int(os.environ["GAME_ID"][-2:])%7)*0.11)
          else:raise RuntimeError("private_touch_conflict")
          PY
      - name: Build and publish tracking-reconstructed touches from player-ball XYZ
        if: always() && matrix.game.id != 'none'
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAME_ID: ${{ matrix.game.id }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-live-touch"
          test -s "$ROOT/tracking_touch_reconstruction.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27.json?ref=main' --jq .content | base64 -d > "$ROOT/verified-prior-catalog.json"
          if curl --fail --silent --show-error --retry 2 --max-time 25 \
                 'https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json' -o "$ROOT/current-schedule.json"; then
            python3 "$ROOT/tracking_touch_reconstruction.py" --game "$GAME_ID" --input "$ROOT" --output "$ROOT/tracking_touches.json" \
              --catalog "$ROOT/verified-prior-catalog.json" --schedule "$ROOT/current-schedule.json"
          else
            python3 "$ROOT/tracking_touch_reconstruction.py" --game "$GAME_ID" --input "$ROOT" --output "$ROOT/tracking_touches.json"
          fi
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          payload=(Path(os.environ["RUNNER_TEMP"])/"private-live-touch/tracking_touches.json").read_bytes()
          if len(payload)>950000:
              raise ValueError("tracking_touch_index_too_large_needs_chunked_publish")
          endpoint="repos/timeedmonds-maker/104/contents/gamepulse/live/tracking_touches/"+os.environ["GAME_ID"]+".json"
          for _ in range(4):
              old=subprocess.run(["gh","api",endpoint],capture_output=True,text=True)
              body={"branch":"main","message":"data: publish XYZ-reconstructed NBA touch candidates",
                    "content":base64.b64encode(payload).decode()}
              if old.returncode==0:body["sha"]=json.loads(old.stdout)["sha"]
              done=subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                                  input=json.dumps(body),capture_output=True,text=True)
              if done.returncode==0:
                  check=json.loads(subprocess.check_output(["gh","api",endpoint]))
                  if base64.b64decode(check["content"])!=payload:
                      raise ValueError("tracking_touch_readback_fail")
                  print("PRIVATE_TRACKING_RECONSTRUCTED_TOUCH_INDEX_SAVED")
                  break
          else:raise RuntimeError("tracking_touch_publish_conflict")
          PY
      - name: Build private generic live lineup ONOFF and NBA Blueprint xFG search
        if: always() && matrix.game.id != 'none'
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAME_ID: ${{ matrix.game.id }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-live-touch"
          test -d "$ROOT"
          for name in roster_resolver roster_espn observed_lineups live_blueprint_source onoff_score_live multi_live_analytics; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/live/$name.py?ref=main" --jq .content | base64 -d > "$ROOT/$name.py"
          done
          python3 -m py_compile "$ROOT/"*.py
          python3 "$ROOT/multi_live_analytics.py" --game "$GAME_ID" --input "$ROOT" --output "$ROOT/analytics.json"
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"private-live-touch/analytics.json").read_bytes()
          if len(raw)>950000:raise ValueError("private_live_search_snapshot_too_large")
          endpoint="repos/timeedmonds-maker/104/contents/gamepulse/live/analytics/"+os.environ["GAME_ID"]+".json"
          for attempt in range(4):
              old=subprocess.run(["gh","api",endpoint],capture_output=True,text=True)
              doc={"branch":"main","message":"data: update private multi-game live NBA player lineup scoring and Blueprint search",
                   "content":base64.b64encode(raw).decode()}
              if old.returncode==0:doc["sha"]=json.loads(old.stdout)["sha"]
              p=subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                               input=json.dumps(doc),capture_output=True,text=True)
              if p.returncode==0:
                  stored=json.loads(subprocess.check_output(["gh","api",endpoint]))
                  if base64.b64decode(stored["content"])!=raw:raise RuntimeError("private_live_analytics_readback_fail")
                  print("PRIVATE_GENERIC_LIVE_ANALYTICS_SAVED")
                  break
          else:raise RuntimeError("private_live_analytics_publish_failed")
          PY
      - name: Preserve independent live source coverage QA privately
        if: always() && matrix.game.id != 'none'
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAME_ID: ${{ matrix.game.id }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/private-live-touch/live-qa.json"
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          qa=Path(os.environ["RUNNER_TEMP"]+"/private-live-touch/live-qa.json").read_bytes()
          url="repos/timeedmonds-maker/104/contents/gamepulse/live/qa/"+os.environ["GAME_ID"]+".json"
          for i in range(4):
              prior=subprocess.run(["gh","api",url],capture_output=True,text=True)
              data={"branch":"main","message":"qa: refresh private live SDK coverage",
                    "content":base64.b64encode(qa).decode()}
              if prior.returncode==0:data["sha"]=json.loads(prior.stdout)["sha"]
              result=subprocess.run(["gh","api","-X","PUT",url,"--input","-"],
                                    input=json.dumps(data),capture_output=True,text=True)
              if result.returncode==0:break
          else:raise RuntimeError("private_live_qa_write_failed")
          print("PRIVATE_LIVE_QA_PUBLISHED")
          PY

      - name: Assert no current source data is published to public artifacts
        if: always() && matrix.game.id != 'none'
        run: |
          test ! -d artifacts
          echo 'Live NBA capture privately archived when SDK observed; see private 104 Release.' >> "$GITHUB_STEP_SUMMARY"
  original-sdk-handler-touches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600006', '0022600007']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public-private data boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Download and independently SHA-check all available original SDK slots
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/sdk-handler"
          mkdir -p "$ROOT/sdk"
          gh api "repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-$GAME_ID" > "$ROOT/release.json"
          gh release download "gamepulse-sdk-$GAME_ID" --repo timeedmonds-maker/104 \
            --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk" --clobber
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"sdk-handler"
          assets=json.loads((root/"release.json").read_text())["assets"]
          expected={a["name"]:a.get("digest") for a in assets
                    if re.fullmatch(r"sdk-part-\d{2}\.tar\.gz",a["name"])}
          files=list((root/"sdk").glob("sdk-part-??.tar.gz"))
          if not files or len(files)!=len(expected):raise ValueError("SOURCE_PART_MISMATCH")
          for f in files:
              digest="sha256:"+hashlib.sha256(f.read_bytes()).hexdigest()
              if expected[f.name]!=digest:raise ValueError("SDK_PART_DIGEST_MISMATCH")
          print("ORIGINAL_SDK_SHA_VERIFIED",len(files),"OF",13)
          PY
      - name: Aggregate unique source ball handlers across ORIGINAL SDK and save private index
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/sdk-handler"
          for name in gamepulse_ball_control gamepulse_ball_dynamics; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$name.py?ref=main" --jq .content | base64 -d > "$ROOT/$name.py"
          done
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/full_original_handler_touch_index.py?ref=main' --jq .content | base64 -d > "$ROOT/full_original_handler_touch_index.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27.json?ref=main' --jq .content | base64 -d > "$ROOT/catalog.json"
          python3 -m py_compile "$ROOT/"*.py
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"sdk-handler"
          cat=json.loads((p/"catalog.json").read_text())
          game_id=os.environ["GAME_ID"]
          roster={}
          for gid,g in cat.get("games",{}).items():
              if gid != game_id:continue
              for x in g.get("players",[]):
                  if x.get("team_assignment")=="NBA_OFFICIAL_BOX_SCORE":
                      roster[str(x["player_id"])]=x["team"]
          (p/"roster.json").write_text(json.dumps(roster))
          print("INDEPENDENT_OFFICIAL_CURRENT_GAME_ROSTER_ANCHORS",len(roster))
          PY
          PYTHONPATH="$ROOT" python3 "$ROOT/full_original_handler_touch_index.py" \
            --game "$GAME_ID" --sdk-dir "$ROOT/sdk" --teams "$ROOT/roster.json" --output "$ROOT/handler_touches.json"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"sdk-handler"
          raw=(root/"handler_touches.json").read_bytes()
          parsed=json.loads(raw)
          assert parsed["schema"]=="gamepulse.original-sdk-ball-handler-touches.v1"
          assert parsed["game_id"]==os.environ["GAME_ID"]
          assert parsed["touch_count"]>0
          assert sum(x["touches"] for x in parsed["by_player"])==parsed["touch_count"]
          if len(raw)>950000:raise ValueError("PRIVATE_HANDLER_INDEX_TOO_LARGE_SPLIT_REQUIRED")
          endpoint="repos/timeedmonds-maker/104/contents/gamepulse/live/original_sdk_handler_touches/"+os.environ["GAME_ID"]+".json"
          for attempt in range(8):
              old=subprocess.run(["gh","api",endpoint],capture_output=True,text=True)
              entry={"branch":"main","message":"data(gamepulse): full original SDK ball-handler touch ledger "+os.environ["GAME_ID"],
                     "content":base64.b64encode(raw).decode()}
              if old.returncode==0:entry["sha"]=json.loads(old.stdout)["sha"]
              updated=subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],input=json.dumps(entry),capture_output=True,text=True)
              if updated.returncode==0:break
              if not any(k in updated.stderr for k in ("409","422","429","500","502","503")):
                  raise RuntimeError("PRIVATE_HANDLER_INDEX_WRITE_FAILED")
              time.sleep(2+attempt)
          else:raise RuntimeError("PRIVATE_HANDLER_INDEX_CONFLICT_RETRIES_EXHAUSTED")
          stored=base64.b64decode(subprocess.check_output(["gh","api",endpoint,"--jq",".content"]))
          assert hashlib.sha256(raw).digest()==hashlib.sha256(stored).digest()
          print("PRIVATE_ORIGINAL_SDK_HANDLER_TOUCH_LEDGER_READBACK_VERIFIED",parsed["touch_count"])
          PY
