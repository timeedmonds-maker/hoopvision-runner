name: Game Pulse NBA all-game live-first private capture
# Each simultaneous NBA game gets its own independent free GitHub-hosted CPU job.
# Licensed tracking remains only in private 104 Releases; no public player assets.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-live-all-games.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    outputs:
      games: ${{ steps.active.outputs.games }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify concurrent slate selection and original SDK integrity
        run: |
          node --test tools/licensed_feed/live_discovery.test.mjs tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
      - name: Select every currently active or recently final NBA fixture
        id: active
        run: node tools/licensed_feed/live_discovery.mjs
  collect:
    needs: discover
    if: needs.discover.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        game: ${{ fromJSON(needs.discover.outputs.games) }}
    concurrency:
      group: gamepulse-live-2026-${{ matrix.game.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        if: matrix.game.id != 'none'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: matrix.game.id != 'none'
        with:
          node-version: '22'
      - name: Install licensed SDK with scripts disabled
        if: matrix.game.id != 'none'
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Ingest all available elapsed one-minute windows, resume missing private checkpoints
        if: matrix.game.id != 'none'
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_LIVE_ID: ${{ matrix.game.id }}
          GAMEPULSE_LIVE_TIPOFF: ${{ matrix.game.tipoff }}
        run: node live_capture_cycle.mjs
      - name: Privately materialize SDK native touch counts and source-gated paint touches
        if: always() && matrix.game.id != 'none'
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAME_ID: ${{ matrix.game.id }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-live-touch"
          mkdir -p "$ROOT"
          gh release view "gamepulse-live-sdk-$GAME_ID" --repo timeedmonds-maker/104 --json assets >/dev/null
          gh release download "gamepulse-live-sdk-$GAME_ID" --repo timeedmonds-maker/104 --pattern 'live-*.tar.gz' --dir "$ROOT"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/source_touch_counts.py?ref=main' --jq .content | base64 -d > "$ROOT/source_touch_counts.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/touch_report_cli.py?ref=main' --jq .content | base64 -d > "$ROOT/touch_report_cli.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/test_native_touches.py?ref=main' --jq .content | base64 -d > "$ROOT/test_native_touches.py"
          python3 "$ROOT/test_native_touches.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/live/audit_live_parts.py?ref=main' --jq .content | base64 -d > "$ROOT/audit_live_parts.py"
          python3 "$ROOT/audit_live_parts.py" --game "$GAME_ID" --input "$ROOT" --out "$ROOT/live-qa.json"
          if gh api "repos/timeedmonds-maker/104/contents/gamepulse/live/verified_paint_geometry/$GAME_ID.json?ref=main" --jq .content > "$ROOT/geometry.base64" 2>/dev/null; then
            base64 -d "$ROOT/geometry.base64" > "$ROOT/geometry.json"
            python3 "$ROOT/touch_report_cli.py" --game "$GAME_ID" --input "$ROOT" --output "$ROOT/touches.json" --geometry "$ROOT/geometry.json"
          else
            python3 "$ROOT/touch_report_cli.py" --game "$GAME_ID" --input "$ROOT" --output "$ROOT/touches.json"
          fi
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          path="repos/timeedmonds-maker/104/contents/gamepulse/live/touches/"+os.environ["GAME_ID"]+".json"
          payload=Path(os.environ["RUNNER_TEMP"]+"/private-live-touch/touches.json").read_bytes()
          if len(payload)>950000:raise ValueError("source_touch_oversize")
          for retry in range(4):
              previous=subprocess.run(["gh","api",path],capture_output=True,text=True)
              write={"branch":"main","message":"data: refresh private live native touch counts","content":base64.b64encode(payload).decode()}
              if previous.returncode==0:write["sha"]=json.loads(previous.stdout)["sha"]
              out=subprocess.run(["gh","api","-X","PUT",path,"--input","-"],input=json.dumps(write),capture_output=True,text=True)
              if out.returncode==0:
                  check=json.loads(subprocess.check_output(["gh","api",path]))
                  if base64.b64decode(check["content"])!=payload:raise ValueError("private_live_touch_readback_failed")
                  print("PRIVATE_NATIVE_TOUCH_INDEX_SAVED")
                  break
          else:raise RuntimeError("private_touch_conflict")
          PY
      - name: Preserve independent live source coverage QA privately
        if: always() && matrix.game.id != 'none'
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAME_ID: ${{ matrix.game.id }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/private-live-touch/live-qa.json"
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          qa=Path(os.environ["RUNNER_TEMP"]+"/private-live-touch/live-qa.json").read_bytes()
          url="repos/timeedmonds-maker/104/contents/gamepulse/live/qa/"+os.environ["GAME_ID"]+".json"
          for i in range(4):
              prior=subprocess.run(["gh","api",url],capture_output=True,text=True)
              data={"branch":"main","message":"qa: refresh private live SDK coverage",
                    "content":base64.b64encode(qa).decode()}
              if prior.returncode==0:data["sha"]=json.loads(prior.stdout)["sha"]
              result=subprocess.run(["gh","api","-X","PUT",url,"--input","-"],
                                    input=json.dumps(data),capture_output=True,text=True)
              if result.returncode==0:break
          else:raise RuntimeError("private_live_qa_write_failed")
          print("PRIVATE_LIVE_QA_PUBLISHED")
          PY

      - name: Assert no current source data is published to public artifacts
        if: always() && matrix.game.id != 'none'
        run: |
          test ! -d artifacts
          echo 'Live NBA capture privately archived when SDK observed; see private 104 Release.' >> "$GITHUB_STEP_SUMMARY"
