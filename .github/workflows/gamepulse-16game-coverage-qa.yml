name: Game Pulse 16-game authentic Q1-Q4 active-play coverage QA
# Read original observed SDK archives in private 104, never publish XYZ publicly.
# Re-evaluate Q1-Q4 after adding per-source-part metadata and NBA player-ID counts.
# Trigger after unrelated temporary public workflow removal restored the allowlist.
# Re-run source QA with hard quarantine of physically impossible NBA period UTC spans.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-16game-coverage-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-independent-16game-active-play-coverage
  cancel-in-progress: false
jobs:
  verify-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - name: Independently unit test no-imputation and quarter gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coverage/tests"
          for path in gamepulse/coverage/season16_coverage_audit.py gamepulse/coverage/tests/test_season16_coverage_audit.py; do
            gh api "repos/timeedmonds-maker/104/contents/$path?ref=main" --jq .content | base64 -d > "$RUNNER_TEMP/coverage/${path##*/}"
          done
          mv "$RUNNER_TEMP/coverage/test_season16_coverage_audit.py" "$RUNNER_TEMP/coverage/tests/"
          python3 -m py_compile "$RUNNER_TEMP/coverage/season16_coverage_audit.py"
          python3 -m unittest discover -v -s "$RUNNER_TEMP/coverage/tests"
  per-game:
    needs: verify-code
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        id: ['0022600001','0022600002','0022600003','0022600004',
             '0022600005','0022600006','0022600007','0022600085',
             '0022600086','0022600087','0022600088','0022600089',
             '0022600090','0022600091','0022600092','0022600093']
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - name: Download only private original source and independently certified official PBP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gamepulse-cover-$GAME_ID"
          mkdir -p "$ROOT/sdk" "$ROOT/live"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/coverage/season16_coverage_audit.py?ref=main' --jq .content | base64 -d > "$ROOT/coverage.py"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/$GAME_ID.json?ref=main" --jq .content | base64 -d > "$ROOT/official.json"
          gh api "repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-$GAME_ID" > "$ROOT/sdk-release.json"
          gh release download "gamepulse-sdk-$GAME_ID" --repo timeedmonds-maker/104 --pattern 'sdk-part-*.tar.gz' --dir "$ROOT/sdk"
          if [ "$GAME_ID" = 0022600006 ] || [ "$GAME_ID" = 0022600007 ]; then
            gh api "repos/timeedmonds-maker/104/releases/tags/gamepulse-live-sdk-$GAME_ID" > "$ROOT/live-release.json"
            gh release download "gamepulse-live-sdk-$GAME_ID" --repo timeedmonds-maker/104 --pattern 'live-*.tar.gz' --dir "$ROOT/live"
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/("gamepulse-cover-"+os.environ["GAME_ID"])
          assets={}
          for kind in ("sdk","live"):
              file=root/(kind+"-release.json")
              if not file.is_file():continue
              source=json.loads(file.read_text())
              for row in source.get("assets",[]):
                  name=row.get("name","")
                  if (kind=="sdk" and name.startswith("sdk-part-") and name.endswith(".tar.gz")) or (kind=="live" and name.startswith("live-") and name.endswith(".tar.gz")):
                      assets[name]=row.get("digest")
          (root/"digests.json").write_text(json.dumps(assets,sort_keys=True))
          print("PRIVATE_ORIGINAL_ASSET_MANIFEST_LOADED",len(assets))
          PY
      - name: Count authentic player, ball, 5v5 and event-proximity evidence Q1-Q4
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gamepulse-cover-$GAME_ID"
          args=(--game "$GAME_ID" --sdk-dir "$ROOT/sdk" --official "$ROOT/official.json"
                --release-digests "$ROOT/digests.json" --output "$ROOT/coverage.json")
          if [ -f "$ROOT/live-release.json" ]; then args+=(--live-dir "$ROOT/live"); fi
          python3 "$ROOT/coverage.py" "${args[@]}"
      - name: Commit only private aggregate quarter QA, verify bytewise SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/("gamepulse-cover-"+os.environ["GAME_ID"])
          data=(root/"coverage.json").read_bytes()
          if len(data)>=950000:raise RuntimeError("COVERAGE_REPORT_OVERSIZE")
          path="repos/timeedmonds-maker/104/contents/gamepulse/coverage/season16/"+os.environ["GAME_ID"]+".json"
          for attempt in range(5):
              prev=subprocess.run(["gh","api",path],capture_output=True,text=True)
              if prev.returncode and "404" not in prev.stderr:
                  raise RuntimeError("COVERAGE_PREVIOUS_READ_FAILED")
              payload={"branch":"main","message":"qa(gamepulse): source-verified independent Q1-Q4 active-play coverage",
                       "content":base64.b64encode(data).decode()}
              if prev.returncode==0:payload["sha"]=json.loads(prev.stdout)["sha"]
              put=subprocess.run(["gh","api","-X","PUT",path,"--input","-"],input=json.dumps(payload),
                                 capture_output=True,text=True)
              if put.returncode==0:break
          else:raise RuntimeError("COVERAGE_REPORT_PUBLISH_FAILED")
          stored=subprocess.run(["gh","api",path],capture_output=True,text=True,check=True)
          actual=base64.b64decode(json.loads(stored.stdout)["content"])
          if actual!=data or hashlib.sha256(actual).digest()!=hashlib.sha256(data).digest():
              raise RuntimeError("COVERAGE_QA_SHA_READBACK_FAILED")
          obj=json.loads(data)
          print("PRIVATE_QUARTER_COVERAGE_SHA_READBACK_VERIFIED",obj["game_id"],
                obj["full_active_play_observation_gate"])
          PY
      - name: Preserve no public licensed artifacts
        if: always()
        run: |
          test ! -d artifacts
          echo 'Game Pulse coverage kept in private 104 only.' >> "$GITHUB_STEP_SUMMARY"
