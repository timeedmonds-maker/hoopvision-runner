name: Integrated Pulse Blueprint xFG source event geometry 36 games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-blueprint-event-geometry-36.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blueprint-event-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard, private original NBA and Blueprint source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
            gamepulse/fusion data/extensions/nba_blueprint_2026_27
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free Blueprint event time and nearest XY error tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_blueprint_shot_event_benchmark_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_blueprint_shot_event_benchmark_2026.py
      - name: Two source-real original NBA Blueprint shot and xFG join
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_ippt_blueprint_shot_event_benchmark_2026.py \
             --root . --games 0022600009 0022600092
          echo "IPPT_BLUEPRINT_TWO_REAL_GAME_QA_PASS"
      - name: All original 36 games Blueprint event defender geometry retrieval benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_ippt_blueprint_shot_event_benchmark_2026.py --root .
          echo "IPPT_BLUEPRINT_36GAME_GEOMETRY_QA_PASS"
