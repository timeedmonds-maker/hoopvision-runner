name: IGP P3 all68 real live ten-ball one-sided shadow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-all68-one-sided-scene-shadow-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p3-all68-scene-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 79d9f5e99da8e302bf1d405f99a8ef809341da88
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and pin exact private NBA source branch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test and compute original all68 10-player plus ball scene shadow
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_all68_one_sided_scene_shadow_v1.py'
          python3 gamepulse/fusion/igp_68_p3_all68_one_sided_scene_shadow_v1.py --root . --output "$RUNNER_TEMP/all68-shadow.json" > "$RUNNER_TEMP/all68-shadow-private.log" 2>&1 || {
            echo IGP_P3_ALL68_SOURCE_SCENE_SHADOW_FAILED
            tail -n 8 "$RUNNER_TEMP/all68-shadow-private.log"
            exit 41
          }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'all68-shadow.json').read_text())
          assert len(j['games'])==68 and len(j['per_game'])==68
          c=j['all68_totals']
          assert c['native']['live_samples']==543024 and c['native']['control_complete']==492617
          assert c['continuous_10hz']['live_samples']==1106941 and c['continuous_10hz']['control_complete']==917686
          assert j['do_not_add_shadow_candidates_to_complete_scene_numerator']
          assert j['accepted_800ms_and_research_1200ms_unchanged']
          print('IGP_P3_ALL68_SCENE_SHADOW_QA',json.dumps(c,sort_keys=True))
          PY
      - name: Retain source-grade 68game shadow receipt privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_all68_one_sided_scene_shadow_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B all68-shadow "origin/$BRANCH"
          cp "$RUNNER_TEMP/all68-shadow.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): real original all68 ten ball one-sided shadow availability'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo P3_ALL68_SCENE_SHADOW_PRIVATE_RECEIPT_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
