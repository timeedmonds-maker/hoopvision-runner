name: IGP 71 new3 matched live-clock reconstruction 800 and 1200 QA
# Reviewed allowlisted private source evaluation: do not print XYZ
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-71-new3-live-play-source-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-71-new3-live-play-source-qa
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public boundary
        run: python3 tools/public_content_guard.py
      - name: Validate private 71-game sources and live-only model without publishing XYZ
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p test_igp_68_live_play_tracking_qa_v1.py
          mkdir -p gamepulse/fusion/qa/igp_progress_20261031
          python3 gamepulse/fusion/igp_71_new3_live_play_tracking_qa_v1.py --root . --output gamepulse/fusion/qa/igp_progress_20261031/igp_71_new3_live_play_tracking_qa_v1.json >"$RUNNER_TEMP/private-new3.log" 2>&1 || {
             tail -60 "$RUNNER_TEMP/private-new3.log" | sed -E 's/[0-9]{10,}/[UTC_REDACTED]/g'
             exit 27
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_progress_20261031/igp_71_new3_live_play_tracking_qa_v1.json')
          d=json.loads(p.read_bytes());c=d['counts']; assert d['games']==3
          assert c['official_window_native_frames']==41902
          for key in ('live_clock_running_pbp_proxy_native_frames','live_clock_running_pbp_proxy_10hz_samples'):
            assert c[key]>0
          n=c['live_clock_running_pbp_proxy_native_frames'];g=c['live_clock_running_pbp_proxy_10hz_samples']
          for label,k,denom in [
            ('accepted_native','live_clock_running_pbp_proxy_conditioned_complete_ten_ball',n),
            ('accepted_10hz','live_clock_running_pbp_proxy_10hz_complete_ten_ball',g),
            ('research_1200_native','live_clock_running_pbp_proxy_1200ms_complete_ten_ball',n),
            ('research_1200_10hz','live_clock_running_pbp_proxy_1200ms_10hz_complete_ten_ball',g)]:
            print('IGP71_NEW3_LIVE_MATCHED_RATE',label,c[k],denom,round(100*c[k]/denom,4))
          print('IGP71_NEW3_LIVE_OFFICIAL_PBP_PROXY',n,g)
          PY
      - name: Preserve only QA in private canonical repo
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261031/igp_71_new3_live_play_tracking_qa_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP71_NEW3_LIVE_QA_ALREADY_CURRENT; exit 0; fi
          git commit -q -m 'qa(igp): 71 new3 exact live-clock source reconstruction 800ms accepted versus 1200ms shadow'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo IGP71_NEW3_LIVE_PRIVATE_ACCEPTANCE_COMMITTED; exit 0; fi
            sleep "$attempt"
          done
          exit 25
