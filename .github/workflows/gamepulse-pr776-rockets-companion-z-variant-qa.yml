name: Rockets companion original SDK Z variant QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-rockets-companion-z-variant-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-rockets-companion-z-variant-qa
  cancel-in-progress: false
jobs:
  original-variant-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GAME_ID: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public boundary and clone private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          export GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Download immutable original SDK parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GAME_ID" > "$RUNNER_TEMP/release.json"
          gh release download "gamepulse-sdk-$GAME_ID" -R "$PRIVATE_REPO" \
            --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk"
          test "$(find "$RUNNER_TEMP/sdk" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
      - name: Verify original bytes and isolate exact raw keyframe variants privately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,io,json,os,pathlib,tarfile
          from collections import Counter
          root=pathlib.Path(os.environ['PRIVATE_ROOT'])
          base=root/'gamepulse/fusion'
          target=1792808076916
          player='1628368'
          paths={
            'index':base/'materialized/igp_all_original_xyz/0022600009/index.json',
            'companion':base/'evidence/companion_0022600009/easelive_positions_event_index_user_capture_20261029.json',
            'parity':base/'qa/igp_progress_20261029/rockets_spurs_companion_100_exact_native_shard_parity_20261029.json',
          }
          pins={'index':'616644ceba2463bd4c51898881263fd0dfbc6645',
                'companion':'b3b686b3aa625a477d79f142f46174594d362fd4',
                'parity':'3c75e54d629ddb9ee04c1b5c638ca657a3a84411'}
          def require(ok,reason):
              if not ok:raise ValueError(reason)
          def gitsha(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def canon(v):
              return json.dumps(v,sort_keys=True,separators=(',',':'),allow_nan=False)
          for k,p in paths.items():require(gitsha(p.read_bytes())==pins[k],'SOURCE_GIT_BLOB_CHANGED:'+k)
          index,companion,parity=[json.loads(paths[k].read_bytes()) for k in ('index','companion','parity')]
          require(index['game_id']==companion['gameId']==parity['game_id']=='0022600009','CROSS_GAME')
          q=parity['results']['quarantined_xyz_difference']
          require(q['utc_ms']==target and q['native_player_id']==player,'PARITY_TARGET_CHANGED')
          batch=[x for x in companion['eventBatches'] if x['timestamp']==target]
          require(len(batch)==1,'CAPTURED_SAMPLE_NOT_UNIQUE')
          sample=batch[0]['firstFrame']['positions']
          require(player in sample,'CAPTURED_PLAYER_MISSING')
          shard=base/'materialized/igp_all_original_xyz/0022600009/original-native-00004.jsonl.gz'
          part=next(x for x in index['chunks'] if x['path']==shard.name)
          raw=shard.read_bytes()
          require(hashlib.sha256(raw).hexdigest()==part['sha256'],'SHARD_SHA256_MISMATCH')
          source=[json.loads(line) for line in gzip.decompress(raw).splitlines()
                  if line.strip() and str(target).encode() in line]
          source=[x for x in source if x.get('source_frame_utc_ms')==target]
          require(len(source)==1,'SHARD_TARGET_NOT_UNIQUE')
          selected=source[0]
          require(selected['source_frame_grade']=='ORIGINAL_SDK_RICHEST_RAW_KEYFRAME_DIRECT','SHARD_NOT_DIRECT')
          chosen=selected['positions_native_units']
          require(player in chosen,'SELECTED_PLAYER_MISSING')
          def match_count(pos):
              return sum(k in pos and list(pos[k][:3])==list(v[:3]) for k,v in sample.items())
          selected_count=match_count(chosen)
          selected_delta=round(chosen[player][2]-sample[player][2],6)
          require(selected_delta==q['source_minus_companion_native_units'],'PARITY_DELTA_CHANGED')
          release=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'release.json').read_bytes())
          require(release['tag_name']=='gamepulse-sdk-0022600009','WRONG_RELEASE')
          expected={a['name']:a['digest'].removeprefix('sha256:') for a in release['assets']
                    if a.get('name','').startswith('sdk-part-') and a['name'].endswith('.tar.gz')}
          assets=sorted(pathlib.Path(os.environ['RUNNER_TEMP'],'sdk').glob('sdk-part-*.tar.gz'))
          require(len(expected)==len(assets)==13 and set(expected)=={p.name for p in assets},
                  'REQUIRE_ALL_13_SOURCE_PARTS')
          variants=[]
          for asset in assets:
              b=asset.read_bytes()
              h=hashlib.sha256(b).hexdigest()
              require(h==expected[asset.name]==index['original_archive_parts_sha256'][asset.name],
                      'SDK_ARCHIVE_SHA256_MISMATCH:'+asset.name)
              with tarfile.open(fileobj=io.BytesIO(b),mode='r:gz') as tar:
                  manifest=json.load(tar.extractfile('manifest.json'))
                  require(manifest.get('game_id')=='0022600009' and manifest.get('observed') is True
                          and manifest.get('imputed') is False,'WRONG_SOURCE_SCOPE')
                  with gzip.GzipFile(fileobj=tar.extractfile('raw-slots.jsonl.gz')) as stream:
                      for line in stream:
                          if not line.strip():continue
                          slot=json.loads(line)
                          for event in slot.get('events',[]):
                              for frame in (event.get('metadata') or {}).get('keyframes',[]):
                                  if frame.get('timestamp')!=target:continue
                                  pos=frame.get('positions')
                                  require(isinstance(pos,dict),'INVALID_RAW_POSITIONS')
                                  variants.append({'sha256':hashlib.sha256(canon(pos).encode()).hexdigest(),
                                      'exact_companion_entities':match_count(pos),
                                      'player_z_delta_native_units':round(pos[player][2]-sample[player][2],6) if player in pos else None,
                                      'interpolated':frame.get('interpolated'),
                                      'players':sum(k!='ball' for k in pos),
                                      'ball_present':'ball' in pos})
          require(variants and len(variants)==selected['original_raw_variant_count'],
                  'RAW_VARIANT_COUNT_MISMATCH')
          exact=sum(x['exact_companion_entities']==len(sample) for x in variants)
          classification=('ALTERNATE_RAW_VARIANT_MATCHES_COMPANION' if exact and selected_count!=len(sample)
             else 'SELECTED_SOURCE_MATCHES_COMPANION' if selected_count==len(sample)
             else 'COMPANION_DIFFERENCE_NOT_EXPLAINED_BY_RAW_VARIANTS')
          receipt={
            'schema':'gamepulse.rockets_companion_original_sdk_z_variant_audit.v1',
            'game_id':'0022600009','native_timestamp_ms':target,'player_id':player,
            'source_git_blob_sha1':pins,
            'source_shard_sha256':part['sha256'],'original_sdk_archive_parts_sha256_verified':13,
            'raw_keyframes_at_exact_timestamp':len(variants),
            'distinct_original_position_variants':len(set(x['sha256'] for x in variants)),
            'captured_companion_entities':len(sample),
            'selected_source_entities_matching_companion':selected_count,
            'selected_source_z_minus_companion_native_units':selected_delta,
            'raw_variants_exactly_matching_companion':exact,
            'variant_summary_no_raw_coordinates':variants,'classification':classification,
            'physical_possessions_certified':0,'native_player_team_ids_certified':False,
            'video_pts_certified':False,'native_to_official_clock_certified':False,
            'gameplay_coverage_certified':False,'full_integration_complete':False,
            'completion_notification_authorized':False,
            'caution':'Source variants and sampled companion XYZ do not independently establish physical tracking truth; no raw coordinates exported.'
          }
          dest=base/'qa/igp_progress_20261029/rockets_spurs_companion_original_raw_z_variant_audit_20261029.json'
          require(not dest.exists(),'REFUSE_OVERWRITE_EXISTING_QA')
          dest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('PRIVATE_ORIGINAL_Z_VARIANT_QA',json.dumps({'sdk_parts_verified':13,
             'raw_keyframes':len(variants),'distinct_variants':receipt['distinct_original_position_variants'],
             'matching_companion_variants':exact,'classification':classification,
             'physical_possessions_certified':0},sort_keys=True))
          PY
      - name: Publish private aggregate receipt without source coordinate leakage
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          P=gamepulse/fusion/qa/igp_progress_20261029/rockets_spurs_companion_original_raw_z_variant_audit_20261029.json
          git add "$P"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -qm "qa(gamepulse): SHA-audit original Rockets companion Z keyframe variants"
          git fetch -q origin "$PRIVATE_BRANCH"
          git rebase -q "origin/$PRIVATE_BRANCH"
          git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
          echo PRIVATE_ROCKETS_VARIANT_RECEIPT_PUBLISHED
