name: Inspect NBA Clip Metadata
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-clip-metadata.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect known and candidate clip pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,html
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          H={'User-Agent':UA,'Referer':'https://clips.nba.com/','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'}
          for game,event in [('0022500131',585),('0012500014',350)]:
            url=f'https://clips.nba.com/?gameNo={game}&eventNum={event}&source=grs'
            try:
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=20) as r:
                txt=r.read().decode('utf-8','ignore')
              print('\n===',game,event,'bytes',len(txt),'===')
              for pat in ['<title[^>]*>(.*?)</title>','description.{0,200}','Steven.{0,200}','Adams.{0,200}','event.{0,120}','<option\\s+value="([^"]+)"([^>]*)>(.*?)</option>']:
                ms=list(re.finditer(pat,txt,flags=re.I|re.S))
                print('PAT',pat,'COUNT',len(ms))
                for m in ms[:20]:
                  print(re.sub(r'\\s+',' ',html.unescape(m.group(0)))[:700])
            except Exception as e:
              print('FAIL',game,event,repr(e))
          PY
