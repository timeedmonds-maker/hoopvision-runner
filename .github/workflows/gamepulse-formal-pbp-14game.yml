name: NBA formal play-by-play 14-game acceptance (private output)
# Public GitHub CPU; only public NBA PBP and private metadata source are read.
# Official event time is not video PTS or independent possession-touch truth.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-formal-pbp-14game.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-formal-nba-14game-acceptance
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce licensed-source and credential boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_REPO_AUTH_UNAVAILABLE'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch trusted private official NBA source validators
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nba-formal-pbp"
          mkdir -p "$ROOT"
          for name in official_pbp_timestamps_2026.py official_pbp_allgames_2026.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$name?ref=main" --jq .content |
              base64 -d > "$ROOT/$name"
          done
          python3 -m py_compile "$ROOT/official_pbp_timestamps_2026.py" "$ROOT/official_pbp_allgames_2026.py"
          python3 "$ROOT/official_pbp_timestamps_2026.py" --selftest
      - name: Reconcile every original game to official NBA events and boxscore
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/nba-formal-pbp"
          python3 -u official_pbp_allgames_2026.py
      - name: Require complete private manifest with fourteen score checks
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/index.json --jq .content |
            base64 -d > "$RUNNER_TEMP/nba-formal-pbp/manifest.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'nba-formal-pbp/manifest.json'
          m=json.loads(p.read_text())
          assert m['schema']=='gamepulse.formal-nba-official-event-clock-14game.v1'
          assert m['source_game_count']==14 and len(m['games'])==14
          assert m['nba_game_score_checks_passed']==14
          assert m['nba_action_count']==sum(g['action_records'] for g in m['games'].values())
          assert m['nba_actions_with_direct_nba_timeActual']==sum(
              g['actions_with_official_timeActual_utc'] for g in m['games'].values())
          assert all(g['action_records']>=300 and g['actions_with_official_timeActual_utc']>0
                     and g['source_pbp_sha256'] for g in m['games'].values())
          assert m['video_playback_pts_certified']==0
          assert m['per_possession_ball_touch_ppp_certified']==0
          print('NBA_FORMAL_14GAME_PRIVATE_MANIFEST_ACCEPTED',
                'games=',m['source_game_count'],
                'events=',m['nba_action_count'],
                'official_utc_rows=',m['nba_actions_with_direct_nba_timeActual'])
          PY
      - name: Private-only provenance disclosure
        if: always()
        shell: bash
        run: |
          echo 'Formal NBA event clock/score certification attempted; all per-game results remain in private 104.' >> "$GITHUB_STEP_SUMMARY"
