name: Resolve Tatum Q4 miss event

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-tatum-q4-miss.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: Resolve target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests
          from pathlib import Path

          gid='0022600001'; pid=1628369
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          hdr={'User-Agent':UA,'Referer':'https://www.nba.com/','Origin':'https://www.nba.com','Accept':'application/json, text/plain, */*'}

          x=requests.get('https://stats.gleague.nba.com/stats/shotqualityvideologs',
                         params={'GameID':gid,'PlayerID':pid},headers=hdr,timeout=(8,45))
          x.raise_for_status(); j=x.json()
          cands=[]
          for z in j.get('shotList') or []:
              if int(z.get('period') or 0)!=4 or int(z.get('success') or 0)!=0:
                  continue
              clock=str(z.get('gameClock') or '')
              m=re.match(r'^(\d+):(\d+(?:\.\d+)?)$',clock)
              if not m: continue
              sec=int(m.group(1))*60+float(m.group(2))
              if 90 <= sec <= 150:
                  try:q=float(z.get('shotQuality'))
                  except Exception:q=None
                  cands.append({
                    'event_num':int(z.get('eventNum')),
                    'clock':clock,'action_type':z.get('actionType'),
                    'shot_type':z.get('shotType'),'shot_quality':q,
                    'xfg_pct':100*q if q is not None and q<=1.5 else q
                  })

          pbp_info=[]
          try:
              p=requests.get('https://stats.nba.com/stats/playbyplayv3',
                             params={'GameID':gid,'StartPeriod':0,'EndPeriod':14},
                             headers=hdr,timeout=(8,45))
              status=p.status_code
              if status==200:
                  pj=p.json()
                  # resultSets-style or actions-style payload
                  actions=pj.get('game',{}).get('actions') or pj.get('actions') or []
                  if not actions and pj.get('resultSets'):
                      rs=pj['resultSets'][0]
                      heads=rs.get('headers') or []
                      actions=[dict(zip(heads,row)) for row in rs.get('rowSet') or []]
                  for a in actions:
                      txt=json.dumps(a)
                      ev=a.get('actionNumber') or a.get('eventNum') or a.get('EVENTNUM') or a.get('EVENT_NUM')
                      try: ev=int(ev)
                      except Exception: continue
                      if ev in {c['event_num'] for c in cands}:
                          pbp_info.append({
                              'event_num':ev,
                              'clock':a.get('clock') or a.get('PCTIMESTRING'),
                              'description':a.get('description') or a.get('HOMEDESCRIPTION') or a.get('VISITORDESCRIPTION'),
                              'score_home':a.get('scoreHome') or a.get('SCOREHOME'),
                              'score_away':a.get('scoreAway') or a.get('SCOREAWAY'),
                              'score':a.get('score') or a.get('SCORE'),
                              'raw':a
                          })
              else:
                  pbp_info=[{'stats_pbp_status':status,'body_prefix':p.text[:300]}]
          except Exception as e:
              pbp_info=[{'stats_pbp_error':repr(e)}]

          # Verify clips titles for candidate events.
          clip_hdr={'User-Agent':UA,'Referer':'https://clips.nba.com/','Accept':'text/html,*/*'}
          clip_rows=[]
          for c in cands:
              u=f'https://clips.nba.com/?gameNo={gid}&eventNum={c["event_num"]}&source=grs'
              rr=requests.get(u,headers=clip_hdr,timeout=(5,20))
              tm=re.search(r'<title>(.*?)</title>',rr.text,re.I|re.S)
              clip_rows.append({**c,'clips_url':u,'title':tm.group(1).strip() if tm else ''})

          out={'game_id':gid,'player':'Jayson Tatum','candidates':clip_rows,'pbp_matches':pbp_info}
          Path('experiment_results/tatum_q4_miss').mkdir(parents=True,exist_ok=True)
          Path('experiment_results/tatum_q4_miss/latest.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hoopvision-public-probe
          git config user.email hoopvision-public-probe@users.noreply.github.com
          git add experiment_results/tatum_q4_miss/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Resolve Tatum Q4 miss event [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
