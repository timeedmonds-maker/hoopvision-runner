name: Clip Lab Adams86 original vs xFG media quality CPU QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-adams86-xfg-source-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private destination and public-content boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-adams86-xfg-source-quality.yml'])
          print('NATIVE_XFG_SOURCE_PUBLIC_BOUNDARY_PASS')
          PY
          test -n "${GH_TOKEN:-}" || exit 3
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Compare original source, authorized xFG index, and alternate HLS renditions
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/xfg86"
          mkdir -p "$ROOT/hoopvision/freeview"
          touch "$ROOT/hoopvision/__init__.py" "$ROOT/hoopvision/freeview/__init__.py"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/fetch_official_multicam.py?ref=b154a834a95a887226757a4ff0d5b34f69bc55e6' --jq .content | base64 -d > "$ROOT/hoopvision/freeview/fetch_official_multicam.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/0022600009.json' --jq .content | base64 -d > "$ROOT/index.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/0022600009.json' --jq .content | base64 -d > "$ROOT/pbp.json"
          gh release download clip-lab-rockets-spurs-0022600009-e86-broadcast --repo timeedmonds-maker/104 --pattern '0022600009-e86-broadcast.mp4' --dir "$ROOT" >/dev/null
          PYTHONPATH="$ROOT" python3 - "$ROOT" <<'PY'
          import json,sys,re,subprocess,hashlib
          from pathlib import Path
          from urllib.parse import urlsplit
          from hoopvision.freeview.fetch_official_multicam import resolve_options,get
          root=Path(sys.argv[1])
          idx=json.loads((root/'index.json').read_text())
          pbp=json.loads((root/'pbp.json').read_text())
          official=[a for a in pbp['actions'] if a.get('nba_action_number')==86]
          assert len(official)==1 and official[0].get('person_id')==203500
          xfg=[x for x in idx['shots'] if x.get('event_num')==86]
          assert len(xfg)==1
          video=root/'0022600009-e86-broadcast.mp4'
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
             'stream=codec_type,codec_name,width,height,avg_frame_rate,bit_rate:format=duration,size,bit_rate',
             '-of','json',str(video)],text=True))
          angles={};state='OPTIONS_NOT_RETRIEVED'
          try:
            opts=resolve_options('0022600009',86)
            for label,url in opts.items():
              host=urlsplit(url).hostname or ''
              if host!='lrmedia.nba.com' and not host.endswith('.lrmedia.nba.com'):
                continue
              try:
                playlist=get(url).decode('utf-8','replace')
                variants=[]
                for line in playlist.splitlines():
                  if not line.startswith('#EXT-X-STREAM-INF:'):continue
                  bandwidth=re.search(r'BANDWIDTH=(\d+)',line)
                  size=re.search(r'RESOLUTION=(\d+x\d+)',line)
                  variants.append({'bandwidth_bps':int(bandwidth.group(1)) if bandwidth else None,
                                   'resolution':size.group(1) if size else None})
                angles[label]={'accessible':True,'playlist_variants':variants}
              except Exception as ex:
                angles[label]={'accessible':False,'error_class':type(ex).__name__}
            state='OPTIONS_RETRIEVED'
          except Exception as ex:
            state='OPTIONS_FAILED_'+type(ex).__name__
          row=xfg[0];xfg_actor=row.get('shooter_id')
          report={'schema':'hoopvision.clip-lab.event86-source-video-quality-qa.v1',
              'game':'0022600009','nba_event':86,'official_actor':203500,'cpu_only':True,
              'iphone_screenrecord':{'width':908,'height':512,'fps':30,'video_bitrate_bps':4819975,
                'sha256':'b96324b522cd75e46ab8bc8da6a51af751299ac3f931b7db3cb021316e61020a'},
              'native_original_broadcast':{'sha256':hashlib.sha256(video.read_bytes()).hexdigest(),'ffprobe':meta},
              'xfg_source':{'shooter_id':xfg_actor,'official_match':str(xfg_actor)=='203500',
                'linked_video_url':bool(row.get('video_url')),
                'can_select_as_video_master':str(xfg_actor)=='203500' and bool(row.get('video_url'))},
              'angles_state':state,'angle_variant_catalog':angles,
              'source_choice':'original NBA event86 HLS broadcast with highest provider available bandwidth',
              'comparison_status':'METADATA_NOT_SIDE_BY_SIDE_FRAME_QUALITY',
              'notes':['provider original may preserve better detail despite lower overall bitrate',
               'do not treat xFG row with conflicting shooter as verified source',
               'alternate cameras help occlusion but require independent homography',
               'original user video not present on remote runner for pixel quality comparison']}
          (root/'source_quality.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('ADAMS86_NATIVE_XFG_CPU_QUALITY_REVIEW_PASS')
          print('ADAMS86_REPLAY_CAMERA_OPTIONS',len(angles))
          print('XFG_IDENTITY_MISMATCH',str(xfg_actor)!='203500')
          PY
          gh release upload clip-lab-rockets-spurs-0022600009-e86-broadcast "$ROOT/source_quality.json" --repo timeedmonds-maker/104 --clobber
          python3 - "$ROOT" <<'PY'
          import json,subprocess,hashlib,sys
          from pathlib import Path
          file=Path(sys.argv[1])/'source_quality.json'
          r=json.loads(subprocess.check_output(['gh','api','repos/timeedmonds-maker/104/releases/tags/clip-lab-rockets-spurs-0022600009-e86-broadcast'],text=True))
          a=next(x for x in r['assets'] if x['name']=='source_quality.json')
          assert a['digest']=='sha256:'+hashlib.sha256(file.read_bytes()).hexdigest()
          print('ADAMS86_PRIVATE_QUALITY_QA_SHA_VERIFIED')
          PY
