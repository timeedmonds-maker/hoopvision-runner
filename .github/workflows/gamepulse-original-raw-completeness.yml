name: Integrated Pulse original raw tracking completeness
# Security reviewed: original SHA-verified aggregate QA only.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-original-raw-completeness.yml']
permissions:
  contents: read
jobs:
  audit-all-original-games:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        game: ['0022600001', '0022600002', '0022600003', '0022600004', '0022600005', '0022600006', '0022600007', '0022600008', '0022600009', '0022600085', '0022600086', '0022600087', '0022600088', '0022600089', '0022600090', '0022600091', '0022600092', '0022600093', '0022600094', '0022600095', '0022600096', '0022600097', '0022600098', '0022600099', '0022600100', '0022600101', '0022600102', '0022600103']
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.game }}
      PRIVATE_REPO: timeedmonds-maker/104
      AUDIT_PIN: 93266712687260b762ae459784717b7a5e7cdbd2
      CONTINUITY_PIN: 3676e23d77d014b31fa8a02c25b76d838f057579
      MOTION_PIN: 39300c98b8400c14cc2bb9d6f0d0c347815c5b72
      HOOP_PIN: 94ab9b5e08db77a6e5c47102461df277452388a8
      FRESHNESS_PIN: 75e5583cbc2bc6eb076ed49a67d0dbf5f34ba3e4
      BIDIR_PIN: 0ddecc9351dc86ced2ed9e27c7cbbb5c974e46fb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download source and run SHA-verified read-only raw slot audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          mkdir -p "$RUNNER_TEMP/pulse/raw"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/audit_original_sdk_raw_vs_simplified_frames_2026.py?ref=$AUDIT_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/audit.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/audit_original_sdk_raw_continuity_2026.py?ref=$CONTINUITY_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/continuity.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/audit_original_sdk_ball_motion_2026.py?ref=$MOTION_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/motion.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/audit_original_sdk_hoop_event_coverage_2026.py?ref=$HOOP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/hoop.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/qa/auto_physics/${GAME_ID:0:8}/$GAME_ID.json?ref=main" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/hoop_qa.json"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/audit_original_sdk_ten_player_freshness_2026.py?ref=$FRESHNESS_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/freshness.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/index/games/$GAME_ID.json?ref=$FRESHNESS_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/roster.json"
          gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GAME_ID" > "$RUNNER_TEMP/pulse/release.json"
          gh release download "gamepulse-sdk-$GAME_ID" --repo "$PRIVATE_REPO" --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/pulse/raw"
          python3 "$RUNNER_TEMP/pulse/audit.py" --game-id "$GAME_ID" --archive-dir "$RUNNER_TEMP/pulse/raw" --release-json "$RUNNER_TEMP/pulse/release.json" --out "$RUNNER_TEMP/pulse/coverage.json"
          python3 "$RUNNER_TEMP/pulse/continuity.py" --game-id "$GAME_ID" --archive-dir "$RUNNER_TEMP/pulse/raw" --release-json "$RUNNER_TEMP/pulse/release.json" --out "$RUNNER_TEMP/pulse/continuity.json"
          python3 "$RUNNER_TEMP/pulse/motion.py" --game-id "$GAME_ID" --archive-dir "$RUNNER_TEMP/pulse/raw" --release-json "$RUNNER_TEMP/pulse/release.json" --out "$RUNNER_TEMP/pulse/motion.json"
          python3 "$RUNNER_TEMP/pulse/hoop.py" --game-id "$GAME_ID" --archive-dir "$RUNNER_TEMP/pulse/raw" --release-json "$RUNNER_TEMP/pulse/release.json" --hoop-qa "$RUNNER_TEMP/pulse/hoop_qa.json" --out "$RUNNER_TEMP/pulse/hoop_coverage.json"
          python3 "$RUNNER_TEMP/pulse/freshness.py" --game-id "$GAME_ID" --archive-dir "$RUNNER_TEMP/pulse/raw" --release-json "$RUNNER_TEMP/pulse/release.json" --roster "$RUNNER_TEMP/pulse/roster.json" --hoop-qa "$RUNNER_TEMP/pulse/hoop_qa.json" --out "$RUNNER_TEMP/pulse/freshness.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"pulse/coverage.json").read_text())
          assert result["game_id"]==os.environ["GAME_ID"]
          assert result["counts"]["distinct_native_timestamps"]>0
          if result["game_id"]=="0022600009":
              assert result["counts"]["distinct_native_timestamps"]==34979
          print("SOURCE_RAW_COMPLETENESS_AGGREGATE_ONLY",result["game_id"],json.dumps(result["counts"],sort_keys=True))
          detail=json.loads((Path(os.environ["RUNNER_TEMP"])/"pulse/continuity.json").read_text())
          assert detail["snapshot_count"]==result["counts"]["distinct_native_timestamps"]
          if result["game_id"]=="0022600009":
              print("ORIGINAL_RAW_EVENT_FIELD_COUNTS",json.dumps({"event":detail["raw_event_top_level_field_name_counts"],"metadata":detail["raw_metadata_field_name_counts"]},sort_keys=True))
          PY
