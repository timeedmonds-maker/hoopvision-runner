name: Integrated Pulse original raw tracking completeness
# Security reviewed: original SHA-verified aggregate QA only; one-game acceptance pilot.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-original-raw-completeness.yml']
permissions:
  contents: read
jobs:
  audit-original-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: '0022600009'
      PRIVATE_REPO: timeedmonds-maker/104
      BIDIR_PIN: 0ddecc9351dc86ced2ed9e27c7cbbb5c974e46fb
      LINEUP_PIN: ca6e756a6c5fbd5daf51354a629eb6fa3f934384
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight private source and regression tests before archive transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          mkdir -p "$RUNNER_TEMP/pulse/raw"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/audit_original_sdk_bidirectional_holdout_2026.py?ref=$BIDIR_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/audit_original_sdk_bidirectional_holdout_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/official_lineup_trajectory_2026.py?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/official_lineup_trajectory_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/tests/test_original_sdk_bidirectional_holdout_2026.py?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/test_original_sdk_bidirectional_holdout_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/tests/test_official_lineup_trajectory_2026.py?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/test_official_lineup_trajectory_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/index/games/$GAME_ID.json?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/roster.json"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/qa/auto_physics/${GAME_ID:0:8}/$GAME_ID.json?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/hoop_qa.json"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/official_pbp_timing/games/$GAME_ID.json?ref=$LINEUP_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/pulse/pbp.json"
          (cd "$RUNNER_TEMP/pulse" && python3 -m py_compile audit_original_sdk_bidirectional_holdout_2026.py official_lineup_trajectory_2026.py && python3 -m unittest discover -p 'test_*2026.py' -v)
          gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GAME_ID" > "$RUNNER_TEMP/pulse/release.json"
          gh release download "gamepulse-sdk-$GAME_ID" --repo "$PRIVATE_REPO" --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/pulse/raw"
          python3 "$RUNNER_TEMP/pulse/official_lineup_trajectory_2026.py" --game-id "$GAME_ID" --archive-dir "$RUNNER_TEMP/pulse/raw" --release-json "$RUNNER_TEMP/pulse/release.json" --roster "$RUNNER_TEMP/pulse/roster.json" --pbp "$RUNNER_TEMP/pulse/pbp.json" --hoop-qa "$RUNNER_TEMP/pulse/hoop_qa.json" --out "$RUNNER_TEMP/pulse/official_lineup_result.json"
          # Publish identity-only diagnostic into the existing private PR; never stdout or a public artifact.
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          folder=Path(os.environ["RUNNER_TEMP"])/"pulse"
          raw=(folder/"official_lineup_result.json").read_bytes()
          result=json.loads(raw)
          assert result["game_id"]==os.environ["GAME_ID"]
          assert len(result["private_conflict_details"])==result["counts"]["independent_anchor_lineup_disagreements"]
          assert all("xyz" not in json.dumps(row).lower() for row in result["private_conflict_details"])
          payload={"branch":"research/gamepulse-clock-boundary-integrity-20261025",
                   "message":"qa(gamepulse): retain private Rockets original-source lineup conflict evidence",
                   "content":base64.b64encode(raw).decode()}
          (folder/"private_publication.json").write_text(json.dumps(payload))
          PY
          gh api --method PUT "repos/$PRIVATE_REPO/contents/gamepulse/fusion/qa/rockets_original_lineup_conflicts_0022600009_20261026.json" --input "$RUNNER_TEMP/pulse/private_publication.json" >/dev/null
          echo "PRIVATE_CONFLICT_QA_PUBLISHED game=$GAME_ID"
