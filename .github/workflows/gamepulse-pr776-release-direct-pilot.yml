name: Game Pulse original SDK direct-release integrity connectivity pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-release-direct-pilot.yml','tools/public_content_guard.py']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public contents and try licensed private release bytes without REST
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          asset_id="$(gh api graphql -f query='query { repository(owner:"timeedmonds-maker",name:"104"){release(tagName:"gamepulse-sdk-0022600104"){releaseAssets(first:30){nodes{name databaseId}}}}}' \
            --jq '.data.repository.release.releaseAssets.nodes[] | select(.name=="sdk-part-00.tar.gz") | .databaseId')"
          test "$asset_id" -gt 0
          echo "PRIVATE_RELEASE_GRAPHQL_ASSET_ID_RESOLVED"
          curl -fsSL --max-time 50 --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/timeedmonds-maker/104/releases/assets/$asset_id" \
            -o "$RUNNER_TEMP/part.tar.gz"
          tar -tzf "$RUNNER_TEMP/part.tar.gz" | grep -qx 'manifest.json'
          test "$(stat -c %s "$RUNNER_TEMP/part.tar.gz")" -gt 500
          echo "ORIGINAL_PRIVATE_RELEASE_GRAPHQL_ASSET_DOWNLOAD_WORKS"
