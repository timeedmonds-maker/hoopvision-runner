name: IGP Fusion v3.1 P4 original independent NBA Broadcast possession benchmarking
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-fusion-p4-independent-video-possession.yml']
permissions: {contents: read}
concurrency:
  group: igp-fusion-v31-p4-independent-broadcast
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: bd5ceb70a9ca43617c9b298b382b2b3bfabb006b
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confidentiality guard and pinned private original NBA/video SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free regressions and independent Broadcast video vs IGP source readback
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_v31_independent_video_possession_benchmark_v1.py'
          if ! python3 gamepulse/fusion/igp_fusion_v31_independent_video_possession_benchmark_v1.py --root . --output "$RUNNER_TEMP/p4-independent-private.json" > "$RUNNER_TEMP/p4-independent-private.log" 2>&1; then
            echo IGP_P4_INDEPENDENT_VIDEO_SOURCE_BENCHMARK_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'p4-independent-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('P4_NON_SENSITIVE_EXCEPTION_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:80])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'p4-independent-private.json').read_text())
          v=j['independent_video_evidence'];s=j['source_reference'];p=j['scorecard']
          assert j['engine_version']=='igp-fusion-v3.1-research'
          assert v['independent_scoreboard_readings']==9
          assert v['original_broadcast_sampled_frames']==14
          assert v['broadcast_visually_supported_offense']=='DET'
          assert v['video_to_original_NBA_SDK_UTC_certified'] is False
          assert s['original_native_source_frames_in_NBA_logged_UTC_proxy']==28
          assert s['original_direct_official_ten_plus_ball_frames_from_SHA_prior']==26
          assert p['independent_video_offense_team_vs_NBA_PBP_correct']==1
          assert p['measured_player_XY_video_ground_truth_points']==0
          assert p['measured_ball_XYZ_video_ground_truth_points']==0
          assert p['independently_certified_complete_physical_possessions']==0
          assert p['independent_video_ball_3D_p95_ft'] is None
          assert p['independent_video_player_XY_p95_ft'] is None
          assert j['promotion_accepted_tracking_positions']==0
          assert j['original_NBA_SDK_XYZ_PBP_IDs_accepted_800_and_P3_unmodified']
          print('IGP_P4_INDEPENDENT_BROADCAST_REAL_SOURCE_BENCHMARK',json.dumps({
             'sampled_video_frames':v['original_broadcast_sampled_frames'],
             'independent_video_scoreboard_checks':v['independent_scoreboard_readings'],
             'visually_supported_team_owner_matches':p['independent_video_offense_team_vs_NBA_PBP_correct'],
             'original_source_chain_frames':s['original_native_source_frames_in_NBA_logged_UTC_proxy'],
             'direct_official_ten_ball_frames':s['original_direct_official_ten_plus_ball_frames_from_SHA_prior'],
             'IGP_Fusion_10hz_logged_window':j['igp_fusion_10hz_NBA_logged_chain_candidate_window']['counts'],
             'independent_3D_ball_samples':0,
             'video_to_SDK_UTC_certified':False,
             'physical_possessions_certified':0,
             'promotion':0},sort_keys=True))
          PY
      - name: Commit private independent video original-SDK QA result only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_v31_independent_video_possession_benchmark_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p4-independent-video "origin/$BRANCH"
          cp "$RUNNER_TEMP/p4-independent-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): P4 independent decoded NBA Broadcast DET possession benchmark vs original IGP Fusion v3.1'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P4_INDEPENDENT_VIDEO_SOURCE_QA_PRIVATE_SAVED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
