# Source-original NBA 0006 accepted baseline 66ft masked ball discrep forensic, private.
name: IGP 3.2 accepted-model 66ft ball source anomaly forensic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-existing-ball66-forensic.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-existing-66ball-forensic
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and SHA original private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_0006_existing_ball66_source_forensic_v1.py
      - name: Independently reproduce prior source-only 66ft baseline discrepancy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_0006_existing_ball66_source_forensic_v1.py \
            --root . --output "$RUNNER_TEMP/igp-v32-ball66-forensic-private.json" \
            >"$RUNNER_TEMP/igp-v32-ball66-private.log" 2>&1 || {
              echo IGP_V32_BALL66_PRIVATE_SOURCE_FORENSIC_FAILED
              exit 111
            }
          grep '^IGP_V32_EXISTING_800MS_BALL66_SOURCE_FORENSIC' "$RUNNER_TEMP/igp-v32-ball66-private.log" || true
      - name: Save private original time / source error-axes forensic
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_existing_800ms_ball66_game0006_source_forensic_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B ball66 "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-v32-ball66-forensic-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo V32_BALL66_PRIVATE_RECEIPT_ALREADY_SAVED;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): preserve original-source decomposition of accepted ball66 masked outlier'
          for n in 1 2 3 4 5 6;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo V32_PRIVATE_BALL66_SOURCE_FORENSIC_COMMITTED;exit 0;fi
            sleep "$n"
          done
          exit 112
