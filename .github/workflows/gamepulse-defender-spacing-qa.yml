name: Game Pulse Rockets shot-spacing input QA (private results)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-defender-spacing-qa.yml'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-defender-spacing-qa.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: gamepulse-private-shot-spacing-input-qa
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
  audit:
    needs: preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Retrieve private analysis code and inspect SHA-verified private release; only commit a private QA summary
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || exit 3
          gh api repos/timeedmonds-maker/104/contents/gamepulse/sdk-season/defender_spacing_calc.py --jq .content | base64 -d > /tmp/shot_spacing_calc.py
          python3 /tmp/shot_spacing_calc.py
          rm -f /tmp/shot_spacing_calc.py
