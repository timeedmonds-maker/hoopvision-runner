# Reviewed public orchestration: full original NBA SDK/UTC metadata remains private.
name: IGP v3.2 universal 71game PBP event possession native alignment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-universal-event-possession-alignment.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-universal-event-possession-native
  cancel-in-progress: false
jobs:
  mem-por-0146-source-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-0146-app-clock-stoppage-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard, private original source, source-free tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_universal_event_possession_alignment_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_universal_event_possession_alignment_v1.py'
          echo IGP_UNIVERSAL_EVENT_CHAIN_SOURCEFREE_TESTS_PASSED
      - name: Exact NBA original PBP 0146 all actions and original SDK timestamps
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_universal_event_possession_alignment_v1.py \
            --game-id 0022600146 --root . \
            --out "$RUNNER_TEMP/igp-0146-universal-qa.json" \
            >"$RUNNER_TEMP/igp-0146-universal.log" 2>&1 || {
              echo IGP_0146_EXHAUSTIVE_EVENT_NATIVE_CROSSWALK_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"igp-0146-universal.log").read_text(errors="replace").splitlines()
          v=next((s for s in reversed(lines) if re.match(
            r"^(?:ValueError|TypeError|KeyError|AssertionError|FileNotFoundError|ImportError):",s)),None)
          if not v:print("IGP_PRIVATE_FAILURE UNCLASSIFIED")
          else:
            klass,_,msg=v.partition(":")
            code=msg.strip().split(":",1)[0].split(" ",1)[0]
            print("IGP_PRIVATE_FAILURE",klass,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-0146-universal-qa.json").read_text())
          assert x["scope_games"]==1
          q=x["per_game"]["0022600146"]
          assert q["original_NBA_PBP_logical_chains_total"]==205
          assert q["original_official_actions_total"]==623
          assert q["original_native_source_timestamps_total"]==30261
          assert len(q["official_action_alignment_rows"])==623
          assert q["original_71game_S1_and_native_XYZ_unchanged"]
          n=q["native_timeline_counts"]
          assert sum(n.get(k,0) for k in (
            "ONE_PBP_LOGGED_UTC_CHAIN_INTERIOR",
            "AMBIGUOUS_MULTIPLE_PBP_CHAIN_INTERIORS",
            "PBP_LOGGED_UTC_ENDPOINT_UNASSIGNED",
            "NO_PBP_CHAIN_INTERIOR"))==30261
          print("IGP_0146_EXHAUSTIVE_EVENT_CHAIN_NATIVE_PASS",json.dumps({
            "official_pbp_actions":623,"logical_chains":205,"native_timestamps":30261,
            "unique_action_chain_members":q["event_alignment_counts"].get("CHAIN_MEMBER_UNIQUE",0),
            "native_unique_chain_interior":n.get("ONE_PBP_LOGGED_UTC_CHAIN_INTERIOR",0),
            "native_ambiguous_chain_interior":n.get("AMBIGUOUS_MULTIPLE_PBP_CHAIN_INTERIORS",0),
            "source_companion_stops":q["companion_clock_stops"],
            "S1_companion_clock_conflicts":n.get("S1_live_AND_companion_stopped_conflict",0),
            "false_physical_certifications":0},sort_keys=True))
          PY
      - name: Commit immutable private original 0146 action-level QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_0146_universal_event_possession_alignment_v1.json
          mkdir -p "$(dirname "$dest")"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/igp-0146-universal-qa.json" "$dest"
            echo IGP_0146_ACTION_QA_ALREADY_COMMITTED
            exit 0
          fi
          cp "$RUNNER_TEMP/igp-0146-universal-qa.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): NBA 0146 exhaustive official action, logical possession and native source alignment'
          gh auth setup-git
          for n in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_0146_EVENT_POSSESSION_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
  all71-universal-original-source:
    needs: mem-por-0146-source-readback
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-0146-app-clock-stoppage-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read SHA-original all71 source safely
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_universal_event_possession_alignment_v1.py \
            --root . --out "$RUNNER_TEMP/igp-71-universal-qa.json" \
            > "$RUNNER_TEMP/igp-71-universal.log" 2>&1 || {
              echo IGP_71_UNIVERSAL_EVENT_NATIVE_ALIGNMENT_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"igp-71-universal.log").read_text(errors="replace").splitlines()
          v=next((s for s in reversed(lines) if re.match(
            r"^(?:ValueError|TypeError|KeyError|AssertionError|FileNotFoundError|ImportError):",s)),None)
          if not v:print("IGP_PRIVATE_FAILURE UNCLASSIFIED")
          else:
            klass,_,msg=v.partition(":");code=msg.strip().split(":",1)[0].split(" ",1)[0]
            print("IGP_PRIVATE_FAILURE",klass,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-71-universal-qa.json").read_text())
          a=x["counts"]
          assert x["scope_games"]==71
          assert a["original_native_timestamps"]==2376002
          assert a["logical_chains"]==14612
          assert x["original_NBA_PBP_and_SDK_unmodified"]
          assert x["physical_possessions_certified"]==0
          assert all(q["original_official_actions_total"]==len(q["official_action_alignment_rows"]) for q in x["per_game"].values())
          assert a["native_unique_logical_chain"]+a["native_ambiguous_logical_chain"]+a["native_not_assigned_unique_logical_chain"]==2376002
          print("IGP_71_EXHAUSTIVE_EVENT_LOGICAL_CHAIN_NATIVE_SOURCE_PASS",json.dumps(a,sort_keys=True))
          PY
      - name: Commit immutable all71 original NBA aggregate and event provenance privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_71_universal_event_possession_alignment_v1.json
          mkdir -p "$(dirname "$dest")"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/igp-71-universal-qa.json" "$dest"
            echo IGP_71_ACTION_QA_ALREADY_COMMITTED
            exit 0
          fi
          cp "$RUNNER_TEMP/igp-71-universal-qa.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): SHA original 71game all events and native timeline alignment ledger'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_71_EVENT_POSSESSION_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
