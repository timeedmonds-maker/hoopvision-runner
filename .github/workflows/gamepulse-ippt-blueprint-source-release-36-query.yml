name: IPPT all 36 NBA private original Blueprint event-source shot release query coverage QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-blueprint-source-release-36-query.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  shot-event-query-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: b3cea8d2e346c8779d301cf6a94ca9749883ca35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and private SHA original source read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
              "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
              gamepulse/fusion data/extensions/nba_blueprint_2026_27
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free event query confidence and denominator regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_blueprint_source_release_36game_query_coverage_2026.py
          python3 -m unittest -v \
              gamepulse/fusion/test_igp_ippt_blueprint_source_release_36game_query_coverage_2026.py \
              gamepulse/fusion/test_query_igp_ippt_blueprint_source_release_2026.py
      - name: Full 36 game SHA original shot-event private source event query acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_blueprint_source_release_36game_query_coverage_2026.py \
             --root . | tee "$RUNNER_TEMP/ippt_36game_query_aggregate.log"
          echo "IPPT_36GAME_BLUEPRINT_EVENT_SOURCE_QUERY_ACCEPTANCE_PASS"
      - name: Publish only sanitized source coverage QA receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"ippt_36game_query_aggregate.log"
          safe={"github_run_id":os.environ["GITHUB_RUN_ID"],
                "prior_job_status":os.environ["QA_JOB_RESULT"],
                "private_code_sha_expected":"b3cea8d2e346c8779d301cf6a94ca9749883ca35"}
          if path.exists():
            lines=[line.partition(" ")[2] for line in path.read_text().splitlines()
              if line.startswith("IPPT_ALL36_BLUEPRINT_EVENT_RELEASE_SOURCE_QUERY_COVERAGE_QA ")]
            if len(lines)==1:
              obj=json.loads(lines[0])
              safe.update({"schema":obj["schema"],"games":obj["games"],
                 "counts":obj["totals"],"by_shot_type":obj["by_shot_type"],
                 "source_immutable":obj["source_immutable"],
                 "not_independently_video_timing_certified":True})
          (Path(os.environ["RUNNER_TEMP"])/"ippt_full36_query_qa_issue.md").write_text(
             "Original NBA XYZ and per-shot sensitive coordinates are not exposed. Query is a research candidate, not certified physical shot-release time.\n\n~~~json\n"+
             json.dumps(safe,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          gh issue comment 125 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_full36_query_qa_issue.md"

# Private original NBA SHA materialized XYZ read-only in ephemeral runner, aggregate-only public stdout.
