name: Resolve NBA high-resolution xFG video for Sheppard event 236
on:
  push:
    paths:
      - '.github/workflows/resolve-reed-xfg-event236-url.yml'
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read precise xFG and original largeUrl for NBA event
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,urllib.request,urllib.error,urllib.parse,os
          gid='0022600125';pid=1642263;event=236
          params=urllib.parse.urlencode({'GameID':gid,'PlayerID':pid})
          url='https://stats.gleague.nba.com/stats/shotqualityvideologs?'+params
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Referer':'https://www.nba.com/','Origin':'https://www.nba.com','Accept':'application/json'}
          out={'query':{'nba_game_id':gid,'player_id':pid,'event_num':event},'source':url}
          try:
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=22) as r:data=json.load(r);out['source_http_status']=r.status
            if str(data.get('gameId'))!=gid or int(data.get('playerId') or 0)!=pid:raise ValueError('NBA source identity conflict')
            rows=[x for x in data.get('shotList',[]) if int(x.get('eventNum') or -1)==event]
            if len(rows)!=1:raise ValueError('Expected one shot, found '+str(len(rows)))
            x=rows[0]
            if not x.get('largeUrl'):raise ValueError('Large video URL not supplied')
            out['shot']={k:x.get(k) for k in ['eventNum','period','gameClock','shotQuality','largeUrl','largeHls','playListUrl','mediumUrl','playerId','success','shotType','largeDuration','guid']}
            # HTTP HEAD may be blocked; report it independently without suppressing verified source metadata.
            for attr in ['largeUrl','largeHls']:
              u=x.get(attr)
              if not u:continue
              try:
                request=urllib.request.Request(u,method='HEAD',headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.nba.com/'})
                with urllib.request.urlopen(request,timeout=12) as z:out[attr+'_probe']={'status':z.status,'content_type':z.headers.get('content-type')}
              except Exception as e:out[attr+'_probe']={'error_type':type(e).__name__,'message':str(e)[:150]}
            out['status']='EXACT_EVENT_FOUND'
          except Exception as e:
            out['status']='SOURCE_ERROR';out['error_type']=type(e).__name__;out['error_message']=str(e)[:350]
          api=f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/contents/reed_xfg_event236_url.json'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'nba-xfg-event-resolver'}
          try:
            with urllib.request.urlopen(urllib.request.Request(api,headers=h),timeout=15) as r:sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
            sha=None
          payload={'message':'Source-verify Sheppard event 236 xFG high resolution URL','content':base64.b64encode(json.dumps(out,indent=2).encode()).decode()}
          if sha:payload['sha']=sha
          with urllib.request.urlopen(urllib.request.Request(api,headers=h,data=json.dumps(payload).encode(),method='PUT'),timeout=20) as r:print('WRITE',r.status)
          print('RESULT',out['status'])
          PY
