name: "IGP G4 original NBA identity-slot reconciliation QA"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-post36-official-native-player-slot-qa.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-post36-source-backed-identity-slot-qa
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check private-source access without exporting data
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/games
      - name: Source-free official identity-slot query regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_g4_post36_native_possession_v1.py \
            gamepulse/fusion/igp_post36_official_player_slot_qa_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_query_igp_g4_post36_native_possession_v1.py'
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_source_first_possession_product_v1.py'
      - name: Actual original NBA 20-game source identity-slot and frozen 36-game SHA regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if [ ! -f gamepulse/fusion/qa/igp_progress_20261029/igp_post36_official_native_player_slot_accuracy_gate_v1.json ]; then
            python3 gamepulse/fusion/igp_post36_official_player_slot_qa_v1.py --root .
          else
            echo EXISTING_SOURCE_BACKED_OFFICIAL_PLAYER_SLOT_QA_PRESERVED
          fi
          python3 -m py_compile gamepulse/fusion/igp_post36_original_time_NBA_event_anchor_index_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_post36_original_time_NBA_event_anchor_index_v1.py'
          python3 gamepulse/fusion/igp_post36_original_time_NBA_event_anchor_index_v1.py --root .
      - name: Preserve passed QA only in the private canonical PR branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_post36_original_time_NBA_event_anchor_index_v1.json
          git add -f gamepulse/fusion/materialized/igp_post36_original_time_NBA_event_anchors_v1/index.json
          git add -f gamepulse/fusion/materialized/igp_post36_original_time_NBA_event_anchors_v1/*.json.gz
          git diff --cached --check
          git commit -q -m "qa(igp): private SHA original NBA source-clock and official scorer action anchor metadata index"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_PRIVATE_OFFICIAL_PLAYER_SLOTS_QA_ACCEPTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23

# Reviewed exact-path allowlist; full source and coordinate records remain private.
