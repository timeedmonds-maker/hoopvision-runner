name: IGP P3 frozen handler 50 percent eight unseen source QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-frozen-handler-eight-unseen-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-handler-frozen-eight
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 8417ff1e26575df53d3e37ae72e5938ca2246273
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Protect original source and pin private SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test source/no-leakage and fixed blended handler on eight fresh games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_handler_frozen_eight_unseen_v1.py'
          python3 gamepulse/fusion/igp_68_p3_handler_frozen_eight_unseen_v1.py \
            --root . --output "$RUNNER_TEMP/p3-frozen-handler-eight-private.json" \
            > "$RUNNER_TEMP/p3-frozen-handler-eight-private.log" 2>&1 || {
              echo P3_FROZEN_HANDLER_EIGHT_UNSEEN_PRIVATE_SOURCE_QA_FAILED
              tail -n 12 "$RUNNER_TEMP/p3-frozen-handler-eight-private.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'p3-frozen-handler-eight-private.json').read_bytes())
          assert len(q['external_unseen_game_ids'])==8
          assert q['fixed_handler_blend_not_selected_on_validation_games']==0.5
          assert not set(q['external_unseen_game_ids'])&(
             set(q['model_train_games'])|set(q['model_earlier_development_games'])|
             set(q['previous_handler_development_games']))
          assert q['no_product_model_promoted'] and q['newly_accepted_complete_scene_count']==0
          assert q['original_source_NBA_PBP_UTC_and_IDs_unmodified']
          assert q['full_population']['source_masked_ball_targets']>=384
          assert q['handler_proxy_subgroup_does_not_equal_full_dataset']>=20
          print('IGP_P3_FROZEN_HANDLER_EIGHT_EXTERNAL_QA',json.dumps({
            'full':q['full_p95_comparison'],
            'handler':q['handler_subgroup_p95_comparison'],
            'n':q['full_population']['source_masked_ball_targets'],
            'handler_n':q['full_population']['stable_handler_proxy_cases'],
          },sort_keys=True))
          PY
      - name: Save private original-source external test QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_frozen_handler_eight_unseen_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-handler-eight "origin/$BRANCH"
          cp "$RUNNER_TEMP/p3-frozen-handler-eight-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): retain eight new NBA games prespecified handler-only source masked result'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo P3_FROZEN_HANDLER_EIGHT_ORIGINAL_SOURCE_RECEIPT_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
