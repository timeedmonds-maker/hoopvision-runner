# Public workflow: verify direct official NBA team OffRtg and POSS, no private original SDK XYZ.
name: IGP 71 official NBA advanced OFFRTG POSS direct provider proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-71-offrating-official-probe.yml']
permissions: {contents: read}
concurrency:
  group: igp-offrtg-official-provider-audit-20261031
  cancel-in-progress: false
jobs:
  official-provider-one-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Obtain actual NBA official team OffRtg and POSS
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,hashlib
          gid="0022600146"
          args=urllib.parse.urlencode({"GameID":gid,"StartPeriod":0,
             "EndPeriod":14,"StartRange":0,"EndRange":0,"RangeType":0})
          headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36","Referer":"https://www.nba.com/","Origin":"https://www.nba.com","Accept":"application/json, text/plain, */*","x-nba-stats-origin":"stats","x-nba-stats-token":"true"}
          rows=None;errors=[]
          for family in ("boxscoreadvancedv3","boxscoreadvancedv2"):
              url="https://stats.nba.com/stats/"+family+"?"+args
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=13) as f:
                      assert f.status==200
                      raw=f.read(2000000)
                  x=json.loads(raw)
                  if family.endswith("v3"):
                      box=x["boxScoreAdvanced"]
                      assert box["gameId"]==gid
                      rows=[]
                      for side in ("homeTeam","awayTeam"):
                          t=box[side];s=t["statistics"]
                          rows.append({"team":t["teamTricode"],"offrtg":s["offensiveRating"],"poss":s.get("possessions"),
                            "est_offrtg":s.get("estimatedOffensiveRating"),"src":family})
                  else:
                      t=next(i for i in x.get("resultSets",[]) if i["name"]=="TeamStats")
                      rows=[dict(zip(t["headers"],r)) for r in t["rowSet"]]
                  assert len(rows)==2
                  print("IGP_OFFICIAL_ADVANCED_DIRECT_SOURCE_SUCCESS",json.dumps({
                       "game":gid,"family":family,"response_sha256":hashlib.sha256(raw).hexdigest(),
                       "team_rows":rows},sort_keys=True))
                  break
              except Exception as e:
                  errors.append({"family":family,"error_type":type(e).__name__})
          if rows is None:
              print("IGP_OFFICIAL_ADVANCED_DIRECT_SOURCE_UNAVAILABLE",json.dumps(errors,sort_keys=True))
              raise SystemExit(17)
          PY
