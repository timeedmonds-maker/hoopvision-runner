name: IGP Fusion G2 36 frozen longpair guarded-sub plus 68 same-ten original NBA SHA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g2-legacy36-plus-68-bridge-acceptance.yml']
permissions: {contents: read}
concurrency:
  group: igp-g2-legacy36-plus-full68-original-source
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 986dcbf17055c15cfbe2117128a3e7fd5bd58156
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Protect original NBA source private SHA and public workflow confidentiality
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Frozen 36 G2 original NBA PBP 68 extended official source unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g2_original36_long_sub_sourcefirst_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g2_all68_two_ended_roster_bridge_v1.py'
      - name: Verify original NBA frozen 36 G2 coverage and exact 68 native roster preservation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_g2_all68_legacy36_plus_bridge_census_v1.py \
            --root . --output "$RUNNER_TEMP/igp-g2-legacy68-private.json" \
            > "$RUNNER_TEMP/igp-g2-legacy68-private.log" 2>&1; then
            echo IGP_G2_LEGACY36_SOURCE_FULL68_FAIL
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"igp-g2-legacy68-private.log").read_text(errors="replace").splitlines()
          last=next((s for s in reversed(z) if s.strip()),"NO_LOG")
          print("IGP_G2_REDACTED_SOURCE_FAILURE",re.sub(r"[^A-Za-z_]","_",last)[:95])
          print("IGP_G2_ALL68_GAMES_FINISHED",sum(x.startswith("IGP_G2_ALL_SOURCE_CONTEXT_GAME") for x in z))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-g2-legacy68-private.json").read_text())
          n=j["totals"]
          assert j["games"]==68 and len(j["per_game"])==68
          assert j["long_sub_verified_NBA_G2_original_games"]==36
          assert j["new_sourcefirst_other_games"]==32
          assert n["native_full_source_timestamps"]==2280600
          assert n["legacy_long_native"]==165108
          assert n["legacy_sub_native"]==90201
          assert j["candidate_frames_outside_strict_count_nonoverlap"]<=1412865
          assert j["source_conflict_nonpromoted"]
          assert j["new_production_accepted_complete_scenes"]==0
          assert j["source_NBA_physical_custody_certified"]==0
          print("IGP_G2_LEGACY36_ALL68_NBA_ROSTER_SOURCE_COUNTS",json.dumps({
             "games":68,
             "long_two_ended_original_NBA_source_frames":n["legacy_long_native"],
             "guarded_substitution_original_NBA_source_frames":n["legacy_sub_native"],
             "shortbridge_nonoverlap":n["new_shortbridge_unshadowed_native"],
             "total_new_NBA_roster_candidate_source_native":j["candidate_frames_outside_strict_count_nonoverlap"],
             "source_conflicting_original_actor_frames":n["legacy_long_source_conflict_frames"]+n["legacy_sub_source_conflict_frames"],
             "source_original_native_frames":n["native_full_source_timestamps"],
             "physical_possessions_certified":0,
             "production_promotions":0},sort_keys=True))
          PY
      - name: Commit source-based official roster evidence QA to private research branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g2_all68_legacy36_long_sub_short_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B g2-legacy36-original68 "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-g2-legacy68-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): preserved 36 old G2 official long pair and guarded substitution frames combined 68 original source-only tiers'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G2_FROZEN36_PLUS_FULL68_SOURCE_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
