name: IPPT isolated private NBA probabilistic source pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-ippt-isolated-source-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ippt-isolated-experimental-source-20261028
  cancel-in-progress: false
jobs:
  experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/ippt-probabilistic-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public confidentiality guard and private source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free non-regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_probabilistic_baseline_2026.py \
            gamepulse/fusion/igp_ippt_private_game_pilot_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_probabilistic_baseline_2026.py
          echo IPPT_EXPERIMENTAL_SOURCE_FREE_TESTS_PASSED
      - name: Two-game original SDK and NBA G4 SHA readback pilot
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from igp_ippt_private_game_pilot_2026 import run_game
          for gid in ('0022600009','0022600092'):
              report=run_game('.',gid,stride=5,holdout=True)
              assert report['original_native_frames']>10000
              assert report['source_NBA_logical_chains']>100
              assert report['source_original_G3_G4_and_NBA_chain_IDs_immutable']
              print('IPPT_PRIVATE_REAL_GAME_PILOT',gid,{
                'original_native':report['original_native_frames'],
                'evaluated':report['counts']['frames_evaluated'],
                'complete_estimated':report['counts']['full_ten_ball_estimated'],
                'complete_estimated_pct':report['complete_estimated_pct'],
                'official_window_compatible':report['counts']['full_ten_ball_official_window_compatible'],
                'unknown_id':report['counts']['full_ten_ball_identity_unverified'],
                'holdout':report['random_scattered_original_mask_QA']})
          PY
      - name: All 36 private original NBA source games measured without release
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          from igp_tracking_pilot_run_2026 import BASE,load
          from igp_ippt_private_game_pilot_2026 import run_game
          index,_=load(Path('.'),BASE/'materialized/igp_provisional_chain_tracking_interiors_36_v1/index.json')
          totals=Counter()
          for gid in sorted(index['games']):
              r=run_game('.',gid,stride=10,holdout=False)
              totals.update(r['counts'])
              totals['games']+=1
              totals['full_native_frame_population']+=r['original_native_frames']
              totals['nba_logical_chains']+=r['source_NBA_logical_chains']
              totals['source_actor_entries']+=r['source_actor_original_entries']
              totals['source_ball_frames']+=r['source_ball_original_frames']
              print('IPPT_PRIVATE_GAME_SUMMARY',gid,r['complete_estimated_pct'],r['counts']['frames_evaluated'])
          assert totals['games']==36
          assert totals['full_native_frame_population']==1203986
          assert totals['nba_logical_chains']==7474
          assert totals['source_actor_entries']==8673975
          assert totals['source_ball_frames']==912704
          print('IPPT_EXPERIMENTAL_ALL36_STRIDE10_COUNTS',{
            'games':totals['games'],
            'original_native_frames':totals['full_native_frame_population'],
            'sampled_frames':totals['frames_evaluated'],
            'sampled_full_ten_ball_estimates':totals['full_ten_ball_estimated'],
            'sampled_estimated_pct':round(100*totals['full_ten_ball_estimated']/totals['frames_evaluated'],3),
            'identity_unverified':totals['full_ten_ball_identity_unverified'],
            'roster_conflicted':totals['full_ten_ball_official_window_conflicted'],
            'official_window_compatible':totals['full_ten_ball_official_window_compatible'],
            'original_NBA_logical_chains_unchanged':totals['nba_logical_chains']})
          PY
