name: PR776 G2 source NBA substitution direct actor clock event index 36 games
on:
  push:
    branches: [research/pr776-trusted-igp-runner-20261028]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-source-actor-transition-index-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-g2-direct-actor-event-index-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public guard and hydrate SHA-verified private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Unit original NBA SDK near-substitution source event query and code
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_g2_nba_substitution_source_actor_index_2026.py \
            gamepulse/fusion/igp_g2_nba_substitution_source_clock_query_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_nba_substitution_source_clock_query_2026.py' -v
          echo PRIVATE_ORIGINAL_NBA_SDK_SOURCE_EVENT_QUERY_UNIT_PASS
      - name: Build per-game SHA selected source actor timing and reconcile all36
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          DIR=gamepulse/fusion/materialized/igp_g2_nba_substitution_source_clock_v1
          QA=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_source_direct_actor_substitution_index_36_v1.json
          test ! -e "$DIR" && test ! -e "$QA"
          python3 gamepulse/fusion/igp_g2_nba_substitution_source_actor_index_2026.py \
            --root . --out-dir "$DIR" --manifest "$QA" > "$RUNNER_TEMP/private-g2-sub-clock-index.log"
          python3 - "$QA" <<'PY'
          import gzip,hashlib,json,sys
          from pathlib import Path
          q=json.load(open(sys.argv[1]))
          t=q["totals"]
          assert q["source_games"]==36 and len(q["games"])==36
          assert q["min_unchanged_NBA_official_players"]==6
          assert t["eligible_NBA_substitution_events"]==1537
          assert t["NOT_ENOUGH_SOURCE_ENTER_EXIT_ANCHORS"]==1304
          assert t["AMBIGUOUS_SOURCE_ENTER_EXIT_INTERLEAVED"]==99
          assert t["SOURCE_PLAYER_ID_SWITCH_AFTER_OFFICIAL_NBA_UTC"]==78
          assert t["SOURCE_PLAYER_ID_SWITCH_BEFORE_OFFICIAL_NBA_UTC"]==28
          assert t["NBA_UTC_INSIDE_SOURCE_PLAYER_ID_SWITCH_BRACKET"]==28
          assert sum(g["graded_event_count"] for g in q["games"].values())==134
          for gid,v in q["games"].items():
            x=Path(v["path"]).read_bytes()
            assert hashlib.sha256(x).hexdigest()==v["sha256"]
            lines=gzip.decompress(x).splitlines()
            assert len(lines)==v["event_count"]
            assert all(json.loads(line)["NBA_official_substitution_timestamp_reassigned"] is False for line in lines)
          assert q["original_NBA_SDK_XYZ_unchanged"]
          assert q["prior_NBA_PBP_official_event_UTC_and_roster_unchanged"]
          assert q["source_enter_exit_event_grades_are_not_global_clock_corrections"]
          print("G2_ORIGINAL_NBA_SOURCE_ACTOR_CLOCK_INDEX_36_ACCEPTED",json.dumps({
             "games":36,"source_clock_events":1537,"two_sided_usable":134,
             "official_clock_and_source_XYZ_unchanged":True
          },sort_keys=True))
          PY
      - name: Private-only original NBA SDK per-game source clock event sidecars and QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          DIR=gamepulse/fusion/materialized/igp_g2_nba_substitution_source_clock_v1
          QA=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_source_direct_actor_substitution_index_36_v1.json
          git config user.name "Game Pulse NBA Original Source Time QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$DIR" "$QA"
          test "$(git diff --cached --name-only | wc -l)" -eq 37
          git diff --cached --check
          git commit -qm "qa(gamepulse): materialize 36 original NBA SDK per-event source substitution time brackets with immutable official event UTC"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_G2_ORIGINAL_NBA_DIRECT_SOURCE_EVENT_CLOCK_INDEX_36_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
