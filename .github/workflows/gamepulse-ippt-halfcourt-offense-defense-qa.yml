name: IPPT halfcourt official offense defense searchable QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-halfcourt-offense-defense-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/ippt-halfcourt-dual-track-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Secure private source fetch and public confidentiality guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free attack/defense five and halfcourt selector regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_halfcourt_team_split_2026.py \
            gamepulse/fusion/query_igp_ippt_halfcourt_dual_2026.py
          python3 -m unittest -v \
            gamepulse/fusion/test_igp_ippt_halfcourt_team_split_2026.py \
            gamepulse/fusion/test_igp_ippt_halfcourt_selector_2026.py
      - name: Two real source game offense defense five with original and predictive coordinates
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from query_igp_ippt_halfcourt_dual_2026 import search
          for gid in ("0022600009","0022600092"):
              outputs={name:search(".",gid,model=name,require_official_roster=True,
                                  limit=25) for name in ("direct","evidence","predictive")}
              n={k:v["total_matching_source_frames"] for k,v in outputs.items()}
              assert len(set(n.values()))==1 and n["direct"]>100
              for mode,data in outputs.items():
                  for row in data["rows"]:
                      s=row["offense_defense_official_five_candidate"]
                      assert s is not None
                      assert len(s["offense_official_five_ids"])==5
                      assert len(s["defense_official_five_ids"])==5
                      assert not set(s["offense_official_five_ids"])&set(s["defense_official_five_ids"])
                      assert set(s["offense_official_five_ids"]+s["defense_official_five_ids"])==set(row["NBA_official_ten_candidate"])
                      assert s["offense_team"]==row["offense_team_from_NBA_PBP"]
              print("IPPT_HALFCOURT_OFFENSE_DEFENSE_REAL_SOURCE_PASS",gid,{
                "half_court_unique_frame_candidates_with_compatible_official_ten":n["direct"],
                "query_modes":["direct","evidence","predictive"],
                "offense_defense_official_IDs_and_NBA_PBP_correct":True,
                "original_coordinates_preserved":True})
          PY
