# Public orchestration only. All licensed NBA XYZ, original PBP and QA stay in private 104.
name: IGP P2B 71game complete official-action tracking crosswalk
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-all-action-tracking-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-p2b-71game-all-action-native-pbp
  cancel-in-progress: false
jobs:
  sourcefree-and-game0001:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private clone, source-free compile and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_v32_p2b_action_crosswalk_core_v1.py \
            gamepulse/fusion/igp_v32_p2b_companion_clock_crosscheck_v1.py \
            gamepulse/fusion/igp_v32_p2b_all71_official_action_crosswalk_v1.py \
            gamepulse/fusion/query_igp_v32_p2b_official_action_tracking_v1.py \
            gamepulse/fusion/query_igp_v32_71_possession_source_qa_v2.py \
            gamepulse/fusion/igp_v32_71_possession_10hz_source_qa_v2.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_all_action_crosswalk_v1.py'
          echo IGP_P2B_EVENT_SOURCEFREE_REGRESSIONS_PASSED
      - name: Real immutable original NBA game0001 P2B event QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_all71_official_action_crosswalk_v1.py \
            --root . --only-game 0022600001 \
            --out "$RUNNER_TEMP/igp-p2b-0001-action-qa.json" \
            > "$RUNNER_TEMP/igp-p2b-0001.log" 2>&1 || {
              echo IGP_P2B_ACTION_0001_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"igp-p2b-0001.log").read_text(errors="replace").splitlines()
          t=next((x for x in reversed(z) if re.match(r"^(?:ValueError|KeyError|TypeError|FileNotFoundError|ImportError|AssertionError):",x)),None)
          if t:
              typ,_,msg=t.partition(":"); code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_P2B_PRIVATE_FAILURE",typ,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_P2B_PRIVATE_FAILURE UNCLASSIFIED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-p2b-0001-action-qa.json").read_text())
          assert x["counts"]["games"]==1
          g=x["games"]["0022600001"]
          assert len(g["event_rows"])==g["official_action_count"]
          assert g["chain_counts"]["official_chains"]>0
          assert g["source_S1_mask_counts"]["accepted_or_guarded_complete"]==13142
          assert g["source_S1_mask_counts"]["S1_10hz"]==14354
          print("IGP_P2B_REAL_GAME0001_SOURCE_QA_PASSED",json.dumps({
              "official_actions":g["official_action_count"],
              "logical_chains":g["chain_counts"]["official_chains"],
              "complete_S1_scenes":13142,
              "original_sources_unchanged":True},sort_keys=True))
          PY
  full71-private-source-qa:
    needs: sourcefree-and-game0001
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SHA-source 71game P2B crosswalk
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_all71_official_action_crosswalk_v1.py \
            --root . --out "$RUNNER_TEMP/igp-p2b-71-action-qa.json" \
            > "$RUNNER_TEMP/igp-p2b-71.log" 2>&1 || {
              echo IGP_P2B_71_SOURCE_QA_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"igp-p2b-71.log").read_text(errors="replace").splitlines()
          t=next((x for x in reversed(z) if re.match(r"^(?:ValueError|KeyError|TypeError|FileNotFoundError|ImportError|AssertionError):",x)),None)
          if t:
              typ,_,msg=t.partition(":"); code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_P2B_PRIVATE_FAILURE",typ,code if re.fullmatch(r"[A-Z_]{6,90}",code) else "REDACTED")
          else:print("IGP_P2B_PRIVATE_FAILURE UNCLASSIFIED")
          PY
              exit 42
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"igp-p2b-71-action-qa.json"
          d=json.loads(p.read_text())
          c=d["counts"]
          assert c["games"]==71
          assert c["mask_S1_10hz"]==1159651
          assert c["mask_accepted_or_guarded_complete"]==1015072
          assert c["chain_official_chains"]==14612
          assert all(len(g["event_rows"])==g["official_action_count"] for g in d["games"].values())
          assert c["official_actions"]==sum(g["official_action_count"] for g in d["games"].values())
          assert sum(v for k,v in c.items() if k.startswith("event_"))==c["official_actions"]
          print("IGP_P2B_71_EXACT_SHA_PBP_ALL_ACTION_AND_CHAIN_QA",json.dumps(c,sort_keys=True))
          PY
      - name: Commit private full result and compact source receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import gzip,hashlib,json,os
          from pathlib import Path
          root=Path("gamepulse/fusion/qa/igp_v32")
          raw=(Path(os.environ["RUNNER_TEMP"])/"igp-p2b-71-action-qa.json").read_bytes()
          data=json.loads(raw)
          summary={
              "schema":"igp.v32.p2b.71game.all-official-action-source-QA.summary.v1",
              "engine_id":data["engine_id"],
              "full_original_QA_SHA256":hashlib.sha256(raw).hexdigest(),
              "source_index_SHA_cohorts":data["source_index_SHA_cohorts"],
              "released_P2B_QA_SHA256":data["P2B_exact_71_release_QA_sha256"],
              "counts":data["counts"],
              "per_game":{g:{
                  "official_actions":v["official_action_count"],
                  "action":v["action_tracking_counts"],
                  "companion":v["action_original_companion_clock_counts"],
                  "S1_mask":v["source_S1_mask_counts"],
                  "chain":v["chain_counts"],
                  "PBP_SHA256":v["official_pbp_sha256"],
                  "native_SHA256":v["native_sdk_manifest_sha256"]
              } for g,v in sorted(data["games"].items())},
              "physical_possessions_certified":0
          }
          root.mkdir(parents=True,exist_ok=True)
          dest=root/"igp_v32_p2b_all_official_action_tracking_crosswalk_v1.json"
          compact=root/"igp_v32_p2b_action_crosswalk_71_summary_20261031.json"
          if dest.exists() and dest.read_bytes()!=raw:
              raise RuntimeError("REFUSE_P2B_ACTION_QA_OVERWRITE")
          if compact.exists() and json.loads(compact.read_bytes())!=summary:
              raise RuntimeError("REFUSE_P2B_SUMMARY_OVERWRITE")
          dest.write_bytes(raw)
          compact.write_text(json.dumps(summary,sort_keys=True,indent=2)+"\\n")
          print("IGP_P2B_FULL71_PRIVATE_QA_SHA256",summary["full_original_QA_SHA256"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_all_official_action_tracking_crosswalk_v1.json
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_action_crosswalk_71_summary_20261031.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_P2B_71_ACTION_QA_ALREADY_COMMITTED
            exit 0
          fi
          git commit -q -m 'qa(igp): original-SHA 71game official action P2B complete tracking crosswalk'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P2B_71_ACTION_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
