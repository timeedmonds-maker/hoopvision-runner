name: "IGP validate advanced original biomechanics from authenticated SDK before full56 rollup"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-advanced-original-shots-v2-smoke.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Run 56-game original shot biomechanical enrichment as source-validity dry-run
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b research/gamepulse-clock-boundary-integrity-20261025 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_enrich_all56_advanced_companion_shot_biomechanics_v2.py
          python3 gamepulse/fusion/igp_enrich_all56_advanced_companion_shot_biomechanics_v2.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_all56_advanced_companion_biomechanics_v2.json")
          o=json.loads(p.read_bytes())
          assert o["original_official_field_goals"]==10003
          assert o["original_Blueprint_identity_matched_shots"]==9221
          assert o["official_shots_with_advanced_source_biomechanics"]>=154
          assert o["games_with_entire_original_companion_event_response"]>=2
          for id in ["0022600009","0022600129"]:
            assert o["games"][id]["original_companion_full_response_status"]=="FULL_EVENT_RESPONSE_OBSERVED"
          print("IGP_ADVANCED_30_FEATURE_NATIVE_ORIGINAL_SDK_JOIN_SMOKE_PASS",
                "captured_games",o["games_with_entire_original_companion_event_response"],
                "identity_matched_shots",o["official_shots_with_advanced_source_biomechanics"],
                "source_rows",o["original_full_companion_shot_source_rows"])
          PY
