name: Game Pulse Rockets final fastlane — public CPU
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-final-fastlane.yml'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-final-fastlane.yml'
      - 'tools/licensed_feed/season_private_release.mjs'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: gamepulse-rockets-final-sdk-direct-recovery2
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public privacy boundary
        run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify collector safety invariants
        run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  capture-after-final:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    # The public post-final direct-slot path must finish promptly or fail closed.
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        part: [7, 8, 9, 10, 11, 12]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licensed SDK without lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Capture after official NBA final; private SHA-verified checkpoint
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600091'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T00:30:00Z'
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs
  certify-private-complete:
    # Recover missing checkpoints even if one parallel worker exhausted its attempts.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: capture-after-final
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licensed SDK without lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Avoid conflict with existing part-06 capture
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo=timeedmonds-maker/104
          tag=gamepulse-sdk-0022600091
          for i in $(seq 1 45); do
            if gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' | grep -Fxq sdk-part-06.tar.gz; then
              echo 'PRIORITY_PART_06_REMOTE_PRESENT'
              exit 0
            fi
            sleep 20
          done
          echo 'PRIORITY_PART_06_NOT_YET_ARCHIVED'
          exit 3
      - name: Verify all 13 checkpoints and certify private index
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600091'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-22T00:30:00Z'
        run: node season_private_release.mjs
