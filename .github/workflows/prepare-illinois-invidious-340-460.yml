name: Prepare Illinois 340-460 via Invidious mirrors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-illinois-invidious-340-460.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve source via current Invidious instances
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          mkdir -p prepared
          id='R-CJIR4seAY'
          instances=(
            'https://inv.nadeko.net'
            'https://invidious.nerdvpn.de'
            'https://yt.chocolatemoo53.com'
            'https://invidious.tiekoetter.com'
          )
          ok=''
          for api in "${instances[@]}"; do
            echo "TRY_INSTANCE=$api"
            if ! curl -A 'Mozilla/5.0' -fsSL --connect-timeout 8 --max-time 30 "$api/api/v1/videos/$id" -o /tmp/video.json; then
              continue
            fi
            if ! jq -e '.videoId == "R-CJIR4seAY"' /tmp/video.json >/dev/null; then
              continue
            fi
            echo "TITLE=$(jq -r '.title // empty' /tmp/video.json)"
            purl="$(jq -r '
              [.formatStreams[]? | select((.container // "") == "mp4")]
              | sort_by((.resolution // "0") | sub("p$";"") | tonumber)
              | last | .url // empty
            ' /tmp/video.json)"
            if test -n "$purl"; then
              echo "$purl" >/tmp/progressive
              : >/tmp/vurl
              : >/tmp/aurl
              echo "$api" > prepared/invidious_instance.txt
              cp /tmp/video.json prepared/invidious_video_metadata.json
              ok=progressive
              break
            fi
            vurl="$(jq -r '
              [.adaptiveFormats[]?
                | select(((.type // "") | startswith("video/mp4")))
                | select(((.qualityLabel // "0p") | sub("p.*$";"") | tonumber) <= 1080)
              ] | sort_by((.qualityLabel // "0p") | sub("p.*$";"") | tonumber, .bitrate // 0)
              | last | .url // empty
            ' /tmp/video.json)"
            aurl="$(jq -r '
              [.adaptiveFormats[]? | select(((.type // "") | startswith("audio/mp4")))]
              | sort_by(.bitrate // 0) | last | .url // empty
            ' /tmp/video.json)"
            if test -n "$vurl" && test -n "$aurl"; then
              : >/tmp/progressive
              echo "$vurl" >/tmp/vurl
              echo "$aurl" >/tmp/aurl
              echo "$api" > prepared/invidious_instance.txt
              cp /tmp/video.json prepared/invidious_video_metadata.json
              ok=adaptive
              break
            fi
          done
          test -n "$ok" || { echo 'No Invidious instance resolved usable media' >&2; exit 3; }
          echo "$ok" > /tmp/mode

      - name: Cut exact reviewed interval
        shell: bash
        run: |
          set -euo pipefail
          mode="$(cat /tmp/mode)"
          if test "$mode" = progressive; then
            url="$(cat /tmp/progressive)"
            ffmpeg -hide_banner -loglevel warning -y -ss 340 -i "$url" -t 120 \
              -map 0:v:0 -map 0:a? -c:v libx264 -preset fast -crf 15 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -movflags +faststart prepared/illinois_houston_youtube_340_460.mp4
          else
            vurl="$(cat /tmp/vurl)"; aurl="$(cat /tmp/aurl)"
            ffmpeg -hide_banner -loglevel warning -y -ss 340 -i "$vurl" -ss 340 -i "$aurl" -t 120 \
              -map 0:v:0 -map 1:a:0 -c:v libx264 -preset fast -crf 15 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -movflags +faststart prepared/illinois_houston_youtube_340_460.mp4
          fi

      - name: Verify and hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p=Path('prepared/illinois_houston_youtube_340_460.mp4')
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],text=True))
          v=next(x for x in d['streams'] if x.get('codec_type')=='video')
          dur=float(d['format']['duration'])
          if not 119.5 <= dur <= 120.5: raise SystemExit(f'bad duration {dur}')
          h=hashlib.sha256()
          with p.open('rb') as f:
              for b in iter(lambda:f.read(4*1024*1024),b''): h.update(b)
          m={'schema':'courtcoder.public-source-prep.v1','fixture_id':'illinois-houston-youtube-340-460',
             'source_video_id':'R-CJIR4seAY','source_video_start_s':340,'source_video_end_s':460,
             'transport':'invidious_mirror_of_youtube_media','instance':Path('prepared/invidious_instance.txt').read_text().strip(),
             'duration_s':dur,'width':int(v['width']),'height':int(v['height']),'avg_frame_rate':v.get('avg_frame_rate'),
             'video_codec':v.get('codec_name'),'size_bytes':p.stat().st_size,'sha256':h.hexdigest(),
             'review_note':'Product-owner selected uninterrupted possessions; short replay at end intentionally retained.'}
          Path('prepared/source_manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: illinois-houston-youtube-340-460-invidious
          path: |
            prepared/illinois_houston_youtube_340_460.mp4
            prepared/source_manifest.json
            prepared/invidious_instance.txt
            prepared/invidious_video_metadata.json
          if-no-files-found: error
          retention-days: 7
