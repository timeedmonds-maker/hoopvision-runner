name: IPPT all 36 original NBA PBP actions to PRIVATE deduplicated source XY SQLite materialization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-all-event-sqlite-private.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  all-nba-event-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: bfa7efcc496a96af9998b48f1f79c7a9bbc3e3a1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public licensed source content guard and exact private SHA clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free NBA event primary key/native pointer schema tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_all_pbp_event_native_sqlite_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_all_pbp_event_native_sqlite_2026.py
      - name: Two real original NBA source game private SQLite and exact readback
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_event_native_sqlite_2026.py \
            --root . --out "$RUNNER_TEMP/ippt_2game_private.sqlite" \
            --games 0022600009 0022600092
          python3 - <<'PY'
          import os
          from pathlib import Path
          from igp_ippt_all_pbp_event_native_sqlite_2026 import query_action
          path=Path(os.environ["RUNNER_TEMP"])/"ippt_2game_private.sqlite"
          row=query_action(path,"0022600009",7)
          assert row is not None and row["event"]["action_number"]==7
          assert row["event"]["physical_utc_ms"] is None
          assert row["physical_event_time_not_certified"]
          print("IPPT_TWO_GAME_ORIGINAL_SHA_NATIVE_SQLITE_PRIVATE_READBACK_PASS")
          PY
          rm -f "$RUNNER_TEMP/ippt_2game_private.sqlite"
      - name: All 36 original PBP games all actions native player-ball XY database build
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_event_native_sqlite_2026.py \
            --root . --out "$RUNNER_TEMP/ippt_all36_private.sqlite" \
            | tee "$RUNNER_TEMP/ippt_private_sqlite_aggregate.log"
          echo "IPPT_PRIVATE_ALL36_22314_NBA_EVENT_XY_SQLITE_ACCEPTANCE_PASS"
      - name: Publish ONLY aggregate SQLite acceptance counts, remove licensed DB
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          log=Path(os.environ["RUNNER_TEMP"])/"ippt_private_sqlite_aggregate.log"
          r={"github_run_id":os.environ["GITHUB_RUN_ID"],
             "prior_job_status":os.environ["QA_JOB_RESULT"],
             "private_expected_SHA":"bfa7efcc496a96af9998b48f1f79c7a9bbc3e3a1"}
          if log.exists():
            rows=[line.partition(" ")[2] for line in log.read_text().splitlines()
                  if line.startswith("IPPT_ALL_NBA_PBP_ACTION_XY_PRIVATE_SQLITE_BUILD_QA ")]
            if len(rows)==1:
              z=json.loads(rows[0])
              r.update({"schema":z["schema"],"games":z["games"],
                 "counts":z["counts"],"source_population_counts":z["source_population_counts"],
                 "physical_instant_not_video_certified":True})
          (Path(os.environ["RUNNER_TEMP"])/"ippt_sqlite_qa_note.md").write_text(
            "Private licensed source SQLite is not an artifact, is not included, and may never be published here. Counts ONLY.\n\n~~~json\n"+
            json.dumps(r,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          rm -f "$RUNNER_TEMP/ippt_all36_private.sqlite" "$RUNNER_TEMP/ippt_2game_private.sqlite"
          gh issue comment 129 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_sqlite_qa_note.md"

# Original NBA actor XYZ/ball SQLite lives exclusively inside transient private CPU runtime.
