name: Boswell-Ivisic event-chain CP-SAT shadow

on:
  push:
    branches: [main]
    paths:
      - 'tools/bounded_event_chain_cp_sat.py'
      - 'experiments/boswell_ivisic_event_chain_cp_sat_v2.json'
      - '.github/workflows/boswell-ivisic-event-chain-cp-sat.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boswell-ivisic-event-chain-cp-sat
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CP-SAT backend
        run: python -m pip install --disable-pip-version-check --no-cache-dir ortools==9.14.6206

      - name: Run bounded Boswell-Ivisic event-chain shadow
        run: |
          set -euo pipefail
          python tools/bounded_event_chain_cp_sat.py \
            --input experiments/boswell_ivisic_event_chain_cp_sat_v1.json \
            --out experiment_results/boswell_ivisic_event_chain_cp_sat_v2.json

      - name: Persist measured result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hoopvision-public-runner
          git config user.email hoopvision-public-runner@users.noreply.github.com
          git add experiment_results/boswell_ivisic_event_chain_cp_sat_v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Boswell-Ivisic event-chain CP-SAT result"
            git push origin HEAD:main
          fi
