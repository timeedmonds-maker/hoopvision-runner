name: Amen 732 4K native multi-angle contact QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen-732-4k-contact-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nba-amen732-native-4k-contact-proof
  cancel-in-progress: false
jobs:
  contact-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce private NBA footage boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          if scan(['.github/workflows/freeview-amen-732-4k-contact-diagnostic.yml']):
              raise SystemExit('SOURCE_BOUNDARY_FAIL')
          print('SOURCE_PRIVACY_GUARD_PASS')
          PY
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Native four-angle UHD visual contact QA
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          TAG='freeview-native-0022600009-732'
          mkdir -p "$TMP/frames" "$TMP/output"
          gh release download "$TAG" --repo timeedmonds-maker/104 --dir "$TMP/frames" \
            --pattern '*.mp4' --pattern 'source_manifest.json' \
            --pattern 'native_presentation_timestamps.json' \
            --pattern 'event732-contact-bracket-qa.json'
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_four_view_UHD_diagnostic.py?ref=d60532cb2dd5fce6ce5cff7c86b5d10526ea4d97' \
            --jq .content | base64 -d > "$TMP/diagnostic.py"
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' opencv-python-headless==4.10.0.84
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          python3 "$TMP/diagnostic.py" --selftest
          python3 "$TMP/diagnostic.py" \
            --root "$TMP/frames" --manifest "$TMP/frames/source_manifest.json" \
            --pts "$TMP/frames/native_presentation_timestamps.json" \
            --bracket "$TMP/frames/event732-contact-bracket-qa.json" \
            --reviewed-candidates \
            --out "$TMP/output/amen732-four-angle-refined-contact-3840x2160.mp4" \
            --qa "$TMP/output/amen732-four-angle-refined-contact-qa.json"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,nb_frames,r_frame_rate -of json \
            "$TMP/output/amen732-four-angle-refined-contact-3840x2160.mp4" > "$TMP/ffprobe.json"
          python3 - "$TMP/ffprobe.json" "$TMP/output/amen732-four-angle-refined-contact-qa.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))['streams'][0]
          q=json.load(open(sys.argv[2]))
          assert (p['width'],p['height'])==(3840,2160)
          assert p['r_frame_rate']=='30/1'
          assert int(p.get('nb_frames',0))==110
          assert q['camera_orbit_present'] is False
          assert q['manual_reviewed_frame_bracket'] is True
          assert q['same_physical_state_exact_sync_certified'] is False
          print('NBA_FOUR_VIEW_UHD_QA_PASS',p['width'],p['height'],p['nb_frames'])
          PY
          gh release upload "$TAG" \
            "$TMP/output/amen732-four-angle-refined-contact-3840x2160.mp4" \
            "$TMP/output/amen732-four-angle-refined-contact-qa.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$TMP/release.json"
          python3 - "$TMP/output" "$TMP/release.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assets={x['name']:x for x in json.load(open(sys.argv[2]))['assets']}
          for f in root.iterdir():
              digest=hashlib.sha256(f.read_bytes()).hexdigest()
              assert assets[f.name]['digest']=='sha256:'+digest,f.name
          print('PRIVATE_NATIVE_FOUR_VIEW_UHD_SHA256_PASS')
          PY
