name: Toronto SAM Multiplex A-B

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-toronto-sam-multiplex-ab.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-northeast1-b
  INSTANCE: hv-dev-l4-tokyo
  CANDIDATE_SHA: 1acf43ac64f1195128e5fbdb09a9aee138bcb947
  RETAINED_RUN_ID: public-36185446517-1-0b1290c674a3
  IMAGE: asia-southeast1-docker.pkg.dev/project-d88c48c6-7f48-4c33-928/hoopvision-containers/hoopvision-nextgen@sha256:d4eb6ac02af990bb40d1aa56fbf57ce9c9787f7f1e7eb722f511dc52f0c7c74c
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  multiplex-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          (
            cd src
            python -m py_compile hoopvision/core/progress.py screen_tracker_nextgen/sam31_ambiguity_continuity.py
            python tools/validate_governing_delivery_policy.py
          )
          tar -C src -czf /tmp/candidate.tgz screen_tracker_nextgen hoopvision/core
          echo "$CANDIDATE_SHA" > /tmp/candidate.sha

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Start retained Tokyo L4 if stopped
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --format='value(status)')"
          echo "TOKYO_STATUS_BEFORE=$STATUS"
          if test "$STATUS" != "RUNNING"; then
            gcloud compute instances start "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet
            echo "HV_STARTED_INSTANCE=1" >> "$GITHUB_ENV"
          else
            echo "HV_STARTED_INSTANCE=0" >> "$GITHUB_ENV"
          fi
          ok=0
          for i in $(seq 1 60); do
            if gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command='echo TORONTO_MULTIPLEX_AB_SSH_OK' >/tmp/ssh.out 2>/tmp/ssh.err; then
              cat /tmp/ssh.out
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { cat /tmp/ssh.err; exit 3; }

      - name: Stage candidate and two-decision retained A-B input
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="
            set -euo pipefail
            ROOT=/srv/hoopvision/runs/$RETAINED_RUN_ID/artifacts
            WORK=/tmp/hv-toronto-multiplex-ab
            sudo rm -rf \"\$WORK\"
            sudo mkdir -p \"\$WORK/src\" \"\$WORK/out\"
            sudo cp \"\$ROOT/sam31/ambiguity_windows.json\" \"\$WORK/ambiguity_windows_full.json\"
            sudo chown -R $(id -u):$(id -g) \"\$WORK\"
            test -s \"\$WORK/ambiguity_windows_full.json\"
            sudo test -s \"\$ROOT/nextgen_mask/source_native.mp4\"
            sudo test -s \"\$ROOT/identity_segments/uniform_observations.csv\"
          "
          gcloud compute scp "$INSTANCE:/tmp/hv-toronto-multiplex-ab/ambiguity_windows_full.json" /tmp/ambiguity_windows_full.json --zone "$ZONE" --project "$PROJECT_ID" --quiet
          python - <<'PY'
          import json
          src='/tmp/ambiguity_windows_full.json'
          dst='/tmp/ambiguity_windows_ab.json'
          d=json.load(open(src))
          keep={12,27}
          decisions=[x for x in (d.get('decisions') or []) if int(x.get('decision_id',-1)) in keep]
          assert len(decisions)==2, [(x.get('decision_id'),x.get('from_segment_id'),x.get('to_segment_id')) for x in decisions]
          d['decisions']=decisions
          json.dump(d,open(dst,'w'),indent=2)
          print('FILTERED_DECISIONS', [int(x['decision_id']) for x in decisions])
          PY
          gcloud compute scp /tmp/candidate.tgz /tmp/candidate.sha /tmp/ambiguity_windows_ab.json "$INSTANCE:/tmp/hv-toronto-multiplex-ab/" --zone "$ZONE" --project "$PROJECT_ID" --quiet
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="
            set -euo pipefail
            cd /tmp/hv-toronto-multiplex-ab
            tar -C src -xzf candidate.tgz
            test \"\$(cat candidate.sha)\" = '$CANDIDATE_SHA'
            test -s ambiguity_windows_ab.json
          "

      - name: Execute real two-object multiplex A-B
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="
            set -euo pipefail
            ROOT=/srv/hoopvision/runs/$RETAINED_RUN_ID/artifacts
            WORK=/tmp/hv-toronto-multiplex-ab
            SIZE=\$(sudo stat -c %s /srv/hoopvision/models/cache/sam3.1_multiplex.pt)
            test \"\$SIZE\" = 3502755717
            sudo docker image inspect '$IMAGE' >/dev/null
            nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
            rm -rf \"\$WORK/out\" && mkdir -p \"\$WORK/out\"
            set +e
            /usr/bin/time -f '%e' -o \"\$WORK/wall_s.txt\" sudo timeout --signal=TERM --kill-after=30s 240s docker run --rm --pull=never --gpus all \
              --name hv-toronto-multiplex-ab \
              -e PYTHONPATH=/opt/hoopvision \
              -v \"\$WORK/src:/opt/hoopvision:ro\" \
              -v \"\$ROOT:/retained:ro\" \
              -v \"\$WORK:/work\" \
              -v /srv/hoopvision/models/cache:/models:ro \
              --workdir /opt/hoopvision \
              --entrypoint python \
              '$IMAGE' \
              -m screen_tracker_nextgen.sam31_ambiguity_continuity \
              --source /retained/nextgen_mask/source_native.mp4 \
              --observations /retained/identity_segments/uniform_observations.csv \
              --windows /work/ambiguity_windows_ab.json \
              --out-dir /work/out \
              --checkpoint /models/sam3.1_multiplex.pt
            RC=\$?
            set -e
            echo \"\$RC\" > \"\$WORK/sam31_exit_code.txt\"
            echo SAM_AB_RC=\$RC
            echo ===BATCHING===
            cat \"\$WORK/out/sam31_batching.json\" 2>/dev/null || true
            echo ===PROGRESS===
            cat \"\$WORK/out/sam31_progress.jsonl\" 2>/dev/null || true
            echo ===QA===
            cat \"\$WORK/out/sam31_qa.json\" 2>/dev/null || true
          "

      - name: Retrieve A-B evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          gcloud compute scp --recurse "$INSTANCE:/tmp/hv-toronto-multiplex-ab/out" result/ --zone "$ZONE" --project "$PROJECT_ID" --quiet || true
          gcloud compute scp "$INSTANCE:/tmp/hv-toronto-multiplex-ab/sam31_exit_code.txt" result/ --zone "$ZONE" --project "$PROJECT_ID" --quiet || true
          gcloud compute scp "$INSTANCE:/tmp/hv-toronto-multiplex-ab/wall_s.txt" result/ --zone "$ZONE" --project "$PROJECT_ID" --quiet || true
          printf 'CANDIDATE_SHA=%s\nRETAINED_RUN_ID=%s\nDECISION_IDS=12,27\nHISTORICAL_SERIAL_PROPAGATION_S=89.905\n' "$CANDIDATE_SHA" "$RETAINED_RUN_ID" > result/tuple.txt
          find result -maxdepth 3 -type f -printf '%P %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoopvision-toronto-sam-multiplex-ab
          path: result/
          retention-days: 30

      - name: Classify A-B
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RC="$(cat result/sam31_exit_code.txt 2>/dev/null || echo 999)"
          test "$RC" = "0"
          test -s result/out/sam31_batching.json
          python - <<'PY'
          import json
          q=json.load(open('result/out/sam31_batching.json'))
          assert q['planned_decision_count']==2, q
          assert q['multiplex_batch_count']==1, q
          assert q['batches'][0]['object_count']==2, q
          print('HOOPVISION_TORONTO_MULTIPLEX_AB_COMPLETED', q)
          PY

      - name: Stop Tokyo L4 if this run started it
        if: always()
        shell: bash
        run: |
          if test "${HV_STARTED_INSTANCE:-0}" = "1"; then
            gcloud compute instances stop "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet || true
          fi
