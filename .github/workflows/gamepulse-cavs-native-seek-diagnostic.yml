name: Integrated Pulse Cavs native SDK seek diagnostic
# Approved metadata-only isolation run; no raw frames leave ephemeral GitHub runner.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-cavs-native-seek-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-cavs-native-seek-diagnostic
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { label: cavs-q1-positive, game: '0022600006', tipoff: '2026-10-22T23:00:00Z', from: '1792711680000' }
          - { label: cavs-q3-native, game: '0022600006', tipoff: '2026-10-22T23:00:00Z', from: '1792716650000' }
          - { label: cavs-q4-native, game: '0022600006', tipoff: '2026-10-22T23:00:00Z', from: '1792718860000' }
          - { label: denver-q3-official-action, game: '0022600007', tipoff: '2026-10-23T01:30:00Z', from: '1792726020000' }
          - { label: rockets-q3-official-action, game: '0022600091', tipoff: '2026-10-22T00:30:00Z', from: '1792634450000' }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public boundary
        run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original licensed SDK runtime without lifecycle scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Compare SDK-native seeks with SDK-authorised exact-slot historical reads
        working-directory: tools/licensed_feed
        env:
          SAMPLE_LABEL: ${{ matrix.label }}
          GAME_ID: ${{ matrix.game }}
          GAME_TIPOFF: ${{ matrix.tipoff }}
          SOURCE_FROM: ${{ matrix.from }}
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {mkdtempSync,readFileSync,rmSync,writeFileSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {spawnSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {planGame} from './season_core.mjs';
          import {capture} from './capture.mjs';
          const game_id=process.env.GAME_ID,label=process.env.SAMPLE_LABEL;
          const start_ms=Number(process.env.SOURCE_FROM),tipoff_ms=Date.parse(process.env.GAME_TIPOFF);
          const token=process.env.GH_TOKEN;
          if(!token||token.length<30||process.env.GITHUB_REPOSITORY!=='timeedmonds-maker/hoopvision-runner'
             ||process.env.GITHUB_REF!=='refs/heads/main'||!Number.isSafeInteger(start_ms)
             ||!Number.isSafeInteger(tipoff_ms)||start_ms%5000)
             throw Error('invalid_diagnostic_context');
          delete process.env.GH_TOKEN;
          const plan=planGame({id:game_id,start:tipoff_ms});
          const part=Math.floor((start_ms-plan.begin)/(300*5000));
          if(part<0||part>=plan.parts.length)throw Error('diagnostic_window_outside_game_horizon');
          const job={...plan.parts[part],part,start_ms,count:12};
          const modes=[
            {name:'sdk_native_seek',fastlane:false},
            {name:'sdk_issued_signed_exact_slots',fastlane:true}
          ];
          const cases=[];
          for(const mode of modes){
            const scratch=mkdtempSync(join(tmpdir(),'pulse-boundary-matrix-'));
            const record={mode:mode.name,status:'ERROR',successful_windows:0,empty_windows:null,
              keyframes:0,player_frames:0,ball_frames:0,imputed:false};
            try{
              if(mode.fastlane)process.env.GAMEPULSE_FINAL_FASTLANE='true';
              else delete process.env.GAMEPULSE_FINAL_FASTLANE;
              delete process.env.GAMEPULSE_LIVE_ELAPSED_FASTLANE;
              await capture(job,scratch);
              const m=JSON.parse(readFileSync(join(scratch,'manifest.json'),'utf8'));
              if(m.observed!==true||m.imputed!==false||m.successful_windows!==12)
                throw Error('invalid_observed_source_manifest');
              Object.assign(record,{status:'SOURCE_OBSERVED',successful_windows:m.successful_windows,
                empty_windows:m.empty_windows,keyframes:m.unique_keyframes,
                player_frames:m.frames_with_players,ball_frames:m.frames_with_ball});
            }catch(error){
              record.error_code=/^[a-z_]+$/.test(error?.message||'')?error.message:'source_capture_failure';
            }finally{
              delete process.env.GAMEPULSE_FINAL_FASTLANE;
              rmSync(scratch,{recursive:true,force:true});
            }
            cases.push(record);
            console.log('INTEGRATED_PULSE_BOUNDARY_TEST',JSON.stringify({
              label,game_id,source_start_ms:start_ms,...record
            }));
          }
          const report={
            schema:'integrated-pulse.cavs-method-boundary.v1',
            generated_at_utc:new Date().toISOString(),label,game_id,
            source_start_ms:start_ms,planned_part:part,window_count:12,
            sdk_version:'@ease-live/ease-live-bridge-web@1.22.0',
            comparison:'SDK_NATIVE_PLAYER_TIME_VERSUS_SDK_ISSUED_SIGNED_SLOT',
            methods:cases,original_private_archives_unmodified:true,
            full_game_tracking_certified:false
          };
          const dir=mkdtempSync(join(tmpdir(),'pulse-matrix-report-'));
          const tag='gamepulse-cavs-method-boundary-20261024';
          const out=join(dir,label+'.json');
          const gh=args=>spawnSync('gh',args,{encoding:'utf8',timeout:60000,
             env:{...process.env,GH_TOKEN:token},maxBuffer:1048576});
          try{
            writeFileSync(out,JSON.stringify(report,null,2)+'\n');
            if(gh(['release','view',tag,'--repo','timeedmonds-maker/104']).status!==0){
              const created=gh(['release','create',tag,'--repo','timeedmonds-maker/104',
                '--title','Cavaliers Integrated Pulse source-boundary diagnostic',
                '--notes','Private metadata-only SDK vs signed-slot method comparison; no raw data in public artifacts',
                '--latest=false']);
              if(created.status!==0&&gh(['release','view',tag,'--repo','timeedmonds-maker/104']).status!==0)
                throw Error('private_diagnostic_release_create_failed');
            }
            if(gh(['release','upload',tag,out,'--repo','timeedmonds-maker/104','--clobber']).status!==0)
              throw Error('private_diagnostic_upload_failed');
            const listing=gh(['api','repos/timeedmonds-maker/104/releases/tags/'+tag]);
            if(listing.status!==0)throw Error('private_diagnostic_readback_failed');
            const asset=JSON.parse(listing.stdout).assets.find(a=>a.name===label+'.json');
            const digest='sha256:'+createHash('sha256').update(readFileSync(out)).digest('hex');
            if(asset?.digest!==digest)throw Error('private_diagnostic_digest_mismatch');
            console.log('INTEGRATED_PULSE_BOUNDARY_PRIVATE_SHA_VERIFIED',label,
              cases.map(x=>x.mode+':'+x.status+':'+x.player_frames+':'+x.ball_frames).join(' '));
          }finally{rmSync(dir,{recursive:true,force:true});}
          NODE
