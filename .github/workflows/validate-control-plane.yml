name: Validate HoopVision Regression Gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-control-plane.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout private HoopVision source
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ef60281fbc72900a85459cc14d03079fb935c70b
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate identity and control-plane regressions
        run: |
          set -euo pipefail
          python -m unittest hoopvision.tests.test_semantic_anchor_source -v
          python -m py_compile tools/release/dev_supervisor.py tools/release/watch_run.py tools/release/submit_dev.py hoopvision/worker/interactive_service.py hoopvision/worker/run_fresh_hawks_all_player.py hoopvision/worker/run_fresh_hawks_identity_replay.py screen_tracker_nextgen/global_identity_solver.py screen_tracker_nextgen/all_player_identity_solver.py screen_tracker_nextgen/reauthorize_all_player_assignments.py screen_tracker_nextgen/materialize_sam31_player_paths.py screen_tracker_nextgen/render_all_player_labels.py tools/adams_event_track_identity_ocr.py tools/adams_screen_prod_v3.py
