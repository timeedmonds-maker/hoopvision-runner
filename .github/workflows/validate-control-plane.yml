name: Validate HoopVision Regression Gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-control-plane.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout private HoopVision source
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: 9091f1475b0cade6804627c9fcc17ef64ff5c2dc
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate identity and control-plane regressions
        run: |
          set -euo pipefail
          python -m unittest hoopvision.tests.test_semantic_anchor_source -v
          python -m py_compile tools/release/dev_supervisor.py tools/release/watch_run.py tools/release/submit_dev.py
