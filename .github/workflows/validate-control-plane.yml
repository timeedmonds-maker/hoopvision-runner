name: Validate HoopVision Control Plane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-control-plane.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private HoopVision candidate SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DEFAULT_SOURCE_SHA: aebc718d97ab830525e44217988416c30285813c
    steps:
      - name: Resolve exact candidate
        id: source
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SHA="${INPUT_SOURCE_SHA:-$DEFAULT_SOURCE_SHA}"
          test "${#SHA}" -eq 40
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Validating private candidate $SHA"

      - name: Checkout exact private HoopVision source
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile actual control-plane consumers
        run: |
          set -euo pipefail
          python -m py_compile             hoopvision/core/control_plane_contract.py             tools/release/dev_supervisor.py             tools/release/submit_dev.py             hoopvision/worker/interactive_service.py

      - name: Prove exact event296 dispatch contract on CPU
        run: |
          set -euo pipefail
          python -m unittest -v hoopvision.tests.test_control_plane_contract

      - name: Exercise exact event296 request through production validation function
        run: |
          set -euo pipefail
          python - <<'PY'
          from hoopvision.core.control_plane_contract import (
              BENCHMARK_ENDPOINTS, FIXTURE_IDS, SupervisorRuntimeIdentity,
              benchmark_registry_sha256, validate_dispatch_request,
          )

          identity = SupervisorRuntimeIdentity(
              pid=4242,
              started_at_unix_s=1790000000.0,
              module_path="/srv/hoopvision/control/dev_supervisor.py",
              startup_sha256="a"*64,
              build_revision="cpu-proof",
              session_id="hv-dev-l4",
              app_root="/srv/hoopvision/apps",
              worker_registry=tuple(sorted(BENCHMARK_ENDPOINTS)),
              benchmark_map=tuple(sorted(BENCHMARK_ENDPOINTS.items())),
          )
          request = {
              "schema":"hoopvision.dev-run.v1",
              "run_id":"cpu-event296-proof",
              "session_id":"hv-dev-l4",
              "fixture_id":FIXTURE_IDS["hawks-event296-playbyplay"],
              "benchmark":"hawks-event296-playbyplay",
              "benchmark_registry_sha256":benchmark_registry_sha256(),
          }
          endpoint=validate_dispatch_request(request,identity)
          assert endpoint=="/v1/benchmark/hawks-event296-playbyplay", endpoint
          stale=dict(request)
          stale["benchmark_registry_sha256"]="0"*64
          try:
              validate_dispatch_request(stale,identity)
          except RuntimeError as exc:
              assert "registry identity mismatch" in str(exc)
          else:
              raise AssertionError("stale registry was not rejected")
          print("HOOPVISION_EVENT296_CPU_DISPATCH_PROOF_OK", endpoint)
          PY
