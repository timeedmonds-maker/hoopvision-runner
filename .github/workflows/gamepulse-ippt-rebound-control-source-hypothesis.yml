name: IPPT original NBA nonshot rebound physical source transition with wrong-player control
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-rebound-control-source-hypothesis.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  nba-original-rebound-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: d5ce354fd3e717f4d563dfd5e486ed9bbb646e6f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard and exact private SHA NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free original native rebound actor collision and null controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_nonshot_rebound_source_transition_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_nonshot_rebound_source_transition_2026.py
      - name: Two original source NBA game rebound transition and wrong-actor benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_nonshot_rebound_source_transition_2026.py \
             --root . --games 0022600009 0022600092
          echo "IPPT_TWO_REAL_REBOUND_SOURCE_TRANSITION_QA_PASS"
      - name: All 36 SHA original NBA PBP rebounds / source ball-player transition negative control
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_nonshot_rebound_source_transition_2026.py \
             --root . | tee "$RUNNER_TEMP/ippt_rebounds_aggregate.log"
          echo "IPPT_3948_ALL36_NBA_REBOUNDS_ORIGINAL_SOURCE_PHYSICS_PILOT_PASS"
      - name: Publish only combined aggregate actual-actor and wrong-player controls
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"ippt_rebounds_aggregate.log"
          summary={"github_run_id":os.environ["GITHUB_RUN_ID"],
                   "prior_job_status":os.environ["QA_JOB_RESULT"],
                   "expected_private_source_commit":"d5ce354fd3e717f4d563dfd5e486ed9bbb646e6f"}
          if path.exists():
            lines=[l.partition(" ")[2] for l in path.read_text().splitlines()
                  if l.startswith("IPPT_REBOUND_ALL36_SOURCE_PHYSICS_CANDIDATE_QA ")]
            if len(lines)==1:
              z=json.loads(lines[0])
              summary.update({"schema":z["schema"],"games":z["games"],
                              "counts":z["counts"],
                              "physical_event_accuracy_still_unverified":True})
          (Path(os.environ["RUNNER_TEMP"])/"ippt_rebound_source_qa_comment.md").write_text(
            "NBA original rebound control source-physics hypothesis only, NOT verified physical contact, ball custody or timing. No licensed actor XYZ or per-event candidate UTC.\n\n~~~json\n"+
            json.dumps(summary,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          gh issue comment 128 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_rebound_source_qa_comment.md"

# No original NBA original XYZ, original per-event candidate UTC, or private archive data published.
