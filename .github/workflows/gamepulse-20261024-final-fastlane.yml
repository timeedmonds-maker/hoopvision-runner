name: Game Pulse Oct 24 final-game private SDK fastlane
# 2026-10-25 NZ evening: gap-only rerun for late SDK source checkpoints; preserve certified original assets.
# Reviewed exact-path public content guard allowlist is active (2026-10-25).
# One-off 2026-10-24 US slate; only NBA-official-final games; original observations privately SHA archived in 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-20261024-final-fastlane.yml']
permissions:
  contents: read
concurrency:
  group: gamepulse-oct24-final-original-private-sha
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      games: ${{ steps.plan.outputs.games }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - name: Discover all final games not in private verified catalog
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh api repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27-integrated-current.json --jq .content | base64 -d > "$RUNNER_TEMP/catalog.json"
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const cat=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/catalog.json','utf8'));
          const sources=[['modern','https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json'],
            ['legacy','https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2026/league/00_full_schedule.json']];
          let games=[];
          for(const [kind,url] of sources){
            try{
              const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://www.nba.com/'},signal:AbortSignal.timeout(20000)});
              if(!r.ok)continue;
              const j=await r.json();
              if(kind==='modern')games=(j.leagueSchedule?.gameDates||[]).flatMap(d=>d.games||[])
                .filter(g=>String(g.gameStatus)==='3').map(g=>({id:String(g.gameId),tipoff:g.gameDateTimeUTC}));
              else games=(j.data?.lscd||[]).flatMap(m=>Array.isArray(m.mscd)?m.mscd.flatMap(d=>d.g||[]):m.mscd?.g||[])
                .filter(g=>/^final/i.test(String(g.stt||''))).map(g=>({id:String(g.gid),tipoff:String(g.gdtutc)+'T'+String(g.utctm)+':00Z'}));
              if(games.length)break;
            }catch{console.log('OFFICIAL_SCHEDULE_FALLBACK',kind);}
          }
          if(!games.length)throw Error('official_schedule_unavailable');
          const now=Date.now();
          // The official NBA final gate, reverified inside every capture worker,
          // allows exact original SDK full-game recovery without an arbitrary five-hour delay.
          const today=new Set(['0022600104','0022600105','0022600106','0022600107',
            '0022600108','0022600109','0022600110','0022600111']);
          const ready=games.filter(g=>today.has(g.id)&&Number.isFinite(Date.parse(g.tipoff))
            &&Date.parse(g.tipoff)>=Date.parse('2026-10-24T21:00:00Z')
            &&Date.parse(g.tipoff)<Date.parse('2026-10-25T04:00:00Z')
            &&Date.parse(g.tipoff)<=now);
          // Only request missing original SDK parts. Prior verified parts are
          // immutable private assets; never re-fetch or overwrite their source.
          const candidates=ready.filter(g=>cat.games[g.id]?.index_state!=='VERIFIED_ARCHIVE_INDEX')
            .sort((a,b)=>Date.parse(a.tipoff)-Date.parse(b.tipoff));
          if(candidates.length>8||candidates.some(g=>now-Date.parse(g.tipoff)>7*86400000))
            throw Error('backlog_outside_bounded_authenticated_fanout');
          const incomplete=[],parts=[];
          let completed=0,reusedParts=0;
          for(const game of candidates){
            const r=await fetch('https://api.github.com/repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-'+game.id,{
              headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json',
                'User-Agent':'reviewed-gamepulse-private-archive-readback'},
              signal:AbortSignal.timeout(30000)});
            if(r.status!==404&&!r.ok)throw Error('private_archive_discovery_denied_'+r.status);
            const names=new Set(r.status===404?[]:((await r.json()).assets||[]).map(x=>x.name));
            if(names.has('sdk-COMPLETE.json')){completed++;continue;}
            incomplete.push(game);
            for(let part=0;part<13;part++){
              const base='sdk-part-'+String(part).padStart(2,'0');
              if(names.has(base+'.tar.gz')&&names.has(base+'.json')){reusedParts++;continue;}
              parts.push({...game,part});
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'games='+JSON.stringify({include:incomplete})+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'parts='+JSON.stringify({include:parts})+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'count='+incomplete.length+'\n');
          console.log('FINAL_READY',ready.length,'VERIFIED',Object.keys(cat.games).length,
            'ALREADY_COMPLETE',completed,'PARTS_REUSED',reusedParts,
            'GAMES_INCOMPLETE',incomplete.length,'PARTS_TO_CAPTURE',parts.length);
          console.log('INCOMPLETE_GAME_IDS',incomplete.map(x=>x.id).join(','));

          JS
  capture:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.parts) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: ${{ matrix.id }}
          GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.tipoff }}
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs
  certify:
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.count != '0'
    needs: [discover, capture]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.games) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: ${{ matrix.id }}
          GAMEPULSE_PRIORITY_TIPOFF: ${{ matrix.tipoff }}
        run: node season_private_release.mjs
