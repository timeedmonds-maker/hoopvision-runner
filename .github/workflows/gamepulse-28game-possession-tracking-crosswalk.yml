name: Integrated Pulse PBP to Game Pulse crosswalk integrity
# Only CPU, private 104 data stays in ephemeral runner and private 104 outputs.
# Validate 26-game native source hash reconciliation after safe no-content rewrite.
# Public runner persists NO licensed raw tracking/player/event payload.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-28game-possession-tracking-crosswalk.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
  schedule:
    - cron: '41 10 * * *'
permissions:
  contents: read
concurrency:
  group: nba-private-integrated-pulse-crosswalk-integrity
  cancel-in-progress: false
jobs:
  crosswalk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      QA_REF: main
      PRIVATE_REPO: timeedmonds-maker/104
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public/private source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_104_AUTH_NOT_AVAILABLE'; exit 3; }
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
      - name: Independently recheck quarantined NBA source timelines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from urllib.request import Request,urlopen
          for gid in ("0022600009","0022600101"):
              url="https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_"+gid+".json"
              req=Request(url,headers={"User-Agent":"Mozilla/5.0",
                                      "Referer":"https://www.nba.com/"})
              try:
                  with urlopen(req,timeout=22) as result:
                      raw=result.read(2_000_001)
                  assert len(raw)<2_000_001
                  doc=json.loads(raw)
                  assert str(doc["game"]["gameId"])==gid
                  acts=doc["game"]["actions"]
                  assert len(acts)>=500
                  def clock(a):
                      import re
                      m=re.fullmatch(r"PT(?:(\d+)H)?(?:(\d+)M)?([0-9.]+)S",a["clock"])
                      assert m
                      return int(float(m[1] or 0)*3600000+float(m[2] or 0)*60000+float(m[3])*1000)
                  keyed=sorted(acts,key=lambda a:(a["period"],-clock(a),
                      a.get("orderNumber") or a["actionNumber"]))
                  number_regressions=sum(
                      b["orderNumber"]<a["orderNumber"] for a,b in zip(keyed,keyed[1:]))
                  score_regressions=sum(
                      int(b["scoreHome"])<int(a["scoreHome"]) or
                      int(b["scoreAway"])<int(a["scoreAway"])
                      for a,b in zip(keyed,keyed[1:]))
                  times=[a.get("timeActual") or "" for a in keyed]
                  utc_regressions=sum(b<a for a,b in zip(times,times[1:]) if a and b)
                  print("OFFICIAL_NBA_SOURCE_RECHECK",gid,
                        "actions",len(acts),"order_regressions",number_regressions,
                        "score_regressions",score_regressions,
                        "utc_regressions",utc_regressions,
                        "source_sha256",hashlib.sha256(raw).hexdigest())
              except Exception as err:
                  print("OFFICIAL_NBA_SOURCE_RECHECK_UNAVAILABLE",gid,type(err).__name__,
                        "http_status",getattr(err,"code",None))
          PY
      - name: Verify independent ESPN event source chronology for quarantined games
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from urllib.request import Request,urlopen
          for gid,eid in (("0022600009","401909096"),("0022600101","401909850")):
              url="https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event="+eid
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0",
                         "Accept":"application/json","Referer":"https://www.espn.com/"})
                  with urlopen(req,timeout=22) as r:
                      raw=r.read(8_000_001)
                  assert len(raw)<8_000_001
                  doc=json.loads(raw)
                  plays=doc.get("plays") or []
                  if isinstance(plays,dict):
                      plays=plays.get("plays",[])
                  assert isinstance(plays,list)
                  periods={}
                  for p in plays:
                      n=(p.get("period") or {}).get("number")
                      periods[str(n)]=periods.get(str(n),0)+1
                  with_wallclock=sum(bool(p.get("wallclock")) for p in plays)
                  with_clock=sum(bool((p.get("clock") or {}).get("displayValue")) for p in plays)
                  print("ESPN_ORIGINAL_PBP_SOURCE_QA",gid,"espn_game_id",eid,
                        "plays",len(plays),"period_counts",json.dumps(periods,sort_keys=True),
                        "wallclock_actions",with_wallclock,"clock_actions",with_clock,
                        "has_plays",len(plays)>250)
              except Exception as exc:
                  print("ESPN_SOURCE_TIMING_UNAVAILABLE",gid,type(exc).__name__,
                        "http_status",getattr(exc,"code",None))
          PY
      - name: Retrieve only required original private 104 indexes into ephemeral temp
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/pulse-private"
          mkdir -p "$WORK"
          SOURCE_COMMIT="$(gh api "repos/$PRIVATE_REPO/git/ref/heads/main" --jq .object.sha)"
          test "${#SOURCE_COMMIT}" -eq 40
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          fetch_private () {
            local name="$1"
            local ref="$2"
            mkdir -p "$(dirname "$WORK/$name")"
            gh api "repos/$PRIVATE_REPO/contents/$name?ref=$ref" --jq '.content' |
              base64 --decode > "$WORK/$name"
            test -s "$WORK/$name"
          }
          fetch_private gamepulse/fusion/season_possession_tracking_crosswalk_2026.py "$SOURCE_COMMIT"
          fetch_private gamepulse/fusion/tests/test_season_possession_tracking_crosswalk_2026.py "$SOURCE_COMMIT"
          for src in \
            gamepulse/catalog/2026-27-integrated-current.json \
            gamepulse/fusion/index/index.json \
            gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json \
            gamepulse/fusion/index/interactions/index-2026-27.json \
            gamepulse/fusion/onoff/index-2026-27-expanded.json; do
              fetch_private "$src" "$SOURCE_COMMIT"
          done
          python3 -m py_compile "$WORK/gamepulse/fusion/season_possession_tracking_crosswalk_2026.py"
          python3 -m unittest discover -s "$WORK/gamepulse/fusion/tests" \
            -p 'test_season_possession_tracking_crosswalk_2026.py' -v
          python3 - "$WORK/gamepulse/catalog/2026-27-integrated-current.json" "$WORK/gamepulse/fusion/index/interactions/index-2026-27.json" > "$RUNNER_TEMP/pulse-ids.json" <<'PY'
          import json,sys
          catalog=json.load(open(sys.argv[1]))
          interactions=json.load(open(sys.argv[2]))
          games=set(catalog['games'])
          assert games and set(interactions['games']) <= games
          print(json.dumps({"games":sorted(games),"joined":sorted(interactions['games'])}))
          PY
          python3 - "$RUNNER_TEMP/pulse-ids.json" > "$RUNNER_TEMP/private-paths.txt" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1]))
          for gid in doc['games']:
              print("gamepulse/fusion/index/games/"+gid+".json")
              print("gamepulse/fusion/official_pbp_timing/games/"+gid+".json")
          for gid in doc['joined']:
              print("gamepulse/fusion/index/interactions/"+gid+".json")
          PY
          while IFS= read -r src; do
            fetch_private "$src" "$SOURCE_COMMIT"
          done < "$RUNNER_TEMP/private-paths.txt"
      - name: Cross-validate suspect NBA event times with independent ESPN wallclocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,datetime,json,os,re,statistics
          from pathlib import Path
          from urllib.request import Request,urlopen
          root=Path(os.environ["RUNNER_TEMP"])/"pulse-private"
          for gid,eid in (("0022600009","401909096"),("0022600101","401909850")):
              nba=json.loads((root/("gamepulse/fusion/official_pbp_timing/games/"+gid+".json")).read_text())
              url="https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event="+eid
              request=Request(url,headers={"User-Agent":"Mozilla/5.0",
                    "Accept":"application/json","Referer":"https://www.espn.com/"})
              with urlopen(request,timeout=30) as reply: doc=json.loads(reply.read(8_000_000))
              plays=doc["plays"]
              if isinstance(plays,dict):plays=plays["plays"]
              if not plays:raise RuntimeError("ESPN_INDEPENDENT_PLAY_BY_PLAY_EMPTY")
              example=plays[0]
              print("ESPN_PLAY_FIELD_SHAPE",gid,
                    "keys",sorted(example.keys()),
                    "clock_keys",sorted((example.get("clock") or {}).keys()),
                    "period_keys",sorted((example.get("period") or {}).keys()),
                    "wallclock_present",bool(example.get("wallclock")))
              candidates=[]
              for p in plays:
                  v=p.get("clock") or {}; pd=p.get("period") or {}
                  stamp=p.get("wallclock")
                  if not stamp:continue
                  try:
                      clock_string=str(v.get("displayValue") or "")
                      clock_parts=clock_string.split(":")
                      secs=(60*int(clock_parts[0])+float(clock_parts[1])) if len(clock_parts)==2 else float(clock_string)
                      utc=int(datetime.datetime.fromisoformat(stamp.replace("Z","+00:00")).timestamp()*1000)
                      home=int(p["homeScore"]);away=int(p["awayScore"])
                      candidates.append((int(pd["number"]),secs,home,away,utc,p))
                  except (KeyError,ValueError,TypeError,IndexError):continue
              matched=[];suspects=[];missing=0;multiple=0
              for a in nba["actions"]:
                  if a["action_type"] not in ("2pt","3pt","freethrow"):continue
                  sec=a["game_clock_ms_remaining"]/1000
                  options=[q for q in candidates if q[0]==a["period"]
                     and abs(q[1]-sec)<=0.75
                     and q[2]==a["score_home"] and q[3]==a["score_away"]
                     and q[5].get("scoringPlay") is True]
                  if len(options)==1:
                      diff=a["official_timeActual_utc_ms"]-options[0][4]
                      matched.append(abs(diff))
                      if abs(diff)>5000:
                          suspects.append((a["nba_action_number"],a["period"],round(sec,2),diff))
                  elif not options:missing+=1
                  else:multiple+=1
              print("ESPN_INDEPENDENT_EVENT_UTC_CROSSWALK",gid,
                    "eligible_scoring_events",sum(a["action_type"] in ("2pt","3pt","freethrow") for a in nba["actions"]),
                    "espn_play_candidates",len(candidates),
                    "unique_scoring_identity_matches",len(matched),
                    "unmatched",missing,"ambiguous",multiple,
                    "matched_median_abs_delta_ms",statistics.median(matched) if matched else None,
                    "abs_delta_over_5s",len(suspects),
                    "late_or_conflicting_action_numbers",str(suspects[:24]))
          PY
      - name: Enforce full season official events and correct native-touch crosswalk
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/pulse-private"
          python3 "$WORK/gamepulse/fusion/season_possession_tracking_crosswalk_2026.py" \
            --root "$WORK" --out "$RUNNER_TEMP/pulse-verified.json"
          python3 - "$RUNNER_TEMP/pulse-verified.json" <<'PY'
          import json,os,sys
          from pathlib import Path
          p=Path(sys.argv[1]); j=json.loads(p.read_text())
          j["source_repository_commit"]=os.environ["SOURCE_COMMIT"]
          p.write_text(json.dumps(j,indent=2,sort_keys=True)+"\n")
          PY
          python3 - "$RUNNER_TEMP/pulse-verified.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['game_count'] >= 28, 'CURRENT_SEASON_GAME_COUNT_REGRESSION'
          assert j['official_pbp_games_indexed']==j['game_count']
          assert j['official_pbp_games_validated']+len(j['official_pbp_clock_anomaly_games'])==j['game_count']
          assert set(j['official_pbp_clock_anomaly_games']) <= {'0022600009','0022600101'}
          assert j['tracking_game_views_indexed']==j['game_count']
          assert j['native_touch_action_run_crosswalk_games']>=26
          assert set(j['native_touch_action_run_crosswalk_missing_games']) <= {'0022600009','0022600101'}
          assert j['physical_nba_possessions_certified']==0
          assert (j['native_touch_action_run_crosswalk_games']+
                  len(j['native_touch_action_run_crosswalk_missing_games'])==
                  j['game_count'])
          print("PRIVATE_PBP_TRACKING_INTEGRITY_PASSED",
                "games",j['game_count'],
                "action_run_crosswalk_games",j['native_touch_action_run_crosswalk_games'],
                "unjoined_games",len(j['native_touch_action_run_crosswalk_missing_games']),
                "physical_possessions_certified",0)
          PY
      - name: Save SHA-verified report privately and nowhere public
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          repo=os.environ['PRIVATE_REPO']
          path='gamepulse/fusion/season_possession_tracking_crosswalk_verified.json'
          endpoint='repos/'+repo+'/contents/'+path
          raw=(Path(os.environ['RUNNER_TEMP'])/'pulse-verified.json').read_bytes()
          def gh(*args,input=None,check=True):
              r=subprocess.run(['gh','api',*args],input=input,text=True,
                               capture_output=True,timeout=75)
              if check and r.returncode:
                  raise RuntimeError('PRIVATE_REPOSITORY_API_OPERATION_FAILED')
              return r
          previous=gh(endpoint,check=False)
          payload={'branch':'main','message':
                   'data(gamepulse): validated season PBP native-touch crosswalk [skip ci]',
                   'content':base64.b64encode(raw).decode()}
          if previous.returncode==0:
              obj=json.loads(previous.stdout)
              old=base64.b64decode(obj['content'])
              if old==raw:
                  print('PRIVATE_CROSSWALK_QA_UNCHANGED');raise SystemExit(0)
              payload['sha']=obj['sha']
          elif '404' not in previous.stderr:
              raise RuntimeError('PRIVATE_CROSSWALK_PREVIOUS_READ_FAILED')
          response=gh('-X','PUT',endpoint,'--input','-',
                      input=json.dumps(payload))
          blob=json.loads(response.stdout)['content']['sha']
          saved=json.loads(gh('repos/'+repo+'/git/blobs/'+blob).stdout)
          observed=base64.b64decode(saved['content'])
          if observed!=raw or hashlib.sha256(observed).digest()!=hashlib.sha256(raw).digest():
              raise RuntimeError('PRIVATE_CROSSWALK_REPORT_SHA_READBACK_FAILED')
          print('PRIVATE_INTEGRATED_PULSE_CROSSWALK_QA_SAVED_AND_VERIFIED')
          PY
