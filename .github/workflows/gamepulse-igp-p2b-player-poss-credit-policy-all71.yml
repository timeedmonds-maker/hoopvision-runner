# Public runner orchestration; original NBA PBP/player advanced and source rotations stay private.
name: IGP NBA71 player possession overlap policy source QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-player-poss-credit-policy-all71.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp71-source-player-possession-credit-overlap-v1
  cancel-in-progress: false
jobs:
  validate-player-credit-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
      PIN: 0ea214cbff8478864dd942afbe0992c8c885eb63
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verified private original PBP and source code SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          echo PRIVATE_P2B_PLAYER_POSSESSION_SOURCE_SHA_PIN_VERIFIED
      - name: Real public NBA game rotation source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,hashlib
          from pathlib import Path
          url="https://basketball-data.billmill.org/nba/stats/game_rotations/season=2027/data.parquet"
          req=urllib.request.Request(url,headers={"User-Agent":"IGP-player-possession-rotation-audit/1.0"})
          with urllib.request.urlopen(req,timeout=40) as response:
              raw=response.read(20000000)
              if response.read(1):raise ValueError("ROTATION_MIRROR_OVERSIZED")
          if raw[:4]!=b"PAR1" or raw[-4:]!=b"PAR1":
              raise ValueError("NBA_ROTATION_SOURCE_NOT_PARQUET")
          (Path(os.environ["RUNNER_TEMP"])/"nba_2027_rotations.parquet").write_bytes(raw)
          print("NBA_PLAYER_ROTATION_MIRROR_SNAPSHOT",len(raw),hashlib.sha256(raw).hexdigest())
          PY
          python3 -m pip -q install duckdb
      - name: Source-free roster overlap policy contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_player_POSS_roster_overlap_policy_pilot_v1.py
          python3 -m unittest -v \
            gamepulse/fusion/tests/test_igp_v32_p2b_player_POSS_roster_overlap_policy_pilot_v1.py
      - name: Real 71 NBA original PBP chain and published 1597 player POSS policy comparisons
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_player_POSS_roster_overlap_policy_pilot_v1.py \
            --root . --rotations-parquet "$RUNNER_TEMP/nba_2027_rotations.parquet" \
            --out "$RUNNER_TEMP/player_policy_71_original.json" \
            > "$RUNNER_TEMP/player_policy_71_private.log" 2>&1 || {
              echo ORIGINAL71_NBA_PLAYER_CREDIT_POLICY_QA_FAILED
              python3 - <<'PY'
          import re,os
          from pathlib import Path
          log=(Path(os.environ["RUNNER_TEMP"])/"player_policy_71_private.log").read_text(errors="replace").splitlines()
          for line in reversed(log):
              if re.match(r"^(?:ValueError|TypeError|AssertionError|KeyError):",line):
                  typ,_,code=line.partition(":")
                  v=code.strip().split(":")[0].split()[0]
                  print("PRIVATE_SOURCE_QA_FAILURE_CLASS",typ,v if re.fullmatch(r"[A-Z_]{5,100}",v) else "REDACTED")
                  break
          else:print("PRIVATE_SOURCE_QA_FAILURE_CLASS","UNCLASSIFIED")
          PY
              exit 56
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"player_policy_71_original.json").read_bytes())
          c=data["counts"]
          assert c["original_games"]==71 and c["original_chains_searchable"]==14612
          assert data["rotation_stints"]==5659
          assert len(data["policy_results"])==1597
          assert c["candidate_complete_roster_chains"]>0
          assert data["all_original_PBP_chains_still_searchable"]==14612
          assert data["physical_possession_control_boundaries_certified"]==0
          print("NBA71_PLAYER_POSS_OVERLAP_POLICY_SOURCE_RESULT",json.dumps({
            "games":71,"source_chains_searchable":14612,"rotation_stints":5659,
            "player_games":1597,"candidate_roster_chains":c["candidate_complete_roster_chains"],
            "candidate_boundary_ambiguous":c["candidate_NEAR_SOURCE_SUBSTITUTION_EDGE"],
            "physical_possession_boundaries_certified":0,
            "player_policy_metrics":data["policy_metrics"]
          },sort_keys=True))
          PY
      - name: Preserve empirical policy QA only in private source branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B source-player-credit "origin/$BRANCH"
          receipt=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_player_POSS_policy_pilot_71_SOURCE_20261031.json
          if [ -f "$receipt" ]; then echo POLICY_RECEIPT_ALREADY_PRESERVED; exit 0; fi
          cp "$RUNNER_TEMP/player_policy_71_original.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): preserve NBA71 start terminal and overlap player POSS comparison'
          for n in 1 2 3 4 5; do
              git fetch -q origin "$BRANCH"
              git rebase -q "origin/$BRANCH"
              if git push -q origin "HEAD:refs/heads/$BRANCH"; then
                  echo NBA_PLAYER_POSS_POLICY_QA_RECEIPT_COMMITTED_PRIVATE
                  exit 0
              fi
              sleep "$n"
          done
          exit 57
