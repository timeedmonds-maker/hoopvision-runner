name: Clip Lab private original NBA player positions for event80 — rerun
# Original SDK bytes and target-player tracking data remain only in private 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-rockets-event80-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-lab-rockets-event80-native-source
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private origin and public-content safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-rockets-event80-native.yml'])
          print('PUBLIC_CONTENT_POLICY_PASS')
          PY
          test -n "$GH_TOKEN" || { echo PRIVATE_SOURCE_AUTH_MISSING; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Extract Fred and Adams canonical native coordinates to private repository
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab/extract_native_event.py?ref=main' --jq .content | base64 -d > "$ROOT/extract.py"
          python3 -m py_compile "$ROOT/extract.py"
          TAG='gamepulse-clip-0022600009-q1-durant-adams'
          gh release download "$TAG" --repo timeedmonds-maker/104 --pattern 'checkpoint.tar.gz' --dir "$ROOT" >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/release.json"
          python3 - "$ROOT" <<'PY'
          import hashlib,json,subprocess,sys,base64
          from pathlib import Path
          root=Path(sys.argv[1])
          release=json.loads((root/'release.json').read_text())
          assets={a['name']:a for a in release['assets']}
          archive=root/'checkpoint.tar.gz'
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert assets['checkpoint.tar.gz']['digest']=='sha256:'+digest,'ORIGINAL_SDK_SHA_MISMATCH'
          command=[sys.executable,str(root/'extract.py'),
            '--checkpoint',str(archive),'--game-id','0022600009',
            '--event-num','80','--event-utc-ms','1792807093640',
            '--players','1627832,203500','--sha256',digest,
            '--out',str(root/'native.json')]
          subprocess.run(command,check=True,capture_output=True,text=True,timeout=55)
          payload=json.loads((root/'native.json').read_text())
          assert payload['player_ids']==['1627832','203500']
          assert payload['render_authorized'] is False
          assert payload['video_pts_sync_certified'] is False
          tag='clip-lab-hls-0022600009-80'
          upload=subprocess.run(['gh','release','upload',tag,str(root/'native.json'),
               '--repo','timeedmonds-maker/104','--clobber'],
               capture_output=True,text=True,timeout=65)
          if upload.returncode:raise RuntimeError('PRIVATE_NATIVE_RELEASE_UPLOAD_FAILED')
          fetched=subprocess.run(['gh','api','repos/timeedmonds-maker/104/releases/tags/'+tag],
               capture_output=True,text=True,check=True,timeout=40)
          release=json.loads(fetched.stdout)
          assets={a['name']:a for a in release['assets']}
          assert assets['native.json']['digest']=='sha256:'+hashlib.sha256(
              (root/'native.json').read_bytes()).hexdigest(),'PRIVATE_NATIVE_RELEASE_SHA_FAILED'
          print('ORIGINAL_TWO_PLAYER_EVENT80_NATIVE_SHA_VERIFIED_PRIVATE_PASS')
          PY
