# Original NBA data and per-action chain/time records remain private in repo 104.
name: IGP 71game original-native plus P2B event-context deduplicated union
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-native-p2b-action-union-all71-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-native-p2b-action-context-union-71
  cancel-in-progress: true
jobs:
  all71-source-context-union:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source-free native+P2B dedup and clock-stop regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_native_plus_p2b_all71_action_context_union_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_v32_p2b_native_plus_p2b_all71_action_context_union_v1.py'
          echo IGP_ALL71_CONTEXT_UNION_SOURCEFREE_PASS
      - name: Source SHA verified all 43,419 official action context union
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_native_plus_p2b_all71_action_context_union_v1.py \
            --root . --out "$RUNNER_TEMP/igp-native-p2b-71-union.json" \
            >"$RUNNER_TEMP/igp-native-p2b-71-union.log" 2>&1 || {
              echo IGP_NATIVE_P2B_CONTEXT_UNION_PRIVATE_QA_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"igp-native-p2b-71-union.log").read_text(errors="replace").splitlines()
          e=next((s for s in reversed(z) if re.match(r"^(?:ValueError|KeyError|AssertionError|FileNotFoundError|TypeError|ImportError):",s)),None)
          if e:
              klass,_,msg=e.partition(":")
              code=msg.strip().split(":",1)[0].split(" ",1)[0]
              print("IGP_SOURCE_UNION_FAILURE",klass,code if re.fullmatch(r"[A-Z0-9_]{6,90}",code) else "REDACTED")
          else:print("IGP_SOURCE_UNION_FAILURE UNCLASSIFIED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-native-p2b-71-union.json").read_bytes())
          c=r["counts"]
          assert r["games"]==71 and c["all_official_actions"]==43419
          assert c["native_complete_context"]==26502
          assert c["P2B_context_before_stop_veto"]==22419
          assert c["native_complete_context"]<=c["union_complete_context"]<=43419
          assert r["physical_possessions_certified"]==0
          print("IGP_ALL71_SOURCE_NATIVE_P2B_ACTION_CONTEXT_DEDUP_PASS",json.dumps(c,sort_keys=True))
          PY
      - name: Publish immutable private full QA and aggregate snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          blob=(Path(os.environ["RUNNER_TEMP"])/"igp-native-p2b-71-union.json").read_bytes()
          qa=json.loads(blob)
          out=Path("gamepulse/fusion/qa/igp_v32")
          full=out/"igp_v32_p2b_native_plus_p2b_all71_action_context_union_v1.json"
          summary=out/"igp_v32_p2b_native_p2b_71_action_context_union_summary_20261031.json"
          receipt={"schema":"igp.v32.71game.native-P2B-action-context-dedup.summary.v1",
              "QA_SHA256":hashlib.sha256(blob).hexdigest(),
              "source_QA_sha256":qa["source_SHA256"],
              "counts":qa["counts"],
              "per_game":{gid:x["counts"] for gid,x in qa["per_game"].items()},
              "physical_ball_custody_certified":0}
          out.mkdir(parents=True,exist_ok=True)
          if full.exists() and full.read_bytes()!=blob:raise ValueError("REFUSE_ORIGINAL_ACTION_UNION_QA_OVERWRITE")
          if summary.exists() and json.loads(summary.read_bytes())!=receipt:raise ValueError("REFUSE_ACTION_UNION_SUMMARY_OVERWRITE")
          full.write_bytes(blob)
          summary.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("IGP_P2B_ACTION_UNION_PRIVATE_QA_SHA",receipt["QA_SHA256"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_native_plus_p2b_all71_action_context_union_v1.json
          git add -f gamepulse/fusion/qa/igp_v32/igp_v32_p2b_native_p2b_71_action_context_union_summary_20261031.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m 'qa(igp): SHA original native and P2B 71game PBP action union'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_SOURCE_NATIVE_P2B_ACTION_CONTEXT_UNION_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
