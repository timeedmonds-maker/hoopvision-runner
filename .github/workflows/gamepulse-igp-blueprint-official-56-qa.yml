name: IGP original Blueprint versus official shot identity 56-game QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-blueprint-official-56-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CANONICAL: research/gamepulse-clock-boundary-integrity-20261025
      BLUEPRINT: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read two existing private branches and validate public runner
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$CANONICAL" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/canonical"
          git -C "$RUNNER_TEMP/canonical" sparse-checkout set gamepulse/fusion
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BLUEPRINT" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/blueprint"
          git -C "$RUNNER_TEMP/blueprint" sparse-checkout set data/extensions/nba_blueprint_2026_27/games
      - name: Join all original shot reports to official action/shooter and save QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canonical"
          python3 -m py_compile gamepulse/fusion/igp_blueprint_official_56_qa_20261029.py
          python3 gamepulse/fusion/igp_blueprint_official_56_qa_20261029.py \
            --official-root "$RUNNER_TEMP/canonical" --blueprint-root "$RUNNER_TEMP/blueprint" \
            --output gamepulse/fusion/qa/igp_progress_20261029/igp_blueprint_official_56_source_qa.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_blueprint_official_56_source_qa.json")
          d=json.loads(p.read_text())
          assert len(d["games"])==56 and d["original_blueprint_reports"]==56
          assert d["totals"]["published_xfg_shots"]>5000
          assert d["totals"]["exact_action_shooter_type_matches"]>5000
          assert d["physical_release_or_possession_boundaries_certified"]==0
          print("IGP_56_GAME_SHOT_SOURCE_QA_ACCEPTED",json.dumps(d["totals"],sort_keys=True))
          PY
      - name: Commit only source-hashed aggregate QA to canonical PR branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/canonical"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_blueprint_official_56_source_qa.json
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP_56_GAME_SHOT_QA_ALREADY_CURRENT; exit 0; fi
          git commit -q -m "qa(igp): measure 56-game original Blueprint shot official identity"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$CANONICAL"
            git rebase -q "origin/$CANONICAL"
            if git push -q origin "HEAD:refs/heads/$CANONICAL"; then echo IGP_PRIVATE_56_SHOT_QA_COMMITTED; exit 0; fi
            sleep "$n"
          done
          exit 23
