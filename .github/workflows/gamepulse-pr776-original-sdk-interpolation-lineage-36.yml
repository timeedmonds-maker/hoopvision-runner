name: PR776 36-game original NBA SDK upstream interpolation provenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-original-sdk-interpolation-lineage-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-original-sdk-interp-lineage-36
  cancel-in-progress: false
jobs:
  scan:
    name: SHA-verified private six-or-nine-game partition ${{ matrix.partition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        partition: [0,1,2,3]
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public boundary and private original-source access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH"             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free provenance tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_original_sdk_metadata_fidelity_2026.py             gamepulse/fusion/igp_original_sdk_metadata_fidelity_summary_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests             -p 'test_igp_original_sdk_metadata_fidelity_2026.py' -v
          python3 -m unittest discover -s gamepulse/fusion/tests             -p 'test_igp_original_sdk_metadata_fidelity_summary_2026.py' -v
      - name: Read the partition's 9 original games from accepted frozen cohort
        shell: bash
        env:
          PART: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          mapfile -t GAMES < <(python3 - "$PART" <<'PY'
          import json,sys
          j=json.load(open("gamepulse/fusion/materialized/igp_provisional_chain_tracking_interiors_36_v1/index.json"))
          games=sorted(j["games"])
          assert len(games)==36
          part=int(sys.argv[1])
          print("\n".join(g for i,g in enumerate(games) if i%4==part))
          PY
          )
          test "${#GAMES[@]}" -eq 9
          OUTBASE=gamepulse/fusion/qa/igp_progress_20261028/metadata_36
          mkdir -p "$OUTBASE"
          for GID in "${GAMES[@]}"; do
            OUT="$OUTBASE/igp_original_sdk_metadata_fidelity_${GID}_v1.json"
            test ! -e "$OUT"
            mkdir -p "$RUNNER_TEMP/sdk-$GID"
            gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release-$GID.json"
            gh release download "gamepulse-sdk-$GID" -R "$PRIVATE_REPO"               --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk-$GID"
            test "$(find "$RUNNER_TEMP/sdk-$GID" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
            python3 gamepulse/fusion/igp_original_sdk_metadata_fidelity_2026.py               --game-id "$GID" --archive-dir "$RUNNER_TEMP/sdk-$GID"               --release-json "$RUNNER_TEMP/release-$GID.json"               --index "gamepulse/fusion/materialized/igp_all_original_xyz/$GID/index.json"               --out "$OUT" > "$RUNNER_TEMP/private-metadata-$GID.log"
            python3 - "$OUT" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          n=a["native_timestamps_unique"]
          assert a["sha_verified_original_release"]
          assert a["native_timestamps_with_any_noninterpolated_false"]+a["native_timestamps_with_only_interpolated_true"]==n
          assert a["native_timestamps_with_any_interpolated_true"]==a["native_timestamps_with_only_interpolated_true"]+a["native_timestamps_with_both_interpolated_flags"]
          print("ORIGINAL_SDK_FLAG_COUNTS",a["game_id"],n,
            a["native_timestamps_with_only_interpolated_true"])
          PY
            rm -rf "$RUNNER_TEMP/sdk-$GID" "$RUNNER_TEMP/release-$GID.json" "$RUNNER_TEMP/private-metadata-$GID.log"
          done
      - name: Commit only the private metadata receipts for this partition
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          git config user.name "Game Pulse Free CPU Source QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261028/metadata_36
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git diff --cached --check
          git commit -qm "qa(gamepulse): original SDK interpolation-lineage 36-game partition"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_METADATA_PARTITION_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
  aggregate:
    name: Verify complete 36-game raw SDK original interpolation QA
    needs: [scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch private receipts and verify source-only reporting
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH"             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-only 36-game provenance summary (no XYZ output)
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_original_sdk_metadata_interpolation_36game_summary_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_original_sdk_metadata_fidelity_summary_2026.py             --root . --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          t=x["totals"]
          assert x["source_games"]==36 and t["original_unique_utc"]==1203986
          assert t["source_archives_verified"]==36*13
          assert t["native_only_interpolated_true"]+t["native_any_noninterpolated_false"]==1203986
          print("PR776_ORIGINAL_INTERPOLATED_36_ACCEPTED",json.dumps(t,sort_keys=True))
          PY
      - name: Commit private 36-game aggregate
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_original_sdk_metadata_interpolation_36game_summary_v1.json
          git config user.name "Game Pulse Free CPU Source QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): verify 36-game original SDK upstream interpolation lineage"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo ORIGINAL_36_GAME_METADATA_SUMMARY_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
