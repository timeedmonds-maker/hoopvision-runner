# Reviewed and explicitly permitted in tools/public_content_guard.py.
name: "IGP 54-game original companion clock/lineup held-out crosscheck"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gamepulse-igp-54game-clock-lineup-crosscheck.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-companion-clock-lineup-sha-qa
  cancel-in-progress: false
jobs:
  original-companion-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public boundary and fetch private canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Run source-free identity, stoppage and clock-reset regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_companion_clock_lineup_crosscheck_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_companion_clock_lineup_crosscheck_v1.py'
      - name: Validate all 54 immutable source event packages and official shot IDs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_companion_clock_lineup_crosscheck_v1.py --root . \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_companion_clock_lineup_crosscheck_54_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_companion_clock_lineup_crosscheck_54_v1.json")
          q=json.loads(p.read_text())
          a=q["aggregate"]
          assert q["games_with_original_companion"]==54
          assert q["original_events_conserved"]==78690
          assert a["Time#show"]==24873 and a["OnCourt#show"]==23257
          assert a["ShotDetails#show"]==9209
          assert a["clock_holdout_count"]>0
          assert a["clock_holdout_accepted"]>=0
          assert a["official_shooter_matched"]>0
          assert q["accuracy_vs_independent_video"]=="UNMEASURED"
          assert q["promoted_model_coordinates"]==0 and q["physical_possessions_certified"]==0
          print("IGP_54_REAL_SOURCE_CLOCK_LINEUP_QA_ACCEPTED",json.dumps({
            "games":54,"events":78690,
            "clock_holdouts":a["clock_holdout_count"],
            "piecewise_usable":a["clock_holdout_accepted"],
            "shot_official_identity_matches":a["official_shooter_matched"],
            "prior_oncourt_absent_shooter":a.get("official_shooter_absent_from_last_oncourt",0),
            "physically_certified_possessions":0},sort_keys=True))
          PY
      - name: Commit bounded QA only to canonical private branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_companion_clock_lineup_crosscheck_54_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): 54-game source-verified clock and lineup discrepancy receipts"
          for try in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_54_COMPANION_CLOCK_LINEUP_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$try"
          done
          exit 23
