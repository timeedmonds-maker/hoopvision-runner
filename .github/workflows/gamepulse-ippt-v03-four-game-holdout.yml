name: IPPT v03 halfcourt four untouched game gap holdout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-v03-four-game-holdout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/ippt-halfcourt-dual-track-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public privacy guard and authenticated original NBA private git clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
              "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse --is-inside-work-tree)" = true
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Four previously untested NBA original-source games for v03 tuned 7s bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json
          from igp_ippt_private_game_pilot_2026 import annotated_frames
          from igp_ippt_halfcourt_v2_mask_qa_2026 import run
          from igp_ippt_priority_bracket_challenger_2026 import PriorityBridgeTrajectories
          assert PriorityBridgeTrajectories([],max_prefer_bridge_ms=7000).max_prefer_bridge_ms==7000
          games=("0022600089","0022600098","0022600103","0022600107")
          print("IPPT_V03_FOUR_HELDOUT_SOURCE_GAMES_PREDECLARED",json.dumps(games))
          for gid in games:
              raw,g4,rosters,sha=annotated_frames(".",gid)
              for gap in (2000,5000,10000):
                  old=run(".",gid,raw,g4,rosters,windows=12,window_ms=gap,model_type="v02")
                  new=run(".",gid,raw,g4,rosters,windows=12,window_ms=gap,model_type="v03")
                  a=old["strata"]["formation_supported_v2"]
                  b=new["strata"]["formation_supported_v2"]
                  assert a["masked_original_xyz_total"]==b["masked_original_xyz_total"]
                  assert a["model"]["player"]["attempted"]==b["model"]["player"]["attempted"]
                  assert a["model"]["ball"]["attempted"]==b["model"]["ball"]["attempted"]
                  print("IPPT_V03_PREDECLARED_ORIGINAL_4GAME_HOLDOUT",gid,gap,json.dumps({
                      "original_masked_xyz":a["masked_original_xyz_total"],
                      "player_xy_p95_old_ft":a["model"]["player"]["p95_ft"],
                      "player_xy_p95_new_ft":b["model"]["player"]["p95_ft"],
                      "ball_xyz_p95_old_ft":a["model"]["ball"]["p95_ft"],
                      "ball_xyz_p95_new_ft":b["model"]["ball"]["p95_ft"],
                      "player_within_2ft_old":a["model"]["player"]["percentage_of_original_masked_with_prediction_within_2ft"],
                      "player_within_2ft_new":b["model"]["player"]["percentage_of_original_masked_with_prediction_within_2ft"],
                      "ball_within_5ft_old":a["model"]["ball"]["percentage_of_original_masked_with_prediction_within_5ft"],
                      "ball_within_5ft_new":b["model"]["ball"]["percentage_of_original_masked_with_prediction_within_5ft"],
                      "all_masked_original_xyz_absent_from_predictor":True},sort_keys=True))
          PY
