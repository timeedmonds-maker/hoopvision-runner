name: Opening-night NBA data preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opening-night-data-preflight.yml'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: Probe regular-season clips and xFG infrastructure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, requests
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          gid='0022600001'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          clip_headers={'User-Agent':ua,'Referer':'https://clips.nba.com/','Accept':'text/html,*/*'}
          xfg_headers={'User-Agent':ua,'Referer':'https://www.nba.com/','Origin':'https://www.nba.com','Accept':'application/json, text/plain, */*'}

          def clip(n):
              u=f'https://clips.nba.com/?gameNo={gid}&eventNum={n}&source=grs'
              rec={'event_num':n,'url':u}
              try:
                  s=requests.Session()
                  try:s.get('https://clips.nba.com/',headers=clip_headers,timeout=8)
                  except Exception:pass
                  r=s.get(u,headers=clip_headers,timeout=15)
                  rec['status']=r.status_code; rec['bytes']=len(r.content)
                  tm=re.search(r'<title>(.*?)</title>',r.text,re.I|re.S)
                  rec['title']=html.unescape(tm.group(1).strip()) if tm else ''
                  opts=[]
                  for m in re.finditer(r'<option\s+value=["\']([^"\']+)["\']([^>]*)>(.*?)</option>',r.text,re.I|re.S):
                      url=html.unescape(m.group(1)); label=re.sub(r'<[^>]+>','',html.unescape(m.group(3))).strip()
                      if '.m3u8' in url.lower():
                          opts.append(label or 'unlabelled')
                  rec['angle_labels']=opts
                  rec['angle_count']=len(opts)
              except Exception as e:rec['error']=repr(e)
              return rec

          clips=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
              futs=[ex.submit(clip,n) for n in range(1,21)]
              for f in as_completed(futs): clips.append(f.result())
          clips.sort(key=lambda x:x['event_num'])

          xfg=[]
          # Jayson Tatum and Cade Cunningham
          for name,pid in [('Jayson Tatum',1628369),('Cade Cunningham',1630595)]:
              rec={'player':name,'player_id':pid}
              try:
                  r=requests.get('https://stats.gleague.nba.com/stats/shotqualityvideologs',
                                 params={'GameID':gid,'PlayerID':pid},headers=xfg_headers,timeout=(8,45))
                  rec['status']=r.status_code; rec['bytes']=len(r.content)
                  j=r.json()
                  rec['response_game_id']=str(j.get('gameId') or '').zfill(10)
                  rec['shot_count']=len(j.get('shotList') or [])
                  rec['keys']=sorted(j.keys())
              except Exception as e:rec['error']=repr(e)
              xfg.append(rec)

          result={
              'game_id':gid,
              'phase':'2026-27 Regular Season',
              'clip_pages_http_200':sum(1 for r in clips if r.get('status')==200),
              'clip_pages_with_hls':sum(1 for r in clips if r.get('angle_count',0)>0),
              'distinct_angle_labels':sorted({a for r in clips for a in r.get('angle_labels',[])}),
              'clip_pages':clips,
              'xfg':xfg,
          }
          out=Path('experiment_results/opening_night_preflight')
          out.mkdir(parents=True,exist_ok=True)
          (out/'latest.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hoopvision-public-probe
          git config user.email hoopvision-public-probe@users.noreply.github.com
          git add experiment_results/opening_night_preflight/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record opening-night data preflight [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
