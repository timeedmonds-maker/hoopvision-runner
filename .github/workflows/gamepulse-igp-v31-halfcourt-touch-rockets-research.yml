name: IGP v3.1 halfcourt paint touch Rockets research readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v31-halfcourt-touch-rockets-research.yml', 'tools/public_content_guard.py']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v31-halfcourt-rockets-research
  cancel-in-progress: false
jobs:
  independent-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v31-halfcourt-touch-sequence-query-20261031
      PINNED_PRIVATE_SHA: 6224b818b53d70659e92825d7558d60f65a96de7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public data guard and private pin
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free tests of new contact location chronology and outcomes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p test_igp_halfcourt_touch_query_v1.py
      - name: Real NBA Rockets native v3.1 source candidate readback (PRIVATE)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          # Original XYZ, touch timelines and full report stay inside private workspace.
          if ! python3 gamepulse/fusion/igp_halfcourt_touch_query_v1.py \
                  --root . --games all-team --team HOU --zone paint \
                  --output "$RUNNER_TEMP/rockets-halfcourt-private.json" \
                  >"$RUNNER_TEMP/rockets-halfcourt-private.log" 2>&1; then
            python3 - <<'PY'
          from pathlib import Path
          import os,re
          x=(Path(os.environ['RUNNER_TEMP'])/'rockets-halfcourt-private.log').read_text(errors='replace')
          last=next((v for v in reversed(x.splitlines()) if v.strip()),'EMPTY')
          print('IGP_HALFCOURT_PRIVATE_SOURCE_READBACK_ERROR_CLASS',re.sub('[^A-Za-z_]','_',last)[-85:])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'rockets-halfcourt-private.json').read_text())
          assert r['engine']=='igp-fusion-v3.1-research'
          assert len(r['games'])>=2 and r['certified_physical_possessions']==0
          assert all(x['physical_touch_and_possession_certified'] is False for x in r['player_results'])
          assert len(r['player_results'])>=5
          assert {'0022600091','0022600009'}<=set(r['source_qa_by_game'])
          print('IGP_V31_ROCKETS_RESEARCH_SOURCE_GATES',json.dumps({
            'games':len(r['games']),
            'candidate_rows':len(r['matched_possessions']),
            'players':len(r['player_results']),
            'physical_possessions_certified':0,
            'source_frames':sum(x['source_frames'] for x in r['source_qa_by_game'].values()),
            'unknown_attack_end_samples':sum(x['counts'].get('unknown_attack_end_samples',0) for x in r['source_qa_by_game'].values()),
            'deadball_exclusions':sum(x['counts'].get('whistle_or_administrative_risk_excluded',0) for x in r['source_qa_by_game'].values())
          },sort_keys=True))
          PY
      - name: Write private-only exploratory Rockets result, never public XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          payload=(Path(os.environ['RUNNER_TEMP'])/'rockets-halfcourt-private.json').read_bytes()
          if len(payload)>950000:raise ValueError('RESEARCH_OUTPUT_TOO_LARGE_FOR_CONTENTS_API')
          endpoint='repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/igp_v31_rockets_halfcourt_paint_touch_research_v1.json'
          branch=os.environ['BRANCH']
          old=subprocess.run(['gh','api',endpoint+'?ref='+branch],capture_output=True,text=True)
          body={'branch':branch,'message':'research(igp): Rockets original-source halfcourt paint touch candidate QA',
                'content':base64.b64encode(payload).decode()}
          if old.returncode==0:body['sha']=json.loads(old.stdout)['sha']
          done=subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],input=json.dumps(body),capture_output=True,text=True)
          if done.returncode:raise RuntimeError('PRIVATE_RESEARCH_RESULT_PUBLISH_FAILED')
          print('IGP_HALFCOURT_ROCKETS_PRIVATE_RESEARCH_QA_SAVED')
          PY