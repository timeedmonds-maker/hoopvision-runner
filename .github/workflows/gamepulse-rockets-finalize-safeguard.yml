name: Game Pulse Rockets private full-game finalization safeguard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-rockets-finalize-safeguard.yml'
  pull_request:
    paths:
      - '.github/workflows/gamepulse-rockets-finalize-safeguard.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: gamepulse-rockets-spurs-original-0022600009-finalizer
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/licensed_feed/season_core.test.mjs tools/licensed_feed/sdk_slot.test.mjs
  capture-remaining:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: [12]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licensed SDK with lifecycle scripts disabled
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Ensure SDK source window is fully matured
        shell: bash
        run: |
          node -e 'const remaining=Date.parse("2026-10-24T06:40:00Z")-Date.now(); if(remaining>0) { console.log("SOURCE_WINDOW_MATURITY_WAIT"); setTimeout(()=>{},remaining); }'
      - name: Resume exact private checkpoint and verify SHA readback
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FANOUT: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600009'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-24T01:30:00Z'
          GAMEPULSE_PRIORITY_PART: ${{ matrix.part }}
        run: node season_private_release.mjs
  finalize:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.preflight.result == 'success'
    needs: [preflight, capture-remaining]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licensed SDK with lifecycle scripts disabled
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Resume any outstanding part; require 3720 observed five-second windows and private completion marker
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_PRIORITY_FINALIZE: 'true'
          GAMEPULSE_FINAL_FASTLANE: 'true'
          GAMEPULSE_PRIORITY_ID: '0022600009'
          GAMEPULSE_PRIORITY_TIPOFF: '2026-10-24T01:30:00Z'
        run: node season_private_release.mjs
