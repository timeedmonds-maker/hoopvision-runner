name: PR776 eight newer original SDK lineup episode QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-new-eight-original-qa.yml'
permissions:
  contents: read
concurrency:
  group: pr776-new-eight-original-qa
  cancel-in-progress: false
jobs:
  original-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game_id: ['0022600104','0022600105','0022600106','0022600107',
                  '0022600108','0022600109','0022600110','0022600111']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GID: ${{ matrix.game_id }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and read active private original source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-original" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-original"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-original" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/canonical"
          git -C "$RUNNER_TEMP/canonical" sparse-checkout set gamepulse/fusion
          echo "ROOT=$RUNNER_TEMP/canonical" >> "$GITHUB_ENV"
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Skip accepted QA or fail visibly on REST deferral
        id: eligible
        shell: bash
        run: |
          set -euo pipefail
          QA="$ROOT/gamepulse/fusion/qa/official_native_episode_xyz_bridge_${GID}_20261026.json"
          if [ -f "$QA" ] && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['game_id']==sys.argv[2] and d['physical_possessions_certified']==0 and d['original_coordinates_exported'] is False and d['counts']['original_unique_frames']>1000" "$QA" "$GID"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo ALREADY_ACCEPTED_ORIGINAL_NATIVE_QA
          elif [ "$(gh api rate_limit --jq '.resources.core.remaining' || echo 0)" -lt 150 ]; then
            echo REST_QUOTA_DEFERRED_NOT_ACCEPTED >&2
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download and verify the 13 original SDK archive parts
        if: steps.eligible.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          gh api "repos/$PRIVATE/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release.json"
          gh release download "gamepulse-sdk-$GID" -R "$PRIVATE" --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk"
          test "$(find "$RUNNER_TEMP/sdk" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
      - name: Accept original native clock and official lineup episode QA
        if: steps.eligible.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          OUT="gamepulse/fusion/qa/official_native_episode_xyz_bridge_${GID}_20261026.json"
          PYTHONPATH=gamepulse/fusion python3 gamepulse/fusion/provisional_official_lineup_native_xyz_2026.py \
            --game-id "$GID" \
            --official-lineup "gamepulse/fusion/official_lineup_clock/games/$GID.json" \
            --auto-qa "gamepulse/fusion/qa/auto_physics/${GID:0:8}/$GID.json" \
            --release-json "$RUNNER_TEMP/release.json" --archive-dir "$RUNNER_TEMP/sdk" \
            --episode-view "gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/$GID.json" \
            --out "$OUT"
          python3 - "$OUT" "$GID" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); c=d['counts']
          assert d['game_id']==sys.argv[2]
          assert d['physical_possessions_certified']==0
          assert d['original_coordinates_exported'] is False
          assert d['clock_error_independently_certified'] is False
          assert c['original_unique_frames']>1000
          assert d['nba_field_episodes_considered']>100
          print('EIGHT_NEW_GAME_SOURCE_QA',json.dumps({
              'game_id':d['game_id'],'original_frames':c['original_unique_frames'],
              'qualified_episodes':len(d['source_episode_tracking_qa']),
              'candidate_frames':c.get('nba_field_PROVISIONAL_UNIQUE_NBA_SOURCE_FIELD_EPISODE',0),
              'complete_ten_plus_ball':c.get('full_official_ten_plus_ball_frames',0)
          },sort_keys=True))
          PY
      - name: Commit original-source aggregate QA only to private PR
        if: steps.eligible.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add "gamepulse/fusion/qa/official_native_episode_xyz_bridge_${GID}_20261026.json"
          git diff --cached --check
          git commit -qm "data(gamepulse): original lineup episode QA for newer game $GID"
          for attempt in 1 2 3 4 5; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo PRIVATE_ORIGINAL_NATIVE_QA_ACCEPTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
