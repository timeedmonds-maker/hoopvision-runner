name: PR776 G2 original NBA pre/post-sub roster source XYZ 36-game query QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-substitution-actor-query-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G2-opposite-NBA-roster-original-readbacks-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public content boundary and private NBA original source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free original NBA SDK and official alternative roster identity tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_g2_original_sdk_actor_dispute_source_query_2026.py \
            gamepulse/fusion/igp_g2_original_sdk_actor_dispute_query_acceptance_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_original_sdk_actor_dispute_source_query_2026.py' -v
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_substitution_source_actor_discrepancy_2026.py' -v
          echo G2_ALTERNATIVE_NBA_PRE_POST_ROSTER_QUERY_UNIT_PASS
      - name: All36 original NBA source XYZ and player+ball G1 SHA readback with G2 pre/post NBA roster evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_original_actor_dispute_P0_G1_query_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_original_sdk_actor_dispute_query_acceptance_2026.py \
             --root . --out "$OUT" > "$RUNNER_TEMP/private-G2-P0-G1-source-actor-readback.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          x=r["tested"]
          assert r["source_games"]==36
          assert x["original_games_tested"]==36
          assert x["P0_G1_G2_original_coordinate_equality_readback"]>=36
          assert x["EXACT_TEN_OPPOSITE_OFFICIAL_SUBSTITUTION_SIDE"]>=1
          assert r["original_NBA_SDK_XYZ_accepted_and_unchanged"]
          assert r["original_G1_selected_actor_keyframe_sha_verified"]
          assert r["NBA_current_roster_never_overridden"]
          assert r["original_player_ids_and_XYZ_private_not_in_report"]
          assert not r["physical_possession_boundaries_not_claimed"] is False
          print("PR776_G2_ALL36_ORIGINAL_NBA_SOURCE_SDK_OPPOSITE_SUBSTITUTION_ROSTER_QUERY_PASS",
             json.dumps(x,sort_keys=True))
          PY
      - name: Publish only private accepted source G1+G2 actor-lineage query QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_original_actor_dispute_P0_G1_query_36_v1.json
          git config user.name "Game Pulse Private Original NBA Query QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): 36-game original SDK XYZ/G1 SHA source query with alternative official pre-post substitution roster evidence"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo G2_ORIGINAL_NBA_SUBSTITUTION_SOURCE_ACTOR_QUERY_SHA_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
