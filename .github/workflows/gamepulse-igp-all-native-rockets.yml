name: IGP full source XYZ Rockets private extract
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-all-native-rockets.yml']
permissions: {contents: read}
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
      GID: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Clone private originals and verify source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) echo x-access-token;;
            *Password*) echo "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Synthetic originals SHA and search regressions
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -s gamepulse/fusion/tests -v -p 'test_igp_extract_all_original_sdk_xyz_2026.py'
      - name: Download authenticated 13-part original SDK release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          gh api "repos/$R/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release.json"
          gh release download "gamepulse-sdk-$GID" -R "$R" --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/sdk"
          test "$(find "$RUNNER_TEMP/sdk" -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          echo PRIVATE_SOURCE_ALL_THIRTEEN_SHA_PARTS_PRESENT
      - name: Extract and verify full source native timestamp archive
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT="gamepulse/fusion/materialized/igp_all_original_xyz/$GID"
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_extract_all_original_sdk_xyz_2026.py --game-id "$GID" --archive-dir "$RUNNER_TEMP/sdk" --release-manifest "$RUNNER_TEMP/release.json" --window-source "gamepulse/fusion/materialized/native_episode_windows_v2_pr776_20261026/games/$GID.json" --out-dir "$OUT"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          from query_igp_all_original_sdk_xyz_2026 import query
          from pathlib import Path
          q=query(Path("."),"0022600009",limit=3,verify_all=True)
          assert q["matched_original_timestamps"]==34979
          assert q["physical_possessions_certified"]==0
          print("IGP_FULL_GAME_ORIGINAL_XYZ_SHA_READBACK",q["matched_original_timestamps"],q["verified_private_source_chunks"])
          PY
      - name: Publish source SHA checked private partitions only
        if: success()
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "gamepulse/fusion/materialized/igp_all_original_xyz/$GID"
          test "$(git diff --cached --name-only | wc -l)" -gt 2
          git commit -q -m "data(igp): preserve all Rockets original SDK native XYZ timestamps"
          git fetch -q origin "$B"
          git rebase "origin/$B"
          git push -q origin "HEAD:refs/heads/$B"
          echo IGP_FULL_GAME_NATIVE_XYZ_PRIVATE_GIT_PUBLISHED
