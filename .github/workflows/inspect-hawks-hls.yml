name: Inspect Fresh Hawks HLS Variants
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-hawks-hls.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: List Play by Play HLS resolutions
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          from urllib.parse import urljoin,urlsplit,urlunsplit
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          H={'User-Agent':UA,'Referer':'https://clips.nba.com/'}
          page='https://clips.nba.com/?gameNo=0012500014&eventNum=301&source=grs'
          with urllib.request.urlopen(urllib.request.Request(page,headers=H),timeout=20) as r:
            txt=r.read().decode('utf-8','ignore')
          hls=None
          for m in re.finditer(r'<option\s+value="([^"]+)"([^>]*)>(.*?)</option>',txt,re.I|re.S):
            u=html.unescape(m.group(1).strip())
            label=re.sub(r'<[^>]+>','',html.unescape(m.group(3))).strip()
            if '.m3u8' in u and label=='Play by Play':
              hls=u
          if not hls: raise SystemExit('Play by Play HLS missing')
          with urllib.request.urlopen(urllib.request.Request(hls,headers=H),timeout=20) as r:
            master=r.read().decode('utf-8','ignore')
          print('MASTER',hls)
          for line in master.splitlines():
            if line.startswith('#EXT-X-STREAM-INF'):
              print(line)
          PY
