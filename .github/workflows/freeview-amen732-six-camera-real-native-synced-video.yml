# Real NBA original six cameras: all media and generated UHD source montage stay PRIVATE.
name: Amen732 all six original NBA videos aligned and UHD action review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-six-camera-real-native-synced-video.yml']
permissions:
  contents: read
concurrency:
  group: amen732-six-source-mp4s-sha-verified-4k-contact-montage
  cancel-in-progress: false
jobs:
  aligned_video:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce strict source no-public-media policy
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/amen732_sixview_audio_alignment_v2.py tools/amen732_sixview_synchronous_video_review_v1.py
      - name: Get exact native PTS and six-source audio QA runtime
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check 'numpy<2' 'scipy>=1.11,<1.15' 'opencv-python-headless==4.10.0.84'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          echo SIX_CAMERA_MOVIE_REVIEW_ENVIRONMENT_READY
      - name: Acquire six official source MP4s with input SHA provenance
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-real-sixmovie"
          mkdir -p "$ROOT/native" "$ROOT/output"
          python3 tools/amen732_official_sixvideo_acquire.py \
            --root "$ROOT/native" --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)"
          test "$(find "$ROOT/native" -maxdepth 1 -name '0022600009-e732-*.mp4' | wc -l)" = 6
      - name: Align all six original videos by 15 observed audio pairs and render UHD native clip
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-real-sixmovie"
          python3 tools/amen732_sixview_audio_alignment_v2.py \
            --source "$ROOT/native" --out "$ROOT/audio_qa.json" \
            --ffmpeg "$(command -v ffmpeg)" --broadcast-seed 12.39
          python3 tools/amen732_sixview_synchronous_video_review_v1.py \
            --source "$ROOT/native" --audio "$ROOT/audio_qa.json" \
            --out "$ROOT/output" --ffmpeg "$(command -v ffmpeg)" \
            --begin 11.6 --end 13.7 --fps 15
          python3 - "$ROOT/output" <<'PY'
          import json,sys,subprocess
          from pathlib import Path
          root=Path(sys.argv[1])
          q=json.load(open(root/'amen732-sixcam-native-synced-source-video-qa.json'))
          assert len(q['sources'])==6 and q['pairwise_audio_edges']==15
          assert q['frames']>=30 and len(list(root.glob('*.jpg')))==5
          assert not q['novel_viewpoint_reconstructed']
          v=root/q['video_3840x2160']
          s=subprocess.run(['ffprobe','-v','error','-show_entries',
            'stream=width,height,codec_name,nb_frames','-of','json',str(v)],
            capture_output=True,text=True,check=True)
          data=json.loads(s.stdout)
          video=[x for x in data['streams'] if x['codec_name']=='h264'][0]
          assert (video['width'],video['height'])==(3840,2160)
          print('SIX_REAL_CAMERA_SOURCE_VIDEO_UHD_DECODABLE',v.stat().st_size,
            'native_frame_alignment',q['pairwise_audio_edges'])
          PY
      - name: Publish review video and QA only in PRIVATE repository 104, SHA-verifiable
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo PRIVATE_SOURCE_OUTPUT_CANNOT_PUBLISH; exit 3; }
          ROOT="$RUNNER_TEMP/amen732-real-sixmovie"
          TAG=freeview-amen732-six-camera-real-contact-crosswalk-v2-20261029
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title "Amen-Wemby real block six original cameras +90 frame crosswalk UHD" \
              --notes "Unaltered six native videos sampled by measured audio delays; 3840x2160 mosaic. Different file SHAs, but 12 independently matched original frames prove fresh clip index = archive index +90 for all six cameras. Contact and same exposure unverified; not Freeview 3D." \
              --latest=false >/dev/null
          fi
          gh release upload "$TAG" "$ROOT/output/"*.jpg \
            "$ROOT/output/amen732-all-six-original-camera-video-synchronized-3840x2160.mp4" \
            "$ROOT/output/amen732-sixcam-native-synced-source-video-qa.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/receipt.json"
          python3 - "$ROOT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);o=p/'output'
          items=list(o.glob('*.jpg'))+[o/'amen732-all-six-original-camera-video-synchronized-3840x2160.mp4',o/'amen732-sixcam-native-synced-source-video-qa.json']
          a={x['name']:x for x in json.load(open(p/'receipt.json'))['assets']}
          assert len(items)==7
          for item in items:
              assert a[item.name]['digest']=='sha256:'+hashlib.sha256(item.read_bytes()).hexdigest(),item.name
          print('SIX_ORIGINAL_SOURCE_VIDEO_PRIVATE_ASSETS_SHA_VERIFIED',len(items))
          PY

# Re-evaluate executable script after source-video assembler syntax correction.

# Source-only 11.6–13.7s block replay, rerun after verified public content policy fix.
