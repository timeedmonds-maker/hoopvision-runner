name: Jabari ringed MP4 QA and direct media artifact
on:
  workflow_run:
    workflows: ["Jabari616 source-observed frozen 1.3 team and green ring video"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-export:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify QA-scoped video publication only
        shell: bash
        run: |
          python3 - <<'PY'
          from tools.public_content_guard import scan
          path='.github/workflows/nba-jabari616-ring-export-to-chat.yml'
          assert not scan([path]),'public bridge changed'
          print('RINGED_MP4_MEDIA_SCOPE_OK')
          PY
      - name: Copy source-verified exported video only when ring modes both appear
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 3
          ROOT="$RUNNER_TEMP/jabari-ring-export"
          mkdir -p "$ROOT"
          gh release download clip-lab-jabari616-frozen-target-pilot --repo timeedmonds-maker/104 --dir "$ROOT" --clobber
          export QA_DIR="$ROOT"
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,subprocess,base64
          root=Path(os.environ['QA_DIR'])
          v=root/'jabari616-constant-target-frozen-v13.mp4'
          q=root/'processing-qa.json'
          if not (v.exists() and q.exists()):raise RuntimeError('NO_REAL_RINGED_VIDEO')
          qa=json.loads(q.read_text())
          checks={
           'target_only':qa.get('target_player_id')==1631095 and set(qa.get('ring_by_native_player_id',{}))<= {'1631095'},
           'frozen_engine':qa.get('frozen_renderer_git_blob_sha')=='9fac8a8915b90bbd9bd1235532c297c35da77ca2',
           'original_renderer':qa.get('original_renderer_id')=='HOOPVISION_1_3_RINGS',
           'both_ring_styles':qa.get('style_green_frames',0)>0 and qa.get('style_team_pulse_frames',0)>0,
           'rendered_frames':qa.get('rendered_ring_frames',0)>=30,
           'sha_video':hashlib.sha256(v.read_bytes()).hexdigest()==qa.get('output_sha256'),
           'mode_counts':qa.get('style_green_frames',0)+qa.get('style_team_pulse_frames',0)==qa.get('rendered_ring_frames')
          }
          raw=json.dumps({'result':checks,'qa':qa},indent=2).encode()
          target='repos/timeedmonds-maker/104/contents/gamepulse/status/jabari_616_constant_frozen_render_qa.json'
          prior=subprocess.run(['gh','api',target],capture_output=True,text=True)
          payload={'message':'qa: captured authentic frozen ring clip style and video export evidence',
                   'branch':'main','content':base64.b64encode(raw).decode()}
          if prior.returncode==0:payload['sha']=json.loads(prior.stdout)['sha']
          p=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],
                    input=json.dumps(payload),capture_output=True,text=True)
          if p.returncode:raise RuntimeError('PRIVATE_QA_SAVE_FAILED')
          # Retain QA record even on failure; never put invalid ring media in public artifact.
          if not all(checks.values()):
            print('JABARI_FROZEN_RING_STYLE_VIDEO_QA_FAIL',json.dumps(checks))
            raise RuntimeError('UNVALIDATED_RING_VIDEO_CANNOT_SHIP')
          print('JABARI_FROZEN_RING_STYLE_VIDEO_QA_PASS')
          PY
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -of json "$ROOT/jabari616-constant-target-frozen-v13.mp4"
          cp "$ROOT/jabari616-constant-target-frozen-v13.mp4" "$GITHUB_WORKSPACE/jabari616-original-frozen-ring-overlay.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: jabari616-frozen-v13-video-for-chat
          path: jabari616-original-frozen-ring-overlay.mp4
          retention-days: 7
          if-no-files-found: error
