name: IPPT all36 SHA source modelB tracking partial and complete graded tiers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-model-b-native-graded-tiers-all36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  source-tier-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/ippt-event-snapshots-separate-20261028
      CODE_SHA: c96f193358a114413d6973333c8e58da2d8d2242
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Exact SHA original private NBA tracking and confidentiality checks
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$CODE_SHA"
          echo "PRIV=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Original NBA full36 G4 source plus G3 plus ModelB player/ball tracking 6 8 9 10 grades
        run: |
          set -euo pipefail
          cd "$PRIV"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_native_model_b_usable_tiers_2026.py
          python3 gamepulse/fusion/igp_ippt_native_model_b_usable_tiers_2026.py \
            --root . --out gamepulse/fusion/qa/igp_progress_20261028/ippt_native_model_b_tiered_all36_v1.json > "$RUNNER_TEMP/private-tier-result.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261028/ippt_native_model_b_tiered_all36_v1.json")
          x=json.loads(p.read_text());c=x["counts"]
          assert x["source_games"]==36 and c["native_source_frames"]==1203986
          assert c["G4_chain_second_buckets"]==271088
          assert c["chain_seconds_10_identified_players_plus_ball"]==130316
          assert c["chain_seconds_8_identified_players_plus_ball"]>=130316
          assert c["chain_seconds_any_direct_actor_and_direct_ball"]>=130316
          summary={"source_games":36,"aggregate_only":c,
                   "physical_possessions_certified":False}
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(json.dumps(summary,sort_keys=True,indent=2))
          print("IPPT_G4_ALL36_TIERED_TRACKING_SOURCE_MODEL_B_PASS",json.dumps(c,sort_keys=True))
          PY
      - name: Commit private SHA tiered source tracking acceptance QA
        run: |
          set -euo pipefail
          cd "$PRIV"
          git config user.name "Original NBA Native Source Coverage QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261028/ippt_native_model_b_tiered_all36_v1.json
          git diff --cached --check
          git commit -qm "qa(ippt): original NBA source plus B partial 6 8 9 10 actor and ball full36 evidence"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IPPT_PRIVATE_SOURCE_TIERED_36_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
      - name: Safe aggregate public receipt and erase private original NBA XYZ
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"]);p=root/"safe.json"
          d=json.loads(p.read_text()) if p.exists() else {"status":os.environ["STATE"]}
          d.update({"run_id":os.environ["GITHUB_RUN_ID"],"code_sha":os.environ["CODE_SHA"]})
          (root/"receipt.md").write_text("Private original NBA full native 6/8/9/10 player tracking and ball grades. Counts only, no original actor XYZ or individual UTC.\n\n~~~json\n"+json.dumps(d,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/receipt.md"
# Per-event NBA source coordinates and player identifiers remain private.
