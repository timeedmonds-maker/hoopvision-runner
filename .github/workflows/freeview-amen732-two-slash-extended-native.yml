name: Amen 732 longer original two-camera ball track
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-two-slash-extended-native.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: amen732-two-slash-original-native-long
  cancel-in-progress: false
jobs:
  source-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public policy, private source via git
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo AMEN732_EXTENDED_SOURCE_PRIVATE_GIT_READ_PASS
      - name: Retrieve only two existing original native clips (no recapture)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          cd "$RUNNER_TEMP/native"
          # Check core quota first; public CPU does not hammer rate-limited API.
          REMAINING="$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo unknown)"
          echo "AMEN732_RELEASE_SOURCE_API_REMAINING=$REMAINING"
          TAG="freeview-native-0022600009-732"
          for VIEW in left-slash right-slash; do
            NAME="0022600009-e732-$VIEW.mp4"
            # Prefer existing release URL with authenticated direct binary transfer,
            # which avoids release-list metadata when supported by GitHub.
            if ! curl --silent --show-error --fail --location --retry 1 \
              --connect-timeout 20 --max-time 120 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "$NAME" \
              "https://github.com/$PRIVATE/releases/download/$TAG/$NAME"; then
              rm -f "$NAME"
              if [ "$REMAINING" != unknown ] && [ "$REMAINING" -lt 8 ]; then
                echo AMEN732_SOURCE_PRIVATE_RATE_LIMIT_BLOCKED
                exit 43
              fi
              gh release download "$TAG" -R "$PRIVATE" --pattern "$NAME" --dir "$PWD"
            fi
            test -s "$NAME"
          done
          test "$(sha256sum 0022600009-e732-left-slash.mp4 | cut -d' ' -f1)" = 0bd95fd378f1b56037351e9a341799f20217f1756054bc2a59e10cd7ad7ed616
          test "$(sha256sum 0022600009-e732-right-slash.mp4 | cut -d' ' -f1)" = 690f41b52c5d11e46d3c1ba539556537fdbe8877353ad75e9b8a6c8e7ab03a2f
          echo AMEN732_TWO_SHA_VERIFIED_PRIVATE_ORIGINAL_VIDEOS
      - name: Native 30fps source colour/optical ball validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            numpy==1.26.4 opencv-python-headless==4.10.0.84
          cd "$RUNNER_TEMP/source"
          python3 hoopvision/freeview/amen732_two_slash_long_span_original_rgb.py --selftest
          python3 hoopvision/freeview/amen732_two_slash_long_span_original_rgb.py \
            --video-dir "$RUNNER_TEMP/native" \
            --sam hoopvision/freeview/fixtures/amen732_23source_sam21_ball_masks_20261026.json \
            --out hoopvision/freeview/fixtures/amen732_two_slash_original_native_long_track_20261026.json
          python3 - <<'PY'
          import json
          p='hoopvision/freeview/fixtures/amen732_two_slash_original_native_long_track_20261026.json'
          j=json.load(open(p))
          assert len(j['views'])==2
          assert not j['same_instant_cross_camera_verified']
          assert not j['first_touch_verified']
          print('AMEN732_SOURCE_LONG_TRACK_PRIVATE_AGGREGATES', {
            n:(v['source_tracker_accepted_outside_existing_SAM_frames'],v['comparison_within_7_native_pixels'],v['comparison_count'])
            for n,v in j['views'].items()})
          PY
      - name: Strict same-frame holdout using original longer track
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          export PYTHONPATH="$PWD/hoopvision/freeview"
          python3 -m pip install --quiet --disable-pip-version-check scipy==1.14.1
          python3 hoopvision/freeview/amen732_original_left_long_xyz_holdout.py --selftest
          python3 hoopvision/freeview/amen732_original_left_long_xyz_holdout.py \
            --source hoopvision/freeview/fixtures/amen732_original_recapture_43_three_actor_xyz_20261026.json \
            --sam hoopvision/freeview/fixtures/amen732_23source_sam21_ball_masks_20261026.json \
            --long hoopvision/freeview/fixtures/amen732_two_slash_original_native_long_track_20261026.json \
            --video "$RUNNER_TEMP/native/0022600009-e732-left-slash.mp4" \
            --out hoopvision/freeview/fixtures/amen732_left_slash_long_RGB_SDK_camera_holdout_20261026.json
          python3 - <<'PY'
          import json
          j=json.load(open('hoopvision/freeview/fixtures/amen732_left_slash_long_RGB_SDK_camera_holdout_20261026.json'))
          assert j["actual_original_native_ffprobe_PTS_validated_against_frozen_SAM"]
          assert j["additional_long_RGB_native_source_frames"]>=7
          assert len(j["heldout"])==2
          assert not j["camera_metric_calibration_certified"]
          print("AMEN732_LONG_RGB_NATIVE_CAMERA_HOLDOUT_PRIVATE_AGGREGATES",
                j["additional_long_RGB_native_source_frames"],
                j["mean_prior_pixel_error_px"],j["mean_long_pixel_error_px"])
          PY
      - name: Store original RGB candidate evidence only privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          git config user.name 'HoopVision native source CPU'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_two_slash_original_native_long_track_20261026.json \
            hoopvision/freeview/fixtures/amen732_left_slash_long_RGB_SDK_camera_holdout_20261026.json
          git diff --cached --check
          git commit -qm 'qa(freeview): SHA source RGB longer Amen ball trajectories with source uncertainty gates'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_LONG_RGB_TWO_CAMERAS_PRIVATE_QA_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
