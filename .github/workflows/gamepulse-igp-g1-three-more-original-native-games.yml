name: IGP G1 original NBA source actor upstream keyframe provenance three additional games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g1-three-more-original-native-games.yml']
permissions: {contents: read}
concurrency:
  group: igp-g1-original-three-more-native-actor-provenance
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: a8c67900c176f315cdb97b913c2ff92938630214
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and exact SHA checkout of original native NBA research sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free regressions and three untouched original NBA raw actor source readbacks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g1_original_actor_upstream_generalized_13part_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g1_original_actor_upstream_interp_0001_v1.py'
          mkdir -p "$RUNNER_TEMP/G1Q"
          for gid in 0022600002 0022600003 0022600004; do
            mkdir -p "$RUNNER_TEMP/G1-$gid"
            gh api "repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-$gid" > "$RUNNER_TEMP/G1Q/release-$gid.json"
            gh release download "gamepulse-sdk-$gid" --repo timeedmonds-maker/104 --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/G1-$gid"
            if ! python3 gamepulse/fusion/igp_fusion_g1_original_actor_upstream_generalized_13part_v1.py \
                 --root . --game-id "$gid" --archive-dir "$RUNNER_TEMP/G1-$gid" \
                 --release-json "$RUNNER_TEMP/G1Q/release-$gid.json" \
                 --sidecar "$RUNNER_TEMP/G1Q/upstream-$gid.jsonl.gz" \
                 --out "$RUNNER_TEMP/G1Q/qa-$gid.json" > "$RUNNER_TEMP/G1Q/qa-$gid.log" 2>&1; then
              echo IGP_G1_ORIGINAL_SELECTED_ACTOR_SOURCE_GAME_FAILED
              python3 - "$gid" <<'PY'
          import os,sys,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/('G1Q/qa-'+sys.argv[1]+'.log')).read_text(errors='replace').splitlines()
          last=next((z for z in reversed(lines) if z.strip()),'NO_LOG')
          print('IGP_G1_RAW_SOURCE_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:70])
          PY
              exit 41
            fi
          done
          python3 - <<'PY'
          import json,os,hashlib,gzip
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'G1Q'
          results={}
          for gid in ('0022600002','0022600003','0022600004'):
              q=json.loads((root/('qa-'+gid+'.json')).read_text())
              raw=(root/('upstream-'+gid+'.jsonl.gz')).read_bytes()
              assert q['game_id']==gid and q['counts']['source_original_archive_parts_SHA_verified']==13
              assert q['sidecar_sha256']==hashlib.sha256(raw).hexdigest()
              assert len(gzip.decompress(raw).splitlines())==q['counts']['source_native_timestamps']
              assert q['source_native_original_actor_per_timestamp_and_coordinate_value_matched_share']>=.95
              assert not q['source_native_original_actor_upstream_interpolated_False_is_independent_physical_truth']
              assert q['newly_accepted_original_or_inferred_positions']==0
              results[gid]={'native':q['counts']['source_native_timestamps'],
               'selected_original_actor_slots':q['counts']['selected_original_actor_XYZ_records'],
               'exact_source_keyframe_XYZ_matched':q['counts']['selected_original_actor_exact_raw_keyframe_XYZ_matches'],
               'upstream_true_selected_slots':q['counts'].get('selected_original_actor_grade_SDK_UPSTREAM_INTERPOLATED_TRUE',0),
               'new_physical_certifications':0}
          print('IGP_G1_ORIGINAL_THREE_MORE_NBA_ACTOR_SOURCE_QA',json.dumps(results,sort_keys=True))
          PY
      - name: Preserve G1 original actor upstream SHA provenance for three source games in private git
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030
          git fetch -q origin "$BRANCH"
          git checkout -q -B igp-g1-three-original "origin/$BRANCH"
          for gid in 0022600002 0022600003 0022600004; do
            cp "$RUNNER_TEMP/G1Q/qa-$gid.json" "$dest/igp_fusion_g1_original_actor_upstream_$gid-v1.json"
            cp "$RUNNER_TEMP/G1Q/upstream-$gid.jsonl.gz" "$dest/igp_fusion_g1_original_actor_upstream_$gid-v1.jsonl.gz"
            git add -f "$dest/igp_fusion_g1_original_actor_upstream_$gid-v1.json" "$dest/igp_fusion_g1_original_actor_upstream_$gid-v1.jsonl.gz"
          done
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original per actor upstream SDK interpolation 13part SHA source joins 3 more games'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G1_ORIGINAL_THREE_GAMES_SOURCE_PROVENANCE_QA_ACCEPTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
