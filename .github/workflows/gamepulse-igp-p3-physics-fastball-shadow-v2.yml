name: IGP P3 original NBA fastball physics dual-shadow 10Hz query SHA QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-igp-p3-physics-fastball-shadow-v2.yml'
permissions: {contents: read}
concurrency:
  group: igp-p3-fastball-physics-shadow-v2
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 9cfd15c27edb46c99b5d7274f6abe5fc677c8407
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public confidentiality guard and private original-source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free tests and two original NBA source-verified research query readbacks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_68_p3_fastball_physics_shadow_10hz_v2.py'
          for gid in 0022600123 0022600107; do
            if ! python3 gamepulse/fusion/query_igp_68_p3_fastball_physics_shadow_10hz_v2.py \
              --root . --game-id "$gid" --auto-first \
              --output "$RUNNER_TEMP/physics-$gid-private.json" > "$RUNNER_TEMP/physics-$gid-private.log" 2>&1; then
              echo IGP_P3_REAL_NBA_DUAL_BALL_QUERY_FAILED
              python3 - "$gid" <<'PY'
          import sys,os,re
          from pathlib import Path
          gid=sys.argv[1]
          lines=(Path(os.environ['RUNNER_TEMP'])/('physics-'+gid+'-private.log')).read_text(errors='replace').splitlines()
          last=next((s for s in reversed(lines) if s.strip()),'NO_LOG')
          print('P3_PRIVATE_EXCEPTION_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:70])
          PY
              exit 41
            fi
          done
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          totals={}
          for gid in ('0022600123','0022600107'):
              j=json.loads((Path(os.environ['RUNNER_TEMP'])/('physics-'+gid+'-private.json')).read_text())
              assert len(j['rows'])==3 and j['counts']['new_physics_alternative_candidate_timestamps']>=1
              assert j['accepted_tracking_numerator_delta']==0
              assert j['original_SDK_XYZ_PBP_roster_not_modified']
              assert j['research_only'] and not j['independent_video_physical_positions_certified']
              assert j['original_68_native_complete_1200ms']==492617
              assert j['original_68_continuous_10hz_complete_1200ms']==917686
              candidates=[r for r in j['rows'] if r.get('physics_trajectory_hypotheses')]
              assert len(candidates)==j['counts']['new_physics_alternative_candidate_timestamps']
              for row in candidates:
                  assert row['canonical_ball'] is None and not row['canonical_research_1200ms_complete']
                  assert len(row['candidate_ball_shadows'])==1
                  assert len(row['canonical_players_by_official_source_id'])<=10
                  assert all(not k['physical_video_certified'] for k in row['physics_trajectory_hypotheses'])
              totals[gid]={'rows':len(j['rows']),
                  'ball_alternatives':len(candidates),
                  'hermite_alternatives':j['counts']['bounded_xy_hermite_alternative_timestamps'],
                  'promoted_tracking_scenes':0}
          print('IGP_P3_PHYSICS_PRIVATE_SOURCE_QUERY_V2_PASS',json.dumps(totals,sort_keys=True))
          PY
      - name: Save immutable original-NBA dual research readbacks in private QA only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-physics-query "origin/$BRANCH"
          for gid in 0022600123 0022600107; do
            cp "$RUNNER_TEMP/physics-$gid-private.json" "$dest/igp_68_p3_physics_shadow_query_v2_$gid.json"
            git add -f "$dest/igp_68_p3_physics_shadow_query_v2_$gid.json"
          done
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): real NBA source ball 3D dual-hypothesis shadow query two game readback'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_PRIVATE_ORIGINAL_NBA_PHYSICS_QUERY_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
