# Private original NBA XYZ remains in private 104; public QA logs aggregate only.
name: IGP 71game fifth player extra actor continuity research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-extra-actor-fifth-crosswalk.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-fifth-extra-actor-crosswalk
  cancel-in-progress: false
jobs:
  threegame-source-crosswalk-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify private source, syntax and deterministic 3-game source QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_extra_actor_identity_crosswalk_v1.py
          python3 gamepulse/fusion/igp_v32_extra_actor_identity_crosswalk_v1.py --root . --games 0022600093 0022600109 0022600145 --out "$RUNNER_TEMP/fifth-threegames-private.json" > "$RUNNER_TEMP/fifth-threegames-private.log" 2>&1 || {
              echo IGP_FIFTH_3GAME_CROSSWALK_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          ss=(Path(os.environ["RUNNER_TEMP"])/"fifth-threegames-private.log").read_text(errors="replace").splitlines()
          line=next((s for s in reversed(ss) if re.match(
             r"^(?:AssertionError|ValueError|KeyError|TypeError|FileNotFoundError|ImportError|RuntimeError):",s)),None)
          print("IGP_PRIVATE_REDACTED_FAILURE",re.sub(r"[0-9]{4,}","[ID]",line or "UNKNOWN")[:160])
          PY
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"fifth-threegames-private.json").read_bytes())
          c=q["counts"]
          assert q["games_evaluated"]==3
          assert c["nine_plus_ball_has_extra_nearby"]<=c["nine_plus_ball"]
          assert (sum(v for k,v in c.items() if k.startswith("candidate_"))
                 ==c["nine_plus_ball_has_extra_nearby"])
          assert c["control_masked_official_player_trials"]>0
          print("IGP_FIFTH_THREEGAME_CROSSWALK_SOURCE_QA",json.dumps({
             "games":3,"counts":c,"no_production_promotion":True},sort_keys=True))
          PY
  full71-source-crosswalk:
    needs: threegame-source-crosswalk-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify private SHA all71 source-backed candidate identity against negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_extra_actor_identity_crosswalk_v1.py --root . --out "$RUNNER_TEMP/fifth-all71-private.json" > "$RUNNER_TEMP/fifth-all71-private.log" 2>&1 || {
            echo IGP_FIFTH_ALL71_CROSSWALK_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          ss=(Path(os.environ["RUNNER_TEMP"])/"fifth-all71-private.log").read_text(errors="replace").splitlines()
          line=next((s for s in reversed(ss) if re.match(
             r"^(?:AssertionError|ValueError|KeyError|TypeError|FileNotFoundError|ImportError|RuntimeError):",s)),None)
          print("IGP_PRIVATE_REDACTED_FAILURE",re.sub(r"[0-9]{4,}","[ID]",line or "UNKNOWN")[:160])
          PY
            exit 41
          }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"fifth-all71-private.json").read_bytes())
          c=q["counts"]
          assert q["games_evaluated"]==71
          assert c["nine_plus_ball"]==82443
          assert c["nine_plus_ball_has_extra_nearby"]==8977
          assert c["exactly_one_extra_nearby"]==8194
          assert sum(v for k,v in c.items() if k.startswith("candidate_"))==8977
          assert c["control_masked_official_player_trials"]>0
          print("IGP_FIFTH_ALL71_CROSSWALK_AGGREGATE_QA",json.dumps({
              "games":71,"counts":c,"new_production_scenes":0,
              "independent_video_identity_certified":False},sort_keys=True))
          PY
      - name: Commit immutable private aggregate SHA QA record, not original licensed XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_extra_actor_fifth_crosswalk_all71_v1.json
          test ! -e "$dest"
          cp "$RUNNER_TEMP/fifth-all71-private.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m "qa(igp): 71game fifth-player extra-actor continuity and source negative controls"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo IGP_FIFTH_PRIVATE_SHA_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
