name: HoopVision Public Runner

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA from private timeedmonds-maker/104
        required: false
        type: string
      session_id:
        description: Prepared GPU session identifier
        required: false
        type: string
      benchmark:
        description: Benchmark endpoint
        required: false
        type: string
      retrieve_run_id:
        description: Existing durable run ID to retrieve without GPU work
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'SOURCE_SHA'
      - 'BENCHMARK'
      - 'GPU_PROFILE'

permissions:
  contents: write
  id-token: write

concurrency:
  group: hoopvision-public-runner
  cancel-in-progress: true

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  RELEASE_BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  EVIDENCE_BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  DEV_TOPIC: hv-dev-jobs
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
  L4_ZONE: asia-southeast1-c
  L4_INSTANCE: hv-dev-l4

jobs:
  retrieve-existing-deliverable:
    if: ${{ inputs.retrieve_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Retrieve existing UHD output
        shell: bash
        env:
          RETRIEVE_RUN_ID: ${{ inputs.retrieve_run_id }}
        run: |
          set -euo pipefail
          RESULT="$(gcloud storage cat "gs://$EVIDENCE_BUCKET/runs/$RETRIEVE_RUN_ID/result.json")"
          FINAL_URI="$(printf '%s' "$RESULT" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("benchmark",{}).get("result",{}); print(r.get("final_video") or d.get("final_video",""))')"
          [ -n "$FINAL_URI" ] || { echo "No final_video in durable result" >&2; exit 2; }
          mkdir -p deliverable
          gcloud storage cp "$FINAL_URI" deliverable/Hawks_Amen_to_Adams_All_Player_Labels.mp4
          printf '%s\n' "$FINAL_URI" > deliverable/source_gcs_uri.txt
      - name: Upload UHD deliverable
        uses: actions/upload-artifact@v4
        with:
          name: hoopvision-uhd-existing
          path: deliverable/
          retention-days: 7

  test-package-dispatch-watch:
    if: ${{ inputs.retrieve_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout public runner shell
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Resolve exact private source revision
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SHA="${REQUESTED_SHA:-}"
          if [ -z "$SHA" ]; then
            SHA="$(tr -d '[:space:]' < SOURCE_SHA)"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA" >&2
            exit 2
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "Using private source revision ${SHA:0:12}"

      - name: Publish observable run start
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          RUN_ID="public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:12}"
          git config user.name "hoopvision-runner"
          git config user.email "hoopvision-runner@users.noreply.github.com"
          git fetch origin main
          git checkout -B runner-start origin/main
          python - <<'PY'
          import json, os
          state = {
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_sha": os.environ["SOURCE_SHA"],
              "durable_run_id": f"public-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-{os.environ['SOURCE_SHA'][:12]}",
              "status": "STARTED",
          }
          open("RUN_STATE.json","w").write(json.dumps(state, indent=2, sort_keys=True) + "\\n")
          PY
          git add RUN_STATE.json
          git commit -m "Record HoopVision run ${GITHUB_RUN_ID} start"
          git push origin HEAD:main || echo "RUN_STATE start push raced with another state commit; continuing benchmark."

      - name: Resolve benchmark
        id: benchmark
        shell: bash
        env:
          REQUESTED_BENCHMARK: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          BENCHMARK="${REQUESTED_BENCHMARK:-}"
          if [ -z "$BENCHMARK" ]; then
            BENCHMARK="$(tr -d '[:space:]' < BENCHMARK)"
          fi
          case "$BENCHMARK" in
            toronto-nextgen|fresh-hawks-all-player|fresh-hawks-identity-replay|fresh-hawks-fast-path|hawks-event296-playbyplay) ;;
            *) echo "Invalid benchmark: $BENCHMARK" >&2; exit 2 ;;
          esac
          echo "name=$BENCHMARK" >> "$GITHUB_OUTPUT"
          echo "Using benchmark $BENCHMARK"

      - name: Checkout private HoopVision source
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact private source revision
        working-directory: src
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          git remote set-url origin no-network-remote
          echo "Verified private source ${ACTUAL_SHA:0:12}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run HoopVision core architecture tests
        working-directory: src
        run: |
          set -euo pipefail
          python -m unittest discover -s hoopvision/tests -p 'test_*.py' -v
          python -m py_compile tools/release/package_app.py tools/release/submit_dev.py tools/release/watch_run.py tools/release/durable_events.py tools/release/dev_supervisor.py screen_tracker_nextgen/evaluate_native_overlay.py hoopvision/worker/boot.py hoopvision/worker/interactive_service.py hoopvision/worker/run_toronto_nextgen.py hoopvision/worker/run_fresh_hawks_all_player.py hoopvision/worker/run_fresh_hawks_identity_replay.py hoopvision/worker/run_fresh_hawks_fast_path.py hoopvision/worker/run_hawks_event296_all_player.py screen_tracker_nextgen/build_fast_physical_paths.py screen_tracker_nextgen/audit_physical_paths_with_identity.py screen_tracker_nextgen/solve_fast_path_identities.py screen_tracker_nextgen/sam31_ambiguity_continuity.py screen_tracker_nextgen/materialize_sam31_player_paths.py screen_tracker_nextgen/build_named_render_paths.py screen_tracker_nextgen/build_kickout_semantic_anchors.py screen_tracker_nextgen/global_identity_solver.py screen_tracker_nextgen/all_player_identity_solver.py screen_tracker_nextgen/render_global_identity_safe.py screen_tracker_nextgen/render_all_player_labels.py screen_tracker_kickout3/render_kickout3.py screen_tracker_kickout3/render_kickout3_v100.py tools/locked_broadcast_screen_v2.py tools/locked_broadcast_screen_v4.py

      - name: Build deterministic application snapshot
        working-directory: src
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/app/hoopvision
          cp -a screen_tracker_nextgen dist/app/
          cp -a screen_tracker_kickout3 dist/app/
          cp -a tools dist/app/
          cp -a hoopvision/core dist/app/hoopvision/
          cp -a hoopvision/config dist/app/hoopvision/
          mkdir -p dist/app/release
          cp release/pipeline.lock.json dist/app/release/pipeline.lock.json
          cp release/runtime.lock.json dist/app/release/runtime.lock.json
          printf '%s\n' '"""HoopVision application package."""' > dist/app/hoopvision/__init__.py
          cp hoopvision/worker/boot.py dist/app/boot.py
          cp hoopvision/worker/run_toronto_nextgen.py dist/app/run_toronto_nextgen.py
          cp hoopvision/worker/run_fresh_hawks_all_player.py dist/app/run_fresh_hawks_all_player.py
          cp hoopvision/worker/run_fresh_hawks_identity_replay.py dist/app/run_fresh_hawks_identity_replay.py
          cp hoopvision/worker/run_fresh_hawks_fast_path.py dist/app/run_fresh_hawks_fast_path.py
          cp hoopvision/worker/run_hawks_event296_all_player.py dist/app/run_hawks_event296_all_player.py
          cp hoopvision/worker/interactive_service.py dist/app/interactive_service.py
          find dist/app -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist/app -type f -name '*.pyc' -delete
          python tools/release/package_app.py --git-sha "$SOURCE_SHA" --app-dir dist/app --out dist/release
          python tools/release/package_app.py --git-sha "$SOURCE_SHA" --app-dir dist/app --out dist/release-repeat
          cmp dist/release/app.tar.gz dist/release-repeat/app.tar.gz
          cmp dist/release/inventory.json dist/release-repeat/inventory.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install control-plane clients
        working-directory: src
        run: python -m pip install --disable-pip-version-check --no-cache-dir google-cloud-storage==3.4.0 google-cloud-pubsub==2.31.1

      - name: Resolve and prepare GPU target
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="l4"
          if [ -f GPU_PROFILE ]; then
            PROFILE="$(tr -d '[:space:]' < GPU_PROFILE)"
          fi
          case "$PROFILE" in
            l4)
              echo "GPU_PROFILE=l4" >> "$GITHUB_ENV"
              FOUND_ZONE=""
              FOUND_INSTANCE=""

              echo "Checking existing prepared L4 immediately in $L4_ZONE"
              set +e
              gcloud compute instances start "$L4_INSTANCE" --project="$PROJECT_ID" --zone="$L4_ZONE"
              RC=$?
              set -e
              if [ "$RC" -eq 0 ]; then
                FOUND_ZONE="$L4_ZONE"
                FOUND_INSTANCE="$L4_INSTANCE"
                echo "Existing prepared L4 started in $FOUND_ZONE"
              fi

              if [ -z "$FOUND_ZONE" ]; then
                # Existence is not readiness: a TERMINATED failover can itself be
                # stranded in a zonal STOCKOUT. Only select one after a successful
                # start (or when it is already RUNNING); otherwise keep searching.
                EXISTING_FAILOVER="hv-dev-l4-failover"
                for Z in asia-southeast1-a asia-southeast1-b; do
                  if ! gcloud compute instances describe "$EXISTING_FAILOVER" --project="$PROJECT_ID" --zone="$Z" >/dev/null 2>&1; then
                    continue
                  fi
                  STATUS="$(gcloud compute instances describe "$EXISTING_FAILOVER" --project="$PROJECT_ID" --zone="$Z" --format='value(status)')"
                  echo "Existing failover $EXISTING_FAILOVER in $Z status=$STATUS"
                  if [ "$STATUS" = "RUNNING" ]; then
                    FOUND_ZONE="$Z"
                    FOUND_INSTANCE="$EXISTING_FAILOVER"
                    break
                  fi
                  set +e
                  gcloud compute instances start "$EXISTING_FAILOVER" --project="$PROJECT_ID" --zone="$Z"
                  RC=$?
                  set -e
                  if [ "$RC" -eq 0 ]; then
                    FOUND_ZONE="$Z"
                    FOUND_INSTANCE="$EXISTING_FAILOVER"
                    echo "Started prepared L4 failover target $EXISTING_FAILOVER in $FOUND_ZONE"
                    break
                  fi
                  echo "Prepared failover in $Z could not start; continuing capacity search."
                done
              fi

              if [ -z "$FOUND_ZONE" ]; then
                MACHINE_IMAGE="hv-dev-l4-probe-${GITHUB_RUN_ID}"
                FAILOVER_INSTANCE="hv-dev-l4-probe-${GITHUB_RUN_ID}"
                echo "Creating temporary machine image $MACHINE_IMAGE from $L4_INSTANCE in $L4_ZONE"
                gcloud compute machine-images create "$MACHINE_IMAGE" \
                  --project="$PROJECT_ID" \
                  --source-instance="$L4_INSTANCE" \
                  --source-instance-zone="$L4_ZONE"
                # Try the zone without the stale failover first, then the other
                # Singapore zones. Unique instance naming avoids colliding with
                # retained failover resources from earlier capacity probes.
                for Z in asia-southeast1-b asia-southeast1-a asia-southeast1-c; do
                  echo "Trying immediate prepared L4 clone $FAILOVER_INSTANCE in $Z"
                  set +e
                  gcloud compute instances create "$FAILOVER_INSTANCE" \
                    --project="$PROJECT_ID" \
                    --zone="$Z" \
                    --source-machine-image="$MACHINE_IMAGE"
                  RC=$?
                  set -e
                  if [ "$RC" -eq 0 ]; then
                    FOUND_ZONE="$Z"
                    FOUND_INSTANCE="$FAILOVER_INSTANCE"
                    break
                  fi
                done
                gcloud compute machine-images delete "$MACHINE_IMAGE" --project="$PROJECT_ID" --quiet || true
              fi

              if [ -z "$FOUND_ZONE" ]; then
                echo "No immediate L4 capacity available; falling back to Flex-start."
                FLEX_INSTANCE="hv-dev-l4-flex-${GITHUB_RUN_ID}"
                MACHINE_IMAGE="hv-dev-l4-flex-${GITHUB_RUN_ID}"
                gcloud compute machine-images create "$MACHINE_IMAGE" --project="$PROJECT_ID" --source-instance="$L4_INSTANCE" --source-instance-zone="$L4_ZONE"
                for Z in asia-southeast1-a asia-southeast1-b asia-southeast1-c; do
                  echo "Submitting Flex-start L4 in $Z"
                  set +e
                  gcloud compute instances create "$FLEX_INSTANCE" --project="$PROJECT_ID" --zone="$Z" --source-machine-image="$MACHINE_IMAGE" --provisioning-model=FLEX_START --max-run-duration=1800s
                  RC=$?
                  set -e
                  if [ "$RC" -eq 0 ]; then
                    FOUND_ZONE="$Z"
                    FOUND_INSTANCE="$FLEX_INSTANCE"
                    break
                  fi
                done
                gcloud compute machine-images delete "$MACHINE_IMAGE" --project="$PROJECT_ID" --quiet || true
              fi
              if [ -z "$FOUND_ZONE" ]; then
                # Singapore is occasionally fully stocked out. The prepared
                # machine image is global and the project uses the default
                # auto-mode VPC, so try the nearest region with independently
                # confirmed L4 quota. Cross-region workers are ephemeral.
                CROSS_IMAGE="hv-dev-l4-cross-${GITHUB_RUN_ID}"
                CROSS_INSTANCE="hv-dev-l4-cross-${GITHUB_RUN_ID}"
                echo "Singapore L4 capacity exhausted; preparing cross-region clone."
                gcloud compute machine-images create "$CROSS_IMAGE" \
                  --project="$PROJECT_ID" \
                  --source-instance="$L4_INSTANCE" \
                  --source-instance-zone="$L4_ZONE"
                for SPEC in \
                  "asia-east1:asia-east1-a" \
                  "asia-east1:asia-east1-b" \
                  "asia-east1:asia-east1-c" \
                  "us-west4:us-west4-a" \
                  "us-west4:us-west4-b" \
                  "us-west4:us-west4-c"; do
                  REGION="${SPEC%%:*}"
                  Z="${SPEC##*:}"
                  echo "Trying prepared L4 clone $CROSS_INSTANCE in $Z"
                  set +e
                  gcloud compute instances create "$CROSS_INSTANCE" \
                    --project="$PROJECT_ID" \
                    --zone="$Z" \
                    --source-machine-image="$CROSS_IMAGE" \
                    --subnet=default
                  RC=$?
                  set -e
                  if [ "$RC" -eq 0 ]; then
                    FOUND_ZONE="$Z"
                    FOUND_INSTANCE="$CROSS_INSTANCE"
                    echo "TARGET_EPHEMERAL=1" >> "$GITHUB_ENV"
                    echo "Selected cross-region prepared L4 target $FOUND_INSTANCE in $FOUND_ZONE"
                    break
                  fi
                done
                gcloud compute machine-images delete "$CROSS_IMAGE" --project="$PROJECT_ID" --quiet || true
              fi
              if [ -z "$FOUND_ZONE" ]; then
                echo "No L4 capacity found in Singapore, asia-east1, or us-west4." >&2
                exit 5
              fi
              echo "TARGET_ZONE=$FOUND_ZONE" >> "$GITHUB_ENV"
              echo "TARGET_INSTANCE=$FOUND_INSTANCE" >> "$GITHUB_ENV"
              echo "TARGET_SESSION=hv-dev-l4" >> "$GITHUB_ENV"
              echo "Selected L4 target $FOUND_INSTANCE in $FOUND_ZONE"
              ;;
            g4)
              echo "GPU_PROFILE=g4" >> "$GITHUB_ENV"
              PREF_ID="hoopvision-g4-asia-southeast1"
              echo "Attempting direct G4 allocation; quota API read is advisory only."
              if CLOUDSDK_CORE_DISABLE_PROMPTS=1 gcloud --quiet beta quotas preferences describe "$PREF_ID" --project="$PROJECT_ID" --billing-project="$PROJECT_ID" --format=json > /tmp/g4-quota.json 2>/tmp/g4-quota.err; then
                cat /tmp/g4-quota.json
              else
                cat /tmp/g4-quota.err || true
                echo "Quota preference could not be read; continuing to direct G4 VM creation so Compute Engine is authoritative."
              fi
              G4_INSTANCE="hv-dev-g4"
              FOUND_ZONE=""
              for Z in asia-southeast1-a asia-southeast1-b; do
                if gcloud compute instances describe "$G4_INSTANCE" --project="$PROJECT_ID" --zone="$Z" >/dev/null 2>&1; then
                  FOUND_ZONE="$Z"
                  break
                fi
              done
              if [ -z "$FOUND_ZONE" ]; then
                SRC_DISK="$(gcloud compute instances describe "$L4_INSTANCE" --project="$PROJECT_ID" --zone="$L4_ZONE" --format='value(disks[0].source.basename())')"
                SA="$(gcloud compute instances describe "$L4_INSTANCE" --project="$PROJECT_ID" --zone="$L4_ZONE" --format='value(serviceAccounts[0].email)')"
                SUBNET="$(gcloud compute instances describe "$L4_INSTANCE" --project="$PROJECT_ID" --zone="$L4_ZONE" --format='value(networkInterfaces[0].subnetwork.basename())')"
                SNAP="hv-dev-l4-g4-${GITHUB_RUN_ID}"
                echo "Creating temporary snapshot $SNAP from prepared L4 boot disk $SRC_DISK"
                gcloud compute snapshots create "$SNAP" --project="$PROJECT_ID" --source-disk="$SRC_DISK" --source-disk-zone="$L4_ZONE" --storage-location=asia-southeast1
                for Z in asia-southeast1-a asia-southeast1-b; do
                  DISK="hv-dev-g4-boot"
                  echo "Trying G4 preparation in $Z"
                  if gcloud compute disks describe "$DISK" --project="$PROJECT_ID" --zone="$Z" >/dev/null 2>&1; then
                    echo "Deleting stale G4 boot disk $DISK in $Z"
                    gcloud compute disks delete "$DISK" --project="$PROJECT_ID" --zone="$Z" --quiet
                  fi
                  gcloud compute disks create "$DISK" --project="$PROJECT_ID" --zone="$Z" --type=hyperdisk-balanced --source-snapshot="$SNAP"
                  set +e
                  gcloud compute instances create "$G4_INSTANCE" --project="$PROJECT_ID" --zone="$Z" --machine-type=g4-standard-48 --disk="name=$DISK,boot=yes,auto-delete=no" --service-account="$SA" --scopes=cloud-platform --subnet="$SUBNET" --maintenance-policy=TERMINATE
                  RC=$?
                  set -e
                  if [ "$RC" -eq 0 ]; then
                    FOUND_ZONE="$Z"
                    break
                  fi
                  gcloud compute disks delete "$DISK" --project="$PROJECT_ID" --zone="$Z" --quiet || true
                done
                gcloud compute snapshots delete "$SNAP" --project="$PROJECT_ID" --quiet || true
              fi
              if [ -z "$FOUND_ZONE" ]; then
                echo "No G4 worker could be prepared in asia-southeast1-a or asia-southeast1-b." >&2
                exit 1
              fi
              echo "TARGET_ZONE=$FOUND_ZONE" >> "$GITHUB_ENV"
              echo "TARGET_INSTANCE=$G4_INSTANCE" >> "$GITHUB_ENV"
              echo "TARGET_SESSION=hv-dev-l4" >> "$GITHUB_ENV"
              echo "Selected G4 target $G4_INSTANCE in $FOUND_ZONE"
              ;;
            *)
              echo "Unsupported GPU_PROFILE=$PROFILE" >&2
              exit 2
              ;;
          esac

      - name: Ensure prepared GPU target is running
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute instances remove-metadata "$TARGET_INSTANCE" \
            --project="$PROJECT_ID" --zone="$TARGET_ZONE" --keys=shutdown-script >/dev/null 2>&1 || true
          STATUS="$(gcloud compute instances describe "$TARGET_INSTANCE" --project="$PROJECT_ID" --zone="$TARGET_ZONE" --format='value(status)')"
          echo "Prepared L4 status: $STATUS"
          START_OP=""
          if [ "$STATUS" != "RUNNING" ]; then
            START_OP="$(gcloud compute instances start "$TARGET_INSTANCE" --project="$PROJECT_ID" --zone="$TARGET_ZONE" --format='value(name)')"
            echo "Prepared L4 start operation: $START_OP"
          fi
          for i in $(seq 1 90); do
            STATUS="$(gcloud compute instances describe "$TARGET_INSTANCE" --project="$PROJECT_ID" --zone="$TARGET_ZONE" --format='value(status)')"
            echo "Prepared L4 status: $STATUS"
            [ "$STATUS" = "RUNNING" ] && break
            if [ -n "$START_OP" ] && [ "$STATUS" = "TERMINATED" ] && [ "$i" -gt 1 ]; then
              echo "=== L4 START OPERATION ==="
              gcloud compute operations describe "$START_OP" --project="$PROJECT_ID" --zone="$TARGET_ZONE" || true
              echo "=== L4 INSTANCE STATUS ==="
              gcloud compute instances describe "$TARGET_INSTANCE" --project="$PROJECT_ID" --zone="$TARGET_ZONE" --format='yaml(status,statusMessage,lastStartTimestamp,lastStopTimestamp)' || true
              break
            fi
            sleep 4
          done
          [ "$STATUS" = "RUNNING" ] || { echo "Prepared L4 did not reach RUNNING" >&2; exit 1; }

      - name: Enforce Hawks development observability timeout
        if: ${{ steps.benchmark.outputs.name == 'fresh-hawks-all-player' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Setting live supervisor Hawks development timeout to 600s (acceptance SLO remains unchanged)."
          gcloud compute ssh "$TARGET_INSTANCE" \
            --project="$PROJECT_ID" --zone="$TARGET_ZONE" --quiet \
            --command='sudo touch /etc/hoopvision-dev.env; sudo sed -i "/^HOOPVISION_HAWKS_BENCHMARK_TIMEOUT_S=/d" /etc/hoopvision-dev.env; echo "HOOPVISION_HAWKS_BENCHMARK_TIMEOUT_S=600" | sudo tee -a /etc/hoopvision-dev.env >/dev/null; sudo systemctl restart hoopvision-dev-supervisor; sudo systemctl is-active --quiet hoopvision-dev-supervisor; sudo grep "^HOOPVISION_HAWKS_BENCHMARK_TIMEOUT_S=" /etc/hoopvision-dev.env'

      - name: Publish immutable bundle and dispatch
        working-directory: src
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HOOPVISION_RELEASE_BUCKET: ${{ env.RELEASE_BUCKET }}
          HOOPVISION_EVIDENCE_BUCKET: ${{ env.EVIDENCE_BUCKET }}
          HOOPVISION_DEV_TOPIC: ${{ env.DEV_TOPIC }}
          REQUESTED_SESSION: ${{ inputs.session_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          SESSION="${REQUESTED_SESSION:-$TARGET_SESSION}"
          RUN_ID="public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:12}"
          echo "HOOPVISION_DEV_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          python tools/release/submit_dev.py --release-dir dist/release --session "$SESSION" --run-id "$RUN_ID" --benchmark "${{ steps.benchmark.outputs.name }}"

      - name: Observe durable GCP result
        working-directory: src
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HOOPVISION_EVIDENCE_BUCKET: ${{ env.EVIDENCE_BUCKET }}
        run: python tools/release/watch_run.py --run-id "$HOOPVISION_DEV_RUN_ID" --pre-benchmark-timeout 1200 --timeout 1200

      - name: Capture terminal durable evidence
        if: ${{ always() }}
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HOOPVISION_EVIDENCE_BUCKET: ${{ env.EVIDENCE_BUCKET }}
        shell: bash
        run: |
          set -u
          RUN_ID="${HOOPVISION_DEV_RUN_ID:-}"
          if [ -z "$RUN_ID" ]; then
            echo "No durable run id was created; nothing to inspect."
            exit 0
          fi

          echo "=== HOOPVISION_AUTOPILOT_RUN_ID ==="
          echo "$RUN_ID"
          echo "=== DURABLE EVENTS ==="
          gcloud storage cat "gs://$EVIDENCE_BUCKET/runs/$RUN_ID/events/*.json" 2>/dev/null || true
          echo "=== DURABLE RESULT ==="
          RESULT="$(gcloud storage cat "gs://$EVIDENCE_BUCKET/runs/$RUN_ID/result.json" 2>/dev/null || true)"
          printf '%s\n' "$RESULT"

          echo "=== BOUNDED DIAGNOSTIC SUMMARY ==="
          gcloud storage cat "gs://$EVIDENCE_BUCKET/runs/$RUN_ID/logs/*.bin" 2>/dev/null \
            | grep -E 'HOOPVISION_STAGE|HOOPVISION_TRACK_STAGE|HOOPVISION_OCR_STAGE|HOOPVISION_OCR_DURABLE_EVIDENCE|HOOPVISION_SAM31_BATCHING|HOOPVISION_SAM31_POINT_BATCH|SAM31_DECISION|sam31_decisions|accepted=|rejected=|inconclusive|Traceback|RuntimeError|TimeoutError|HOOPVISION_NAMED_RENDER_PATHS|HOOPVISION_FRESH_REPLAY_OK' \
            | tail -n 500 || true

          if [ -z "$RESULT" ]; then
            CLASS="MISSING_TERMINAL_EVIDENCE_DIAGNOSE_BEFORE_RETRY"
          else
            CLASS="$(printf '%s' "$RESULT" | python tools/durable_result.py --field classification 2>/dev/null || echo UNKNOWN_DIAGNOSE_BEFORE_RETRY)"
          fi
          echo "HOOPVISION_AUTOPILOT_CLASS=$CLASS"

          # Bridge completed UHD output from durable GCS storage into a GitHub
          # Actions artifact. This is retrieval-only: it never reruns GPU work.
          # Resolve the current nested schema and recognised legacy field, and
          # fence the object URI to the authorised evidence bucket.
          FINAL_URI="$(printf '%s' "$RESULT" | python tools/durable_result.py --field final_video --allowed-bucket "$EVIDENCE_BUCKET" 2>/dev/null || true)"
          if [ -n "$FINAL_URI" ]; then
            mkdir -p "$GITHUB_WORKSPACE/deliverable"
            echo "Retrieving completed UHD output: $FINAL_URI"
            gcloud storage cp "$FINAL_URI" "$GITHUB_WORKSPACE/deliverable/Hawks_Amen_to_Adams_All_Player_Labels.mp4"
            printf '%s\n' "$FINAL_URI" > "$GITHUB_WORKSPACE/deliverable/source_gcs_uri.txt"
          else
            echo "No final_video URI present in durable result."
          fi
          {
            echo '### HoopVision bounded auto-resolve'
            printf '%s\n' "- Durable run: $RUN_ID"
            printf '%s\n' "- Classification: $CLASS"
            echo '- Policy: terminal application failures and missing evidence are never auto-rerun; a new GPU comparison requires new causal evidence or a new executable candidate.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload completed UHD deliverable
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hoopvision-uhd-${{ github.run_id }}
          path: deliverable/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish observable terminal state
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -u
          git fetch origin main || exit 0
          git checkout -B runner-state origin/main || exit 0
          RUN_ID="public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:12}"
          EXECUTION_STATUS="UNKNOWN"
          QUALIFICATION_STATUS="UNKNOWN"
          RESULT=""
          if command -v gcloud >/dev/null 2>&1; then
            RESULT="$(gcloud storage cat "gs://$EVIDENCE_BUCKET/runs/$RUN_ID/result.json" 2>/dev/null || true)"
          fi
          if [ -n "$RESULT" ]; then
            EXECUTION_STATUS="$(printf '%s' "$RESULT" | python tools/durable_result.py --field execution_status 2>/dev/null || echo UNKNOWN)"
            QUALIFICATION_STATUS="$(printf '%s' "$RESULT" | python tools/durable_result.py --field qualification_status 2>/dev/null || echo UNKNOWN)"
          fi
          export EXECUTION_STATUS QUALIFICATION_STATUS
          python - <<'PY'
          import json, os
          state = {
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_sha": os.environ["SOURCE_SHA"],
              "durable_run_id": f"public-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-{os.environ['SOURCE_SHA'][:12]}",
              "status": os.environ.get("EXECUTION_STATUS","UNKNOWN"),
              "execution_status": os.environ.get("EXECUTION_STATUS","UNKNOWN"),
              "qualification_status": os.environ.get("QUALIFICATION_STATUS","UNKNOWN"),
          }
          open("RUN_STATE.json","w").write(json.dumps(state, indent=2, sort_keys=True) + "\\n")
          PY
          git config user.name "hoopvision-runner"
          git config user.email "hoopvision-runner@users.noreply.github.com"
          git add RUN_STATE.json
          git commit -m "Record HoopVision run ${GITHUB_RUN_ID} terminal state" || exit 0
          git push origin HEAD:main || true

      - name: Stop prepared GPU target after runner attempt
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          if [ -z "${TARGET_INSTANCE:-}" ] || [ -z "${TARGET_ZONE:-}" ]; then echo "No GPU target was allocated; cleanup skipped."; exit 0; fi
          STATUS="$(gcloud compute instances describe "$TARGET_INSTANCE" --project="$PROJECT_ID" --zone="$TARGET_ZONE" --format='value(status)' 2>/dev/null || true)"
          echo "Prepared L4 post-run status: ${STATUS:-UNKNOWN}"
          if [ "${TARGET_EPHEMERAL:-0}" = "1" ]; then
            echo "Deleting ephemeral cross-region L4 target $TARGET_INSTANCE in $TARGET_ZONE"
            gcloud compute instances delete "$TARGET_INSTANCE" --project="$PROJECT_ID" --zone="$TARGET_ZONE" --quiet || true
            exit 0
          fi
          case "$STATUS" in
            RUNNING|STAGING|PROVISIONING|REPAIRING|SUSPENDING|SUSPENDED)
              gcloud compute instances stop "$TARGET_INSTANCE" --project="$PROJECT_ID" --zone="$TARGET_ZONE" --async || true
              ;;
            TERMINATED|"")
              ;;
            *)
              echo "Unexpected L4 state $STATUS; no destructive fallback attempted."
              ;;
          esac
          for i in $(seq 1 120); do
            STATUS="$(gcloud compute instances describe "$TARGET_INSTANCE" --project="$PROJECT_ID" --zone="$TARGET_ZONE" --format='value(status)' 2>/dev/null || true)"
            echo "Prepared L4 status: ${STATUS:-UNKNOWN}"
            [ "$STATUS" = "TERMINATED" ] && exit 0
            [ -z "$STATUS" ] && exit 0
            sleep 3
          done
          echo "Prepared L4 did not confirm TERMINATED within bounded cleanup window." >&2
          exit 1
