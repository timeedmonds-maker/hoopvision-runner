# Public runner; checkout and QA only private NBA original PBP. No XYZ logs.
name: IGP P2B original71 possession QA plus NBA81 benchmark
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-possession-alignment-g1-all71-20261031.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-p2b-original71-and-nba81-g1
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
      PIN: 16227979dba29ddb3324b8271a9eb1ccc23d3572
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public safety and private commit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          echo PINNED_PRIVATE_SOURCE_COMMIT_VERIFIED
      - name: Source-free contracts plus real Rockets original PBP
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_possession_alignment_core_v1.py gamepulse/fusion/igp_v32_p2b_possession_alignment_71_source_qa_v1.py
          python3 -m unittest -q gamepulse/fusion/tests/test_igp_v32_p2b_possession_alignment_core_v1.py
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from igp_v32_p2b_possession_alignment_core_v1 import build_ledger
          f=Path('gamepulse/fusion/official_pbp_timing/games/0022600009.json')
          raw=f.read_bytes()
          pb=json.loads(raw)
          q=build_ledger(pb['game_id'],pb['actions'])
          assert len(q['event_rows'])==len(pb['actions']) and f.read_bytes()==raw
          print('NBA_PBP_REAL_HOU_SAS_AUDIT',json.dumps({'actions':len(pb['actions']),
            'candidate_sequences':len(q['sequences']),
            'chronology_conflict_actions':q['source_chronology_conflict_count'],
            'original_pbp_sha256':hashlib.sha256(raw).hexdigest()}))
          PY
      - name: Verify EVERY original PBP chain searchable with ZERO tracking
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_v32_p2b_all_possessions_unconditional_v1.py \
            gamepulse/fusion/igp_v32_p2b_all_possessions_71_source_qa_v1.py
          python3 -m unittest -q \
            gamepulse/fusion/tests/test_igp_v32_p2b_all_possessions_unconditional_v1.py
          python3 gamepulse/fusion/igp_v32_p2b_all_possessions_71_source_qa_v1.py \
            --root . --out "$RUNNER_TEMP/igp_p2b_unconditional_original71_qa.json" \
            > "$RUNNER_TEMP/igp_p2b_unconditional_original71_private.log" 2>&1 || {
              echo IGP_UNCONDITIONAL_PBP_SOURCE_QA_FAILED_CHECK_PRIVATE_LOG
              exit 53
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp_p2b_unconditional_original71_qa.json").read_text())
          c=v["counts"]
          assert c["games"]==71
          assert c["original_PBP_chains"]==14612
          assert c["searchable_without_tracking"]==14612
          assert c["original_PBP_actions"]==43419
          assert c["original_native_source_inventory_NOT_READ"]==2376002
          assert v["all_PBP_chains_queryable_regardless_of_P2B_scene_coverage"] is True
          assert v["physical_possessions_certified"]==0
          print("IGP_ALL_PBP_POSSESSIONS_SEARCHABLE_WITHOUT_10BALL_TRACKING",json.dumps(c,sort_keys=True))
          PY
      - name: NBA71 source team POSS and PBP chronological-grammar QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_v32_p2b_possession_semantic_source_71_qa_v1.py \
            gamepulse/fusion/query_igp_v32_p2b_published_team_poss_v1.py
          python3 -m unittest -q \
            gamepulse/fusion/tests/test_igp_v32_p2b_published_team_poss_v1.py \
            gamepulse/fusion/tests/test_igp_v32_p2b_possession_alignment_core_v1.py
          python3 gamepulse/fusion/igp_v32_p2b_possession_semantic_source_71_qa_v1.py \
            --root . --out "$RUNNER_TEMP/p2b_nba_published_poss_source71.json" \
            > "$RUNNER_TEMP/p2b_nba_published_poss_source71_private.log" 2>&1 || {
              echo P2B_NBA71_PUBLISHED_POSS_SEMANTICS_QA_FAILED
              exit 54
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"p2b_nba_published_poss_source71.json").read_bytes())
          c=q["counts"]
          assert c["games"]==71 and c["team_game_rows"]==142
          assert c["nba_published_team_possessions"]==14552
          assert c["original_logical_chains"]==14612
          assert c["all_original_chains_searchable_without_tracking"]==14612
          assert c["original_official_PBP_actions"]==43419
          assert c["sum_absolute_chain_minus_NBA_team_POSS"]==178
          assert c["team_game_count_exact_matches"]==30
          assert q["physical_custody_boundaries_certified"]==0
          print("P2B_PUBLISHED_NBA_TEAM_POSS_AND_CANONICAL_PBP_SOURCE_QA",json.dumps(c,sort_keys=True))
          PY
      - name: NBA71 team AND player POSS independent constraints, source SHA verified
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_v32_p2b_team_player_possession_triangulation_v1.py
          python3 -m unittest -q \
            gamepulse/fusion/tests/test_igp_v32_p2b_team_player_possession_triangulation_v1.py
          python3 gamepulse/fusion/igp_v32_p2b_team_player_possession_triangulation_v1.py \
            --root . --verify-source --out "$RUNNER_TEMP/p2b_nba_team_player_POSS_source71.json" \
            > "$RUNNER_TEMP/p2b_nba_team_player_POSS_source71_private.log" 2>&1 || {
              echo NBA71_TEAM_PLAYER_POSS_SOURCE_AUDIT_FAILED
              exit 55
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"p2b_nba_team_player_POSS_source71.json").read_bytes())
          c=q["counts"]
          assert q["games"]==71 and q["team_game_rows"]==142
          assert c["nba_team_POSS"]==14552 and c["PBP_original_chains"]==14612
          assert c["sum_player_POSS"]==73797 and c["sum_player_credit_overhang"]==1037
          assert c["sum_player_credit_vs_five_chains"]==737
          assert q["source_QA"]["SHA_PBP_games_verified"]==71
          assert q["source_QA"]["player_ball_tracking_frames_required"]==0
          assert q["physically_certified_custody_boundaries"]==0
          print("IGP_NBA_TEAM_PLAYER_PBP_POSSESSION_SOURCE_TRIANGULATION_PASS",
            json.dumps({"games":71,"team_rows":142,"player_rows":1597,
            "team_POSS":c["nba_team_POSS"],"original_chains":c["PBP_original_chains"],
            "NBA_player_POSS":c["sum_player_POSS"],
            "player_credit_excess":c["sum_player_credit_overhang"],
            "player_credit_vs_chain_residual":c["sum_player_credit_vs_five_chains"],
            "physical_possessions_certified":0},sort_keys=True))
          PY
      - name: All 1597 player-POSS source credits and optimistic substitution-only residual lower bound
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_player_credit_residual_constraints_v1.py
          python3 -m unittest -q gamepulse/fusion/tests/test_igp_v32_p2b_player_credit_residual_constraints_v1.py
          python3 gamepulse/fusion/igp_v32_p2b_player_credit_residual_constraints_v1.py \
            --root . --out "$RUNNER_TEMP/p2b_nba1597_playercredit_source71.json" \
            > "$RUNNER_TEMP/p2b_nba1597_playercredit_source71_private.log" 2>&1 || {
              echo NBA_1597_PLAYER_SOURCE_CREDIT_QA_FAILED
              exit 56
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads((Path(os.environ["RUNNER_TEMP"])/"p2b_nba1597_playercredit_source71.json").read_text())
          c=v["counts"]
          assert c["player_games"]==1597
          assert c["published_player_POSS"]==73797
          assert c["abs_residual_provisional_minus_NBA"]==1916
          assert c["minimum_abs_residual_after_perfect_near_sub_adjustment"]==517
          assert c["reliable_minimum_abs_residual_after_perfect_near_sub_adjustment"]==514
          assert len(v["high_priority_eight_player_event_grammar_cases"])==8
          assert v["physical_ball_custody_certified"] is False
          print("P2B_1597_PLAYER_POSS_SUBSTITUTION_ONLY_LOWER_BOUND_PASS",
            json.dumps({"player_games":1597,"abs_discrepancy":1916,
            "optimistic_non_substitution_residual":517,
            "clean_non_substitution_residual":514,
            "strong_no_boundary_cases":8,"physical_possessions_certified":0},sort_keys=True))
          PY
      - name: Player credit semantics vs substitution and FT grammar on 71 SHA original PBP games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_v32_p2b_player_credit_event_exposure_71_v1.py \
            gamepulse/fusion/igp_v32_p2b_player_credit_residual_constraints_v1.py
          python3 -m unittest -q \
            gamepulse/fusion/tests/test_igp_v32_p2b_player_credit_event_exposure_71_v1.py
          python3 gamepulse/fusion/igp_v32_p2b_player_credit_residual_constraints_v1.py \
            --root . --out "$RUNNER_TEMP/p2b_1597_player_residual_lowerbound_source.json" \
            > "$RUNNER_TEMP/p2b_1597_player_lowerbound_private.log" 2>&1 || {
              echo NBA_PLAYER_RESIDUAL_SOURCE_CONSTRAINT_FAILED
              exit 56
            }
          python3 gamepulse/fusion/igp_v32_p2b_player_credit_event_exposure_71_v1.py \
            --root . --out "$RUNNER_TEMP/p2b_71_player_credit_event_source.json" \
            > "$RUNNER_TEMP/p2b_player_credit_event_private.log" 2>&1 || {
              echo ORIGINAL71_PBP_SUBSTITUTION_FT_PLAYER_CREDIT_SOURCE_QA_FAILED
              exit 57
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          tmp=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((tmp/"p2b_1597_player_residual_lowerbound_source.json").read_bytes())
          b=json.loads((tmp/"p2b_71_player_credit_event_source.json").read_bytes())
          x=a["counts"];y=b["counts"]
          assert x["player_games"]==1597
          assert x["published_player_POSS"]==73797
          assert x["abs_residual_provisional_minus_NBA"]==1916
          assert x["minimum_abs_residual_after_perfect_near_sub_adjustment"]==517
          assert x["reliable_minimum_abs_residual_after_perfect_near_sub_adjustment"]==514
          assert len(a["high_priority_eight_player_event_grammar_cases"])==8
          assert y["team_games"]==142 and y["player_credit_overhang"]==1037
          assert b["physical_possession_custody_certified"]==0
          print("ORIGINAL_NBA71_PLAYER_CREDIT_EVENT_SOURCE_QA_PASS",json.dumps({
              "player_games":1597,"player_source_credits":73797,
              "near_substitution_only_unexplained_lower_bound":517,
              "clean_source_lower_bound":514,
              "team_games":y["team_games"],"player_credit_excess":y["player_credit_overhang"],
              "incoming_substitution_events":y["substitution_in_players"],
              "inbound_subs_at_FT_clock":y["substitution_in_at_any_FT_clock"],
              "team_games_excess_beyond_sub_in_count":y["team_game_rows_with_overhang_above_sub_count"],
              "physical_certified":0},sort_keys=True))
          PY
      - name: Freeze official 81-game team Advanced POSS mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install duckdb
          python3 - <<'PY'
          import os,urllib.request,hashlib,json,duckdb
          from pathlib import Path
          u='https://basketball-data.billmill.org/nba/stats/team_game_logs/season=2027/data.parquet'
          req=urllib.request.Request(u,headers={'User-Agent':'IGP-original-source-reconciliation/1.0'})
          with urllib.request.urlopen(req,timeout=35) as stream:
              data=stream.read(16000000)
              if stream.read(1):raise ValueError('NBA_PUBLIC_SOURCE_TOO_LARGE')
          if data[:4]!=b'PAR1' or data[-4:]!=b'PAR1':raise ValueError('NBA_PARQUET_SOURCE_MALFORMED')
          temp=Path(os.environ['RUNNER_TEMP'])
          source=temp/'2027_nba_team_game_logs.parquet'
          source.write_bytes(data)
          conn=duckdb.connect()
          rows=conn.execute("SELECT CAST(game_id AS VARCHAR),CAST(team_id AS INTEGER),CAST(poss AS INTEGER) FROM read_parquet(?) WHERE game_id LIKE '00226%' AND game_date < DATE '2026-10-31' ORDER BY game_id,team_id",[str(source)]).fetchall()
          if len(rows)!=162 or len({x[0] for x in rows})!=81:
              raise ValueError('NBA_ADVANCED_EXPECTED_81_GAMES_162_TEAMS_NOT_PRESENT')
          obj={'team_games':[{'game_id':gid,'team_id':tid,'poss':poss} for gid,tid,poss in rows],
               'parquet_upstream_sha256':hashlib.sha256(data).hexdigest(),'source_grade':'NBA_OFFICIAL_DERIVED_PUBLIC_MIRROR'}
          (temp/'nba81_team_possessions.json').write_text(json.dumps(obj,sort_keys=True))
          print('NBA81_PUBLIC_ADVANCED_POSS_SNAPSHOT_PASS',len(rows),len({x[0] for x in rows}),obj['parquet_upstream_sha256'])
          PY
      - name: Verify frozen 71 original source chains and join 81 benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_possession_alignment_71_source_qa_v1.py \
            --root . --nba-stat-team-games-json "$RUNNER_TEMP/nba81_team_possessions.json" \
            --out "$RUNNER_TEMP/p2b_g1_verified_original71_nba81.json" \
            > "$RUNNER_TEMP/p2b_g1_private.log" 2>&1 || {
              echo SOURCE_G1_FAILED_CHECK_PRIVATE_QA
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'p2b_g1_private.log').read_text(errors='replace').splitlines()
          for x in reversed(s):
              if re.match(r'^(ValueError|AssertionError|KeyError|TypeError|FileNotFoundError):',x):
                  a,_,b=x.partition(':')
                  token=b.strip().split(':')[0].split(' ')[0]
                  print('IGP_G1_FAILURE',a,token if re.fullmatch(r'[A-Z_]{5,90}',token) else 'REDACTED')
                  break
          else:print('IGP_G1_FAILURE','UNCLASSIFIED')
          PY
              exit 51
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'p2b_g1_verified_original71_nba81.json').read_bytes())
          a,s=x['aggregate'],x['statistical_inventory']
          assert x['scope_original_verified_games']==71
          assert a['original_official_actions']==43419 and a['original_logical_chains']==14612
          assert a['original_native_sdk_timestamps_inventory']==2376002
          assert a['candidate_linked_actions']+a['unlinked_or_admin_actions']==43419
          assert s['statistical_games']==81 and s['team_game_rows']==162
          assert len(s['extra_statistical_only_game_ids'])==10
          assert x['physical_possession_boundaries_certified']==0
          print('IGP_P2B_ORIGINAL_SOURCE_G1_RESULT',json.dumps({
            'nba_advanced_games':81,'original_verified_games':71,
            'extra_statistical_only_game_ids':s['extra_statistical_only_game_ids'],
            'original_pbp_actions':a['original_official_actions'],
            'original_chains':a['original_logical_chains'],
            'candidate_offensive_sequences_not_NBA_poss':a['candidate_offensive_sequences'],
            'source_chronology_conflicts':a['source_chronology_conflict_actions'],
            'physical_boundaries_certified':0},sort_keys=True))
          PY
      - name: Commit immutable source-only QA into private PR research branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p2b-source-qa "origin/$BRANCH"
          receipt=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_possession_alignment_71plus81_g1_20261031.json
          semantic=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_possession_semantics_original71_20261031.json
          accessible=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_all_original_chains_searchable71_20261031.json
          triple=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_team_player_possession_triangulation_real71_20261031.json
          playerbound=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_player_residual_bounds_real71_20261031.json
          playerevents=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_player_event_exposure_real71_20261031.json
          individual=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_playercredit_residual_bound_real1597_20261031.json
          if [ ! -f "$receipt" ]; then
             cp "$RUNNER_TEMP/p2b_g1_verified_original71_nba81.json" "$receipt"
          fi
          if [ ! -f "$semantic" ]; then
             cp "$RUNNER_TEMP/p2b_nba_published_poss_source71.json" "$semantic"
          fi
          if [ ! -f "$accessible" ]; then
             cp "$RUNNER_TEMP/igp_p2b_unconditional_original71_qa.json" "$accessible"
          fi
          if [ ! -f "$triple" ]; then
             cp "$RUNNER_TEMP/p2b_nba_team_player_POSS_source71.json" "$triple"
          fi
          if [ ! -f "$individual" ]; then
             cp "$RUNNER_TEMP/p2b_nba1597_playercredit_source71.json" "$individual"
          fi
          if [ ! -f "$playerbound" ]; then
             cp "$RUNNER_TEMP/p2b_1597_player_residual_lowerbound_source.json" "$playerbound"
          fi
          if [ ! -f "$playerevents" ]; then
             cp "$RUNNER_TEMP/p2b_71_player_credit_event_source.json" "$playerevents"
          fi
          git add -f "$receipt" "$semantic" "$accessible" "$triple" "$playerbound" "$playerevents" "$individual"
          git diff --cached --check
          if git diff --cached --quiet; then echo ALL_SOURCE_POSSESSION_QA_RECEIPTS_ALREADY_PRESERVED; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): retain source-first possession candidate ledger 71 and NBA81 mirror'
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo PRIVATE_SOURCE_G1_RECEIPT_COMMITTED; exit 0; fi
            sleep "$n"
          done
          exit 52
