name: IGP P3 NBA fastball matched short source provenance grade v3 readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-fastball-sourcegrade-v3-readback.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-sourcegrade-fastball-v3
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 429df2b0edd6aaa7bfbe206f1b91d4aec573c92c
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confidentiality guard and original NBA source private SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free regression tests and original 2-game NBA readback
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_68_p3_fastball_source_grade_10hz_v3.py'
          for gid in 0022600123 0022600107; do
            if ! python3 gamepulse/fusion/query_igp_68_p3_fastball_source_grade_10hz_v3.py --root . --game-id "$gid" --auto-first --output "$RUNNER_TEMP/grade-$gid.json" > "$RUNNER_TEMP/grade-$gid.log" 2>&1; then
              echo P3_PRIVATE_SOURCE_GRADE_V3_READBACK_FAILED
              python3 - "$gid" <<'PY'
          import os,sys,re
          from pathlib import Path
          x=Path(os.environ['RUNNER_TEMP'])/('grade-'+sys.argv[1]+'.log')
          lines=x.read_text(errors='replace').splitlines()
          last=next((z for z in reversed(lines) if z.strip()),'NO_LOG')
          print('P3_SOURCE_GRADE_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:80])
          PY
              exit 41
            fi
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          out={}
          for gid in ('0022600123','0022600107'):
              q=json.loads((Path(os.environ['RUNNER_TEMP'])/('grade-'+gid+'.json')).read_text())
              assert len(q['rows'])==3
              assert q['original_SDK_upstream_per_actor_interpolation_unresolved']
              assert q['accepted_tracking_numerator_delta']==0
              assert q['immutable_original_NBA_source_PBP_player_IDs']
              assert q['duration_matched_8game_source_evidence']['n']==480
              assert q['duration_matched_8game_source_evidence']['p95_ft']==1.5796
              assert q['natural_68_bounded_hermite_eligibility']==40367
              assert q['natural_68_potential_all_ten_plus_ball_candidates']==37182
              for row in q['rows']:
                  assert row['source_provenance_assessment']['original_SDK_ball_upstream_interpolated_flag']=='UNKNOWN_NOT_PER_RECORD_JOINED'
                  if row.get('candidate_evidence'):
                      assert row['canonical_ball'] is None
                      assert all(not e['certified_physical_XYZ'] and e['per_point_error_guarantee'] is None for e in row['candidate_evidence'])
              out[gid]={'rows':len(q['rows']),
                        'matched_short_graded_candidates':q['counts']['matched_original_short_bracket_bounded_hermite_candidates'],
                        'newly_accepted_tracking':0,
                        'upstream_per_actor_interpolated_provenance':'UNRESOLVED'}
          print('IGP_P3_NBA_SOURCE_GRADE_V3_VALIDATED',json.dumps(out,sort_keys=True))
          PY
      - name: Commit original NBA source readbacks privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-grade-v3 "origin/$BRANCH"
          for gid in 0022600123 0022600107; do
            cp "$RUNNER_TEMP/grade-$gid.json" "$dest/igp_68_p3_short_ball_source_grade_v3_$gid.json"
            git add -f "$dest/igp_68_p3_short_ball_source_grade_v3_$gid.json"
          done
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): NBA original source-proxy short ball and upstream interpolated unknown grade query v3'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_NBA_SHORT_SOURCE_GRADE_V3_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
