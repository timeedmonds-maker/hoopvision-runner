name: IGP original SDK all-13-part game 0104 full native XYZ recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-sdk-native-full-game-0104.yml']
permissions:
  contents: read
concurrency:
  group: igp-private-source-original-full-game-0104
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GAME_ID: '0022600104'
      QA_DIR: gamepulse/fusion/qa/igp_progress_20261026/sdk_native_recovery_8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner and clone confidential IGP repository
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || exit 4
          cat > "$RUNNER_TEMP/private-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/private-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/private-askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-igp"
          git -C "$RUNNER_TEMP/private-igp" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private-igp" >> "$GITHUB_ENV"
      - name: Download all 13 original archives by immutable asset ID and digest
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,re
          from pathlib import Path
          m=json.loads(Path('gamepulse/fusion/qa/igp_original_sdk_eight_release_asset_manifest_20261026.json').read_text())
          gid=os.environ['GAME_ID']; assets=m['games'][gid]['assets']
          assert len(assets)==13
          dest=Path(os.environ['RUNNER_TEMP'])/'native-sdk-parts'/gid
          dest.mkdir(parents=True)
          total=0
          for a in assets:
              assert re.fullmatch(r'sdk-part-\d{2}\.tar\.gz',a['name'])
              assert type(a['id']) is int and a['digest'].startswith('sha256:')
              url=f"https://api.github.com/repos/timeedmonds-maker/104/releases/assets/{a['id']}"
              target=dest/a['name']
              cmd=['curl','-fLsS','--connect-timeout','15','--max-time','120',
                   '--retry','1','--proto','=https','--proto-redir','=https',
                   '-H','Accept: application/octet-stream',
                   '-H','Authorization: Bearer '+os.environ['GH_TOKEN'],
                   url,'-o',str(target)]
              proc=subprocess.run(cmd,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if proc.returncode:raise RuntimeError('ORIGINAL_SOURCE_ASSET_UNAVAILABLE:'+a['name'])
              raw=target.read_bytes()
              if len(raw)!=a['size_bytes'] or hashlib.sha256(raw).hexdigest()!=a['digest'][7:]:
                  raise RuntimeError('ORIGINAL_SDK_ASSET_DIGEST_CONFLICT:'+a['name'])
              total+=len(raw)
          print('IGP_ALL_13_ORIGINAL_PRIVATE_RELEASE_PARTS_SHA_VERIFIED',
                'game='+gid,'parts=13','total_bytes='+str(total))
          PY
          echo "SDK_ARCHIVE_DIR=$RUNNER_TEMP/native-sdk-parts/$GAME_ID" >> "$GITHUB_ENV"
      - name: Recover real uncalibrated source XYZ and validate against official game roster
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests -v \
             -p 'test_igp_original_sdk_eight_native_inventory_2026.py'
          test ! -e "$QA_DIR/$GAME_ID.json"
          python3 gamepulse/fusion/igp_original_sdk_eight_native_inventory_2026.py \
             --root . --game-id "$GAME_ID" --archive-dir "$SDK_ARCHIVE_DIR" \
             --out "$QA_DIR/$GAME_ID.json"
          python3 - "$QA_DIR/$GAME_ID.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          a=d['counts']
          assert d['original_archive_parts']==13 and d['physical_possessions_certified']==0
          assert a['unique_observed_native_timestamps']>0
          assert a['original_direct_ball_xyz_frames']>0
          assert a['raw_exact_ten_plus_ball_frames']>0
          assert a['raw_exact_ten_plus_ball_frames'] <= a['unique_observed_native_timestamps']
          print('IGP_FIRST_NEW_GAME_FULL_NATIVE_XYZ_SOURCE_ACCEPTED',
              'frames='+str(a['unique_observed_native_timestamps']),
              'ten_ball='+str(a['raw_exact_ten_plus_ball_frames']),
              'gameclock_validated=NO','physical_possessions_certified=0')
          PY
      - name: Commit private metrics only, not original XYZ frames
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$QA_DIR/$GAME_ID.json"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -q -m "data(igp): accept first full new-game SHA-verified original 13-part XYZ native QA"
          git fetch -q origin "$PRIVATE_BRANCH"
          git rebase "origin/$PRIVATE_BRANCH"
          git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
          echo IGP_FIRST_NEW_GAME_RAW_XYZ_NATIVE_INVENTORY_COMMITTED
