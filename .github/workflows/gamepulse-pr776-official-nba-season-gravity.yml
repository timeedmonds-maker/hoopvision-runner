# Public NBA API statistics only; original private Blueprint SQLite and QA stay on private 104 PR #776.
name: PR776 official NBA season Gravity leaders import into private searchable Blueprint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-official-nba-season-gravity.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-official-gravity-season-private-import
  cancel-in-progress: false
jobs:
  acquire-and-integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      PRIVATE_REPO: timeedmonds-maker/104
    steps:
      - uses: actions/checkout@v4
      - name: Verify public confidentiality and private repo credential
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
      - name: Fetch current complete NBA official season-to-date gravityleaders (qualified NBA population)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,hashlib,json,time,urllib.parse,urllib.request
          from pathlib import Path
          params=urllib.parse.urlencode({"LeagueID":"00","Season":"2026-27","SeasonType":"Regular Season"})
          urls=[
            "https://stats.gleague.nba.com/stats/gravityleaders?"+params,
            "https://stats.nba.com/stats/gravityleaders?"+params
          ]
          headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
                   "Origin":"https://www.nba.com","Referer":"https://www.nba.com/",
                   "Accept":"application/json","Accept-Language":"en-US,en;q=0.9"}
          problems=[]
          for url in urls:
              for attempt in range(2):
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=25) as response:
                          raw=response.read(6_000_000)
                      result=json.loads(raw)
                      rows=result.get("leaders")
                      response_params=result.get("params") or {}
                      if response_params.get("seasonYear")!="2026-27":
                          raise ValueError("NBA response season mismatch")
                      if not isinstance(rows,list) or len(rows)<50:
                          raise ValueError("NBA qualified season population too small")
                      seen=set(); cats=("ONBALLPERIMETER","OFFBALLPERIMETER","ONBALLINTERIOR","OFFBALLINTERIOR")
                      for r in rows:
                          key=(r["PLAYERID"],r["TEAMID"])
                          if key in seen: raise ValueError("duplicate player-team")
                          seen.add(key)
                          if int(r["FRAMES"])!=sum(int(r[c+"FRAMES"]) for c in cats):
                              raise ValueError("NBA source frame-split mismatch")
                          if int(r["GAMESPLAYED"])<=0: raise ValueError("zero games in qualified row")
                          if not isinstance(r["AVGGRAVITYSCORE"],(int,float)):
                              raise ValueError("no official average gravity")
                      snap={"schema":"nba.official.gravityleaders.season.snapshot.v1",
                            "season":"2026-27","season_type":"Regular Season",
                            "response_params":response_params,
                            "fetched_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                            "source_url":url,"source_sha256":hashlib.sha256(raw).hexdigest(),
                            "qualified_population_only":True,"leaders":rows}
                      path=Path("public_nba_gravity_leaders_2026_27_current.json")
                      path.write_text(json.dumps(snap,ensure_ascii=False,indent=2,sort_keys=True)+"\n",
                                      encoding="utf8")
                      print("OFFICIAL_NBA_GRAVITY_SEASON_SOURCE_VERIFIED",len(rows),
                            "qualified player-team rows; source SHA256",snap["source_sha256"])
                      raise SystemExit(0)
                  except Exception as e:
                      problems.append(url.split("/")[2]+":"+type(e).__name__+":"+str(e)[:150])
                      time.sleep(1)
          raise SystemExit("NBA_SEASON_GRAVITY_OFFICIAL_SOURCE_UNAVAILABLE "+repr(problems))
          PY
      - name: Publish only the official public NBA qualified leaderboard snapshot
        shell: bash
        env:
          PUBLIC_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_nba_gravity_leaders_2026_27_current.json
          if ! git diff --cached --quiet; then
             git commit -qm 'data(nba): archive current official NBA qualified season Gravity leaders'
             git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUBLIC_GITHUB_TOKEN" | base64 -w 0)" pull --rebase origin main
             git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUBLIC_GITHUB_TOKEN" | base64 -w 0)" push origin HEAD:main
          fi
          echo NBA_PUBLIC_GRAVITY_SOURCE_ARCHIVED
      - name: Clone ONLY private accepted native SQLite, integration script and tests
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          PRIV="$RUNNER_TEMP/blueprint-gravity-private"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$PRIV"
          git -C "$PRIV" sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_nba_gravity_leaders_2026.py' \
            '/gamepulse/fusion/query_igp_blueprint_native_shot_gravity_2026.py' \
            '/gamepulse/fusion/igp_blueprint_native_shot_gravity_2026.py' \
            '/gamepulse/fusion/igp_blueprint_release_leaderboard_2026.py' \
            '/gamepulse/fusion/tests/test_igp_nba_gravity_leaders_2026.py' \
            '/gamepulse/fusion/materialized/igp_blueprint_native_52_20261028/blueprint_native.sqlite'
          echo "GRAVITY_PRIV_ROOT=$PRIV" >> "$GITHUB_ENV"
      - name: Run independent source-free test suite and integrate official Gravity into a versioned SQLite COPY
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAVITY_PRIV_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_nba_gravity_leaders_2026.py \
            gamepulse/fusion/query_igp_blueprint_native_shot_gravity_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_nba_gravity_leaders_2026.py'
          SNAP="$GITHUB_WORKSPACE/public_nba_gravity_leaders_2026_27_current.json"
          PREFIX=gamepulse/fusion/materialized/igp_blueprint_native_52_20261028
          TAG="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_sha256"][:12])' "$SNAP")"
          OUT="$PREFIX/blueprint_native_plus_nba_gravity_$TAG.sqlite"
          QA="gamepulse/fusion/qa/igp_progress_20261028/nba_season_gravity_leaders_$TAG.json"
          test ! -e "$OUT" && test ! -e "$QA"
          python3 gamepulse/fusion/igp_nba_gravity_leaders_2026.py \
            --snapshot "$SNAP" \
            --baseline "$PREFIX/blueprint_native.sqlite" \
            --out "$OUT" --qa "$QA" --require-52
          python3 gamepulse/fusion/query_igp_blueprint_native_shot_gravity_2026.py \
            --db "$OUT" --kind gravity-leaders --limit 1 > "$RUNNER_TEMP/gravity-top.json"
          python3 gamepulse/fusion/query_igp_blueprint_native_shot_gravity_2026.py \
            --db "$OUT" --kind gravity-release-crosswalk --player 1642263 \
            --limit 10 > "$RUNNER_TEMP/gravity-reed-crosswalk.json"
          python3 - "$OUT" "$QA" <<'PY'
          import json,sqlite3,sys
          from pathlib import Path
          out,qa=map(Path,sys.argv[1:])
          q=json.loads(qa.read_text())
          with sqlite3.connect(out) as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM source_games").fetchone()[0]==52
              assert db.execute("SELECT COUNT(*) FROM native_shots").fetchone()[0]==8608
              assert db.execute("SELECT COUNT(*) FROM game_featured_gravity").fetchone()[0]==102
              assert db.execute("SELECT COUNT(*) FROM nba_official_gravity_leaders").fetchone()[0]==q["qualified_nba_leader_rows"]
              assert db.execute("SELECT COUNT(*) FROM nba_official_gravity_receipt").fetchone()[0]==1
          assert len(json.loads(Path(__import__("os").environ["RUNNER_TEMP"],"gravity-top.json").read_text()))==1
          print("OFFICIAL_GRAVITY_SQLITE_SOURCE_CONSERVATION_AND_QUERY_PASS",
                q["qualified_nba_leader_rows"],q["release_player_crosswalk_rows"])
          PY
          echo "GRAVITY_VERSIONED_OUTPUT=$OUT" >> "$GITHUB_ENV"
          echo "GRAVITY_VERSIONED_QA=$QA" >> "$GITHUB_ENV"
      - name: Commit and verify ONLY private combined SQLite and provenance QA to PR 776
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAVITY_PRIV_ROOT"
          git config user.name "NBA Gravity season private integration"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add --sparse -f "$GRAVITY_VERSIONED_OUTPUT" "$GRAVITY_VERSIONED_QA"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -qm "data(gamepulse): index native NBA season Gravity leaders without altering Blueprint sources"
          for attempt in 1 2 3 4 5 6; do
              git fetch -q origin "$BRANCH"
              git rebase -q "origin/$BRANCH"
              if git push -q origin HEAD:refs/heads/"$BRANCH"; then
                  echo NBA_OFFICIAL_GRAVITY_LEADERS_PRIVATE_SQLITE_COMMITTED
                  exit 0
              fi
              sleep "$attempt"
          done
          echo NBA_GRAVITY_PRIVATE_PUBLISH_FAILED >&2
          exit 16
