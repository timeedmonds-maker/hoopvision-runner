name: Rockets Dallas official NBA IGP32 ten player plus ball 10Hz first half
# Fail closed official NBA.com PBP + boxscore; ORIGINAL NBA licensed SDK
# source is re-acquired only when archived release APIs are rate limited.
# Private 104 git source recovery is additive and SHA, not a fake PBP/identity tier.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-0022600021-official-10hz.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rockets-dallas-igp32-firsthalf-auth-sdk-source-reacquire
  cancel-in-progress: false
jobs:
  official-10hz:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      ACCEPTED_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      NBA_GAME_ID: '0022600021'
      GAME_TIPOFF_UTC: '2026-10-31T00:00:00Z'
      GAMEPULSE_LIVE_ELAPSED_FASTLANE: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify public privacy and authenticated git without GitHub API
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          ROOT="$RUNNER_TEMP/igp32-rockets-source-verified"
          mkdir -p "$ROOT"
          echo "REPLAY_ROOT=$ROOT" >> "$GITHUB_ENV"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b main \
            "https://github.com/$PRIVATE.git" "$ROOT/private-main"
          git -C "$ROOT/private-main" sparse-checkout set gamepulse/live
          git clone -q --filter=blob:none --depth=1 --sparse -b "$ACCEPTED_BRANCH" \
            "https://github.com/$PRIVATE.git" "$ROOT/accepted"
          git -C "$ROOT/accepted" sparse-checkout set gamepulse/fusion
          test -s "$ROOT/private-main/gamepulse/live/igp32_0021_official_10hz_replay.py"
          test -s "$ROOT/accepted/gamepulse/fusion/igp_v32_default_tracking_engine_v1.py"
          echo PRIVATE_ACCEPTED_GIT_KERNEL_AND_OFFICIAL_SOURCE_CODE_READY
      - name: Read previously committed immutable licensed SDK and firstparty official NBA PBP
        run: |
          set -euo pipefail
          SRC="$REPLAY_ROOT/private-main/gamepulse/live/materialized/igp32_0022600021_firsthalf_official_10hz"
          test -d "$SRC/original_SDK_source_20261031_reacquired"
          cp "$SRC/original_SDK_source_20261031_reacquired"/firsthalf-block-*.tar.gz "$REPLAY_ROOT/"
          cp "$SRC/original_SDK_source_20261031_reacquired"/firsthalf-block-*.json "$REPLAY_ROOT/"
          test "$(find "$REPLAY_ROOT" -maxdepth 1 -name 'firsthalf-block-*.tar.gz' | wc -l)" -eq 10
          test "$(find "$REPLAY_ROOT" -maxdepth 1 -name 'firsthalf-block-*.json' | wc -l)" -eq 10
          for name in official_nba_game_first_party_html.html official_nba_box_first_party_html.html official_nba_page_extracted_pbp.json official_nba_html_extracted_boxscore.json; do
            cp "$SRC/$name" "$REPLAY_ROOT/$name"
            test -s "$REPLAY_ROOT/$name"
          done
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ["REPLAY_ROOT"])
          for k in range(10):
              name="firsthalf-block-"+str(k)
              m=json.loads((root/(name+".json")).read_bytes())
              digest=hashlib.sha256((root/(name+".tar.gz")).read_bytes()).hexdigest()
              assert m["archive_sha256"]==digest and m["game_id"]=="0022600021"
          a=json.loads((root/"official_nba_page_extracted_pbp.json").read_bytes())
          b=json.loads((root/"official_nba_html_extracted_boxscore.json").read_bytes())
          assert a["game"]["gameId"]==b["game"]["gameId"]=="0022600021"
          assert len(a["game"]["actions"])>=400
          print("SHA_PINNED_ORIGINAL_SDK_TEN_PARTS_AND_OFFICIAL_NBA_FIRSTHALF_SOURCE_READY",
                len(a["game"]["actions"]))
          PY
      - name: Run actual accepted IGP3.2 first-half official-ten ten Hz engine
        run: |
          set -euo pipefail
          export PYTHONPATH="$REPLAY_ROOT/accepted/gamepulse/fusion"
          python3 -m py_compile "$REPLAY_ROOT/private-main/gamepulse/live/igp32_0021_official_10hz_replay.py"
          python3 "$REPLAY_ROOT/private-main/gamepulse/live/igp32_0021_official_10hz_replay.py" \
             --root "$REPLAY_ROOT" \
             --qa "$REPLAY_ROOT/igp32_0021_firsthalf_10hz_official_qa.json" \
             --out "$REPLAY_ROOT/igp32-0022600021-firsthalf-official-ten-plus-ball-10hz.jsonl.gz"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["REPLAY_ROOT"])
          q=json.loads((p/"igp32_0021_firsthalf_10hz_official_qa.json").read_text())
          c=q["live_10hz_counts"]
          assert q["real_official_NBA_PBP_and_starting_rosters_recovered"] is True
          assert q["official_pbp_starters_and_substitutions_replayed"] is True
          assert c["live_10hz_grid_total"]>100 and c["live_10hz_complete_ten_ball"]>=0
          assert c["live_10hz_complete_ten_ball"]==(
             c["live_10hz_baseline_800_complete"]+
             c.get("live_10hz_new_ball80_complete",0)+c.get("live_10hz_new_player350_complete",0))
          assert hashlib.sha256((p/q["full_scene_private_asset"]).read_bytes()).hexdigest()==q["full_scene_private_asset_sha256"]
          print("TRUE_NBA_OFFICIAL_IGP32_Q1Q2_10HZ_PASS",c["live_10hz_grid_total"],
                c["live_10hz_complete_ten_ball"],q["accepted_IGP32_complete_pct"])
          PY
      - name: Commit original replay source and 10Hz ten-player ball result privately via authenticated git
        run: |
          set -euo pipefail
          DEST="$REPLAY_ROOT/private-main/gamepulse/live/materialized/igp32_0022600021_firsthalf_official_10hz"
          mkdir -p "$DEST/original_SDK_source_20261031_reacquired"
          cp "$REPLAY_ROOT"/firsthalf-block-*.tar.gz "$DEST/original_SDK_source_20261031_reacquired/"
          cp "$REPLAY_ROOT"/firsthalf-block-*.json "$DEST/original_SDK_source_20261031_reacquired/"
          cp "$REPLAY_ROOT/igp32-0022600021-firsthalf-official-ten-plus-ball-10hz.jsonl.gz" "$DEST/"
          cp "$REPLAY_ROOT/igp32_0021_firsthalf_10hz_official_qa.json" "$DEST/"
          cp "$REPLAY_ROOT/official_nba_game_first_party_html.html" "$DEST/"
          cp "$REPLAY_ROOT/official_nba_box_first_party_html.html" "$DEST/"
          cp "$REPLAY_ROOT/official_nba_page_extracted_pbp.json" "$DEST/"
          cp "$REPLAY_ROOT/official_nba_html_extracted_boxscore.json" "$DEST/"
          cp "$REPLAY_ROOT/igp32_0021_official_html_extract_qa.json" "$DEST/"
          cp "$REPLAY_ROOT/igp32_0021_official_box_html_qa.json" "$DEST/"
          cd "$REPLAY_ROOT/private-main"
          git config user.name "IGP32 Original NBA Official Source QA"
          git config user.email "igp-source-qa@users.noreply.github.com"
          git add -f gamepulse/live/materialized/igp32_0022600021_firsthalf_official_10hz
          # Preserve original first-party NBA HTML byte-for-byte (including its own whitespace).
          git -c core.whitespace=-blank-at-eol diff --cached --check
          git commit -qm "data(igp): Rockets Dallas first half official NBA PBP ten plus ball 10Hz v3.2 private SHA"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main
            git rebase -q origin/main
            if git push -q origin HEAD:refs/heads/main; then
              echo PRIVATE_ORIGINAL_NBA_SOURCE_AND_OFFICIAL_TEN_10HZ_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 20
