name: IGP source-native official ten anchors and 2-5s gap two-game QA (private only)
# Original licensed NBA XYZ remains in private 104. Public logs contain no coordinates.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-igp-fast-lineup-two-game-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: igp-fast-lineup-two-game-private-qa
  cancel-in-progress: false
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public/private boundary and hydrate private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
          echo IGP_FAST_TWO_GAME_EPHEMERAL_PRIVATE_SOURCE
      - name: Run five source-free regressions and masked original-XYZ two-game QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_source_anchored_lineup_recovery_2026.py \
            gamepulse/fusion/igp_tracking_fast_extension_qa_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_source_anchored_lineup_recovery_2026.py'
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_fast_source_lineup_and_wide_gap_two_game_qa.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_tracking_fast_extension_qa_2026.py \
            --root . --games 0022600009 0022600092 --out "$OUT" \
            > "$RUNNER_TEMP/igp-fast-private-qa.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["schema"]=="gamepulse.igp-fast-source-anchored-lineup-and-wider-gap-qa.v1"
          assert set(x["games"])=={"0022600009","0022600092"}
          assert x["cohort_totals"]["games"]==2
          assert x["original_XYZ_immutable"] is True
          assert x["source_anchored_lineup_not_claimed_live_ball"] is True
          assert x["B_extended_gap_not_promoted_until_holdout_errors_reviewed"] is True
          for gid,expected in (("0022600009",34979),("0022600092",31030)):
              g=x["games"][gid]
              assert g["original_frame_count"]==expected
              assert sum(g["source_anchored_ten_status"].values())==expected
              c=g["strict_NBA_lineup_comparison"]
              assert c["strict_eligible_frames"]+c["outside_strict_source_frames"]==expected
              for dur in ("2000","3000","5000"):
                  m=g["long_gap_B_4sec_each_side_7sec_total_cap_not_promoted"][dur]
                  assert m["reconstructed"]<=m["masked_original_XYZ_targets"]
                  assert 0<=m["coverage_pct"]<=100
          print("IGP_FAST_SOURCE_TWO_GAME_QA_RECORDED_PRIVATE_ONLY_NOT_CERTIFIED")
          PY
          git diff --exit-code -- gamepulse/fusion
      - name: Commit only aggregate experimental QA to private PR branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_fast_source_lineup_and_wide_gap_two_game_qa.json
          git config user.name 'Game Pulse Free CPU QA'
          git config user.email 'gamepulse-integrity@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$OUT"
          git commit -qm "qa(igp): source-native ten and longer-gap masked-source two-game diagnostic (unpromoted)"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo IGP_FAST_TWO_GAME_QA_PRIVATE_PUBLISHED_NO_PHYSICAL_CERTIFICATION
              exit 0
            fi
            sleep "$attempt"
          done
          echo PRIVATE_QA_PUSH_FAILED
          exit 13
