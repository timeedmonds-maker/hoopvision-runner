name: IGP authenticated private release browser-route asset probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-private-release-browser-download-smoke.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and test no-REST authorized original SDK release download
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          URL='https://github.com/timeedmonds-maker/104/releases/download/gamepulse-sdk-0022600105/sdk-part-00.tar.gz'
          SHA='adea9b6dc2ef4b18c407049a1ad4ba10611f2ee7c5aa4605c04db17d1e5fdf80'
          FILE="$RUNNER_TEMP/igp-original-0105-part00.tar.gz"
          CODE=$(curl -L -sS -w '%{http_code}' -o "$FILE" --max-time 45 \
              --proto '=https' --proto-redir '=https' \
              -H "Authorization: Bearer $GH_TOKEN" "$URL" || true)
          if test "$CODE" = 200 && test "$(stat -c%s "$FILE")" = 432352 &&
             echo "$SHA  $FILE" | sha256sum -c - >/dev/null 2>&1; then
            echo IGP_PRIVATE_RELEASE_BROWSER_BEARER_SHA_VERIFIED
            exit 0
          fi
          echo "IGP_RELEASE_BROWSER_BEARER_UNAVAILABLE_HTTP_$CODE"
          CODE=$(curl -L -sS -w '%{http_code}' -o "$FILE" --max-time 45 \
              --proto '=https' --proto-redir '=https' \
              -u "x-access-token:$GH_TOKEN" "$URL" || true)
          if test "$CODE" = 200 && test "$(stat -c%s "$FILE")" = 432352 &&
             echo "$SHA  $FILE" | sha256sum -c - >/dev/null 2>&1; then
            echo IGP_PRIVATE_RELEASE_BROWSER_BASIC_SHA_VERIFIED
            exit 0
          fi
          echo "IGP_RELEASE_BROWSER_BASIC_UNAVAILABLE_HTTP_$CODE"
          echo IGP_NO_REST_BROWSER_ROUTE_NOT_AVAILABLE
          exit 5
