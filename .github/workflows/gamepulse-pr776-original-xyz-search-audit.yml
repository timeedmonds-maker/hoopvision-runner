name: PR776 private 532 XYZ searchable-source acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-original-xyz-search-audit.yml', 'tools/public_content_guard.py']
permissions:
  contents: read
concurrency:
  group: pr776-private-original-xyz-search-audit
  cancel-in-progress: false
jobs:
  verify-private-original-xyz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public files and read authenticated private Git source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/git-askpass-private" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/git-askpass-private"
          export GIT_ASKPASS="$RUNNER_TEMP/git-askpass-private" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/original-private"
          git -C "$RUNNER_TEMP/original-private" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/original-private" >> "$GITHUB_ENV"
          echo PRIVATE_GIT_SOURCE_AUTHENTICATED
      - name: Run private episode query safety regression tests
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_original_xyz_episode_season_2026.py \
            gamepulse/fusion/tests/test_query_original_xyz_episode_season_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_query_original_xyz_episode_season_2026.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_event_episode_crosswalk_2026.py'
      - name: Audit all 532 original XYZ source files and report only aggregate counts
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 gamepulse/fusion/query_original_xyz_episode_season_2026.py \
            --root . --verify-all --out "$RUNNER_TEMP/private_xyz_532.json"
          python3 - "$RUNNER_TEMP/private_xyz_532.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          x=d["source_inventory"]
          assert (x["games"],x["indexed_episodes"],x["candidate_native_frames"],
                  x["ten_plus_direct_ball_frames"])==(28,532,29297,23469)
          assert (x["verified_original_xyz_episodes"],
                  x["verified_original_xyz_frames"])==(532,29297)
          assert d["matched_episodes"]==532 and d["physical_possessions_certified"]==0
          assert d["original_native_clock_independently_validated"] is False
          assert d["official_nba_action_to_native_frame_clock_validated"] is False
          assert all(e["original_xyz_source_hash_verified_this_query"] for e in d["episodes"])
          assert all("frames" not in e for e in d["episodes"])
          print("ORIGINAL_PRIVATE_XYZ_532_ACCEPTED",
                "games=28 episodes=532 source_frames=29297",
                "ten_plus_ball_frames=23469 sha_verified_episode_files=532",
                "certified_physical_possessions=0")
          PY
      - name: Query a real SHA-verified NBA action and bounded original XYZ
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN
          cd "$PRIVATE_ROOT"
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          from query_original_xyz_episode_season_2026 import query
          z=query(".",game_id="0022600009",episode_id="0022600009-P1-NBAF0002",
                  nba_action_number=13,include_xyz=True,max_frames=3)
          assert z["matched_episodes"]==1 and z["physical_possessions_certified"]==0
          e=z["episodes"][0]
          assert len(e["frames"])==3 and e["candidate_native_frames"]==49
          assert e["ten_players_plus_direct_ball_frames"]==43
          assert e["original_xyz_source_hash_verified_this_query"]
          assert e["exact_action_to_frame_association_certified"] is False
          print("ORIGINAL_PRIVATE_XYZ_SEARCH_ACCEPTED",
                "NBA_action=13 episode=0022600009-P1-NBAF0002",
                "returned_frames=3 source_frames=49 ten_plus_ball=43")
          PY
