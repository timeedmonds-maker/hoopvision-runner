name: Freeview Amen 732 SAM2.1 CPU native masks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-sam21-cpu-masks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freeview-amen732-sam21-original-mask
  cancel-in-progress: false
jobs:
  sam21:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      SAM2_BUILD_CUDA: '0'
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          v=scan(['.github/workflows/freeview-amen732-sam21-cpu-masks.yml'])
          if v:raise SystemExit("PUBLIC_CPU_CONTENT_GUARD_FAIL")
          print("PUBLIC_CPU_PRIVACY_GUARD_PASS")
          PY
          test -n "$GH_TOKEN"
          # A successful authenticated private Release download below validates access;
          # avoid a redundant private-repo API request that consumes shared user limits.
      - name: Original NBA source and bounded research mask
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/input" "$TMP/model" "$TMP/out"
          # GitHub shared token may be temporarily rate-limited by unrelated jobs.
          # Bound retries before touching any GPU/model work.
          download_source() { gh release download 'freeview-native-0022600009-732' \
            --repo timeedmonds-maker/104 --dir "$TMP/input" \
            --pattern '*.mp4' --pattern 'source_manifest.json' \
            --pattern 'native_presentation_timestamps.json'; }
          download_source || { sleep 65; download_source; } || { sleep 125; download_source; }
          test -s "$TMP/input/source_manifest.json"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_sam21_ball_mask_cpu.py?ref=70792f6ed18e35f1ff5cfca5e2c9314c8f6a5c96' \
            --jq .content | base64 -d > "$TMP/script.py"
          python3 -m pip install --quiet --disable-pip-version-check \
            'numpy<2' 'opencv-python-headless==4.10.0.84' 'pillow>=10,<12' \
            'hydra-core>=1.3,<1.4' 'iopath>=0.1.10,<0.2'
          python3 "$TMP/script.py" --selftest
          echo SAM21_CPU_SOURCE_MASK_SELFTEST_PASS
          python3 -m pip install --quiet --disable-pip-version-check \
            'torch==2.5.1' 'torchvision==0.20.1' \
            --index-url 'https://download.pytorch.org/whl/cpu'
          git clone --depth 1 --quiet https://github.com/facebookresearch/sam2.git "$TMP/model/sam2"
          MODEL_COMMIT="$(git -C "$TMP/model/sam2" rev-parse HEAD)"
          python3 -m pip install --quiet --disable-pip-version-check \
            -e "$TMP/model/sam2" --no-deps --no-build-isolation
          curl -fsSL --retry 2 --connect-timeout 20 \
            'https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_tiny.pt' \
            -o "$TMP/model/sam2.1_hiera_tiny.pt"
          test "$(stat -c %s "$TMP/model/sam2.1_hiera_tiny.pt")" -gt 10000000
          echo SAM21_SOURCE_AND_CHECKPOINT_RETRIEVED
          python3 "$TMP/script.py" \
            --root "$TMP/input" --checkpoint "$TMP/model/sam2.1_hiera_tiny.pt" \
            --out "$TMP/out" --model-commit "$MODEL_COMMIT"
          python3 - "$TMP/out/event732-native-sam21-mask-qa.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1]))
          assert len(o["native_masks"])==4
          assert not o["source_pixel_contact_certified"]
          assert not o["metric_camera_extrinsics_certified"]
          print("SAM21_SOURCE_MASK_QA_COMPLETE",[(k,v["mask_state"])
                for k,v in o["native_masks"].items()])
          PY
          # Diagnostic overlays retain original NBA RGB; derived artifacts remain PRIVATE.
          python3 - "$TMP/input" "$TMP/out" <<'PY'
          import json,sys,cv2
          from pathlib import Path
          root,out=map(Path,sys.argv[1:])
          qa=json.loads((out/'event732-native-sam21-mask-qa.json').read_text())
          src=json.loads((root/'source_manifest.json').read_text())
          feed={r['label']:r for r in src['feeds']}
          for label,item in qa['native_masks'].items():
              cap=cv2.VideoCapture(str(root/feed[label]['file']))
              try:
                  cap.set(cv2.CAP_PROP_POS_FRAMES,item['native_frame_index'])
                  ok,frame=cap.read()
                  assert ok and frame.shape[:2]==(540,960),label
              finally:
                  cap.release()
              mask=cv2.imread(str(out/item['mask_file']),cv2.IMREAD_GRAYSCALE)
              assert mask is not None and mask.shape==frame.shape[:2]
              edges=cv2.Canny(mask,100,180)
              frame[edges>0]=(40,220,40)
              x,y=item['visual_point_seed_xy']
              cv2.drawMarker(frame,(x,y),(0,255,255),cv2.MARKER_CROSS,18,2)
              cv2.rectangle(frame,(0,0),(960,43),(15,15,20),-1)
              cv2.putText(frame,label+' | '+item['mask_state']+' | ORIGINAL RGB',
                          (13,29),cv2.FONT_HERSHEY_SIMPLEX,.61,(245,245,245),2,cv2.LINE_AA)
              name='amen732-sam21-overlay-'+label.lower().replace(' ','-')+'.jpg'
              assert cv2.imwrite(str(out/name),frame,[cv2.IMWRITE_JPEG_QUALITY,88])
              print('SAM21_VISUAL_QA_FRAME_PREPARED',label,item['mask_state'])
          PY
          TAG='freeview-native-0022600009-732'
          gh release upload "$TAG" "$TMP/out/"* \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$TMP/release_receipt.json"
          python3 - "$TMP/out" "$TMP/release_receipt.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assets={a["name"]:a for a in json.load(open(sys.argv[2]))["assets"]}
          for p in root.iterdir():
              assert assets[p.name]["digest"]=="sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(),p.name
          print("SAM21_FOUR_NATIVE_MASKS_PRIVATE_SHA256_PASS")
          PY
          # Store an independently browsable private QA receipt and native-image overlays.
          python3 - "$TMP/out" <<'PY'
          import base64,json,subprocess,sys
          from pathlib import Path
          out=Path(sys.argv[1]);branch='research/amen-wemby-freeze-spin-20261024'
          prefix='repos/timeedmonds-maker/104/contents/'
          files=[out/'event732-native-sam21-mask-qa.json']
          files+=sorted(out.glob('amen732-sam21-overlay-*.jpg'))
          assert len(files)==5
          for src in files:
              dest='hoopvision/freeview/fixtures/'+src.name
              data={'branch':branch,
                    'message':'qa: source NBA Amen mask visual check '+src.name,
                    'content':base64.b64encode(src.read_bytes()).decode('ascii')}
              old=subprocess.run(['gh','api',prefix+dest+'?ref='+branch],
                                 capture_output=True,text=True)
              if old.returncode==0:
                  oldobj=json.loads(old.stdout)
                  if base64.b64decode(oldobj.get('content','').replace('\n',''))==src.read_bytes():
                      print('SAM21_PRIVATE_QA_UNCHANGED',src.name)
                      continue
                  data['sha']=oldobj['sha']
              req=out/'_private_put.json';req.write_text(json.dumps(data))
              result=subprocess.run(['gh','api','-X','PUT',prefix+dest,'--input',str(req)],
                                    capture_output=True,text=True)
              req.unlink(missing_ok=True)
              assert result.returncode==0,(src.name,result.stderr[-300:])
              print('SAM21_PRIVATE_QA_COMMITTED',src.name,len(src.read_bytes()))
          PY
