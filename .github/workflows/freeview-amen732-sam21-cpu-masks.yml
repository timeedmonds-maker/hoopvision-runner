name: Freeview Amen 732 SAM2.1 CPU native masks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-sam21-cpu-masks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freeview-amen732-sam21-original-mask
  cancel-in-progress: false
jobs:
  sam21:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      SAM2_BUILD_CUDA: '0'
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          v=scan(['.github/workflows/freeview-amen732-sam21-cpu-masks.yml'])
          if v:raise SystemExit("PUBLIC_CPU_CONTENT_GUARD_FAIL")
          print("PUBLIC_CPU_PRIVACY_GUARD_PASS")
          PY
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Original NBA source and bounded research mask
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/input" "$TMP/model" "$TMP/out"
          gh release download 'freeview-native-0022600009-732' \
            --repo timeedmonds-maker/104 --dir "$TMP/input" \
            --pattern '*.mp4' --pattern 'source_manifest.json' \
            --pattern 'native_presentation_timestamps.json'
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_sam21_ball_mask_cpu.py?ref=70792f6ed18e35f1ff5cfca5e2c9314c8f6a5c96' \
            --jq .content | base64 -d > "$TMP/script.py"
          python3 -m pip install --quiet --disable-pip-version-check \
            'numpy<2' 'opencv-python-headless==4.10.0.84' 'pillow>=10,<12' \
            'hydra-core>=1.3,<1.4' 'iopath>=0.1.10,<0.2'
          python3 "$TMP/script.py" --selftest
          echo SAM21_CPU_SOURCE_MASK_SELFTEST_PASS
          python3 -m pip install --quiet --disable-pip-version-check \
            'torch==2.5.1' 'torchvision==0.20.1' \
            --index-url 'https://download.pytorch.org/whl/cpu'
          git clone --depth 1 --quiet https://github.com/facebookresearch/sam2.git "$TMP/model/sam2"
          MODEL_COMMIT="$(git -C "$TMP/model/sam2" rev-parse HEAD)"
          python3 -m pip install --quiet --disable-pip-version-check \
            -e "$TMP/model/sam2" --no-deps --no-build-isolation
          curl -fsSL --retry 2 --connect-timeout 20 \
            'https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_tiny.pt' \
            -o "$TMP/model/sam2.1_hiera_tiny.pt"
          test "$(stat -c %s "$TMP/model/sam2.1_hiera_tiny.pt")" -gt 10000000
          echo SAM21_SOURCE_AND_CHECKPOINT_RETRIEVED
          python3 "$TMP/script.py" \
            --root "$TMP/input" --checkpoint "$TMP/model/sam2.1_hiera_tiny.pt" \
            --out "$TMP/out" --model-commit "$MODEL_COMMIT"
          python3 - "$TMP/out/event732-native-sam21-mask-qa.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1]))
          assert len(o["native_masks"])==4
          assert not o["source_pixel_contact_certified"]
          assert not o["metric_camera_extrinsics_certified"]
          print("SAM21_SOURCE_MASK_QA_COMPLETE",[(k,v["mask_state"])
                for k,v in o["native_masks"].items()])
          PY
          TAG='freeview-native-0022600009-732'
          gh release upload "$TAG" "$TMP/out/"* \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$TMP/release_receipt.json"
          python3 - "$TMP/out" "$TMP/release_receipt.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assets={a["name"]:a for a in json.load(open(sys.argv[2]))["assets"]}
          for p in root.iterdir():
              assert assets[p.name]["digest"]=="sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(),p.name
          print("SAM21_FOUR_NATIVE_MASKS_PRIVATE_SHA256_PASS")
          PY
