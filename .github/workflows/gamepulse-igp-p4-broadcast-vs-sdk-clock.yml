name: IGP P4 original NBA companion Time#show vs independent Broadcast scoreboard clock
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p4-broadcast-vs-sdk-clock.yml']
permissions: {contents: read}
concurrency:
  group: igp-p4-broadcast-sdk-companion-clock
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 6eadbc6242f2592788c9472e1f4d725c115a5798
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Protect original NBA source private checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free tests and actual saved original SDK gameclock vs independent real Broadcast
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_v31_p4_original_companion_clock_crosscheck_v1.py'
          if ! python3 gamepulse/fusion/igp_fusion_v31_p4_original_companion_clock_crosscheck_v1.py --root . --output "$RUNNER_TEMP/original-clock-private.json" > "$RUNNER_TEMP/original-clock-private.log" 2>&1; then
            echo IGP_P4_COMPANION_ORIGINAL_NBA_SOURCE_CLOCK_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          ls=(Path(os.environ['RUNNER_TEMP'])/'original-clock-private.log').read_text(errors='replace').splitlines()
          last=next((z for z in reversed(ls) if z.strip()),'NO_LOG')
          print('IGP_P4_SOURCE_CLOCK_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:80])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'original-clock-private.json').read_text())
          assert q['game_id']=='0022600001'
          assert q['independent_nine_scoreboard_clocks_verified']==9
          assert not q['source_video_PTS_to_native_SDK_UTC_subsecond_certified']
          assert not q['video_physical_hand_control_anchor_certified']
          assert q['physical_possessions_certified']==0
          assert q['independent_ball_3D_groundtruth_scenes']==0
          print('IGP_P4_ORIGINAL_SDK_TO_BROADCAST_GAMECLOCK',json.dumps({
            'saved_companion_events':q['saved_companion_event_records'],
            'Time_show_records':q['saved_companion_Time_show_total'],
            'P4_clock_events':q['fourth_period_Time_show_valid'],
            'video_clock_matches':q['clock_pairs_with_saved_SDK_running_Time_event'],
            'status':q['clock_pair_coherence_status'],
            'worst_clock_match_deviation_ms':q['largest_clockpair_deviation_from_median_ms'],
            'physical_possessions_certified':0},sort_keys=True))
          PY
      - name: Save original per-clock-UTC source crosscheck privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_v31_p4_original_companion_broadcast_clock_crosscheck_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p4-original-clock "origin/$BRANCH"
          cp "$RUNNER_TEMP/original-clock-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): independent NBA Broadcast vs original companion Time#show clock source evidence'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P4_COMPANION_CLOCK_PRIVATE_EVIDENCE_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
