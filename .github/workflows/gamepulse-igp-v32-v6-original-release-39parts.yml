# Download original 39 source-release assets privately. 13 part names do not
# imply full-game tracking. Public Action outputs totals only, no source XYZ.
name: IGP 3.2 V6 39 original SDK release part timebase verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-v6-original-release-39parts.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-v6-release-integrity
  cancel-in-progress: false
jobs:
  original-39:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and original source release SHA regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_v6_original_release_tail_integrity_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_v32_v6_original_release_tail_integrity_v1.py'
          echo IGP_V6_ORIGINAL_SDK_TAR_SHA_SOURCE_FREE_TESTS_PASS
      - name: Download 39 SDK original assets from private GitHub release
        shell: bash
        run: |
          set -euo pipefail
          for gid in 0022600006 0022600111 0022600086; do
            folder="$RUNNER_TEMP/sdk/$gid"
            mkdir -p "$folder"
            gh release download "gamepulse-sdk-$gid" \
              -R timeedmonds-maker/104 \
              -p 'sdk-part-*.tar.gz' -D "$folder" --clobber > /dev/null
            count="$(find "$folder" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)"
            test "$count" -eq 13 || {
              echo IGP_V6_NOT_13_ORIGINAL_SHA_RELEASE_ASSETS
              exit 41
            }
          done
          echo IGP_V6_ORIGINAL_ALL39_SDK_RELEASE_ASSETS_DOWNLOADED_PRIVATE
      - name: Verify original archive raw/simplified timestamps versus immutable SDK index
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_v6_original_release_tail_integrity_v1.py \
            --root . --archives "$RUNNER_TEMP/sdk" \
            --out "$RUNNER_TEMP/igp-v6-private-qa.json" \
            > "$RUNNER_TEMP/igp-v6-source-private.log" 2>&1 || {
              echo IGP_V6_ORIGINAL_ARCHIVE_SHA_OR_TIMESTAMP_CONSERVATION_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'igp-v6-source-private.log').read_text(errors='replace').splitlines()
          v=next((x for x in reversed(s) if re.match(
            r'^(?:ValueError|KeyError|TypeError|AssertionError|FileNotFoundError|ImportError|IndexError):',x)),None)
          print('IGP_V6_ORIGINAL_RELEASE_PRIVATE_FAILURE',
                re.sub(r'[0-9]{4,}','[ID]',v or 'UNKNOWN')[:160])
          PY
              exit 42
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'igp-v6-private-qa.json'
          q=json.loads(p.read_bytes());c=q['counts']
          assert c['games']==3 and c['original_archives_verified']==39
          assert c['original_frames_reconciled']==60601
          assert q['new_original_SDK_source_frames_recovered']==0
          assert not q['original_coordinate_files_or_PBP_modified']
          assert all(q['games'][gid]['original_tar_raw_and_simple_reconciled'] for gid in q['games'])
          print('IGP_V6_39_ORIGINAL_SDK_RELEASE_ARCHIVES_SHA_AND_TIMESTAMP_ACCEPTED',
             json.dumps({'games':3,'original_archives_SHA_verified':39,
               'unique_native_source_frames_reconciled':c['original_frames_reconciled'],
               'original_parts_empty_of_native_keyframes':c['original_archives_empty_of_native_frames'],
               '0006_empty_original_parts':q['games']['0022600006']['original_archive_parts_with_no_native_keyframes'],
               '0111_empty_original_parts':q['games']['0022600111']['original_archive_parts_with_no_native_keyframes'],
               '0086_empty_original_parts':q['games']['0022600086']['original_archive_parts_with_no_native_keyframes'],
               'new_original_source_positions':0},sort_keys=True))
          PY
      - name: Commit original SDK release forensic receipt only privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_v32/igp_v32_v6_threegame_original_release_13part_vs_native_source_v1.json
          mkdir -p "$(dirname "$receipt")"
          cp "$RUNNER_TEMP/igp-v6-private-qa.json" "$receipt"
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$receipt"
          git diff --cached --check
          git commit -q -m 'qa(igp): exact 39 original SDK tarball SHA and keyframe-vs-index integrity'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_V6_RELEASE_SOURCE_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
