name: IGP P3 heldout ball handler source-anchor pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-new-handler-ball-anchor-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-ball-handler-newfour
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 75d810a95be86c1ce54e1027b6996c74796166c5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and exact private source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test no source leaks and inspect four unseen games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_ball_handler_anchor_pilot_v1.py'
          python3 gamepulse/fusion/igp_68_p3_ball_handler_anchor_pilot_v1.py \
            --root . --output "$RUNNER_TEMP/p3-handler-private.json" \
            > "$RUNNER_TEMP/p3-handler-private.log" 2>&1 || {
              echo P3_FOUR_NEW_GAME_HANDLER_SOURCE_QA_FAILED
              tail -n 12 "$RUNNER_TEMP/p3-handler-private.log"
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'p3-handler-private.json').read_bytes())
          assert len(q['heldout_games_not_in_original_four_or_previous_ten'])==4
          assert q['no_source_modified'] and q['no_model_promoted']
          assert q['target_original_ball_2400ms_contiguous_blackout']
          assert q['no_68game_tracking_coverage_gain']
          assert q['uses_original_ball_source_at_endpoints_outside_mask_only']
          assert q['pooled_heldout']['source_masked_ball_targets']>=100
          print('P3_HANDLER_ANCHOR_FOUR_NEW_SOURCE_GAMES',json.dumps({
            'source_target_count':q['pooled_heldout']['source_masked_ball_targets'],
            'stable_handler_candidates':q['pooled_heldout']['stable_handler_proxy_cases'],
            'ball_p95_ft':{k:v['p95_ft'] for k,v in q['pooled_heldout']['all_source_masked_3d_ft'].items()},
            'context_ball_z_p95_ft':q['pooled_heldout']['context_only_z_absolute_ft']['p95_ft'],
          },sort_keys=True))
          PY
      - name: Save private SHA-backed research QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_newfour_ball_handler_anchor_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B handler-ball "origin/$BRANCH"
          cp "$RUNNER_TEMP/p3-handler-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): four new games source-only ball handler anchor experimental accuracy'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo P3_HANDLER_SOURCE_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
