name: Opening game live replay and xFG check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opening-game-live-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: Check opening game
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests

          gid='0022600001'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          clip_headers={'User-Agent':UA,'Referer':'https://clips.nba.com/','Accept':'text/html,*/*'}
          xfg_headers={'User-Agent':UA,'Referer':'https://www.nba.com/','Origin':'https://www.nba.com','Accept':'application/json, text/plain, */*'}

          def clip(n):
              u=f'https://clips.nba.com/?gameNo={gid}&eventNum={n}&source=grs'
              rec={'event_num':n}
              try:
                  r=requests.get(u,headers=clip_headers,timeout=(5,18))
                  rec['status']=r.status_code
                  rec['bytes']=len(r.content)
                  tm=re.search(r'<title>(.*?)</title>',r.text,re.I|re.S)
                  rec['title']=html.unescape(tm.group(1).strip()) if tm else ''
                  opts=[]
                  for m in re.finditer(r'<option\s+value=["\']([^"\']+)["\']([^>]*)>(.*?)</option>',r.text,re.I|re.S):
                      url=html.unescape(m.group(1).strip())
                      attrs=m.group(2)
                      label=re.sub(r'<[^>]+>','',html.unescape(m.group(3))).strip()
                      if '.m3u8' in url.lower():
                          opts.append({'label':label or 'unlabelled','selected':'selected' in attrs.lower()})
                  rec['angles']=opts
                  rec['angle_count']=len(opts)
              except Exception as e:
                  rec['error']=repr(e)
              return rec

          events=[]
          with ThreadPoolExecutor(max_workers=14) as ex:
              futs=[ex.submit(clip,n) for n in range(1,241)]
              for f in as_completed(futs):
                  events.append(f.result())
          events.sort(key=lambda x:x['event_num'])
          viable=[r for r in events if r.get('angle_count',0)>0]
          labels=sorted({a['label'] for r in viable for a in r.get('angles',[])})
          max_angles=max((r.get('angle_count',0) for r in viable),default=0)
          max_events=[
              {'event_num':r['event_num'],'title':r.get('title'),'angle_count':r.get('angle_count'),
               'labels':[a['label'] for a in r.get('angles',[])]}
              for r in viable if r.get('angle_count',0)==max_angles
          ][:12]

          xfg=[]
          for name,pid in [('Jayson Tatum',1628369),('Cade Cunningham',1630595)]:
              rec={'player':name,'player_id':pid}
              try:
                  rr=requests.get('https://stats.gleague.nba.com/stats/shotqualityvideologs',
                                  params={'GameID':gid,'PlayerID':pid},headers=xfg_headers,timeout=(8,45))
                  rec['http_status']=rr.status_code
                  rec['response_bytes']=len(rr.content)
                  rr.raise_for_status()
                  j=rr.json()
                  shots=j.get('shotList') or []
                  rec['response_game_id']=str(j.get('gameId') or '').zfill(10)
                  rec['shot_count']=len(shots)
                  rows=[]
                  for z in shots:
                      try:q=float(z.get('shotQuality'))
                      except Exception:q=None
                      rows.append({
                          'event_num':z.get('eventNum'),'period':z.get('period'),'game_clock':z.get('gameClock'),
                          'action_type':z.get('actionType'),'shot_type':z.get('shotType'),
                          'success':z.get('success'),'shot_quality':q,
                          'xfg_pct':100*q if q is not None and q<=1.5 else q
                      })
                  rec['numeric_xfg_count']=sum(1 for z in rows if z['shot_quality'] is not None)
                  rec['sample']=rows[:8]
              except Exception as e:
                  rec['error']=repr(e)
              xfg.append(rec)

          result={
              'game_id':gid,
              'scanned_event_range':[1,240],
              'hls_event_page_count':len(viable),
              'distinct_camera_labels':labels,
              'max_angle_count_any_event':max_angles,
              'max_angle_events':max_events,
              'xfg':xfg,
          }
          out=Path('experiment_results/opening_game_live')
          out.mkdir(parents=True,exist_ok=True)
          (out/'latest.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hoopvision-public-probe
          git config user.email hoopvision-public-probe@users.noreply.github.com
          git add experiment_results/opening_game_live/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record opening game replay and xFG result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
