name: IPPT original NBA fresh native SDK lastTouch vs all official PBP actor IDs 36 games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-native-lasttouch-all-pbp-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  lasttouch-original-pbp:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: 014bfed351900bf1b75264052445440cd7a8cf0e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard and source-pinned original NBA private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
              "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Source-free truth-independent selector and ambiguity regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_all_event_native_lasttouch_correspondence_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_all_event_native_lasttouch_correspondence_2026.py
      - name: First two original NBA games source-native SDK/PBP identity crosscheck
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_event_native_lasttouch_correspondence_2026.py \
            --root . --games 0022600009 0022600092
      - name: Full original 36-game source-native lastTouch/PBP actor identity crosscheck
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_event_native_lasttouch_correspondence_2026.py \
            --root . | tee "$RUNNER_TEMP/ippt_lasttouch_aggregate_only.log"
          echo "IPPT_ALL36_PBP_NATIVE_FRESH_LASTTOUCH_ACTOR_QA_PASS"
      - name: Post aggregate-only source-safe receipt to public Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ippt_lasttouch_aggregate_only.log"
          report={"github_run_id":os.environ["GITHUB_RUN_ID"],
                  "prior_job_status":os.environ["QA_JOB_RESULT"],
                  "expected_private_SHA":"014bfed351900bf1b75264052445440cd7a8cf0e"}
          if p.exists():
            z=[line.partition(" ")[2] for line in p.read_text().splitlines()
               if line.startswith("IPPT_ALL36_NATIVE_LASTTOUCH_VS_PBP_EVENT_ID_BENCHMARK ")]
            if len(z)==1:
              j=json.loads(z[0]);report.update({"games":j["games"],"counts":j["counts"],
                  "physical_touch_time_certified":False})
          (Path(os.environ["RUNNER_TEMP"])/"ippt_lasttouch_qa_note.md").write_text(
              "Aggregate original NBA source-native fresh lastTouch state vs PBP actor IDs. No individual licensed original XYZ, actor ID, private time or private source published.\n\n~~~json\n"+
              json.dumps(report,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          gh issue comment 133 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_lasttouch_qa_note.md"
# No original NBA private source actor XYZ, timestamps or personnel published.
