name: IGP P3 NBA ball physics paired original source mask development and disjoint validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-igp-p3-ball-physics-dev16-unseen8.yml'
permissions: {contents: read}
concurrency:
  group: igp-p3-ball-physics-dev16-unseen8
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: f1d12e1e54449dca21f761e0fea9d95b050e94b4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Protect licensed NBA source and original QA branch SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free tests and SHA-matched original NBA masked ball physics evaluation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_ball_physics_disjoint_validation_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_ball_physics_disjoint_validation_v1.py --root . --output "$RUNNER_TEMP/private-ball-physics.json" > "$RUNNER_TEMP/private-ball-physics.log" 2>&1; then
            echo IGP_P3_PRIVATE_BALL_PHYSICS_SOURCE_QA_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'private-ball-physics.log').read_text(errors='replace').splitlines()
          last=next((z for z in reversed(lines) if z.strip()),'NO_LOG')
          print('P3_BALL_PHYSICS_EXCEPTION_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:80])
          print('P3_BALL_PHYSICS_GAMES_DONE',sum(z.startswith('P3_BALL_PHYSICS_HELDOUT_GAME') for z in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'private-ball-physics.json').read_text())
          assert len(q['dev']['games'])==16 and len(q['disjoint_validation']['games'])==8
          assert set(q['dev']['games']).isdisjoint(q['disjoint_validation']['games'])
          assert q['fixed_mode_before_validation']=='half_gravity'
          assert q['blackout_halfwidth_ms']==[200,350,500]
          assert q['canonical_68_research_native_complete']==492617
          assert q['canonical_68_research_10hz_complete']==917686
          assert q['newly_accepted_tracking_scenes']==0
          assert q['no_model_promotion_or_source_mutation']
          assert q['original_sdk_heldout_truth_not_independent_video']
          for group in ('dev','disjoint_validation'):
              for radius in ('200','350','500'):
                  p=q[group]['pooled'][radius]
                  assert p['n']>0
                  assert set(p['models'])==set(q['mode_variants'])
                  assert all(v['three_d_ft']['n']==p['n'] for v in p['models'].values())
          print('IGP_P3_BALL_PHYSICS_ORIGINAL_NBA_DISJOINT_HOLDOUT',json.dumps({
            'dev':{r:{'n':v['n'],
              'linear_p95_ft':v['models']['linear']['three_d_ft']['p95_ft'],
              'half_gravity_p95_ft':v['models']['half_gravity']['three_d_ft']['p95_ft']}
              for r,v in q['dev']['pooled'].items()},
            'unseen':{r:{'n':v['n'],
              'methods':{k:vv['three_d_ft'] for k,vv in v['models'].items()}}
              for r,v in q['disjoint_validation']['pooled'].items()},
            'production_promotions':0},sort_keys=True))
          PY
      - name: Commit private original NBA SDK truth QA receipt only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_ball_physics_disjoint_validation_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-ball-physics "origin/$BRANCH"
          cp "$RUNNER_TEMP/private-ball-physics.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): source masked ballistic NBA ball paired development and disjoint validation'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_BALL_PHYSICS_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
