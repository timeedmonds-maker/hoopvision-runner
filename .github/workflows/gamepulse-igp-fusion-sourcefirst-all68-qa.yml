name: IGP Fusion v3.1 G0 source-first SHA original NBA all68 native and 10Hz acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-fusion-sourcefirst-all68-qa.yml']
permissions: {contents: read}
concurrency:
  group: igp-fusion-v31-sourcefirst-all68
  cancel-in-progress: false
jobs:
  source-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 324bb96df2f30a094f123f034b3c3a2c53e80065
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source confidentiality and SHA pinned original NBA private archive
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Unit regressions for source outside official windows, exact NBA XYZ, safe identity grades
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_source_first_68_query_v1.py'
      - name: Real NBA original source first CLI through unified engine
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_fusion_source_first_68_query_v1.py \
            --root . --game-id 0022600138 --start-utc-ms 1793233762900 --end-utc-ms 1793233763100 \
            --mode 10hz --output "$RUNNER_TEMP/sourcefirst-0138-private.json" \
            > "$RUNNER_TEMP/sourcefirst-0138-private.log"
          python3 gamepulse/fusion/igp_fusion_source_first_68_query_v1.py \
            --root . --game-id 0022600001 --start-utc-ms 1792530816800 --end-utc-ms 1792530817000 \
            --mode 10hz --output "$RUNNER_TEMP/sourcefirst-0001-private.json" \
            > "$RUNNER_TEMP/sourcefirst-0001-private.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          for gid in ('0022600138','0022600001'):
            j=json.loads((p/('sourcefirst-'+gid[-4:]+'-private.json')).read_text())
            assert j['game_id']==gid and len(j['rows'])==3
            assert j['newly_accepted_model_positions']==0
            assert j['original_source_PBP_and_official_alias_unchanged']
            assert all(r['physical_possession_grade']=='UNVERIFIED' for r in j['rows'])
          print("IGP_SOURCEFIRST_PRIVATE_CLI_REAL_TWO_GAME_PASSED")
          PY
      - name: All 68 real original NBA source native hashes and official-roster overlay strata
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_sourcefirst_all68_census_v1.py \
              --root . --output "$RUNNER_TEMP/sourcefirst-all68-private.json" \
              > "$RUNNER_TEMP/sourcefirst-all68-private.log" 2>&1; then
            echo IGP_FULL68_ORIGINAL_SOURCE_FIRST_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'sourcefirst-all68-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(s) if x.strip()),'NO_LOG')
          print('IGP_SOURCEFIRST_REDACTED_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:90])
          print('IGP_SOURCEFIRST_GAMES_FINISHED',sum(x.startswith('IGP_SOURCEFIRST_ORIGINAL_68_GAME') for x in s))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'sourcefirst-all68-private.json').read_text())
          t=q['total']
          assert len(q['game_ids'])==68 and len(q['per_game'])==68
          assert t['games']==68
          assert t['native_timestamps']==2280600
          assert t['original_actor_XYZ_slots']==16449978
          assert t['original_ball_XYZ_frames']==1735580
          assert t['official_paired_native_timestamps']==867735
          assert t['outside_strict_native_timestamps']==2280600-867735
          assert t['native_sourcefirst_readback_examples']==136
          assert t['grid_10hz_sourcefirst_readback_samples']==408
          assert q['preexisting_fullnative_800ms_C0B_reconstructed_source_ID_ten_ball_candidates']==1275611
          assert q['newly_accepted_official_ten_complete_scenes']==0
          assert q['outside_official_PBP_window_is_unknown_not_dead_ball']
          assert q['source_original_NBA_SDK_XYZ_and_PBP_unmodified']
          for gid,p in q['per_game'].items():
            assert len(p['readback_samples'])==2
            assert {x['population'] for x in p['readback_samples']}=={'SOURCE_ONLY','OFFICIAL_PAIRED'}
            assert p['source_only_official_lineup_promotion']==0
          print('IGP_SOURCEFIRST_ALL68_MEASURED_COUNTS',json.dumps({
            'native_source_timestamps':t['native_timestamps'],
            'source_native_outside_strict':t['outside_strict_native_timestamps'],
            'original_player_XYZ_outside_strict':t['outside_strict_original_actor_XYZ_slots'],
            'original_ball_XYZ_outside_strict':t['outside_strict_original_ball_XYZ_frames'],
            'source_first_68_game_native_readbacks':t['native_sourcefirst_readback_examples'],
            'source_first_68_game_10hz_readbacks':t['grid_10hz_sourcefirst_readback_samples'],
            'preexisting_source_ID_C0B_ten_ball_candidates':1275611,
            'official_nba_lineup_promotions':0,'physical_possessions_certified':0},sort_keys=True))
          PY
      - name: Commit exact original NBA source/grade acceptance QA only to private branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_sourcefirst_all68_census_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B sourcefirst-full68 "origin/$BRANCH"
          cp "$RUNNER_TEMP/sourcefirst-all68-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_SOURCEFIRST_ALL68_ALREADY_COMMITTED_IDENTICAL_QA
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): 68 NBA full original native XYZ source-first player ball outside strict lineup access'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_SOURCEFIRST_ALL68_NBA_SOURCE_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
