name: NBA Jabari616 Alternate HLS Camera QA
# Bound stalled provider camera URL delivery; preserve private source status.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-jabari616-camera-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jabari616-camera-source-check
  cancel-in-progress: false
jobs:
  cpu-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scope-check reviewed public CPU bridge
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          path='.github/workflows/nba-jabari616-camera-qa.yml'
          findings=scan([path])
          if findings:raise SystemExit("SOURCE_CHECK_FAILED")
          print('JABARI616_CAMERA_PUBLIC_SOURCE_CHECK_PASS')
          PY
      - name: Inspect genuine source cameras and preserve media privately
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_AUTH_REQUIRED; exit 3; }
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_616_camera_compare.py?ref=main' --jq .content | base64 -d > "$ROOT/cameras.py"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --disable-pip-version-check --quiet opencv-python-headless==4.10.0.84 'numpy<2'
          python3 "$ROOT/cameras.py"
