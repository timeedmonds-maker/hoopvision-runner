name: Post-sanitize public audit

on:
  workflow_run:
    workflows: ["One-off sanitize public history"]
    types: [completed]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  audit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove historical Actions runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id' > /tmp/run_ids
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "${GITHUB_RUN_ID}" ] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || true
          done < /tmp/run_ids

      - name: Audit sanitized reachable Git state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --all --count)" = "1"
          test -z "$(git tag -l)"
          test "$(git log -1 --format='%P')" = ""
          git log --all --format='%ae%n%ce' | while read -r email; do
            case "$email" in *@users.noreply.github.com) ;; *) echo "AUDIT_FAIL_NON_NOREPLY_COMMIT"; exit 3;; esac
          done
          refs="$(git ls-remote --heads --tags "https://github.com/${GITHUB_REPOSITORY}.git")"
          count="$(printf '%s\n' "$refs" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" = "1"
          printf '%s\n' "$refs" | grep -q 'refs/heads/main$'
          python tools/public_content_guard.py
          python - <<'PY'
          import json,re
          for name in ("bridge_consumer_receipt.json","bridge_execution_status.json","bridge_result_summary.json"):
              d=json.load(open(name))
              rid=str(d.get("request_id") or "")
              assert re.fullmatch(r"req-[0-9a-f]{32}",rid), name
              assert set(d) <= {"schema","request_id","status","result_available","observed_at_utc"}, name
          print("OPAQUE_PUBLIC_STATE_OK")
          PY

      - name: Capture and mask historical PR object identifiers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1")"
          head_sha="$(printf '%s' "$pr" | jq -r '.head.sha')"
          merge_sha="$(printf '%s' "$pr" | jq -r '.merge_commit_sha')"
          old_file="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1/files?per_page=1" --jq '.[0].filename')"
          echo "::add-mask::$head_sha"
          echo "::add-mask::$merge_sha"
          echo "::add-mask::$old_file"
          echo "OLD_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          echo "OLD_MERGE_SHA=$merge_sha" >> "$GITHUB_ENV"
          echo "OLD_FILE=$old_file" >> "$GITHUB_ENV"

      - name: Attempt admin archive of historical PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          node_id="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id}}}' \
            -F owner="$owner" -F name="$name" -F number=1 --jq '.data.repository.pullRequest.id')"
          set +e
          gh api graphql \
            -f query='mutation($id:ID!){archivePullRequest(input:{pullRequestId:$id}){pullRequest{isArchived}}}' \
            -F id="$node_id" >/tmp/archive-result.json 2>/tmp/archive-error.txt
          rc=$?
          set -e
          rm -f /tmp/archive-result.json /tmp/archive-error.txt
          if [ "$rc" = "0" ]; then
            echo "ARCHIVE_PR_REQUEST_ACCEPTED"
          else
            echo "ARCHIVE_PR_UNAVAILABLE"
          fi

      - name: Anonymous GitHub exposure audit
        shell: bash
        run: |
          set -euo pipefail
          code() { curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$1" || true; }
          repo_code="$(code "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          [ "$repo_code" = "200" ] || { echo "AUDIT_FAIL_PUBLIC_REPO_NOT_READABLE"; exit 5; }
          pr_code="$(code "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/1")"
          patch_code="$(code "https://patch-diff.githubusercontent.com/raw/${GITHUB_REPOSITORY}/pull/1.patch")"
          head_code="$(code "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${OLD_HEAD_SHA}")"
          merge_code="$(code "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${OLD_MERGE_SHA}")"
          raw_code="$(code "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OLD_HEAD_SHA}/${OLD_FILE}")"
          echo "ANON_PR_HTTP=$pr_code"
          echo "ANON_PR_PATCH_HTTP=$patch_code"
          echo "ANON_OLD_HEAD_HTTP=$head_code"
          echo "ANON_OLD_MERGE_HTTP=$merge_code"
          echo "ANON_OLD_RAW_HTTP=$raw_code"
          if [ "$pr_code" = "200" ] || [ "$patch_code" = "200" ] || [ "$head_code" = "200" ] || [ "$merge_code" = "200" ] || [ "$raw_code" = "200" ]; then
            echo "AUDIT_NOT_CLEAN_GITHUB_RETAINED_OBJECTS"
            exit 7
          fi
          echo "ANONYMOUS_PUBLIC_AUDIT_CLEAN"
