name: IGP G3 original NBA all68 2p4second complete original source blackout player identity and ball error
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g3-68-fullscene-2400ms-source-holdout.yml']
permissions: {contents: read}
concurrency:
  group: igp-g3-68-all-original-actors-source-2400ms-blackout
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 28160a7743e2b9456ce5c74a1d53cefbc7185e80
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify G3 source originality and public output privacy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Verify masked original actor player and ball and feet-error source unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g3_all68_2400ms_source_blackout_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g3_source_conflict_query_v1.py'
      - name: Run all68 original NBA whole source scene 2p4s blackout physics-source-proxy accuracy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_g3_all68_2400ms_original_source_blackout_v1.py \
              --root . --output "$RUNNER_TEMP/G3-2400ms-private.json" > "$RUNNER_TEMP/G3-2400ms-private.log" 2>&1; then
            echo IGP_G3_2400MS_WHOLE_SOURCE_BLACKOUT_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'G3-2400ms-private.log').read_text(errors='replace').splitlines()
          last=next((s for s in reversed(lines) if s.strip()),'NO_LOG')
          print('IGP_G3_WHOLE_MASK_SAFE_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:100])
          print('IGP_G3_WHOLE_MASK_GAMES_FINISHED',sum(s.startswith('IGP_G3_2400MS_ORIGINAL_MASK_GAME') for s in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'G3-2400ms-private.json').read_text())
          old=q['baseline_source_only_C0_B'];new=q['G3_NBA_G2_lineup_conditioned_C0_B']
          assert q['games']==68 and len(q['by_game'])==68
          assert q['entire_original_11plus_all_extra_actor_sources_hidden_within_ms']==2400
          assert q['long_gap_side_support_ms']==1500
          assert old['n_original_full11_blackouts']==new['n_original_full11_blackouts']>=120
          assert q['paired_identical_NBA_player_error_max_delta_ft']<=1e-8
          assert q['paired_identical_ball_error_max_delta_ft']<=1e-8
          assert q['new_accepted_NBA_official_physical_positions']==0
          assert q['independently_video_certified_physical_possessions']==0
          print('IGP_G3_ALL68_FULL_SOURCE_MASK_2400MS_SOURCE_GRADED',json.dumps({
             'n':old['n_original_full11_blackouts'],
             'baseline_complete':old['correct_complete_official10_and_ball'],
             'g3_complete':new['correct_complete_official10_and_ball'],
             'baseline_wrong_ID':old['wrong_NBA_player_predictions'],
             'G3_wrong_ID':new['wrong_NBA_player_predictions'],
             'baseline_player_XY_p95_ft':old['player_XY_source_heldout_ft']['p95'],
             'G3_player_XY_p95_ft':new['player_XY_source_heldout_ft']['p95'],
             'baseline_ball_XYZ_p95_ft':old['ball_XYZ_source_heldout_ft']['p95'],
             'G3_ball_XYZ_p95_ft':new['ball_XYZ_source_heldout_ft']['p95'],
             'identical_actor_position_model_delta_ft':0,
             'physical_video_accuracy_claim':False,
             'promoted':0},sort_keys=True))
          PY
      - name: Commit only private original SHA G3 full blackout numeric source accuracy QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g3_all68_fullscene_2400ms_blackout_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B g3-full2400 "origin/$BRANCH"
          cp "$RUNNER_TEMP/G3-2400ms-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): all68 original player ball+extra source 2p4s simultaneous blackout official G2 player ID and physical-proxy errors'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G3_WHOLE_SCENE_2400MS_SOURCE_QA_PRIVATE_SAVED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
