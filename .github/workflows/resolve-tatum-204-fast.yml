name: Resolve Tatum 2-04 event fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-tatum-204-fast.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, requests
          from pathlib import Path
          gid='0022600001'; pid=1628369
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          h={'User-Agent':UA,'Referer':'https://www.nba.com/','Origin':'https://www.nba.com','Accept':'application/json, text/plain, */*'}
          r=requests.get('https://stats.gleague.nba.com/stats/shotqualityvideologs',
                         params={'GameID':gid,'PlayerID':pid},headers=h,timeout=(8,25))
          r.raise_for_status()
          rows=[]
          for z in r.json().get('shotList') or []:
              if int(z.get('period') or 0)==4 and str(z.get('gameClock') or '') in {'2:04','2:04.0','02:04','02:04.0'}:
                  try:q=float(z.get('shotQuality'))
                  except Exception:q=None
                  ev=int(z.get('eventNum'))
                  u=f'https://clips.nba.com/?gameNo={gid}&eventNum={ev}&source=grs'
                  rr=requests.get(u,headers={'User-Agent':UA,'Referer':'https://clips.nba.com/'},timeout=(5,20))
                  tm=re.search(r'<title>(.*?)</title>',rr.text,re.I|re.S)
                  rows.append({'event_num':ev,'clock':z.get('gameClock'),'success':z.get('success'),
                               'action_type':z.get('actionType'),'shot_type':z.get('shotType'),
                               'shot_quality':q,'xfg_pct':100*q if q is not None and q<=1.5 else q,
                               'title':html.unescape(tm.group(1).strip()) if tm else '', 'url':u})
          out={'game_id':gid,'player':'Jayson Tatum','rows':rows}
          p=Path('experiment_results/tatum_204'); p.mkdir(parents=True,exist_ok=True)
          (p/'latest.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if not rows: raise SystemExit(2)
          PY
      - shell: bash
        run: |
          git config user.name hoopvision-public-probe
          git config user.email hoopvision-public-probe@users.noreply.github.com
          git add experiment_results/tatum_204/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Resolve Tatum 2:04 miss [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
