name: PR776 G4 58 NBA unlinked source context query
on:
  push:
    branches: [research/pr776-trusted-igp-runner-20261028]
    paths:
      - '.github/workflows/gamepulse-pr776-G4-unlinked-span-query-58.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G4-unlinked-span-58
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard and private accepted source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free unlinked source query non-ownership regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g4_unlinked_span_2026.py' -v
      - name: Verify all 58 private SHA original NBA action UTC source contexts
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G4_58_unlinked_action_span_source_query_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g4_unlinked_span_query_qa_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-G4-unlinked-span.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]));c=a['counts']
          assert c['source_present_unlinked_chains']==58
          assert c['original_source_frame_incidences']==4910
          assert c['NBA_logged_other_chain_membership']+c['no_NBA_logged_chain_membership']==4910
          assert a['source_frames_are_context_not_new_chain_membership']
          assert not a['physical_possession_custody_certified']
          print('G4_PRIVATE_58_UNLINKED_SOURCE_CONTEXT_ACCEPTED',json.dumps(c,sort_keys=True))
          PY
      - name: Commit private accepted context QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          git config user.name "Game Pulse G4 Private Unlinked Context QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261028/igp_G4_58_unlinked_action_span_source_query_v1.json
          git diff --cached --check
          git commit -qm "qa(gamepulse): accept 58 unlinked NBA chain original source context queries"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo G4_PRIVATE_UNLINKED_SOURCE_CONTEXT_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
