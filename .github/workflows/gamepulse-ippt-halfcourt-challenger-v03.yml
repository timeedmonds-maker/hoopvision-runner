name: IPPT halfcourt original gap bracket v03 versus v02 QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-halfcourt-challenger-v03.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  masked-basketball:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/ippt-halfcourt-dual-track-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy guard and original NBA private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          # Read access to the private source is proved by the authenticated clone;
          # avoid a redundant GitHub REST API call (shared account rate limits).
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Source-free source precedence and quality-screen tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_ippt_priority_bracket_challenger_2026.py \
            gamepulse/fusion/igp_ippt_halfcourt_v2_mask_qa_2026.py \
            gamepulse/fusion/igp_ippt_halfcourt_quality_tiers_2026.py \
            gamepulse/fusion/query_igp_ippt_halfcourt_settled_v2_2026.py
          python3 -m unittest -v \
            gamepulse/fusion/test_igp_ippt_priority_bracket_challenger_2026.py \
            gamepulse/fusion/test_igp_ippt_halfcourt_quality_tiers_2026.py
      - name: Source true NBA halfcourt settled database query quality grade readback
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from query_igp_ippt_halfcourt_settled_v2_2026 import search
          for gid in ("0022600009","0022600092"):
              modes={mode:search(".",gid,model=mode,limit=10)
                   for mode in ("direct","evidence","predictive","predictive_v03")}
              assert len(set(row["total_matching_source_frames"] for row in modes.values()))==1
              for mode,row in modes.items():
                  assert len(row["rows"])==10
                  assert all(p["coordinate_analysis_quality_tier"] for p in row["rows"])
                  assert all(p["no_precision_certification_from_model_completeness"] for p in row["rows"])
              assert all(row["IPPT_prediction"]["model_version"]=="IPPT_PRIORITY_BIDIRECTIONAL_LONG_0_3" for row in modes["predictive_v03"]["rows"])
              sample=search(".",gid,model="evidence",limit=200)
              missing=next(((pid,row["source_native_UTC_ms"])
                  for row in sample["rows"] for pid in row["NBA_official_ten_candidate"]
                  if pid not in row["original_actor_xyz_native"] and
                     pid not in row["accepted_G3_missing_player_xyz_native"]),None)
              assert missing is not None,"No real NBA original/G3 missing official player found for test"
              pid,_=missing
              prediction_search=search(".",gid,model="predictive_v03",source_player=pid,limit=1)
              evidence_search=search(".",gid,model="evidence",source_player=pid,limit=1)
              assert prediction_search["total_matching_source_frames"]>=evidence_search["total_matching_source_frames"]
              assert prediction_search["total_matching_source_frames"]>0
              print("IPPT_V03_OFFICIAL_FIVE_PREDICTIVE_SEARCH_FIX_PASS",gid,{
                  "source_player_id_input_is_verified_official_five_candidate":True,
                  "predictive_frame_count":prediction_search["total_matching_source_frames"],
                  "evidence_frame_count":evidence_search["total_matching_source_frames"],
                  "modeled_player_not_suppressed_by_absent_original_G3":True})
              print("IPPT_V2_GRADED_PRIVATE_QUERY_PASS",gid,{
                 "source_frames":modes["direct"]["total_matching_source_frames"],
                 "layers":["direct","evidence","predictive","predictive_v03"],
                 "quality_tiers_present":True})
          PY
      - name: Strict settled NBA 2 5 10s withheld all-original tracking v02 versus v03
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json
          from igp_ippt_private_game_pilot_2026 import annotated_frames
          from igp_ippt_halfcourt_v2_mask_qa_2026 import run
          for gid in ("0022600009","0022600092"):
              raw,g4,rosters,source_sha=annotated_frames(".",gid)
              for ms in (2000,5000,10000):
                  for mode in ("v02","v03"):
                      q=run(".",gid,raw,g4,rosters,windows=12,window_ms=ms,model_type=mode)
                      r=q["strata"]["formation_supported_v2"]
                      print("IPPT_V03_V02_SETTLED_ORIGINAL_BLACKOUT_COMPARE",gid,ms,mode,json.dumps({
                          "original_truth_masked":r["masked_original_xyz_total"],
                          "player":r["model"]["player"],
                          "ball":r["model"]["ball"],
                          "prediction_grades":r["prediction_grades"],
                          "private_original_SDK_positions_never_printed":True
                      },sort_keys=True))
                      assert q["predictor_never_receives_masked_truth_xyz"]
          PY

# Public workflow emits only aggregate original-versus-predictive positional error.
