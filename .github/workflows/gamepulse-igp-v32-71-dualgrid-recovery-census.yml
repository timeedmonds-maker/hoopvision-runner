# Source-verified NBA 71-game v3.2 missingness census. No original XYZ in public logs.
name: IGP 3.2 71game native-10Hz source recoverability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-71-dualgrid-recovery-census.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-71-dualgrid-source-census
  cancel-in-progress: false
jobs:
  census:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      SHARDS: "6"
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public source guard
        run: python3 tools/public_content_guard.py
      - name: Clone licensed source in private runner sandbox and test
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_71_dual_grid_recoverability_census_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_dual_grid_census_v1.py'
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('gamepulse/fusion/qa/igp_v32/igp_v32_v0_frozen71_baseline_v1.json').read_bytes())
          assert q['games']==71
          assert (q['totals']['native_total'],q['totals']['native_complete'])==(569090,502662)
          assert (q['totals']['grid_total'],q['totals']['grid_complete'])==(1159651,923032)
          print('IGP_V32_V0_FROZEN_71GAME_SOURCE_SCORECARD_VERIFIED')
          PY
      - name: Run original NBA SHA-verified V1 dual-grid census
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_71_dual_grid_recoverability_census_v1.py \
            --root . --shard-index "$SHARD" --shard-count "$SHARDS" \
            --output "$RUNNER_TEMP/v32-shard.json" >"$RUNNER_TEMP/v32-private.log" 2>&1 || {
              echo IGP_V32_PRIVATE_CENSUS_OR_SOURCE_GATE_FAILED
              exit 41
            }
          grep '^IGP_V32_V1_PRIVATE_SOURCE_SHARD_PASSED' "$RUNNER_TEMP/v32-private.log" || true
      - name: Commit private QA shard with rebase concurrency protection
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_v1_census_shard_$SHARD"
          receipt="$receipt""_of_$SHARDS.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v32qa "origin/$BRANCH"
          mkdir -p "$(dirname "$receipt")"
          cp "$RUNNER_TEMP/v32-shard.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet; then echo V32_SOURCE_SHARD_ALREADY_SAVED; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "qa(igp): V1 native and 10Hz source census shard $SHARD"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_V32_SOURCE_SHARD_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 42
  full71:
    needs: [census]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard and private source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Reconcile all six shards against accepted 71-game native and 10Hz QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_71_dual_grid_recoverability_census_v1.py \
            --root . --finalize --shard-count 6 --output "$RUNNER_TEMP/v32-final.json" \
            >"$RUNNER_TEMP/v32-final-private.log" 2>&1 || {
              echo IGP_V32_ALL71_FROZEN_DENOMINATOR_OR_SOURCE_QA_FAILED
              exit 43
            }
          grep '^IGP_V32_V1_ALL71_SOURCE_VERIFIED' "$RUNNER_TEMP/v32-final-private.log" || true
      - name: Commit source-only final report in private repo
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_v1_all71_recoverability_census_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v32final "origin/$BRANCH"
          cp "$RUNNER_TEMP/v32-final.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet; then echo V32_ALL71_ALREADY_SAVED; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): V1 final all71 native and 10Hz recoverability census'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_V32_ALL71_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
