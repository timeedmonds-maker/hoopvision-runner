name: Integrated Pulse official NBA PBP and box backfill after frozen 36
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-official-pbp-post36-backfill.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-official-pbp-post36-private
  cancel-in-progress: false
jobs:
  official-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and private source access
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Fetch official NBA originals, reconcile final scores and preserve prior 36
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_official_20_additive_20261029.py
          python3 gamepulse/fusion/igp_official_20_additive_20261029.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/official_pbp_timing/index-2026-27-post36-additive.json")
          d=json.loads(p.read_text())
          assert d["prior_accepted_games"]==36
          assert d["official_game_data_accepted"]==36+d["additional_accepted_games"]
          assert d["physical_possessions_certified"]==0
          print("IGP_OFFICIAL_NEW_SOURCE_QA",d["additional_accepted_games"],"PENDING",len(d["pending_game_ids"]))
          PY
      - name: Commit only new official originals and source-validated metadata to canonical research branch
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/official_pbp_timing/original_nba_20261029 gamepulse/fusion/official_pbp_timing/games gamepulse/fusion/official_pbp_timing/index-2026-27-post36-additive.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -q -m 'data(igp): add score-reconciled NBA official PBP and box sources beyond 36'
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch -q origin "$BRANCH"
              git rebase -q "origin/$BRANCH"
              if git push -q origin "HEAD:refs/heads/$BRANCH"; then
                echo IGP_OFFICIAL_NBA_SOURCE_PRIVATE_COMMITTED
                break
              fi
              if test "$attempt" -eq 8; then exit 23; fi
              sleep "$attempt"
            done
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("gamepulse/fusion/official_pbp_timing/index-2026-27-post36-additive.json").read_text())
          if d["pending_game_ids"]:
              print("IGP_OFFICIAL_NBA_PENDING_GAME_COUNT",len(d["pending_game_ids"]))
              raise SystemExit(3)
          print("IGP_OFFICIAL_ALL_56_FINAL_GAMES_SOURCE_RECONCILED")
          PY
