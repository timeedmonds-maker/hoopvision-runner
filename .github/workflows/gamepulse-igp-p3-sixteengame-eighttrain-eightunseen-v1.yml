# P3 multiagent contextual ridge fixed features, train 8 original SDK games, test 8 unseen.
name: IGP P3 sixteen-game 8 train 8 unseen source masked
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-sixteengame-eighttrain-eightunseen-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p3-sixteen-game-heldout
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: a6fa722972e814a1aaff718532dcf5dedeb9fbfe
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Review public content guard and SHA pin original private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Run real original NBA 16-game P3 disjoint train and holdout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_sixteengame_disjoint_source_model_v1.py'
          python3 gamepulse/fusion/igp_68_p3_sixteengame_disjoint_source_model_v1.py \
            --root . --output "$RUNNER_TEMP/igp68-p3-sixteen-private.json" \
            > "$RUNNER_TEMP/igp68-p3-sixteen-source.log" 2>&1 || {
              echo P3_SIXTEEN_GAME_ORIGINAL_SOURCE_QA_FAILED
              tail -n 12 "$RUNNER_TEMP/igp68-p3-sixteen-source.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp68-p3-sixteen-private.json').read_bytes())
          assert len(q['training_games'])==8 and len(q['strict_unseen_validation_games'])==8
          assert not (set(q['training_games'])&set(q['strict_unseen_validation_games']))
          assert q['model_fit_only_on_eight_training_games']
          assert q['original_source_NBA_PBP_and_ten_immutable']
          assert q['experimental_no_model_promotion'] and q['no_new_68game_tracking_coverage_certified']
          for kind in ('player','ball'):
            t=q['comparison_to_original_C0_by_kind'][kind]['strict_unseen_test']['metrics']
            assert t['paired_targets']>=240
            assert t['baseline_C0']['n']==t['multiagent_frozen_weights']['n']
          print('IGP_P3_SIXTEEN_GAME_STRICT_UNSEEN_SOURCE_QA',json.dumps({
            k:q['comparison_to_original_C0_by_kind'][k]['strict_unseen_test']['metrics']
            for k in ('player','ball')},sort_keys=True))
          PY
      - name: Save original-source-private 16-game P3 independent benchmark QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_sixteengame_eighttrain_eightunseen_source_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-sixteen "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp68-p3-sixteen-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): source-backed P3 8train and 8 unseen NBA game model benchmark'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP68_P3_SIXTEEN_GAME_SOURCE_QA_SAVED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
