name: IGP P3 frozen joint all11 external holdout and uncertainty
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-joint-external-risk-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-joint-external-risk-v1
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 9983858b3e6cc7aa05f491e8b9d893dbeb80e276
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard licensed source and pin exact private SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free tests and original SHA-backed four unseen games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_joint_external_uncertainty_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_joint_external_uncertainty_v1.py --root . --output "$RUNNER_TEMP/p3-private.json" > "$RUNNER_TEMP/p3-private.log" 2>&1; then
            echo IGP_P3_PRIVATE_ORIGINAL_SOURCE_EVALUATION_FAILED
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'p3-private.json').read_text())
          assert len(j['unseen_games'])==len(j['by_game'])==4
          assert set(j['unseen_games']).isdisjoint(j['dev_games'])
          assert j['all_eleven_original_source_masked_ms']==2400
          assert j['frozen_handler_weight']==.5
          assert j['unchanged_68_native_baseline']==[492617,543024]
          assert j['unchanged_68_continuous_10hz_baseline']==[917686,1106941]
          assert j['source_SDK_is_heldout_truth_not_independent_video']
          assert j['accepted_new_tracking_scenes']==0 and j['production_model_not_promoted']
          o=j['overall']
          n=o['c0']['target_full_original_source_scenes']
          assert n>=160 and o['handler']['target_full_original_source_scenes']==n
          assert o['c0']['player_XY_error_ft']==o['handler']['player_XY_error_ft']
          assert sum(j['by_grade'][k]['cases'] for k in ('tight','moderate','broad','high_disagreement','unscorable'))==n
          print('IGP_P3_FROZEN_UNSEEN_AGGREGATE',json.dumps({
              'centers':n,
              'C0_ball_p95_ft':o['c0']['ball_XYZ_error_ft']['p95_ft'],
              'handler_ball_p95_ft':o['handler']['ball_XYZ_error_ft']['p95_ft'],
              'C0_all11_strict_proxy':o['c0']['within_player_2ft_ball_3ft_source_proxy'],
              'handler_all11_strict_proxy':o['handler']['within_player_2ft_ball_3ft_source_proxy'],
              'tight_gate_cases':j['by_grade']['tight']['cases'],
              'newly_accepted_scenes':0},sort_keys=True))
          PY
      - name: Commit original-source QA ONLY to private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_joint_external_uncertainty_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-external "origin/$BRANCH"
          cp "$RUNNER_TEMP/p3-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): 4 unseen official NBA 11 actor source blackouts and uncertainty'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_FOUR_UNSEEN_PRIVATE_QA_SUCCESS
              exit 0
            fi
            sleep "$i"
          done
          exit 42
