name: Integrated Pulse official lineup clock intervals 28-game CPU
# Official NBA PBP and five-man provider only; private output, aggregate public QA.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-official-lineup-clock-28.yml']
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_PIN: e6d73521a7347ffc58fe93416f593bc8c4b5469c
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard and source-independent tests before private data transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          mkdir -p "$RUNNER_TEMP/lineup-clock"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/official_lineup_trajectory_2026.py?ref=$PRIVATE_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/lineup-clock/official_lineup_trajectory_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/official_lineup_clock_intervals_2026.py?ref=$PRIVATE_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/lineup-clock/official_lineup_clock_intervals_2026.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/tests/test_official_lineup_clock_intervals_2026.py?ref=$PRIVATE_PIN" --jq .content | base64 -d > "$RUNNER_TEMP/lineup-clock/test_official_lineup_clock_intervals_2026.py"
          (cd "$RUNNER_TEMP/lineup-clock" && python3 -m py_compile official_lineup_trajectory_2026.py official_lineup_clock_intervals_2026.py && python3 -m unittest -v test_official_lineup_clock_intervals_2026.py)
      - name: Validate all private games and publish only private clock interval views
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lineup-clock"
          python3 - <<'PY'
          import base64, collections, hashlib, json, os, subprocess
          from pathlib import Path
          from official_lineup_clock_intervals_2026 import build, SCHEMA
          repo=os.environ["PRIVATE_REPO"]
          pin=os.environ["PRIVATE_PIN"]
          branch=os.environ["PRIVATE_BRANCH"]
          def fetch(path):
              uri=f"repos/{repo}/contents/{path}?ref={pin}"
              data=json.loads(subprocess.check_output(["gh","api",uri]))
              raw=base64.b64decode(data["content"])
              return json.loads(raw),hashlib.sha256(raw).hexdigest()
          manifest,_=fetch("gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json")
          games=manifest["games"]
          if len(games)!=28 or manifest.get("complete_28") is not True:
              raise ValueError("OFFICIAL_PBP_28_GAME_MANIFEST_INVALID")
          results={};unresolved={};by_team=collections.defaultdict(list)
          by_player=collections.defaultdict(set)
          counts=collections.Counter()
          for gid in sorted(games):
              entry=games[gid]
              pbp,pbp_sha=fetch(entry["source_file"])
              if pbp.get("game_id")!=gid or pbp.get("source_provenance",{}).get("nba_pbp_sha256")!=entry["source_pbp_sha256"]:
                  raise ValueError("OFFICIAL_PBP_MANIFEST_LINEAGE_CONFLICT")
              roster,roster_sha=fetch(f"gamepulse/fusion/index/games/{gid}.json")
              provider_path=(f"gamepulse/fusion/qa/rockets_official_five_recovery_0022600009_20261026.json"
                             if gid=="0022600009" else f"gamepulse/fusion/onoff/games/{gid}.json")
              provider,provider_sha=fetch(provider_path)
              try:
                  doc=build(pbp,provider,roster)
              except ValueError as error:
                  reason=str(error).split(":")[0]
                  if not reason.isupper() or len(reason)>80:raise
                  unresolved[gid]={"reason":reason,
                                   "source_paths":{"pbp":entry["source_file"],
                                                   "provider":provider_path}}
                  counts[reason]+=1
                  continue
              doc["source_provenance"]["input_sha256"]={
                  "pbp":pbp_sha,"roster":roster_sha,"provider":provider_sha}
              raw=(json.dumps(doc,sort_keys=True,separators=(",",":"))+"\n").encode()
              results[gid]=(raw,doc)
              counts["ACCEPTED_GAME_CLOCK_LINEUPS"]+=1
              counts["TEN_PLAYER_GAME_CLOCK_INTERVALS"]+=len(doc["lineup_intervals"])
              for team in roster["game"]["home"],roster["game"]["away"]:
                  by_team[team].append(gid)
              for row in doc["lineup_intervals"]:
                  for five in row["teams"].values():
                      for pid in five:by_player[pid].add(gid)
          print("OFFICIAL_CLOCK_28_AGGREGATE",json.dumps(dict(sorted(counts.items())),sort_keys=True))
          index={"schema":"gamepulse.official-lineup-clock-season-index.v1",
                 "source_manifest":"gamepulse/fusion/official_pbp_timing/index-2026-27-expanded.json",
                 "source_commit":pin,
                 "games":{},"unresolved_games":unresolved,
                 "by_team":dict(sorted(by_team.items())),
                 "by_player":{k:sorted(v) for k,v in sorted(by_player.items())},
                 "stats":{"source_games":len(games),"accepted_games":len(results),
                          "unresolved_games":len(unresolved),
                          "ten_player_game_clock_intervals":sum(
                              len(doc["lineup_intervals"]) for _,doc in results.values())},
                 "native_clock_reconstruction_verified":False,
                 "physical_possessions_certified":0}
          assert len(results)+len(unresolved)==28
          def publish(path, raw):
              uri=f"repos/{repo}/contents/{path}"
              item={"branch":branch,"message":"data(gamepulse): retain provider-verified official lineup clock intervals",
                    "content":base64.b64encode(raw).decode()}
              old=subprocess.run(["gh","api",uri+"?ref="+branch],
                                 capture_output=True,text=True)
              if old.returncode==0:
                  existing=json.loads(old.stdout)
                  if base64.b64decode(existing["content"])==raw:return
                  item["sha"]=existing["sha"]
              elif "404" not in old.stderr and "Not Found" not in old.stderr:
                  raise RuntimeError("PRIVATE_LINEUP_READ_FAILED")
              put=subprocess.run(["gh","api","--method","PUT",uri,"--input","-"],
                                 input=json.dumps(item),text=True,capture_output=True)
              if put.returncode:raise RuntimeError("PRIVATE_LINEUP_WRITE_FAILED")
          for gid,(raw,doc) in sorted(results.items()):
              path=f"gamepulse/fusion/official_lineup_clock/games/{gid}.json"
              publish(path,raw)
              index["games"][gid]={"path":path,"sha256":hashlib.sha256(raw).hexdigest(),
                                    "intervals":len(doc["lineup_intervals"]),
                                    "qa":doc["qa"]}
          raw=(json.dumps(index,sort_keys=True,indent=2)+"\n").encode()
          publish("gamepulse/fusion/official_lineup_clock/index.json",raw)
          print("PRIVATE_OFFICIAL_CLOCK_INDEX_PUBLISHED",json.dumps(index["stats"],sort_keys=True))
          PY
