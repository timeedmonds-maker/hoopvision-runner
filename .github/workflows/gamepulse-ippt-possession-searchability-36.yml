name: IPPT full36 actual official logical possession original source coverage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-possession-searchability-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/ippt-event-snapshots-separate-20261028
      SHA: 5b7efae9406e95b75c38055617057e02bc5eabda
      QA: gamepulse/fusion/qa/igp_progress_20261028/ippt_original_logical_chain_searchability_all36_v1.json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SHA locked original private NBA source checkout
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SHA"
          echo "PRIV=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Run complete 7474 official NBA chain source search QA
        run: |
          set -euo pipefail
          cd "$PRIV"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_logical_chain_searchability_2026.py
          python3 gamepulse/fusion/igp_ippt_logical_chain_searchability_2026.py --root . --out "$QA" > "$RUNNER_TEMP/private-results.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads(Path(os.environ["QA"]).read_text());c=a["counts"]
          assert len(a["games"])==36 and c["official_chains"]==7474
          assert c["chains_with_G4_original_frame"]==7065
          assert c["chains_with_G4_or_near_scorer_source"]==7345
          assert c["chains_with_same_frame_original_player_and_ball"]<=7065
          (Path(os.environ["RUNNER_TEMP"])/"safe.json").write_text(
              json.dumps({"counts":c,"source_games":36,"physical_custody_certified":False},sort_keys=True))
          print("IPPT_ALL36_REAL_PBP_POSSESSION_SOURCE_SEARCH_ACCEPTED",json.dumps(c,sort_keys=True))
          PY
      - name: Commit private SHA source QA
        run: |
          set -euo pipefail
          cd "$PRIV"
          git config user.name "NBA Original Source Possession QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$QA"
          git diff --cached --check
          git commit -qm "qa(ippt): 7474 logical NBA possession source searchability without stopped wallclock inflation"
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_POSSESSION_SEARCH_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 13
      - name: Aggregate-only public receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          x=json.loads((r/"safe.json").read_text()) if (r/"safe.json").exists() else {"status":os.environ["RESULT"]}
          x.update({"run_id":os.environ["GITHUB_RUN_ID"],"code_sha":os.environ["SHA"]})
          (r/"receipt.md").write_text("Original NBA physical source coverage by official logical possession; wall-clock not physical live seconds. Aggregate only.\n\n~~~json\n"+json.dumps(x,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/private"
          gh issue comment 140 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/receipt.md"
# Licensed original NBA actor tracks are never published publicly.
