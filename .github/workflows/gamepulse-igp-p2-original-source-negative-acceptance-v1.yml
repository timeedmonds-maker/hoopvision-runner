# Research-only P2 negative disposition: source, source masks, accuracy and 68-game cohort.
name: IGP P2 original source long gap negative acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2-original-source-negative-acceptance-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp-p2-original-source-negative-release
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: c92b9f273d9767e566cdd64c28ea68c9cf7d3127
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and SHA-pin source evaluation receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test and reject unjustified longer-gap model promotion
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p2_research_rejection_gate_v1.py'
          python3 gamepulse/fusion/igp_68_p2_research_rejection_gate_v1.py \
            --root . --out "$RUNNER_TEMP/igp-p2-decision.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-p2-decision.json').read_bytes())
          assert q['status']=='P2_SINGLE_AGENT_LONG_GAP_RESEARCH_REJECTED_FOR_PROMOTION'
          assert q['ungated_1500ms_fourgame_research_extra_native']==179
          assert q['ungated_1500ms_fourgame_research_extra_10hz']==526
          assert q['no_1500ms_production_promotion'] and q['retained_800ms_accepted_default']
          assert q['next_priority']=='P3_BASKETBALL_MULTI_AGENT_RECONSTRUCTION_RESEARCH_NOT_STARTED'
          print('P2_SAME_SOURCE_LONG_GAP_NEGATIVE_ACCEPTANCE_SIGNED',json.dumps({
            'player_mask_p95_ft':q['pooled_original_source_masked_C0_player_2d_ft']['p95'],
            'ball_mask_p95_ft':q['pooled_original_source_masked_C0_ball_3d_ft']['p95'],
            'research_1500_promoted':False,
            'next_priority':'P3_NOT_STARTED'
          },sort_keys=True))
          PY
      - name: Retain source-backed P2 result in private Git history
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p2_long_gap_negative_acceptance_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p2-negative "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-p2-decision.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): retain original-source P2 long gap no-promotion decision'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P2_NEGATIVE_RELEASE_GATE_ACCEPTED_PRIVATE
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
