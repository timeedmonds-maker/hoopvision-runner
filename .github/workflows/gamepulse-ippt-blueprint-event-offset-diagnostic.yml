name: IPPT Blueprint release event scorer UTC fixed offset diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-blueprint-event-offset-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-blueprint-offset:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private original NBA and Blueprint read-only SHA checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
             gamepulse/fusion data/extensions/nba_blueprint_2026_27
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Distinguish release offset physics from different measurement definitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_blueprint_release_timing_diagnostic_2026.py
          python3 gamepulse/fusion/igp_ippt_blueprint_release_timing_diagnostic_2026.py --root .
          echo "IPPT_BP_OFFSET_SIX_SOURCE_GAME_PASS"
