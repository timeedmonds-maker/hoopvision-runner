name: Request HoopVision G4 Quota

on:
  push:
    branches: [main]
    paths:
      - 'G4_QUOTA_REQUEST'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
  PREF_ID: hoopvision-g4-asia-southeast1

jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Create or inspect quota preference
        shell: bash
        run: |
          set -euo pipefail
          if gcloud beta quotas preferences describe "$PREF_ID" --project="$PROJECT_ID" --billing-project="$PROJECT_ID" >/tmp/pref.yaml 2>/dev/null; then
            cat /tmp/pref.yaml
          else
            gcloud beta quotas preferences create               --project="$PROJECT_ID"               --billing-project="$PROJECT_ID"               --service=compute.googleapis.com               --quota-id=GPUS-PER-GPU-FAMILY-per-project-region               --dimensions=region=asia-southeast1,gpu_family=NVIDIA_RTX_PRO_6000               --preferred-value=1               --justification="One controlled HoopVision development benchmark comparing G4 RTX PRO 6000 against the existing L4 baseline; no production migration requested."               --preference-id="$PREF_ID"
          fi
          gcloud beta quotas preferences describe "$PREF_ID" --project="$PROJECT_ID" --billing-project="$PROJECT_ID" --format=json > G4_QUOTA_STATE.json
          cat G4_QUOTA_STATE.json
      - name: Publish quota state
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          if [ ! -f G4_QUOTA_STATE.json ]; then
            printf '{"status":"REQUEST_FAILED","preference_id":"%s"}\n' "$PREF_ID" > G4_QUOTA_STATE.json
          fi
          git fetch origin main || exit 0
          git checkout -B quota-state origin/main || exit 0
          git config user.name hoopvision-runner
          git config user.email hoopvision-runner@users.noreply.github.com
          git add G4_QUOTA_STATE.json
          git commit -m "Record G4 quota request state ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:main || true
