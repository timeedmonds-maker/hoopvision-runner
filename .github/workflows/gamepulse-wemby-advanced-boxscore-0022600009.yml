name: Game Pulse Wembanyama Rockets official advanced rating probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-wemby-advanced-boxscore-0022600009.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source boundary and probe official single-game ratings
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          python3 - <<'PY'
          import urllib.request,urllib.error,json,base64,subprocess,math,hashlib
          GAME="0022600009";PID=1641705;REPO="timeedmonds-maker/104"
          args="GameID="+GAME+"&StartPeriod=0&EndPeriod=14&StartRange=0&EndRange=28800&RangeType=0"
          headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
             "Accept":"application/json, text/plain, */*","Referer":"https://www.nba.com/","Origin":"https://www.nba.com",
             "x-nba-stats-origin":"stats","x-nba-stats-token":"true"}
          routes=[
             "https://stats.gleague.nba.com/stats/boxscoreadvancedv3?"+args,
             "https://stats.nba.com/stats/boxscoreadvancedv3?"+args,
             "https://stats.gleague.nba.com/stats/boxscoreadvancedv2?"+args,
             "https://stats.nba.com/stats/boxscoreadvancedv2?"+args,
             "https://cdn.nba.com/static/json/liveData/boxscoreadvanced/boxscoreadvanced_"+GAME+".json"
          ]
          def locate(doc):
             if isinstance(doc,dict):
               data=doc.get("boxScoreAdvanced") or doc
               if isinstance(data,dict):
                 for side in ("homeTeam","awayTeam"):
                   for player in (data.get(side) or {}).get("players") or []:
                     if str(player.get("personId",player.get("playerId"))) == str(PID):
                       stats=player.get("statistics") or player
                       def first(*keys):
                         for key in keys:
                           x=stats.get(key)
                           if type(x) in (int,float) and math.isfinite(x):return float(x)
                         return None
                       return {"offensive_rating":first("offensiveRating","offRating","OFF_RATING"),"defensive_rating":first("defensiveRating","defRating","DEF_RATING"),"net_rating":first("netRating","NET_RATING")}
               for table in doc.get("resultSets") or []:
                 if not isinstance(table,dict):continue
                 h=table.get("headers") or []
                 if "PLAYER_ID" not in h:continue
                 for row in table.get("rowSet") or []:
                   r=dict(zip(h,row))
                   if str(r.get("PLAYER_ID"))==str(PID):
                     return {"offensive_rating":r.get("OFF_RATING"),"defensive_rating":r.get("DEF_RATING"),"net_rating":r.get("NET_RATING")}
             return None
          for url in routes:
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=12) as res:
                if res.status!=200:raise ValueError("BAD_HTTP")
                raw=res.read(2000000)
              doc=json.loads(raw);vals=locate(doc)
              if not vals or any(type(x) not in (int,float) for x in vals.values()):
                print("NBA_ADVANCED_SOURCE_NO_PLAYER_RATINGS",url.split("/")[2]);continue
              if abs((vals["offensive_rating"]-vals["defensive_rating"])-vals["net_rating"])>0.3:
                print("NBA_ADVANCED_RATING_RECONCILIATION_FAILED");continue
              record={"schema":"gamepulse.official-nba-player-advanced-single-game.v1",
                      "game_id":GAME,"player_id":str(PID),"player_name":"Victor Wembanyama",
                      "source_url":url,"source_sha256":hashlib.sha256(raw).hexdigest(),
                      "ratings":vals,"status":"INDEPENDENT_NBA_GAME_ADVANCED_VERIFIED"}
              blob=(json.dumps(record,sort_keys=True,indent=2)+"\n").encode()
              ep=f"repos/{REPO}/contents/gamepulse/fusion/nba_advanced/games/{GAME}_1641705.json"
              existing=subprocess.run(["gh","api",ep],capture_output=True,text=True,timeout=70)
              payload={"branch":"main","message":"data(gamepulse): independent NBA advanced on-court Wembanyama game ratings",
                 "content":base64.b64encode(blob).decode()}
              if existing.returncode==0:payload["sha"]=json.loads(existing.stdout)["sha"]
              p=subprocess.run(["gh","api","-X","PUT",ep,"--input","-"],input=json.dumps(payload),capture_output=True,text=True,timeout=70)
              if p.returncode:raise RuntimeError("PRIVATE_PUBLISH_FAILED")
              print("VERIFIED_WEMBY_OFF_RATING",vals["offensive_rating"])
              print("VERIFIED_WEMBY_DEF_RATING",vals["defensive_rating"])
              print("VERIFIED_WEMBY_NET_RATING",vals["net_rating"])
              break
            except Exception as e:
              print("NBA_ADVANCED_SOURCE_BLOCKER",url.split("/")[2],type(e).__name__)
          else:
            raise RuntimeError("OFFICIAL_NBA_SINGLE_GAME_ADVANCED_RATINGS_UNAVAILABLE")
          PY
