name: IGP Fusion v3 unified 68game accepted 800ms and source-graded P3 integration QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-fusion-v3-68game-integration.yml']
permissions: {contents: read}
concurrency:
  group: igp-fusion-v3-68game-integration
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 38d8892209ee4ec7c68fe78d1f1d8e4086a19cd9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public confidentiality and pinned private original NBA source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source free engine regressions and two actual original NBA integrated readbacks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_integrated_pulse_engine_v3.py'
          if ! python3 gamepulse/fusion/integrated_pulse_engine_v3.py --root . --manifest-only > "$RUNNER_TEMP/engine-status.json" 2> "$RUNNER_TEMP/engine-status.log"; then
            echo IGP_FUSION_SOURCE_MANIFEST_FAILED
            exit 40
          fi
          for gid in 0022600123 0022600107; do
            if ! python3 gamepulse/fusion/integrated_pulse_engine_v3.py --root . --game-id "$gid" --auto-first --output "$RUNNER_TEMP/fusion-$gid.json" > "$RUNNER_TEMP/fusion-$gid.log" 2>&1; then
              echo IGP_FUSION_REAL_NBA_ENGINE_READBACK_FAILED
              python3 - "$gid" <<'PY'
          import sys,os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/('fusion-'+sys.argv[1]+'.log')).read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('IGP_FUSION_REDACTED_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:95])
          PY
              exit 41
            fi
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'engine-status.json').read_text())
          assert m['games']==68 and m['engine_name']=='Integrated Pulse Tracking Engine'
          assert m['component']=='IGP Fusion' and m['engine_version']=='igp-fusion-v3.1-research'
          assert m['research_native_complete_over_total']==[492617,543024]
          assert m['research_continuous_10hz_complete_over_total']==[917686,1106941]
          assert m['experimental_ball_source_supported']==40367
          assert m['research_full_scene_candidates_not_promoted']==37182
          assert m['newly_accepted_tracking_scenes']==0
          summary={}
          for gid in ('0022600123','0022600107'):
              q=json.loads((Path(os.environ['RUNNER_TEMP'])/('fusion-'+gid+'.json')).read_text())
              assert len(q['rows'])==3 and q['engine']=='Integrated Pulse Tracking Engine'
              assert q['newly_accepted_tracking_scenes']==0
              assert q['candidate_ball_shadow_timestamps']>=1
              assert q['matched_short_source_bounded_xy_candidates']>=1
              assert q['accepted_800ms_model_mutated'] is False
              assert q['experimental_1200ms_model_mutated'] is False
              assert q['original_NBA_XYZ_PBP_official_ten_unchanged']
              for r in q['rows']:
                  assert r['utc_ms']==r['accepted_800ms']['utc_ms']==r['p3_research_1200ms']['utc_ms']
                  assert not r['physical_possession_certified']
              summary[gid]={
               'rows':len(q['rows']),
               'research_ball_candidate_timestamps':q['candidate_ball_shadow_timestamps'],
               'matched_short_bounded_hermite_timestamps':q['matched_short_source_bounded_xy_candidates'],
               'accepted_tracking_delta':0}
          print('IGP_FUSION_NBA_SOURCE_UNIFIED_V3_PASS',json.dumps(summary,sort_keys=True))
          PY
      - name: Full original NBA 68game source-grade v3 query smoke regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_68_p3_source_grade_query_all68_readback_v1.py --root . --output "$RUNNER_TEMP/all68-v3-private.json" > "$RUNNER_TEMP/all68-v3-private.log" 2>&1; then
            echo IGP_FUSION_68_GAME_SOURCE_GRADE_READBACK_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'all68-v3-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('IGP_FUSION_ALL68_REDACTED_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:90])
          print('IGP_FUSION_ALL68_GAMES_DONE',sum(z.startswith('P3_FASTBALL_QUERY_ALL68_ORIGINAL_GAME') for z in lines))
          PY
            exit 42
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'all68-v3-private.json').read_text())
          assert len(q['per_game'])==68
          assert q['totals']['games']==68 and q['totals']['rows']==204
          assert q['original_68_10hz_research_complete']==917686
          assert q['original_68_native_research_complete']==492617
          assert q['accepted_tracking_scene_delta']==0
          assert q['original_upstream_per_actor_interpolation_unresolved']
          assert q['original_NBA_PBP_UTC_XYZ_and_player_Ids_unchanged']
          print('IGP_FUSION_ALL68_SOURCE_QA',json.dumps(q['totals'],sort_keys=True))
          PY
      - name: Commit only original source private QA receipts, never public XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030
          git fetch -q origin "$BRANCH"
          git checkout -q -B igp-fusion-68qa "origin/$BRANCH"
          cp "$RUNNER_TEMP/all68-v3-private.json" "$dest/igp_68_p3_source_grade_query_all68_readback_v1.json"
          for gid in 0022600123 0022600107; do
            cp "$RUNNER_TEMP/fusion-$gid.json" "$dest/igp_fusion_v3_real_readback_$gid.json"
            git add -f "$dest/igp_fusion_v3_real_readback_$gid.json"
          done
          cp "$RUNNER_TEMP/engine-status.json" "$dest/igp_fusion_v3_engine_manifest_v1.json"
          git add -f "$dest/igp_68_p3_source_grade_query_all68_readback_v1.json" "$dest/igp_fusion_v3_engine_manifest_v1.json"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): integrated v3 single engine original 68 NBA games preserve accepted and research grades'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_FUSION_V3_68_NBA_INTEGRATION_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 43
