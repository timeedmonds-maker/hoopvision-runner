name: PR776 all Rockets original NBA XYZ one-shot source reuse
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-bulk-0009-original-xyz.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: pr776-bulk-original-game-0022600009
  cancel-in-progress: false
jobs:
  private-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GID: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public-content policy and hydrate private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/askpass-game" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-game"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-game" GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" "https://github.com/$R.git" "$RUNNER_TEMP/private-pulse"
          git -C "$RUNNER_TEMP/private-pulse" sparse-checkout set gamepulse/fusion
          echo "ROOT=$RUNNER_TEMP/private-pulse" >> "$GITHUB_ENV"
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Download exact existing 13-part NBA SDK release once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-sdk"
          gh api "repos/$R/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release.json"
          gh release download "gamepulse-sdk-$GID" -R "$R" --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/original-sdk"
          test "$(find "$RUNNER_TEMP/original-sdk" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          echo VERIFIED_PRIVATE_ARCHIVE_TRANSFER_13
      - name: Extract every original qualified NBA episode, fail closed against frozen QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          PYTHONPATH=gamepulse/fusion python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_extract_private_nba_event_xyz_2026.py'
          PYTHONPATH=gamepulse/fusion python3 gamepulse/fusion/bulk_private_source_episode_xyz_2026.py \
            --repo-root . --game-id "$GID" --max-episodes 50 \
            --archive-dir "$RUNNER_TEMP/original-sdk" \
            --release-manifest "$RUNNER_TEMP/release.json" \
            --official-lineup "gamepulse/fusion/official_lineup_clock/games/$GID.json" \
            --auto-qa "gamepulse/fusion/qa/auto_physics/00226000/$GID.json" \
            --nba-episode-view "gamepulse/fusion/materialized/nba_episode_tracking_pr776_20261025/$GID.json" \
            --original-qa "gamepulse/fusion/qa/official_native_episode_xyz_bridge_${GID}_20261026.json"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('gamepulse/fusion/materialized/private_native_event_xyz_pr776_20261026/0022600009')
          d=json.loads((root/'index_v2.json').read_bytes())
          assert d['source_qa_episode_count']==13
          assert d['materialized_event_episodes']==13
          assert d['quarantined_episode_count']==0
          assert d['physical_possessions_certified']==0
          assert d['original_archive_parts']==13
          for eid,entry in d['episodes'].items():
              obj=json.loads((root/entry['path']).read_bytes())
              assert obj['counts']['candidate_source_frames']==entry['source_frames']
              assert obj['counts']['complete_ten_plus_ball_frames']==entry['ten_plus_ball']
              assert len(obj['archive_part_sha256'])==13
          print('PRIVATE_ALL_13_NBA_EVENT_SOURCE_TRAJECTORIES_ACCEPTED',
            json.dumps({'episodes':d['materialized_event_episodes'],
                        'native_frames':d['candidate_native_source_frames'],
                        'ten_ball':d['ten_plus_ball_source_frames']},sort_keys=True))
          PY
      - name: Commit source-only original actor tracks to private 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          git config user.name "Game Pulse Free CPU Runner"
          git config user.email "gamepulse-runner@users.noreply.github.com"
          git add gamepulse/fusion/materialized/private_native_event_xyz_pr776_20261026/0022600009
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -qm "data(gamepulse): 13 source-verified Rockets NBA episodes native ten-player ball XYZ"
            git push -q origin "HEAD:$BRANCH"
          fi
          echo PRIVATE_ORIGINAL_13_EPISODE_XYZ_ACCEPTED
