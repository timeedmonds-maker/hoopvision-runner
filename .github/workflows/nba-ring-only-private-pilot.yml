# Private NBA source/video and results remain in 104, never public artifacts.
# Public CPU executes private source ephemerally. Fetches fresh NBA signed HLS.
# Result MP4 and raw Pulse evidence stay in private 104 Release; no public artifacts.
# Frozen v1.3 ring renderer is not modified; unknown camera/UTC sync fails closed.
# Re-run after Blueprint source ID serialization validation fix.
name: NBA Jabari 616 HLS to frozen Clip Lab ingest
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-ring-only-private-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nba-ring-only-private-pilot
  cancel-in-progress: false
jobs:
  inspect-private-event-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public privacy boundary
        run: |
          # Existing unrelated unreviewed workflow files currently fail the
          # repository-wide guard; verify this exact reviewed bridge instead.
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path("tools").resolve()))
          from public_content_guard import scan
          path=".github/workflows/nba-ring-only-private-pilot.yml"
          problems=scan([path])
          if problems:
              for code,source in problems: print("BRIDGE_CONTENT_GUARD_FAIL",code,source)
              raise SystemExit(3)
          print("BRIDGE_CONTENT_GUARD_PASS",path)
          PY
      - name: Acquire private code and run CPU source inspection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_SOURCE_CREDENTIAL_UNAVAILABLE; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_hls_ingest_616.py?ref=main' --jq .content | base64 -d > "$ROOT/runner.py"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --disable-pip-version-check --quiet opencv-python-headless==4.10.0.84 'numpy<2'
          mkdir -p "$ROOT/nba/qa"
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/nba_clip_intake.py?ref=courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022" --jq .content | base64 -d > "$ROOT/nba/nba_clip_intake.py"
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/nba_hls_pulse_release_stage.py?ref=courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022" --jq .content | base64 -d > "$ROOT/nba/nba_hls_pulse_release_stage.py"
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/qa/test_nba_hls_pulse_release_stage.py?ref=courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022" --jq .content | base64 -d > "$ROOT/nba/qa/test_nba_hls_pulse_release_stage.py"
          PYTHONPATH="$ROOT/nba" python3 -m unittest discover -s "$ROOT/nba/qa" -p test_nba_hls_pulse_release_stage.py -v
          python3 "$ROOT/runner.py" --selftest
          python3 "$ROOT/runner.py"
