# Private NBA source/video and results remain in 104, never public artifacts.
# Public CPU executes private source ephemerally. Fetches fresh NBA signed HLS.
# Result MP4 and raw Pulse evidence stay in private 104 Release; no public artifacts.
# Frozen v1.3 ring renderer is not modified; unknown camera/UTC sync fails closed.
# Re-run after Blueprint source ID serialization validation fix.
name: NBA Jabari 616 HLS to frozen Clip Lab ingest
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-ring-only-private-pilot.yml']
  workflow_dispatch:
    inputs:
      game_id:
        description: NBA game ID
        required: true
        type: string
        default: '0022600091'
      event_num:
        description: NBA shot event number
        required: true
        type: string
        default: '616'
      player_id:
        description: Exact NBA shooter player ID
        required: true
        type: string
        default: '1631095'
permissions:
  contents: read
concurrency:
  group: nba-ring-only-private-pilot
  cancel-in-progress: false
jobs:
  inspect-private-event-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      NBA_GAME_ID: ${{ inputs.game_id || '0022600091' }}
      NBA_EVENT_NUM: ${{ inputs.event_num || '616' }}
      NBA_PLAYER_ID: ${{ inputs.player_id || '1631095' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public privacy boundary
        run: |
          # Existing unrelated unreviewed workflow files currently fail the
          # repository-wide guard; verify this exact reviewed bridge instead.
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path("tools").resolve()))
          from public_content_guard import scan
          path=".github/workflows/nba-ring-only-private-pilot.yml"
          problems=scan([path])
          if problems:
              for code,source in problems: print("BRIDGE_CONTENT_GUARD_FAIL",code,source)
              raise SystemExit(3)
          print("BRIDGE_CONTENT_GUARD_PASS",path)
          PY
      - name: Acquire private code and run CPU source inspection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_SOURCE_CREDENTIAL_UNAVAILABLE; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_hls_ingest_event.py?ref=main' --jq .content | base64 -d > "$ROOT/runner.py"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --disable-pip-version-check --quiet opencv-python-headless==4.10.0.84 'numpy<2'
          mkdir -p "$ROOT/nba/qa"
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/nba_clip_intake.py?ref=courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022" --jq .content | base64 -d > "$ROOT/nba/nba_clip_intake.py"
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/nba_hls_pulse_release_stage.py?ref=courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022" --jq .content | base64 -d > "$ROOT/nba/nba_hls_pulse_release_stage.py"
          gh api "repos/timeedmonds-maker/104/contents/courtcoder/qa/test_nba_hls_pulse_release_stage.py?ref=courtcoder%2Fnba-clip-lab-gamepulse-layer-20261022" --jq .content | base64 -d > "$ROOT/nba/qa/test_nba_hls_pulse_release_stage.py"
          PYTHONPATH="$ROOT/nba" python3 -m unittest discover -s "$ROOT/nba/qa" -p test_nba_hls_pulse_release_stage.py -v
          python3 "$ROOT/runner.py" --selftest
          python3 "$ROOT/runner.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_616_visual_diagnostic.py?ref=main' --jq .content | base64 -d > "$ROOT/visual.py"
          python3 "$ROOT/visual.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/clip_lab_616_raw_scopes.py?ref=main' --jq .content | base64 -d > "$ROOT/raw_scopes.py"
          python3 "$ROOT/raw_scopes.py"
          mkdir -p "$ROOT/media"
          gh release download "clip-lab-hls-${NBA_GAME_ID}-${NBA_EVENT_NUM}" --repo timeedmonds-maker/104 --dir "$ROOT/media" --pattern "event${NBA_EVENT_NUM}-broadcast.mp4" --pattern "manifest.json"
          export VIDEO_TEST_ROOT="$ROOT/media"
          PYTHONPATH="$ROOT/nba" python3 - <<'PY'
          import os,json
          from pathlib import Path
          from nba_hls_pulse_release_stage import validate_release_handoff
          root=Path(os.environ["VIDEO_TEST_ROOT"])
          event=int(os.environ["NBA_EVENT_NUM"])
          media=(root/f"event{event}-broadcast.mp4").read_bytes()
          manifest=json.loads((root/"manifest.json").read_text())
          receipt=validate_release_handoff(media,manifest,
              expected_game=os.environ["NBA_GAME_ID"],expected_event=event,expected_player=int(os.environ["NBA_PLAYER_ID"]))
          assert receipt["analysis_dispatched"] is False
          assert receipt["pulse_assisted_processing_ready"] is False
          print("REAL_NBA_EVENT_MP4_NATIVE_CLIPLAB_SHA_AND_INTAKE_READY")
          PY
