name: IGP P3 fastball NBA <=600ms natural-duration matched original source validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p3-ball-natural-600ms-matched.yml']
permissions: {contents: read}
concurrency:
  group: igp-p3-ball-600ms-matched
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 040f4da1af46a5aa2a42da784f5e0c295e80658d
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Protect licensed NBA original SDK/official PBP SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test duration-matched real original NBA masked source versus frozen ball models
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_fastball_natural_span_matched_holdout_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_fastball_natural_span_matched_holdout_v1.py --root . --output "$RUNNER_TEMP/short-source-private.json" > "$RUNNER_TEMP/short-source-private.log" 2>&1; then
            echo IGP_P3_NATURAL_DURATION_MATCHED_NBA_SOURCE_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'short-source-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('P3_SHORT_SOURCE_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:80])
          print('P3_SHORT_SOURCE_GAMES_FINISHED',sum(x.startswith('P3_BALL_PHYSICS_HELDOUT_GAME') for x in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'short-source-private.json').read_text())
          assert q['original_NBA_source_bracket_max_ms']==600
          assert q['research_only_source_center_blackout_radius_ms']==[50,100,150]
          assert len(q['development']['games'])==16 and len(q['disjoint_evaluation']['games'])==8
          assert set(q['development']['games']).isdisjoint(q['disjoint_evaluation']['games'])
          assert q['canonical_68_native_complete_unchanged']==492617
          assert q['canonical_68_10hz_complete_unchanged']==917686
          assert q['new_accepted_physical_positions']==0
          assert q['original_SDK_PBP_official_ten_unchanged']
          for r in ('50','100','150'):
              j=q['disjoint_evaluation']['pooled'][r]
              assert j['n']>=20 and all(a['three_d_ft']['n']==j['n'] for a in j['models'].values())
          print('P3_ORIGINAL_NBA_SHORT_GAP_MATCHED_SOURCE_QA',json.dumps({
            group:{r:{'n':v['n'],
              'p95_ft':{k:s['three_d_ft']['p95_ft'] for k,s in v['models'].items()},
              'p99_ft':{k:s['three_d_ft']['p99_ft'] for k,s in v['models'].items()}}
              for r,v in q[group]['pooled'].items()}
            for group in ('development','disjoint_evaluation')},sort_keys=True))
          PY
      - name: Commit actual NBA original source scores privately only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_fastball_natural_span_matched_holdout_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-natural-short-masked "origin/$BRANCH"
          cp "$RUNNER_TEMP/short-source-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): heldout NBA original fastball <=600ms natural bracket same-source model accuracy'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_NATURAL_SHORT_SOURCE_MASK_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
