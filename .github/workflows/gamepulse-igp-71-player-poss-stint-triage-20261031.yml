name: IGP 71game player OffRtg POSS substitution variance and scorer source triage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-71-player-poss-stint-triage-20261031.yml']
permissions: {contents: read}
concurrency:
  group: igp-71-player-nba-possession-stint-residual-triage
  cancel-in-progress: false
jobs:
  analyze-original-private-71:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-71-player-advanced-rotation-possession-reconcile-20261031
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read original private QA and do deterministic full 71-game residual triage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_v32_71_player_possession_variance_triage_v1.py
          python3 gamepulse/fusion/igp_v32_71_player_possession_variance_triage_v1.py \
            --root . --out "$RUNNER_TEMP/igp-71-player-possession-variance-triage.json"
          echo IGP_PLAYER_71_SCORER_ROTATION_POSS_VARIANCE_TRIAGE_EXECUTED
      - name: Commit immutable original-source player substitution and possession variance targets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_71_nba_player_offrtg_poss_substitution_variance_triage_v1.json
          mkdir -p "$(dirname "$dest")"
          if test -e "$dest"; then
            cmp -s "$RUNNER_TEMP/igp-71-player-possession-variance-triage.json" "$dest"
            echo IGP_PLAYER_POSSESSION_TRIAGE_EXISTING_SHA_MATCH
            exit 0
          fi
          cp "$RUNNER_TEMP/igp-71-player-possession-variance-triage.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa: 71-game NBA player-POSS residual substitution boundary scorer target triage'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 44
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
               echo IGP_71_PLAYER_SUBSTITUTION_POSSESSION_TRIAGE_PRIVATE_COMMITTED
               exit 0
            fi
            sleep "$n"
          done
          exit 45
