name: Clip Lab artifact handoff smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-artifact-handoff-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Create tiny safe transfer fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          printf 'HOOPVISION_ARTIFACT_HANDOFF_OK\\n' > "$RUNNER_TEMP/fixture/handshake.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hoopvision-handoff-smoke
          path: ${{ runner.temp }}/fixture/handshake.txt
          retention-days: 1
          if-no-files-found: error
