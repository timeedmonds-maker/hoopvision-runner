name: PR776 original SDK frames to official NBA real UTC windows 36
# Strict provisional temporal assignment. Private original XYZ never enters public logs.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-original-xyz-timeactual-chain-36.yml']
permissions: {contents: read}
concurrency:
  group: pr776-original-36-sdk-timeactual-source-crosswalk
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner and clone canonical private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Regression tests and 36 original SDK to NBA official elapsed UTC chain crosswalk
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_original_xyz_timeactual_chain_join_36_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -v -p test_igp_official_timeactual_wallclock_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -v -p test_igp_original_xyz_timeactual_chain_join_36_2026.py
          OUT=gamepulse/fusion/materialized/igp_original_sdk_to_nba_realutc_36_v1
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_original_xyz_timeactual_chain_join_36_2026.py --root . --out-dir "$OUT"
          python3 - "$OUT" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1]);idx=json.loads((p/'index.json').read_text())
          assert idx['source_games']==36
          assert len(idx['games'])==36
          assert idx['physical_possessions_certified']==0
          c=idx['counts']
          assert c['native_timestamps']==1203986
          assert c['direct_ten_plus_ball_timestamps']==387956
          assert c['native_timestamps']==(
            c['unambiguous_NBA_logged_UTC_window_native_frames']+
            c['ambiguous_multiple_NBA_logged_UTC_window_native_frames']+
            c['unassigned_NBA_logged_UTC_window_native_frames'])
          for gid,row in idx['games'].items():
              raw=(p/row['path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              assert json.loads(raw)['physical_possessions_certified']==0
          print('IGP_NBA_36_NATIVE_REALWORLD_UTC_CROSSWALK_SHA_ACCEPTED',json.dumps(c,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 37
          git commit -q -m "data(igp): SHA-verified 36-game source SDK frames ↔ NBA real UTC candidate window crosswalk"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_36_ORIGINAL_SDK_REALUTC_CHAIN_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 18
