name: IGP G3 all68 exact original NBA source actor conflict identity and masked source tracking accuracy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g3-all68-conflict-physical-source-holdout.yml']
permissions: {contents: read}
concurrency:
  group: igp-g3-68-source-actor-conflicts-masked-holdout
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: dba886d3c5015f1529dc81a74de6207e47eb2ec2
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Original NBA private source and immutable SHA guarded access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Verify original SDK actor extras preserved and G3 source mask independent of original target
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g3_all68_conflicts_masked_qa_v1.py'
      - name: Measured actual original full68 NBA G2 conflict-selected ten ball and source masked XY feet error
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_g3_all68_conflicts_masked_qa_v1.py \
              --root . --output "$RUNNER_TEMP/igp-g3-private.json" > "$RUNNER_TEMP/igp-g3-private.log" 2>&1; then
            echo IGP_G3_ORIGINAL_NBA_FROZEN_68_ID_CONFLICT_QA_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'igp-g3-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(lines) if x.strip()),'NO_LOG')
          print('IGP_G3_PRIVATE_REDACTED_ERROR_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:100])
          print('IGP_G3_ORIGINAL_68_GAMES_COMPLETED',sum(x.startswith('IGP_G3_ORIGINAL_NBA_ID_CONFLICT_GAME') for x in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-g3-private.json').read_text())
          t=j['totals'];hold=j['source_only_vs_official_conditioned_masked_holds']
          assert len(j['by_game'])==68
          assert t['games']==68
          assert t['all_NBA_G2_lineup_candidate_frames']==603823
          assert t['G2_conflicting_source_actor_frames']==178456
          assert t['regression_complete10_ball_native']==0
          assert j['incremental_conflict_10_player_and_ball_model_candidate_frames']>=0
          assert j['incremental_official_player_position_slots']>=0
          assert j['new_production_accepted_full11_scene_delta']==0
          assert j['independently_certified_physical_possessions']==0
          assert hold['original_entire_target_UTC_hidden_from_both_models']
          print('IGP_G3_REAL_ORIGINAL_NBA_SOURCE_CONFLICT_ACCURACY_DELTA',json.dumps({
             '68_g2_candidate_native':t['all_NBA_G2_lineup_candidate_frames'],
             'source_actor_conflict_native':t['G2_conflicting_source_actor_frames'],
             'baseline_correct_official_ten_plus_ball':t['baseline_correct_official_10_ball_complete'],
             'G3_official_ten_plus_ball':t['challenger_correct_official_10_ball_complete'],
             'full_ten_ball_candidate_gain':j['incremental_conflict_10_player_and_ball_model_candidate_frames'],
             'additional_correct_official_player_positions':j['incremental_official_player_position_slots'],
             'baseline_masked_source_accuracy':hold['baseline_source_ID_C0_B'],
             'new_G3_masked_source_accuracy':hold['NBA_roster_conditioned_C0_B'],
             'physical_video_groundtruth':False,'promoted':0},sort_keys=True))
          PY
      - name: Commit no raw licensed actor coordinates to PUBLIC runner only original private SHA QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g3_all68_official_conflict_masked_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B igp-g3-68-conflict-model "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-g3-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): all68 real original G2 source conflicts conditioned ten and ball coverage, masked heldout XY and ball XYZ p95'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G3_ALL68_ORIGINAL_NBA_CONFLICT_SOURCE_QA_ACCEPTED_PRIVATE
              exit 0
            fi
            sleep "$i"
          done
          exit 42
