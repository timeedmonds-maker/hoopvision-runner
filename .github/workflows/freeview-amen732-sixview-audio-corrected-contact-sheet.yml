# Original NBA source video remains ephemeral; ONLY private 104 release receives source frames.
name: Amen732 six real video synchronized source frame QA panels
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-sixview-audio-corrected-contact-sheet.yml']
permissions:
  contents: read
concurrency:
  group: amen732-sixvideo-native-synchronization-panel
  cancel-in-progress: false
jobs:
  source-panels:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check no original licensed media enters public repository
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/amen732_sixview_audio_alignment_v2.py tools/amen732_sixview_native_frame_package_v2.py
      - name: Install exact source video decoders and audio alignment tools
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' 'scipy>=1.11,<1.15' 'opencv-python-headless==4.10.0.84' 'Pillow>=10,<12'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y ffmpeg >/dev/null
          fi
      - name: Reacquire all six original 30fps camera videos with immutable per-file source hashes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amen732-v2/native" "$RUNNER_TEMP/amen732-v2/output"
          python3 tools/amen732_official_sixvideo_acquire.py \
            --root "$RUNNER_TEMP/amen732-v2/native" \
            --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)"
      - name: Perform six-view audio graph and export exact original frame candidates plus UHD visual comparison
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-v2"
          python3 tools/amen732_sixview_audio_alignment_v2.py \
            --source "$ROOT/native" --out "$ROOT/audio.json" \
            --ffmpeg "$(command -v ffmpeg)" --broadcast-seed 9.39
          python3 tools/amen732_sixview_native_frame_package_v2.py \
            --source "$ROOT/native" --audio-qa "$ROOT/audio.json" --out "$ROOT/output"
          python3 - "$ROOT/output/amen732-sixview-native-exact-frame-package-v2.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          assert q['original_source_video_count']==6 and q['source_2d_frame_count_exported']==12
          assert len(q['sheets'])==2
          assert q['valid_3d_novel_view_count']==0
          print('ORIGINAL_SIX_VIDEO_ALIGNED_NATIVE_4K_SOURCE_CONTACT_SHEETS_PASS',
            'pairwise_consistent_audio_edges',q['camera_pairs_matched'],
            'maximum_audio_graph_error_ms',q['cycle_residual_max_ms'])
          PY
      - name: Save synchronized real original six-camera frames and UHD panels exclusively in private 104
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo PRIVATE_RELEASE_WRITE_UNAVAILABLE; exit 4; }
          ROOT="$RUNNER_TEMP/amen732-v2"
          TAG=freeview-amen732-sixview-original-contact-consensus-20261028
          if ! gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title "Amen732 six original action-consensus native camera QA panels" \
              --notes "Six true source frames aligned by 15 real audio pairs; frame exposure and ball contact NOT independently certified. No 3D rendering pass." \
              --latest=false >/dev/null
          fi
          gh release upload "$TAG" "$ROOT/output/"*.jpg "$ROOT/output/"*.png \
            "$ROOT/output/amen732-sixview-native-exact-frame-package-v2.json" \
            "$ROOT/audio.json" --repo timeedmonds-maker/104 --clobber >/dev/null
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/receipt.json"
          python3 - "$ROOT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);assets={x['name']:x for x in json.loads((root/'receipt.json').read_text())['assets']}
          files=list((root/'output').glob('*.jpg'))+list((root/'output').glob('*.png'))+[
            root/'output'/'amen732-sixview-native-exact-frame-package-v2.json',root/'audio.json']
          assert len(files)==16,len(files)
          for p in files:
            assert assets[p.name]['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest(),p.name
          print('SIX_SYNCHRONIZED_SOURCE_VIDEOS_PRIVATE_HASH_READBACK_PASS',len(files))
          PY
          python3 - "$ROOT/output/amen732-sixview-synchronized-candidate-3840x2160.jpg" "$ROOT/preview.jpg" "$ROOT/put.json" <<'PY'
          import base64,json,sys
          from PIL import Image
          with Image.open(sys.argv[1]) as im:
            im.resize((1280,720),Image.Resampling.LANCZOS).save(sys.argv[2],quality=70)
          data=open(sys.argv[2],'rb').read()
          assert len(data)<950000
          open(sys.argv[3],'w').write(json.dumps({
            'branch':'research/amen-wemby-freeze-spin-20261024',
            'message':'evidence(freeview): audio-corrected six-camera actual NBA frame preview, still uncertified',
            'content':base64.b64encode(data).decode()}))
          PY
          TARGET='repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_audio_contact_consensus_sixview_review_20261028.jpg'
          CURRENT="$(gh api "$TARGET?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha 2>/dev/null || true)"
          if [ -n "$CURRENT" ]; then
            python3 - "$ROOT/put.json" "$CURRENT" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]));j['sha']=sys.argv[2]
          open(sys.argv[1],'w').write(json.dumps(j))
          PY
          fi
          gh api --method PUT "$TARGET" --input "$ROOT/put.json" >/dev/null
          echo SIX_VIEW_NATIVE_CONTACT_PREVIEW_SAVED_PRIVATE
