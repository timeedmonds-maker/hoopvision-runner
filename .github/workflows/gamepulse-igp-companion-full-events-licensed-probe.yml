name: "IGP authorized NBA SDK original companion biomechanical events two-game acquisition check"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-companion-full-events-licensed-probe.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  licensed-original-companion:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: '0022600009'
            tipoff: '2026-10-24T01:30:00Z'
          - id: '0022600129'
            tipoff: '2026-10-28T00:00:00Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      NBA_GAME_ID: ${{ matrix.id }}
      NBA_TIPOFF_UTC: ${{ matrix.tipoff }}
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      IGP_PRIVATE_CAPTURE_DIR: ${{ runner.temp }}/igp-original
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check source scope, public confidentiality guard, original licensed client
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$IGP_PRIVATE_CAPTURE_DIR"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          cd tools/licensed_feed
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Verify whether existing authorized SDK actually exposes complete biomechanical shot events
        run: |
          set -euo pipefail
          node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/private_probe.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["IGP_PRIVATE_CAPTURE_DIR"])/"companion_probe_receipt.json"
          a=json.loads(p.read_bytes())
          assert a["game_id"]==os.environ["NBA_GAME_ID"]
          assert a["authentication_bypass_attempted"] is False
          assert a["raw_29joint_pose_60hz_observed"] is False
          print("IGP_AUTHORIZED_SDK_COMPANION_SOURCE_AVAILABILITY",a["game_id"],
             "source_status",a["status"],
             "observed_shot_details",a["shot_detail_objects"],
             "event_get_200",a["observed_200_event_responses"],
             "slot_get_200",a["observed_200_slot_responses"])
          PY
      - name: Persist only actually captured original NBA 30-feature source privately with receipt
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion/qa gamepulse/fusion/evidence
          cd "$RUNNER_TEMP/private"
          dest="gamepulse/fusion/qa/igp_progress_20261029/igp_companion_sdk_authorized_source_${NBA_GAME_ID}_20261029.json"
          test ! -e "$dest"
          cp "$IGP_PRIVATE_CAPTURE_DIR/companion_probe_receipt.json" "$dest"
          git add -f "$dest"
          if test -f "$IGP_PRIVATE_CAPTURE_DIR/companion_original_sdk_response.json"; then
            raw="gamepulse/fusion/evidence/companion_sdk_original_${NBA_GAME_ID}/sdk_observed_original.json"
            mkdir -p "$(dirname "$raw")"
            test ! -e "$raw"
            cp "$IGP_PRIVATE_CAPTURE_DIR/companion_original_sdk_response.json" "$raw"
            git add -f "$raw"
            echo IGP_AUTHENTIC_ORIGINAL_COMPANION_SOURCE_IS_PRESERVED_PRIVATE
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -q -m "qa(igp): source-read original NBA companion shot biomechanics SDK eligibility"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_COMPANION_AUTHORIZED_SDK_SOURCE_PROBE_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$i"
          done
          exit 23
