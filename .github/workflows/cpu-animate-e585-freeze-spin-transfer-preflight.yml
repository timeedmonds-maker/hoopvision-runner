name: CPU Animate E585 historical Freeze Spin v6/PBP private source transfer preflight
on:
  push:
    branches: ['cpu-animate/warriors-amen-sengun-e585-cpu-rebuild-20261113']
    paths: ['.github/workflows/cpu-animate-e585-freeze-spin-transfer-preflight.yml']
permissions:
  contents: read
concurrency:
  group: cpu-animate-e585-freeze-spin-v6-reference-only
  cancel-in-progress: false
jobs:
  freeze-spin-reference-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify actual historical Freeze Spin source and CPU Animate schema contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test ! -e /dev/nvidia0
          test ! -e /dev/kfd
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          test "$(gh api repos/timeedmonds-maker/44 --jq .private)" = true || { echo FREEZE_SPIN_PRIVATE_REPO44_NOT_AUTHORIZED; exit 11; }
          gh auth setup-git
          code="$RUNNER_TEMP/private-104-freeze-spin-bridge"
          hist="$RUNNER_TEMP/private-freeze-spin-history"
          mkdir -p "$hist"
          trap 'rm -rf "$code" "$hist" "$RUNNER_TEMP/bridge-preflight.json" "$RUNNER_TEMP/bridge-upload.json"' EXIT
          git clone -q --filter=blob:none --depth=1 --no-checkout \
            --branch cpu-animate/e585-freeze-spin-broadcast-adapter-20261113 \
            https://github.com/timeedmonds-maker/104.git "$code"
          git -C "$code" sparse-checkout init --no-cone
          git -C "$code" sparse-checkout set --no-cone \
            '/cpu_animate/__init__.py' \
            '/cpu_animate/freeze_spin_broadcast_adapter.py' \
            '/cpu_animate/test_freeze_spin_broadcast_adapter.py'
          git -C "$code" checkout -q cpu-animate/e585-freeze-spin-broadcast-adapter-20261113
          test "$(git -C "$code" rev-parse HEAD)" = 1c95fa2d5709b27a7b650e78f7cbf41dae6da542
          cd "$code"
          python3 -m unittest cpu_animate.test_freeze_spin_broadcast_adapter -v
          for spec in adams_jazz_game_camera_registry_v6.json adams_jazz_play_by_play_frame_c_wide_court_v65.json adams_jazz_frame_c_broadcast_floor_v86.json; do
            if ! gh api "repos/timeedmonds-maker/44/contents/freeze_spin/$spec?ref=codex%2Fmulti-angle-freeze-spin-poc" > "$hist/$spec.api.json"; then
              echo FREEZE_SPIN_PRIVATE_AUTHORIZED_HISTORICAL_FILE_NOT_ACCESSIBLE
              exit 12
            fi
            python3 - "$hist/$spec.api.json" "$hist/$spec" <<'PY'
          import json,base64,sys,pathlib
          src=json.load(open(sys.argv[1]))
          assert src["encoding"]=="base64" and len(src["sha"])==40
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(src["content"]))
          PY
          done
          export FREEZE_HIST="$hist"
          export CPU_BRIDGE_QA="$RUNNER_TEMP/bridge-preflight.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          from cpu_animate.freeze_spin_broadcast_adapter import historical_freeze_spin_preflight,target_status
          root=pathlib.Path(os.environ["FREEZE_HIST"])
          names=["adams_jazz_game_camera_registry_v6.json",
                 "adams_jazz_play_by_play_frame_c_wide_court_v65.json",
                 "adams_jazz_frame_c_broadcast_floor_v86.json"]
          values=[json.loads((root/n).read_text()) for n in names]
          report=historical_freeze_spin_preflight(*values)
          report["source_provenance"]={n:{
             "repository":"timeedmonds-maker/44",
             "branch":"codex/multi-angle-freeze-spin-poc",
             "git_blob_sha":json.loads((root/(n+".api.json")).read_text())["sha"],
             "sha256":hashlib.sha256((root/n).read_bytes()).hexdigest()}
             for n in names}
          report["target_preflight"]=target_status(report)
          assert report["historical_broadcast_v90_accepted"]
          assert report["play_by_play_and_broadcast_same_view_family"]
          assert report["render_authorized"] is False
          assert report["target_camera_state_calibrated"] is False
          assert "Utah_camera_physical_center" in report["non_transferable_to_target"]
          pathlib.Path(os.environ["CPU_BRIDGE_QA"]).write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("FREEZE_SPIN_PRIVATE_HISTORICAL_SOURCE_BRIDGE_PASS",
              {"registry":"v6","source_game":report["source_freeze_spin_game"],
               "target":"0022600225","model_available":True,
               "Utah_camera_pose_reused":False,"target_physical_camera_accepted":False,
               "M1_accepted":False})
          PY
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ["CPU_BRIDGE_QA"])
          dest="docs/cpu_animate/0022600225_e585_freeze_spin_historical_to_play_by_play_preflight.json"
          obj={"message":"qa(cpu-animate): [skip ci] authentic Freeze Spin registry v6 + PBP court model source-pinned transfer preflight; no Utah pose reuse",
               "branch":"cpu-animate/e585-freeze-spin-broadcast-adapter-20261113",
               "content":base64.b64encode(p.read_bytes()).decode()}
          inp=pathlib.Path(os.environ["RUNNER_TEMP"])/"bridge-upload.json"
          inp.write_text(json.dumps(obj))
          r=subprocess.run(["gh","api","-X","PUT","repos/timeedmonds-maker/104/contents/"+dest,
                            "--input",str(inp)],capture_output=True,text=True)
          if r.returncode:raise RuntimeError("PRIVATE_104_FREEZE_SPIN_PREFLIGHT_REPORT_COMMIT_FAILED")
          print("PRIVATE_HOU_GSW_FREEZE_SPIN_SOURCE_PREFLIGHT_SAVED")
          PY
