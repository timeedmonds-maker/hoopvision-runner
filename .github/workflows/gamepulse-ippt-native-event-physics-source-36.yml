name: IPPT original NBA all-PBP per-event physical XY source-only hypothesis shot release/rebound 36 games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-native-event-physics-source-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  nba-original-event-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      EXPECTED_PRIVATE_SHA: a924a3451dee4830647b171bcc8699d867bd377e
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public content guard and exact SHA original NBA research private source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b research/ippt-event-snapshots-separate-20261028 \
             https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Source-free event-scoped original shot/rebound causal and negative regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_all_pbp_event_source_physics_candidates_2026.py
          python3 -m unittest -v \
            gamepulse/fusion/test_igp_ippt_all_pbp_event_source_physics_candidates_2026.py \
            gamepulse/fusion/test_igp_ippt_rebound_native_label_xy_crosscheck_2026.py
      - name: Original private NBA two game source event physics candidates
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_event_source_physics_candidates_2026.py \
             --root . --games 0022600009 0022600092
          echo "IPPT_TWO_GAME_ORIGINAL_SHOT_REBOUND_SOURCE_HYPOTHESES_QA_PASS"
      - name: All 36 original NBA PBP games all shot/rebound source-physics candidate event IDs
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_event_source_physics_candidates_2026.py \
             --root . | tee "$RUNNER_TEMP/ippt_native_event_candidate_aggregate.log"
          echo "IPPT_ALL36_ORIGINAL_SHOT_REBOUND_SOURCE_EVENT_HYPOTHESES_PASS"
      - name: Publish strictly aggregate-only player/ball source availability by NBA action class
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ippt_native_event_candidate_aggregate.log"
          report={"github_run_id":os.environ["GITHUB_RUN_ID"],
            "prior_job_status":os.environ["QA_JOB_RESULT"],
            "private_code_SHA":"a924a3451dee4830647b171bcc8699d867bd377e"}
          if p.exists():
            lines=[z.partition(" ")[2] for z in p.read_text().splitlines()
                if z.startswith("IPPT_NBA_ALL36_PBP_SOURCE_PHYSICS_EVENT_HYPOTHESIS_QA ")]
            if len(lines)==1:
              z=json.loads(lines[0])
              report.update({"games":z["games"],"counts":z["counts"],
                             "candidate_rows":z["candidate_rows"],
                             "video_certified_physical_event_times":False})
          (Path(os.environ["RUNNER_TEMP"])/"ippt_original_physics_qa_note.md").write_text(
            "Original NBA original source shot/rebound spatial motion hypotheses ONLY, not video-certified timestamps. No original ball/player XYZ, per-event personal identity or native UTC published.\n\n~~~json\n"+
             json.dumps(report,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          gh issue comment 137 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_original_physics_qa_note.md"
# No private original licensed NBA actor/ball tracking XYZ in public runner or artifacts.
