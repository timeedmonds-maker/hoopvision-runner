name: PR776 source NBA chain trajectories 28-game QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-chain-queryable-28-qa.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private guard and canonical source clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Verify 28-game source chain XYZ queryability
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_native_chain_xyz_28_manifest_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261026/native_chain_xyz_queryability_28_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_native_chain_xyz_28_manifest_2026.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          c=d['counts']
          assert d['source_games']==28 and len(d['games'])==28
          assert c['matched_provisional']==532
          assert c['queryable_chain_windows']+c.get('source_episode_not_materialized',0)+c.get('no_xyz_frames_in_native_window',0)==532
          assert d['physical_possessions_certified']==0
          print('IGP_SOURCE_CHAIN_TRAJECTORY_QUERYABILITY_ACCEPTED',json.dumps(c,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -q -m "data(igp): SHA-verify NBA chain to original ten-player XYZ queryability 28 games"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then echo IGP_28_CHAIN_TRAJECTORY_QUERYABILITY_PRIVATE_COMMITTED; exit 0; fi
            sleep "$i"
          done
          exit 14
