name: PR776 single missing lineup ID and source XYZ QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-chain-queryable-28-qa.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private guard and canonical source clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Verify 28-game source chain XYZ queryability
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_lineup_identity_completion_2026.py gamepulse/fusion/igp_lineup_identity_28_coverage_audit_2026.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p test_igp_lineup_identity_completion_2026.py
          OUT=gamepulse/fusion/qa/igp_progress_20261026/official_lineup_one_missing_28_source_audit_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_lineup_identity_28_coverage_audit_2026.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          c=d['counts']
          assert d['source_game_count']==28
          assert c['verified_candidate_chains']==412
          assert c['frames']==22373
          assert c['missing_coordinate_slots']==3818
          assert d['roster_missing_id_already_known'] is True
          assert d['coordinates_imputed_from_roster']==0
          assert d['physical_possessions_certified']==0
          print('IGP_OFFICIAL_ONE_MISSING_SOURCE_QA_ACCEPTED',json.dumps(c,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -q -m "data(igp): audit one missing player identity against 28-game original SDK XYZ"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then echo IGP_28_CHAIN_TRAJECTORY_QUERYABILITY_PRIVATE_COMMITTED; exit 0; fi
            sleep "$i"
          done
          exit 14
