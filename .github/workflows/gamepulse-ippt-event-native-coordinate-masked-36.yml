name: Integrated Pulse exact native NBA shot event player XY and ball 3D masked QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-event-native-coordinate-masked-36.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  like-for-like-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public guard and read-only private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
              "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
              gamepulse/fusion data/extensions/nba_blueprint_2026_27
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Native source-frame concealment and 2D/3D metric tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_shot_event_like_for_like_source_holdout_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_shot_event_like_for_like_source_holdout_2026.py
      - name: Source-verified shot frame concealment on all 36 private NBA games
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_shot_event_like_for_like_source_holdout_2026.py --root .
          echo "IPPT_NATIVE_SHOT_XY_BALL3D_ALL36_QA_PASS"
