name: IPPT all NBA PBP same-UTC physical sequence constraints, all 36 games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-all-pbp-causal-bundles.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  nba-all-event-causal-bundles:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: eb4bba9eda6656ce33714d47aeaf0f7b132155d9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and pinned private SHA clone original accepted 36 NBA PBP
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Source-free PBP scorer UTC bundle causal event ordering regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_all_pbp_causal_event_bundle_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_all_pbp_causal_event_bundle_2026.py
      - name: Original 36 NBA PBP games all scorer UTC bundle graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_causal_event_bundle_2026.py \
             --root . | tee "$RUNNER_TEMP/ippt_causal_bundle_counts.log"
          echo "IPPT_ALL36_SOURCE_PBP_CAUSAL_EVENT_GRAPH_PASS"
      - name: Publish aggregate-only NBA PBP collision family receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ippt_causal_bundle_counts.log"
          r={"github_run_id":os.environ["GITHUB_RUN_ID"],
             "prior_job_status":os.environ["QA_JOB_RESULT"],
             "private_code_SHA":"eb4bba9eda6656ce33714d47aeaf0f7b132155d9"}
          if p.exists():
            rows=[x.partition(" ")[2] for x in p.read_text().splitlines()
                  if x.startswith("IPPT_ALL36_NBA_PBP_CAUSAL_SAME_UTC_EVENT_BUNDLE_QA ")]
            if len(rows)==1:
              z=json.loads(rows[0]);r.update({"games":z["games"],
                   "counts":z["counts"],"physical_event_times_video_verified":False})
          (Path(os.environ["RUNNER_TEMP"])/"ippt_causal_bundle_comment.md").write_text(
             "Original NBA PBP all-event logical scorer-UTC episode/cause graph counts, no individual event times, player IDs or licensed tracking coordinates.\n\n~~~json\n"+
             json.dumps(r,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          gh issue comment 135 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_causal_bundle_comment.md"
# Do not publish private original NBA XYZ or individual event start times.
