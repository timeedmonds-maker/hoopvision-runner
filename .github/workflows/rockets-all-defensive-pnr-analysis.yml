name: Rockets all defensive PnR tracking review (private)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rockets-all-defensive-pnr-analysis.yml']
  pull_request:
    paths: ['.github/workflows/rockets-all-defensive-pnr-analysis.yml','tools/public_content_guard.py']
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
  private-analysis:
    needs: guard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read verified tracking, process all candidates, write private evidence
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api repos/timeedmonds-maker/104/contents/gamepulse/coverage/pnr_detector_v0.py --jq .content | base64 -d > /tmp/pnr_detector_v0.py
          gh api repos/timeedmonds-maker/104/contents/gamepulse/coverage/rockets_all_defensive_pnr_analysis.py --jq .content | base64 -d > /tmp/rockets_all_defensive_pnr_analysis.py
          python3 -m py_compile /tmp/*.py
          python3 /tmp/rockets_all_defensive_pnr_analysis.py --selftest
          python3 /tmp/rockets_all_defensive_pnr_analysis.py
          rm -f /tmp/pnr_detector_v0.py /tmp/rockets_all_defensive_pnr_analysis.py
