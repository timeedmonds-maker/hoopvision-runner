name: Integrated Pulse Blueprint common shot event timing reverse engineering 36 games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-blueprint-common-delay-36.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common-delay:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard and original private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set \
            gamepulse/fusion data/extensions/nba_blueprint_2026_27
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Guard temporal oracle and held-out timing methodology with source-free tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_blueprint_common_timing_reverse_engineer_2026.py
          python3 -m unittest -v gamepulse/fusion/test_igp_ippt_blueprint_common_timing_reverse_engineer_2026.py
      - name: All 36 original NBA games six development thirty held-out timing inverse
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_blueprint_common_timing_reverse_engineer_2026.py --root .
          echo "IPPT_BLUEPRINT_COMMON_DELAY_36_ORIGINAL_SOURCE_PASS"

# QA only: all inverse match operations are held out from published physics truth.

# Rerun after source-free test corrected against actual oracle warning.
