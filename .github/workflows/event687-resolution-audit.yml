name: Event 687 resolution audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/event687-resolution-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet requests pillow
      - name: Audit all resolution paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, os, re, subprocess, urllib.parse, hashlib
          from pathlib import Path
          import requests
          from PIL import Image, ImageChops, ImageStat

          gid='0022600001'; ev=687; pid=1628369
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          out=Path('out'); out.mkdir(exist_ok=True)
          S=requests.Session(); S.headers.update({'User-Agent':UA,'Referer':'https://clips.nba.com/','Accept':'*/*'})

          def signed_join(base,child):
              j=urllib.parse.urljoin(base,child)
              bp=urllib.parse.urlsplit(base); cp=urllib.parse.urlsplit(j)
              if bp.query and not cp.query:
                  j=urllib.parse.urlunsplit(cp._replace(query=bp.query))
              return j

          def ladder(master, sess=S):
              rr=sess.get(master,timeout=30)
              return parse_playlist(master,rr)

          def parse_playlist(master,rr):
              rec={'url':master,'http_status':rr.status_code,'content_type':rr.headers.get('content-type'),'bytes':len(rr.content)}
              try: rr.raise_for_status()
              except Exception as e:
                  rec['error']=repr(e); return rec
              text=rr.text
              rec['is_hls']='#EXTM3U' in text
              variants=[]
              lines=[x.strip() for x in text.splitlines() if x.strip()]
              for i,line in enumerate(lines):
                  if not line.startswith('#EXT-X-STREAM-INF'): continue
                  bm=re.search(r'BANDWIDTH=(\d+)',line); bw=int(bm.group(1)) if bm else None
                  rm=re.search(r'RESOLUTION=(\d+)x(\d+)',line)
                  wh=[int(rm.group(1)),int(rm.group(2))] if rm else None
                  child=next((z for z in lines[i+1:i+5] if not z.startswith('#')),None)
                  variants.append({'bandwidth':bw,'resolution':wh,'url':signed_join(master,child) if child else None})
              rec['variants']=variants
              rec['max_resolution']=max((v['resolution'] for v in variants if v['resolution']),key=lambda x:x[0]*x[1],default=None)
              return rec

          # clips.nba.com all official angle masters and full ladders
          page=f'https://clips.nba.com/?gameNo={gid}&eventNum={ev}&source=grs'
          pr=S.get(page,timeout=45); pr.raise_for_status()
          tm=re.search(r'<title>(.*?)</title>',pr.text,re.I|re.S)
          title=html.unescape(tm.group(1).strip()) if tm else ''
          angle_masters=[]
          for m in re.finditer(r'<option\s+value=["\']([^"\']+)["\']([^>]*)>(.*?)</option>',pr.text,re.I|re.S):
              u=html.unescape(m.group(1).strip())
              label=re.sub(r'<[^>]+>','',html.unescape(m.group(3))).strip()
              if '.m3u8' in u.lower():
                  rec={'label':label or 'unlabelled','master':u}
                  rec['ladder']=ladder(u)
                  angle_masters.append(rec)

          # xFG row exact event + advertised video assets
          X=requests.Session()
          X.headers.update({'User-Agent':UA,'Referer':'https://www.nba.com/','Origin':'https://www.nba.com','Accept':'application/json, text/plain, */*'})
          xr=X.get('https://stats.gleague.nba.com/stats/shotqualityvideologs',
                   params={'GameID':gid,'PlayerID':pid},timeout=(8,45))
          xr.raise_for_status()
          row=next(z for z in xr.json().get('shotList') or [] if int(z.get('eventNum') or -1)==ev)
          asset_keys=['largeHls','largeUrl','largeThumbnail','mediumHls','mediumUrl','mediumThumbnail','smallHls','smallUrl','smallThumbnail','playlistUrl']
          assets={k:row.get(k) for k in asset_keys if row.get(k)}
          xfg={'event_num':ev,'game_clock':row.get('gameClock'),'shot_quality':row.get('shotQuality'),'assets':assets}

          # Probe every xFG URL. For HLS, enumerate variants and download highest available.
          probes={}
          for k,u in assets.items():
              if not isinstance(u,str) or not u.startswith('http'): continue
              try:
                  if '.m3u8' in u.lower():
                      rr=X.get(u,timeout=30)
                      probes[k]=parse_playlist(u,rr)
                      variants=probes[k].get('variants') or []
                      target=max(variants,key=lambda v:(v['resolution'][0]*v['resolution'][1] if v.get('resolution') else 0,v.get('bandwidth') or 0),default=None)
                      media=target['url'] if target else u
                      dst=out/f'xfg_{k}.mp4'
                      p=subprocess.run(['ffmpeg','-y','-v','error','-rw_timeout','30000000',
                         '-headers',f'User-Agent: {UA}\r\nReferer: https://www.nba.com/\r\n',
                         '-i',media,'-map','0:v:0','-map','0:a:0?','-c','copy',str(dst)],
                         capture_output=True,text=True)
                      probes[k]['download_ok']=p.returncode==0 and dst.exists() and dst.stat().st_size>0
                      if probes[k]['download_ok']:
                          fj=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0',
                            '-show_entries','stream=width,height,avg_frame_rate,bit_rate:format=duration',
                            '-of','json',str(dst)],text=True))
                          probes[k]['ffprobe']=fj
                          dur=float((fj.get('format') or {}).get('duration') or 0)
                          frames=[]
                          for idx,frac in enumerate((.25,.5,.75)):
                              jpg=out/f'xfg_{k}_{idx}.jpg'
                              subprocess.run(['ffmpeg','-y','-v','error','-ss',str(max(.1,dur*frac)),
                                '-i',str(dst),'-frames:v','1','-q:v','2',str(jpg)],check=True)
                              frames.append(Image.open(jpg).convert('RGB').resize((320,180)))
                          diffs=[]
                          for a,b in zip(frames,frames[1:]):
                              st=ImageStat.Stat(ImageChops.difference(a,b))
                              diffs.append(sum(st.mean)/3)
                          probes[k]['frame_diff_mean']=sum(diffs)/len(diffs)
                          probes[k]['moving']=probes[k]['frame_diff_mean']>1.0
                  else:
                      rr=X.get(u,headers={'Range':'bytes=0-1048575'},timeout=30)
                      probes[k]={'http_status':rr.status_code,'content_type':rr.headers.get('content-type'),
                                 'content_range':rr.headers.get('content-range'),'content_length':rr.headers.get('content-length'),
                                 'bytes_received':len(rr.content)}
              except Exception as e:
                  probes[k]={'error':repr(e)}

          # Hash the nominal xFG assets. If format/size variants collapse to one blob,
          # that is NBA fallback behavior rather than genuine separate renditions.
          xfg_asset_hashes={}
          for k,u in assets.items():
              if not isinstance(u,str) or not u.startswith('http'): continue
              try:
                  rr=X.get(u,timeout=30)
                  xfg_asset_hashes[k]={
                      'status':rr.status_code,
                      'content_type':rr.headers.get('content-type'),
                      'bytes':len(rr.content),
                      'sha256':hashlib.sha256(rr.content).hexdigest()
                  }
              except Exception as e:
                  xfg_asset_hashes[k]={'error':repr(e)}

          result={
              'game_id':gid,'event_num':ev,'title':title,
              'clips_angle_count':len(angle_masters),
              'clips_angles':angle_masters,
              'clips_max_resolution':max((a['ladder'].get('max_resolution') for a in angle_masters if a['ladder'].get('max_resolution')),
                                         key=lambda x:x[0]*x[1],default=None),
              'xfg':xfg,'xfg_asset_probes':probes,
              'xfg_asset_hashes':xfg_asset_hashes
          }
          dest=Path('experiment_results/event687_resolution'); dest.mkdir(parents=True,exist_ok=True)
          (dest/'latest.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          git config user.name hoopvision-public-probe
          git config user.email hoopvision-public-probe@users.noreply.github.com
          git add experiment_results/event687_resolution/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record event 687 resolution audit [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
