name: Replay Measured NMS Candidate End To End

on:
  push:
    branches: [main]
    paths: ['.github/workflows/replay-measured-nms-end-to-end.yml']

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SHA: 4360c2c01bda12386bb75635da923b0049304347
  SOURCE_SHA256: 23b4beeee56b343e733f804047cce2289729b7cc31b445dcae2489900fb9217a
  SOURCE_RECOVERY_RUN_ID: '35923251814'
  DETECTOR_SHA256: 708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939
  CLUSTER_TRANSFER_RUN_ID: '35969840332'
  FROZEN_EVIDENCE_RUN_ID: '35891572936'
  BASELINE_P1A_RUN_ID: '36051317583'

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact CPU detector/tracker runtime
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q 'numpy<2' pandas opencv-python-headless supervision scipy rich requests 'jsonargparse<5' pydeprecate onnxruntime pytest
          git clone -q https://github.com/roboflow/trackers.git /tmp/trackers
          git -C /tmp/trackers checkout -q 3fb83d1618f29b7fdd4617757b6894e4ec71146d
          python -m pip install -q -e /tmp/trackers --no-deps
          git clone -q https://github.com/ortizeg/object-detection-eval.git /tmp/object-detection-eval
          git -C /tmp/object-detection-eval checkout -q bcf6279073af042c3a5084a041f6c5d8e71e6af1
          python -m pip install -q -e /tmp/object-detection-eval
      - name: Run taxonomy and physical lifecycle regressions
        working-directory: src
        run: |
          python -m pytest -q hoopvision/tests/test_rfdetr_basketball_taxonomy.py screen_tracker_nextgen/test_fast_physical_paths.py
      - name: Recover exact inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/source work/models work/transfer work/frozen work/baseline work/out
          gh run download "$SOURCE_RECOVERY_RUN_ID" --repo timeedmonds-maker/hoopvision-runner --name hoopvision-hawks-source-l4-disk-recovery --dir work/source
          cp work/source/exact_source_native.mp4 work/source_native.mp4
          echo "$SOURCE_SHA256  work/source_native.mp4" | sha256sum -c -
          curl -fsSL https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx -o work/models/rfdetr_m_640.onnx
          echo "$DETECTOR_SHA256  work/models/rfdetr_m_640.onnx" | sha256sum -c -
          gh run download "$CLUSTER_TRANSFER_RUN_ID" --repo timeedmonds-maker/hoopvision-runner --name hoopvision-corrected-cluster-transfer --dir work/transfer
          gh run download "$FROZEN_EVIDENCE_RUN_ID" --repo timeedmonds-maker/hoopvision-runner --name hoopvision-evidence-completed --dir work/frozen
          gh run download "$BASELINE_P1A_RUN_ID" --repo timeedmonds-maker/hoopvision-runner --name hoopvision-same-raw-resume-p1a --dir work/baseline
          test -s work/transfer/cluster_transfer.json
          test -s work/frozen/exact_lineup_roster.json
          test -s work/baseline/physical_paths.csv
      - name: Replay exact candidate detector collapse and mask-free McByte
        run: |
          PYTHONPATH="$PWD/src" python - <<'PY'
          import sys,json,time
          from pathlib import Path
          import cv2,pandas as pd
          sys.path.insert(0,'/tmp/object-detection-eval/src')
          sys.path.insert(0,'src/tools')
          from object_detection_eval.inference.detectors.rfdetr import RFDETRDetector
          import adams_screen_prod_poc as base
          from tools.diagnose_rfdetr_tracking_taxonomy import make_tracker
          det=RFDETRDetector('work/models/rfdetr_m_640.onnx',base.LABEL_MAP,confidence_threshold=.045,num_select=300,input_height=640,input_width=640,providers=['CPUExecutionProvider'])
          tracker=make_tracker(15.0)
          cap=cv2.VideoCapture('work/source_native.mp4'); fps=float(cap.get(cv2.CAP_PROP_FPS) or 30000/1001); W=int(cap.get(cv2.CAP_PROP_FRAME_WIDTH)); H=int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          start=int(round(4*fps)); end=int(round(16*fps)); every=max(1,int(round(fps/15.0)))
          rows=[]; per=[]; t0=time.monotonic()
          for rel,absf in enumerate(range(start,end)):
              if rel%every: continue
              cap.set(cv2.CAP_PROP_POS_FRAMES,absf); ok,frame=cap.read()
              if not ok: continue
              all_d=det.predict(frame); dets=[d for d in all_d if float(d.confidence)>=.20]
              players=base.collapse_players(base.to_sv(dets,W,H,base.PLAYER_CLASSES))
              tr=tracker.update(players,frame=frame,timestamp=rel/fps)
              valid=[]
              if len(tr):
                  valid=[i for i,tid in enumerate(tr.tracker_id) if int(tid)>=0]
                  for i in valid:
                      b=tr.xyxy[i]
                      rows.append({'source_frame_rel':int(rel),'source_frame_abs':int(absf),'time_s':float(4+rel/fps),'track_id':int(tr.tracker_id[i]),'x1':float(b[0]),'y1':float(b[1]),'x2':float(b[2]),'y2':float(b[3]),'conf':float(tr.confidence[i])})
              per.append({'tracking_frame':int(rel),'time_s':float(4+rel/fps),'nms_players':int(len(players)),'mcbyte_tracks':int(len(valid))})
          cap.release()
          pd.DataFrame(rows).to_csv('work/out/measured_nms_tracks.csv',index=False)
          pd.DataFrame(per).to_csv('work/out/measured_nms_frame_counts.csv',index=False)
          q=pd.DataFrame(per)
          s={'player_nms_iou':float(base.PLAYER_NMS_IOU),'sampled_frames':int(len(q)),'frames_nms_ge10':int((q.nms_players>=10).sum()),'frames_mcbyte_ge10':int((q.mcbyte_tracks>=10).sum()),'frames_mcbyte_gt10':int((q.mcbyte_tracks>10).sum()),'track_rows':int(len(rows)),'elapsed_s':round(time.monotonic()-t0,3)}
          Path('work/out/tracking_summary.json').write_text(json.dumps(s,indent=2)+'\n')
          print('HOOPVISION_MEASURED_NMS_TRACKING='+json.dumps(s,sort_keys=True))
          PY
      - name: Build soft-colour segments and P1A
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python src/screen_tracker_nextgen/build_identity_segments.py --tracks work/out/measured_nms_tracks.csv --source work/source_native.mp4 --out-dir work/segments
          PYTHONPATH="$PWD/src" python -m screen_tracker_nextgen.build_fast_physical_paths             --observations work/segments/uniform_observations.csv             --segments work/segments/segments.csv             --team-map-json work/transfer/cluster_transfer.json             --roster work/frozen/exact_lineup_roster.json             --out-dir work/p1a
      - name: Compare cumulative candidate with previous best physical graph
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          b=pd.read_csv('work/baseline/physical_paths.csv'); c=pd.read_csv('work/p1a/physical_paths.csv')
          def summary(df):
              x=df.groupby('tracking_frame').agg(time_s=('time_s','first'),roots=('physical_path_id','nunique')).reset_index()
              return x,{'physical_fragments':int(df.physical_path_id.astype(str).nunique()),'sampled_frames':int(len(x)),'frames_10_roots':int((x.roots==10).sum()),'frames_lt10_roots':int((x.roots<10).sum()),'frames_gt10_roots':int((x.roots>10).sum()),'min_roots':int(x.roots.min()),'median_roots':float(x.roots.median()),'max_roots':int(x.roots.max())}
          bx,bs=summary(b); cx,cs=summary(c)
          unsafe=[]
          for (_,pid),g in c.sort_values(['team','physical_path_id','time_s']).groupby(['team','physical_path_id'],sort=False):
              prev=None
              for r in g.itertuples(index=False):
                  if prev is not None:
                      try:d=json.loads(str(r.association_detail or '{}'))
                      except Exception:d={}
                      if int(r.raw_source_track_id)!=int(prev.raw_source_track_id) and int(r.source_track_id)!=int(prev.source_track_id) and not bool(d.get('same_sam31_continuity_group')) and not bool(d.get('same_source_track')):
                          unsafe.append({'team':str(r.team),'path':str(pid),'t0':float(prev.time_s),'t1':float(r.time_s)})
                  prev=r
          assert not unsafe,unsafe
          rep={'schema':'hoopvision.measured-nms-end-to-end.v1','candidate_sha':'4360c2c01bda12386bb75635da923b0049304347','player_nms_iou':0.55,'baseline_run':36051317583,'baseline':bs,'candidate':cs,'fragment_delta':cs['physical_fragments']-bs['physical_fragments'],'frames_10_roots_delta':cs['frames_10_roots']-bs['frames_10_roots'],'unsupported_cross_track_accepts':unsafe,'identity_authorized':False,'qualification_claim':'NONE_DIAGNOSTIC_ONLY'}
          Path('work/out/end_to_end_summary.json').write_text(json.dumps(rep,indent=2,sort_keys=True)+'\n')
          bx.merge(cx,on=['tracking_frame','time_s'],suffixes=('_baseline','_candidate')).to_csv('work/out/root_coverage_comparison.csv',index=False)
          print('HOOPVISION_MEASURED_NMS_E2E='+json.dumps(rep,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hoopvision-measured-nms-end-to-end
          path: |
            work/out/
            work/segments/segment_qa.json
            work/segments/segments.csv
            work/p1a/physical_paths.csv
            work/p1a/physical_paths_qa.json
            work/p1a/sam31_decisions.json
          retention-days: 14
