name: Validate Public Bridge Boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce v5 public content boundary
        run: python tools/public_content_guard.py
      - name: Verify GitHub-attributed owner or trusted bot identity on introduced commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The prior git log --all noreply filter rejected immutable historical
          # commits and GitHub-verified owner commits made via its Contents API.
          # Require every introduced author AND committer to resolve through the
          # GitHub API to this repository owner or GitHub Actions bot. Unknown
          # attribution and unavailable API fail closed; do not print emails.
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE_SHA" && test -n "$PR_HEAD_SHA"
              range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              test -n "$PUSH_BEFORE_SHA"
              test "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000"
              range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
              ;;
            workflow_dispatch)
              range="$GITHUB_SHA^..$GITHUB_SHA"
              ;;
            *)
              echo "UNSUPPORTED_EVENT_FOR_IDENTITY_CHECK"
              exit 1
              ;;
          esac
          git rev-list "$range" > /tmp/introduced-commits.txt
          test -s /tmp/introduced-commits.txt || { echo "NO_INTRODUCED_COMMITS"; exit 1; }
          while IFS= read -r sha; do
            author="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.author.login // ""')"
            committer="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.committer.login // ""')"
            case "$author" in "$GITHUB_REPOSITORY_OWNER"|"github-actions[bot]") ;; *) echo "UNVERIFIED_GITHUB_AUTHOR $sha"; exit 1;; esac
            # GitHub performs REST squash merges as its verified web-flow service.
            # Keep author attribution to the repo owner; recognize GitHub's
            # own merge committer without permitting unidentified accounts.
            case "$committer" in "$GITHUB_REPOSITORY_OWNER"|"github-actions[bot]"|"web-flow") ;; *) echo "UNVERIFIED_GITHUB_COMMITTER $sha"; exit 1;; esac
          done < /tmp/introduced-commits.txt
          echo "NEW_COMMIT_GITHUB_ACCOUNT_ATTRIBUTION_VERIFIED"
