name: Validate public bridge boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run.yml'
      - '.github/workflows/validate-public-bridge.yml'
      - 'README.md'
      - 'runner_policy.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert opaque outbox boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/run.yml').read_text()
          assert 'bridge_outbox/latest.json' in p
          assert 'request_id' in p
          assert 'timeedmonds-maker/104' not in p
          assert 'HOOPVISION_104_READ_TOKEN' not in p
          assert 'google-github-actions/auth' not in p
          assert 'gcloud ' not in p
          assert 'iam.gserviceaccount.com' not in p
          assert 'nvidia-rtx-pro-6000' not in p
          assert '--gpu' not in p
          assert 'contents: write' in p
          print('HOOPVISION_PUBLIC_BRIDGE_BOUNDARY_OK')
          PY
