name: PR776 private possession-first 36-game tracking database
# Source and output remain exclusively inside private Git repo/ephemeral CPU storage.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-possession-first-36-materialize.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-possession-first-36-private-publish
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      OUT: gamepulse/fusion/materialized/pr776_possession_first_36_20261026
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confidentiality guard and authenticated private Git clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_SOURCE_TOKEN_MISSING; exit 4; }
          cat > "$RUNNER_TEMP/pr776-private-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/pr776-private-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/pr776-private-askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-pr776"
          git -C "$RUNNER_TEMP/private-pr776" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private-pr776" >> "$GITHUB_ENV"
          echo PRIVATE_SOURCE_CLONED_AND_GUARDED
      - name: Run regression tests and materialize all 36 real games
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion:gamepulse/fusion/tests
          python3 -m py_compile \
            gamepulse/fusion/build_pr776_possession_first_36_2026.py \
            gamepulse/fusion/query_pr776_possession_first_36_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -v \
            -p 'test_pr776_possession_first_36_2026.py'
          python3 -m unittest discover -s gamepulse/fusion/tests -v \
            -p 'test_pr776_fresh_touch_successor_context_2026.py'
          test ! -e "$OUT" || { echo REFUSE_EXISTING_PRIVATE_SNAPSHOT; exit 7; }
          python3 gamepulse/fusion/build_pr776_possession_first_36_2026.py \
            --root . --out-dir "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          idx=json.loads((root/'index.json').read_text())
          totals=idx['totals']
          assert idx['captured_games']==36 and len(idx['games'])==36
          assert totals['official_actions']==22314
          assert totals['field_episodes']==7524
          assert totals['mapped_actions']+totals['unmapped_actions']==22314
          assert totals['native_successor_candidates']==93
          assert idx['physical_possessions_certified']==0
          assert idx['native_gameclock_independently_validated'] is False
          assert all((root/(gid+'.json')).is_file() for gid in idx['games'])
          native_grade={k:v for k,v in totals.items() if k.startswith('native_grade_')}
          print('PR776_36GAME_POSSESSION_FIRST_SOURCE_QA_PASSED',
                json.dumps({'games':36,'official_actions':22314,
                            'source_field_episodes':7524,
                            'native_successor_candidates':93,
                            'mapped_actions':totals['mapped_actions'],
                            'unmapped_actions':totals['unmapped_actions'],
                            'native_episodes_by_grade':native_grade,
                            'certified_physical_possessions':0},sort_keys=True))
          PY
          python3 gamepulse/fusion/query_pr776_possession_first_36_2026.py \
            --index-dir "$OUT" --game-id 0022600009 --limit 1 \
            > "$RUNNER_TEMP/rockets-private-possession-search.json"
          python3 gamepulse/fusion/query_pr776_possession_first_36_2026.py \
            --index-dir "$OUT" --game-id 0022600111 --limit 1 \
            > "$RUNNER_TEMP/new-game-private-possession-search.json"
          python3 - "$RUNNER_TEMP/rockets-private-possession-search.json" \
            "$RUNNER_TEMP/new-game-private-possession-search.json" <<'PY'
          import json,sys
          a,b=(json.load(open(x)) for x in sys.argv[1:])
          assert len(a['episodes'])==len(b['episodes'])==1
          assert a['physical_possessions_certified']==b['physical_possessions_certified']==0
          assert a['episodes'][0]['game_id']=='0022600009'
          assert b['episodes'][0]['game_id']=='0022600111'
          print('PR776_ROCKETS_AND_NEW_GAME_PRIVATE_QUERY_ACCEPTED')
          PY
      - name: Publish immutable SHA-indexed game snapshot to private branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$OUT"
          test "$(git diff --cached --name-only -- "$OUT" | wc -l)" -eq 37
          git commit -q -m "data(gamepulse): publish source-checked 36-game possession-first snapshot"
          # Use authenticated Git rather than the rate-limited shared REST contents API.
          # If the private branch has advanced, rebase only this new immutable directory.
          git fetch -q origin "$PRIVATE_BRANCH"
          git rebase "origin/$PRIVATE_BRANCH"
          git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
          echo PR776_36GAME_PRIVATE_SNAPSHOT_COMMITTED
