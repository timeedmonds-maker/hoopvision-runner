name: Rockets PNR xFG review UI acceptance (private source)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pnr-ui-preflight.yml']
  pull_request:
    paths: ['.github/workflows/gamepulse-pnr-ui-preflight.yml','tools/public_content_guard.py']
permissions:
  contents: read
jobs:
  public-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
  private-ui-tests:
    needs: public-boundary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch authorized source temporarily; test private xFG queue and browser syntax only
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || exit 3
          cd /tmp
          mkdir -p /tmp/court-review/courtcoder/{qa,static,runtime-config/pnr}
          ref="courtcoder/nba-clip-lab-gamepulse-layer-20261022"
          cd /tmp/court-review
          for file in courtcoder/nba_pnr_video_review.py courtcoder/qa/test_nba_pnr_video_review.py courtcoder/runtime-config/pnr/rockets_0022600091.json courtcoder/static/nba_pnr_video_review.js courtcoder/static/index.html courtcoder/static/nba_review.css courtcoder/app.py; do
            gh api "repos/timeedmonds-maker/104/contents/$file?ref=$ref" --jq .content | base64 -d > "$file"
          done
          python3 -m py_compile courtcoder/nba_pnr_video_review.py courtcoder/app.py
          python3 -m unittest discover -s courtcoder/qa -p test_nba_pnr_video_review.py -v
          node --check courtcoder/static/nba_pnr_video_review.js
          python3 - <<'PY'
          from pathlib import Path
          page=Path("courtcoder/static/index.html").read_text()
          style=Path("courtcoder/static/nba_review.css").read_text()
          js=Path("courtcoder/static/nba_pnr_video_review.js").read_text()
          for key in ("nbaPnrReviewPanel","nbaPnrReviewList","nbaPnrVideoPreview","nbaPnrReviewForm","nbaPnrScreen"):
              assert page.count('id="'+key+'"')==1
          assert page.count('/static/nba_pnr_video_review.js')==1
          assert "nba-pnr-review-list" in style
          assert "ANNOTATION_ONLY" in js and "credentials:" in js
          assert "autoPlay" not in js and "window.open(" not in js
          print("ROCKETS_PNR_PRIVATE_VIDEO_UI_STATIC_ACCEPTED")
          PY
          cd /tmp
          rm -rf /tmp/court-review
