name: IGP G3 real motion original NBA 68 games disjoint 34 plus 34 2p4s all actor blackout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-g3-motion-disjoint-68-2400ms.yml']
permissions: {contents: read}
concurrency:
  group: igp-g3-motion-disjoint68-whole2400-source
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: b1e8cbe3ca36c9391e5bc5522f29bfdce0e765f1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify full reviewed public guard and private licensed original NBA SHA branch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Motion candidate unit tests for fixed actor, ball and observed source XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_g3_motion_disjoint_all68_2400ms_v1.py'
      - name: Frozen 68 original NBA source 2p4second blackout tune DEV and evaluate untouched VAL games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          if ! python3 gamepulse/fusion/igp_fusion_g3_motion_disjoint_all68_2400ms_qa_v1.py \
            --root . --output "$RUNNER_TEMP/G3-motion-original-private.json" \
            > "$RUNNER_TEMP/G3-motion-original-private.log" 2>&1; then
            echo IGP_G3_MOTION_REAL_NBA_GAMEDISJOINT_QA_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          v=(Path(os.environ['RUNNER_TEMP'])/'G3-motion-original-private.log').read_text(errors='replace').splitlines()
          last=next((x for x in reversed(v) if x.strip()),'NO_LOG')
          print('IGP_MOTION_REDACTED_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:110])
          print('IGP_MOTION_ORIGINAL_GAMES_TESTED',sum(x.startswith('IGP_MOTION_ORIGINAL_NBA_GAME') for x in v))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'G3-motion-original-private.json').read_text())
          a=j['validation_source_same_support_baseline_C0_B']
          b=j['validation_source_same_support_motion_shrink']
          assert j['game_count']==68 and len(j['per_game'])==68
          assert len(j['development_games'])==34 and len(j['validation_games'])==34
          assert not set(j['development_games'])&set(j['validation_games'])
          assert j['counts']['full11_scene_source_blindfold']==543
          assert a['n_scenes']==b['n_scenes']>=180
          assert a['complete_ten_plus_ball']==b['complete_ten_plus_ball']
          assert a['player_IDs_returned']==b['player_IDs_returned']
          assert a['wrong_NBA_IDs_returned']==b['wrong_NBA_IDs_returned']==0
          assert a['player_XY_error']['n']==b['player_XY_error']['n']
          assert a['ball_XYZ_error']['n']==b['ball_XYZ_error']['n']
          assert j['newly_accepted_production_complete_NBA_scenes']==0
          assert j['full_original_source_and_accepted_800ms_unchanged']
          print('IGP_G3_MOTION_SAME_SUPPORT_DISJOINT_34_VAL_GAMES',json.dumps({
            'dev_games':34,'validation_games':34,'validation_scenes':a['n_scenes'],
            'locked_player_blend':j['freeze_train_player_alpha'],
            'locked_ball_blend':j['freeze_train_ball_alpha'],
            'C0_player_p95_ft':a['player_XY_error']['p95_ft'],
            'motion_player_p95_ft':b['player_XY_error']['p95_ft'],
            'C0_player_p99_ft':a['player_XY_error']['p99_ft'],
            'motion_player_p99_ft':b['player_XY_error']['p99_ft'],
            'C0_ball_p95_ft':a['ball_XYZ_error']['p95_ft'],
            'motion_ball_p95_ft':b['ball_XYZ_error']['p95_ft'],
            'C0_ball_p99_ft':a['ball_XYZ_error']['p99_ft'],
            'motion_ball_p99_ft':b['ball_XYZ_error']['p99_ft'],
            'same_correct_ten_ball_scenes':a['complete_ten_plus_ball'],
            'same_source_denominators':True,
            'production_promotions':0},sort_keys=True))
          PY
      - name: Preserve original NBA source and only SHA scored private QA, no public positions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_g3_motion_all68_disjoint34_2400ms_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B g3-motion-long "origin/$BRANCH"
          cp "$RUNNER_TEMP/G3-motion-original-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_MOTION_IDENTICAL_PREVIOUS_SHA_QA
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): source original NBA 68 same 2p4s full blackout, dev34 prelock shrink vs 34 game untouched same support p95'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_G3_MOTION_DISJOINT_LONG_MASK_PRIVATE_SHA_QA_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
