name: IGP P3 top3 actual native ball 10Hz gap episode source atlas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-igp-p3-top3-native-ball-episodes.yml'
permissions: {contents: read}
concurrency:
  group: igp-p3-top3-native-ball-episodes
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 78279a7d15ce2a9e7c4e59deaded9d59702757f0
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confidentiality guard and original private SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Unittests and actual missing NBA ball source episode attribution
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_top3_native_ball_episode_atlas_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_top3_native_ball_episode_atlas_v1.py --root . --output "$RUNNER_TEMP/top3-private.json" > "$RUNNER_TEMP/top3-private.log" 2>&1; then
            echo P3_TOP3_ORIGINAL_NBA_EPISODE_QA_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          ls=(Path(os.environ['RUNNER_TEMP'])/'top3-private.log').read_text(errors='replace').splitlines()
          last=next((s for s in reversed(ls) if s.strip()),'NO_LOG')
          print('P3_EPISODE_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:80])
          print('P3_EPISODE_GAMES_FINISHED',sum(s.startswith('P3_REAL_BALL_GAP_EPISODES') for s in ls))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'top3-private.json').read_text())
          assert len(j['focus_games'])==3 and len(j['per_game'])==3
          for gid,n in j['expected_10hz_ball_unavailable'].items():
              z=j['per_game'][gid]
              assert z['counts']['total_missing_10hz_samples']==n
              assert sum(x['samples'] for x in z['episodes'])==n
              assert len(z['episodes'])==z['counts']['episodes']
          assert j['newly_accepted_positions']==0 and not j['physical_video_certified']
          print('IGP_P3_TOP3_GENUINE_NBA_BALL_GAP_EPISODES',json.dumps({
             g:{'episodes':v['counts']['episodes'],'max_samples':v['counts']['max_samples'],
                'over_2s':v['counts']['episodes_over_2_seconds'],
                'over_5s':v['counts']['episodes_over_5_seconds'],
                'over_10s':v['counts']['episodes_over_10_seconds'],
                'samples_in_over_2s':v['counts']['frames_in_over_2s_episodes']}
             for g,v in j['per_game'].items()},sort_keys=True))
          PY
      - name: Commit private source timing episode metadata only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_top3_native_ball_episode_atlas_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-top3-episodes "origin/$BRANCH"
          cp "$RUNNER_TEMP/top3-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): 3 source-poor NBA actual 10Hz ball gap episodes and action-linked support'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_TOP3_SOURCE_ONLY_EPISODE_PRIVATE_SUCCESS
              exit 0
            fi
            sleep "$i"
          done
          exit 42
