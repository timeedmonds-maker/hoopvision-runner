name: "IGP post36 unlinked native exact-ten ball candidate triage"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-post36-unlinked-identity-triage.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner, clone private native and official-ten SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Classify unlinked full20 original source games, preserve SHA and unknown chain
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_post36_unlinked_native_identity_triage_v1.py
          python3 gamepulse/fusion/igp_post36_unlinked_native_identity_triage_v1.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_post36_unlinked_native_identity_triage_v1.json")
          q=json.loads(p.read_text())
          assert q["source_games"]==len(q["games"])==20
          assert q["counts"]["unlinked_native_source_frames"]==203699
          assert q["physical_possessions_certified"]==0
          assert q["logical_possession_ownership_never_invented"]
          assert sum(len(v["unlinked_exact_ten_ball_review_ordinals"])
             for v in q["games"].values())==q["counts"]["direct_exact_ten_and_ball_with_no_chain"]
          print("IGP_20GAME_UNLINKED_NATIVE_SOURCE_QA_ACCEPTED",
             json.dumps({"source_games":q["source_games"],"counts":q["counts"],
                         "no_fabricated_NBA_chain":True},sort_keys=True))
          PY
      - name: Commit versioned aggregate QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_post36_unlinked_native_identity_triage_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): identify unlinked post36 NBA native exact-ten and original ball context candidates"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_POST36_UNLINKED_NATIVE_SOURCE_QA_PRIVATE_ACCEPTED
              exit 0
            fi
            sleep "$try"
          done
          exit 23
