name: Game Pulse official NBA advanced player ratings (true possessions)
# Official NBA provider advanced rates only. PBP scoring is QA, not denominator.
# Licensed JSON files and all player-level results remain solely in private 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-nba-official-advanced-ratings.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
permissions:
  contents: read
concurrency:
  group: gamepulse-nba-official-advanced-ratings-2026
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      games: ${{ steps.games.outputs.ids }}
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public/private boundary and enumerate actual season catalog
        id: games
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'NBA_ADVANCED_PRIVATE_AUTH_MISSING'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27-integrated-current.json?ref=main' --jq .content |
            base64 -d > "$RUNNER_TEMP/catalog.json"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"catalog.json").read_text())
          ids=sorted(d["games"])
          assert len(ids)==d["game_count"] and len(ids)>=28
          assert all(re.fullmatch(r"00[0-9]{8}",x) for x in ids)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("ids="+json.dumps(ids,separators=(",",":"))+"\n")
          print("SOURCE_GAME_ID_COUNT",len(ids))
          PY
  fetch:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        game: ${{ fromJSON(needs.discover.outputs.games) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticated private source and module retrieval
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          ROOT="$RUNNER_TEMP/official-nba-advanced"
          mkdir -p "$ROOT/tests"
          for filename in official_nba_advanced_ratings_2026.py official_nba_advanced_source_2026.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$filename?ref=main" --jq .content |
              base64 -d > "$ROOT/$filename"
            test -s "$ROOT/$filename"
          done
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/$GAME_ID.json?ref=main" --jq .content |
            base64 -d > "$ROOT/pbp.json"
          test -s "$ROOT/pbp.json"
          python3 -m py_compile "$ROOT/official_nba_advanced_ratings_2026.py" "$ROOT/official_nba_advanced_source_2026.py"
          if [ "$GAME_ID" = '0022600009' ]; then
            gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_official_nba_advanced_ratings_2026.py?ref=main' --jq .content |
              base64 -d > "$ROOT/tests/test_official_nba_advanced_ratings_2026.py"
            GAMEPULSE_REAL_PBP_PATH="$ROOT/pbp.json" PYTHONPATH="$ROOT" python3 -m unittest discover -s "$ROOT/tests" -p test_official_nba_advanced_ratings_2026.py -v
          fi
      - name: Fetch true official game and Q1 NBA advanced player ratings
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/official-nba-advanced"
          for scope in FULL P1; do
            if python3 "$ROOT/official_nba_advanced_source_2026.py" \
               --pbp "$ROOT/pbp.json" --scope "$scope" \
               --out "$ROOT/$scope.json" > "$RUNNER_TEMP/source-$scope.log" 2>&1; then
              echo "OFFICIAL_NBA_ADVANCED_SOURCE_VERIFIED $GAME_ID $scope"
            else
              # Genuine NBA provider not available for this game/scope.
              # Do not publish a fake rating or overwrite a previous source.
              echo "OFFICIAL_NBA_ADVANCED_SOURCE_UNAVAILABLE $GAME_ID $scope"
              rm -f "$ROOT/$scope.json"
            fi
          done
      - name: Persist source-qualified player results only in canonical private 104
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"official-nba-advanced"
          gid=os.environ["GAME_ID"]
          prefix="repos/timeedmonds-maker/104/contents/gamepulse/fusion/nba_advanced/games/"+gid+"/"
          for scope in ("FULL","P1"):
              file=root/(scope+".json")
              if not file.is_file():continue
              blob=file.read_bytes()
              doc=json.loads(blob)
              assert (doc["game_id"]==gid and doc["scope"]==scope
                  and doc["source_authority"]=="NBA_OFFICIAL_ADVANCED_BOX_SCORE"
                  and doc["team_action_run_derived_ratings"]==0
                  and doc["player_count"]>=10
                  and all(p.get("official_rating_authority")=="NBA_OFFICIAL_ADVANCED_BOX_SCORE"
                          and p.get("team_action_runs_not_used_as_possessions") is True
                          for p in doc["players"]))
              target=prefix+scope+".json"
              for attempt in range(12):
                  old=subprocess.run(["gh","api",target],capture_output=True,text=True,timeout=90)
                  pay={"branch":"main","message":"data(gamepulse): authentic NBA advanced game-scoped oncourt rates "+gid+" "+scope,
                       "content":base64.b64encode(blob).decode()}
                  if old.returncode==0:
                      prev=json.loads(old.stdout)
                      if base64.b64decode(prev["content"])==blob:break
                      pay["sha"]=prev["sha"]
                  elif "404" not in old.stderr and "Not Found" not in old.stderr:
                      raise RuntimeError("PRIVATE_ADVANCED_EXISTING_SOURCE_READ_FAILED")
                  put=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                      input=json.dumps(pay),capture_output=True,text=True,timeout=90)
                  if put.returncode==0:break
                  if not any(x in put.stderr for x in ("409","422","429","500","502","503")):
                      raise RuntimeError("PRIVATE_ADVANCED_WRITE_NONRETRYABLE")
                  time.sleep(min(attempt+2,20))
              else:raise RuntimeError("PRIVATE_ADVANCED_WRITE_RETRIES_EXHAUSTED")
              read=subprocess.run(["gh","api",target,"--jq",".content"],
                  capture_output=True,text=True,timeout=90,check=True)
              assert hashlib.sha256(base64.b64decode(read.stdout)).digest()==hashlib.sha256(blob).digest()
              print("PRIVATE_NBA_ADVANCED_PLAYER_SOURCE_SHA_VERIFIED",gid,scope)
          PY
