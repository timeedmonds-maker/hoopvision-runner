name: Rockets Full174 v2b working free CPU probe
on:
  push:
    branches:
      - research/igp-full174-hou-v2b-onoff-private-cpu-20261115
    paths:
      - .github/workflows/igp-full174-hou-v2b-onoff-private-cpu-20261115.yml
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check private token
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          if test -n "${GH_TOKEN:-}"; then echo TOKEN_PRESENT; else echo TOKEN_MISSING; fi
