name: Rockets Full174 v2b player onoff source-verified free CPU
on:
  push:
    branches:
      - research/igp-full174-hou-v2b-onoff-private-cpu-20261115
    paths:
      - .github/workflows/igp-full174-hou-v2b-onoff-private-cpu-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      SOURCE_BRANCH: analysis/full174-rockets-v2b-onoff-shots-20261115
      SOURCE_COMMIT: 976a5b23719b20395163e8ebea4128875e83fb6a
      HIST_DIR: ${{ runner.temp }}/pasq-history
      PRIVATE_TREE: ${{ runner.temp }}/pasq-private
      OUTPUT_DIR: ${{ runner.temp }}/pasq-results
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Clone immutable verified private source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/"$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --depth=6 --filter=blob:none --sparse -b "$SOURCE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$PRIVATE_TREE"
          git -C "$PRIVATE_TREE" checkout -q --detach "$SOURCE_COMMIT"
          git -C "$PRIVATE_TREE" sparse-checkout set gamepulse/fusion gamepulse/third_party/courtsketch data/extensions/nba_blueprint_2026_27 data/extensions/nba_gravity_2026_27
          test "$(git -C "$PRIVATE_TREE" rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 -m py_compile "$PRIVATE_TREE/gamepulse/fusion/igp_full174_hou_player_onoff_v2b_20261115.py"
          echo PINNED_FULL174_PRIVATE_SOURCE_READY
      - name: Restore genuine SHA-checked 2025-26 historical xFG shard inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HIST_DIR"
          gh release download igp-public-gamepulse-2025-26-20261105 --repo "$PRIVATE_REPO" --dir "$HIST_DIR" --pattern nba-2025-26-source-index.json
          gh release download igp-2025-26-xfg-archive-20261105 --repo "$PRIVATE_REPO" --dir "$HIST_DIR" --pattern 'nba-xfg-nba-2025-26-shard-*'
          test "$(find "$HIST_DIR" -name 'nba-xfg-nba-2025-26-shard-*.jsonl.gz' | wc -l)" -eq 15
          test "$(find "$HIST_DIR" -name 'nba-xfg-nba-2025-26-shard-*-qa.json' | wc -l)" -eq 15
          echo ORIGINAL_2025_26_HISTORICAL_SOURCE_READY
      - name: Calculate source-verified Houston v2b oncourt offcourt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          set +e
          (cd "$PRIVATE_TREE" && python3 gamepulse/fusion/igp_full174_hou_player_onoff_v2b_20261115.py --root . --source-index "$HIST_DIR/nba-2025-26-source-index.json" --historical-dir "$HIST_DIR" --out "$OUTPUT_DIR/rockets_full174_v2b_onoff.json") > "$OUTPUT_DIR/private-model.log" 2>&1
          CODE=$?
          set -e
          echo "$CODE" > "$OUTPUT_DIR/returncode"
          if test "$CODE" -eq 0; then
            echo PRIVATE_HOU_V2B_ONOFF_COMPUTED
          else
            echo PRIVATE_HOU_V2B_ONOFF_MODEL_FAILED_DETAILS_RETAINED_PRIVATELY
          fi
      - name: Save player-level result or failure evidence exclusively to private repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          if test -f "$OUTPUT_DIR/rockets_full174_v2b_onoff.json"; then
            OUTFILE="$OUTPUT_DIR/rockets_full174_v2b_onoff.json"
            REMOTE="rockets_full174_v2b_onoff.json"
          else
            OUTFILE="$OUTPUT_DIR/failure.json"
            REMOTE="failure.json"
            python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["OUTPUT_DIR"]); log=(p/"private-model.log").read_text()[-7000:] if (p/"private-model.log").exists() else "CLONE_OR_HISTORICAL_SOURCE_SETUP_FAILED"; (p/"failure.json").write_text(json.dumps({"state":"EXECUTION_FAILED","run_id":os.environ.get("GITHUB_RUN_ID"),"diagnostic_log_tail":log},sort_keys=True,indent=2))'
          fi
          REMOTE_PATH="gamepulse/fusion/qa/pasq_full174_hou_onoff_v2b_20261115/$REMOTE"
          CURRENT_SHA="$(gh api "repos/$PRIVATE_REPO/contents/$REMOTE_PATH?ref=$SOURCE_BRANCH" --jq .sha 2>/dev/null || true)"
          if test -n "$CURRENT_SHA"; then
            gh api -X PUT "repos/$PRIVATE_REPO/contents/$REMOTE_PATH" -f "branch=$SOURCE_BRANCH" -f "sha=$CURRENT_SHA" -f "message=qa(private): Houston Full174 v2b $REMOTE" -f "content=$(base64 -w0 "$OUTFILE")" >/dev/null
          else
            gh api -X PUT "repos/$PRIVATE_REPO/contents/$REMOTE_PATH" -f "branch=$SOURCE_BRANCH" -f "message=qa(private): Houston Full174 v2b $REMOTE" -f "content=$(base64 -w0 "$OUTFILE")" >/dev/null
          fi
          echo PRIVATE_RESULT_SAVED_NO_LICENSED_SOURCE_EXPORTED
          if test "$REMOTE" != "rockets_full174_v2b_onoff.json"; then exit 1; fi
