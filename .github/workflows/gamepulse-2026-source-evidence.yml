name: NBA 2026-27 all-player sources and certified event/lineup QA
# Independent native PBP lineups and exact game scoreboard ON/OFF/PPP provenance check.
# Reuse canonical source-supported NBA game webpage PBP plus ESPN independent wallclock.
# NBA event sequence + observed ESPN narrative: permit provider team/athlete fields to be null.
# Recheck ESPN nullable-team and shooter-narrative event clocks against independently mapped NBA player, period and source frames.
# Free ephemeral GitHub-hosted CPU only. All saved player records, source QA,
# event candidates and private derivatives reside exclusively in private 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-2026-source-evidence.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * *'
permissions:
  contents: read
concurrency:
  group: gamepulse-2026-source-evidence
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public-safe orchestrator and private credential
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN" || { echo 'PRIVATE_QUALIFICATION_AUTH_UNAVAILABLE'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch approved private scripts and tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/qualification"
          mkdir -p "$ROOT/tests"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/qualify_2026.py?ref=main' --jq .content | base64 -d > "$ROOT/qualify_2026.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_qualify_2026.py?ref=main' --jq .content | base64 -d > "$ROOT/tests/test_qualify_2026.py"
          python3 -m py_compile "$ROOT/qualify_2026.py"
          python3 -m unittest discover -v -s "$ROOT/tests" -p test_qualify_2026.py
      - name: Retrieve already-verified private fused warehouse
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/qualification"
          gh release download gamepulse-fusion-2026-27 --repo timeedmonds-maker/104 \
            --pattern gamepulse-fusion.sqlite3.gz --dir "$ROOT" --clobber
          gh release download gamepulse-fusion-2026-27 --repo timeedmonds-maker/104 \
            --pattern manifest.json --dir "$ROOT" --clobber
          gzip -dc "$ROOT/gamepulse-fusion.sqlite3.gz" > "$ROOT/gamepulse-fusion.sqlite3"
          python3 - <<'PY'
          import hashlib,json,os,sqlite3,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"qualification"
          payload=json.loads(subprocess.check_output(
              ["gh","api","repos/timeedmonds-maker/104/releases/tags/gamepulse-fusion-2026-27"]))
          indexed={x["name"]:x for x in payload["assets"]}
          for name in ("gamepulse-fusion.sqlite3.gz","manifest.json"):
              assert indexed[name]["digest"]=="sha256:"+hashlib.sha256((root/name).read_bytes()).hexdigest()
          db=sqlite3.connect(root/"gamepulse-fusion.sqlite3")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert db.execute("SELECT COUNT(*) FROM games").fetchone()[0]>=14
          assert db.execute("SELECT COUNT(*) FROM blueprint_originals").fetchone()[0]>=14
          db.close()
          print("PRIVATE_SOURCE_WAREHOUSE_VERIFIED")
          PY
      - name: Probe all qualified player metrics and certify event UTC against independent controls
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/qualification"
          python3 "$ROOT/qualify_2026.py" --db "$ROOT/gamepulse-fusion.sqlite3" \
            --out "$ROOT/qualification.sqlite3"
          python3 - <<'PY'
          import json,os,sqlite3
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"qualification"
          qa=json.loads((r/"qualification.sqlite3.qa.json").read_text())
          assert qa["source_games"]>=14
          assert len(qa["games"])==qa["source_games"]
          db=sqlite3.connect(r/"qualification.sqlite3")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert db.execute("SELECT COUNT(*) FROM lineup_observation").fetchone()[0]>0
          assert db.execute("SELECT COUNT(*) FROM team_shot_performance").fetchone()[0]>0
          assert db.execute("SELECT COUNT(*) FROM possession_qa WHERE certified_possessions>0").fetchone()[0]==0
          db.close()
          print("2026_SOURCE_GRAIN_AND_CLOCK_QA_COMPLETED_PRIVATE_DETAILS_RETAINED")
          PY
      - name: Store derived private QA and queryable records only in private 104 release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/qualification"
          gzip -n -c "$ROOT/qualification.sqlite3" > "$ROOT/qualification.sqlite3.gz"
          cp "$ROOT/qualification.sqlite3.qa.json" "$ROOT/qa.json"
          TAG='gamepulse-qualification-2026-27'
          gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1 ||
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title 'Private NBA 2026-27 qualified-source and timing evidence' \
              --notes 'Independent PBP identity checks, qualified season leaderboards, source-tracked lineup exposure and abstained possession inference.' \
              --latest=false >/dev/null
          gh release upload "$TAG" "$ROOT/qualification.sqlite3.gz" "$ROOT/qa.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"qualification"
          response=json.loads(subprocess.check_output(
              ["gh","api","repos/timeedmonds-maker/104/releases/tags/gamepulse-qualification-2026-27"]))
          assets={x["name"]:x for x in response["assets"]}
          for name in ("qualification.sqlite3.gz","qa.json"):
              assert assets[name]["digest"]=="sha256:"+hashlib.sha256((root/name).read_bytes()).hexdigest()
          print("PRIVATE_QUALIFICATION_ARTIFACT_SHA_VERIFIED")
          PY
      - name: Publish private QA pointer for human query and review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"qualification"
          for source,path in (
              (root/"qa.json","gamepulse/fusion/qualification_qa.json"),
              (root/"qualification.sqlite3.qualified_players.json",
               "gamepulse/fusion/qualified_season_leaders_2026_27.json"),
              (root/"qualification.sqlite3.lineup_shots.json",
               "gamepulse/fusion/index/verified_event_lineup_shots_2026_27.json")):
              target="repos/timeedmonds-maker/104/contents/"+path
              old=subprocess.run(["gh","api",target],capture_output=True,text=True)
              payload={"message":"chore(2026): update private qualified player season and timing QA",
                       "branch":"main","content":base64.b64encode(source.read_bytes()).decode()}
              if old.returncode==0:payload["sha"]=json.loads(old.stdout)["sha"]
              elif not ("404" in old.stderr or "Not Found" in old.stderr):
                  raise RuntimeError("private_qa_lookup_failed")
              result=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                                    input=json.dumps(payload),capture_output=True,text=True)
              if result.returncode:raise RuntimeError("private_qa_publishing_failed")
          print("PRIVATE_QUALIFICATION_QA_PUBLISHED")
          PY
      - name: Freeze independently certified first-game player Gravity without conflating Leverage
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/qualification"
          PRIVATE='repos/timeedmonds-maker/104/contents'
          DEST="$PRIVATE/gamepulse/fusion/first_game_qualified_metrics_2026_27.json"
          if gh api "$DEST" >/dev/null 2>&1; then
            echo 'IMMUTABLE_FIRST_GAME_EVIDENCE_ALREADY_PRESERVED'
          else
            mkdir -p "$ROOT/gameviews"
            gh api "$PRIVATE/gamepulse/fusion/certify_first_game_qualified.py?ref=main" --jq .content |
              base64 -d > "$ROOT/certify_first_game_qualified.py"
            gh api "$PRIVATE/gamepulse/fusion/tests/test_first_game_certified.py?ref=main" --jq .content |
              base64 -d > "$ROOT/tests/test_first_game_certified.py"
            gh api "$PRIVATE/gamepulse/fusion/index/index.json?ref=main" --jq .content |
              base64 -d > "$ROOT/games-index.json"
            cp "$ROOT/qualification.sqlite3.qualified_players.json" "$ROOT/qualified-season.json"
            python3 -m unittest discover -v -s "$ROOT/tests" -p test_first_game_certified.py
            python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"qualification"
          j=json.loads((root/"games-index.json").read_text())
          for gid in sorted(j["games"]):
              name=f"repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/{gid}.json"
              blob=subprocess.check_output(["gh","api",name,"--jq",".content"])
              import base64
              (root/"gameviews"/(gid+".json")).write_bytes(base64.b64decode(blob))
          PY
            python3 "$ROOT/certify_first_game_qualified.py" \
              --games "$ROOT/games-index.json" --qualified "$ROOT/qualified-season.json" \
              --views "$ROOT/gameviews" --out "$ROOT/first-game.json"
            python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"qualification"
          source=root/"first-game.json"
          j=json.loads(source.read_text())
          assert j["qa"]["gravity_featured_verified"]==28
          assert j["qa"]["official_all_qualified_gravity_first_game"]>=200
          assert j["qa"]["leverage_featured_disagreements"]==28
          assert not j["qa"]["leverage_blueprint_spotlight_equivalence_certified"]
          target="repos/timeedmonds-maker/104/contents/gamepulse/fusion/first_game_qualified_metrics_2026_27.json"
          payload={"branch":"main","message":"data(2026): freeze source-certified all-qualified first-game Gravity and Leverage contrast",
                   "content":base64.b64encode(source.read_bytes()).decode()}
          p=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                           input=json.dumps(payload),capture_output=True,text=True)
          if p.returncode:raise RuntimeError("PRIVATE_FIRST_GAME_CERTIFICATION_COMMIT_FAILED")
          print("PRIVATE_ALL_QUALIFIED_FIRST_GAME_GRAVITY_CERTIFIED")
          PY
          fi
      - name: Independently probe NBA and PBPStats native on-off sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/qualification"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/validate_pbp_onoff.py?ref=main' --jq .content | base64 -d > "$ROOT/validate_pbp_onoff.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_validate_pbp_onoff.py?ref=main' --jq .content | base64 -d > "$ROOT/tests/test_validate_pbp_onoff.py"
          python3 -m unittest discover -v -s "$ROOT/tests" -p 'test_validate_pbp_onoff.py'
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/catalog/2026-27.json?ref=main' --jq .content | base64 -d > "$ROOT/verified-catalog.json"
          gh api 'repos/timeedmonds-maker/104/contents/data/extensions/nba_blueprint_2026_27/games/0022600091/blueprint_report_raw.json?ref=main' --jq .content | base64 -d > "$ROOT/rockets-original-blueprint.json"
          python3 "$ROOT/validate_pbp_onoff.py" --catalog "$ROOT/verified-catalog.json" --blueprint "$ROOT/rockets-original-blueprint.json" --out "$ROOT/native-onoff-qa.json"
      - name: Preserve independent ON OFF provider QA only in private 104
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          blob=(Path(os.environ["RUNNER_TEMP"])/"qualification/native-onoff-qa.json").read_bytes()
          endpoint="repos/timeedmonds-maker/104/contents/gamepulse/fusion/native_pbp_onoff_validation_qa.json"
          old=subprocess.run(["gh","api",endpoint],capture_output=True,text=True)
          record={"branch":"main","message":"qa(2026): independent PBP Stats and NBA ON OFF source diagnostics",
                  "content":base64.b64encode(blob).decode()}
          if old.returncode==0:record["sha"]=json.loads(old.stdout)["sha"]
          elif "404" not in old.stderr and "Not Found" not in old.stderr:
              raise RuntimeError("native_provider_private_read_error")
          result=subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                               input=json.dumps(record),capture_output=True,text=True)
          if result.returncode:raise RuntimeError("native_provider_private_write_error")
          check=subprocess.check_output(["gh","api",endpoint,"--jq",".content"])
          if base64.b64decode(check)!=blob:raise RuntimeError("native_provider_qa_readback")
          print("NATIVE_ONOFF_INDEPENDENT_SOURCE_QA_PRIVATE_VERIFIED")
          PY
      - name: No licensed data in public results
        if: always()
        run: echo 'Detailed source evidence and QA reside exclusively in private 104.' >> "$GITHUB_STEP_SUMMARY"
