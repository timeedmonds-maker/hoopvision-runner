name: IGP sixgame masked C0 generalization QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-sixgame-crossvalidate-velocity.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard and fetch existing research branch
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b research/gamepulse-clock-boundary-integrity-20261025 https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Run existing benchmark on additional source games
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json
          from pathlib import Path
          from igp_cross_game_masked_native_motion_blend_v1 import run
          games={}
          for pair in (("0022600005","0022600094"),("0022600007","0022600109"),("0022600101","0022600102")):
              result=run(Path("."),pair,maximum=150)
              games.update(result["games"])
          assert len(games)==6
          output={"schema":"igp.sixgame.source-heldout-accuracy.v1","games":games,
            "independent_video_ground_truth":False,"model_promoted":False}
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_sixgame_native_masked_C0_B_generalization_v1.json")
          if p.exists():raise FileExistsError("REFUSE_OVERWRITE")
          p.write_text(json.dumps(output,sort_keys=True,indent=2)+"\n")
          print("IGP_SIXGAME_NATIVE_MASKED_QA",json.dumps({
            g:{d:{"C0_p95_ft":v["blocked_gap"][d]["original_C0_full_velocity"]["p95_ft"],
                   "B_p95_ft":v["blocked_gap"][d]["common_B"]["p95_ft"]}
               for d in ("1000","2000","5000")} for g,v in games.items()},sort_keys=True))
          PY
      - name: Commit QA to private canonical branch
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_sixgame_native_masked_C0_B_generalization_v1.json
          git commit -q -m 'qa(igp): six-game masked native XY method comparison'
          git pull -q --rebase origin research/gamepulse-clock-boundary-integrity-20261025
          git push -q origin HEAD:refs/heads/research/gamepulse-clock-boundary-integrity-20261025
