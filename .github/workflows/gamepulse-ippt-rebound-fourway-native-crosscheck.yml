name: IPPT NBA 36-game original rebound four-way native label PBP ball XY ten-player crosscheck
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-rebound-fourway-native-crosscheck.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  nba-rebound-fourway:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: 6eaeeb5f96a8166835cafde22e9f3d70ed036b4a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy guard and pinned SHA original NBA private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
              "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          if [ "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" != "$EXPECTED_PRIVATE_SHA" ]; then
            git -C "$RUNNER_TEMP/private" fetch -q origin "$EXPECTED_PRIVATE_SHA"
            git -C "$RUNNER_TEMP/private" checkout -q --detach "$EXPECTED_PRIVATE_SHA"
          fi
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Source-free direct native XY, wrong-player and missing-value regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_ippt_rebound_native_label_xy_crosscheck_2026.py
          python3 -m unittest -v \
             gamepulse/fusion/test_igp_ippt_rebound_native_label_xy_crosscheck_2026.py \
             gamepulse/fusion/test_igp_ippt_all_event_native_lasttouch_correspondence_2026.py
      - name: SHA original NBA first two games source fourway evaluation
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_rebound_native_label_xy_crosscheck_2026.py \
              --root . --games 0022600009 0022600092
      - name: All 36 original NBA games official PBP rebound native label plus original XY fourway
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_rebound_native_label_xy_crosscheck_2026.py \
              --root . | tee "$RUNNER_TEMP/ippt_fourway_aggregate_only.log"
          echo "IPPT_36GAME_ORIGINAL_NBA_REBOUND_FOURWAY_NATIVE_XY_CROSSCHECK_PASS"
      - name: Publish only aggregate status, no licensed NBA XYZ or event identities
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ippt_fourway_aggregate_only.log"
          report={"github_run_id":os.environ["GITHUB_RUN_ID"],
             "prior_job_status":os.environ["QA_JOB_RESULT"],
             "expected_private_SHA":"6eaeeb5f96a8166835cafde22e9f3d70ed036b4a"}
          if p.exists():
            records=[x.partition(" ")[2] for x in p.read_text().splitlines()
                if x.startswith("IPPT_ALL36_FOURWAY_NATIVE_TOUCH_REBOUND_XY_QA ")]
            if len(records)==1:
              z=json.loads(records[0]);report.update({"games":z["games"],
                  "counts":z["counts"],"video_certified_rebound_control_time":False})
          (Path(os.environ["RUNNER_TEMP"])/"fourway_note.md").write_text(
             "Four-way source evidence native lastTouch/player ID, NBA PBP rebounder, original same-frame ball/player XYZ, NBA on-court roster. No physical contact time proof. Aggregate counts ONLY.\n\n~~~json\n"+
             json.dumps(report,sort_keys=True,indent=2)+"\n~~~\n")
          PY
          gh issue comment 134 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/fourway_note.md"

# Original private coordinates and event timestamp/actor values never printed.
