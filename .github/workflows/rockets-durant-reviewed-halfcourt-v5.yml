name: Rockets Durant reviewed halfcourt double-team v5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rockets-durant-reviewed-halfcourt-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Fetch SHA-provenance original private tracking summaries
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 3
          ROOT="$RUNNER_TEMP/durant-hc-v5"
          mkdir -p "$ROOT"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/durant_double_team_review_calibrated_v5.py?ref=main' --jq .content | base64 -d > "$ROOT/classify.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/rockets_durant_reviewed_double_team_v4_qa.json?ref=main' --jq .content | base64 -d > "$ROOT/geometry.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/rockets_durant_halfcourt_context_qa.json?ref=main' --jq .content | base64 -d > "$ROOT/context.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/0022600091.json?ref=main' --jq .content | base64 -d > "$ROOT/interaction.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/0022600091.json?ref=main' --jq .content | base64 -d > "$ROOT/official.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/rockets_durant_double_team_human_labels_v1.json?ref=main' --jq .content | base64 -d > "$ROOT/labels.json"
          python3 "$ROOT/classify.py" --geometry "$ROOT/geometry.json" --context "$ROOT/context.json" --interaction "$ROOT/interaction.json" --official "$ROOT/official.json" --labels "$ROOT/labels.json" --out "$ROOT/result.json"
      - name: Publish private source-backed QA and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"durant-hc-v5"
          blob=(root/"result.json").read_bytes()
          target="repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/rockets_durant_reviewed_halfcourt_double_v5_qa.json"
          old=subprocess.run(["gh","api",target],capture_output=True,text=True,timeout=20)
          put={"branch":"main","message":"data(gamepulse): NBA Durant halfcourt double-team human-review calibrated v5","content":base64.b64encode(blob).decode()}
          if old.returncode==0:put["sha"]=json.loads(old.stdout)["sha"]
          elif "404" not in old.stderr and "Not Found" not in old.stderr:raise RuntimeError("PRIVATE_READ_FAILED")
          response=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],input=json.dumps(put),capture_output=True,text=True,timeout=60)
          if response.returncode:raise RuntimeError("PRIVATE_WRITE_FAILED")
          actual=base64.b64decode(subprocess.check_output(["gh","api",target,"--jq",".content"]))
          assert hashlib.sha256(actual).digest()==hashlib.sha256(blob).digest()
          print("PRIVATE_DURANT_HALFCOUT_DOUBLE_V5_VERIFIED")
          PY
