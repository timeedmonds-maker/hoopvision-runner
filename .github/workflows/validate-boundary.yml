name: Validate Public Runner Boundary

on:
  push:
    paths:
      - 'README.md'
      - 'runner_policy.json'
      - '.github/workflows/run.yml'
      - '.github/workflows/validate-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("runner_policy.json").read_text())
          w=Path(".github/workflows/run.yml").read_text()
          assert p["compute"]=="github_hosted_cpu"
          assert p["gpu_allowed"] is False
          assert p["gpu_capacity_owned_by_runner"] is False
          assert p["gpu_authorization_allowed"] is False
          assert p["blackwell_transport_trigger_after_private_authorization_allowed"] is True
          assert p["private_source_checkout_allowed"] is False
          assert p["pat_allowed"] is False
          assert p["dispatch_target"]=="private_cpu_authorization_then_blackwell_transport"
          assert p["private_authorization"]["required_before_gpu_trigger"] is True
          assert p["public_payload"]["fields"]==["schema","request_id"]
          forbidden=[
              "HOOPVISION_104_READ_TOKEN",
              "repository: timeedmonds-maker/104",
              "hv-dev-jobs",
              "nvidia-rtx-pro-6000",
              "--gpu=",
              "--gpu-type",
          ]
          for needle in forbidden:
              assert needle not in w, needle
          resolver=w.index("Execute private CPU authorization resolver")
          blackwell=w.index("Transport authorized request to Blackwell")
          assert resolver < blackwell
          assert "resolver_result.json" in w[resolver:blackwell]
          assert "hoopvision-request-resolver" in w
          assert "hoopvision-blackwell-release-worker" in w
          assert "id-token: write" in w
          print("HOOPVISION_PUBLIC_BOUNDARY_OK")
          PY
