name: Validate Public Runner Boundary

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'runner_policy.json'
      - '.github/workflows/run.yml'
      - '.github/workflows/validate-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("runner_policy.json").read_text())
          w=Path(".github/workflows/run.yml").read_text()
          assert p["compute"]=="github_hosted_cpu"
          assert p["gpu_allowed"] is False
          assert p["gpu_capacity_owned_by_runner"] is False
          assert p["gpu_authorization_allowed"] is False
          assert p["private_source_checkout_allowed"] is False
          assert p["pat_allowed"] is False
          assert p["service_account_key_allowed"] is False
          assert p["transport"]=="public_outbox_private_pull"
          assert p["dispatch_target"]=="private_cpu_request_resolver"
          assert p["private_authorization"]["required_before_gpu_dispatch"] is True
          assert p["public_payload"]["fields"]==["schema","request_id"]
          forbidden=[
              "HOOPVISION_104_READ_TOKEN",
              "timeedmonds-maker/104",
              "google-github-actions/auth",
              "gcloud ",
              "iam.gserviceaccount.com",
              "nvidia-rtx-pro-6000",
              "--gpu",
          ]
          for needle in forbidden:
              assert needle not in w, needle
          assert "bridge_outbox/latest.json" in w
          assert "contents: write" in w
          print("HOOPVISION_PUBLIC_BOUNDARY_OK")
          PY
