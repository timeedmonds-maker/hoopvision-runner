name: Inspect Live GPU Instances
# read-only state check
# release-candidate-state-check-20260925
# event296 capacity probe
# live check during run 35947794165 target resolution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-gpu-instances.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect current GPU consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gpu-state
          gcloud compute instances list --project="$PROJECT_ID"             --format="csv[no-heading](name,zone.basename(),status,machineType.basename())"             | tee gpu-state/instances.csv
          for R in asia-southeast1 us-central1 us-west4 asia-east1 europe-west4; do
            gcloud compute regions describe "$R" --project="$PROJECT_ID" --format=json > "gpu-state/region-$R.json"
          done
          gcloud compute project-info describe --project="$PROJECT_ID" --format=json > gpu-state/project-info.json
          gcloud compute operations list --project="$PROJECT_ID" --filter='status!=DONE' \
            --format='table(name,operationType,status,zone.basename(),region.basename(),targetLink.basename(),error.errors.code,error.errors.message)' \
            > gpu-state/active-operations.txt || true
          gcloud compute machine-images list --project="$PROJECT_ID" \
            --format='table(name,status,creationTimestamp,sourceInstance.basename())' \
            > gpu-state/machine-images.txt || true
          gcloud compute instances list --project="$PROJECT_ID" \
            --filter="name~'hv-dev-l4'" \
            --format='yaml(name,zone,status,machineType,scheduling.provisioningModel,creationTimestamp,lastStartTimestamp,lastStopTimestamp)' \
            > gpu-state/l4-instances.yaml || true
          python3 - <<'PY' | tee gpu-state/gpu-quota.txt
          import json
          d=json.load(open("gpu-state/project-info.json"))
          for q in d.get("quotas",[]):
              if "GPU" in str(q.get("metric","")).upper():
                  print(json.dumps(q,sort_keys=True))
          PY
          python3 - <<'PY' | tee gpu-state/regional-gpu-quotas.txt
          import json,glob,os
          for p in sorted(glob.glob("gpu-state/region-*.json")):
              d=json.load(open(p))
              region=d.get("name") or os.path.basename(p)[7:-5]
              hits=[]
              for q in d.get("quotas",[]):
                  if "GPU" in str(q.get("metric","")).upper() or "RTX" in str(q.get("metric","")).upper():
                      hits.append(q)
              print(region, json.dumps(hits,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hoopvision-live-gpu-state
          path: gpu-state/
          retention-days: 7
