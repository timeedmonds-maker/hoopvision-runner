name: Amen732 private release direct authenticated download route
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-release-auth-bypass-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public privacy guard
        run: python3 tools/public_content_guard.py
      - name: Prove private Git HTTPS access without any GitHub REST API
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          export GIT_TERMINAL_PROMPT=0
          B64="$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $B64" \
            ls-remote https://github.com/timeedmonds-maker/104.git HEAD >/dev/null
          echo PRIVATE_GIT_TRANSPORT_NOT_RATE_LIMITED
      - name: Try authenticated GitHub release download without API calls
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          SRC=https://github.com/timeedmonds-maker/104/releases/download/freeview-native-0022600009-732/source_manifest.json
          # GitHub web release routes may reject bearer authentication. Do not
          # log private content, headers, redirects, auth or signed URLs.
          code="$(curl -L -sS --max-time 60 -o "$ROOT/source.json" -w '%{http_code}' \
                    -H "Authorization: Bearer $GH_TOKEN" "$SRC" || true)"
          if [ "$code" != 200 ]; then
            echo PRIVATE_GITHUB_RELEASE_DIRECT_BEARER_FAILED
            exit 4
          fi
          python3 - "$ROOT/source.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          assert q['event']['game_id']=='0022600009'
          assert q['event']['event_num']==732
          assert len(q['feeds'])>=6
          print('PRIVATE_DIRECT_AUTH_RELEASE_NBA_MANIFEST_PASS')
          PY
