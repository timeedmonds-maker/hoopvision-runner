name: Inspect Toronto Continuity Coverage Failure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-toronto-continuity-coverage.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-northeast1-b
  INSTANCE: hv-dev-l4-tokyo
  RUN_ID: public-36202716389-1-c7637a7c34a2
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Ensure host and retrieve exact failed continuity outputs
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --format='value(status)')"
          echo "STATUS_BEFORE=$STATUS"
          if test "$STATUS" != "RUNNING"; then
            gcloud compute instances start "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet
            echo "HV_STARTED=1" >> "$GITHUB_ENV"
          else
            echo "HV_STARTED=0" >> "$GITHUB_ENV"
          fi
          for i in $(seq 1 60); do
            if gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command='echo SSH_OK' >/dev/null 2>&1; then break; fi
            test "$i" != 60 || exit 3
            sleep 5
          done
          ROOT="/srv/hoopvision/runs/$RUN_ID/replay-d3b56542/final_corrected"
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="sudo cp '$ROOT/continuous_player_paths_qa.json' /tmp/continuity_qa.json && sudo cp '$ROOT/continuous_player_paths.csv' /tmp/continuity_paths.csv && sudo chmod 644 /tmp/continuity_qa.json /tmp/continuity_paths.csv"
          gcloud compute scp "$INSTANCE:/tmp/continuity_qa.json" continuity_qa.json --zone "$ZONE" --project "$PROJECT_ID" --quiet
          gcloud compute scp "$INSTANCE:/tmp/continuity_paths.csv" continuity_paths.csv --zone "$ZONE" --project "$PROJECT_ID" --quiet
      - name: Summarize exact coverage boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          q=json.load(open("continuity_qa.json"))
          print("=== CONTINUITY_QA ===")
          print(json.dumps(q,indent=2,sort_keys=True))
          rows=list(csv.DictReader(open("continuity_paths.csv")))
          by={}
          for r in rows:
              by.setdefault((r["player_id"],r["player_name"]),[]).append(r)
          for (pid,name),g in sorted(by.items()):
              frames=sorted({int(r["frame_index"]) for r in g})
              gaps=[(a,b,b-a-1) for a,b in zip(frames,frames[1:]) if b-a>1]
              sources={}
              for r in g:
                  sources[r["path_source"]]=sources.get(r["path_source"],0)+1
              print("PLAYER",pid,name,"FIRST",frames[0],"LAST",frames[-1],"N",len(frames),"GAPS",gaps[:30],"SOURCES",sources)
              tail=sorted(g,key=lambda r:int(r["frame_index"]))[-8:]
              for r in tail:
                  print("TAIL",pid,name,r["frame_index"],r["source_time_s"],r["x1"],r["y1"],r["x2"],r["y2"],r["path_source"])
          PY
      - name: Stop host if this diagnostic started it
        if: always()
        shell: bash
        run: |
          if test "${HV_STARTED:-0}" = "1"; then
            gcloud compute instances stop "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet || true
          fi
