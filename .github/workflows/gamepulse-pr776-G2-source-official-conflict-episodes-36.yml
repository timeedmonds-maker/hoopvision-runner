name: PR776 G2 447 original NBA source vs official roster conflict episodes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-source-official-conflict-episodes-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G2-source-NBA-conflict-episodes-36
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public boundary and clone original NBA private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Synthetic NBA official ten vs original actor disagreements
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g2_official_source_actor_conflict_episodes_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_official_source_actor_conflict_episodes_2026.py' -v
      - name: Reconcile original NBA SDK source observed actors and all 447 strict roster mismatches
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_original_actor_official_447_conflict_episodes_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_official_source_actor_conflict_episodes_2026.py \
             --root . --out "$OUT" > "$RUNNER_TEMP/private-G2-actor-episodes.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          n=a["totals"]
          assert a["source_games"]==36
          assert n["strict"]==412619
          assert n["strict_source_conflicts"]==447
          assert n["strict_source_abstention"]==39335
          assert n["raw_actor_exact_ten"]+n["raw_actor_more_than_ten"]+n["raw_actor_fewer_than_ten"]==447
          assert n["candidate_ten_exists_in_official_any_period"]==447
          assert a["original_NBA_SDK_spatial_XYZ_accepted"]
          assert a["causal_attribution_not_independently_proven"]
          print("PR776_G2_ALL36_STRICT_447_SOURCE_ID_EVIDENCE",json.dumps(n,sort_keys=True))
          PY
      - name: Commit private-only SHA/reproducible G2 actor-conflict episode audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_original_actor_official_447_conflict_episodes_36_v1.json
          git config user.name "Game Pulse NBA G2 identity QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): root-evidence classify 447 source vs official NBA ten conflicts and contiguous native episodes"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo G2_PRIVATE_NBA_OFFICIAL_STRICT_447_SOURCE_ACTOR_QA_ACCEPTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
