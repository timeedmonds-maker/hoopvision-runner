name: IGP P3 original PBP shooter 11 actor masked ball context external holdout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-igp-p3-pbp-shot-blackout-v1.yml'
permissions: {contents: read}
concurrency:
  group: igp-p3-pbp-shot-blackout-v1
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 6e0ec9db0172c655a7d9e70c71ebf4c0364de81e
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public content and read SHA-pinned private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test and evaluate real four fresh original SDK source blackouts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p3_pbp_shooter_joint_blackout_v1.py'
          if ! python3 gamepulse/fusion/igp_68_p3_pbp_shooter_joint_blackout_v1.py --root . --output "$RUNNER_TEMP/pbp-shot-private.json" > "$RUNNER_TEMP/pbp-shot-private.log" 2>&1; then
            echo IGP_P3_PBP_SHOT_REAL_SOURCE_EVALUATION_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'pbp-shot-private.log').read_text(errors='replace').splitlines()
          last=next((s for s in reversed(lines) if s.strip()),'NO_LOG')
          print('P3_PRIVATE_EXCEPTION_CLASS',re.sub(r'[^A-Za-z_]','_',last.split(':',1)[0])[:45])
          print('P3_PRIVATE_FAILURE_NONNUMERIC',re.sub(r'[^A-Za-z_]','_',last)[:90])
          print('P3_PRIVATE_GAMES_DONE',sum(x.startswith('P3_PBP_SHOT_CONSTRAINED_GAME') for x in lines))
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'pbp-shot-private.json').read_text())
          assert len(j['unseen_games'])==4 and len(j['per_game'])==4
          assert set(j['unseen_games']).isdisjoint(j['excluded_previous_joint_games'])
          assert j['original_all11_actor_masked_ms']==2400
          assert j['shot_blend_predeclared']==.35 and j['event_has_no_ball_xyz']
          assert j['frozen_68_post_P1_P2_research_baseline']==[492617,543024,917686,1106941]
          assert j['newly_promoted_complete_scenes']==0
          m=j['methods']; n=m['c0']['target_full_original_source_scenes']
          assert n>=180 and m['handler']['target_full_original_source_scenes']==n
          assert m['shot']['target_full_original_source_scenes']==n
          assert m['c0']['player_XY_error_ft']==m['shot']['player_XY_error_ft']
          print('IGP_P3_FROZEN_SHOOTER_EXACT_NBA_SOURCE_QA',json.dumps({
            'n':n,'near_shot':j['near_official_shot_scenes'],
            'eligible':j['event_constrained_eligible'],
            'ball_p95_ft':{k:m[k]['ball_XYZ_error_ft']['p95_ft'] for k in m},
            'strict_11_scene':{k:m[k]['within_player_2ft_ball_3ft_source_proxy'] for k in m},
            'newly_accepted_scenes':0},sort_keys=True))
          PY
      - name: Preserve detailed NBA source evaluations in private QA repo
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p3_pbp_shooter_joint_blackout_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p3-shot-source "origin/$BRANCH"
          cp "$RUNNER_TEMP/pbp-shot-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): official NBA PBP shooter source-masked all11 heldout physical-proxy evaluation'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P3_NBA_PBP_SHOT_HELDOUT_PRIVATE_SUCCESS
              exit 0
            fi
            sleep "$i"
          done
          exit 42
