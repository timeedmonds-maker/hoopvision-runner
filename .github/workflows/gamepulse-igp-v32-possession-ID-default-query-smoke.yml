name: IGP32 71game official PBP possession ID 10Hz default and original native smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-possession-ID-default-query-smoke.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  possession-id-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify original 71game official chain SHA and read both S1 graded 10Hz and all original native
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_v32_71_possession_source_qa_v2.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_v32_71_possession_10hz_source_qa_v2.py'
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          from query_igp_v32_71_possession_source_qa_v2 import query
          from igp_v32_default_tracking_engine_v1 import DEFAULT_ENGINE
          qa=json.loads(Path("gamepulse/fusion/qa/igp_v32/igp_v32_71_possession_10hz_source_qa_v2.json").read_bytes())
          assert qa["games"]==71 and qa["NBA_official_logical_chains_total"]==14612
          eligible=[
              (gid,ch) for gid in sorted(qa["chains_by_game"])
              for ch in qa["chains_by_game"][gid]
              if ch["evaluated"] and ch["strict_S1_samples_in_chain"]>=3]
          candidate=[
              (gid,ch) for gid in sorted(qa["chains_by_game"])
              for ch in qa["chains_by_game"][gid]
              if ch["original_logged_utc_candidate_ms"] is not None
              and len(ch["original_logged_utc_candidate_ms"])==2
              and all(type(x)==int for x in ch["original_logged_utc_candidate_ms"])
              and 500<=ch["original_logged_utc_candidate_ms"][1]-
                  ch["original_logged_utc_candidate_ms"][0]<=90000]
          assert eligible, "CRITICAL_NO_INDEPENDENT_PBP_CLOCK_ELIGIBLE_LOGICAL_CHAIN"
          samples=[];seen=set()
          for gid,ch in eligible+candidate:
              if gid in seen:continue
              seen.add(gid);samples.append((gid,ch))
              if len(samples)==3:break
          assert len(samples)==3, "NEED_THREE_DISTINCT_REAL_GAME_CHAIN_QUERY_CASES"
          for gid,chain in samples:
              t=time.perf_counter()
              r=query(".",gid,chain["chain_id"],limit=10,native_limit=10)
              latency=(time.perf_counter()-t)*1000
              assert r["default_engine_id"]==DEFAULT_ENGINE and r["hz"]==10
              assert r["tracking_usability"]==chain
              assert r["physical_ball_custody_boundaries_certified"] is False
              assert r["source_QA_not_independently_video_accurate_XY_ball3D"] is True
              assert len(r["ten_hz_rows"])<=10 and len(r["original_native_rows"])<=10
              assert r["original_source_manifest_sha256"]
              assert all(x["utc_ms"]%100==0 for x in r["ten_hz_rows"])
              assert all(x["original_source_grade"]=="ORIGINAL_NBA_SDK_NATIVE_UNMUTATED"
                         for x in r["original_native_rows"])
              print("IGP32_POSSESSION_ID_10HZ_PLUS_NATIVE_SOURCE_PASS",gid,
                    "chain_id",chain["chain_id"],
                    "eligible",chain["evaluated"],
                    "10hz_rows",len(r["ten_hz_rows"]),
                    "native_rows",len(r["original_native_rows"]),
                    "latency_ms",round(latency,2))
          print("IGP32_71GAME_PBP_CHAIN_DEFAULT_QUERY_SOURCE_NATIVE_IDENTITY_GRADE_PASS")
          qa_path=Path("gamepulse/fusion/qa/igp_v32/igp_v32_71_possession_10hz_source_qa_v2.json")
          import hashlib
          eligible_s1=[r for rows in qa["chains_by_game"].values()
                       for r in rows if r["evaluated"] and
                       r["unambiguous_strict_S1_samples_in_chain"]>=5]
          passed_s1=[r for r in eligible_s1 if
                     r["source_QA_complete_samples"]*10>=
                         9*r["unambiguous_strict_S1_samples_in_chain"]
                     and r["S1_longest_incomplete_run_ms"]<=500]
          s1_diagnostics={
              "chains_with_at_least_five_UNAMBIGUOUS_S1_10hz_samples":len(eligible_s1),
              "S1_conditional_90pct_500ms_qualifying":len(passed_s1),
              "S1_conditional_pct":round(100*len(passed_s1)/len(eligible_s1),5)
                 if eligible_s1 else None,
              "not_a_true_live_or_physical_possession_certification":True}
          summary={
             "schema":"igp.v32.71game.possession.logical-chain.10hz.source-QA.summary.v1",
             "full_private_sha256":hashlib.sha256(qa_path.read_bytes()).hexdigest(),
             "games":qa["games"],
             "official_logical_chains":qa["NBA_official_logical_chains_total"],
             "counts":qa["counts"],"per_game_counts":qa["per_game"],
             "S1_conditional_diagnostics":s1_diagnostics,
             "pct_over_eligible":qa["qualified_pct_90pct_500ms_over_eligible"],
             "pct_over_all_official_logical":qa["qualified_pct_90pct_500ms_over_ALL_official_chains"],
             "physical_possessions_certified":0,
             "engine_id":qa["engine_id"],"S1_live_recall_not_certified":True}
          dest=Path("gamepulse/fusion/qa/igp_v32/igp_v32_71_possession_10hz_source_qa_summary_v2.json")
          dest.write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("IGP32_FULL71_PBP_CHAIN_SOURCE_QA_COMPACT_SUMMARY_READY",
             "eligible",summary["counts"].get("eligible_candidate_PBP_UTC_chains",0),
             "qualified",summary["counts"].get("usable_90pct_max_gap_500ms",0),
             "pct_all",summary["pct_over_all_official_logical"])
          PY
      - name: Commit count-only summary and exact private full receipt SHA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          p=gamepulse/fusion/qa/igp_v32/igp_v32_71_possession_10hz_source_qa_summary_v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$p"
          git diff --cached --check
          if git diff --cached --quiet; then echo COUNT_ONLY_POSSESSION_SUMMARY_ALREADY_COMMITTED; exit 0; fi
          git commit -qm 'qa(igp): release SHA-pinned compact 71game NBA logical chain 10Hz source QA usability summary'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_FULL71_PBP_COUNT_ONLY_SUMMARY_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 83
