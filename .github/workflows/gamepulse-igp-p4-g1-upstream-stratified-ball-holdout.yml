name: IGP P4 original SDK player ball provenance stratified frozen ball source holdout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p4-g1-upstream-stratified-ball-holdout.yml']
permissions: {contents: read}
concurrency:
  group: igp-p4-g1-original-upstream-flag-ball-holdout
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: 2c85c02dc344e1582bbd2f1a88d906e63f6fa4e5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public content guard and SHA-pinned private original NBA sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test source-only frozen physics models on unseen original game stratified by real upstream ball flags
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_p4_g1_upstream_stratified_ball_source_holdout_v1.py'
          if ! python3 gamepulse/fusion/igp_fusion_p4_g1_upstream_stratified_ball_source_holdout_v1.py --root . --out "$RUNNER_TEMP/upstream-ball-holdout-private.json" > "$RUNNER_TEMP/upstream-ball-holdout-private.log" 2>&1; then
            echo IGP_P4_ORIGINAL_BALL_UPSTREAM_SOURCE_HOLDOUT_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'upstream-ball-holdout-private.log').read_text(errors='replace').splitlines()
          last=next((z for z in reversed(lines) if z.strip()),'NO_LOG')
          print('IGP_P4_SOURCE_UPSTREAM_FAILURE_CLASS',re.sub(r'[^A-Za-z_]','_',last)[:90])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'upstream-ball-holdout-private.json').read_text())
          assert q['game_id']=='0022600001'
          assert q['no_training_or_test_overlap_with_prior_32_P3_games']
          assert q['all_13_original_SDK_archive_part_SHA_verified']
          assert q['original_SDK_target_and_support_interpolation_flag_joined']
          assert q['radii_ms']==[50,100,150]
          assert q['source_max_mask_bracket_ms']==600
          assert q['accepted_tracking_scene_delta']==0
          assert q['independently_certified_ball_3D_video_p95_ft'] is None
          out={}
          for r,a in q['stratified_source_mask_results'].items():
              assert a['qualified_canonical_source_masks']>=20
              assert a['qualified_canonical_source_masks']==sum(z['n'] for z in a['stratified_by_exact_original_ball_center_and_both_source_endpoints'].values())
              ss={}
              for key,v in a['stratified_by_exact_original_ball_center_and_both_source_endpoints'].items():
                  ss[key]={'n':v['n'],
                          'linear_source_p95_ft':v['metrics']['linear']['three_d_ft']['p95_ft'],
                          'enhanced_source_p95_ft':v['metrics']['cubic_xy_half_gravity']['three_d_ft']['p95_ft'],
                          'enhanced_source_p99_ft':v['metrics']['cubic_xy_half_gravity']['three_d_ft']['p99_ft'],
                          'sample_sufficient':v['p95_and_p99_sample_sufficient']}
              out[r]=ss
          print('IGP_P4_UPSTREAM_SOURCE_FLAG_BLIND_GAME_RECONSTRUCTION',json.dumps(out,sort_keys=True))
          PY
      - name: Commit SHA original NBA source flag error strata privately only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_p4_g1_upstream_stratified_ball_source_holdout_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p4-flag-stratified "origin/$BRANCH"
          cp "$RUNNER_TEMP/upstream-ball-holdout-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): frozen ball XY/3D source holdout game0001 by original per actor true vs false keyframe provenance'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P4_SOURCE_PROVENANCE_STRATIFIED_BALL_HOLDOUT_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
