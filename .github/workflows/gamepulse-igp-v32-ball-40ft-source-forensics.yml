# NBA original SDK SHA private. Source XYZ never enters public logs.
name: IGP 3.2 original ball 40ft source forensics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-ball-40ft-source-forensics.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source_forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Protect public repo and fetch private original NBA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_ball_extreme_original_source_forensics_v1.py
      - name: Forensically check real original ball before and after the 40ft target
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_ball_extreme_original_source_forensics_v1.py \
            --root . --output "$RUNNER_TEMP/private-outliers.json" >"$RUNNER_TEMP/private-source-log" 2>&1 || {
              echo IGP_V32_ORIGINAL_BALL_FORENSICS_SOURCE_QA_FAILED
              exit 73
            }
          grep '^IGP_V32_BALL_ORIGINAL_SOURCE_FORENSICS' "$RUNNER_TEMP/private-source-log"
      - name: Commit private original-source forensic casebook
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt="gamepulse/fusion/qa/igp_v32/igp_v32_ball_40ft_original_source_forensics_v1.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B v32forensics "origin/$BRANCH"
          cp "$RUNNER_TEMP/private-outliers.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          if git diff --cached --quiet;then echo IGP_V32_SOURCE_CASEBOOK_ALREADY_PRESENT;exit 0;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original NBA ball spike forensic casebook private'
          for n in 1 2 3 4 5 6;do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH";then echo IGP_V32_SOURCE_FORENSICS_PRIVATE_QA_COMMITTED;exit 0;fi
            sleep "$n"
          done
          exit 74
