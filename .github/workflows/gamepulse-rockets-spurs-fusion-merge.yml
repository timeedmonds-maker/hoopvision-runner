name: Rockets Spurs private Game Pulse fusion merge
# Uses the reviewed public-content guard; game data and SQLite remain private in 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-spurs-fusion-merge.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rockets-spurs-complete-private-fusion
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce private destination and source-data boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          echo 'PRIVATE_GITHUB_DESTINATION_VERIFIED'
      - name: Retrieve canonical private builder code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gp/gamepulse/catalog/tests" "$RUNNER_TEMP/gp/gamepulse/fusion/tests"
          for f in gamepulse/catalog/catalog.py gamepulse/catalog/tests/test_catalog.py gamepulse/fusion/build.py gamepulse/fusion/materialize.py gamepulse/fusion/onoff_ppp.py gamepulse/fusion/tests/test_fusion.py gamepulse/fusion/tests/test_materialize.py gamepulse/fusion/tests/test_onoff_ppp.py; do
            gh api "repos/timeedmonds-maker/104/contents/$f?ref=main" --jq .content |
              base64 -d > "$RUNNER_TEMP/gp/$f"
          done
          python3 -m py_compile "$RUNNER_TEMP/gp/gamepulse/catalog/catalog.py" "$RUNNER_TEMP/gp/gamepulse/fusion/build.py" "$RUNNER_TEMP/gp/gamepulse/fusion/materialize.py"
          PYTHONPATH="$RUNNER_TEMP/gp/gamepulse/catalog" python3 -m unittest discover -s "$RUNNER_TEMP/gp/gamepulse/catalog/tests" -v
          PYTHONPATH="$RUNNER_TEMP/gp/gamepulse/fusion" python3 -m unittest discover -s "$RUNNER_TEMP/gp/gamepulse/fusion/tests" -v
          echo 'PRIVATE_BUILDERS_UNIT_TESTED'
      - name: Build full season catalog with newly completed Rockets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gp"
          python3 "$ROOT/gamepulse/catalog/catalog.py" build --output "$ROOT/catalog.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gp'
          data=json.loads((root/'catalog.json').read_text())
          g=data['games']['0022600009']
          assert g['index_state']=='VERIFIED_ARCHIVE_INDEX'
          assert (g['away_team'],g['home_team'])==('HOU','SAS')
          assert g['archive_qa']['completed_windows']==3720
          assert g['observed_frame_count']>0
          assert all(x['index_state']=='VERIFIED_ARCHIVE_INDEX' for x in data['games'].values())
          assert len(data['games'])>=16
          assert '0022600009' in data['by_team']['HOU'] and '0022600009' in data['by_team']['SAS']
          print('ROCKETS_GAME_PLAYER_SEARCH_CATALOG_VERIFIED',data['game_count'])
          PY
      - name: Merge tracking PBP xFG all six Blueprint modules into private SQLite
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gp"
          python3 "$ROOT/gamepulse/fusion/build.py" build --catalog "$ROOT/catalog.json" --out "$ROOT/integrated.sqlite3"
          python3 - <<'PY'
          import os,json,sqlite3
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gp'
          db=sqlite3.connect(root/'integrated.sqlite3')
          gid='0022600009'
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('SELECT COUNT(*) FROM games WHERE game_id=? AND away=? AND home=?',(gid,'HOU','SAS')).fetchone()[0]==1
          assert db.execute('SELECT COUNT(*) FROM frames WHERE game_id=?',(gid,)).fetchone()[0]>0
          assert db.execute('SELECT COUNT(*) FROM blueprint_originals WHERE game_id=? AND shot_count=155',(gid,)).fetchone()[0]==1
          assert db.execute("SELECT COUNT(*) FROM shots WHERE game_id=? AND source_kind LIKE 'BLUEPRINT%'",(gid,)).fetchone()[0]==155
          for kind in ('source_modules','gravity','leverage','defensive','moments','top'):
            assert db.execute('SELECT COUNT(*) FROM extras WHERE game_id=? AND category=?',(gid,kind)).fetchone()[0]>0,kind
          qa=json.loads((root/'integrated.sqlite3.manifest.json').read_text())
          assert qa['game_coverage'][gid]['blueprint_shots']==155
          assert qa['canonical_source_verified']>=15
          db.close()
          print('ROCKETS_GAME_FUSION_SQLITE_VERIFIED',qa['game_count'],'games')
          PY
          python3 "$ROOT/gamepulse/fusion/build.py" search --db "$ROOT/integrated.sqlite3" --kind games --game 0022600009 --limit 1 >/dev/null
          python3 "$ROOT/gamepulse/fusion/build.py" search --db "$ROOT/integrated.sqlite3" --kind shots --game 0022600009 --limit 1 >/dev/null
          echo 'ROCKETS_SQL_QUERY_VERIFIED'
      - name: Build no-raw-XYZ search and onoff source-qualified views
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gp"
          python3 "$ROOT/gamepulse/fusion/materialize.py" --db "$ROOT/integrated.sqlite3" --out "$ROOT/views"
          python3 "$ROOT/gamepulse/fusion/onoff_ppp.py" build --db "$ROOT/integrated.sqlite3" --out "$ROOT/onoff"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'gp'
          x=json.loads((r/'views/index.json').read_text())
          y=json.loads((r/'onoff/index.json').read_text())
          assert '0022600009' in x['games'] and x['games']['0022600009']['blueprint_shots']==155
          assert '0022600009' in y['games']
          assert x['contains_raw_XYZ'] is False
          print('ROCKETS_MATERIALIZED_SEARCH_AND_ONOFF_INDEXED')
          PY
      - name: Publish SHA-verified private unified database and game search views
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gp"
          gzip -n -c "$ROOT/integrated.sqlite3" > "$ROOT/gamepulse-fusion.sqlite3.gz"
          cp "$ROOT/integrated.sqlite3.manifest.json" "$ROOT/manifest.json"
          gh release upload gamepulse-fusion-2026-27 "$ROOT/gamepulse-fusion.sqlite3.gz" "$ROOT/manifest.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          python3 - <<'PY'
          import os,base64,hashlib,json,subprocess,time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gp'
          base='repos/timeedmonds-maker/104'
          def api(path):
            p=subprocess.run(['gh','api',path],capture_output=True,text=True,timeout=150)
            if p.returncode:raise RuntimeError('PRIVATE_READ_FAILED')
            return json.loads(p.stdout)
          assets={a['name']:a for a in api(base+'/releases/tags/gamepulse-fusion-2026-27')['assets']}
          for n in ('gamepulse-fusion.sqlite3.gz','manifest.json'):
            assert assets[n]['digest']=='sha256:'+hashlib.sha256((root/n).read_bytes()).hexdigest()
          def put(path,data):
            endpoint=base+'/contents/'+path
            for attempt in range(6):
              p=subprocess.run(['gh','api',endpoint],capture_output=True,text=True,timeout=120)
              if p.returncode and '404' not in p.stderr and 'Not Found' not in p.stderr:
                raise RuntimeError('PRIVATE_READ_FAILED')
              payload={'branch':'main','message':'data(gamepulse): integrate Rockets-Spurs into verified private searchable warehouse','content':base64.b64encode(data).decode()}
              if p.returncode==0:payload['sha']=json.loads(p.stdout)['sha']
              w=subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],input=json.dumps(payload),capture_output=True,text=True,timeout=120)
              if w.returncode==0:break
              time.sleep(attempt+1)
            else:raise RuntimeError('PRIVATE_WRITE_FAILED')
            assert base64.b64decode(api(endpoint)['content'])==data,'PRIVATE_SHA_READBACK_FAILED'
          put('gamepulse/catalog/2026-27-integrated-current.json',(root/'catalog.json').read_bytes())
          for f in sorted((root/'views').glob('*.json')):
            where=('gamepulse/fusion/index/index.json' if f.name=='index.json' else 'gamepulse/fusion/index/games/'+f.name)
            put(where,f.read_bytes())
          for f in sorted((root/'onoff').glob('*.json')):
            where=('gamepulse/fusion/tracking_onoff/index.json' if f.name=='index.json' else 'gamepulse/fusion/tracking_onoff/'+f.name)
            put(where,f.read_bytes())
          report=json.loads((root/'manifest.json').read_text())
          status={'schema':'gamepulse.fusion-search-status.v1','release_tag':'gamepulse-fusion-2026-27',
            'games':report['game_count'],'blueprint_games':report['blueprint_game_count'],
            'blueprint_shots':report['blueprint_shot_rows'],'tracking_frames':report['total_frames'],
            'exact_5v5_frames':report['exact_5v5_frames'],'xman_index_rows':report['xman_rows'],
            'rockets_spurs_0022600009_integrated':True,
            'confidence_notice':'Observed positions and NBA native Blueprint; PBP time is not certified shot-release/video sync.'}
          put('gamepulse/fusion/status.json',(json.dumps(status,indent=2)+'\n').encode())
          index=json.loads(base64.b64decode(api(base+'/contents/gamepulse/fusion/index/index.json')['content']))
          game=json.loads(base64.b64decode(api(base+'/contents/gamepulse/fusion/index/games/0022600009.json')['content']))
          assert '0022600009' in index['games'] and game.get('game_id')=='0022600009'
          print('ROCKETS_MERGED_AND_SEARCHABLE_PRIVATE_VERIFIED')
          PY