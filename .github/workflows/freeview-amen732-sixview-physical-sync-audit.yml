name: Amen732 original six-video physical timing audit v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-sixview-physical-sync-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amen732-sixcamera-real-audio-synchronization
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public media boundary and run timing sign/cycle tests
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' 'scipy>=1.11,<1.15'
          python3 tools/amen732_sixview_audio_alignment_v2.py --selftest
      - name: Recover real six original native NBA video feeds with source hashes and exact PTS
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          ROOT="$RUNNER_TEMP/amen732-sync"
          mkdir -p "$ROOT/native" "$ROOT/private_qa"
          python3 tools/amen732_official_sixvideo_acquire.py \
            --root "$ROOT/native" \
            --page 'https://clips.nba.com/?gameNo=0022600009&eventNum=732&source=grs' \
            --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)"
          python3 - "$ROOT/native/source_manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["source_view_count"]==6 and len(m["feeds"])==6
          print("SIX_SOURCE_ORIGINAL_NBA_VIDEOS_SHA_VERIFIED")
          PY
      - name: Infer six-camera native audio offsets and reject non-cycle-consistent frames
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/amen732-sync"
          python3 tools/amen732_sixview_audio_alignment_v2.py \
            --source "$ROOT/native" --out "$ROOT/private_qa/amen732_original_sixview_audio_alignment_v2.json" \
            --ffmpeg "$(command -v ffmpeg)" --broadcast-seed 9.1041
          python3 - "$ROOT/private_qa/amen732_original_sixview_audio_alignment_v2.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          assert q["input_original_native_full_mp4_count"]==6
          assert q["pairwise_edge_count"]==15
          assert not q["same_physical_exposure_certified"]
          print("SIX_SOURCE_VIDEO_AUDIO_QA_RECORDED",
            "accepted_edges",q["accepted_edges"],
            "graph_connected",q["graph"].get("connected"),
            "cycle_max_ms",q["graph"].get("pairwise_residual_max_ms"),
            "suggested_frame_count",len(q["provisional_frame_candidates"]))
          PY
          cp "$ROOT/private_qa/amen732_original_sixview_audio_alignment_v2.json" /tmp/amen732-original-audio-qa-v2.json
      - name: Store metadata-only six-view alignment QA, never source footage
        uses: actions/upload-artifact@v4
        with:
          name: amen732-original-sixcamera-timing-qa-v2
          path: /tmp/amen732-original-audio-qa-v2.json
          if-no-files-found: error
          retention-days: 14
