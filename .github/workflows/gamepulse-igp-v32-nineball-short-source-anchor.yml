# Private NBA SDK is SHA-checked in private 104; only aggregate counts/errors reach public logs.
name: IGP nineball same official ID native short-anchor validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-nineball-short-source-anchor.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-nineball-short-source-anchor
  cancel-in-progress: false
jobs:
  source-threegame:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private threegame masked NBA original player position short-anchor QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_nine_ball_short_native_anchor_v1.py
          python3 gamepulse/fusion/igp_v32_nine_ball_short_native_anchor_v1.py --root . --games 0022600093 0022600109 0022600145 --out "$RUNNER_TEMP/nineball-short-pilot.json" > "$RUNNER_TEMP/nineball-short-pilot.log" 2>&1 || {
             echo SOURCE_NATIVE_SHORT_ANCHOR_PILOT_REJECTED
             python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=(Path(os.environ["RUNNER_TEMP"])/"nineball-short-pilot.log").read_text(errors="replace").splitlines()
          msg=next((x for x in reversed(s) if re.match(r"^(?:AssertionError|ValueError|KeyError|TypeError|FileNotFoundError|ImportError|RuntimeError):",x)),None)
          print("REDACTED_SOURCE_FAILURE",re.sub(r"[0-9]{4,}","[ID]",msg or "UNKNOWN")[:150])
          PY
             exit 41
          }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"nineball-short-pilot.json").read_bytes())
          c=q["counts"]
          assert q["games"]==3 and c["nine_plus_ball"]>0
          assert c.get("missing_ID_original_anchor_graded_50",0)<=c.get("missing_ID_original_anchor_graded_100",0)<=c.get("missing_ID_original_anchor_graded_200",0)<=c.get("missing_ID_original_anchor_graded_350",0)
          print("NINEBALL_SHORT_NATIVE_PILOT_AGGREGATES",json.dumps({
            "counts":q["counts"],"masked_original_source_XY_ft":q["source_heldout_original_XY_ft"],
            "physical_video_certified":False,"new_production_scenes":0},sort_keys=True))
          PY
  all71-source:
    needs: source-threegame
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Original NBA all71 short anchor 10Hz census and source masked position errors
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_nine_ball_short_native_anchor_v1.py --root . --out "$RUNNER_TEMP/nineball-short-all71.json" > "$RUNNER_TEMP/nineball-short-all71.log" 2>&1 || {
             echo SOURCE_NATIVE_SHORT_ANCHOR_ALL71_REJECTED
             python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=(Path(os.environ["RUNNER_TEMP"])/"nineball-short-all71.log").read_text(errors="replace").splitlines()
          msg=next((x for x in reversed(s) if re.match(r"^(?:AssertionError|ValueError|KeyError|TypeError|FileNotFoundError|ImportError|RuntimeError):",x)),None)
          print("REDACTED_SOURCE_FAILURE",re.sub(r"[0-9]{4,}","[ID]",msg or "UNKNOWN")[:150])
          PY
             exit 41
          }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"nineball-short-all71.json").read_bytes())
          c=q["counts"]
          assert q["games"]==71 and c["nine_plus_ball"]==82443
          assert c.get("missing_ID_original_anchor_graded_50",0)<=c.get("missing_ID_original_anchor_graded_100",0)<=c.get("missing_ID_original_anchor_graded_200",0)<=c.get("missing_ID_original_anchor_graded_350",0)
          print("NINEBALL_SHORT_NATIVE_ALL71_AGGREGATES",json.dumps({
            "games":71,"counts":c,"masked_original_source_XY_ft":q["source_heldout_original_XY_ft"],
            "physical_video_certified":False,"new_production_scenes":0},sort_keys=True))
          PY
      - name: Commit immutable original-source aggregate QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_nineball_short_native_anchor_all71_v1.json
          test ! -e "$dest"
          cp "$RUNNER_TEMP/nineball-short-all71.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): full71 missing official actor native short-gap source accuracy'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo NINEBALL_SHORT_NATIVE_ALL71_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
