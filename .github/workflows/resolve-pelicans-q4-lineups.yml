name: Resolve Pelicans Q4 Lineups
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-pelicans-q4-lineups.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install PDF text tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: Freeze official NBA Q4 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://statsdmz.nba.com/pdfs/20251218/20251218_HOUNOP_book.pdf'
          curl -fL --retry 3 --connect-timeout 20 -A 'Mozilla/5.0' "$URL" -o out/official_book.pdf
          sha256sum out/official_book.pdf | tee out/official_book.sha256
          pdftotext -layout out/official_book.pdf out/q4_official.txt
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          p=Path('out/official_book.pdf')
          raw=p.read_bytes()
          txt=Path('out/q4_official.txt').read_text(errors='replace')
          required=[
            '4th QUARTER',
            'Rockets Starters:',
            '10:48',
            '10:32',
            '09:56',
            '09:30',
            '08:23',
            '07:50',
            '05:41',
            '04:37',
            '03:18',
            '02:51',
            '02:14',
            ':44.3',
          ]
          missing=[x for x in required if x not in txt]
          if missing:
            raise SystemExit(f'missing official Q4 markers: {missing}')
          evidence={
            'schema':'hoopvision.pelicans-q4-official-evidence.v1',
            'game_id':'0022500375',
            'game_date_local':'2025-12-18',
            'source_url':'https://statsdmz.nba.com/pdfs/20251218/20251218_HOUNOP_book.pdf',
            'source_sha256':hashlib.sha256(raw).hexdigest(),
            'q4_starters':['Aaron Holiday','Jabari Smith Jr.','Reed Sheppard','Clint Capela','Kevin Durant'],
            'q4_houston_points':20,
            'q4_houston_fg':'9-23',
            'q4_houston_fg_pct':39.1,
            'montage_semantics':'12 empty/non-scoring Houston possessions from Q4; edited montage, not continuous game footage',
            'empty_possession_terminal_clocks':[
              '10:48','10:32','09:56','09:30','08:23','07:50',
              '05:41','04:37','03:18','02:51','02:14','00:44.3'
            ],
            'note':'Terminal clocks are frozen against the official scorer book; exact montage edit frames remain a separate video-level freeze.'
          }
          Path('out/q4_evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pelicans-q4-official-evidence
          path: out/
          retention-days: 14
