name: Game Pulse 36-game independent NBA provider ONOFF catch-up
# Source-verified eight per-game files already private; push reassembles QA only. Manual dispatch rechecks original provider.
# Private original NBA-source validation; fail-closed QA retries and SHA readback, no public data.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-28game-native-pbp-onoff.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-nba-36game-final8-source-pbp-onoff-qa
  cancel-in-progress: false
jobs:
  original-nba-sources:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        game: ['0022600104','0022600105','0022600106','0022600107',
          '0022600108','0022600109','0022600110','0022600111']
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public source guard and private repository boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Recover official game actions and independently validated provider ONOFF
        run: |
          set -euo pipefail
          python3 tools/licensed_feed/official_pbp_onoff_28.py one --game "${{ matrix.game }}"
  aggregate:
    needs: original-nba-sources
    if: github.event_name == 'workflow_dispatch' && always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Merge only independently source-verified 36-game NBA provider ONOFF; preserve prior 28
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 tools/licensed_feed/official_pbp_onoff_28.py assemble36

  seven-provider-43:
    # Re-run single missing Clippers-Thunder provider game after corrected zero-ID regression.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Protect public/private original NBA provider boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_AUTH_MISSING'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone -q --depth 1 https://github.com/timeedmonds-maker/104 "$RUNNER_TEMP/private104"
      - name: Run immutable provider index and missingness regression tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private104"
          python3 -m py_compile "$ROOT/gamepulse/fusion/build_20261025_onoff_43.py"
          PYTHONPATH="$ROOT/gamepulse/fusion" python3 -m unittest discover -v \
            -s "$ROOT/gamepulse/fusion/tests" -p 'test_build_20261025_onoff_43.py'
          PYTHONPATH="$ROOT/gamepulse/fusion" python3 -m unittest discover -v \
            -s "$ROOT/gamepulse/fusion/tests" -p 'test_official_onoff_zero_team_2026.py'
      - name: Collect seven independently game-scoped NBA lineup and ONOFF source records
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private104"
          PYTHONPATH="$ROOT/gamepulse/fusion" python3 \
            "$ROOT/gamepulse/fusion/build_20261025_onoff_43.py" \
            --repo "$ROOT" --retries 3
      - name: Preserve independently qualified NBA provider results only privately
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private104"
          cd "$ROOT"
          git config user.name 'gamepulse-provider-worker'
          git config user.email 'gamepulse-provider-worker@users.noreply.github.com'
          git add -A gamepulse/fusion/onoff/
          if git diff --cached --quiet; then
            echo 'PRIVATE_43_PROVIDER_SOURCE_ALREADY_CURRENT'
            exit 0
          fi
          git commit -qm 'data(gamepulse): preserve independent new-slate NBA provider lineup and onoff source'
          for attempt in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then
              echo 'PRIVATE_NEW_GAME_PROVIDER_SOURCE_COMMITTED'
              exit 0
            fi
            git fetch -q origin main
            git rebase -q origin/main || { echo 'PRIVATE_PROVIDER_CONCURRENT_CONFLICT'; exit 4; }
            sleep "$attempt"
          done
          exit 5
      - name: Keep source-level NBA records private
        if: always()
        run: echo 'Only generic CPU execution status is public; all provider results and player rows are private in 104.' >> "$GITHUB_STEP_SUMMARY"
