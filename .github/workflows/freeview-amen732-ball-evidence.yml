name: Freeview event 732 native ball pixel evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-ball-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amen732-original-ball-pixels
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard private sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from public_content_guard import scan
          errors=scan(['.github/workflows/freeview-amen732-ball-evidence.yml'])
          assert not errors,errors
          print('ORIGINAL_SOURCE_PRIVACY_GUARD_PASS')
          PY
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Inspect original NBA balls near Amen and Wemby block
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          TAG='freeview-native-0022600009-732'
          mkdir -p "$TMP/original" "$TMP/qa"
          gh release download "$TAG" --repo timeedmonds-maker/104 --dir "$TMP/original" \
            --pattern '*.mp4' --pattern 'source_manifest.json' \
            --pattern 'native_presentation_timestamps.json'
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_native_ball_pixels.py?ref=bebf7d6f9597b72a2c994be343c7fec96f362c64' \
             --jq .content | base64 -d > "$TMP/pixels.py"
          python3 -m pip install --quiet --disable-pip-version-check 'numpy<2' opencv-python-headless==4.10.0.84
          python3 "$TMP/pixels.py" --selftest
          python3 "$TMP/pixels.py" --root "$TMP/original" \
            --out "$TMP/qa/event732-original-native-ball-pixels.json"
          python3 - "$TMP/qa/event732-original-native-ball-pixels.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1]))
          assert len(o['camera_views'])==4
          assert all(v['source_frame_count']==21 for v in o['camera_views'].values())
          assert o['exact_first_hand_ball_touch_certified'] is False
          print("FOUR_NATIVE_CAMERA_BALL_TRACKS_CAPTURED",sum(v['pixel_matched_count']
                for v in o['camera_views'].values()),"original_pixel_matches")
          PY
          gh release upload "$TAG" "$TMP/qa/event732-original-native-ball-pixels.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="event732-original-native-ball-pixels.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$TMP/qa/event732-original-native-ball-pixels.json" | cut -d' ' -f1)"
          echo NBA_FOUR_NATIVE_CAMERA_BALL_PIXEL_SHA256_READBACK_PASS

          python3 - "$TMP/qa/event732-original-native-ball-pixels.json" "$TMP/put.json" <<'PY'
          import base64,json,sys
          from pathlib import Path
          body=Path(sys.argv[1]).read_bytes()
          assert len(body)<200000
          Path(sys.argv[2]).write_text(json.dumps({
              "branch":"research/amen-wemby-freeze-spin-20261024",
              "message":"data(freeview): source-native 2D ball tracks (QA candidates, not certified contacts)",
              "content":base64.b64encode(body).decode()}))
          PY
          DEST='repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_original_ball_pixels.json'
          if gh api "$DEST?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha >/dev/null 2>&1; then
            python3 - "$TMP/put.json" "$(gh api "$DEST?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha)" <<'PY'
          import json,sys
          p=sys.argv[1];o=json.load(open(p));o["sha"]=sys.argv[2]
          open(p,"w").write(json.dumps(o))
          PY
          fi
          gh api -X PUT "$DEST" --input "$TMP/put.json" --jq .content.sha >/dev/null
          echo PRIVATE_EVENT732_SOURCE_BALL_TRACK_AUDIT_COMMITTED

          cp "$TMP/pixels.py" "$TMP/amen732_native_ball_pixels.py"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_ball_bidirectional_consensus.py?ref=45451091dbab50fdc162db9fb3c0257499e75eec' \
            --jq .content | base64 -d > "$TMP/consensus.py"
          python3 "$TMP/consensus.py" --selftest
          python3 "$TMP/consensus.py" --root "$TMP/original" \
            --out "$TMP/qa/event732-ball-two-seed-consensus.json"
          gh release upload "$TAG" "$TMP/qa/event732-ball-two-seed-consensus.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="event732-ball-two-seed-consensus.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$TMP/qa/event732-ball-two-seed-consensus.json" | cut -d' ' -f1)"
          echo NBA_BALL_TWO_SEED_SHA256_READBACK_PASS
          python3 - "$TMP/qa/event732-ball-two-seed-consensus.json" "$TMP/put_dual.json" <<'PY'
          import base64,json,sys
          from pathlib import Path
          body=Path(sys.argv[1]).read_bytes()
          assert len(body)<200000
          Path(sys.argv[2]).write_text(json.dumps({
            "branch":"research/amen-wemby-freeze-spin-20261024",
            "message":"qa: two-seed consensus for original NBA ball tracks",
            "content":base64.b64encode(body).decode()}))
          PY
          DEST='repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_ball_two_seed_consensus.json'
          if gh api "$DEST?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha >/dev/null 2>&1; then
            python3 - "$TMP/put_dual.json" "$(gh api "$DEST?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha)" <<'PY'
          import json,sys
          p=sys.argv[1];o=json.load(open(p));o["sha"]=sys.argv[2]
          open(p,"w").write(json.dumps(o))
          PY
          fi
          gh api -X PUT "$DEST" --input "$TMP/put_dual.json" --jq .content.sha >/dev/null
          echo PRIVATE_EVENT732_BALL_CONSENSUS_COMMITTED

          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_two_strata_ptz_qa.py?ref=80b8e4edfa9feaf2519057679cfc888695e3a93b' \
            --jq .content | base64 -d > "$TMP/ptz.py"
          python3 "$TMP/ptz.py" --selftest
          python3 "$TMP/ptz.py" --root "$TMP/original" \
            --out "$TMP/qa/event732-independent-static-ptz.json"
          gh release upload "$TAG" "$TMP/qa/event732-independent-static-ptz.json" \
            --repo timeedmonds-maker/104 --clobber >/dev/null
          remote="$(gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="event732-independent-static-ptz.json") | .digest')"
          test "$remote" = "sha256:$(sha256sum "$TMP/qa/event732-independent-static-ptz.json" | cut -d' ' -f1)"
          echo PTZ_HELDOUT_SOURCE_SHA256_PASS
          python3 - "$TMP/qa/event732-independent-static-ptz.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          print("PTZ_NATIVE_REAL_CASE",[(c["label"],c["independent_static_strata_passed"]) for c in a["camera_motion_qa"]])
          PY

          python3 - "$TMP/qa/event732-independent-static-ptz.json" "$TMP/put_ptz.json" <<'PY'
          import base64,json,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          assert len(raw)<500000
          Path(sys.argv[2]).write_text(json.dumps({
              "branch":"research/amen-wemby-freeze-spin-20261024",
              "message":"qa: six original NBA static-depth heldout PTZ transforms",
              "content":base64.b64encode(raw).decode("ascii")}))
          PY
          DEST='repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_native_ptz_two_strata.json'
          if gh api "$DEST?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha >/dev/null 2>&1; then
            python3 - "$TMP/put_ptz.json" "$(gh api "$DEST?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha)" <<'PY'
          import json,sys
          path=sys.argv[1];data=json.load(open(path));data["sha"]=sys.argv[2]
          open(path,"w").write(json.dumps(data))
          PY
          fi
          gh api -X PUT "$DEST" --input "$TMP/put_ptz.json" --jq .content.sha >/dev/null
          echo EVENT732_PT_Z_PRIVATE_FIXTURE_COMMITTED
