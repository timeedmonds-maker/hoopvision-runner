name: Amen 732 longer Left Slash source XYZ conditional timing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeview-amen732-left-long-research-pts.yml'
      - 'tools/public_content_guard.py'
permissions:
  contents: read
concurrency:
  group: freeview-amen732-left-long-provisional-only
  cancel-in-progress: false
jobs:
  source-timing-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE: timeedmonds-maker/104
      BRANCH: research/amen-wemby-freeze-spin-20261024
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public workflow and access private source through Git only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/nativeaskpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac
          SH
          chmod 700 "$RUNNER_TEMP/nativeaskpass"
          export GIT_ASKPASS="$RUNNER_TEMP/nativeaskpass" GIT_TERMINAL_PROMPT=0
          git clone --quiet --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE.git" "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" sparse-checkout set hoopvision/freeview
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          echo AMEN732_LONG_SOURCE_GIT_ONLY_INPUT_PASS
      - name: Test expanded NBA source track under bounded research-only PTS assumption
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            numpy==1.26.4 scipy==1.14.1 opencv-python-headless==4.10.0.84
          cd "$RUNNER_TEMP/source"
          export PYTHONPATH="$PWD/hoopvision/freeview"
          python3 hoopvision/freeview/amen732_original_left_long_xyz_holdout.py --selftest
          python3 hoopvision/freeview/amen732_original_left_long_xyz_holdout.py \
            --provisional-native-pts \
            --source hoopvision/freeview/fixtures/amen732_original_recapture_43_three_actor_xyz_20261026.json \
            --sam hoopvision/freeview/fixtures/amen732_23source_sam21_ball_masks_20261026.json \
            --long hoopvision/freeview/fixtures/amen732_two_slash_original_native_long_track_20261026.json \
            --out hoopvision/freeview/fixtures/amen732_left_long_provisional_pts_holdout_20261026.json
          python3 - <<'PY'
          import json
          j=json.load(open('hoopvision/freeview/fixtures/amen732_left_long_provisional_pts_holdout_20261026.json'))
          assert j['research_only_as_full_native_PTS_unknown']
          assert not j['actual_original_native_ffprobe_PTS_validated_against_frozen_SAM']
          assert not j['camera_metric_calibration_certified']
          assert j['additional_long_RGB_native_source_frames']>=7
          print('AMEN732_PROVISIONAL_LONG_ORIGINAL_RGB_HOLDOUT',j['additional_long_RGB_native_source_frames'],
           j['mean_prior_pixel_error_px'],j['mean_long_pixel_error_px'])
          PY
      - name: Commit only private research receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          git config user.name 'HoopVision free CPU original source'
          git config user.email 'hoopvision-runner@users.noreply.github.com'
          git add hoopvision/freeview/fixtures/amen732_left_long_provisional_pts_holdout_20261026.json
          git diff --cached --check
          git commit -qm 'qa(freeview): provisional-native-PTS left Slash longer SDK source camera holdout'
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo AMEN732_PROVISIONAL_PTS_LONG_LEFT_PRIVATE_COMMITTED
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
