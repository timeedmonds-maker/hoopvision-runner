name: IPPT all 36 original NBA PBP actions linked to native XY, no false physical instant
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-all-pbp-native-xy-36.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  all-pbp-native-xy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_PRIVATE_SHA: 983314ce07a1fb8f168096e0ea8309e383f3b1bb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source privacy guard and exact research SHA checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/timeedmonds-maker/104.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/igp-private" rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          echo "IPPT_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: All PBP action semantics and source fixture regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
             gamepulse/fusion/igp_ippt_all_pbp_action_alignment_grades_2026.py \
             gamepulse/fusion/query_igp_ippt_event_snapshots_2026.py \
             gamepulse/fusion/igp_ippt_all_pbp_native_event_query_36game_qa_2026.py
          python3 -m unittest -v \
             gamepulse/fusion/test_igp_ippt_all_pbp_action_alignment_grades_2026.py \
             gamepulse/fusion/test_query_igp_ippt_event_snapshots_2026.py \
             gamepulse/fusion/test_igp_ippt_event_snapshot_census_2026.py
      - name: Two real original SHA source games all NBA action types
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_native_event_query_36game_qa_2026.py \
            --root . --games 0022600009 0022600092
          echo "IPPT_REAL_TWO_GAMES_ALL_NBA_PBP_EVENTS_AND_XY_PASS"
      - name: All 36 real original native SDK and NBA PBP game action keys
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_pbp_native_event_query_36game_qa_2026.py \
            --root . | tee "$RUNNER_TEMP/ippt_all_pbp_xy_aggregate.log"
          echo "IPPT_36GAME_ALL22314_PBP_ACTION_XY_QUERY_PASS"
      - name: Publish ONLY aggregate action-type coverage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          log=Path(os.environ["RUNNER_TEMP"])/"ippt_all_pbp_xy_aggregate.log"
          report={"github_run_id":os.environ["GITHUB_RUN_ID"],
                  "prior_job_status":os.environ["QA_JOB_RESULT"],
                  "private_expected_SHA":"983314ce07a1fb8f168096e0ea8309e383f3b1bb"}
          if log.exists():
              lines=[line.partition(" ")[2] for line in log.read_text().splitlines()
                  if line.startswith("IPPT_ALL36_ALL_NBA_PBP_ACTION_NATIVE_XY_COVERAGE_QA ")]
              if len(lines)==1:
                  raw=json.loads(lines[0])
                  report.update({"schema":raw["schema"],"games":raw["games"],
                      "counts":raw["counts"],"by_type":raw["by_type"],
                      "physical_timing_NOT_certified":True})
          text="All-action NBA play-by-play source XY QA; no licensed original actor coordinates, per-event private positions, or private NBA archive bytes.\n\n~~~json\n"+json.dumps(report,sort_keys=True,indent=2)+"\n~~~\n"
          (Path(os.environ["RUNNER_TEMP"])/"all_pbp_event_qa_comment.md").write_text(text)
          PY
          gh issue comment 126 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/all_pbp_event_qa_comment.md"

# No private original NBA XYZ in public logs. All physical event moments remain unc ertified.
