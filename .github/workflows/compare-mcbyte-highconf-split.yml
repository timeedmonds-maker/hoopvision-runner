name: Compare McByte High-Confidence Split

on:
  push:
    branches: [main]
    paths: ['.github/workflows/compare-mcbyte-highconf-split.yml']

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SHA: d9ce86e60c3854fba952437edb0e045411e2df81
  SOURCE_SHA256: 23b4beeee56b343e733f804047cce2289729b7cc31b445dcae2489900fb9217a
  SOURCE_RECOVERY_RUN_ID: '35923251814'
  DETECTOR_SHA256: 708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact runtime
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q 'numpy<2' pandas opencv-python-headless supervision scipy rich requests 'jsonargparse<5' pydeprecate onnxruntime
          git clone -q https://github.com/roboflow/trackers.git /tmp/trackers
          git -C /tmp/trackers checkout -q 3fb83d1618f29b7fdd4617757b6894e4ec71146d
          python -m pip install -q -e /tmp/trackers --no-deps
          git clone -q https://github.com/ortizeg/object-detection-eval.git /tmp/object-detection-eval
          git -C /tmp/object-detection-eval checkout -q bcf6279073af042c3a5084a041f6c5d8e71e6af1
          python -m pip install -q -e /tmp/object-detection-eval
      - name: Recover exact source and detector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/source work/models work/out
          gh run download "$SOURCE_RECOVERY_RUN_ID" --repo timeedmonds-maker/hoopvision-runner --name hoopvision-hawks-source-l4-disk-recovery --dir work/source
          cp work/source/exact_source_native.mp4 work/source_native.mp4
          echo "$SOURCE_SHA256  work/source_native.mp4" | sha256sum -c -
          curl -fsSL https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx -o work/models/rfdetr_m_640.onnx
          echo "$DETECTOR_SHA256  work/models/rfdetr_m_640.onnx" | sha256sum -c -
      - name: Replay fixed candidate NMS with association split arms
        run: |
          PYTHONPATH="$PWD/src/tools:$PWD/src" python - <<'PY'
          import sys,json
          from pathlib import Path
          import cv2,pandas as pd
          sys.path.insert(0,'/tmp/object-detection-eval/src')
          from object_detection_eval.inference.detectors.rfdetr import RFDETRDetector
          import adams_screen_prod_poc as base
          from screen_tracker_nextgen.run_angle_tracking_mcbyte import TimeConsistentMcByte

          assert base.PLAYER_NMS_IOU==0.55
          detector=RFDETRDetector('work/models/rfdetr_m_640.onnx',base.LABEL_MAP,confidence_threshold=.045,num_select=300,input_height=640,input_width=640,providers=['CPUExecutionProvider'])
          splits=[.25,.225,.20]
          trackers={s:TimeConsistentMcByte(analysis_fps=15.0,enable_cmc=True,cmc_method='sparseOptFlow',track_activation_threshold=.30,high_conf_det_threshold=s) for s in splits}
          rows=[]; ids={s:[] for s in splits}
          cap=cv2.VideoCapture('work/source_native.mp4'); fps=float(cap.get(cv2.CAP_PROP_FPS) or 30000/1001); W=int(cap.get(cv2.CAP_PROP_FRAME_WIDTH)); H=int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          start=int(round(4*fps)); end=int(round(16*fps)); every=max(1,int(round(fps/15.0)))
          for rel,absf in enumerate(range(start,end)):
              if rel%every: continue
              cap.set(cv2.CAP_PROP_POS_FRAMES,absf); ok,frame=cap.read()
              if not ok: continue
              all_dets=detector.predict(frame)
              dets=[d for d in all_dets if float(d.confidence)>=.20]
              players=base.collapse_players(base.to_sv(dets,W,H,base.PLAYER_CLASSES))
              rec={'tracking_frame':rel,'time_s':4+rel/fps,'post_nms':len(players)}
              for s,tr in trackers.items():
                  out=tr.update(players,frame=frame,timestamp=rel/fps)
                  valid=[int(t) for t in out.tracker_id if int(t)>=0] if len(out) else []
                  rec[f'tracks_{s:.3f}']=len(valid); ids[s].extend(valid)
              rows.append(rec)
          cap.release()
          d=pd.DataFrame(rows); d.to_csv('work/out/highconf_split_by_frame.csv',index=False)
          early=(d.time_s>=5.8)&(d.time_s<=6.8); arms={}
          from collections import Counter
          for s in splits:
              q=d[f'tracks_{s:.3f}']; cc=Counter(ids[s])
              arms[f'{s:.3f}']={'frames_ge10':int((q>=10).sum()),'frames_gt10':int((q>10).sum()),'max_tracks':int(q.max()),'total_rows':int(q.sum()),'unique_ids':len(cc),'short_ids_le2':sum(v<=2 for v in cc.values()),'short_ids_le4':sum(v<=4 for v in cc.values()),'early_ge10':int((early&(q>=10)).sum()),'early_gt10':int((early&(q>10)).sum())}
          rep={'schema':'hoopvision.mcbyte-highconf-split.v1','candidate_sha':'d9ce86e60c3854fba952437edb0e045411e2df81','player_nms_iou':.55,'track_activation_threshold':.30,'arms':arms,'identity_authorized':False,'qualification_claim':'NONE_DIAGNOSTIC_ONLY','interpretation':'Only high/low association split changes; new-track activation remains .30 so 0.20-0.30 detections cannot spawn new tracks.'}
          Path('work/out/highconf_split_summary.json').write_text(json.dumps(rep,indent=2,sort_keys=True)+'\n')
          print('HOOPVISION_MCBYTE_HIGHCONF='+json.dumps(rep,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hoopvision-mcbyte-highconf-split
          path: work/out/
          retention-days: 14
