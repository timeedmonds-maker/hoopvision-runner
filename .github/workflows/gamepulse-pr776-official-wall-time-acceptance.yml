name: PR776 official NBA timeActual vs source XYZ acceptance
# Real NBA PBP wall timestamp source and original private SDK UTC; public logs aggregate QA only.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-official-wall-time-acceptance.yml']
permissions: {contents: read}
concurrency:
  group: pr776-official-nba-timeactual-native-wallclock
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R: timeedmonds-maker/104
      B: research/gamepulse-clock-boundary-integrity-20261025
      GAME: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner and checkout existing canonical private PR
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$GH_TOKEN";; *) exit 1;; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$B" "https://github.com/$R.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion gamepulse/live/tracking_touches
      - name: Source-free UTC temporal alignment regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_official_timeactual_wallclock_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests -v -p test_igp_official_timeactual_wallclock_2026.py
      - name: Fetch original NBA live playbyplay; compare real source SDK XYZ timestamps
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          OUT=gamepulse/fusion/qa/igp_progress_20261027/official_nba_timeactual_vs_original_sdk_0022600009.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_official_timeactual_wallclock_2026.py --root . --game-id "$GAME" --fetch-live-official-pbp --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          st=d['tipoff_and_official_timeline']['stats']
          assert st['all_actions']==586 and st['timeActual_usable']==586
          assert st['timeActual_coverage_pct']==100.0
          assert d['tipoff_and_official_timeline']['opening_tip']['nba_action_number']==4
          assert d['native_utc_diagnostics']['original_native_timestamps']==34979
          assert d['native_utc_diagnostics']['raw_timestamp_coordinate_offset_ms']==0
          assert d['physical_possessions_certified']==0
          assert d['independent_event_timing_error_median_ms'] is None
          print('IGP_OFFICIAL_TIMEACTUAL_REAL_NATIVE_QA_ACCEPTED',json.dumps({
              'source_actions':586,'timeActual_coverage_pct':100.0,
              'native_timestamps':34979,'nonphysical_proximity_not_validation':True,
              'independently_matched_physical_event_count':0,
              'physical_possessions_certified':0},sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          git commit -q -m "data(igp): official 586-event real-world timeline and source XYZ UTC diagnostic"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B"
            git rebase -q "origin/$B"
            if git push -q origin "HEAD:refs/heads/$B"; then
              echo IGP_NBA_TIMEACTUAL_TO_ORIGINAL_NATIVE_UTC_PRIVATE_PUBLISHED
              exit 0
            fi
            sleep "$i"
          done
          exit 15
