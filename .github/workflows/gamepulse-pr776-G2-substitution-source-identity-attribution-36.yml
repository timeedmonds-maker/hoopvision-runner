name: PR776 G2 53k NBA substitution-side source actor discordance attribution all36
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-substitution-source-identity-attribution-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G2-sub-source-ID-attribution-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Protect public runner and fetch accepted original private NBA SDK source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Unit-check SDK actor attribution and immutability
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g2_substitution_source_actor_discrepancy_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
             -p 'test_igp_g2_substitution_source_actor_discrepancy_2026.py' -v
          echo G2_NBA_ORIGINAL_SUBSTITUTION_ACTOR_ATTRIBUTION_REGRESSION_PASS
      - name: Classify all 53,464 original source actor disputes against official before-after NBA ten
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_substitution_source_actor_dispute_attribution_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_substitution_source_actor_discrepancy_2026.py \
            --root . --out "$OUT" > "$RUNNER_TEMP/private-G2-substitution-source-classification.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]));v=report["counts"];e=report["source_actor_evidence"]
          assert report["source_games"]==36
          assert v["all_original_native_frames"]==1203986
          assert v["existing_gold_or_long_pair_frames"]==577727
          assert v["candidate_native_frames"]==90201
          assert v["source_conflicting_frame"]==53464
          assert v["source_compatible_frame"]==36737
          assert sum(e.values())==90201
          assert report["NBA_SDK_original_XYZ_authoritative"]
          assert report["NBA_official_roster_never_overridden"]
          assert report["no_actor_ID_or_original_coordinates_exported"]
          print("G2_NBA_ORIGINAL_SUBSTITUTION_ACTOR_DISCORDANCE_36_PASS",json.dumps({
             "games":36,"native":v["all_original_native_frames"],
             "candidate":v["candidate_native_frames"],
             "contradictions":v["source_conflicting_frame"],
             "source_compatible":v["source_compatible_frame"],
             "opposite_side_full_exact":e.get("EXACT_TEN_OPPOSITE_OFFICIAL_SUBSTITUTION_SIDE",0),
             "opposite_side_partial":e.get("PARTIAL_OBSERVED_IDS_SUBSET_OF_OPPOSITE_TEN",0),
             "original_current_ten_plus_extras":e.get("EXTRA_IDS_WITH_ALL_CURRENT_OFFICIAL_TEN",0),
             "unexplained_exact_ten":e.get("EXACT_TEN_UNEXPLAINED_BY_KNOWN_SAME_PERIOD_ROSTER",0)
          },sort_keys=True))
          PY
      - name: Commit aggregate-only SHA-linked private NBA G2 receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_substitution_source_actor_dispute_attribution_36_v1.json
          git config user.name "Game Pulse Original NBA Actor QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): classify 53k substitution-side source-vs-official NBA actor disputes by roster provenance"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_G2_SOURCE_ACTOR_DISCREPANCY_36_SHA_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
