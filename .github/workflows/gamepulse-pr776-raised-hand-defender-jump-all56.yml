name: PR776 56-game raised-hand vs jump original-source analysis
# Private 56-game SHA-ledger calculation; aggregate-only stdout, no licensed XYZ.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-pr776-raised-hand-defender-jump-all56.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-56game-handheight-jumpheight-20261029
  cancel-in-progress: false
jobs:
  compute-validated-aggregates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and private connection
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/handheight-private"
          git -C "$RUNNER_TEMP/handheight-private" sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_raised_hand_vs_jump_all56_20261029.py' \
            '/gamepulse/fusion/igp_defensive_shot_disruption_3pt_midrange_2026.py' \
            '/gamepulse/fusion/qa/igp_progress_20261029/igp_all56_advanced_companion_biomechanics_v2.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all56_v2/'
          echo "PRIVATE_ROOT=$RUNNER_TEMP/handheight-private" >> "$GITHUB_ENV"
      - name: Source-free checks and SHA-verified 56-game computation
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          python3 -m py_compile \
             gamepulse/fusion/igp_raised_hand_vs_jump_all56_20261029.py \
             gamepulse/fusion/igp_defensive_shot_disruption_3pt_midrange_2026.py
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          from igp_raised_hand_vs_jump_all56_20261029 import band,HAND,JUMP,shot_band
          assert band(85,HAND)=="85to100"
          assert band(0,JUMP)=="under0p5"
          assert band(8,JUMP)=="8plus"
          assert shot_band("3pt",24)=="3pt_24to27"
          assert shot_band("2pt",9.9)=="2pt_4to10"
          print("HAND_JUMP_SOURCE_FREE_TESTS_PASS")
          PY
          PYTHONPATH=gamepulse/fusion python3 \
            gamepulse/fusion/igp_raised_hand_vs_jump_all56_20261029.py \
            --root . \
            --output gamepulse/fusion/qa/igp_progress_20261029/igp_raised_hand_vs_jump_all56_distance_type_adjusted_v2.json
      - name: Validate output, commit only private aggregate QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          python3 - <<'PY'
          import json
          p="gamepulse/fusion/qa/igp_progress_20261029/igp_raised_hand_vs_jump_all56_distance_type_adjusted_v2.json"
          x=json.load(open(p))
          assert x["official_shots"]==10003
          assert x["matched_games"]>=45
          assert 7000<=x["matched_shots"]<=10003
          assert len(x["hand_height"]["groups"])==4
          assert len(x["defender_jump"]["groups"])==4
          assert x["not_a_causal_estimate"] is True
          print("HAND_JUMP_REAL_SOURCE_OUTPUT_ACCEPTED",x["matched_games"],x["matched_shots"])
          PY
          OUT=gamepulse/fusion/qa/igp_progress_20261029/igp_raised_hand_vs_jump_all56_distance_type_adjusted_v2.json
          git config user.name "GamePulse private QA via free CPU"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add --sparse "$OUT"
          git diff --cached --check
          git commit -qm "data(gamepulse): source-verified hand/jump defense analysis 56 games"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin HEAD:refs/heads/"$BRANCH"; then
              echo PRIVATE_HAND_JUMP_56_ANALYSIS_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1
