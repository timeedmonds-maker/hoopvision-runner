name: IPPT original NBA all-event physical motion native XY PRIVATE v3 SQLite acceptance and SHA readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-ippt-all-event-source-motion-v3-private.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  private-all-event-motion-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      RESEARCH_BRANCH: research/ippt-event-snapshots-separate-20261028
      EXPECTED_CODE_SHA: 19ba14d666eb0f57ecbe975547df0166d194798a
      V2_BRANCH: data/ippt-all-pbp-native-xy-causal-36-20261028-v2
      EXPECTED_V2_SHA: dbd3e23787d5974082d794402c2d61b2c44c4b26
      V2_FILE: gamepulse/fusion/materialized/ippt_all_pbp_native_xy_causal_36_v2/nba_pbp_original_native_xy_causal.sqlite
      NEW_DATA_BRANCH: data/ippt-all-pbp-native-xy-causal-motion-36-20261028-v3
      OUTPUT_FILE: gamepulse/fusion/materialized/ippt_all_pbp_native_xy_motion_36_v3/nba_pbp_original_native_xy_motion.sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: License guard, exact research source SHA and versioned private input SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          if git ls-remote --exit-code --heads "https://github.com/$PRIVATE_REPO.git" "$NEW_DATA_BRANCH" >/dev/null 2>&1; then
            echo "PRIVATE_V3_EXISTS_REFUSE_TO_OVERWRITE"
            exit 1
          fi
          git clone -q --filter=blob:none --depth=1 --sparse -b "$RESEARCH_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-research"
          git -C "$RUNNER_TEMP/igp-research" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/igp-research" rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$V2_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private-v2"
          git -C "$RUNNER_TEMP/igp-private-v2" sparse-checkout set gamepulse/fusion/materialized/ippt_all_pbp_native_xy_causal_36_v2
          test "$(git -C "$RUNNER_TEMP/igp-private-v2" rev-parse HEAD)" = "$EXPECTED_V2_SHA"
          echo "IPPT_RESEARCH=$RUNNER_TEMP/igp-research" >> "$GITHUB_ENV"
          echo "IPPT_V2=$RUNNER_TEMP/igp-private-v2" >> "$GITHUB_ENV"
      - name: Verify immutable v2 source SHA before computing any novel motion hypothesis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=Path(os.environ["IPPT_V2"])
          p=base/os.environ["V2_FILE"]
          m=json.loads(p.with_name("source_and_causal_sqlite_manifest.json").read_text())
          assert m["counts"]=={"pbp_event":22314,"native_frame":10623,
           "original_actor":110839,"event_bundle":6336,
           "bundle_membership":14655,"bundle_causal_edge":9241}
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["v2_private_SQLite_SHA256"]
          print("IPPT_PRIVATE_V2_ORIGINAL_NBA_XY_CAUSAL_SOURCE_SHA_VERIFIED")
          PY
      - name: Source-free original motion, physics-order and private SQLite safety regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_RESEARCH"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile \
            gamepulse/fusion/igp_ippt_all_pbp_event_source_physics_candidates_2026.py \
            gamepulse/fusion/igp_ippt_all_event_native_xy_motion_overlay_sqlite_2026.py
          python3 -m unittest -v \
            gamepulse/fusion/test_igp_ippt_all_pbp_event_source_physics_candidates_2026.py \
            gamepulse/fusion/test_igp_ippt_all_event_native_xy_motion_overlay_sqlite_2026.py \
            gamepulse/fusion/test_igp_ippt_all_pbp_causal_event_bundle_2026.py
      - name: Full 36 original NBA source-backed event candidate materialization in new PRIVATE v3
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_RESEARCH"
          export PYTHONPATH=gamepulse/fusion
          python3 -u gamepulse/fusion/igp_ippt_all_event_native_xy_motion_overlay_sqlite_2026.py \
            --root . --v2 "$IPPT_V2/$V2_FILE" --out "$IPPT_RESEARCH/$OUTPUT_FILE" \
            | tee "$RUNNER_TEMP/ippt_original_motion_v3_counts.log"
          python3 - <<'PY'
          import os,sqlite3,hashlib,json
          from pathlib import Path
          p=Path(os.environ["IPPT_RESEARCH"])/os.environ["OUTPUT_FILE"]
          with sqlite3.connect(p) as db:
              d={t:db.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                 for t in ("pbp_event","native_frame","original_actor","event_bundle",
                           "bundle_membership","bundle_causal_edge",
                           "event_source_motion_hypothesis")}
              assert d=={"pbp_event":22314,"native_frame":10623,"original_actor":110839,
                "event_bundle":6336,"bundle_membership":14655,
                "bundle_causal_edge":9241,"event_source_motion_hypothesis":5893},d
              shots=db.execute("""SELECT COUNT(*) FROM event_source_motion_hypothesis
                  WHERE event_type IN ('2pt','3pt','heave')""").fetchone()[0]
              rebounds=db.execute("""SELECT COUNT(*) FROM event_source_motion_hypothesis
                  WHERE event_type='rebound'""").fetchone()[0]
              assert (shots,rebounds)==(5496,397),(shots,rebounds)
              assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM event_source_motion_hypothesis WHERE physical_event_time_video_certified=1").fetchone()[0]==0
              assert not db.execute("PRAGMA foreign_key_check").fetchall()
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          m={"schema":"IPPT_NBA_ALL_PBP_PRIVATE_SOURCE_MOTION_CAUSAL_V3",
             "source_code_SHA":os.environ["EXPECTED_CODE_SHA"],
             "private_v2_commit_SHA":os.environ["EXPECTED_V2_SHA"],
             "v3_private_SQLite_SHA256":digest,
             "counts":d,"shots_hypotheses":shots,"rebound_hypotheses":rebounds,
             "NBA_official_pbp_action_primary_keys_preserved":22314,
             "NBA_original_source_XYZ_unchanged":True,
             "video_verified_physical_event_time_count":0,
             "original_native_upstream_per_actor_interpolation_flag_unjoined":True}
          p.with_name("original_source_motion_v3_SHA_manifest.json").write_text(
                json.dumps(m,sort_keys=True,indent=2)+"\n")
          print("IPPT_PRIVATE_ALL_EVENT_V3_SOURCE_MOTION_COUNTS_VERIFIED",d)
          PY
      - name: Durable new PRIVATE Git data branch (never original binary in public Actions artifacts)
        shell: bash
        run: |
          set -euo pipefail
          cd "$IPPT_RESEARCH"
          git config user.name 'Integrated Pulse QA'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$NEW_DATA_BRANCH"
          git add "$OUTPUT_FILE" "$(dirname "$OUTPUT_FILE")/original_source_motion_v3_SHA_manifest.json"
          git commit -qm 'data(ippt): original NBA PBP 22314 source-native XY with 5893 event-specific motion hypotheses'
          git push -q origin "HEAD:refs/heads/$NEW_DATA_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/ippt_private_v3_data_commit.txt"
      - name: Fresh PRIVATE clone readback binary SHA and exact event/candidate counts
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone -q --filter=blob:none --depth=1 --sparse -b "$NEW_DATA_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private-v3-fresh"
          git -C "$RUNNER_TEMP/igp-private-v3-fresh" sparse-checkout set "$(dirname "$OUTPUT_FILE")"
          python3 - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"igp-private-v3-fresh"/os.environ["OUTPUT_FILE"]
          m=json.loads(p.with_name("original_source_motion_v3_SHA_manifest.json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["v3_private_SQLite_SHA256"]
          assert m["source_code_SHA"]==os.environ["EXPECTED_CODE_SHA"]
          with sqlite3.connect(p) as db:
            assert db.execute("SELECT COUNT(*) FROM pbp_event").fetchone()[0]==22314
            assert db.execute("SELECT COUNT(*) FROM event_source_motion_hypothesis").fetchone()[0]==5893
            assert db.execute("SELECT COUNT(*) FROM event_source_motion_hypothesis WHERE event_type='rebound'").fetchone()[0]==397
            assert db.execute("SELECT COUNT(*) FROM pbp_event WHERE physical_utc_ms IS NOT NULL").fetchone()[0]==0
          print("IPPT_PRIVATE_NBA_ORIGINAL_SOURCE_EVENT_MOTION_V3_SHA_READBACK_PASS")
          PY
      - name: Delete temporary private NBA source copies; publish aggregate-only acceptance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          pin=root/"ippt_private_v3_data_commit.txt"
          r={"github_run_id":os.environ["GITHUB_RUN_ID"],
             "prior_job_status":os.environ["QA_JOB_RESULT"],
             "private_data_branch":os.environ["NEW_DATA_BRANCH"],
             "private_data_commit_SHA":pin.read_text().strip() if pin.exists() else None,
             "source_code_SHA":os.environ["EXPECTED_CODE_SHA"],
             "original_v2_private_commit":os.environ["EXPECTED_V2_SHA"],
             "expected_total_PBP_actions":22314,
             "expected_motion_candidates":5893,
             "source_moments_video_verified":False}
          (root/"ippt_v3_safe_receipt.md").write_text(
             "All NBA original source-native XY and motion candidate coordinates reside in PRIVATE Git only. Per-event UTC is original-source evidence, NOT video-certified contact. No public NBA XYZ files.\n\n~~~json\n"+
             json.dumps(r,indent=2,sort_keys=True)+"\n~~~\n")
          PY
          rm -rf "$RUNNER_TEMP/igp-research" "$RUNNER_TEMP/igp-private-v2" "$RUNNER_TEMP/igp-private-v3-fresh"
          gh issue comment 139 --repo timeedmonds-maker/hoopvision-runner --body-file "$RUNNER_TEMP/ippt_v3_safe_receipt.md"

# Do not publish licensed original NBA ball/player XYZ in public Actions files or artifacts.
