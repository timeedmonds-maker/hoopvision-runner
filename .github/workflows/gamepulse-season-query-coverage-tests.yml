name: Integrated Pulse full-season query safety tests
# Free public CPU, synthetic-only tests. The private source and tests stay ephemeral.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-season-query-coverage-tests.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-pulse-season-query-safety
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      SOURCE_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public private content and authorization guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_104_AUTH_UNAVAILABLE'; exit 3; }
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
      - name: Execute synthetics on exact private candidate source
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/pulse-query"
          mkdir -p "$WORK/tests"
          for file in \
            gamepulse/fusion/interaction_search_2026.py \
            gamepulse/fusion/tests/test_interaction_search_2026.py; do
            base="$(basename "$file")"
            if [[ "$file" == *"/tests/"* ]]; then
              out="$WORK/tests/$base"
            else
              out="$WORK/$base"
            fi
            gh api "repos/$PRIVATE_REPO/contents/$file?ref=$SOURCE_REF" \
              --jq '.content' | base64 -d > "$out"
            test -s "$out"
          done
          python3 -m py_compile "$WORK/interaction_search_2026.py"
          PYTHONPATH="$WORK" python3 -m unittest discover -v \
            -s "$WORK/tests" -p 'test_interaction_search_2026.py'
          echo 'SOURCE_NATIVE_SEASON_QUERY_TESTS_PASSED_NO_LICENSED_OUTPUT'
