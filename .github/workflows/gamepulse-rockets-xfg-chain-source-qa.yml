name: Rockets Blueprint xFG to PBP logical-chain source QA (private only)
# Free CPU; licensed source files and full query responses remain in private 104.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-rockets-xfg-chain-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rockets-blueprint-xfg-original-chain-qa
  cancel-in-progress: false
jobs:
  private-original-xfg-chain-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public-private source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set \
            gamepulse/fusion data/extensions/nba_blueprint_2026_27/games/0022600009
          echo "PRIVATE_ROOT=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
          echo ROCKETS_XFG_PRIVATE_EPHEMERAL_SOURCE_ONLY
      - name: Verify SHA-pinned 155-event crosswalk and negative tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          python3 -m py_compile \
            gamepulse/fusion/igp_rockets_xfg_source_chain_view_2026.py \
            gamepulse/fusion/query_igp_possession_tracking_with_control_brackets_2026.py
          PYTHONPATH=gamepulse/fusion python3 -m unittest -v \
            gamepulse/fusion/tests/test_igp_rockets_xfg_source_chain_view_2026.py
          PYTHONPATH=gamepulse/fusion python3 \
            gamepulse/fusion/igp_rockets_xfg_source_chain_view_2026.py \
            --audit-full-game > "$RUNNER_TEMP/rockets-xfg-audit.json"
          python3 - "$RUNNER_TEMP/rockets-xfg-audit.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["blueprint_xfg_source_events"]==155
          assert x["chains_with_xfg"]==143
          assert x["concordant_source_field_events"]==153
          assert x["quarantined_source_field_events"]==[86,279]
          assert x["physical_shot_release_joins_certified"]==0
          assert x["independently_certified_physical_possessions"]==0
          print("ROCKETS_SOURCE_FIELD_CROSSWALK_155_QA_ACCEPTED")
          PY
      - name: Exercise canonical private possession search with both quarantined events
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          for chain in 0022600009-P1-C0026 0022600009-P2-C0073; do
            PYTHONPATH=gamepulse/fusion python3 \
              gamepulse/fusion/query_igp_possession_tracking_with_control_brackets_2026.py \
              --root . --game-id 0022600009 --chain-id "$chain" \
              > "$RUNNER_TEMP/$chain.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          for chain,action in (("0022600009-P1-C0026",86),
                               ("0022600009-P2-C0073",279)):
              doc=json.loads((root/(chain+".json")).read_text())
              field=doc["NBA_Blueprint_xFG_source_field_matches"]
              rows=[r for r in field["events"] if r["nba_action_number"]==action]
              assert len(rows)==1 and rows[0]["grade"]=="SOURCE_FIELD_CONFLICT_QUARANTINED"
              assert field["physical_shot_release_joins_certified"]==0
              assert doc["official_NBA_logical_possession"]["recorded_event_chain_not_certified_physical_custody"]
          print("ROCKETS_PRIVATE_CANONICAL_POSSESSION_QUERY_XFG_QUARANTINE_VERIFIED")
          PY
      - name: Publish aggregate QA exclusively to private research branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261027/rockets_spurs_xfg_logical_chain_source_field_join_acceptance_20261028.json
          test ! -e "$OUT"
          python3 - "$RUNNER_TEMP/rockets-xfg-audit.json" "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          x.update({
              "schema":"gamepulse.rockets-xfg-source-field-logical-chain-acceptance.v1",
              "status":"ACCEPTED_SOURCE_FIELD_ONLY_PHYSICAL_TRACKING_UNCERTIFIED",
              "full_original_gameplay_QA_certified":False,
              "all_native_player_team_IDs_resolved":False,
              "all_lineup_conflicts_resolved":False,
              "original_source_rows_mutated":False,
              "canonical_private_possession_query_tested":True,
              "original_SDK_frames_reassigned":False,
              "NBA_PBP_logged_UTC_not_verified_shot_release":True,
          })
          with open(sys.argv[2],"w") as f:
              json.dump(x,f,sort_keys=True,indent=2)
              f.write("\n")
          PY
          git config user.name 'Game Pulse Free CPU QA'
          git config user.email 'gamepulse-integrity@users.noreply.github.com'
          git add -f "$OUT"
          git diff --cached --check
          git commit -qm "qa(igp): verify 155 original Blueprint xFG source-field chain joins"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo ROCKETS_XFG_CHAIN_SOURCE_FIELD_QA_PRIVATE_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          echo PRIVATE_QA_PUSH_FAILED
          exit 13
