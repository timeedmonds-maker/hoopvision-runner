name: IGP official continuation and incremental clock target acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-oreb-clock-update-gates.yml']
permissions:
  contents: read
concurrency:
  group: igp-official-continuation-new-capture
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      OUT: gamepulse/fusion/qa/igp_progress_20261026
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public workflow and clone authorized private sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          cat > "$RUNNER_TEMP/igp-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/igp-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/igp-askpass" GIT_TERMINAL_PROMPT=0
          echo "GIT_ASKPASS=$GIT_ASKPASS" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-source"
          git -C "$RUNNER_TEMP/igp-source" sparse-checkout set gamepulse/fusion
          echo "PRIVATE_ROOT=$RUNNER_TEMP/igp-source" >> "$GITHUB_ENV"
      - name: Run regression and real NBA 36-game PBP/clock/release audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests -v \
            -p 'test_igp_pbp_clock_incremental_2026.py'
          test ! -e "$OUT/expanded_clock_targets_36.json"
          test ! -e "$OUT/nba_oreb_ft_context_36.json"
          test ! -e "$OUT/incremental_game_gate_36.json"
          python3 gamepulse/fusion/igp_clock_holdout_expanded_2026.py \
            --root . --out "$OUT/expanded_clock_targets_36.json"
          python3 gamepulse/fusion/igp_pbp_oreb_ft_continuation_audit_2026.py \
            --root . --out "$OUT/nba_oreb_ft_context_36.json"
          python3 gamepulse/fusion/igp_incremental_release_gate_2026.py \
            --root . --out "$OUT/incremental_game_gate_36.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('gamepulse/fusion/qa/igp_progress_20261026')
          x=json.loads((d/'expanded_clock_targets_36.json').read_text())
          y=json.loads((d/'nba_oreb_ft_context_36.json').read_text())
          z=json.loads((d/'incremental_game_gate_36.json').read_text())
          assert x['game_count']==y['game_count']==36
          assert y['counts']['official_actions']==22314
          assert x['counts']['candidate_native_window_target_count']==21
          assert x['counts']['pbp_only_target_count']>0
          assert z['frozen_snapshot_games']==z['current_captured_games']==36
          assert z['appended_official_games_verified']==0
          assert z['old_source_hash_drifts']==[]
          assert y['physical_possessions_certified']==x['physical_possessions_certified']==0
          print('IGP_PBP_CLOCK_INCREMENTAL_REAL_SOURCE_PASS',
            json.dumps({'nba_games':36,'official_actions':22314,
             'official_oreb':y['counts']['offensive_rebounds'],
             'free_throws':y['counts']['free_throw_actions'],
             'clock_native_window_targets':21,
             'expanded_pbp_only_clock_review_targets':x['counts']['pbp_only_target_count'],
             'frozen_source_sha_drifts':0,'new_captured_games':0,
             'certified_physical_possessions':0},sort_keys=True))
          PY
          # This proves the earlier untested raw-XYZ query wrapper end-to-end.
          python3 - <<'PY'
          from pathlib import Path
          from query_pr776_possession_first_36_2026 import search
          idx=Path("gamepulse/fusion/materialized/pr776_possession_first_36_20261026")
          result=search(idx,game_id="0022600009",
                        episode_id="0022600009-P1-NBAF0002",
                        include_original_xyz=True,private_root=Path("."),
                        max_frames=3)
          assert result['matched_episodes']==1
          assert result['original_xyz']['status']=='PRIVATE_SOURCE_SHA256_VERIFIED_NATIVE_XYZ'
          episode=result['original_xyz']['evidence']
          assert episode['original_xyz_source_hash_verified_this_query'] is True
          assert episode['candidate_native_frames']==49
          assert episode['ten_players_plus_direct_ball_frames']==43
          assert len(episode['frames'])==3
          print('IGP_REAL_ROCKETS_ORIGINAL_XYZ_WRAPPER_SHA_VERIFIED',
                '3_frames=YES','source_episode=YES','physical_certified=0')
          PY
      - name: Publish reports privately with Git
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT/expanded_clock_targets_36.json" \
                 "$OUT/nba_oreb_ft_context_36.json" "$OUT/incremental_game_gate_36.json"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -q -m "data(igp): accept 36-game official OREB FT, clock review and version gate"
          git fetch -q origin "$PRIVATE_BRANCH"
          git rebase "origin/$PRIVATE_BRANCH"
          git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
          echo IGP_NBA_OFFICIAL_CONTINUATION_PRIVATE_REPORTS_COMMITTED
