name: IGP 68 game continuous possession source readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-continuous-possession-readback.yml']
permissions: {contents: read}
concurrency:
  group: igp-68-continuous-possession-readback
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      PINNED_PRIVATE_SHA: 952d06c7783288f0f268ce6f1cf8b448d9a8745f
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin private source and validate public boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Unit and private all-68 original-source readback
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_query_igp_68_continuous_possession_scene_v1.py'
          python3 - <<'PY' > "$RUNNER_TEMP/possession-private.log" 2>&1
          import gzip,hashlib,json
          from pathlib import Path
          from query_igp_68_continuous_possession_scene_v1 import query
          root=Path('.')
          index_path=root/'gamepulse/fusion/qa/igp_progress_20261030/igp_68_official_ten_scene_possession_ab_v3.json'
          index_bytes=index_path.read_bytes();index=json.loads(index_bytes)
          assert index['evaluated_games']==68 and len(index['per_game'])==68
          receipt={'schema':'igp.68game-continuous-possession-source-readback.v1',
                   'producer_sha':'952d06c7783288f0f268ce6f1cf8b448d9a8745f',
                   'official_index_sha256':hashlib.sha256(index_bytes).hexdigest(),
                   'per_game':{}}
          for gid,entry in sorted(index['per_game'].items()):
              packed=(root/entry['path']).read_bytes()
              assert hashlib.sha256(packed).hexdigest()==entry['sha256']
              source=json.loads(gzip.decompress(packed))
              chosen=None
              for chain in source['logical_chains']:
                  interval=chain['original_logged_utc_candidate_ms']
                  if interval is None:continue
                  for wlo,whi,_,_ in source['official_paired_windows']:
                      first=max(interval[0],wlo)
                      t=((first+99)//100)*100
                      if t<=min(interval[1],whi):
                          chosen=(chain,t);break
                  if chosen:break
              if chosen is None:raise ValueError('NO_PAIRED_WINDOW_CHAIN_SAMPLE:'+gid)
              chain,t=chosen
              first=((chain['original_logged_utc_candidate_ms'][0]+99)//100)*100
              result=query(root,gid,chain['chain_id'],offset=(t-first)//100,limit=1)
              if len(result['rows'])!=1:raise ValueError('QUERY_PAGE_NOT_ONE:'+gid)
              row=result['rows'][0]
              if (row['utc_ms']!=t or not row['official_paired_window'] or
                      result['native_manifest_sha256']!=entry['native_source_manifest_sha256'] or
                      result['physical_possessions_certified']!=0):
                  raise ValueError('SOURCE_QUERY_DRIFT:'+gid)
              receipt['per_game'][gid]={
                  'native_manifest_sha256':entry['native_source_manifest_sha256'],
                  'official_sidecar_sha256':entry['sha256'],
                  'chain_id':chain['chain_id'],'sample_utc_ms':t,
                  'has_direct_source_xyz':bool(row['original_source_xyz_native']),
                  'complete_ten_ball_candidate':row.get('complete_ten_and_ball',False),
                  'chain_assignment_grade':row['chain_assignment_grade']}
          if len(receipt['per_game'])!=68:raise ValueError('NOT_ALL68_SOURCE_READBACK')
          out=root/'gamepulse/fusion/qa/igp_progress_20261030/igp_68_continuous_possession_query_real_qa_v1.json'
          content=json.dumps(receipt,sort_keys=True,indent=2)+'\n'
          if out.exists() and out.read_text()!=content:raise ValueError('REFUSE_RECEIPT_REWRITE')
          out.write_text(content)
          print('IGP68_POSSESSION_SOURCE_READBACK_OK',len(receipt['per_game']))
          PY
          test -f gamepulse/fusion/qa/igp_progress_20261030/igp_68_continuous_possession_query_real_qa_v1.json || {
            echo IGP68_POSSESSION_SOURCE_READBACK_FAILED_PRIVATE_DIAGNOSTIC
            exit 31
          }
          echo IGP68_POSSESSION_SOURCE_READBACK_68_PRIVATE_OK
      - name: Commit private-only immutable receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          cp gamepulse/fusion/qa/igp_progress_20261030/igp_68_continuous_possession_query_real_qa_v1.json "$RUNNER_TEMP/possession-receipt.json"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B readback "origin/$BRANCH"
          cp "$RUNNER_TEMP/possession-receipt.json" gamepulse/fusion/qa/igp_progress_20261030/igp_68_continuous_possession_query_real_qa_v1.json
          git add -f gamepulse/fusion/qa/igp_progress_20261030/igp_68_continuous_possession_query_real_qa_v1.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): verify 68 continuous logical possession source readbacks'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP68_POSSESSION_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 32
