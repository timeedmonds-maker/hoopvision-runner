name: Validate Identity Calibration Evaluator

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-identity-calibration-evaluator.yml']

permissions:
  contents: read

env:
  CANDIDATE_SHA: c8abdc751499a324693f287116f77840b6f915c6

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build synthetic independent labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/out
          cat > work/review.csv <<'CSV'
          physical_path_id,team,review_state,view_index,pts_s,image_file,human_number_label,human_readability,human_notes
          P00,HOU,CANDIDATE,1,1.000,p00a.jpg,00,clear,
          P00,HOU,CANDIDATE,2,2.000,p00b.jpg,00,blurred_readable,
          P0,HOU,CANDIDATE,1,1.200,p0a.jpg,0,clear,
          P0,HOU,CANDIDATE,2,2.200,p0b.jpg,0,partial_readable,
          PU,HOU,CONFLICTED,1,3.000,pu.jpg,,unreadable,
          CSV
          cat > work/mapping.csv <<'CSV'
          physical_path_id,pts_s,crop_reference,best_ios,medium_number,small_number,medium_score,small_score,cross_model_exact
          P00,1.000,c1,1.0,00,00,0.99,0.98,True
          P00,2.000,c2,1.0,00,00,0.97,0.96,True
          P0,1.200,c3,1.0,00,0,0.95,0.94,False
          P0,2.200,c4,1.0,0,0,0.93,0.92,True
          PU,3.000,c5,1.0,17,17,0.99,0.99,True
          CSV
          cat > work/consensus.csv <<'CSV'
          physical_path_id,identity_state,candidate_number,roster_state
          P00,CANDIDATE,00,UNIQUE_ROSTER_CANDIDATE
          P0,CANDIDATE,0,UNIQUE_ROSTER_CANDIDATE
          PU,CONFLICTED,17,UNIQUE_ROSTER_CANDIDATE
          CSV
      - name: Evaluate and assert semantics
        shell: bash
        run: |
          set -euo pipefail
          python src/tools/evaluate_identity_review_labels.py             --review-manifest work/review.csv             --hidden-crop-mapping work/mapping.csv             --path-consensus work/consensus.csv             --out-dir work/out             --reviewer-type independent-human             --reviewer-id synthetic-test
          python - <<'PY'
          import csv,json
          s=json.load(open('work/out/identity_calibration_summary.json'))
          assert s['review_rows']==5
          assert s['unreadable_or_unknown_views']==1
          assert s['paths_with_accepted_human_reference']==2
          assert s['automatic_candidate_paths']==2
          assert s['automatic_candidate_paths_correct']==2
          # Medium must treat 00 and 0 as distinct: one of the P0 reads is wrong.
          assert s['medium']['readable_views']==4
          assert s['medium']['exact_correct']==3
          assert abs(s['medium']['exact_accuracy']-.75)<1e-12
          assert s['small']['exact_correct']==4
          rows=list(csv.DictReader(open('work/out/path_identity_evaluation.csv')))
          refs={r['physical_path_id']:r['reference_number'] for r in rows}
          assert refs['P00']=='00'
          assert refs['P0']=='0'
          assert refs['P00']!=refs['P0']
          print('HOOPVISION_IDENTITY_CALIBRATION_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hoopvision-identity-calibration-evaluator-validation
          path: work/out/
          retention-days: 14
