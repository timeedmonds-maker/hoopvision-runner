name: IGP P4 independent NBA Broadcast Detroit possession dense PTS visual sampling
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p4-detroit-dense-broadcast-frames.yml']
permissions: {contents: read}
concurrency:
  group: igp-p4-detroit-original-broadcast-dense
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: fd69853ecd9b9527535cf14c8ec4daa44367fed5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public confidentiality and SHA-private original NBA Broadcast source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Source-free tests, private video release SHA and original Broadcast contact sheet
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_fusion_v31_p4_independent_broadcast_dense_frames_v1.py'
          if ! python3 gamepulse/fusion/igp_fusion_v31_p4_independent_broadcast_dense_frames_v1.py --output "$RUNNER_TEMP/dense-broadcast-private.json" > "$RUNNER_TEMP/dense-broadcast-private.log" 2>&1; then
            echo IGP_P4_ORIGINAL_BROADCAST_DENSE_DECODE_FAILED
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'dense-broadcast-private.log').read_text(errors='replace').splitlines()
          last=next((z for z in reversed(lines) if z.strip()),'NO_LOG')
          print('IGP_P4_PRIVATE_DECODE_ERROR',re.sub(r'[^A-Za-z_]','_',last)[:90])
          PY
            exit 41
          fi
          python3 - <<'PY'
          import hashlib,base64,json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'dense-broadcast-private.json').read_text())
          assert j['sampled_frames']==16 and len(j['private_frames_sha_and_pts'])==16
          assert j['original_NBA_Broadcast_video_playback_not_SDK_animation']
          assert j['independent_video_to_SDK_UTC_alignments_verified']==0
          assert j['independent_3D_ball_court_positions_certified']==0
          assert j['independent_physical_possessions_certified']==0
          assert hashlib.sha256(base64.b64decode(j['private_contact_sheet_jpg_base64'])).hexdigest()==j['contact_sheet_sha256']
          print('IGP_P4_PRIVATE_REAL_BROADCAST_DECODE',json.dumps({
             'sampled_frames':16,'distinct_original_video_frame_sha':
               len(set(x['frame_jpeg_sha256'] for x in j['private_frames_sha_and_pts'])),
             'original_video_SHA_verified':True,'video_to_SDK_UTC_certified':False,
             'new_physical_possession_certifications':0},sort_keys=True))
          PY
      - name: Preserve contact sheet and decoded individual frame SHAs only in private QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_progress_20261030/igp_fusion_v31_p4_independent_dense_broadcast_frames_v1.json
          git fetch -q origin "$BRANCH"
          git checkout -q -B p4-dense-broadcast "origin/$BRANCH"
          cp "$RUNNER_TEMP/dense-broadcast-private.json" "$dest"
          git add -f "$dest"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): independently decoded original NBA Broadcast 16 dense Detroit possession edge frames private-only'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P4_PRIVATE_BROADCAST_DENSE_QA_SAVED
              exit 0
            fi
            sleep "$i"
          done
          exit 42
