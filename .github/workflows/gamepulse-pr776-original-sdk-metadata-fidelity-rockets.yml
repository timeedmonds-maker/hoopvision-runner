name: PR776 original 13-part SDK metadata coordinate-fidelity evidence Rockets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-original-sdk-metadata-fidelity-rockets.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-original-sdk-metadata-fidelity-rockets
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      GID: '0022600009'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source boundary and clone private source read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH"             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Validate source-free metadata field and integrity checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_original_sdk_metadata_fidelity_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests             -p 'test_igp_original_sdk_metadata_fidelity_2026.py' -v
      - name: Retrieve exact preexisting 13 private original SDK source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-sdk"
          gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GID" > "$RUNNER_TEMP/release.json"
          gh release download "gamepulse-sdk-$GID" -R "$PRIVATE_REPO"             --pattern 'sdk-part-*.tar.gz' --dir "$RUNNER_TEMP/original-sdk"
          test "$(find "$RUNNER_TEMP/original-sdk" -maxdepth 1 -name 'sdk-part-*.tar.gz' | wc -l)" -eq 13
          echo "PRIVATE_13_ARCHIVE_PARTS_AVAILABLE"
      - name: Audit actual source keyframes, interpolation and feed counters
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_original_sdk_metadata_fidelity_0022600009_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_original_sdk_metadata_fidelity_2026.py             --game-id "$GID" --archive-dir "$RUNNER_TEMP/original-sdk"             --release-json "$RUNNER_TEMP/release.json"             --index "gamepulse/fusion/materialized/igp_all_original_xyz/$GID/index.json"             --out "$OUT" > "$RUNNER_TEMP/private-metadata.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j["game_id"]=="0022600009"
          assert j["sha_verified_original_release"]
          assert len(j["source_parts_sha256"])==13
          assert j["native_timestamps_unique"]==34979
          assert j["raw_original_position_keyframes"]==69582
          assert j["raw_source_positions_not_exported"]
          print("PR776_SDK_METADATA_FIDELITY",json.dumps({
             "native_timestamps":j["native_timestamps_unique"],
             "raw_keyframes":j["raw_original_position_keyframes"],
             "event_fields":j["fields"]["event"],
             "metadata_fields":j["fields"]["metadata"],
             "keyframe_fields":j["fields"]["keyframe"],
             "interpolated_flag_counts":j["keyframe_interpolated_flag_counts"],
             "feed_line":j["trackingFeedLineCount"],
             "feed_messages":j["trackingFeedMessageCount"],
             "same_UTC_variants":j["same_UTC_more_than_one_distinct_position_variant"]
          },sort_keys=True))
          PY
      - name: Store aggregate metadata QA in private PR branch only
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_original_sdk_metadata_fidelity_0022600009_v1.json
          git config user.name "Game Pulse Free CPU SDK QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): verify true original SDK metadata vs player XYZ for Rockets"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo "PR776_PRIVATE_ORIGINAL_SDK_METADATA_QA_PUBLISHED"
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
