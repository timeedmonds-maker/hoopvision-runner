name: PR776 G2 NBA original substitution-side G1 player ball 36-game query acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-G2-nba-substitution-side-query-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-G2-NBA-sub-side-query-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public source guard and original authenticated private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "IGP_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
      - name: Synthetic original NBA source query and substitution-side source disagreement grading
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_g2_official_nba_substitution_side_query_2026.py gamepulse/fusion/igp_g2_nba_substitution_side_query_acceptance_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests \
            -p 'test_igp_g2_official_nba_substitution_side_query_2026.py' -v
      - name: Real SHA-pinned source G1+G2 player and ball native UTC readbacks in 36 games
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          export PYTHONPATH=gamepulse/fusion
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_substitution_side_G1_original_xyz_query_36_v1.json
          test ! -e "$OUT"
          python3 gamepulse/fusion/igp_g2_nba_substitution_side_query_acceptance_2026.py \
             --root . --out "$OUT" > "$RUNNER_TEMP/private-G2-NBA-sub-query.log"
          python3 - "$OUT" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          k=j["counts"]
          assert j["source_games"]==36
          assert k["games_with_original_native_G1_G2_sub_readbacks"]==36
          assert k["DIRECT_TEN"]>0
          assert k["DISPUTED"]>0
          assert j["accepted_NBA_spatial_original_XYZ_preserved"]
          assert j["source_expected_G1_SHA_provenance_attached"]
          assert j["substitution_side_NBA_PBP_roster_conflicts_grade_not_overridden"]
          assert j["gold_strict_and_long_g2_unchanged"]
          assert not j["source_NBA_physical_possession_custody_certified"]
          print("G2_NBA_SUBSTITUTION_SIDE_SOURCE_NATIVE_QUERY_G1_ALL36_SHA_ACCEPTED",json.dumps(k,sort_keys=True))
          PY
      - name: Commit original NBA private source G2 readback evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$IGP_ROOT"
          OUT=gamepulse/fusion/qa/igp_progress_20261028/igp_G2_NBA_substitution_side_G1_original_xyz_query_36_v1.json
          git config user.name "Game Pulse NBA G2 Private QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$OUT"
          test "$(git diff --cached --name-only)" = "$OUT"
          git diff --cached --check
          git commit -qm "qa(gamepulse): 36 source-verified original NBA substitution-side XYZ/G1 lineup grades"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo PRIVATE_NBA_G2_SUB_SIDE_QUERY_ACCEPTANCE_PUBLISHED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 13
