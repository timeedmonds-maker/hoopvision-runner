# Four-game source-controlled same-mask method comparison, licensed originals private.
name: IGP P2 source masked C0 B linear fourgame comparison
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2-fourgame-masked-method-comparison-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p2-method-ab-original-source
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: a1e161f14b9d6a951b625c75cf30137f2bbcc8bc
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard reviewed source and pin original NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test same original source-mask evaluation and compare methods
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p2_masked_method_comparison_v1.py'
          python3 gamepulse/fusion/igp_68_p2_masked_method_comparison_v1.py \
            --root . --output "$RUNNER_TEMP/igp68-p2-methods-private.json" \
            > "$RUNNER_TEMP/igp68-p2-methods.log" 2>&1 || {
              echo IGP68_P2_PRIVATE_MASKED_METHOD_QA_FAILED
              tail -n 8 "$RUNNER_TEMP/igp68-p2-methods.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp68-p2-methods-private.json').read_bytes())
          assert len(q['per_game'])==4 and q['mask_radius_ms']==1200
          assert q['same_samples_across_all_methods'] and q['original_source_unchanged']
          assert set(q['methods'])=={'c0_velocity','b_shape','a_linear'}
          assert all(v['source_direct_truth_sample_centers']>=30 for v in q['per_game'].values())
          print('IGP68_P2_SAME_MASKED_SOURCE_COMPARISON',json.dumps({
            'pooled_masked_error_ft':q['pooled_masked_error_ft'],
            'holdouts_by_game':{gid:v['source_direct_truth_sample_centers'] for gid,v in q['per_game'].items()}
          },sort_keys=True))
          PY
      - name: Save original source masked model comparison as private QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p2_fourgame_masked_method_comparison_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p2-methods "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp68-p2-methods-private.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original source masked C0 B linear model accuracy comparison'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP68_P2_SOURCE_MASKED_METHOD_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
