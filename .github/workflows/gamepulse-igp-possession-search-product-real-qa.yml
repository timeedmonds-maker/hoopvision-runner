name: "IGP native possession search product source QA"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-possession-search-product-real-qa.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-native-possession-search-product
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Safe checkout accepted private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Discover accepted G4 partition format without logging licensed XYZ
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          from pathlib import Path
          import gzip,json
          base=Path("gamepulse/fusion")
          for gid in ("0022600009","0022600109"):
            path=base/"materialized/igp_g4_original_native_player_ball_possession_v1"/(gid+".json.gz")
            if not path.exists():
              print("SAFE_G4_PARTITION_ABSENT",gid)
              continue
            data=json.loads(gzip.decompress(path.read_bytes()))
            def info(k):
              d=data[k]
              return {"field":k,"type":type(d).__name__,"length":len(d) if hasattr(d,"__len__") else None,
                  "field_keys":list(d[0])[:28] if isinstance(d,list) and d and isinstance(d[0],dict)
                      else list(d)[:28] if isinstance(d,dict) else []}
            print("SAFE_G4_PRIVATE_SCHEMA",gid,"top",type(data).__name__,
                  "keys",list(data)[:35] if isinstance(data,dict) else [],
                  "shapes",[info(k) for k in data if isinstance(data,dict)][:15])
          for path in (base/"materialized/igp_g4_original_native_player_ball_possession_v1").glob("*"):
            if path.is_file() and path.suffix==".py":
              print("SAFE_G4_HELPER_FILENAME",path.name)
          print("SAFE_FUSION_G4_MODULES",sorted(x.name for x in base.glob("*g4*.py"))[:40])
          print("SAFE_FUSION_POSSESSION_QUERY_MODULES",sorted(x.name for x in base.glob("*possession*query*.py"))[:40])
          PY

      - name: Test unified possession, shot, and source-native API source-free
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp_source_first_possession_product_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_source_first_possession_product_v1.py'
      - name: Exercise four real private original NBA sources, G4 chain and official shot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          import json
          from pathlib import Path
          from query_igp_source_first_possession_product_v1 import query
          from query_igp_g4_native_actor_possession_2026 import load_index
          from igp_tracking_pilot_run_2026 import BASE
          root=Path(".")
          reports={}
          for gid in ("0022600009","0022600109"):
            b,_=load_index(root,gid)
            pairs=[(cid,z) for cid,z in b["nba_canonical_logical_chains"].items()
                    if z["native_logged_frame_ordinals"] and any(type(a) is int and a>0
                         for a in z["official_action_ids"])]
            assert pairs,("NO_PAGED_NATIVE_G4_CHAINS",gid)
            cid,z=pairs[0]
            q=query(root,gid,chain_id=cid,limit=2,action_limit=1,
                    include_original_xyz=True,include_g3_derived=True)
            native=q["native"]
            assert q["native_PBP_join_route"]=="G4_NATIVE_PBP_LOGICAL_CHAIN_INDEX"
            assert native["matched_source_frames"]>0
            assert native["returned_frames"]
            assert q["official_actions_with_source_shot_features"]
            assert not q["physical_possession_custody_certified"]
            assert q["original_XYZ_and_shot_source_not_rewritten"]
            reports[gid]={"route":q["native_PBP_join_route"],"native_frames":native["matched_source_frames"],
              "original_xyz_hydrated":bool(native["returned_frames"][0].get("source_players")),
              "action_page_count":len(q["official_actions_with_source_shot_features"]),
              "source_grade":native["returned_frames"][0]["official_NBA_roster_time_grade"],
              "physical_certified":False}
          for gid in ("0022600129","0022600131"):
            if gid=="0022600131":
              ix=root/BASE/"materialized/igp_all_original_xyz_0131_eight_part"/gid/"index.json"
            else:
              ix=root/BASE/"materialized/igp_all_original_xyz"/gid/"index.json"
            m=json.loads(ix.read_text())
            start=m["chunks"][0]["first_source_frame_utc_ms"]
            q=query(root,gid,start=start,end=start+1000,limit=2,
                    include_original_xyz=True,include_g3_derived=False)
            native=q["native"]
            assert q["native_PBP_join_route"]=="SOURCE_ONLY_NO_ACCEPTED_G4_CHAIN_INDEX"
            assert native["matched_original_source_frames"]>=1
            assert native["source_sha_verified_chunks_touched"]>=1
            assert all(r["NBA_logical_chain_id"] is None for r in native["returned_frames"])
            assert not q["physical_possession_custody_certified"]
            reports[gid]={"route":q["native_PBP_join_route"],
              "source_frames_in_verified_UTC_page":native["matched_original_source_frames"],
              "source_chunks_sha_verified":native["source_sha_verified_chunks_touched"],
              "no_fabricated_chain":True,"physical_certified":False}
          result={"schema":"igp.source-first-possession-product-real-data-4game-qa.v1",
              "game_count_scope":"FOUR_PROBES_NOT_SEASON_MEMBERSHIP",
              "source_count_not_used_as_live_database_cardinality":True,
              "games":reports,"current_database_52_game_identity_manifest_not_yet_reconciled":True,
              "source_immutable":True,"physical_possessions_certified":0,
              "historical_NBA_2000_01_onward_unmodified":True}
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_source_first_possession_product_4game_real_qa_v1.json")
          if p.exists():raise FileExistsError("REFUSE_OVERWRITE_ACCEPTED_PRODUCT_QA")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print("IGP_NATIVE_POSSESSION_PRODUCT_REAL_SOURCE_QA",json.dumps(result,sort_keys=True))
          PY
      - name: Commit private accepted product evidence only (no original XYZ)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_source_first_possession_product_4game_real_qa_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): four real NBA games native possession product and direct post36 source readback"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_FOUR_REAL_GAME_NATIVE_POSSESSION_PRODUCT_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
