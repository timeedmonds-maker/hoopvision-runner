name: Public NBA gravity Rockets first-game snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-nba-gravity-onegame.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-nba-gravity-rockets-onegame
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Capture public NBA official Gravity season rows when Houston GP equals one
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, time, urllib.parse, urllib.request
          from pathlib import Path
          params=urllib.parse.urlencode({"LeagueID":"00","Season":"2026-27","SeasonType":"Regular Season"})
          urls=[f"https://stats.gleague.nba.com/stats/gravityleaders?{params}",
                f"https://stats.nba.com/stats/gravityleaders?{params}"]
          headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
                   "Origin":"https://www.nba.com","Referer":"https://www.nba.com/",
                   "Accept":"application/json","Accept-Language":"en-US,en;q=0.9"}
          errors=[]
          for url in urls:
              for attempt in range(2):
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=22) as response:
                          raw=response.read(3000000)
                      source=json.loads(raw)
                      rows=source.get("leaders",[])
                      if source.get("params",{}).get("seasonYear")!="2026-27" or not isinstance(rows,list) or len(rows)<50:
                          raise ValueError("wrong season, too few leaders or changed schema")
                      hou=[r for r in rows if r.get("TEAMABBREVIATION")=="HOU"]
                      if not hou: raise ValueError("2026-27 Rockets not yet published in NBA official qualified feed")
                      if any(int(r.get("GAMESPLAYED",0))!=1 for r in hou):
                          raise ValueError("Rockets qualified players are not all GP=1; unable to isolate first game")
                      cats=["ONBALLPERIMETER","OFFBALLPERIMETER","ONBALLINTERIOR","OFFBALLINTERIOR"]
                      for r in hou:
                          assert int(r["FRAMES"])==sum(int(r[p+"FRAMES"]) for p in cats),r.get("PLAYERID")
                      names=set()
                      for r in hou:
                          assert r["PLAYERID"] not in names
                          names.add(r["PLAYERID"])
                      hou.sort(key=lambda r:float(r["AVGGRAVITYSCORE"]),reverse=True)
                      output={"schema":"public-nba-official-qualified-rocket-game1.v1",
                              "source_url":url,"source_sha256":hashlib.sha256(raw).hexdigest(),
                              "fetched_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                              "season":"2026-27","team":"HOU","game_id":"0022600091",
                              "game_date_us":"2026-10-21",
                              "qualification":"NBA source-qualified players, not necessarily all game participants",
                              "game_attribution":"single-game attribution only because all Houston qualified rows show GP=1",
                              "source_player_count":len(rows),"houston_qualified_players":len(hou),
                              "leaders":hou}
                      dest=Path("public_nba_gravity_rockets_game1_2026_27.json")
                      dest.write_text(json.dumps(output,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
                      print("NBA_GRAVITY_CAPTURE_OK qualified_hou="+str(len(hou))+" source_players="+str(len(rows)))
                      raise SystemExit(0)
                  except Exception as e:
                      errors.append(url.split("/")[2]+":"+type(e).__name__+":"+str(e)[:150])
                      time.sleep(1)
          raise SystemExit("NBA_GRAVITY_CAPTURE_UNAVAILABLE "+str(errors))
          PY
      - name: Commit public-source NBA Gravity Rockets data only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_nba_gravity_rockets_game1_2026_27.json
          git diff --cached --quiet && exit 0
          git commit -m 'Capture official public-source Rockets one-game Gravity'
          git pull --rebase origin main
          git push origin HEAD:main
