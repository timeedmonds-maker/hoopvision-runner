# Research only. Private NBA source, four games, original source contiguous masks.
name: IGP P2 original masked uncertainty abstention frontier
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2-original-mask-uncertainty-frontier-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p2-mask-confidence-frontier
  cancel-in-progress: false
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: b38167a98939d9ccd6c042fdd959b12c02d070ae
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard reviewed code and exact private SDK source pin
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test and evaluate fixed original source confidence gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p2_uncertainty_abstention_pilot_v1.py'
          python3 gamepulse/fusion/igp_68_p2_uncertainty_abstention_pilot_v1.py \
            --root . --output "$RUNNER_TEMP/igp68-p2-uncertainty.json" \
            > "$RUNNER_TEMP/igp68-p2-uncertainty-private.log" 2>&1 || {
              echo P2_PRIVATE_SOURCE_ABSTENTION_QA_FAILED
              tail -n 10 "$RUNNER_TEMP/igp68-p2-uncertainty-private.log" | sed -e 's/\\[[0-9]*, [0-9]*, [0-9]*\\]/[REDACTED_XYZ]/g'
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp68-p2-uncertainty.json').read_bytes())
          assert len(q['by_game'])==4 and q['mask_radius_ms']==1200
          assert q['original_source_unchanged'] and q['model_promotion'] is False
          assert set(q['pooled_source_mask_holdout'])=={'player','ball'}
          assert all(x['heldout_direct_source_frame_centers']==64 for x in q['by_game'].values())
          print('P2_SOURCE_MASK_CONFIDENCE_FRONTIER',json.dumps({
            k:{name:v[name] for name in ['all_c0','disagree_le_1','disagree_le_2','joint_d1_speed4','joint_d2_speed6']}
            for k,v in q['pooled_source_mask_holdout'].items()},sort_keys=True))
          PY
      - name: Commit source-only candidate confidence QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p2_original_mask_uncertainty_frontier_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p2-uncertainty "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp68-p2-uncertainty.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): original SDK source-masked P2 uncertainty and abstention frontier'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_P2_MASKED_CONFIDENCE_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
