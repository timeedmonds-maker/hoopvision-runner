name: One-off sanitize public history
# final-cycle: archive-aware post-sanitize audit installed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-sanitize-history.yml'

permissions:
  contents: write
  actions: write

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Replace reachable history with one sanitized root
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export FILTER_BRANCH_SQUELCH_WARNING=1
          NOREPLY='257485652+timeedmonds-maker@users.noreply.github.com'
          SAFE=/tmp/hoopvision-public-safe
          rm -rf "$SAFE"
          mkdir -p "$SAFE/.github/workflows" "$SAFE/tools" "$SAFE/tests"

          cp README.md PUBLIC_CONTENT_POLICY.md runner_policy.json "$SAFE/"
          cp tools/public_bridge_preflight.py tools/wait_for_consumer_receipt.py tools/public_content_guard.py "$SAFE/tools/"
          cp tests/test_consumer_receipt_waiter.py tests/test_public_bridge_preflight.py tests/test_public_content_guard.py "$SAFE/tests/"
          cp .github/workflows/*.yml "$SAFE/.github/workflows/"

          python - <<'PY'
          import json,secrets,pathlib
          root=pathlib.Path('/tmp/hoopvision-public-safe')
          rid='req-'+secrets.token_hex(16)
          docs={
            'bridge_consumer_heartbeat.json':{
              'schema':'hoopvision.public-consumer-heartbeat.v1',
              'consumer_contract':'public_outbox_private_pull.v1',
              'status':'READY',
              'observed_at_utc':'2099-01-01T00:00:00Z'
            },
            'bridge_consumer_receipt.json':{
              'schema':'hoopvision.public-consumer-receipt.v2',
              'request_id':rid,
              'status':'NO_ACTIVE_REQUEST',
              'observed_at_utc':None
            },
            'bridge_execution_status.json':{
              'schema':'hoopvision.public-execution-status.v2',
              'request_id':rid,
              'status':'IDLE',
              'result_available':False,
              'observed_at_utc':None
            },
            'bridge_result_summary.json':{
              'schema':'hoopvision.public-result-summary.v3',
              'request_id':rid,
              'status':'IDLE',
              'result_available':False,
              'observed_at_utc':None
            },
          }
          for name,doc in docs.items():
              (root/name).write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          PY

          rm -rf /tmp/hoopvision-sanitized-repo
          mkdir /tmp/hoopvision-sanitized-repo
          cd /tmp/hoopvision-sanitized-repo
          git init -b main
          git config user.name 'timeedmonds-maker'
          git config user.email "$NOREPLY"
          git config author.name 'timeedmonds-maker'
          git config author.email "$NOREPLY"
          git config committer.name 'timeedmonds-maker'
          git config committer.email "$NOREPLY"
          cp -a "$SAFE/." .
          git add -A
          GIT_AUTHOR_NAME='timeedmonds-maker' GIT_AUTHOR_EMAIL="$NOREPLY" \
          GIT_COMMITTER_NAME='timeedmonds-maker' GIT_COMMITTER_EMAIL="$NOREPLY" \
            git commit -m 'Sanitized public runner root'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main:main

          mapfile -t old_branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}' | grep -v '^main$' || true)
          for b in "${old_branches[@]}"; do
            [ -n "$b" ] && git push origin --delete "$b"
          done

          mapfile -t old_tags < <(git ls-remote --tags origin | awk '{sub("refs/tags/","",$2); sub("\\^\\{\\}$","",$2); print $2}' | sort -u)
          for t in "${old_tags[@]}"; do
            [ -n "$t" ] && git push origin --delete "refs/tags/$t"
          done

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id' > /tmp/run_ids
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "${GITHUB_RUN_ID}" ] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || true
          done < /tmp/run_ids

          echo "SANITIZED_ROOT_SHA=$(git rev-parse HEAD)"
