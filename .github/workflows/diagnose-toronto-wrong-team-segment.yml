name: Diagnose Toronto Wrong-Team Segment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-toronto-wrong-team-segment.yml'
      - 'scripts/diag_wrong_team_segment.py'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  ZONE: asia-northeast1-b
  INSTANCE: hv-dev-l4-tokyo
  RUN_ID: public-36090818352-1-00313acb5936
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Copy diagnostic
        run: gcloud compute scp scripts/diag_wrong_team_segment.py "$INSTANCE:/tmp/diag_wrong_team_segment.py" --zone "$ZONE" --project "$PROJECT_ID" --quiet
      - name: Inspect segment 16
        run: gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT_ID" --quiet --command="sudo python3 /tmp/diag_wrong_team_segment.py /srv/hoopvision/runs/$RUN_ID/artifacts"
