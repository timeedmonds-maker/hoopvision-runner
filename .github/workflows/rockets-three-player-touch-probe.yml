name: Rockets Durant VanVleet Sengun source-touch probe
# Diagnose raw Game Pulse positions object structure for independent touch geometry.
# Scan nested native lastTouch shape, fail closed on missing source provenance.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rockets-three-player-touch-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rockets-triple-touch-audit
  cancel-in-progress: false
jobs:
  inspect-original-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict public runner content and private source permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_AUTH_UNAVAILABLE'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch trusted private schema inspector and immutable SDK part
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rockets-touch"
          mkdir -p "$ROOT"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/inspect_sdk_ball_handler.py?ref=main' --jq .content |
            base64 -d > "$ROOT/inspect_sdk_ball_handler.py"
          python3 -m py_compile "$ROOT/inspect_sdk_ball_handler.py"
          gh api repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-0022600091 > "$ROOT/release.json"
          gh release download gamepulse-sdk-0022600091 --repo timeedmonds-maker/104 \
            --pattern 'sdk-part-00.tar.gz' --dir "$ROOT" --clobber >/dev/null
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'rockets-touch'
          record=json.loads((r/'release.json').read_text())
          matching=[x for x in record['assets'] if x['name']=='sdk-part-00.tar.gz']
          assert len(matching)==1 and matching[0].get('digest','').startswith('sha256:'),'SDK_SHA_NOT_PRESENT'
          assert 'sha256:'+hashlib.sha256((r/'sdk-part-00.tar.gz').read_bytes()).hexdigest()==matching[0]['digest'],'SDK_SHA_MISMATCH'
          print('PRIVATE_ORIGINAL_SDK_PART_SHA_VERIFIED')
          PY
          python3 "$ROOT/inspect_sdk_ball_handler.py" "$ROOT/sdk-part-00.tar.gz" \
            --out "$ROOT/schema.json" --limit-frames 100000
      - name: Publish source-field inventory into private canonical repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'rockets-touch'
          data=(root/'schema.json').read_bytes()
          obj=json.loads(data)
          assert obj['schema']=='gamepulse.original-sdk-handler-field-inspection.v1'
          assert obj['counts']['sdk_events']>0
          repo='timeedmonds-maker/104'
          path='gamepulse/fusion/rockets_triple_sdk_schema_2026.json'
          target='repos/'+repo+'/contents/'+path
          old=subprocess.run(['gh','api',target],text=True,capture_output=True)
          payload={'branch':'main','message':'audit(gamepulse): inspect original Rockets SDK ball handler schema without publishing raw data',
                   'content':base64.b64encode(data).decode()}
          if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
          elif '404' not in old.stderr and 'Not Found' not in old.stderr:
              raise RuntimeError('PRIVATE_TARGET_LOOKUP_FAILED')
          p=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],input=json.dumps(payload),text=True,capture_output=True)
          if p.returncode:raise RuntimeError('PRIVATE_SCHEMA_REPORT_UPLOAD_FAILED')
          found=subprocess.check_output(['gh','api',target,'--jq','.content'])
          assert hashlib.sha256(base64.b64decode(found)).digest()==hashlib.sha256(data).digest()
          print('ROCKETS_PRIVATE_SDK_SCHEMA_SHA_VERIFIED',
                'candidate_fields',sum(map(len,obj['candidate_fields'].values())),
                'sdk_events',obj['counts']['sdk_events'])
          PY
      - name: No licensed raw data in public outputs
        if: always()
        run: echo 'Only source-field inventory and QA are stored in private 104; no raw frames, tokens, player locations or media.' >> "$GITHUB_STEP_SUMMARY"
