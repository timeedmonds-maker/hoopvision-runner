name: Run Current Toronto Regression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-current-toronto-regression.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  RELEASE_BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  EVIDENCE_BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  DEV_TOPIC: hv-dev-jobs
  SESSION_ID: hv-dev-l4
  CANDIDATE_SHA: 6ac9fad67411f074e2c3062370964986e9929aea
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  toronto:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.HOOPVISION_104_READ_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install lightweight regression dependencies
        run: python -m pip install -q --disable-pip-version-check numpy pandas pytest
      - name: Enforce governing delivery policy
        run: |
          set -euo pipefail
          python src/tools/validate_governing_delivery_policy.py
          python -m py_compile src/screen_tracker_nextgen/build_kickout_semantic_anchors.py src/screen_tracker_nextgen/global_identity_solver.py
          grep -F "safe=bool(positive_identity" src/screen_tracker_nextgen/global_identity_solver.py
          grep -F "'positive_identity_evidence':positive_identity" src/screen_tracker_nextgen/global_identity_solver.py
          grep -F "collision_anchor_never_authorizes_ambiguous_render" src/screen_tracker_nextgen/build_kickout_semantic_anchors.py
          echo HOOPVISION_COLLISION_ANCHOR_RENDER_SAFETY_OK
          python - <<'PY'
          import runpy
          ns=runpy.run_path('src/hoopvision/tests/test_semantic_anchor_detector_taxonomy.py')
          ns['test_semantic_anchor_rfdetr_taxonomy_matches_raw11_checkpoint']()
          print('HOOPVISION_SEMANTIC_ANCHOR_TAXONOMY_OK')
          PY
          PYTHONPATH=src python - <<'PY'
          import runpy
          ns=runpy.run_path('src/hoopvision/tests/test_global_identity_mixed_uniform_abstention.py')
          ns['test_mixed_uniform_segments_abstain_from_both_team_solvers']()
          print('HOOPVISION_MIXED_UNIFORM_ABSTENTION_OK')
          PY
          python - <<'PY'
          import runpy
          ns=runpy.run_path('src/hoopvision/tests/test_semantic_defender_soft_team.py')
          ns['test_defender_anchor_uses_uniform_colour_as_soft_evidence_not_veto']()
          ns['test_main_records_soft_colour_invariant']()
          print('HOOPVISION_DEFENDER_SOFT_TEAM_POLICY_OK')
          PY
          python src/screen_tracker_nextgen/test_global_identity_solver.py
          PYTHONPATH=src:src/screen_tracker_nextgen python -m pytest -q \
            src/screen_tracker_nextgen/test_global_identity_solver.py \
            src/hoopvision/tests/test_global_identity_mixed_uniform_abstention.py \
            src/hoopvision/tests/test_semantic_defender_soft_team.py
          echo HOOPVISION_POSITIVE_IDENTITY_RENDER_GATE_OK
      - name: Build deterministic application snapshot
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/app/hoopvision
          cp -a src/screen_tracker_nextgen dist/app/
          cp -a src/screen_tracker_kickout3 dist/app/
          cp -a src/tools dist/app/
          cp -a src/hoopvision/core dist/app/hoopvision/
          cp -a src/hoopvision/config dist/app/hoopvision/
          mkdir -p dist/app/release
          cp src/release/pipeline.lock.json dist/app/release/pipeline.lock.json
          cp src/release/runtime.lock.json dist/app/release/runtime.lock.json
          printf '%s\n' '"""HoopVision application package."""' > dist/app/hoopvision/__init__.py
          cp src/hoopvision/worker/boot.py dist/app/boot.py
          cp src/hoopvision/worker/run_toronto_nextgen.py dist/app/run_toronto_nextgen.py
          cp src/hoopvision/worker/run_fresh_hawks_all_player.py dist/app/run_fresh_hawks_all_player.py
          cp src/hoopvision/worker/run_fresh_hawks_identity_replay.py dist/app/run_fresh_hawks_identity_replay.py
          cp src/hoopvision/worker/run_fresh_hawks_fast_path.py dist/app/run_fresh_hawks_fast_path.py
          cp src/hoopvision/worker/run_hawks_event296_all_player.py dist/app/run_hawks_event296_all_player.py
          cp src/hoopvision/worker/run_pelicans_season_roster.py dist/app/run_pelicans_season_roster.py
          cp src/hoopvision/worker/interactive_service.py dist/app/interactive_service.py
          find dist/app -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist/app -type f -name '*.pyc' -delete
          PYTHONPATH=src python src/tools/release/package_app.py --git-sha "$CANDIDATE_SHA" --app-dir dist/app --out dist/release
          PYTHONPATH=src python src/tools/release/package_app.py --git-sha "$CANDIDATE_SHA" --app-dir dist/app --out dist/release-repeat
          cmp dist/release/app.tar.gz dist/release-repeat/app.tar.gz
          cmp dist/release/inventory.json dist/release-repeat/inventory.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install control-plane clients
        run: python -m pip install -q --disable-pip-version-check --no-cache-dir google-cloud-storage==3.4.0 google-cloud-pubsub==2.31.1
      - name: Publish exact candidate and dispatch Toronto
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HOOPVISION_RELEASE_BUCKET: ${{ env.RELEASE_BUCKET }}
          HOOPVISION_EVIDENCE_BUCKET: ${{ env.EVIDENCE_BUCKET }}
          HOOPVISION_DEV_TOPIC: ${{ env.DEV_TOPIC }}
          HOOPVISION_PIPELINE_LOCK: src/release/pipeline.lock.json
        run: |
          set -euo pipefail
          RUN_ID="public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CANDIDATE_SHA:0:12}"
          echo "HOOPVISION_DEV_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          PYTHONPATH=src python src/tools/release/submit_dev.py             --release-dir dist/release             --session "$SESSION_ID"             --run-id "$RUN_ID"             --benchmark toronto-nextgen
          echo "HOOPVISION_TORONTO_DISPATCHED=$RUN_ID"
      - name: Observe durable Toronto result
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HOOPVISION_EVIDENCE_BUCKET: ${{ env.EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python src/tools/release/watch_run.py --run-id "$HOOPVISION_DEV_RUN_ID" --timeout 1200 | tee toronto_watch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoopvision-current-toronto-regression
          path: toronto_watch.log
          retention-days: 30
