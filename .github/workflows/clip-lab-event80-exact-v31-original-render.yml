name: Clip Lab event80 exact original frozen v3.1 rings
# Public CPU workflow invokes original private frozen renderer; no private engine
# source, native Game Pulse frame coordinates, or private credentials are published.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clip-lab-event80-exact-v31-original-render.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-lab-event80-exact-v31-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard and private source access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/clip-lab-event80-exact-v31-original-render.yml'])
          print('PUBLIC_PRIVATE_SOURCE_BOUNDARY_PASS')
          PY
          test -n "$GH_TOKEN"
      - name: Download pinned original CourtCoder v3.1 ring engine and manual preview feet
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v31"
          mkdir -p "$ROOT"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_TERMINAL_PROMPT=0
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone -q \
            --depth 1 --filter=blob:none --sparse --branch courtcoder/integration \
            https://github.com/timeedmonds-maker/104.git "$ROOT/locked"
          git -C "$ROOT/locked" -c "http.extraheader=AUTHORIZATION: basic $AUTH" sparse-checkout set \
            tools hoopvision/core hoopvision/freeview screen_tracker_nextgen >/dev/null
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone -q \
            --depth 1 --filter=blob:none --sparse --branch main \
            https://github.com/timeedmonds-maker/104.git "$ROOT/canonical"
          git -C "$ROOT/canonical" -c "http.extraheader=AUTHORIZATION: basic $AUTH" sparse-checkout set gamepulse/clip_lab >/dev/null
          unset AUTH
          python3 -m py_compile "$ROOT/canonical/gamepulse/clip_lab/launch_frozen_ring_only.py" \
            "$ROOT/locked/screen_tracker_nextgen/render_all_player_labels.py"
          echo PRIVATE_FROZEN_ENGINE_AND_PREVIEW_ANCHORS_PRESENT
      - name: Obtain clean official NBA Broadcast rather than old annotated footage
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v31"
          python3 -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84 \
            pandas==2.2.3 scipy pillow requests
          PYTHONPATH="$ROOT/locked" python3 - "$ROOT" <<'PY'
          import sys,subprocess,hashlib
          from pathlib import Path
          from hoopvision.freeview.fetch_official_multicam import resolve_options,download_hls,probe
          root=Path(sys.argv[1])
          opts=resolve_options('0022600009',80)
          if 'Broadcast' not in opts:
              raise RuntimeError('original NBA Broadcast angle is unavailable')
          src=root/'clean-broadcast.mp4'
          download_hls(opts['Broadcast'],src)
          info=probe(src)
          assert info['width']==960 and info['height']==540 and info['fps']>=29
          assert 18<float(info['duration_s'])<24
          print('ORIGINAL_BROADCAST_OBTAINED',info,'sha256',hashlib.sha256(src.read_bytes()).hexdigest())
          PY
      - name: Render exact locked v3.1 annular rings on human-verified visual shoes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v31"
          python3 - "$ROOT" <<'PY'
          import csv,sys,hashlib
          from pathlib import Path
          root=Path(sys.argv[1])
          locked=root/'locked/tools/locked_broadcast_screen_v5_rings.py'
          b=locked.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob=='9fac8a8915b90bbd9bd1235532c297c35da77ca2', 'LOCKED_RING_ART_CHANGED'
          source=root/'canonical/gamepulse/clip_lab/fixtures/event80_manual_preview_anchors_20261025.csv'
          rows=list(csv.DictReader(source.open()))
          assert len(rows)==271 and int(rows[0]['frame'])==0 and int(rows[-1]['frame'])==270
          fields=['time_s','team','player_id','player_name','x1','y1','x2','y2',
                  'physical_path_id','physical_component_id','source_track_id',
                  'safe','clip_global_authorized','ring_authorized',
                  'floor_anchor_x','floor_anchor_y']
          dst=root/'frozen-exact-assignments.csv'
          with dst.open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
            for v in rows:
              t=float(v['time_s'])
              for pid,name,xkey,ykey in [(203500,'Steven Adams','adams_x','adams_y'),
                                          (1627832,'Fred VanVleet','fred_x','fred_y')]:
                x,y=float(v[xkey]),float(v[ykey])
                # Display bbox is only a lower-body depth proxy. Foot is
                # separately controlled by the independently reviewed anchor.
                # Keep median body height below locked scale reference 129.6 px
                # to retain canonical Broadcast size, exactly as in frozen v3.1.
                bw=52 if pid==203500 else 44
                bh=100 if pid==203500 else 93
                w.writerow(dict(time_s=t,team='HOU',player_id=pid,player_name=name,
                  x1=x-bw/2,y1=y-bh,x2=x+bw/2,y2=y,
                  physical_path_id=f'manual-foot:{pid}',physical_component_id=f'manual-foot:{pid}',
                  source_track_id=f'manual-foot:{pid}',safe=True,clip_global_authorized=True,
                  ring_authorized=True,floor_anchor_x=x,floor_anchor_y=y))
          print('FROZEN_SOURCE_GIT_BLOB_VERIFIED',blob)
          print('MANUAL_VISUAL_FEET_ONLY',len(rows),'source_native_not_screen_projected')
          PY
          PYTHONPATH="$ROOT/locked:$ROOT/locked/tools" python3 \
            "$ROOT/canonical/gamepulse/clip_lab/launch_frozen_ring_only.py" \
            "$ROOT/locked/screen_tracker_nextgen/render_all_player_labels.py" \
            --source "$ROOT/clean-broadcast.mp4" \
            --assignments "$ROOT/frozen-exact-assignments.csv" \
            --paths "$ROOT/frozen-exact-assignments.csv" \
            --occlusion-tracks "$ROOT/frozen-exact-assignments.csv" \
            --start-s 0 --end-s 9.0 \
            --max-interp-gap .30 --hold-s .14 \
            --ring-max-interp-gap .30 --ring-hold-s .14 \
            --frame-ledger "$ROOT/frozen-v31-ledger.csv" \
            --out "$ROOT/event80-exact-frozen-v31-fred-adams.mp4" \
            > "$ROOT/render.log" 2>&1 \
            || { tail -80 "$ROOT/render.log";exit 6; }
          tail -12 "$ROOT/render.log"
      - name: Validate every ring frame and create QA preview
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v31"
          python3 - "$ROOT" <<'PY'
          import csv,sys,json,subprocess
          from pathlib import Path
          root=Path(sys.argv[1])
          video=root/'event80-exact-frozen-v31-fred-adams.mp4'
          out=subprocess.check_output(['ffprobe','-v','error','-show_streams',
              '-select_streams','v:0','-of','json',str(video)],text=True)
          stream=json.loads(out)['streams'][0]
          assert stream['width']==960 and stream['height']==540 and stream['codec_name']=='h264'
          n=int(stream['nb_frames'])
          ledger=list(csv.DictReader((root/'frozen-v31-ledger.csv').open()))
          for pid in ('1627832','203500'):
            ok={int(float(x['output_frame'])) for x in ledger
                if x['player_id']==pid and x['ring_rendered']=='True'}
            print('ORIGINAL_FROZEN_RING_COVERAGE',pid,len(ok),n,round(len(ok)/n,4))
            assert len(ok)/n>=0.995 and 0 in ok and n-1 in ok
          print('EXACT_ORIGINAL_FROZEN_V31_ALL_FRAMES_QA_PASS')
          PY
          mkdir -p "$ROOT/qa"
          for T in 0 2 4 6 8; do
            ffmpeg -y -v error -ss "$T" -i "$ROOT/event80-exact-frozen-v31-fred-adams.mp4" \
              -frames:v 1 "$ROOT/qa/t${T}.jpg"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: clip-lab-event80-exact-frozen-v31-two-rings-mp4
          path: |
            ${{ runner.temp }}/v31/event80-exact-frozen-v31-fred-adams.mp4
            ${{ runner.temp }}/v31/qa/*.jpg
          if-no-files-found: ignore
          retention-days: 2
