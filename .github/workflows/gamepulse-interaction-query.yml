name: Game Pulse private source-native player interaction search
# Free public CPU. All player, possession and search results remain in private 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-interaction-query.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public/private boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch private search function, synthetic tests and exact video index
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/interaction-query"
          mkdir -p "$ROOT"/{tests,games}
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/interaction_search_2026.py?ref=main' --jq .content |
            base64 -d > "$ROOT/interaction_search_2026.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_interaction_search_2026.py?ref=main' --jq .content |
            base64 -d > "$ROOT/tests/test_interaction_search_2026.py"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/0022600091.json?ref=main' --jq .content |
            base64 -d > "$ROOT/games/0022600091.json"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/video/index.json?ref=main' --jq .content |
            base64 -d > "$ROOT/videos.json"
          PYTHONPATH="$ROOT" python3 -m unittest discover -v -s "$ROOT/tests" -p test_interaction_search_2026.py
      - name: Execute exact Rockets three-player source-native query from private index
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/interaction-query"
          python3 "$ROOT/interaction_search_2026.py" --index-dir "$ROOT/games" \
            --game 0022600091 --team HOU --all-touched 201142,1627832,1630578 \
            --clips-index "$ROOT/videos.json" --expect-games 1 \
            --out "$ROOT/rockets-three-native-source-touches.json"
      - name: Save source-linked search result solely in private core with SHA-256 confirmation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'interaction-query'
          data=(root/'rockets-three-native-source-touches.json').read_bytes()
          item=json.loads(data)
          assert item['schema']=='gamepulse.interaction-multigame-query.v1'
          assert item['games_count']==1 and item['certified_ppp'] is None
          assert item['all_touched_player_ids']==['201142','1627832','1630578']
          target='repos/timeedmonds-maker/104/contents/gamepulse/fusion/queries/rockets_durant_vanvleet_sengun_2026.json'
          old=subprocess.run(['gh','api',target],capture_output=True,text=True)
          payload={'branch':'main','message':'data(gamepulse): Rockets 3-player native-touch source-joined possession candidate query',
                   'content':base64.b64encode(data).decode()}
          if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
          elif 'Not Found' not in old.stderr and '404' not in old.stderr:
              raise RuntimeError('PRIVATE_QUERY_READ_FAILED')
          result=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],
                                input=json.dumps(payload),capture_output=True,text=True)
          if result.returncode:raise RuntimeError('PRIVATE_QUERY_WRITE_FAILED')
          actual=base64.b64decode(subprocess.check_output(['gh','api',target,'--jq','.content']))
          assert hashlib.sha256(data).digest()==hashlib.sha256(actual).digest()
          print('PRIVATE_NATIVE_THREE_PLAYER_QUERY_STORED_SHA_VERIFIED')
          PY
