# Licensed original NBA player XYZ stays in private 104 and private runner.
# Public logs print only safe cross-game aggregate histograms.
name: IGP 71game 10Hz incomplete 10 player and ball census
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-v32-71-incomplete-scene-census.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-v32-71-incomplete-scene-census
  cancel-in-progress: false
jobs:
  original71-incomplete-actor-ball-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Replay exact previously certified 71game source engine and count incomplete actor slots
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_default_incomplete_scene_census_v1.py
          python3 gamepulse/fusion/igp_v32_p2b_default_incomplete_scene_census_v1.py \
            --root . --out "$RUNNER_TEMP/igp-71-incomplete-actor-ball-private.json" \
            > "$RUNNER_TEMP/igp-71-incomplete-actor-ball-private.log" 2>&1 || {
              echo IGP_71_INCOMPLETE_SCENE_CENSUS_REJECTED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          ss=(Path(os.environ["RUNNER_TEMP"])/"igp-71-incomplete-actor-ball-private.log").read_text(errors="replace").splitlines()
          line=next((s for s in reversed(ss) if re.match(
              r"^(?:AssertionError|ValueError|KeyError|TypeError|FileNotFoundError|ImportError|RuntimeError):",s)),None)
          print("REDACTED_CENSUS_ERROR",re.sub(r"[0-9]{4,}","[ID]",line or "UNKNOWN")[:155])
          PY
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp-71-incomplete-actor-ball-private.json").read_bytes())
          c=q["counts"]
          assert q["incomplete_scenes"]==144579
          assert q["new_default_complete_scenes"]==1015072
          assert len(q["by_game"])==71
          assert sum(c[f"missing_players_{n}"] for n in range(11))==144579
          assert c["ball_present"]+c["ball_missing"]==144579
          assert sum(c[f"missing_{n}_ball_{b}"] for n in range(11) for b in ("present","missing"))==144579
          print("IGP_71_FULL10HZ_REMAINDER_SOURCE_QA",json.dumps({
            "s1_10hz":q["frozen_71_s1_10hz_samples"],
            "complete":q["new_default_complete_scenes"],
            "incomplete":q["incomplete_scenes"],
            "counts":c,
            "largest_incomplete_game_counts":sorted([
               {"id":g,"incomplete":v["counts"]["incomplete"]}
               for g,v in q["by_game"].items()],key=lambda x:-x["incomplete"])[:8],
            "no_new_physical_certification":True},sort_keys=True))
          PY
      - name: Preserve immutable aggregate QA privately in canonical source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_default_remaining_10hz_71game_census_v1.json
          test ! -e "$dest"
          cp "$RUNNER_TEMP/igp-71-incomplete-actor-ball-private.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -q -m 'qa(igp): enumerate all71 remaining incomplete actor slots and ball at 10Hz'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo IGP_71_INCOMPLETE_CENSUS_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
