name: PR776 source-first all-36 original-native tracking eligibility and gap atlas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-pr776-source-first-atlas-36.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr776-source-first-atlas-36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public-only source policy and hydrate private original tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH"             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/igp-private"
          git -C "$RUNNER_TEMP/igp-private" sparse-checkout set gamepulse/fusion
          echo "SOURCE_ROOT=$RUNNER_TEMP/igp-private" >> "$GITHUB_ENV"
          echo "SOURCE_FIRST_PRIVATE_CHECKOUT_READY"
      - name: Syntax and source-free source-first conservation regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile             gamepulse/fusion/igp_tracking_original_natural_gap_atlas_2026.py             gamepulse/fusion/igp_tracking_source_first_native_eligibility_atlas_2026.py
          python3 -m unittest discover -s gamepulse/fusion/tests             -p 'test_igp_tracking_original_natural_gap_atlas_2026.py' -v
          python3 -m unittest discover -s gamepulse/fusion/tests             -p 'test_igp_tracking_source_first_native_eligibility_atlas_2026.py' -v
          echo "SOURCE_FIRST_REGRESSION_TESTS_PASS"
      - name: Count original real direct player gaps and eligibility of every timestamp
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          export PYTHONPATH=gamepulse/fusion
          GAPS=gamepulse/fusion/qa/igp_progress_20261028/igp_natural_source_player_gaps_36_v2_repaired_invariants.json
          ATLAS=gamepulse/fusion/qa/igp_progress_20261028/igp_source_first_all_native_eligibility_36_v1.json
          test ! -e "$GAPS"
          test ! -e "$ATLAS"
          python3 gamepulse/fusion/igp_tracking_original_natural_gap_atlas_2026.py             --root . --out "$GAPS" > "$RUNNER_TEMP/private-gaps.log"
          python3 gamepulse/fusion/igp_tracking_source_first_native_eligibility_atlas_2026.py             --root . --out "$ATLAS" > "$RUNNER_TEMP/private-atlas.log"
          python3 - "$GAPS" "$ATLAS" <<'PY'
          import json,sys
          n=json.load(open(sys.argv[1]))
          a=json.load(open(sys.argv[2]))
          assert n["games_evaluated"]==36 and a["source_games"]==36
          x=n["aggregate_counts"]; y=a["counts"]
          assert x["original_source_timestamps"]==1203986
          assert y["native_frames"]==1203986
          assert y["strict_frames"]==x["strict_source_timestamps"]==412619
          assert y["outside_strict_frames"]==791367
          assert y["strict_missing_player_slots"]==x["strict_missing_player_slots"]==369806
          assert y["strict_direct_player_slots"]==x["strict_direct_player_slots"]==3756384
          assert x["source_pairs_gt_5sec"]==976
          assert sum(a["primary"].values())==1203986
          assert a["accepted_strict_source_unchanged"] and not a["outside_strict_proposals_verified"]
          print("PR776_SOURCE_FIRST_NATIVE_COUNTS",json.dumps({
              "games":36,"source_frames":y["native_frames"],
              "strict":y["strict_frames"],"outside":y["outside_strict_frames"],
              "direct_strict_player_slots":y["strict_direct_player_slots"],
              "missing_strict_direct_player_slots":y["strict_missing_player_slots"],
              "natural_gt_5s":x["source_pairs_gt_5sec"],
              "primary":a["primary"]},sort_keys=True))
          PY
      - name: Publish ONLY private aggregate evidence, preserve original source
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          GAPS=gamepulse/fusion/qa/igp_progress_20261028/igp_natural_source_player_gaps_36_v2_repaired_invariants.json
          ATLAS=gamepulse/fusion/qa/igp_progress_20261028/igp_source_first_all_native_eligibility_36_v1.json
          git config user.name "Game Pulse Free CPU Source QA"
          git config user.email "gamepulse-integrity@users.noreply.github.com"
          git add -f "$GAPS" "$ATLAS"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -qm "qa(gamepulse): re-certify natural gaps and classify all 36-game native frames"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo "PR776_SOURCE_FIRST_ALL_36_PRIVATE_QA_PUBLISHED"
              exit 0
            fi
            sleep "$attempt"
          done
          echo "PR776_SOURCE_FIRST_QA_PUSH_FAILED" >&2
          exit 13
