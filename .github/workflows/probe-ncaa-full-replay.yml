name: Probe NCAA Full Replay Media
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-ncaa-full-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe NCAA official full replay embed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,html
          urls=[
            'https://www.ncaa.com/embed/video/basketball-men%3A2024-03-16%3Atrine-vs-hampden-sydney-2024-ncaa-diii-mens-basketball-championship-full-replay',
            'https://www.ncaa.com/embed/video/basketball-men/2013-03-02/mbk-simonfraser-westernwashington-full-replay',
          ]
          H={'User-Agent':'Mozilla/5.0','Referer':'https://www.ncaa.com/'}
          for i,url in enumerate(urls):
            txt=urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=30).read().decode('utf-8','ignore')
            open(f'ncaa_{i}.html','w').write(txt)
            print('URL',url,'BYTES',len(txt),'M3U8',txt.lower().count('.m3u8'),'MP4',txt.lower().count('.mp4'))
            for pat in [r'https?[^"\\ ]+?\.m3u8[^"\\< ]*',r'https?[^"\\ ]+?\.mp4[^"\\< ]*']:
              for x in re.findall(pat,txt,re.I)[:20]: print(html.unescape(x)[:1500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ncaa-full-replay-probe
          path: ncaa_*.html
          retention-days: 2
