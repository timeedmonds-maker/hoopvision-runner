name: "IGP natural 5s source actor ID alias audit all36"
on:
  push:
    branches: [main]
    paths: [".github/workflows/gamepulse-igp-natural-5s-source-alias-audit.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-native-five-second-original-extra-ID
  cancel-in-progress: false
jobs:
  source-alias-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Native original actor-keys hypotheses tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_natural_5s_extra_actor_source_alias_36_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion \
            -p 'test_igp_natural_5s_extra_actor_source_alias_36_v1.py'
      - name: Audit two games then all36 original natural-source gaps
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_natural_5s_extra_actor_source_alias_36_v1.py --root . \
            --games 0022600009 0022600092 \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_native_natural_5s_extra_alias_pilot2_v1.json
          python3 gamepulse/fusion/igp_natural_5s_extra_actor_source_alias_36_v1.py --root . \
            --out gamepulse/fusion/qa/igp_progress_20261029/igp_native_natural_5s_extra_alias_36_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261029/igp_native_natural_5s_extra_alias_36_v1.json")
          q=json.loads(p.read_bytes())
          assert q["games_evaluated"]==36 and len(q["games"])==36
          assert q["original_player_XYZ_are_immutable"]
          assert q["unverified_extra_actor_ID_is_not_a_certified_player_alias"]
          assert q["candidate_proximity_only_is_not_independent_physical_identity"]
          assert q["counts"]["natural_player_gaps_gt_5s"]>=500
          assert q["physical_possessions_certified"]==0
          print("IGP_SHA_ORIGINAL_NATIVE_36_NATURAL_GAP_SOURCE_ALIAS_QA_PASS",json.dumps({
            "games":36,"gt5s_natural_source_gaps":q["counts"]["natural_player_gaps_gt_5s"],
            "dense_source_gaps":q["counts"]["gaps_with_dense_intervening_native_frames"],
            "extra_original_actor_present":q["counts"]["dense_gaps_with_any_extra_actor"],
            "plausible_extra_actor_track_candidates":q["counts"]["dense_gaps_with_source_extra_actor_plausible_alias"],
            "original_player_ids_automatically_reassigned":0},sort_keys=True))
          PY
      - name: Commit source-only QA without any original licensed coordinates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gamepulse/fusion/qa/igp_progress_20261029/igp_native_natural_5s_extra_alias_pilot2_v1.json \
            gamepulse/fusion/qa/igp_progress_20261029/igp_native_natural_5s_extra_alias_36_v1.json
          git diff --cached --check
          git commit -q -m "qa(igp): original natural 5s gaps extra source player ID candidate census all36"
          for try in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP_ORIGINAL_36_NATURAL_GAP_ID_HYPOTHESES_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$try"
          done
          exit 23
