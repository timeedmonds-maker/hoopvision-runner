name: IGP v3.1 71-game source-graded analytics QA
# Reviewed public guard allowlist, frozen-source private-only metric validation
on:
  push:
    paths:
      - .github/workflows/gamepulse-igp-v31-71-integration-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-v31-71-sourcegrade-integration-20261031
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard
        run: python3 tools/public_content_guard.py
      - name: Run private research tests and commit aggregate QA
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/season_to_date
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -v \
            gamepulse.fusion.tests.test_igp_halfcourt_touch_query_v1 \
            gamepulse.fusion.tests.test_igp_crash_the_glass_v1 \
            gamepulse.fusion.tests.test_igp_fusion_fifth_player_v1 \
            gamepulse.fusion.tests.test_igp_v31_71_metric_equivalents_v1
          mkdir -p gamepulse/fusion/qa/igp_progress_20261031
          python3 gamepulse/fusion/igp_v31_71_metric_equivalents_v1.py \
            --root . --output gamepulse/fusion/qa/igp_progress_20261031/igp_v31_71_metric_equivalents_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gamepulse/fusion/qa/igp_progress_20261031/igp_v31_71_metric_equivalents_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP_71_METRIC_QA_ALREADY_CURRENT
            exit 0
          fi
          git commit -q -m 'qa(igp): source-backed 71-game v3.1 metric equivalents'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo IGP_71_PRIVATE_AGGREGATE_QA_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 27
