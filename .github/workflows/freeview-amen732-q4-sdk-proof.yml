name: Amen 732 private Q4 original SDK proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-q4-sdk-proof.yml','tools/public_content_guard.py']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private source verification and targeted Q4 extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          D="$RUNNER_TEMP/amen732"
          mkdir -p "$D/sdk" "$D/clock"
          gh repo clone timeedmonds-maker/104 "$D/clock" -- --depth=1 --branch research/gamepulse-clock-boundary-integrity-20261025 --filter=blob:none
          gh api repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-0022600009 > "$D/release.json"
          gh release download gamepulse-sdk-0022600009 -R timeedmonds-maker/104 --pattern 'sdk-part-*.tar.gz' --dir "$D/sdk"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/amen732_extract_q4_source_window.py?ref=research/amen-wemby-freeze-spin-20261024' --jq .content | base64 -d > "$D/extract.py"
          gh api 'repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/amen732_contact_bracket_qa.json?ref=research/amen-wemby-freeze-spin-20261024' --jq .content | base64 -d > "$D/fixture.json"
          export PYTHONPATH="$D/clock/gamepulse/fusion"
          python3 "$D/extract.py" --selftest
          python3 "$D/extract.py" --archive "$D/sdk" --release "$D/release.json" --fixture "$D/fixture.json" --out "$D/out.json"
          # The original source fixture may already exist. Never overwrite differing
          # native observations; only create a missing fixture or verify byte parity.
          python3 - "$D/out.json" <<'PY'
          import base64, hashlib, json, subprocess, sys

          endpoint = ("repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/"
                      "amen732_original_SDK_Q4_direct_XYZ_20261026.json")
          branch = "research/amen-wemby-freeze-spin-20261024"
          blob = open(sys.argv[1], "rb").read()
          def fetch():
              return subprocess.run(["gh", "api", f"{endpoint}?ref={branch}"],
                                    capture_output=True, text=True)
          current = fetch()
          if current.returncode == 0:
              data = json.loads(current.stdout)
              if data.get("type") != "file" or data.get("encoding") != "base64":
                  raise SystemExit("AMEN_Q4_EXISTING_FIXTURE_UNREADABLE")
              old = base64.b64decode(data["content"])
              if old != blob:
                  print("AMEN_Q4_SOURCE_CONFLICT_NO_OVERWRITE",
                        "existing_sha256=" + hashlib.sha256(old).hexdigest(),
                        "recomputed_sha256=" + hashlib.sha256(blob).hexdigest())
                  raise SystemExit(1)
              print("AMEN_Q4_EXISTING_SOURCE_BYTES_VERIFIED", hashlib.sha256(blob).hexdigest())
          elif "HTTP 404" in current.stderr:
              payload = {
                  "branch": branch,
                  "message": "data(freeview): source-SHA-verified original SDK Amen block Q4 position window",
                  "content": base64.b64encode(blob).decode(),
              }
              created = subprocess.run(["gh", "api", "-X", "PUT", endpoint, "--input", "-"],
                                       input=json.dumps(payload), capture_output=True, text=True)
              if created.returncode:
                  raise SystemExit("AMEN_Q4_SOURCE_CREATE_FAILED: " + created.stderr)
              readback = fetch()
              if readback.returncode:
                  raise SystemExit("AMEN_Q4_SOURCE_READBACK_FAILED: " + readback.stderr)
              verified = base64.b64decode(json.loads(readback.stdout)["content"])
              if verified != blob:
                  raise SystemExit("AMEN_Q4_SOURCE_READBACK_MISMATCH")
              print("AMEN_Q4_NEW_SOURCE_BYTES_VERIFIED", hashlib.sha256(blob).hexdigest())
          else:
              raise SystemExit("AMEN_Q4_SOURCE_LOOKUP_FAILED: " + current.stderr)
          PY
          echo AMEN732_Q4_PRIVATE_SDK_XYZ_PRESERVED
