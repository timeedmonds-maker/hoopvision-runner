name: Amen732 private original synced sixview visual review readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/freeview-amen732-private-synced-panel-review-readback.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/public_content_guard.py
      - name: Verify private 104 original six-view UHD source panels
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          TAG=freeview-amen732-sixview-original-synchronized-panels-20261028
          gh release download "$TAG" --repo timeedmonds-maker/104 \
            --dir "$ROOT" \
            --pattern amen732-sixview-synchronized-candidate-3840x2160.jpg \
            --pattern amen732-sixview-previous-unsynced-3840x2160.jpg \
            --pattern amen732-sixview-native-exact-frame-package-v2.json
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/receipt.json"
          python3 - "$ROOT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);r=json.load(open(root/'receipt.json'))
          a={x["name"]:x for x in r["assets"]}
          for name in ("amen732-sixview-synchronized-candidate-3840x2160.jpg",
                       "amen732-sixview-previous-unsynced-3840x2160.jpg",
                       "amen732-sixview-native-exact-frame-package-v2.json"):
              assert a[name]["digest"]=="sha256:"+hashlib.sha256((root/name).read_bytes()).hexdigest()
          q=json.load(open(root/'amen732-sixview-native-exact-frame-package-v2.json'))
          assert q['original_source_video_count']==6 and q['camera_pairs_matched']==15
          assert q['cycle_residual_max_ms']<40 and not q['same_exposure_certified']
          print('PRIVATE_SIXVIEW_REAL_SOURCE_IMAGE_SHA_READBACK_PASS',len(q['before_after']))
          PY
          python3 -m pip install -q --disable-pip-version-check Pillow
          for kind in synchronized-candidate previous-unsynced; do
            python3 - "$ROOT/amen732-sixview-$kind-3840x2160.jpg" "$ROOT/$kind-small.jpg" "$ROOT/$kind-put.json" <<'PY'
          from PIL import Image
          import json,base64,sys
          with Image.open(sys.argv[1]) as im:
              im.resize((1600,900),Image.Resampling.LANCZOS).save(sys.argv[2],quality=79)
          b=open(sys.argv[2],'rb').read()
          assert 10000<len(b)<1000000,len(b)
          open(sys.argv[3],'w').write(json.dumps({
              'branch':'research/amen-wemby-freeze-spin-20261024',
              'message':'data(freeview): original six NBA camera synchronized image visual QA readback',
              'content':base64.b64encode(b).decode()}))
          PY
            if [ "$kind" = synchronized-candidate ]; then TARGET=amen732_audio_aligned_sixview_review_20261028.jpg
            else TARGET=amen732_prior_unsynced_sixview_review_20261028.jpg; fi
            API="repos/timeedmonds-maker/104/contents/hoopvision/freeview/fixtures/$TARGET"
            CURRENT="$(gh api "$API?ref=research/amen-wemby-freeze-spin-20261024" --jq .sha 2>/dev/null || true)"
            if [ -n "$CURRENT" ]; then
              python3 - "$ROOT/$kind-put.json" "$CURRENT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]));d['sha']=sys.argv[2]
          open(sys.argv[1],'w').write(json.dumps(d))
          PY
            fi
            gh api --method PUT "$API" --input "$ROOT/$kind-put.json" >/dev/null
            echo SIXVIEW_NATIVE_QA_PREVIEW_STORED_PRIVATE "$kind"
          done
