name: Export Toronto Identity Debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-toronto-identity-debug.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
  PREFIX: gs://project-d88c48c6-7f48-4c33-928-hoopvision-dev/runs/toronto-nextgen/manual-b7e13fa6968c

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Download identity evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/global_identity debug/nextgen_mask debug/identity_ocr
          gcloud storage cp "$PREFIX/global_identity/resolved_config.json" debug/global_identity/
          gcloud storage cp "$PREFIX/global_identity/global_identity_qa.json" debug/global_identity/
          gcloud storage cp "$PREFIX/global_identity/identity_assignments.csv" debug/global_identity/
          gcloud storage cp "$PREFIX/nextgen_mask/tracks.csv" debug/nextgen_mask/
          gcloud storage cp "$PREFIX/nextgen_mask/qa.json" debug/nextgen_mask/
          gcloud storage cp "$PREFIX/semantic_anchors.json" debug/
          gcloud storage cp "$PREFIX/semantic_anchors.associations.csv" debug/
          gcloud storage cp "$PREFIX/identity_ocr/track_identity.csv" debug/identity_ocr/
          gcloud storage cp "$PREFIX/identity_ocr/ocr_evidence.json" debug/identity_ocr/
          gcloud storage cp "$PREFIX/identity_ocr/qa.json" debug/identity_ocr/
          gcloud storage cp "$PREFIX/exact_lineup_roster.json" debug/
          gcloud storage cp "$PREFIX/latency_qa.json" debug/
          find debug -type f -maxdepth 3 -print
      - uses: actions/upload-artifact@v4
        with:
          name: toronto-identity-debug
          path: debug
          retention-days: 7
