name: List Hawks Dunk Angles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/list-hawks-angles.yml'
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-24.04
    steps:
      - name: List official camera feeds
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          url='https://clips.nba.com/?gameNo=0012500014&eventNum=301&source=grs'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://clips.nba.com/'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=20) as r:
            txt=r.read().decode('utf-8','ignore')
          title=re.search(r'<title[^>]*>(.*?)</title>',txt,re.I|re.S)
          print('TITLE',html.unescape(title.group(1)).strip())
          for i,m in enumerate(re.finditer(r'<option\s+value="([^"]+)"([^>]*)>(.*?)</option>',txt,re.I|re.S)):
            u=html.unescape(m.group(1).strip()); attrs=m.group(2); label=re.sub(r'<[^>]+>','',html.unescape(m.group(3))).strip()
            if '.m3u8' not in u: continue
            am=re.search(r'data-angle="([^"]+)"',attrs,re.I)
            print('ANGLE',i,label,'SLUG',am.group(1) if am else '')
          PY
