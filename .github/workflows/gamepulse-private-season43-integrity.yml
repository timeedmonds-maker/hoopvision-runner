name: Game Pulse private season source-index SHA acceptance
# Public free CPU; all original NBA/Game Pulse data and the resulting report remain private.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gamepulse-private-season43-integrity.yml
      - tools/gamepulse_private_43_integrity_acceptance.py
  pull_request:
    paths:
      - .github/workflows/gamepulse-private-season43-integrity.yml
      - tools/gamepulse_private_43_integrity_acceptance.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamepulse-private-season43-source-integrity
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public confidentiality and synthetic source-set logic
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/gamepulse_private_43_integrity_acceptance.py
          python3 tools/gamepulse_private_43_integrity_acceptance.py --selftest
  private-acceptance:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate private-only original indexes and sparse-checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private104"
          git -C "$RUNNER_TEMP/private104" sparse-checkout set \
            gamepulse/catalog gamepulse/fusion/index \
            gamepulse/fusion/tracking_onoff gamepulse/fusion/official_pbp_timing \
            gamepulse/fusion/onoff gamepulse/fusion/qa
          test -f "$RUNNER_TEMP/private104/gamepulse/fusion/status.json"
          # Fetch source-native validator from the same private canonical repo.
          # SHA-pin the Git blob before executing any private source checking.
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          url="repos/timeedmonds-maker/104/contents/gamepulse/fusion/season_possession_tracking_crosswalk_2026.py?ref=main"
          response=json.loads(subprocess.check_output(["gh","api",url]))
          blob=base64.b64decode(response["content"])
          git_blob_sha=hashlib.sha1(b"blob "+str(len(blob)).encode()+b"\0"+blob).hexdigest()
          assert git_blob_sha==response["sha"],"PRIVATE_CROSSWALK_SOURCE_GIT_BLOB_SHA_INVALID"
          dest=Path(os.environ["RUNNER_TEMP"])/"private104/gamepulse/fusion/season_possession_tracking_crosswalk_2026.py"
          dest.write_bytes(blob)
          print("PRIVATE_CANONICAL_CROSSWALK_VALIDATOR_SHA_VERIFIED")
          PY
          echo 'PRIVATE_FORTY_THREE_ORIGINAL_INDEX_INPUT_AVAILABLE'
      - name: Independently check every indexed game and private evidence SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/gamepulse_private_43_integrity_acceptance.py \
            --root "$RUNNER_TEMP/private104"
      - name: Publish acceptance report only to private 104 without source observations
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private104"
          git config user.name 'Game Pulse Free CPU QA'
          git config user.email 'gamepulse-integrity@users.noreply.github.com'
          git add gamepulse/fusion/qa/season43_integrity_acceptance.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'PRIVATE_SOURCE_INTEGRITY_ALREADY_ACCEPTED'
            exit 0
          fi
          git commit -qm 'qa(gamepulse): 43-game source-index SHA acceptance; no physical possession certification'
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo 'PRIVATE_43_SOURCE_INDEX_ACCEPTANCE_PUBLISHED'
              exit 0
            fi
            git fetch -q origin main
            git rebase -q origin/main || { echo 'PRIVATE_SOURCE_INTEGRITY_REBASE_CONFLICT'; exit 4; }
          done
          echo 'PRIVATE_SOURCE_INTEGRITY_PUSH_BLOCKED'
          exit 5
