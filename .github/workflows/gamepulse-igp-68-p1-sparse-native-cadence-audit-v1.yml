# Fixed 68 cohort, three source-poor games, immutable licensed NBA source.
name: IGP 68 P1 three-game native cadence QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-68-p1-sparse-native-cadence-audit-v1.yml']
permissions: {contents: read}
concurrency:
  group: igp68-p1-native-cadence-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-68-live-gap-census-20261030
      PINNED_PRIVATE_SHA: dd6b063879f9e813d36987423ee1a17a82752b97
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public runner and pin exact private source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
      - name: Test and audit three real NBA games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_68_p1_sparse_native_cadence_audit_v1.py'
          python3 gamepulse/fusion/igp_68_p1_sparse_native_cadence_audit_v1.py \
            --root . --output "$RUNNER_TEMP/igp-native-cadence.json" \
            > "$RUNNER_TEMP/cadence-private.log" 2>&1 || {
              echo IGP68_P1_CADENCE_SOURCE_QA_FAILED_PRIVATE_DIAGNOSTIC
              exit 41
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'igp-native-cadence.json').read_text())
          expected={"0022600006":(3904,3639,15832,6798),
                    "0022600111":(4040,3486,14812,6544),
                    "0022600086":(4776,4421,13824,8184)}
          assert len(q["game_data"])==3
          for gid,(n,complete_n,g,complete_g) in expected.items():
            v=q["game_data"][gid]
            c=v["counts"]
            assert (c["native_frames"],c["native_1200_complete"],
                    c["grid_samples"],c["grid_1200_complete"])==(n,complete_n,g,complete_g)
            assert v["original_13_archive_part_sha256_index_count"]==13
            assert q["actual_original_native_source_chunks_sha_verified"]
          print("P1_THREE_GAME_NATIVE_CADENCE_QA_PASSED",json.dumps({
            gid:{"grid":v["counts"]["grid_samples"],
                 "complete":v["counts"]["grid_1200_complete"],
                 "native_gap_p95_ms":v["source_global_native_timestamp_gap_ms"]["p95"],
                 "source_bracket_within_1200":v["counts"].get("native_support_NATIVE_BRACKET_WITHIN_1200MS",0),
                 "original_distinct_raw_variants":v["original_raw_same_UTC_distinct_variants"]}
            for gid,v in q["game_data"].items()},sort_keys=True))
          PY
      - name: Commit private SHA-backed cadence receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          receipt=gamepulse/fusion/qa/igp_progress_20261030/igp_68_p1_threegame_native_cadence_audit_v1.json
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B p1-native-cadence "origin/$BRANCH"
          cp "$RUNNER_TEMP/igp-native-cadence.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): retain native cadence root cause receipt for three sparse games'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP68_P1_THREE_GAME_CADENCE_RECEIPT_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
