name: Ingest YouTube w-Xa7phLRx0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-youtube-w-xa7phlrx0.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  VIDEO_ID: w-Xa7phLRx0
  SOURCE_URL: https://youtu.be/w-Xa7phLRx0
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl >/dev/null

      - name: Start self-hosted Cobalt extraction stack
        shell: bash
        run: |
          set -euo pipefail
          docker network create hoopvision-cobalt >/dev/null 2>&1 || true

          docker pull ghcr.io/imputnet/yt-session-generator:webserver
          docker pull ghcr.io/imputnet/cobalt:11

          docker run -d --rm             --name hv-yt-session             --network hoopvision-cobalt             ghcr.io/imputnet/yt-session-generator:webserver

          for i in $(seq 1 90); do
            if docker run --rm --network hoopvision-cobalt curlimages/curl:8.12.1               -fsS http://hv-yt-session:8080/token > /tmp/youtube_session.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          test -s /tmp/youtube_session.json
          jq -e '.po_token // .poToken // .visitor_data // .visitorData' /tmp/youtube_session.json >/dev/null

          docker run -d --rm             --name hv-cobalt             --network hoopvision-cobalt             -p 127.0.0.1:9000:9000             -e API_URL=http://127.0.0.1:9000/             -e YOUTUBE_SESSION_SERVER=http://hv-yt-session:8080/token             -e FORCE_LOCAL_PROCESSING=never             ghcr.io/imputnet/cobalt:11

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/ > /tmp/cobalt_info.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/cobalt_info.json
          jq -e '.cobalt.version' /tmp/cobalt_info.json >/dev/null
          docker logs hv-cobalt 2>&1 | tail -n 120

      - name: Resolve and download exact requested video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ingest
          cat > ingest/request.json <<JSON
          {
            "url": "$SOURCE_URL",
            "videoQuality": "max",
            "downloadMode": "auto",
            "filenameStyle": "basic",
            "youtubeVideoCodec": "h264",
            "youtubeVideoContainer": "mp4",
            "disableMetadata": true
          }
          JSON

          HTTP_CODE="$(curl -sS -o ingest/cobalt_response.json -w '%{http_code}'             -H 'Accept: application/json'             -H 'Content-Type: application/json'             --data-binary @ingest/request.json             http://127.0.0.1:9000/)"
          echo "COBALT_HTTP=$HTTP_CODE"
          cat ingest/cobalt_response.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300

          STATUS="$(jq -r '.status // empty' ingest/cobalt_response.json)"
          echo "COBALT_STATUS=$STATUS"

          case "$STATUS" in
            tunnel|redirect)
              URL="$(jq -r '.url' ingest/cobalt_response.json)"
              test -n "$URL"
              curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors                 "$URL" -o ingest/source_download
              ;;
            local-processing)
              TYPE="$(jq -r '.type' ingest/cobalt_response.json)"
              COUNT="$(jq '.tunnel | length' ingest/cobalt_response.json)"
              echo "COBALT_LOCAL_TYPE=$TYPE TUNNELS=$COUNT"
              if [ "$TYPE" = "merge" ] && [ "$COUNT" -ge 2 ]; then
                VURL="$(jq -r '.tunnel[0]' ingest/cobalt_response.json)"
                AURL="$(jq -r '.tunnel[1]' ingest/cobalt_response.json)"
                curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$VURL" -o ingest/video.part
                curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$AURL" -o ingest/audio.part
                ffmpeg -y -v error -i ingest/video.part -i ingest/audio.part                   -map 0:v:0 -map 1:a:0? -c copy -movflags +faststart ingest/source_native.mp4
              elif [ "$COUNT" -ge 1 ]; then
                URL="$(jq -r '.tunnel[0]' ingest/cobalt_response.json)"
                curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors                   "$URL" -o ingest/source_download
              else
                echo "Unsupported Cobalt local-processing response" >&2
                exit 3
              fi
              ;;
            error)
              docker logs hv-cobalt 2>&1 | tail -n 220
              echo "Cobalt returned an error" >&2
              exit 4
              ;;
            *)
              docker logs hv-cobalt 2>&1 | tail -n 220
              echo "Unexpected Cobalt status: $STATUS" >&2
              exit 5
              ;;
          esac

          if [ ! -s ingest/source_native.mp4 ]; then
            test -s ingest/source_download
            ffmpeg -y -v error -i ingest/source_download -map 0:v:0 -map 0:a:0?               -c copy -movflags +faststart ingest/source_native.mp4
          fi

          test -s ingest/source_native.mp4
          ffprobe -v error             -show_entries format=duration,size,format_name,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,pix_fmt             -of json ingest/source_native.mp4 > ingest/ffprobe.json
          sha256sum ingest/source_native.mp4 | awk '{print $1}' > ingest/sha256.txt
          wc -c < ingest/source_native.mp4 | tr -d ' ' > ingest/size_bytes.txt

          cat ingest/ffprobe.json
          echo "HOOPVISION_YT_SHA256=$(cat ingest/sha256.txt)"
          echo "HOOPVISION_YT_SIZE=$(cat ingest/size_bytes.txt)"

      - name: Build immutable source manifest
        shell: bash
        run: |
          set -euo pipefail
          export CONTENT_SHA256="$(cat ingest/sha256.txt)"
          export SIZE_BYTES="$(cat ingest/size_bytes.txt)"
          export GCS_URI="gs://$BUCKET/fixtures/youtube/$VIDEO_ID/$CONTENT_SHA256/source_native.mp4"
          python3 - <<'PY'
          import json, os, pathlib
          probe = json.load(open("ingest/ffprobe.json"))
          cobalt_info = json.load(open("/tmp/cobalt_info.json"))
          cobalt_response = json.load(open("ingest/cobalt_response.json"))
          manifest = {
              "schema": "hoopvision.source_fixture.v1",
              "source_kind": "youtube",
              "video_id": os.environ["VIDEO_ID"],
              "requested_url": os.environ["SOURCE_URL"],
              "content_sha256": os.environ["CONTENT_SHA256"],
              "size_bytes": int(os.environ["SIZE_BYTES"]),
              "gcs_uri": os.environ["GCS_URI"],
              "ffprobe": probe,
              "acquisition": {
                  "engine": "self-hosted-cobalt",
                  "cobalt_version": cobalt_info.get("cobalt", {}).get("version"),
                  "cobalt_git": cobalt_info.get("git", {}),
                  "response_status": cobalt_response.get("status"),
                  "session_generator": "ghcr.io/imputnet/yt-session-generator:webserver",
              },
              "runner_repository": os.environ["GITHUB_REPOSITORY"],
              "runner_sha": os.environ["GITHUB_SHA"],
              "runner_run_id": os.environ["GITHUB_RUN_ID"],
          }
          pathlib.Path("ingest/source_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Publish immutable fixture
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cat ingest/sha256.txt)"
          PREFIX="fixtures/youtube/$VIDEO_ID/$SHA"
          gcloud storage cp ingest/source_native.mp4 "gs://$BUCKET/$PREFIX/source_native.mp4"
          gcloud storage cp ingest/ffprobe.json "gs://$BUCKET/$PREFIX/ffprobe.json"
          gcloud storage cp ingest/cobalt_response.json "gs://$BUCKET/$PREFIX/cobalt_response.json"
          gcloud storage cp ingest/source_manifest.json "gs://$BUCKET/$PREFIX/source_manifest.json"
          gcloud storage ls -l "gs://$BUCKET/$PREFIX/**"

      - uses: actions/upload-artifact@v4
        with:
          name: youtube-w-Xa7phLRx0-source-manifest
          path: |
            ingest/source_manifest.json
            ingest/cobalt_response.json
            ingest/ffprobe.json
            ingest/sha256.txt
            ingest/size_bytes.txt
          retention-days: 14

      - name: Cleanup extraction stack
        if: always()
        run: |
          docker rm -f hv-cobalt hv-yt-session >/dev/null 2>&1 || true
          docker network rm hoopvision-cobalt >/dev/null 2>&1 || true
