name: Ingest YouTube w-Xa7phLRx0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-youtube-w-xa7phlrx0.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  VIDEO_ID: w-Xa7phLRx0
  SOURCE_URL: https://youtu.be/w-Xa7phLRx0
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl >/dev/null

      - name: Resolve exact requested video across public extraction backends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ingest
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse

          video_id=os.environ["VIDEO_ID"]
          probe=[]

          piped=[
            "https://pipedapi.kavin.rocks",
            "https://pipedapi-libre.kavin.rocks",
            "https://pipedapi.leptons.xyz",
            "https://piped-api.privacy.com.de",
            "https://pipedapi.adminforge.de",
            "https://api.piped.yt",
            "https://pipedapi.drgns.space",
            "https://pipedapi.owo.si",
            "https://pipedapi.ducks.party",
            "https://piped-api.codespace.cz",
            "https://pipedapi.reallyaweso.me",
            "https://api.piped.private.coffee",
            "https://pipedapi.darkness.services",
            "https://pipedapi.orangenet.cc",
          ]
          invidious=[
            "https://inv.nadeko.net",
            "https://invidious.nerdvpn.de",
            "https://yt.chocolatemoo53.com",
            "https://invidious.tiekoetter.com",
          ]

          def curl_json(url):
              p=subprocess.run([
                  "curl","-L","-A","Mozilla/5.0 HoopVision/1.0",
                  "--connect-timeout","7","--max-time","25",
                  "-sS","-w","\\n__HTTP__%{http_code}",
                  url
              ],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              out=p.stdout
              code="000"
              body=out
              if "\n__HTTP__" in out:
                  body,code=out.rsplit("\n__HTTP__",1)
                  code=code.strip()
              return p.returncode,code,body,p.stderr.strip()

          def height(v):
              x=v.get("height")
              if isinstance(x,(int,float)): return int(x)
              for key in ("quality","qualityLabel","resolution"):
                  m=re.search(r"(\\d{3,4})",str(v.get(key,"")))
                  if m: return int(m.group(1))
              return 0

          def fps(v):
              try: return int(v.get("fps") or 0)
              except: return 0

          def bitrate(v):
              try: return int(v.get("bitrate") or 0)
              except: return 0

          def is_h264(v):
              s=" ".join(str(v.get(k,"")) for k in ("codec","format","mimeType","type","container","encoding")).lower()
              return any(x in s for x in ("h264","avc1","video/mp4","mp4"))

          def is_mp4_audio(a):
              s=" ".join(str(a.get(k,"")) for k in ("codec","format","mimeType","type","container","encoding")).lower()
              return any(x in s for x in ("mp4a","audio/mp4","m4a","mp4"))

          plan=None

          for base in piped:
              rc,code,body,err=curl_json(f"{base}/streams/{video_id}")
              probe.append({"provider":"piped","base":base,"http":code,"curl_rc":rc,"stderr":err[-300:]})
              if rc or code!="200":
                  continue
              try: d=json.loads(body)
              except: continue
              vids=[v for v in (d.get("videoStreams") or []) if v.get("url")]
              auds=[a for a in (d.get("audioStreams") or []) if a.get("url")]
              if not d.get("title") or not vids or not auds:
                  continue
              preferred=[v for v in vids if is_h264(v)]
              v=max(preferred or vids,key=lambda x:(height(x),fps(x),bitrate(x)))
              preferred_a=[a for a in auds if is_mp4_audio(a)]
              a=max(preferred_a or auds,key=bitrate)
              plan={
                  "provider":"piped","base":base,"mode":"merge",
                  "title":d.get("title"),"duration":d.get("duration"),"uploader":d.get("uploader"),
                  "video_url":v["url"],"audio_url":a["url"],
                  "video_meta":{k:v.get(k) for k in ("quality","format","codec","height","width","fps","bitrate","videoOnly")},
                  "audio_meta":{k:a.get(k) for k in ("quality","format","codec","bitrate","audioTrackId","audioTrackName","audioTrackLocale")},
              }
              open("ingest/provider_response.json","w").write(json.dumps(d))
              break

          if plan is None:
              for base in invidious:
                  url=f"{base}/api/v1/videos/{video_id}?local=true"
                  rc,code,body,err=curl_json(url)
                  probe.append({"provider":"invidious","base":base,"http":code,"curl_rc":rc,"stderr":err[-300:]})
                  if rc or code!="200":
                      continue
                  try: d=json.loads(body)
                  except: continue
                  if d.get("videoId") != video_id or not d.get("title"):
                      continue

                  adaptive=[x for x in (d.get("adaptiveFormats") or []) if x.get("url")]
                  vids=[x for x in adaptive if str(x.get("type","")).lower().startswith("video/")]
                  auds=[x for x in adaptive if str(x.get("type","")).lower().startswith("audio/")]
                  if vids and auds:
                      preferred=[v for v in vids if is_h264(v)]
                      v=max(preferred or vids,key=lambda x:(height(x),fps(x),bitrate(x)))
                      preferred_a=[a for a in auds if is_mp4_audio(a)]
                      a=max(preferred_a or auds,key=bitrate)
                      plan={
                          "provider":"invidious","base":base,"mode":"merge",
                          "title":d.get("title"),"duration":d.get("lengthSeconds"),"uploader":d.get("author"),
                          "video_url":urllib.parse.urljoin(base,v["url"]),
                          "audio_url":urllib.parse.urljoin(base,a["url"]),
                          "video_meta":{k:v.get(k) for k in ("qualityLabel","resolution","container","encoding","fps","bitrate","itag","type")},
                          "audio_meta":{k:a.get(k) for k in ("audioQuality","audioSampleRate","audioChannels","container","encoding","bitrate","itag","type")},
                      }
                  else:
                      combined=[x for x in (d.get("formatStreams") or []) if x.get("url")]
                      mp4=[x for x in combined if "mp4" in (" ".join(str(x.get(k,"")) for k in ("type","container","encoding"))).lower()]
                      if combined:
                          v=max(mp4 or combined,key=lambda x:(height(x),bitrate(x)))
                          plan={
                              "provider":"invidious","base":base,"mode":"single",
                              "title":d.get("title"),"duration":d.get("lengthSeconds"),"uploader":d.get("author"),
                              "single_url":urllib.parse.urljoin(base,v["url"]),
                              "video_meta":{k:v.get(k) for k in ("quality","qualityLabel","resolution","container","encoding","bitrate","itag","type")},
                          }
                  if plan:
                      open("ingest/provider_response.json","w").write(json.dumps(d))
                      break

          open("ingest/probe.json","w").write(json.dumps(probe,indent=2,sort_keys=True)+"\n")
          if plan is None:
              print(json.dumps(probe,indent=2))
              raise SystemExit("no public backend resolved exact requested video")

          open("ingest/download_plan.json","w").write(json.dumps(plan,indent=2,sort_keys=True)+"\n")
          safe={k:v for k,v in plan.items() if not k.endswith("_url")}
          print("RESOLVED",json.dumps(safe,indent=2,sort_keys=True))
          PY

      - name: Download candidate and require decodable media
        shell: bash
        run: |
          set -euo pipefail
          MODE="$(jq -r '.mode' ingest/download_plan.json)"
          PROVIDER="$(jq -r '.provider' ingest/download_plan.json)"
          BASE="$(jq -r '.base' ingest/download_plan.json)"
          echo "DOWNLOADING provider=$PROVIDER base=$BASE mode=$MODE"

          if [ "$MODE" = "merge" ]; then
            VURL="$(jq -r '.video_url' ingest/download_plan.json)"
            AURL="$(jq -r '.audio_url' ingest/download_plan.json)"
            curl -L --fail --connect-timeout 10 --max-time 1200               --retry 5 --retry-delay 2 --retry-all-errors               -A 'Mozilla/5.0 HoopVision/1.0' "$VURL" -o ingest/video.part
            curl -L --fail --connect-timeout 10 --max-time 1200               --retry 5 --retry-delay 2 --retry-all-errors               -A 'Mozilla/5.0 HoopVision/1.0' "$AURL" -o ingest/audio.part
            test -s ingest/video.part
            test -s ingest/audio.part
            ffmpeg -y -v error -i ingest/video.part -i ingest/audio.part               -map 0:v:0 -map 1:a:0? -c copy -movflags +faststart ingest/source_native.mp4
          else
            URL="$(jq -r '.single_url' ingest/download_plan.json)"
            curl -L --fail --connect-timeout 10 --max-time 1200               --retry 5 --retry-delay 2 --retry-all-errors               -A 'Mozilla/5.0 HoopVision/1.0' "$URL" -o ingest/source_download
            ffmpeg -y -v error -i ingest/source_download               -map 0:v:0 -map 0:a:0? -c copy -movflags +faststart ingest/source_native.mp4
          fi

          test -s ingest/source_native.mp4
          ffprobe -v error             -show_entries format=duration,size,format_name,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,pix_fmt             -of json ingest/source_native.mp4 > ingest/ffprobe.json

          jq -e '[.streams[] | select(.codec_type=="video")] | length >= 1' ingest/ffprobe.json >/dev/null
          DURATION="$(jq -r '.format.duration | tonumber' ingest/ffprobe.json)"
          python3 - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert d > 1.0, d
          PY

          sha256sum ingest/source_native.mp4 | awk '{print $1}' > ingest/sha256.txt
          wc -c < ingest/source_native.mp4 | tr -d ' ' > ingest/size_bytes.txt
          cat ingest/ffprobe.json
          echo "HOOPVISION_YT_SHA256=$(cat ingest/sha256.txt)"
          echo "HOOPVISION_YT_SIZE=$(cat ingest/size_bytes.txt)"

      - name: Build immutable source manifest
        shell: bash
        run: |
          set -euo pipefail
          export CONTENT_SHA256="$(cat ingest/sha256.txt)"
          export SIZE_BYTES="$(cat ingest/size_bytes.txt)"
          export GCS_URI="gs://$BUCKET/fixtures/youtube/$VIDEO_ID/$CONTENT_SHA256/source_native.mp4"
          python3 - <<'PY'
          import json, os, pathlib
          plan=json.load(open("ingest/download_plan.json"))
          safe_plan={k:v for k,v in plan.items() if not k.endswith("_url")}
          manifest={
              "schema":"hoopvision.source_fixture.v1",
              "source_kind":"youtube",
              "video_id":os.environ["VIDEO_ID"],
              "requested_url":os.environ["SOURCE_URL"],
              "content_sha256":os.environ["CONTENT_SHA256"],
              "size_bytes":int(os.environ["SIZE_BYTES"]),
              "gcs_uri":os.environ["GCS_URI"],
              "ffprobe":json.load(open("ingest/ffprobe.json")),
              "acquisition":safe_plan,
              "runner_repository":os.environ["GITHUB_REPOSITORY"],
              "runner_sha":os.environ["GITHUB_SHA"],
              "runner_run_id":os.environ["GITHUB_RUN_ID"],
          }
          pathlib.Path("ingest/source_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY

      - name: Publish immutable fixture
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cat ingest/sha256.txt)"
          PREFIX="fixtures/youtube/$VIDEO_ID/$SHA"
          gcloud storage cp ingest/source_native.mp4 "gs://$BUCKET/$PREFIX/source_native.mp4"
          gcloud storage cp ingest/ffprobe.json "gs://$BUCKET/$PREFIX/ffprobe.json"
          gcloud storage cp ingest/download_plan.json "gs://$BUCKET/$PREFIX/download_plan.json"
          gcloud storage cp ingest/probe.json "gs://$BUCKET/$PREFIX/probe.json"
          gcloud storage cp ingest/source_manifest.json "gs://$BUCKET/$PREFIX/source_manifest.json"
          gcloud storage ls -l "gs://$BUCKET/$PREFIX/**"

      - uses: actions/upload-artifact@v4
        with:
          name: youtube-w-Xa7phLRx0-source-manifest
          path: |
            ingest/source_manifest.json
            ingest/download_plan.json
            ingest/probe.json
            ingest/ffprobe.json
            ingest/sha256.txt
            ingest/size_bytes.txt
          retention-days: 14
