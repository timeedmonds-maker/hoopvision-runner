name: Ingest YouTube w-Xa7phLRx0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-youtube-w-xa7phlrx0.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  VIDEO_ID: w-Xa7phLRx0
  SOURCE_URL: https://youtu.be/w-Xa7phLRx0
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install local validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Extract from fresh GCP CPU origin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ingest
          VM="hv-yt-${GITHUB_RUN_ID}"
          ZONES=(asia-southeast1-b asia-southeast1-a asia-southeast1-c)
          ACTIVE_ZONE=""

          cleanup() {
            if [ -n "$ACTIVE_ZONE" ]; then
              gcloud compute instances delete "$VM" \
                --project="$PROJECT_ID" --zone="$ACTIVE_ZONE" --quiet >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          success=0
          for ZONE in "${ZONES[@]}"; do
            echo "=== CREATING FRESH CPU EXTRACTION ORIGIN IN $ZONE ==="
            ACTIVE_ZONE="$ZONE"
            set +e
            gcloud compute instances create "$VM" \
              --project="$PROJECT_ID" \
              --zone="$ZONE" \
              --machine-type=e2-micro \
              --image-family=ubuntu-2404-lts-amd64 \
              --image-project=ubuntu-os-cloud \
              --boot-disk-size=10GB \
              --boot-disk-type=pd-balanced \
              --network=default \
              --no-service-account \
              --no-scopes \
              --quiet
            CREATE_RC=$?
            set -e
            if [ "$CREATE_RC" -ne 0 ]; then
              echo "VM creation failed in $ZONE rc=$CREATE_RC"
              ACTIVE_ZONE=""
              continue
            fi

            ready=0
            for i in $(seq 1 36); do
              if gcloud compute ssh "$VM" \
                --project="$PROJECT_ID" --zone="$ZONE" --quiet \
                --command='echo SSH_READY' >/tmp/ssh-ready.txt 2>/tmp/ssh-ready.err; then
                cat /tmp/ssh-ready.txt
                ready=1
                break
              fi
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              cat /tmp/ssh-ready.err || true
              gcloud compute instances delete "$VM" --project="$PROJECT_ID" --zone="$ZONE" --quiet || true
              ACTIVE_ZONE=""
              continue
            fi

            set +e
            gcloud compute ssh "$VM" \
              --project="$PROJECT_ID" --zone="$ZONE" --quiet \
              --command="set -euo pipefail
                sudo apt-get update -qq
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg curl nodejs >/dev/null
                sudo curl -fL --retry 3 --silent --show-error \
                  https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
                  -o /usr/local/bin/yt-dlp
                sudo chmod 0755 /usr/local/bin/yt-dlp
                rm -rf /tmp/hoopvision-youtube
                mkdir -p /tmp/hoopvision-youtube
                cd /tmp/hoopvision-youtube
                ok=0
                for CLIENT in tv android_vr web_embedded; do
                  rm -f source_native.*
                  echo ==== GCP CLIENT: \$CLIENT ====
                  if /usr/local/bin/yt-dlp --verbose --js-runtimes node \
                    --extractor-args youtube:player_client=\$CLIENT \
                    --no-playlist --write-info-json \
                    --retries 3 --fragment-retries 3 --concurrent-fragments 4 \
                    --merge-output-format mp4 --remux-video mp4 \
                    -f 'bv*+ba/b' -o 'source_native.%(ext)s' '$SOURCE_URL'; then
                    test -s source_native.mp4
                    ok=1
                    break
                  fi
                done
                test \$ok -eq 1"
            REMOTE_RC=$?
            set -e

            if [ "$REMOTE_RC" -eq 0 ]; then
              gcloud compute scp "$VM:/tmp/hoopvision-youtube/source_native.mp4" ingest/source_native.mp4 \
                --project="$PROJECT_ID" --zone="$ZONE" --quiet
              gcloud compute scp "$VM:/tmp/hoopvision-youtube/source_native.info.json" ingest/yt_dlp.info.json \
                --project="$PROJECT_ID" --zone="$ZONE" --quiet
              success=1
              break
            fi

            echo "Extraction failed from fresh origin in $ZONE rc=$REMOTE_RC"
            gcloud compute instances delete "$VM" --project="$PROJECT_ID" --zone="$ZONE" --quiet || true
            ACTIVE_ZONE=""
          done

          test "$success" -eq 1
          test -s ingest/source_native.mp4
          test -s ingest/yt_dlp.info.json

          ffprobe -v error \
            -show_entries format=duration,size,format_name,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,pix_fmt \
            -of json ingest/source_native.mp4 > ingest/ffprobe.json
          sha256sum ingest/source_native.mp4 | awk '{print $1}' > ingest/sha256.txt
          wc -c < ingest/source_native.mp4 | tr -d ' ' > ingest/size_bytes.txt
          cat ingest/ffprobe.json
          echo "sha256=$(cat ingest/sha256.txt)"
          echo "size_bytes=$(cat ingest/size_bytes.txt)"

      - name: Build immutable source manifest
        shell: bash
        run: |
          set -euo pipefail
          cd ingest
          export CONTENT_SHA256="$(cat sha256.txt)"
          export SIZE_BYTES="$(cat size_bytes.txt)"
          export GCS_URI="gs://$BUCKET/fixtures/youtube/$VIDEO_ID/$CONTENT_SHA256/source_native.mp4"
          python3 - <<'PY'
          import json, os, pathlib
          info = json.load(open("yt_dlp.info.json"))
          probe = json.load(open("ffprobe.json"))
          keep = {
              "id": info.get("id"),
              "title": info.get("title"),
              "uploader": info.get("uploader"),
              "channel": info.get("channel"),
              "upload_date": info.get("upload_date"),
              "duration": info.get("duration"),
              "webpage_url": info.get("webpage_url"),
              "original_url": info.get("original_url"),
          }
          manifest = {
              "schema": "hoopvision.source_fixture.v1",
              "source_kind": "youtube",
              "video_id": os.environ["VIDEO_ID"],
              "requested_url": os.environ["SOURCE_URL"],
              "content_sha256": os.environ["CONTENT_SHA256"],
              "size_bytes": int(os.environ["SIZE_BYTES"]),
              "gcs_uri": os.environ["GCS_URI"],
              "yt_dlp": keep,
              "ffprobe": probe,
              "runner_repository": os.environ["GITHUB_REPOSITORY"],
              "runner_sha": os.environ["GITHUB_SHA"],
              "runner_run_id": os.environ["GITHUB_RUN_ID"],
          }
          pathlib.Path("source_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Publish immutable source fixture
        shell: bash
        run: |
          set -euo pipefail
          cd ingest
          SHA="$(cat sha256.txt)"
          PREFIX="fixtures/youtube/$VIDEO_ID/$SHA"
          gcloud storage cp source_native.mp4 "gs://$BUCKET/$PREFIX/source_native.mp4"
          gcloud storage cp ffprobe.json "gs://$BUCKET/$PREFIX/ffprobe.json"
          gcloud storage cp yt_dlp.info.json "gs://$BUCKET/$PREFIX/yt_dlp.info.json"
          gcloud storage cp source_manifest.json "gs://$BUCKET/$PREFIX/source_manifest.json"
          gcloud storage ls -l "gs://$BUCKET/$PREFIX/**"

      - uses: actions/upload-artifact@v4
        with:
          name: youtube-w-Xa7phLRx0-source
          path: |
            ingest/source_native.mp4
            ingest/source_manifest.json
            ingest/ffprobe.json
            ingest/yt_dlp.info.json
            ingest/sha256.txt
          compression-level: 0
          retention-days: 7
