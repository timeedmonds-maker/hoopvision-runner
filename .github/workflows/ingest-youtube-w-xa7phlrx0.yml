name: Ingest YouTube w-Xa7phLRx0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-youtube-w-xa7phlrx0.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d88c48c6-7f48-4c33-928
  BUCKET: project-d88c48c6-7f48-4c33-928-hoopvision-dev
  VIDEO_ID: w-Xa7phLRx0
  SOURCE_URL: https://youtu.be/w-Xa7phLRx0
  WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-hoopvision-runner
  DEV_PUBLISH_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_PUBLISH_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl >/dev/null

      - name: Resolve exact video through public Piped backends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ingest
          INSTANCES=(
            "https://pipedapi.kavin.rocks"
            "https://pipedapi.leptons.xyz"
            "https://pipedapi.nosebs.ru"
            "https://piped-api.privacy.com.de"
            "https://pipedapi.adminforge.de"
            "https://api.piped.yt"
            "https://pipedapi.drgns.space"
            "https://pipedapi.owo.si"
            "https://pipedapi.ducks.party"
            "https://piped-api.codespace.cz"
            "https://pipedapi.reallyaweso.me"
            "https://api.piped.private.coffee"
            "https://pipedapi.darkness.services"
            "https://pipedapi.orangenet.cc"
          )

          : > ingest/probe.log
          FOUND=""
          for BASE in "${INSTANCES[@]}"; do
            echo "PROBE $BASE" | tee -a ingest/probe.log
            rm -f ingest/candidate.json
            CODE="$(curl -A 'Mozilla/5.0 HoopVision/1.0'               --connect-timeout 7 --max-time 20               -sS -o ingest/candidate.json -w '%{http_code}'               "$BASE/streams/$VIDEO_ID" || true)"
            echo "HTTP $CODE" | tee -a ingest/probe.log
            if [ "$CODE" != "200" ]; then
              continue
            fi
            if jq -e '
              (.title | type == "string" and length > 0) and
              (.videoStreams | type == "array" and length > 0) and
              (.audioStreams | type == "array" and length > 0)
            ' ingest/candidate.json >/dev/null 2>&1; then
              FOUND="$BASE"
              cp ingest/candidate.json ingest/piped_streams.json
              printf '%s\n' "$FOUND" > ingest/piped_instance.txt
              echo "SELECTED $FOUND" | tee -a ingest/probe.log
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "No Piped backend resolved $VIDEO_ID" >&2
            cat ingest/probe.log >&2
            exit 2
          fi

          python3 - <<'PY'
          import json, re
          d=json.load(open("ingest/piped_streams.json"))

          vids=d.get("videoStreams") or []
          auds=d.get("audioStreams") or []

          def height(v):
              h=v.get("height")
              if isinstance(h,(int,float)): return int(h)
              q=str(v.get("quality",""))
              m=re.search(r"(\d{3,4})",q)
              return int(m.group(1)) if m else 0

          def fps(v):
              try: return int(v.get("fps") or 0)
              except: return 0

          def is_h264(v):
              s=(" ".join(str(v.get(k,"")) for k in ("codec","format","mimeType"))).lower()
              return any(x in s for x in ("h264","avc1","mpeg_4","mp4"))

          def is_mp4a(a):
              s=(" ".join(str(a.get(k,"")) for k in ("codec","format","mimeType"))).lower()
              return any(x in s for x in ("mp4a","m4a","mpeg_4","mp4"))

          vpool=[v for v in vids if v.get("url")]
          h264=[v for v in vpool if is_h264(v)]
          if h264: vpool=h264
          v=max(vpool,key=lambda x:(height(x),fps(x),int(x.get("bitrate") or 0)))

          apool=[a for a in auds if a.get("url")]
          m4a=[a for a in apool if is_mp4a(a)]
          if m4a: apool=m4a
          a=max(apool,key=lambda x:int(x.get("bitrate") or 0))

          open("ingest/video_url.txt","w").write(v["url"])
          open("ingest/audio_url.txt","w").write(a["url"])
          selection={
              "title":d.get("title"),
              "duration":d.get("duration"),
              "uploader":d.get("uploader"),
              "video":{k:v.get(k) for k in ("quality","format","codec","height","width","fps","bitrate","videoOnly")},
              "audio":{k:a.get(k) for k in ("quality","format","codec","bitrate","audioTrackId","audioTrackName","audioTrackLocale")},
          }
          open("ingest/selection.json","w").write(json.dumps(selection,indent=2,sort_keys=True)+"\n")
          print(json.dumps(selection,indent=2,sort_keys=True))
          PY

      - name: Download and merge selected streams
        shell: bash
        run: |
          set -euo pipefail
          VURL="$(cat ingest/video_url.txt)"
          AURL="$(cat ingest/audio_url.txt)"

          curl --fail --location             --connect-timeout 10 --max-time 900             --retry 5 --retry-delay 2 --retry-all-errors             -A 'Mozilla/5.0 HoopVision/1.0'             "$VURL" -o ingest/video.part

          curl --fail --location             --connect-timeout 10 --max-time 900             --retry 5 --retry-delay 2 --retry-all-errors             -A 'Mozilla/5.0 HoopVision/1.0'             "$AURL" -o ingest/audio.part

          test -s ingest/video.part
          test -s ingest/audio.part

          ffmpeg -y -v error             -i ingest/video.part -i ingest/audio.part             -map 0:v:0 -map 1:a:0             -c copy -movflags +faststart ingest/source_native.mp4

          test -s ingest/source_native.mp4
          ffprobe -v error             -show_entries format=duration,size,format_name,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,pix_fmt             -of json ingest/source_native.mp4 > ingest/ffprobe.json

          VIDEO_COUNT="$(jq '[.streams[] | select(.codec_type=="video")] | length' ingest/ffprobe.json)"
          AUDIO_COUNT="$(jq '[.streams[] | select(.codec_type=="audio")] | length' ingest/ffprobe.json)"
          test "$VIDEO_COUNT" -ge 1
          test "$AUDIO_COUNT" -ge 1

          sha256sum ingest/source_native.mp4 | awk '{print $1}' > ingest/sha256.txt
          wc -c < ingest/source_native.mp4 | tr -d ' ' > ingest/size_bytes.txt

          cat ingest/ffprobe.json
          echo "HOOPVISION_YT_SHA256=$(cat ingest/sha256.txt)"
          echo "HOOPVISION_YT_SIZE=$(cat ingest/size_bytes.txt)"

      - name: Build immutable source manifest
        shell: bash
        run: |
          set -euo pipefail
          export CONTENT_SHA256="$(cat ingest/sha256.txt)"
          export SIZE_BYTES="$(cat ingest/size_bytes.txt)"
          export PIPED_INSTANCE="$(cat ingest/piped_instance.txt)"
          export GCS_URI="gs://$BUCKET/fixtures/youtube/$VIDEO_ID/$CONTENT_SHA256/source_native.mp4"
          python3 - <<'PY'
          import json, os, pathlib
          manifest = {
              "schema": "hoopvision.source_fixture.v1",
              "source_kind": "youtube",
              "video_id": os.environ["VIDEO_ID"],
              "requested_url": os.environ["SOURCE_URL"],
              "content_sha256": os.environ["CONTENT_SHA256"],
              "size_bytes": int(os.environ["SIZE_BYTES"]),
              "gcs_uri": os.environ["GCS_URI"],
              "ffprobe": json.load(open("ingest/ffprobe.json")),
              "selection": json.load(open("ingest/selection.json")),
              "acquisition": {
                  "engine": "piped-public-backend",
                  "instance": os.environ["PIPED_INSTANCE"],
                  "endpoint": "/streams/" + os.environ["VIDEO_ID"],
              },
              "runner_repository": os.environ["GITHUB_REPOSITORY"],
              "runner_sha": os.environ["GITHUB_SHA"],
              "runner_run_id": os.environ["GITHUB_RUN_ID"],
          }
          pathlib.Path("ingest/source_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Publish immutable fixture
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cat ingest/sha256.txt)"
          PREFIX="fixtures/youtube/$VIDEO_ID/$SHA"
          gcloud storage cp ingest/source_native.mp4 "gs://$BUCKET/$PREFIX/source_native.mp4"
          gcloud storage cp ingest/ffprobe.json "gs://$BUCKET/$PREFIX/ffprobe.json"
          gcloud storage cp ingest/piped_streams.json "gs://$BUCKET/$PREFIX/piped_streams.json"
          gcloud storage cp ingest/selection.json "gs://$BUCKET/$PREFIX/selection.json"
          gcloud storage cp ingest/source_manifest.json "gs://$BUCKET/$PREFIX/source_manifest.json"
          gcloud storage ls -l "gs://$BUCKET/$PREFIX/**"

      - uses: actions/upload-artifact@v4
        with:
          name: youtube-w-Xa7phLRx0-source-manifest
          path: |
            ingest/source_manifest.json
            ingest/selection.json
            ingest/ffprobe.json
            ingest/sha256.txt
            ingest/size_bytes.txt
            ingest/piped_instance.txt
            ingest/probe.log
          retention-days: 14
