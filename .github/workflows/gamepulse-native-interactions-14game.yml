name: Game Pulse source-native touch event fusion for all 14 games
# Respect NBA one-of-one technical FT scoring outside current possession owner.
# Public/free GitHub-hosted CPU; all SDK archives, individual player and
# possession records, coordinates, receipts and query outputs stay private 104.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-native-interactions-14game.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-gamepulse-14game-native-interaction-fusion
  cancel-in-progress: false
jobs:
  game-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        game:
          - '0022600001'
          - '0022600002'
          - '0022600003'
          - '0022600004'
          - '0022600005'
          - '0022600085'
          - '0022600086'
          - '0022600087'
          - '0022600088'
          - '0022600089'
          - '0022600090'
          - '0022600091'
          - '0022600092'
          - '0022600093'
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce no licensed material in the public GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_SOURCE_AUTH_MISSING'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch current private fusion code, official source and tests
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-fusion"
          mkdir -p "$ROOT"/{sdk,tests}
          for mod in gamepulse_ball_control.py gamepulse_ball_dynamics.py interaction_fusion_2026.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$mod?ref=main" --jq .content |
              base64 -d > "$ROOT/$mod"
          done
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_interaction_fusion_2026.py?ref=main' --jq .content |
            base64 -d > "$ROOT/tests/test_interaction_fusion_2026.py"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/official_pbp_timing/games/$GAME_ID.json?ref=main" --jq .content |
            base64 -d > "$ROOT/pbp.json"
          gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/$GAME_ID.json?ref=main" --jq .content |
            base64 -d > "$ROOT/view.json"
          python3 -m py_compile "$ROOT/gamepulse_ball_control.py" "$ROOT/gamepulse_ball_dynamics.py" "$ROOT/interaction_fusion_2026.py"
          PYTHONPATH="$ROOT" python3 -m unittest discover -s "$ROOT/tests" -p test_interaction_fusion_2026.py
      - name: Download only the original SHA-verified private game SDK parts
        id: archives
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-fusion"
          TAG="gamepulse-sdk-$GAME_ID"
          gh api "repos/timeedmonds-maker/104/releases/tags/$TAG" > "$ROOT/release.json"
          gh release download "$TAG" --repo timeedmonds-maker/104 \
            --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk" --clobber >/dev/null
          python3 - <<'PY'
          import os,hashlib,json,re
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"private-fusion"
          expected={a["name"]:a.get("digest") for a in json.loads((r/"release.json").read_text())["assets"]
                    if re.fullmatch(r"sdk-part-\d{2}\.tar\.gz",a["name"])}
          found=list((r/"sdk").glob("sdk-part-??.tar.gz"))
          assert len(expected)==len(found)==13,"SOURCE_13_PART_COVERAGE_FAILURE"
          for f in found:
              assert expected[f.name]=="sha256:"+hashlib.sha256(f.read_bytes()).hexdigest(),"SOURCE_SHA_FAILURE"
          print("PRIVATE_ORIGINAL_GAME_SOURCE_SHA_CONFIRMED")
          PY
      - name: Fuse full original native touches with NBA official action and Blueprint exact IDs
        id: fusion
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-fusion"
          cd "$ROOT"
          if [ "$GAME_ID" = '0022600091' ]; then
            QUERY_ARGS=(--query-players 201142,1627832,1630578)
          else
            QUERY_ARGS=()
          fi
          python3 interaction_fusion_2026.py --sdk-dir sdk --pbp pbp.json --view view.json \
            --out interactions.json "${QUERY_ARGS[@]}"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"private-fusion"
          x=json.loads((r/"interactions.json").read_text())
          assert x["schema"]=="gamepulse.interaction-event-possession-fusion.v1"
          assert x["reconciliation"]["nba_team_score_reconciled"] is True
          assert x["source_event_counts"]["native_unique_touch_labels"]>0
          assert all(not p["certified_complete_possession"] for p in x["possessions"])
          assert sum(x["teams"].values())==len(x["possessions"])
          assert set(x["teams"])=={v["team"] for v in x["official_final"].values()}
          print("PRIVATE_SOURCE_FUSION_ACCEPTED_NO_UNVERIFIED_CERTIFICATION")
          PY
      - name: Persist only to private canonical 104 with post-write SHA check
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"private-fusion"
          game=os.environ["GAME_ID"]
          data=(r/"interactions.json").read_bytes()
          target="repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/"+game+".json"
          old=subprocess.run(["gh","api",target],capture_output=True,text=True)
          payload={"branch":"main",
                   "message":"data(gamepulse): retain native-tracking/PBP/Blueprint fusion for game "+game,
                   "content":base64.b64encode(data).decode()}
          if old.returncode==0: payload["sha"]=json.loads(old.stdout)["sha"]
          elif "Not Found" not in old.stderr and "404" not in old.stderr:
              raise RuntimeError("PRIVATE_DESTINATION_READ_FAILED")
          put=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                             input=json.dumps(payload),capture_output=True,text=True)
          if put.returncode: raise RuntimeError("PRIVATE_DESTINATION_WRITE_FAILED")
          actual=base64.b64decode(subprocess.check_output(["gh","api",target,"--jq",".content"]))
          assert hashlib.sha256(data).digest()==hashlib.sha256(actual).digest()
          print("PRIVATE_FUSION_INDEX_SHA_VERIFIED")
          PY
      - name: Preserve private per-game execution receipt
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          JOB_RESULT: ${{ job.status }}
          SOURCE_STEP: ${{ steps.source.outcome }}
          ARCHIVE_STEP: ${{ steps.archives.outcome }}
          FUSION_STEP: ${{ steps.fusion.outcome }}
          PUBLISH_STEP: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then exit 0; fi
          python3 - <<'PY'
          import base64,json,os,subprocess
          gid=os.environ["GAME_ID"]
          status={"schema":"gamepulse.private-14game-fusion-stage-receipt.v1",
             "game_id":gid,"run_id":os.environ["RUN_ID"],
             "job_status":os.environ["JOB_RESULT"],
             "stages":{name:os.environ[name] for name in
               ("SOURCE_STEP","ARCHIVE_STEP","FUSION_STEP","PUBLISH_STEP")}}
          target="repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/status/"+gid+".json"
          old=subprocess.run(["gh","api",target],capture_output=True,text=True)
          payload={"branch":"main","message":"qa(gamepulse): record private source-fusion acceptance stages "+gid,
                   "content":base64.b64encode(json.dumps(status,sort_keys=True).encode()).decode()}
          if old.returncode==0:payload["sha"]=json.loads(old.stdout)["sha"]
          elif "Not Found" not in old.stderr and "404" not in old.stderr:
              raise RuntimeError("PRIVATE_ACCEPTANCE_RECEIPT_READ_FAILED")
          result=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                               input=json.dumps(payload),capture_output=True,text=True)
          if result.returncode:raise RuntimeError("PRIVATE_ACCEPTANCE_RECEIPT_WRITE_FAILED")
          print("PRIVATE_EXECUTION_STAGE_RECEIPT_RECORDED")
          PY
      - name: No data in public Actions outputs
        if: always()
        run: echo 'Only generic acceptance status is public; all source records remain private 104.' >> "$GITHUB_STEP_SUMMARY"
  aggregate:
    needs: [game-fusion]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - name: Check and publish private 14-game interaction search manifest
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 - <<'PY'
          import base64,hashlib,json,subprocess
          ids=("0022600001","0022600002","0022600003","0022600004","0022600005",
               "0022600085","0022600086","0022600087","0022600088","0022600089",
               "0022600090","0022600091","0022600092","0022600093")
          records={}
          for gid in ids:
              data=base64.b64decode(subprocess.check_output(["gh","api",
                  "repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/"+gid+".json",
                  "--jq",".content"]))
              report=json.loads(data)
              assert report["game_id"]==gid and report["reconciliation"]["nba_team_score_reconciled"]
              assert report["certified_touch_possessions"]==0
              records[gid]={"sha256":hashlib.sha256(data).hexdigest(),
                 "source_native_touch_labels":report["source_event_counts"]["native_unique_touch_labels"],
                 "team_action_runs":len(report["possessions"]),
                 "nba_scores_reconciled":True}
          assert len(records)==14
          manifest={"schema":"gamepulse.interaction-fusion-14game-index.v1",
             "game_count":len(records),"games":records,
             "status":"NATIVE_TOUCH_PBP_BLUEPRINT_CANDIDATES_14_GAMES",
             "certified_full_touch_possessions":0,
             "notice":"Source-native lastTouch histories and official NBA possession-team event runs are queryable; independent complete possession review pending."}
          target="repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/interactions/index.json"
          old=subprocess.run(["gh","api",target],capture_output=True,text=True)
          payload={"branch":"main","message":"data(gamepulse): index all 14 verified private native event fusion games",
                   "content":base64.b64encode((json.dumps(manifest,indent=2,sort_keys=True)+"\n").encode()).decode()}
          if old.returncode==0:payload["sha"]=json.loads(old.stdout)["sha"]
          elif "Not Found" not in old.stderr and "404" not in old.stderr:
              raise RuntimeError("PRIVATE_MANIFEST_READ_FAILED")
          res=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                             input=json.dumps(payload),capture_output=True,text=True)
          if res.returncode:raise RuntimeError("PRIVATE_MANIFEST_WRITE_FAILED")
          print("PRIVATE_14GAME_EVENT_FUSION_MANIFEST_SAVED")
          PY
